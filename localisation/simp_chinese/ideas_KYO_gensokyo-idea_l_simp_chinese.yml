 KYO_Let_start_war:"开启存亡之战"




  KYO_drug_backlash:0 "高昂的医药费"
  KYO_drug_backlash_desc:0 "永远亭能够救回许多原本必死的伤员，却无法凭空变出药材、器械与医护人员。随着战线延长，珍稀药材被优先送往军医院，工坊转而生产针剂和医疗设备，偏远村落则必须等待更久才能得到普通药物。\n\n前线依赖永琳的医术维持，后方却逐渐被沉重的医疗开支拖慢。没有人愿意放弃伤员，但每一张送入永远亭的病床，都在提醒我们：把人从死亡边缘带回来，从来不是一件廉价的事。"

  KYO_ritual_fatigue:0 "灵魂虚弱"
  KYO_ritual_fatigue_desc:0 "反复举行的招魂与安魂仪式正在扰乱生者与亡者之间的界线。主持仪式的人开始听见并不存在的呼唤，归来的幽灵也会突然忘记自己身在何处。有人在行军中失去方向，有人醒来以后，只记得一个早已无人居住的故乡。\n\n白玉楼已经缩短仪式时间，并强制安排休养，但灵魂的损伤无法像普通伤口那样包扎。在彻底恢复以前，无论征募、生产还是军事行动，都必须迁就这些逐渐疲惫的灵魂。"

  KYO_gap_leak:0 "永与妖的压迫"
  KYO_gap_leak_desc:0 "「永夜抄」的阴影与「妖妖梦」的寒潮同时压来，结界如薄纱般绷紧。间隙传出细微的嗡鸣：情报外渗、异闻内返，边界像被不可见的指尖按出裂纹。市镇谣语滋长，外界的目光被吸引；同盟迟疑，对手试探，阴影里的手越伸越长。八云紫冷冷下令：补缝。再补缝。代价自行承担。于是内部稳定动摇、占领地抗性拔高、政务消耗失衡——棋盘仍在，但每一步都比昨日更难落子。"





  KYO_Bamboo_Forest_Guerrillas_1:0 "竹林游击队"
KYO_Bamboo_Forest_Guerrillas_1_desc:0 "铃仙没有把迷途竹林当成一座天然陷阱。她先让每支小队学会辨认风向、断竹与地上兔留下的暗号，再把巡逻队拆成能够彼此掩护的两人小组。\n\n接敌以后只进行短暂射击，随后立刻换路；发现伤员便放弃追击，优先把同伴带回永远亭。敌人第一次进入竹林时，看到的只是不断移动的影子，而我军已经知道该从哪里出现，又该从哪里离开。"

KYO_Bamboo_Forest_Guerrillas_2:0 "竹林游击网"
KYO_Bamboo_Forest_Guerrillas_2_desc:0 "最初的游击小队已经沿竹林铺开。地上兔负责传递情报、隐藏弹药与维护小径，铃仙则利用波长扰动制造错误的脚步、枪声与灯火，让追兵不断扑向无人之处。\n\n每条进攻路线旁都保留一条撤退路线，每座隐蔽据点也能引导部队转往下一片竹林。游击队不再只是熟悉家乡的散兵，而是一张能够自行收缩、转移与重新集结的防卫网。"

KYO_Bamboo_Forest_Guerrillas_3:0 "迷途竹林防卫网"
KYO_Bamboo_Forest_Guerrillas_3_desc:0 "竹林中的小径、仓库、观察点与救护所已经连成完整体系。指挥部能够把任何一段竹径临时改为伏击区、运输线或撤离通道，附近部队也能在失去联络后自行前往预定位置。\n\n敌人面对的仍是一片看似相同的竹海；对铃仙的部队而言，每一道竹影都标示着下一步行动。迷途竹林终于不再依靠偶然使人迷失——它已经学会按照我们的意志改变道路。"

KYO_Prototype_Hourai_Regimen_1:0 "永琳药物试验"
KYO_Prototype_Hourai_Regimen_1_desc:0 "永琳从蓬莱药的原理中分离出几种能够控制的配方。它们不会使人不死，只用于提高恢复能力、缓解疲劳，并帮助受试者适应长时间夜战。\n\n所有参加者都必须接受检查、了解风险，也可以随时退出。即使如此，药材向军方集中仍引起了不安，偶尔出现的失眠、感官错乱与高热也让传闻迅速扩散。永琳没有隐瞒报告——她比任何人都清楚，能够使用一种药，并不等于应该无限制地使用它。"

KYO_Prototype_Hourai_Regimen_2:0 "战地药物计划"
KYO_Prototype_Hourai_Regimen_2_desc:0 "试验配方通过初步检验后，永远亭开始为夜战部队和特殊兵种建立独立用药方案。移动医疗队会根据体质调整剂量，出现异常便立即停药，不再让同一份处方适用于所有人。\n\n训练与整补因此明显加快，但扩大使用也占用了更多医护力量。普通患者等待得越来越久，军属则担忧亲人是否会在命令与自愿之间作出真正自由的选择。永琳拒绝掩盖这些质疑，因为医学若只剩下服从，就已经背离了治病的本意。"

KYO_Lunarian_Fragments_1:0 "八意式底层标准"
KYO_Lunarian_Fragments_1_desc:0 "永琳取出离开月都以前保存的旧图纸，首先要求工坊统一尺寸、计量方式与接口规格。过去只能由制作者本人维修的器械，如今可以更换来自另一座工坊的零件；药物与电子设备也必须经过可以重复验证的检查。\n\n她没有直接交出某件足以改变战争的月面兵器，而是教会幻想乡如何稳定地制造下一件。真正珍贵的并非图纸上的成品，而是让知识能够被理解、复制与继续改进的方法。"

KYO_Lunarian_Fragments_2:0 "八意式通用标准"
KYO_Lunarian_Fragments_2_desc:0 "八意式标准已经从永远亭扩展到河童工坊、军需仓库与研究机构。不同地区制造的零件可以互换，实验结果能够彼此验证，前线损坏的装备也不必再送回原来的制作者手中。\n\n永琳坚持把每一项修改写入公开规范。她不准备让幻想乡永远依赖自己的记忆，而是要建立一个即使没有八意永琳亲自监督，也能继续研究、生产与修正错误的体系。"

KYO_Tewi_Lucky_Logistics_1:0 "帝的银子流通网"
KYO_Tewi_Lucky_Logistics_1_desc:0 "因幡帝知道哪座村庄囤着粮食，哪家商铺愿意赊账，也知道哪条不起眼的小路能够避开封锁。她让地上兔带着银钱、借据和货单穿梭各地，把卖不出去的存货送往短缺之处，再用下一批货物偿还沿途欠下的人情。\n\n没有宏伟的银行，也没有写满规章的大厅。支撑这张网络的是商人的信用、兔群的耳目，以及帝总能在道路封闭以前先找到另一条路的本领。"

KYO_Tewi_Lucky_Logistics_2:0 "兔印流通网"
KYO_Tewi_Lucky_Logistics_2_desc:0 "帝的临时生意已经扩展成覆盖各地的流通体系。兔印票据可以在村镇之间结算，商队共享仓库与护送路线，零散回收的金属和武器零件也会被送往最需要它们的工坊。\n\n她所谓的幸运，很少真的来自偶然。那是无数地上兔提前听见的消息，是多年交往积累的信用，也是她在所有人还在争论时便已经安排好的下一辆货车。只要兔印仍在道路上出现，物资就总能找到抵达前线的方法。"

KYO_Frost_Mist_Snow_1:0 "冻霞薄雪"
KYO_Frost_Mist_Snow_1_desc:0 "白玉楼没有要求生者像亡灵一样忍受严寒。幽灵侦察队先行穿过风雪，寻找薄冰、避风处与可以保存物资的废弃建筑，再用灵火为后续部队标明安全路线。\n\n亡者承担不会被低温拖慢的工作，生者则保存体力与装备。第一次演练结束时，所有人都按时抵达终点，也没有谁被遗留在雪地之中。"

KYO_Frost_Mist_Snow_2:0 "冻霞行军法"
KYO_Frost_Mist_Snow_2_desc:0 "生者与亡灵开始组成固定的冬季行动队。幽灵负责侦察、传讯与夜间警戒，生者携带火力和修筑器材；沿途设置的避寒点与小型储备库，则让部队不必把所有物资背在身上。\n\n风雪不再只是需要克服的阻碍。灵火能够在浓雾中引路，落雪可以掩盖行踪，而被冻结的道路也能成为敌人难以预料的进攻方向。"

KYO_Frost_Mist_Snow_3:0 "白玉楼冬季战法"
KYO_Frost_Mist_Snow_3_desc:0 "白玉楼已经把严寒作战整理成完整战法。从幽灵侦察、雪地运输到伤员撤离，每支部队都知道何时继续前进，何时转入最近的避寒据点。\n\n暴雪来临时，补给不会立即中断，失散部队也能循着灵火重新集结。过去足以迫使整支军队停下的冬季，如今反而替我们的行动遮蔽声音与踪迹。"

KYO_Konpaku_Hundred_Day_1:0 "庭师的百日训"
KYO_Konpaku_Hundred_Day_1_desc:0 "妖梦没有要求普通士兵模仿她斩断楼阁的剑术。百日训练从站稳脚步、保持队形与正确收刀开始，再逐步加入近距离突击、交替掩护和有序撤退。\n\n「先别想着斩开什么。」她收剑看向又一次跌倒的新兵，「学会在混乱里找到同伴，再把他们一起带回来。」\n\n百日之后，士兵仍不可能成为魂魄妖梦，却已经能够在冲锋受阻时稳住阵线。"

KYO_Konpaku_Hundred_Day_2:0 "百日训教导团"
KYO_Konpaku_Hundred_Day_2_desc:0 "第一批完成百日训练的士兵被派往各部队担任教导员。妖梦亲自示范的动作被拆成统一课程，使远离白玉楼的部队也能学习相同的队形、突击方式与撤退规则。\n\n这套训练最重要的成果并不是让所有人挥刀如一，而是让部队在长时间战斗和局势失利时仍能彼此照应。只要队伍没有散开，一次失败的冲锋便不会立刻变成溃败。"

KYO_Ghost_Analgesia_1:0 "亡灵轮替学说"
KYO_Ghost_Analgesia_1_desc:0 "幽幽子划掉了最初草案中的一句话——「亡者已经死过一次，所以无须畏惧损失」。\n\n幽灵仍会感到痛苦，也可能在灵体受创后失去记忆，甚至彻底消散。白玉楼因此建立专门的引导与休养制度，让虚弱的亡灵退出战线，在恢复形体以后返回原来的队伍。亡者不是取之不尽的兵源；正因如此，每一份保存下来的经验才更值得珍惜。"

KYO_Ghost_Analgesia_2:0 "白玉楼归阵体系"
KYO_Ghost_Analgesia_2_desc:0 "引导用的灵灯与接应人员已经配置到各支部队。灵体开始消散时，附近人员会将其送回白玉楼；阵线失去联络后，熟悉旧部的亡灵军官则负责召集残兵并恢复指挥。\n\n生者交给军医，亡者送往彼岸，两者都不会因为一时无法战斗而被抛弃。经过休养的老兵重新归队时，带回来的不仅是战力，还有那些本来可能随混乱一同消失的经验。"

KYO_Saigyou_Whisper_1:0 "西行妖的低语"
KYO_Saigyou_Whisper_1_desc:0 "封印深处的西行妖偶尔会传出模糊低语。幽幽子没有解除封印，只允许少数人员在妖梦监护下接触最外层的回声。那些话语无法直接预言未来，却会随着敌意、恐惧与谎言发生变化，使监听者察觉潜伏者和即将发动的进攻。\n\n然而，树下听见的声音有时也会跟随人们回到梦中。失眠与不安开始在军营出现，妖梦只得随时准备斩断失控的联系。"

KYO_Saigyou_Whisper_2:0 "遍及战线的花语"
KYO_Saigyou_Whisper_2_desc:0 "随着监听范围扩大，西行妖的低语已经能够沿灵力线路传往各处阵地。指挥官从花语的变化中辨认敌军动摇之处，伏击者也能在对方发现以前避开搜查。\n\n幽幽子仍然拒绝让西行妖开花，但仅仅放大它的声音，便足以影响越来越多的人。军营之外也开始有人梦见陌生的樱树，质疑声与厌战情绪随之滋长。我们获得了一双能够窥见敌阵的眼睛，却再也无法保证那双眼睛只注视战场。"

 KYO_Eirina_eternal_1:0 "共同救治网络"
 KYO_Eirina_eternal_1_desc:0 "永远亭把战地医疗向所有人妖开放。"
 KYO_Eirina_eternal_2:0 "可验证的存续方案"
 KYO_Eirina_eternal_2_desc:0 "记录、复核与医疗流程让生命得到继续改变的机会。"
 KYO_Eirina_eternal_3:0 "蓬莱经验公开化"
 KYO_Eirina_eternal_3_desc:0 "永琳不再把月之知识当作支配他人的密室工具。"
 KYO_Eirina_eternal_4:0 "永远不是停滞"
 KYO_Eirina_eternal_4_desc:0 "延长生命的意义是保留选择，而非冻结世界。"
 KYO_Yuyuko_death_1:0 "共同姓名簿"
 KYO_Yuyuko_death_1_desc:0 "白玉楼让每一位死者都有姓名、见证与归处。"
 KYO_Yuyuko_death_2:0 "彼岸的见证"
 KYO_Yuyuko_death_2_desc:0 "送别承认失去，却拒绝把亡者变成命令工具。"
 KYO_Yuyuko_death_3:0 "西行妖的记忆"
 KYO_Yuyuko_death_3_desc:0 "幽幽子重新取得作为一个人的历史，而不只是职务。"
 KYO_Yuyuko_death_4:0 "离去仍有意义"
 KYO_Yuyuko_death_4_desc:0 "纪念让世界继续前行，不要求任何人以死亡证明立场。"


 LUN_lunar_scientific_supremacy:0 "月之頭腦的遺產"
 LUN_lunar_scientific_supremacy_desc:0 "月都的科學從來不是對未知的摸索，而是將宇宙拆解、分類，再依照需要重新組合。龐大的觀測陣列持續掃描地表與星空，研究機關則在戰爭開始以前完成推演、驗證與量產準備。"

 LUN_watatsuki_integrated_discipline:0 "綿月式統合軍紀"
 LUN_watatsuki_integrated_discipline_desc:0 "依姬制定戰法，豐姬調整全局，命令沿著經過反覆校驗的指揮鏈傳至每一支月兔部隊。士兵不必猜測上級意圖，也不容許恐慌破壞隊形。她們知道何時前進、向何處射擊、在何種傷亡下重整防線。個體或許會遲疑，整個組織卻不會。"

 LUN_lunar_integrated_command_network:0 "月球指揮網"
 LUN_lunar_integrated_command_network_desc:0 "偵測、判讀、下令與火力引導被連入同一套月面網路。前線月兔看見的每個目標，都會立刻成為後方指揮機關與支援單位共享的座標。當地上的軍隊仍在辨認敵情，月都已經完成威脅排序，將部隊送往最準確的位置。"

 LUN_celestial_war_industry:0 "天穹兵工體系"
 LUN_celestial_war_industry_desc:0 "月都沒有與戰爭完全無關的工業。精密工坊、研究設施與運輸節點都保留轉入軍事用途的接口；新式武器一旦通過驗證，規格便會同步送往所有產線。對月都而言，動員不是臨時改造社會，而是讓原本隱藏的戰爭機構全面運轉。"

 LUN_pure_logistics_standard:0 "無塵戰場規格"
 LUN_pure_logistics_standard_desc:0 "所有月都軍械都必須在真空、極寒、輻射與妖力干擾下維持運作。補給品按照精確數量封裝，運輸路線由演算機關持續修正，故障部件則在影響作戰以前完成替換。泥濘、暴雪與漫長距離不會使月軍停下，只會讓地上的敵人更快失去追趕能力。"

 LUN_purification_weapon_system:0 "淨化兵器序列"
 LUN_purification_weapon_system_desc:0 "在月都的軍事理論中，士兵、槍械、飛行器、雷達與後方演算機關並非彼此分離的單位，而是同一套兵器的不同部件。目標一旦被判定為污穢，整套體系便會同時轉向：觀測鎖定位置，空中力量壓制退路，地面部隊依照預定程序完成清除。"