 KYO_renko_gap_power:0 "记忆的彼端"
 KYO_renko_gap_power_desc:0 "一段陌生的记忆，正沿著间隙反复传来。声音破碎，名字模糊，只有一句话始终没有消失——§G梅莉!§!"
 
 









