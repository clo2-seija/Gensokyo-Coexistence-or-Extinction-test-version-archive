  KYO_death_of_yukari:0 "八云紫之死"
  KYO_death_of_yukari_desc:0 "在最后一次调整境界的仪式中，八云紫被爆炸吞没，只留下支离破碎的报告与模糊的目击证词。尸体从未被寻获，连她是否仍在此岸，都成了无人能解的谜题。\n\n然而，所有渴求权力者都迫不及待地选择相信——那位幻想乡的开创者已不在人世。只要那双金瞳不再俯瞰列岛，任何隐匿的野心都无须再伪装成服从。\n\n随著真正掌控大局的人消失，原本勉强维持的平衡开始断裂。地方妖怪首领纷纷自立旗号，旧盟约被撕碎，私人武装与各式战争如雨后春笋般出现。这个国家在表面上仍然运转，内里却像抽去了中梁的楼阁，只等第一阵风便会全线崩塌。\n\n只要「八云紫之死」仍悬在众人的心头，政府命令只是一张废纸，权威荡然无存。"



 KYO_civil_war_isolation:0 "月幕之下的孤立战争"
 KYO_civil_war_isolation_desc:0 "没有外援会越过结界，也没有外国能够替任何一方决定胜负。幻想乡已经封闭门户，胜利者只能从这场内战中诞生。"

 KYO_civil_war_npc_pressure:0 "他们也在磨利刀锋"
 KYO_civil_war_npc_pressure_desc:0 "敌对阵营没有停在原地等待灭亡。新的防线正在建立，溃散的部队重新集结，每一次迟疑都会为他们争取更多准备时间。"

 KYO_committee_central_archives:0 "紫留下的每一把钥匙"
 KYO_committee_central_archives_desc:0 "八云政府没有带走全部秘密。边界图、补给路线与紧急调度方案仍沉睡在中央档案库中，等待新的主人将它们重新拼合。"

 KYO_committee_military_assets:0 "封存军械库再启"
 KYO_committee_military_assets_desc:0 "军务委员会遗留的武器、教官与作战记录已经归入我方。曾经属于联合军的力量，如今将为我们打开敌人的战线。"

 KYO_committee_faith_assets:0 "祈愿汇成军心"
 KYO_committee_faith_assets_desc:0 "寺社、道场与地方信众选择维持我方秩序。钟声不能挡住炮弹，却能让动摇者重新握紧武器。"

 KYO_committee_mobilization_assets:0 "乡野间没有闲置之手"
 KYO_committee_mobilization_assets_desc:0 "村落名册、地方工坊与草根运输线已经纳入动员。每一条小路、每一间仓库，都开始为前线运转。"

 KYO_committee_military_chair:0 "军议席上的铁腕"
 KYO_committee_military_chair_desc:0 "军务委员长取得了前线指挥权。分散的部队将依照同一份计划行动，在敌人反应以前击穿阵地。"

 KYO_committee_faith_chair:0 "钟声压过炮火"
 KYO_committee_faith_chair_desc:0 "信仰委员长将寺社网络化为战时秩序。伤者得到照料，恐慌受到安抚，士兵也相信这场战争仍有值得坚持的意义。"

 KYO_committee_network_chair:0 "巷口就是动员处"
 KYO_committee_network_chair_desc:0 "万民委员长不依赖宏伟的司令部。工匠、信使与地方代表彼此串联，使命令和物资沿着无数不起眼的道路抵达前线。"

 KYO_legacy_doctrine_yakumo:0 "旧网仍记得主人"
 KYO_legacy_doctrine_yakumo_desc:0 "八云紫留下的统治体系建立在情报、预判与精密调度之上。即使她已不在，遍布幻想乡的旧网仍能引导战争。"

 KYO_legacy_doctrine_remilia:0 "猩红色的先手"
 KYO_legacy_doctrine_remilia_desc:0 "蕾米莉亚相信命运属于首先伸手夺取它的人。红魔馆的军队将以速度和冲击粉碎迟疑，不给敌人留下重新选择的机会。"

 KYO_legacy_doctrine_hijiri:0 "不舍弃任何一人"
 KYO_legacy_doctrine_hijiri_desc:0 "圣白莲拒绝把士兵视为可以随意填补的数字。互助、纪律与完善的后送体系，使军队能够承受苦战而不至崩溃。"

 KYO_legacy_doctrine_seija:0 "让弱者先拿到武器"
 KYO_legacy_doctrine_seija_desc:0 "正邪不准备按照旧统治者的规则作战。群众被迅速武装，敌人的装备遭到夺取，遍布各地的反抗者将从每个薄弱之处发起进攻。"


  KYO_everyone_will_survive:"所有人都将撑过去"

  KYO_kappa_orgnization_help:"河童的工业帮助"
  
  KYO_oni_orgnization_help:"鬼的威力"

   KYO_beastrealm_orgnization_help:0 "獠牙踏碎战线"
 KYO_beastrealm_orgnization_help_desc:0 "畜生界的兽灵加入攻势。它们追逐敌军的破绽，以凶猛而迅速的突击撕开战线。"

 KYO_ghost_orgnization_help:0 "死者守望生者"
 KYO_ghost_orgnization_help_desc:0 "白玉楼接管伤亡登记与后方运输。幽灵维持着沉默的秩序，使前线得以坚守更久。"

 KYO_tengu_orgnization_help:0 "风先于军旗抵达"
 KYO_tengu_orgnization_help_desc:0 "天狗的斥候、记者与航空队穿梭于战场上空。敌军尚未行动，消息便已送到我们的指挥部。"

 KYO_eientei_orgnization_help:0 "今日不准死"
 KYO_eientei_orgnization_help_desc:0 "永远亭的医师与妖兔建立战地救护网。只要还有一口气，伤员便有机会重新回到队伍。"

 KYO_last_chance_alliance_buff:0 "幻想乡的最后一张牌"
 KYO_last_chance_alliance_buff_desc:0 "工坊昼夜运转，医师奔赴前线，斥候带回情报，各方援军相继抵达。所有积攒至今的力量，都将在这场决战中一次押上。"

  KYO_fairy_of_freeze:0 "冰之妖精"
  KYO_fairy_of_freeze_desc:0 "冬季不再只是气候，而是可以任意扭动的战场条件。河面结成天然桥梁，山径封冻成拒马，敌军补给线能在一夜之间变成滑不动的冰道。\n\n对她来说，暴风雪只是不小心用力过头的恶作剧；对我们而言，却是能把整支军队埋进雪中的战略武器。只要她心情稍微好一点，前线士兵便能在冰封大地上肆意穿梭，而敌人只能在寒风中颤抖著后悔踏入这片战场。"

  KYO_hijiri_army_buff:0 "命莲寺僧兵"
  KYO_hijiri_army_buff_desc:0 "在命莲寺的旗帜下，诵经声与军靴声一同回荡于原野。这些僧兵原本只是为了护持寺院与弱小者而拿起武器的修行者，如今却被卷入决定整个列岛命运的战争之中。\n\n他们不以杀戮为乐，也不以胜利自矜，而是将每一次出征视作「阻止更多苦难」的戒律实践。行军途中仍维持早晚课诵，临战之前为敌我两方的亡者预立超度，让部队在铁与火之间仍保有一丝庄严。\n\n在这样的信念支撑下，命莲寺僧兵展现出异常的纪律与忍耐力。他们能在补给匮乏中维持队形，在溃败边缘仍咬牙守住防线。对盟友而言，他们是稳如山岭的屏障；对敌人而言，则是披著袈裟、却比任何钢铁军团更难撼动的队伍。"

  KYO_judge_of_all_life:0 "万物之裁"
  KYO_judge_of_all_life_desc:0 "四季映姬，掌管生死分际的仲裁者。她不向任何旗帜宣誓，也不为任何胜利喝采。当战争把土地磨成灰，把名字抹成数字，她只是站在宣判与沉默之间，冷静地记录每一次坠落。\n\n对她而言，战场不是荣耀的舞台，而是一张漫长的案卷。每一条被迫出征的生命、每一次不必要的屠戮、每一份被权力掩饰的谎言，都会被写入那本看不见的簿册之中。没有人能确定她何时开口，但所有人都知道她终会开口。\n\n因此，「万物之裁」像阴影一样覆在军队与政客的肩上：你可以赢下一座城市，却不一定赢得审判；你可以用宣传抹去罪行，却抹不去因果。当越来越多亡魂被送往彼岸，战争的代价也不再只是资源与领土，而是整个政权的道德债务。"

  KYO_remilia_army_buff:0 "鲜红帝国的铁蹄"
  KYO_remilia_army_buff_desc:0 "在猩红的旗帜下，蕾米莉亚不再只是贵族，而是帝国意志本身。她站上高台，语句短促而绝对，将恐惧、荣耀与秩序锻成同一条命令。城市学会整齐地呼吸，工坊学会按时地轰鸣，军队则学会以同一个步伐踏碎犹豫。\n\n她不谈妥协，只谈「统一」。每一个阶层都有位置，每一种声音都要对齐，每一次行军都要像仪式般精准。铁蹄踏过之处，道路被改写成阅兵线，人民被改写成队列，而鲜红帝国的扩张，将被宣告为天经地义的生存法则。"

  KYO_seija_army_buff:0 "颠覆战法"
  KYO_seija_army_buff_desc:0 "她把规则倒过来读，然后把战场也一并倒过来。正面冲突只是陷阱，撤退可以是前进，示弱可以是号角。当敌人还在用尺量战线，她已经用谣言、夜袭、伪装与分化把整个前线织成一张反向的网。\n\n在鬼人正邪的眼里，「规则」从来不是中立的工具，而是强者用来固定阶级的枷锁。既然我们生来被安排在棋盘的最底层，那就把棋盘掀了。她让小队化整为零，让补给化作陷阱，让每一次交战都变成对秩序本身的嘲弄。\n\n当颠复成为方法，混乱就不再是失控，而是武器。敌人越依赖既定流程，就越容易在她的反规则里失血，直到他们发现: 自己输掉的不是一场战役，而是「相信规则会保护他们」的那份天真。"

  KYO_yakumo_army_buff:0 "八云紫的遗产"
  KYO_yakumo_army_buff_desc:0 "八云紫死去的那一刻，并没有把她的意志一同带走。\n\n她留下的不是一段口号，而是一整套能被「执行」的东西：结界的运用、境界的座标、以及把妖怪社会勉强拴在同一张图纸上的制度设计。爆炸抹去了她的身影，却也把她的布局像灰烬般撒向各地，落进军营的作战桌、官署的档案柜、与密室里的封印盒。\n\n八云蓝把遗产拆成可运行的条目：守备区的层级、通行证的编码、间隙通道的启闭规程。她不相信奇迹，她相信流程与验算。橙则把同一份遗产塞进人心的缝隙里：巡逻时多一盏灯、避难时多一条路、粮仓外多一张手写的分配表。于是「结界」不再只是天上的线，而成了地上的秩序。\n\n§Y遗产的核心§!\n- §W境界作战§!：把地形、距离与视线，重新写成我们的规则。\n- §W间隙机动§!：不求瞬移神话，只求让补给与增援比敌人早一步抵达。\n- §W制度锁扣§!：把各地私兵与地方势力，逐步扣回同一套指挥链与法度。\n\n只要遗产仍在运作，八云之名就仍在战场上呼吸。敌人以为他们砍倒的是一个人，却没看见：她早把自己写进了一座看不见的城。"


 KYO_foreign_machinery_1:0 "外界器械依赖"
 KYO_foreign_machinery_1_desc:0 ""

 KYO_foreign_machinery_2:0 "拆解与重构"
 KYO_foreign_machinery_2_desc:0 ""

 KYO_foreign_machinery_3:0 "逆向工程体系"
 KYO_foreign_machinery_3_desc:0 ""

 KYO_foreign_machinery_4:0 "标准化量产"
 KYO_foreign_machinery_4_desc:0 ""

 KYO_foreign_machinery_5:0 "妖怪工业主导权"
 KYO_foreign_machinery_5_desc:0 "从设备引进到自主量产，妖怪已经掌握完整的现代工业体系。它能够以前所未有的速度扩建，却也不断吞噬资源、行政能力与新的技术人才；这是一部强大，却不能轻易停下的机器。"

 KYO_forced_labor_1:0 "临时劳务征集"
 KYO_forced_labor_1_desc:0 ""

 KYO_forced_labor_2:0 "劳动管制区"
 KYO_forced_labor_2_desc:0 ""

 KYO_forced_labor_3:0 "长期劳役编制"
 KYO_forced_labor_3_desc:0 ""

 KYO_forced_labor_4:0 "身份绑定劳役制"
 KYO_forced_labor_4_desc:0 "职业、住所与公共配给被固定在同一套身份制度之中。工业获得了近乎取之不尽的劳力，但人类社会的自主性、人口基础与政治认同也在持续衰退。"

 KYO_twenty_four_hours_work_time:0 "全天候轮转制"
 KYO_twenty_four_hours_work_time_desc:0 "工厂与矿区实行全天候轮转，设备不再因昼夜交替而停机。纸面上仍有不同班次，实际上的加班与临时替补却不断侵占休息时间；机器得到了完整的一天，劳工没有。"

 KYO_sixteen_hours_work_time:0 "十六小时劳务制"
 KYO_sixteen_hours_work_time_desc:0 "每日劳动被固定为两段八小时，并保留最低限度的进食、检查与睡眠时间。它比毫无规划的连续劳役更加稳定，却仍然远远超过人体能够长期承受的范围。"

 KYO_gensokyo_utopia:0 "妖怪乌托邦"
 KYO_gensokyo_utopia_desc:0 "妖怪的城市拥有明亮街灯、稳定电力、现代医疗与从不空缺的货架。工业革命已经完成，幻想乡不必再依赖外界的怜悯，也不必担忧自己被新时代遗弃。\n\n支撑这一切的，是受到严密管理的人类劳动。人类获得基本生活保障，却无法自由选择职业、住所与未来；他们不再经常面对公开暴力，因为命令已经化为证件、配给与规章。\n\n这并非一个完全建立在恐惧上的国家，也不是一个真正平等的共同体。它稳定、繁荣，并且能够长久存在——只是所谓乌托邦的边界，恰好画在人类与妖怪之间。"



 KYO_tengu_untrust_debuff_1:0 "天狗的疑惧"
 KYO_tengu_untrust_debuff_1_desc:0 "妖怪山是天狗的地盘。天狗仍以戒备与审视的目光注视著政府，让政令推行、民心稳定与战时动员都变得更加艰难。"

 KYO_tengu_untrust_debuff_2:0 "天狗的观望"
 KYO_tengu_untrust_debuff_2_desc:0 "天狗已不再公开抗拒，但他们仍选择保持距离。"

 KYO_grassroot_rebal_1:0 "草根妖怪的反扑"
 KYO_grassroot_rebal_1_desc:0 "赤蛮奇、今泉影狼、若鹭姬这些草根妖怪并不承认敌人的胜利。她们将会让行动变得困难"

 KYO_grassroot_rebal_2:0 "草根的余波"
 KYO_grassroot_rebal_2_desc:0 "骚动虽已被压下，可草根妖怪的不满仍在暗处回响。只要生活没有真正好转，这股情绪迟早还会再度聚拢。"

 KYO_yet_another_industry_debuff_1:0 "工业体系失序"
 KYO_yet_another_industry_debuff_1_desc:0 "内战、破坏与仓促征发撕裂了原有的生产链。资源调度混乱、基础建设停滞，军工与民用体系都在低效与短缺中艰难运转。"

 KYO_yet_another_industry_debuff_2:0 "工业修复期"
 KYO_yet_another_industry_debuff_2_desc:0 "最严重的混乱已经过去，但工厂、资源与建设网路仍未完全恢复。政权还需要更多时间，才能把这套残破的工业机器重新校正。"

 KYO_lunar_capital_plot_1:0 "月都阴谋"
 KYO_lunar_capital_plot_1_desc:0 "月之都的手并未真正离开幻想乡。潜伏者、监视网与暗中的操盘仍在侵蚀现有秩序，使情报外泄、民心动摇，甚至连最基本的防谍能力都遭到削弱。"

 KYO_lunar_capital_plot_2:0 "月都残余渗透"
 KYO_lunar_capital_plot_2_desc:0 "月都势力已遭削弱，但残存的耳目与渗透网络仍在活动。只要稍有松懈，这些来自月面的阴影就会再一次伸手介入幻想乡。"

 KYO_myouren_resistance_1:0 "命莲寺抵抗"
 KYO_myouren_resistance_1_desc:0 "命莲寺仍以慈悲、信念与另一套秩序动员人心。只要白莲一系的号召力尚未消散，占领地区的顺从就只是表面，地下的反抗始终不会停息。"

 KYO_myouren_resistance_2:0 "命莲寺余烬"
 KYO_myouren_resistance_2_desc:0 "命莲寺的公开抵抗虽已被压制，但它留下的人脉、声望与地下联络网依旧存在，持续拖慢对地方的整合与掌控。"

 KYO_yakumo_wrath_1:0 "八云之怒"
 KYO_yakumo_wrath_1_desc:0 "八云家的败退不代表八云势力已经沉默。残党、旧臣与依附者仍在暗中牵制一切，让动员、法令与权力整合都要付出更高的代价。"

 KYO_yakumo_wrath_2:0 "八云家的余怒"
 KYO_yakumo_wrath_2_desc:0 "最猛烈的反扑已经过去，但八云势力留下的阴影仍未完全消散。恐惧、观望与旧有关系网，依旧拖住红魔馆向前推进的步伐。"

 KYO_uncontrol_flan_1:0 "失控的芙兰朵露"
 KYO_uncontrol_flan_1_desc:0 "芙兰朵露的力量仍未被真正掌控。只要她的情绪再次失衡，红魔馆就必须不断分出精力去收拾那场随时可能降临的灾厄。"

 KYO_uncontrol_flan_2:0 "芙兰朵露的不稳定"
 KYO_uncontrol_flan_2_desc:0 "芙兰朵露暂时安静了下来，但危险从未真正离开。所有人都清楚，她依然是一颗不知道何时会被引爆的灾星。"



 

 KYO_Scarlet_Sakuya_1:0 "女仆长的清点"
 KYO_Scarlet_Sakuya_1_desc:0 "咲夜先整理的不是战场，而是失序。粮、枪、账册与人手都被她重新摆回该在的位置。"

 KYO_Scarlet_Sakuya_2:0 "银表流程"
 KYO_Scarlet_Sakuya_2_desc:0 "十六夜咲夜把馆务拆成一段段可执行的工序，让后勤不再拖慢红魔馆的步伐。"

 KYO_Scarlet_Sakuya_3:0 "十六夜排程"
 KYO_Scarlet_Sakuya_3_desc:0 "从仓储到配给，从巡逻到轮值，一切都按着她的时间走。"

 KYO_Scarlet_Sakuya_4:0 "馆务绝对秩序"
 KYO_Scarlet_Sakuya_4_desc:0 "咲夜让混乱只能在门外徘徊。只要她还站着，红魔馆的机器就不会停。"

 KYO_Scarlet_Sakuya_5:0 "完美而潇洒的总管"
 KYO_Scarlet_Sakuya_5_desc:0 "她不是单纯的女仆长，而是让整个政权高效运转的中枢。"

 KYO_Scarlet_Meiling_1:0 "门前晨哨"
 KYO_Scarlet_Meiling_1_desc:0 "美铃站在第一道门前，把最初的松散与侥幸全都拦下。"

 KYO_Scarlet_Meiling_2:0 "守门人的拳法"
 KYO_Scarlet_Meiling_2_desc:0 "她把武术、纪律与耐心带进军营，让新兵学会先站稳再出拳。"

 KYO_Scarlet_Meiling_3:0 "红门防线"
 KYO_Scarlet_Meiling_3_desc:0 "从关卡到驻军，从高墙到山道，红魔馆的外层防网开始成形。"

 KYO_Scarlet_Meiling_4:0 "不眠门卫军"
 KYO_Scarlet_Meiling_4_desc:0 "美铃让守备部队学会轮换、坚守与反应，让防御不再只是被动挨打。"

 KYO_Scarlet_Meiling_5:0 "微笑的铁壁"
 KYO_Scarlet_Meiling_5_desc:0 "她依旧带着笑，可谁都知道，那道笑意后面是一堵推不动的墙。"

 KYO_Scarlet_Remilia_1:0 "红月号令"
 KYO_Scarlet_Remilia_1_desc:0 "蕾米莉亚不安抚，也不解释。她只让所有人记住，新的命令已经降下。"

 KYO_Scarlet_Remilia_2:0 "斯卡雷特战时意志"
 KYO_Scarlet_Remilia_2_desc:0 "她把恐惧与骄傲编进军队，让进攻本身变成红魔馆的风格。"

 KYO_Scarlet_Remilia_3:0 "女王的进军"
 KYO_Scarlet_Remilia_3_desc:0 "战线向前推，统治也跟着向前推。蕾米莉亚要的不是击败，而是压服。"

 KYO_Scarlet_Remilia_4:0 "血色统治"
 KYO_Scarlet_Remilia_4_desc:0 "她开始把占领地纳入自己的秩序，让服从逐渐变成习惯。"

 KYO_Scarlet_Remilia_5:0 "红雾下的帝权"
 KYO_Scarlet_Remilia_5_desc:0 "在红雾与命令之下，战争、占领与威慑终于被捏成同一个王权。"

 KYO_Scarlet_Flandre_1:0 "地下室的裂音"
 KYO_Scarlet_Flandre_1_desc:0 "只要芙兰的力量稍微外泄，前线就会得到更凶猛的冲击，可后方也会开始不安。"

 KYO_Scarlet_Flandre_2:0 "玻璃翼的躁动"
 KYO_Scarlet_Flandre_2_desc:0 "她不是兵器，而是被勉强牵住的灾厄。越接近前线，后方越难保持平稳。"

 KYO_Scarlet_Flandre_3:0 "恶梦的妹妹"
 KYO_Scarlet_Flandre_3_desc:0 ""

 KYO_Scarlet_Flandre_4:0 "恶魔之妹的笑声"
 KYO_Scarlet_Flandre_4_desc:0 "敌军会先被撕开，可工坊、后方与民心也会因她的存在而发出裂响。"

 KYO_Scarlet_Flandre_5:0 "无法关住的天灾"
 KYO_Scarlet_Flandre_5_desc:0 "她足以把最坚固的阵地砸穿，但整个国家都必须承受她带来的摇晃。"

 KYO_Scarlet_Patchouli_1:0 "书页上的拆解"
 KYO_Scarlet_Patchouli_1_desc:0 "帕秋莉开始拆解外界器械，把陌生技术一点点纳入红魔馆的知识体系。"

 KYO_Scarlet_Patchouli_2:0 "大图书馆试作"
 KYO_Scarlet_Patchouli_2_desc:0 "研究不再停在书页上，图书馆的推导开始转成真正可用的工艺。"

 KYO_Scarlet_Patchouli_3:0 "魔导工学"
 KYO_Scarlet_Patchouli_3_desc:0 "魔法与工业被帕秋莉接在一起，让生产与科研同时往前推。"

 KYO_Scarlet_Patchouli_4:0 "贤者的量产术"
 KYO_Scarlet_Patchouli_4_desc:0 "她让理论开始服务于工厂，让建造与量产获得同样冷静而精确的推动。"

 KYO_Scarlet_Patchouli_5:0 "不动的大图书馆"
 KYO_Scarlet_Patchouli_5_desc:0 "当帕秋莉真正进入状态时，整座红魔馆都会变成她的研究延伸。"

  








