 path_of_all_salvation:0 "普救众生之道"
 path_of_all_salvation_desc:0 "命莲寺不再只是一座收留迷途者的寺院，而是一条向世界展开的道路。白莲以慈悲掌舵，星守护秩序，一轮传播教义，娜兹玲清理暗处的欺瞒，水蜜驾船连通诸国，响子则把和平的声音送往远方。\n\n我们不以恐惧迫使世界低头，而以救济、援助、交涉与实际行动证明：人类与妖怪并非注定为敌。只要仍有人愿意伸手，苦难就不会是世界唯一的语言。"

 revise_socialism_and_marx_1:0 "修正社会主义与马克思思想"
 revise_socialism_and_marx_1_desc:0 "白莲看见了现代世界的另一种苦难：工人被机器吞没，农民被债务锁住，弱者被国家与资本共同压低头。她并不否认平等与劳动解放的理想，恰恰相反，她认为这些思想本应与佛法中的慈悲相通。\n\n但理想一旦被官僚、党国与暴力垄断，便会从解放众生的道路，变成新的枷锁。命莲寺将重新整理这些思想，使其回到最初的问题：受苦者如何不再被当作工具？"

 revise_socialism_and_marx_2:0 "佛法社会主义的成形"
 revise_socialism_and_marx_2_desc:0 "经过白莲与弟子们的实践，命莲寺逐渐形成了一套新的道路。它承认劳动者的尊严，反对剥削与压迫，却不让阶级仇恨成为新的信仰；它追求平等与共有的幸福，却拒绝用秘密警察、清洗与恐惧来制造所谓的进步。\n\n一轮将劳动视为修心，星让秩序服务于弱者，娜兹玲确保资源不被新贵窃取，响子让底层声音被听见。佛法与社会主义在此不再彼此排斥，而是共同指向一个更朴素的愿望：让众生不必互相吞噬，也能活下去。"

 we_are_all_equal_1:0 "众生皆平等"
 we_are_all_equal_1_desc:0 "命莲寺的平等，并不是一句轻飘飘的口号。白莲收留过带刺的、阴暗的、失控的、笨拙的、满身裂痕的妖怪，也看见过人类在恐惧、贫穷与压迫下露出的脆弱。\n\n正因为她见过这些不完美，才更明白：没有谁天生只配被统治，也没有谁天生只能成为怪物。人类、妖怪、工人、流民、弱者与异类，都应当拥有被承认、被保护、被重新接纳进社会的资格。"

 we_are_all_equal_2:0 "人妖共生的平等国度"
 we_are_all_equal_2_desc:0 "平等已经不再只是命莲寺的教义，而成为国家运转的根基。人类不再只是妖怪赖以存在的恐惧来源，妖怪也不再只是人类传说中的阴影。她们共同劳动、共同守卫、共同接受教育与救济，也共同承担这个新世界的责任。\n\n星守住制度的公正，一轮把信念带进工坊与田野，娜兹玲监督资源分配，水蜜连接远方社群，响子让每一个微弱声音都能回响。白莲所追求的世界并非没有痛苦，而是痛苦不再由某一群人独自背负。"

 KYO_seija_redeeming_rebellion:0 "正寺中的逆刃"
 KYO_seija_redeeming_rebellion_desc:0 "鬼人正邪没有变成温顺的信徒，也没有放弃对权力与虚伪的厌恶。她只是第一次承认，单纯的颠倒并不能拯救被压迫者。\n\n如今，她留在命莲寺之内，以最尖锐的眼光审视我们的制度、援助与命令。她会让许多人不舒服，却也能阻止慈悲变成新的傲慢，阻止秩序在无人质疑时重新长出压迫的牙。"

 KYO_seija_grassroots_restitution:0 "草根的修补者"
 KYO_seija_grassroots_restitution_desc:0 "正邪回到了她最熟悉的地方：草根妖怪、底层社群、废墟边缘与被权力遗忘的人群之中。\n\n这一次，她不再只是煽动怒火，而是用自己曾经伤害过的语言去重新建立沟通。她仍然尖锐，仍然反骨，却开始把那份反抗用在保护弱者、揭穿地方压迫、修补命莲寺与底层妖怪之间的裂缝上。"

 KYO_aya_supportive_reporting:0 "射命丸文的支持报道"
 KYO_aya_supportive_reporting_desc:0 "《文文。新闻》不再只把命莲寺当成可供拆解的题材。射命丸文亲自调查、试探、质疑，最后选择以自己的笔为命莲寺作证。\n\n她并未把命莲寺写成完美无缺的圣地。相反，她写下那些裂痕、麻烦与危险，也写下白莲与弟子们如何承认并修补它们。正因这份报道不盲目赞美，反而让更多天狗、妖怪与人类愿意相信：命莲寺的慈悲不是伪装，而是一种正在艰难运转的现实。"

 KYO_choujuu_gigaku_wave:0 "鸟兽伎乐的流行浪潮" 
 KYO_choujuu_gigaku_wave_desc:0 "响子与米斯蒂娅组成的鸟兽伎乐，在莉格露的帮助下，将自然虫鸣融入音乐之中，形成了独一无二的风格。\n\n她们的歌声奇妙、前卫、热烈而真诚。它无法替代粮食与药品，却能在众人最疲惫的时候，把心重新拉向未来。越来越多的人类与妖怪开始相信，命莲寺带来的不仅是秩序与救济，也是一种值得期待的新生活。"

 KYO_ichirin_determination:"一轮的决心"

  KYO_unidentified_watcher_of_myouren:0 "正体不明的旁观者"
 KYO_unidentified_watcher_of_myouren_desc:0 "封兽鵺并未真正归顺命莲寺，但她也不再只是暗处的破坏者。与水蜜的漫长辩论让她开始重新思考妖怪的本质：自然、恐惧、幻想、肉身、名字，以及选择。\n\n她仍潜伏在寺中，用正体不明的眼睛观察白莲的道路。她的存在让命莲寺无法用简单答案欺骗自己，也让水蜜更加坚信：妖怪的本质并不是无法改变的判决。"






