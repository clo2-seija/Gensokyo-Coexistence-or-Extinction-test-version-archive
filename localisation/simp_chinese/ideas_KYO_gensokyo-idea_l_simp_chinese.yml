  KYO_kogasa_idea:0 "多多良小伞的惊吓灵感"
  KYO_kogasa_idea_desc:0 "被遗忘的纸伞化为付丧神，小伞最擅长把“常识”撑出一个洞。惊吓带来灵感，灵感推动试作与改良，研究节奏因此更快。"

  KYO_reiko_idea:0 "堀川雷鼓的节拍工学"
  KYO_reiko_idea_desc:0 "雷鸣般的律动将流程切分成有序的小节——从试验设计到量测回馈都按拍推进，让研发团队步调整齐、效率倍增。"

  KYO_benben_idea:0 "九十九弁弁的琵琶声学"
  KYO_benben_idea_desc:0 "弁弁以古琵琶之声引导共振，将直觉与数理结合；从声学到材料学的灵感相互碰撞，为新式装备与技术开路。"

  KYO_yatsuhashi_idea:0 "九十九八桥的筝韵结构"
  KYO_yatsuhashi_idea_desc:0 "琴筝的张力、共鸣与结构设计启发了模态分析与框架优化；在她的调弦下，试作迭代更为精确而迅速。"

  KYO_kokoro_idea:0 "秦心的面灵气"
  KYO_kokoro_idea_desc:0 "情绪是能量，也是组织的动力。心以面灵气调度士气与专注，将团队情感导向“解题”的同一面具。"

  KYO_shinmyoumaru_idea:0 "少名针妙丸的万宝槌"
  KYO_shinmyoumaru_idea_desc:0 "小小的奇迹也能撬动大工程。万宝槌带来灵巧与节省的思路：微缩制程、以小博大，让研究与试作更精省。"

  KYO_Tsukumogami_idea:0 "付丧神之军器"
  KYO_Tsukumogami_idea_desc:0 "旧物觉醒，新意重生。兵器因灵而顺手、因念而坚实：步兵装备成本更低、攻防更佳，配合研发推进，全军受益。"

