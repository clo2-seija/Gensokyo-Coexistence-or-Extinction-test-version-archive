 KYO_Fade_away_1:"正在消逝"
 KYO_Fade_away_1_desc:"随著裂缝的撕裂，很多的妖怪，一开始是忘记自己的身份，再来是忘记如何生活自理，到最后丧失自己的躯体"

 KYO_Fade_away_2:"正在消逝"
 KYO_Fade_away_2_desc:"随著裂缝的撕裂，很多的妖怪，一开始是忘记自己的身份，再来是忘记如何生活自理，到最后丧失自己的躯体"

 KYO_Hakurai_death:"博丽巫女的死亡"
 KYO_Hakurai_death_desc:"随这巫女的死亡，妖怪与人类的平衡也打破了，没有人或妖怪可以取代巫女平衡的船舵"

 KYO_I_am_hungry:"我们需要吃人"
 KYO_I_am_hungry_desc:"妖怪的天性，但由于近期的事件，开始回归妖怪陋习<吃人>"

 KYO_Eiki_help:"映姬的组织化手册"
 KYO_Eiki_help_desc:"映姬为了让妖怪不要堕入吃人的古老习性，为八云紫的部队建立一份部队的训练计划，让妖怪更有组织性"

 KYO_Nitori_help:"河童的工业辅助"
 KYO_Nitori_help_desc:"河童的工业辅助，极大的帮助部队装备的生产，有利于部队建设"

 KYO_Satori_help:"觉妖怪的心灵建设"
 KYO_Satori_help_desc:"觉妖怪虽为一群最不受人待见的妖怪，但他们却是一群可以看透群众恐惧的妖怪，有了他们极大的帮助缓解幻想乡的恐慌"

 KYO_three_youkai:"草根妖怪共同体"
 KYO_three_youkai_desc:"有了底层妖怪的支持，使我们有更多人的支持"

 KYO_youkai_tech_is_best:"妖怪的科技世界第一"

