 KYO_lunar_report_1_win:0 "§Y月面登陆｜本轮胜利§!\n月海无风，天狗却以妖风将方位传遍全军。古明地觉从守军思绪中剥出监视空白，恋在无人察觉的道路上点亮落点；间隙撕开月虹哨塔后的长夜，幻想乡的军旗第一次落上月土。"

 KYO_lunar_report_1_loss:0 "§Y月面登陆｜本轮失利§!\n依姬请下守门神，神光将滩头一路压回间隙。古明地姐妹重绘盲区，天狗带回失联者，先遣队则死守最后的归路。\n\n紫合起折扇：“月亮还在那里。我们也还在。重整，再来。”"

 KYO_lunar_report_2_win:0 "§Y第一重城门｜本轮胜利§!\n白莲立于神降之前，梵光为全军撑开第一道缺口。萃香大笑着聚起鬼族，沿蓝计算的时序撞向城门；千年前各自为战的百鬼，今日以同一步伐踏碎月都的门槛。"

 KYO_lunar_report_2_loss:0 "§Y第一重城门｜本轮失利§!\n丰姬折叠长街，冲锋的军势在数步之间偏离城门。白莲以法力护住撤军，鬼族冒着神火拖回河童重炮。\n\n紫望向变换不定的长街：“她能折叠道路，折不断我们的军势。带回伤员。下一次，正面破门。”"

 KYO_lunar_report_3_win:0 "§Y月都外郭｜本轮胜利§!\n红雾遮断月都的银白天穹，荷取让炮火循着雾中信标击穿外郭。人类与妖怪越过同一段城墙，却没有把兵刃转向民居；躲在门后的月民第一次看清，来者并非月都口中的屠城恶鬼。"

 KYO_lunar_report_3_loss:0 "§Y月都外郭｜本轮失利§!\n月兔自屋脊与回廊交叉射击，迫使攻城军退出缺口。河童在红雾中留下归路，红魔馆以最后一轮齐射替运输队断后。\n\n紫站在城墙之外：“失去的只是一段外郭，不是这场战争。所有人回来，我们会再越过去。”"

 KYO_lunar_report_4_win:0 "§Y内城月渠｜本轮胜利§!\n永远亭让伤员重新站起，白玉楼则引领战死者的魂火渡过月渠。生者沿左岸推进，亡者自右岸相随；两支军势在内城门前汇合，连死亡也未能截断幻想乡的进军。"

 KYO_lunar_report_4_loss:0 "§Y内城月渠｜本轮失利§!\n纯化术式封死月渠，伤兵与归路被隔在两端。铃仙以狂气之瞳扰乱月兔信号，妖梦逐一护送伤员穿过残存通道。\n\n紫亲手撑住即将闭合的间隙：“先带回生者，也别落下死者的名字。路断了，我会再开一条。”"

 KYO_lunar_report_5_win:0 "§Y宫城阶前｜本轮胜利§!\n玲未在月土上立起临时鸟居，将博丽的归路钉在宫城阶前。守矢诸神循蓝计算的坐标降下御柱；退路稳固的一刻，紫收拢漫天间隙，让它们同时咬住王城护壁。"

 KYO_lunar_report_5_loss:0 "§Y宫城阶前｜本轮失利§!\n绵月姐妹将神灵与月兔尽数集中于宫城阶前，御柱也被神光逐根震碎。玲未守住仪式，蓝与橙不断缩短归路，联军赶在间隙闭合以前退回防线。\n\n紫没有回头：“她们守住的只是台阶。退下去，站稳，再上来。”"

 KYO_lunar_report_6_win:0 "§Y最后月门｜本轮胜利§!\n红雾覆空，战鼓震月，御柱与花海一同越过最后的间隙，白玉楼的引魂蝶紧随军旗飞入王城。内应自城中解除封印，联军从城外击碎门轴，最后月门在两股力量之间轰然开启。没有任何一面旗帜能够独占这场胜利。"

 KYO_lunar_report_6_loss:0 "§Y最后月门｜本轮失利§!\n最后月门在全军面前重新闭合，月都的神火沿城墙倾泻而下。白莲与萃香守住两翼，紫命令所有势力沿同一道间隙撤离，无人被遗弃在月上。\n\n她最后一个跨过通道：“门可以再关，间隙也可以再开。只要幻想乡还在，这场战争就没有结束。”"

