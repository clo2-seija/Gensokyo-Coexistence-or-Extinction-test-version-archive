 KYO_lunarian_controlled_major:0 "月都垂治"
 KYO_lunarian_controlled_major_desc:0 "地上政权奉月都敕令行事，军政与舆论皆须服从所谓的纯净秩序。"

 KYO_lunarian_control_idea_1:0 "月都垂治 I"
 KYO_lunarian_control_idea_1_desc:0 "月都的命令开始压制地表政权。当前综合惩罚：§R5%§!。"
 KYO_lunarian_control_idea_2:0 "月都垂治 II"
 KYO_lunarian_control_idea_2_desc:0 "月都战况首次失利，控制体系开始加重征调。当前综合惩罚：§R10%§!。"
 KYO_lunarian_control_idea_3:0 "月都垂治 III"
 KYO_lunarian_control_idea_3_desc:0 "月都连续受挫，地表军政体系承受更沉重的代价。当前综合惩罚：§R20%§!。"
 KYO_lunarian_control_idea_4:0 "月都垂治 IV"
 KYO_lunarian_control_idea_4_desc:0 "月面防线动摇，纯化命令正在撕裂地表国家。当前综合惩罚：§R30%§!。"
 KYO_lunarian_control_idea_5:0 "月都垂治 V"
 KYO_lunarian_control_idea_5_desc:0 "月都濒临失败，失控的征调与镇压严重削弱全国。当前综合惩罚：§R40%§!。"
 KYO_lunarian_control_idea_6:0 "月都垂治 VI"
 KYO_lunarian_control_idea_6_desc:0 "月都统治走向崩溃，地表控制体系达到最严重阶段。当前综合惩罚：§R50%§!。"

 KYO_lunarian_faction_lock:0 "奉月敕令"
 KYO_lunarian_faction_lock_desc:0 "受敕国家不得退出净化阵线，任何独断皆被视作污秽侵染。"

 KYO_lunarian_control_fractured:0 "月令中绝"
 KYO_lunarian_control_fractured_desc:0 "地月联系已经断裂，来自月都的敕令不再传遍全国。"

 KYO_lunarian_crossline_disrupted:0 "天路受阻"
 KYO_lunarian_crossline_disrupted_desc:0 "月面战败扰乱天路，地表诸军暂时失去补给与增援。"

 KYO_lunarian_defeat_pressure_1:0 "月威渐衰：天音失真"
 KYO_lunarian_defeat_pressure_1_desc:0 "月都初尝败绩，彼此冲突的军令开始传向地上。"

 KYO_lunarian_defeat_pressure_2:0 "月威渐衰：敕令崩解"
 KYO_lunarian_defeat_pressure_2_desc:0 "接连败退动摇月地联系，补给、增援与军心一并涣散。"

 KYO_lunarian_defeat_pressure_3:0 "月威渐衰：天命断绝"
 KYO_lunarian_defeat_pressure_3_desc:0 "月都再也无法支配地上，受控诸国正逐一挣脱净化阵线。"

 KYO_gensokyo_wartime_coalition:0 "百妖共御月都"
 KYO_gensokyo_wartime_coalition_desc:0 "百妖协议三委员会放下分歧，将军队、情报与救援汇入同一战局。"

 KYO_lunar_preemptive_strike:0 "月满之前"
 KYO_lunar_preemptive_strike_desc:0 "趁月都尚未收紧对地表的支配，幻想乡率先出兵；此后半年，战场先机仍在我方。"

 KYO_world_life_can_change:0 "生者仍有明日"
 KYO_world_life_can_change_desc:0 "活着不是被永远封存在今日，而是仍有选择明日的权利。"

 KYO_world_memory_remains:0 "逝者仍留其名"
 KYO_world_memory_remains_desc:0 "逝者留下姓名，生者带着记忆继续前行，送别因此不等于遗忘。"

 KYO_world_science_and_fantasy:0 "共望一片星空"
 KYO_world_science_and_fantasy_desc:0 "科学不再驱逐幻想，幻想也不再畏惧求知；二者将共同认识这个世界。"



 KYO_lunar_debug_category:0 "月战测试工具"
 KYO_lunar_debug_category_desc:0 "仅在以 -debug 启动游戏时显示。用于快速检查倒计时、入侵入口、GUI 与双方胜场显示，不会出现在正常游戏中。"
 KYO_lunar_debug_open_gui:0 "DEBUG：开启并重置月战面板"
 KYO_lunar_debug_open_gui_desc:0 "不宣战，直接解锁月战 GUI、重置双方胜场、抽取第一轮战术，并给予四次免费指令。适合纯粹检查界面。"
 KYO_lunar_debug_start_countdown:0 "DEBUG：挂上两年倒计时"
 KYO_lunar_debug_start_countdown_desc:0 "启动 730 天月都入侵任务，用来测试自然到期流程。"
 KYO_lunar_debug_start_prewar_events:0 "DEBUG：跳到战前六周"
 KYO_lunar_debug_start_prewar_events_desc:0 "把入侵计时设为 43 天并立刻执行一次战前 tick，用来测试阵营命名与六个每周事件。"
 KYO_lunar_debug_start_natural_invasion:0 "DEBUG：立即触发自然入侵"
 KYO_lunar_debug_start_natural_invasion_desc:0 "立刻走倒计时结束后的正常入侵入口，不给予先发制人增益。"
 KYO_lunar_debug_start_preemptive_invasion:0 "DEBUG：立即触发先制入侵"
 KYO_lunar_debug_start_preemptive_invasion_desc:0 "立刻走玩家手动开战入口，并给予 180 天先发制人增益。"
 KYO_lunar_debug_add_yukari_point:0 "DEBUG：八云紫方胜场 +1"
 KYO_lunar_debug_add_yukari_point_desc:0 "更新 GUI 的八云紫方胜场，并同步测试月都阵营的分段减益与受控国家脱离。"
 KYO_lunar_debug_add_lunarian_point:0 "DEBUG：月都方胜场 +1"
 KYO_lunar_debug_add_lunarian_point_desc:0 "只更新 GUI 的月都方胜场与战报标记，不执行正式回合结算。"

