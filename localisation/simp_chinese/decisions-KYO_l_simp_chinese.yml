  Tsukumogami_ship_decision:0 "付丧神・调律专案"
  Tsukumogami_ship_decision_desc:0 "百器鸣动，灵光上弦。把旧物请上舞台，由付丧神们为体系逐一「§Y调律§!」：\n— §Y启用§!某位同伴的加护，如同让那件乐器主奏，研究节拍立刻加快；\n— §R停用§!时一记断拍，将资源收回编制，转入下一段乐句。\n\n在「惊吓」「节拍」「琵琶」「筝韵」「面灵气」「万宝槌」之间自由切换，让幻想乡的研发像乐团般时而咏叹、时而爆发。"

