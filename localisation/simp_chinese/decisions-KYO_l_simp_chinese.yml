 shou_mission_one:0 "星的考验：扛起命莲寺"
 shou_mission_one_desc:0 "白莲已经把最沉的责任放到星肩上。她若想真正成为命莲寺的二把手，就不能只会守护，而必须学会接过军心、秩序与国家运转的重量。"

 shou_mission_two:0 "星的考验：宝塔与人心"
 shou_mission_two_desc:0 "星已经能替白莲分担重担，可她仍得面对自己最真实的弱点。宝塔、责任、失误与羞愧，全都会在这段时间里逼着她回答：她究竟能不能在脆弱中仍然守住秩序？"

 shou_mission_three:0 "星的考验：猛虎之心"
 shou_mission_three_desc:0 "当国家逐渐站稳，白莲也要求星去面对更高一层的责任。她不能永远只是善良的守卫者，而必须学会在必要时成为威慑混乱、压住风暴的力量。"

 shou_mission_four:0 "星的考验：师父之后的那一步"
 shou_mission_four_desc:0 "基础建设逐渐恢复，命莲寺终于有余裕去问更深的问题：若白莲不在眼前，星是否已经足以独当一面？这不是能力的试炼，而是信念的最后确认。"

 nazrin_mission_one:0 "娜兹玲的考验：宝藏与真相"
 nazrin_mission_one_desc:0 "娜兹玲的鼻子与鼠群早已能在废墟里翻出一切有价值的东西。可白莲要她找回的，不只是物资，也是能让国家重新运转的秩序与真实。"

 nazrin_mission_two:0 "娜兹玲的考验：冷硬的回收"
 nazrin_mission_two_desc:0 "有些重建必须带着铁与血的味道。娜兹玲若要替命莲寺收拢资产，就必须证明自己能把最不近人情的脏活，做成整个国家得以延续的根基。"

 nazrin_mission_two_part_2:0 "娜兹玲的考验：甜点与募资"
 nazrin_mission_two_part_2_desc:0 "并不是每一份资源都得从废墟里翻出来。白莲要娜兹玲试着用另一种更柔软、也更麻烦的方法，把命莲寺的善意与资金一同带进人群之中。"

 nazrin_mission_three:0 "娜兹玲的考验：众鼠归心"
 nazrin_mission_three_desc:0 "当情报、资产与耳目都慢慢织成网络，娜兹玲也将不再只是替命莲寺补漏洞的那个人。她必须证明，自己已经能成为维系国家暗面秩序的真正支柱。"

 nazrin_mission_four:0 "娜兹玲的考验：留在星的身边"
 nazrin_mission_four_desc:0 "白莲看得很清楚，娜兹玲的终点从来不只是能力被承认，而是她终于愿意承认自己的心归向何处。若她能走到这里，就代表那只警惕的老鼠，终于为自己找到可以停下来的地方。"

 ichirin_mission_one:0 "一轮的考验：从布道到建设"
 ichirin_mission_one_desc:0 "一轮已经学会站在人前说话，但白莲要她更进一步。理想若不能落进工地、仓储与生产线，那就只会停在口号里。现在，她要去把经文变成现实。"

 ichirin_mission_two:0 "一轮的考验：克己与修心"
 ichirin_mission_two_desc:0 "一轮并不是毫无裂痕的僧人。她的怀疑、迟疑与脆弱都还在。白莲要她在真正繁重的现实里完成一次更深的修练：不是装作清净，而是带着挣扎，仍把背脊挺直。"

 ichirin_mission_two_part_2:0 "一轮的考验：走入尘土"
 ichirin_mission_two_part_2_desc:0 "百姓看见的从来不是经文，而是人。若一轮能带着自己的不体面继续去面对众生，她也许反而会成为命莲寺最接地气、最能被人理解的一位弟子。"

 ichirin_mission_three:0 "一轮的考验：把净土种在地上"
 ichirin_mission_three_desc:0 "田野、阳光、农具与汗水，这些最朴素的东西，也能成为修心的一部分。白莲要一轮证明，人间净土不是高悬的幻景，而是能够被一寸寸做出来的世界。"

 ichirin_mission_four:0 "一轮的考验：走出自己的佛法"
 ichirin_mission_four_desc:0 "当一轮真的带着疑问、责任与人间的泥土一路走到这里，她也将不再只是白莲身后的弟子，而会成为能以自己的方式诠释佛法、承载佛法的人。"

 murasa_mission_one:0 "水蜜的考验：把船驶向世界"
 murasa_mission_one_desc:0 "白莲要水蜜做的，不只是救援与镇压，而是带着圣辇船去见世界各国。一个危险的亡灵，必须学会用自己手中的船与旗，去替命莲寺宣告慈悲与和平。"

 murasa_mission_two:0 "水蜜的考验：压住溺亡之欲"
 murasa_mission_two_desc:0 "水蜜最大的敌人不是外界，而是自己。她若想继续留在白莲身边，就必须学会正面面对那股会把人拖下水底的本能，而不是任由它支配一切。"

 murasa_mission_two_part_2:0 "水蜜的考验：向深处坠去"
 murasa_mission_two_part_2_desc:0 "有些时候，亡灵的旧伤与怨恨会先于理智开口。若水蜜在这条路上失败，她便会再次被自己最黑暗的本能拖回水底，让命莲寺面对最残酷的问题。"

 murasa_mission_three:0 "水蜜的考验：掌舵者"
 murasa_mission_three_desc:0 "无论她心中还有多少阴影，只要手掌握着舵轮，水蜜就是命莲寺最可靠的船长。白莲希望她把那份危险，慢慢磨成能够带众人穿过风浪的力量。"

 murasa_mission_four:0 "水蜜的考验：未完成的救赎"
 murasa_mission_four_desc:0 "水蜜的路还远没有走完。白莲并不要求她立刻成为无害的好人，只希望她继续完成这场漫长而艰难的课题，让共存不只是纸上的空愿。"

 kyouko_mission_one:0 "响子的考验：把声音送得更远"
 kyouko_mission_one_desc:0 "响子的声音不该只停在命莲寺院墙之内。白莲希望她把这份热诚与回响送向更远的地方，让需要帮助的人知道路在哪里，让想伸手的人知道自己能做什么。"

 kyouko_mission_two:0 "响子的考验：被喜欢的资格"
 kyouko_mission_two_desc:0 "响子想让大家都喜欢自己，也想让更多人因她而靠近命莲寺。可真正的亲近并不只来自热闹，也来自她能否在正确的时候，把自己的善意放到别人最需要的地方。"

 kyouko_mission_two_part_2:0 "响子的考验：学会安静"
 kyouko_mission_two_part_2_desc:0 "响子的声音不是总能救场。若她始终分不清时机与场合，再真诚的好话也会变成刺耳的噪音。白莲希望她学会，什么时候该喊，什么时候该先听。"

 kyouko_mission_three:0 "响子的考验：从开心果到弟子"
 kyouko_mission_three_desc:0 "响子已经把温暖带给许多人，可她不能永远只停在这里。白莲要她更进一步：读经、修心、承担工作，让她从春风一样的孩子，慢慢长成命莲寺的新一代栋梁。"

 kyouko_mission_four:0 "响子的考验：把声音留给明天"
 kyouko_mission_four_desc:0 "当响子终于学会热情、判断与修行并存，她也将不再只是白莲救下的小妖怪，而会成为能继续替人类与妖怪发声、让共存理念延续下去的人。"

 decision_make_china_puppet:0 "以慈悲接管中华"
 decision_make_china_puppet_desc:0 "白莲知道，若想让和平真正扩散到更远的地方，光靠命莲寺一地是不够的。若中华愿意归于这面旗帜之下，那么命莲寺的秩序也将第一次真正跨出幻想乡。"

 decision_puppet_every_asia_country:0 "接管中华"
 decision_puppet_every_asia_country_desc:0 "圣白莲并不把国家看作单纯可征服的土地，而看作仍可能被引向和平的群体。若亚洲诸国愿意接受命莲寺的秩序，那么这艘船便会驶向更大的海域。"

 decision_puppet_every_democratic_country:0 "以和平感召诸国"
 decision_puppet_every_democratic_country_desc:0 "有些国家更容易理解白莲的道路，因为它们至少仍愿意承认民意、承认协商、承认人与人之间并非只能彼此踩踏。命莲寺将向这些国家伸出手，把共存的理念推向更广阔的世界。"



KYO_hijiri_world_revolution:0 "佛教和平革命"
KYO_hijiri_world_revolution_desc:0 "命莲寺不再等待世界自行痊愈。我们将传教、交涉、施压、缔结连带，并最终整合那些接受救赎之道的国家。"

KYO_hijiri_goodwill_mission:0 "对[FROM.GetName]宣扬佛教善意"
KYO_hijiri_goodwill_mission_desc:0 "派出耗费庞大的僧侣、组织者、教师与救援人员任务团。他们的工作将提升外国对我们的善意，使日后建立傀儡政权的行动更可能成功。"

KYO_hijiri_attempt_peaceful_puppet_major:0"对[FROM.GetName]宣扬佛教善意"

KYO_hijiri_prepare_puppet_network:0 "筹备救赎网络"
KYO_hijiri_prepare_puppet_network_desc:0 "在另一个国家能被纳入我们的势力圈之前，必须先建立使节管道、地方联络人，以及纪律严明的势力网络。"

KYO_hijiri_attempt_peaceful_puppet:0 "要求[FROM.GetName]和平归顺"
KYO_hijiri_attempt_peaceful_puppet_desc:0 "尝试将目标转化为我们的傀儡国。较高的好感度会提升成功机率。若尚未整合的傀儡国过多，其他国家将会变得更难控制。"

KYO_hijiri_integrate_puppet_stage_one:0 "对[FROM.GetName]开始渐进整合"
KYO_hijiri_integrate_puppet_stage_one_desc:0 "将低整合度的[FROM.GetName]推入更深层的行政关系。"

KYO_hijiri_integrate_puppet_stage_two:0 "完成[FROM.GetName]的整合"
KYO_hijiri_integrate_puppet_stage_two_desc:0 "完成渐进整合程序，并吞并已整合的[FROM.GetName]。这将减少由傀儡网络所造成的部分外交恐惧。"

KYO_hijiri_unlock_goodwill_decisions_tt:0 "解锁决议，用以提升外国对§Y幻想乡§!的好感度。"
KYO_hijiri_prepare_puppets_tt:0 "解锁傀儡化尝试前所需的准备决议。"
KYO_hijiri_unlock_puppet_decisions_tt:0 "解锁目标决议，用以和平傀儡化其他国家。成功率取决于好感度与目前的傀儡负担。"
KYO_hijiri_unlock_integration_stage_1_tt:0 "解锁傀儡整合的第一阶段。"
KYO_hijiri_unlock_integration_stage_2_tt:0 "解锁傀儡整合与吞并的最终阶段。"
KYO_hijiri_unlock_anti_fascist_war_goal_tt:0 "在完成数次傀儡化行动后，解锁反法西斯战争目标国策。"
KYO_hijiri_unlock_anti_communist_war_goal_tt:0 "在完成更多傀儡化行动后，解锁反共产主义战争目标国策。"
KYO_hijiri_puppet_success_tt:0 "目标接受傀儡地位。尚未整合的傀儡国数量将增加，降低未来行动的成功机率。"
KYO_hijiri_puppet_failed_tt:0 "目标抵抗了我们的施压，对我们的好感度下降。"
KYO_hijiri_integration_finished_tt:0 "该傀儡国已被完全整合。未来的傀儡化尝试将承受较少负担。"

KYO_hijiri_buddhist_goodwill:0 "佛教善意使团"
KYO_hijiri_failed_puppet_pressure:0 "抵抗命莲寺政治施压"







    civil_war_overcharge_combat:0 "末日征召"
    civil_war_overcharge_combat_desc:0 "凡在我境内有气息者，皆要被点名；凡能抬起石、握住刃、搬运粮秣者，皆不可推辞。妇人、少者、白发者，同列军籍，如同城墙最后的砖。\n我们不求退路，只求终局；直到号角止息，旗帜折断，仇敌与我同归尘土。"

    civil_war_buring_the_road:0 "焚路之令"
    civil_war_buring_the_road_desc:0 "看哪，我们行过之处，不留麦穗，也不留井泉；凡可供敌者，必先化为灰。仓廪要倒空，桥梁要折断，田地要焚烧，使追兵得不著饼，马得不著草。\n我们将道路点燃，如同在大地写下咒诅：宁使此土一时荒凉，不使仇敌以其果实续命。"

    civil_war_deadless_attack:0 "不死之冲"
    civil_war_deadless_attack_desc:0 "看哪，众人同声呼喊，便向前奔走，如洪水决堤，不问归路，也不问存亡。凡迟疑者心必溃散，凡退却者名必蒙羞；惟有向前者，得以把恐惧踏在脚下。\n他们以血肉撞开敌阵，以怒吼压过炮声，直到仇敌的队列碎裂，或我军尽归于尘土。"

    civil_war_twenty_four_work_time:0 "24小时工作制"
    civil_war_twenty_four_work_time_desc:0 "昼夜不再分开；日光与灯火同作一日。凡有手能握锤者，凡有眼能辨图者，皆要轮番而作，不可停歇。工坊的门不闭，炉火不熄，机轮如心跳般连续转动。\n因战时的需要如饥渴临到，片刻的安歇都成奢侈；我们要以疲惫换取钢铁，以黑夜换取弹药，直到号角止息，或直到身体也归于尘土。"

    civil_war_brainwash:0 "强制洗脑"
    civil_war_brainwash_desc:0 "看哪，话语要像铁锁扣在众人的心上；耳要被封，口要被教，眼只许看见同一种光。凡疑惑者必被指为不洁，凡追问者必被称为背叛。\n我们要立一条声音，刻一种记忆，使人忘记昨日的自己，只记得今日的命令；直到众人同心同舌，战争便再无迟疑。"

  civil_war_bad_youkai:0 "束妖之律"
    civil_war_bad_youkai_desc:0 "看哪，凡心随嗜欲奔走、以血气自夸者，必使军纪败坏，使民心离散。故今立律令：约束妖怪之行，不可擅自掠夺，不可私行吞噬，不可因怒而屠戮；凡离队扰民者，必受审问。\n\n你们要记念：刀剑可夺城池，却夺不得人心；若放纵如野火，终必烧及己身。惟有克制者得以成军，惟有守法者得以立国，使我众不因自身的狂暴而先行崩解。"

  civil_war_battle_guide:0 "战场之法度"
    civil_war_battle_guide_desc:0 "看哪，刀剑既出，仍须有法度在手。故今立交战之准则，使我众不因忿怒而滥杀，不因贪欲而扰民；凡擅自屠戮降者与伤者、夺取非军需之物、焚毁无辜之居所者，必受追究。\n\n行军当有节制，守备当有次序，俘虏当有看管，战利当有登记。因无法度之军如野火，烧尽仇敌，也烧尽自身；惟守准则者，能使兵心合一，使民心不散，使战争仍有边界可止。"

  civil_war_instant_repair:0 "即刻修补"
    civil_war_instant_repair_desc:0 "看哪，桥折于河，轨断于野，道路满是碎石；若军行其上，必致迟滞，如羊迷途。故我发令：召匠人、役夫与搬运者，使铁与木不再沉默；以火光照夜，以槌声代号令。\n\n凡倒塌者，当扶起；凡裂开者，当缝合；凡被焚者，当重立。使补给之路再通，使工坊之轮再转，使我军不因残缺而败退。"

  civil_war_martial_law:0 "战区戒严令"
  civil_war_martial_law_desc:0 "看哪，刀兵临近，城门之内不可再如常日；故我立戒严之令，使诸街有守，使诸口有检。凡夜行者，必受盘问；凡聚众者，必被驱散；凡传谣者，必受审察；凡抗命者，必受刑罚。\n\n粮仓与工坊归于军用，道路与桥梁归于军管；出入皆需文书，往来皆听号角。因若无严令，乱象如虫生于朽木，必啃噬军心；惟以律法束民，以军纪束众，使后方不乱，前线得以站立。"

  civil_war_banned_art:0 "禁忌的艺术"
  civil_war_banned_art_desc:0 "看哪，在红月之下，封印之门被开，古老的技艺再度启封；其名不可轻呼，其形不可久视。恶魔要在黑暗中聚会，与死亡共舞；火与硫磺如雨降下，哀号充满街巷。\n\n凡人如草，朝生暮枯；气息一断，便归尘土。毁灭就在眼前，审判在门口；你们当知道，人都终将一死，无一人能逃。惟有今夜所行，将在来日成为咒诅，或成为末日的印记。"

  civil_war_seija_last_chance:0 "颠倒之末时"
    civil_war_seija_last_chance_desc:0 "看哪，有一恶魔在凡间行走，不断地煽动众人，使他们厌弃旧律，轻看法度；他口中吐出反叛之言，如火点燃枯草。\n\n他要带领人们破坏秩序，拆毁门闩与界线，使君不再为君，仆不再为仆；上者被拉下，下者被推上；正被称为邪，邪被称为正。世界的规律要被翻转，日月的次序要被颠倒，万事都要被革命，直到尘土腾起，城邑倾覆，众人方知末时已至。"

  civil_war_in_the_name_of_yukari:0 "以紫之名"
  civil_war_in_the_name_of_yukari_desc:0 "看哪，八云紫既曾行走于世，她口中的一句、手中的一举，都被称为上帝所许的旨意；她所立的界线如同诫命，她所留下的安排如同预言。虽然她如今不在众人眼前，她的名却仍在黑夜与烽烟之上发光。\n\n使徒八云蓝与橙不作旁顾，便要背负那名而行；将紫的言语传于城邑，将紫的秩序传于军中，使众人记念、遵行、不可偏离。凡疑惑者要被劝戒，凡背离者要被斥责；因他们说：这不是人的道路，乃是紫所指示的道路。\n\n纵使世界震动、城墙崩裂、万物倾覆，他们仍要宣告：即便天地改换，亦不可放下此名；宁可叫烈火吞噬大地，也要使「紫之旨意」被成全。"














  the_civil_war_start_timer:0 "崩线之刻"
  the_civil_war_start_timer_desc:0 "内战开始。这不是一场可以旁观的风波，而是一场覆地的灾年：水退之后必留淤泥，火熄之后必剩焦黑。\n\n没人能逃脱，因路都被切断；没人能度过，因岁月只会把伤口磨深。城有城的塌，乡有乡的空，妖有妖的亡，人有人的绝。\n\n若要说结果，便只有一句最冷的常理：这里没有赢家，只有幸存者。"

  the_civil_war_destory_all:0 "崩溃的边缘"
  the_civil_war_destory_all_desc:0 "已至临界，堤防将决。月之都所求的最后一块拼图，也在此刻扣上缺口。接下来不再是战争，而是灾变：如洪水漫堤，如旱魃噬田，如瘟疠过境。\n\n所谓「净化」，在凡人耳中听来像救赎，在地上看来却是尘埃覆城、血水入河。污秽被洗去的那一刻，许多名字也会一并被洗去。"

  the_civil_war_cheak_for_seija:0 "革命之火的熄灭"
  the_civil_war_cheak_for_seija_desc:0 "曾经照亮夜路的火舌，终究被风雪压灭。喧嚣停了，口号散了，街巷只剩灰与未竟的怨。革命最残酷之处，不在于燃起，而在于熄灭后还要活下去，面对一地的碎瓦与无人认领的代价。"

  the_civil_war_cheak_for_remilia:0 "吸血鬼霸权的终结"
  the_civil_war_cheak_for_remilia_desc:0 "猩红的旌旗终于垂地，如同暮色里的残云。昔日以威严压城的铁蹄停了，宫廷的乐声也停了，只剩空杯与空座。\n\n霸权的终结不带浪漫，它更像山崩后的沉寂：留下被踏碎的街道、被撕裂的臣民，以及一个再也回不到『高贵』的时代。"

  the_civil_war_cheak_for_chen:0 "贤者遗愿的散落"
  the_civil_war_cheak_for_chen_desc:0 "贤者的遗愿并非一纸文书，而是用多年平衡换来的薄冰。如今薄冰裂了，碎片漂散在各处水面。\n\n有人捡起碎片当作护符，有人拿去割人喉，有人干脆丢进泥里。遗愿不是被否定，而是被现实磨碎：越想守住它，越被碎片割得满手是血。"

  the_civil_war_cheak_for_hijiri:0 "大同理想的沉没"
  the_civil_war_cheak_for_hijiri_desc:0 "大同曾被说得像春水，能润万物；可战乱一起，春水也会被血染。理想不是错，只是太慢，慢到追不上饥荒、炮火与恐惧。\n\n当寺钟仍响，却再也唤不回人心，便明白这不是辩论的失败，而是灾年里的常理：人在绝境，先求活命，后谈慈悲。"

  the_civil_win_political_available:0 "妖怪内战的胜利者"
  the_civil_win_political_available_desc:0 "胜利者立于废墟之上，脚下不是台阶，是瓦砾与焦土。旗帜仍能升起，号令仍能传达，但每一道命令都带著余震。\n\n因这场内战没有真正的凯旋，只有灾后的清点：多少城池成了空壳，多少族群失了根，多少名字被写进失踪册。胜者所得，是一个必须立刻修补、却再也无法回到从前的幻想乡。"

  





  destory_number_go_up_10:0 "§R毁灭度§!§B上升§!§Y10§!"
  destory_number_go_up_40:0 "§R毁灭度§!§B上升§!§Y40§!"

  destory_number_go_down_10:0 "§R毁灭度§!下降§Y10§!"
  destory_number_go_down_5:0 "§R毁灭度§!下降§Y5§!"

 


 prestige_random_event_part_1:0 "红魔馆的台前逸闻"
prestige_random_event_part_1_desc:0 "在这座府邸里，连一次茶会、一句闲话、一道目光，都会变成权力的回声。"

prestige_random_event_part_2:0 "红魔馆的幕后波澜"
prestige_random_event_part_2_desc:0 "帷幕之后从不安静。宠信、失衡、试探与冷落，都在悄悄改写红魔馆的统治秩序。"

prestige_system_value_change_monthly:0 "每月权威浮动"
prestige_system_value_change_monthly_desc:0 "威严不会凭空而来。每过一个月，表现、风评与主人的偏好，都会让红魔馆诸位成员的地位重新洗牌。"


scarlet_prestige_sakuya:0 "咲夜的治理才能"
scarlet_prestige_sakuya_desc:0 "十六夜咲夜最可怕的地方，从来不只是战斗，而是她能把混乱压成秩序。文书、调度、配给、统筹，在她手里都能被整理成近乎完美的流程。红魔馆的行政效率将越强，也将为政权持续带来更多§Y政治点数§!。"

scarlet_prestige_meiling:0 "美铃的门卫风采"
scarlet_prestige_meiling_desc:0 "红美铃站在门前，不只是守门，更像替整座红魔馆把人心稳住。她的可靠、亲和与武人的气势，会让更多人愿意追随红魔馆，也让更多人相信这座政权值得依附。红魔馆便越能动员更多§Y人力§!。"

scarlet_prestige_remilia:0 "蕾米莉亚的威慑"
scarlet_prestige_remilia_desc:0 "蕾米莉亚的统治建立在敬畏之上。她的名字、她的红雾、她那种高高在上的吸血鬼王权，都会让臣属低头、让敌人迟疑。政权内部稳定，民众对战争的接受度越强，提高§Y稳定度§!与§Y战争支持度§!。"

scarlet_prestige_flandre:0 "芙兰的童话传说"
scarlet_prestige_flandre_desc:0 "芙兰朵露的存在像一则黑暗童话：美丽、稚气、怪诞，却又危险得让人不敢深想。关于她的传闻越是扩散，敌人内部就越难维持平静。让敌对国家越容易陷入恐慌与不安，从而降低其§Y稳定度§!与§Y战争支持度§!。"

scarlet_prestige_patchouli:0 "帕秋莉的学识"
scarlet_prestige_patchouli_desc:0 "帕秋莉·诺蕾姬掌握的不是普通知识，而是能直接转化为战争优势的答案。魔法理论、工业模型、实验技术、战术支援，她的学识会不断推动红魔馆变得更强。红魔馆将获得§Y科研速度加成§!。"


 scarlet_prestige_sakuya_1:0 "银笔与账册"
scarlet_prestige_sakuya_1_desc:0 "从库房清点到文书归档，从配给统计到名单誊录，先让人们看见十六夜咲夜最基础、也最可怕的一面：她能把一团烂账整理成一份毫无破绽的答案。"

scarlet_prestige_sakuya_2:0 "女仆长的礼法"
scarlet_prestige_sakuya_2_desc:0 "进一步强调咲夜在接待、仪态与宫廷礼节上的支配力。她不只是会做事，更知道该让谁先开口、谁该低头、谁连站姿都不配出错。"

scarlet_prestige_sakuya_3:0 "刻在钟面上的安排"
scarlet_prestige_sakuya_3_desc:0 "宣扬咲夜对时间与流程的近乎偏执的掌控。宴会、巡查、补给、传令与调度全都被排进正确的刻度里，像整座红魔馆都在照着她的秒针呼吸。"

scarlet_prestige_sakuya_4:0 "让失序无处落脚"
scarlet_prestige_sakuya_4_desc:0 "高调塑造咲夜作为秩序本身的形象。她所到之处，混乱会被压平，拖延会被切断，任何想在红魔馆内部钻空子的行为，最终都会撞上她整理好的墙。"

scarlet_prestige_sakuya_5:0 "完美即为答案"
scarlet_prestige_sakuya_5_desc:0 "将咲夜塑造成无人可以替代的完美女仆长。她不再只是高效、优雅或严谨，而是红魔馆统治机器里最精密的一枚核心零件——她的存在本身，就是完美的行政。"

 scarlet_prestige_meiling_1:0 "门前的笑容"
scarlet_prestige_meiling_1_desc:0 "先让人们记住红美铃最容易被忽视、却也最难替代的一面：她站在门前，先说话，再出手。那份从容、亲切与分寸，本身就是红魔馆对外的第一张脸。"

scarlet_prestige_meiling_2:0 "拳脚之间的体面"
scarlet_prestige_meiling_2_desc:0 "进一步强调美铃作为武人的风范。她不是只会把人打出去，更懂得什么时候该拦、什么时候该让、什么时候该用一记足够漂亮的胜利替红魔馆争面子。"

scarlet_prestige_meiling_3:0 "气行如墙"
scarlet_prestige_meiling_3_desc:0 "宣扬美铃对气的运用与稳固防线的能力。她一旦认真，门口就不再只是门口，而是一道真正的边界；风能过去，人不能。"

scarlet_prestige_meiling_4:0 "温柔的守护者"
scarlet_prestige_meiling_4_desc:0 "高调塑造美铃那种少见的双重气质：她能挡下敌人，也会对来客留一步台阶。强大不是为了欺负弱者，而是为了让门后的秩序不必时时见血。"

scarlet_prestige_meiling_5:0 "红魔馆之盾"
scarlet_prestige_meiling_5_desc:0 "将美铃塑造成红魔馆最稳固的防线。她的名字不只代表帅气的武斗家，也代表可靠、厚重与足以让人安心的守护——只要她还站着，门就不会失守。"


scarlet_prestige_remilia_1:0 "幼月垂临"
scarlet_prestige_remilia_1_desc:0 "先让人们重新习惯抬头仰望蕾米莉亚。她不需要长篇大论，只需要站在高处，让那份属于吸血鬼贵族的傲慢与美丽先压下来。"

scarlet_prestige_remilia_2:0 "鲜红的威压"
scarlet_prestige_remilia_2_desc:0 "进一步强调蕾米莉亚令人窒息的压迫感。她的披风、她的目光、她那种像在俯视玩具般的语气，都会让旁人先一步学会噤声。"

scarlet_prestige_remilia_3:0 "红雾中的王座"
scarlet_prestige_remilia_3_desc:0 "宣扬蕾米莉亚与红雾、夜色和支配感绑定的统治形象。她不只是一个领袖，而是会让整片空间都变得像她领地的存在。"

scarlet_prestige_remilia_4:0 "命运也该低头"
scarlet_prestige_remilia_4_desc:0 "高调塑造蕾米莉亚那种近乎狂妄的王权叙事：她不是接受命运的人，而是要把命运掰弯的人。她的统治，因此带着一种不容辩驳的侵略性。"

scarlet_prestige_remilia_5:0 "鲜红女王"
scarlet_prestige_remilia_5_desc:0 "将蕾米莉亚塑造成真正不可挑战的鲜红女王。她的名字不再只是红魔馆之主，而是足以让国家低头、让军队颤抖、让夜晚本身都像在替她加冕的象征。"


scarlet_prestige_flandre_1:0 "水晶羽翼的孩子"
scarlet_prestige_flandre_1_desc:0 "先从最温和、也最危险的地方开始——让人们知道红魔馆里有一位像童话插图一样漂亮的妹妹。至于那份漂亮背后藏着什么，暂时先不说明。"

scarlet_prestige_flandre_2:0 "高塔里的小公主"
scarlet_prestige_flandre_2_desc:0 "进一步把芙兰包装成一则被高塔、锁与秘密包裹起来的故事。她像公主，也像灾厄，越是不被看见，就越容易在流言里长出魅力。"

scarlet_prestige_flandre_3:0 "糖果屋里的危险"
scarlet_prestige_flandre_3_desc:0 "让芙兰的形象开始带上更明显的黑童话气息：甜美、稚气、引人靠近，可一旦走错一步，糖霜下面藏着的就不再是点心，而是牙齿。"

scarlet_prestige_flandre_4:0 "梦境深处的妹妹"
scarlet_prestige_flandre_4_desc:0 "高调把芙兰塑造成类似爱丽丝梦游仙境般的存在。她像从梦里走出来的孩子，逻辑和情绪都不太属于正常世界，因此既可爱得让人放松，也危险得让人发冷。"

scarlet_prestige_flandre_5:0 "最美丽的坏结局"
scarlet_prestige_flandre_5_desc:0 "将芙兰彻底定格为一则完整的黑暗童话：她是结局里最夺目的角色，是红魔馆最被宠爱的妹妹，也是所有人最不想真正惹怒的那一个。"


scarlet_prestige_patchouli_1:0 "书页之间的低语"
scarlet_prestige_patchouli_1_desc:0 "先让人们记住帕秋莉最基础的权威：她总坐在书后，却什么都知道。图书馆里的每一页翻动声，都会慢慢把她的名字传出去。"

scarlet_prestige_patchouli_2:0 "禁书的分类法"
scarlet_prestige_patchouli_2_desc:0 "进一步强调帕秋莉对知识的整理与支配能力。她不是单纯地收藏书，而是在给危险分级、给秘术编号、给整个禁忌世界排出秩序。"

scarlet_prestige_patchouli_3:0 "七色魔法使的研究"
scarlet_prestige_patchouli_3_desc:0 "宣扬帕秋莉在术式、实验与魔法理论上的深度探索。她的价值不只在于知道答案，更在于她能把未知拆开，再亲手把它做成新的答案。"

scarlet_prestige_patchouli_4:0 "大图书馆中枢"
scarlet_prestige_patchouli_4_desc:0 "高调塑造帕秋莉作为知识中枢的地位。物资、工业、魔法、封印、研究，一切最终都会绕回她的桌面，而她会把混乱重新写成可执行的方案。"

scarlet_prestige_patchouli_5:0 "人形图书馆"
scarlet_prestige_patchouli_5_desc:0 "将帕秋莉塑造成红魔馆中无人可以替代的知识化身。她不再只是管理图书馆的人，而是图书馆本身——一座会呼吸、会思考、也会把世界读懂后重新写下的人形书库。"



 KYO_lunar_invasion_warning_category:0 "月都入侵倒数"
 KYO_lunar_invasion_warning_category_desc:0 "八云紫复出后，月都需要约两年完成对地表主要国家的控制。倒数归零时入侵自动爆发；提前完成“抢在月都之前”可先制开战并取得六个月增益。"
 KYO_lunar_invasion_countdown:0 "月都入侵准备完成"
 KYO_lunar_invasion_countdown_desc:0 "§R730日后，月都将控制地表主要国家并向幻想乡发动入侵。§!\n\n可在倒数前完成§Y抢在月都之前§!，主动开始战争并获得§G180日先发制人增益§!。"



 KYO_lunar_campaign_category:0 "月面决战指挥部"
 KYO_lunar_campaign_category_desc:0 "地表战争开始后即可查看，但只有完成国策§Y打开通往月面的间隙§!后才会正式启动。每轮持续60天；月都期望值保留原有动态计算与难度选择，并在最终计算时额外§G降低6点§!。进攻值X严格大于防卫值T时进攻方获胜，X=T由防守方获胜。玩家取得第3胜时，月都阵营将向尚未交战的独立国家全面宣战；第4胜时美国解除控制。先取得6胜的一方结束本次系列。"

 KYO_lunar_reconstruction_category:0 "月都重建与秘封后日谈"
 KYO_lunar_reconstruction_category_desc:0 "终战后的工作分九个阶段推进，每一项需35日。玩家决定何时继续，不再由一个事件自动弹出整条后日谈。"

 KYO_love_story_category:0 "落日誓约：可选故事"
 KYO_love_story_category_desc:0 "这些生活故事彼此独立。你可以选择任意篇章，也可以全部忽略。"

 KYO_yukari_archive_category:0 "八云紫的档案"
 KYO_yukari_archive_category_desc:0 "玲未档案与秘封旧档各项目推进。完成一项开启下一项。"

