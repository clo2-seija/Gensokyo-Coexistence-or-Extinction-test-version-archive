 five_precepts_progressbar_category:0 "五戒之舵"
 five_precepts_progressbar_category_desc:0 "白莲很清楚，命莲寺若想把战后的幻想乡重新带回正轨，光靠慈悲与愿望远远不够。国家就像一艘穿过风浪的船，众弟子各自握住不同的绳索与船桨，而真正校正方向的人，始终是圣白莲。\n\n不杀生、不偷盗、不邪淫、不妄语、不饮酒——这五戒并不只是僧人的清规，更是战后政权的自我约束，是命莲寺试图把妖怪、人类、国家与理想重新接到一起的五条底线。\n\n每一次调整，都是一次取舍；每一次前进，也都意味着另一处必须收束。白莲要做的，不是让所有人立刻完美无缺，而是在摇晃与偏离之中，一点一点把整艘船重新带回能够通向共存的航道。"

 five_precepts_progressbar_daily_add:0 "测试：五戒精进"
 five_precepts_progressbar_daily_add_desc:0 "临时提升五戒进度，用于测试命莲寺内部的修行与国家变化。"

 five_precepts_progressbar_daily_decrease:0 "测试：五戒退转"
 five_precepts_progressbar_daily_decrease_desc:0 "临时降低五戒进度，用于测试命莲寺内部的修行与国家变化。"

 decision_peace_and_honest:0 "以诚换和"
 decision_peace_and_honest_desc:0 "白莲校正国家方向时，往往不能让所有美德同时增长。想让众生少受伤害、让局势更趋平和，就必须先牺牲一部分过度尖锐的“真实”。和平上升，而直言的锋利便要暂时收束。"

 decision_honest_and_lust:0 "以正压欲"
 decision_honest_and_lust_desc:0 "当命莲寺选择更坦率、更清明地面对国家与众生时，许多失控的欲念也会被压回去。让众人学会诚实地面对自己，本身就是对白莲之道的一次靠拢。"

 decision_lust_and_wine:0 "以净制醉"
 decision_lust_and_wine_desc:0 "欲望若能被约束，沉迷与放纵自然也会跟着退潮。白莲要的不是强行斩断众生的一切本能，而是让那些会拖垮国家的放纵，慢慢回到可被克制的范围。"

 decision_wine_and_peace:0 "以醉消争"
 decision_wine_and_peace_desc:0 "有时候，国家并不是靠最理智的方式稳下来，而是靠暂时宣泄与松绑，让压抑的情绪先退一步。放纵会增长，平和却会因此削弱。白莲很清楚，这种调整从来不是长久之计，只是风浪中短暂的偏舵。"

