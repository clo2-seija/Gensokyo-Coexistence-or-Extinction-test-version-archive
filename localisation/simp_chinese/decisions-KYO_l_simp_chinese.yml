 KYO_lunar_issue_reconstruction_edict:0 "新月都的敕令"
 KYO_lunar_issue_reconstruction_edict_desc:0 "纯化院就此废除，月兔与地表出生者获得同等居民权。纯净从此不得决定谁有资格存在。"

 KYO_lunar_define_common_sky:0 "为共同星空立约"
 KYO_lunar_define_common_sky_desc:0 "生命可以改变，离去仍有意义，科学与幻想也无须互相抹除。战后的月都必须容纳这些答案。"

 KYO_lunar_return_home:0 "联军踏上归途"
 KYO_lunar_return_home_desc:0 "一道道间隙在月海上打开，将幸存者送回各自的故乡。百妖协议也将放下军令，转而修复战争留下的世界。"

 KYO_lunar_science_and_fantasy:0 "允许未知存在"
 KYO_lunar_science_and_fantasy_desc:0 "观测可以追问未知，结界也会为未知保留容身之处。科学与幻想不再把彼此视为必须消除的错误。"

 KYO_lunar_reconcile_merry:0 "两个名字，一段人生"
 KYO_lunar_reconcile_merry_desc:0 "在成为八云紫的那一天，梅莉并未消失。少女与贤者不是互相取代的两个人，而是同一段漫长人生的两种名字。"

 KYO_lunar_same_starry_sky:0 "同一片星空下"
 KYO_lunar_same_starry_sky_desc:0 "紫在古老星图上补下最后一个坐标。她不知道昔日的同行者能否看见，却终于写下迟到了数千年的答案。"

 KYO_lunar_route_epilogue:0 "旅途的最后一页"
 KYO_lunar_route_epilogue_desc:0 "地表报告、月面记录与秘封手稿被放在一起。紫合起折扇，第一次望向一个不再需要她为战争计算的明天。"

