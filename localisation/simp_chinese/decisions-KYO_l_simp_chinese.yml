l_simp_chinese:
 Youkai_japan_war:"第一次人妖大战" 

 Youkai_Eirin:"妖兔医疗辅助军"

 Youkai_Tengu:"天狗侦察部队支援"

 Youkai_Fairy:"妖精隐形部队奇袭"

 Youkai_grassroot:"普通妖怪们的胜利"

 Youkai_Satori:"古明地姊妹亲自出场"

 Youkai_nitori:"河童日以继夜的工作"

 Youkai_Youkari:"八云紫亲自出场"

  the_end_of_japan_youkai_war:0"战斗或者灭绝"


 GSK_indproj_civ_1:0 "[FROM.GetName]地区民用工业扩建"
 GSK_indproj_civ_1_desc:0 "河童们拖来机床、锅炉与一箱箱外界拆解零件，山童则在地基旁测量土层、加固支柱，把原本零散的工坊串成一片可用的生产区。等烟囱升起、传送带转动后，[FROM.GetName]将新增建设空间，并建立一座民用工厂，让工具、建材与日用品能稳定流入市场。"

 GSK_indproj_civ_2:0 "[FROM.GetName]大型民用工业扩建"
 GSK_indproj_civ_2_desc:0 "这不是一座孤零零的工坊，而是一整片新工业街区。河童负责铺设动力管线与机械骨架，山童开凿仓库、整平道路，妖精们在材料堆之间来回传话，让整个工地像被点燃般忙碌起来。完成后，[FROM.GetName]将追加更多建设空间，并建立两座民用工厂，使地方生产力与商业流通一同起飞。"

 GSK_indproj_mil_1:0 "[FROM.GetName]地区军工扩建"
 GSK_indproj_mil_1_desc:0 "河童将旧式锻炉改造成标准化军工产线，山童则把厚重钢材与火药仓安置进加固厂房。铁锤声、测试射击声与搬运车轮声在[FROM.GetName]轮番响起，象征这片土地正式被纳入战时生产体系。工程完成后，当地将追加建设空间，并建立一座军用工厂。"

 GSK_indproj_mil_2:0 "[FROM.GetName]大型军工扩建"
 GSK_indproj_mil_2_desc:0 "一条更庞大的军工产线将在[FROM.GetName]展开。河童们日夜校准压床、装配台与弹药检测装置，山童则深入地下修建安全仓库与运输通道，确保原料能进、成品能出、爆炸不会把整片工地掀上天。完成后，当地将追加更多建设空间，并建立两座军用工厂，成为支撑前线的重要兵工核心。"

 GSK_indproj_infrastructure:0 "[FROM.GetName]地区基础建设工程"
 GSK_indproj_infrastructure_desc:0 "道路被拓宽，桥梁被加固，原本泥泞难行的路段被山童一段段重新夯实。河童则在沿线铺设排水沟、简易维修站与货物转运点，让车队、补给队与巡逻队都能更快通过。工程完成后，[FROM.GetName]将提升一级基础建设，使人流、货流与军需调度都变得更加顺畅。"

 GSK_indproj_resource_prospecting:0 "[FROM.GetName]地区资源探勘"
 GSK_indproj_resource_prospecting_desc:0 "山童带著探针与矿灯钻入岩层深处，河童则在地表架起分析仪、蒸汽吊车与临时冶炼炉。她们敲开石壁、记录矿脉走向，从泥土、溪谷与废坑中寻找能支撑工业的财富。工程完成后，[FROM.GetName]将展开资源探勘，并依地区特性发现不同种类的可开采资源。"

 GSK_indproj_special_facility:0 "[FROM.GetName]特殊研究设施建设"
 GSK_indproj_special_facility_desc:0 "这项工程需要比普通工厂更严密的规划。河童负责安装精密仪器、隔离装置与实验用动力系统，山童则修筑厚重墙体、地下管线与安全通道，将整片区域改造成能承受高风险研究的封闭设施。当最后一道符札与警戒门落下后，[FROM.GetName]将建成对应的特殊研究设施，为更深层的技术突破开辟道路。"






 KYO_industry_projects:0 "百业兴造"
 KYO_industry_projects_desc:0 "从河道工坊到山路诊所，从矿坑到兵工厂，各地都被卷入一场热火朝天的建设潮。河童、山童、天狗、鬼族、妖精与人类工匠一齐上阵，让沉寂的土地重新响起机器、叫卖与财富流动的声音。"

 GSK_indproj_282_civ_1:0 "河湾机巧工坊"
 GSK_indproj_282_civ_1_desc:0 "荷取把旧水车改成了连轴机床，妖精们抱着螺丝和图纸在脚手架间飞来飞去。新的民用工坊拔地而起，木材、陶器与农具开始成批流入市场，这片地方一下子热闹了起来。"

 GSK_indproj_282_mil_2:0 "鸦羽军械长廊"
 GSK_indproj_282_mil_2_desc:0 "射命丸文把这里吹成了“最快完工的军需奇迹”，犬走椛则真的把工地守得滴水不漏。两座军需工厂昼夜开工，枪械与弹药滚滚下线，连周边小贩都跟着赚了个盆满钵满。"

 GSK_indproj_1018_mil_1:0 "护持兵器所"
 GSK_indproj_1018_mil_1_desc:0 "山门外不再只有钟声，也有铁锤与风箱的轰鸣。工匠们在僧众与妖怪护持下建立起兵器作坊，新的军需工厂让这片土地第一次拥有了稳定而像样的武装生产能力。"

 GSK_indproj_1018_civ_1:0 "晨钟商作区"
 GSK_indproj_1018_civ_1_desc:0 "清晨的钟声一响，木匠、裁缝、粮商便一起开门营业。新的民用工厂带动仓储、运输与摊贩聚集，原本安静的地段如今成了能生钱、能养人的热闹街区。"

 GSK_indproj_1019_civ_2:0 "秋收加工带"
 GSK_indproj_1019_civ_2_desc:0 "秋穰子忙着盯粮仓，秋静叶则把风干、储藏与包装流程理得清清楚楚。两座民用工厂落成后，粮食不再只是收上来就完事，而是能被加工、出售、换成更多财富与岗位。"

 GSK_indproj_1019_civ_1:0 "丰谷合作社"
 GSK_indproj_1019_civ_1_desc:0 "丰收不该只停在田里，于是新的合作工坊被建了起来。谷物、果干和粗加工食品开始稳定出货，让农户、脚夫和商队全都跟着有饭吃、有钱赚。"

 GSK_indproj_1020_civ_1:0 "山口集散新街"
 GSK_indproj_1020_civ_1_desc:0 "原本只是路口，如今却长出了仓库、作坊与摊位。新建的民用工厂成了商路的第一颗钉子，把过路的货流直接变成了本地的生意与税收。"

 GSK_indproj_1020_mil_1:0 "白狼预备军械库"
 GSK_indproj_1020_mil_1_desc:0 "椛带着白狼天狗巡过一遍又一遍，确保每一箱军火都能按时入库。新的军需工厂让防线后方终于有了像样的补给点，士兵安心，周边的运输业也跟着红火起来。"

 GSK_indproj_526_civ_1:0 "溪畔木工联合会"
 GSK_indproj_526_civ_1_desc:0 "河边原本只有潮气和木屑，现在多了成排的锯台与仓棚。民用工厂带动了木材加工、家具制作和工具修理，连附近酒馆的生意都被工人们一并养活了。"

 GSK_indproj_526_mil_1:0 "鬼火锻造棚"
 GSK_indproj_526_mil_1_desc:0 "勇仪亲自来了一趟，扛着铁料像扛柴火一样随手就扔进炉边。新的军需工厂在鬼族的豪快劳作下迅速成形，产出的不只是兵器，还有一股让人相信“真能打下去”的气势。"

 GSK_indproj_528_mil_2:0 "疾风火炮总装线"
 GSK_indproj_528_mil_2_desc:0 "天狗们把山风和工序一样算得极准，零件从上坡运来，炮架从下坡送走，连装配都像在打一场演练。两座军需工厂使这里成了真正的火力核心，订单和军资一起暴涨。"

 GSK_indproj_528_civ_1:0 "云上贸易站"
 GSK_indproj_528_civ_1_desc:0 "文在高处拍照写稿，商人们则在下面抢摊位、谈价格。新建的民用工厂为这片高地带来了仓储与加工能力，山上的货终于能更快地变成山下的钱。"

 GSK_indproj_529_civ_1:0 "夜灯手工业街"
 GSK_indproj_529_civ_1_desc:0 "夜里不再冷清，灯火一亮，小店和作坊便一间接一间开门。新的民用工厂让纺织、食品和日用品生产稳定下来，整条街都像突然学会了自己生长。"

 GSK_indproj_529_mil_2:0 "赤焰炼钢军需局"
 GSK_indproj_529_mil_2_desc:0 "鬼族负责最重最脏的活，河童则把炉温和模具调到近乎苛刻。两座军需工厂一开，钢铁不再只是原料，而是源源不断的枪管、炮架与压得住局势的硬实力。"








 GSK_indproj_524_resource_coal:0 "鬼族煤层开采"
 GSK_indproj_524_resource_coal_desc:0 "勇仪一挥手，矿坑里的懒散气立刻没了影。煤层被整片打开，矿车来回轰响，不只是燃料多了，连周边工坊、炉窑和运输行都被这一波黑金热潮带着往上冲。"

 GSK_indproj_525_infrastructure:0 "永远亭急救干线"
 GSK_indproj_525_infrastructure_desc:0 "这条路修的不是表面热闹，而是命。道路、桥梁与补给节点一并整备后，永远亭的药箱、担架和医师能更快赶到各处，病患活得下来，工人也更敢放开手脚去干大工程。"

 GSK_indproj_527_resource_steel:0 "天狗炼钢岭"
 GSK_indproj_527_resource_steel_desc:0 "天狗把山体勘得清清楚楚，椛负责封锁危险地段，文则已经开始写“钢铁腾飞”的号外。铁矿被更高效地采出，炼钢规模随之扩大，整片地区像被注入了一股硬邦邦的底气。"

 GSK_indproj_1028_resource_steel:0 "地下熔铁计划"
 GSK_indproj_1028_resource_steel_desc:0 "矿脉深处又闷又热，可越是这样的地方，越藏得住真正值钱的东西。新的采掘与冶炼组织把铁资源成批拉出地底，为兵工、建筑和铁路全都补上了一口硬气。"

 GSK_indproj_1029_resource_tungsten:0 "山岩钨芯矿"
 GSK_indproj_1029_resource_tungsten_desc:0 "山童们沿着岩缝一点点往里凿，终于把这条坚硬到让人骂娘的钨矿脉掏了出来。它难挖，却也值钱得很，先进工业和军备都因这批稀有资源而真正有了升级的本钱。"

 GSK_indproj_1030_infrastructure:0 "白狼巡逻公路"
 GSK_indproj_1030_infrastructure_desc:0 "椛要的不是一条普通的路，而是一条能让巡逻、补给和救护车一起飞起来的硬路。公路修通后，永远亭的药品能更快送达，商队也跑得更勤，安全与生意一起往上抬。"

 GSK_indproj_1031_infrastructure:0 "鸦天狗空运塔群"
 GSK_indproj_1031_infrastructure_desc:0 "天狗把高塔、索道和信号点一口气串成了网，文甚至夸张地说“连风都被我们编入了后勤”。基础设施改善后，伤员后送、紧急送药和高价值物资转运都快得惊人，这地方因此真正活络起来。"

 GSK_indproj_537_resource_oil:0 "地底燃油井"
 GSK_indproj_537_resource_oil_desc:0 "河童把钻机搬进来时，所有人都觉得她们疯了；等黑油真从地里冒出来，所有人又立刻觉得她们是天才。燃料一多，机器、车辆和发电全都更有底气，经济也跟着踩下了油门。"

 GSK_indproj_633_infrastructure:0 "秋穰子粮运干道"
 GSK_indproj_633_infrastructure_desc:0 "粮食最怕烂在半路上，所以这条路从一开始就兼顾仓储、运输和沿线补给。秋穰子满意地看着车队一批批过去，而永远亭设下的简易医疗站也让劳工与商旅少了许多后顾之忧。"

 GSK_indproj_645_infrastructure:0 "命莲寺救护驿路"
 GSK_indproj_645_infrastructure_desc:0 "这不是单纯修路，而是把安置、救援与流通接成一条命脉。路修好后，伤员能更快送到治疗点，物资也能更稳地抵达周边聚落，原本沉闷的地方逐渐恢复了人气与买卖声。"

 GSK_indproj_646_infrastructure:0 "妖怪山山隧网络"
 GSK_indproj_646_infrastructure_desc:0 "山童最擅长的就是把“不可能通”变成“今天就能走”。一段段隧道和山路被打通后，天狗巡逻更快，商队绕行更少，连急救与军运都比以前顺畅得多。"

 GSK_indproj_647_resource_aluminium:0 "风穴轻金属矿"
 GSK_indproj_647_resource_aluminium_desc:0 "风穴深处的轻金属矿终于被系统开发出来，河童们高兴得像捡到宝。铝材一多，航空、机械和轻型工业全都跟着受益，这地方也因此从偏僻资源点摇身一变成了抢手地盘。"

 GSK_indproj_648_infrastructure:0 "人里保健与道路整修"
 GSK_indproj_648_infrastructure_desc:0 "新铺的道路、新设的桥梁和沿路的诊疗点一起落成，人里的日常因此重新变得可靠。永远亭的医药支援不再难以及时抵达，商货也流得更快，街市跟着一日比一日热闹。"

 GSK_indproj_684_infrastructure:0 "鬼族重车通道"
 GSK_indproj_684_infrastructure_desc:0 "鬼族嫌原来的路太窄、太慢、太没劲，于是干脆直接拓宽、加固、重修。重车通道一打通，矿石、钢材和大型设备都能顺利通过，沿线还顺带设下救护与休整点，整片区域的运力猛地上了一个台阶。"

 GSK_indproj_745_infrastructure:0 "边境联络线"
 GSK_indproj_745_infrastructure_desc:0 "这条线把哨所、仓库、诊所和集市串成了一体。天狗负责信息传递，永远亭补上医疗支援，路一修通，过去要拖上好几天的事如今能在一天内跑完，边境也终于像个真正会呼吸的地方。"

 GSK_indproj_609_resource_coal:0 "旧矿复燃工程"
 GSK_indproj_609_resource_coal_desc:0 "废弃多时的矿坑重新亮起了灯，黑乎乎的煤块一车接一车往外运。煤炭复产不只喂饱了锅炉和熔炉，也把附近的工坊、货站与小饭馆一并养活，老地方一下又有了生气。"


 GSK_indproj_645_infrastructure:0 "救护驿路"
 GSK_indproj_645_infrastructure_desc:0 "这不只是修一条路，更是把安置、救援与流通连成一条不断线的命脉。慧音帮忙统筹沿线聚落的人手与物资，妹红则亲自带队清障、护送伤员。道路一通，病患能更快送到治疗点，货车也能更稳地跑起来，原本沉闷的地带终于重新亮起了灯火。"

 GSK_indproj_530_civ_2:0 "生活消费工业圈"
 GSK_indproj_530_civ_2_desc:0 "从糖果、布匹到餐具与灯具，两座新的民用工厂一下把整片区域带热了。三月精今天偷搬材料、明天乱贴广告，闹得鸡飞狗跳，却也让开张的气氛格外热烈。原本只被少数人享用的精致货物，如今成了能带动就业、贸易与街市繁荣的真正产业。"

 GSK_indproj_530_civ_1:0 "玻璃与布匹厂"
 GSK_indproj_530_civ_1_desc:0 "布卷、玻璃器皿和包装箱在流水线上一件件成形，原本零散的小作坊终于被整合成了能稳定出货的工厂。三月精时不时溜进仓库捣点小乱，可等成车商品真的驶出厂门时，谁都看得出来，这地方的钱路已经被彻底打通了。"

 GSK_indproj_531_civ_1:0 "工学试制作坊"
 GSK_indproj_531_civ_1_desc:0 "图纸不再只是压在案头的空想，而是一件件变成机器、器具和能卖钱的成品。小伞总能从旧物和废料里翻出奇怪却好用的灵感，让试作少走不少弯路。研究和量产被真正接起来后，知识终于不只是漂亮话，而是能自己生出利润的本事。"

 GSK_indproj_531_mil_1:0 "标准兵装厂"
 GSK_indproj_531_mil_1_desc:0 "每个箱号、每份记录、每一道工序都被反复核对，连螺丝与铆钉都要按规矩摆放。映姬对着质检报告一句一句挑问题，硬是把整座军需工厂逼成了讲秩序、讲精度的样子。结果也很直接：产量稳、损耗低、仓储清清楚楚，谁看了都得承认这是一笔漂亮账。"

 GSK_indproj_532_civ_2:0 "人里扩建计划"
 GSK_indproj_532_civ_2_desc:0 "木匠、瓦工、商人和学徒全都被卷进了这场热火朝天的建设潮。慧音帮着协调人手和日程，确保街区扩建不是一团乱麻。两座民用工厂一落地，人里立刻从“勉强过日子”跨进了“能做生意、能养更多人”的新阶段，街上的吆喝声都比以前响亮了不少。"

 GSK_indproj_532_mil_1:0 "守备军械处"
 GSK_indproj_532_mil_1_desc:0 "这座军需工厂不是为了摆气派，而是为了让关卡、巡逻队和地方守备真正拿到可靠装备。妹红对样品最直接，不合手的当场就扔回去重做；琪露诺则带着一群妖精在工地附近瞎忙，却意外把搬运和传递做得飞快。等第一批军械发下去时，连周边的铁匠和运输队都跟着忙了起来。"

 GSK_indproj_533_mil_2:0 "武备联合厂"
 GSK_indproj_533_mil_2_desc:0 "这两座军需工厂不是哪一家大人物的门面，而是底层自己一点点拼出来的硬本事。有人盯质量，有人催进度，有人负责在吵起来时把场子重新压回正轨。小伞把旧零件翻新再用，普通妖怪们则把能省的、能修的、能做的全都抓在手里，硬是把这地方做成了真能打、真能撑的根据地。"

 GSK_indproj_533_civ_1:0 "互助合作市场"
 GSK_indproj_533_civ_1_desc:0 "没人等着别人施舍，缺工具就凑，缺人手就顶，缺地方就自己搭棚。新的民用工厂带动了市集、仓储和一大批小商贩，三月精还时不时在摊位间乱窜，闹得热闹非凡。钱开始在最底层的人群里流动后，这地方终于有了翻身的样子。"

 GSK_indproj_534_mil_2:0 "综合兵站群"
 GSK_indproj_534_mil_2_desc:0 "这两座军需工厂和兵站一体运转，讲究的就是一个快字。妹红带队护运，妖精四处传信，货物今天还在后方仓里，明天就已经能送到前线门口。补给线一稳，战争机器才算真正转了起来，连周边做木箱、修车轮、运粮草的人都跟着吃上了这波红利。"

 GSK_indproj_534_mil_1:0 "补给锻炉"
 GSK_indproj_534_mil_1_desc:0 "铁料、木料、火药和配件被按顺序送进炉边，再一件件打成前线最缺的东西。映姬对流程抓得很严，谁敢偷工减料就得当场挨训；琪露诺和妖精们则在工地上跑前跑后，把本来慢吞吞的传递硬是催快了一截。新的军需工厂不仅供养了前线，也带活了整片地方的工匠与买卖。"

 GSK_indproj_535_mil_1:0 "边境应急军械点"
 GSK_indproj_535_mil_1_desc:0 "这里不追求花样，只求东西来得快、修得快、发得快。军需工厂一建成，边境哨所缺什么就能立刻补什么，旧库存再也不用被硬生生撑到报废。妹红偶尔亲自试用新货，几句够不够硬、够不够狠，比一整页报告都更有说服力。"

 GSK_indproj_535_civ_1:0 "边贸工坊区"
 GSK_indproj_535_civ_1_desc:0 "往来客商、短程运输和小型加工在这里慢慢拧成了一股劲。新的民用工厂让边境不再只是个过路点，而是真能留住钱、留住人、留住活计的地方。慧音还帮着把沿线的秩序重新理顺，让这股热闹不至于一下乱成一锅粥。"

 GSK_indproj_536_civ_2:0 "泥地翻身工程"
 GSK_indproj_536_civ_2_desc:0 "曾经被嫌弃的烂地方，如今被一铲一铲挖成了工地、仓棚和新街区。两座民用工厂拔起来后，商贩、工人和搬运队一拥而入，连琪露诺都觉得这里“终于有点像样了”。泥地没变少多少，可这片地方已经真的能自己赚钱、自己养活更多人了。"

 GSK_indproj_536_mil_1:0 "突击兵器厂"
 GSK_indproj_536_mil_1_desc:0 "这座军需工厂讲究的就是直接：先做能立刻上战场的，再谈别的。妹红对这种风格最看得顺眼，试枪、验刀、看装药，一样不落；妖精们则负责跑腿送件，把杂乱的工地闹得反而有种异样的效率。火药味越来越重，可附近人的饭碗也跟着越来越稳。"


 GSK_indproj_555_infrastructure:0 "基层互助交通网"
 GSK_indproj_555_infrastructure_desc:0 "没有什么惊天动地的口号，只有一锹土、一块木板、一段一段慢慢接起来的路。有人传信，有人搬料，有人守夜，有人沿线搭起简易补给与救护点。等这套互助交通网真正成形后，原本闭塞又贫瘠的地方，总算也能把人流、货流和生气一点点带起来。"

  GSK_indproj_282_land_facility:0 "地上战备工事"
 GSK_indproj_282_land_facility_desc:0 "营舍、靶场、仓廪与演练用地将被一并整理起来，原本散乱的空地会被修成一处真正能承载军势的战备区域。木桩被打入泥土，符札贴上围栏，运输车与搬运妖怪来来去去，让这片土地渐渐有了“备战”该有的样子。"

 GSK_indproj_1082_air_facility:0 "天穹飞行场"
 GSK_indproj_1082_air_facility_desc:0 "新的飞行设施将于此兴建。跑道会被平整，塔台会被立起，机库与整备场也将逐步完工。等到风向标、照明与引导结界一同运转时，这里便不再只是仰望天空的地方，而会成为真正让羽翼、机械与妖力共同升空的起点。"

 GSK_indproj_530_nuclear_facility:0 "深层核能工区"
 GSK_indproj_530_nuclear_facility_desc:0 "这项建设不会喧哗，却注定沉重。厚重的外壁、封闭的通路、层层叠叠的警戒区与核心设施都会被一点点筑起，像把灼热而危险的力量封进大地深处。等反应炉真正开始运转时，这里将成为一处沉默却无法忽视的工区，让整片地区都围绕着它的光与热重新转动起来。"


