l_simp_chinese:
 KYO_youkai_beast_battalion:0 "妖兽妖怪群"
 KYO_youkai_beast_battalion_desc:0 "由拥有兽形与强韧体魄的妖怪组成。其机动方式类似骑兵，速度稍慢，却能承受更多伤亡。"
 KYO_blood_spawn_battalion:0 "血奴"
 KYO_blood_spawn_battalion_desc:0 "以数量与异常生命力维持战线的血之眷属。生命值与组织度极高，但几乎不具备可靠的进攻能力。"
 KYO_fairy_battalion:0 "妖精群"
 KYO_fairy_battalion_desc:0 "廉价、易于补充的轻型步兵。战斗能力全面弱于正规步兵，但只需较少人力、装备与补给。"
 KYO_white_wolf_tengu_battlegroup:0 "白狼天狗战斗群"
 KYO_white_wolf_tengu_battlegroup_desc:0 "训练严苛的全地形特种部队，擅长山地、渡河与两栖进攻，并可参加空降作战。其装备成本和训练时间都极为高昂。"
 KYO_ghost_battalion:0 "幽灵战斗群"
 KYO_ghost_battalion_desc:0 "不受肉体完全束缚的快速步兵。移动迅捷、补给需求较低，但难以长期维持严密阵形，组织度也较低。"
 KYO_wind_magician_battalion:0 "风系魔法使部队"
 KYO_wind_magician_battalion_desc:0 "以风刃与结界拦截空中目标的战斗法师，承担防空炮兵的职责。突破能力优异，但生命值、组织度与防御较低。"
 KYO_fire_magician_battalion:0 "火系魔法使部队"
 KYO_fire_magician_battalion_desc:0 "以大范围爆燃法术替代常规炮击的战斗法师。火力与突破优于普通炮兵，却不适合承担防御任务。"
 KYO_lightning_magician_battalion:0 "雷系魔法使部队"
 KYO_lightning_magician_battalion_desc:0 "利用高能雷击贯穿装甲目标的战斗法师，承担反坦克炮兵的职责。攻击与突破强大，自身却十分脆弱。"
 KYO_water_magician_battalion:0 "水系魔法使部队"
 KYO_water_magician_battalion_desc:0 "以连续水压冲击与术式弹幕替代火箭炮的战斗法师。拥有猛烈的软攻击与突破能力，但防御和持续作战能力较差。"
 KYO_tsukumogami_motorized_battalion:0 "付丧神机动队"
 KYO_tsukumogami_motorized_battalion_desc:0 "由车辆、器械及其付丧神共同组成的摩托化部队。速度快、防御高，却因对自身毁灭的恐惧而拥有很低的生命值。"
 KYO_beast_spirit_mechanized_battalion:0 "畜生灵机动群"
 KYO_beast_spirit_mechanized_battalion_desc:0 "依附于机械化载具高速突击的畜生灵。机动与攻击能力高于普通机械化步兵，但防御与生命值较低。"

 KYO_kappa_engineer_maintenance_company:0 "河童工兵维修连"
 KYO_kappa_engineer_maintenance_company_desc:0 "兼具工兵与维修连能力的河童技术队。能够筑垒、克服复杂地形、提高可靠性并回收装备，代价是更多支援装备、车辆与补给。"
 KYO_oni_overseer_company:0 "鬼族督军队"
 KYO_oni_overseer_company_desc:0 "以绝对威压维持占领秩序的鬼族督军，其镇压能力远胜普通宪兵。"
 KYO_rabbit_medical_company:0 "妖兔医疗连"
 KYO_rabbit_medical_company_desc:0 "熟悉妖怪生理与战场药学的妖兔医疗队。能够挽回更多伤员、保存部队经验并提高生命值，但会显著增加补给消耗。"
 KYO_crow_tengu_recon_company:0 "鸦天狗侦察群"
 KYO_crow_tengu_recon_company_desc:0 "将高速空中侦察与战场通信结合的鸦天狗部队，同时提高侦察与主动性。其人员训练和装备成本都十分昂贵。"
 KYO_youkai_fox_logistics_company:0 "妖狐后勤连"
 KYO_youkai_fox_logistics_company_desc:0 "由妖狐重新编组的后勤连。功能与基础后勤连相同，负责降低部队的补给与燃料消耗。"

 KYO_tsukumogami_armor_module:0 "付丧神装甲"
 KYO_tsukumogami_armor_module_short:0 "付丧神装甲"
 KYO_tsukumogami_armor_module_desc:0 "让装甲、传动机构与车体意识彼此连结。坦克会主动保护自身并配合乘员，因而获得更高装甲、防御、突破、速度与可靠性；代价是更高的生产成本与燃料消耗。"

