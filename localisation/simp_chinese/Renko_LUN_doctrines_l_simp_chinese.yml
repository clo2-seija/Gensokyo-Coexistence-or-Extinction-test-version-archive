 Renko_LUN_infiltration_tactics_Renko_nightly_assaults_desc:0 "夜间突袭"
 Renko_LUN_infiltration_tactics_Renko_self_sustaining_infiltration_units:0 "自给自足的渗透部队"
 Renko_LUN_infiltration_tactics_Renko_self_sustaining_infiltration_units_desc:0 "自给自足的渗透部队"
 Renko_LUN_infiltration_tactics_Renko_terrain_and_situation_assessment:0 "地形与态势评估"
 Renko_LUN_infiltration_tactics_Renko_terrain_and_situation_assessment_desc:0 "地形与态势评估"
 Renko_LUN_infiltration_tactics_Renko_infiltration_in_depth:0 "深度渗透作战"
 Renko_LUN_infiltration_tactics_Renko_infiltration_in_depth_desc:0 "深度渗透作战"
 Renko_LUN_infiltration_tactics:0 "月人纵深渗透"
 Renko_LUN_infiltration_tactics_desc:0 "在地上人察觉以前，月都的人员便已进入它们的权力中枢。战场上的渗透同样需要耐心：查清哨位、保存隐蔽、等待各处分队同时行动。\n\n借夜色接近，以波长通信协调突击，在敌军来得及重整之前切入纵深。正面炮火响起时，侵军应当已经站在防线的另一侧。"
 Renko_LUN_infiltration_tactics_add_mastery_bonus_effect_tooltip:0 "获得§Y月人纵深渗透§!学说精通度增长加成。"
 Renko_LUN_new_base_strike:0 "月人航空制海"
 Renko_LUN_new_base_strike_desc:0 "地上的海洋分隔诸国，也承载着它们的军队与补给。远征军要使月都的敕令通行于地表，便须先掌握这些航路。\n\n舰载机从海上出击，潜艇监视远洋，水面舰队护送后续兵力抵达。敌人的港口、舰队与沿岸据点，都将进入同一场有次序的打击。"
 Renko_LUN_long_range_submarines_Renko_ocean_patrols:0 "超远洋巡逻"
 Renko_LUN_long_range_submarines_Renko_ocean_patrols_desc:0 "超远洋巡逻"
 Renko_LUN_long_range_submarines_Renko_improved_dive_protocols:0 "紧急下潜演练"
 Renko_LUN_long_range_submarines_Renko_improved_dive_protocols_desc:0 "紧急下潜演练"
 Renko_LUN_long_range_submarines_Renko_support_the_surface:0 "主力舰队支援战术"
 Renko_LUN_long_range_submarines_Renko_support_the_surface_desc:0 "主力舰队支援战术"
 Renko_LUN_long_range_submarines_Renko_stowage_efficiency:0 "潜艇积载效率"
 Renko_LUN_long_range_submarines_Renko_stowage_efficiency_desc:0 "潜艇积载效率"
 Renko_LUN_long_range_submarines_Renko_deep_water_supremacy:0 "深海优势"
 Renko_LUN_long_range_submarines_Renko_deep_water_supremacy_desc:0 "深海优势"
 Renko_LUN_long_range_submarines:0 "月人远洋潜航"
 Renko_LUN_long_range_submarines_desc:0 "地上的舰队可以封锁港口，却难以看清远洋深处。月都的潜航部队将在漫长航路上监视敌舰，为主力舰队寻找接近与攻击的时机。\n\n航程、隐蔽与积载必须服从长期远征的需要。让敌人每一次出海，都无法确定水下是否已有月都的兵器在等待。"
 Renko_LUN_long_range_submarines_add_mastery_bonus_effect_tooltip:0 "获得§Y月人远洋潜航§!学说精通度增长加成。"
 Renko_LUN_torpedo_primacy_Renko_modern_broadsides:0 "现代舷侧鱼雷发射管"
 Renko_LUN_torpedo_primacy_Renko_modern_broadsides_desc:0 "现代舷侧鱼雷发射管"
 Renko_LUN_torpedo_primacy_Renko_coordinated_fire_patterns:0 "果敢突袭"
 Renko_LUN_torpedo_primacy_Renko_coordinated_fire_patterns_desc:0 "果敢突袭"
 Renko_LUN_torpedo_primacy_Renko_dedicated_torpedo_task_forces:0 "鱼雷指挥舰"
 Renko_LUN_torpedo_primacy_Renko_dedicated_torpedo_task_forces_desc:0 "鱼雷指挥舰"
 Renko_LUN_torpedo_primacy_Renko_improved_escort_role:0 "潜望镜识别"
 Renko_LUN_torpedo_primacy_Renko_improved_escort_role_desc:0 "潜望镜识别"
 Renko_LUN_torpedo_primacy_Renko_task_force_integration:0 "特遣舰队整合"
 Renko_LUN_torpedo_primacy_Renko_task_force_integration_desc:0 "特遣舰队整合"
 Renko_LUN_torpedo_primacy:0 "月人雷击至上"
 Renko_LUN_torpedo_primacy_desc:0 "庞大的舰体并不能使地上舰队免于沉没。屏卫舰须在夜色中维持队形，按统一号令把鱼雷送入敌舰必经的水域。\n\n观察、接近、齐射与转向必须衔接准确。月都要求每艘小舰清楚自己的位置，让一支舰队的意志通过整齐的雷迹显现。"
 Renko_LUN_torpedo_primacy_add_mastery_bonus_effect_tooltip:0 "获得§Y月人雷击至上§!学说精通度增长加成。"
 Renko_LUN_massed_carrier_fleet_Renko_deep_operative_support:0 "远洋力量投送"
 Renko_LUN_massed_carrier_fleet_Renko_deep_operative_support_desc:0 "远洋力量投送"
 Renko_LUN_massed_carrier_fleet_Renko_carrier_independence:0 "航母独立性"
 Renko_LUN_massed_carrier_fleet_Renko_carrier_independence_desc:0 "航母独立性"
 Renko_LUN_massed_carrier_fleet_Renko_crew_shifts:0 "机组轮班制"
 Renko_LUN_massed_carrier_fleet_Renko_crew_shifts_desc:0 "机组轮班制"
 Renko_LUN_massed_carrier_fleet_Renko_efficient_rearming:0 "高效再装填"
 Renko_LUN_massed_carrier_fleet_Renko_efficient_rearming_desc:0 "高效再装填"
 Renko_LUN_massed_carrier_fleet_Renko_unceasing_airpower:0 "不间断制空权"
 Renko_LUN_massed_carrier_fleet_Renko_unceasing_airpower_desc:0 "不间断制空权"
 Renko_LUN_massed_carrier_fleet:0 "月人航母集群"
 Renko_LUN_massed_carrier_fleet_desc:0 "远征的航路不会因为一轮空袭便向月都敞开。舰载航空兵必须轮番出击，让敌舰在重整、补给与撤退时仍然受到追击。\n\n甲板上的整备、机组的轮替与护航舰的行动都须围绕下一批起飞的战机安排。海面上的浮动据点，将把月都的进攻延伸到更远的海岸。"
 Renko_LUN_massed_carrier_fleet_add_mastery_bonus_effect_tooltip:0 "获得§Y月人航母集群§!学说精通度增长加成。"
 Renko_LUN_battleship_antiair_screen_Renko_all_seas_anti_aircraft:0 "远海防空"
 Renko_LUN_battleship_antiair_screen_Renko_all_seas_anti_aircraft_desc:0 "远海防空"
 Renko_LUN_battleship_antiair_screen_Renko_efficient_navigation:0 "高效导航"
 Renko_LUN_battleship_antiair_screen_Renko_efficient_navigation_desc:0 "高效导航"
 Renko_LUN_battleship_antiair_screen_Renko_broad_air_cover:0 "空袭探测优先"
 Renko_LUN_battleship_antiair_screen_Renko_broad_air_cover_desc:0 "空袭探测优先"
 Renko_LUN_battleship_antiair_screen_Renko_inaccessible_skies:0 "禁飞空域"
 Renko_LUN_battleship_antiair_screen_Renko_inaccessible_skies_desc:0 "禁飞空域"
 Renko_LUN_battleship_antiair_screen_Renko_capital_screens:0 "主力舰防空掩护"
 Renko_LUN_battleship_antiair_screen_Renko_capital_screens_desc:0 "主力舰防空掩护"
 Renko_LUN_battleship_antiair_screen:0 "月人主力防空"
 Renko_LUN_battleship_antiair_screen_desc:0 "地上的飞行员也会寻找航母与运输队的破绽。主力舰必须以观测和防空火力守住舰队上空，使远征的航路不被一次突袭截断。\n\n各舰相互掩护，炮位依令转向。在月都的舰载机返回以前，舰队中央必须始终留有能够安全接应她们的位置。"
 Renko_LUN_battleship_antiair_screen_add_mastery_bonus_effect_tooltip:0 "获得§Y月人主力防空§!学说精通度增长加成。"
 Renko_LUN_new_operational_integrity:0 "月人空域统合"
 Renko_LUN_new_operational_integrity_desc:0 "月都已经把眼线、中继站与观测网络布置在地上。情报送入指挥机关以后，还须由航空部队将地图上的坐标变成战场上的优势。\n\n制空、护航与轰炸遵循统一调度，让每一批进入地表的部队都能得到空中接应。月面下达的命令，必须越过云层，落实到敌人的阵地上。"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_decoy_tactic:0 "空战巡逻"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_decoy_tactic_desc:0 "空战巡逻"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_three_plane_formation:0 "月兔交错掩护"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_three_plane_formation_desc:0 "以交错航线相互掩护，让追逐单机的敌人进入同伴的攻击位置。"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_aggressive_spirit:0 "海军王牌"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_aggressive_spirit_desc:0 "海军王牌"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_naval_expertise:0 "战机护航目标定位"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_naval_expertise_desc:0 "战机护航目标定位"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_all_weather_operations:0 "全天候运行"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_all_weather_operations_desc:0 "全天候运行"
 Renko_LUN_air_subdoctrine_fighter_central_field:0 "月人制空协同"
 Renko_LUN_air_subdoctrine_fighter_central_field_desc:0 "月兔熟悉的波长通信将用于空中编队，使分散的战机能够及时回应同伴与舰队的呼叫。飞行员必须同时知道敌机的位置和友军的处境。\n\n以交错掩护保持队形，在云层与海面上争夺观察先机。月都的王牌应当带回整支编队，而不只是一份个人战果。"
 Renko_LUN_air_subdoctrine_fighter_central_field_add_mastery_bonus_effect_tooltip:0 "获得§Y月人制空协同§!学说精通度增长加成。"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_port_strikes:0 "浅水鱼雷"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_port_strikes_desc:0 "浅水鱼雷"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_low_level_attack_runs:0 "浪顶攻击飞行"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_low_level_attack_runs_desc:0 "浪顶攻击飞行"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols:0 "增派巡逻"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols_desc:0 "增派巡逻"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training:0 "全天候训练"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training_desc:0 "全天候训练"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery:0 "熟练舰艇袭击"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery_desc:0 "熟练舰艇袭击"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics:0 "月人航空雷击"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_desc:0 "地上舰队把港湾视作屏障，把波涛视作掩护。月都的航空兵将反复校准进攻航线，寻找舰艇在近岸和远洋暴露的空隙。\n\n巡逻机送回目标，雷击机贴近海面，护航战机掩护接敌。投下鱼雷以前，每支编队都必须清楚自己的航向与归路。"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_add_mastery_bonus_effect_tooltip:0 "获得§Y月人航空雷击§!学说精通度增长加成。"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes:0 "广泛使用可抛副油箱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes_desc:0 "广泛使用可抛副油箱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover:0 "全方位阵型防守"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover_desc:0 "全方位阵型防守"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors:0 "全面的飞行员训练"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors_desc:0 "全面的飞行员训练"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting:0 "战斗机引诱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting_desc:0 "战斗机引诱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce:0 "省油专家"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce_desc:0 "省油专家"
 Renko_LUN_air_subdoctrine_long_range_escort:0 "月人远程护航"
 Renko_LUN_air_subdoctrine_long_range_escort_desc:0 "随着地表据点向外延伸，航空部队也将离开熟悉的机场与海岸。护航机必须把受保护的航路延续到目标上空，再把同伴带回。\n\n航线、油料与相互掩护一并列入飞行计划。即使远离月都的白色据点，远征军也不应在返航途中失去接应。"
 Renko_LUN_air_subdoctrine_long_range_escort_add_mastery_bonus_effect_tooltip:0 "获得§Y月人远程护航§!学说精通度增长加成。"
