 Renko_LUN_air_cavalry_Renko_rescue_liasions:0 "救援联络官"
 Renko_LUN_air_cavalry_Renko_rescue_liasions_desc:0 "救援联络官"
 Renko_LUN_air_cavalry_Renko_transport_assault:0 "运输-突击协同"
 Renko_LUN_air_cavalry_Renko_transport_assault_desc:0 "运输-突击协同"
 Renko_LUN_air_cavalry_Renko_intervention_units:0 "干涉部队"
 Renko_LUN_air_cavalry_Renko_intervention_units_desc:0 "干涉部队"
 Renko_LUN_air_cavalry:0 "月人空中骑兵"
 Renko_LUN_air_cavalry_desc:0 "连接月面的通道能够送来军队，却不能代替每一处前线的侦察、救援与运输。先遣队离开据点后，仍须有人越过断桥与拥塞的道路接应她们。\n\n旋翼部队沿波长通信指引的方向行动，把观察员、医护与增援送到侵军身边，使月都的指挥能够跟上地表战线的推进。"
 Renko_LUN_air_cavalry_add_mastery_bonus_effect_tooltip:0 "获得§Y月人空中骑兵§!学说精通度增长加成。"
 Renko_LUN_streamlined_deployment_Renko_streamlined_armored_layout:0 "装甲编制简化"
 Renko_LUN_streamlined_deployment_Renko_streamlined_armored_layout_desc:0 "装甲编制简化"
