 Renko_LUN_commandos_Renko_security_zone_operations_desc:0 "分散单位协同"
 Renko_LUN_commandos_Renko_rigorous_training_regimen:0 "严格训练"
 Renko_LUN_commandos_Renko_rigorous_training_regimen_desc:0 "严格训练"
