KYO_hongmoguandexingdongfangan:0 "红魔馆的行动方案"
KYO_hongmoguandexingdongfangan_desc:0 "百妖协议可以统整各方的意见，却无法凭空变出一支能够撕开敌军防线的军队。\n\n八云紫因此决定前往红魔馆。那座长年笼罩于红雾与夜色中的洋馆，拥有幻想乡最接近正规军的组织：红美铃维持纪律严明的守备，十六夜咲夜能把庞杂的调度整理得毫无缝隙，帕秋莉掌握足以改变战场环境的大型魔法，而馆中使魔也早已习惯服从单一意志。\n\n最重要的，仍是蕾米莉亚·斯卡蕾特本人。她任性、傲慢，从不掩饰自己对支配与胜利的渴望。若能让她将目光投向结界彼端，红魔馆便可能成为百妖军最锋利的矛。\n\n紫将亲自踏入红魔馆，听听那位幼小的夜之王准备如何迎接一场真正的战争。"

KYO_yongyuantingdezhongliguancha:0 "永远亭的医疗支援"
KYO_yongyuantingdezhongliguancha_desc:0 "战争不会只在前线留下尸体。疾病、疲劳、药物短缺与无法及时撤离的伤员，同样足以拖垮一支军队。\n\n八云紫将前往迷途竹林深处的永远亭。那里远离外界道路，却拥有幻想乡最完整的医疗体系。妖兔熟悉竹林中的隐蔽通道，铃仙能在混乱中维持药品配发与伤员秩序，蓬莱山辉夜掌握著足以庇护永远亭的权威，而八意永琳则能将医疗、药物与后备人力整理成精确运转的体系。\n\n永琳从不因慈悲而救人。她计算存活率、恢复时间与资源消耗，也不会容许情感干扰判断。这份冷静或许令人不安，却正是百妖军最缺少的能力。\n\n紫必须确认，月之贤者愿意为这场战争提供多少药物，又准备为自己的协助附上什么条件。"

KYO_renleicunluodezhihui:0 "人间之里的意志"
KYO_renleicunluodezhihui_desc:0 "妖怪可以在夜里集结军队，却不能忽视幻想乡最大的人类聚落。\n\n八云紫决定前往人间之里。那里没有红魔馆的魔法，也没有妖怪山的工坊，居民大多只是农户、工匠、商贩与守卫。他们恐惧妖怪，依赖妖怪维持的秩序，也比任何人都清楚结界一旦崩溃，最先失去家园的将会是谁。\n\n寺子屋维系知识与地方秩序，商会掌握粮食、布匹与运输，村落守卫则熟悉每一条通往外围聚落的道路。若人里拒绝配合，百妖协议的后方将充满猜疑与抵抗；若他们愿意加入准备，幻想乡便能获得一个真正能长期支撑战争的腹地。\n\n紫不打算只向人类发布命令。她必须亲自走进村落，听见那些即将被卷入妖怪战争的人究竟要求什么。"

KYO_xixingsideyoulingguancha:0 "白玉楼的幽冥通道"
KYO_xixingsideyoulingguancha_desc:0 "活人的道路可能被炸毁、封锁或切断，死者走过的道路却遵循另一套规则。\n\n八云紫将前往冥界的白玉楼。那里的幽灵不需要睡眠，能穿越部分地形与障碍，也能在凡人难以行动的夜晚搬运物资与伤员。魂魄妖梦掌握白玉楼的守备与实际调度，只要给她清楚的任务，她便会以近乎固执的责任感将其完成。\n\n至于西行寺幽幽子，她表面从容，仿佛世间没有任何事情值得惊慌；可她比多数人更清楚，大量死亡会如何扰乱幽冥秩序。若战争让亡者失去归处，白玉楼也无法永远置身事外。\n\n紫将越过冥界之门，请一位认识多年的旧友决定：这一次，亡者的道路是否愿意替生者开放。"

KYO_tiangoudezhanluefenxi:0 "天狗的战略分析"
KYO_tiangoudezhanluefenxi_desc:0 "在第一支军队越过结界以前，百妖协议必须先知道日本军队在哪里、如何调动，又会从哪一条道路增援。\n\n八云紫将前往妖怪山。鸦天狗能在极短时间内越过大片土地，记录铁路、军营、港口与防空阵地；白狼天狗擅长巡逻、追踪与山地作战；大天狗掌握的组织则能让情报从个别观察变成持续更新的战场图景。\n\n但天狗从来不只是忠实记录世界。她们选择报导什么、隐瞒什么，也决定情报将流向谁的手中。射命丸文尤其清楚，文字与影像可以在敌军开火以前先改变局势；饭纲丸龙则更在意，妖怪山能从这场合作中取得什么位置。\n\n紫需要天狗的眼睛，也必须防止那些眼睛只替妖怪山自身服务。她将亲自登山，要求天狗把外界画成一张真正能用于战争的地图。"

KYO_hetongyushantongdegong_Chengduice:0 "河童与山童的工程队"
KYO_hetongyushantongdegong_Chengduice_desc:0 "一支军队无法只靠妖力前进。道路需要修复，武器需要保养，弹药需要统一，穿越结界的物资也必须有能够承受长期运转的器具。\n\n八云紫决定前往玄武泽与妖怪山的工坊区。河童擅长机械、兵器、通讯与水利，山童则熟悉木材、坑道、搬运与山地建设。她们常为材料、专利与利益彼此争执，却也是幻想乡少数能将一张草图迅速变成实物的群体。\n\n河城荷取懂得如何把外界技术拆开、改造，再装进妖怪能够使用的架构；山城高岭的人脉则深入采集地、工棚与地方交易网。若两方愿意共同工作，百妖军便能获得兵工、桥梁、铁路与结界设备的实际支援。\n\n紫将带著战时计划走进工坊。接下来要谈的，不是幻想乡能制造什么，而是在战争开始以前究竟来得及制造多少。"

KYO_yaojingmendejuexin:0 "妖精们的决心"
KYO_yaojingmendejuexin_desc:0 "妖精没有严格的军纪，也很少真正理解战略会议上的复杂计算。她们容易分心，会因一句挑衅改变方向，也可能在最不合适的时候把任务当成游戏。\n\n八云紫仍决定前往雾之湖与妖精聚集的森林。\n\n妖精与自然紧密相连，数量众多，而且即使被击倒，也能在自然仍然存在的地方重新出现。她们熟悉每一片林地、湖岸与废墟，可以担任侦察、传令、干扰与地方警戒。更重要的是，她们正在亲眼看见结界危机如何侵蚀自己的家园。\n\n琪露诺渴望证明自己并非只能制造麻烦，大妖精则能把四散的妖精重新带回正确方向。其他妖精或许说不出幻想乡存续的道理，却知道自己不愿让熟悉的湖泊、花丛与游戏场所从世界上消失。\n\n紫不是去征召一道毫无价值的肉墙。她要看看这群看似弱小的生命，究竟能以多大的决心反抗一个正在否定她们的世界。"

KYO_dilingdiandehuiying:0 "被厌恶者的回应"
KYO_dilingdiandehuiying_desc:0 "地底收留了许多被地上排斥、恐惧或遗忘的妖怪。她们习惯在没有阳光的地方生活，也早已不再期待地上的世界给予善意。\n\n八云紫将前往旧地狱深处的地灵殿。古明地觉能读取心灵，辨认谎言、恐慌与刻意隐藏的敌意；火焰猫燐熟悉亡骸、地下道路与灾难现场；灵乌路空掌握的力量，则足以成为战争中最危险的武器之一。地底居民还能利用坑道与旧地狱网络，提供地面势力难以建立的隐蔽运输线。\n\n然而，地灵殿没有义务相信百妖协议。地上的势力只有在需要力量时才想起她们，危机过后又可能重新把她们称为不祥之物。\n\n紫必须亲自走入那座沉默的宫殿，向一群早已看透虚伪的妖怪证明：这次的邀请不是临时利用。"

KYO_shifeiquzhitingdecaijue:0 "是非曲直厅的裁决"
KYO_shifeiquzhitingdecaijue_desc:0 "战时命令能要求服从，却无法回答所有事情是否正当。\n\n八云紫决定前往彼岸的是非曲直厅。幻想乡即将动员军队、征用物资、跨越结界，甚至把战火带入外界。每一项决定都可能拯救一部分人，也可能把另一部分人推向死亡。若没有可被承认的界线，百妖协议很快就会从求生的工具变成任意行使权力的借口。\n\n四季映姬不受任何妖怪势力指挥，也不会因局势紧急便放弃判断是非。她的说教漫长、严厉，经常让前来求助者后悔踏进厅门；可只要她愿意承认百妖协议的行动仍有其必要，部队与居民便能得到一套共同遵守的规则。\n\n紫知道这场拜访不会轻松。她仍必须前往彼岸，接受那位阎魔对这场战争可能长达数个时辰的质问。"

KYO_caogenyaoguaideshengyin:0 "草根妖怪的声音"
KYO_caogenyaoguaideshengyin_desc:0 "历史总会记住贤者、大妖怪与统领军队的名字，却很少记得那些负责搬运、守夜、带路与埋葬死者的小妖怪。\n\n八云紫决定离开主要道路，前往湖岸、森林边缘与那些不被正式地图重视的聚落。赤蛮奇、今泉影狼与若鹭姬并不代表某座宏伟宫殿，也没有能够命令整个幻想乡的权威。她们代表的是数量最多、生活最不稳定，也最先承受危机的底层妖怪。\n\n赤蛮奇怀疑所有来自上位者的承诺；影狼只相信真正能保护同伴的行动；若鹭姬则要求任何安排都不能把弱者当成可以舍弃的部分。她们彼此争吵，却也依靠熟人、暗路与地方互助，维持著百妖协议看不见的末端。\n\n若紫只向强者寻求战争，她得到的只会是一场属于强者的战争。她必须走进那些没有会议室的地方，听见无名妖怪愿意为幻想乡付出什么，又拒绝再承受什么。"

KYO_reiko_music_playing:0 "付丧神们的呐喊"
KYO_reiko_music_playing_desc:0 "付丧神最清楚，被需要与被丢弃之间往往只隔著一次损坏。\n\n八云紫将前往九十九姐妹与堀川雷鼓活动的聚集地。乐器、器具与旧物因长久被使用而获得生命，也因此比多数妖怪更了解人类的日常。她们能在工坊、货栈、民居与道路之间传递消息，也能把破损器材重新改造成可用之物。\n\n九十九弁弁与九十九八桥能以乐声传递信号、安定人群，也能让分散各地的付丧神彼此回应。多多良小伞熟悉街巷与民间生活，秦心则能透过情感的变化察觉恐慌与动摇。雷鼓本人更能把这些被忽视的声音组织成一张不依赖正式官署的联络网。\n\n她们不会轻易相信百妖协议。过去正是那些有权势者一次次使用她们，又在失去价值后把她们留在角落。\n\n紫要亲自面对这份怨气，询问付丧神是否愿意再次让自己的声音为整个幻想乡响起。"

KYO_big_sis_yuuka_is_watching:0 "花田之主的威压"
KYO_big_sis_yuuka_is_watching_desc:0 "太阳花田没有军营，也没有正式编制，却没有多少妖怪敢在未经允许的情况下踏入其中。\n\n八云紫将前往那片被阳光与花海覆盖的土地。秋穰子与秋静叶能协助调整收成、保存粮食与维持季节秩序，居住在周边的妖怪则熟悉农地、林线与通往外围的道路。只要花田愿意配合，百妖协议便能获得重要的粮食与地方支援。\n\n但这些都不是紫真正此行的核心。\n\n风见幽香才是那片土地不容忽视的主人。她不热衷会议，也不在意其他势力如何分配职位。她只尊重足够坚定的意志，以及不会在压力下退缩的人。若她愿意参战，任何正面防线都必须重新估算自己能承受多少力量。\n\n紫将走进盛开的向日葵之间。幽香会带著微笑迎接她，而那份微笑究竟代表兴趣、警告还是即将到来的暴力，只有见面后才能知道。"

KYO_Kanako_god_of_war_and_wind:0 "风雨与御柱的战神"
KYO_Kanako_god_of_war_and_wind_desc:0 "守矢神社从来不把信仰只留在祭坛前。\n\n八云紫将登上妖怪山，拜访八坂神奈子。她懂得以神迹吸引信众，也懂得将信仰转化为道路、水利、工坊与能够动员人群的制度。泄矢诹访子掌握土地与地方神明的旧有联系。\n\n守矢神社与河童工坊关系密切，也拥有覆盖山中聚落的信仰网络。若神奈子愿意投入准备，百妖协议便能在极短时间内建立新的道路、集结劳力，并把分散的祭祀场所转化为物资与人员节点。\n\n但神奈子不会无条件服从八云紫。她同样是一位试图塑造幻想乡未来的神明，也清楚危机会让旧有权力重新排列。\n\n紫将亲自踏上守矢神社的石阶。她需要的是战神的力量，而神奈子想要的，恐怕不只是一个参与战争的位置。"

KYO_hijri_byakuren_mercy_for_all:0 "圣白莲的慈悲"
KYO_hijri_byakuren_mercy_for_all_desc:0 "命莲寺并不是一支为战争而生的势力。\n\n八云紫仍决定亲自前往寺院。那里收留的不是一群没有裂痕的圣人，而是各自带著偏执、怨念、孤独与旧伤的妖怪。纳兹琳戒心深重，村纱水蜜始终在自由与失控之间徘徊，一轮自卑却愿意承担，寅丸星相信光明与正道。\n\n正因如此，命莲寺比许多地方更懂得如何让彼此不相容的人共同生活。寺院能收容流离者、组织救援、安定恐慌，也能让那些被战争推到边缘的人重新找到位置。\n\n圣白莲不会因为幻想乡需要胜利，就接受一切以胜利为名的手段。她愿意伸手救人，也会要求百妖协议说明，这场战争究竟准备保护谁，又打算牺牲谁。\n\n紫将走入命莲寺。她要请一位反对仇恨的僧人，为一场即将以恐惧维持幻想的战争提供力量。"


