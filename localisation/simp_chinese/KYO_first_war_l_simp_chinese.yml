KYO_remilia_influence_political_campaign:0 "红月下的效忠宴"
KYO_remilia_influence_political_campaign_tt:0 "红魔馆向各方领袖送出邀请。酒杯、座次与蕾米莉亚的目光，会让每位来客重新衡量自己应当站在哪一边。\n\n蕾米莉亚影响力 §G+5§!。"

KYO_remilia_influence_industrial_campaign:0 "咲夜接管军需帐簿"
KYO_remilia_influence_industrial_campaign_tt:0 "咲夜将工坊、仓库与运输路线重新编排。红魔馆的秩序开始深入军务委员会的每一笔物资调度。\n\n蕾米莉亚影响力 §G+8§!。"

KYO_remilia_influence_manpower_campaign:0 "召集斯卡蕾特扈从"
KYO_remilia_influence_manpower_campaign_tt:0 "美铃开放关卡，咲夜核准编制。愿意服从红魔馆规矩的妖怪，将在猩红旗帜下重新集结。\n\n蕾米莉亚影响力 §G+10§!。"

KYO_remilia_spend_influence_for_fulfillment:0 "以红魔馆之名整肃军令"
KYO_remilia_spend_influence_for_fulfillment_tt:0 "蕾米莉亚调动红魔馆掌握的关卡、军需与扈从，把争论不休的命令直接推向前线。\n\n消耗蕾米莉亚 §Y15§! 影响力，使军务委员会履行度 §G+20§!。"

KYO_remilia_spend_influence_for_national_buff:0 "红月下的全军号令"
KYO_remilia_spend_influence_for_national_buff_tt:0 "蕾米莉亚将整个军务体系变成自己的舞台。命令不再被讨论，只被执行。\n\n仅当本季军务议程由蕾米莉亚主持，且她担任军务委员长时可用。消耗 §Y20§! 军务履行度，获得60日专属加成。"

KYO_quarterly_candidate_mandate_remilia:0 "本季军务议程：蕾米莉亚"
KYO_quarterly_candidate_mandate_remilia_desc:0 "百妖协议本季将军务成果交由蕾米莉亚验收。若她同时掌握军务委员会，红魔馆的命令便能迅速转化为行动；若委员长另有其人，这份安排只能停留在纸面。"

KYO_yuyuko_influence_political_campaign:0 "白玉楼的春宴请帖"
KYO_yuyuko_influence_political_campaign_tt:0 "白玉楼送出的请帖没有威胁，只有花香、佳肴与幽幽子从容的笑意。然而赴宴者离去时，往往已答应了比预想更多的事情。\n\n西行寺幽幽子影响力 §G+5§!。"

KYO_yuyuko_influence_industrial_campaign:0 "冥界幽灵整备军需"
KYO_yuyuko_influence_industrial_campaign_tt:0 "妖梦负责清点，幽灵负责搬运。无须休息的亡者沿著冥界道路，将武器与补给送往最需要的地方。\n\n西行寺幽幽子影响力 §G+8§!。"

KYO_yuyuko_influence_manpower_campaign:0 "召回徘徊的亡者"
KYO_yuyuko_influence_manpower_campaign_tt:0 "幽幽子允许部分亡者暂缓离去，加入运输、守备与战地支援。这不是复生，而是让尚未放下执念者找到最后的去处。\n\n西行寺幽幽子影响力 §G+10§!。"

KYO_yuyuko_spend_influence_for_fulfillment:0 "让亡者各得其所"
KYO_yuyuko_spend_influence_for_fulfillment_tt:0 "白玉楼重新安排亡者、幽灵与冥界通道，使军务委员会积压的工作在寂静中逐一完成。\n\n消耗西行寺幽幽子 §Y15§! 影响力，使军务委员会履行度 §G+20§!。"

KYO_yuyuko_spend_influence_for_national_buff:0 "西行妖下的静默进军"
KYO_yuyuko_spend_influence_for_national_buff_tt:0 "花瓣落下之处，亡者让路，幽灵前行。白玉楼以近乎无声的方式接管整片战场的后方秩序。\n\n仅当本季军务议程由西行寺幽幽子主持，且她担任军务委员长时可用。消耗 §Y20§! 军务履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_yuyuko:0 "本季军务议程：西行寺幽幽子"
KYO_quarterly_candidate_mandate_yuyuko_desc:0 "本季军务成果将由白玉楼负责收束。若幽幽子掌握军务委员会，亡者与生者的力量便能被安置到适当位置；若她未能主持委员会，冥界只会保持旁观。"

KYO_suika_influence_political_campaign:0 "百鬼夜行的酒席"
KYO_suika_influence_political_campaign_tt:0 "萃香不发公文，也不召开沉闷的会议。她只把酒倒满，让分散各地的妖怪重新坐到同一张桌前。\n\n伊吹萃香影响力 §G+5§!。"

KYO_suika_influence_industrial_campaign:0 "鬼众搬空军需仓"
KYO_suika_influence_industrial_campaign_tt:0 "沉重的武器、木箱与机械在鬼族手中算不上麻烦。原本需要数日的运输，很快便在笑骂与酒气中完成。\n\n伊吹萃香影响力 §G+8§!。"

KYO_suika_influence_manpower_campaign:0 "以酒盏召集旧友"
KYO_suika_influence_manpower_campaign_tt:0 "一只酒盏沿著山路、旧都与荒野传递。收到它的妖怪都明白，伊吹萃香正在找人，而真正的朋友不会装作没看见。\n\n伊吹萃香影响力 §G+10§!。"

KYO_suika_spend_influence_for_fulfillment:0 "把散兵重新聚成一阵"
KYO_suika_spend_influence_for_fulfillment_tt:0 "萃香将分散的部队、搬运队与地方武装聚到一处。它们未必守规矩，但至少愿意一同向前。\n\n消耗伊吹萃香 §Y15§! 影响力，使军务委员会履行度 §G+20§!。"

KYO_suika_spend_influence_for_national_buff:0 "百鬼夜行再临"
KYO_suika_spend_influence_for_national_buff_tt:0 "无数分散的妖气汇聚成洪流。没有整齐的队列，只有一群相信萃香、也相信彼此的妖怪共同前进。\n\n仅当本季军务议程由伊吹萃香主持，且她担任军务委员长时可用。消耗 §Y20§! 军务履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_suika:0 "本季军务议程：伊吹萃香"
KYO_quarterly_candidate_mandate_suika_desc:0 "本季军务需要有人将分散的妖怪重新聚起。若萃香担任军务委员长，昔日百鬼夜行的连带将再次发挥作用；若她未能取得席位，各路妖怪依旧只会各走各的路。"

KYO_yuuka_influence_political_campaign:0 "花田边界的无声警告"
KYO_yuuka_influence_political_campaign_tt:0 "幽香不需要四处邀请。她只需撑著阳伞走过几个据点，便足以让旁观者重新理解太阳花田的分量。\n\n风见幽香影响力 §G+5§!。"

KYO_yuuka_influence_industrial_campaign:0 "太阳花田徵调令"
KYO_yuuka_influence_industrial_campaign_tt:0 "花田周边的道路、仓舍与劳力被重新安排。幽香不接受延误，也不接受任何人用混乱作为借口。\n\n风见幽香影响力 §G+8§!。"

KYO_yuuka_influence_manpower_campaign:0 "召集花妖与荒野守卫"
KYO_yuuka_influence_manpower_campaign_tt:0 "花妖、植物精与居住在荒野的妖怪陆续现身。她们不一定喜欢战争，但都知道不能让战火踩进幽香的花田。\n\n风见幽香影响力 §G+10§!。"

KYO_yuuka_spend_influence_for_fulfillment:0 "让怠慢者记住季节"
KYO_yuuka_spend_influence_for_fulfillment_tt:0 "幽香亲自过问军务委员会迟滞的工作。没有人愿意成为那个必须向她解释失败理由的人。\n\n消耗风见幽香 §Y15§! 影响力，使军务委员会履行度 §G+20§!。"

KYO_yuuka_spend_influence_for_national_buff:0 "万花齐放的威压"
KYO_yuuka_spend_influence_for_national_buff_tt:0 "花海在战线后方盛放，幽香则走在最前方。这份美丽并不带来安慰，而是在提醒所有敌人：自然也会选择进攻。\n\n仅当本季军务议程由风见幽香主持，且她担任军务委员长时可用。消耗 §Y20§! 军务履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_yuuka:0 "本季军务议程：风见幽香"
KYO_quarterly_candidate_mandate_yuuka_desc:0 "本季军务成果将接受幽香的检视。若她坐上军务委员长的位置，所有拖延都会在压力下消失；若委员会由他人主持，太阳花田不会替别人的混乱收拾残局。"

KYO_byakuren_influence_political_campaign:0 "命莲寺沿途说法"
KYO_byakuren_influence_political_campaign_tt:0 "白莲带著弟子走入村落、避难所与前线营地。她不许诺轻易的和平，只要求众人相信共存仍值得继续尝试。\n\n圣白莲影响力 §G+5§!。"

KYO_byakuren_influence_industrial_campaign:0 "寺众募集粮药器材"
KYO_byakuren_influence_industrial_campaign_tt:0 "命莲寺向信众募集粮食、药品、工具与可修复的旧器。每一份微小捐助，都被送往最缺乏援助的地方。\n\n圣白莲影响力 §G+8§!。"

KYO_byakuren_influence_manpower_campaign:0 "敲响命莲寺晨钟"
KYO_byakuren_influence_manpower_campaign_tt:0 "钟声传过村落与废墟。僧众、信徒、受过命莲寺庇护的人，以及仍愿意相信白莲的人，纷纷前来协助。\n\n圣白莲影响力 §G+10§!。"

KYO_byakuren_spend_influence_for_fulfillment:0 "把慈悲送到前线"
KYO_byakuren_spend_influence_for_fulfillment_tt:0 "白莲要求信仰委员会停止空谈，将寺院、信众与救援据点真正连接起来，使承诺化为可被看见的援助。\n\n消耗圣白莲 §Y15§! 影响力，使信仰委员会履行度 §G+20§!。"

KYO_byakuren_spend_influence_for_national_buff:0 "莲华护持全境"
KYO_byakuren_spend_influence_for_national_buff_tt:0 "命莲寺将救援、庇护与劝导扩展至全境。白莲不替任何人逃避苦难，但她会确保没有人被独自留在苦难里。\n\n仅当本季信仰议程由圣白莲主持，且她担任信仰委员长时可用。消耗 §Y20§! 信仰履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_byakuren:0 "本季信仰议程：圣白莲"
KYO_quarterly_candidate_mandate_byakuren_desc:0 "本季信仰工作将以命莲寺的救援与共存理念为中心。若白莲主持信仰委员会，这些承诺便能深入各地；若委员长另有其人，她的善意只能停留在有限的寺院网络中。"

KYO_kanako_influence_political_campaign:0 "守矢神德巡行"
KYO_kanako_influence_political_campaign_tt:0 "神奈子以祭典、神迹与公开巡行展示守矢神社的力量。她很清楚，信仰不只来自敬畏，也来自看得见的成果。\n\n八坂神奈子影响力 §G+5§!。"

KYO_kanako_influence_industrial_campaign:0 "山神主持工业奉纳"
KYO_kanako_influence_industrial_campaign_tt:0 "河童的技术、山民的劳力与信众的奉纳被纳入同一项工程。神奈子要的不是象征性的供品，而是能够运作的设施。\n\n八坂神奈子影响力 §G+8§!。"

KYO_kanako_influence_manpower_campaign:0 "以御柱召集信众"
KYO_kanako_influence_manpower_campaign_tt:0 "御柱立起，祭旗升上山道。守矢神社的信众与山中居民在神奈子的号召下投入运输、建设与守备。\n\n八坂神奈子影响力 §G+10§!。"

KYO_kanako_spend_influence_for_fulfillment:0 "把信仰化为工程"
KYO_kanako_spend_influence_for_fulfillment_tt:0 "神奈子接管停滞的计划，以守矢神社的组织力与河童技术，把模糊的愿景转化为道路、工坊与供应线。\n\n消耗八坂神奈子 §Y15§! 影响力，使信仰委员会履行度 §G+20§!。"

KYO_kanako_spend_influence_for_national_buff:0 "风雨与御柱的神威"
KYO_kanako_spend_influence_for_national_buff_tt:0 "守矢神社将信众、技术与山岳秩序全面动员。神奈子要让所有人看见，神明的力量能够建造，也能够支配。\n\n仅当本季信仰议程由八坂神奈子主持，且她担任信仰委员长时可用。消耗 §Y20§! 信仰履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_kanako:0 "本季信仰议程：八坂神奈子"
KYO_quarterly_candidate_mandate_kanako_desc:0 "本季议程将检验守矢神社能否以实绩扩张信仰。若神奈子担任信仰委员长，祭祀、工程与行政将合为一体；若她未能主持委员会，计划便缺少足以推动全境的权威。"

KYO_satori_influence_political_campaign:0 "倾听不敢说出的祈求"
KYO_satori_influence_political_campaign_tt:0 "觉走访那些不愿向寺社开口的人。恐惧、怀疑与隐藏的怨恨无法逃过第三只眼，而她至少愿意承认那些情绪确实存在。\n\n古明地觉影响力 §G+5§!。"

KYO_satori_influence_industrial_campaign:0 "地灵殿统整地下供应"
KYO_satori_influence_industrial_campaign_tt:0 "旧地狱的矿产、运输兽与地底工坊被重新接入供应体系。觉以精确的安排，减少每一次隐瞒与浪费。\n\n古明地觉影响力 §G+8§!。"

KYO_satori_influence_manpower_campaign:0 "召集被排斥的地底居民"
KYO_satori_influence_manpower_campaign_tt:0 "地底聚集著太多不被地表欢迎的妖怪。觉不向她们保证会被理解，只承诺她们的工作与存在不会再被故意忽视。\n\n古明地觉影响力 §G+10§!。"

KYO_satori_spend_influence_for_fulfillment:0 "揭开委员会隐藏的心思"
KYO_satori_spend_influence_for_fulfillment_tt:0 "觉让推诿、私心与虚假的虔诚无处藏身。当每个人真正的盘算被摊开，信仰委员会终于能够继续工作。\n\n消耗古明地觉 §Y15§! 影响力，使信仰委员会履行度 §G+20§!。"

KYO_satori_spend_influence_for_national_buff:0 "第三只眼下的共同意志"
KYO_satori_spend_influence_for_national_buff_tt:0 "恐惧仍然存在，分歧也没有消失；但在无法彼此欺骗的情况下，各方只能承认真正的问题，并共同承担结果。\n\n仅当本季信仰议程由古明地觉主持，且她担任信仰委员长时可用。消耗 §Y20§! 信仰履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_satori:0 "本季信仰议程：古明地觉"
KYO_quarterly_candidate_mandate_satori_desc:0 "本季信仰工作将处理那些被寺社话语掩盖的恐惧与猜疑。若觉掌握信仰委员会，第三只眼能迫使各方正视真实；若她未能取得席位，这些声音仍会被埋回沉默之中。"

KYO_megumu_influence_political_campaign:0 "天狗报网塑造公论"
KYO_megumu_influence_political_campaign_tt:0 "饭纲丸龙调整新闻、传令与山中流言的方向。当同一种说法反复出现在每张报纸上，它便会逐渐被当成共识。\n\n饭纲丸龙影响力 §G+5§!。"

KYO_megumu_influence_industrial_campaign:0 "妖怪山工坊统合"
KYO_megumu_influence_industrial_campaign_tt:0 "天狗的行政网络与河童的工坊被纳入共同调度。饭纲丸龙不亲自搬运物资，她只决定谁必须准时把物资送到。\n\n饭纲丸龙影响力 §G+8§!。"

KYO_megumu_influence_manpower_campaign:0 "发布大天狗召集令"
KYO_megumu_influence_manpower_campaign_tt:0 "命令沿著妖怪山的阶序迅速传递。鸦天狗、白狼天狗与依附山中的妖怪被逐级召集，没有人能假装没有收到消息。\n\n饭纲丸龙影响力 §G+10§!。"

KYO_megumu_spend_influence_for_fulfillment:0 "让山中诸部同声"
KYO_megumu_spend_influence_for_fulfillment_tt:0 "饭纲丸龙运用天狗社会的阶序、情报与传令体系，迫使信仰委员会的各方按照同一套安排展开工作。\n\n消耗饭纲丸龙 §Y15§! 影响力，使信仰委员会履行度 §G+20§!。"

KYO_megumu_spend_influence_for_national_buff:0 "大天狗的全山号令"
KYO_megumu_spend_influence_for_national_buff_tt:0 "从山顶到山脚，新闻、命令与物资沿著同一张网络流动。饭纲丸龙将妖怪山的阶序扩展到整个协议体系。\n\n仅当本季信仰议程由饭纲丸龙主持，且她担任信仰委员长时可用。消耗 §Y20§! 信仰履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_megumu:0 "本季信仰议程：饭纲丸龙"
KYO_quarterly_candidate_mandate_megumu_desc:0 "本季信仰工作将仰赖天狗的传播与组织能力。若饭纲丸龙主持信仰委员会，她便能决定哪些声音传遍全境；若席位旁落，天狗报网只会服务妖怪山自身的利益。"

KYO_sekibanki_influence_political_campaign:0 "巷口传开的不满"
KYO_sekibanki_influence_political_campaign_tt:0 "赤蛮奇走进工棚、破屋与夜市，把众人不敢当面说出的话带进万民委员会。她不替上位者粉饰，也不轻易相信任何承诺。\n\n没有人注意到，一名挑染头发的天邪鬼总会在散会后收走那些抱怨、欠条与受伤者的证词，再将它们整理成更尖锐的文字。\n\n赤蛮奇影响力 §G+5§!。"

KYO_sekibanki_influence_industrial_campaign:0 "破工坊间的互助线"
KYO_sekibanki_influence_industrial_campaign_tt:0 "赤蛮奇串联零散工坊、修理铺与二手市场，影狼负责护送那些容易被抢走的工具与物资，若鹭姬则逐户确认粮食与药品是否真的送到需要的人手中。\n\n至于那名挑染头发的天邪鬼，她只在地图上增添几道不起眼的记号。今日运送零件的道路，往后也能运送传单、武器与不愿再低头的人。\n\n赤蛮奇影响力 §G+8§!。"

KYO_sekibanki_influence_manpower_campaign:0 "夜路上的四道身影"
KYO_sekibanki_influence_manpower_campaign_tt:0 "消息沿著熟人、后门与偏僻山路传开。影狼走在队伍外围，嗅出巡逻者与伏击者的气味；若鹭姬守著落单者、伤患与不敢继续前进的人；赤蛮奇则逐一确认来者是否可信。\n\n队伍最后，总有一道挑染发色的身影低声询问：你们只是想活过今天，还是已经厌倦永远被别人决定明天？\n\n赤蛮奇影响力 §G+10§!。"

KYO_sekibanki_spend_influence_for_fulfillment:0 "把底层的帐摊上桌"
KYO_sekibanki_spend_influence_for_fulfillment_tt:0 "欠粮、工伤、强征与失踪者的纪录被赤蛮奇一份份摔在万民委员会桌上。若鹭姬替受害者作证，影狼守在门外，确保没有人能靠威胁让证词消失。\n\n而在会场之外，那名挑染头发的天邪鬼正把每一次推诿、每一句傲慢与每一个未被处理的名字传往更远的地方。委员会解决的是眼前问题，她准备的却是下一次清算。\n\n消耗赤蛮奇 §Y15§! 影响力，使万民委员会履行度 §G+20§!。"

KYO_sekibanki_spend_influence_for_national_buff:0 "暗路已连成一片"
KYO_sekibanki_spend_influence_for_national_buff_tt:0 "赤蛮奇站在台前，迫使万民委员会承认底层妖怪有资格决定自己的生活。影狼让各地互助队不再任人驱散，若鹭姬则确保这股力量不会把弱者一同踩进泥里。\n\n在她们身后，那名挑染头发的天邪鬼早已将工坊、夜路、藏身处与不满者连成一张看不见的网。没有人公开谈论革命，但旧秩序已经开始发现，命令不再像过去那样有人服从。\n\n仅当本季万民议程由赤蛮奇主持，且她担任万民委员长时可用。消耗 §Y20§! 万民履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_sekibanki:0 "本季万民议程：赤蛮奇"
KYO_quarterly_candidate_mandate_sekibanki_desc:0 "赤蛮奇是草根妖怪推到台前的代表。她的怀疑能拆穿空洞承诺，影狼的利爪保护散落各地的互助网，若鹭姬则让这场行动不至于失去最初想守护的人。\n\n然而，在三人身后，还有一名从不登记姓名、头发带著醒目挑染的天邪鬼。她不争夺委员长的席位，只悄悄记下每一处矛盾与裂缝。若赤蛮奇掌握万民委员会，草根妖怪将得到真正的组织空间；那些原本只为求生而建立的道路，也可能在无人察觉时通往更彻底的变革。"

KYO_eirin_influence_political_campaign:0 "永远亭巡诊与风险告示"
KYO_eirin_influence_political_campaign_tt:0 "永琳派出药师与妖兔，为各地居民检查伤病并发布清楚的风险指引。人们未必喜欢她的冷淡，却很难否认她的判断确实有效。\n\n八意永琳影响力 §G+5§!。"

KYO_eirin_influence_industrial_campaign:0 "药师接管供给流程"
KYO_eirin_influence_industrial_campaign_tt:0 "药材、粮食、器械与运输时程被重新计算。永琳将浪费视为可以诊断的病症，并毫不犹豫地切除失效环节。\n\n八意永琳影响力 §G+8§!。"

KYO_eirin_influence_manpower_campaign:0 "按健康状况配置人手"
KYO_eirin_influence_manpower_campaign_tt:0 "永远亭重新检查伤患、劳工与可动员人口，让每个人被安排到身体能够承受的位置。效率提高了，选择的余地也随之减少。\n\n八意永琳影响力 §G+10§!。"

KYO_eirin_spend_influence_for_fulfillment:0 "以诊断修正民生失序"
KYO_eirin_spend_influence_for_fulfillment_tt:0 "永琳将万民委员会视为一名病情复杂的患者。她不安慰，也不拖延，只逐项处理最可能致命的问题。\n\n消耗八意永琳 §Y15§! 影响力，使万民委员会履行度 §G+20§!。"

KYO_eirin_spend_influence_for_national_buff:0 "月之贤者的全域处方"
KYO_eirin_spend_influence_for_national_buff_tt:0 "全境的医疗、配给与劳力调度被纳入同一套计算。这份处方精确而有效，只是没有人能确定自己究竟是被救治，还是被管理。\n\n仅当本季万民议程由八意永琳主持，且她担任万民委员长时可用。消耗 §Y20§! 万民履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_eirin:0 "本季万民议程：八意永琳"
KYO_quarterly_candidate_mandate_eirin_desc:0 "本季民生工作将接受永琳的诊断。若她主持万民委员会，医疗、配给与劳力都能被精确安排；若委员长另有其人，她的方案只能作为建议，无法成为全境标准。"

KYO_raiko_influence_political_campaign:0 "雷鼓巡演串联街巷"
KYO_raiko_influence_political_campaign_tt:0 "雷鼓带著付丧神在工棚、广场与临时聚落演奏。声音越过阶级与出身，让原本互不相识的人开始相信自己并不孤单。\n\n堀川雷鼓影响力 §G+5§!。"

KYO_raiko_influence_industrial_campaign:0 "付丧神整修旧器"
KYO_raiko_influence_industrial_campaign_tt:0 "被丢弃的工具、破损的机械与退役武器重新被唤醒。雷鼓让旧物证明，遭到淘汰不等于失去价值。\n\n堀川雷鼓影响力 §G+8§!。"

KYO_raiko_influence_manpower_campaign:0 "鼓声召集被遗忘者"
KYO_raiko_influence_manpower_campaign_tt:0 "鼓声从一个聚落传向下一个聚落。付丧神、流民与没有固定归属的妖怪循声而来，加入这场由被遗忘者组成的行动。\n\n堀川雷鼓影响力 §G+10§!。"

KYO_raiko_spend_influence_for_fulfillment:0 "让散乱的脚步同时落下"
KYO_raiko_spend_influence_for_fulfillment_tt:0 "雷鼓不强迫众人变得一模一样。她只让各自不同的声音找到能够并肩前进的位置，使万民委员会重新运转。\n\n消耗堀川雷鼓 §Y15§! 影响力，使万民委员会履行度 §G+20§!。"

KYO_raiko_spend_influence_for_national_buff:0 "雷鸣般的万民响应"
KYO_raiko_spend_influence_for_national_buff_tt:0 "鼓声传遍道路、工坊与聚落。那些长久被当成旧物与边角的人，如今用自己的声音证明她们仍然存在。\n\n仅当本季万民议程由堀川雷鼓主持，且她担任万民委员长时可用。消耗 §Y20§! 万民履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_raiko:0 "本季万民议程：堀川雷鼓"
KYO_quarterly_candidate_mandate_raiko_desc:0 "本季万民工作将以付丧神与无归属者的互助网络为核心。若雷鼓主持委员会，分散的声音便能汇成共同力量；若她未能取得席位，这场响应仍会停留在街巷与舞台之间。"

KYO_eiki_influence_political_campaign:0 "巡回说教与是非裁示"
KYO_eiki_influence_political_campaign_tt:0 "映姬走访各地，听取争端并指出每一方不愿承认的过失。她的话并不讨喜，却让许多无处申诉者第一次得到回应。\n\n四季映姬影响力 §G+5§!。"

KYO_eiki_influence_industrial_campaign:0 "清查侵占与不义征收"
KYO_eiki_influence_industrial_campaign_tt:0 "被私吞的物资、被强占的工坊与被转嫁的负担逐一接受清查。映姬要求每一份资源回到应当承担责任的人手中。\n\n四季映姬影响力 §G+8§!。"

KYO_eiki_influence_manpower_campaign:0 "召集愿为公义作证者"
KYO_eiki_influence_manpower_campaign_tt:0 "地方调解者、记录员与愿意揭露不公的人被召集起来。她们未必强大，却愿意站出来证明是非并非只由强者决定。\n\n四季映姬影响力 §G+10§!。"

KYO_eiki_spend_influence_for_fulfillment:0 "纠正万民委员会的偏私"
KYO_eiki_spend_influence_for_fulfillment_tt:0 "映姬逐项审视委员会未能履行的承诺，逼迫既得利益者交还不属于自己的份额，并让责任落到具体的人身上。\n\n消耗四季映姬 §Y15§! 影响力，使万民委员会履行度 §G+20§!。"

KYO_eiki_spend_influence_for_national_buff:0 "净玻璃映照全境"
KYO_eiki_spend_influence_for_national_buff_tt:0 "所有借口、功过与隐瞒都被放到同一面镜前。映姬不能保证每个裁决都令人满意，但她会要求每个人接受同一套是非标准。\n\n仅当本季万民议程由四季映姬主持，且她担任万民委员长时可用。消耗 §Y20§! 万民履行度，获得60日专属强力加成。"

KYO_quarterly_candidate_mandate_eiki:0 "本季万民议程：四季映姬"
KYO_quarterly_candidate_mandate_eiki_desc:0 "本季万民工作将集中处理不公、侵占与责任归属。若映姬担任万民委员长，裁示便能真正约束各方；若她未能主持委员会，再正确的判断也可能只是一场无人执行的说教。"

KYO_quarterly_candidate_mandate_success_idea:0 "本季议程的实际成果"

KYO_quarterly_candidate_mandate_success_tt:0 "季末审议时，若本季议程的主持者仍担任所属委员会委员长，便能运用委员会权限将提案完整落实。\n\n所属委员会履行度 §G+10§!，并获得45日加成。"

KYO_quarterly_candidate_mandate_failure_tt:0 "季末审议时，若本季议程的主持者未能掌握所属委员会，相关提案将在各方争议中遭到搁置，本季不获得任何成果。\n\n百妖协议将重新协商，并确立下一季议程。"

