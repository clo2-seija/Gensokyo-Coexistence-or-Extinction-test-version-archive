 # v1.0：十地点结界、每区六决议、十二名新候选人、季度人选与履行度衰退。§Y§!
 
 KYO_barrier_crisis_category:0 "结界危机"
 KYO_barrier_crisis_category_desc:0 "紫大人，十处关键地点的观测结果已整理完毕。\n\n每处结界节点依恶化程度分为五个阶段，由零至四。绿色标记代表结构正常，黄色代表边界已开始偏移，红色则表示节点正在碎裂。查阅标记便能确认当地目前的状态，以及恶化持续造成的影响。\n\n各地问题并不相同。博丽神社、妖怪山、迷途竹林与其余节点，都需要依照地形、居民与结界结构采取不同措施。选定地点后，相关处置方案会一并呈上。\n\n请不要只注意已经转红的区域。黄色意味著我们仍有时间，也意味著下一次报告可能已经太迟。"


KYO_hyakki_coalition_category:0 "百妖协议"
KYO_hyakki_coalition_category_desc:0 "紫大人，百妖协议目前仍由三名委员长分别主持军务、信仰与万民事务，所有相互冲突的命令，最后仍由您居中裁定。\n\n我已将三名现任委员长与您的仲裁席置于上方，十二名可能接任的候选人则依委员会分列于下。查阅个别肖像，即可调出该人物目前能推动的方案。\n\n协议并不稳固。每三十日，三个委员会中必有一处因拖延、耗损或彼此掣肘而失去10点履行度，事前无法确定会落在哪一方。\n\n每九十日，我会依局势指定一名本季受到关注的候选人。若季度结算时，此人已成为所属委员会的委员长，先前集中于她身上的人力、声望与准备便能转化为额外成果；若未能取得席位，这一季的机会也将随之消失。\n\n十二人都愿意维持协议，但她们对『维持』二字的理解并不相同。"


