 KYO_debug_selected_influence_tt:0 "调整目前在百妖 GUI 点选候选人的影响力；不改变其他候选人。"
 KYO_debug_barrier_selected_tt:0 "调整目前在结界 GUI 点选节点的恶化等级，完成后刷新对应地区 idea 与状态图。"
 
