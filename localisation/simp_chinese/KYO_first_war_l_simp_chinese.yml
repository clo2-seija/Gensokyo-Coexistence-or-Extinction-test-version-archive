KYO_remilia_spend_influence_for_national_buff_tt:0 "蕾米莉亚将军务委员会化为红魔馆意志的延伸。咲夜整理命令，美铃稳住防线，而所有拒绝服从者都将被迫理解猩红军令的分量。\n\n仅当蕾米莉亚是本季议程主持者且担任军务委员长时可用。消耗§Y20§!军务履行度，获得60日专属强力加成。"

KYO_yuyuko_spend_influence_for_national_buff_tt:0 "幽灵沿著冥界道路搬运补给，亡者填补后方的空缺，妖梦则确保每一道命令都被准确执行。白玉楼的进军安静，却不曾停下。\n\n仅当幽幽子是本季议程主持者且担任军务委员长时可用。消耗§Y20§!军务履行度，获得60日专属强力加成。"

KYO_suika_spend_influence_for_national_buff_tt:0 "酒盏沿著山路与旧都传递，分散的鬼族、妖怪豪杰与地方武装再次聚到一起。没有整齐的队列，只有愿意并肩向前的百鬼。\n\n仅当萃香是本季议程主持者且担任军务委员长时可用。消耗§Y20§!军务履行度，获得60日专属强力加成。"

KYO_yuuka_spend_influence_for_national_buff_tt:0 "花田周边的妖怪、工坊与物资在幽香的威权下转向战线。盛放的花海并不象征和平，而是在提醒敌人，自然也会选择进攻。\n\n仅当幽香是本季议程主持者且担任军务委员长时可用。消耗§Y20§!军务履行度，获得60日专属强力加成。"

KYO_byakuren_spend_influence_for_national_buff_tt:0 "命莲寺将救援、庇护与沿途说法扩展至全境。白莲不允许慈悲成为逃避责任的理由，也不允许任何伤者被轻易遗弃。\n\n仅当白莲是本季议程主持者且担任信仰委员长时可用。消耗§Y20§!信仰履行度，获得60日专属强力加成。"

KYO_kanako_spend_influence_for_national_buff_tt:0 "御柱立起，祭典、工程、河童技术与山中信众被纳入同一套安排。神奈子将以看得见的成果证明，信仰也能成为支撑全境的力量。\n\n仅当神奈子是本季议程主持者且担任信仰委员长时可用。消耗§Y20§!信仰履行度，获得60日专属强力加成。"

KYO_satori_spend_influence_for_national_buff_tt:0 "恐惧与分歧没有消失，但在第三只眼下，没有人还能用虚假的虔诚掩饰真正的盘算。各方只能承认问题，并共同承担结果。\n\n仅当觉是本季议程主持者且担任信仰委员长时可用。消耗§Y20§!信仰履行度，获得60日专属强力加成。"

KYO_megumu_spend_influence_for_national_buff_tt:0 "从妖怪山顶到山脚，报纸、命令与物资沿著天狗网络同时流动。饭纲丸龙不只传播共识，也决定哪些声音有资格成为共识。\n\n仅当饭纲丸龙是本季议程主持者且担任信仰委员长时可用。消耗§Y20§!信仰履行度，获得60日专属强力加成。"

KYO_sekibanki_spend_influence_for_national_buff_tt:0 "赤蛮奇站在台前，迫使委员会承认底层妖怪的要求；影狼保护道路与据点，若鹭姬守住伤者与落单者。与此同时，一名挑染头发的天邪鬼正把工坊、藏身处与不满者连成更深的暗网。\n\n仅当赤蛮奇是本季议程主持者且担任万民委员长时可用。消耗§Y20§!万民履行度，获得60日专属强力加成。"

KYO_eirin_spend_influence_for_national_buff_tt:0 "全境的医疗、配给、劳力与运输被纳入永琳的计算。这份处方精确而有效，只是很少有人能在她完成诊断后，仍保有拒绝治疗的余地。\n\n仅当永琳是本季议程主持者且担任万民委员长时可用。消耗§Y20§!万民履行度，获得60日专属强力加成。"

KYO_raiko_spend_influence_for_national_buff_tt:0 "鼓声传过道路、工坊与聚落。付丧神、流民与被视为无用之物的妖怪循声响应，用自己的存在证明她们仍有能力改变局势。\n\n仅当雷鼓是本季议程主持者且担任万民委员长时可用。消耗§Y20§!万民履行度，获得60日专属强力加成。"

KYO_eiki_spend_influence_for_national_buff_tt:0 "功过、责任与隐瞒都被放到净玻璃前检视。映姬不能保证所有裁示都令人满意，但她会要求每一方接受同样的是非标准。\n\n仅当映姬是本季议程主持者且担任万民委员长时可用。消耗§Y20§!万民履行度，获得60日专属强力加成。"

