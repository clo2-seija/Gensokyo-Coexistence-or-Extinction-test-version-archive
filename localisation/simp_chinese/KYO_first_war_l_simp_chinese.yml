KYO_executive_pair_cycle:0 "百妖协议季度议程协商"
KYO_executive_pair_cycle_desc:0 "每逢季末，百妖协议便会在十二名代表之间展开新一轮协商。经过各方推举、交易与妥协后，两名代表将被推到台前，主持下一季的重要议程。\n\n若其中一人同时掌握其所属委员会，便可运用委员长权限，消耗§Y20§!点该委员会履行度，推行一次持续§Y60日§!的专属方案。"

KYO_remilia_spend_influence_for_fulfillment_tt:0 "蕾米莉亚调动红魔馆的军需帐簿、关卡与扈从，将军务委员会迟迟未能执行的命令直接推向前线。\n\n消耗蕾米莉亚§Y15§!影响力，使军务委员会履行度§G+20§!。"

KYO_yuyuko_spend_influence_for_fulfillment_tt:0 "幽幽子重新安排白玉楼的幽灵、冥界通道与妖梦掌握的运输队伍，让积压的军务在无声中逐一完成。\n\n消耗幽幽子§Y15§!影响力，使军务委员会履行度§G+20§!。"

KYO_suika_spend_influence_for_fulfillment_tt:0 "萃香以酒宴与旧日情谊召回分散的鬼族和妖怪豪杰。这支队伍未必服从繁琐规则，却愿意替她把事情做完。\n\n消耗萃香§Y15§!影响力，使军务委员会履行度§G+20§!。"

KYO_yuuka_spend_influence_for_fulfillment_tt:0 "幽香亲自过问迟滞的军务。面对她平静的注视，工坊、运输队与地方武装很快便不再提出拖延的理由。\n\n消耗幽香§Y15§!影响力，使军务委员会履行度§G+20§!。"

KYO_byakuren_spend_influence_for_fulfillment_tt:0 "白莲要求寺众停止停留在经文与劝说之中，将粮食、药物、庇护所与信众真正送往需要援助的地方。\n\n消耗白莲§Y15§!影响力，使信仰委员会履行度§G+20§!。"

KYO_kanako_spend_influence_for_fulfillment_tt:0 "神奈子将守矢神社的信众、河童技术与山中组织纳入同一项工程，把模糊的信仰承诺转化为能够运作的设施。\n\n消耗神奈子§Y15§!影响力，使信仰委员会履行度§G+20§!。"

KYO_satori_spend_influence_for_fulfillment_tt:0 "觉揭开委员会成员隐藏的顾虑、私心与推诿。当真正的想法无法再被掩饰，各方只能重新面对尚未完成的工作。\n\n消耗觉§Y15§!影响力，使信仰委员会履行度§G+20§!。"

KYO_megumu_spend_influence_for_fulfillment_tt:0 "饭纲丸龙调整天狗报网、传令体系与山中阶序，使分散的说法逐渐变成共同立场，并迫使各方依照同一套安排展开行动。\n\n消耗饭纲丸龙§Y15§!影响力，使信仰委员会履行度§G+20§!。"

KYO_sekibanki_spend_influence_for_fulfillment_tt:0 "赤蛮奇把欠粮、工伤、失踪者与强制征收的纪录逐一摊在桌上。影狼守住会场外的道路，若鹭姬替不敢出面的受害者作证，而暗处那名挑染头发的天邪鬼则记下每一次推诿。\n\n消耗赤蛮奇§Y15§!影响力，使万民委员会履行度§G+20§!。"

KYO_eirin_spend_influence_for_fulfillment_tt:0 "永琳将万民委员会视为一名病情复杂的患者。她重新计算粮食、医疗与劳力配置，优先切除最可能导致全面失序的环节。\n\n消耗永琳§Y15§!影响力，使万民委员会履行度§G+20§!。"

KYO_raiko_spend_influence_for_fulfillment_tt:0 "雷鼓让付丧神、流民与无归属者的行动重新协调。她不要求每个人变得相同，只让不同的声音找到能够一同前进的位置。\n\n消耗雷鼓§Y15§!影响力，使万民委员会履行度§G+20§!。"

KYO_eiki_spend_influence_for_fulfillment_tt:0 "映姬逐项审视委员会尚未兑现的承诺，确认责任究竟落在谁身上，并迫使侵占物资与逃避义务者交还不属于自己的份额。\n\n消耗映姬§Y15§!影响力，使万民委员会履行度§G+20§!。"

