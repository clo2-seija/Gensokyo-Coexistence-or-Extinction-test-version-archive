l_simp_chinese:

  shining_needle.1.t:0 "没有人坐上那张椅子"
  shining_needle.1.d:0 "旧政府的大厅仍残留着炮火留下的裂口。正中央那张高背椅被擦得很干净，像是有人早已认定，胜利者理应坐上去接受众人的低头。\n\n正邪走到椅子前，伸手扶住椅背。跟在后面的干部停下脚步，等待新领袖完成一场再自然不过的权力交接。她却突然发力，将整张椅子推下台阶。木头撞上地面，扶手当场折断。\n\n『先把桌子搬来。』正邪看也没看那堆碎木，『明天开始清点资源。谁要是急着替我做王座，就把他一起拿去当柴烧。』\n\n革命军第一次看见，她所说的下克上并不只是换一个人坐到最高处。"
  shining_needle.1.a:0 "先看看我们究竟赢下了什么。"

  # 事件概况：正邪胜利后的第一个私人场景，拒绝直接继承旧政权的统治姿态。
  # 角色方向：强调正邪反王座、重行动的性格，同时把故事引向战后清点与重建。

  shining_needle.2.t:0 "仓库里的最后几箱粮"
  shining_needle.2.d:0 "清点持续了整整一夜。天亮时，桌上只剩一份短得令人难堪的报告：粮食不足，药品不足，能避雨的房屋不足，连运送这些东西的车辆也大多停在半路。\n\n仓库外已经排起长队。伤员需要药，人里需要粮，失去住处的妖怪需要木料，工坊则要求把仅剩的燃料留下，否则几天后连修理农具都做不到。每一份申请都合理，可现有物资无法同时填满所有缺口。\n\n若鹭姬将统计表放到正邪面前，赤蛮奇坚持公开仓库数量，影狼则站在门边防止有人趁乱抢夺。正邪看着纸上不断减少的数字，第一次发现统治并不总是决定谁应该倒下；更多时候，是决定谁必须再等一天。\n\n她下令成立临时配给处，将所有可调动物资集中登记。第一轮分配，从现在开始。"
  shining_needle.2.a:0 "把账摊开，让所有人都看见我们还剩多少。"

  # 事件概况：资源分配小游戏的正式剧情入口，解释玩家分配的资源来自战后库存与调度能力。
  # 角色方向：让正邪第一次承担无法满足所有人的现实责任，并确立公开账目原则。

  shining_needle.3.t:0 "名单上不存在的人"
  shining_needle.3.d:0 "鵺把一沓皱巴巴的纸扔到正邪桌上。最上面几张还算像申请，越往后越混乱：有人只画了居住地附近的歪树，有人用三个不同化名登记，还有一张只写着『桥洞下面还有三张嘴』。\n\n正邪翻了几页，眉头越皱越深。\n\n『没有姓名，没有固定住址，连人数都对不上。你要我怎么分？』\n\n鵺原本倚在门框上笑，听见这句话后，笑意忽然淡了。\n\n『真快啊。』她说，『才坐上那张椅子几天，你就学会用和以前那些家伙一样的语气说话了。』\n\n正邪猛地抬头。她想反驳物资需要核算，运输需要地点，配给不能只凭一句“相信我”。可她再次看向那些不像申请的申请时，忽然明白了鵺真正带来的问题：这些人不是没有身份，而是她们的身份从未被任何机构承认；不是没有住处，而是她们居住的地方从来不配出现在地图上。\n\n『不登记，东西可能被冒领。强迫登记，她们又可能被顺着名册找出来。』正邪低声说道，『你故意把最难处理的全丢给我。』\n\n『当然。』鵺重新笑了，却没有刚才那样轻松，『容易处理的人，从来不需要我替她们敲门。』\n\n两人最后制定了一套临时办法：用配送地点、实际人数和领取暗号代替正式户籍，允许化名，也不追问种族与来历。鵺负责确认那些聚落真实存在，配给处负责留下能够复核却不能用于追捕的记录。\n\n正邪批完最后一张纸，才发现最末页完全空白。\n\n『这个又是谁？』\n\n『留给还不敢来的人。』鵺回答。"
  shining_needle.3.a:0 "名字可以暂时没有，口粮不能因此消失。"

  # 事件概况：正邪起初因申请资料混乱而无法配给，差点重现旧制度排除无名者的逻辑，最后与鵺设计匿名核验方式。
  # 角色方向：鵺并非反对一切记录，正邪也并非迷信管理；两人开始理解“看见”与“定义”之间必须保持界线。

  shining_needle.4.t:0 "名字可以空着，位置不能"
  shining_needle.4.d:0 "《妖怪平等起草书》完成审阅后，书记员把文件推到鵺面前，请她以代表身份签名。鵺拿起笔看了很久，最后却把它放回桌上。\n\n『我不签。』\n\n会议室顿时嘈杂起来。有人认为她从头到尾只想找麻烦，有人质问一个拒绝留下真名的妖怪凭什么要求制度保障。正邪也压着火气问她：『没有谁愿意对条文负责，这张纸要靠什么生效？』\n\n鵺望向她，声音比平日更冷。\n\n『你们说要保护正体不明的东西，第一步却是要求我们先把正体交出来。那和把鸟叫进笼子，再承诺笼门不会上锁，有什么区别？』\n\n这句话让正邪无法立刻回答。她曾经以为，只要新制度愿意写下异类的名字，便是在承认她们；鵺却提醒她，名字也可能成为分类、监视与追捕的第一根线。\n\n沉默许久后，正邪抽回文件，亲手改写了资格条款：保障不得以正式姓名、固定形貌、户籍、血统或受认可居所为前提；申诉可以匿名提出，但负责调查与执行的机关必须留下公开记录。\n\n『你不必相信这张纸会自动保护谁。』正邪把修订稿推回去，『它只是给你一件可以拿来指控我的东西。』\n\n鵺盯着她：『如果有一天你说战争、危机或者什么“大局”比这些条文重要呢？』\n\n『那你就拿着它，当众证明我违法。』\n\n鵺终于再次拿起笔。她没有写下姓名，只画了一团无法辨认真貌的黑影。书记员想要阻止，正邪却在旁边补上一句：『签署者拒绝被固定定义，但同意负责监督。』\n\n鵺看完，低声嘀咕那句话写得真难看。可她没有再把笔放下。"
  shining_needle.4.a:0 "制度不必知道她是谁，也必须承认她站在这里。"
  # 事件概况：鵺拒绝用固定姓名签署平等起草书，引发关于身份保障与身份控制的争论。
  # 角色方向：正邪理解记录也能成为压迫工具；鵺则接受制度不只是牢笼，也可以成为追究统治者责任的凭据。

  shining_needle.5.t:0 "你把哪一只眼睛关上了"
  shining_needle.5.d:0 "正邪已经连续几晚无法入睡。闭上眼睛以后，她总能听见白天那些没有说出口的质问：死者家属的沉默、干部面对配给缺口时的迟疑，以及人群高呼她名字时那种令她不愿承认的满足。\n\n古明地恋就在这时出现在窗台上。她晃着双腿，像是从那些杂乱念头里直接长出来的。\n\n『你心里好吵。』恋说。\n\n『至少我还有东西可吵。』正邪没好气地回答，『不像你。把眼睛一关，什么都不必在乎。』\n\n恋的笑容停了一瞬。\n\n『你以为我是因为不在乎才关上的吗？』\n\n正邪第一次在她脸上看见近似受伤的表情。恋告诉她，第三只眼曾让别人的厌恶、恐惧与拒绝毫无遮挡地涌进心里。她不是没有感觉，而是感觉得太多，才把能够感受这一切的自己一起关了进去。\n\n『你呢？』恋反问，『一直骂、一直打、一直说自己不怕，就是睁着眼睛吗？』\n\n正邪想要反驳，却想起自己每次被问及胜利后的责任，都会先用更响亮的口号盖过去。一个人关上眼睛，另一个人则把怒火举得太高，好让谁也看不见下面究竟藏着什么。\n\n恋从窗台跳下来，向她伸出手。\n\n『我可以带你进去。可是我不认识回来的路。』\n\n『那你还敢说带我？』\n\n『因为你看起来也迷路了。』\n\n正邪盯着那只手许久，最后还是握了上去。她们谁都不是治疗者，也没有谁比谁更加清醒。正因如此，这条路只能由两个人一起走。"
  shining_needle.5.a:0 "那就一起迷路，再一起找出口。"
  # 事件概况：正邪误以为恋关闭第三只眼代表什么都不在乎，恋则指出正邪的愤怒同样是一种遮掩。
  # 角色方向：两人不是引导者与被治疗者，而是使用不同方法逃避痛苦、因此能够互相照见的同行者。

  shining_needle.6.t:0 "是谁把谁忘在这里"
  shining_needle.6.d:0 "进入无意识后，正邪首先看见的是无数张仰望自己的脸。有人称她为解放者，有人骂她是灾星，还有人反复追问死去的人应该由谁负责。每当她试图回答，人群便换成另一副面孔，让所有解释都显得虚假。\n\n她转身寻找恋，却发现身后空无一人。\n\n『你又跑了？』正邪朝黑暗喊道，『把我拖进来，然后像平常一样装作什么都与你无关？』\n\n没有回应。直到正邪开始怀疑恋是否真的来过，一只手才从她脚下的影子里伸出，死死抓住她的脚踝。\n\n恋从黑暗里抬起脸，眼中第一次没有笑意。\n\n『不是我走了。』她说，『是你一害怕，就只看得见自己。』\n\n正邪愣住了。恋也在发抖。她最深的恐惧并不是被讨厌，而是自己消失以后，旁人甚至不会察觉少了谁。她总是假装遗忘很轻松，因为承认想被记住，比被忘记本身更加难堪。\n\n『你不是根本不需要别人吗？』正邪问。\n\n『你不是根本不怕别人怎么看吗？』恋反问。\n\n她们同时沉默。原来两人都把对方想成自己不可能成为的模样：正邪羡慕恋仿佛不受任何目光束缚，恋则羡慕正邪敢让整个世界看见自己。可一个害怕被看见以后遭到拒绝，另一个害怕停止叫喊以后便再也无人注视。\n\n四周的声音再次靠近。正邪没有拔出武器，恋也没有沉回影子。她们抓住彼此的手，让那些赞美、责骂与恐惧从身边穿过。\n\n审判没有结束，只是第一次没有任何一个人独自留在原地。"
  shining_needle.6.a:0 "这一次，我会记得你也在这里。"
  # 事件概况：正邪在无意识中失去恋的踪影并误以为她逃跑，实际却是两人都被自身恐惧遮蔽了对方。
  # 角色方向：揭露恋害怕被遗忘、正邪害怕不被看见的共同伤口，让审判成为互相理解而非单方面剖析。

  shining_needle.7.t:0 "欢呼声结束以后"
  shining_needle.7.d:0 "无意识把正邪带回革命最初的一场暴动。她看见领主的粮仓燃烧，看见守卫逃跑，也看见挨饿的人群冲破大门。火光照亮无数笑脸，那正是她最喜欢的一段记忆。\n\n『你看。』正邪指向人群，像终于找到能够替自己辩护的证据，『她们当时也希望我把一切毁掉。』\n\n恋没有反驳，只把时间向后推了一天。\n\n火焰消失了。粮仓只剩焦黑的梁柱，人群正在瓦砾中寻找没有烧坏的粮袋。一个曾被正邪记成欢呼最响亮的女人跪在灰里，抱着孩子问还有没有东西能吃。\n\n『她不是在为火欢呼。』恋说道，『她只是看见仓门终于开了。』\n\n正邪想起自己当时忙着追赶逃走的领主，从未回头确认那些人后来怎样。她记住高墙倒下的声音，却没有记住墙后的人究竟需要什么；记住所有人跟着她冲进去的瞬间，却把欢呼误认为她们愿意永远生活在废墟里。\n\n『那座粮仓确实该被打开。』恋轻声说道，『可打开和烧光，是同一件事吗？』\n\n正邪蹲下身，从灰烬里捡起一把烧黑的麦粒。她没有否认那场反抗，也没有假装自己的愤怒毫无价值。有些门若不砸碎，永远不会为下面的人打开。她真正理解错误的地方，是把破坏成功的那一刻，当成所有人的愿望已经得到实现。\n\n『我不是因为掀桌而错。』正邪说道，『我是掀完以后只顾着看桌子怎么倒，忘了还有人在等着吃饭。』"
  shining_needle.7.a:0 "我不能只记得火烧起来的样子。"
  # 事件概况：正邪重新看见早期暴动的第二天，发现民众欢呼的是粮仓开放，而不是废墟本身。
  # 角色方向：不否定破坏旧秩序的必要性，而是让正邪理解推翻只完成了开门，不能代替门后的建设。

  shining_needle.8.t:0 "最高处的那个孩子"
  shining_needle.8.d:0 "无意识深处摆着一只破旧木箱。年幼的正邪站在上面，披着偷来的布当作斗篷，命令几只弱小妖怪排成队伍。她说得煞有其事，只因为站在那里时，所有目光都会抬起来看她。\n\n成年后的正邪立刻移开视线。\n\n『这不算什么。小孩子都会玩这种游戏。』\n\n『可你现在还想站在那里。』恋说道。\n\n木箱随即变成会议厅的高台、军队的指挥席与那张被推下楼梯的王座。正邪想要改写规则，想让任何人都无法再把自己踩回泥里，也享受命令被立即执行、所有人等待她开口的感觉。\n\n『对，我想要。』她终于承认，『我受够了只能在下面骂。我想让自己的话有重量，想让那些以前看都不看我的人必须听见。』\n\n她原以为说出这些会让自己的革命变得虚伪。恋却只是坐上木箱边缘，与她保持相同高度。\n\n『一直没有力量的人，想要力量有什么奇怪？』恋问，『想让自己不再无能为力，和想让所有人都无能为力，是同一件事吗？』\n\n正邪怔了很久。她真正的错误不是渴望权力，而是害怕承认这份渴望，于是任由它躲在理想后面，不受检查、不被命名，也没有边界。\n\n『如果我继续假装自己不想坐上去，』她看着那只木箱，『它迟早会在我看不见的地方变成王座。』\n\n这一次，她没有踢翻它，也没有坐上去。她在木箱侧面刻下一道线，标出任何权力都不得越过的高度。"
  shining_needle.8.a:0 "承认我想掌权，才能决定权力必须停在哪里。"
  # 事件概况：正邪看见童年时因被仰望而快乐的自己，承认革命之外也存在不愿再度无力的权力欲。
  # 角色方向：区分“希望自己拥有力量”与“希望别人失去力量”，将诚实面对欲望变成设置权力边界的前提。

  shining_needle.9.t:0 "给推翻我的人留一把钥匙"
  shining_needle.9.d:0 "回到现实后的第三天，正邪开始修订纲领。她写下公开账目、基层申诉、定期质询与罢免程序，却在涉及最高领袖时停了笔。\n\n『任何负责人皆应接受监督。』恋趴在桌边念道，『“负责人”是谁？』\n\n『所有掌权的人。』\n\n『包括谁？』\n\n正邪不耐烦地指向自己。恋却摇头：『纸不知道你指了谁。』\n\n那一刻，正邪终于明白自己仍在躲。把约束写成抽象原则很容易，因为未来总能有人解释最高领袖属于例外；真正困难的是让条文明确指出，发动革命、赢得战争与受到拥护，都不能成为免于追究的理由。\n\n她划掉原句，重新写下：『包括鬼人正邪在内，任何领袖皆可受到公开质询，并可依程序遭到罢免。阻止或报复申诉者，视同背叛下克上纲领。』\n\n写到自己名字时，她的笔尖在纸上停留太久，墨水慢慢晕开。恋没有催促，只把手指蘸进那团墨，在条文下方按出一个小小指印。\n\n『如果以后你说这不是你的意思呢？』恋问。\n\n『那你就把这张纸拿出来。』\n\n『如果你忘了我呢？』\n\n正邪抬头看她。她想起无意识里那只从影子中伸出的手，于是在指印旁补上一行：匿名、无户籍或无法被稳定辨认者，同样拥有提出申诉的资格。\n\n恋短暂地睁开第三只眼，亲眼看着正邪签名。那只眼睛很快再次闭上，但这一次不是为了逃开。\n\n『好。』她说道，『那我替将来想推翻你的那些人记住钥匙放在哪里。』"
  shining_needle.9.a:0 "革命若不能推翻自己的领袖，就不配叫作下克上。"
  # 事件概况：正邪在恋的追问下，明确把自己的名字写进罢免与监督条款，并保障无固定身份者的申诉权。
  # 角色方向：让正邪的自省承担真实政治风险，也让恋从害怕被遗忘转向主动成为制度记忆的一部分。

  shining_needle.10.t:0 "一把能从里面打开的钥匙"
  shining_needle.10.d:0 "芙兰决定暂时留下后，安置人员立刻遇到难题。有人建议腾出戒备森严的独立住所，也有人主张在门外安排轮班守卫。所有提案听起来都很周全，却只是准备把她从红魔馆的地下室搬进另一座较小的牢笼。\n\n正邪听完争论，从抽屉里取出一把旧钥匙，直接扔进芙兰怀里。\n\n『南仓旁边的小房间。门轴有点歪，自己想办法。』\n\n芙兰低头看着钥匙，没有移动。\n\n『这是试验吗？』她问，『看我多久以后会把房间弄坏？』\n\n『不是。』正邪回答，『我既没有相信你绝不会失控，也不认为多装两把锁就能拦住你。』\n\n这句话比毫无保留的信任更令芙兰意外。正邪没有把她说成已经痊愈的无害孩子，也没有因为可能发生的危险便预先判她有罪。\n\n『你真想走，哪一把锁拦得住？』正邪继续说道，『要留下，就自己开门进去。』\n\n房间里只有床、桌子和一扇关不严的窗。芙兰把钥匙插进门锁，从外面打开一次，又走进屋内，从里面打开一次。她反复试了好几遍，直到确定走廊上真的没有人等着把门重新锁住。\n\n当晚，她把骨灰罐放在桌上，握着钥匙睡着。第二天清晨，正邪在门口发现一副被拆下来的门轴，以及一张字迹犹豫的纸。\n\n『我想把门修好。修好以后，它还会是我的吗？』\n\n正邪在下方写道：『门是你的。修坏了也由你负责。』"
  shining_needle.10.a:0 "自由不是没有门，而是钥匙也握在自己手里。"
  # 事件概况：芙兰误以为新房间是另一场监禁或服从试验，最终确认门能够由自己打开，也由自己负责。
  # 角色方向：正邪既不假装芙兰毫无危险，也拒绝用尚未发生的错误惩罚她，让信任建立在选择与责任之上。

  shining_needle.11.t:0 "坏掉的水泵"
  shining_needle.11.d:0 "芙兰帮安置区搬运物资时，发现公共水泵的手柄卡在半途。她握住手柄稍一用力，铸铁外壳便在众人面前裂成数块。\n\n四周立刻安静下来。原本站在附近的人本能地后退了几步。有人低声说『果然是斯卡雷特』，仿佛一台水泵已经证明所有关于她的恐惧都是真的。\n\n芙兰望着那些退开的脚步，脸上的表情也随之冷下来。\n\n『所以这就是答案。』她说道，『只要我弄坏一次东西，你们就知道我永远只能弄坏东西。』\n\n正邪赶到后，没有安慰她，也没有训斥周围的人害怕得不够宽容。她只问：『水泵是你弄坏的？』\n\n芙兰点头。\n\n『那就修好。姓什么又不能让它重新出水。』\n\n河城荷取被叫来指导修理。她没有因为芙兰的身份降低要求，也没有把工具从她手中夺走。芙兰先后磨坏两个密封环，又把螺丝拧断一次，几次都以为荷取会让她离开；荷取却只把新的零件推过来，告诉她哪一步做错了。\n\n傍晚时，水泵终于吐出一股泥水，随后逐渐变得清澈。先前退开的人重新拿着水桶靠近，仍然小心，却没有拒绝使用她修好的水泵。\n\n『这样能证明我不是灾厄了吗？』芙兰低声问。\n\n『不能。』正邪回答，『只能证明你弄坏一台水泵，又把它修好了。一次失手不是判决，一次修好也不是赦免。你只是做了一件普通人也会做错、也能重新做好的事。』\n\n芙兰看着自己沾满机油的手。她第一次发现，被当成普通人并不意味着别人永远不再害怕她，而是自己的每一个错误，都不必再成为证明她天生错误的证据。"
  shining_needle.11.a:0 "做错了就修，不让血统替任何人回答。"
  # 事件概况：芙兰失手破坏公共水泵，把众人的恐惧理解成最终判决，随后在荷取指导下亲手修复设备。
  # 角色方向：普通责任既不是无条件原谅，也不是永久定罪；芙兰开始理解行为可以被纠正，而身份不必替行为承担全部意义。

  shining_needle.12.t:0 "明天见"
  shining_needle.12.d:0 "芙兰开始在新聚落协助安装窗框。她做得不算熟练，偶尔仍会把钉子连同木板一起捏碎，但她能够飞到屋檐下，也能独自抬起别人搬不动的横梁。施工队没有把她当成象征或贵客，只把最难搬的东西留给她，也会在她做错时毫不客气地叫她重来。\n\n收工时，一名负责给屋檐上色的孩子叫住她。\n\n『明天还来吗？红色那边还没涂完。』\n\n芙兰愣了一下：『为什么一定要我来？』\n\n『因为你不用梯子呀。』孩子理所当然地回答，随后抱着颜料桶跑远，『明天见！』\n\n芙兰站在原地很久。她听过誓言、命令、封印与关于永远的承诺，却很少有人如此随意地把她放进明天。那句话没有要求她继承谁，也没有担心她会不会失控；对方只是认定，今天一起工作的人明天还会回来。\n\n回到住处后，芙兰把骨灰罐移到床边的架子上，腾出桌面，在废纸上写下：『明天，红色屋顶。』\n\n正邪经过门口时看见那行字。芙兰抬头问她：『如果我明天不想去呢？』\n\n『那就自己告诉他们。』正邪回答，『没人能替你答应。但要是想去，就别迟到。』\n\n『如果我去了，他们以后会一直需要我吗？』\n\n『不知道。房子总会盖完，屋顶也总会刷完。』正邪停了一下，『可等这件事结束，你还可以再决定下一件想做什么。』\n\n芙兰重新看向纸上的字。过去的她总以为归属意味着被某个人永远需要，如今她第一次想到，或许归属也可以只是不断拥有下一次选择。\n\n她在纸上轻轻补了一笔。\n\n『明天见。』"
  shining_needle.12.a:0 "有人正在明天等她，而明天之后还会有新的明天。"
  # 事件概况：芙兰在工地获得一份普通的明日约定，并追问自己是否必须永远被需要才拥有位置。
  # 角色方向：将归属从对某个人的依附转化为持续选择生活的权利，避免用新的集体取代旧家族成为另一副枷锁。

  shining_needle.13.t:0 "第一张被撕掉的蓝图"
  shining_needle.13.d:0 "鵺、恋与芙兰第一次同时坐到正邪的会议桌旁，审阅新聚落的标准蓝图。方案看起来高效得无可挑剔：统一宿舍、集中食堂、固定名册、外侧门锁，以及由指挥部任命的管理员。\n\n『照这个盖，三个月能安置最多的人。』正邪说道。\n\n鵺先把名册翻到最后：『没有正式名字、经常改变形貌，或者根本不想交代来历的人住哪里？』\n\n『可以先登记临时身份。』\n\n『然后临时多久？由谁决定她终于像个“正常居民”？』\n\n正邪还没回答，恋已经用手指划过一排紧密相连的床位。\n\n『这里没有能一个人待着的地方。』\n\n『这是避难所，不是旅馆。』\n\n『害怕的时候也不准躲起来吗？』恋问，『还是只要大家都看得见，就能假装谁也没有在哭？』\n\n芙兰始终没有说话，只盯着宿舍门上的锁。过了一会儿，她问：『为什么锁装在外面？』\n\n设计人员解释那是为了火灾、骚动与危险居民。芙兰把自己房间的钥匙放在图纸上，轻声说道：『关我的人也总说是为了安全。』\n\n正邪感到一阵恼火。道路还没有修完，木料每天都在减少，眼前这份方案已经是能够最快执行的答案。她几乎想用一句“非常时期”结束争论，却忽然发现，自己正准备以效率为名，把三个人分别害怕的东西同时盖进新房子里。\n\n她没有辩解，而是抓起蓝图，从中央撕成两半。\n\n第二份方案直到天亮才完成。固定户籍改成可更换的居住编号；房门必须能从内部开启；大型宿舍之外增加少量独处空间；管理员的命令与物资账目公开，居民也能在不暴露身份的情况下申诉。\n\n新方案更贵、更慢，也仍然无法照顾所有人。鵺嫌监督条款不够尖锐，恋在独处空间旁画了一扇不存在的窗，芙兰则坚持亲自检查每一把门锁。没有任何人宣布分歧已经解决。\n\n正邪把修改后的图纸压在桌上。她终于理解，统治并不是把自己学到的答案塞给所有人，而是让那些答案接受现实中每一种伤口的反驳。\n\n几天后，第一根地基按照第二份蓝图落下。那不是一座完美新世界的开端，只是一栋没有重复她们已经理解过的错误的房子。"
  shining_needle.13.a:0 "能被指出错误的图纸，才有资格盖成房子。"
  # 事件概况：正邪提出高效率的统一安置方案，却被鵺、恋与芙兰分别指出身份登记、心理空间和外部门锁的问题。
  # 角色方向：三条角色线不以和谐会议合流，而是让各自的伤口真正改变国家建设；正邪也学习统治不是拥有答案，而是允许答案遭到修正。

  shining_needle.14.t:0 "图纸旁的配给表"
  shining_needle.14.d:0 "正邪把图纸摊在泥地上时，赤蛮奇先检查数字，影狼先看仓库位置，若鹭姬则蹲下来询问附近居民最缺什么。三个人很快发现，重建计划与配给表根本无法分开。\n\n修路需要建材，恢复农田需要工具，安置流民会占用住房，重新启动工坊又必须先分出燃料。每一项建设都会暂时挤压另一处需求，却也可能在几个月后带回更多产出。\n\n正邪决定将临时救济升级为重建配给。手中的资源从库存变成了粮食、工具、运输额度、劳动力与行政能力的总和。每一次拨付都代表国家选择先让哪一部分重新站起来。\n\n赤蛮奇提醒她：『别只记得分出去多少。要记得东西最后有没有真的到。』"
  shining_needle.14.a:0 "从今天起，配给也必须替明天生产。"

  # 事件概况：资源小游戏进入第二阶段，从战后救济转为生产与重建投资。
  # 角色方向：草根三人分别代表监督、行动与道德底线，使机制与角色自然结合。

  shining_needle.15.t:0 "被丢掉的东西来报到"
  shining_needle.15.d:0 "多多良小伞来到工地时，身后跟着一支奇怪的队伍：缺口的锅、断弦的琴、锈蚀的刀、无法转动的旧车，以及一群同样不确定自己还能做什么的付丧神。\n\n『听说这里收别人不要的东西！』小伞兴高采烈地说完，突然察觉这句话也包括自己，笑容便短暂地僵住了。\n\n正邪没有安慰她，只把维修清单塞进她怀里：『先证明这些东西还能动。然后去告诉所有人，被丢掉和没用是两回事。』\n\n几天后，第一辆修复的运输车重新发动。小伞站在车顶笑得比引擎还响。那些曾被扔进角落的器物，开始成为新社会最早转动的机器。"
  shining_needle.15.a:0 "旧物不是废物，付丧神也不是。"

  # 事件概况：小伞与付丧神加入重建的招募事件。
  # 角色方向：让小伞获得被需要的喜悦，同时保留她对再次被工具化的敏感。

  shining_needle.16.t:0 "粮仓门后的冬天"
  shining_needle.16.d:0 "旧豪强的粮仓被打开时，里面的数量远超此前申报。仓主辩称这些是来年种粮、家族储备与受托保管的财产，可仓外已经有人因饥饿倒下。\n\n影狼带人控制入口，赤蛮奇逐项核对账目，若鹭姬坚持保留足够的种子，避免今天吃完以后明年继续挨饿。正邪则当众收走钥匙，将库存纳入公共配给。\n\n没有欢呼持续太久。运输、保存与发放很快成为新的问题，部分干部甚至试图替自己的地区提前领取。正邪下令公开每日流向，让接管粮仓同时接受所有人的检查。\n\n砸开锁只能救下今天。让粮食持续进入锅里，才是新制度真正的考验。"
  shining_needle.16.a:0 "钥匙归公，账目也必须归所有人查看。"

  # 事件概况：集中接管粮仓路线的落地事件，呈现查封、征收与公开监督。
  # 角色方向：正邪采取强硬措施，草根三人则确保征收不会变成新一轮掠夺。

  shining_needle.17.t:0 "分到土地以后"
  shining_needle.17.d:0 "荒废庄园被重新划分以后，许多人第一次拥有了能够耕作的土地。登记当天充满争执，却也带着战后少见的期待。\n\n几天后，若鹭姬带回另一份报告：有人没有种子，有人缺少农具，有些田地的水渠早已毁坏。单独一户即使得到土地，也无法承担全部修复工作。\n\n地方互助工坊因此与土地分配同时建立。影狼负责组织劳力，赤蛮奇检查地方代表是否暗中偏袒亲近者，若鹭姬则让拥有余粮与工具的村落支援暂时无法开工的邻居。\n\n土地回到耕作者手中只是第一步。真正的自治，必须让人有能力把自己的决定做成。"
  shining_needle.17.a:0 "把土地交下去，也把工具和决定权交下去。"

  # 事件概况：地方互助路线的后果事件，补足土地改革之后的生产困难。
  # 角色方向：避免把分田写成自动成功，突出草根网络与地方能力的重要性。

  shining_needle.18.t:0 "百器生产委员会第一次开会"
  shining_needle.18.d:0 "第一次委员会会议开得混乱不堪。工匠要求标准化零件，付丧神担心自己被当成不会说话的机器，运输者抱怨计划完全没有考虑道路状况，地方代表则坚持先修民生设施。\n\n弁弁问自己的琴是否也会被拆成材料，八桥则反问，若一件器物拥有意识，它究竟是工人、工具，还是两者都是。小伞在旁边举手，认真要求惊吓工作也应算作特殊劳动。\n\n正邪没有替所有争议给出答案。她只确定三条规则：生产计划必须公开，委员会成员可以被撤换，付丧神拥有拒绝被拆解与改造的权利。\n\n从此以后，资源分配不再只是从仓库拿出旧存货。工会与百器委员会开始持续制造、维修与运输新的物资。"
  shining_needle.18.a:0 "让生产者决定机器该怎样运转。"
  # 事件概况：建立工会与百器生产委员会，并将资源小游戏转入稳定生产阶段。
  # 角色方向：处理付丧神既是器物又是劳动者的独特问题，避免把她们再次工具化。

  shining_needle.19.t:0 "从废墟里偷来的书"
  shining_needle.19.d:0 "被搬进会议室的书来自旧官署、学校废墟、贵族书房与无人认领的仓库。正邪把讲革命、国家、工会与政党的书堆在地上，像面对另一种需要拆解的武器。\n\n鵺翻了几页便开始冷笑，恋在理论旁画出没有意义的圈，芙兰则盯着反复出现的领袖姓名，问人类为何总喜欢用名字把自己锁进历史。\n\n正邪并不崇拜这些作者。她只是承认，前人已经犯过许多自己尚未来得及犯的错误。若连那些失败都不愿研究，她的革命迟早会以全新的口号重走旧路。\n\n于是夜校、干部读书会与简化读本开始出现。革命第一次认真学习自己可能如何腐坏。"
  shining_needle.19.a:0 "把他们的答案拆开，留下能用的部分。"
  # 事件概况：人类政治书籍进入正邪政权，为后续政党路线提供理论来源。
  # 角色方向：正邪不成为教条崇拜者，而是把理论当作可批判、可拆解的工具。

  shining_needle.20.t:0 "罗莎与托洛斯基留在桌上"
  shining_needle.20.d:0 "两本书被正邪留在桌上最久。一本警告政党脱离群众以后，解放会变成新的代管；另一本提醒她，孤立的革命终将被更庞大的旧世界围困。\n\n鵺担心集中组织长出新的高墙，赤蛮奇质问基层如何撤换上级，影狼只问命令能不能及时送到前线与工地。恋则指出正邪同时迷恋两种东西：群众给予的正当性，以及中央命令带来的效率。\n\n正邪最终没有从书里找到能够免除矛盾的公式。她只确定，革命需要群众不断提供生命，也需要组织把决定送到真正执行的人手中。\n\n接下来的选择，将决定两者之中谁先获得更大的位置。"
  shining_needle.20.a:0 "理论不能替我们选择，但能让我们知道自己在选择什么。"
  # 事件概况：群众路线与政党指挥路线分叉前的政治讨论。
  # 角色方向：让不同角色从自身经验发言，保留正邪对自由与效率的双重需求。

  shining_needle.21.t:0 "临时纲领的最后一票"
  shining_needle.21.d:0 "临时纲领表决前，会议已经持续了两天。代表撤换、中央权限、地方自治、公开批评、资源分配与干部审查，每一条都留下不同笔迹的修改痕迹。\n\n正邪坐在末席，没有要求任何人因为她是革命领袖便接受原稿。鵺保住了公开质疑的权利，恋迫使纲领承认领袖会自欺，芙兰则删除了所有可能依照血统与物种安排地位的条文。\n\n最终表决通过时，掌声并不整齐。有人仍觉得中央太强，有人担心群众会议拖慢行动，也有人认为监督条款会让政府无法果断行事。\n\n正邪将这些反对意见与纲领一起封存。她要建立的不是永远没有争议的党，而是一个争议不会自动变成罪名的党。"
  shining_needle.21.a:0 "通过。然后从明天开始接受它的约束。"
  # 事件概况：下克上临时纲领的正式表决与通过。
  # 角色方向：把三条角色线与两种组织路线汇入一份仍保留矛盾的制度文本。

  shining_needle.22.t:0 "第一个冬天的总账"
  shining_needle.22.d:0 "第一场雪落下时，重建委员会送来了总账。有人终于住进不会漏雨的房子，有些工坊重新点火，新的道路将粮食送进过去无法抵达的地区；同时，仍有聚落领取不足，仍有伤员等不到药，也仍有人认为自己的牺牲从未被看见。\n\n正邪没有把这份报告改写成胜利故事。她要求将资源分配记录、未完成工程与各地申诉一同公开。此前得到支援的群体开始回馈运输、人力与生产，长期被忽视的地方则留下更深的裂痕。\n\n这个冬天没有让所有人都过得好，却证明幻想乡已经能够把有限物资变成持续运转的社会。\n\n正邪合上总账。她终于让颠倒后的世界撑过了第一个季节。"
  shining_needle.22.a:0 "把结果留下。下一次分配要记得这些人。"
  # 事件概况：战后资源分配阶段的总结事件，适合依各群体投入值追加条件描述或不同选项。
  # 角色方向：不把重建写成完美成功，让玩家过去的分配选择成为后续国家能力与社会缺口。

  shining_needle.23.t:0 "从月面回来的使者"
  shining_needle.23.d:0 "稀神探女抵达时没有仪仗。她独自站在新政府门前，衣物没有沾上尘土，神情却像已经走过很长的路。\n\n正邪看见她的第一眼，身体便先于记忆产生反应。熟悉、愤怒与某种几乎要脱口而出的称呼同时涌上来，随后又被空白切断。\n\n探女没有解释两人的关系。她取出月军部署、占领区行政方案与地球各国的战况，告诉正邪，月都已经开始把地球纳入自己的统治体系。那些愿意合作的政府将被保留，地上生命则会成为月面秩序中的低阶臣民。\n\n『你为什么告诉我？』正邪问。\n\n探女沉默许久，只在纸上写下：因为我已经失去你一次。"
  shining_needle.23.a:0 "先谈战争。过去的事之后再算。"
  # 事件概况：探女正式登场，同时带来月都殖民地球的情报。
  # 角色方向：以身体记忆暗示母女关系；探女克制少言，正邪则把私人情绪暂时压在行动之后。

  shining_needle.24.t:0 "月面秩序中的地球"
  shining_needle.24.d:0 "探女展示的文件没有写着毁灭地球。月都计划保留城市、工厂、道路与大部分旧政府，因为活着的地球能够提供物资、劳力与服从。\n\n各国统治者只需承认月都拥有最终裁决权，便可以继续管理自己的臣民。月军负责驻防与镇压，月面官员控制外交、军备和关键资源，地上生命则被划入一个永远低于月人的政治等级。\n\n正邪读完后反而笑了。她太熟悉这种安排：上位者保留愿意合作的中间人，再让下面的人相信世界只能如此运转。月都带来的不是陌生制度，只是把旧世界的高低之分抬到了地球与月亮之间。\n\n『很好。』她把文件反扣在桌上，『既然他们把整颗地球放在下面，那这会是有史以来最大的一次下克上。』"
  shining_needle.24.a:0 "月都要的是服从，我们就让服从本身反叛。"
  # 事件概况：明确正邪线的月人目标是殖民、统治与阶级支配，而非紫线的灭绝计划。
  # 角色方向：正邪迅速把外来征服放进自己的革命逻辑，准备联合地上底层反击。

  shining_needle.25.t:0 "母亲必须说出的真相"
  shining_needle.25.d:0 "探女把一只狭长的木盒推到正邪面前。盒中只有一条褪色的发带、一只刻着歪斜名字的木杯，几张被撕去日期的旧纸。\n\n正邪拿起那只木杯时，记忆毫无预兆地涌了回来。\n\n她看见月都令人窒息的庭院，看见幼小的自己躲在探女衣袖后面；看见探女替她绑好头发，教她在人前保持安静；也看见一群从不低头看她的月人，在纸上决定这个不够纯净的孩子应当被处置。\n\n最后出现的是一个没有月光的夜晚。探女紧紧抱着她穿过无人走廊，把她交给通往地上的秘密通道。年幼的正邪哭着抓住母亲的衣袖，不肯松手。\n\n随后，连那只手也从记忆里消失了。\n\n木杯从正邪手中落下，撞在桌面上。她猛地站起来，椅脚刮过地板，发出尖锐刺耳的声音。\n\n『是你。』她盯着探女，呼吸急促得几乎说不完整，『是你把这些从我脑子里拿走的。』\n\n探女没有否认。她在纸上写道：只要月都仍有人记得那个孩子，处决计划就可能再次开始。为了让正邪真正消失在月都的判断之外，她必须让所有相关者遗忘，也必须让正邪忘记自己的来处。\n\n『所以你没有丢掉我。』\n\n这句话从正邪口中出来时。她忽然笑了一声，笑声却比哭泣更加难听。\n\n『我恨了你这么多年。每一次被赶走、每一次被当成不该存在的东西，我都告诉自己，那是因为连我的母亲都不要我。』她抓紧桌沿，指节逐渐发白，『现在你却告诉我，那些年全都建立在一个你替我决定的谎言上？』\n\n探女写下：对不起。\n\n正邪一把夺过那张纸，将它揉在掌心。\n\n『别急着道歉。』她的声音开始颤抖，『告诉我，你为什么从来没有回来找我。』\n\n探女沉默许久，才重新落笔。只要她主动确认正邪仍然活着，月都便可能沿着她的行动重新发现那个被遗忘的孩子。她只能留在月面，继续装作自己从未拥有过一个女儿。\n\n如今月军已经踏上地球，遗忘不再能够保护任何人。探女也没有理由继续沉默。\n\n正邪没有拥抱她，也没有说出原谅。她扶起被自己撞倒的椅子，重新坐到探女对面，把那只刻着幼稚名字的木杯紧紧握在手里。\n\n『从头开始说。』\n\n探女抬起眼。\n\n『我的小时候、那份处决命令、你送走我的那一晚——一个字都不准省。』正邪说道，『你从我这里拿走了多少，现在就还回来多少。』"
  shining_needle.25.a:0 "把属于我的过去，全部还给我。"
  # 事件概况：探女借由旧物唤回正邪的具体记忆，并承认自己为阻止处决而让所有人遗忘正邪。
  # 角色方向：正邪同时感到被拯救的宽慰与被夺走人生的愤怒；她没有立即原谅探女，而是首先夺回知晓自身过去的权利。

  shining_needle.26.t:0 "梦里没有检查站"
  shining_needle.26.d:0 "哆来咪·苏伊特在作战会议上摊开一张谁也看不懂的地图。那不是地形，而是无数人的梦彼此接触时留下的路径。\n\n月军可以封锁道路、检查电台、搜查信件，却无法让每个士兵和占领区居民停止做梦。哆来咪提出利用梦境运送口令、确认身份，并让地球抵抗组织与月都内部不满者建立最初的联系。\n\n探女负责指出月军警戒最薄弱的时段，正邪则要求每条梦境线路都准备替代联络人。她不愿把革命押在一位梦境支配者的善意上，哆来咪对此反而十分满意。\n\n第一条消息当晚越过封锁：地球仍在抵抗。月兔并非只能服从。"
  shining_needle.26.a:0 "从他们封不住的地方开始联络。"
  # 事件概况：哆来咪加入，建立梦境地下通信网，并连接后续翻转主义传播。
  # 角色方向：哆来咪提供独特能力，正邪仍坚持组织备援，避免援军变成万能工具。

  shining_needle.27.t:0 "最后的下克上"
  shining_needle.27.d:0 "月军在地球上的占领区继续扩大。新的合作政府已经宣誓服从月面指挥，尚未沦陷的国家则收到最后通牒。幻想乡若继续等待，很快便会被一个完全受月都支配的世界包围。\n\n正邪签署了对月作战命令。她没有替旧王座保卫领土，也没有承诺恢复原来的国际秩序。她只承认一条最基本的事实：生活在地球上的人，必须拥有决定地球未来的权利。\n\n军队开始集结，地下联络网向占领区发出信号，重建时期建立的工坊与配给委员会也收到转入战时体制的准备命令。\n\n『如果地球上只剩最后一个还敢反抗月都的人，』正邪对众人说道，『那就由我当那个最后的人。然后再把所有人一个个拉回来。』"
  shining_needle.27.a:0 "向侵入地球的月人宣战。"
  # 事件概况：后半段战争正式开场，正邪决定阻止月都完成对地球的统治。
  # 角色方向：她不替旧秩序而战，而是保卫地上生命决定自身未来的权利。

  shining_needle.28.t:0 "非常时期"
  shining_needle.28.d:0 "紧急议会召开时，探女已经在地图上标出月军运输节点与预计推进速度。结论十分明确：幻想乡必须在最短时间内把生产、配给、运输与兵力编进同一套总体计划。\n\n战时共产主义随即实施。重要工坊、能源、铁路与仓储统一调度，粮食和原料集中征收，生活必需品按定额配给。工人组成生产队，农民组成供给队，河童与付丧神进入工程维修单位。\n\n此前负责战后重建的工会、地方委员会与配给处没有被撤销。它们被直接改造成总体战的执行网络，继续公开库存、监督流向，并将基层需求送回紧急议会。\n\n幻想乡从这一夜开始像一座巨大军营般运转。非常政策集中了一切可以战斗的力量，也把正邪早先建立的监督制度推到了最严峻的考验之中。"
  shining_needle.28.a:0 "把配给表翻到战时的一面。"
  # 事件概况：战时共产主义、兵营式共产主义与总体战的制度化事件，同时转换资源小游戏阶段。
  # 角色方向：非常政策继承既有委员会网络，使集中动员与前半段的群众监督保持连续。

  shining_needle.29.t:0 "探女没有开口"
  shining_needle.29.d:0 "《翻转世界决议》在紧急议会中逐条通过。地球拒绝月都的最终裁决权，幻想乡将援助各地抵抗组织，并把战争目标推进到瓦解月面殖民体系。\n\n轮到探女表态时，会场突然安静下来。所有人都知道她来自月都，也知道她只需说出一句话，便能让局势向无法预测的方向逆转。\n\n探女没有发言。她拿起笔，在决议末尾签下自己的名字。\n\n正邪随后签字，并命令文件立刻送往各战区。只有她注意到，探女在收回手时轻轻颤了一下。那份沉默不是犹豫，而是在为将来某个必须由她说出口的败局保留力量。"
  shining_needle.29.a:0 "有些话必须留到最危险的时候。"
  # 事件概况：签署《翻转世界决议》，并用探女拒绝发言预示后续能力逆转。
  # 角色方向：探女以公开签名承担政治立场，同时保持其少言与谨慎使用能力的特点。

  shining_needle.30.t:0 "生为天邪鬼的决心"
  shining_needle.30.d:0 "决议签署以后，其他人陆续离开会议室。桌上的墨迹还没有干，探女仍站在原处，像是还有什么必须说出口，却又害怕一旦开口，事情便会朝无法挽回的方向翻转。\n\n她走到正邪面前，下意识伸出手，想替她理好被风吹乱的衣领。那是一个来自很久以前的动作，熟练得甚至不需要记忆。\n\n正邪猛地扣住了她的手腕。\n\n『别再用那种眼神看我。』\n\n探女停住了。\n\n『像我还是那个随时会被人发现、随时会被处死，只能靠你藏起来的孩子。』正邪的手指微微发抖，却没有放开，『你救过我一次。可你不能因为害怕再失去我，就替我决定以后该往哪里走。』\n\n探女低下头，在决议书背面写下三个字。\n\n『对不起。』\n\n正邪盯着那三个字看了很久。\n\n『知道你没有抛弃我的那一天，我差点就想叫你一声母亲。』她忽然说道，声音比刚才更低，『然后我更生气了。因为只要我还恨你，我就可以假装自己从来没有想过你。可现在连这个借口也没有了。』\n\n探女的肩膀轻轻颤了一下。她再次抬起手，却在碰到正邪之前停住。那段失去的岁月横在两人之间，不会因为一句真相、一次道歉便自动消失。\n\n正邪松开她的手腕，却没有后退。她反过来握住探女悬在半空中的手，将它拉到与自己相同的高度。\n\n『我去打月都，不是为了让他们承认我配做你的女儿，也不是为了替你赎罪。我要让那群高高在上的家伙再也不能决定谁该出生、谁该消失，又是谁只能永远活在下面。』\n\n探女看着她，终于不再试图把她拉回安全的地方，只缓缓点了点头。\n\n正邪转身走向门口。探女在身后重新提笔，写下一句话递给她。\n\n『我会等你回来。』\n\n正邪看完，将纸翻到背面，添上自己的回答。\n\n『不准只站在后面等。跟上来。』"
  shining_needle.30.a:0 "别再替我挡住道路——站到我身边。"
  # 事件概况：决议签署后，正邪第一次向探女承认自己曾经思念母亲，也坦白这份思念为何让她更加愤怒。
  # 角色方向：两人没有凭借一次谈话完全和解；探女放下替女儿选择命运的习惯，正邪则允许母亲从保护者变成并肩作战的人。

  shining_needle.31.t:0 "真理部与记者"
  shining_needle.31.d:0 "真理部成立后的第一份通告被射命丸文原样退回。纸上只有一句批注：如果你们已经决定什么是真相，还需要记者做什么？\n\n正邪亲自把文叫来。两人在电台控制室争论了很久。月都正在伪造战报、包装投降，并让占领区相信地球自愿接受统治；可一个能够管制所有消息的机关，同样可能把自己的错误藏进战争需要之中。\n\n最终确定的规则并不温和，却十分清楚：真理部负责核验来源、揭露月人宣传、保护地下网络，不得把政策批评自动列为敌方渗透。文保留独立署名与追问权，委员会则定期审查被扣押的报道。\n\n文收起修改后的文件，笑得仍不怎么可信。『很好。那我就负责提醒大家，你们也会说谎。』\n\n『正合我意。』正邪回答。"
  shining_needle.31.a:0 "我们对抗的是月人的垄断，不是人民开口的权利。"
  # 事件概况：处理「争论不是背叛」与「设立真理部」之间的制度张力。
  # 角色方向：文捍卫诠释权，正邪建立战时反情报机关，同时接受机关本身必须受监督。

  shining_needle.32.t:0 "第二份传单并非来自地上"
  shining_needle.32.d:0 "第一份翻转主义传单出现在月兔兵营时，月都立即将它定性为地上人的思想污染。粗糙纸面只写着三个问题：谁在前线死去？谁在高处下令？为什么这种差别必须永远维持？\n\n几天后，搜查人员发现了第二份传单。这一次，纸张来自月军仓库，文字也由制式印刷机排得整整齐齐。原本的问题下面还多出一句：『为什么牺牲总被称为月都的荣耀，得到荣耀的却从来不是我们？』背面则列着各支月兔部队的真实伤亡、被克扣的补给，以及从未离开月面却获得战功的贵族军官。那些资料只有医疗、运输与档案人员能够取得。\n\n镇压随即扩大，可传单也开始脱离地上力量自行传播。运输兵把它藏进军需箱，医护人员将伤亡数字写进药品清单，下级文官则故意把搜查命令送往错误部门。哆来咪随后从梦境中收到月都内部的请求：『不要替我们决定以后由谁统治。告诉我们，怎样在不知道彼此真名的情况下继续组织。』\n\n正邪没有送去新的口号，只提供秘密小组、身份暗号、分散印刷与失联后的应变方法。探女指出巡逻空隙，哆来咪维持联络，真正挑选目标、撰写内容并承担风险的，却已经是月都内部的人。\n\n不久，兵营、医院、运输队与下级机关分别出现秘密组织。她们未必拥有相同理想，却逐渐认清同一件事：月都的高洁，一直建立在某些人必须替它承受死亡与污秽之上。不断扩大的忠诚审查也迫使原本沉默的人互相确认立场；最初只为保护同伴的小动作，逐渐变成对整个等级制度的怀疑。\n\n第一份传单来自地上，第二份来自月都自己。从那一刻起，这便不再是被输入月面的思想，而是一场开始使用自身语言说话的反抗。"
  shining_needle.32.a:0 "当他们开始书写自己的问题，革命才真正进入月都。"
  # 事件概况：月兔与月都下层人员自行改写第二份传单，逐步建立不受地上直接指挥的地下组织。
  # 角色方向：正邪只提供组织方法与联络支援，不替月都内部决定诉求、领袖或未来制度。


  shining_needle.33.t:0 "这场反抗必将失败"
  shining_needle.33.d:0 "月都的镇压比预期更加迅速。兵营遭到封锁，月兔部队被分批解除武装，梦境联络点接连沉默。几支准备起事的部队甚至来不及打开军械库，成员便被忠诚审查机关带走。从地图上看，反抗已经走到失败边缘。\n\n然而，为了找出潜伏者，月都也开始撕裂自己的统治体系。前线军官不再信任运输队，议会互相指控对方纵容叛乱，负责镇压的部队还必须接受另一支部队监视。命令停在审查机关，仓库堆满无法取得正确印章的物资，各地指挥官则收到彼此矛盾的调动要求。月都仍拥有舰队与炮台，却越来越难让这些力量服从同一个声音。\n\n探女走到地图前，看见那些已经绷紧到极限的裂缝，终于开口：『这场反抗必将失败。』\n\n话语落下，最先改变的不是战线，而是命令。一支奉命缴械的月兔部队逮捕军官、打开武器库；运输车队改变路线，将弹药送入起义地区；下级文官删除逮捕名单，医护人员拒绝把伤员交给审查机关。重新连接的梦境线路也向各地送出同一个行动时刻。\n\n月人的统治集团随即陷入互相猜疑。部分贵族认定军方发动政变，另一些人则封闭机关、把精锐部队调回保护自己的宅邸。原本应该镇压月兔的部队，反而在议会与贵族领地之间彼此对峙。\n\n正邪立即启动备用方案，却没有命令地上军队接管月都。抵抗军只负责截断增援、运送武器与守住地月通道，让内部起义者拥有完成革命的机会。探女的能力没有凭空创造反抗，只让早已存在的裂缝同时张开；正邪的准备，也只是阻止月都重新把它们合拢。\n\n很快，月都的防御灯仍然亮着，中央命令也仍在不断发出，却再也没有足够的人愿意执行。它不是被地上军队从外面攻破，而是从兵营、仓库、医院、档案室与紧闭的贵族大门之间，一层一层失去了让下位者服从的能力。"
  shining_needle.33.a:0 "不是我们攻破了月都，是月都再也无法命令下面的人。"
  # 事件概况：忠诚审查加速月都内部瓦解，月兔兵变、运输倒戈、官僚破坏与贵族内斗同时爆发。
  # 角色方向：探女让既有裂缝同步张开，正邪负责阻断镇压；完成革命的主体仍是月都内部的反抗者。

  shining_needle.34.t:0 "吾名正邪，生来就是天邪鬼"
  shining_needle.34.d:0 "月都中央广场的高台原本只允许贵族与统帅踏上。如今，月兔扯下血统等级的帷幕，下级文官把处决与强制服役名册堆在台阶前，地球抵抗者则站在曾向他们发布殖民命令的宫殿外。\n\n所有人都在等待胜利者登上最高处。\n\n正邪却抬脚踢断高台支架。华丽台面倾斜、坠落，最后与广场地面撞成同一高度。她踩过碎裂的月都纹章，站到月兔、工匠、士兵与获释囚犯之间。\n\n探女来到她身旁，轻声问：『你终于回到故乡了吗？』\n\n『我不是回来继承这里。』正邪望向那座曾裁定她不配活着、又企图把地球踩在脚下的都城，『我是跟所有被它赶走、压住、命令闭嘴的人一起，回来结束它。』\n\n广场逐渐安静。正邪展开解除强制服役、释放政治犯、废除血统等级与承认地球独立的命令，却没有宣布由自己接管月都。\n\n『听清楚，月人、月兔、地上人，还有所有曾被写在最下面的人。』\n\n『他们说，血统决定谁能站在高处，纯净决定谁有资格活着；他们把掠夺叫作秩序，把服从叫作和平，再把下面的人流的血写成上位者的荣耀。今天，这些道理和那座高台一起倒了。』\n\n『月兔不是替贵族赴死的工具，地球不是月都的属领，月亮也不是悬在众生头顶的王座。没有任何家族、种族或星球，生来就有裁决其他生命的权利。』\n\n『我不会成为你们的新主人。若你们推翻月都以后，只是等待另一个名字发号施令，那么月都从来没有真正倒下。去组织、去争论、去决定这里应该变成什么；也把推翻下一位统治者的力量留在自己手里。包括哪一天需要推翻我。』\n\n正邪抬起下巴，望向地球的方向。\n\n『吾名正邪，生来就是天邪鬼。天若高高在上，我便将天翻作地；月若以纯净为名践踏众生，我便让所有被称作污秽、低贱与不该存在的人站到它面前。』\n\n『今天被翻下来的不只是一群统治者，而是那条宣称某些生命天生应该跪下的道理。只要还有谁想把别人压回下面，只要命运仍由高位者替弱者写下——下克上就不会结束。』\n\n『而我，也绝不会停下。』"
  shining_needle.34.a:0 "从此没有天生的高位，也没有注定的下等。"
  # 事件概况：正邪在月都中央广场摧毁贵族高台，宣布废除强制服役、血统等级与地球殖民体系。
  # 角色方向：正邪拒绝成为月都的新主人，并把反抗未来统治者——包括她自己——的权利留给所有人。

 # ===========================================================================
  # 鬼人正邪路线——战后生活风味事件
  # shining_needle.35～shining_needle.54
  # ===========================================================================

  shining_needle.35.t:0 "倒着放也不会洒的茶杯"
  shining_needle.35.d:0 "付丧神生产委员会推出了一种外形十分可疑的新茶杯。杯口看起来像底座，底座又像杯口，第一次使用的人总要来回翻上几次，才能确认究竟该从哪里喝。\n\n多多良小伞坚持这不是做反了。杯中藏有一块配重，即使被碰倒，也会摇摇晃晃地重新立起。她把第一只成品送到正邪桌上，并在包装纸写下「像天邪鬼一样拒绝顺从重力」。\n\n正邪认为这句广告蠢得要命。三天后，商店门口排起长队；一周后，连她自己的会议桌上都换成了这种杯子。"
  shining_needle.35.a:0 "至少这次掀桌不会浪费茶。"
  # 事件概况：付丧神工坊把正邪的反转形象做成日常商品，展现战后消费品与幽默感恢复。
  # 叙事方向：用一只实用又荒唐的茶杯表现新政权的文化影响，并让小伞保留爱吓人与夸耀作品的性格。

  shining_needle.36.t:0 "混沌杂烩成为招牌菜"
  shining_needle.36.d:0 "配给最困难的时候，米斯蒂娅只能把各处厨房剩下的一小把米、几片蘑菇、河鱼边角与不知名野菜丢进同一口锅里。那原本只是为了让更多人吃到热食，谁也没有替它取名。\n\n粮食供应逐渐恢复后，客人却开始主动询问「以前那种什么都有一点的汤」。米斯蒂娅试着使用更好的材料重做，反而被抱怨少了当时的味道。最后，她只得在菜单上正式写下「混沌杂烩」，并规定每天依市场剩料改变配方。\n\n一道因匮乏诞生的食物，就这样成了重建区最受欢迎的晚餐。"
  shining_needle.36.a:0 "今天锅里又会是什么？"
  # 事件概况：紧急配给时期的混合料理在生活恢复后变成地方商品与共同记忆。
  # 叙事方向：强调浩劫并未被浪漫化，但幸存者能够把窘迫经验转化成新的饮食文化。

  shining_needle.37.t:0 "把补丁缝在最显眼的地方"
  shining_needle.37.d:0 "布料仍然短缺，许多衣服只能一补再补。最初，人们总想找颜色相近的旧布遮住破口，仿佛只要针脚够细，就能假装战争没有留下痕迹。\n\n后来，一名年轻裁缝反其道而行：她用鲜艳布块盖住烧焦的衣角，又把修补日期与重建队的名字绣在外侧。没过多久，人里青年、草根妖怪和工坊学徒都开始展示自己的补丁，甚至有人故意在新衣上加一块假的。\n\n正邪看着满街不肯隐藏伤痕的衣服，只评价了一句：「总算有点眼光。」这句话立刻被裁缝印上了下一批布标。"
  shining_needle.37.a:0 "伤痕不必藏在里层。"
  # 事件概况：物资匮乏形成外露补丁的服装潮流，后来演变成重建世代的身份象征。
  # 叙事方向：让战争伤痕进入日常审美，表现民众不是遗忘灾难，而是重新定义它留下的痕迹。

  shining_needle.38.t:0 "帽檐朝后的年轻人"
  shining_needle.38.d:0 "不知从哪一天开始，人里的年轻人流行把帽子反过来戴。妖怪山的商贩很快跟进，推出倒置头巾、左右不对称的发带，甚至还有一顶怎么看都像戴错了的高帽。\n\n射命丸文拍下整条街的奇装异服，把它称作「天邪鬼风潮」。正邪看到报纸后，当场表示这群人根本没理解下克上，只是在集体犯蠢。\n\n第二天，商家把这句话印成宣传单。「连正邪本人都无法理解的真正反叛时尚」使销量再次翻倍。文特地送来一顶最大号的反戴帽，随后在正邪把它扔出窗前完成了拍照。"
  shining_needle.38.a:0 "谁敢把那张照片登出来？"
  # 事件概况：年轻人把正邪形象转化成反戴帽与不对称服饰的流行风潮。
  # 叙事方向：不把文化影响写成官方宣传，而是表现民间如何误读、玩弄并重新包装政治符号。

  shining_needle.39.t:0 "一寸高的革命"
  shining_needle.39.d:0 "木工坊利用边角料制作了一批小木槌、针剑与可以推倒的纸王座，原本打算作为庆典纪念品出售。结果最先买走它们的不是干部，而是一群孩子。\n\n新的游戏规则很快在街巷成形：抽到王冠的人必须守住纸王座，其余人则拿着木槌从四面八方发动下克上。王座每次都会在半分钟内倒下，接着所有人争着扮演正邪，谁也不肯当被推翻的高位者。\n\n正邪路过时被强行拉进游戏。孩子们一致决定让她扮演「坐得最高的大坏蛋」，然后追着她跑了整条街。"
  shining_needle.39.a:0 "这规则绝对有问题！"
  # 事件概况：战后纪念品成为儿童游戏，正邪本人反而被分配成遭到推翻的一方。
  # 叙事方向：以轻松方式表现革命语言进入下一代生活，同时避免把儿童写成严肃的政治宣传工具。

  shining_needle.40.t:0 "失败者也该留下名字"
  shining_needle.40.d:0 "上白泽慧音整理了一本没有英雄的战争记录。书中收录失去家人的村民、走错道路的传令兵、在最后一刻投降的敌军，以及只记得自己躲在桌下发抖的人。\n\n有人质疑这些经历不够光荣，也有人认为败者的声音会削弱革命叙事。正邪翻过几页，只问了一件事：「她们是不是都活过那场战争？」\n\n得到肯定回答后，她批准公开出版。第一版很快售罄。许多读者买书不是为了寻找正确答案，而是想确认自己那些混乱、胆怯又不够伟大的记忆，也配被历史看见。"
  shining_needle.40.a:0 "历史不能只记得站在台上的人。"
  # 事件概况：慧音出版普通幸存者和失败者的口述史，形成新的战后文学。
  # 叙事方向：延续正邪关注下位者的主题，同时保留战争记忆的矛盾、怯懦与不完整。

  shining_needle.41.t:0 "作者不明"
  shining_needle.41.d:0 "《文文。新闻》开始连载一部身份混乱的小说。第一回的主角是人类，第二回却暗示她可能是妖怪，第三回又告诉读者前两回都是某个不明存在编造的证词。\n\n读者为主角真身争论不休，甚至组织公开推理会。射命丸文宣称作者坚持匿名，并借机把每场争论都写成新报道。只有正邪注意到，封兽鵺每周出刊前都会消失半天。\n\n当一份新刊被放到鵺面前时，她先嘲笑情节故弄玄虚，随后指出第七码错用了一个只有作者才知道的化名。房间里安静了几秒。鵺放下报纸，坚称这只是常识。"
  shining_needle.41.a:0 "当然，谁都可能知道这种常识。"
  # 事件概况：鵺匿名创作身份谜团小说，引发读者长期猜测，自己却因批评细节而露出破绽。
  # 叙事方向：把鵺对不确定身份的能力转化为大众文学，并通过小失误营造人物喜剧。

  shining_needle.42.t:0 "没有写完的诗集"
  shining_needle.42.d:0 "古明地恋偶尔会在街上留下几句没有前后的诗。有人把听见的片段抄下来，交给书店装订。由于无人知道漏掉了多少内容，每首诗后都留下大片空白。\n\n出乎意料的是，读者开始在空白处补写自己的句子。相同的一页在不同人手中变成情诗、悼词、笑话或购物清单；二手书店甚至专门按照批注精彩程度重新定价。\n\n恋翻到一本写满字的版本，认真读了很久，然后问正邪：「这是我写的吗？」正邪回答其中大概只有前三行是。恋显得十分满意，抱着书继续走了。"
  shining_needle.42.a:0 "剩下的部分，谁都可以写。"
  # 事件概况：恋遗落的诗句被整理成留有空白的诗集，读者参与补写后形成独特出版潮流。
  # 叙事方向：利用恋记忆与存在感模糊的特点，创造开放、温柔且带一点荒诞的群众文学。

  shining_needle.43.t:0 "地下室也应该有窗"
  shining_needle.43.d:0 "芙兰朵露画了一本故事。主角是住在地下室里的怪物，力气大得能捏碎任何东西，却因为担心弄坏外面的世界，从来不敢推门。故事没有王子，也没有负责教导她的贤者；怪物最后只是自己在墙上开了一扇窗。\n\n大人读完后大多沉默，孩子们却非常喜欢。他们不断追问怪物后来去了哪里、窗外有什么，以及为什么不干脆把整面墙拆掉。\n\n有人请芙兰替故事写一句教训。她想了很久，只在末页加上一行：「地下室的门，至少应该能从里面打开。」"
  shining_needle.43.a:0 "这已经足够成为结局。"
  # 事件概况：芙兰以自身经验创作儿童绘本，意外成为战后广受欢迎的作品。
  # 叙事方向：不让芙兰直接讲述创伤，而是透过简单故事表现她对自由、力量与自我选择的理解。

  shining_needle.44.t:0 "瓦砾下沉睡的种子"
  shining_needle.44.d:0 "清理旧仓库地基时，重建队发现一间被倒塌墙体封住的地下储藏室。里面没有武器或金银，只有数百只贴着模糊标签的种子罐。\n\n风见幽香亲自检查后判断，大部分种子已经死亡，但仍有少数可能发芽。她拒绝把所有希望压在一次播种上，而是把种子分成小份，交给不同土壤与气候的聚落试种。\n\n数周后，第一株无人认得的嫩芽从实验田里钻出。它也许只是一种早已被遗忘的野花，却让围观者安静了很久——废墟保存下来的，并不全是战争。"
  shining_needle.44.a:0 "给它一块能够长大的土地。"
  # 事件概况：重建队发现旧种子库，幽香以谨慎试种让少数种子重新发芽。
  # 叙事方向：用微小的植物发现象征灾后复苏，同时避免把希望写成毫无代价的奇迹。

  shining_needle.45.t:0 "会唱旧时代歌曲的机器"
  shining_needle.45.d:0 "河城荷取从废墟里挖出一台外界留声机。她更换弹簧、拼接唱针，又用几个没人敢追问来源的零件让转盘重新转动。机器发出的第一段声音满是杂音，随后竟传出一首无人能说出名字的旧歌。\n\n围观者原本只觉得旋律古怪。人群后方却有一名老人轻声跟着哼唱，说这是她幼年时从外界商人那里听来的曲子。年轻乐师当场记下旋律，晚上便把它改编成笛、鼓与妖怪叫声混合的新版本。\n\n第二天，新旧两个版本同时在市场播放，争论哪一个更好的人比买东西的人还多。"
  shining_needle.45.a:0 "旧声音也能长出新的曲子。"
  # 事件概况：荷取修复留声机，使一首遗失歌曲重新出现并被年轻乐师改编。
  # 叙事方向：表现技术回收不仅服务工业，也能连接世代并催生新的大众音乐。

  shining_needle.46.t:0 "第一张没有领主的地图"
  shining_needle.46.d:0 "若鹭姬沿河重新测量水道，橙则负责确认山路与聚落。她们很快发现旧地图已经无法使用：河流因战火改道，新房屋建在过去的领地边界上，幸存者也用完全不同的名字称呼道路。\n\n新图没有标示某位领主的森林或某个家族的田地，而是写着「会漏雨的桥」「有热汤的路口」「小伞修过三次的屋顶」以及其他毫不庄严、却人人都能认出的地名。\n\n正邪本想要求改得正式一点，最后却在地图角落看见「正邪迷路处」。影狼坚持那是重要地标，若鹭姬默默点头。"
  shining_needle.46.a:0 "这一处必须删掉。其他的留下。"
  # 事件概况：若鹭姬与橙绘制战后新地图，地名不再来自领主，而来自幸存者的共同生活。
  # 叙事方向：通过地理变化表现旧权力消退与新社会形成，并用正邪迷路的地点收束笑点。

  shining_needle.47.t:0 "探女的点菜单"
  shining_needle.47.d:0 "稀神探女第一次独自走进重建区的小食摊。为了避免随口一句话引发无法预测的结果，她没有开口，只在木牌上圈了三种看起来安全的食物。\n\n摊主误以为她要求把三样东西叠在一起，端出一盘夹着烤鱼的米饼，再浇上甜酱。探女看了很久，最后还是安静地吃完。正邪恰好路过，问她味道如何。\n\n探女提笔写下：「我不否认它能够入口。」摊主把这句话当成高度赞赏，第二天便推出售价更高的「无言套餐」。"
  shining_needle.47.a:0 "至少她没有亲口说难吃。"
  # 事件概况：探女因能力限制使用木牌点餐，误会意外创造出市场新品。
  # 叙事方向：把探女的少言与能力写进轻松生活场景，让她在母女主线之外也能接触普通人的日常。

  shining_needle.48.t:0 "小伞只想修一把伞"
  shining_needle.48.d:0 "多多良小伞抱着一把合不拢的旧伞走进正邪办公室。正邪看见她神情严肃，又带着长长的书面申请，立刻以为某座工坊发生事故，或付丧神委员会准备提出新的权利条款。\n\n申请书只有一项内容：请正邪帮忙压住伞柄，好让小伞更换卡死的铰链。两人折腾半个下午，最终把零件装反，却意外使伞骨比原来更加牢固。\n\n小伞试图从门后突然跳出，庆祝这项天邪鬼式改良。正邪没有被吓到。直到小伞递上维修费用的账单，她才真的从椅子上站了起来。"
  shining_needle.48.a:0 "为什么帮忙的人还要付钱？"
  # 事件概况：小伞带着正式申请找正邪修伞，两人误装零件却得到更耐用的结果。
  # 叙事方向：用微不足道的委托拉近领袖与基层角色的距离，并让惊吓笑点落在账单而非能力上。

  shining_needle.49.t:0 "芙兰与琪露诺的建筑方法"
  shining_needle.49.d:0 "芙兰朵露与琪露诺被安排协助拆除一栋无法修复的危楼。重建队原本只希望她们搬运材料，结果芙兰精确捏碎了每一处腐坏结构，琪露诺则用冰暂时固定那些必须保留的横梁。\n\n整栋房子在众人提心吊胆的注视下分成两半：危险部分整齐倒下，另一半甚至没有打碎窗户。工匠们随后把这种方法写进拆除手册，只是特别注明，普通施工人员不得模仿。\n\n两人要求获得正式的建筑师头衔。正邪批准她们成为「仅限监督下使用的特殊工程顾问」。琪露诺只看见「特殊」两个字，十分满意。"
  shining_needle.49.a:0 "至少房子倒向了正确的一边。"
  # 事件概况：芙兰与琪露诺把破坏和冻结能力用于危楼拆除，意外发展出特殊施工方法。
  # 叙事方向：展现危险能力在和平生活中的新用途，并保留两人孩子气的自豪与误解。

  shining_needle.50.t:0 "第一次听不见锤声的夜晚"
  shining_needle.50.d:0 "正邪在深夜突然醒来。外面过于安静，没有锯木、敲钉、搬运瓦砾或车轮陷进泥里的声音。她立刻披衣出门，以为重建队发生罢工，或某条配给线再次断裂。\n\n值夜人员告诉她，这一带的住房已经完工，施工队今天正式撤往下一个地区。正邪站在街口，第一次认真看见晾在窗边的衣服、关门前还在讨价还价的商贩，以及因为谁该倒垃圾而争吵的邻居。\n\n没有庆典，也没有谁高呼革命胜利。这里只是终于不必整夜施工了。正邪回到房间，反而花了很久才适应那份普通的安静。"
  shining_needle.50.a:0 "原来安静也可能是好消息。"
  # 事件概况：正邪因夜间没有施工声而惊醒，最后发现只是一个街区完成了重建。
  # 叙事方向：以普通生活取代宏大庆典，表现正邪逐渐理解建设成果也可以是不再发生任何事情。

  shining_needle.51.t:0 "先在梦里试穿"
  shining_needle.51.d:0 "布料商与裁缝请哆来咪帮忙，让顾客在梦里试穿尚未制成的新衣。梦境不消耗真实材料，任何人都能尝试夸张颜色、悬空裙摆或长到拖过整条街的袖子。\n\n问题在于，许多顾客醒来后坚持要把梦里的设计做成实物。裁缝不得不解释，现实中的衣服不能无视重量，也不能依靠心情改变颜色。哆来咪则认真记录每一次抱怨，声称这些都属于「现实材料仍需进步」的证据。\n\n最后，工坊真的做出了几种简化版本。它们远不如梦里华丽，却迅速成为下一季的新潮流。"
  shining_needle.51.a:0 "梦想可以先走一步，针线随后赶上。"
  # 事件概况：哆来咪提供梦中试衣服务，无法实现的设计反而刺激裁缝开发新款服装。
  # 叙事方向：让梦境能力进入消费与创作领域，表现奇异能力如何成为和平时代的创新工具。

  shining_needle.52.t:0 "妖精邮差的第一天"
  shining_needle.52.d:0 "重建后的聚落比过去分散，正式邮差始终不够。大妖精于是组织妖精帮忙送信，琪露诺则自封为全幻想乡最快的邮政长。\n\n第一天结束时，十封信有六封送错地方，一封冻在邮箱上，还有一封被当成纸飞机飞进河里。不过，两名原本互不认识的收件人因为拿到彼此的家书，决定亲自交换；一间偏远工坊也因此找到愿意供应木料的新伙伴。\n\n大妖精连夜给信件加上图画标记。琪露诺则宣布首日路线已经成功发现大量「隐藏收件人」。"
  shining_needle.52.a:0 "先学会认地址，再谈全国最快。"
  # 事件概况：妖精参与战后邮政，虽然错误百出，却意外连接原本没有往来的居民与工坊。
  # 叙事方向：以失败中产生联系的方式表现基层网络成长，不把妖精单纯写成制造麻烦的角色。

  shining_needle.53.t:0 "姐姐找你了"
  shining_needle.53.d:0 "古明地觉来到重建中的人里时，手里拿着一张被反复折叠的寻人启事。上面画着绿色短发、闭合的第三只眼，以及一句毫无帮助的说明：『可能正在任何地方。』\n\n觉能够从旁人的心中找到许多关于恋的痕迹。配给员记得她在名册空白处画满了花；工坊学徒记得她把零件藏进帽子，又在众人急得团团转时悄悄放回去；卖甜饼的摊主则坚称她赊走了三块饼，只付了一颗不知道从哪里捡来的玻璃珠。\n\n然而，觉始终听不见恋。每当人群散去，那片属于妹妹的空白便显得格外刺眼。过去她总以为自己已经习惯这种寂静，直到恋真正走进一段她无法看见的生活，她才发现无从确认并不等于能够放心。\n\n觉最后在新建的屋顶上找到了她。恋正蹲在烟囱旁，把一串歪歪斜斜的纸风车系上绳子。下面的孩子不断告诉她该挂高一点还是低一点，她却故意把每一只都装反。\n\n『姐姐是来带我回去的吗？』恋没有回头。\n\n觉原本准备了许多话：地灵殿还有空房间，阿燐与阿空很想她，外面并不像她以为的那样安全。可她从周围人的心中听见的，却不是对一个危险妖怪的戒备。有人担心恋从屋顶摔下来，有人在猜她明天还会不会来，也有人认真期待那些装反的风车究竟会怎样转动。\n\n『不是。』觉收起寻人启事，『我只是想看看，你选择待在什么地方。』\n\n恋终于转过头。『那你看完了吗？』\n\n『还没有。你愿意带我走一遍吗？』\n\n那天下午，恋牵着姐姐穿过工地、市场与临时教室，介绍每一个她叫不出名字、却记得发生过什么趣事的人。觉没有询问她什么时候回家。直到分别时，恋才把一只装反的纸风车塞进她手里。\n\n『下次不要贴寻人启事了。』恋说，『写信问我要不要回去吃饭。这样我就不是被找回去，是自己回去。』"
  shining_needle.53.a:0 "找到她，并不意味着必须把她带走。"

  # 事件概况：觉循着旁人对恋的记忆来到新聚落，发现妹妹已经在正邪统治下的幻想乡建立了自己的生活。
  # 角色方向：觉学习以探望代替监视，以邀请代替带回；恋则第一次主动告诉姐姐，该如何在不束缚自己的情况下继续爱她。

  shining_needle.54.t:0 "正邪也得排队"
  shining_needle.54.d:0 "正邪在巡视途中闻到公共食堂的香味，顺手掀开门帘，准备从侧边拿一碗刚出锅的杂烩。掌勺老妇人立刻用汤勺敲了敲锅沿，指向一路排到门外的队伍。\n\n随行干部想解释她还有会议，正邪却已经走到队尾。前面的人很快认出她，却没有让路，只继续讨论今天的汤是否比昨天多放了盐。轮到正邪时，锅里只剩最底下的一勺，鱼肉少得可怜，味道倒意外不错。\n\n老妇人问她有什么意见。正邪喝完后说：「下次少放点盐。」队伍里立刻有人反驳今天明明刚好，一场毫无必要的争论就此开始。"
  shining_needle.54.a:0 "至少没有谁替我预留最好的一碗。"
  # 事件概况：正邪在公共食堂被要求排队，最后与普通居民争论汤的咸淡。
  # 叙事方向：自然表现领袖也受新日常规则约束，不刻意宣讲平等，而让制度落在一顿饭的小事上。











