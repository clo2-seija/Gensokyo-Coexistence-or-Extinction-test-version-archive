l_simp_chinese:
 Renko_LUN_lunar_war_high_command_category:0 "月战最高司令部"
 Renko_LUN_lunar_war_high_command_category_desc:0 "月之都地表远征的最高指挥机构，负责统筹战争准备、军需与后续作战事务。"
 Renko_LUN_mount_connects_sea_and_mountain_supply:0 "连接山海"
 Renko_LUN_mount_connects_sea_and_mountain_supply_desc:0 "绵月丰姬能够连接月之海与地上的山川。月战最高司令部将以此建立不受凡世距离束缚的补给体系。"
 Renko_LUN_mount_connects_sea_and_mountain_supply_tt:0 "为§Y月之都§!获得§Y+9999%补给范围§!，并为§Y全球所有州§!增加§Y50当地补给§!。州级补给由当前控制方使用，敌我双方均可受益。"
 Renko_LUN_connects_sea_and_mountain_state_modifier:0 "连接山海的能力"
 Renko_LUN_connects_sea_and_mountain_state_modifier_desc:0 "绵月丰姬将月之海与地上的山川相连，使横亘世界的距离不再成为军队运输补给的阻碍。"
