l_simp_chinese:


 Seizo_Kobayashi:"小林跻造"

  gensokyo_Remilia_desc:0 "蕾米莉亚・斯卡蕾特是红魔馆的吸血鬼大小姐。她外表娇小、言行却带著贵族领主般的自尊与排场：喜欢华丽的宴会、喜欢被人仰望，也喜欢把麻烦当成舞台的灯光，越热闹越觉得「有趣」。她常以任性与孩子气的口吻下命令，但别误会那只是玩笑——当她决定出手，整个局势会像被人轻轻拨动的棋盘，一步步走向她想看的结局。\n传闻她拥有「操纵命运」的能力：不一定是立刻翻天覆地的力量，更像是让偶然变成必然的推手。你以为只是运气不好，其实已经被她的视线挑中。尽管如此，蕾米莉亚并非单纯的反派；她对红魔馆极度护短，对自家人有著近乎理直气壮的保护欲。红魔馆是她的城——只要牵涉到「自家」，她就会用大小姐的方式负责到底。"
  gensokyo_Yukari_desc:0 "八云紫是幻想乡最难以被「定位」的存在之一——她并不总在舞台中央，却常像舞台本身的设计者。身为操纵「境界」的妖怪贤者，她擅长把看似毫不相干的人与事，用一条看不见的线连成必然：今天只是小小的偶然，明天就可能变成改写局势的转折。她说话带著从容的幽默与若即若离的善意，仿佛一切都只是「顺便」，但真正可怕的是——你很难确定她的顺便究竟安排了多少层。\n紫并非单纯的阴谋家。她的视角更像管理者：幻想乡要能运作，就必须有规则、有缓冲、有边界，而她会用自己的方式维持这套系统，即使方法看起来冷酷、甚至像在把人当棋子。她能在混乱中推一把火，也能在崩坏前伸手把边界重新划好；她允许异变发生，因为异变有时是必要的更新与试炼。与八云紫打交道，最重要的不是猜她的情绪，而是理解她的尺度：她在乎的从来不只是某个人输赢，而是整个舞台是否还能继续存在。"

