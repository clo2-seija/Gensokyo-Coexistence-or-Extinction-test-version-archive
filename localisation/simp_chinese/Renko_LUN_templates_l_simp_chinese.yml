l_simp_chinese:
 Renko_LUN_mobilize_lunar_army:0 "整编月之军势"
 Renko_LUN_mobilize_lunar_army_desc:0 "以统一编制整合侵军步兵、装甲突击力量与骑兵镇压部队，完成配套技术准备，并在首都集结首批军势。"
 Renko_LUN_mobilize_lunar_army_tt:0 "获得编制：Renko Lunar Infantry Division、Renko Lunar Armored Division、Renko Lunar Cavalry Garrison。\n解锁配套科技、基础中型与重型坦克底盘，并完成直升机、工程车辆和喷火坦克特殊项目。\n在首都生成100个步兵师和20个装甲师，初始装备比例设为100%。"
