l_simp_chinese:
 Renko_LUN_armaments_bureau:0 "月都军备局"
 Renko_LUN_armaments_bureau_desc:0 "月都军备局统筹陆海空军装备定型，由月人制造统一承制。基础型号即刻开放；后续型号在具备技术条件时提前开放，最迟于标示年度年初开放。定型时取得所需底盘、机身或舰体，并完成必要的特殊项目；尚未掌握全部配件技术也可接收完整设计。"
 Renko_LUN_medium_tank_1936_commission:0 "定型：月卫中型坦克——基础型"
 Renko_LUN_medium_tank_1936_commission_desc:0 "即刻开放。由月人制造承制，接收§YMoonwarden Mk.36§!的完整设计，并取得对应底盘、机身或舰体。每个型号仅可定型一次。"
