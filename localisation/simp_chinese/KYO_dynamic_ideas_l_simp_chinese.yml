l_simp_chinese:
 KYO_seija_dynamic_military_idea: "下克上精神"
 KYO_seija_dynamic_military_idea_desc: "这支军队不是从军校、贵族私兵或大妖怪的厅堂中诞生的。它来自泥地、废屋、山道与被遗忘的角落。许多人第一次拿起武器时，手还在发抖；第一次列队时，连靴子都不合脚；第一次听见炮声时，也曾想过转身逃走。\n\n但她们没有退路。被踩在底下的人若不学会站起来，就只会被踩得更深。每一场夜袭、每一次伏击、每一段饥饿中的行军，都在把散乱的愤怒磨成真正的战斗力。她们未必训练最好，装备也未必最齐全，却比任何人都明白：这不是为了荣耀而战，而是为了让上位者第一次听见底层的脚步声。\n\n所谓下克上，不是弱者一夜之间变成强者的童话。它是伤口结痂后仍要前进，是失败之后仍要重组队伍，是明知前方有枪口，却仍把旗帜往前推。"

 KYO_seija_dynamic_political_idea: "下克上思潮"
 KYO_seija_dynamic_political_idea_desc: "过去，政治是高位者的语言。贤者、领主、寺社、山上的首领、红墙里的贵族，她们决定规则，然后要求底下的人接受。弱小妖怪、人类贫民、无名的流浪者，只能在告示前低头，在征发与配给之间忍耐，把不满吞进肚子里。\n\n如今，鬼人正邪把那句被压了太久的话翻了出来：为什么一定要服从？为什么出生低、力量小、没有靠山，就只能成为别人棋盘上的灰尘？这种思想像火星落进干草，从街角、工坊、临时营地与酒馆后门一路蔓延。人们开始讨论、争吵、组织，开始学会把自己的痛苦说成要求，把自己的愤怒变成路线。\n\n可是觉醒并不轻松。新的秩序不会因一句口号自动降临，旧势力也不会因一次抗议主动让位。下克上的政治，是一次又一次被镇压后仍重新聚集，是在背叛、饥饿、恐惧与内部分裂中，硬把『不可能』推成『必须如此』。"

 KYO_seija_dynamic_industrial_idea: "下克上经济学"
 KYO_seija_dynamic_industrial_idea_desc: "废弃仓库改成了工坊，拆回来的机件重新配装。缺少零件时，工人得去战场残骸中寻找能用的材料；燃料不足，部分炉具只能改烧回收木料，无法替代的煤料仍要优先运来。新产线每开动一处，都牵动着别处的供应。\n\n生产与配给将优先支撑劳动者的生活、前线的需要及继续建设的能力。工坊不能再将全部成果交给旧主人，也不能只顾本地，把缺粮的聚落留在账外。粮食、报酬和扩大生产各占多少，得由组织反复核算。\n\n车间依旧寒冷，工具磨损，疲倦的人等着换班。少一批原料，就有机器停转；分配失误，也会让承诺落空。下克上的经济必须在这些缺口中运作，让今天修好的设备明日仍有材料可用，让造出它的人领到足以继续生活的份额。" 
