l_simp_chinese:

    myouren.3.t:0 "命莲先我而去"
    myouren.3.d:0 "白莲开始跟随命莲修习佛法时，已经不年轻了。世人称颂弟弟的法力，她却还有许多最初的经义要向他请教。有些话当时听过便点头，回房再读，才发现自己并未明白，便想着明日再问。\n\n后来，命莲能与她说话的时间越来越短。她将问题留在经卷里，先去照看他的身体。汤药放在床边，问候的人来过一批又一批，弟弟却还是渐渐衰弱。她看着他，常想起从前自己随时都能去找他的时候。\n\n命莲去世以后，白莲仍照惯常的时辰走到房外。门里没有人回应，她站了片刻，才想起不必再等。别人谈起弟弟，都知道该用哪些赞词；她听着，脑中却只是一些没说完的话，和那卷还夹着记号的经书。\n\n她试着继续读。遇到不解的地方，仍会下意识转头，随后只好自己翻回前页。命莲怎样看待死亡，她曾听他说过；轮到自己面对那张空床，却怎么也无法像记忆里的弟弟那样平静。\n\n夜深时，她把经卷合上，发现自己已经很久没有翻页。灯还亮着，旁边的位置空着。她将明日想问的问题写到纸上，写完才搁下笔，没有将纸送出去。"
    myouren.3.a:0 "我没能与他一同走到那里。"

    myouren.4.t:0 "借妖延命之人"
    myouren.4.d:0 "命莲死后，白莲常在夜里醒来，伸手摸自己的脸。白日里听来的生死道理，一到这个时辰便很难安慰她。她还有许多不明白的事，身体却已经衰老，不会等她将弟弟留下的经卷读懂才停下。\n\n她开始翻找经卷以外的法门。有关妖术的记载被夹在案边，起初读完便收走，后来越放越多。她依照其中的方法借取力量，直到镜中那张脸重新变得年轻，原本衰弱的身体也渐渐恢复。\n\n她盯着镜子看了很久，手始终没有离开脸颊。那晚，她终于睡下，却在醒来后立即查看术式，怕得到的变化又会消退。\n\n这份力量依存于妖怪。白莲于是开始留心各处降妖的消息，听见又有人要除去一处怪异，便设法打听细节。有时她劝人暂缓，有时暗中给妖怪留下逃走的机会。对方感谢她，她仍不愿说出自己最急切的理由。\n\n她也会替受惊的人念经，听他们说希望以后不再遇见妖怪。等人走远，她却先去确认藏起来的妖怪是否安全。回到屋里，年轻的面容仍映在镜中，她这才松开一路攥着的手。"
    myouren.4.a:0 "我只是……还不想死。"


    myouren.5.t:0 "暗中庇妖者"
    myouren.5.d:0 "最初那几年，白莲帮助妖怪，并不是出于什么多么高洁的愿心。\n\n她只是明白了一件事：自己的青春与寿命，系在妖怪身上。妖怪活着，她手中的法术就还能运转；妖怪若被一只只除尽，她好不容易从衰老与死亡手里偷来的时间，也会一点点塌回原样。\n\n所以她开始暗中出手。\n\n有时是在受托降伏妖怪时，故意把法阵画错一笔，让本该锁死的封印裂开一道缝；有时是在山路、古寺或废村前，抢先一步放走那些已经被追到无处可逃的异类；也有时，她会对追查而来的人类说谎，把血迹说成兽痕，把妖气说成瘴气，把一个本来该死的妖怪，从众人的视线底下硬生生藏出去。\n\n她甚至不是没有害过人。\n\n她知道自己撒下的谎，会让无辜者受伤，会让别人替她承担本不属于他们的后果。她知道那些被放走的妖怪里，并不全是温顺无害之辈；有的妖怪会回头报复，有的妖怪会再去伤人，而她明明看见了这种可能，却还是伸了手。\n\n因为那时候的她，终究还是把自己的寿命看得比别人的安稳更重。\n\n可也正是在这一来一回的遮掩、欺骗与包庇之中，白莲第一次真正走近了妖怪。\n\n她看见逃跑的小妖缩在洞穴深处发抖，和将死之人并没有什么不同；看见有妖怪在被追捕时死死护着更弱小的同伴，像人类母亲护着孩子；也看见有些妖怪明明已经活得狼狈不堪，却还是会在她转身时低声道谢。她原本以为自己保护的是法术的来源，后来才渐渐发现，自己碰到的是一群和人类一样，会贪生、会怕痛、会因失去而发狂、也会因一点温暖而动摇的存在。\n\n她开始越来越分不清，自己究竟是在利用妖怪，还是在被妖怪映照出来。因为她看着那些为了活下去而说谎、逃窜、伤人、挣扎的异类时，忽然发现自己也没有高尚到哪里去。\n\n她嘴里念着佛，手上用着妖术，为了延命而欺骗别人，为了保住自己不惜弄脏双手。若说妖怪是被欲望、恐惧与执念拖着走的存在，那么那时的她，其实也已经越来越像一个真正的妖怪了。\n\n这念头第一次浮上来的时候，白莲沉默了很久。\n\n可她没有停手。\n\n因为她已经回不去了。"
    myouren.5.a:0 "我原来……也早已是怪物了。"

    myouren.6.t:0 "众生不只为人"
    myouren.6.d:0 "那只妖怪再次来求庇护时，白莲认出了它。上一次，她曾向追来的人隐瞒它的去向，后来却听说有人因此受伤。这回它身后还跟着一个更小的同伴，腿上淌着血，走几步便要停。\n\n白莲让它们留在檐下，拿出布和水。小妖怪一碰到伤口便挣扎，先来的那个立即挡在前面，龇牙盯着她。她只好把手放低，等它看清自己要做什么。包扎结束时，它仍没有道谢，只把同伴护得更紧了些。\n\n她在那副神情里认出了自己熟悉的恐惧。命莲病重时，旁人每说一句劝她宽心的话，她都想追问是否还有别的法子。后来，她抓住延命的妖术，对任何可能威胁它的事情，都先想怎样遮掩。\n\n村里的人很快找来了。他们问的仍是上次受伤的人，白莲无法再用「没有看见」打发。她承认曾放走那只妖怪，也答应前去看望伤者。听见屋后有响动，有人便要把藏着的两个一起捉走。\n\n「后面那个受了伤。」她拦住来人，「先把它的血止住。前面的事，我会说清楚。」\n\n没人愿意立刻相信她。白莲也知道，替小妖怪挡住这一回，并不能抵消自己先前的欺瞒。她把伤者安置好，又去听村民讲那日的经过，这一次没有挑对自己有利的部分听。\n\n往后该怎样做，她还说不完整。延命的私心没有消失，过去造成的伤也仍在。可她已经见过，那些被叫作怪物的家伙同样会守着同伴，不肯独自逃走。她再念到众生时，便无法轻易将檐下那两个身影略过去。"
    myouren.6.a:0 "若众生皆苦，妖怪为何不能被渡？"

    myouren.7.t:0 "被封入魔界者"
    myouren.7.d:0 "白莲藏起妖怪的地方被找到了。来人从屋里搜出妖术的记录，又叫出那些曾向她求助、后来却发现她说了谎的人。有人问她，被放走的妖怪再去伤人时，她可曾想过当初信任她的村民。\n\n她承认自己用妖术延命，承认曾经隐瞒去向。说到后来想保护人和妖怪时，有人打断她，将一段自己受害的经过又说了一遍。白莲听到最后，没有再要求他先理解自己的缘由。\n\n但随之而来的话，已经将所有妖怪一并算作祸害。连那些未曾伤人的，也被列入该降伏的异类。她试着说明其中的区别，声音很快淹没在人群里。她过去借着僧人的身份说过太多假话，如今再开口，谁都能拿旧事反问她。\n\n施下封印的人没有让她继续解释。术式逐渐合拢，她看见面前的人影被隔开，伸出去的手再也碰不到人间的地面。最后几句话没能传过去，四周便只剩下魔界陌生的景象。\n\n白莲站了很久，才意识到自己仍然活着。延命的法术没有随着封印消失，身体也没有立刻衰老。她怕了许久的死亡没有到来，往后却不知还有多少日子要独自在这里度过。\n\n她想起命莲临终时的样子，想起自己还没问出口的话。若他看见今日的一切，会怎样听她解释，她猜不出来。她既不能回到弟弟身边，也不能回去见那些被自己欺瞒的人。\n\n白莲慢慢坐下，把方才在人间没能说完的话又说了一遍。说到自己原本只是害怕死去时，她停住了。魔界里无人催她往下说，她将双手放在膝上，低头待了许久。"
    myouren.7.a:0 "我终究没能与他在彼岸重逢。"

    myouren.8.t:0 "留在此岸的光"
    myouren.8.d:0 "在漫长得几乎没有尽头的封印里，白莲无法再躲开自己思绪。\n\n她曾因为害怕死亡而走上歧路，曾因为不想失去青春而依附妖怪之力，也曾为了保住自己的寿命与那些妖怪，一次次欺骗人类、弄脏双手、把别人的伤口压进黑暗里。她见过自己最难看的样子，也知道自己并不是从一开始就为了众生而活。若把她这一生摊开来看，里面有恐惧，有执念，有自私，有误入魔道的痕迹，也有无法弥补的悔恨。\n\n她承认，自己不是天生慈悲的人。\n\n她最初只是太怕失去，太怕像命莲那样消失，太怕自己若也死去，就永远没有机会追上那位先一步走到彼岸的弟弟。她之所以抓住妖术，之所以护着妖怪，都不是为了什么伟大的理想，而只是因为她不肯放手，不肯承认自己也会老、也会死、也会被留在命运后面。\n\n可正因为她走过了这样一条不干净的路，正因为她看过自己如何一点点变得像妖怪，也看过妖怪与人类其实同样会因恐惧、痛苦与求生而扭曲，她才终于一点一点明白：若自己受过的这些苦、犯过的这些错、没能与命莲重逢的这些遗憾，最后只能变成白莲一个人的惩罚，那就太过空洞，也太过没有意义。\n\n她没能与弟弟在彼岸相见，这是她一生最大的遗憾。\n\n可也正因为如此，她才终于找到了自己必须留在此岸的理由。既然她已经无法把过去重新活过一遍，既然她已经不可能把自己洗回一个干净无瑕的人，那她至少还能把佛法留下来，把那点从污泥里熬出来的光留下来，把原本只想救自己的那条路，慢慢走成一条能让更多人、更多妖怪也一起活下去的路。\n\n她开始真正理解，佛法不是替自己求不朽，不是替自己逃开衰老与死亡，也不是替自己找一套好看的理由。佛法应当是明知世间有苦、有错、有再也无法弥补的东西，仍然愿意继续往前，仍然愿意替别人把灯点起来。\n\n从那以后，支撑白莲继续前行的，已经不再是“我不想死”。\n\n而是“若我还能活着，就该让更多众生不必在黑暗里独自挣扎”。\n\n她没有与命莲在彼岸重逢。\n\n所以她选择留在此岸，替这个世界点灯。"
    myouren.8.a:0 "若我不能追上他，便让我照亮后来的人。"

    myouren.9.t:0 "从回忆中醒来"
    myouren.9.d:0 "白莲睁开眼时，门外有人喊了一声「接住」。接着是木桶落地的闷响，响子急忙道歉，又被一轮叫去扶住另一头。她坐了片刻，才从封印与旧日的回忆里分清眼前的晨光。\n\n廊下堆着刚卸的物资。一轮卷起袖子，正与搬运的人商量怎样绕过尚未修好的石阶。响子想一次抱走两只桶，走了几步便摇摇晃晃，只好先放下一只。见白莲出来，她立刻站直，问是不是把师父吵醒了。\n\n「没有。送到哪里？」\n\n响子指着后院，还没说完，仓房里便传来娜兹玲的声音：那批东西要送去工地，后院放的是明天上船的货。响子应了一声，抱起桶又走错了方向。一轮把她叫回来，这回让她跟着自己走。\n\n白莲站到廊柱旁，给两人让开路。船边的水蜜催着下一批装货，听到有人说少了一个帮手，便回头数了数，发现那人还在与仓房核对数目。她不耐烦地挥手，终究没有催船离开。\n\n这些声响在白莲出神时也一直没有停。她曾在魔界里想过许多次，倘若还能回来，该怎样继续当初未能做好的事。如今有人为了她留下的教诲来到这里，也有人还带着难以摆脱的习性，照样与众人吃饭、争执，接过今天的工作。\n\n她伸手拿起剩下的木桶。响子从院子另一头跑回来，见状便要接过去，说师父才醒，不必帮忙。\n\n白莲试了试重量，问她这次记住地方了没有。响子点头，走到石阶前又特意回过头来，指给她看哪一块还松着。\n\n「这里慢一点。」\n\n白莲依言绕开。到了工地，一轮正在找水；她把桶放在伸手可及的地方，挽起衣袖，问还有什么要搬。"
    myouren.9.a:0 "这一次，我看见了现在。"

    myouren.10.t:0 "命莲仍在梦中"
    myouren.10.d:0 "白莲每一次沉入睡梦，都会看见命莲。\n\n梦里的他，总是和记忆中一样年轻，眉眼安静，笑容温和得像晨钟之后第一缕照进庭院的光。四面八方开满鲜花，风里带着露水的气味，朝阳从远处升起，把一切都照得很亮、很暖，像世间从未有过封印、衰老、背叛与死亡，像他们仍旧站在旧日的寺院里，什么都还来得及。\n\n白莲总会在梦里向前一步。她想叫他，想把那些来不及说的话补上，想告诉他自己后来走过的路，告诉他自己没有与他在彼岸相逢，告诉他自己曾如何恐惧、如何跌入歧途、又如何在污泥里一步步把佛法重新捡起来。可每当她快要靠近时，梦里的风景便会悄悄变了。\n\n命莲先收起笑意。\n\n然后，花开始一朵朵凋谢。朝阳黯下去，暖色褪成灰白，地上的花瓣像被无形的寒气碾碎。原本宁静的庭院渐渐变得空旷而阴冷，直到最后，只剩命莲一个人站在那里，脸色苍白，眼神却深得像压着漫长岁月都未能化开的执念。\n\n他不再像高僧，也不再像那盏替白莲引路的灯，更像一个迟迟不肯离去的幽魂，一个被遗憾和等待困住的亡者。他望着她，声音不大，却总能把整场梦撕开一道口子。\n\n『姐姐，妳为何抛下我？』\n\n那一句话，比任何责罚都更重。白莲在梦中往往说不出话来。因为她知道，命莲真正问的并不只是那场死别。他问的是她为何没能陪他走到最后，问的是她为何在他死后转身去抓住妖术与青春，问的是她为何迟迟不肯放下，迟迟不肯面对自己其实早已失去他的事实。\n\n她每一次都想伸手，可每一次都只能在那双眼睛前醒来。醒来时，天还没亮，四下安静，只有胸口那份迟到了太久的痛仍旧压在那里，像一场没有真正结束过的梦。"
    myouren.10.a:0 "我从未忘记你。"



    

 myouren.11.t:0 "被带回寺中的颠倒者"
 myouren.11.d:0 "鬼人正邪被带回命莲寺时，仍旧抬着下巴。\n\n她没有求饶，也没有装出悔意。即使双手被束住，衣角沾着尘土，她的眼神仍像一把故意磨钝边缘的刀，随时准备割开任何一句漂亮话。庭院里的人停下工作，远远望着她。有人愤怒，有人警惕，也有人只是沉默。因为所有人都知道，这位天邪鬼不是普通的俘虏。\n\n她曾煽动底层妖怪的怒火，撕开战后最脆弱的伤口。她让许多本就痛苦的人相信，只要把眼前的一切都掀翻，明天自然会从废墟里长出来。可战斗留下的不是明天，而是尸体、烧毁的街区、断掉的桥、哭到没有声音的人。\n\n押送她回来的人问白莲，是否要立刻审判。\n\n白莲摇头。\n\n正邪冷笑：『怎么？圣人也会怜悯失败的叛徒？还是想把我挂在寺门前，让大家看看慈悲的胜利？』\n\n白莲只是看着她，目光没有胜利者的骄傲，也没有刑官的冰冷。\n\n『你还活着，不是因为你无罪。』白莲说，『而是因为你还没有看完。』\n\n正邪的笑意微微一顿。\n\n白莲转身看向星。星握着宝塔站在晨光下，沉默得像一面端正的旗。\n\n『星，由你带她。』\n\n星低头应下。她知道，这不会是轻松的差事。正邪不会因为被抓住就放下尖刺，也不会因为几句经文就承认自己错了。\n\n可白莲仍然留下她的命。\n\n因为命莲寺若只能杀死叛逆者，却不能让叛逆者亲眼看见另一条路，那么所谓共存，终究还少了一块最难的骨头。"
 myouren.11.a:0 "让她活着看完这一切。"

 myouren.12.t:0 "星的第一课"
 myouren.12.d:0 "星第一次带正邪走出看守的院落时，正邪一路都在笑。\n\n『这就是再教育？』她看着寺内忙碌的人群，语气尖刻，『让我看看你们怎么把粮食分给听话的人，怎么把慈悲写成规矩，怎么把人哄到愿意替你们卖命？』\n\n星没有反驳。\n\n她只是带正邪走到安置点。那里没有华丽的经堂，只有临时搭起的屋棚、修补过无数次的锅炉、冒着热气的粥桶，以及排队等待药物与食物的人类和妖怪。有人仍带着敌意，有人仍不愿和异类站得太近，可他们至少都还活着。\n\n响子在人群间跑来跑去，把孩子从队伍缝隙里牵出来；一轮正弯腰替工人检查受伤的手；娜兹玲坐在一旁冷着脸记账，谁多拿、谁少领、谁试图插队，都逃不过她的眼睛；水蜜站在远处，嘴上说着麻烦，却已经安排好下一批运送物资的船。\n\n正邪沉默了一会儿，随后哼了一声。\n\n『施舍。统治者最古老的把戏。先制造苦难，再用一碗粥让人感恩。』\n\n星终于停下脚步。\n\n『你说错了。』\n\n她的声音不高，却很稳。\n\n『这些苦难不是我们想要的。这里也没有谁要求他们感恩。命莲寺做这些，不是为了让他们跪下，而是因为如果今天没有人把粥端出来，明天就会有人死。』\n\n正邪冷冷看着她。\n\n星继续说道：『你可以继续怀疑。你可以把这里每一件事都拆开来骂。但你也必须看清楚，这些人不是被我们压迫才留下。他们留下，是因为这里至少有人在替他们修屋顶、听他们抱怨，也承认他们还配活下去。』\n\n正邪没有立刻回答。\n\n远处，一个小妖怪捧着热粥，小声向响子道谢。响子笑得很大声，说不用谢，下次来帮忙搬柴就好。\n\n正邪转过头，像是不愿再看。"
 myouren.12.a:0 "她必须先学会看见。"

 myouren.13.t:0 "不是所有秩序都是锁链"
 myouren.13.d:0 "第二次，星带正邪去了重建工地。\n\n那是一片被战火撕开的街区。屋梁烧黑，石墙倒塌，旧日的标语还残在墙角，被雨水冲得模糊。正邪曾在这里演说过。她记得自己站在高处，高喊让底层妖怪不再替任何人弯腰；她也记得人群曾如何回应她，像久压的火终于找到了风。\n\n如今，那里只剩锤声、木屑、泥水和疲惫的人。\n\n一轮正带着工人重新立梁。她说话还是那样认真到有些笨拙，手上却没有停。星让正邪站在旁边看了很久，看人类和妖怪一起抬木料，看曾经互相仇视的人为了不让屋顶塌下去，不得不在同一声号子里用力。\n\n正邪忽然开口：『他们以前听过我的话。』\n\n星点头。\n\n『是。』\n\n『他们当时很愤怒。那不是假的。』\n\n『我知道。』\n\n正邪猛地看向她，语气冷了下来：『你知道？那你们还敢说自己是来救人的？如果没有压迫，他们为什么会听我？如果这个世界没有烂到根里，我凭什么能把火点起来？』\n\n星沉默了一息。\n\n『你说的痛苦是真的。』她说，『底层妖怪被忽视是真的，弱者被强者利用也是真的。你看见了这一点，所以他们愿意听你。』\n\n正邪的眼神动了一下。\n\n星却继续说下去：『可你没有告诉他们，火点起来以后，要由谁来接住倒下的人。你只告诉他们推翻，却没有告诉他们桥断了以后老人怎么过河，粮仓烧了以后孩子吃什么，伤者躺在废墟里时谁去背。』\n\n工地上，一根梁木终于被扶正。众人发出低低的欢呼，一轮擦了擦汗，响子立刻喊着要大家休息喝水。\n\n正邪看着那根重新立起来的梁，嘴唇动了动，却没有说出嘲讽。\n\n星低声道：『不是所有秩序都是锁链。有些秩序，是为了让快倒下的屋子还能撑住。』"
 myouren.13.a:0 "她开始听见另一种答案。"

 myouren.14.t:0 "颠倒者的夜"
 myouren.14.d:0 "那天夜里，正邪没有睡。\n\n她坐在看守院落的台阶上，望着远处还亮着灯的仓库。娜兹玲正在里面清点剩余物资，声音断断续续传出来，夹着几句不耐烦的抱怨。更远的地方，水蜜的船停在河岸边，船身微微起伏，像一只沉默的兽。\n\n正邪本该笑她们。\n\n笑这群人自以为能靠修桥、分粥、讲经，就把世界从烂泥里拽出来。笑星那副端正到近乎愚蠢的样子，笑白莲那种明知世界不干净却还想伸手的天真。\n\n可她笑不出来。\n\n因为她想起了那些跟着自己的人。那些草根妖怪，那些没有旗帜、没有靠山、没有谁认真听她们说话的家伙。她曾经站在她们中间，告诉她们不要再忍，不要再跪，不要再等上面的人施舍。那些话并不是假的。她真的痛恨压迫，真的想让底层站起来。\n\n可她也想起战斗之后的地面。\n\n倒下的人不会因为口号正确就站起来。烧掉的粮食不会因为愤怒正当就重新装满仓库。被她煽动的人，有些死在冲突里，有些逃进山林，有些如今又回到命莲寺的工地，沉默地修补自己亲手砸碎过的东西。\n\n她第一次清楚地感到，自己不是没有错。\n\n错不在于她看见了压迫。错在她把所有靠近她的人，都推向了唯一一种答案：颠倒、破坏、掀翻一切。她从未认真问过，若有人愿意开口，若有人愿意谈，若对方的善意并非全是骗局，那自己是否也应该给这个世界留下一点沟通的余地。\n\n可她没有。\n\n她太习惯把所有秩序都看成统治，把所有温柔都看成麻醉，把所有伸来的手都看成锁链。于是她砍断了那些手，也让很多本可以少流的血，真的流了出来。\n\n星站在院门外，没有进来。\n\n她只是把一盏灯放在门边。\n\n正邪盯着那盏灯很久，最后低声骂了一句。\n\n『……笨蛋。』\n\n这一次，她不知道是在骂星，还是在骂自己。"
 myouren.14.a:0 "夜色里，她第一次没有反驳。"

 myouren.15.t:0 "迟来的道歉"
 myouren.15.d:0 "几日后，星带正邪去了草根妖怪的安置区。\n\n那里的人看见正邪时，气氛瞬间变了。赤蛮奇先抬起头，眼神冷得很；今泉影狼的手已经按在腰侧，像随时准备扑上来；若鹭姬则站在水边，脸色苍白，没有说话。\n\n正邪停在原地。\n\n她曾经最熟悉她们。她知道赤蛮奇为什么怀疑上位者，知道影狼为什么总是先想着反击，知道若鹭姬为什么在最糟的时候仍想保住一点体面。她知道她们的痛，也曾用这些痛点燃过自己的火。\n\n可如今，她却第一次不知道该怎么开口。\n\n赤蛮奇先说话了。\n\n『你还活着啊。』\n\n正邪扯了扯嘴角，本能地想回一句刻薄话。可那句话到了喉咙，却像被什么东西堵住。\n\n影狼冷冷道：『你当初说，跟着你就能不用再被人踩。结果呢？有人死了，有人伤了，仓库烧了，路断了，最后还是我们自己来收拾。』\n\n若鹭姬低声说：『我们不是不懂愤怒。可我们也想活下去。』\n\n正邪沉默了很久。\n\n星没有替她说话。白莲也没有。命莲寺的人只是站在一旁，让这场迟来的面对真正落到她身上。\n\n最后，正邪低下头。\n\n不是跪下，不是投降，也不是被打服。只是她第一次把那张总是朝上的脸压低了一点。\n\n『我看见你们的痛。』她声音有些哑，『但我没有看见你们还想活。我只看见了该被掀翻的东西，却没有想过，被我推上去的人，落下来时会摔成什么样。』\n\n她停了一下。\n\n『我错了。』\n\n这三个字不大，却让安置区安静下来。\n\n正邪抬起头，眼神仍然尖锐，却第一次少了那种故意刺人的轻佻。\n\n『我不会说自己从此变成好人。那太恶心了。我也不会假装我不恨那些压迫人的东西。可我会承认，我造成了破坏，也害死了本来可能不用死的人。』\n\n她看向白莲，又看向星。\n\n『如果命莲寺真的不是另一种压迫，如果你们真的要修这个烂世界……那就让我偿还。让我用我这张嘴、这双手、这条命，去补我亲手撕开的地方。』"
 myouren.15.a:0 "她说出了那句话。"

 myouren.16.t:0 "正邪的赎罪"
 myouren.16.d:0 "星把正邪带到殿前时，她鞋上还沾着从聚落带回来的泥。赤蛮奇她们说过的话一路跟到了这里，她原本准备了几句挖苦，见白莲等着，最后只问准备怎样处置自己。\n\n白莲让她先说想做什么。正邪抬头，语气立即尖起来：「替你们写些歌功颂德的话？那你抓错人了。命莲寺做烂的事，我照样会骂。」\n\n「你已经知道自己做坏了哪些事。」星说，「那些人接下来要怎样生活，你也该去看。」\n\n正邪想起被毁的住处，没有接话。娜兹玲在旁边问她，若只肯骂人，最后搬东西、补漏洞的又要轮到谁。她瞪了回去，却没像从前那样转身就走。\n\n白莲给出两个去处。她可以留在命莲寺，检查决策怎样落到人身上，有问题便指出来，也参与纠正；也可以回到草根妖怪之间，帮助重建，将各地遇到的困难带回来。两边都得做事，受过伤的人也未必肯立刻见她。\n\n「他们要是不原谅呢？」正邪问。\n\n「你仍得把自己毁掉的东西补上。」星答。\n\n她低头蹭掉鞋边的一块泥，半晌才说：「真会使唤人。」白莲没有接她的讥讽，只将两个去处各自需要做的工作讲清楚。正邪听着，不时挑出一句含糊的安排追问，直到娜兹玲又露出嫌她麻烦的神情。\n\n殿外有人来找星，正邪往旁边让了一步，仍没有离开。她看着白莲，问若有一天被指出问题的就是师父本人，寺里准备怎么办。"
 myouren.16.a:0 "留下她。让她在命莲寺内赎罪。"
 myouren.16.b:0 "派她回到底层妖怪中，帮助最需要她的人。"


 myouren.17.t:0 "鸦天狗的任务"
 myouren.17.d:0 "射命丸文接到命令时，饭纲丸龙没有多说废话。\n\n命莲寺正在扩大影响。白莲的慈悲、星的秩序、响子的声音，还有那些被收留下来的麻烦妖怪，正一点点把地方民心从天狗社会熟悉的情报网里拉走。上层天狗不喜欢这种变化。她们不怕命莲寺行善，她们怕的是行善变成权威，权威变成管理，而天狗最后只能在别人写好的秩序里低头。\n\n于是，文被派往命莲寺。\n\n任务很简单：找出脆弱处。找到白莲的伪善、弟子们的裂缝、物资流向的漏洞、妖怪被管理后的不满。若能找到足够锋利的东西，天狗就能把它变成谈判筹码，甚至必要时变成要挟命莲寺的刀。\n\n姬海棠果听完后，抱着相机靠在门边，慢悠悠地说：『你又要先写好标题，再去找证据了？』\n\n文笑得很轻快。\n\n『新闻的价值，在于让世界看见它该看见的样子。』\n\n犬走椛则没有笑。她被派来作为随行护卫，表面上是保护文，实际上也是防止她做得太过火。椛只说了一句：『命莲寺不是普通目标。那里的人很麻烦。』\n\n文把笔插进衣襟，眼神却已经亮了起来。\n\n麻烦，正是她最擅长的题材。"
 myouren.17.a:0 "找出命莲寺的弱点。"

 myouren.18.t:0 "第一张照片"
 myouren.18.d:0 "文抵达命莲寺后的第一件事，就是寻找角度。\n\n她拍下响子站在高处大声传话的样子。如果标题写得狠一点，这可以叫『命莲寺以妖怪声音控制群众』。她拍下一轮带着工人修屋顶的背影，也可以写成『宗教组织动员劳工，劳动与信仰界线模糊』。她甚至拍到娜兹玲冷着脸拒绝一个男人多领药品的画面，只要配上几句煽动文字，就足以让人相信命莲寺的慈悲其实有一套很硬的账本。\n\n素材太多了。\n\n可问题是，画面里的细节总是不肯配合她。\n\n响子喊完话后，立刻跳下去帮老人搬柴；一轮不是站在工人后面发号施令，而是自己也满身灰尘地抬着木料；娜兹玲拒绝多发药品后，又把那人的名字记进了后续探访名单里，低声骂了一句『别死在路边，麻烦』。\n\n文把照片一张张收好，眉头却不自觉皱了起来。\n\n姬海棠果翻看底片，语气很轻：『你可以把它们写成黑料。只是读者如果真的来到现场，会发现你的照片比你的标题诚实。』\n\n文没有回答。\n\n她看见了材料，也看见了材料背后不该存在的温度。对一个习惯把真相切成可用形状的记者而言，这种温度很碍事。\n\n犬走椛站在院门边，望着那些忙碌的人类与妖怪，只淡淡补了一句：『至少这里没人把伤员丢到后面。』\n\n文低头看着相机，第一次没有立刻想到标题。"
 myouren.18.a:0 "这些照片，还不能直接用。"

 myouren.19.t:0 "脆弱处"
 myouren.19.d:0 "文开始主动试探命莲寺的裂缝。\n\n她先找娜兹玲，旁敲侧击地问物资账目是否有被白莲刻意修改。娜兹玲只冷冷把账册推到她面前，连暗仓、损耗、走私没收品与临时调拨都写得清清楚楚。『想找漏洞就自己翻。翻错一页，我会笑你。』\n\n她又试探水蜜，问一个曾经会拖人溺死的船幽灵，凭什么能负责运送难民。水蜜靠在船舷上笑，笑意阴冷，却没有否认自己的危险。『凭我现在还在忍。凭白莲知道我是什么，还敢让我做事。你要写，就写清楚一点——命莲寺不是养圣人，是养一群还没沉下去的麻烦货。』\n\n文接着去找星。\n\n她原本以为，这位正气凛然的二把手最好突破。越是端正的人，越怕被质疑。可当她问起命莲寺是否曾在重建中犯错时，星沉默了一会儿，竟认真点头。\n\n『有。』星说，『有些分配慢了，有些人没及时救到，有些命令下得太急，反而让地方更混乱。我们正在修正。』\n\n文愣住了。\n\n她准备好的追问，忽然像撞上了一面不会反击、却也不会倒下的墙。\n\n椛在旁边低声说：『天狗会议里，没人会这样承认错误。』\n\n文瞥了她一眼，想反驳，却说不出口。\n\n她想找的是脆弱处。可命莲寺的脆弱偏偏摆在明处。她们不完美，不高效，不无瑕，甚至有时笨拙得让人着急。可正因为她们没有把裂缝全部藏起来，文反而找不到能一刀刺穿的地方。\n\n这比伪善更难写。\n\n也比伪善更让她烦躁。"
 myouren.19.a:0 "弱点就在眼前，却不像弱点。"

 myouren.20.t:0 "被照顾的记者"
 myouren.20.d:0 "文是在第三天傍晚倒下的。\n\n连续追踪、偷拍、整理情报、试探人物，再加上刻意维持那副什么都不在乎的轻快模样，让她的身体先一步抗议。她本想趁没人注意时离开，却在院外的石阶上失去平衡。醒来时，她躺在命莲寺的客房里，身旁放着温水、药与一小碗还冒着热气的粥。\n\n响子趴在门边，见她醒来，立刻高兴地喊：『醒了！醒了！文小姐没有死掉！』\n\n『别写这种标题。』文声音沙哑。\n\n门外传来娜兹玲的冷哼：『谁会为了一个过劳天狗浪费标题？药钱记账。』\n\n可药已经煎好了，账也没有真的递过来。\n\n星随后进来，认真向她说明医师判断与休息安排，甚至还为她整理好散落的相机与底片。文的第一反应是警惕。她以为命莲寺会趁机检查她的资料，没收她的照片，或者至少要求她写一篇对命莲寺有利的报道。\n\n可星只是把相机放到她手边。\n\n『这是你的东西。』星说，『我们没有打开。』\n\n文看着她，许久没有说话。\n\n白莲最后来到房中。她没有责备文，也没有要求解释，只轻声说：『你一直在看我们。现在，也请你允许我们看见你疲惫的时候。』\n\n那句话让文很不自在。\n\n天狗社会里，疲惫通常意味着落后，犹豫意味着可被替换，别人关心你，也多半是因为你手里还有可用的情报。文早已习惯把笑声和标题挡在自己前面，习惯把真正的疲惫压在报纸背后。\n\n可命莲寺没有追问她手里有什么。\n\n她们只是给她水、药、粥，以及一个不用立刻站起来的夜晚。\n\n文转过头，看向窗外渐暗的天色。\n\n她忽然发现，自己从未被这样体谅过。"
 myouren.20.a:0 "这不该成为报道的一部分。"

 myouren.21.t:0 "未能写出的威胁"
 myouren.21.d:0 "文回到天狗临时驻地时，带回了厚厚一叠资料。\n\n饭纲丸龙需要的是筹码。文也确实找到了许多可以被写成筹码的东西：水蜜的危险本能，娜兹玲近乎无情的账目，响子容易被情绪带动的天真，一轮在人群前偶尔笨拙得像会把自己绊倒，星过度自责，白莲则把一群本该被分开管理的麻烦角色全部收在身边。\n\n这些都能写。\n\n只要文愿意，她可以把命莲寺写成混乱的宗教政权，把白莲写成危险的理想主义者，把那些弟子写成迟早会失控的隐患。天狗会得到谈判的刀，她也会得到一篇足够锋利、足够有用的报道。\n\n可她写不下去。\n\n姬海棠果坐在她对面，看着那份迟迟没有完成的稿件，忽然问：『你到底是写不出来，还是不想写？』\n\n文笑了一下，笑得很薄。\n\n『这两者有区别吗？』\n\n『有。』果说，『写不出来，是素材不够。不想写，是你知道那样写会背叛你看见的东西。』\n\n文沉默了。\n\n她想起那碗粥，想起星没有打开她的相机，想起白莲说允许她疲惫。她也想起命莲寺那些明摆着的裂缝：不完美、不体面、不安全，可每一道裂缝旁边，都有人在补。\n\n最后，文把原本的标题划掉。\n\n她重新写下第一行：\n\n《命莲寺调查：一座不完美组织为何仍值得被信任》\n\n椛站在帐外，听见笔尖重新落下的声音，没有回头，只低声说：『你会惹怒大天狗的。』\n\n文轻轻笑了。\n\n『我本来就是记者。』\n\n她顿了顿。\n\n『真正不能失去的，从来不是上面的满意。』"
 myouren.21.a:0 "她重新夺回了自己的笔。"

 myouren.22.t:0 "风向改变"
 myouren.22.d:0 "天狗会议上，文把调查报告放到了桌面中央。\n\n上层天狗原本期待的是一份能压住命莲寺的黑料，一份能在谈判时迫使白莲让步的材料。可文交出的东西，完全不是她们想要的答案。\n\n她承认命莲寺有弱点。水蜜危险，响子稚嫩，一轮笨拙，娜兹玲尖锐，星太容易把责任往自己身上揽，白莲更是把一整个组织押在一个近乎不合时宜的慈悲理想上。若从冷酷的政治计算来看，这些全都是漏洞。\n\n可是，文抬起眼，声音第一次没有带着玩笑。\n\n『我建议天狗社群接受命莲寺管理框架。』\n\n会议厅一瞬间安静下来。\n\n她继续说道：『不是投降。也不是交出天狗的眼睛、翅膀和笔。相反，正因为我们仍想保住这些东西，才不能继续只把命莲寺当成可以要挟的对象。她们的秩序不是为了剥夺情报，而是为了让各族不再互相吞掉。天狗若站在外面，只会越来越像一群等着别人犯错的旁观者；若加入其中，我们反而能确保这套秩序不会失明。』\n\n姬海棠果把自己的补充报道放到旁边。\n\n『我同意。至少她们愿意被看见。很多掌权者连这一点都做不到。』\n\n犬走椛也开口了。她的话很短，却很有重量。\n\n『命莲寺承认错误，也会修正。这样的上级，少见。』\n\n争论持续了很久。有人愤怒，有人质疑文是否已经被白莲收买，也有人担心天狗社会会因此失去独立性。文一一回应，没有退。她太熟悉权力，也太熟悉谎言，所以她比任何人都清楚，命莲寺不是没有风险。\n\n可她也比任何人都清楚，这份风险值得押上一次。\n\n几日后，《文文。新闻》与《花果子念报》同时刊出报道。标题并不温顺，也没有替命莲寺涂上圣洁的金边。它们写下命莲寺的缺陷，写下内部的麻烦人物，也写下那些缺陷如何被承认、被照顾、被一点点修补。\n\n这一次，文没有用报道制造恐惧。\n\n她用报道替命莲寺打开了一扇通往天狗社会的门。"
 myouren.22.a:0 "让风替命莲寺说话。"



 myouren.23.t:0 "树林中的歌声"
 myouren.23.d:0 "响子是在黄昏时听见那阵歌声的。\n\n她本来只是替命莲寺跑腿，沿着树林小路把几封通知送往附近村落。可走到半路，树影深处忽然传来一段清亮又带着夜色的旋律。那歌声不像寺里的诵经，也不像人类集市上的小调，它更自由，更像从枝叶、虫鸣与将暗未暗的天空里自然长出来。\n\n响子立刻停下脚步。\n\n她循着声音钻进林间，看见米斯蒂娅·萝蕾拉正站在树下唱歌。夜雀的歌声带着一点神秘，一点调皮，也带着会让人不自觉停下来聆听的魔性。响子听得眼睛发亮，忍不住跟着回唱了一句。\n\n米斯蒂娅吓了一跳，回头时差点把旋律唱歪。\n\n『谁在那里学我唱歌？』\n\n响子从树后探出头，笑得像被太阳晒过的石阶。\n\n『不是学！是回声！你的歌太好听了，所以我想把它喊回来！』\n\n米斯蒂娅盯着她看了片刻，忽然笑了。\n\n一个夜雀，一个山彦。一个把夜色唱给人听，一个把声音送向远方。她们谁也没想到，这场偶然的林间合唱，会成为后来席卷幻想乡的第一声。"
 myouren.23.a:0 "这声音，好像能走得很远。"

 myouren.24.t:0 "鸟兽伎乐"
 myouren.24.d:0 "最初，响子和米斯蒂娅只是觉得好玩。\n\n她们在树林里练习，在河边试音，在命莲寺后院偷偷合唱。米斯蒂娅负责旋律，响子负责把声音推得更高、更远、更热闹。有时夜雀的歌声刚刚钻进树影，山彦的回响就从另一头滚回来，把一段小小的旋律变成像有十几个人一起唱的合声。\n\n响子兴奋地说，这样一定可以组成乐团。\n\n米斯蒂娅想了很久，最后拍板：『那就叫鸟兽伎乐吧！夜雀是鸟，你是……嗯，声音很大的兽？』\n\n响子立刻抗议，可名字还是留下了。\n\n她们第一次表演，只是在命莲寺的小院里。观众不多，只有几个休息的工人、路过的孩子、抱着账册却假装只是经过的娜兹玲，以及站在远处微笑的白莲。米斯蒂娅唱到一半还忘词，响子则太兴奋，把最后一句喊得连屋檐上的鸟都飞了起来。\n\n可是，大家笑了。\n\n不是嘲笑，而是那种很久没有从疲惫里抬起头后，突然发现自己还能被一首奇怪的歌逗笑的笑。\n\n白莲看着响子在掌声里又跳又喊，轻轻点头。\n\n她知道，这也许不是经文，也不是制度。可有时候，让众人重新想起自己还能快乐，本身就是一种很重要的救济。"
 myouren.24.a:0 "鸟兽伎乐，正式开唱！"

 myouren.25.t:0 "虫鸣的旋律"
 myouren.25.d:0 "鸟兽伎乐的表演，很快不再只属于命莲寺后院。\n\n就在她们不断尝试新曲目的时候，一位意想不到的听众出现了——莉格露·奈特巴格。\n\n她并没有像其他观众那样鼓掌或起哄，而是静静地站在一旁，听完之后才开口：『你们的歌很好听……但还缺一点东西。』\n\n响子立刻凑过去问是什么，米斯蒂娅则警惕地眯起眼。\n\n莉格露没有直接回答，而是带她们走进更深的林间。夜色降临，虫鸣渐起。细碎的振翅声、节奏分明的鸣叫、忽远忽近的回响，在黑暗中交织成一张看不见的乐谱。\n\n『这些声音，本来就是音乐。』莉格露轻声说。\n\n从那天起，鸟兽伎乐的练习多了一项内容——倾听。\n\n她们开始模仿虫鸣的节奏，把夜雀的旋律嵌入其中，再由响子的回声将这些细小的声音放大、延展。原本单纯的歌声，逐渐变得层次丰富，既有自然的律动，又带着妖怪特有的自由与野性。\n\n新的曲子第一次在命莲寺演出时，观众明显愣住了。\n\n那不是人类熟悉的旋律，却让人不自觉地安静下来，仿佛整片森林都在一起呼吸。\n\n娜兹玲皱着眉记录，却没有再抱怨吵闹；一轮听得入神，甚至忘了检查舞台结构；白莲则露出更深的微笑。\n\n鸟兽伎乐，终于找到了属于自己的声音。"
 myouren.25.a:0 "自然本身，就是最好的乐谱。"

 myouren.26.t:0 "幻想乡大音乐会"
 myouren.26.d:0 "当鸟兽伎乐决定举办一场真正的大音乐会时，几乎所有人都觉得她们疯了。\n\n地点选在幻想乡中央的空地。舞台由一轮带人搭建，河童提供扩大声音的装置，星负责维持人流，娜兹玲负责票券、座位与物资调度。水蜜甚至用船把远方的观众一批批送来，嘴上说着『吵死了』，却没有漏掉任何一班。\n\n开演那天，夕阳刚落下，人群已经铺满空地。人类、妖怪、妖精、天狗、河童，甚至许多本来只想来看热闹的人，都站在同一片天空下。\n\n米斯蒂娅先唱。她的歌声像从夜里升起的火，带着林间、鸟影与不肯被驯服的自由。随后响子接上，她把那道歌声推向远处，让每一句旋律都像从山谷四面八方回应回来。\n\n而当节奏响起时，人们才真正意识到变化——虫鸣般的节拍在空气中流动，细碎却精准，仿佛整片森林都被搬上了舞台。那是莉格露带来的旋律，是自然与妖怪共同编织的声音。\n\n鼓点、木板、铃声与虫鸣交织在一起，前卫得让老人皱眉，却又热烈得让孩子们跟着跳起来。\n\n那不是传统的歌。\n\n那是鸟兽伎乐自己的声音：有点吵，有点野，有点不守规矩，却明亮得像是在告诉所有人，世界还没有唱完。\n\n白莲站在人群后方，看着响子在舞台上用尽全力歌唱。她忽然明白，这个曾经只是跟在寺里大声喊话的小妖怪，已经用自己的方式，把命莲寺的温暖唱给了整个幻想乡。"
 myouren.26.a:0 "让幻想乡听见未来。"

 myouren.27.t:0 "歌声越过结界"
 myouren.27.d:0 "幻想乡大音乐会之后，鸟兽伎乐的名字开始传向更远的地方。\n\n最初只是几份报纸报道了这场奇妙演出。随后，外界的使节、商人、士兵与记者开始询问：那两个能把夜色与回声唱成一整片天空的妖怪，究竟是谁？还有人特别提到，那些仿佛来自森林深处的奇妙节奏。\n\n白莲没有阻止这种热潮。\n\n她知道，音乐不会直接修好道路，也不会让饥饿立刻消失。可它能让疲惫的人抬头，让害怕的人跟着唱一句，让那些经历过战火、重建与失去的人，重新感觉自己并不只是活在苦难之后。\n\n响子、米斯蒂娅与莉格露的合作越来越默契。她们的歌不再只是娱乐，而像一阵向前吹的风，让许多原本低着头的人，愿意再向明天走一步。\n\n有人说，鸟兽伎乐正在成为幻想乡最流行的声音。\n\n响子听见后，高兴得绕着寺院跑了三圈。米斯蒂娅则装作不在意，却偷偷把下一首歌改得更响亮。莉格露则在一旁轻轻点头，继续倾听夜里的虫鸣。\n\n这一次，她们要把未来唱得更远。"
 myouren.27.a:0 "歌声会带着大家继续前进。"




 myouren.28.t:0 "被拿来比较的人"
 myouren.28.d:0 "姬海棠果的报道刊出时，一轮正在工地上检查梁柱。\n\n标题写得很刺眼：『命莲寺的两种正义——耀眼的寅丸星，与努力追赶的一轮。』\n\n文章并没有恶意，甚至可以说相当公正。果写星像一面立在晨光里的旗，端正、可靠、让人自然愿意跟随；又写一轮勤恳、聪明、负责，却总像站在旗影之下，做着许多必要却不容易被看见的事。\n\n一轮盯着那几行字，看了很久。\n\n她知道果不是在侮辱她。正因为不是侮辱，才更难受。星确实耀眼。无论是站在白莲身旁，还是独自带队前行，星都有一种让人安心的正气。她不擅长灰色地带，也常常笨拙，可那份笨拙偏偏很干净。\n\n而一轮不同。\n\n她会绕路，会算时机，会把难听的话换成别人能接受的说法，也会在必要时压下自己的不安，先让事情办成。她不觉得这错。可每当她看见星，她又忍不住怀疑：是不是自己不够明亮，才需要这些变通？是不是自己的正义不够纯粹，才总要借助方法、话术与安排？\n\n云山在她身后低低哼了一声，像是在替她不满。\n\n一轮却把报道收好，没有撕掉。\n\n『如果我真的只是星的影子，那我至少要知道，自己到底站在什么地方。』\n\n于是，她决定去查命莲寺的过去。不是为了推翻谁，也不是为了证明星错了，而是为了弄清楚：这座寺、这位师父、这一群被收留的妖怪，究竟是靠什么走到今天。\n\n若她要证明自己的不同，就不能只在别人写下的比较里挣扎。她必须亲手翻开那些被温柔盖住的旧页。"
 myouren.28.a:0 "我不是星的影子。"

 myouren.29.t:0 "旧账与旧伤"
 myouren.29.d:0 "一轮开始整理命莲寺的旧档。\n\n她没有像星那样直接去问白莲，也没有站在众人面前高声宣布自己的决心。她只是安静地翻账册、查物资、读旧信，向娜兹玲借来那些被锁在柜中的记录，又从水蜜口中套出一些被她用玩笑遮住的往事。\n\n娜兹玲看着她埋在纸堆里，冷冷说道：『想证明自己比星聪明？』\n\n一轮下意识想反驳，最后却只是叹气。\n\n『我想证明，我不是只能做星做不到的杂事。』\n\n娜兹玲沉默了一下，把另一叠更旧的记录推给她。\n\n那些文字并不美好。里面有白莲曾经与妖怪往来的传闻，有命莲寺早期被人类敌视的记录，有水蜜失控前后的处置，有响子最初被收留时灵力不稳的报告，也有许多地方民众对妖怪的不信任、对寺院的不满、对救济分配的抱怨。\n\n命莲寺不是从一开始就被人相信的。它也曾笨拙，曾犯错，曾在善意与现实之间撞得满身是伤。\n\n一轮越看越沉默。\n\n她忽然明白，星之所以耀眼，是因为她总能把这些混乱重新举回光下；而自己之所以无法像星那样耀眼，是因为她太清楚光照不到的地方还有多少账、多少怨、多少不能只靠一句正义就解决的麻烦。\n\n这并没有让她轻松。\n\n相反，她更加怀疑自己。若命莲寺的过去并不清白，若白莲的慈悲也曾沾着痛苦、欺瞒与无法弥补的选择，那么自己追随的到底是什么？\n\n一轮合上账册。\n\n她知道，仅靠寺里的记录已经不够了。\n\n若要真正翻开过去的罪责，她必须去问一个不会被命莲寺温情影响的人。"
 myouren.29.a:0 "去问真正审判罪的人。"

 myouren.30.t:0 "小町的渡船"
 myouren.30.d:0 "三途河边的风，比一轮想象中更冷。\n\n她站在岸边，手里握着整理好的记录，心中却忽然生出退意。来这里之前，她已经想过无数种说辞：为了命莲寺的未来，为了理解白莲的过去，为了证明自己并非只会躲在星的光后面。可真正站到彼岸入口前时，这些理由都显得太整齐，整齐得像是在替自己的不安找借口。\n\n小野冢小町撑着船靠岸时，懒洋洋地看了她一眼。\n\n『命莲寺的人？活着就来彼岸问旧账，还真少见。』\n\n一轮有些僵硬地行礼。\n\n『我想见四季映姬大人。』\n\n小町打了个哈欠。\n\n『想问白莲的罪？还是想问你自己的？』\n\n一轮一时语塞。\n\n小町笑了笑，没有追问，只让她上船。渡船缓缓离岸，河面没有风浪，却像能映出许多不该被看见的东西。一轮看见自己的倒影，也看见倒影背后那些零碎的画面：第一次跟随白莲时的迷惘，强迫自己正经起来的笨拙，在人前讲道时偷偷攥紧的手，还有每一次被拿来和星比较时，那点不愿承认的刺痛。\n\n小町撑着船，语气随意。\n\n『星那种人啊，适合站在前面。大家看见她，就知道路还没断。』\n\n一轮低声问：『那我呢？』\n\n『你？』小町瞥了她一眼，『你像那种会先检查桥下有没有腐木的人。别人嫌麻烦，真塌了才知道该谢你。』\n\n一轮沉默下来。\n\n船继续向彼岸驶去。她不知道四季映姬会给她什么答案，也不知道自己是否承受得住那些答案。\n\n可她已经没有回头。"
 myouren.30.a:0 "渡河，去见审判者。"

 myouren.31.t:0 "阎魔翻开的记录"
 myouren.31.d:0 "四季映姬坐在审判之席上，目光平静得近乎严厉。\n\n一轮向她说明来意。关于白莲，关于命莲寺，关于那些被收留的妖怪，也关于自己为何想知道这一切。她说得很努力，句子却越说越乱。最后，她只能低下头，承认最真实的理由。\n\n『我不知道自己追随的东西，是否真的足够正确。』\n\n映姬没有嘲笑她。\n\n她只是翻开记录。\n\n白莲的过去被摊开：畏惧死亡，借妖延命，欺瞒人类，庇护妖怪，最终被封入魔界。水蜜的过去被摊开：溺亡、怨恨、拖人沉没，也在白莲身旁一次次压住旧日的冲动。娜兹玲的怀疑、响子的幼稚、星的失责与自责，还有一轮自己那些不愿被看见的动摇，也都像冷光下的尘埃，无处可藏。\n\n一轮听得脸色发白。\n\n她原以为自己已经做好准备。可当所有罪责真的被审判者平静读出时，她才发现，命莲寺从来不是一座干净的寺院。它收留的不是被洗白的人，而是一群仍带着罪、伤、执念与危险的存在。\n\n『那么，命莲寺错了吗？』一轮问。\n\n映姬看着她。\n\n『罪不会因为后来行善而消失。』\n\n一轮的手指微微收紧。\n\n映姬继续说道：『但善也不会因为过去有罪而变得毫无意义。审判看见罪，修行则看见罪之后的路。圣白莲并非无罪之人，命莲寺也并非无瑕之所。可若一个组织能承认过去，约束现在，并让有罪者继续修正自己，那么它仍有存在的价值。』\n\n一轮抬起头。\n\n映姬最后说道：『你与寅丸星不同。星适合守住光。你适合记住光下的影子。不要把这当成缺陷。若命莲寺只有耀眼的人，它迟早会看不见自己的罪。』\n\n一轮久久没有说话。\n\n她终于明白，自己不必成为星。"
 myouren.31.a:0 "记住光下的影子。"

 myouren.32.t:0 "不耀眼的正义"
 myouren.32.d:0 "一轮回到命莲寺时，姬海棠果又来了。\n\n她似乎已经听说了一轮去了彼岸，抱着相机站在院门旁，半是好奇，半是试探地问：『所以，你找到答案了吗？你和星到底有什么不同？』\n\n若是过去，一轮大概会涨红脸，努力说出一番听起来很正确的话。可这一次，她只是看向远处的星。\n\n星正站在广场中央，替一队新来的难民说明安置规则。她的声音不大，却让人安心。那份正气仍然耀眼，像一盏可以让迷路者抬头看见的灯。\n\n一轮看着她，心里已经没有原先那种尖锐的刺痛。\n\n『星适合让人相信。』一轮说，『我适合让事情不至于因为相信而变得粗糙。』\n\n果眨了眨眼。\n\n一轮继续说道：『她会站在前面，把旗举起来。我会检查旗杆有没有裂，地基会不会松，底下有没有人被压住。她的正义明亮，我的正义比较麻烦。会怀疑，会绕路，会问不好听的问题，也会在必要时承认我们并不干净。』\n\n云山在她身后低低点头。\n\n果没有立刻按下快门。\n\n这时，星注意到她们，走了过来。她看见一轮手里的记录，神情微微一变，随后认真低头。\n\n『辛苦你了。』\n\n只有这一句话。\n\n一轮愣了一下，忽然有些想笑，也有些想哭。她原本以为自己必须证明比星更聪明、更有用、更特别。可星从来没有把她当成影子。真正拿那道影子折磨她的，一直是她自己。\n\n白莲站在廊下，安静地看着两人。\n\n命莲寺需要星那样的光，也需要一轮这样愿意翻开旧账、承认裂缝、把复杂现实一点点理顺的人。她不像星那样耀眼，但正因为她不那么耀眼，才能低下身，看见那些被光越过的地方。\n\n果终于拍下照片。\n\n这一次的标题很短：\n\n『不耀眼的正义，也能撑住一座寺。』"
 myouren.32.a:0 "我会以自己的方式，守住命莲寺。"



 myouren.33.t:0 "正体不明潜伏寺中"
 myouren.33.d:0 "封兽鵺来到命莲寺时，没有用自己的脸。\n\n第一天，她是来领药的年幼妖怪；第二天，她是搬运木料的沉默工人；第三天，她成了在廊下扫地的陌生僧侣。正体不明的能力让她像影子一样穿过命莲寺的日常，看见白莲如何对待弟子，也看见那些被收留下来的妖怪如何工作、争吵、疲惫，又在天黑前把该做的事做完。\n\n鵺最初并不相信这一切。\n\n在她看来，妖怪不该被规矩拴住，不该为了人类改变自己，更不该把所谓共存当成未来。妖怪本就是自然、黑夜、未知与恐惧的化身。雷雨、深林、荒坟、水底、山影，这些才是妖怪应有的居所。妖怪若开始讨人喜欢，开始向人解释自己，开始为了人类的安心而修剪爪牙，那还算什么妖怪？\n\n她潜伏在命莲寺，不是为了学习，而是为了找到能动摇这里的人。\n\n最后，鵺把目光放在村纱水蜜身上。\n\n一个船幽灵，一个水鬼，一个本该让人沉入河底的存在，却如今成了白莲麾下的船长。若连水蜜都能被白莲驯服，那命莲寺所谓救赎，或许不过是一种更温柔的囚笼。\n\n于是，鵺决定在夜里去见她。"
 myouren.33.a:0 "她盯上了水蜜。"

 myouren.34.t:0 "水面上的另一个水蜜"
 myouren.34.d:0 "那天夜里，水蜜站在河边检查船索。\n\n水面很静，静得像一面黑镜。就在她弯腰确认锚链时，镜中忽然映出了另一个自己。相同的水手服，相同的帽子，相同的笑意，甚至连眼底那点阴冷都模仿得几乎没有破绽。\n\n水蜜没有惊叫，只是慢慢直起身。\n\n『模仿得不错。』她说，『不过我笑得没那么恶心。』\n\n倒影从水中走出来，先是水蜜的模样，随后轮廓扭曲，变回封兽鵺。黑暗像披在她肩上的羽衣，正体不明的影子在她身后晃动。\n\n『村纱水蜜。』鵺说，『你不觉得可惜吗？你曾经是水底的恐惧，是活人不敢靠近河岸的理由。现在呢？替白莲运粮，接送难民，听人喊你船长。』\n\n水蜜笑了一声。\n\n『听起来还不错。』\n\n鵺眯起眼。\n\n『妖怪不该这样。妖怪不需要和人类做朋友。我们是自然本身，是他们无法理解、无法驯服、只能敬畏的东西。你本来该让他们害怕，而不是让他们崇拜。』\n\n水蜜靠在船边，语气懒散，却没有移开视线。\n\n『你想策反我？』\n\n『我想让你想起来。』鵺低声说，『想起来你是谁。』\n\n河风吹过，两人的影子在水面上交叠。\n\n水蜜沉默了片刻，忽然笑得更冷。\n\n『那就走吧。』\n\n鵺一怔。\n\n水蜜转身踏上船板。\n\n『既然你要谈妖怪的本质，就别只在河边说漂亮话。我们去看看幻想乡。看看那些被你称作自然、恐惧和未知的东西，到底是怎么活下来的。』"
 myouren.34.a:0 "辩论从船上开始。"

 myouren.35.t:0 "妖怪从何而来"
 myouren.35.d:0 "圣辇船离开河岸时，夜色还没有散。\n\n鵺站在船头，看着雾气从水面升起。她说，妖怪比人类更古老。人类只是短命的过客，而妖怪来自山、河、兽、风暴与黑暗。没有人类，山仍是山，河仍是河，夜仍会降临。妖怪不该把自己的存在系在人类身上。\n\n水蜜听完，没有立刻反驳。\n\n『山和河会存在。』她说，『可“山里有会吃人的东西”、“水上有拖船沉没的幽灵”，这些是谁说出来的？』\n\n鵺皱起眉。\n\n水蜜继续说道：『你把妖怪说得太整齐了。不是所有妖怪都从山林、野兽和风暴里生出来。也有些东西，是人死后留下来的。怨念、恐惧、传闻、名字，还有活人不肯忘掉的水难，都会把一个亡魂慢慢改造成别的样子。』\n\n她低头看向船下的水。黑色河面映出她的脸，却不像真正活人的倒影。\n\n『我不是一开始就是妖怪。至少，我想我不是。』水蜜说，声音比平时低了些，『我曾经应该是人类。也许有名字，有故乡，有会等我回去的人。可那些东西早就被水泡烂了。我记不清自己原本是什么样的人，只记得船沉下去，记得冷，记得怨，记得后来的人看见水雾和破船时，开始把我叫成船幽灵。』\n\n鵺冷冷道：『所以你承认，妖怪是人类幻想出来的？』\n\n『不全是。』水蜜摇头，『如果只是幻想，我不会站在这里。如果只是幽灵，我也不会被恐惧和传说改造成现在这样。妖怪大概就是这么麻烦的东西。有的从自然里长出来，有的从死者的执念里爬出来，有的被人类的故事喂养成形。自然给根，死亡给影，人类的恐惧给名字，时间再把我们推成能自己说话、自己选择的存在。』\n\n鵺沉默了一会儿。\n\n水蜜握住船舵，指节在夜色里显得很白。\n\n『我曾经也许只是一个死在船上的人。后来，我成了会拖人下水的船幽灵，成了别人不敢靠近河岸的理由。这个本质很难听，也很真实。可本质不是锁死一切的判决。人类的恐惧把我变成了水上的灾祸，白莲却让我学会用这份恐惧之外的方式活着。』\n\n鵺没有回答。\n\n雾气里，圣辇船继续向前。"
 myouren.35.a:0 "自然给根，死亡给影，恐惧给名，时间给选择。"


 myouren.36.t:0 "妖怪山上的村落"
 myouren.36.d:0 "她们来到妖怪山时，天色正灰。\n\n山风穿过杉林，远处能听见巡逻白狼天狗的短哨声。更深处，天狗村落隐藏在山势与雾气之间。那里并不像鵺口中属于妖怪的原始巢穴。它有道路、哨站、仓库、印刷所、会议厅，也有严格的阶级、巡逻路线、记录文书与报纸。鸦天狗在屋檐间飞掠，白狼天狗守在关口，山伏天狗则在更高处处理命令与裁决。\n\n鵺望着那片村落，眉头微微皱起。\n\n『这算什么？』她低声说，『妖怪模仿人类，给自己造出官僚、报纸、规矩和职位，然后假装这也是妖怪的生活？』\n\n水蜜靠在树旁，笑了一声。\n\n『你觉得不像？』\n\n『太像人类了。』鵺冷冷道，『妖怪本该是山风、黑影、雷声和未知。可你看她们，巡逻，开会，写报告，印报纸，争职位。若把翅膀和法力拿掉，和人类的村落又有什么不同？』\n\n水蜜没有立刻反驳。\n\n她看着远处一名白狼天狗拦下过路者，又看见鸦天狗抱着稿件匆匆飞过。那确实不像鵺想象中的妖怪。太有秩序，太会计算，也太懂得把情报、权威与规矩织成一张网。\n\n『可她们仍然是妖怪。』水蜜说，『她们飞得比人快，耳目比人远，寿命比人长，也比人类更懂得山里的风向与恐惧。只是她们没有停在“让人害怕”这一步。她们把妖怪的能力变成了社会，把速度变成了情报，把山的封闭变成了秩序。』\n\n鵺看向她。\n\n水蜜继续说道：『如果妖怪只能是自然与恐惧，那天狗算什么？失败品？叛徒？还是证明了妖怪也会发展、会组织、会像人类一样争权夺利，也会像人类一样保护自己的共同体？』\n\n鵺没有回答。\n\n远处，巡逻队换岗。哨声在山谷里短促回荡，像某种冷硬而精密的心跳。\n\n水蜜低声说：『别把妖怪想得太纯粹。妖怪会模仿人类，也会超越人类；会保留本能，也会长出阶级。我们不是被固定在古老传说里的标本。只要还活着，就会变。』\n\n鵺沉默许久，最后只说：『变得太像人类，也许正是衰弱的开始。』\n\n水蜜看着天狗村落中亮起的灯。\n\n『也许。』她说，『但不变，未必就是活着。』"
 myouren.36.a:0 "妖怪也会长出自己的社会。"


 myouren.37.t:0 "空馆中的吸血鬼"
 myouren.37.d:0 "红魔馆的铁门没有关严，鵺走过去时，却先朝门房看了一眼。里面空着，窗台积了灰。水蜜伸手推门，锈住的铰链响了一声，鵺皱起眉，叫她轻点。\n\n「怕吵醒谁？」水蜜问。\n\n「怕你把门拆下来，还要我帮忙抬。」\n\n院里长满杂草，两人沿还能辨认的路走到台阶前。女仆和门卫都不在，楼上的窗帘垂着，谁也没有出来询问。鵺抬头打量那几扇窗，说这地方空了，倒还很会摆架子。\n\n水蜜靠着栏杆笑了。她问鵺刚才为何先看门房。鵺说谁知道这里有没有留下守卫，随后看见她的表情，又补了一句：「你也知道这家人的名声。」\n\n「知道。附近的人走到湖边，还会先看看雾。」水蜜说，「我以前也喜欢这样。船还没出现，别人先怕了，省多少事。」\n\n鵺没有接她的玩笑。她想起路上听来的说法，有人把红雾说成屠杀的前兆，有人连洋馆晚宴的座次都能讲上半天，仿佛亲自受过邀请。真正来过这里的究竟有几个，谁也说不清。\n\n「讲得够多，倒像她随时会回来。」鵺说。\n\n水蜜朝空窗指了一下：「她现在没站在那里。可你刚才还是看了。」\n\n鵺踢开脚边的枯枝，说人会疑神疑鬼，不值得大惊小怪。水蜜也没再追问，只说自己死在水里以后，很久都觉得船上的活人该陪她一起沉；后来无论船上有没有她，出事时总有人叫她的名字。那时她很满意，如今听见同样的话，却未必还笑得出来。\n\n鵺转头看她，终于没有拿佛门规矩来挖苦。离开时，她仍替水蜜扶了一把铁门，免得风将门板撞上石墙。走到湖边后，她回头望了一次，确认楼上的窗帘没有动。"
 myouren.37.a:0 "有些妖怪离开后，仍以故事存在。"

 myouren.38.t:0 "被赶入地下者"
 myouren.38.d:0 "旧地狱的空气沉重而干燥。\n\n鵺不喜欢这里。这里没有她想象中属于妖怪的自由，只有被遗弃的热、旧秩序的残骸，以及那些被地上世界推开的存在。\n\n水蜜带她远远看见了古明地觉的地灵殿。\n\n『会读心的妖怪。』水蜜说，『比你更接近恐惧本身。没人喜欢被看穿，所以她们被讨厌，被排斥，最后待在这里。』\n\n鵺低声道：『强大的妖怪不该在意这些。』\n\n水蜜看了她一眼。\n\n『你真的这么想？』\n\n鵺没有回答。\n\n水蜜继续说道：『觉是大妖怪，恋也是。可强大没有让她们自动得到位置。妖怪之间也有阶级，也有排斥，也有把麻烦推到看不见地方的习惯。你说妖怪应该回归本能，那你有没有想过，所谓本能里也包括弱肉强食、厌恶异类、把不合群的同伴赶进地下？』\n\n旧地狱深处传来低沉的声响，像大地在回忆自己被抛弃的年代。\n\n鵺皱起眉。\n\n水蜜的声音很平。\n\n『人类会压迫妖怪，妖怪也会压迫妖怪。别把我们说得太干净。』\n\n这句话让鵺的表情变得难看。\n\n她厌恶人类的秩序，也厌恶被规训的妖怪。可旧地狱摆在眼前，像一个无法回避的证据：妖怪并不会因为更接近恐惧与自然，就自然变得自由而平等。\n\n如果回到过去，谁会站在上面，谁又会被赶到下面？\n\n这个问题，鵺没有答案。"
 myouren.38.a:0 "妖怪之间，也有被遗忘者。"

 myouren.39.t:0 "人里与巫女"
 myouren.39.d:0 "她们最后来到人里。\n\n白日的人里并不像妖怪传说里那样脆弱。这里有屋舍、田地、商铺、警戒、学校，也有无数知道妖怪存在却仍要继续过日子的人。孩子在路边跑过，老人坐在门前晒太阳，商贩同客人讨价还价。恐惧并没有消失，只是被日常压低，藏在门闩、护符和夜晚不走山路的规矩里。\n\n鵺站在人群之外，低声说：『这就是妖怪被削弱的原因。人类开始习惯我们，开始管理恐惧，开始把未知变成常识。』\n\n水蜜点头。\n\n『也是妖怪能继续存在的原因。』\n\n鵺看向她。\n\n水蜜说道：『如果没有人里，妖怪就没有固定的镜子。人类害怕我们，也讲述我们，供奉我们，防备我们，给我们名字。人里不是妖怪的敌人那么简单，它也是幻想乡这套循环的中心。』\n\n她们又远远望向博丽神社。\n\n从前的博丽巫女并不是为了消灭所有妖怪而存在。她的职责更像是一把尺度：让人类不至于被妖怪吞没，也让妖怪不至于因过度失控而被彻底讨伐。妖怪需要恐惧，人类需要安全，而巫女站在两者之间，维持那条谁都不满意、却谁都离不开的界线。\n\n鵺沉默许久。\n\n『所以你认为，妖怪必须依附人类？』\n\n『不是依附。』水蜜说，『是纠缠。我们讨厌承认这一点，因为它不够威风。可妖怪和人类从来不是两条分开的河。我们吓他们，他们定义我们；他们逃离我们，我们追着他们留下的恐惧成形。』\n\n人里的钟声响起。\n\n水蜜低声补上：『白莲想改变的，不是让妖怪变成人类的宠物。而是让这场纠缠，不必永远靠伤害来维持。』"
 myouren.39.a:0 "纠缠，不等于奴役。"

 myouren.40.t:0 "幽灵与船长"
 myouren.40.d:0 "回程时，水蜜亲自掌舵。\n\n夜风吹过船帆，河水在船底轻轻拍打。鵺站在她身旁，忽然问：『如果你的本质是害人的幽灵，那你现在算什么？背叛本质的妖怪？还是被白莲改造出来的工具？』\n\n水蜜笑了一下。\n\n『我以前也这么问过自己。』\n\n她望着前方的水路，语气少见地平静。\n\n『我确实是害人的东西。看见船，我会想让它沉；看见人靠近水边，我会想把他拖下去。那种冲动不是一句“我要变好”就会消失。白莲知道，星知道，一轮知道，娜兹玲也知道。她们从来没有假装我无害。』\n\n鵺盯着她。\n\n水蜜继续说道：『可她们还是让我掌舵。不是因为我已经没有危险，而是因为危险也能被方向约束。水会淹死人，也能载船。幽灵会害人，也能记住沉没者的恐惧，然后把活人送到岸上。』\n\n她拍了拍船舵。\n\n『我从前是让人害怕的幽灵。现在，有人喊我船长。有人把命交给我的船。有人看见我，不是只想到沉没，也会想到抵达。』\n\n鵺的表情微微动了一下。\n\n水蜜转头看她。\n\n『你说妖怪要回归本能。可如果本能是出生时别人给我们的形状，那我们为什么不能在活下去之后，亲手给自己第二个形状？』\n\n圣辇船破开夜雾，灯光在水面上铺出一条路。\n\n鵺看着那条路，许久没有说话。\n\n她原本想策反水蜜。\n\n可这一刻，她忽然意识到，自己反而被水蜜问住了。"
 myouren.40.a:0 "本质不是终点。"

 myouren.41.t:0 "继续潜伏的鵺"
 myouren.41.d:0 "回到命莲寺后，鵺没有向白莲投降。\n\n她也没有承认自己被说服。封兽鵺仍然是正体不明的大妖怪，仍然厌恶太过整齐的答案，仍然怀疑命莲寺的共存之道会不会在未来变成另一种温柔的束缚。\n\n但她没有再试图策反水蜜。\n\n夜深时，鵺站在寺院屋檐上，看着水蜜把最后一批乘客送回岸边。孩子们向船长挥手，水蜜嘴上嫌麻烦，却仍然把跳板放稳。远处，一轮还在整理工地记录，星巡过院门，响子的声音从后院传来，白莲则在灯下听一名陌生妖怪诉说自己的难处。\n\n这一切仍然让鵺感到不适。\n\n因为它不像她熟悉的妖怪世界。这里太愿意解释，太愿意忍耐，太愿意把本该尖锐的东西慢慢磨成可以共存的形状。可她也不得不承认，这里并没有把妖怪变成空壳。水蜜仍然阴冷，娜兹玲仍然带刺，响子仍然吵闹，白莲也没有要求她们假装自己从未危险过。\n\n命莲寺不是把妖怪洗成人类喜欢的模样。\n\n它更像是在问：妖怪能不能在不否认本质的情况下，选择一种不再只靠伤害维持自身的活法。\n\n鵺还不知道答案。\n\n所以她决定继续潜伏。\n\n她会看着白莲，看着水蜜，看着这座寺院如何处理妖怪与人类、自然与幻想、恐惧与共存之间那些永远不会干净的问题。若命莲寺失败，她会第一个笑出声；若命莲寺真的走下去，她也许会承认，这条路并非全然可笑。\n\n屋檐上的影子一晃，封兽鵺再次消失在夜色里。\n\n正体不明，仍在注视。"
 myouren.41.a:0 "让她继续看下去。"


 myouren.42.t:0 "白莲煮的晚饭"
 myouren.42.d:0 "命莲寺的晚饭，并不总是安静。\n\n白莲亲自站在灶前时，锅里的汤才刚滚起来，响子已经在门口探头三次。她说自己只是确认大家有没有需要帮忙，可那双眼睛一直盯着锅里浮起的豆腐。娜兹玲坐在角落清点米袋，嘴上说这顿饭的用料不够精确，手却已经替白莲把明日要用的干菜分好。一轮挽着袖子，认真到像在主持仪式，只是切出来的萝卜大小依旧不太一致。\n\n星负责把碗筷摆好。她摆得端正，每一双筷子都对齐得像军列。水蜜靠在门边看了一会儿，懒洋洋地说这样吃饭像上战场，结果被星认真询问是不是摆得太严肃。响子笑到差点把托盘撞翻。\n\n白莲没有责备谁。\n\n她只是把汤盛进碗里，一碗一碗递出去。饭菜并不奢华，只是热米饭、野菜、豆腐、腌物与一锅清汤。可当所有人围坐下来时，寺里那些白日里的争论、疲惫、账目与任务，好像都暂时落到了门外。\n\n娜兹玲仍会毒舌，水蜜仍会讲不合时宜的冷笑话，一轮仍会突然端正地提醒大家节制，响子仍会大声说好吃，星则会认真感谢白莲。\n\n白莲看着她们，轻轻笑了。\n\n命莲寺不是因为众人完美才像一个家。恰恰相反，是因为她们都带着麻烦、裂痕与难以处理的部分，却仍然愿意在同一张饭桌前坐下，才让这顿晚饭显得如此珍贵。"
 myouren.42.a:0 "先吃饭吧。"

 myouren.43.t:0 "命莲寺大清扫"
 myouren.43.d:0 "大清扫开始前，娜兹玲已经预感到事情不会顺利。\n\n她的预感很快成真。响子负责扫庭院，却每扫一段就忍不住把灰尘喊得飞起来；水蜜被分去擦船板，结果顺手把院里的水桶全搬走，说反正都要用水；一轮负责指挥人手，却因为太认真，把简单的扫除说得像一场动员大会。星则站在走廊前，试图让大家按顺序清理，结果被几个小妖怪缠着问宝塔能不能用来照亮柜子底下。\n\n『这不是清扫。』娜兹玲抱着账册，冷冷说道，『这是有组织的灾害。』\n\n可她还是开始分配工具。\n\n白莲没有站在旁边看。她拿起抹布，亲自擦拭佛堂的木栏。她的动作不快，却很稳。那些被手指、香灰、风雨与日常磨出的痕迹，一点点在水光下重新显出原本的纹理。\n\n大清扫并不只是让寺院变干净。它也像一次无声的整理。旧布被拆下，破损的木板被换掉，堆在角落的杂物被重新分类，没人愿意碰的重箱子由云山搬走，差点被遗忘的药草被娜兹玲骂骂咧咧地救回来。\n\n到了傍晚，命莲寺终于清亮了许多。\n\n响子累得直接坐在台阶上，水蜜说自己这辈子都不想再看见拖把，一轮认真记录下下次清扫流程，星向所有人道谢，娜兹玲则宣布如果谁明天再把仓库弄乱，她会亲自把那个人塞进旧箱子里。\n\n白莲看着干净下来的寺院，心中很安静。\n\n一座寺要能容人，也要有人愿意替它擦去灰尘。"
 myouren.43.a:0 "灰尘清掉了，心也轻了一点。"

 myouren.44.t:0 "小小祭典"
 myouren.44.d:0 "命莲寺决定举办祭典时，最兴奋的是响子。\n\n她从清晨开始就在院里跑来跑去，宣布灯笼要挂得更高，摊位要排得更热闹，唱歌的位置一定不能太偏。米斯蒂娅也被她拉来帮忙，嘴上说只是顺路，实际上已经开始试唱傍晚要用的曲子。\n\n一轮负责整体安排。她把摊位、香火、救济处、表演时间和人流路线写成密密麻麻的表格，认真得让水蜜看了就想逃。星负责守卫与秩序，她不希望祭典变成混乱，却也努力让自己的表情不要太像审查官。娜兹玲负责钱箱，理由很简单：只有她能让捐款、零钱、物资与丢失的钱袋全都回到该去的地方。\n\n白莲则在入口处迎接来客。\n\n人类来了，妖怪来了，妖精也来了。有人仍带着戒心，有人只是为了吃东西，有人想听响子唱歌，也有人只是想亲眼看看这个传闻中收留怪人的寺院到底是什么样子。\n\n祭典并不完美。灯笼有一排挂歪了，水蜜的船形摊位吓哭了两个孩子，响子唱得太用力，让一只鸟从树上掉下来。可笑声也越来越多。有人类把点心递给妖怪，有妖怪帮老人提东西，也有孩子在星的宝塔光下追着自己的影子跑。\n\n白莲看着这一切，忽然觉得，所谓共存有时并不需要被说得太高远。\n\n也许它就是在同一片灯火下，彼此还不完全理解，却已经愿意多停留一会儿。"
 myouren.44.a:0 "让灯火亮到夜里。"

 myouren.45.t:0 "白莲的夜巡"
 myouren.45.d:0 "夜深之后，命莲寺终于安静下来。\n\n祭典的灯笼已经熄了大半，白日的吵闹被风带走，只剩木廊偶尔发出的轻响。白莲披上外衣，提着灯，像往常一样沿着寺院慢慢走过。\n\n她先经过仓库。娜兹玲趴在账册旁睡着了，手边还压着一张没写完的物资表。白莲替她把灯移远，免得纸页被烤黄，又轻轻把外衣盖到她肩上。\n\n再往前，是一轮的房间。门缝里还透着一点光。白莲推门进去时，一轮正趴在桌前，旁边摊着祭典记录、工地安排和几份未写完的讲稿。她睡得并不安稳，眉头还微微皱着。白莲没有叫醒她，只把笔从她手里取出，放回砚台旁。\n\n星仍在院门巡视。白莲远远看见她挺直的背影，便没有打扰，只在星转身时轻轻点头。星也点头，像是在说一切无事。\n\n水蜜的船停在河边。她看似睡着，手却仍搭在船索上。白莲站了一会儿，确认船灯还亮着，才继续往后院走。\n\n最后是响子。她睡得最没有防备，被子踢到一旁，嘴里还含糊地哼着白天唱过的歌。白莲替她把被子拉回去，响子迷迷糊糊地叫了一声师父，又继续睡了。\n\n白莲提着灯站在廊下，望着这座安静下来的寺。\n\n这里没有完美无瑕的弟子。只有会累倒的、会逞强的、会嘴硬的、会失控的、会吵闹的妖怪。可她们都在这里，彼此照看，彼此拖住，也彼此给了这座寺继续存在的理由。"
 myouren.45.a:0 "夜里也有人守着。"

 myouren.46.t:0 "一个家的形状"
 myouren.46.d:0 "第二天清晨，命莲寺又重新热闹起来。\n\n响子第一个醒来，却找不到自己的木鱼，于是在院子里大声询问是不是被妖精偷走了。娜兹玲冷着脸从仓库出来，说她昨晚明明自己拿去当临时凳子。水蜜在旁边笑得很可疑，一轮试图维持秩序，结果被响子拉去一起找。星端着早饭经过，认真提醒大家先吃东西，白莲则站在门边，看着这一切慢慢展开。\n\n这就是命莲寺的日常。\n\n没有庄严到不近人情，也没有温柔到毫无争吵。这里会有人犯错，会有人偷懒，会有人说话太刺，也会有人把责任扛到忘记自己也会累。可当真正有人快要倒下时，总会有另一只手伸过去。有时那只手很笨拙，有时还带着抱怨，有时甚至先骂两句再帮忙，可它终究会伸过去。\n\n白莲曾经收留她们，不是因为她们已经准备好成为理想中的弟子。\n\n她收留的是一群麻烦的人。带刺的鼠，迷惘的入道使，过度自责的毘沙门天代理，阴暗的船幽灵，太过单纯的山彦，还有那些后来陆续来到寺里的异类与伤者。\n\n她们没有被这座寺变成相同的样子。\n\n她们只是学会了在同一个屋檐下，把彼此最危险、最脆弱、最不体面的部分接住一点。命莲寺因此不像纯净的圣地，更像一个真正的家：吵闹、疲惫、杂乱，却有人煮饭，有人清扫，有人守门，有人夜里替你拉好被子。\n\n白莲轻声念了一句佛号。\n\n然后，她走进院中，开始新的一天。"
 myouren.46.a:0 "这就是命莲寺。"

 myouren.47.t:0 "废墟上的新屋"
 myouren.47.d:0 "战争结束后的第一场春雨，落在幻想乡的废墟上。\n\n白莲站在高处，望着曾经被炮火、火灾与仇恨撕开的土地。那里曾有烧黑的梁柱、坍塌的墙、无人收拾的瓦砾，也有许多人类与妖怪彼此憎恨、彼此畏惧的沉默。如今，新的木架正在废墟上立起。工人把石块重新垒成墙，孩子们在未干的泥地边跑过，妖怪与人类并肩搬运木料，偶尔争吵，却没有谁因此离开。\n\n远处，被烧毁的森林也开始发出细小的新绿。焦黑的树干旁，嫩芽从湿土里钻出。鸟重新落回枝头，虫鸣在夜里慢慢恢复，溪水带走灰烬，也带回了泥土的气味。那些曾经被战争吞没的地方，并没有立刻变成净土，却已经不再只是伤口。\n\n星带着队伍巡视重建区，一轮在工地和学校之间来回奔走，娜兹玲把物资分配得一丝不苟，水蜜的船把人和建材送往远方，响子的声音在新村落间回荡，提醒大家晚饭与集会的时间。每个人都还很忙，也都还会疲惫。可这一次，她们忙碌的方向不再是活过明天，而是让明天变得更好。\n\n白莲看着这一切，心中没有胜利者的狂喜，只有一种缓慢而深重的安宁。\n\n她知道，妖怪与人类的隔阂还没有完全消失。旧怨不会因为一场胜利便沉默，恐惧也不会因为一纸新秩序便散去。可她同样知道，世界正在一点一点往好的方向走。废墟能变成房屋，焦土能长出新芽，彼此曾经举刀相向的众生，也能在同一片屋檐下学着生活。\n\n这还不是终点。\n\n但光已经落在路上。"
 myouren.47.a:0 "让这片土地重新生长。"

 myouren.48.t:0 "共存的新世界"
 myouren.48.d:0 "百年之后，当历史重新翻开那段风雨飘摇的年代时，圣白莲的名字被写在极为醒目的一页。\n\n史书没有把她描绘成没有阴影的圣人。学者们会写下她曾经的恐惧、执念与误入歧路，也会写下她如何从自私的延命之愿，走向普救众生的道路；会写下命莲寺如何收留一群带着裂痕的妖怪，又如何在战火、怀疑与世界性的动荡中，把共存从一句被嘲笑的理想，变成足以支撑新时代的秩序。\n\n而最有力的证明，并不在纪念碑上。\n\n它在学校里。教室挤满了人类与妖怪的孩子，山彦与人类学生一起朗读课文，妖精坐在窗边偷偷传纸条，年轻的天狗记录课堂讨论，河童帮忙修理投影装置。曾经互不隶属、彼此畏惧的两个种族，如今可以成为同学、同事、邻居，甚至家人。\n\n它也在城市和村落里。人类医生为妖怪看病，妖怪工匠替人类修屋；水边有人向船长的故事献花，山中的报纸仍在争论白莲时代留下的制度是否需要改革。争吵没有消失，差异没有被抹平，恐惧也并非永远不再出现。可众生已经学会，不必把彼此的存在视为威胁。\n\n在某座学校的走廊上，孩子们经过一幅旧画像。画中的白莲神情平静，身后是命莲寺的弟子们。有人问她是谁，老师便回答：她是那个相信人类与妖怪终能共同生活，并用一生证明这件事的人。\n\n窗外阳光落下，操场上传来人类与妖怪混在一起的笑声。\n\n于是，历史终于给出了答案。\n\n共存的世界，已经达成了。"
 myouren.48.a:0 "§Y感谢游玩§!"





