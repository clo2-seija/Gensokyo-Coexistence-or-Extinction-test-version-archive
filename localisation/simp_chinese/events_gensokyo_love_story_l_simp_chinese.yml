 love_story.1.t:0 "妖梦与铃仙的邂逅〈前〉"
 love_story.1.d:0 "黄昏压在人里的屋檐上。药铺里挤满等待领药的人，咳嗽声一阵接着一阵。柜台前，一名老人攥着空药袋，指节因用力而发白。\n\n戴着斗笠的行脚药贩检查完他的眼睛与脉搏，将药袋推了回去。\n\n「止痛药照旧。原先的药，从今天起停用。」\n\n老人怔住了。「为什么？我服了三个月，至少还能下床……」\n\n药贩打开木药箱。里面只剩七支封好的药瓶，每一支都贴着不同姓名。\n\n「你的肺病已经不会逆转。这七支药给你，最多多撑几天；送去东村，可以救回三名中毒的孩子。」她说得很平静，「药只有这些。我选择三个人。」\n\n老人张了张嘴，最后只挤出一句：「那我呢？」\n\n「我会给你减轻疼痛的药。」\n\n「然后等死？」\n\n「死亡不需要我的许可。」\n\n屋里骤然安静。有人低下头，有人悄悄退开，仿佛只要不看，那个决定便不会落到自己身上。\n\n门外传来刀鞘轻碰门框的声音。一名背负双剑的少女停在柜台前，白色半灵随她一同越过门槛。她先看老人，再看药箱，最后看向斗笠下那双没有动摇的红眼。\n\n「他还活着。」魂魄妖梦说。\n\n药贩答得很快：「外面那三个人也活着。」\n\n「所以你就替他决定剩下几天？」\n\n「我决定药送到哪里。至于他还能活多久，那不是我说了算。」\n\n妖梦的手落在刀鞘上，却没有拔剑。「你把人当成数字。」\n\n「至少我把他们都算进去了。」药贩抬眼看她，「只盯着眼前这个人，假装看不见另外三个，才比较像仁慈，是吗？」\n\n两人的视线隔着药箱撞在一起。妖梦没有退开。她看见药贩身后还堆着十几只没有送出的木箱，也看见墙上贴着两张被山贼劫掠的路线图。\n\n「那些药为什么还在这里？」\n\n「缺人。两条路遭到袭击，永远亭抽不出更多护卫。」\n\n「如果有人替你运送呢？」\n\n药贩微微眯眼。\n\n妖梦指向老人：「继续给他用药。我替你送完这些木箱，也替采药的人守路。空出来的人手去找新的药材，不会少那三名孩子的一份。」\n\n「你以为搬几只箱子，就能从地里长出药？」\n\n「不能。」妖梦直视她，「但我能替你省下人，也能让已经采到的药活着抵达这里。够不够，由你计算。」\n\n药贩第一次没有立刻回答。她看了看双剑，又看向少女站得笔直的双腿，像是在判断一件新工具究竟能承受多少重量。\n\n片刻后，她合上药箱。\n\n「四十天。」"


 love_story.3.t:0 "妖梦与铃仙的邂逅〈后〉"
 love_story.3.d:0 "「四十天，从卯时做到酉时。」药贩把一张空白契纸压在柜台上，「搬运、护送、夜路、遇袭后的伤员转移，做什么由我决定。迟到一次，少给一天药；擅自离开一次，这个人的药重新分给别人。」\n\n老人脸色发白。妖梦却只问：「如果药材没有找到呢？」\n\n「那就停药。」\n\n「即使我做完四十天？」\n\n「劳动不能治病。我只保证把你换来的人手送去采药，不保证山里一定长着我们需要的东西。」\n\n这句话冷得没有任何余地。妖梦按住刀鞘的手收紧了一瞬，随后松开。\n\n「可以。」\n\n药贩看着她。「想清楚。你可能做完所有事情，他还是会死。」\n\n「我知道。」\n\n「那你为什么还做？」\n\n妖梦看向坐在柜台边的老人。他的背已经弯得很低，手里仍紧紧握着那只空药袋。\n\n「因为他做不到，而我做得到。」\n\n「很差的计算。」\n\n「我不是为了得到什么才拔剑。」\n\n药贩沉默片刻，从药箱中取出三支药，放到老人面前。\n\n「三天。」她说，「不是赠送，是预支。第四天有没有药，要看她有没有准时出现在永远亭。」\n\n老人颤着手去拿。药贩没有安慰他，也没有说病情会好转，只将服药时刻与可能出现的不良反应逐条讲清。残酷得近乎无情，却没有一句谎言。\n\n随后，她重新摊开契纸，在上面写下四十日的工作、需要补回的药量，以及中止条件。最后留出一处空白。\n\n「姓名。」\n\n妖梦接过笔，落下四字：「魂魄妖梦。」\n\n药贩的目光在那四个字上停了一瞬。白玉楼的庭师，半人半灵的剑士——她显然认出了这个名字，却没有因此放宽任何条件。\n\n妖梦把笔递回去。「你的名字。」\n\n「没必要。」\n\n「你知道我是谁，我也该知道自己在替谁工作。」\n\n斗笠下的兔耳轻轻动了一下。药贩最后还是接过笔，在契纸另一端写下自己的姓名。\n\n「铃仙·优昙华院·因幡。」\n\n红印落下，两个名字被压在同一张纸上。\n\n铃仙收起契纸，语气仍旧没有温度：「明日卯时，永远亭后院。迟到，那三支药就是最后三支。」\n\n「我会早到。」\n\n妖梦拿起药，转身递给老人。临出门时，她回头看了一眼。\n\n「如果我做到了，你也必须做到。」\n\n铃仙扣上药箱。\n\n「我从不向病人承诺奇迹。」她说，「但只要还有能用的方法，我不会先停手。」"
 love_story.3.a:0 "一纸契约，两种固执"


 love_story.2.t:0 "竹影迷途〈上〉"
 love_story.2.d:0 "第二日清晨，魂魄妖梦走入迷途竹林。\n\n她以刀鞘在泥地留下记号，每三十步确认一次方向。卯时尚未到，她已经为可能出现的岔路留出充足时间。可当她踏过一片覆着青苔的软土时，脚下忽然一空，整个人连同半灵一起落进坑里。\n\n洞底不深，却挖得极其规整。妖梦抬头时，先看见一双垂下来的兔耳，接着是一张明显正在忍笑的脸。\n\n「你就是那个拿四十天替陌生人换药的剑士？」\n\n兔耳少女趴在洞口，嘴里咬着半根萝卜。「比我想的还准时。可惜走错了第三个岔口。」\n\n妖梦拍掉肩上的泥。「这是你挖的？」\n\n「当然。普通的洞怎么可能抓得到白玉楼的庭师？」少女抛下一根竹绳，「因幡帝。迷途竹林的主人之一，偶尔也负责检验永远亭的新劳工有没有脑子。」\n\n妖梦爬出坑，没有接她的玩笑。\n\n「铃仙让你来的？」\n\n「她只说今天会有一个背双剑、脸很臭、绝对不肯迟到的人进竹林。」帝笑眯眯地打量她，「洞是我自己加的。」\n\n两人沿竹径前进。帝走得忽左忽右，偶尔故意踩中一块会下沉的石板，再在机关合拢以前轻巧跳开。\n\n妖梦跟了一段，忽然问：「她经常这样做吗？」\n\n「挖洞？她没这个幽默感。」\n\n「停止别人的药。」\n\n帝咬萝卜的动作停了一下。\n\n「经常。」她答得出乎意料地干脆，「十份药摆在桌上，外面有十一个人，总得有一个空手回去。别人会躲到屏风后面，让兔子传话；铃仙会站在那个人面前，亲口告诉他。」\n\n「所以她认为自己没有错？」\n\n「她很少花时间想自己对不对。」帝耸肩，「她只看第二天死了几个。如果换一种分法能少死一个，她就换；如果不能，她下次还会做同样的事。」\n\n妖梦的神色冷了几分。「这不是把人当人。」\n\n「是啊。」帝笑意淡了一点，「她有时看谁都像一张伤情表。包括她自己。」\n\n前方出现两条完全相同的竹径。帝毫不犹豫地走向左边，又回头招手。\n\n「不过有件事挺讨厌的。要是药只剩最后一份，而她也在那十一个人里面——空手的通常是她。」"


 love_story.4.t:0 "竹影迷途〈中〉"
 love_story.4.d:0 "竹林越走越深。阳光被竹叶割成细碎的亮斑，在帝的兔耳间不断晃动。\n\n「铃仙以前在月都当兵。」帝随口说道，「那里的长官很喜欢把命令写得漂亮，等命令终于送到，前线的人已经死得差不多了。她从那里学会两件事：命令迟到会死人，犹豫太久也会死人。」\n\n妖梦问：「所以她宁可自己决定谁被放弃？」\n\n「对。」\n\n「这很傲慢。」\n\n「也很方便。」帝恢复了笑容，「大家都可以恨她，不必去恨那些根本不存在的药。」\n\n一根细竹索忽然从泥下弹起。帝伸手拽住妖梦的袖口，将她拉离原地。下一刻，一只装满泥水的竹桶从树上翻落，正好浇在她们方才经过的位置。\n\n「这个也是你挖的？」\n\n「这是昨天的我留下的惊喜。今天的我已经不负责任了。」\n\n帝带着她绕过机关，继续说道：「永远亭也不是什么慈善寺院。有人被抬进去时只剩半口气，永琳会当场剪开衣服救人；有人已经救不回来，她也会直接告诉家属准备后事。辉夜会把空房让出来，兔子们会在走廊打地铺，可没有谁会对着病床许愿。」\n\n她朝前方扬了扬萝卜。\n\n「那里的人相信一件很简单的事：只要还活着，就还能换药、换路、换一种活法。真没办法的时候，他们也不会拿好听的话继续骗人。」\n\n妖梦沉默片刻。「铃仙也是这样？」\n\n「她更糟。」帝笑道，「她连好听的话都懒得准备。」\n\n「我看得出来。」\n\n「但她不会忘记自己放弃过谁。」帝的语气忽然轻了一点，「那些名字到了晚上会排着队回来找她。所以她白天才那么冷，冷一点，手就不会抖。」\n\n妖梦没有回答。她想起昨晚铃仙把三支药放到老人面前时的神情——没有怜悯，也没有轻蔑，像是早已在心里看过许多人用同样的手接走最后几天。\n\n帝停在一块刻着兔首的小石碑前，指向右侧那条几乎看不见的窄路。\n\n「从这里直走，就是永远亭。还有一刻钟。」\n\n妖梦看她。「你不一起去？」\n\n「我属于竹林，不属于她们那些药瓶。」帝后退两步，兔耳在晨光里轻轻一晃，「不过等你工作完，我可以教你怎么绕过铃仙看不到的路。价钱很好商量。」\n\n她说完便钻进竹影，只留下一句从远处飘回来：\n\n「小心啊，庭师。铃仙昨天给你的不是机会，是一道算术题。算错的人，真的会死。」"


 love_story.5.t:0 "竹影迷途〈下〉"
 love_story.5.d:0 "永远亭的后院已经堆满木箱。\n\n药瓶、绷带与晒干的草药分别装在不同箱中，几辆运输车停在棚外，其中一辆车轮仍带着干涸的血迹。铃仙站在箱子之间，已经换回永远亭的制服。没有斗笠遮掩，那双红眼比昨夜更加锐利。\n\n她看了一眼天色。\n\n「早到十二分钟。」\n\n「路上有人带路。」\n\n铃仙的目光落在妖梦衣摆的泥土上。「帝挖的坑？」\n\n「她说是检验。」\n\n「她只是觉得有趣。」铃仙转身指向棚下，「把泥拍干净。药箱不能沾土。」\n\n妖梦没有立刻动作。她先看见角落放着一只小木盒，上面写着老人的姓名，里面整齐摆着接下来三日的药。\n\n「你准备好了。」\n\n「我计算过你会来。」\n\n「如果我没来？」\n\n「药会在午时重新分出去。」\n\n妖梦抬眼。「你甚至不肯多等半天。」\n\n「半天足够让另一名伤员恶化。」铃仙说，「别把等待说成仁慈。」\n\n她推来第一只木箱。重量不轻，箱盖上画着通往妖怪山的路线。\n\n「今天送三处。第一处是人里，第二处是山脚，第三处昨晚遭到袭击。你负责搬运与护卫。遇见伤员，可以停；遇见求你插队的人，不可以。药箱遗失一只，老人的药少一天。」\n\n「若有人倒在路上呢？」\n\n「先判断能不能移动。」\n\n「如果能？」\n\n「带回来。」\n\n「会耽误送药。」\n\n「所以你必须决定，是箱子里的人更可能活，还是路边的人更可能活。」\n\n妖梦盯着她。「你把自己的选择推给我。」\n\n「不。」铃仙将另一只木箱背到自己肩上，「我让你明白昨晚为什么不能只说一句『他还活着』。」\n\n两人之间再次安静下来。妖梦俯身抬起木箱，动作干净，却比必要的力道更重一些。\n\n「我不会变成你的算具。」\n\n「很好。」铃仙检查她肩上的绳结，「算具不会在路边临时改变主意。你会。改变以后，记得看清是谁因此没有拿到药。」\n\n妖梦把箱绳收紧。\n\n「我会把人和药都带到。」\n\n铃仙没有称赞，只推开院门。\n\n「每一个第一次来的人都这么说。」\n\n晨光越过竹林，落在满院药箱与两人背负的双剑之间。她们尚未理解彼此，也没有原谅对方。唯一已经确定的，是今天会有三处地方等着她们抵达，而那名老人第四天能否继续服药，将由这条路决定。"
 love_story.5.a:0 "工作开始了"

  love_story.6.t:0 "第一趟药路〈上〉"
 love_story.6.d:0 "院门打开后，铃仙没有给妖梦适应的时间。\n\n她从药箱里取出六只瓶子，依次放进三个木盒。其中一只治热病的药瓶被她故意放进止血药之间，标签颜色几乎相同。\n\n「封箱。」\n\n妖梦没有照做。她拿起那只药瓶，放回正确的位置。\n\n「这个放错了。」\n\n「我放的。」\n\n「那也是错。」\n\n铃仙看了她一眼，把药瓶压紧。「很好。以后我说错了，也要停手。只会服从的人不该碰药。」\n\n接下来是重量。妖梦将两只木箱扛上肩，沿窄梯送往二楼。转角处，一名药童端着新煎的汤药匆忙下楼，袖口被门钩绊住，托盘顿时倾斜。妖梦放下木箱，一手托住药碗，一手扶稳药童。几滴汤汁溅在她手背上，却没有一只碗摔碎。\n\n铃仙站在楼梯下，没有称赞。\n\n「为什么先接药？」\n\n「摔碎以后，病人没有第二碗。」\n\n「为什么不先扶人？」\n\n「他站得住。」\n\n铃仙点了一下头。「继续。」\n\n午前，三只药箱终于装车。第一处正是昨晚提到的东村，三名中毒的孩子正在等解药；第二处是人里伤兵营；第三处在妖怪山脚，昨夜才遭到袭击。\n\n妖梦握住车辕。「你也去？」\n\n「我不把药交给第一天工作的人。」\n\n「不信我？」\n\n「不信任何还没走完这条路的人。」\n\n两人一前一后离开竹林。路上没有交谈，只有车轮碾过碎石的声音。\n\n走出人里北侧不久，妖梦忽然停下。前方的草丛里躺着一名浑身是血的男人，腰间系着灰色布巾——那正是袭击永远亭药车的山贼标记。\n\n铃仙只看了一眼。\n\n「别停。东村的药必须在日落前送到。」"
 love_story.6.a:0 "道路第一次要求她们选择"


 love_story.7.t:0 "第一趟药路〈下〉"
 love_story.7.d:0 "妖梦已经走到伤者身边。\n\n男人腹部中刀，血浸透衣衫，手边还落着一把砍出缺口的短刀。他认出永远亭的药箱，下意识伸手去抓，却连抬起手臂的力气都没有。\n\n「他参与了昨晚的袭击。」铃仙说。\n\n「所以？」\n\n「所以他知道车上有药，才会躺在这条路边。」\n\n妖梦按住伤口，血立刻从指缝涌出。「他还能救。」\n\n「东村有三个孩子也能救。我们把时间耗在这里，解药就会晚到。」\n\n「把你的箱子给我。你带两箱先走，我送他去附近的诊所，再追上来。」\n\n铃仙的声音冷了下来。「两箱加起来比你想的重。若我在路上失手，两处都拿不到药。」\n\n「那你有更好的办法吗？」\n\n铃仙没有回答。妖梦已经撕下衣袖替男人压住伤口，又将自己的木箱重新绑紧。\n\n「你说过，改变决定以后，要看清谁因此没有拿到药。」妖梦抬头看她，「我不会让别人替这个选择承担。」\n\n片刻沉默后，铃仙卸下妖梦肩上的药箱，与自己的箱子绑在一起。\n\n「半个时辰。」她说，「超过半个时辰，不用追我，直接回永远亭。」\n\n「够了。」\n\n两人就此分开。铃仙独自带着两箱药赶往东村，妖梦则背起伤者，沿支路奔向最近的诊所。\n\n太阳落山时，三名孩子都服下了解药。妖梦也在最后一缕天光消失前回到永远亭，肩头沾满伤者的血。\n\n那个山贼躺在侧院，由铃仙亲手缝合腹部的伤口。他醒来以后认出了她，惊恐地向床角缩去。\n\n「别动。」铃仙按住他，「线会裂。」\n\n妖梦站在门口。「你还是救了他。」\n\n「因为你把他带回来了。」\n\n「他抢过你的药。」\n\n「这不会让他的血自己流回身体。」\n\n铃仙剪断缝线，洗净双手，又从柜中取出一支药瓶交给妖梦。瓶上写着那名老人的姓名。\n\n「第四天。」\n\n妖梦接过药，却没有立刻离开。\n\n「今天没有人因为我停下来而死。」\n\n「这次没有。」铃仙看着她，「别因此以为每一次都能两边保住。」\n\n「我会尽量。」\n\n「尽量不是保证。」\n\n「但比一开始就放弃好。」\n\n铃仙没有反驳。她转身去照看那个曾经抢过自己药物的人，妖梦则将第四天的药收进怀中。她们仍不赞同彼此，却已经知道，对方真的会背起自己做出的选择。"
 love_story.7.a:0 "第一天，没有人被遗弃"


 love_story.8.t:0 "失窃的夜露〈上〉"
 love_story.8.d:0 "第十一日夜里，药库少了两瓶夜露。\n\n铃仙重新清点木架，确认封口没有破损，随即熄灭外院灯火，只留下药库门前的一盏。妖梦守住侧门。不到一刻钟，一名年幼的兔妖从柴房后走出，怀里紧紧抱着那两只药瓶。\n\n铃仙伸出手。\n\n「拿来。」\n\n药童没有动。「奶奶最近看不见路。她昨晚摔下台阶，额头都是血……我只想让她先用一次，明天就把瓶子放回来。」\n\n「用过的药放不回来。」\n\n「她只是想看见东西！」\n\n「明天也有两个人等着这两瓶药。」铃仙的声音毫无起伏，「你拿走的时候，有没有想过他们今晚会不会发病？」\n\n药童的眼泪落在瓶盖上，却仍不肯松手。\n\n妖梦走近一步。「先去看他的奶奶。」\n\n「先把药放回去。」\n\n「如果她今晚再次跌倒呢？」\n\n铃仙看向妖梦。「如果我们把药给她，明天等待服药的人怎么办？」\n\n「看过她再决定。」\n\n「又是你的尽量两边保住？」\n\n「是。」\n\n铃仙沉默片刻，从药童怀中抽出一瓶，另一瓶仍留在他手里。\n\n「带路。」\n\n药童愣住了。\n\n「我还没有答应给她用。」铃仙提起药箱，「在确定病因以前，你连自己偷走的是什么都不知道。」\n\n三人沿兽道走入夜色。药童走得很快，几次差点被树根绊倒。妖梦扶了他一次，铃仙则始终没有催促，只在经过岔路时提醒方向。\n\n竹林尽头，一间低矮木屋亮着昏黄的灯。门槛旁留有已经干涸的血迹，一名老妇人坐在床沿，正伸手摸索不远处的水碗。\n\n铃仙放下药箱，走到她面前。\n\n「抬头。看着灯。」"
 love_story.8.a:0 "先看清病人，再决定药属于谁"


 love_story.9.t:0 "失窃的夜露〈下〉"
 love_story.9.d:0 "铃仙检查老妇人的眼睛，又让妖梦把油灯从左侧移到右侧。\n\n老妇人能看见火光，却分辨不出门槛与地面的高低。铃仙从药箱中取出一小片透明镜片，放在她眼前逐一调整。\n\n「夜露只能暂时缓解，不会治好。」她说，「连续服用还会让眼睛更怕光。你偷两瓶回来，只会让她几天以后摔得更重。」\n\n药童低下头。「我不知道……」\n\n「所以药不能由你决定。」\n\n铃仙最终只从瓶中取出少量药液，替老妇人处理眼部发炎。随后，她让妖梦削低门槛，又将油灯移到老妇人最容易看见的位置。药童则被命令在墙边钉上一条扶手。\n\n忙完以后，老妇人扶着墙走了两次。她仍看不清妖梦与铃仙的脸，却已经能独自跨过门槛。\n\n铃仙收回剩余药物。「明日到永远亭工作十天。你从药库偷走多少时间，就用多少时间补回来。」\n\n药童用力点头。\n\n「不会公开处罚吗？」妖梦在回程路上问。\n\n「我需要他学会判断，不需要所有人看着他受辱。」\n\n「你也没有把两瓶药全拿回去。」\n\n「用掉的那一点不是给他的。」\n\n「我知道。」妖梦看着前方，「是给病人的。」\n\n铃仙侧过脸。「这不是值得称赞的事。」\n\n「我也没有称赞你。」\n\n两人继续往前。走出一段后，妖梦又说：「但你今天没有先计算谁应该被放弃。」\n\n「我计算过。」\n\n「结果呢？」\n\n「一瓶药被错误使用的风险，两名病人明日缺药的风险，一个老妇人今晚再次跌倒的风险。」铃仙顿了一下，「最后发现，真正需要改变的不是药量，是她的门槛。」\n\n妖梦轻轻点头。\n\n她终于开始明白，铃仙的冷酷并不总是为了拒绝谁。有时，那只是她不肯用一句安慰掩盖真正的问题。\n\n而铃仙也第一次发现，妖梦坚持走到病人面前，并不只是心软。只要亲眼看见，她往往能找到纸面上不存在的答案。"
 love_story.9.a:0 "她们仍会争执，却开始愿意一起去看"


 love_story.10.t:0 "三处药路〈上〉"
 love_story.10.d:0 "第二十三日，永远亭终于收到新药所需的两种材料。\n\n地灵殿答应提供旧地狱的赤砂，妖怪山则采到了生长在高崖上的月见草。只要两样东西都能在今日送回，永琳便能配出下一批药，其中也包括老人需要的份量。\n\n铃仙与妖梦带着三只木箱出发。第一站是慧音的学堂。前几日的热病尚未完全消退，教室里躺着十几名孩子，藤原妹红正在院外煮水。\n\n一名母亲见到药箱，立刻冲上来抓住妖梦的衣袖。\n\n「先救我的孩子！她昨夜一直发热！」\n\n其他人随即围拢。铃仙没有提高声音，只打开第一只箱子。\n\n「重症在左，已经服过药的在右。没有诊断的人排到门外。」\n\n没人听她。妖梦拔出楼观剑半寸，又将刀推回鞘内。刀锋露出的冷光已经足够让人群安静。\n\n「照她说的站。」\n\n队伍很快分开。铃仙逐一检查病情，妖梦负责记住每个孩子的症状。那名最先冲上来的母亲最终排在第三位；铃仙没有因为她哭得更大声便改变次序，也没有因为她失礼而延后。\n\n药物全部发完后，慧音送她们到门外。\n\n「你们处理得比上次快。」\n\n铃仙说：「她让人群安静。」\n\n妖梦则说：「她没有因为那位母亲抢药便报复。」\n\n慧音看了两人一眼，笑意很浅。「听起来，你们已经知道该看对方哪里了。」\n\n下一段路通往旧地狱。废井中的热风迎面涌上来，妖梦背起空箱率先下去。铃仙没有再提醒她应该走哪一步，只将绳索另一端交进她手中。"
 love_story.10.a:0 "第二十三日，她们已不必解释每一个动作"


 love_story.11.t:0 "三处药路〈中〉"
 love_story.11.d:0 "地灵殿的石廊比地面闷热得多。火焰猫燐已经将赤砂装进铁盒，正蹲在门前等她们。\n\n「来得正好。」燐把铁盒推过来，「山壁刚才塌了一段，再晚一点，你们就得从熔炉旁边绕路了。」\n\n铃仙检查封口，妖梦则抬头看向不断落下碎石的廊顶。\n\n古明地觉从殿内走出。她的第三只眼先看向妖梦，又移向铃仙。\n\n「很奇怪。」觉说，「你们仍然认为对方的做法有问题，却都默认危险出现时，她不会抛下自己。」\n\n妖梦没有回答。铃仙把铁盒扣紧。「读心不会让道路恢复。」\n\n「当然不会。」觉微笑，「所以我只是提醒你们，出口快塌了。」\n\n话音刚落，远处传来一声沉闷巨响。石廊的一侧开始崩落，出口被碎石切去大半。燐立刻招来几只火焰猫搬运铁盒，妖梦则拔出楼观剑，斩断即将倒下的石柱。铃仙没有后退，她冲到被碎石压住的地底妖怪身边，跪下检查伤势。\n\n「右腿骨折，没有大出血。妖梦，撑住上面。」\n\n妖梦以刀背抵住倾斜石梁。「多久？」\n\n「给我三分钟。」\n\n「只有两分钟。」\n\n「那就两分钟。」\n\n铃仙固定伤腿，燐拖走伤者。最后一只铁盒被送过缺口时，妖梦才收刀跃出。身后的石梁随即倒下，尘土涌满整条通道。\n\n回到安全处后，铃仙发现妖梦手臂被碎石划开一道伤口。她直接撕开袖口替她清洗。\n\n「小伤。」妖梦说。\n\n「感染以后就不是。」\n\n「药材没丢。」\n\n「你也不该丢。」\n\n这句话出口后，铃仙自己先停了一瞬。妖梦看着她，没有像往常一样争辩，只把手臂安静地交给她包扎。\n\n觉站在远处，将这一幕收入眼底，却没有再说破任何事情。"
 love_story.11.a:0 "有些信任不必说出口"


 love_story.12.t:0 "三处药路〈下〉"
 love_story.12.d:0 "离开旧地狱后，她们赶往妖怪山。\n\n山脚的桥在昨夜风雨中断了一半。犬走椛守在对岸，月见草就装在她身旁的竹篓里。桥下水势很急，普通运输车无法通过。\n\n铃仙望向天色。「绕路要两个时辰。」\n\n「药材等不了。」妖梦解下腰间绳索。\n\n她将一端固定在树上，另一端交给铃仙。妖梦先沿残桥越过断口，再由椛接住绳索。铃仙把赤砂铁盒绑在身前，踩着仅剩的桥梁缓慢前进。\n\n走到中央时，一块木板突然断裂。铃仙脚下一空，整个人向水面坠去。妖梦猛地收紧绳索，手掌被粗绳磨出鲜血。铃仙在半空稳住身体，没有呼喊，只将怀里的铁盒向上托起。\n\n「先接药材！」\n\n「先抓住我的手！」\n\n妖梦俯身握住她的手腕，椛则从另一侧拉紧绳索。三人合力将铃仙拖上桥面，铁盒仍牢牢扣在她怀中。\n\n铃仙坐起后第一件事便是检查封口。妖梦按住她的手。\n\n「你没有受伤？」\n\n「没有。」\n\n「那再看药。」\n\n铃仙看了她一眼，没有反驳。\n\n月见草与赤砂在入夜前送回永远亭。永琳取出少量材料检验，很快给出结论：「可以配出二十七份。」\n\n妖梦看向铃仙。「那个老人呢？」\n\n「够他再服一个月。」\n\n「所以我做到了。」\n\n「我们做到了。」铃仙纠正她，「采药的兔子、地灵殿、白狼天狗，还有你。少一处都不够。」\n\n妖梦没有争辩。这一次，她已经明白药箱之外还有多少双手。\n\n四十日契约仍未结束，但最初被判定只剩三天药的老人，如今已经能扶着门框走到屋外。\n\n离开永远亭时，竹林边亮起一盏暖黄的灯。烤鱼与米酒的香气从夜雀食堂飘来。妖梦停下脚步，铃仙也难得没有催她继续赶路。\n\n「坐一会儿？」妖梦问。\n\n铃仙望了一眼身后的药箱。\n\n「今天可以。」"
 love_story.12.a:0 "今晚不必再与时间赛跑"


 love_story.13.t:0 "竹灯小席〈上〉"
 love_story.13.d:0 "夜雀食堂只摆了几张矮桌。米斯蒂娅正在炉边烤鳗鱼，莉格露则将装着萤火虫的玻璃瓶挂上屋檐。\n\n「永远亭的冷面兔子居然会来喝酒？」米斯蒂娅看见铃仙，立刻笑起来，「旁边还带着白玉楼的剑士。今天的月亮是不是从地底升起来的？」\n\n「一壶米酒，两碗热汤。」铃仙放下药箱，「酒不要太烈。」\n\n妖梦看她。「你替我决定？」\n\n「你明日还要搬药。」\n\n「契约是我的。」\n\n「宿醉也是你的。」\n\n米斯蒂娅忍着笑把酒送上来。莉格露则在两人脚边放下一盏萤灯，顺便看了看妖梦包扎着的手臂。\n\n「今天又遇到麻烦了？」\n\n「桥断了。」妖梦说。\n\n「她差点掉进河里。」\n\n「药材没有掉。」铃仙补充。\n\n妖梦皱眉。「我先抓的是你。」\n\n「我知道。」\n\n这句回答太过直接，反而让妖梦一时不知道该接什么。她低头喝汤，米斯蒂娅却已经露出发现趣事的神情。\n\n酒过半杯，妖梦主动提起最初那场争执。\n\n「我仍然觉得你很冷。」\n\n「我知道。」\n\n「你会当着病人的面告诉他，药要给别人。」\n\n「我也会告诉他为什么。」\n\n「这不能让事情变得好受。」\n\n「但至少不会让他等一个不存在的奇迹。」\n\n妖梦轻轻转动酒杯。「以前我以为，你只是擅长放弃。」\n\n铃仙的兔耳微微压低。\n\n「现在呢？」\n\n「现在我知道，你每次放弃一个人，都会记得自己做过什么。」妖梦抬眼，「所以你才把自己排在最后。」\n\n铃仙沉默很久，才拿起酒杯。\n\n「我以前也认为你只会冲向眼前的人。」\n\n「现在呢？」\n\n「你会把自己填进缺口，不要求别人替你承担。」\n\n两只酒杯轻轻碰在一起。她们没有道歉，也没有说谁改变了谁。那场始于七支药的争执依旧存在，只是不再隔绝她们。"
 love_story.13.a:0 "她们终于谈起最初的争执"


 love_story.14.t:0 "竹灯小席〈中〉"
 love_story.14.d:0 "第二杯酒下肚后，妖梦的话明显多了。\n\n她谈起白玉楼的冬天，谈起扫不完的雪，也谈起幽幽子总能在她最忙时若无其事地要求加一碗饭。\n\n「你为什么一直留在那里？」铃仙问。\n\n「因为亡者不会总是自己找到归处。」妖梦回答，「有人死得太快，连最后想说什么都不知道；有人被活着的人抓住，不肯离开。我守护幽幽子大人，也阻止任何人把他们当成工具。」\n\n铃仙看着杯中酒液。「即使那名亡者能救活别人？」\n\n妖梦没有立即回答。\n\n「即使如此，也该先问他愿不愿意。」\n\n「死人不会回答每一个问题。」\n\n「那也不表示活人可以替他们回答。」\n\n短暂的分歧让桌上安静下来。米斯蒂娅没有靠近，莉格露也提着萤灯走去了另一边。\n\n妖梦反问：「你为什么跟随永琳？」\n\n「因为她救过我。」\n\n铃仙说得很平淡，手指却没有再碰酒杯。\n\n「我从月都逃下来时，身上有伤，也没有资格要求任何人收留。她没有问我值不值得，只叫我躺下，然后把伤口处理好。」\n\n「所以你也想救别人。」\n\n「我只是不想再看见有人因为命令、迟疑或者一句漂亮话死在面前。」\n\n妖梦望着她。那一刻，她第一次看见铃仙的冷淡并非空无一物，而是把许多不愿再想起的事情压在了下面。\n\n「我喜欢你这一点。」妖梦说。\n\n铃仙抬起眼。「哪一点？」\n\n「你不拿谎话安慰人。」\n\n「这通常不讨人喜欢。」\n\n「我没有问别人。」\n\n铃仙的耳朵动了一下。她拿起水壶，替妖梦换掉面前的酒。\n\n「你醉了。」\n\n「没有。」\n\n「你刚才说喜欢我。」\n\n妖梦停了一下，随后直视她。\n\n「我记得。」"
 love_story.14.a:0 "这句话不会随着酒意消失"


 love_story.15.t:0 "竹灯小席〈下〉"
 love_story.15.d:0 "离开食堂时，莉格露借给她们一盏萤灯。竹林里的道路被淡绿色微光照亮，米斯蒂娅的歌声则渐渐留在身后。\n\n妖梦走得比平日慢了一些。经过一段湿滑的石阶时，她脚下偏了半步，铃仙伸手扶住她的手臂。\n\n「我没醉。」妖梦说。\n\n「我没问。」\n\n铃仙没有立刻松手。两人沿石阶走完一段，她才将手移开，又把自己的披巾递给妖梦。\n\n「夜里冷。」\n\n「你呢？」\n\n「我习惯了。」\n\n妖梦接过披巾，没有说以后会归还。她只是将一侧留在铃仙肩上，两个人共用同一块布继续前进。\n\n走到竹林岔口时，妖梦忽然问：「四十天以后呢？」\n\n「契约结束。老人已经有新的药，你也不必再来。」\n\n「我不是问契约。」\n\n铃仙停下脚步。\n\n萤火在玻璃瓶中缓慢浮动，将她们的影子照在竹叶之间。妖梦没有重复那句话，也没有借酒意再说一次喜欢。\n\n铃仙沉默许久，最终指向通往永远亭的道路。\n\n「四十天以后，这条路不会消失。」\n\n这不是承诺，也没有回答她们将成为什么。可妖梦听懂了。\n\n「白玉楼的路也不会。」\n\n两人继续往前。这一次没有谁走在另一人身后。她们肩并着肩，共用一件披巾，偶尔因为道路过窄而碰到手臂，又谁都没有刻意避开。\n\n最初那张契纸仍压在永远亭的柜中，上面写着迟到、药量与四十日的工作。没有任何一行提及今日的酒、借出的披巾，或者两条原本毫无关系的道路将在哪里相遇。\n\n这些事情不需要写进契约。"
 love_story.15.a:0 "四十日以后，道路仍会存在"


 love_story.16.t:0 "雪庭问花〈上〉"
 love_story.16.d:0 "四十日将满时，永琳交给铃仙一只空药瓶。\n\n瓶中要装的并非普通药材，而是白玉楼深处的「回魂断花」。战争结束以后，一些幸存者身体已经痊愈，魂魄却仍在逐渐松散；他们会在夜里重回战场，醒来后认不出亲人，最后连自己的姓名也会忘记。\n\n永琳发现，回魂断花上的晨露能够暂时稳住这种症状。\n\n妖梦亲自带铃仙进入白玉楼。雪覆盖庭院，远处生长着一片颜色近乎透明的花。幽幽子坐在长廊下，听完来意后，仍旧带着淡淡笑意。\n\n「你们想从这里带走多少？」\n\n「两瓶晨露，不拔花，不伤根。」铃仙回答，「足够确认药效。」\n\n「这些花由战死者未能说完的话长成。」幽幽子望向花田，「每取走一部分，那些话便可能永远消失。妳准备拿谁的遗憾去医治活人？」\n\n「如果两瓶晨露能救人，我会取。」\n\n妖梦立即看向她。\n\n铃仙没有回避那道目光。「我会先寻找没有魂魄依附的花。若来不及，而病人正在恶化，我仍会选择活着的人。」\n\n幽幽子轻轻放下茶杯。\n\n「即使死者没有答应？」\n\n「死者不会因为我保持双手干净，就重新活过来。」\n\n妖梦的手按上白楼剑。「也不能因为他们已经死了，就把他们留下的东西拿走。」\n\n「那还在永远亭等药的人呢？」铃仙转向她，「告诉他们，因为这里的亡者无法回答，所以他们必须继续失去自己？」\n\n两人的声音都没有提高，却第一次真正站到了彼此的对面。\n\n幽幽子没有制止。她只抬扇指向那片花田。\n\n「去看看吧。看过以后，再告诉我你们各自愿意带走什么。」"
 love_story.16.a:0 "这一次，她们必须面对彼此的答案"


 love_story.17.t:0 "雪庭问花〈中〉"
 love_story.17.d:0 "花田里没有风，花瓣却不断轻颤。\n\n妖梦告诉铃仙，每一株回魂断花都依附着一段未竟之事。有人没能回到故乡，有人来不及道歉，还有人在临死前仍反复念着亲人的名字。\n\n铃仙蹲在一株花前。花蕊间凝着一滴晨露，透明得与普通水珠没有差别。她刚取出药瓶，妖梦便握住了她的手腕。\n\n「这一株有人。」\n\n「我看不见。」\n\n「看不见，不等于不存在。」\n\n「永远亭里的病人也不在这里。」铃仙抬眼看她，「他们同样存在。」\n\n妖梦没有松手。「亡者不是备用药材。」\n\n「活人也不该因为我们害怕触碰死亡，就被留在病床上。」\n\n「这是害怕吗？」\n\n「对我而言，是。」铃仙答得很快，「害怕做出选择以后，被留下的人怨恨。害怕承认救不了所有人。于是把什么都不做说成尊重。」\n\n妖梦的手指收紧了一瞬。\n\n「我是一半人、一半灵。」她说，「我见过活人当着亡魂的面分走遗物、修改遗言，把一个仍有意识的存在说成已经结束。你害怕来不及救人，我害怕有人死过一次以后，又被世界抹去第二次。」\n\n铃仙望向整片花田。她第一次没有把那些花视为等待装瓶的材料。\n\n「月都撤退时，我也留下过人。」她低声说道，「我不知道他们最后说了什么。直到现在，我仍会想，如果他们留下的东西能救人，我有没有资格拿走。」\n\n「我不能替他们回答。」\n\n「我知道。」\n\n「但我也不能要求你忘记仍在等药的人。」\n\n铃仙看向妖梦。她们依旧没有得到同一个结论，可争执中的锋利已经发生变化。妖梦终于看见铃仙每一次选择生者时，身后都跟着曾被她留下的人；铃仙也终于明白，妖梦守护亡者不是沉迷过去，而是不允许任何生命在失去声音后便失去尊严。\n\n这时，那株花中传来极轻的一句话。\n\n「请……告诉他……回家。」"
 love_story.17.a:0 "她们没有认同，却终于听懂了"


 love_story.18.t:0 "雪庭问花〈下〉"
 love_story.18.d:0 "依附在花中的亡魂是一名年轻士兵。\n\n他在战争最后几日死于山道，弟弟则被送往永远亭。活着的人身体已经痊愈，魂魄却始终停留在两人失散的那一晚。\n\n「他就是等待回魂断花的人之一。」铃仙认出了病历中的描述。\n\n妖梦跪在花前，让亡魂把未能说完的话重复了一遍。那句话很短：战争已经结束，不必再回头找他，回家去。\n\n铃仙没有取出药瓶。她先将那句话完整记住，随后问道：「你的弟弟需要这滴晨露。你愿意把它留给他吗？」\n\n花瓣轻轻合拢。依附其上的魂火从花蕊升起，在妖梦掌中停留片刻，最终飞向白玉楼深处。\n\n魂火离开以后，那滴晨露自行滑落。妖梦以白布接住，将它交给铃仙。\n\n「现在可以。」\n\n铃仙没有立刻收下。「因为他答应了？」\n\n「因为这是他留下的，不是我们夺走的。」\n\n两人带着晨露回到长廊。幽幽子听完经过，允许永远亭继续进入花田，但提出三个条件：不摘花，不惊扰不愿现身的亡魂，只有在遗愿得到回应后自行落下的晨露可以带走。\n\n铃仙接受了。\n\n离开以前，妖梦问她：「如果病人已经等不下去，而亡者仍然没有回答，你还会取吗？」\n\n「会。」铃仙没有说谎，「我会先救人，然后记住自己拿走了什么。」\n\n妖梦垂下眼。「我还是会阻止你。」\n\n「我知道。」\n\n「你不生气？」\n\n「会。但我现在知道，你不是为了妨碍活人。」\n\n妖梦看着她。「我也知道，你不是因为轻视死者。」\n\n她们仍站在不同的位置。妖梦相信死亡不能夺走选择的权利；铃仙相信尚能挽回的生命不该因迟疑而消失。没有谁被说服，也没有哪一种答案从此胜过另一种。\n\n可当她们一同走出白玉楼时，铃仙将装有晨露的药瓶交给妖梦保管，妖梦则接过铃仙肩上的药箱。\n\n一人守住亡者留下的意愿，一人赶回去救仍在等待的人。她们第一次明白，这两条路为何不同，也第一次愿意让对方与自己同行。"
 love_story.18.a:0 "她们没有站到同一边，却终于看清了彼此"

 love_story.19.t:"难得无事的一天"

 love_story.19.d:"从白玉楼回来数日后，妖梦按约来到人里。铃仙已经坐在街口的面摊前，桌上摆着两碗刚端来的汤面。\n\n「我没有迟到吧？」\n\n「没有。坐下，趁热吃。」\n\n妖梦才拿起筷子，便看见对面有人朝这里走来。风见幽香抱着一只盖有黑布的花盆，在永远亭的送药车旁停下。几名妖兔正在卸货，其中一只刚准备回去报信，便被幽香抬手拦住。\n\n「不必去了。我要找的人已经来了。」\n\n幽香走到桌边，掀开黑布一角。盆中的花并未枯萎，花瓣却只剩近乎透明的白色，叶缘还沾着一层细小银尘。\n\n「它每天都能重新开花，到了日出却会失去颜色，连前一日留下的香气也会消失。」幽香重新盖好黑布，「我能让花继续生长，却找不到藏在里面的东西。那股气息来自月亮，所以我要见八意永琳。」\n\n铃仙没有伸手触碰花盆，只回头叫住仍在搬运药箱的妖兔。\n\n「先把手上的箱子放下，带风见幽香走东侧竹径。到了永远亭，直接通报师匠，不要把花交给其他人。」\n\n妖兔看了一眼尚未卸完的货物：「这里怎么办？」\n\n「下一队会来处理。先带路。」\n\n幽香微微颔首，将黑布压紧了一些：「永琳只需替我找出病因。之后该怎样让它重新开花，还是我的事。」\n\n她跟着妖兔离开。妖梦望向竹林的方向，又看了看铃仙。\n\n「真的不用一起回去？」\n\n「师匠若需要我，自然会让她们来叫。」铃仙把已经有些凉的汤面推回妖梦面前，「现在先吃。再放下去，面就要泡烂了。」\n\n妖梦低头尝了一口，随即加快了动作。铃仙终于拿起自己的筷子。\n\n午后的街道仍旧喧闹。送药车继续卸货，摊主继续招呼客人，方才的小插曲很快便淹没在人声里。"

 love_story.19.a:"先把这碗面吃完。"


  love_story.20.t:"人里有点太热闹"

 love_story.20.d:"两碗汤面快要见底时，街口忽然传来一阵叫喊。\n\n琪露诺举着一只冰兔子，宣称这是人里唯一永远不会融化的冰雕。克劳恩皮丝抱着包严的火把，当场表示只要让她点一次，马上就能证明那东西根本没有什么了不起。\n\n「要点火就等出了人里。」赫卡提亚按住克劳恩皮丝的帽子，「你要是把整条街弄疯，最后收到账单的还是我。」\n\n琪露诺听见对方不准点火，立刻将这当成自己的胜利，举着冰雕追了上去。两只妖精绕着面摊跑了一圈，险些撞上端汤的伙计。妖梦伸手扶住托盘，铃仙则把桌上的药包及时收进袖中。\n\n斜对面的告示牌上，鬼人正邪正枕着双手看热闹。「严禁攀爬」四个字已经被她翻得上下颠倒。\n\n「地狱的女神也得替人看孩子？」她笑道，「看来你混得不怎么样。」\n\n赫卡提亚原本没有理会，经过告示牌下方时却忽然停住。她抬起头，目光在正邪的脸与额角之间来回看了片刻。\n\n正邪被看得有些不耐烦：「怎么，月都现在也把通缉令送到地狱了？」\n\n「不是通缉。」赫卡提亚说道，「我以前见过你。」\n\n正邪仍然笑着，身体却慢慢坐直。\n\n赫卡提亚接着说道：「在月都。那时你还很小。」"

 love_story.20.a:"正邪没有立刻反驳。"


 love_story.21.t:"她不记得"

 love_story.21.d:"「你认错人了。」\n\n正邪从告示牌上一跃而下，回答得干脆。她拍了拍披肩上的灰，仿佛只要动作足够随意，刚才那句话便不值得追问。\n\n赫卡提亚却没有改口：「我的身体分在三处，记忆只有一份。看见你的是月面上的我，记得你的仍然是我。」\n\n她回想了一会儿：「白色长廊，纯化院外。探女牵着一个长角的孩子。守卫让那孩子向前走，她偏要倒着退，险些撞上后面的墙。」\n\n正邪嗤笑一声：「听起来月都有不少讨人厌的小鬼。」\n\n「但只有那一次，整排月兔突然忘了自己为何守在那里。探女就这样带着你，从他们面前走了过去。」\n\n听见纯化院三个字，铃仙的耳朵微微向后收拢。正邪立刻看向她。\n\n「那是什么地方？」\n\n铃仙沉默片刻才回答：「审查不符合纯化标准的人。有些人会被留下，有些不会。」\n\n「你在那里见过我？」\n\n「没有。我离开月都以前，从未听说那里有一个长角的孩子。」\n\n妖梦问道：「你最早能够记起的事情是什么？」\n\n正邪脸上的笑淡了些。\n\n「地上的一条烂沟。我醒来时满身是泥，身边什么也没有。」她扯了扯披肩，「再往前，一片空白。以前我只当自己忘了，没想过可能是有人替我忘的。」\n\n她重新望向赫卡提亚：「为什么现在才说？」\n\n「因为我今天才认出你。」赫卡提亚回答得很平常，「我原以为你一直记得。」\n\n克劳恩皮丝已经在远处喊她。赫卡提亚没有继续追问，只在离开前说了一句：「探女很少亲自牵着谁走路。我记得这件事，就是因为那不像她。」\n\n正邪站在原地，直到赫卡提亚走远，才转向铃仙。\n\n「永远亭里有没有月都留下的资料？」\n\n「有一些。」\n\n「很好。」\n\n她转身离开。妖梦望着她的背影，低声说道：「她刚才那个『很好』，听起来不太好。」\n\n铃仙叹了口气：「因为绝对不是。」"

 love_story.21.a:"她终于有了可以追查的方向。"


 love_story.22.t:"被撕掉的第一页"

 love_story.22.d:"正邪没有立刻闯进永远亭。第二天一早，她先去了妖怪山的旧报库，把一张写有自己名字的纸拍在姬海棠果面前。\n\n「替我找出这个名字第一次出现在地上的时间。」\n\n果扫了一眼那张纸：「求人帮忙的时候，至少该把字写正。」\n\n抱怨归抱怨，她还是打开了积满灰尘的旧柜。两人翻过早年的报纸、通缉告示与人里警备记录。关于鬼人正邪的记载不少，却都从她已经能够独自行走以后开始。没有出生，没有亲属，也没有谁见过她更年幼的模样。\n\n直到下午，果才在一卷未整理的旧底片中找出一张照片。\n\n照片拍摄于人里东侧。破旧的小祠下缩着一个长角的孩子，衣服沾满泥水，怀里抱着一只已经空掉的布包。面孔被雨水与阴影遮住，角的位置却与正邪几乎相同。\n\n「这个是你吗？」果问。\n\n「角长成这样，很难推给别人。」\n\n照片原本附在一份询问记录后面，那一页却已经被整齐割去。装订线旁只剩一行移交说明：随身物件及相关记录，送交永远亭代存。\n\n果重新冲洗了照片，将布包上的图案放大。银色织纹之间藏着一个极小的圆形印记，看起来不像地上的文字。\n\n当天傍晚，正邪拿着照片堵住了准备送妖梦离开竹林的铃仙。\n\n铃仙只看了一眼，神情便认真起来：「这是月都用过的封闭转送印。后来已经废除了。」\n\n「永远亭有没有对应的记录？」\n\n「师匠保存了一部分旧索引。有没有这一份，我不能保证。」\n\n正邪收回照片：「带我进去。」\n\n妖梦看了看她：「从正门？」\n\n「你们为什么都这么在意那扇门？」\n\n「因为你若先开口要求，她们至少必须亲口回答。」妖梦说道，「若一开始就闯进去，你只会得到守卫的回答。」\n\n正邪盯着她看了片刻，最后把照片塞回袖中。\n\n「好。那就先看看正门后面有什么。」"

 love_story.22.a:"三人一同走进竹林。"


  love_story.23.t:"正门之后"

 love_story.23.d:"正邪果真从永远亭正门走了进去。她没有碰药柜，也没有擅自打开任何房间，只把照片放到八意永琳面前。\n\n「我要这份记录。」\n\n永琳将照片移到灯下，先查看布包外侧的圆形印记，又仔细辨认藏在银纹中央的缺月图案。随后，她取来两册旧索引，逐页核对上面的编号。\n\n过了一会儿，永琳合上索引。\n\n「没有对应记录。」\n\n正邪脸上的笑意立即冷了几分：「你连这种谎都懒得编得像一点？」\n\n「这套转送编号是在我离开月都以后启用的。」永琳将照片转向她，「如果照片里的孩子出生于那之后，她不可能出现在我带到地上的旧档里。」\n\n「所以永远亭什么也不知道。」\n\n「关于这个孩子，没有。」\n\n永琳的手指落在银纹中央：「但这个内印属于稀神探女。外层的转送格式很新，中央的个人印记却与她早年的用印完全相同。」\n\n正邪盯着那个几乎看不清的缺月图案：「你有她的记录。」\n\n「只有我离开月都以前的旧档。里面记载了她的职权、能力及几次异常处置，不会出现你的名字。」\n\n「拿来。」\n\n「原卷还涉及月都旧有的防卫部署，以及一些已经离开月都的人。」永琳说道，「我会找出与个人印记和能力有关的部分。子时以前，你可以亲自核对。」\n\n妖梦点头：「我留在这里陪你等。」\n\n正邪却没有坐下。\n\n「先告诉我没有我的记录，再替我挑选哪些探女记录可以看。」她拿回照片，「月都替我决定该忘记什么，你们替我决定该看见什么。倒是很有默契。」\n\n铃仙挡在内院入口前：「那不是你的档案。」\n\n「可它是我现在唯一找到的线索。」\n\n两人互不退让。片刻后，正邪转身向门外走去。\n\n妖梦叫住她：「不等了吗？」\n\n「我最不擅长的就是等。」正邪回头笑了一下，「放心，我今晚绝不会再走正门。」"

 love_story.23.a:"永远亭没有她的记录。"


 love_story.24.t:"把永远亭翻过来"

 love_story.24.d:"午夜以前，永远亭的屋檐忽然落到了庭院下方。\n\n正邪没有撬锁。她颠倒上下，踏着横梁越过院墙，又将两条回廊的方向互换，让赶来的妖兔全数扑向错误的院落。\n\n铃仙早已守在藏室外。几发弹幕擦过柱脚，在真正的地面留下明亮的弹痕。妖梦则不再理会倾斜的墙壁，只跟着半灵确认距离。\n\n正邪把长廊翻向左侧，妖梦便用刀鞘顶住迎面压来的门框；她又让飞来的弹幕原路倒返，铃仙立刻击碎两道弹线交会的位置。三人一路打到藏室前，没有谁下杀手，也没有谁愿意先让开。\n\n正邪握住一格抽屉的铜环。铃仙的枪口随即停在她的手腕前。\n\n「放开。」\n\n「稀神探女的档案就在里面？」\n\n「在。但那卷记录结束于你出生以前。」\n\n「那就让我看看，在我出现以前，她已经做过什么。」\n\n铃仙没有让开：「里面还有月都旧防线、出走者名单与永远亭的位置记录。那些与你无关。」\n\n正邪握紧铜环：「我没说要带走。我只是不接受由你们决定什么与我有关。」\n\n妖梦站到两人之间，楼观剑仍留在鞘内。\n\n「永琳答应让你亲自核对。」\n\n「等她把不想让我看见的部分全都盖好以后？」\n\n「至少先让她把原卷带出来。」\n\n藏室内传来柜门关闭的声音。永琳抱着一卷旧档走出，卷宗上方另放着几张刚刚誊写完成的纸。\n\n「你比约定早了半个时辰。」\n\n她将旧档放到廊下的桌面。涉及无关者身份的页码已经封住，其余部分仍保留原状。\n\n「这里没有关于你的记录。」永琳看向正邪，「但所有能够辨认那枚印记的内容都在这里。你可以亲自翻，不必相信我替你选出的副本。」\n\n正邪看了看桌上的旧档，终于松开铜环。\n\n妖梦先将手从剑柄上移开。铃仙随后垂下枪口，仍然站在藏室门前。\n\n正邪走到桌边，翻开了稀神探女的档案。\n\n那里面没有她的名字。"

 love_story.24.a:"那是一卷早于她出生的旧档。"


 love_story.25.t:"只有探女的名字"

 love_story.25.d:"旧档的第一页写着稀神探女的姓名与职衔。最后一次修订的日期，早在永琳离开月都以前。\n\n档案记载，探女说出口的话会使局势朝相反方向发展。为了避免能力干扰，高风险命令通常不用言语传达，而是以亲笔批示与个人印记确认。\n\n后面的附页收录了她使用过的几种印记。正邪将照片放到旁边，很快便找到了相同的缺月图案。照片外层的转送编号不在旧档之中，中央的印记却没有任何差异。\n\n还有一份更早的事故报告。\n\n探女曾命令一队守卫牢牢记住某名逃亡者。命令出口以后，所有在场者都失去了关于那张面孔的记忆。名字与通缉令依旧存在，他们却无法再将那些资料与见过的人联系起来。\n\n正邪把这一页读了很久。\n\n「所以她确实能够让别人忘记一个人。」\n\n「档案只能证明她的能力曾造成过这种结果。」永琳回答，「不能证明她后来对你做过同样的事。」\n\n「但我的转送印上有她的名字。」\n\n「有她的个人印记。」\n\n「已经够接近了。」\n\n正邪继续翻到最后。整卷旧档没有提及长角的孩子，没有秘密转送，也没有任何能够说明两人关系的内容。\n\n「你真的没有别的记录？」\n\n「没有。」永琳说道，「照片上的转送发生在我离开以后。那段历史从未进入永远亭。」\n\n「那么，谁能回答？」\n\n「稀神探女，或者仍然封存在月都的战后档案。」\n\n正邪合上卷宗，将照片收回怀中。\n\n铃仙问道：「你准备去月都？」\n\n「别误会，我不是去认亲。」正邪走过她身边，「我要问问那个不爱说话的家伙，为什么我的转送印上会有她的痕迹，又是谁让所有见过我的人忘得一干二净。」\n\n她踏出庭院，又回头看了一眼被自己撞歪的屋檐。\n\n「在我回来以前，最好把门修结实一点。」\n\n正邪离开以后，妖梦与铃仙留在藏室外，把散落的木板逐块扶回原处。\n\n妖梦先开口：「她白天从正门进来，得到的却只有一句『没有记录』。」\n\n「因为确实没有。」\n\n「真话有时也很像在赶人走。」\n\n铃仙沉默了一会儿：「下次我会先把剩下的线索说完。」\n\n妖梦将木板压回台阶：「可她若真的打开那个抽屉，我还是会阻止她。」\n\n「你刚才已经阻止了。」\n\n「如果你开枪，我也可能会挡。」\n\n「我知道。」\n\n「所以你没有开枪？」\n\n「所以我等你先把话说完。」\n\n妖梦低头检查台阶，像是忽然对那块木板产生了极大的兴趣。\n\n铃仙没有拆穿她，只伸手扶住另一端。\n\n「下次别再带她来永远亭。」\n\n「如果她愿意走正门，我还是会带。」\n\n「她不会。」\n\n「那我继续帮你修屋顶。」\n\n两人对视一眼，终于都笑了出来。"

 love_story.25.a:"答案不在永远亭。"


 love_story.26.t:"下一次休假"

 love_story.26.d:"又过了半个月，妖梦与铃仙再次坐到人里街口的面摊前。摊主认得她们，不等开口便端来与上次相同的两碗汤面。\n\n这一次，没有人急着送药，也没有人从告示牌上说出月都的旧事。妖梦吃完以后才放下筷子，铃仙则难得没有提醒她汤快凉了。\n\n经过旧药铺时，她们看见窗边摆着那盆风见幽香带来的花。花瓣已经恢复深紫，边缘仍留着一圈银白。盆下压着两张短笺。一张出自永琳，写着月尘已经清除；另一张只有幽香的一句话：\n\n「剩下的，我自己来。」\n\n妖梦看了一会儿：「她没有把银色的部分去掉。」\n\n「或许那已经是花的一部分了。」\n\n「幽香听见这句话，大概会说花的事情不需要我们猜。」\n\n「所以趁她不在的时候说。」\n\n两人继续往前。走到报摊附近时，姬海棠果从屋檐上丢下一只折好的信封。\n\n「那个把我旧报库弄得一团乱的家伙留下的。」\n\n信上没有署名，内容也只有两行：\n\n「我要去月都找那个不爱说话的家伙。\n谁敢跟来，我就先把谁翻下去。」\n\n妖梦读完以后问道：「她有没有说什么时候回来？」\n\n「她连什么时候走的都没说。」果抱着相机答道，「这才像她。」\n\n铃仙将信折回原状：「至少这次，她知道自己为何出发。」\n\n她们没有追赶，也没有临时接下新的事情。剩下的下午被用来逛完没有走过的街巷，买了两份点心，还在桥边看了很久的鱼。\n\n临近傍晚，道路终于分向白玉楼与迷途竹林。两人停在岔口，谁也没有马上道别。\n\n妖梦先说道：「那天在藏室外，我以为你真的会开枪。」\n\n「我也以为你会斩开我的弹幕。」\n\n「我可能会。」\n\n「我知道。所以我没有开枪。」\n\n妖梦低头看着两条道路：「如果下次我们又站到不同的地方呢？」\n\n「先把理由说清楚。」铃仙回答，「如果来不及，我就先把你拖开，之后再听你解释。」\n\n「这样不讲道理。」\n\n「这样比较不会死人。」\n\n妖梦笑了，向她伸出手：「那就交给你。」\n\n铃仙握住那只手，却没有立刻放开。她看了妖梦片刻，忽然向前一步，在她唇边留下一个很轻的吻。\n\n妖梦怔在原地，脸颊很快红了起来。\n\n「这也太突然了。」\n\n「你刚才让我不要犹豫。」\n\n「我说的是下次遇到危险的时候。」\n\n「那你要我道歉吗？」\n\n妖梦握紧她的手，把刚刚退开半步的铃仙拉了回来。\n\n「不用。」\n\n通往白玉楼与迷途竹林的道路仍然分向两边。她们却转身走回人里，决定在天黑以前再绕一圈。\n\n这一次，没有任何人提早离开。"

 love_story.26.a:"这次，铃仙没有犹豫。"

 love_story.26.b:"这次，妖梦没有松手。"


