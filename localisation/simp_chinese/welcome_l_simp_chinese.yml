 KYO_country_intro_header:0"众神眷恋的幻想乡"
 KYO_country_intro_content:0"雾气常年贴著山脚，鸟居后的路像被世界忘记了一半。走进去，你会看到一个不该存在于现代的地方：神社、村落、妖怪的城馆、寺院、地底的熔光、月光映著竹林。这里叫「幻想乡」——东方Project的舞台，一座被结界隔绝的异界。\n\n幻想乡的核心规则很简单：只要「被相信、被记得」，就能活下去。妖怪、神明、传说、怪谈，很多都仰赖人类的恐惧与想像延续存在；而当外界文明进步、迷信退潮，越来越多「古老的不可思议」在现实里失去立足点。于是幻想乡诞生——它像一个收容所，也像一个牢笼，把被时代淘汰的神秘，集中在同一片土地上。\n\n维系这一切的是「博丽大结界」。结界把幻想乡与外界切开，让两套法则不会互相吞噬。结界之内，人类主要聚居在「人里」，靠耕作、交易、祭祀过日子；结界之内也有无数妖怪与势力：红魔馆的吸血鬼贵族、妖怪之山的天狗与河童、迷途竹林与永远亭的月之技术、命莲寺的佛门教团、白玉楼的亡者之庭、地灵殿与地底怪力……他们互相牵制，也彼此需要。\n\n站在秩序最前线的人，是「博丽巫女」。巫女负责调停异变、维持结界、把越界的冲突压回规则里。她不是独裁者，更像是那根把人类与妖怪绑在同一条船上的桅杆：大家可以互相讨厌，但不能把船拆了。\n\n至于八云紫，她是幻想乡的奠基者之一，也是最危险的守护者。她操纵「境界」，能以「间隙」把距离、界线、内外翻转，让不可能变成路径。她的目标从来不是让某一派胜利，而是让「幻想乡这个系统」活下去——哪怕手段冷硬，哪怕必须背负骂名。\n\n幻想乡封闭的五十年里，与外界的流通逐渐断绝，反而成了妖怪得以存续的土壤。传说不必向现代退让，怪谈不必被科学铲平——于是森林深处，妖怪与人类在同一片土地上呼吸、互相提防，也彼此依赖。那是一种微妙到近乎脆弱的平衡：如果每个人都肯把安份守己，这里甚至可能成为能容纳所有存在的理想乡。\n\n但现在，幻想乡走进了「松动」的年代。当你听见「共存」与「灭绝」，不是口号，而是它一直没敢大声承认的真相：幻想乡之所以能成立，是因为众人愿意遵守同一条规则；而当规则消失、扭曲，或被迫改写——迎来的，会是灾难，或者新生。"

