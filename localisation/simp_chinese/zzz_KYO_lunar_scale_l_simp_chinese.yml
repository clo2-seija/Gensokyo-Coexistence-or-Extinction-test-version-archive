 KYO_postwar_interference_category:0 "在月亮找到八云紫以前"

 KYO_postwar_interference_category_desc:0 "月之都已经将八云紫列为必须抹除的目标。地表眼线正在记录她开启间隙留下的波动，中继站负责验证，轨道卫星则逐步缩小坐标。只要三者得出同一个答案，姬光炮便会从月面开火，将紫与她所在的空间一并消灭。\n\n紫对此毫不知情。她仍在维持战后的幻想乡，并为新结界完成最后的准备。唯一看见这场处刑的人，是来自遥远未来的宇佐见莲子。她不能公开警告紫，否则月都会立刻察觉计划已经泄露；她只能借助星图、密信与秘密行动，一层层拆掉月都的观测网络。\n\n接下来的决议代表莲子的反制计划：取得观测情报、寻找能够信任的协助者、清除地表眼线、制造虚假坐标，并最终破坏月面的定位系统。每完成一步，月都便会失去一部分确认真实坐标的能力，八云紫也会离死亡更远一些。\n\n§Y若莲子及时切断完整的观测链，姬光炮将击中一个不存在的位置，八云紫会活着完成新结界。§!\n§R若月都先完成校准，真正的坐标便会被送上月面，八云紫将在毫无察觉的情况下被从世界上抹除。§!\n\n这场无人知晓的暗战，将决定八云紫是否还能看见下一次日出。"


 postwar_interference_time_limit:"阴谋期限"

KYO_reconstruct_anonymous_coordinates:0 "辉夜姬的第六道难题"
 KYO_reconstruct_anonymous_coordinates_desc:0 "莲子已经截获月都地表中继站的校验记录，也以未来星历算出了三次卫星过境时间。然而，只有曾经参与建立月都的永琳能够解释这些资料真正指向什么。\n\n直接向月之贤者索取机密只会招来拒绝。莲子决定把证据交给辉夜，让这位月之公主亲自判断：来自故乡的目光，是否已经越过了永远亭不能退让的界线。"

 KYO_prepare_distributed_anchors:0 "写给少数人的风暴预言"
 KYO_prepare_distributed_anchors_desc:0 "永琳只交出了足以阻止处刑的观测结构，莲子仍需要确认月都在地表安插了哪些眼线。大规模示警会惊动八云紫，也会使月都提前更换整套网络。\n\n她准备把几项尚未发生的异常分别寄给觉、猯藏与正邪。只要预告逐一应验，三人便会在不知完整计划的情况下，替她盯住月都即将留下的痕迹。"

 KYO_prepare_false_coordinates:0 "向从未忘记月都的人求援"
 KYO_prepare_false_coordinates_desc:0 "三处互不相连的线索已经指向同一套月都观测网。地上的协助者可以找出眼线，却没有力量越过天穹，摧毁姬光炮背后的控制设施。\n\n圣域能够藏起一次不应存在的会面。莲子将带着永琳留下的结构图前往那里，邀请纯狐与赫卡提亚·拉碧斯拉祖利加入这场尚未公开的反击。"

 KYO_prepare_reverse_refraction:0 "拔掉月都留在地上的眼睛"
 KYO_prepare_reverse_refraction_desc:0 "赫卡提亚拒绝在地表观测网仍然完整时打开通往月面的道路。莲子必须先让觉找出观测员，让猯藏追踪信使，再由正邪破解中继站使用的校验规则。\n\n所有节点必须在同一夜受到控制，其中几座还要继续传回正常报告。月都不只要失去地上的眼睛，还不能立刻发现自己已经失明。"

 KYO_renko_model_controllable_future:0 "让八云紫变得无处不在"
 KYO_renko_model_controllable_future_desc:0 "被夺取的观测器保存着八云紫过去开启间隙时留下的特征。与其隐藏真正的紫，莲子准备让受控中继站在卫星经过时重播这些记录。\n\n只要同一个目标同时出现在幻想乡各处，月都便会被迫反复校准轨道观测。莲子需要的不是永远欺骗月亮，而是逼它在混乱中暴露下一步反应。"

 KYO_sagume_supply_lunar_cipher:0 "白鹭留下的第一条道路"
 KYO_sagume_supply_lunar_cipher_desc:0 "追逐假目标的月都向地表发出紧急维护指令，正邪却在其中发现了一组被刻意写反的校验顺序。若她的判断正确，稀神探女已经留下了一次性的识别码与轨道维护时刻。\n\n赫卡提亚可以利用这段短暂空隙打开第一条道路，纯狐则会牵制月面守军。莲子必须趁道路闭合以前进入轨道设施，让卫星开始仰望一片并不存在的星空。"

 KYO_sagume_open_path_for_seija:0 "纯狐与地狱女神攻入月都"
 KYO_sagume_open_path_for_seija_desc:0 "首次突袭烧毁了数座卫星，也迫使月都将残存的观测权限集中到中央中枢。姬光炮真正的定位核心终于暴露，但稀神探女留下的识别码即将失效，月都的增援也正在靠近。\n\n继续拖延只会让处刑程序重新恢复。赫卡提亚将开启通往月面的道路，纯狐负责撕开正面防线，莲子则要进入中枢，彻底切断姬光炮与地表之间的联系。"


 KYO_remilia_bend_fate_toward_civil_war:0 "在山与海之间重开一线"
 KYO_remilia_bend_fate_toward_civil_war_desc:0 "地表中继站相继沉默，轨道卫星追逐着不存在的星辰，中央观测中枢也遭到袭击。月都耗费多年建立的处刑程序已经支离破碎，继续校准只会得到更多彼此冲突的坐标。\n\n绵月丰姬拒绝就此放弃。她将月之海与地表群山置于道路两端，强行缩短两者之间的距离。一条绕过卫星与中继站的临时通路随之开启，使姬光炮得以直接接收地表残留的间隙波动。\n\n然而，这条道路只能维持片刻，也无法分辨讯号是真是假。月都能够取得的，只有观测中枢断线前最后一组被判定可信的坐标。\n\n丰姬已经替妹妹夺回了一次开火的机会。若这个坐标仍然错误，月都将没有时间进行第二次校准。"


 KYO_gods_consecrate_yukari_sacrifice:0 "让诸神点燃最后一炮"
 KYO_gods_consecrate_yukari_sacrifice_desc:0 "丰姬开启的道路正在崩解，姬光炮内部也不断传来故障。卫星控制已经失效，定位核心遭到破坏，就连发射许可也因中枢断线而无法完成验证。\n\n绵月依姬持剑走入控制室，接连请下神灵。神火重新点燃沉寂的能源，雷霆贯通断裂的线路，降临月面的神威则暂时代替了已经瘫痪的校准机构。她并非请求诸神裁决八云紫是否该死，只是借它们的力量，迫使这座失去眼睛的武器完成最后一次发射。\n\n炮口缓缓转向观测网留下的最终坐标。没有新的验证，也没有修正错误的余地。若坐标无误，八云紫将连同尚未完成的结界一并消失；若莲子的欺骗已经深入最后一层，月都便会把仅剩的一炮射向空无一物的大地。\n\n绵月姐妹已经押上月都最后的机会。接下来，只看白光究竟会落在哪里。"


  KYO_yukari_legacy.2.t:0 "第六道难题的答案"
 KYO_yukari_legacy.2.d:0 "漆匣送进永远亭时，辉夜正在窗边翻看几本从外界流入的旧小说。她拆开封条，只读了几行便收起笑意。匣中的校验记录仍沿用月都格式，三次卫星过境时间则精确得不像猜测。最下方写着一道从未出现在传说中的难题：让月亮射失一个已经看见的目标。\n\n辉夜没有立刻召来永琳。她先命铃仙关闭永远亭对外的通讯，又让帝把当夜进出竹林的人全部引向错误的道路。直到第一个预定时刻临近，她才带着漆匣走进药室，将其中一页推到永琳面前。\n\n永琳起初没有回答，只取出数件多年未曾动用的月都仪器。第一道波动掠过竹海时，记录与匣中的数字完全吻合；第二道波动则在八云紫开启间隙以后改变方向。地表中继站负责捕捉目标，轨道卫星排除误差，姬光炮会在数次校验一致后执行处刑。寄件者没有猜错任何一步。\n\n更令永琳沉默的是，那些验证原则出自她昔日的手笔。它们原本用于保护月之都，使外敌无法以幻象欺骗防线；如今，后人却将这套技术倒转过来，从遥远高处寻找她已经居住多年的幻想乡。\n\n「这些方法一旦流出，就不只会害死月人。」永琳终于开口，「有人会沿着它们找到月之都，也会找到我们。」\n\n辉夜把漆匣重新推回她面前。\n\n「我没有要你交出月都。」她说道，「可我们早已不住在那里了。若故乡要从天上向我们的家开火，至少要让它射失这一炮。」\n\n永琳提笔许久，写下一整页计算，又亲手删去月面航路、守备配置与姬光炮本身的结构。她只留下观测程序的先后顺序、中继站之间的验证关系，以及使坐标相互冲突的方法。那不是投降，也不是协助反攻，而是一份经过严格限制的防御方案。\n\n天亮以前，辉夜依照匣底标示的回收方式送回答案。莲子再次打开漆匣时，看见末尾多了一行没有署名的警告：可以折断伸向幻想乡的武器，但不要让战火越过这条界线。\n\n她收起纸页，没有答应。"
 KYO_yukari_legacy.2.a:0 "至少先让这一炮落空。"

 KYO_yukari_legacy.3.t:0 "月色转冷以前"
 KYO_yukari_legacy.3.d:0 "莲子写了三封信，每封使用不同的纸张、笔迹与递送路线。寄往地灵殿的信预告，一名陌生旅人将在午夜经过旧都，而他的意识只会反复背诵同一段气象记录。交给二岩猯藏的信列出三个毫不相干的名字，声称他们会在三天内使用同一枚通行信物。\n\n最后一封落到鬼人正邪手中。里面附有一段被刻意倒置的月都校验码，末尾只有一句话：月上也有一名天邪鬼；她若开口，结果便会反转，她若沉默，便是在等别人先走进错误的结局。\n\n觉最先等到预告中的旅人。那人衣着普通，甚至不知道自己为何来到旧都；可在他平静的意识底下，某段气象记录正以完全相同的顺序反复出现。每当觉试图向更深处探查，记忆便被一片刻意留下的空白截断。她没有惊动对方，只让燐记下他的去处。\n\n猯藏则亲眼看见三张不同的脸依次使用同一枚通行信物。第一个是卖药人，第二个是受伤的士兵，第三个甚至借用了寺社人员的外貌。他们彼此没有交谈，却都在黄昏以后进入同一座废弃气象站。猯藏没有拆穿伪装，只派出两只狸猫，一只守门，一只跟踪从站内送出的包裹。\n\n正邪把校验码倒过来读、拆开读，又故意把能够成立的部分全部颠倒。直到第三遍，她才发现那些错误不是疏忽，而是只有天邪鬼才会使用的引导方式。藏在其中的不是命令，而是一个逐渐逼近的观测时刻。她嗤笑一声，把信折好收入袖中，却没有将它烧掉。\n\n三名收信者没有见面，也不知道另外两封信的存在。觉留下一个无人察觉的意识标记，猯藏悄悄替换了包裹上的印记，正邪则在原有校验码旁写下一串更加错误的答案。\n\n人里没有贴出告示，妖怪山也没有响起警钟。八云紫仍在处理战后留下的争端，月都的眼线也仍以为自己藏得很好。然而，在所有公开报告之外，已有三条互不相连的追踪路线，开始沿着同一片月光向上延伸。"
 KYO_yukari_legacy.3.a:0 "风暴尚未抵达，见证者已经就位。"

 KYO_yukari_legacy.4.t:0 "圣域中的两位访客"
 KYO_yukari_legacy.4.d:0 "圣域深处没有窗，也没有任何能够指向外界的影子。维缦·浅间与磐永阿梨夜先后封闭入口，又使通往会面地点的道路偏离原本方位。直到桌上的灯火不再投下影子，莲子才把永琳留下的观测结构铺开。\n\n纯狐最先看完。她没有询问资料从何而来，也没有追究八云紫为何值得冒险。她的手指沿着地表中继、轨道卫星与姬光炮之间的连线缓慢移动，最后停在月面防线的位置。\n\n「什么时候动手？」\n\n那句话没有愤怒，反而平静得令人不安。对纯狐而言，月都准备杀死谁并不重要；只要那座城市仍躲在不可触及的高处，以为自己可以决定地上众生的存亡，她便有足够理由再次走向那里。\n\n赫卡提亚·拉碧斯拉祖利没有回应她。地狱女神逐项检查星图、撤离路线与姬光炮的校准程序，随后用指尖圈出几处仍在运转的地表中继站。\n\n「现在打开道路，你们还没抵达月面就会被看见。」她对莲子说道，「月都不需要击败纯狐，也不需要找到圣域。只要确认八云紫的坐标，再提前开火，你们所做的一切便会失去意义。」\n\n莲子取出三封信的副本，将觉、猯藏与正邪发现的线索分别压在对应节点上。她没有军队，也无法命令桌旁任何一人；她能提供的只有未来星历、永琳没有删去的观测结构，以及一套尚未经过验证的欺骗方案。\n\n纯狐抬眼看向赫卡提亚。那并非服从，而是在等待一条足以让仇恨真正抵达月面的道路。\n\n赫卡提亚将星图转了半圈。\n\n「先让月亮看不见，再让它看错。地上的眼睛由她们处理，天上的坐标交给你。等守军开始追逐不存在的八云紫，我会打开第一条路。」\n\n「那之后呢？」莲子问。\n\n「之后，」纯狐替她回答，「月都会记起我们。」\n\n没有誓约，也没有人承诺拯救八云紫。纯狐要让故敌再次感受恐惧；赫卡提亚则拒绝月人永远高悬于安全之处。不同的理由最终汇成同一项计划，而莲子第一次拥有了能够触及月面的力量。"
 KYO_yukari_legacy.4.a:0 "先让月亮看不见。"

 KYO_yukari_legacy.5.t:0 "月都失去了地上的眼睛"
 KYO_yukari_legacy.5.d:0 "第二封信抵达时，纸上不再有预言，只有地点、时刻与目标。三封信的内容依旧彼此不同，却在末尾标着同一个时间：月面完成下一轮校验以前的最后一个夜晚。\n\n觉循着那段反复背诵的气象记录，找到了藏在旧都的观测员。对方并非月兔，只是一个被清洗过部分记忆、相信自己正在替外界整理天候资料的普通人。觉没有揭开全部真相，而是在他意识深处留下另一段足以维持日常行动的记忆，再让燐将真正的联络装置悄悄取走。只要月都继续询问，他仍会照常回答，却再也说不出任何有效坐标。\n\n猯藏跟随不断更换面孔的信使，摸清了中继站之间的联络路线。行动当晚，狸猫们先偷走凭证，再变作原有信使的模样，把经过替换的包裹逐站送达。站内人员看见熟悉的脸、正确的暗号与完好的封条，直到设备被拆开以前都没有意识到异常。\n\n正邪负责最危险的一步。她把截获的校验规则逐层颠倒，使失联、延迟与错误读数在月都看来全都属于正常结果。每当一座中继站落入控制，它便先传回一份毫无异常的报告，随后才在地表彻底沉默。\n\n行动在同一夜展开。藏在寺社、军营、废弃气象站与商队货物中的观测器被逐一取出，负责接头的人遭到隔离，几处无法安全接管的节点则被伪装成长期故障。没有警钟，没有交战，也没有一封求援讯息传向月面。\n\n莲子刻意留下三座中继站。它们仍按原定时间运转，继续向月都回报地表安静、坐标稳定、八云紫仍在预定范围内活动。拆下的观测器则经由圣域转移，由赫卡提亚亲自确认没有追踪讯号以后封存。\n\n黎明时，月都收到的报告与过去没有区别。它尚未发现自己已经失去用于交叉验证的耳目，更不知道原本替它寻找八云紫的眼睛，如今正在替莲子保存间隙波动，等待下一次卫星经过。"
 KYO_yukari_legacy.5.a:0 "让他们继续相信一切正常。"

 KYO_yukari_legacy.6.t:0 "无处不在的八云紫"
 KYO_yukari_legacy.6.d:0 "被送入圣域的观测器保存着过去数月截取的间隙特征。方向、持续时间、波动幅度，以及月都用来确认八云紫身份的每一组校验结果，都完整留在设备内部。那些冰冷数字拼合起来，便是月都眼中的八云紫。\n\n莲子依照未来星历，在整面墙上标出卫星掠过幻想乡的先后顺序。每一个时刻都只能使用一次；重播过早会被地表中继识破，过晚则会让卫星捕捉到真正的紫。正邪负责改写校验结果，猯藏的狸猫往返于三座节点，觉则从被隔离的观测员意识中确认月都尚未察觉异常。\n\n第一座中继站启动时，博丽神社出现了一段属于八云紫的记录。七分钟后，同样的波动从妖怪山升起；紧接着是旧地狱、迷途竹林与远离人烟的湖畔。设备重播的只是过往资料，月面的观测图却显示同一个目标正在数百里间连续开启间隙，有两次甚至同时出现在相反方向。\n\n真正的八云紫仍在处理战后的事务。她没有收到命令，也没有被谁诱导前往错误地点。某一刻，她只是觉得夜空中的月光比平日停留得更久，随后便合起报告，继续听蓝陈述各地的恢复数字。她不知道自己的影子正在月都的观测图上四处移动。\n\n轨道卫星被迫反复转向，月面守军则在相互矛盾的坐标间不断确认。第一次校准失败被归咎于中继站老化，第四次引发内部争论，第九次以后，所有观测结果都必须送交更高层复核。莲子没有停止。每当一处目标被排除，另一份完整记录便从远方升起，迫使月都继续暴露自己的验证方式。\n\n第十三次失败后，一份紧急维护指令终于进入受控节点。指令表面要求地表设备停止运转，正邪却只看一眼便发现，其中一组校验顺序被人刻意写反。那不是莲子的伪造，也不是系统故障；正确阅读会得到命令，颠倒以后却显现出另一层结构。\n\n正邪把结果递给莲子。莲子对照未来保存的残缺月都档案，在纸边写下一个名字：稀神探女。\n\n月面上的白鹭没有开口，也没有公开选择任何一方。她只在所有人忙于追逐假目标的时候，让一项本该立刻修正的错误继续存在。那道错误很小，却足以成为通往月面的第一扇门。"
 KYO_yukari_legacy.6.a:0 "白鹭没有开口，却留下了答案。"

 KYO_yukari_legacy.7.t:0 "白鹭留下的第一条路"
 KYO_yukari_legacy.7.d:0 "正邪将维护指令完全颠倒后，错误校验中显现出一组只能使用一次的月都识别码、一段卫星停止自检的时间，以及通往轨道维护设施的航路。识别码没有署名，也无法证明是谁留下；但它恰好避开所有会令探女公开表态的文字，只把选择交给收到它的人。\n\n稀神探女既未背叛月都，也没有保证这条路通向胜利。只要没人使用，那便只是一个尚未来得及修正的错误；一旦行动失败，她也不会留下任何足以替地上人辩护的证据。\n\n赫卡提亚检查识别码以后，只给出一次机会。道路必须在卫星停止自检的瞬间接上轨道维护设施，维持时间不能超过月都下一次例行巡查。进入者若未按时返回，她会直接关闭通路，避免圣域的位置沿异界连接遭到反向追踪。\n\n预定时刻到来，圣域的墙面无声裂开，门后没有月光，只有轨道设施外冰冷而狭窄的空间。几乎同一瞬间，纯狐袭击月面外围守备阵地。那不是制造声势的佯攻；她以纯化后的敌意正面撕开第一层防线，使所有用于辨识威胁的装置只能读到同一个结果。月都立即调动巡逻舰与轨道警戒，将注意力全部转向这个最熟悉的仇敌。\n\n莲子带着一支人数极少的队伍穿过通路。识别码替她们打开第一道门，正邪改写的校验规则骗过第二道检查，而未来星历则让莲子知道哪一座控制台将在下一刻取得全部卫星的维护权限。她将伪造星图送入系统，又把真实天象与维护时钟错开一个极小的数值。\n\n最初几分钟，一切仍显示正常。随后镜头开始追逐不存在的星辰，定位坐标互相否定，轨道修正接连失败。数座关键卫星拒绝接受错误结果，在强行重新校准时烧毁观测核心；更多卫星则依照假星图转向，从此只能看见一片永远无法吻合的天空。\n\n警报响起时，赫卡提亚的道路已经开始收缩。莲子最后一个离开，在跨过门槛以前回头看见月都正将所有残存卫星接入中央中枢。纯狐也在援军完成合围以前退出战线，把一片无法解释的破坏留在月面外围。\n\n第一次袭击结束了。姬光炮没有受损，处刑也尚未取消；然而，为了重新取得天空，月人亲手把分散的观测权限集中到同一处。莲子终于看见了那套系统真正的眼睛。"
 KYO_yukari_legacy.7.a:0 "中央中枢已经暴露。"

 KYO_yukari_legacy.8.t:0 "月都失去天空之夜"
 KYO_yukari_legacy.8.d:0 "总攻前的最后一夜，圣域彻底封闭。维缦·浅间与磐永阿梨夜切断通往外界的道路。地表上，觉监视月都眼线，猯藏让假信使继续传递报告，正邪则守住三座中继站，使月面直到开战前仍在接收错误坐标。\n\n中央中枢已经暴露，识别码却即将失效。赫卡提亚同时开启三条道路：一条落在月面防线后方，一条通往中央观测中枢，最后一条负责撤离。月都无法判断真正的攻击来自何方，只能将守军分散到每一道缺口。\n\n纯狐从正面攻入月都。纯化后的敌意扫过防线，所有警戒装置与守军都被迫转向这个最熟悉的仇敌。最强的兵力随即被调往城外，通往观测中枢的道路终于暴露。\n\n莲子沿第二条道路进入月面。卫星控制、坐标档案与姬光炮定位核心彼此备援，任何一处遭到破坏，权限都会转交另外两处。因此，她必须等待假坐标占满所有校验通道，再令三项目标同时失效。\n\n正邪从地表送出最后一组错误记录。莲子随即切断卫星控制，烧毁历次观测档案，并从定位核心中抹除永琳指出的验证关系。相互冲突的坐标迅速淹没中枢，月都彻底失去了辨认八云紫的天空。\n\n赫卡提亚开始关闭道路。纯狐仍想继续向城市深处推进，直到地狱女神亲自将她带离战场。莲子最后抵达撤离入口，回头看见控制台上的目标名称逐一熄灭。她以为处刑已经结束。\n\n然而，在中央中枢之外，一座从未接入观测网的备用单元悄然苏醒。丰姬早已将最后一组经过三重验证的坐标封存在其中；当所有自动权限失效，依姬请下神明，以手动授权越过了已经瘫痪的系统。\n\n姬光炮完成蓄能。\n\n莲子扑向控制台时，月面已被骤然亮起的白光吞没。她只来得及看见炮口转向地球，赫卡提亚的道路便在身后彻底闭合。\n\n与此同时，八云紫仍站在新结界的祭台中央。她抬起头，看见夜空在一瞬间化作惨白。那道光究竟射向她，还是射向莲子留下的最后一个虚假坐标，此刻没有任何人能够回答。"
 KYO_yukari_legacy.8.a:0 "光已经离开月面。"







