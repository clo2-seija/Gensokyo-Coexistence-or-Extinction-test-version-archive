l_simp_chinese:

 KYO_lunar_prewar.1.t:0 "幻想乡将以何名而战"

 KYO_lunar_prewar.1.d:0 "月都正在集结军队，幻想乡与月面的战争已经迫近。\n\n在紫的召集下，永远亭、白玉楼、红魔馆、命莲寺、妖怪山、地底势力与草根妖怪的代表齐聚一堂。过去的冲突并未消失，但所有人都已明白：若月都取胜，无论人类、妖怪还是神明，都不会拥有可以独自逃往的未来。\n\n各方第一次同意接受联合指挥，共享情报、补给与战场责任。曾经彼此对立的旗帜并列升起，中央则留下一个尚未写上名字的位置。\n\n紫站在众人面前，宣布道：\n\n「从今日起，月都面对的不再是四分五裂的势力，而是整个幻想乡。」\n\n大战开始以前，这个联合阵营必须拥有自己的名字。它将代表幻想乡的团结，也将成为我们向月都举起的共同旗帜。"

 KYO_lunar_prewar.1.a:0 "§R地上轴心§!——让一切抵抗围绕地球集结。"

 KYO_lunar_prewar.1.b:0 "§Y月都解放阵线§!——把自由带到月宫深处。"

 KYO_lunar_prewar.1.c:0 "§0幻想同盟§!——让被现实遗忘者守住现实。"

 KYO_lunar_prewar.1.e:0 "§G共存协约§!——没有一个世界必须消失。"
 
 KYO_lunar_prewar.2.t:0 "被替换的各国首脑"

 KYO_lunar_prewar.2.d:0 "蓝将各国近期的政府记录并列比较，发现多名国家首脑都曾在秘密会议、短期治疗或军事视察后失踪数日。等他们再次公开露面，容貌、声音与记忆都没有改变，言行却开始出现相同的停顿与措辞。\n\n他们不再质疑来自月面的命令，对突然增加的军事预算、失踪人口与秘密设施也作出近乎一致的解释。外交官、军队统帅与情报机关负责人同样发生了变化。\n\n永琳确认，这些人并非单纯受到操纵。原本的人类已经被带走，坐在他们位置上的，是经过伪装并继承部分记忆的月人。\n\n月都没有等待战争开始以后再征服地球。它早已把自己的人送进世界权力的最深处。"

 KYO_lunar_prewar.2.a:0 "这群伪人已经坐在世界的最高处。"


 KYO_lunar_prewar.3.t:0 "藏在广播中的频率"

 KYO_lunar_prewar.3.d:0 "铃仙在各国广播中听见了相同的异常波长。它隐藏在新闻、军方通告与公共广播之下，普通人无法察觉，却会随着长期接收逐渐干扰判断。\n\n这种频率不会直接夺走意识。它只会削弱怀疑，使重复出现的说法显得更加合理。最初仍有人质疑政府，随后反对的声音逐渐减少；到了最后，人们开始使用相同的词语解释战争、失踪与月都留下的一切矛盾。\n\n他们依然以为思想属于自己，却已经越来越难以产生与月都不同的答案。\n\n替换首脑只能控制政府，这道频率却能让整个社会主动服从政府。"

 KYO_lunar_prewar.3.a:0 "他们正在让整个世界相信同一个谎言。"


 KYO_lunar_prewar.4.t:0 "恐慌有了出口"

 KYO_lunar_prewar.4.d:0 "各国开始同时修改近期发生的事件。失踪的官员被说成遭到妖怪暗杀，军事设施的异常被归咎于间隙渗透，经济混乱与通信中断也全部成为幻想乡准备入侵地球的证据。\n\n伪造的影像、证词与军事报告不断出现在广播中。受到月面频率影响的人群无法察觉其中的矛盾，只知道生活正在失去秩序，而政府已经替他们指出了应当恐惧的敌人。\n\n愤怒开始涌向幻想乡。各国以保护人类文明为名扩大军队、封锁消息，并将反对者视作妖怪的协力者。\n\n月都制造了灾难，又把所有恐慌引向了我们。"

 KYO_lunar_prewar.4.a:0 "恐惧已经被他们指向幻想乡。"


 KYO_lunar_prewar.5.t:0 "来自月面的武器"

 KYO_lunar_prewar.5.d:0 "天狗侦察队在数个军事基地拍到了不属于地球的装备。\n\n没有弹仓的步枪能够连续射出白色光束，装甲车辆表面覆盖着抵抗妖力的净化材料，指挥设备则直接使用月兔军队的波长通信。部分基地甚至藏有连接月面的临时通道，武器与身穿白色军服的部队正从中不断抵达地表。\n\n这些装备没有经过任何地球工厂，也没有出现在各国公开的军备记录中。月人负责指挥，月兔组成精锐部队，受控国家的军队则将为她们提供数量与补给。\n\n我们将要面对的不是遭到操纵的人类军队。月都已经把自己的武器、士兵与指挥体系完整地部署在地球上。\n\n入侵者并非即将到来——他们早已站在地上。"

 KYO_lunar_prewar.5.a:0 "月都为这场战争准备了很久。"


 KYO_lunar_prewar.6.t:0 "月面传来的最后警告"

 KYO_lunar_prewar.6.d:0 "深夜，永远亭接收到一条强行接入的月面通信。画面中的稀神探女没有开口，只举起一张提前写好的警告，以免自己的能力改变即将发生的结局。\n\n§R距离全面入侵，只剩七天。§!\n\n替换各国首脑、统一社会认知、制造对幻想乡的恐慌，以及向地表输送月面军队——所有准备都已经完成。七日以后，受控国家将同时向幻想乡发动进攻，隐藏在地球上的月人部队也会接管各处战略设施。\n\n与此同时，月都将封锁通往月面的道路，使幻想乡只能在地上承受无休止的围攻。\n\n紫看完警告，立即命令百妖协议进入最高战备。没有时间继续掩饰，也没有任何势力还能置身事外。\n\n七日以后，月都与幻想乡之间的战争将正式开始。"

 KYO_lunar_prewar.6.a:0 "最后一周，所有工坊转入战时生产。"
