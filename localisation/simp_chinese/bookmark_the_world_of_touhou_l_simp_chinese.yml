l_simp_chinese:
 the_world_of_touhou_name:0 "众人的幻想乡'"
 the_world_of_touhou_desc:0 "幻想乡已死去，人们只能勇敢向前"

 the_world_of_touhou_KYO:0 "博丽大结界在巫女死后失去支点，灵力像失控的血脉倒灌——结界被扯成一条横贯天穹的伤口，另一端是现实世界冰冷的光。妖怪不是战死，而是被「遗忘」：名字先消失，传说再沉默，最后连目击都不再可能。每一刻都有谁从记忆里被删除，连哭声都来不及留下。\n八云紫站在裂缝边缘，间隙收不住外界的噪音。她明白这不是入侵，是吞噬；不是刀剑，是文明本身。要让幻想乡活下去，她只能选——把世界重新锁死，或把现实也拖进同一个黑暗里。"