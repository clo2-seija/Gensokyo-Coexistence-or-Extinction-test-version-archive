 KYO_cws_target_magic_forest_approach:0 "开放有限的畜生界通道"
 KYO_cws_target_magic_forest_approach_desc:0 "在受监督的条件下恢复地上与畜生界之间的人员、物资和情报往来。"
 KYO_cws_target_magic_forest_respond:0 "承认兽灵组织的谈判席位"
 KYO_cws_target_magic_forest_respond_desc:0 "不把畜生界各组织只当成雇佣兵，而是给予能约束双方的正式谈判地位。"
 KYO_cws_target_magic_forest_proposal:0 "签署战时互不侵犯协议"
 KYO_cws_target_magic_forest_proposal_desc:0 "划定地上与畜生界的行动边界，避免任何一方趁内战吞并对方据点。"


KYO_cws_yakumo_campaign:0 "八云余党正在翻找旧契约"
KYO_cws_yakumo_campaign_desc:0 "八云重组政府又从旧档案里翻出了几份盖着紫色印章的协议。蓝与她的官僚正以「延续秩序」为名拜访地方势力，仿佛只要搬出八云紫的遗产，所有人便该重新向她们低头。\n\n15日后，她们将选择一个席位展开交涉，使目标对八云阵营的好感度+1，且不会连续拉拢同一席位。好感度达到5时，中立势力将加入八云阵营；若目标已经投靠他方，则会先被动摇至中立，迫使四方重新争夺其支持。"

KYO_cws_remilia_campaign:0 "红魔馆正在用庇护索取服从"
KYO_cws_remilia_campaign_desc:0 "红魔馆的使者带着武器、粮食与一纸保护承诺走进地方据点。她们声称只有吸血鬼的城墙足以抵挡战火，却绝口不提每一份庇护背后，都附有对斯卡蕾特家族效忠的条件。\n\n15日后，她们将选择一个席位施加影响，使目标对红魔馆阵营的好感度+1，且不会连续盯上同一席位。好感度达到5时，中立势力将屈从于红魔馆；若目标已有归属，则会先被诱使退出原阵营，重新成为四方争夺的对象。"

KYO_cws_hijiri_campaign:0 "命莲寺正在把救济变成筹码"
KYO_cws_hijiri_campaign_desc:0 "命莲寺的僧侣正沿着难民道路发放粮食、药品与避难名额。她们把传教称作安抚，把登记支持者说成救济所需；等人们习惯从佛寺领取一切，白莲便能把感激悄悄换成政治上的追随。\n\n15日后，她们将选择一个席位扩大救济网络，使目标对命莲寺阵营的好感度+1，且不会连续经营同一席位。好感度达到5时，中立势力将加入命莲寺；若目标已经支持他方，则会先在她们的劝说下退回中立，等待四方再次争取。"

KYO_cws_seija_campaign:0 "正邪阵线正在煽动地方不满"
KYO_cws_seija_campaign_desc:0 "正邪的鼓动者正钻进工坊、村落与军营，把欠薪、征用和旧日恩怨一件件重新翻出来。她们许诺推翻所有压迫者，却从不说明旧秩序倒下以后，究竟由谁收拾满地废墟。革命口号不需要成本，承受后果的却永远是别人。\n\n15日后，她们将选择一个席位煽动反对力量，使目标对正邪阵线的好感度+1，且不会连续渗透同一席位。好感度达到5时，中立势力将倒向正邪；若目标已有主人，则会先被鼓动脱离原阵营，重新成为四方争夺的对象。"




 KYO_cws_recover_scattered_legacy:0 "回收失主的紫之遗产"
 KYO_cws_recover_scattered_legacy_desc:0 "原持有者已败亡。拥有至少5个公开支持席位时，可将散落的遗产重新收拢。"
 


KYO_cws_support_village:0 "人里自卫动员"
KYO_cws_support_village_desc:0 "上白泽慧音重新编排各街区的自卫队与向导。上白泽慧音的协助使征召不再沦为无序抓丁，也让前线能够准确获得人力与地方情报。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_kappa:0 "彼岸战时裁断"
KYO_cws_support_kappa_desc:0 "四季映姬为伤亡、战俘与军用征收订立统一准则，小野冢小町则负责回收遗体、传递名单并维持冥界通道。她们的介入约束了前线暴行，也让我们的命令更容易获得地方信任。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_tengu:0 "妖怪山联合军需网"
KYO_cws_support_tengu_desc:0 "饭纲丸龙统筹妖怪山的军需与情报，射命丸文和姬海棠果穿梭战线收集空情，河城荷取则让工坊昼夜生产并抢修损坏器材。天狗的速度与河童的技术由此汇成一套覆盖天空与山路的支援网络。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_eientei:0 "永远亭战地医疗"
KYO_cws_support_eientei_desc:0 "八意永琳制定战地救治与药品配给标准，铃仙率领医疗队进入前线，因幡帝则利用妖兔熟悉的小径转移伤员和物资。辉夜允许永远亭开放部分隐蔽设施，使最危急的伤员也能得到庇护。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_hakugyokurou:0 "冥界后方勤务"
KYO_cws_support_hakugyokurou_desc:0 "西行寺幽幽子接收并安抚战场亡魂，魂魄妖梦则带领幽灵巡查后方道路、护送补给并清除失控的怨灵。白玉楼的介入让死者不再干扰生者，也使前线能够专心面对仍活着的敌人。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_chireiden:0 "地底能源与侦察网"
KYO_cws_support_chireiden_desc:0 "古明地觉从俘虏与来客的意识中筛出可靠情报，火焰猫燐利用旧地狱的暗道转运人员，灵乌路空则维持地热设施与军需能源。地灵殿的协助使我们的部队能够从敌人意想不到的方向出现。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_oni:0 "旧都鬼族突击队"
KYO_cws_support_oni_desc:0 "星熊勇仪亲自整顿旧都的鬼族战士，伊吹萃香则以宴会与旧日名望召回散落各地的同族。她们不擅长繁琐计划，却能在最坚固的防线上砸出一条供全军前进的道路。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_fairies:0 "妖精侦察与补充队"
KYO_cws_support_fairies_desc:0 "琪露诺聚集湖畔与森林中的妖精，光之三妖精负责隐蔽侦察，克劳恩皮丝则带领最胆大的成员袭扰敌后。她们虽然缺乏纪律，却数量众多、恢复迅速，足以承担传令、救火、侦察与填补战线缺口的工作。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_tsukumogami:0 "付丧神军需工坊"
KYO_cws_support_tsukumogami_desc:0 "堀川雷鼓召集被遗弃器物化成的付丧神，九十九弁弁与八桥以灵力协调工坊设备，多多良小伞则负责修补兵器与金属构件。经她们唤醒的机械即使缺少操作人员，也能继续生产、搬运和自我维护。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_moriya:0 "守矢动员网络"
KYO_cws_support_moriya_desc:0 "八坂神奈子把神社的信仰组织转为物资与人力网络，泄矢诹访子负责维护山道、水源和地脉设施，东风谷早苗则往返各聚落主持救济与动员。守矢三人的分工，使偏远地区也能持续响应我们的征召。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_senkai:0 "神灵庙军政幕僚"
KYO_cws_support_senkai_desc:0 "丰聪耳神子聆听各地诉求并调整军政计划，物部布都负责营地、运输与防御工程，苏我屠自古则利用雷电维持紧急通信。神灵庙的幕僚让前线行动与后方行政不再各自为政。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_support_magic_forest:0 "畜生界兽灵军团"
KYO_cws_support_magic_forest_desc:0 "吉吊八千慧调度鬼杰组的渗透网络，骊驹早鬼率领劲牙组展开高速突击，饕餮尤魔则为军团夺取燃料与补给。三名首领依旧彼此提防，但在共同利益消失以前，她们的兽灵足以成为撕裂敌军侧翼的利爪。\n\n§Y只在该势力公开支持本阵营期间生效。§!"

KYO_cws_yukari_legacy_holder:0 "八云紫遗产的持有者"
KYO_cws_yukari_legacy_holder_desc:0 "八云蓝整理紫留下的盟约、边界通路与秘密补给线，橙则奔走各地，重新联系仍愿意回应八云家的人。她们继承的并非紫的力量，而是那套让无数势力能够在危机中共同运转的旧秩序。"



KYO_cws_final_offensive_1:0 "最后胜机：零星援手"
KYO_cws_final_offensive_1_desc:0 "只有少数地方人物愿意为我们冒险。他们拼凑出一批装备、志愿者与临时补给，所得不多，却仍可能成为发动最后攻势所需的第一把火。"

KYO_cws_final_offensive_2:0 "最后胜机：地方响应"
KYO_cws_final_offensive_2_desc:0 "数名地方领袖开始协调仓库、向导与自卫武装。援助仍然分散，却已经足以支撑一场短促而猛烈的进攻。"

KYO_cws_final_offensive_3:0 "最后胜机：盟友集结"
KYO_cws_final_offensive_3_desc:0 "来自不同地区的支持者终于彼此接上了道路。她们送来人员、武器和情报，并愿意让自己的部下随我们投入决定战局的攻势。"

KYO_cws_final_offensive_4:0 "最后胜机：诸方协力"
KYO_cws_final_offensive_4_desc:0 "多位拥有实际力量的人物已经公开站到我们身旁。工坊、寺社、运输队与地方武装开始依照同一份计划行动，为总攻提供稳定而持续的支援。"

KYO_cws_final_offensive_5:0 "最后胜机：大势所归"
KYO_cws_final_offensive_5_desc:0 "幻想乡多数重要人物已经认定我们最有可能结束内战。装备与志愿军从各地汇入战线，敌人的地方关系则开始在压力下瓦解。"

KYO_cws_final_offensive_6:0 "最后胜机：幻想乡的选择"
KYO_cws_final_offensive_6_desc:0 "来自各地的领袖、工匠、僧侣、妖怪与普通居民共同押上了自己的未来。此刻发动的已不再是一方势力的进攻，而是幻想乡为终结内战所作出的集体选择。"

