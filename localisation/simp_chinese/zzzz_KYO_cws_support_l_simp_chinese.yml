 KYO_cws_focus_beast_reward_tt:0 "畜生界：600件步兵装备、80辆卡车、10点陆军经验；60日陆军攻击+5%、陆军速度+3%；畜生界对我方好感度+1。"
 KYO_cws_focus_kappa_reward_tt:0 "河童工坊：800件步兵装备、150件支援装备；保留原60日工厂产出+50%、生产效率增长+50%；天狗与河童联合势力对我方好感度+1。"
 KYO_cws_focus_ghost_reward_tt:0 "冥界：400件步兵装备、80件支援装备、10点陆军经验；60日组织度恢复+10%、陆军防御+5%；白玉楼对我方好感度+1。"
 KYO_cws_focus_tengu_reward_tt:0 "天狗：80架基础航空器、12架运输机、10点空军经验；60日空军任务效率+10%、陆军情报+10%；天狗与河童联合势力对我方好感度+1。"
 KYO_cws_focus_fairy_reward_tt:0 "妖精：30000人力、500件步兵装备；保留原60日冬季损耗-40%、补给消耗-10%、速度/防御+5%、民兵攻防+10%、渡河惩罚-20%；妖精对我方好感度+1。"
 KYO_cws_focus_oni_reward_tt:0 "鬼族：700件步兵装备、100门火炮、15点指挥点数；保留原60日陆军攻击/防御+20%；鬼族对我方好感度+1。"
 KYO_cws_focus_eientei_reward_tt:0 "永远亭：200件支援装备、50辆卡车；60日经验损失-10%、补给消耗-5%、组织度恢复+5%；永远亭对我方好感度+1。"
 KYO_cws_last_chance_reward_tt:0 "先重算公开支持席位，再发放：\n0–2席：500步兵/100支援/30卡车，45日第1档攻势；\n3–4席：750/150/50，60日第2档；\n5–7席：1000/200/75，60日第3档；\n8–9席：1250/250/100，75日第4档；\n10–11席：1500/300/125，75日第5档；\n12席：2000/400/150，90日第6档。\n三项数字依次为步兵装备、支援装备、卡车。"

 KYO_cws_debug_initialize_debug:0 "快进至四方内战前夕"
 KYO_cws_debug_initialize_debug_desc:0 "§R仅用于新测试存档。§!立即吞并仍存在的日本、建立中等战前势力值，并打开四方内战选边事件。选择阵营后以最高速度运行；其余三国会在30日内建立，约21日后自动完成§Y战争永不改变§!、正式开战并启用支援决议。"



