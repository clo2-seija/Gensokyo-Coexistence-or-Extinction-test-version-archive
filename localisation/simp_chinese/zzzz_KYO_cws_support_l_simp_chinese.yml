 KYO_cws_view_magic_forest_neutral:0 "八千慧计算通道与政治筹码，早鬼只在意哪一方更强，尤魔则已经替所有可能结果开出价码。畜生界从不无偿支持地上战争；谁能维持三组织的均衡并留下足够利益，谁才有资格谈合作。"
 KYO_cws_view_magic_forest_yakumo:0 "蓝保证维持畜生界通道开放，并承认鬼杰组、劲牙组与刚欲同盟拥有对等交涉地位。她熟悉兽灵世界的规则，也懂得均衡比征服更有价值；三组织因此选择以军力换取稳定而长期的地上入口。"
 KYO_cws_view_magic_forest_remilia:0 "红魔馆承诺分享战利品、开放地上市场，并把兽灵军团视为盟军而非雇佣兵。早鬼认可蕾米莉亚的力量，尤魔满意交易条件，八千慧也得到维持三方均衡的保证；共同利益最终压过了彼此猜疑。"
 KYO_cws_view_magic_forest_hijiri:0 "白莲承诺禁止奴役兽灵，并为畜生界居民提供合法进入地上的途径。三组织并不理解她的慈悲，却看见稳定贸易与摆脱旧剥削的机会；命莲寺证明自己有能力保护通道后，她们决定接受这份合作。"
 KYO_cws_view_magic_forest_seija:0 "正邪愿意打破地上势力对通道与资源的垄断，并让三大组织直接参与战后利益分配。早鬼欣赏她挑战强者的胆量，尤魔嗅到新的机会，八千慧则得到明确规则；兽灵们因此把革命视为重新洗牌的最佳时刻。"