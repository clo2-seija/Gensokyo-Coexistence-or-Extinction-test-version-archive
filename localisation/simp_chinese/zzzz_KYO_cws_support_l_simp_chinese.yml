 KYO_cws_view_oni_neutral:0 "鬼族把四方使者请上同一张酒桌，要求她们当面说完条件、不准看稿，也不准在小字里藏东西。谁喝得下、打得过、说话算话，旧都便愿意跟谁走；其余修辞都只是给胆小鬼准备的装饰。"
 KYO_cws_view_oni_yakumo:0 "蓝来到旧都，把所有条件摆上酒桌，没有隐藏条款，也没有搬出紫的名义要求服从。她承诺保留鬼族的行动自由，并偿还过去欠下的协助；勇仪认可这份坦率，决定让旧都的拳头替她开路。"
 KYO_cws_view_oni_remilia:0 "蕾米莉亚没有要求鬼族跪下，只邀请她们一同攻破最坚固的战线，并承诺胜利后不干涉旧都。勇仪欣赏她毫不遮掩的野心，也尊重足以承担野心的力量；这份盟约建立在强者之间，而非君臣之间。"
 KYO_cws_view_oni_hijiri:0 "白莲亲自来到旧都接受挑战，以力量和诚意证明慈悲并非软弱。她没有要求鬼族戒酒或改过，只请求她们保护弱者免受战火吞噬；勇仪因此决定相信这个敢用双手实践信念的僧人。"
 KYO_cws_view_oni_seija:0 "正邪没有躲在口号后面，而是亲自站到旧都最危险的决斗场上，承诺革命不会给鬼族套上新的锁链。她敢于挑战强者，也愿意承担失败后果；鬼族因此选择跟随这个真正敢把桌子掀翻的人。"

