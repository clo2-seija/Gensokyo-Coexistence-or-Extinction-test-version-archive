 KYO_cws_view_senkai_neutral:0 "神子同时聆听四方使者的十种欲望，却没有从任何一人口中听见完整的战后制度。神灵庙关心的不是谁最会许诺，而是谁愿意让人类真正参与行政、立法与宗教事务。"
 KYO_cws_view_senkai_yakumo:0 "蓝同意让人类代表进入重组政府，并把部分行政与司法事务交由人里自行处理。神子选择支持八云阵营，是因为它拥有结束混乱所需的制度，同时终于愿意让人类从被管理者变成共同治理者。"
 KYO_cws_view_senkai_remilia:0 "蕾米莉亚承诺给予人类明确的公民身份、财产权与行政席位，而非仅把他们列为帝国臣民。神子认可红魔馆建立中央权威的能力；只要法律不以种族区分价值，神灵庙愿意协助她治理国家。"
 KYO_cws_view_senkai_hijiri:0 "白莲接受佛道并立，也同意由神灵庙负责部分人类行政与教育事务。神子选择加入，并非放下彼此的教义竞争，而是相信双方都愿意建立一个让人类与妖怪共同参与政治的世界。"
 KYO_cws_view_senkai_seija:0 "正邪同意召开制宪会议，让人类、妖怪与地方组织共同决定战后制度。神子从她的计划中看见了行政架构，而不再只有破坏口号；神灵庙因此决定用自己的治国经验，确保革命能够留下可运行的国家。"

