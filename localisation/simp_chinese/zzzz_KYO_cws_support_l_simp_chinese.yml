 KYO_cws_view_fairies_neutral:0 "妖精们并不讨论宪法或边界，她们记住的是谁给过食物、谁允许她们躲进屋里，以及谁又把她们派去踩雷。想得到妖精支持并不困难：先把她们当成活着的同伴，而不是会重新出现的消耗品。"
 KYO_cws_view_fairies_yakumo:0 "蓝承认妖精在战争中的贡献，并为每支队伍登记补给、休息地与撤退权。八云政府不再把她们视为能够无限补充的数字；妖精们因此愿意再次守护维系森林、湖泊与自身重生的结界。"
 KYO_cws_view_fairies_remilia:0 "红魔馆开放住所与厨房，也承诺妖精部队不会被派去执行必死任务。制服、食物和强大城堡固然诱人，更重要的是蕾米莉亚愿意把她们当成帝国的士兵，而不是随时可以替换的玩具。"
 KYO_cws_view_fairies_hijiri:0 "命莲寺给每支妖精队伍准备食物、名字与安全住处，也允许她们在不伤害他人的前提下继续恶作剧。妖精们选择白莲的理由十分简单：她记得她们会害怕、会饥饿，也值得被救回来。"
 KYO_cws_view_fairies_seija:0 "正邪让妖精也能参加集会，并公开宣布最弱小者的声音与贤者同样重要。对于从来只被计算数量的她们而言，这场革命第一次让自己成为决定未来的人，而不只是填补战线的消耗品。"

