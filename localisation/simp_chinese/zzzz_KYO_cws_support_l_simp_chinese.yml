 KYO_cws_view_moriya_neutral:0 "神奈子计算四方能够维持多少工程，诹访子检查战线是否会伤及山川，早苗则继续照顾逃入山中的难民。守矢神社不打算为抽象理想下注；信仰、建设与居民必须在战争结束后仍然存在。"
 KYO_cws_view_moriya_yakumo:0 "蓝承认守矢神社的宗教自治，并保证大型工程由双方共同决定。神奈子相信八云政府能够恢复跨山秩序，诹访子也接受这份尊重土地与旧约的安排；守矢因此选择协助一个可以谈判的中央。"
 KYO_cws_view_moriya_remilia:0 "红魔馆提供保护、资本与工业订单，同时承诺不干涉守矢的祭祀与信仰网络。神奈子看见了把战争动员转化为长期建设的机会；只要双方以盟友相称，神明并不介意与吸血鬼共享利益。"
 KYO_cws_view_moriya_hijiri:0 "白莲同意建立多宗教协商机构，并让守矢独立管理山中的信众与设施。双方虽然争夺信仰，却都在救济和重建中看见合作价值；守矢选择支持一个不必消灭竞争者也能共存的未来。"
 KYO_cws_view_moriya_seija:0 "正邪承诺把信仰组织视为地方共同体，而不是等待取缔的旧权威，并让山中居民参与工程与资源分配。神奈子接受改革带来的风险，因为革命也可能打破长期限制守矢发展的中央垄断。"

