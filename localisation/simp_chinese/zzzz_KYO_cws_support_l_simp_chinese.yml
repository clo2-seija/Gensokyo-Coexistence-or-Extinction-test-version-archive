l_simp_chinese:

    KYO_civil_war_decision:0 "战火中的归属"
KYO_civil_war_decision_desc:0 "八云紫留下的秩序已在炮火中崩解。幻想乡不再有一位能迫使所有人退让的仲裁者；这场内战所争夺的，也不只是土地与军权，而是谁有资格接过她留下的世界，决定人类、妖怪与诸多异族此后将生活在何种秩序之下。\n\n工坊、寺社、村落与地方武装仍在四方之间观望。它们掌握兵员、物资、情报、技术与地方人心。每一个公开加入我们的组织，都将为前线带来新的力量，也会使更多中立者相信，我们确实有能力结束战乱并承担幻想乡的未来。\n\n提供援助、履行承诺并回应各方诉求，能够逐步取得它们的信任；敌人同样会展开交涉，甚至抢先夺走原本可能属于我们的盟友。已经选边的势力也并非永远忠诚，只要揭露敌方的失信、动摇其信念，便有机会使其重新退回中立。\n\n不要低估任何一个地方组织的选择。单独一方或许不足以左右战局，但当众多微小力量汇聚在同一面旗帜下，它们便能决定军队是否获得补给、命令能否传遍各地，以及胜利者能否得到整个幻想乡的承认。\n\n八云紫的时代已经结束。谁能在战火熄灭以前赢得最多支持，谁便最有可能成为她身后世界的新领导者。"


