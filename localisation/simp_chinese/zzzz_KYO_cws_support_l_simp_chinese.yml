 KYO_cws_gui_village_player_favor_seija:0 "[?KYO_cws_village_seija_support|0]/5"
 KYO_cws_view_village_neutral:0 "寺子屋仍在上课，自卫队却已把武器放在门边。人里不关心谁的旗帜最漂亮，只想知道下一批粮食能否送到、夜间巡逻由谁负责，以及战争结束后还能不能保留保护自己的权利。"
 KYO_cws_view_village_yakumo:0 "人里将自卫名册交给了八云重组政府。并非所有人都怀念旧时代，但蓝承诺恢复交通与治安，同时承认人里拥有自己的代表和武装；比起未知的未来，他们最终选择了一套熟悉而且能够被约束的秩序。"
 KYO_cws_view_village_remilia:0 "当红魔馆的部队驱散劫掠者、重新打通粮道以后，人里选择接受其庇护。蕾米莉亚保证保留地方自卫队，不把村民变成血奴或私兵；对被战火包围的人而言，能够立即兑现的安全比遥远理想更有分量。"
 KYO_cws_view_village_hijiri:0 "命莲寺的粮车先于使者抵达人里，僧侣也没有询问伤员曾为哪一方作战。白莲承诺让地方代表参与战后治理，并保留自卫权；人里因此相信，她所说的共存至少已经从一碗热饭开始。"
 KYO_cws_view_village_seija:0 "正邪阵线接受了人里提出的条件：自卫队不被解散，征用必须经过地方同意，战后也要让普通人进入议事机构。那些长期只能等待妖怪决定命运的人，终于选择为自己的政治地位拿起武器。"

 KYO_cws_gui_kappa_player_favor_yakumo:0 "[?KYO_cws_kappa_yakumo_support|0]/5"
 KYO_cws_gui_kappa_player_favor_remilia:0 "[?KYO_cws_kappa_remilia_support|0]/5"
 KYO_cws_gui_kappa_player_favor_hijiri:0 "[?KYO_cws_kappa_hijiri_support|0]/5"
 KYO_cws_gui_kappa_player_favor_seija:0 "[?KYO_cws_kappa_seija_support|0]/5"
 KYO_cws_view_kappa_neutral:0 "小町的船已经载不完新来的亡魂，映姬的案卷也一日厚过一日。彼岸无意为任何活人的野心背书；谁若想得到它的协助，便必须先保证审判不受军令干涉，三途河也不会成为运兵与走私的捷径。"
 KYO_cws_view_kappa_yakumo:0 "八云重组政府承认彼岸的裁判权不受战时命令干涉，也交还了几条遭军队占用的冥界通道。映姬因此选择支持蓝——不是为了八云家的名号，而是因为她最有能力重新划清生者、死者与军队之间的界线。"
 KYO_cws_view_kappa_remilia:0 "红魔馆接受了彼岸提出的战时法则，承诺无论敌我都依同一标准处置战俘与遗体。映姬并不赞同吸血鬼的帝国野心，却认为蕾米莉亚的严厉秩序能够最快制止滥杀，使死者重新得到姓名与裁断。"
 KYO_cws_view_kappa_hijiri:0 "命莲寺主动保护葬仪、协助确认死者身份，并承认慈悲不能取代审判。彼岸因此加入白莲一方，希望她的救济网络能够减少无谓死亡，也让战争结束后的宽恕建立在责任而非遗忘之上。"
 KYO_cws_view_kappa_seija:0 "正邪交出了私设刑场与非法征用的记录，并承诺废除活人势力对彼岸事务的干预。映姬支持的不是无法无天的革命，而是一次清除特权的机会——即使旧秩序倒下，因果与裁断仍必须留下。"

 KYO_cws_gui_tengu_player_favor_yakumo:0 "[?KYO_cws_tengu_yakumo_support|0]/5"
 KYO_cws_gui_tengu_player_favor_remilia:0 "[?KYO_cws_tengu_remilia_support|0]/5"
 KYO_cws_gui_tengu_player_favor_hijiri:0 "[?KYO_cws_tengu_hijiri_support|0]/5"
 KYO_cws_gui_tengu_player_favor_seija:0 "[?KYO_cws_tengu_seija_support|0]/5"
 KYO_cws_view_tengu_neutral:0 "文文新闻忙着统计四方胜算，果的相机盯着山脚，荷取则把最重要的机械锁进仓库。妖怪山不会为了几句承诺押上天空、工坊与新闻网络；谁想得到支持，便得先回答山上的自治权究竟值多少钱。"
 KYO_cws_view_tengu_yakumo:0 "八云政府恢复了旧有航路，也正式承认妖怪山的自治、新闻权与工坊所有权。饭纲丸龙相信蓝需要山上的能力，却不会轻易吞并它；天狗与河童因此选择以情报和技术协助重建一套彼此熟悉的秩序。"
 KYO_cws_view_tengu_remilia:0 "红魔馆以军队保护山路，并为河童工坊提供了稳定订单与原料。蕾米莉亚同时承诺不接管天狗报社，只要求战时情报协作；对希望保住产业与天空的妖怪山而言，这是一笔危险却足够实际的交易。"
 KYO_cws_view_tengu_hijiri:0 "命莲寺同意让妖怪山自行管理工坊和报社，并将其运输网纳入救济计划而非中央征用。天狗需要一个愿意听取意见的盟友，河童需要不会夺走技术的客户，因此双方选择共同维持白莲的战线。"
 KYO_cws_view_tengu_seija:0 "正邪给予下级天狗、河童技师与工坊学徒正式代表权，也承诺打破少数长老对消息和生产的垄断。改革威胁了山上的旧阶层，却让更多居民第一次觉得，这场战争可能改变自己在妖怪山中的位置。"

 KYO_cws_gui_eientei_player_favor_yakumo:0 "[?KYO_cws_eientei_yakumo_support|0]/5"
 KYO_cws_gui_eientei_player_favor_remilia:0 "[?KYO_cws_eientei_remilia_support|0]/5"
 KYO_cws_gui_eientei_player_favor_hijiri:0 "[?KYO_cws_eientei_hijiri_support|0]/5"
 KYO_cws_gui_eientei_player_favor_seija:0 "[?KYO_cws_eientei_seija_support|0]/5"
 KYO_cws_view_eientei_neutral:0 "永琳将所有阵营的伤员放上同一张诊疗表，并命令铃仙拒绝携带武器者进入医疗通道。永远亭可以救治任何人，却不愿成为任何一方的军用药房；谁先破坏医疗中立，谁便会永远失去竹林中的道路。"
 KYO_cws_view_eientei_yakumo:0 "蓝承诺维持医疗中立，不强征药品，也不追查经永远亭救治的敌军伤员。永琳选择支持八云政府，是因为它最有能力保护竹林通道并维持保密；这是一份建立在明确界线上的合作，而不是对旧交情的偿还。"
 KYO_cws_view_eientei_remilia:0 "红魔馆派兵守住医疗走廊，并接受永琳提出的条件：病床前没有敌我，药品也不得优先供应贵族。永远亭因此站到蕾米莉亚一方，希望她的力量能够阻止战线继续逼近竹林。"
 KYO_cws_view_eientei_hijiri:0 "命莲寺的救济队愿意完全遵循永琳制定的医疗标准，也主动承担伤员后送与难民安置。永远亭选择加入，是因为白莲不仅尊重生命，还拥有一套能让医疗援助抵达普通人的组织网络。"
 KYO_cws_view_eientei_seija:0 "正邪保证药品依伤势而非身份分配，并让长期承担杂务的妖兔参与后勤管理。铃仙与帝看见了改变旧等级的机会，永琳则获得研究与医疗自治的保证；永远亭因此决定支持这场受到约束的革命。"

 KYO_cws_gui_hakugyokurou_player_favor_yakumo:0 "[?KYO_cws_hakugyokurou_yakumo_support|0]/5"
 KYO_cws_gui_hakugyokurou_player_favor_remilia:0 "[?KYO_cws_hakugyokurou_remilia_support|0]/5"
 KYO_cws_gui_hakugyokurou_player_favor_hijiri:0 "[?KYO_cws_hakugyokurou_hijiri_support|0]/5"
 KYO_cws_gui_hakugyokurou_player_favor_seija:0 "[?KYO_cws_hakugyokurou_seija_support|0]/5"
 KYO_cws_view_hakugyokurou_neutral:0 "无论哪一方获胜，亡者都会继续抵达白玉楼。幽幽子不急着下注，妖梦则忙于封闭被炮火震开的通道；冥界只希望活人别把战争带到死者庭院，也别把亡魂当作取之不尽的兵员。"
 KYO_cws_view_hakugyokurou_yakumo:0 "蓝亲自确认冥界不属于八云政府，双方只是重新建立紫与幽幽子时代的协作关系。白玉楼因此选择帮助她稳定生死边界——不是服从八云家的继承者，而是守住一位故友曾努力维系的世界。"
 KYO_cws_view_hakugyokurou_remilia:0 "蕾米莉亚承认红魔馆的主权止于冥界入口，也派兵阻止各方盗用亡魂。幽幽子因此愿意提供后方通道与幽灵勤务；只要吸血鬼尊重死者的国境，白玉楼便会帮助她结束活人的战争。"
 KYO_cws_view_hakugyokurou_hijiri:0 "白莲承诺为所有战死者保留姓名与葬礼，同时不以超度之名强迫亡魂离开。幽幽子认可她对死亡的敬意，妖梦也相信命莲寺能够减少新的怨灵；白玉楼因此站到慈悲的一方。"
 KYO_cws_view_hakugyokurou_seija:0 "正邪废除了强征幽灵与盗用遗体的命令，并答应让长期承担无偿劳役的亡魂重新选择去留。白玉楼不认同她所有的革命手段，却愿意支持一场把死者也视为独立存在的变革。"

 KYO_cws_gui_chireiden_player_favor_yakumo:0 "[?KYO_cws_chireiden_yakumo_support|0]/5"
 KYO_cws_gui_chireiden_player_favor_remilia:0 "[?KYO_cws_chireiden_remilia_support|0]/5"
 KYO_cws_gui_chireiden_player_favor_hijiri:0 "[?KYO_cws_chireiden_hijiri_support|0]/5"
 KYO_cws_gui_chireiden_player_favor_seija:0 "[?KYO_cws_chireiden_seija_support|0]/5"
 KYO_cws_view_chireiden_neutral:0 "古明地觉从每一位地上使者的心中，都读到了没有写进协议的盘算。地灵殿宁可继续关闭入口，也不愿用自治换取短暂安全；想进入地底的人，最好先准备一份连心声都能经受检查的承诺。"
 KYO_cws_view_chireiden_yakumo:0 "八云政府重新确认地底自治，并把旧地狱入口的管理权交还地灵殿。觉从蓝的心中确认她无意吞并地底后，决定提供情报与能源；对地灵殿而言，这是以明确边界换取稳定往来的选择。"
 KYO_cws_view_chireiden_remilia:0 "红魔馆承认旧地狱是盟友领地，并以军力保护入口与地上贸易线。觉知道蕾米莉亚渴望能源，却也读见她愿意遵守已经签下的交换条件；地灵殿因此接受这场以力量和利益维系的合作。"
 KYO_cws_view_chireiden_hijiri:0 "白莲承诺不向地底强行传教，也不因读心、怨灵或地狱出身而区别对待居民。地灵殿选择支持命莲寺，是因为她愿意让那些长期遭地上排斥的存在，以自己的样貌进入新秩序。"
 KYO_cws_view_chireiden_seija:0 "正邪答应让地底居民自行选出代表，并结束地上势力对能源与通道的单方面索取。觉在她的计划中仍看见危险，却也看见旧地狱第一次可能不再只是被利用的后方；地灵殿因此加入革命阵线。"

 KYO_cws_gui_oni_player_favor_yakumo:0 "[?KYO_cws_oni_yakumo_support|0]/5"
