 KYO_cws_view_tsukumogami_neutral:0 "雷鼓让所有付丧神暂时停止演奏，先听听四方准备如何称呼她们：财产、军需品、文化遗产，还是拥有意志的居民。用错一个词，都可能让整座工坊在夜里自行离开。"
 KYO_cws_view_tsukumogami_yakumo:0 "蓝同意将付丧神登记为居民而非财产，并承诺禁止战时没收已经觉醒的器物。雷鼓相信八云政府有能力保护工坊和道路；在获得法律身份以后，付丧神愿意用自己的技术维护这套新旧交替的秩序。"
 KYO_cws_view_tsukumogami_remilia:0 "蕾米莉亚承诺不把付丧神收入私人收藏，并将红魔馆工坊交由她们自行管理。红魔馆珍惜古老器物，也愿意为优秀技艺付出代价；只要这份欣赏不变成占有，她们便愿意为帝国唤醒机器。"
 KYO_cws_view_tsukumogami_hijiri:0 "白莲公开承认器物获得灵性后便拥有自己的意志，并为无处可去的付丧神提供不附带皈依条件的庇护。她们因此选择命莲寺，希望一个承认万物皆可成灵的世界能够真正容纳自己。"
 KYO_cws_view_tsukumogami_seija:0 "正邪废除将付丧神列为私产的旧规，并承诺让工坊由劳动者与器物共同管理。对于曾经被使用、丢弃又强迫服从的她们而言，革命终于提供了从所有者手中夺回自身用途的机会。"

