 KYO_cws_target_senkai_approach:0 "恢复正式行政对话"
 KYO_cws_target_senkai_approach_desc:0 "把争论带回有记录的会议，不让宗教分歧继续由街头冲突决定。"
 KYO_cws_target_senkai_respond:0 "保护道教仪式与墓地"
 KYO_cws_target_senkai_respond_desc:0 "停止在仪式场所驻军，并共同处理战时遗体与墓地安全。"
 KYO_cws_target_senkai_proposal:0 "确认人类代表的政治地位"
 KYO_cws_target_senkai_proposal_desc:0 "给出可执行的代表名额与行政权限，而不是含糊的战后承诺。"
 KYO_cws_target_magic_forest:0 "畜生界"
 KYO_cws_target_magic_forest_tooltip:0 "§Y畜生界§!\n代表：饕餮尤魔、吉吊八千慧、骊驹早鬼、天火人血枪、三头慧之子、孙美天\n当前归属：[KYO_cws_magic_forest_owner_status]\n§Y点击查看势力状态§!"
