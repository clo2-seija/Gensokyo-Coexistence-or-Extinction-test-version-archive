l_simp_chinese:
 communism: "共产主义"
 communism_noun: "共产主义"
 democratic: "民主主义"
 democratic_noun: "民主主义"
 fascism: "法西斯主义"
 fascism_noun: "法西斯主义"
 fascism_desc: "极权政体"
 communism_desc: "极权政体"
 democratic_desc: "民主政体"
 conservatism: "保守主义"
 conservatism_desc: "保守主义认为急剧的变革对社会存在潜在的危害，因此其更倾向于维护传统或是开展较为温和的改革，有时甚至提倡复古的道德价值观。"
 liberalism: "自由主义"
 liberalism_desc: "自由主义长久以来秉持着尊重个人自由的哲学传统，其将捍卫这些权利视作国家的首要职能。"
 socialism: "社会主义"
 socialism_desc: "民主社会主义力图依靠改革来建立一个平等的社会主义国家，其目标是废除或者削弱资本主义从民众手中摄取的权力。"
 marxism: "马克思主义"
 marxism_desc: "马克思主义政治学涵盖从经济学到历史观的辽阔领域，力图将卡尔·马克思的理论付诸政治实践。主张阶级斗争以及过渡至生产资料公有制社会是这种意识形态的主要特征。"
 leninism: "列宁主义"
 leninism_desc: "列宁主义是一种基于马克思主义的意识形态流派，其旨在以党领导革命颠覆资本主义社会的方式建立社会主义国家。而在取得政权后，这种意识形态下的政党会通过内部讨论决策的方式执政。"
 stalinism: "斯大林主义"
 stalinism_desc: "斯大林主义是对马克思列宁主义在政治上的继承和发展，其重视快速工业化与集体化，并认为只有强而有力的社会主义政府才能彻底肃清反革命分子。"
 anti_revisionism: "反修正主义"
 anti_revisionism_desc: "反修正主义是一种为反击众多自诩马克思主义继承人的意识形态而产生的流派，其主张保持原始革命理论的核心要素。其主要反对将资本主义经济元素引入社会主义国家，这种意识形态很大程度上通过“什么不是什么”而非“什么是什么”来定义。"
 anarchist_communism: "安那其共产主义"
 anarchist_communism_desc: "安那其共产主义是一种将共产主义理想视为无国家社会的意识形态，其主张跳过具备过渡性质的社会主义国家，倾向于直接建立互帮互助的社会。"
 nazism: "纳粹主义"
 nazism_desc: "国家社会主义植根于极端民族主义，并且受到了日耳曼种族至上理念的推动。其积极推行侵略性扩张政策并主张建立极权国家，在此基础上，人民都将被团结在拥有绝对权力的领袖——元首的领导下。"
 gen_nazism: "纳粹主义"
 gen_nazism_desc: "国家社会主义植根于极端民族主义，并且受到了种族至上理念的推动。其积极推行侵略性扩张政策并主张建立极权国家，在此基础上，人民都将被团结在拥有绝对权力的领袖之下。"
 fascism_ideology: "法西斯主义"
 fascism_ideology_desc: "法西斯主义涵盖了许多极端民族主义的要素，总的来说，其核心理念崇尚对国家的奉献，以及将人民团结在一位强大领袖的领导下。"
 falangism: "长枪党主义"
 falangism_desc: "长枪党主义是一种兼具法西斯主义和保守主义特征的威权主义意识形态，其非常重视民族和天主教的身份认同。"
 rexism: "雷克斯主义"
 rexism_desc: "雷克斯主义是一种强烈反对自由主义及共产主义，同时提倡社团主义经济的坚定的保守民族主义意识形态。鉴于其越来越多地使用民粹主义和威权主义的言辞，他们的理念正与其他法西斯运动相接近。"
 neutrality: "中立主义"
 neutrality_noun: "中立主义"
 neutrality_desc: "威权政体"
 despotism: "专制主义"
 despotism_desc: "专制主义是一种个人拥有绝对权力的政府形式。"
 oligarchism: "寡头政治"
 oligarchism_desc: "寡头政治是一种小部分人拥有绝对权力的政府形式。"
 moderatism: "温和主义"
 moderatism_desc: "温和主义是一种在施政上采取温和姿态或手段来避免极左或极右的政府形式。"
 centrism: "中间主义"
 centrism_desc: "中间主义是一种试图通过符合常识的治理方式解决问题的政府形态，其施政力求在考虑风险和承载力的情况下，妥善解决当前和未来的需求，从而获取公众信任，进而维护共同利益。"
 anarchism: "安那其主义"
 anarchism_desc: "安那其主义（即无政府主义）对威权本身极为排斥，其主张使社会分解为自我管理的自治集体，而非形成统一的中央集权国家。"

buddhist_liberal: "佛教自由主义"
buddhist_liberal_desc: "佛教自由主义，在这一思想中，戒律与人权并列成文，慈悲与自由被视为同一面旗帜的两侧。佛教的「众生平等」被重新诠释为现代公民社会的根本原则，主张个体拥有选择信仰、言论与生活方式的权利，同时必须为自己的业与行为负责。寺院不再只是诵经之地，而是与议会、工会并列的公共空间；法鼓与钟声，与选票与辩论一同构成政治节奏。这条路线企图在钢铁与咒术并存的时代，让制度承担慈悲，让自由不再只是强者的余兴。"

reverse_ideology: "下克上社会主义"
reverse_ideology_desc: "下克上社会主义，它宣称，一切支配与服从都只是暂时的幻象，真正不可动摇的只剩被压迫者对正义的渴望。借由工会、基层自治组织与被驱逐的妖怪群体结盟，这一思潮鼓吹从下往上夺取权力，将旧贵族与陈腐官僚从高位上连根拔除。工厂、庄园与结界内的领地都被视为可重新分配的公共财，红旗与倒置的徽章在街巷间并立飘扬。对其信奉者而言，革命不是一次性事件，而是一场持续翻新的试炼——每推倒一层阶级，就向「无人再被践踏」的世界更近一步。"

vampire_empire: "吸血鬼霸权主义"
vampire_empire_desc: "吸血鬼霸权主义，昔日，吸血鬼曾是西方暗夜无可争辩的主宰，古堡的塔楼比王宫更高，血宴上的祝酒声盖过教堂钟鸣。工业化的阳光与枪火却将血族逼入衰亡边缘，许多古老家族在烟囱与探照灯下化为灰烬，仅存的贵族被迫躲入阴影。于是，残存的血族缔结新的血盟，提出以「高贵血统的生存权」为核心的霸权理论：人类被视为失控的畜群，必须被削减与驱逐，以开辟只属于吸血鬼的永夜领域。红月将是帝国的旗帜，血液是通行的货币，凡敢质疑其统治的人，都会在黎明前悄无声息地从名册上消失。对追随者而言，残酷不是罪，而是维持高贵种族延续的必然手段。"

gensokyo_balance: "幻想乡平衡主义"
gensokyo_balance_desc: "幻想乡平衡主义，自幻想乡被编织出来的那一刻起，八云紫便以一张看不见的天秤衡量万事——恐惧与信仰、繁荣与凋零、人与妖的距离，都必须被限制在狭窄而安全的区间内。这种平衡主义不追求彻底的胜利，也不允许绝对的毁灭；只要秤盘尚未倾覆，妖怪便能在日渐式微的时代继续存活。为了守住这份脆弱的均衡，任何过于极端的梦想，无论来自人间还是妖怪，都会被悄然推回边界之外。"

#buddhist_liberal: "佛教自由主义"
#buddhist_liberal_desc: "融合佛教与自由主义的意识形态，将佛教的理念完全的融合进现代的思想中"
#reverse_idology : "下克上社会主义"
#reverse_idology_desc : "翻转阶级打破旧秩序的牢笼，追寻新世纪该有的新理念"
#vampire_empire : "吸血鬼霸权主义"
#vampire_empire_desc: "吸血鬼原西方世界的霸主，自从工业化后吸血鬼死的死逃的逃，在现今的世界中濒临灭绝，但那高贵的贵族尊严决不会遭卑劣的人类所践踏，他们将会消灭人类获得应属于吸血鬼的生存空间"
#gensokyo_centrism: "幻想乡平衡主义"
#gensokyo_centrism_desc: "自幻想乡建立起来后，八云紫一直奉行著她那套的平衡理论，世界如何的变化，只要平衡维持在，一定的区间中，妖怪们将可在日渐式微的时代中生存，只要没破坏这维持不易的平衡"