 kyo_news.1.t:0 "传说异类突现日本本土"
 kyo_news.1.d:0 "本社急电：今日，大批仅存于传闻中的妖异生物突破不明屏障，现身日本本土并冲击城市。宫中与政府高层震惊失措，警备、交通与社会秩序全面动摇，日本正陷入前所未有的混乱。"
 kyo_news.1.a:0 "妖怪?妖怪存在?"

 kyo_news.2.t:0 "妖怪军团与帝国陆军交战"
 kyo_news.2.d:0 "本报急电：日本各地战线已爆发与异类军势的大规模交战。目击者称，这支由无数非人存在组成的军队并非乌合之众，而是拥有明确指挥、编制与进攻目标的武装集团。前线传来的零碎情报显示，它们似乎共同听命于一位名为八云紫的大妖怪。\n\n军方尚未完全掌握这些怪物的来历、生态与作战方式，但可以确认的是，这并非单纯的骚乱，而是一场为了生存而发动的战争。若无法尽快遏止其攻势，帝国本土的命运，恐将步入极其艰难的局面。"
 kyo_news.2.a:0 "局势正在恶化。"

 kyo_news.3.t:0 "《文文。新闻》号外：帝国崩溃，天皇流亡海外！妖怪之国震动世界！"
 kyo_news.3.d:0 "【文文。新闻／射命丸文 特别报道】\n\n各位读者，请先记住今天这个日子。因为从这一刻起，日本帝国已不再是过去那个能以军队与钢铁决定命运的国家了。\n\n在持续不断的战事之后，帝国陆军最终全面败退。由八云紫统合的大妖怪军势已夺下这片列岛的主导权，而那位曾高坐皇座之上的天皇，也已在最后时刻撤离本土，流亡海外。曾经以为自己能够支配一切的人类国家，如今终于亲眼见识到——当妖怪不再只是传说，而是组织、军队与政权时，究竟会有多么可怕。\n\n世界各国的反应，比战场上的炮火还要快。震惊、恐惧、观望、猜测，一夜之间全都压上了这片新生的妖怪政权。多个国家已紧急派出使节与观察团，试图与新当局建立最初接触。他们想知道，这群非人的胜利者究竟打算如何统治这片土地；更想知道，这场属于妖怪的胜利，是否只会停在日本。"
 kyo_news.3.a:0 "新时代已经开始。"

kyo_news.4.t:0 "《文文。新闻》号外：新大结界工程正式动工！"
kyo_news.4.d:0 "\n\n各位读者，由八云紫主持的新大结界工程，今日正式动工。\n\n旧博丽大结界的损坏已经无法依靠单纯修补解决，而战争又让幻想的范围远远超出过去。山川、都市、地脉与大量新出现的妖力反应，都必须重新纳入计算。八云家因此决定放弃继续延命旧有架构，转而建立一套足以覆盖幻想乡与日本列岛的新结界。\n\n第一批勘测队已经出发。河童与山童将负责工程与器材，各地寺社、妖怪势力及地方居民则被要求协助确认地脉、道路与适合建立锚点的位置。未来数月内，大量鸟居、术式基座与观测设施将陆续出现在列岛各地。\n\n请注意，这些东西不是装饰。\n\n每一处锚点都将成为未来新结界的一部分。一旦工程完成，日本的山岳、城市、海岸与幻想乡原有土地，将第一次被连接在同一套边界之下。\n\n八云紫没有公布确切完工日期。\n\n这也并不令人意外——毕竟我们正在做的，可不是盖一条铁路，而是重新决定『幻想乡究竟到哪里为止』。\n\n至少从今天开始，这个问题已经不再只存在于图纸上。"
kyo_news.4.a:0 "新的边界，从第一座锚点开始。"


   kyo_news.5.t:0 "《文文。新闻》快报：正邪的街头演说，抗议浪潮正席卷幻想乡！"
 kyo_news.5.d:0 "【文文。新闻／射命丸文 特别报道】\n\n各位读者，最近的街头可一点也不安静。鬼人正邪正带着她那张最会把秩序说成笑话的嘴，穿梭于幻想乡各地，对着底层妖怪与人类连番演讲。她说得很直接：战争打完了，可弱小妖怪的肚子没更饱，屋顶没更稳，连“正在消逝”的阴影也还压在头上。于是越来越多人走上街头，高喊口号，挥舞标语，把怒火对准大贤者八云紫主导的新政权。\n\n最有趣的是，这场骚动并不只属于妖怪。连原本沉默的人类，也开始混进队伍里，为配给、治安与明天究竟有没有希望而发声。正邪最擅长的，向来不是给答案，而是把别人心里那句“不对劲”说出口。至于这把火会烧成改革，还是烧成另一场动乱——各位，不妨继续看下去。"
 kyo_news.5.a:0 "街头的风向，开始变了。"

  kyo_news.6.t:0 "《文文。新闻》特报：圣白莲重现尘世，正把活路送到弱者手中"
 kyo_news.6.d:0 "【文文。新闻／射命丸文 特别报道】\n\n各位读者，最近若你在村落、废道、临时安置点，甚至一些原本快被人遗忘的角落里，看见有人在发粮、送药、收容流离失所者，那多半不是偶然。那是命莲寺的人，而站在这条线最前面的，正是那位曾因收留妖怪、宣讲佛法而被封印许久的圣白莲。\n\n她这次归来，可不是只为了把经文念给人听。白莲正亲自带着命莲寺的弟子与信众，把粮食、药品、工具与庇护送往各地。那些原本快被战乱、饥饿与“消逝”逼到尽头的弱小妖怪，如今终于有了可以喘息的地方；而那些同样被卷进乱局的人类，也第一次在这片越来越冷的土地上，看见了不只是征用与命令的另一种力量。\n\n更重要的是，白莲始终在重复同一句话：人类与妖怪，不该只靠恐惧彼此维系。她显然是认真的——认真到愿意把自己重新放回这场风暴中央，去替这个时代硬生生争出一条还能谈和解的路。"
 kyo_news.6.a:0 "至少，还有人愿意伸手。"

   kyo_news.7.t:0 "《文文。新闻》地底观察：古明地觉不问谁赢，只问谁敢伸手进来"
 kyo_news.7.d:0 "【文文。新闻／射命丸文 特别报道】\n\n地上的旗帜换了一面又一面，地底却没有多少兴趣替谁欢呼。地灵殿的古明地觉对此说得很明白：谁赢，她并不在乎。贤者也好，反叛者也好，革命家也好，只要最后的胜者别把手伸进她所控制的地方，别把地底也拖进他们的秩序里，那就足够了。\n\n这并不是冷血，而是一种再现实不过的边界意识。地灵殿见过太多地上的热闹，最后全变成地底要收拾的残渣。觉不相信口号，也不相信什么“新的未来”，她只相信控制权必须握在自己手里。谁若想借战争之名，把统治一路压进地下，那才是真正会让地灵殿开口的时候。"
 kyo_news.7.a:0 "地底自有地底的规矩。"

 kyo_news.8.t:0 "《文文。新闻》林间侧记：妖精们不懂，为何打赢了还要继续打"
 kyo_news.8.d:0 "【文文。新闻／射命丸文 特别报道】\n\n要问这场内战里最困惑的是谁，答案大概会让很多大人物脸上无光——是妖精。她们确实不明白。她们不明白战争为什么开始，也不明白明明已经打赢了、已经把外面的人赶走了，为什么大家还是要举着旗子继续争、继续吵、继续把刀对准自己人。\n\n对妖精来说，胜利本来就该是庆典、是玩闹、是终于能松一口气地到处乱飞。可现在她们看到的，却是更多巡逻、更多争执、更多阴沉的脸。她们不懂什么叫权力重组，也不懂什么叫路线斗争，她们只知道：如果连赢了都不能让日子变好，那这场仗到底是为了什么？说得直白点，恐怕连最小的妖精，都比某些大人物更接近问题本身。"
 kyo_news.8.a:0 "连妖精都看出不对劲了。"

 kyo_news.9.t:0 "《文文。新闻》特别刊载：妖怪山为何仍须备战"
 kyo_news.9.d:0 "【文文。新闻／饭纲丸龙代笔】\n\n妖怪山并不渴望卷入这场争端。对天狗而言，最理想的局势从来不是扩大战火，而是维持边界、保存实力、让山中的秩序继续稳定运作。内战带来的每一次动员、每一次物资调配、每一次防线收缩，都会削弱原本该用于守护山与维持社会的力量。若能不战，自然最好。\n\n但遗憾的是，局势不会因我们的克制而绕开妖怪山。战火一旦逼近，航路、哨站、情报线与山民安全便无法置身事外。天狗可以不主动争夺他人的旗帜，却不能坐视别人替我们决定命运。既然不参战已不再是选项，那么剩下的就只有一件事：以最小的代价，守住必须守住的一切。这不是野心，而是责任。"
 kyo_news.9.a:0 "避战，不等于弃守。"

 kyo_news.10.t:0 "《文文。新闻》竹林传闻：永远亭不问天下，只求战火别烧进门内"
 kyo_news.10.d:0 "【文文。新闻／射命丸文 特别报道】\n\n外头打得热闹，迷途竹林里倒还是那副深不见底的安静。永远亭的态度其实比许多人想的还要简单：八意永琳与蓬莱山辉夜都不打算替任何一边摇旗呐喊。她们既无意争谁来统治天下，也不想替谁的理想买单。对她们而言，只要战火别波及竹林，别扰乱永远亭的秩序，别把麻烦一路抬到门口，那就已经足够。\n\n这份冷淡或许会惹人不快，可说穿了，永远亭从来就不是会为了外界纷争轻易改动自身节奏的地方。她们会看，会听，也会准备必要的应对，但那不代表她们在意谁输谁赢。天下大乱也好，群雄并起也罢，只要别把她们拖下水，竹林深处的月色就仍旧照常。"
 kyo_news.10.a:0 "别把战火带进竹林。"

 kyo_news.11.t:0 "《文文。新闻》彼岸记录：四季映姬面对堆积如山的死亡，只剩无奈"
 kyo_news.11.d:0 "【文文。新闻／射命丸文 特别报道】\n\n战争最不会骗人的地方，终究还是死人。是非曲直厅近日最常见的，不是争论，不是审判庭上的威严，而是一份又一份被送上案头的死亡记录。四季映姬正面对着这些不断堆高的文件，审阅姓名、死因、因果与罪业，仿佛整场内战都被压缩成一页页冰冷纸张，送到她手里。\n\n她当然明白局势正往哪里去，也当然看得出其中有多少愚蠢、执念与本可避免的牺牲。可她的无奈，恰恰也在这里——她能裁决死后的善恶，却不能伸手改写活人的选择。于是她只能继续坐在案前，看着更多名字被送来，看着局势一寸寸滑下去。彼岸知晓一切，却不能替尘世停战；这大概才是这场战争最讽刺的地方。"
 kyo_news.11.a:0 "死亡，还在继续送来。"

  kyo_news.12.t:0 "《文文。新闻》冥界急报：白玉楼快被战死者塞满了？"
 kyo_news.12.d:0 "【文文。新闻／射命丸文 特别报道】\n\n各位读者，若你们还以为战争只是地上的事，那可就太天真了。白玉楼近日迎来的，可不是赏花客，也不是迷路魂，而是一批接着一批、几乎看不到尽头的新亡者。幽灵数量暴增，已经把原本还算清净的冥界搅得再无片刻安宁。\n\n据可靠消息，西行寺幽幽子如今忙得连吃饭的空闲都快没了。是的，就是那位平日最爱把宴席、点心与闲情挂在嘴边的冥界主人，如今却被源源不绝送来的死者拖进了无休无止的安置、分流与处置之中。白玉楼的樱下不再只是风雅景色，而更像一处被战争硬生生推满的终点站。\n\n而比起数量本身，更让人发冷的是这件事背后的意义：内战每拖一日，冥界就更重一分。活人还在争谁该统治幻想乡，死人却早已替他们把后果一批批送到了白玉楼门前。"
 kyo_news.12.a:0 "死者，还在增加。"

 kyo_news.13.t:0 "《文文。新闻》里村见闻：慧音要大家关紧门窗，等风暴自己过去"
 kyo_news.13.d:0 "【文文。新闻／射命丸文 特别报道】\n\n人间之里最近安静得不太正常。街上的摊子少了，夜里的灯火也暗了，孩子们不再随便往外跑，大人则一边压低声音说话，一边把门板钉得更牢。原因嘛，各位也猜得到——在这样的局势下，普通人类能做的事情，实在少得可怜。\n\n上白泽慧音如今几乎把全部心力都放在一件事上：让还活着的人类尽量别被卷进这场越来越大的灾祸里。她要求里中的住户紧闭门窗、减少外出、停止无谓聚集，先把日子缩进屋檐底下，熬过这一段再说。听起来不算光彩？可这已经是她能替人间之里争来的最后一点稳当。\n\n慧音当然明白，光靠躲避并不能解决问题。可当外头是妖怪内战、权力争夺与四处乱窜的恐慌时，一个老师能做的，往往也只剩下替学生与村民把门关好。至于门外那场风暴什么时候停——很遗憾，这恐怕不是人间之里能决定的。"
 kyo_news.13.a:0 "先把门关上。"

 kyo_news.14.t:0 "《文文。新闻》旧账重翻：蕾米莉亚从来不是新起意，她只是等到今天"
 kyo_news.14.d:0 "【文文。新闻／射命丸文 特别报道】\n\n总有人把红魔馆如今的动作，当成局势失控后的临时起意。真可惜，这种看法既天真，又短视。蕾米莉亚·斯卡雷特对幻想乡的兴趣，从来不是最近才长出来的。\n\n据旧日秘闻，这位吸血鬼大小姐第一次踏进幻想乡时，就不是来做客的。她当时便想把这片土地夺过来，想把八云紫与贤者们的规矩一脚踩碎，直接把幻想乡变成红魔馆的领地。结果呢？她输了，而且输得不算体面。真正有意思的地方在后头——八云紫没有杀她，反而放过了她，也正因此，蕾米莉亚才留下过一句不算情愿的承诺：不再继续给幻想乡添乱。\n\n可现在，情况已经不一样了。八云紫死了，旧承诺失去了原本的对象，红魔馆那位大小姐自然也就不打算继续守着过去的分寸。换句话说，这不是野心突然诞生，而是被压住很多年的旧念头，终于等到了重新抬头的时机。各位读者，红魔馆的钟声从来不会无缘无故响起——这一次，也一样。"
 kyo_news.14.a:0 "旧账，现在开始重算。"

 kyo_news.15.t:0 "《文文。新闻》特别报道：从封印中归来的圣白莲，正把慈悲带回战场"
 kyo_news.15.d:0 "【文文。新闻／射命丸文 特别报道】\n\n各位读者，最近命莲寺的风向可和别处不太一样。就在各地不是忙着争权，就是忙着把刀架到别人脖子上的时候，那位传闻中曾因收容妖怪、宣讲佛法而被封印千年的圣白莲，已经重新站回了众人面前。\n\n不过，她可不是只会念经的住持。白莲带回来的不是空话，而是粮食、药品、工具、住处，还有一条让人和妖都能继续活下去的路。那些原本快被战乱、饥饿与遗忘逼到角落的小妖怪，如今正被命莲寺一个个接住。\n\n更重要的是，她并不打算向旧秩序低头，也不准备把幻想乡交给只会用恐惧统治众生的吸血鬼。白莲正在召集信众，反抗暴虐，宣扬佛法，试着把这个快被仇恨撕开的时代，重新拉回“共存”二字上。听起来很难？当然难。可如今还愿意认真去做这件事的人，本来就不多了。"
 kyo_news.15.a:0 "慈悲，也能成为旗帜。"

 kyo_news.16.t:0 "《文文。新闻》街头号外：赤蛮奇说，弱者不是为了当炮灰才活下来"
 kyo_news.16.d:0 "【文文。新闻／射命丸文 特别报道】\n\n各位读者，比起那些总站在高处谈未来的大人物，我最近更想听听街角与水边的人在说什么。比如赤蛮奇。她说自己从来不是什么了不起的大妖怪，能力不够强，胆子也没大到能去伤害谁；很多时候，她只是混在人类里，和今泉影狼一起，卖着若鹭姬从水里抓来的鱼，勉强把日子过下去。那不是英雄的生活，只是弱小妖怪努力不被世界挤掉的活法。\n\n后来，妖怪开始消逝。赤蛮奇说，她亲眼看着比自己更弱小的家伙一点点变淡，于是她信了八云紫那套话——只要向外发动战争，只要把敬畏重新抢回来，她们这些草根妖怪或许就能有一线生机。结果呢？前线最先被推上去的，偏偏还是她们这种最好丢、最不值钱的人。挡枪的是草根妖怪，填线的是草根妖怪，死得没名字的，还是草根妖怪。\n\n而最讽刺的，是仗打完之后，一切也没有真的变好。消逝没有被彻底解决，日子也没回到能让人安心卖鱼、安心活着的样子。影狼的火气越来越重，若鹭姬还是那副温温软软却压着委屈的口气，赤蛮奇则把话说得最直：如果胜利之后，弱者依旧只能继续被拿去换秩序，那这样的秩序，和慢一点的灭亡又有什么差别？"
 kyo_news.16.a:0 "弱者也会记得是谁先把他们推上去。"

 kyo_news.17.t:0 "《文文。新闻》战线终报：命莲寺停止抵抗，白莲与星战死于撤退途中"
 kyo_news.17.d:0 "【文文。新闻／射命丸文 特别报道】\n\n命莲寺一方，终于还是撑到了再也撑不下去的时候。面对数倍于己的兵力与越来越窄的退路，圣白莲下令各部停止正面抵抗，优先护送伤员、信众与平民离开战场。她很清楚，再打下去，只会让更多人死在一场已经没有胜算的战斗里。\n\n可白莲自己没有退。寅丸星也没有。\n\n据最后撤出的幸存者所说，白莲与星亲自留在后方断后，一面维持队伍秩序，一面掩护众人穿过火线。那不是漂亮的殿军，而是一排接一排的枪声，硬生生把人往地上打。白莲先中弹，星还想把她拉起来，下一轮齐射便把两人一并扫倒在路口。\n\n等到命莲寺残部真正脱离包围时，留在原地的，只有再也不会起身的住持，与那位始终站在她身边的弟子。各位读者，慈悲并没有赢，但她们至少让更多人活着逃走了。"
 kyo_news.17.a:0 "命莲寺的旗，倒下了。"

 kyo_news.18.t:0 "《文文。新闻》追踪快报：正邪败退失踪，叛乱火种转入偏远地带"
 kyo_news.18.d:0 "【文文。新闻／射命丸文 特别报道】\n\n鬼人正邪输了吗？若各位问的是正面战场，那答案大概是输了。她没能守住地盘，没能把那些高高在上的大人物全都掀下去，原本聚拢在她旗下的人也在连败之后四散得差不多了。可若各位问的是，这家伙会不会就此认输——哎呀，那可就太看不起她了。\n\n最新消息显示，正邪在主力溃散后已经彻底转入暗处，不再试图维持像样的战线，而是把剩下那点还能用的人手拆成更小、更难抓的影子，往山路、废村、边地与交通稀薄的地方钻。她现在没本事再打一场像样的会战，却很有本事让胜利者夜夜睡不安稳。\n\n烧仓库、截小队、毁路标、散流言、煽动最底层的怨气——这类事情，正邪向来熟得很。她的革命没赢，但她把“别让他们坐稳”这件事留了下来。换句话说，战场结束了，麻烦还没有。"
 kyo_news.18.a:0 "正邪还没死。"

 kyo_news.19.t:0 "《文文。新闻》边界密报：蓝重伤昏迷，橙携其遁入间隙"
 kyo_news.19.d:0 "【文文。新闻／射命丸文 特别报道】\n\n八云家残部的最后崩溃，比许多人想象中还要安静。没有什么壮烈口号，也没有什么非死不可的表演，只有一支被接连击穿、再也撑不起整条战线的队伍，在溃退边缘勉强维持着最后一点秩序。\n\n而这场败局里最让人在意的消息，毫无疑问来自八云蓝。前线目击者称，蓝在掩护撤离时遭受重创，倒下后便再未醒来。她没有当场战死，却也没有任何能够重新指挥部队的迹象。至于橙——那孩子倒是比谁都更像没放弃的人。有人看见她几乎是拖着蓝，一路避开追兵，最后在一道极不稳定的裂缝前消失。\n\n是的，她们躲进了间隙。\n\n这可不像体面的撤退，更像一种被逼到尽头后的暂时藏身。可别急着笑，八云家的麻烦往往最危险在于：你以为它结束了，其实只是暂时看不见。蓝在昏迷中沉着，橙在黑暗里守着，等的恐怕不是安稳，而是下一次能重新伸手的时机。"
 kyo_news.19.a:0 "她们还没真正退场。"

 kyo_news.20.t:0 "《文文。新闻》终局号外：蕾米莉亚殒命，世上在无斯卡雷特"
 kyo_news.20.d:0 "【文文。新闻／射命丸文 特别报道】\n\n红魔馆的终局，终究还是来了。\n\n据战场最后的记录，蕾米莉亚·斯卡雷特在败势已定之后，并没有继续寻找脱身路线。她像是终于接受了那份早就逼近自己的结局，逃向一片还能称作阵地的废墟里，硬是把扑上来的部队撕开了一层又一层。在短短一段时间里制造的伤亡，已经多到足够让任何胜利者在战后沉默一阵。\n\n可再可怕的怪物，也挡不住没完没了的枪列。随着包围收紧，步枪齐射一轮接一轮压上去，火光、烟尘与血混成一片，连怪物也会被钢铁磨碎。最后有人在尸堆与弹壳之间找到她时，看到的不是一句面目全非的遗体，而是仍然散发著威严的吸血鬼尸体。\n\n真是够像她的结尾。华丽，残酷，闹得满地都是。各位读者，红月落下去了，但它落下前，还是把整片夜都染红了。"
 kyo_news.20.a:0 "红月，终于坠落。"

  kyo_news.21.t:0 "《文文。新闻》终局观察：红月赢了，可幻想乡会变成什么？"
 kyo_news.21.d:0 "【文文。新闻／射命丸文 特别报道】\n\n内战结束了，最后站着的人，是蕾米莉亚·斯卡蕾特。红魔馆的旗帜升得很高，街道被重新编进她的秩序里，军队、配给、工坊与领地，也正以一种熟悉又危险的速度，被纳入那位吸血鬼大小姐的掌心。她从来不掩饰自己的想法：弱者需要被统治，混乱需要被压平，而真正有资格替世界定规矩的人，不该是多数，只该是足够高贵、足够强大、也足够敢下命令的那一个。\n\n问题在于，幻想乡真的能承受这种胜利吗？蕾米莉亚的统治当然会有效率，也当然会很有样子。道路会更整齐，命令会更明确，反抗者会更快消失，所有人都会在更短的时间里学会抬头看向同一个方向。可各位读者，这种秩序究竟是新的未来，还是一座被红雾包起来、只准仰望不准发问的巨大牢笼？\n\n她赢了，这是谁都看得见的事实。可她要把幻想乡带去哪里——带去一个真正能长久的帝国，还是带去一个只会越来越安静、越来越整齐、也越来越不能呼吸的夜晚？红月已经升上天了，至于它会照亮道路，还是把所有人都染成同一种颜色，恐怕还得再看下去。"
 kyo_news.21.a:0 "红月之下，没有人能假装看不见。"

 kyo_news.22.t:0 "《文文。新闻》战后特报：白莲赢了，可和平真的会跟着到来吗？"
 kyo_news.22.d:0 "【文文。新闻／射命丸文 特别报道】\n\n圣白莲赢得了这场内战。对许多人来说，这大概是四个答案里最不坏、也最像“希望”的那一个。命莲寺的旗帜并不靠血统，也不靠贵族式威权立起来，而是靠着收容、施粮、讲道、护送与一次次把弱者从地上扶起。白莲口中的未来，不是让谁跪下，而是让人类与妖怪都能活，强者别再把弱者当成随时可以牺牲的填充物。\n\n可问题也恰恰在这里。说和平很容易，带着一群刚打完内战、彼此手上都还沾着血的人走向和平，可一点都不容易。那些支持吸血鬼的人不会一夜之间相信慈悲，那些跟着正邪喊过口号的底层也不会因为几句佛法就放下怀疑，而那些在人间与妖怪之间被撕裂过一次又一次的旧伤，更不会乖乖自己愈合。白莲可以伸手，但她没法替所有人忘记。\n\n所以，各位读者，现在真正的问题并不是“白莲是不是好人”。她当然是，而且好得过分。真正的问题是：在这样一个已经学会用枪和仇恨说话的时代，一位口口声声说着和平的人，究竟是会被时代证明，还是会被时代磨碎？命莲寺的钟声已经响了，可钟声之后，是和解，还是另一场更慢、更苦的修行，这才是所有人都要面对的事。"
 kyo_news.22.a:0 "希望从来不是最轻松的路。"

 kyo_news.23.t:0 "《文文。新闻》号外：正邪胜利，幻想乡终究被颠倒过来了"
 kyo_news.23.d:0 "【文文。新闻／射命丸文 特别报道】\n\n鬼人正邪赢了。是的，各位没看错，最后把旧秩序整个掀翻的，不是那些最会摆排场的大人物，也不是最擅长把规则写成法令的贤者残党，而是那个最喜欢站在高处嘲笑一切庄严口号的天邪鬼。跟着她走到最后的，也大多不是最强的那些人，而是草根妖怪、被压着活了太久的家伙、以及一群终于决定不再替别人垫脚的底层。\n\n这当然意味着变化，而且不是那种换一面旗、换一批官就算完事的变化。正邪带来的东西，从来不是稳定，而是追问；不是把旧秩序擦干净再继续用，而是逼所有人承认，过去那套东西本来就建立在谁有资格吃饱、谁又该默默消失的分配上。对那些一直活在最底下的人来说，这场胜利像一道终于劈开天花板的裂口。\n\n可裂口之后是什么？这才是最让人睡不安稳的地方。正邪会把幻想乡带向真正属于弱者的新世界，还是带向一个永远不停翻桌、永远不肯让任何秩序坐稳的位置？她最擅长的是点火，不是收尾；最擅长的是拆穿，不是安抚。如今她真的赢了，所有人都得开始面对一个谁也答不准的问题——当天邪鬼不再只是反对者，而成了掌舵者，幻想乡究竟会被带去哪里？"
 kyo_news.23.a:0 "被颠倒的不只是王座。"

 kyo_news.24.t:0 "《文文。新闻》战后公报：叛乱被压下了，可八云家的明天又会是什么？"
 kyo_news.24.d:0 "【文文。新闻／射命丸文 特别报道】\n\n内战结束，胜利落到了八云一系手中。对外公布的说法并不复杂：叛乱已经被镇压，幻想乡重新回到了“正确的秩序”之下。那些曾经四分五裂的旗帜被逐一放倒，地方武装被解除、重编或清算，中央的指挥链也再次被缝合起来。许多人对此松了一口气——至少，从今天起，不必再担心明天醒来时，自己头顶上又换了谁的旗。\n\n可各位读者，别忘了，这并不是过去那个还能把一切压在八云紫名字上的时代了。如今被推到前台的，是她留下来的继承者；而站在那孩子身后的，是仍旧冷静、仍旧精确、也仍旧相信秩序必须先活下来的蓝。她们赢得很像一次“拨乱反正”，却也正因为如此，所有人都在看：这究竟是修复，还是延续？是把旧制度补得更稳，还是把那些本该被回答的不满，再一次压回桌底？\n\n叛乱确实失败了，可问题并没有跟着一起死。弱小妖怪怎么活，人类如何被安置，各方势力还剩多少能说话的空间，未来要靠威严、靠制度，还是靠另一种更能让人服气的东西继续走下去——这些问题，一个都还没离开。八云家的胜利让幻想乡暂时安静了下来，可安静之后会走向什么，这才是所有人真正想知道的。"
 kyo_news.24.a:0 "叛乱结束了，答案还没有。"

 kyo_news.25.t:0 "两份报纸，同时转向"
 kyo_news.25.d:0 "今日，《文文。新闻》与《花果子念报》同时刊出关于命莲寺的长篇报道。\n\n射命丸文在文中承认，她最初进入命莲寺，并不是为了理解，而是为了寻找弱点。她想找到白莲的伪善、弟子的失控、账目的漏洞，以及足以让天狗社群在谈判中握住主动的把柄。\n\n然而，她最后写下的却是另一种东西。\n\n『我看见的不是完美。』文在报道末尾写道，『命莲寺里有太多麻烦的人，太多还没愈合的伤，太多随时可能出错的善意。可是她们没有把这些藏起来。她们承认裂缝，然后一寸一寸去补。若这也是虚伪，那这世上便没有什么真实值得被相信。』\n\n姬海棠果则在《花果子念报》中刊出多张照片：响子扶起跌倒的孩子，一轮满身尘土地修梁，娜兹玲冷着脸把多余药品塞回病人手里，星在夜色中替疲惫的记者守门。\n\n她写道：『照片不会替谁说谎。至少这一次，我拍到的不是圣人，而是一群笨拙、疲惫、却真的在照顾别人的家伙。』\n\n两份报纸没有把命莲寺写成无瑕的净土。\n\n也正因如此，许多天狗第一次开始相信，白莲的慈悲并非口号，而是正在艰难运转的现实。"
 kyo_news.25.a:0 "风，正在改变方向。"



