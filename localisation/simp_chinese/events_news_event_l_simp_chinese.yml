 kyo_news.51.t:0 "月都向幻想乡公开宣战"

 kyo_news.51.d:0 "今日，数个主要国家在同一时刻中断正常广播，向幻想乡发布内容完全相同的战争通告。通告将妖怪、神明及一切无法被月都体系解释的生命称为「必须清除的地表污染」，并宣布全面军事行动即刻开始。\n\n宣战发表后，长期隐藏于各国政府与军队中的月人公开接管指挥权。月兔部队进入城市与军事基地，大批月面武器也从封闭设施中运出。各国原有军令系统遭到覆盖，军队开始向幻想乡控制区集结。\n\n幻想乡联军随即进入全面战争状态。八云紫宣布，各方将共同抵抗受月都控制的地表国家，并准备跨越间隙，将战争直接带往月面。\n\n过去数年间发生的政府更替、认知干涉与秘密军备扩张，至此终于显露出共同源头。月都不再隐藏于地球各国身后，一场横跨地表与月面的战争已经开始。"

 kyo_news.51.a:0 "世界正在记录这一刻。"


 kyo_news.52.t:0 "地表月都控制网被解除"

 kyo_news.52.d:0 "今日，最后一个受月都控制的主要国家停止接收月面命令。其军事指挥系统恢复独立，各地用于传送认知频率与远程军令的设施也相继关闭。\n\n随着政府机关与秘密基地被接管，大量封存资料开始公开。记录显示，多国首脑与军方高层曾遭到替换，反对月都干涉的官员则被秘密拘押或从公共记录中删除。隐藏于地表的月人部队失去统一指挥后，已经陆续投降或撤离。\n\n幻想乡联军由此完成地表战线的解放。被控制的国家重新取得自主权，月都也失去了从地球获取兵力、工业与情报的主要渠道。\n\n然而，月面防线仍未完全崩溃。地表的战争已经结束，决定月都未来的战斗仍在继续。"

 kyo_news.52.a:0 "世界正在记录这一刻。"


 kyo_news.53.t:0 "幻想乡联军取得月面胜利"

 kyo_news.53.d:0 "来自月面的消息证实，幻想乡联军已经击败月都主要防御力量。\n\n远征军通过博丽神社后方的巨型间隙登陆月海，在连续多轮战斗中夺取补给节点、空间通道与城外防线。月兔主力被迫后撤，长期被视为无法突破的净化结界也在八意永琳与八云蓝的协助下失去作用。\n\n联军现已控制通往月都城区的主要道路，月面防卫体系则失去发动大规模反攻的能力。第一次月面战争中惨败撤退的幻想乡，终于重新踏上了月都城墙前方。\n\n这场胜利尚未自动结束地表残余战事，也没有决定月都战后的政治安排。但它已经证明，那座高悬于地球之外的纯净之都并非不可接近，更非不可战胜。"

 kyo_news.53.a:0 "世界正在记录这一刻。"


 kyo_news.54.t:0 "月都纯化派失去统治权"

 kyo_news.54.d:0 "随着地表控制网与月面防线同时崩溃，统治月都的纯化派已经失去全部主要军事与行政权力。\n\n纯化院曾试图启动最终净化，要求守军焚毁遭到联军接触的城区，并销毁地球控制记录。此举遭到大量月兔、管理者与月都反对派拒绝。宫城控制节点随后从内部开放，剩余守军也停止抵抗。\n\n绵月姊妹已经交出月面防卫队指挥权，纯化院、极端军法机关及其直属武装则被解除。幻想乡联军接受军事投降，并宣布不会因出身而集体惩罚月都居民与普通月兔。\n\n月都本身并未遭到毁灭，但那个以纯净为名干涉地球、排除异议并决定其他生命是否有权存在的政权，已经正式终结。"

 kyo_news.54.a:0 "世界正在记录这一刻。"


 kyo_news.55.t:0 "永琳与辉夜返回月都主持重建"

 kyo_news.55.d:0 "在月都旧政权垮台后，八意永琳与蓬莱山辉夜已经通过八云紫开启的间隙返回月面，并开始主持战后重建。\n\n作为月都早期制度与城市体系的建立者之一，永琳接管了医疗、司法与维生设施，避免行政体系在政权更替中彻底停摆。辉夜则以月之公主的身份组织过渡议会，保护月兔、地表出生者与过去遭到纯化院迫害的居民。\n\n新当局宣布解散纯化院与极端军令体系，废除以纯净程度划分居民资格的制度，并继续拆除遍布地球的观测、控制与认知干涉网络。月都科技、神祇与文化将得到保留，但不得再被用于决定其他世界是否有资格存在。\n\n永琳与辉夜强调，她们的回归并非恢复旧宫廷，而是要让最初作为避难所建立的月都，第一次真正容纳那些曾被它排除的人。"

 kyo_news.55.a:0 "世界正在记录这一刻。"




   kyo_seija_news.1.t:0 "月都特遣队降临地球"
  kyo_seija_news.1.d:0 "来自月面的军队已经在地球建立占领区。月军迅速控制交通与军事节点，并向周边政府提出服从条件。愿意合作的旧统治者可以保留职位，但外交、军备与关键资源将由月面官员掌握。\n\n月都方面将此次行动称为对地球秩序的必要接管，部分政府则宣称接受高阶文明管理能够避免更大伤亡。各地反抗组织已经开始活动，一场跨越地球与月亮的战争正在形成。"
  kyo_seija_news.1.a:0 "月亮第一次将统治伸向整个地球。"
  # 事件概况：月都殖民战争公开化的世界新闻，应在月军势力实际生成时触发。
  # 新闻方向：保持冷静第三人称，强调征服与政治接管，不使用紫线的灭绝或净化设定。

  kyo_seija_news.2.t:0 "幻想乡向月面占领军宣战"
  kyo_seija_news.2.d:0 "鬼人正邪领导的幻想乡政府已经拒绝月都提出的服从条件，并宣布与一切反抗月面统治的地球力量共同作战。幻想乡同时通过《翻转世界决议》，否认月都拥有替地上生命决定政治地位的权利。\n\n更令人意外的是，月都高层出身的稀神探女也在决议上签名。月都方面随即将其定性为背叛，并警告任何援助幻想乡的国家都将被视为敌对势力。"
  kyo_seija_news.2.a:0 "地上的反叛者把矛尖指向了月亮。"
  # 事件概况：正邪宣战与探女签署决议合并成一则世界新闻。
  # 新闻方向：突出地月政治等级受到挑战，以及探女公开倒向地球造成的震动。

  kyo_seija_news.3.t:0 "反抗思想在月兔部队中扩散"
  kyo_seija_news.3.d:0 "月都军方承认，数支月兔部队出现拒绝命令、逃亡与隐瞒反抗者的行为。未经许可的传单和地球广播抄本也在军营及运输单位中被发现。\n\n这些材料宣扬一种被称作翻转主义的思想，主张下位者有权质疑并推翻压迫自己的高位者。月都已经展开大规模搜查，幻想乡则否认自己正在建立新的月面附属政权，声称月都的未来应由当地反抗者自行决定。"
  kyo_seija_news.3.a:0 "服从不再被视为月兔唯一的命运。"
  # 事件概况：翻转主义传播达到世界可观察规模后的新闻事件。
  # 新闻方向：让外界第一次确认月都内部出现阶级反抗，避免只写成幻想乡单方面宣传。

  kyo_seija_news.4.t:0 "地月战局发生逆转"
  kyo_seija_news.4.d:0 "月都原本即将完成的镇压行动突然陷入混乱。多支月兔部队在同一时期倒戈，地球抵抗军重新接通运输线，并对月军指挥节点发动反击。\n\n外界无法确认这场逆转究竟来自情报失误、内部叛乱还是某种月面能力。可以确定的是，月都已经失去此前掌握的主动权，而幻想乡与月面反抗组织正将战线推向月都本土。"
  kyo_seija_news.4.a:0 "被预告的失败没有到来。"
  # 事件概况：探女与正邪共同逆转败局后的世界新闻。
  # 新闻方向：外界只看见结果，不公开探女能力的完整运作，使私人事件仍保有独特信息。

  kyo_seija_news.5.t:0 "月都的高位秩序崩塌"
  kyo_seija_news.5.d:0 "月都维持殖民战争与血统等级的主要机关已经被反抗者接管。驻扎地球的月军失去合法指挥来源，各地合作政府也相继宣布脱离月面控制。\n\n鬼人正邪拒绝成为月都的新统治者，并支持月兔、普通居民及反战者建立新的政治组织。地球与月亮之间延续已久的高低关系由此被打破，但新秩序究竟会走向何处，仍无人能够给出答案。"
  kyo_seija_news.5.a:0 "月亮被迫抬头看向地上的众生。"
  # 事件概况：正邪路线完成后的世界终局新闻，可与超级事件同时触发。
  # 新闻方向：宣布殖民与等级体系瓦解，同时保留革命之后仍需继续建设的开放结局。