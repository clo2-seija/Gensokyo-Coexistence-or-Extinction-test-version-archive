l_simp_chinese: 

KYO_miko_death:0 "巫女之死"
KYO_miko_death_desc:0 "清晨的博丽神社本该有扫帚声与符札燃尽的灰，今天却只有风。御币倒在石阶旁，结界的气息忽明忽暗，像是有人把整座幻想乡最重要的「保险栓」拔走了。\n\n第44代博丽巫女的死亡来得太突然，没有预告、没有仪式、没有任何能被称作正常的征兆。她为何而死？死于何人之手？每一个问题都像针一样刺进人心。\n\n幻想乡长久维持的平衡，向来靠巫女站在最前线把异变按下去。如今巫女不在了，所有人都在同一件事上达成沉默的共识：如果连她都能被如此干净地抹去，那下一个轮到谁，没有人敢保证。"

KYO_resure_the_order:0 "维持幻想乡的秩序"
KYO_resure_the_order_desc:0 "巫女死后，恐慌不是用尖叫传播，而是用停摆传播。\n\n天狗的报纸不再送到人里，流言因此成了唯一的「新闻」；河童停下工程，说材料要重新核算，实际上是谁也不想在局势不明时把家底押出去；妖精不再在路边闹腾，反而四处躲藏，像连他们都嗅到不对劲。\n\n人里的商铺开始拉下门板，寺子屋暂停授课，夜雀食堂也挂出歇业的牌子。人们不再讨论明天要买什么，而是在盘算今天该囤多少。\n\n如果放任这种停摆扩散，幻想乡会先从日常崩塌，接著才是冲突。我们必须立刻恢复基本运作：重新建立传递讯息的渠道、安排巡查与护卫、确保粮食与物资能进出人里，同时对外公开宣布临时处置方案。\n\n不需要每个人都相信我们，但至少要让每个人都知道，幻想乡还有人在主持局面。"

KYO_investigate_miko_death:0 "调查巫女之死"
KYO_investigate_miko_death_desc:0 "博丽巫女死在结界柱前，没有伤口，没有挣扎，也没有任何人看见她如何倒下。七步之内的尘土、苔藓与微小生灵尽数消失，大结界却仍回报一切正常。\n\n应变委员会将从所有仍可追查的方向展开调查。八意永琳负责检验遗体，逐项排查药物、毒物、器械、疾病与术式污染；古明地觉将重新勘查神社，寻找残留的心念、恐惧与被刻意掩藏的动机；射命丸文则动用天狗的情报网，追查巡逻路线、目击者与每一条无法确认来源的流言。\n\n然而，这场调查从一开始便面对同一个问题：现场并不是线索太少，而是干净得不应如此。没有证人，没有凶器，没有可靠的死因，也没有任何能证明外敌曾经进入神社的痕迹。\n\n紫不在意又一任巫女走到了生命尽头。她在意的是，有某种存在能在博丽大结界的核心附近取走一条性命，却让结界、式神与所有观测者都相信什么也没有发生。\n\n这次调查未必能找到凶手。但只要能确认究竟缺少了什么，我们或许就能知道，自己正在面对何种敌人。"


 KYO_jiejiechuxianliekou:0 "结界出现不可忽视的裂口"
 KYO_jiejiechuxianliekou_desc:0 "裂口不是传闻，而是被所有人亲眼看见的异常。妖怪山的边缘先出现不自然的空白，博丽神社周边的结界反应开始不稳，巡查者回报同一件事：有些地方的「界线」变薄了，像被硬生生削去一层。\n\n巫女的离奇死亡尚未查明，暗处的势力仍在活动，而贤者们所维系的幻想乡结界却先一步受损。裂口带来的不是外敌的脚步声，而是外界的「知识」渗入。那些本不该出现在幻想乡的概念、技术与记录，开始在缝隙边缘扩散。\n\n对妖怪而言，这比刀剑更致命。外界的知识会改写人类的理解方式，让「恐惧」「敬畏」「传说」逐渐失效。当人类不再把妖怪当作必须被理解或避开的存在，妖怪就会失去立足的根。消逝不是一瞬间的死亡，而是从力量变弱、存在感稀薄、到最后被世界遗忘。\n\n我们必须搁置对巫女死亡的调查。比起追查巫女之死的真相，眼前更紧迫的是整个妖怪族群的生存危机。贤者将启动紧急封堵计划：封锁裂口周边通行、派遣天狗进行高空巡查、由河童投入工程与器具支援，并在关键节点加固结界反应。\n\n巫女之死的调查必须延后。不是因为不重要，而是因为如果结界先崩，真相也将失去意义。现在要做的只有一件事：先让幻想乡活下来。"

 KYO_suoyourendubixuhuoxiaqu:0 "所有人都必须活下去"
 KYO_suoyourendubixuhuoxiaqu_desc:0 "裂缝扩大了。不是「可能」，不是「正在观察」，而是已经在扩大。\n\n它撕开的不是一段空间，而是幻想与现实的规则边界。空气里开始流动外界的尺度与定义，像无形的刀把幻想乡最珍贵的东西一片片刮走。对人类而言，顶多是觉得天色怪、梦境乱、夜路特别冷；但对妖怪而言，那是生存根基正在被抽离。\n\n妖怪并不是靠面包与水活著。妖怪的「存在」本身需要被感知、被命名、被记住。恐惧、信仰、敬畏，并非装饰品，而是让妖怪在世界上站得住的重量。\n\n恐惧让人类在看见阴影时停步，于是阴影就有了形。\n信仰让人类在祈祷时抬头，于是神与怪就被固定在故事里。\n敬畏让人类承认「有些事超出理解」，于是那些超出理解的存在不会被轻易抹去。\n\n然而现在，这三样东西正在变淡。不是因为人类变勇敢，而是因为外界的知识在裂缝边缘扩散，把一切都改写成可解释、可计算、可被无视的现象。当人类不再害怕、不再相信、不再敬畏，妖怪就不是被杀死，而是被「遗忘」。消逝会从小处开始：力量衰弱、轮廓模糊、名字被遗忘，直到连「曾经存在」都无人能肯定。\n\n弱小者最先崩溃。妖精彻夜失眠，醒来却忘了自己的笑声；山野的小妖无法现形，只能像雾一样散；有的甚至出现记忆错乱与存在漂移，昨天还被看见，今天就像从未出现过。\n\n更可怕的，是死亡也开始失序。白玉楼的风向变了，亡灵的队伍不再按季节与仪式流动。有人在夜里看见不该出现的影子回到村口徘徊，听见没有嘴唇的低语在屋簷下重复名字。幽魂像是被扯住了线，既不能安息，也不能离开，只能在裂缝附近聚集，越聚越多，像要把生与死的边界一同拖垮。\n\n幻想乡正在进入倒数计时。这不是战争前的紧张，而是世界本身开始改写我们。\n\n现在，是贤者们与强者必须站出来的时候。因为只有强者还能撑住形体，只有贤者能看见规则正在如何崩塌。\n\n不论出身、恩怨或立场，所有人都必须活下去。不是一句口号，而是一条底线。若我们彼此撕咬、各自为政，裂缝就会吞掉弱小者，接著吞掉中等者，最后连强者也只剩空名。\n\n如果我们做不到，这片土地不会壮烈毁灭，它会更残酷地安静下来，变成下一个「遗忘之地」。人类照常生活，却再也想不起妖怪；亡灵在无声里漂浮，却再也等不到送行；而幻想乡会在没人察觉的瞬间，从世界的记忆里被擦掉。"

 KYO_yinqinaidexiangfa:0 "以后户绕过裂痕"
 KYO_yinqinaidexiangfa_desc:0 "隐岐奈没有试图直接缝合裂口。\n\n在她看来，既然原有的道路、方位与内外关系正在失效，那就没有必要继续依赖那些已经错乱的连结。她以后户接通受损节点，在裂口两侧建立临时通道，让测量人员、救援队与物资能够绕过崩坏区域。\n\n这个方法很快见效。数处被截断的聚落重新取得联系，原本困在错乱道路中的居民也得以撤离。即使某段结界完全失去方向，后户仍能从其他位置将人送出。\n\n然而，后户只能替代道路，不能修复道路本身。\n\n每增加一道临时入口，大结界内便多出一处不受原有结构约束的连结。部分后户开始出现偏移，昨日仍通往妖怪山的入口，今日却可能打开在迷途竹林深处。隐岐奈可以不断关闭错误的门，再重新开启新的门，但她无法保证下一次偏移会发生在哪里。\n\n她成功维持了幻想乡各地之间的往来，却也让整个结界变得更加复杂。\n\n这不是修复，只是在道路消失以前，先替所有人留下一条能走的后路。"


 KYO_bayunzidefangfa:0 "以间隙重定边界"
 KYO_bayunzidefangfa_desc:0 "八云紫选择直接处理失控的边界。\n\n她将出现偏移的区域逐一隔离，以间隙切断裂口与周围结界的连结，再把累积的压力转移到尚能承受的节点。只要异常不再继续扩散，大结界便能获得重新稳定的时间。\n\n最初几次处理十分成功。裂口停止扩张，混乱的道路重新恢复方向，部分节点甚至在测量中回到了原本的位置。对旁观者而言，紫似乎再次证明了自己仍能掌控幻想乡的边界。\n\n可蓝很快发现，被转移的压力并未消失。\n\n一处裂口被封闭，另一处节点便会出现新的偏差；一段边界被重新固定，附近的土地就可能承受更强烈的扭曲。紫每一次动用能力，都只是在整个大结界内重新分配崩坏的位置。\n\n更严重的是，部分裂口已经开始拒绝被定义。它们既不完全属于幻想乡，也不通往外界，紫甚至无法以『内』与『外』将其分开。\n\n她依旧可以延缓危机，也依旧能保住最重要的节点。\n\n但她所做的一切，更像是把即将崩断的绳索一次次重新打结。结仍然撑著，纤维却正在每次拉扯中变得更薄。"


 KYO_cimuhuashandeyijian:0 "以众生系住土地"
 KYO_cimuhuashandeyijian_desc:0 "茨木华扇认为，大结界并不只是一道由术式构成的墙。\n\n幻想乡的山川、道路与聚落之所以能保持原本的位置，是因为长久居住于此的人与妖怪仍然认得它们。只要一条河仍被沿岸居民呼唤，一片森林仍有妖怪巡行，一座神社仍有人打扫与祭祀，那片土地便不容易从结界中脱落。\n\n她召集各地的土地神、野兽、仙人与居民，重新标记道路、河流与聚落边界。守护者必须每日巡视固定路线，居民则反复确认地名、方向与彼此之间的联系。那些已经出现偏移的地方，被石碑、绳结与地方仪式重新固定。\n\n这个方法确实让数处节点恢复稳定。\n\n但它太慢，也需要太多人手。每一处节点都必须长期驻守，一旦巡守中断，先前压下的偏差便会再次出现。部分居民也开始疲惫，没有人能永远守在同一条道路旁，不断证明那条道路仍然存在。\n\n更糟的是，有些土地已经失去回应。无论华扇带多少人呼唤地名、重走旧路，测量结果仍然持续偏移，仿佛那里已不再承认任何人的记忆。\n\n华扇的方法能让尚未完全崩坏的地方重新站稳，却无法把已经失去的部分拉回来。\n\n她保住了土地与居民之间的联系，但能被守住的地方，正一天比一天少。"


 KYO_sanxianzheda_Chenggongshi:0 "三贤者的最后共识"
KYO_sanxianzheda_Chenggongshi_desc:0 "三种修补方案都已付诸实行。\n\n八云紫以间隙重新划定边界，隐岐奈以后户绕过失效的道路，茨木华扇则召集居民与地方守护者，试图以长久累积的认知重新固定土地。\n\n她们确实延缓了崩坏。\n\n但没有任何一种方法真正治好了博丽大结界。\n\n被紫封闭的压力会在其他节点重新出现；隐岐奈建立的通道也开始受到座标偏移影响；华扇勉强固定的土地，只要巡守与确认稍有中断，便会再次失去位置。结界的灵力仍在，术式也没有完全毁坏，可支撑整体架构的关系已经开始彼此脱离。\n\n三位贤者最后得到同一个结论。\n\n这座大结界已经无法恢复原状。\n\n幻想乡需要一座新的结界。它必须重新确定内外、重新连结土地与居民，也必须避免再次把整个世界的存续压在单一巫女与单一术式之上。\n\n然而，新结界不可能在短时间内完成。设计、测量、材料与重新固定各地节点，都需要数月，甚至更久。幻想乡未必能撑到那一天。\n\n妖怪的力量正在减弱。不是因为她们遭到击败，而是因为外界的否定正透过裂口渗入。当更多人将妖怪视为不存在的迷信，幻想乡中的妖怪便会逐渐失去维持自身的根基。\n\n要让她们撑下去，就必须从外界取得新的敬畏。\n\n让更多人知道妖怪确实存在。让城市记住红雾，让军队记住黑夜里的身影，让每一条道路、每一份报纸与每一场无法解释的失败，都证明幻想并未死去。\n\n华扇不喜欢把恐惧当作生存工具。隐岐奈也清楚，一时的震慑无法取代真正稳固的新架构。紫则没有替这条道路辩护。\n\n她只问了一个问题。\n\n『等新结界完成以前，还会剩下多少妖怪？』\n\n没有人回答。\n\n于是三位贤者达成共识：先让外界重新畏惧妖怪，先让幻想乡获得继续存在的时间。\n\n日本将成为第一个被迫承认幻想的国度。\n\n这不是最好的答案。\n\n只是她们已经没有时间等待更好的答案。"

 KYO_xianzhezhengqiujumindeyijianyubangzhu:0 "§R百妖协议§!"
 KYO_xianzhezhengqiujumindeyijianyubangzhu_desc:0 "裂口扩大后，贤者们终于承认一件事：结界的设计可以由少数人完成，但结界的「存续」不可能靠少数人硬撑。\n\n八云紫的方案需要跨越外界，需要长期动员，需要情报、医疗、工程、秩序与民心。这不是一场只靠妖力就能解决的危机，而是一套要能持续运转的体系。若红魔馆不出兵，威慑不成；若永远亭不供应药与后勤，崩溃会先从内部开始；若妖怪山的天狗不建立监控与通讯，任何行动都会在黑暗里失控；若河童与山童不把工事、器材与补给线搭起来，战争只会是短促的爆发；若白玉楼不稳住幽界，亡灵异常会拖垮整个世界的边界；若地灵殿不控制地下与情绪崩溃，恐慌会先把幻想乡撕裂；若是非曲直厅不立下规范与裁决，各势力的动员很快就会变成互相吞噬；若人间里不维持生活与教育，恐惧与信仰会加速蒸发；而那些无名的草根妖怪若被放弃，幻想乡的根就会先空。\n\n更重要的是，贤者们不能再用「守护者」的身份替所有人做决定。这场灾难关乎每一个族群的存在，任何牺牲与选择都必须被看见、被承担、被分摊。于是她们启动「百妖协议」，成立幻想乡应变委员会，公开征求各势力的意见与承诺，并以任务制重新分配责任。\n\n从红魔馆的高墙到永远亭的竹林，从人间里的寺子屋到白玉楼的幽界门扉，从妖怪山的天际巡查到地底的地灵殿，贤者亲自走访、亲自谈判、亲自把散落的力量一一拉回同一个方向。\n\n这不是团结的宣言，而是生存的底线。幻想乡要先成为一个能共同作战的整体，才有资格把手伸向外界，去阻止那股正在抹去一切的现实逻辑。"



 KYO_zhunbeijiuxu:0 "战争准备就绪"
 KYO_zhunbeijiuxu_desc:0 "百妖协议落笔的那一刻，幻想乡不再只是「等待被侵蚀」的受害者。天狗的监控与通讯已铺开，河童与山童的器材与地下网开始运转，永远亭的药与补给进入配发流程，白玉楼稳住幽界的异常潮汐，地灵殿把恐慌压回深处，是非曲直厅立下行动准则，人间里也把秩序与动员重新接上轨道。\n\n现在，轮到计划的第一步。\n\n贤者们一致同意，对外界的第一击不能是全面战争，而必须是能测出人类反应速度、军警协调能力、通讯结构与舆论扩散方式的「试探」。东京被选为目标，不是因为它容易，而是因为它能决定日后的战争要用什么形态打下去。只要掌握东京的枢纽，后续行动就有落脚点，有补给线，有情报源。\n\n红魔馆的领主蕾米莉亚·斯卡雷特主动请缨。她把这次行动视为宣告，也视为测试。她将派出红魔馆的特种作战部队作为先头矛尖，在外界尚未理解发生什么之前先行渗透东京地区，夺取关键节点并建立长期运作的据点。\n\n咲夜负责把作战切成精准的分钟表，确保突入、撤离、补给与掩蔽全部可控；帕秋莉提供术式支援与反制准备，让小队能对付突发的现代火力与监控；红魔馆的行动队则负责占领港口与铁道交会处、切断警备调度、夺取通讯与行政中枢的关键资料，同时建立一套可持续的暗线与接应点。\n\n这次入侵的目的并非立刻引爆全面冲突，而是把战场的门锁换到我们手上。等东京落下第一枚钉子，幻想乡就不再只是被裂口逼到墙角的世界，而是能主动选择下一步的力量。"



 KYO_yaoguaideshengcunzhizhan:0 "妖怪的生存之战"
 KYO_yaoguaideshengcunzhizhan_desc:0 "幻想乡的时间已经不多了。裂口持续扩张，灵力波动越来越不稳，消逝不再是零星现象，而是正在蔓延的结局。\n\n幻想乡的时间已被逼到墙角。越来越多妖怪开始出现「存在松动」的征兆：形体不稳、记忆断裂、影子变淡，连同伴的呼唤都会在半空中失去回音。更糟的是，冥界的秩序也在动摇，亡灵不再循路而行，徘徊者增多，幽界的边界变得尖锐，仿佛随时会把生者的世界割开。\n\n贤者们已无余裕再争论细节。先头行动已启动，东京方向的火光与警报迟早会传遍整个日本，而一旦政府完成动员、外界的军工体系开始转动，这场冲突就不再是局部摩擦，而是会被全世界注视的全面战争。\n\n妖怪的军队因此集结成形，不再只是各自为战的部族。红魔馆的特种部队负责突入与斩首，时间的精密调度与魔法的火力计算被纳入同一张作战表；妖怪山的天狗撑起高空侦察与情报网，让每一次推进都建立在掌握与速度上；河童与山童把工坊、隧道、储备与运输连成一条线，确保前线能持续作战；地灵殿则在后方建立心灵防线，由觉读出恐慌的源头、由恋压住失控的潜意识，让部队不会在开战前先被「我将消失」的恐惧击溃；白玉楼与幽魂部队守住亡灵异常的缺口，避免战场被幽界的混乱吞没。\n\n但必须说清楚：战争一旦开启，得到的不是荣耀，而是堆叠成山的伤亡、被夷平的城镇、被迫迁徙的人群、无法回收的仇恨。恐惧会被重新制造，信仰会被迫选边，敬畏会被铁与火刻进日常。每一座工厂的增产、每一次补给的抵达、每一段防线的守住，都会有人倒下，更多人被拖进长期的痛苦里。\n\n妖怪们并非为了征服而战。她们是为了不被现实的冷硬规则抹去，为了让传说仍能被说出口，为了让名字仍能被记住。从这一刻起，胜负不只决定领土与政权，也决定幻想乡是否还能被称为「存在」。"

 

 KYO_shenglizhihoudeyaoguaihuiyi:0 "胜利之后的妖怪们"
 KYO_shenglizhihoudeyaoguaihuiyi_desc:0 "东京的火还没完全熄。被轰塌的楼群像折断的骨架，街道上堆著碎石、废铁与被遗弃的文件，偶尔还能听到远处电台断续的杂讯。战争确实结束了，外界也确实被迫承认：妖怪不是传说。\n\n但胜利带来的不是「安稳」，而是一张更难的考卷。前线的部队需要撤换与整编，补给线要重新铺回来；工厂要复工，港口与铁路要修；治安要接手，粮食要调度；伤病要安置，俘虏与难民要处置；更棘手的是，幽界也跟著乱了，战场残留的怨念像雾一样黏在城市边缘，部分亡灵拒绝离去，甚至开始成为「怨灵」。\n\n于是，贤者召开了战后第一次总会议。会议地点选在一座被临时接管的政府大楼，墙上还残留著旧时代的徽记，如今被新挂上的旗帜遮住。长桌两侧坐满了人，没有谁真正信任谁，但每个人都知道：如果这张桌子散了，下一场冲突会在战后的废墟里立刻点燃。"



 KYO_zhanzhengdongyuan:0 "幻想乡的缔造者"
 KYO_zhanzhengdongyuan_desc:0 "\n八云§0紫§!\n\n幻想乡的缔造者\n\n将用间隙的力量\n\n让所有人知道\n\n幻想乡\n\n是不灭的。"

 KYO_souguadijuncangku:0 "最佳劳工:八云§B蓝§!"
 KYO_souguadijuncangku_desc:0 "\n八云§B蓝§!\n\n八云§0紫§!的式神\n\n将动用她最大的大脑\n\n让全幻想乡知道\n\n秩序\n\n将永远存续。"

 KYO_kuochongshebei:0 "最棒劳工:§8橙§!"
