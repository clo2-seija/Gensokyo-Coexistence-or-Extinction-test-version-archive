  KYO_the_reform_meeting:"妖怪军事重组"
 KYO_the_reform_meeting_desc:"自古以来，妖怪凭借异能、怪力与漫长岁月积累下来的经验，足以轻易摧毁村落与城镇。单一的河童，能击沉一艘木船；一位天狗，能翻越百里山河送回情报；即便最弱小的妖精，也能让普通人心生惧意。\n\n然而，那终究是属于个体逞威的时代。如今的外界，人类以钢铁、火药、工业与纪律将战争推向了全新的层次。再强大的妖怪，也难以单凭一己之力撼动一支训练有素、协同作战的现代军团。\n\n若幻想乡的军队依旧停留在松散、杂乱、各自为战的旧样子，等待我们的只会是被洪流碾碎的结局。为了在这个时代活下去，幻想乡必须舍弃旧有的散兵体系，把分散各地、习性迥异的族群与势力，重新统合为一支能够正面迎战外界的正规军。这不仅是军制的重组，更是从组织到思维的全面蜕变。唯有如此，幻想乡才能真正拥有与这个时代对抗的资格。"

 KYO_army_mercenary:"收编妖怪雇佣军"
 KYO_army_mercenary_desc:"从零开始建立一套完整军务体系，让所有妖怪都纳入同一套指挥链，这并非做不到，只是在战火已经逼近的当下，这是一条漫长而充满阻力的路。\n\n相比之下，直接将现有的准军事组织、地方武装与雇佣兵团收入麾下，吸收她们成熟的作战经验与现成结构，显然更加现实。这些部队虽然各怀心思、难以彻底驯服，但她们经历过无数血战，懂得如何活下去，也懂得如何让敌人死去。\n\n只要以资源、补给与地位换取她们的效忠，就能在最短时间内让幻想乡的军队成形。她们也许永远带着雇佣兵的粗粝气息，但眼下，我们需要的是能够立刻出鞘的刀锋，而不是还在锻炉中等待成形的剑。"

 KYO_army_reform:"建立全新的妖怪正规军指挥体系"
 KYO_army_reform_desc:"从零开始重建军队体系固然困难，却是为幻想乡未来奠基的唯一道路。妖怪虽然能力、性格与出身各不相同，但只要引入一套严密而高效的制度，训练与纪律就足以将这片混沌的力量凝聚成真正的军势。\n\n这条路意味着磨合、阵痛、反复训练与对旧习的彻底改造。可一旦这支新军成形，幻想乡便不必再单纯依赖恐惧维持威势，而能以秩序、协同与灵力铸成钢铁洪流。\n\n那将是一支真正属于幻想乡的军队，足以在任何战场上与任何敌人正面对抗。"

 KYO_army_for_future:"为了未来的军队"
 KYO_army_for_future_desc:"幻想乡的战场正在改变。枪火、钢铁、爆炸与机动化部队，已不再只是外界的遥远景象，而是我们必须面对的现实。\n\n若想在未来的战争中立于不败，军队就必须继续完善体系、补足短板、吸纳新战术，让自己能够对抗这个时代最致命的兵器。未来的军队不只是冲锋的工具，而是幻想乡赖以存续的根骨。\n\n它必须能抵挡坦克与火炮，也必须能在最残酷的消耗战中维持秩序与杀伤。只有这样，幻想乡才有资格谈论未来。"

 KYO_army_bug_youkai:"招募昆虫系妖怪"
 KYO_army_bug_youkai_desc:"在人类尚未统治大地的远古时代，真正的霸主并非哺乳兽，而是翅翼遮天、甲壳反光的昆虫。时代更迭之后，她们的体型虽已缩小，但那份来自古老时代的残酷、韧性与群体性仍未消失。\n\n昆虫系妖怪最擅长的，不是单打独斗，而是如潮水般涌上战场，以数量、耐力与压迫感撕开敌阵。她们的甲壳如同天然铠甲，振翅声则像死亡来临前的前奏。\n\n只要整编得当，这些昆虫妖怪就能在现代战争中重新找回属于自己的位置，用数量与顽强把敌人压垮。"

 KYO_army_bird_youkai:"招募鸟类系妖怪"
 KYO_army_bird_youkai_desc:"天空的阴影自远方掠来——那并非云层，而是一群在高空巡猎的妖怪。鸟类妖怪是幻想乡最天然的空中猎手，拥有与风同速的羽翼与俯瞰战场的锐利目光。\n\n她们也许不以蛮力见长，但她们的高速突入、尖啸压制与俯冲打击，足以在顷刻之间撕开敌军的阵线与胆气。在现代战争中，她们不仅是空中侦察者，也是最致命的空中骚扰兵力。\n\n只要她们仍在天空盘旋，敌人便不会真正安心。"

 KYO_army_oni_youkai:"听取鬼的意见"
 KYO_army_oni_youkai_desc:"鬼，曾经是妖怪世界最显赫、最令人畏惧的存在。即使在势力衰退之后，她们仍保有与人类正面冲撞的漫长经验。\n\n对鬼而言，战争的本质从来都很简单：用更强的力量压倒对方，让敌人在碰撞中明白谁才是真正的支配者。鬼的军事思想强调冲击、正面压制与无可动摇的士气，她们相信秩序可以有，但那必须建立在力量压服一切的基础上。\n\n若吸纳这套经验，幻想乡的军队将走上一条更直接、更强硬、也更讲究正面碾压的道路。"

 KYO_army_tengu_youkai:"听取天狗的意见"
 KYO_army_tengu_youkai_desc:"天狗是幻想乡中最早将阶级、纪律与组织化发展到极致的族群之一。她们擅长侦察、指挥、情报统筹，也最早意识到外界的制度、科技与战术不能被简单忽视。\n\n对天狗而言，战争不是单纯的比谁更强，而是谁能更快掌握信息、调动资源、压缩误差，并在正确的时机把一切力量投向最脆弱的一点。\n\n若吸纳天狗的经验，幻想乡的军队将更注重组织、协同与现代化管理，走上一条制度与战术并重的道路。"

 KYO_army_strong_youkai:"大妖怪的威严"
 KYO_army_strong_youkai_desc:"她们是连同族都不敢轻视的存在。大妖怪拥有远超常理的力量与漫长岁月积累下来的经验，历经无数战斗，也见证过一个又一个时代的更替。\n\n她们足以凭一己之力改变战局，可也正因为如此，她们往往难以被任何制度轻易约束。要让这些孤高而强大的存在甘愿融入军事体系，本身就是一场试炼。\n\n一旦成功，幻想乡的军制将不只是补足一块短板，而是被整个抬升到新的层次。指挥、士气、火力与战术，都将因大妖怪的加入而获得质变。"

 KYO_tengu_intelligence:"整合天狗的报社"
 KYO_tengu_intelligence_desc:"天狗拥有幻想乡最快的翅膀与最锐利的眼睛。她们的消息网络覆盖山川、村落与都市，可惜长期以来，这张情报网被拆分在不同家族、报社与派系手中，彼此重叠、彼此竞争，也因此浪费了太多速度。\n\n若要把这份力量真正用于战争，就必须彻底重组。所有情报渠道都应被纳入统一中枢，任何关于前线动向、敌军部署与外界变化的消息，都必须在最短时间内直达指挥部。\n\n当这套系统运作起来时，天狗的报社便不再只是书写新闻的地方，而会成为真正决定战局走向的情报机关。"

 KYO_tengu_place:"授权天狗拥有独立于中央的特工"
 KYO_tengu_place_desc:"在情报网完成整合之后，天狗的价值已不再局限于传递消息。她们将成为阴影中的猎手、渗透者与战场之外的刀刃。\n\n然而，再严密的中央情报体系，也无法迅速应对一切突发变化。为了让情报力量更具灵活性，可以授予天狗一支独立运作的特工体系，使其拥有更高的机动权限与更快的行动能力。\n\n这样的安排能极大提高效率，却也意味着中央必须承担一部分放权的风险。这是一场与影子做的交易，而能否驾驭这份力量，将决定战争之外的胜负。"

 KYO_more_Aya_newspaper:"官方战时宣传报"
 KYO_more_Aya_newspaper_desc:"战场上，夺取阵地的或许是子弹与炮火，但真正能撼动军心的，往往是一张纸。宣传、消息、战报与口号，能够在一夜之间鼓舞己方，也能在另一夜之间让敌军开始怀疑自己还能否活着回家。\n\n如今，幻想乡需要的已不再只是零散的传闻与夸张的街头小报，而是一份真正服务于战争的宣传刊物。透过报贩、情报员、驻军与空中投放，这份战时报将被送往每一个角落。\n\n它会书写胜利、放大敌人的恐惧、统一后方的叙事，也会把战争的意志灌进每一个读到它的人心中。"

 KYO_air_kappa_gear:"飞行的河童"
 KYO_air_kappa_gear_desc:"在现代战争中，制空权往往意味着战场的主动权。河童是幻想乡最热衷机械的工匠族群，对外界的飞机、引擎与机体结构有着近乎偏执的兴趣。\n\n她们不会满足于单纯模仿，而会将缴获来的飞行器彻底拆开，再以妖怪的思路重新组装。动力核心、升力结构、武装挂载与灵力适配装置，都可以被她们扭成一种人类从未设想过的形态。\n\n当属于幻想乡的飞行器真正升空时，天空将不再只是敌人的领域，而会成为妖怪重新定义战争的地方。"

 KYO_air_youkai_pilot:"妖怪飞行员"
 KYO_air_youkai_pilot_desc:"飞行器的诞生只是第一步，真正决定它们能否化为战场利刃的，是能够驾驭它们的飞行员。虽然许多妖怪天生便能飞翔，但灵力飞行与驾驶高速战机终究不是一回事。\n\n高度、速度、武装操作、编队协同与高压环境中的判断，都是必须重新学习的技术。因此，幻想乡需要一批真正意义上的飞行员。她们必须接受高空机动、模拟空战与极限状况训练，直到能够在最危险的空域中仍保持冷静。\n\n当这些飞行员成熟之后，天空便会真正成为幻想乡的战场，而不再只是战场上方的一片背景。"

 KYO_air_youkai_flight_school:"妖怪飞行学校"
 KYO_air_youkai_flight_school_desc:"会开飞机的妖怪固然珍贵，但若只依赖少数天赋异禀之辈，制空权终究不稳。要让空中力量成为真正可持续的军种，就必须建立完整的训练体系。\n\n飞行学校的意义，便在于把个人才能转化为制度化的培养能力。在这里，学员将学会如何在暴风、夜色、雷雨与复杂地形中飞行，也将掌握编队作战、战机维护与战场应变。\n\n飞行学校一旦建成，幻想乡的天空部队便不再只是少数精锐，而会拥有源源不绝的新血。"

 KYO_air_youkai_paratrooper:"妖怪低空飞行员"
 KYO_air_youkai_paratrooper_desc:"人类的伞兵需要依赖飞机、风向与天候，而妖怪天生就能在这套规则之外行动。低空飞行对她们而言并非极限，而是本能延伸出的另一种战术。\n\n她们能够贴地掠过防线，规避雷达与火力锁定，在极短时间内切断补给、突袭据点、俘获目标，然后重新消失在夜色与山雾之间。\n\n这些低空飞行员不是传统意义上的空降兵，而是一支真正不受地形与天气束缚的奇袭力量。她们存在的意义，就是让敌人永远无法确定危险会从哪里落下。"

 KYO_army_general_plan:"军官训练计划"
 KYO_army_general_plan_desc:"战场上的胜利，不仅依赖士兵的勇猛，更取决于将领的判断。再锋利的刀刃，若由笨拙之手挥舞，也只会变成钝器。\n\n幻想乡的许多将领拥有惊人的力量与丰富的战斗经验，却未必熟悉现代战争所要求的火力协调、后勤调度与情报整合。因此，军官训练计划的目标，就是把这些强者从单纯的战士，锻造成真正的指挥官。\n\n她们将学习如何指挥协同作战、如何利用新式武器、如何让部队在最短时间内形成有效战力。军官一旦成长，整支军队的面貌也会随之改变。"

 KYO_army_general_plan_2:"将军战术强化"
 KYO_army_general_plan_2_desc:"只有蛮力而无战术的军队，就像没有牙齿的猛兽，终究会败给更冷静的对手。现代战争要求的不只是勇敢，而是预判、布局、佯动、突破与协同。\n\n将领们必须重新学习如何理解战场全局，如何在复杂地形与不对称情报中调动兵力，如何用最小的代价撕开最大的缺口。\n\n唯有将这套战术思维真正灌进军官层，幻想乡的军队才不会只是一群强者的集合，而是一支真正懂得如何赢的军队。"

 KYO_army_general_plan_3:"最终的训练课程"
 KYO_army_general_plan_3_desc:"刀锋已被打磨，战术已被灌输，可军人真正的最后一课，始终是意志。最终的训练课程，不再是单纯的体能或兵棋推演，而是把军官与精锐部队推入极端压力之中，让她们在恐惧、混乱、伤亡与失败感面前学会仍然维持秩序、判断与决心。\n\n只有走过这一步，她们才不只是训练合格的士兵，而会成为真正能在绝境中保持冷静的战争机器。\n\n武器会损坏，阵线会崩塌，但只要意志没有折断，这支军队就不会真正被击败。"

 KYO_army_general_training:"军官环境训练"
 KYO_army_general_training_desc:"幻想乡的土地并不残酷，但这不意味着未来的战场也会如此温和。沙漠、雪原、沼泽、海岸与高山，都是外界战争中可能出现的环境。\n\n若军官只熟悉幻想乡的路、河与山风，那她们在陌生地带的判断便会迟钝。环境训练的意义，就是逼迫军官们离开熟悉的土地，在极端条件下仍然学会指挥、行军、扎营与维持部队战力。\n\n能熬过这些训练的人，才真正有资格在任何战场上统率一军。"

 KYO_army_new_tech:"学习新式科技"
 KYO_army_new_tech_desc:"长久以来，幻想乡依赖灵力、术法与古老经验活了下来。然而与外界的战争已经证明，现代科技本身就是一种足以改变生死的力量。\n\n若继续沉浸于旧时代的自满之中，等待我们的只会是被机枪、坦克与电波体系彻底碾碎。我们必须学会拆解、学习、吸收外界的新技术，把这些陌生而危险的东西一点点转化为幻想乡自己的力量。\n\n科技不再只是人类的专属工具，而会成为我们延续生存的必要手段。"

 KYO_army_new_tank:"坦克逆向工程"
 KYO_army_new_tank_desc:"坦克是人类战争机器最具压迫感的象征之一。厚重的装甲、轰鸣的履带与不断推进的火力，让单纯依赖血肉与勇气的冲锋显得愚蠢而脆弱。\n\n既然正面对抗只会付出惨重代价，那么最好的办法便是捕获、拆解、理解，再把这一切变成自己的力量。每一个齿轮、每一段履带、每一层装甲与动力系统，都应被彻底研究。\n\n终有一日，钢铁野兽不会再只是敌人的兵器，而会成为幻想乡自己的战争利爪。"

 KYO_army_theory:"了解人类的战术"
 KYO_army_theory_desc:"外界的人类并非单纯依赖钢铁与火药的猎物，她们还拥有系统化的战术、严整的通信、层次分明的防线与成熟的指挥逻辑。若幻想乡仍用旧时代的直觉与冲动去应对现代战争，那结果只会是惨败。\n\n要想击败敌人，就必须先学会理解敌人。研究他们的教范、拆解他们的行军方式、掌握他们的火力协同与调度规律，把一切都化作可被利用的弱点。\n\n知晓敌人的思路之后，我们便能让敌人的每一个动作都成为自己的陷阱。"

 KYO_army_support_stuff:"战场支援装备设计"
 KYO_army_support_stuff_desc:"一支军队若只有枪炮，是打不长久的。幻想乡需要的不是简单复制外界的装备，而是一整套适配妖怪特性的支援体系。\n\n飞行妖怪需要适合空中投掷与突击的装备，擅长隐匿者需要便于渗透的干扰装置，拥有强大妖力的个体则需要能与能力配合的特殊武装。医疗、补给、灵力恢复与快速维护同样重要。\n\n只要支援体系真正建立起来，幻想乡的军势便不只拥有利爪，还会拥有能够持续撕裂敌阵的第二套骨架。"

 KYO_army_tech_used_by_youkai:"掌握人类科技"
 KYO_army_tech_used_by_youkai_desc:"短短数十年，人类就让科技从蒸汽走向了钢铁、火药、雷达、飞机与装甲。即便是寿命以百年计的妖怪，也不得不承认，这种变化足以让整个世界窒息。\n\n模仿人类的技术是不够的，真正重要的是理解、掌握，并将其彻底改造成能够与妖怪力量相结合的新体系。\n\n当天线、装甲、发动机与灵力回路被接到同一套逻辑里时，诞生的将不再是人类的武器，而会是属于幻想乡自己的战争兵器。"

 KYO_we_can_conutrol_ourself:"我们能控制自己"
 KYO_we_can_conutrol_ourself_desc:"纪律、训练与技术并不只是为了让军队更强，也是为了让妖怪们学会约束自身最原始的兽性。若连自己都无法控制，再强大的力量也只会沦为失控的灾厄。\n\n唯有学会克制、服从、协同与判断，幻想乡的军队才能真正向前迈进。\n\n我们不再只是依赖本能厮杀的怪物，而是一支能够掌握自己、也能够掌握战争的力量。"

