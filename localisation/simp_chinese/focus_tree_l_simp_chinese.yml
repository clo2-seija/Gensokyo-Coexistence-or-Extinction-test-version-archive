 KYO_boundary_medicine_exchange:0 "与永琳的辩论"
 KYO_boundary_medicine_exchange_desc:0 "永琳的推演很少出现计算错误，真正的问题往往藏在她选择计算什么。她能够准确预测伤亡、资源与成功概率，却容易把无法量化的情感视作误差，又在理论陷入困境时，以更加复杂的公式保护最初的假设。\n\n紫没有打算凭口才压倒月之贤者，而是请蓝加入这场辩论。蓝同样相信理性与效率，却比永琳更清楚一件事：恐惧、信任、悲伤与尊严并非需要排除的杂音，而是任何完整演算都不能遗漏的真实变量。\n\n蓝逐条检查永琳的前提，永琳则反过来质疑八云家的结界与治理。争论持续至深夜，没有谁获得彻底的胜利，但原本封闭的理论终于出现了修正空间。理性最可贵之处，从来不是证明自己永远正确，而是在发现遗漏以后仍愿意重新计算。"

 KYO_boundary_memorial_exchange:0 "与幽幽子的叙旧"
 KYO_boundary_memorial_exchange_desc:0 "紫早在幽幽子仍是人类时便认识她。那时的西行寺少女会在樱花下谈论诗句，也会借着赏花之名吃掉大半桌点心。死亡改变了她的身体、记忆与职责，却没有让紫把眼前的亡灵视作另一个人。\n\n幽幽子曾笑着询问，自己死后是否变得陌生。紫只是合起折扇，回答她除了食量以外并没有多少变化。那些未能说出口的怀念便藏在玩笑之间，不必经过召魂，也无须挖开西行妖下的往事。\n\n这一次，紫还带来了橙。小猫追着幽灵蝶跑遍庭院，又与幽幽子为了最后一块点心展开一场毫无威严的争夺。整个下午，她们都不必扮演贤者、冥界之主或式神，只需为几件微不足道的小事开怀大笑。\n\n对活过太久的人而言，能够像从前一样相处，本身便是一种难得的重逢。"

 KYO_three_paths_joint_council:0 "三方茶会"
 KYO_three_paths_joint_council_desc:0 "没有记录官，没有预先拟定的议程，也没有等待签署的条约。紫只是打开间隙，把永琳与幽幽子请到同一张矮桌前，再让蓝添上茶水、妖梦端来点心。\n\n谈话最初只是一些无关紧要的小事。幽幽子嫌永琳准备的茶太苦，永琳则指出幽幽子面前的点心已经超过合理分量；紫在一旁煽风点火，直到两人暂时忘记自己原本打算维持的庄重。\n\n随后，她们谈到月都、死亡、医治与即将开始的战争。永琳依旧不会接受幽幽子对终点的平静，幽幽子也无法认同永琳总想再挽救一次的执着，紫更不准备把任何一人的答案奉为幻想乡唯一的真理。\n\n这场茶会没有消除分歧，却证明三条道路可以共享一张桌子。真正的团结不是所有人说出相同的话，而是在无法彼此理解时，仍愿意坐下来、继续交谈，并相信对方不会因为争论而否定自己的存在。"









