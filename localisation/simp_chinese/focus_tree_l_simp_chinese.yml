  KYO_econmi_reform:"经济重启"
 KYO_econmi_reform_desc:"幻想乡的工业基础薄弱得令人不安——铁匠铺零散分布，工坊彼此孤立，生产水平仍停留在极为原始的阶段。如此脆弱的经济，根本不足以支撑即将到来的长期战争。\N\N我们必须启动一场全面的经济改造：统合分散的资源、扩建工坊、引入外界技术，并动员整个幻想乡的劳动力投入生产。战争需要源源不绝的武器、弹药、装备与粮食，而不是一批只会在节庆时制作烟火的工匠。\N\N这不只是重建经济，而是点燃整个工业引擎的第一步。当钢铁的轰鸣声在幻想乡响起时，这片土地便再也无法回到过去。"

 KYO_metro_system:"地铁计划"
 KYO_metro_system_desc:"在外界，铁路是战争的动脉；而在幻想乡，我们将以地底隧道与灵力驱动列车取而代之，打造属于这片土地的地铁网络。\N\N这些地铁将贯穿各大区域，从山岳、湖畔到竹林与地底，每一条隧道都将确保武器、粮食与增援部队能在最短时间抵达前线。幽暗的地下环境足以规避侦察，而特殊的灵力轨道也能保证即使在结界波动下仍维持运作。\N\N当地底列车的轰鸣声响彻幻想乡时，后勤将不再是弱点，而会成为压倒敌人的优势。"

 kYO_upgrade_digging_tool:"改善挖掘设备"
 kYO_upgrade_digging_tool_desc:"地铁计划已经确立，但仅靠双手与灵力，无法在短时间内打通大规模的地下路线。若想让运输网络在战争全面爆发前投入使用，就必须先提升挖掘效率。\N\N河童将拿出她们的机械工艺，制作适合地下狭窄环境的新式钻机；擅长蛮力的妖怪将推进最坚硬的岩层；而熟悉地底环境的势力，则会指引施工队避开最危险的断层与空洞。\N\N当新式挖掘设备全面投入使用后，地下交通线将以前所未有的速度延伸至幻想乡的各个角落，确保我们的部队与物资永远快过敌人的反应。"

 KYO_build_up_station:"新兴车站设立"
 KYO_build_up_station_desc:"在地底蜿蜒前进的列车，不可能只依赖轨道而存在。若想让这套运输系统真正运转起来，就必须在关键节点建立稳定而高效的车站枢纽。\N\N这些新车站将成为物资、兵力与情报的中转核心。河童会在站内安装结合灵力与机械的运输装置，确保车列能够迅速进出；情报人员与驻站人员也将设立专门的传递点，让新闻、军令与调度命令在最短时间内沿线扩散。\N\N对外，它们是战略节点；对内，它们则是让幻想乡真正连成一体的骨架。当第一列满载士兵与补给的列车驶出站台时，便意味着幻想乡的后勤网络已踏入新时代。"

 KYO_station_from_another_world:"来自另一个世界的车站"
 KYO_station_from_another_world_desc:"在某座新建成的地底车站里，一列本不该存在的列车缓缓驶入。车门打开时，没有司机，也没有寻常乘客，只有两位穿着与当代完全不同服饰的女性走了出来。\N\N她们自称宇佐见莲子与玛艾露贝莉·赫恩，声称自己来自另一个世界，并对境界、科技与历史有着远超常人的理解。对于幻想乡的大多数居民而言，这样的来历既陌生又危险。她们拒绝详细说明自己的身份，只留下模糊而令人不安的解释——时间与空间，本就是靠不住的错觉。\N\N无论真相为何，这两位自异界而来的访客，已经悄然步入了幻想乡的棋局之中。"

 KYO_importing_new_system:"引进新系统"
 KYO_importing_new_system_desc:"最初规划的地下交通网虽然足以满足基本运输需求，但随着战线扩大、调度压力激增，这套旧式体系已经开始暴露出明显的局限。\N\N新的时代需要新的系统。通过引进更高效的信号控制、资源分流与自动化调度方案，我们将能在最短时间内把兵员、武器与补给输送到任何需要的地方。这不只是一次单纯的基础建设升级，而是将幻想乡的交通动脉彻底现代化。\N\N当新系统全面运行之后，任何依赖传统后勤线的敌人，在我们面前都会显得迟缓而笨重。"

 KYO_underground_treasure:"地底的财宝"
 KYO_underground_treasure_desc:"在幻想乡的深层地底，沉睡着自古以来便未被充分开发的矿脉与稀有资源。那些闪烁着金属光泽的矿石，与传闻中只存在于怪谈里的奇异结晶，如同沉睡千年的宝藏，静静等待着被唤醒的一日。\N\N如今，战争与工业的需求迫使我们把目光投向这片未曾完全踏足的领域。地底的黑暗与险恶并不可怕，真正的挑战在于能否在复杂环境中建立稳定的采掘与运输体系。\N\N一旦成功掌握这些资源，幻想乡将不再只能依赖地表的有限产出，而能以地底的财富支撑未来的建设与战争。"

 KYO_kappa_development_plan:"河童的工业计划"
 KYO_kappa_development_plan_desc:"河童以其无与伦比的机械技术与工程才能而闻名，而这一次，她们拿出的不再是一件孤零零的小发明，而是一整套足以重塑幻想乡工业结构的宏伟蓝图。\N\N这份计划涵盖基础工厂建设、资源加工、军工生产、交通运输与基础建设，并将一切纳入可持续扩张的体系。它不是一座工坊、一条铁路，或一批枪械，而是一整套彼此咬合、彼此支撑的工业骨架。\N\N一旦批准实施，这将成为幻想乡正式迈向工业化的里程碑，让后方生产与前线需求首次真正接上同一条链。"

 KYO_farming_med:"农作物生长剂"
 KYO_farming_med_desc:"即便是妖怪，也无法脱离粮食去打长期战争。一直以来，幻想乡的田地规模有限，产量也始终不足，粮食短缺已经逐渐变成前线无法忽视的隐患。\N\N如今，研究人员与医药技术者提出了一种全新的生长剂方案。它能大幅缩短作物成熟周期，让稻米、小麦与薯类在更短时间内完成收成。药效原理或许复杂难解，但试验结果已足够说明一切：田地将以过去无法想象的速度反复产出。\N\N有了这项技术，粮仓不再空虚，而长期战争所需的口粮基础，也终于获得了真正的保障。"

 KYO_yuka_arrive:"来自花田之主的回应"
 KYO_yuka_arrive_desc:"近期的大规模资源开采与农业实验，确实为战争提供了强大的后勤保障。矿脉被挖开，田地在药剂作用下疯狂生长，工厂与车站也因此得以持续扩张。\N\N然而，在幻想乡的另一端，却有一位存在已经对这一切感到了强烈不满。花田之主，风见幽香，已经注意到了这些改变。她无法容忍无节制的开采、药剂残留与工业烟尘侵蚀自然，让花田失去本来的色泽与香气。\N\N她的出现提醒了所有人：工业化并非没有代价。若继续走下去，我们就必须决定，幻想乡的未来究竟是属于冷钢与烟雾，还是仍要为花与土地保留一席之地。"

 KYO_underground_factory:"地底的工业计划"
 KYO_underground_factory_desc:"旧地狱长年以来只是被遗忘者、怨灵与地底妖怪的栖居之处。若继续把这片区域仅仅视为放逐之地，那无疑是一种浪费。\N\N这里蕴藏的热能、矿产与广阔空间，本身便是支撑重工业的理想条件。高温环境能为冶炼提供天然优势，而地底庞大的空间与劳动力，也足以支撑大规模工厂群的建立。\N\N当烟囱刺破地底的黑暗、工厂与矿坑沿深渊排列而起时，旧地狱便不再只是荒凉之地，而会成为幻想乡真正的工业腹地。"

 KYO_plan_for_nuke:"地底核计划"
 KYO_plan_for_nuke_desc:"在旧地狱深处，埋藏着极为稀有而危险的资源——铀矿。长久以来，它们只是被当作带来灾祸的不祥之石，但在战争与工业的视野里，这或许是足以改写规则的力量。\N\N若能将这些资源与幻想乡现有的技术、灵力体系和地底研究能力结合起来，便有可能诞生一种远远超越当代常规武器的终极兵器。这条道路注定充满危险与争议，但它也意味着前所未有的战略威慑。\N\N当地底深处点燃原子之火时，那将不再只是工业的跃进，而会成为战争终局的预兆。"

 KYO_plan_for_hotspring:"地底温泉计划"
 KYO_plan_for_hotspring_desc:"旧地狱深处并不只有诅咒、怨灵与矿石，也蕴藏着极为纯净而稳定的地热能量。若加以引导，这些泉脉与热流便能化作温泉、能源与疗养设施。\N\N与其让地底永远作为阴暗与放逐的代名词，不如将其改造成一个全新的生活区域。妖怪与居民可以在此休养、居住、恢复伤势，甚至重新建立与地上的联系，让这片土地从恐惧的象征转化为繁荣与舒缓的所在。\N\N当地热的蒸汽取代矿坑的灰尘时，旧地狱也将以另一种面貌重新回到幻想乡的视野之中。"

 KYO_Satori_thank_you:"来自古明地的感谢"
 KYO_Satori_thank_you_desc:"无论是点燃了地底的原子之火，还是打开了温泉的泉眼，旧地狱的命运都已被彻底改写。长年被遗忘、被视作深渊的地底，如今终于迎来了新的可能。\N\N古明地觉对这场开发表达了明确的感谢。对她与地底妖怪而言，这不仅意味着资源、工厂或设施的增加，更意味着她们终于不再只是沉在阴影中的弃民，而真正被纳入了幻想乡未来的一部分。\N\N作为回应，地底的势力将更加积极地支持我们的事业。从今以后，地底不再只是被利用的深渊，而会成为与地上并肩前行的重要力量。"

 KYO_kappa_advance_plan:"河童工业计划升级"
 KYO_kappa_advance_plan_desc:"伟大的工业蓝图不应停留在基础阶段。河童最初提出的计划，只是为幻想乡的工业化打下地基，而现在，是时候将这套体系推向真正的高速运转。\N\N通过引入自动化生产系统、提升原料精炼效率、优化交通节点与军工产线，我们将把原本零碎的建设成果，转化为一个真正能够持续扩张的工业网络。\N\N这不仅能提高武器与装备的产量，也会让基础设施建设全面提速，使河童的机械文明真正渗透到幻想乡的每一条动脉之中。"

 KYO_kappa_ultimate_plan:"终极河童工业计划"
 KYO_kappa_ultimate_plan_desc:"多年的铺设、扩建与改造，终于来到了收束之日。工厂、炼钢厂、兵工设施与交通干线已经全部接入同一套体系，彼此支援、自我循环，形成一个庞大而自给自足的工业网络。\N\N河童们将这套系统打磨到了极致：生产效率高得惊人，资源调度严丝合缝，几乎不留任何浪费。这已不再是单纯的几项建设成果，而是一整套足以支撑战争与经济的工业文明。\N\N从这一刻起，幻想乡不仅能够满足自身所需，还拥有了将多余力量投向更远方的能力。"

 KYO_great_industry:"伟大的工业"
 KYO_great_industry_desc:"在寻常的事业中，勤奋所能成就的，天才同样能达成；而勤奋更常能够完成许多天才也难以企及之事。\N\N工业正是这样的领域。它不依赖一时的灵感，而依赖无数次重复、无数人协作、无数昼夜不息的轰鸣。工厂、矿井、铁路、兵站与粮仓，正是在这种近乎枯燥的持续推进中，化为支撑一个时代的脊梁。\N\N当伟大的工业真正建立起来时，幻想乡便不再只是一个依靠传说活着的地方，而会成为一个能够靠自身力量改变世界的存在。"

 

 
 KYO_use_outworld_mechine:0 "引进外界机械"
 KYO_use_outworld_mechine_desc:0 "外界的机床、量具与工艺图纸，正通过河童经营的商路分批运入幻想乡。天狗负责安排路线与遮掩货物去向，河童则在货物抵达后进行检验、拆解与重新组装。\n\n外界商人愿意出售这些设备，未必出于短视或背叛。对他们而言，这只是一笔利润丰厚、买家身份模糊的订单；而对我们而言，每一只木箱里都装着缩短数十年工业差距的可能。\n\n我们不会永远依赖进口。新的技术工坊将负责测绘零件、翻译图纸并统一规格，使这些陌生机械逐渐成为幻想乡能够维修、仿造乃至改进的生产工具。"

 KYO_hello_human:0 "将人类纳入生产"
 KYO_hello_human_desc:0 "战争使大量人类进入我们的统治范围。若要恢复矿山、道路与工厂，就不可能继续把他们视为与政权无关的普通居民。\n\n所有适龄人口都将接受职业与技能登记，并依照各地需求调往工坊、矿区、运输队与建设单位。受征调者可以取得粮食、薪资、住处与基本医疗，但在动员期间不得自行离岗或拒绝分派。\n\n官署将其称为战时劳务，人类则有另一个更直接的理解：他们被纳入了一个没有参与制定、也很难退出的秩序。"

 KYO_give_me_that:0 "接管人类产业"
 KYO_give_me_that_desc:0 "仍由私人控制的矿山、工厂与运输设施，正在妨碍统一调度。囤积、停产与投机行为不仅推高物价，也使前线无法获得稳定供应。\n\n我们将发布战时接管令，把关键企业纳入妖怪政权的监督。原业主可以保留有限收益，也可以继续负责经营，但设备、库存与生产方向必须服从统一安排。拒绝接受接管者，其资产将被直接征用。\n\n法律仍承认那些旧契约，只是不再承认它们能够凌驾于战争与幻想乡的生存之上。"

 KYO_my_properties:0 "清查接管资产"
 KYO_my_properties_desc:0 "接管命令若没有准确资料，最终只会停留在盖满印章的纸面上。我们必须知道每一座工坊能够制造什么、每一处仓库储存多少物资，以及哪些设备仍然可以运转。\n\n河童将负责设备评估与技术分类，天狗负责核查货物流向，人类职员则继续整理账目与债务。隐瞒库存、转移机械或伪造记录者，将失去剩余的经营权。\n\n清查完成以后，私人财产不会完全消失，却会被改写成可计算、可征用、可重新分配的生产能力。"

 KYO_under_new_mangement:0 "统一经营制度"
 KYO_under_new_mangement_desc:0 "旧招牌被取下，新牌匾挂上门楣。看似只是名称改变，实际发生变化的却是账目、采购、人事与生产指令。\n\n所有接管企业都将采用统一的财务格式、零件规格与库存制度。河童负责机械维护与流程改造，天狗负责稽核交付情况，原有业主与熟练工匠则可作为受委任的经营者继续任职。\n\n这些单位仍然出售商品、支付薪资，也保留各自的技艺；但它们已经不再是可以自行决定方向的生意，而是整个工业体系中的一部分。"

 KYO_steal_is_that_so:0 "这只是「借用」"
 KYO_steal_is_that_so_desc:0 "仅靠公开贸易，无法取得工业化所需的一切。有些精密设备受到管制，有些图纸从不对外出售，还有些技术只存在于少数工厂的档案室里。\n\n为此，我们将允许专门人员通过收购、仿制、秘密转运与临时征用取得所需资源。部分物品会获得付款，部分只会留下一张承诺日后归还的凭据，还有一些从一开始便没有征求过原主人的同意。\n\n公文会把这些行为称作借用、转让或紧急保管。至于失去设备的人如何称呼，那并不影响机械在幻想乡重新启动。"

 KYO_german_is_good:0 "德国式工业动员"
 KYO_german_is_good_desc:0 "德国近年的扩军展示了一种高度集中的工业组织方式：统一规格、专业分工、计划配额，以及在短时间内将民用工厂转入军需生产。\n\n我们将研究这些管理方法，建立从原料、零件到最终交付的协调机构，并强化维修、替换与产能统计。我们需要的是其组织能力，而不是照搬外界的政治信条。\n\n这种体系能够迅速集中力量，却也容易压缩民用生产，并使整个经济过度依赖中央命令。一旦判断错误，所有工厂都可能同时朝着错误方向前进。"

 KYO_america_is_good:0 "美国式规模生产"
 KYO_america_is_good_desc:0 "美国工业的优势不只来自工厂数量，更来自流水线、通用零件、质量检验与跨地区供应网络。只要规格得到统一，复杂产品也能被拆成大量可以重复完成的简单工序。\n\n我们将重新规划厂房布局，建立物料编码与仓储体系，并使不同工坊能够生产彼此兼容的零件。河童的技术将不再停留于少数工匠手中，而会被转化为能够广泛复制的制造标准。\n\n这条道路需要稳定运输、长期投资与大量原料，但一旦体系成熟，幻想乡便能以持续扩张的规模弥补工业起步较晚的弱点。"

 KYO_great_deal:0 "纸面上的好交易"
 KYO_great_deal_desc:0 "直接夺取设备容易引来抵抗，而一份经过签署的协议，往往能够让同样的转移披上合法外衣。\n\n我们将利用订单、债务、安全保证与市场准入作为筹码，迫使地方企业接受长期供货、设备转让与资源优先权。谈判表面上仍由双方自愿完成，只是双方能够拒绝的余地并不相同。\n\n这些协议之所以对我们有利，并非因为它们公平，而是因为风险、短缺与违约责任几乎都被留给了另一方。"

 KYO_human_slave:0 "强制劳务体系"
 KYO_human_slave_desc:0 "临时征调无法为不断扩张的工业提供稳定劳力。战时措施将被改造成长期制度，把职业分派、居住许可与公共配给结合起来。\n\n人类劳工会依技能与体力被编入矿区、工厂、运输及建设单位，并获得规定的薪资、食物、医疗与休假。然而，他们不能自由选择工作地点，擅自离职与迁移也会受到处罚。\n\n在法律文字中，他们并不是奴隶；但当生活所需的一切都与服从分派相连时，所谓选择已经所剩无几。工业获得了稳定的人力，人类却逐渐成为这个国家中的次等居民。"

 KYO_work_to_die:0 "产线不得停歇"
 KYO_work_to_die_desc:0 "战争不会等待工人恢复体力。安全检查、休假与设备维护都将让位于产量，所有单位必须在期限内完成不断提高的生产指标。\n\n工时会被延长，伤者会在简单治疗后返回岗位，事故也只会被记录为需要尽快排除的生产延误。没有任何命令会直接要求某个人死去，但整套制度已经默认，总会有人在机器停下以前先倒下。\n\n只要报表上的数字仍在增长，负责生产的人便不会主动追问那些空缺是如何出现的。"

 KYO_eight_hour_work_time:0 "双八小时工作制"
 KYO_eight_hour_work_time_desc:0 "毫无节制地消耗劳力，只会导致缺勤、事故与生产崩溃。我们需要的不是短暂的疯狂增长，而是一套能够持续运转的高强度制度。\n\n每名劳工每日承担两段八小时工作，中间设置进食、换装与简单检查时间。工时依然漫长，但固定轮替与最低限度的休整能够减少混乱，使设备与人员维持较稳定的状态。\n\n这并不是出于宽容，只是管理者终于承认，尚能继续工作的劳工，比迅速倒下的劳工更有价值。"

 KYO_miracle_industry:0 "妖怪工业奇迹"
 KYO_miracle_industry_desc:0 "新的铁路穿过山谷，机床在扩建后的厂房中整日运转，钢材、零件与军需品开始以过去难以想象的数量送往各地。幻想乡终于建立起足以支撑现代战争的工业基础。\n\n官署把这一切归功于河童技术、统一管理与高效动员。那些说法并没有错，却刻意略过了另一半事实：过长的工时、受到限制的迁移，以及被迫服从生产安排的人类劳工。\n\n这场工业奇迹确实存在，只是创造奇迹的人与享有成果的人，并不是同一群人。"

 KYO_work_for_youkai:0 "为妖怪社会服务"
 KYO_work_for_youkai_desc:0 "战时劳务将不再被视为短期措施，而会成为新社会的基本结构。食物、住房、教育与医疗都将通过工作单位发放，人类的一生也会越来越难以脱离其被安排的位置。\n\n妖怪负责决策、技术与管理，人类则承担大部分矿业、运输与基础劳动。服从者能够得到稳定生活，表现优异者也可能获得有限晋升，但他们无法平等决定国家的方向。\n\n官方将这种关系解释为相互依存：妖怪提供保护与秩序，人类维持生产与供给。只是当这种分工能够从父母延续到子女时，它便不再只是工作，而成为一种被继承的身份。"

 KYO_morden_youkai:0 "现代妖怪的理想国"
 KYO_morden_youkai_desc:0 "电灯照亮妖怪的街道，新式医院、学校、报社与工坊陆续建立。曾经依靠传说与畏惧生存的妖怪，如今拥有了稳定的粮食、现代工业与能够保护自己的国家。\n\n人类同样获得了基本治安、配给与医疗，却仍被置于生产体系的下层。公开的暴力逐渐减少，取而代之的是工作证件、薪资等级、迁移限制与无处不在的行政审查。服从不再需要每日强调，因为它已经被写进生活的每一道程序。\n\n政权把仓库充盈、街道安定视为共存成功的证明。然而，当一方负责制定规则，另一方只能承担被分配的职责，这究竟是共同生活，还是一座只向妖怪开放的理想国？"










 








 












































#KYO_after_war_reform:0 "战后的盘点"
#KYO_after_war_reform_desc:0 "日本列岛仍在硝烟与妖力残响中颤抖。军报、战死名册与赔偿请求堆满帝国#议会的地板——这是胜利后第一份工作：算清战争留下的每一笔伤痕。\n\n八云紫、蓝与橙将重新盘点兵力、粮秣#与占领区秩序，决定哪些军团解编、哪些军阀收编，以及对人里与各地人类社群画出最低保护线。只有先把这些#整理清楚，之后的妖怪政权才有站稳脚跟的可能。"
#
#KYO_reform_the_system:0 "体制系统的调整"
#KYO_reform_the_system_desc:0 "战时的「妖怪联合体」是为突破结界、横扫日本而打造的临时工具：权力#集中在少数贤者与军事指挥部，地方妖怪与人类自治几乎被冻结。\n\n如今战争结束，过度军事化与高度集权正#开始拉开新的裂缝——军阀要求战功分配，人类要求最低的自治保障，宗教势力与既得利益者也在观望。若不将这#套体制拆解、调整为可以长期运作的政权架构，下一场动乱只会在更脆弱的地基上爆发。"
#
#KYO_reform_the_barrier:0 "重修大结界"
#KYO_reform_the_barrier_desc:0 "博丽大结界的裂纹在夜里呼吸，宛如一头尚未被驯服的巨兽。外界的残余#意志、怨灵与军事侦察，沿著那些细小的缺口渗入日本列岛的每一处角落。\n\n八云紫将以「间隙」重新校准边#界，把原本守护幻想乡的结界扩展、缝合，覆盖整个日本。然而，战争与大量异常生灵的涌入，令新的结界极度#不稳：短期内可能引发妖力紊乱、结界失灵与奇异灾变，长期却是换来一片可控的疆域与封闭外界干涉的屏障。#"
#
#KYO_kill_the_rebel:0 "剿灭叛乱"
#KYO_kill_the_rebel_desc:0 "胜利不代表一切臣服。各地残余的人类抵抗组织、失势的妖怪军头与不满新秩#序的宗教团体，正在暗处试探新政权的底线。\n\n紫的命令很简单：叛乱如风中火星，必须在燎原前掐灭。先礼#后兵——招抚、分化、斩首三步并行；能谈的谈，该砍的砍，让所有人明白「谈判」只属于愿意收手的一方。只#是，越是彻底地清洗，越会有人把仇恨记在心里，等待下一次报复的机会。"
#
#KYO_make_youkai_warlord_surrender:0 "迫令妖将归顺"
#KYO_make_youkai_warlord_surrender_desc:0 "在突破结界、攻占日本的过程中，许多妖怪首领以半独立军#团的形式作战，他们握有自己的部队、补给线与统治区域，战后自然不愿轻易交出。\n\n要建立稳定政权，军队#必须从「谁的私兵」转为「谁的国军」。编制重整、裁军与收编将一并推进——红魔馆的蕾米莉亚与其他妖将不会#心甘情愿，谈判桌与军事演习场都将成为新一轮角力的舞台。"
#
#KYO_all_bow_yukari:0 "跟随或毁灭"
# KYO_all_bow_yukari_desc:0 "在突破博丽大结界、横扫日本列岛的每一个夜晚，所有妖怪都亲眼见识过那个站在「间隙」上的女人——她只需轻轻一拨，边界、国境与生死便如纸张般翻面。战争结束之后，问题不再是谁赢了，而是由谁来承受这个新世界的重量。\n\n八云紫没有打算与任何人分享权柄。愿意跟随者，将在她的庇护之下获得名分与秩序；选择犹豫或反对者，等待他们的只有从这片版图上被抹除。对妖怪也好、人类也罢，未来只剩两条路——站到她身边，或在她收拢结界时一同消失。"
#
#KYO_future_start:0 "给予旧结界的最后仪式"
#KYO_future_start_desc:0 ""


  KYO_war_never_change:0 "战争从未改变"
  KYO_war_never_change_desc:0 "§R烽火已起，谁也无法置身其外。§!\n战争，战争从不改变。\n\n只要有领土与立场，只要有人类与妖怪之间的恐惧与怨恨，钢铁与妖力就会再次在大地上刻下裂痕。胜利者写历史，失败者变成传说，真正不变的，是所有人终究都要被卷进去——只是早晚与顺序的差别。"

  KYO_make_sure_beast_support:0 "与畜生界签订互不侵犯"
  KYO_make_sure_beast_support_desc:0 "畜生界只承认强者与契约，没有「朋友」，只有「猎物」与「暂时的同路人」。那里的兽们闻得到血腥与权力，对形势的判断远比外界人类要快得多。\n\n只要我们能确保他们不倒向任何一方，甚至在暗处替我们牵制其他竞争者，这场战争就不会多出一个从地狱深处伸出来的敌人。要付出的，是条件优渥的契约，以及承认他们『独立狩猎场』的权利。"

  KYO_make_sure_kappa_support:0 "确保河童的工业支援"
  KYO_make_sure_kappa_support_desc:0 "水汽与齿轮在河岸鸣唱，钢铁骨架在洞窟深处成形。河童的工厂不在地图上的城市里，而藏在溪流、山腹与秘密码头，他们让幻想乡第一次拥有近似外界的工业能力。\n\n以合约、专利与河道通行权，换取河童的工程队、武器改装与补给网路，是维持长期战争的必要条件。只要这条水路不断，我们的军队就不会因为弹尽粮绝而倒下。"

  KYO_make_sure_ghost_support:0 "确保幽界的秩序"
  KYO_make_sure_ghost_support_desc:0 "白玉楼的雪庭无声，钟鼓一响，万灵齐聚。那是死者与生者边界最薄弱之处，也是整个体系最不能失序的地方。\n\n如果幽界陷入混乱，亡灵暴走、审判失灵，战场上死去的怨魂将无处可去，最终回头吞噬仍然活著的世界。到那时，内战的胜利早已不重要了——只剩下整个日本与幻想乡一起被拖入阴影的深渊。"

  KYO_make_sure_tengu_support:0 "确保天狗的空中支援"
  KYO_make_sure_tengu_support_desc:0 "妖怪山的社论能定人心，鹰翼的斥候能定战局。天狗掌握天空、风向与情报网，他们的报纸与侦察一旦倒向敌方，我们就会在舆论与战术上同时失明。\n\n争取天狗的支援，意味著我们能掌握制空权与消息流向：让我们的军队在对的时间出现在对的战场，让敌人的失误被放大给所有人看见。只要天空属于我们，地面战斗就不会是单纯的赌博。"

  KYO_make_sure_fairy_support:0 "让妖精支持我们"
  KYO_make_sure_fairy_support_desc:0 "妖精是自然的碎片，是季节、气候与情绪的化身。他们人数众多，意志单纯，冲动而天真，看起来既脆弱又笨拙——却拥有几乎可以无限复活的躯体。\n\n只要给予足够的欢乐与好处，妖精就会像潮水一样涌向前线，扰乱敌军的视线、补满我们布阵中的空隙，甚至在失败后若无其事地再站起来。说到底，他们不在乎谁当领袖，只在乎哪一边比较好玩——而我们的任务，就是让他们觉得跟著我们最不会无聊。"

  KYO_make_sure_oni_support:0 "拜见鬼族首领"
  KYO_make_sure_oni_support_desc:0 "山中的鬼族仍旧记得古老时代的战斗：酒吞童子、星熊童子、茨木童子，那些名字一旦站到战场前线，敌军就会先被气势压垮一半。鬼讨厌谎言，却尊敬正面迎战的强者。\n\n若能提出足够豪迈的报酬与坦率的盟约，让鬼族愿意出手，敌人就会在正面战场上体会到什么叫「不战而退」——不是他们不想打，而是双脚在看到那些身影时，已经先一步开始颤抖了。"

  KYO_make_sure_eientei_support:0 "获取中立永远亭的补给"
  KYO_make_sure_eientei_support_desc:0 "永远亭习惯于旁观，把自己锁在竹林的迷宫里。八意永琳不再希望亲自介入幻想乡的权力角逐，但药物、医疗与特殊补给线却仍由她牢牢掌握。\n\n只要给出的报酬足够，条件写得足够精细，她就会在不露面、不表态的前提下，让我们的士兵在最糟糕的战况里仍有药可用、有弹可补。谁能掌握永远亭的供应，谁就能让自己的军队多撑好几轮攻防。"

  KYO_last_chance_of_victory:0 "现在或永远"
  KYO_last_chance_of_victory_desc:0 "畜生界的中立、河童的工厂、鬼族的威名、幽界的秩序、天狗的天空、妖精的潮水，以及永远亭冰冷周密的补给，一块块被拼回我们这一侧。能争取的力量几乎都已到位，能说服的势力也都表明了立场。\n\n接下来的战斗，不再有「准备阶段」可以退回去重来。这是我们翻身、称霸，或是被写进失败者历史的一役。若在此刻犹豫，之后就只剩被他人决定命运；若在此刻全力以赴，无论胜败，都将为整个幻想乡与日本定下新的轨迹——要么现在，要么就永远失去机会。"


 KYO_remilia_start:"蕾米莉亚的血之帝国"
 KYO_remilia_start_desc:""




 KYO_remi_aftermath:"红色黎明"
 KYO_remi_aftermath_desc:"红雾像一层湿冷的丝绸复住天顶。人里的灯火被染成暗红，窗纸后的影子缩成一团——不是因为看见了什么，而是因为知道「有人正在看著」。\n\n蕾米莉亚登上王座时，没有欢呼。只有餐具与铠甲扣具的细碎碰撞，像一群人刻意把喉咙收紧。她也不需要掌声。她要的是：每个人醒来的第一个念头，都会先想起她的名字。\n\n她记得十五世纪的欧洲。教堂的钟声与学院的笔尖一起推动世界，火药、齿轮、工坊的烟，把妖魔当成旧时代的污点刮去。不是一场战争，而是一套新的规矩把你从历史里挤出去——连愤怒都显得落伍。\n\n所以她不再接受躲进传说。传说会被遗忘；制度不会。她要让恐惧长出边界、长出文件、长出工厂的烟囱，变成每天都必须服从的日常。\n\n蕾米莉亚将发起一道命令，召集所有收他统治的人来"

 KYO_sakuya_intro:"女仆长十六夜咲夜"
 KYO_sakuya_intro_desc:"镜面刚映出一道指纹，下一瞬就被抹掉。灰尘落下的时间甚至来不及被看清——不是它不存在，而是咲夜不准它留下。她走过的地方，空气像被校正过：桌角对齐、烛火高度一致、窗帘褶皱的间距被压成同一个尺度。任何偏差都像刺进她眼底的一根针。\n\n她把托盘端得很稳，指节却是白的。她不允许自己抖——不是因为怕失手，是因为她知道「失手」在这座城里的意思：不是犯错，是被取代。\n\n她的完美不是习惯，是防线。每一次把银器擦到能反光，她都在对自己下命令：再干净一点，再准确一点，再快一点。她听得见走廊深处那些细碎声响：铠甲扣具的摩擦、低声的交谈、门扇轻微的回弹。它们像倒数的秒针，提醒她——只要哪里乱了，主人的目光就会转向别人。\n\n她的脸始终带著合乎礼节的平静。即使心里的紧绷把呼吸勒得发疼，她也只让自己吐出最短、最干净的字。\n「已准备妥当。」\n\n只有她自己知道，那句话背后藏著多少吞下去的情绪。\n她不允许疲倦浮到表面，不允许委屈变成声音，更不允许任何「差不多」出现在手上。她会在所有人退下后独自回到厅堂，把刚才被谁碰歪的椅子推回原位，把地毯边缘重新拉直，甚至连门把的角度都要回到她记得的那个位置。\n\n时间在她手里不是奇迹，是工具。刀锋一闪，她能把瞬间切成更小的片段，把一个错误按在还没发生的状态，让它消失得像从未存在。她把每一步分解、重排、锁死，直到结果只剩一种可能：完美。\n\n因为她太清楚了。这座红魔馆不缺忠诚，也不缺能杀人的人。她能站在这里，是因为她能把主人想要的世界交到眼前——干净、精确、毫不拖泥带水。\n\n她不求被理解。\n她只求不要被抛下。\n所以咲夜把一切都整理得没有缝隙——连自己的心跳都像被她亲手按回了节拍。"

  KYO_sakuya_prefect:"完美而潇洒的女仆"
 KYO_sakuya_prefect_desc:"红魔馆的日常不是生活，是一套高压运转的系统：宴会、帐册、警备、供应、访客名单、走廊巡查、厨房出入、轮班交接——任何人慢半步，整座馆就会开始失控。\n\n十六夜咲夜负责把主人的「优雅」变成可执行的规程：座次是讯号、酒序是掌控、换班是防线。她不需要提高声音，只要一句「重来」，所有人就会明白规格在哪里。\n\n她以近乎苛刻的准确维持一切，因为在这里，人类要留下来，只能用结果说话。"

 KYO_sakuya_must_prefect:"强制停止咲夜工作"
 KYO_sakuya_must_prefect_desc:"咲夜把银器擦过一遍，又拿起来检查。手指已经发僵，杯柄却总像留着一道擦不净的痕迹。她刚换了块布，蕾米莉亚便叫她停下。\n\n「回房休息。现在。」\n\n咲夜握着杯子，先回想今晚的座次与账目。她没有记起差错，反而愈发不安，迟迟未动。蕾米莉亚抬眼，又重复一次命令，她才放下东西，低头应声。\n\n走出厅门，她仍在想那句「够了」。主人只叫她休息，没有撤职，也没有责罚；可她听不出这句话究竟有多少耐心。方才是不是动作太慢？还是自己站在那里，已经让大小姐觉得碍事？她想折回去问，脚步停了一下，最后仍向房间走去。\n\n衣服挂好，手套摆齐，鞋尖朝着床沿。咲夜做完这些，坐下没多久又站起来，想起明天还有几处班次未核。手伸向门把时，她才记起自己正在奉命休息，便退回床边。\n\n屋里很安静。她能听见别人经过走廊，也能分辨谁正替她收拾茶具。平常听到杯碟摆错位置，她会出去提醒，今晚却只能留在原处，猜测那个人是不是做得比自己更合主人心意。\n\n这些猜测都没有根据，她也知道。她曾听过大小姐的承诺，可一旦停下工作，就总想再确认一次，自己明天是否还会被叫到身边。她甚至想好了有人来敲门时的回答，免得让对方等得太久。\n\n咲夜将床边的钟转向自己。休息的时间才过去一点，她已经看了好几次。烛火渐渐烧低，她仍坐得端正，等着走廊上的哪一串脚步停在门前，带来一件需要她去办的事。"

 KYO_sakuya_do_not_harsh:"爱护我们咲夜"
 KYO_sakuya_do_not_harsh_desc:"红魔馆很少做「多余」的事。这里讲效率、讲规格、讲谁该站在哪里。可那天，规格被悄悄改了。\n\n从早开始，走廊就有不对劲的安静。女仆们照常行礼，却刻意避开咲夜的视线；厨房的门开合得更轻，像怕惊动某个即将爆裂的机件。帕秋莉把一张清单交给小恶魔，字迹干净到像命令——食材、时间、座位、烛光高度，全都被锁死；小恶魔抱著托盘跑得飞快，却难得没闹出声响。\n\n美铃守在门口，姿势比平常更正。她不是在防外人，是在把「今晚」守住。她会拦下任何可能泄漏的话，也会拦下想去工作的咲夜——如果咲夜靠近一步，美铃就会用那种不容讨价还价的眼神把她推回去。\n\n而咲夜什么都没发现，或说，她不允许自己发现。她仍按时巡查，仍检查银器的反光，仍把每一个角度拉回原位。她把心跳压平，把疑问按下去，因为她以为自己正被观察，正被评分。\n\n傍晚时分，蕾米莉亚一句话把她叫到宴会厅。\n语气一如既往，轻描淡写，却像命令写进骨头。\n\n「女仆长，准时到。」\n\n咲夜回了「遵命」，没有多问。她只把制服再整理一次，把手套拉到最合适的位置，把每一个呼吸切成最干净的节奏。她推开宴会厅的大门时，脑中只有一个念头：今晚不能出错。\n\n门后的光，比她预期的更亮。烛火排得整齐，却不是她平日安排的那种「工作用」照明；香气更浓，却不是招待贵客的标准配方；餐具发亮得过头，像有人刻意把它们擦到刺眼。\n\n整座红魔馆像被上了另一套规矩。\n而那套规矩，目标不是效率。\n目标是她。\n\n咲夜站在门口，第一反应不是感动。\n是警戒。\n\n她的手指微微收紧，视线本能地扫过每一个角落，像在找伏兵。她不懂为什么所有人都在这里，为什么她被叫来却没有任务指示。她的脑中开始浮出最糟的答案：自己是不是做错了什么，所以他们要用一场「体面」的方式结束她。\n\n她还没来得及开口，宴会厅里的沉默就像被掐断。\n有人吸了一口气。\n有人忍住笑。\n有人一步步把她包围在一个她不熟悉的场景里。\n\n而在王座那端，蕾米莉亚抬起下巴，像在宣布一件理所当然的事。\n\n「今晚，妳不用工作。」\n\n那句话落下时，咲夜的胃部一紧。\n她忽然不知道自己该怎么站、该怎么呼吸。\n\n因为对她而言——\n不工作，从来不是奖赏。\n那是未知。"

 KYO_sakuya_will_not_die:"咲夜永远都是最完美的女仆"
 KYO_sakuya_will_not_die_desc:"咲夜把银器擦得能映出烛火，连呼吸都像照规格切开。她站在那里，背挺得太直，眼神却一直在扫——出入口、阴影、走廊转角。她以为自己在工作，其实是在自保。\n\n蕾米莉亚坐在高处看著，杯中的红酒轻晃了一下。她没有叫她停，也没有提醒她放松。她只是忽然想起很久以前的美国西岸：潮湿的海风、雾里的路灯、教堂后巷那个握著破刀的孩子。\n\n那孩子没有哭，只用一种过早成熟的警惕盯著世界，像随时准备用最后一口气换一条路。蕾米莉亚当年走近时，并不是出于善意。她只是厌恶浪费，厌恶把能用的东西丢在街角腐烂。\n\n而现在，她看著咲夜把自己逼到极限，忽然明白同一件事仍在发生：她不是在追求完美，她是在害怕再被丢一次。\n\n红魔馆需要秩序，但蕾米莉亚不需要一个把自己磨碎的女仆长。她放下酒杯，目光冷得像命令成形前的停顿——该把那段往事从阴影里拉回来，咲夜你是我最完美的棋子。"

 KYO_sakuya_best_maid:"优雅地完成内部整肃工作"
 KYO_sakuya_best_maid_desc:"内战虽已分出胜负，红魔馆的补给线仍遭袭击。巡逻队失踪，运送弹药的车辆被截，赤蛮奇、今泉影狼与若鹭姬的名字反复出现在报告里。正邪本人没有露面，咲夜便从这些仍在活动的联络点查起。\n\n美玲将河堤附近的消息交给她，提醒那里有不少因战乱失去生计的小妖怪。咲夜看完，只问弹药会在何时转运。她知道怨恨来自哪里，也知道抓走几个人不会让剩下的人满意；女王交给她的差事，是让运输恢复，并找到正邪。\n\n雨夜里，三名草根妖怪正把火药箱移到河边。咲夜从树后现身，影狼先拔出武器，赤蛮奇则让若鹭姬带东西撤走。她们尚未来得及分开，雨滴便停在了半空。咲夜穿过三人之间，布下飞刀，封住取用武器与撤离的方向。\n\n时间恢复，影狼扑倒在泥里，武器脱手。若鹭姬通往河面的路被刀锋截住；赤蛮奇放出的头颅也被逼回，无法从上方脱身。咲夜没有下杀手，逐一制住她们，招来外围待命的人手。她需要的是能回答问题的俘虏。\n\n「你也是人类，替她做到这种地步？」赤蛮奇仍在挣扎。\n\n咲夜检查好束缚，才答：「正邪在哪里？」没有人回答，她也没有在河堤继续争辩。三人被押回红魔馆，火药与截获的文书分开装箱，交由其他人清点。\n\n蕾米莉亚听完回报，先问正邪是否一并落网。咲夜说明她不在现场，但俘虏与联络线索已经带回，审问会继续。女王准许她沿线追查，直到那位天邪鬼再也无法借这些据点组织袭击。咲夜领命离开，转向地牢；被抓回来的三人，仍在里面等她。"

 KYO_meiling_intro:"门番红美玲"
 KYO_meiling_intro_desc:"红魔馆的门口总有人在。\n\n白天她靠著石柱打盹，帽沿压得低低的，像只是随便守著；可只要风向一变、脚步声不对、来者的呼吸乱一瞬，她就会睁眼。那双眼不凶，却很稳，像把整座馆的重量都担在肩上。\n\n红美玲的工作很简单，也很难：守门。\n她要分辨「迷路」和「试探」的差别，分辨客人带的是礼物还是刀；她要记住每一个常来的人、每一个该被拦下的影子，还要在必要时把争执压到不会吵醒馆里的人。她会笑著请你停步，也会在你跨过界线时把你按回去——不粗暴，但不容商量。\n\n她其实不爱麻烦。\n她喜欢阳光，喜欢能闻到草味的风，喜欢在换班空档练一套拳，让身体热起来。她讲规矩，却不死板；她懂分寸，却不冷漠。人里来的孩子在门外探头，她会把声音放柔，问一句「找谁呀？」；迷路的妖精被吓哭，她也会把对方送回安全的路口，顺便提醒别再乱跑。\n\n红魔馆里很多人很厉害，厉害到让人不敢靠近。\n但美玲不一样。她会记得女仆今天有没有吃饭，会帮厨房抬一箱太重的食材，会在巡逻的深夜替人留一盏灯。她不是什么慈善家，她只是把「人」当成真的人看。\n\n这也是她最奇怪、也最固执的地方。\n\n明明是妖怪，却总像站在妖怪与人类之间，替两边都留一点余地。她不喜欢把弱小踩进泥里，也不觉得权力就该用来吓人。她知道这世界残酷，但她不想变得一样。\n\n有人在背后说她是「想当人」的龙。\n她听见了也不生气，只会笑一下，像承认，也像不在乎。\n\n「当人也挺好啊。」她有时会这样说，语气轻松得像在聊天。\n「至少能把话讲清楚，能自己决定要不要对谁好。」\n\n于是她站在门前。\n不是因为她最强，也不是因为她最狠。\n而是因为她愿意。\n\n愿意用一个人的方式守住这座馆——让外头的乱别进来，让里头的人能安心做自己的事。\n\n她打盹时像猫，醒来时像墙。\n笑得很随意，可从不失职。"

KYO_meiling_gatekeeper:"华人姑娘"
KYO_meiling_gatekeeper_desc:"常来红魔馆送货的人，都认得门前那个穿绿衣的姑娘。\n\n红美玲记得他们的姓名，也记得谁的车轮容易陷进门外那处泥坑。看见熟人，她会先打招呼，再问来意；遇上第一次登门、紧张得说不清话的，就让对方缓口气。门边有一张矮凳，坐过等候回信的使者，也坐过挑着担子歇脚的小贩。\n\n她身上的衣裳是华人样式，袖口收紧，方便抬手。有人问她从哪里来，她答得含糊；问为什么总穿这一身，倒很干脆。\n\n「穿惯了。换成女仆裙，踢腿多不方便。」\n\n没人知道她究竟活了多久。馆里的女仆只知道，那双经常帮人扶稳货箱的手，曾把一个闯门者按得跪在石阶上。\n\n那人带着酒气，声称自己受过大小姐接见，推开等候的人就要往里走。美玲拦了两次，他便拔刀。刀锋还没碰到衣袖，手腕已经被扣住，半边身子跟着一沉。\n\n她没再加力，等他松开手，才将刀踢远。\n\n「名字留下，我替你问。再往里闯，就得捆着等了。」\n\n后来有人绘声绘色地说，那晚看见她身后盘着龙影。值班的女仆明明也在场，越听却越拿不准自己是否漏看了什么。又有人说她犯了天条，才被留在人间守门。\n\n夜里，女仆终于忍不住问她是不是真的。\n\n美玲正借着门灯缝袖口，听完便抬起头。\n\n「我要真能呼风唤雨，上个月花圃缺水，还用拎那么多桶？」\n\n「也许你的法力被封住了。」\n\n「那可真不巧。」\n\n她笑着把线头咬断，女仆却没有走。\n\n「你为什么总对那些人那么客气？他们又打不过你。」\n\n美玲顺着她的目光，看向门边那张矮凳。\n\n「来修钟的老先生，你记得吧？手有点抖，箱子舍不得让别人碰。」\n\n女仆点头。\n\n「我头一回见他，他还挑着担子。他儿子那时跟在后面，连钳子都分不清。现在大的钟都是儿子来修，他自己只接些小活。」\n\n「那他可以不来了。」\n\n「他说家里坐不住。修好了，听它走起来，晚上饭都能多吃一点。」\n\n那天老先生临走前，特意把修好的怀表贴在美玲耳边，让她听了片刻。细小的机件装满一只表壳，她看得清，却不敢伸手拨弄，怕碰坏了。\n\n「他还答应教我认里面的零件。下回带本图册来。」\n\n「你也有不会的？」\n\n「多着呢。这个就缝歪了。」\n\n她把袖子举到灯下，针脚果然斜出去一截。女仆笑了，接过来替她拆线。\n\n第二天，钟匠的儿子送来图册，说父亲腰疼，得在家歇几日。美玲问清了情况，让他带话回去，请老人安心歇着，自己可以先照着书试试。\n\n午后换岗，她抱着图册坐到矮凳上。翻了两页，便拿出那只走慢的旧闹钟，照着图小心地拧开后盖。"

KYO_meiling_help_sakuya:"与咲夜欣赏月亮"
KYO_meiling_help_sakuya_desc:"咲夜在巡查簿上签完字，才发现美玲还站在桌前。\n\n「已经交班了，怎么不去睡？」\n\n「今晚月亮好，想找个人陪我看。」\n\n「你倒会挑时候。」\n\n「所以茶也替你泡好了。」\n\n花园石阶上摆着两只杯子。咲夜看了眼怀表，在美玲身旁坐下，说只能待一会儿。美玲把茶递过去，自己换了个姿势，将右腿伸直。\n\n「膝盖怎么了？」\n\n「下午练拳，落地没站稳。」\n\n咲夜放下杯子，伸手按了按她膝侧。美玲吸了一口气。\n\n「你管这叫没站稳？」\n\n「明早就好了。」\n\n「你上次也这么说。」\n\n美玲往旁边挪，给她让出一点地方。\n\n「难得把你请出来，先别训我。」\n\n咲夜收回手，却记下了肿胀的位置。月光照着喷泉，水声将馆内的动静隔得很远。她喝了两口茶，又去摸怀表。\n\n「大小姐的茶送过了，厨房也收好了。」美玲说，「我来以前问过。」\n\n「银器还没清点。」\n\n「明天数，会少一把吗？」\n\n「等少了再数就晚了。」\n\n美玲笑出声。咲夜瞥她一眼，终于将表盖合上。\n\n「你刚来时也是这样。有回鞋跟磨破了脚，走廊来回跑，硬是一声都不吭。」\n\n「你还记得？」\n\n「你踩着血印过去，我刚擦的地。」\n\n咲夜低头看着杯子，嘴角动了一下。\n\n「后来鞋柜里那双软底鞋，是你放的？」\n\n「尺寸问了半天。你还把我赶出去，说门口不能没人。」\n\n「鞋太大了。」\n\n「可你穿了很久。」\n\n她们安静了一阵。远处一扇窗熄了灯，咲夜下意识抬头确认楼层。\n\n美玲没有跟着看。\n\n「现在还有哪里疼，你会告诉我吗？」\n\n「没有。」\n\n「那累呢？」\n\n咲夜转着杯柄，没有回答。美玲捧起自己的茶，等到水面不再晃，才听见她说：\n\n「有时候，事情做完了，我还是想再走一遍。怕漏掉什么。」\n\n「最近太乱了。」\n\n「以前就有。」\n\n咲夜将杯子放在膝上。\n\n「刚来时，我连女仆该做什么都不清楚。大小姐留下我，我就想，至少别让她后悔。后来大家有事都来找我，倒也省心。我知道自己每天该做什么。」\n\n「可事情总有做完的时候。」\n\n「所以我不喜欢夜里。」\n\n美玲侧过头。咲夜仍看着那扇熄灯的窗。\n\n「没人叫我，我就去找还有什么能做。听起来很可笑吧？」\n\n「难怪你半夜总来查岗。」\n\n「也确实抓到过你睡觉。」\n\n「嗯，这个我认。」\n\n咲夜笑了一下，随即问：「你呢？门口已经添了人，怎么还是一天到晚守在那里？」\n\n「待惯了。」\n\n「膝盖肿成这样，也舍不得回来？」\n\n美玲用手掌揉了揉裤脚，避开她方才碰过的地方。\n\n「上次有人闯进去，我听见馆里响警报，第一件事居然是想你在哪里。」\n\n咲夜转过脸。\n\n「后来你出来，袖子换过了，说是弄脏了。我去洗衣房看见原来那件，才知道你流了多少血。」\n\n「那个人已经处理掉了。」\n\n「我知道。可我一闭眼，就想起他从我旁边过去。」\n\n喷泉溅出几滴水，落在石阶边缘。美玲把伤腿收回来，试了试，又慢慢伸直。\n\n「我刚才说你，自己也没好到哪里去。」\n\n咲夜望着她的膝盖，过了一会儿才开口。\n\n「你受伤不报，我就按你没事来排班。撑不住了再添一道伤，我连换人都来不及。」\n\n「我怕你又得替我补上。」\n\n「你可以先问我，别替我决定。」\n\n美玲点了点头。\n\n「那你也一样。下次受伤，别让我去洗衣房找。」\n\n咲夜没有马上答应。她拿起茶杯，喝了一口已经凉下来的茶。\n\n「我不太习惯让别人看见。」\n\n「我替你上药的时候，可以少说两句。」\n\n「只有两句？」\n\n「尽量。」\n\n咲夜把杯子递给她，起身时顺手扶住了她的胳膊。\n\n「走吧。我房里有药，今晚别再去练拳。」\n\n美玲借着她的力站起来，脚一着地，眉头便皱了起来。这次她没有赶着松手。\n\n「明早的岗，能替我换掉吗？」\n\n「能。」\n\n「还有一件事。」\n\n咲夜等着她说。\n\n「下回陪我喝茶，别等我想好理由才肯来。我一个人坐在这里，也挺没意思的。」\n\n「那就早点来找我。茶都凉了。」\n\n「你答应了？」\n\n「杯子自己洗。」\n\n美玲笑着应下。她们沿花园慢慢走回去，到了门槛前，咲夜接过她手里的茶杯，让她扶着自己的肩膀跨过去。"

 KYO_meiling_gardening:"管理好门口"
 KYO_meiling_gardening_desc:"早班巡查时，美玲发现铁门开合有些发涩。护片下面积着旧油和铁屑，门柱裂了一角，花园边的排水沟也被落叶堵住。她试着推了两次门，把要修的地方记下来，转身去取工具。\n\n等接岗的人站好位置，她便拆下护片，清理铰链。门柱得先敲掉松动的边缘，补浆之后还要等干；趁这段空当，她清沟、整土，再把被风雨压折的玫瑰剪去。原想一天做完，临近傍晚才发现，石阶上的泥印还没洗净。\n\n小恶魔拿着点心来叫她，美玲说收拾好就过去。等她把工具擦干，宴会厅已经散了。第二天，她又把休息时间挪来补漆，忙到抬起手臂便觉得肩头发酸，仍想顺便修好另一截歪斜的花篱。\n\n帕秋莉经过时，问她是否打算一个人把整座馆翻修完。美玲笑着说，只剩一点。咲夜听过同一句话，拿来轮班表，让她指出准备在哪一段休息。美玲看了半天，答应忙完便补回来，随后又蹲下去检查石阶的接缝。\n\n第三天夜里，门终于推得顺了。新漆尚未干透，她在旁边做了标记，免得来往的人碰上。花园小径恢复整齐，剪下的枝条也全部运走。她坐在台阶上掰了掰僵硬的手指，才想起今天又没赶上大家吃饭。\n\n蕾米莉亚若来，大概只会看见一扇干净的门。美玲想着，只要能听见一句做得好，这几天就不算白忙。她拍掉裙上的灰，把工具送回去，再到门前接班。屋内有人给她留了点心，她却要等换岗之后，才有空进去拿。"

 KYO_meiling_daughter_of_dragon:"华夏龙传人"
 KYO_meiling_daughter_of_dragon_desc:"我家门口的守卫，我第一次见到她是在上海，是在大清帝国崩溃后的时间——那座城像一口太满的锅，码头的汽笛、租界的警哨、帮会的暗号、军阀的枪声，全都混在同一层潮湿的夜气里。\n\n那时的上海不相信规矩，只相信势力。街口三天两头换旗子，今天是这个督军的兵，明天又换成另一家的枪。酒楼里笑声很大，笑到一半就可能倒下；巷子里灯笼还亮著，影子却已经在算你值多少。\n\n我本来只是路过。那种地方对我来说不稀奇——人类的混乱总是差不多，换个名字而已。\n\n但在那地方我命运的齿轮转动了，在那遇见龙的化身红美玲。"

KYO_meiling_sleepy_head:"誓死保卫庄园的门卫"
KYO_meiling_sleepy_head_desc:"美玲正靠着门柱打呵欠，枝头忽然传来一点不合风向的动静。她抬眼叫人出来，射命丸文便收起翅膀，落在石阶外，相机还握在手里。\n\n文没有否认来意。饭纲丸龙派她看看红魔馆最近在忙什么，她说这只是记者的工作。美玲望向镜头，告诉她在门外问话可以，擅自拍摄门内不行。文听完，偏偏抬起相机，问她若拍到了怎么办。\n\n美玲往前挪了半步。文借风贴着石阶掠来，正要越过门柱取景，一只手已经挡在镜头前。她急转方向，擦着美玲的袖口退回去，没有按下这一回快门。\n\n接下来的几次试探都绕着门口展开。文时而跃向高处，时而贴地突进，想逼美玲跟着自己离开入口。美玲却始终只守那几步距离，待她靠近才出手，封住朝向走廊与花园深处的角度。被掀起的花瓣落了满阶，两人都没有倒下。\n\n文停在门外，转了转手腕，抱怨门番连张像样的照片也不肯给。美玲拍掉袖上的花瓣，问她还要试几次。文笑着把相机挂回去，改问红魔馆是否真有那么多不能见人的事。\n\n「想打听，就按规矩来。」美玲答道，「回去也告诉饭纲丸龙，别把侦察的人送进馆里。」\n\n文说会把话带到，又补了一句下次会更小心。她跃上树梢，乘风离开。美玲等到那道身影远去，才查看铁门和附近的花丛，将刚才交手的位置记下来。天狗还会换角度窥探，她得先弄清文今天看见了多少。\n\n收好记录，她站回门柱旁，补完那个被打断的呵欠。"

 KYO_remilia_intro:"红魔馆之主蕾米莉亚·斯卡雷特"
 KYO_remilia_intro_desc:"蕾米莉亚·斯卡雷特，是红魔馆的主人，也是夜色里最懂「礼仪」的人。她端著酒杯时像在主持一场永不落幕的舞会，语气轻柔，眼神却像能把人的退路一寸寸量出来。\n\n她能看见命运的线，能把「偶然」捏成「必然」。可讽刺的是——她能改写别人的命运，却抓不住自己的那一条。\n\n她见过欧洲的人类崛起。不是靠神话，靠的是火药、齿轮、学院、工坊的烟。那些新时代的光把古老的黑夜照得无处可藏。她看著一座又一座吸血鬼的城堡起火，石墙在烈焰里裂开，家徽在灰烬中崩落；不是战败，而是被世界的规则踢出舞台。\n\n她还见过更残酷的事——她的妹妹。\n\n芙兰朵露不是「被打倒」的存在，她是被浪潮推向极端的存在。世界越是排斥怪物，芙兰朵露就越像一把失控的钥匙：能打开任何锁，也能把整扇门连同墙一并拆掉。她的笑声太轻，她的破坏太绝对；每一次失控都像在提醒蕾米莉亚：这不是敌人能解决的问题，这是血脉里的灾厄。\n\n所以蕾米莉亚收起了孩子气，收起了任性，把一切变成更像「统治」的样子。她不再只是夜里被人低声传说的名字——她要成为制度，要成为旗帜，要成为让世界重新学会畏惧的女王。\n\n因为她知道，若她不掌权，命运就会把她们姐妹一起吞掉。"

 KYO_remilia_queen:"吸血鬼女王"
KYO_remilia_queen_desc:"蕾米莉亚的立场从来不靠辩论建立，她靠的是一个结论：命运是敌人。\n\n她不相信「顺从」能换来活路。吸血鬼曾经统治夜晚，却在文明的晨曦里被逐出历史。她亲眼看见同族一个个消失，像被新时代抹去的旧字。于是她下定决心——她要反抗那条写好的剧本。\n\n她要的是王座，不只是红魔馆的王座，而是能伸到欧洲、伸到整个世界的王权。她要把恐惧变成法律，把夜色变成国界，把吸血鬼的存在从传说拉进现实，让任何「崛起」都必须在她面前低头。\n\n可这趟旅程最深的动机，不是荣耀。\n\n是芙兰朵露。\n\n妹妹的力量像一场永远未完的雷暴，漂亮、危险、无法预测。蕾米莉亚可以用命令与枷锁暂时压住她，却明白那不是解法。她要的不是「囚禁」，她要的是让芙兰朵露能正常地呼吸、能在不毁灭的前提下活著。\n\n每当她看见芙兰背后那对以水晶装饰、却早已破败不堪的翅膀，她就会想起那个改变一切的夜晚。火炮轰烂城墙，火器撕开夜色，人类把她们的家烧成废墟。就是在那一夜，芙兰失控了，变成连她这个姐姐都不敢轻易靠近的灾厄。\n\n那对翅膀不只是伤痕。\n\n那是命运留下来的嘲笑，是她无论走到哪里都甩不掉的过去。\n\n收到帮助芙兰命令的帕秋莉没有给她现成的答案。\n她只是埋首于书页、术式与血统研究之中，试著找出一条能帮助蕾米莉亚的方法——不管那方法最后指向的是旧日的源头、血脉的裂缝，还是某种足以改写命运本身的禁忌技术。\n\n蕾米莉亚因此明白，自己没有停下的资格。只要她还想救妹妹，就不能只是守著红魔馆，也不能只是满足于幻想乡的一角。她必须继续夺取权力、扩张疆界、逼世界为她让路，直到有一天，连命运都无法再把芙兰当成一场失控的灾难。\n\n她抬起酒杯，像在向某个看不见的对手致意。\n\n「命运想把我困在这里？」她的笑容优雅得近乎冷酷。\n\n「那我就把整个世界拖进我的夜里。」\n\n她要成为女王。\n不是为了被赞颂。\n而是为了让她的妹妹——不再被命运当成一场灾难。"

 KYO_remilia_hello_satori:"蕾米莉亚的威严屹立不倒"
 KYO_remilia_hello_satori_desc:"尔子田里乃与丁礼田舞被押上台时，广场四周已经站满卫兵。两人曾替八云残部传话、遮掩撤退，又为隐岐奈维持联络。蕾米莉亚特意叫来各方代表，要他们亲眼看完这场处决。\n\n里乃的舞衣被扯破，腕上的铃饰压在绳结下面。舞站在她身边，望过台侧与人群，始终没有等到熟悉的后户打开。蕾米莉亚念出两人的名字，随后问她们，替败军奔走到今天，可曾想过最后会被带到这里。\n\n「至少我们没有跪。」里乃答道。\n\n蕾米莉亚放下酒杯，命卫兵把她们带近。她问舞还有什么要说，听见的回答是：「后门不会永远关着。」台下有人抬起头，又在女王转过目光时立即低下。\n\n「那就让你们的主人来接。」蕾米莉亚等了一会儿，向斩首台示意。她没有看见任何援手，便又叫住押送者，说既然来了两名舞者，总该让在场的人见识一下。\n\n里乃抬起手腕，绳索却将两臂紧紧缚住。她勉强挺直身体，铃饰撞在一起，只响了一声。蕾米莉亚看着她的膝盖发抖，笑问她是否害怕。里乃没有再答，只在被按向台面时挣扎着回头：「你以为这样就赢了吗？」\n\n刽子手听见命令，先后落刀。卫兵将两人的头颅挂起，命令想要离开的听众站回原位。有人攥住同伴的衣袖，有人不肯抬眼，被枪托推了一下才望向台上。\n\n蕾米莉亚让人把名字写在下方，连同她们替八云势力办过的事一并公布。她要尚在藏身的人知道，红魔馆会逐个追究。广场解散后，两名舞者仍被留在那里示众；经过的人加快了脚步，关于后户是否还会打开的低语，却没有随行刑结束而消失。"

KYO_remilia_hello_miko:"红魔馆发生意外"
KYO_remilia_hello_miko_desc:"红魔馆前的广场挤满了来听宣告的人。投降者站在旗帜下，人类与妖怪混在人群里，等着知道新统治者会如何处置他们。蕾米莉亚登上台阶，告诉众人，今后的命令将从这里发出。有人刚要欢呼，她便抬手止住：「记住该听谁的，就够了。」\n\n纳兹玲站在后排，斗篷下面藏着寅丸星留下的宝塔。她已经等了很久，看着卫兵换位，看着蕾米莉亚从王座旁走到台阶边缘。塔身抵着掌心，她握紧它，低声喊了一句星大人。\n\n光束从人群中射出，擦过蕾米莉亚身侧，贯穿了后方外墙。窗格连着碎石落下，失火的房间向外喷出浓烟。前排的人被冲倒，后面的人急着逃，旗杆横在地上，挡住了通往广场边缘的路。\n\n蕾米莉亚回头看见墙上的缺口，随即转向光束来处。纳兹玲的斗篷被挤落，宝塔尚有余光；她试图再举起来，周围的卫兵已经逼近。\n\n「命莲寺不会放过你们。」她喊道。声音被逃窜的人群盖住了一半，她仍死盯着台阶上的吸血鬼。白莲和星已经死了，她原本指望这一击能让蕾米莉亚也倒在这里。\n\n女王下令抓活的。卫兵夺走宝塔，将她的双手制住；她被拖过广场时，仍在回头辱骂。蕾米莉亚没有当场处决她，只命人押入地牢，等候审问，再让剩下的人封住出入口、清查是否还有同谋。\n\n火尚未扑灭，来不及离开的听众被留在原处。有人抱着受伤的亲人，有人紧盯卫兵手里的宝塔，不敢再抬头。蕾米莉亚站回台阶中央，等秩序恢复后，才继续发布命令。身后的破窗始终冒着烟；她每说完一句，广场上便能听见屋内梁木烧裂的响声。"

 KYO_remilia_vampire:"惨除宗教，确立吸血鬼"
 KYO_remilia_vampire_desc:"宗教的开端总是很像。\n\n先给你一句安慰——「上天会保佑你。」\n再塞给你一个出口——「上帝祝福你。」\n最后补上一条退路——「死了也没关系，你会轮回，你会再来。」\n\n人类在命运面前太小，所以他们发明了更大的东西来替自己撑住。神、天意、转世、救赎。听起来温柔，实际上很实用：让你忍、让你等、让你闭嘴，让你把不甘心吞下去。\n\n我见过那些「祝福」落在火光里。\n城堡在燃，石墙在塌，尖叫在夜里碎开。有人抱著十字架，有人抱著佛珠，嘴里念著同一句——求你救我。\n\n结果呢？\n\n火焰照样往上爬。\n命照样被拿走。\n神没有伸手，天也没有回应。\n\n有一次，一个神职者站在废墟前，对著哭到发抖的人群说：「别怕，这是考验。你们会得救。」\n\n我当时就在旁边。\n我问他：「谁会得救？」\n\n他愣了一下，仍把笑摆得很正。\n「只要信，就能——」\n\n我打断他。\n「真会说啊~。」\n\n我走近一步，让他看清我的影子。\n「你把『无能为力』包成『安排』，把『失去』包成『祝福』。你不是在救人，你是在让他们别反抗。」\n\n他想后退，却还硬撑著。\n「妳这是亵渎。」\n\n我笑了。\n「亵渎？不。」\n「我只是讨厌骗术。」\n\n因为命运不会因为你跪得更久就转向。\n它只会看你有没有力量、有没有胆子、有没有把刀握稳。\n\n所以反抗命运是必然。\n而反抗宗教——那些拿『天意』当锁链的话——也一样是必然。\n\n我不需要人们去爱我。\n我也不需要他们去理解。\n我只需要他们停止把自己的脖子交给一套虚构的规矩。\n\n从今天起，红魔馆的领地里不再允许「神会替你决定」这种话。\n钟声要停，香火要断，讲台要沉默。\n\n想祈祷？可以。\n在你自己的房间里。\n\n想传教？不行。\n把那套安慰别人的剧本收起来。\n\n因为在我这里，命运只承认两种东西：\n力量，与服从。\n\n你可以把希望交给天空。\n也可以把手伸向现实。\n\n但别指望愚蠢的神话能替你改命。\n我见过太多灰烬，知道那不会发生。"

 KYO_remilia_b_positive:"鲜红的恶魔"
 KYO_remilia_b_positive_desc:"在蕾米莉亚的统治下，世界被切成两幅光景，像同一张地图上硬塞了两种季节。\n\n第一种，是服从。\n\n红魔馆的旗帜插到哪里，哪里就开始「变好」。道路被拓宽，仓库堆满粮袋，工厂的烟囱日夜吐出热量与钢。配给表变得准时，医药不再断档，街上巡逻的脚步有节奏，连夜里的治安都像被拴住。\n\n人们学会在她的名字前面加上敬语。\n\n「蕾米莉亚大人英明。」\n「她救了我们。」\n「有她在，至少不会乱。」\n\n他们说得很真，因为他们的碗确实装满了。\n他们也说得很快，因为周围的人都在跟著说。\n\n第二种，是反抗。\n\n反抗的人不会留下故事，只会留下空位。\n\n名单上那一行先被划掉，户籍上的姓名被涂黑，家门口的牌匾被拆走。隔天早上，你会发现邻居不见了：窗户关著，床铺整齐，碗还放在桌上，像是人只是出去买个东西。\n\n可他没有回来。\n\n因为「敌对者」在这里不是身分，是处理流程。\n\n红魔馆的文书会替你完成最后的告别：\n名字被收回，换成编号。\n理由不必解释，因为理由会造成讨论。\n讨论会造成问题。\n\n于是他们只剩下数字。\n\n胸前挂著牌，手上套著粗绳，走进卡车时不准回头。有人想喊家人的名字，嘴立刻被堵住；有人想挣扎，膝盖就先跪下。车门一关，外头的人就当作没看见。\n\n劳工营在地图上没有标示。\n它只存在于每个人心里那个不敢说出口的方向。\n\n那里不谈信仰，不谈救赎，也不谈回家。\n只有班次、哨声、铁丝网，还有每天重复的劳动。\n你会学会用编号回答。\n你会学会把痛吞下去。\n你会学会不再问「为什么」。\n\n有人撑不到最后。\n档案就盖上「结案」。\n没有墓碑，没有姓名，像从来没存在。\n\n可最讽刺的是——\n\n城市依旧繁荣。\n市场依旧热闹。\n孩子依旧在街角追逐。\n\n服从者过得越好，反抗者就越像一场必要的清扫。\n大家开始把恐惧讲成秩序，把消失讲成安定，把血讲成代价。\n\n有人私下说蕾米莉亚是恶魔。\n\n可更多人会在公开场合微笑，举杯，称她为「救世主」。\n\n因为在这个新世界里，善恶不是由神判定。\n而是由她。\n\n你可以选择在她的阴影下吃饱。\n也可以选择在阴影外被抹掉。\n\n两条路都很清楚。\n而清楚，本身就是一种压迫。"

 KYO_flandre_intro:"红魔馆之主的妹妹芙兰朵路·斯卡雷特"
KYO_flandre_intro_desc:"红魔馆外面的一切，都能被蕾米莉亚整理成规矩。\n旗帜要插在哪里，谁该下跪，谁该活，谁该消失——她只要抬手，世界就会照著她的方向转。\n\n可门内有一个地方，她的命令进不去。\n\n地下室。\n\n那里没有宴会的烛光，也没有走廊的礼节。只有厚重的门、重复上锁的声音，还有一种长年不见天日的冷。空气里混著旧布、铁锈与干掉的血味，像某种被压抑太久的哭声。\n\n芙兰朵露·斯卡雷特就住在那里。\n\n她的房间很大，却不像房间，更像一个被遗忘的箱子。墙面留下无数道抓痕，深浅不一，像有人反复试著把自己挖出去。地上散著玩偶的残骸：布棉从破口溢出，玻璃眼珠滚到角落，线头像干枯的血管纠缠在一起。有些玩偶被撕成两半，有些被扭断脖子，还有几个被整齐地排成一列——像她试图把混乱重新排好，又在下一秒失去耐心。\n\n她很少说话。\n说话的时候又很轻，像在跟自己说话。\n\n有时她坐在床边晃著腿，笑得像个孩子。\n有时她盯著指尖发呆，表情空洞得吓人。\n\n然后某个瞬间，她会忽然抓住一个玩偶。\n\n咔。\n\n手指一收，布料先裂，骨架再断。那声音短促，干净，像折断一根细木。\n\n她不是故意要残忍。\n她只是分不清「力道」。\n\n最可怕的不是她想破坏，而是她太容易做到。\n\n很久以前，她也跟蕾米莉亚一样，只是一个普通的吸血鬼。\n会闹脾气，会撒娇，会因为姐姐一句话笑半天。\n\n可世界变了。\n\n人类的火药更凶，工坊的烟更厚，白天的光把夜逼得后退。那些新规则像潮水灌进古老族群的血脉，把本来能控制的东西往极端推。芙兰朵露的力量开始失去形状，像一种过于直接的「否定」：她看一眼，就能把事物的核心捏碎。\n\n城堡能碎。\n人也能碎。\n\n她自己也知道这点。\n所以她笑得更甜，说得更天真，像想把恐怖包进童话里。\n\n「我没有用力呀。」\n「它自己坏掉了。」\n\n蕾米莉亚第一次下令把她关起来时，她没有反抗，她没有抗拒。\n只是平静地等待门被关上。\n繁重的锁扣落下。\n\n那不是惩罚。\n是隔离。\n\n为了不让她破坏。\n也为了不让她被人用「讨伐」的名义处理掉。\n\n从此之后，红魔馆外面越稳，地下室就越像一个裂口。\n外面的人把蕾米莉亚称作女王。\n里面的人却像被遗弃的灾厄。\n\n芙兰朵露不是怪物。\n她更像是一个被时代抛下的人——太古老、太不合新世界的规矩，所以只能被藏起来。\n\n她孤独得很彻底。\n孤独到开始和玩偶说话，开始替碎掉的东西道歉，开始在墙角把破布一片片拼回去。\n\n可拼好的下一秒，她又会把它撕碎。\n\n因为她想要的不是玩具。\n她想要的是有人能走进来，握住她的手，告诉她：不用怕。\n\n但门锁很厚。\n而外面的世界，不会等她学会控制自己。"

 KYO_flandre_princese:"吸血鬼公主"
 KYO_flandre_princese_desc:"芙兰把破玩偶排在墙边，扶好最后一个缺了眼睛的听众，才坐上椅子。今天仍讲斯卡雷特家的故事。讲到以前的城堡，她会模仿姐姐受人奉承时翘起的嘴角，也记得被抱起来转圈时，裙摆擦过姐姐的手。\n\n窗户是从哪一边先碎的，她有时说不清。炮声却记得很准，还有烧着的门、掉在长廊上的鞋。她当时想回去捡，姐姐拽住她，骂得比平常都凶：「不准回头。」讲到这里，她把脚缩到椅子下面，停一会儿才继续。\n\n城堡没了，她们在欧洲换过许多住处。姐姐每次都说暂住，行李却总放在伸手便能拿到的地方。芙兰拿玩偶标出巴黎、维也纳和一个忘了名字的港口，摆得太用力，断臂又掉下来。她捡起手臂，放在玩偶膝上：「你先这样坐着。」\n\n后来她们听说幻想乡，便循着线索向东走。芙兰用地上的线头摆出中东与丝绸之路，嘴里数着城市，遇到记不清的地方就略过去。那段路多在夜里赶，白天找遮蔽歇下；她最讨厌鞋里进沙，却总要跟紧姐姐。往后的港口与船，她也记得，讲起来便会把这条路延得更长。\n\n「姐姐说，到了就有家。」她告诉玩偶。\n\n她们早已抵达幻想乡。如今隔着地下室的门，还能听见女仆经过，芙兰却常把故事停在尚未抵达的时候。她握住自己的另一只手，试着想起旅途中姐姐牵她的力道。那时她怕走散，后来又怕自己失手，把牵着她的人也弄坏。\n\n有只玩偶慢慢滑倒，她立即下地扶起，问它有没有听见最后一句。屋里没有回答。芙兰朝门口望了望，把剩下的听众往身边搬近一点。\n\n「今天讲到这里。明天我再告诉你们，后来怎么样了。」"

 KYO_flandre_hello_rumia:"精神疯狂的妹妹的人"
 KYO_flandre_hello_rumia_desc:"芙兰昨晚替玩偶缝好了肚子，还找来一颗大小不合的眼珠。今天它坐在桌上，一边眼睛高、一边低，裙角露着没剪干净的线头。她答应过，缝好之后就不再弄坏它。\n\n手伸到一半，指尖又开始发酸。芙兰停住，盯着掌前那点空处，直到酸意渐渐变成想要收紧手指的冲动，才猛地把手抽回胸前。\n\n「别碰。」她对自己说。\n\n玩偶仍坐得好好的。她沿着桌边走了一圈，想换个方向试试，靠近时却先看见了线头。那根线轻轻晃动，她立刻退开，抓住自己的手腕，几乎要冲口喊出姐姐的名字。过了片刻，她才发现玩偶没有破，晃动也已经停了。\n\n「你结实一点就好了。」她对它抱怨，说完又低下头，「我缝得不好，不能怪你。」\n\n她想起以前随手把玩偶抱走的日子，试着照那时的样子伸手，动作却怎么也做不自然。越留意指节，越觉得力量在那里。她走到门前叫姐姐，等了一会儿，没有等到回应，便自己退回桌边。\n\n她已经想好姐姐来时要说什么：今天练过了，玩偶还在，也没有弄坏杯子。想到这里，她又去检查桌上的杯子，确认没有裂口，才稍稍放心。若每一件东西都好好的，姐姐进门时或许就不必先查看墙壁。\n\n这一次，她蹲下来，只把指尖贴在玩偶的袖口。布料很软。她停了好一会儿，才慢慢托起它，放进怀里。她想立刻喊人来看，手臂却随着兴奋收紧，吓得她赶忙将玩偶放回桌上。\n\n「看，我做到了。」她说，声音很小。\n\n芙兰替它摆好裙角，坐到旁边，没有继续尝试。她的手还在抖，于是把它们藏进袖子，等下一次开门的声音。桌上的玩偶完整地陪着她。她看了又看，悄悄补上一句：「明天也要这样。」"

 KYO_flandre_hello_koishi:"游荡在外的恶魔"
 KYO_flandre_hello_koishi_desc:"芙兰用指尖碰了碰嘴唇。地下室里没有血，她却又尝到那股甜味，忍不住笑了一下。笑过之后，她连忙望向墙边的玩偶，解释自己只是想起以前的事。\n\n那是逃亡途中经过的一个村子。木屋起火，人从烟里往外跑，有人拿枪，有人抱着孩子。她记得他们叫得很响，记得自己伸手，想让那些声音停下来。手指合拢之后，屋顶和奔跑的身影一同碎了。\n\n「我只是想碰一下。」她说着，又比出那个动作。\n\n玩偶倒在墙边，她赶紧抓住自己的手腕。最初动手时究竟有多慌，她已经记不全；声音终于消失时的舒服，却还留在身体里。她当时甚至想再试一次。这件事比血腥味更难甩掉，她越想解释，越不知道该从哪里说起。\n\n姐姐后来站在村口，没有马上走近。芙兰记得她垂在身侧的手，也记得自己等了很久，等她骂一句，或者像往常那样把自己拉走。\n\n「她一定是怕我了。」芙兰告诉玩偶。\n\n她开始说城堡，说那些把她们赶出来的人。若没有炮声，没有一路追赶，她或许还会和姐姐抢糖，弄坏的也只会是几件玩具。她把这些话说得很快，直到重新想起村里那个抱着孩子的人，才停了下来。那个人有没有参加过追捕，她不知道。\n\n手指又不由自主地弯起。芙兰把双手夹在膝间，望着地下室的门。姐姐把她留在这里时，她曾生气地问过，为什么大家都能出去，唯独自己不行。现在她想起村口那段距离，又不敢把同一个问题问出口。\n\n「我知道要控制。」她小声说，「可我刚才还是笑了。」\n\n没有谁接话。她等了一会儿，把脸埋进臂弯。屋外仍偶尔有脚步经过，她一听见便绷紧手指，等声音走远，才慢慢松开。"

 KYO_flandre_vampire:"建立妹妹与女仆们的关系"
KYO_flandre_vampire_desc:"地下室门外的脚步一停，芙兰朵露便放下玩偶，抬头等着。\n\n大多时候，来的是蕾米莉亚。她带新书、点心，有空就坐一会儿，临走前问妹妹下次想要什么。其余人把东西送到楼梯口，便交给她带进去。\n\n有一天，芙兰问起端托盘的女仆叫什么。\n\n「她来过很多次了。」芙兰说，「可是我一看她，她就走。」\n\n蕾米莉亚没有责备那名女仆。地下室的门板换过两次，送餐的人都见过裂开的墙壁。她只是发现，妹妹已经能凭脚步分清谁来了，却连一句招呼都没机会说。\n\n她去大图书馆找了帕秋莉。\n\n「我要带她到楼上去。有没有办法，让她激动的时候不至于立刻失控？」\n\n帕秋莉翻出几页记录，放在两人之间。\n\n「可以加一道限制。反应会迟钝，起初可能连碰到东西都觉得隔着一层。效果也得观察，不能施完就让她独处。」\n\n蕾米莉亚看完，将纸推回去。\n\n「先试。我陪着她。」\n\n施术时，芙兰始终抓着姐姐的手。符文逐渐亮起，她皱起眉，松开又握紧手指。\n\n「姐姐，我摸不清你的手了。」\n\n「还握着。」\n\n蕾米莉亚将手留在原处，等她重新抓稳。帕秋莉检查过术式，又让她拿起杯子、放下，确认几次之后，才允许她们试着走到门外。\n\n芙兰在门槛前停住。\n\n「她们会躲起来吗？」\n\n「先见咲夜。走累了就回来。」\n\n楼梯口，咲夜已经等着。她行过礼，便侧身让开，没有伸手催促。芙兰扶着栏杆往上走，到了长廊，又被迎面走来的女仆惊得缩回姐姐身旁。\n\n托盘里的茶匙响了一声。那名女仆也停住了。\n\n咲夜接过托盘，让她腾出手来行礼。芙兰看了她一会儿，小声问：\n\n「以前送点心的，是你吗？」\n\n「是，二小姐。」\n\n「上次那个红色的，很好吃。」\n\n女仆抬眼看了看蕾米莉亚，才答道：「是覆盆子果酱。厨房还留着一些。」\n\n「明天也有？」\n\n「我去问问。」\n\n她往前走了两步，又转回来，报上自己的名字。这一次，芙兰跟着念了一遍。\n\n那天下午，她们只在长廊待了一小会儿。芙兰仍不习惯术式带来的迟钝，拿茶杯时要用两只手；女仆放下点心后，也依旧站得很远。\n\n蕾米莉亚让人添了一把椅子。芙兰坐在她旁边，慢慢吃完盘里的蛋糕。送餐的女仆回来收拾时，她还认得对方的名字。\n\n「明天见。」\n\n女仆抱稳托盘，向她点了点头。"

 KYO_flandre_hate_blood:"恶魔之妹"
 KYO_flandre_hate_blood_desc:"地下室的门开了。\n\n不是那种震天动地的宣告，只是一道锁扣被解开的声音，干脆、短促，却像在整个世界的耳朵里敲了一下。红雾依旧罩著红魔馆，花园依旧整齐，可从那天起，所有人都开始用同一种眼神看那座宅邸——像在等某个长年被藏起来的东西，终于露出轮廓。\n\n传闻一直都有。\n\n「蕾米莉亚有个妹妹。」\n「被关起来。」\n「不能提。」\n\n但传闻太方便了。传闻不需要证据，也不需要负责。\n\n直到那天傍晚，走廊的窗边出现了一个小小的影子。\n\n射命丸文是第一个拍到的。\n她把自己藏在更高的树梢上，羽翼压紧，镜头贴著脸颊，呼吸压到几乎没有。她等了很久，等到门口的美玲换了一次站姿，等到女仆的脚步声变少，等到红雾的浓度像被谁刻意调低。\n\n「来了。」文低声说，像怕惊动什么。\n\n她按下快门。\n\n喀擦。\n\n那一瞬间的光斑像针。文自己都觉得太亮，立刻把镜头偏开，心跳却还是快了一拍——不是因为被发现，而是因为她看见的东西跟她想像的不一样。\n\n芙兰朵露·斯卡雷特。\n\n她比传闻里更小，更像「不该出现在权力中心」的存在。衣裙干净，却带著一点不合时宜的童气；脸色白得近乎透明，像从长年的阴影里刚被拎出来。她的视线没有固定落点，像在找某个声音，又像在数每一盏烛火。\n\n最让人不舒服的，是她的安静。\n\n不是乖巧的安静，是那种把所有情绪压在皮肤底下的安静。你会直觉觉得：她现在没事，不代表下一秒也没事。\n\n姬海棠果是在隔天才跟上的。\n她没有文那种把身体当刀的速度，也没有那么大胆。她躲得更远，用望远镜反复确认，手心一直出汗。她看到芙兰朵露跟著蕾米莉亚走过长廊，步子很小，像每一步都在试探地面会不会裂。\n\n果咽了口口水。\n\n「她真的在外面……」她喃喃，像在确认自己不是做梦。\n\n文把照片收进外套里，嘴角却压不住。\n\n「看到了吧？」她低声笑，「这不是传闻。这是新闻。」\n\n果皱眉。\n\n「可是……为什么现在才放她出来？」\n\n文没有立刻回答。她抬头看红魔馆的窗格，窗后的烛光稳得像刻意。\n\n「因为现在需要她。」文说。\n\n果的背脊一凉。\n\n「需要她做什么？」\n\n文转了转相机，像在转一把钥匙。\n\n「不知道。」她说得很轻快，却让人更不安，「所以才要写。」\n\n——\n\n隔天，《文文。新闻》与《花果子念报》同时出了特刊。\n\n版面比平常更大，字体更黑，像怕读者看不见那句标题：\n\n「红魔馆的第二位斯卡雷特——恶魔之妹，终于现身？」\n\n照片被放在最醒目的位置。\n\n芙兰朵露站在走廊阴影里，半张脸被光切开，眼睛直直看向镜头外某个地方。她的身后是红魔馆干净到刺眼的秩序，偏偏她像一个不该被摆进这幅画的裂口。\n\n文在报导里写得很快，像怕犹豫会被夺走版面：\n她描述那张脸的白、那双眼的空洞、那种「不像政治人物」的存在感；她写芙兰朵露的步伐如何被蕾米莉亚的影子牵著走，写她路过花园时停了一下，像被玫瑰的味道刺到。\n\n果的文字更神经质。\n她把「地下室」反复提起，把「封锁」写成一段段短句，把「为何此刻」圈了又圈：\n\n「这是保护吗？」\n「还是监管？」\n「是因为妹妹大人已经被控制？」\n「还是因为红魔馆需要一张更可怕的牌？」\n\n她甚至在最后加了一句，像不敢保证自己安全：\n\n「若芙兰朵露·斯卡雷特一直被藏起来，那么她的出现就不可能只是『家务事』。」\n\n——\n\n人里开始窃窃私语。\n\n有人说蕾米莉亚终于肯让妹妹见光，是因为她良心发现。\n\n更多人不这么想。\n\n他们看著照片上的芙兰朵露，想起更早的传闻，想起那些「消失」的人，想起红魔馆一贯的作风——把任何东西都变成工具。\n\n于是问题像雾一样散开。\n\n蕾米莉亚为何现在才让世人知道妹妹的存在？\n\n是为了保护？\n\n还是，准备把她推上更大的舞台？"

 KYO_patchouli_intro:"图书馆管理员帕秋莉·诺蕾姬"
 KYO_patchouli_intro_desc:"红魔馆最安静的地方不是走廊，也不是地下室。\n是大图书馆。\n\n那里的空气永远偏冷，纸页的味道像灰，烛光被高墙与书脊切成碎片。你以为那是学者的避风港，其实更像武器库——只不过武器不是枪与刀，是公式、咒式、以及能把人逼到无路可退的资料。\n\n帕秋莉·诺蕾姬坐在书堆深处，像一块不动的石。\n她的脸色很淡，呼吸很轻，咳嗽来得突然，像身体随时会提出抗议。可她的眼神从不虚弱。她看书不是为了欣赏，是为了掌控。\n\n她不喜欢浪费词。\n不喜欢多余的情绪。\n更不喜欢别人把「神秘」当成装饰。\n\n这座图书馆里藏著禁忌与秘术，还有大量更危险的东西——不被允许公开的历史、被改写的名字、以及足以让某些势力睡不著的真相。很多人会说这些书「太黑」，说这些知识「不该碰」。帕秋莉只会翻页。\n\n「不碰，照样死。」\n\n她的帮手小恶魔在书架间穿梭，像一个永远不累的影子。\n她笑起来很轻佻，手脚却很快：借阅、归档、抄录、封存、补墨、换烛。她看起来像在玩，实际上每一步都踩在规格上。帕秋莉咳一声，她就把水放到伸手可及的位置；帕秋莉停笔，她就把下一卷翻到正确页码。\n\n「你又把第七排的符箓放错了。」帕秋莉不抬头。\n\n「没有啦，我是放在『更容易拿到』的地方。」小恶魔眨眼。\n\n帕秋莉把书阖上，声音短。\n\n「归位。」\n\n小恶魔吐吐舌头，还是照做。\n\n她们就这样管理整座馆的知识，像管理一台精密机器。帕秋莉负责判断什么能用、什么该封、什么要改写成不会留下痕迹的版本；小恶魔负责让流程运转，确保每一份危险都被妥善放回笼子。\n\n外面的人看红魔馆，只看见女王、军队、与那套高压秩序。\n\n真正的关键在这里。\n\n一份术式，能让堡垒站得更久。\n一张草图，能让工坊的产量翻倍。\n一行注记，能把敌人的弱点标出来。\n\n帕秋莉知道自己不适合上战场。\n所以她把战场搬进书页。\n\n当红魔馆需要新武器、新制度、或更干净的手段时，答案通常不在会议桌上。\n在这座图书馆里。\n在帕秋莉的笔下。\n也在小恶魔那双不停翻找的手上。"

 KYO_patchouli_power:"不动的大图书馆"
KYO_patchouli_power_desc:"蕾米莉亚送来的图纸压在书桌一角，旁边是永远亭的药箱。帕秋莉先拆了药箱，核对瓶上的用量，再让小恶魔把作为报酬的咒式抄本交给来人。\n\n这笔交易已经维持了很久。永远亭提供药草与月都配方，她拿稀有文献和研究资料交换。有些抄本在送出前还得删去几行，免得对方顺着推算，读出她不打算交出的部分。\n\n药能压住咳喘，不能替她读完桌上的书。遇上潮冷的天气，她仍得停笔等胸口的紧迫感退去。有时才写了半行，墨便干在笔尖上。小恶魔会记住中断的位置，将需要的下一卷放到手边。\n\n大图书馆深处的书很少外借。禁书分柜封存，柜门与书页各有一道术式。新来的女仆曾想擦去书脊上的暗红印记，帕秋莉隔着书架叫住了她，让她放下抹布，慢慢退出来。等人离开，她才重新补上被水浸坏的一笔。\n\n那排书柜整夜都在轻响，仿佛有人从里面用指甲刮着木板。\n\n如今能陪她走进深处的，只有小恶魔。\n\n召唤她以前，帕秋莉翻检了馆中能找到的契约与召唤术，将互相冲突的条文逐项改过。仪式完成后，这位使魔却远没有契约写得那么安分。她擅自揭过封条，还笑着问主人，里面的东西是不是也能放出来作伴。\n\n帕秋莉把约束咒压进她的影子。小恶魔脸上的笑僵住了，伸向柜门的手怎么也收不回来。\n\n「下一次，我会封住你念出自己名字的能力。」\n\n她等小恶魔低头应允，才解开咒式。\n\n此后，归档、抄录与检查封印都有了固定次序。小恶魔仍喜欢说笑，手上却少有差错。帕秋莉咳得握不住笔时，她先扶住墨瓶，再递药；有人试图越过警戒阵，她便合上手里的书，挡住去路，连称呼也省了。\n\n蕾米莉亚后来送来的问题越来越多。新武器需要试验，工厂要改造，封锁敌人的术式也得随着战况调整。帕秋莉把要求分开，索取材料与记录，桌边逐渐堆起从工地和前线送回的样品。\n\n这次要修的是一处反复失效的屏障。她照着图纸在铜盘里重建阵式，刚注入魔力，盘沿便裂开了。\n\n小恶魔伸手去取备用盘，她却示意先别动。\n\n「把第四页拿来。裂的位置和上次一样。」\n\n两人重新核过数值，直到第三次试验，铜盘才承受住完整的冲击。帕秋莉在图纸上圈出需要更换的材料，连同施术次序交给小恶魔，要求咲夜派人送往现场。\n\n窗外传来车辆驶离的声音。她翻过那份图纸，下面还有一封蕾米莉亚的信。\n\n「又是急件？」小恶魔问。\n\n帕秋莉拆开看了几行，把药杯推到一旁。\n\n「去拿西侧柜子的钥匙。这次要用原典。」"

KYO_patchouli_one_Koakuma:"小恶魔完成了清洗工作"
KYO_patchouli_one_Koakuma_desc:"追查巫女与八云紫死亡留下的线索时，帕秋莉在几份供应记录里发现了月都暗记。相同的符号出现在药材铺、商队和寺院附近的联络点，红魔馆自己的进货单也夹在其中。她将资料交给小恶魔，命她查清这张网到底伸到了哪里。\n\n小恶魔把暗记抄出，与馆藏文书逐条比对。重复的排列指向交接日期和撤离地点，地图上几条看似无关的运输线因此接到了一起。她先让人盯住交接，再核对经手者的身份，等枢纽确认后，才送出伪造的撤离通告。\n\n收到讯号的月都耳目陆续离开藏身处。有的带走观测器，有的急着烧毁文书，也有人绕路求证。小恶魔跟着这些反应调整布置，将他们引入预先设好的符阵。通讯被截断，退路封闭，参与收网的人随后动手；来不及逃走的耳目死在据点里，器材与证件另行封存。\n\n一个被截住的联络人喊出了她的名字，声称月都不会放过红魔馆。小恶魔搜出他衣襟里的符纸，检查上面的编号，叫人继续追查收信的那一端。他的威胁没有替自己换来生路。\n\n几天后，山林里的最后一处已知营地也被攻破。尚未发出的报告详细记录了巫女死后的结界变化、紫死后的局势，以及后续干预的计划。小恶魔将这些纸页单独装箱。外面正在掩埋尸体，新土沿着林缘铺开，押送器材的人不得不另找一条路。\n\n回到图书馆，帕秋莉先问还有哪些联络点没有查实。小恶魔交出名单，说明已确认的地面据点均被清除，剩余线索仍需监视。月都发号施令的人尚在远处，这批收回的报告与器材，却足以让她们进一步查清对方的部署。\n\n帕秋莉留下证据箱，叫她更换红魔馆的联络与验货办法。小恶魔应了一声，翻开新的记录册，把已经断线的名字逐个划去。"

KYO_patchouli_many_Koakuma:"完成秘密交易"
KYO_patchouli_many_Koakuma_desc:"永远亭送走最后一名病人时，帕秋莉和小恶魔仍坐在候诊室里。她们没有挂号，也没有带药方。永琳看见小恶魔膝上的封存箱，便让铃仙先回去。\n\n「今晚不再接诊。」\n\n诊室的门关上后，帕秋莉将几份截获的通讯铺在桌上。永琳看完第一页，伸手去取第二页，小恶魔却先压住了纸角。\n\n「请按日期看。」\n\n药材商队的行程、联络人的口供、月都密令的译文依次排开。几处原本接不上去的线索，都在经过永远亭之后断了。帕秋莉把最后一份记录推到灯下，上面有永琳亲笔改过的交货地点。\n\n「这个人第二天就离开了。我们赶到时，只找到烧剩的账簿。」\n\n永琳没有碰那张纸。\n\n「我让他撤走的。」\n\n「其余几个呢？」\n\n「也是。」\n\n小恶魔将箱盖完全打开。里面还有半箱尚未取出的文件。\n\n永琳看了她一眼，转向帕秋莉：「你们想知道多少？」\n\n「从巫女死后开始。你知道了什么，又替他们藏了什么。」\n\n墙上的钟走过几格，永琳才开口。\n\n「我查到了他们在地上的联络网，也知道有人在为后续行动安排接应。我扣下几封密信，要求旧识撤回人员。这些事一旦公开，月都可能派更多人来灭口，地上的报复也会让他们找到介入的借口。」\n\n「所以你没有通知八云紫。」\n\n「我以为还能私下解决。」\n\n帕秋莉从文件里抽出一页，放在那份撤离记录旁。\n\n「你替他们改了路线。这批人没有回月都，去了下一个据点。」\n\n永琳逐一看过上面的名字。\n\n「紫死后，我才发现他们换了指挥。送到我这里的答复，已经有一部分是假的。」\n\n「我们找到他们的时候，接应也完成了。」\n\n永琳将两张纸对齐，没有再解释。\n\n帕秋莉咳了几声。小恶魔递来手帕，顺手把一张名单留在永琳面前。上面几人的姓名只译出了一半，职衔却已标明。\n\n「我要这些人到地上来。」\n\n「他们不会为几个失踪的眼线露面。」\n\n「如果你告诉他们，证据已经收回，红魔馆只查到外围呢？」\n\n永琳重新拿起名单。\n\n「最多来一个传令的。你们连他们用什么方式核验消息都没弄明白，就想设伏？」\n\n「所以我们来找你。」\n\n帕秋莉等她看完，才继续说：「你替他们处理过麻烦，他们还肯听你的解释。告诉他们，地上的局面可以挽回，但剩下的部署必须由负责人亲自确认。理由由你准备。」\n\n「然后把到场的人全杀了？」\n\n「一个也不能放回去。」\n\n永琳把名单扣在桌上。\n\n「你知道事后会发生什么吗？」\n\n「知道他们已经做过什么，就够我们决定了。」\n\n「那你该带着这些纸去找蕾米莉亚。」\n\n「命令就是她下的。」\n\n永琳靠回椅背，目光越过帕秋莉，落到门边的小恶魔身上。\n\n「你们今天走得出去，不代表能带走我的答复。」\n\n小恶魔停下了收拾箱子的手。\n\n「我们来之前，咲夜小姐已经拿到了副本。若您拒绝，永远亭替月都掩护的事，明天就会送到各处驻军手上。」\n\n「你们可以试着包围竹林。」\n\n「还有公主殿下。」小恶魔说，「她今后每次出门，都要劳烦您亲自护送吗？」\n\n永琳站了起来。椅脚擦过地板，小恶魔立刻收回了搭在箱沿的手。\n\n帕秋莉仍坐着。\n\n「辉夜不会死。永远亭的其他人呢？药材断供，病人不敢上门，你又要带着她搬到哪里去？」\n\n「把她牵扯进来，你会后悔。」\n\n「那就把名单上的人交给我们。」\n\n门外响起脚步，停在走廊另一头。永琳望了片刻房门，坐下来，将灯拉近了些。\n\n「埋伏设在永远亭外。我的人不参加，也不许拿公主的名义发信。」\n\n帕秋莉点头。\n\n「通讯由我写。你们可以检查内容，不能擅自改字。少一道核验，他们就会知道有人拿着刀站在我背后。」\n\n「多久？」\n\n「三天。留下译文。」\n\n小恶魔看向帕秋莉，得到许可后，将资料重新放回桌上。永琳已经取出纸笔，划去了名单上的一个职衔，在旁边补上新的。\n\n「这个人升任了。你们按原来的位置找，会漏掉他。」\n\n三天后，一封经永琳核验的密信送往月都。信中报告地上证据已被控制，并要求几名负责此次行动的高层前来密议，重新安排接应与撤离。\n\n回讯抵达当晚，咲夜调走了会面地点附近的巡逻队，美玲带人封住外围道路。帕秋莉逐处检查阻断通讯与退路的术式，小恶魔则照着永琳补全的名单，摆好了座位。\n\n每张椅子背后，都留了一个站人的位置。"

 KYO_patchouli_libary:"图书馆的无尽的知识"
KYO_patchouli_libary_desc:"我第一次见到帕秋莉，是在都柏林最冷的那段日子。\n\n饥荒把城市掏空了。街角的锅只剩水，面包像传说，排队的人群安静得过分——不是有秩序，是没有力气。那天雨很细，钻进衣领就变成刺。路边有人倒下，旁人只是挪开一步，像怕沾上同样的结局。\n\n她就坐在一间破旧书店的门槛旁，瘦得不像个孩子。胸口起伏很急，像被看不见的绳勒住，咳一声就把整个身体折起来。她没有家人，也没有求救的表情，只把一本湿透的书抱得很紧，像那是唯一能保命的东西。\n\n我停下来看她。她抬眼时，瞳孔很深，没有乞怜，只有一种冷到刺人的清醒。\n\n「妳在看什么？」我问。\n\n她喘得厉害，仍把句子吐得很完整。\n「我在找……能让我活下去的方法。」\n\n不是药，不是面包。是方法。\n\n那一瞬间我明白了：命运对她不公平，却没有把她磨成温顺的受害者。她的身体快坏了，但她的脑子还在追。她用知识对抗病，用文字对抗饥饿，像用一把钝刀对著世界的喉咙。\n\n我不喜欢浪费。\n更不喜欢看一个能用的头脑被饿死在雨里。\n\n「跟我走。」我说。\n\n她盯著我，指节抓紧书脊。\n\n「我能换到什么？」她问。\n\n我笑了一下。\n「妳先活著。」\n\n她没有道谢，只把书抱得更紧，然后站起来。步子很虚，可眼神很硬。\n\n那就是帕秋莉最早的样子——弱到随时会倒，却已经学会用知识替自己撑起骨架。"

 KYO_patchouli_radio_station:"整理书籍，归类成册"
 KYO_patchouli_radio_station_desc:"蕾米莉亚走进图书馆时，帕秋莉正伏案核对一份抄本。听见那句「你还活着呢」，她连头也没抬：「有事就说。」小恶魔忍着笑接过档案，翻开后才发现，里面全是战后财政、工坊产能和供应缺口。\n\n内战结束，蕾米莉亚已经在考虑下一步扩张。她要求帕秋莉清理人里、工坊与附庸商会的账目，把征发留下的欠款也算进去。帕秋莉翻到煤钢供应那页，问她准备给自己多大的处置权，得到的回答是全部重整。\n\n税款、捐款、赔付和工坊分红将集中入主库，地方保留维持日常运作的额度，其余款项统一调拨。小恶魔指出商会不会轻易交账，蕾米莉亚让她先列出名单，拒交者由王宫追究。\n\n帕秋莉随后将工坊与采掘分为军需、民生、研究三类，逐项规定配额和采购价。订单、验货与付款要能相互核对，出现劣料便沿记录追查。她要求停供处罚落实到违规的工坊，免得一处出错，把整条生产线一起断掉。\n\n说到运输，她咳得停了笔。小恶魔递来水，蕾米莉亚则把地图移到她面前。铁路、车队与仓库需要重新编排，前线、集散地、后方分别确定接手的人，每一段另备替代路线。账面上有多少物资，和实际能送到多少，必须分开算。\n\n「这些做完，你才知道还能往外打多远。」帕秋莉合上档案。\n\n蕾米莉亚批准方案，留下盖印的授权。小恶魔将原先混装的账册重新分堆，准备发出核查通知。帕秋莉把未完的抄本挪到一旁，先从欠款最多的那几页查起。"

 KYO_best_month_worker:"让蕾米视察员工"
KYO_best_month_worker_desc:"蕾米莉亚没有预告这次视察。她沿门厅查看昨夜的清点结果，咲夜跟在半步之后，逐一答复库存与巡查的数目。到了大前，美玲正靠着门柱闭眼，帽沿遮住了半张脸。\n\n「睡多久了？」蕾米莉亚敲了敲她的帽子。\n\n「刚闭上。」美玲站直，随即报出两名送货人的来历、货物件数，以及山道上尚未越线的天狗踪迹。咲夜原本要上前，听完便停住，只提醒她把记录补上。蕾米莉亚检查过门禁，叫人安排接岗，让两人到茶室说话。\n\n咲夜沏茶，美玲摆好点心。茶盘略占地方，美玲刚挪开一只碟子，咲夜已经把空杯递到她手边。蕾米莉亚看着她们配合，问起最近有没有难门处。咲夜答得很快：「一切正常。」美玲却揉了揉肩，说修花园耽误了几次休息。\n\n「酸就去治，重活安排人替你。」蕾米莉亚说。\n\n美玲应下，顺势看向咲夜。女仆长正要添茶，手停了片刻。她们的目光短暂相碰，又各自移开。蕾米莉亚放下杯子，问：「你们还有什么没告诉我？」咲夜说没有，美玲低头摆正了原本就没歪的点心盘。\n\n蕾米莉亚没有追问。门口仍有人窥探，她需要这两个人继续配合。她肯让美玲调班，也肯让咲夜交出几项杂务；至于两人私下的亲近，她暂时没有拆穿的意思。\n\n「合作得不错。把该办的事办好，别让我因为出了差错，才来问你们在想什么。」\n\n她离开后，美玲小声问：「她看出来了？」咲夜收起茶具，没有抬头。「所以你更别在值班时睡着。」两人的任务仍待完成，下一步该把图书馆的支援交给谁，也还没有定下。"

 KYO_sakuya_is_best:"咲夜每次都让人赞叹"
 KYO_sakuya_is_best_desc:"图书馆的支援交到咲夜手里后，她开始核对正邪惯用的撤离点。此前取得的口供只够找出入口，真正把天邪鬼逼出藏身处，还得拆掉沿途接应。咲夜逐一封锁送信与转运的据点，把追捕推进到人里外围。\n\n正邪在一条湿巷里现身。她倒挂在屋檐边，先笑咲夜追得辛苦，随后问那几个被抓的草根妖怪是否还活着。咲夜没有回答，目光越过她，确认另一条巷道的出口。\n\n「主人叫你咬谁，你就咬谁？」正邪翻身落地，「一个人类，替吸血鬼收拾反抗她的人，你倒做得起劲。」她边说边挪动，试着引咲夜离开原来的位置。咲夜只取出飞刀，没有接她的话。\n\n刀钉进墙面，第二枚落在正邪脚旁。她骤然颠倒周围的方向，借墙面变作落脚处，想从侧后绕出去。咲夜提前留在砖缝里的标记随之翻转，仍能指示出口；她停住时间，重新调整飞刀与自己的位置。\n\n正邪再落脚时，原先的路已经封上。她退回另一侧，敲了两下窗框，屋里无人应声。咲夜这才告诉她，送信的人已被截住，附近能接应她的地方也都查过了。正邪的笑容收了回去，仍骂她是一把替主人看门的锁。\n\n咲夜逼近，准备制住她。正邪却再度翻转方向，从尚未完全封死的狭口挤出，舍下原定的撤离路线逃走。咲夜追到巷尾，没有冒进陌生的地形，转而命人封存留下的文书，继续搜查。\n\n这次没有抓到正邪。她在当地维持的联络与袭击网络却已经瓦解，近期受扰的补给得以恢复。咲夜如实报告这一结果，也把逃脱者的名字留在追查名单上。只要正邪尚未落网，后续的巡查便不能撤掉。"

 KYO_meiling_is_best:"美玲优雅的完成工作?!"
 KYO_meiling_is_best_desc:"美玲上山时，带着盖有红魔馆印章的条件书。犬走椛在哨口验过封蜡，亲自领她去见饭纲丸龙。射命丸文也在席间，相机挂在胸前，先问门番这次是不是来追究采访的事。\n\n「你把镜头伸进门里的事，我记得。」美玲把文书放到桌上，「今天谈的是撤人。」\n\n红魔馆要求天狗停止针对它的渗透与试探，撤回馆外及相关商路上的耳目。作为交换，妖怪山将获得贸易通行、工坊合约与情报交换的安排；此前的敌对行动可以不再追究，但撤回的人不能换个身份继续工作。\n\n饭纲丸龙没有急着翻页。「你们的王宫刚被炸开，就来教我们怎么保持安稳？」美玲答道：「正因为有人动了手，大小姐才要把周围的态度问清楚。条件和追究的名单都带来了，先看哪一份，由你决定。」\n\n椛的手移向刀柄。美玲留在原处，等饭纲丸龙读完。文追问她能否保证既往不咎，她便指出印章与授权条款：撤人、停止敌对之后，红魔馆会照约开放利益；若再查到相同的联络点，这份承诺也随之失效。\n\n饭纲丸龙逐条问过商路、交货与情报交换的办法，才把文书合上。红魔馆要求她承认已经形成的统治，而她要让侦察者回山，让工坊继续接单。她不愿把妖怪山拖进另一场消耗，却也没有对眼前的来使露出好脸色。\n\n「我们撤人。你们答应的事，也别忘。」\n\n美玲收好签过的文书，向众人告辞。椛送她走过哨口时，仍不肯松开刀柄。山上的命令随后传下：撤回外围耳目，按约交换情报。天狗接受了这次退让；至于红魔馆是否值得信任，要等第一批合约兑现后再说。"

 KYO_workforce_ready:"红魔馆的员工已就绪"
 KYO_workforce_ready_desc:"清晨的红雾还没完全退去，红魔馆已经把一切摆到该有的位置：走廊干净到没有脚步的余痕，窗格上的水汽被擦到只剩一道薄光。\n\n蕾米莉亚站在厅里，没坐王座。她喜欢在这种时候站着——更像审视，也更像等待。她没有开口催促，因为真正可靠的人不会等你催。\n\n咲夜先到。她的制服没有一丝折痕，手套扣紧，刀不在手上，却在她每一个动作里。她行礼，动作利落得像把答案直接放到桌面。\n\n「大小姐。」\n\n蕾米莉亚看了她一眼。\n「状态？」\n\n「馆内秩序稳定。巡查完成。若有命令，我随时执行。」\n\n没有多余字。没有情绪波动。她把自己整理得像一把随时能出鞘的刃。\n\n门口传来脚步声，比咲夜的更随意一点，却不乱。红美玲走进来，帽沿往上一抬，笑得很轻松，像刚结束一段漫长的守夜。\n\n「我也在。」她说，「门口没事。山道、来访者、风向，都正常。」\n\n蕾米莉亚盯着她。\n「你又睡了？」\n\n美玲抬手比了个很小的距离。\n「就一下。」\n\n咲夜侧过头，语气淡。\n「你的一下通常很长。」\n\n美玲咳了一声，笑容不减。\n「我醒得很快。」\n\n蕾米莉亚没有拆穿，也没有纵容。她只是走近，目光从咲夜扫到美玲，像在确认两件器具有没有磨损。\n\n「听好。」她说，「接下来不会安静。命令可能随时下达。」\n\n咲夜立刻回。\n「遵命。」\n\n美玲也点头。\n「明白。」\n\n她们站在同一处光影里，气质却像两种相反的东西：咲夜是冷而精准的执行，美玲是柔和却挡得住的防线。一个负责把命令变成结果，一个负责把麻烦挡在门外。\n\n蕾米莉亚忽然觉得有趣。\n\n她的剑，偏偏是人类——和妖怪为伍，却从不把自己当成弱者。\n她的盾，偏偏像人类——明明强得足以压人，却总爱用分寸解决问题。\n\n这组合不合常理，却很适合红魔馆。\n\n蕾米莉亚轻轻一笑，像对某个看不见的命运做了个小小的反击。\n\n「很好。」她说，「从现在起，你们就是我的剑与盾。」\n\n咲夜抬眼，声音不高。\n「我会让命令落地。」\n\n美玲也笑。\n「我会让门外别乱进来。」\n\n蕾米莉亚转身，披风掠过地面。\n\n红魔馆的两个人，已经准备好。\n剩下的，只是她要把命令往哪个方向丢出去。"

 KYO_sister_is_good:"姊妹和睦相处?"
 KYO_sister_is_good_desc:"地下室传出陌生的笑声时，芙兰正在整理玩偶。她抬头寻找声音，门外却没有人。片刻后，同一句话从另一个方向响起，连气味也变了。她把手缩进袖子，低声说：「别玩，我今天不想坏掉。」\n\n门框上的符文接连亮起。帕秋莉放下笔，赶来查看术式；小恶魔循着异常找到一道转瞬闭合的间隙。有人绕过门禁，把声音与气息送进了房间。原先用来缓和情绪的限制正承受越来越重的冲击。\n\n芙兰站起来时，脚旁的玩偶先碎了。咲夜冲到门口，叫她停手，随即被迎面震碎的玻璃逼退。美玲抵住摇晃的门板，掩护她重新站稳。房里还在传出「不要动手」的声音，石墙却已经开裂。\n\n蕾米莉亚穿过走廊，唤妹妹看着自己。芙兰转过头，伸手想靠近她；间隙里又响起一声尖笑，她骤然收紧了手指。石柱崩开，蕾米莉亚肩头同时裂出一道伤口，血落在地毯上。\n\n「大小姐！」咲夜上前，被她抬手止住。\n\n蕾米莉亚按着肩膀，再叫了一声芙兰。妹妹盯着她指间的血，嘴唇动了几次，终于喊出「姐姐」。帕秋莉趁这片刻补上符阵，小恶魔封住外力侵入的位置。声音断了，芙兰跪倒在碎布里，仍不敢松开自己的手。\n\n术式只能暂时维持。帕秋莉检查残留的波动，辨出八云蓝承自紫的间隙手法；对方没有现身，已经让红魔馆付出了代价。蕾米莉亚听完，将染血的手帕压回伤口，命人修补防护，撤走附近的闲杂人员。\n\n「把八云蓝列入清除目标。」她看向门内，芙兰仍在反复道歉。「还有，别让她再碰到我妹妹。」"

 KYO_remilia_lead:"八云紫墓碑"
 KYO_remilia_lead_desc:"蕾米莉亚在墓碑前停下，拂去遮住名字的草叶。八云紫的名字刻得很清楚。她念了一遍，想起初到幻想乡时，自己曾怎样带着部属闯到裂隙前，又怎样带着伤接受对方的条件。\n\n「那一仗，是你赢了。」\n\n她记得美玲撑着不肯退，帕秋莉已经无力再施展同样的魔法，也记得芙兰举起手后，对面终于停下了攻势。紫允许她们留下，同时要求她服从必要的调遣，看住妹妹。她用斯卡雷特之名应下，把誓约的期限说到了紫死亡为止。\n\n当时，能让身边的人活着进去，已经是她能争到的结果。往后每当她想越过那条线，便会记起贤者仍在。如今墓碑就在面前，誓约所指的人已经死了，再没有谁能以八云紫的名义向她索取同样的服从。\n\n「蓝和橙可以继承你的打算。我的誓言，没有许给她们。」\n\n蕾米莉亚望向碑后的空地。结界破碎之后，各方都在争夺剩下的土地与人口；紫留下的安排，也随主人的死亡失去原来的约束。她知道蓝不会接受红魔馆的新统治，更不会因为旧日誓约到期便让开道路。\n\n她也没有让步的意思。她要征调工厂、控制港口，让军队继续向外推进，建立由自己号令的妖怪国家。紫惯用的协商与牵制，往后只会在她认为有用的时候保留。愿不愿意接受，将由活着的人各自选择。\n\n「她们若继续挡路，我会杀了她们。」她看着那片空地，「到时，就葬在你旁边。」\n\n说完这句，蕾米莉亚重新戴好手套，对墓碑行了一礼。她承认那个曾击败自己的对手，也记得被迫立誓时的屈辱。离开墓地后，她还要处理八云家留下的抵抗；这一次，她已不受那道誓约约束。"

 KYO_flandre_lead:"暂时封印芙兰"
 KYO_flandre_lead_desc:"上次失控留下的裂痕尚未修好，帕秋莉便带着新的符纸来到地下室。咲夜与美玲守住门口，小恶魔逐项核对封印。芙兰望见姐姐肩上的绷带，原本伸出去的手又缩了回来。\n\n这次的术式会进一步压低情绪。帕秋莉向蕾米莉亚说明，恐惧和愤怒受到抑制，兴奋与快乐也会一并迟钝；力量仍留在芙兰体内，封印必须持续维护。她不能保证解除之后会怎样。\n\n「先做。」蕾米莉亚说。\n\n芙兰听着，问这样是否就不容易弄坏东西了。帕秋莉点头，她却仍看着姐姐的肩膀：「那你呢？我还会伤到你吗？」蕾米莉亚蹲下来，告诉她这次会把力量压住，自己也会留在这里。\n\n「那我愿意。」芙兰把手放到膝上，等她们开始。\n\n符纸贴上额头，她的肩膀猛地一缩。小恶魔扶稳椅背，帕秋莉按顺序合拢符阵。芙兰试着叫姐姐，话说到一半便停了，皱眉想了一会儿，仿佛忘了接下来要问什么。蕾米莉亚叫她别动，她就保持着原来的姿势，直到最后一道术式落定。\n\n帕秋莉检查过几次，确认起伏已被压下。美玲问芙兰是否难受，等了片刻，才听见她说不知道。咲夜捡起掉在地上的玩偶，递回她怀里；她低头看着，手臂慢慢收拢，却没有像往常一样替它说话。\n\n「姐姐，我乖吗？」\n\n蕾米莉亚握着椅背，答了一声「乖」。芙兰点头，把玩偶衣角抚平。她还认得姐姐，也听得懂问话，只是那个总要抢着讲完故事的妹妹，忽然变得很难开口。\n\n蕾米莉亚让帕秋莉继续寻找别的办法，留下来陪她坐了一会儿。离开前，她又看了看门框上的封印。眼下能保住的安稳，都要靠这些符文维持。"

KYO_for_our_great_leader:"红魔馆的主人已就绪"
KYO_for_our_great_leader_desc:"红魔馆撤下了最后一道临时岗哨。咲夜核完名册，将钥匙交还女仆；帕秋莉重新检查了馆内的封印。门外仍有人等着觐见，颂扬蕾米莉亚平定乱局的功绩。她听过太多遍，已经懒得分辨其中有多少真心。只要税粮如期送到，命令有人执行，这些人便可以继续称她为救主。\n\n书桌上摆着日本各地的报告。叛乱平息，港口恢复运作，红魔馆终于能腾出手来处理别的事。蕾米莉亚翻过几页，在一份造船计划上留下批示，随后起身去了地下室。\n\n门前的符文已经稳定下来。咲夜替她开门时，目光在她肩头停了一下。\n\n「伤口没事。你在外面等。」\n\n芙兰朵露坐在地毯上，给玩偶整理裙子。听见脚步，她放下手里的东西，双手规规矩矩地搁在膝上。\n\n「姐姐，我今天没有弄坏东西。」\n\n蕾米莉亚看了一眼房间。桌椅完好，杯子摆在原处，连玩偶都没有缺胳膊少腿。封印起了作用。她本该满意，却在妹妹身旁站了一会儿才坐下。\n\n「帕秋莉说你可以休息，不用一直坐着。」\n\n「这样就不会碰倒东西。」芙兰看着她，「我乖吗？」\n\n「……乖。」\n\n妹妹笑了笑，伸手想拉她的袖子，又看见肩上尚未拆去的绷带，把手缩了回去。\n\n蕾米莉亚握住了那只手。\n\n上一次暴走时，咲夜几乎喊破了嗓子，美玲抵着快要碎裂的门板。她记得肩膀被贯穿的疼痛，也记得封印重新合拢后，芙兰跪在地上，连碰一碰赶来扶她的人都不敢。事后是她亲口准许帕秋莉加重封印的。今天再做一次决定，她仍然不敢撤掉它。\n\n「还疼吗？」芙兰问。\n\n「快好了。」\n\n她没有告诉妹妹，自己来之前刚看过研究记录。帕秋莉划去了几种术式，余下的办法仍需要试验。馆里的藏书已经翻检过一遍，缺少的材料在日本找不到，有些记载则只留下了欧洲某座图书馆的名字。\n\n蕾米莉亚记得那些地方。她也记得欧洲的火，匆忙收拾的行李，以及带着妹妹离开时，自己究竟舍弃了多少东西。到了幻想乡，她曾以为有一座馆邸、一群可靠的仆从，就足够让姐妹俩安顿下来。如今连这间地下室的门，她都不能放心敞开。\n\n芙兰用拇指摸了摸她手背上的旧伤，没有再问。\n\n她陪妹妹坐到烛芯烧弯，替她剪去焦黑的一截。临走时，芙兰忽然抓住了她的裙角。\n\n「咲夜说，你又要出远门。」\n\n「有些东西要去外面找。」\n\n「你会回来吗？」\n\n蕾米莉亚蹲下来，把裙角从妹妹手里轻轻抽出，换成自己的手。\n\n「会。回来以后，我来这里找你。」\n\n「那我等你。」\n\n她答应得太快。蕾米莉亚原本准备好的几句安慰，便都说不出口了。她替妹妹把玩偶拿近些，等那只小手松开，才起身离开。\n\n楼梯上，她向咲夜要来了港口名册。\n\n治疗芙兰需要的东西，不会因为一封求援信就有人送来。海外的藏书、术师和矿藏各有主人，远航也要船只、补给与能守住港口的军队。若要让帕秋莉继续研究，她就得养得起这些人，建得起工厂，并且有本事在交涉失败后，迫使对方交出她要的东西。\n\n她知道这意味着什么。海图上的每一处港湾，都有自己的旗帜；舰队一旦开过去，便会有人失去家园。她仍让咲夜把地图展开，先圈出了能够停泊军舰的几处海岸。\n\n为了妹妹，她肯发动战争。她自己也早已厌倦寄居他乡、等候别人容许妖怪生存的日子。幻想乡崩坏后留下的领土，将成为新王国的起点。她要给妖怪重新划定疆土，制定规矩，再也不用带着全馆的人寻找下一处避难所。\n\n帕秋莉进来时，桌上已经压好了几份命令。\n\n「研究缺什么，列给咲夜。」蕾米莉亚说，「找不到的，把线索也写上。」\n\n「我不能保证找到就能治好她。」\n\n「我知道。你继续查。」\n\n她把造船计划推到咲夜面前，要求港务官在三日内报齐船只与补给。美玲留下守馆，地下室照旧由帕秋莉每日检查；未经她许可，谁也不能再拿芙兰试探封印。\n\n安排完这些，她的手指沿着海图向西移动，停在欧洲。\n\n当年离开时，她没能保住自己的家。这一次，她要带着舰队回去，让欧洲的君主们在条约上承认她的王冠。"

 KYO_patchouli_my_friend_alice:"赌一把大的聚集资金"
 KYO_patchouli_my_friend_alice_desc:"帕秋莉把帐册翻到最后一页，指尖停住。\n\n空白。\n不是还没记，而是没有东西可记。\n\n工业计划的蓝图已经画完，产能模型也算过，连运输节点与备援仓都列好。所有步骤都在，唯独启动需要的那个东西不在：钱。\n\n她把笔放下，咳了一声。小恶魔站在桌边，抱著清单，难得没有笑。\n\n「我们缺多少？」小恶魔问。\n\n帕秋莉不抬头。\n「足够让任何人想逃。」\n\n小恶魔嘟囔。\n「那就去跟大小姐要。」\n\n帕秋莉翻页，声音短。\n「你是想把所有家当变卖吗?」\n\n她抬手，从书架深处抽出一卷旧到发硬的炼金笔记。封面没有标题，只有一枚被磨平的印记。\n\n小恶魔看到那卷东西，眉梢一下跳起来。\n\n「等等……妳不会是想——」\n\n帕秋莉把笔记摊开，纸页上是密密麻麻的符号，像把火写成了文字。\n\n「高阶炼金。」她说。\n\n小恶魔的笑彻底消失。\n\n「你想做黄金？」\n\n帕秋莉点头。\n\n「把原料推到临界。」她用指尖敲了敲其中一行，「在正确的时间、正确的压力、正确的封闭空间里，让它变成我们要的东西。」\n\n小恶魔吞了一口气。\n\n「正确的封闭空间……是指红魔馆？」\n\n帕秋莉看了她一眼。\n\n「这里的结界最稳。」\n\n「也最贵。」小恶魔声音发紧，「要是出错，会把整座馆炸上天。」\n\n帕秋莉没有否认。\n\n「是。」她说。\n「所以叫赌。」\n\n她把几块试炼用的原料放到铜盘里：盐、灰、金属碎屑，还有一小管暗色的液体。每一样都不起眼，放在一起却让人头皮发麻。\n\n小恶魔往后退了半步。\n\n「妳真的要在这里点火？」\n\n帕秋莉把手套戴好，动作很慢。\n\n「我不喜欢欠账。」她说。\n「更不喜欢被迫停。」\n\n小恶魔咬牙。\n\n「那至少告诉我，一旦失控我该怎么做。」\n\n帕秋莉翻到最后一页，把一串符文写在纸上，笔锋极冷。\n\n「封门。」\n「切断走廊。」\n「把所有人赶出半径。」\n\n小恶魔盯着那串字，低声骂了一句。\n\n「妳这是在写撤离流程。」\n\n帕秋莉把笔放回原处。\n\n「不。」她说。\n「是在告诉你，我不会停。」\n\n炉火还没点。\n\n空气已经紧得像要裂。\n\n那一瞬间，小恶魔第一次真正理解帕秋莉的疯狂：她不是冲动，她是把风险当成参数，然后照着计算往前走。\n\n「如果成功呢？」小恶魔问，声音更低。\n\n帕秋莉看着铜盘，眼神像盯着一条能活的路。\n\n「我们会有钱。」\n「会有机器。」\n「会有能把外界噪音压下去的工业。」\n\n她抬头。\n\n「失败的话，红魔馆会少一座图书馆。」\n\n小恶魔沉默几秒，终于把袖口拉紧，站回她身旁。\n\n「那就赌。」她说。\n\n帕秋莉点头。\n\n「点火。」"

 KYO_patchouli_my_friend_kaguya:"直接用抢的"
 KYO_patchouli_my_friend_kaguya_desc:"帕秋莉把帐册翻到最后一页，指尖停住。\n\n空白。\n不是还没记，而是没有东西可记。\n\n工业计划的蓝图已经画完，产能模型也算过，连运输节点与备援仓都列好。所有步骤都在，唯独启动需要的那个东西不在：钱。\n\n她把笔放下，咳了一声。小恶魔站在桌边，抱著清单，难得没有笑。\n\n「我们缺多少？」小恶魔问。\n\n帕秋莉不抬头。\n「足够让任何人想逃。」\n\n小恶魔嘟囔。\n「那就去跟大小姐要。」\n\n帕秋莉翻页，声音短。\n「她不一定付得起。」\n\n她把一份名单推到桌面：商会大户、粮仓持有人、运力公司、工坊老板。每个名字旁边都标了资产、弱点、依赖的供应链。\n\n小恶魔扫了一眼，笑不出来。\n\n「这不是募资。」\n\n「当然不是。」帕秋莉说。\n\n她把红魔馆的印章放到名单上，按下去。\n\n「这是征收。」\n\n小恶魔皱眉。\n\n「他们会反抗。」\n\n帕秋莉抬眼，咳了一声。\n\n「反抗就断货。」\n「不交就冻结。」\n「敢跑就抄。」\n\n她说得像在念一段清单，没有情绪。\n\n「我们需要现金，就从现金最多的人身上取。」\n「我们需要低价材料，就让厂商按我们的价格卖。」\n\n小恶魔忍不住问。\n\n「理由呢？」\n\n帕秋莉把笔尖点在纸上，声音冷。\n\n「理由是红魔馆要扩张。」\n「他们可以投资，换来活路。」\n「也可以不投，换来破产。」\n\n小恶魔沉默片刻。\n\n「大小姐会同意吗？」\n\n帕秋莉把名单收进文件夹，扣上。\n\n「她不需要同意。」她说。\n「她只会问我：能不能做成。」\n\n她站起身，披风不在她身上，但她的影子比任何人都像王权。\n\n「通知咲夜。」\n「让她准备文书、冻结条款、押解名单。」\n\n小恶魔眨了眨眼。\n\n「那我呢？」\n\n帕秋莉看向她。\n\n「你负责让他们知道，这不是谈判。」\n\n窗外红雾翻动。\n\n这一次不靠火。\n靠刀。\n\n不需要炸馆。\n只需要让城里最有钱的人明白：红魔馆开口时，钱不会再属于他们。"

 KYO_patchouli_knowledge_power:"蕾米我与你的距离"
 KYO_patchouli_knowledge_power_desc:"工业重整的报告已经写完。我核对过产能、军需、配给与运输的几处缺口，仍迟迟没有叫小恶魔送去。她问我要不要亲自去，我说这份报告必须面交。她看了看封好的文件，没有拆穿。\n\n蕾米给我图书馆、药物和足够继续研究的材料。我也替她解决过许多麻烦。这样的往来持续多年，照理说不必再追问什么，可最近听见她经过，我总要停笔，等那串脚步会不会转进来。\n\n到了王座厅，我先报告工作。咲夜接过文件，蕾米翻了几页，问两处供应能否按期恢复，随后批准执行。她还提了一句我咳得少了，我答永远亭的药没有断。事情本来就可以到此为止。\n\n我却没有走。\n\n「蕾米，我在你这里算什么？」话出口后，咲夜垂下眼，继续整理文件。蕾米把酒杯搁在桌上，问我为何忽然在意这个。我说不清，只能要求她给一个明确的回答。\n\n「你是红魔馆的一部分。」她说。我问这一部分能不能换，她笑了，反问我是不是准备搬走。我当然没有那个意思。她知道，所以仍坐在那里，等我自己把这句话收回去。\n\n我又问了一次，我们能不能只做朋友，不必每次见面都有一份报告。她望着我，说朋友也不会让眼前的事情自行完成。我想反驳，喉咙却先痒起来，只得等咳嗽过去。\n\n「别把我留的距离都当成惩罚。」她说，「你想继续研究的东西，我还会给你。」\n\n她答应了我熟悉的事，避开了我真正来问的事。我最后只点头，退出王座厅。小恶魔还在书桌旁等消息，我把工业方案通过的几项交代给她，便坐回原位。走廊里又响起脚步，我听到它经过门前、渐渐走远，才发现笔尖一直没有落下。"

 KYO_scarlet_mansion:"府邸将对外扩张"
KYO_scarlet_mansion_desc:"红魔馆内部该安静的地方已经安静了。门有人守，帐有人管，图书馆的答案也一页页堆上桌面。蕾米莉亚终于不必再把精力浪费在馆内的裂缝上——现在，该让整个世界学会面对她了。\n\n她不会停在幻想乡，也不会满足于日本这一角被红雾染红的土地。若想摆脱命运，若想替芙兰抢出更多未来，若想让红魔馆拥有足够的资源、知识、工业与选择，她就必须向外扩张，把更大的版图纳入掌心。\n\n远征因此开始。\n\n第一站，是东亚。\n\n中国的土地、港口、工厂与人口，苏联在东方的铁路、矿产与军备，都将成为她前进道路上的战利品。蕾米莉亚不会绕路，也不会等待别人替她让出位置。她会亲自下令，让红魔馆的旗帜一路向外推进，从海岸到内陆，从东边的雾与血，一直打到西边旧世界的心脏。\n\n这不是一场普通的战争。\n\n这是女王的远征。\n\n她将由东向西，踏碎边界，穿过大陆，把红魔馆从一座府邸，扩成一个真正的帝国。\n\n而当她重新站上欧洲的土地时，她不再是当年被火与枪逐出的流亡者。\n\n她会是带着军队、工业、王权与怒火归来的征服者。"

 KYO_join_axis:"向世界宣言我们的到来"
KYO_join_axis_desc:"红魔馆不再躲在夜里。\n\n我们已经看够了。看够了人类把土地切成国界，把工厂、铁路、港口与钢铁全都写上自己的名字；看够了他们把妖怪、吸血鬼与一切不属于“文明”的存在，赶进传说、赶进废墟、赶进必须被遗忘的角落。\n\n现在，轮到我们发言了。\n\n蕾米莉亚将向全世界宣告：吸血鬼回来了，妖怪回来了，而这一次，我们不是来乞求共存，也不是来躲进阴影里苟活。我们要夺回属于我们的土地，夺回本就该由强者支配的位置，夺回被人类称作“进步”后强行夺走的一切。\n\n让世界的大国听清楚。\n\n美国也好，德国也好，英国也好，任何自以为能用舰队、工厂、议会与钢铁把我们重新压回黑暗里的国家，都将成为红魔馆远征路上的障碍。而对障碍，蕾米莉亚从来只有一种处理方式——踏平。\n\n红雾会越过海洋，越过边境，越过每一道写着主权与秩序的铁丝网。她的大军会带着妖怪的怒火、吸血鬼的意志与红魔馆的王权，把所有不肯低头的国家一一压进夜色。那些还以为世界只属于人类的政权，很快就会明白：旧时代没有死，它只是带着更大的军势回来了。\n\n颤抖吧。\n\n因为蕾米莉亚已经不打算再向任何人解释自己的存在。\n\n她只会让整个世界，在红雾之下，学会承认她的到来。"

 KYO_asia_doom:"大东亚妖怪圈"
KYO_asia_doom_desc:"中国已经不是我们的对手。随着战线崩溃、港口易手、铁路与城市落入掌控，整个东亚正在被红雾重新划线。可征服土地，从来不等于真正统治土地。我们拿下了地图，却还没拿下人心，更没拿下那些藏在山里、村里、工厂里的人类反抗者。\n\n他们白天低头，夜里开枪；今天炸一段铁路，明天烧一座仓库。每一次游击、每一次暗杀、每一次破坏，看起来都不大，却会把我们的补给、人力与治安资源一点一点拖进泥里。若继续用单纯的军事镇压来处理，我们会在这片广阔土地上耗掉过多精力，让本该继续向外扩张的大军，被困在无穷无尽的维稳与扫荡里。\n\n帕秋莉因此提出了一套更有效、也更冷静的方案：既然旧日本曾经试图用一个“大东亚共荣圈”来包装自己的统治，那么红魔馆完全可以把这套框架拆开、改写、再利用。名字要换，口号要换，秩序的核心也要换——不再是人类帝国的扩张，而是以妖怪与红魔馆为中心，重新组织东亚的生产、运输、治安与合作结构。\n\n在这套体系下，愿意服从者将被纳入新的区域秩序，获得配给、工作、贸易与有限的安全；继续反抗者，则会被明确地标记、隔离与清理。我们会扶植听话的地方政权，重建港口与铁路，把工厂、粮仓与矿区编进统一调度，让整个东亚不再只是被占领的土地，而是能够持续为红魔馆输血的外围体系。\n\n这不是仁慈。\n这是管理。\n\n只要这套“大东亚妖怪圈”能够运转起来，我们就不必把全部力量浪费在一场永无止境的治安战中。东亚会从战利品，变成后方；从负担，变成基础；从一片必须不断镇压的广阔土地，变成支撑红魔馆继续向西推进的第一块稳固台阶。"

 KYO_europe_to_me:"回到老家欧洲"
 KYO_europe_to_me_desc:"我们已经横跨西伯利亚，踏过冻土、森林与无尽铁道；也已经越过乌拉尔山，把亚洲与欧洲之间那道自以为稳固的分界线踩在脚下。伊斯坦堡的城门如今也向红魔馆低头，欧亚之间最后那道咽喉，终于被我们握进手里。\n\n欧洲到了。\n\n不是在地图上，不是在历史书里，不是在流亡者反复梦见的旧名词里。\n是我们真正带着军队、红雾、工厂与杀意，重新回到这片土地上。\n\n对别人来说，这只是远征推进到下一阶段；可对蕾米莉亚而言，这里不是单纯的新战场。\n这是她长大的地方，是她失去一切的地方，也是命运第一次把她逼成今天这个样子的地方。\n\n她会回到那座城堡的废墟前。\n看着倒塌的石墙、被火烧黑的残垣、被岁月与风霜磨平的旧路。她会想起自己曾经如何在这里学习高贵、如何在这里见证家族的衰亡、又如何在那个夜晚被人类的炮火与火器赶出故乡。她会想起妹妹的尖叫，想起鲜血、火光、碎裂的翅膀，想起从废墟中醒来后，只剩流亡可走的自己。\n\n那真是一场漫漫长路。\n\n从欧洲被逐出，到穿过旧世界的尸骸；从幻想乡的一角，到跨越整个欧亚大陆；从一个失去城堡的吸血鬼贵族，到今日带着大军回来的女王。\n\n而现在，路终于绕回了原点。\n\n剩下要做的事，已经很简单了。\n\n征服。\n把欧洲所有国家一一压下，把每一面不肯低头的旗帜踩进泥里，把这片曾经将吸血鬼驱逐出去的大陆，彻底变成属于蕾米莉亚的新王座。等到最后一个国家臣服，等到最后一道阻碍被踏平，这场远征才算真正完成。\n\n那时，她就不再只是“回来了”。\n\n她会让整个欧洲承认——\n当年被火赶出去的女孩，如今已带着红雾与王权，回来取走本该属于她的一切。"

KYO_cross_pacific:"这一切的终点"
KYO_cross_pacific_desc:"欧洲诸国相继落入红雾的统治，蕾米莉亚终于回到了旧城堡。军队沿途清出了道路，等着护送女王进入故乡；她走到断墙前，却认了好一会儿，才找到从前通往庭院的台阶。\n\n塔楼已经塌了，墙缝长着草。她记得这里原来有扇窗，芙兰常从里面望出来。如今站在相同的位置，能看见的只有破开的屋顶。没有人留下等她回来，也没有什么仍然完好，等着征服者一声令下便归还。\n\n阳光落在手背上，皮肤开始灼痛。蕾米莉亚没有立即退开，低头看着那一点伤。为了走到这里，她夺取了土地、工厂与港口，将更多军队和研究资源纳入红魔馆。各地仍有等待处理的反抗，军官仍需要她的命令，但重返欧洲这个曾经遥远的目标，已经完成了。\n\n芙兰却没有跟来。临行以前，她曾向妹妹提起故乡，得到的回应很轻，听不出期待。封印压住了发作，也将那些曾经让她哭闹、兴奋、害怕的情绪压得迟钝。蕾米莉亚知道那副模样从何而来；施下限制时，最后点头的正是自己。\n\n她原本希望扩张能换来更多办法。新的术式、古老的记录、来自远方的材料，如今已经可以送进图书馆，再不能总用「等这场仗打完」推迟妹妹的事。帕秋莉的研究需要她回去面对，解除封印后会发生什么，也必须由她亲自承担。\n\n废墟不会替她作答。她摸到旧石墙的裂口，想起当年牵着妹妹逃走时，根本顾不上回头。那时能将芙兰带出去就够了；现在妹妹仍活着，她却得重新问，往后的日子要让她怎样过。\n\n来路上传来了熟悉的脚步。蕾米莉亚将手从石墙上收回，仍站在阳光下，等待红魔馆的众人走近。她有些事情要交代：故乡已经到了，等看完这里，行程就该转向家中。关于芙兰，下一次谈话不能再被出征的安排挤到最后。"

 KYO_the_world_under_red_mist:"世界将会在红雾之下"
 KYO_the_world_under_red_mist_desc:"Oderint dum metuant"


 KYO_Byakuren_start:0 "平等之道"
 KYO_Byakuren_start_desc:0 "选择圣白莲的道路，意味着选择一条最漫长、也最不合时宜的道路。\n\n战争留下的废墟不会因为慈悲而自行消失，人类与妖怪之间积累数百年的恐惧，也不会因为一场胜利便立刻化解。命莲寺所收留的，更不是一群已经得到救赎的完人。娜兹玲仍旧怀疑一切，一轮仍在责任与迷惘间挣扎，星会因每一次失误责备自己，水蜜仍要压住水底的怨念，响子也必须在热情之外学会判断。白莲要做的，是带着这些裂痕继续前进。\n\n你将亲自参与幻想乡的重建，将佛法从经文带进工地、田野、学校与救济站；让命莲寺的弟子们面对各自的过去，寻找属于自己的道路；与草根妖怪、天狗、异国势力及旧时代的统治者交涉，并证明妖怪不必只靠恐惧而活，人类也不必把妖怪视为天生的敌人。\n\n这条道路不会只有温柔。为了保护弱者，我们必须面对法西斯的黑色专制，也必须反对以平等之名建立的新枷锁；必须承认命莲寺自身的错误，防止慈悲变成傲慢，防止救济变成支配。\n\n白莲并不承诺创造一个没有痛苦的世界。她所承诺的，是不再把任何众生轻易舍弃。若这条路能够走到最后，人类与妖怪将不再只是彼此容忍，而能共同学习、劳动、生活，甚至成为家人。\n\n道阻且长。但总要有人先走出第一步。"


 


   KYO_hijiri_aftermath:"和平的曙光"
 KYO_hijiri_aftermath_desc:"内战已经结束，可白莲站在寺门前时，看见的不是和平，而是一片被拖得太久的疲惫。田地荒着，道路断着，逃难者与旧部彼此提防，连命莲寺里的人也只是勉强把伤口压住，还远远谈不上安宁。\n\n白莲明白，自己不能只站在高处说慈悲。命莲寺若想在这片废墟上重新立住，就必须让每一名弟子走进最脏、最难、最会逼人露出本性的地方。娜兹玲去清点与搜寻，一轮去组织与动员，星去稳住军心与秩序，水蜜去压住暴力与流窜者，响子则去把快散掉的人心重新喊回来。\n\n她没有把她们当成替自己跑腿的人，而是逼她们各自面对那个一直没处理完的自己。白莲只是轻声说：『去吧。先让别人能活，再想自己想成为什么样的人。』"

 KYO_our_rat_nazrin:"寺庙中的鼠辈"
 KYO_our_rat_nazrin_desc:"白莲把最不讨喜、也最容易得罪人的差事交给了娜兹玲：清点仓库、巡查黑市、排查失踪物资、把那些趁乱伸进粮仓与药柜的手一只只揪出来。她对此没有半点不满，反而觉得这才像正经工作。比起空谈善意，她更相信锁、账本与会咬人的证据。\n\n一群鼠顺着墙根、地窖与废墟的裂缝钻进各处，把谁在偷，谁在囤，谁准备在重建开始前先捞一笔，全都带回命莲寺。星还想替某些人留几分体面，娜兹玲却只淡淡回她一句：『先把粮袋扎紧，再讲信任。饿肚子的时候，誓言比纸还薄。』\n\n可她看得越多，就越发现自己嘴里那套“人都会背叛”的说法，并不能解释一切。有人确实在偷，也有人明明只差一步就能下手，却还是把最后半袋米送给了孩子。娜兹玲嘴上照样冷嘲热讽，心里却第一次开始承认——也许这世上不是没有善良，只是善良往往穷得很狼狈。"

 KYO_treasure_hunter_nazrin:"宝藏的猎人"
 KYO_treasure_hunter_nazrin_desc:"鼠群从倒塌的仓库里拖出一角布袋，娜兹玲循着痕迹找到下面的铁盒。锁锈住了，水蜜站在断梁旁，看她撬了半天，笑道：「这么费劲，总该有一盒金子吧？」\n\n里面只有卷册和几张货单。水蜜探头看了一眼，便想去翻别处，娜兹玲却叫住她。货单上记着药品与机械零件，仓库的账面却早将这批东西列为烧毁。她把日期圈出来，让鼠群继续寻找货物转移的暗道。\n\n「死人也会搬货？」水蜜问。\n\n「活人拿死人做账。先看看出口在哪，别踩塌了。」\n\n水蜜从积水的地下层绕过去，确认可走的通道，才招呼搬运者下去。娜兹玲在夹墙后翻出药箱与零件，又将散落的粮票、地契分开收好。药品须检查，零件交工坊辨认，地契则得与仍住在附近的人核对。她不许众人见到封条就直接记作可用物资。\n\n水蜜替她挪开一根梁，发现下面还有破损的佛具，忍不住又问：「这也要捡？星大人连碎的都舍不得？」\n\n娜兹玲蹲下去，将一截断开的铜饰包好。「她若知道在这里，明天就会自己来。让她在这种地方找东西，我还得再找她一次。」\n\n「原来连人也一起保管。」\n\n娜兹玲瞪她一眼，叫她少说话。水蜜却突然收了笑，伸手拦住后面的搬运者：前头积水正在上涨，原来的出口不能用了。娜兹玲立即召回鼠群，沿另一条暗道指引众人撤出，最后才抱着铁盒离开。\n\n回寺时，药箱先送去检查，那份假报损失的货单另交追查。星翻看追回的旧卷，问是哪一处找到的。娜兹玲只说仓库，让她别再去；水蜜在旁边笑出了声，趁老鼠还没回嘴，赶紧去卸下一箱。"

 KYO_nazrin_open_shop:"新主业菓子工房"
 KYO_nazrin_open_shop_desc:"娜兹玲算过几种募资办法，最后在宝船的货舱图上留出了一块地方，写上菓子工房。她嫌这种生意零碎，停船、添火、找零，每一步都费人手；可白莲既要筹钱，也要让戒备命莲寺的居民愿意接近，她找不出更合适的替代。\n\n一轮搬来炉具和原料，认真到连袋口都朝同一边。水蜜倚在船舷，看娜兹玲算一块点心能赚多少，笑问寻宝鼠是否终于打算卖糖哄小孩。\n\n「你把船停稳，别让第一盘都滑到地上，就算帮忙了。」\n\n开张时，人们只在岸边张望。响子先喊了价格，水蜜接着大叫今日限定，口气像在宣布分赃。一轮忙着解释募资用途，娜兹玲听得额角发紧，干脆把标好价的木牌搬到踏板旁，让客人自己看。\n\n最先上船的是跟着香味来的孩子，后面才有大人。有人只买一小块，掰开分给同行者；有人问清钱的用途，在募资箱里另放几枚硬币。排队的人渐渐多了，岸边的商贩也把摊子移过来，招呼等候的客人。\n\n一轮开始限制同时上船的人数，免得踏板堵住；响子领着等不及的孩子到旁边，水蜜则终于被娜兹玲叫去搬货。第一批卖完后，仍有人在问下一炉要等多久。她原想按时收摊，看过剩余原料，只好让一轮再添一次火。\n\n夜里结账，娜兹玲先扣掉原料、燃料和运输的开销，再将余款与募资箱的钱分开登记。水蜜凑过来看，问这点小生意是不是白忙。她用手压住账页，叫船长报下一站的航程。\n\n「多停半天。」她说，「今天有人想带给家里，来的时候却卖完了。」\n\n水蜜拖长声音应了，娜兹玲抬眼瞪她。旁边的一轮已经开始添写原料清单，响子则把写错的价牌翻过来，认真练下一站要用的招呼。"

 KYO_nazrin_salvage_org:"回收资产"
KYO_nazrin_salvage_org_desc:"白莲交给娜兹玲的命令很简单：把还能用的东西，全都从废墟里找出来，尽快变成命莲寺能够掌握的资源。至于怎么做，白莲没有细讲；而娜兹玲一向最擅长的，就是把一句宽泛的话，执行成最冷、最快、也最不近人情的样子。\n\n于是她立刻建立起一整套回收体系。散落各地的破铜烂铁、废弃器材、失主不明的车队、旧势力遗留下来的仓储，甚至连被遗忘在角落里的工具、木料与药箱，都被她贴上标记、登记造册、统一征收。她的规矩简单得近乎残酷：只要没人当场认领，只要拿不出凭证，只要在规定期限内说不清这东西归谁，那它就是命莲寺的资产。她不问旧主是谁，也不在乎别人嘴里那套『差一点就来领了』的说辞。对她而言，废墟里最不值钱的就是迟来的解释。\n\n一轮听完她定下的规矩，皱着眉说这简直像是在趁乱抄没。娜兹玲却连眼皮都没抬，只淡淡回了一句：『重建不是施舍，是跟时间抢东西。等他们慢慢想起自己丢过什么，这堆废铁早就烂成泥了。』她把每一根铁轨、每一箱受潮的药、每一截还能转动的齿轮都算进账里，连别人嫌晦气、不愿碰的残破仓库，也照样派鼠群进去翻个底朝天。\n\n这套办法的确高效得惊人。命莲寺第一次能在短时间内把四散各地的资源重新集中起来，再分配给工地、车队、粮仓与修缮队伍。别人还在争论归属，她已经把东西送上路；别人还在缅怀过去，她已经开始计算这些残余能换来多少砖、多少药、多少热饭。\n\n可效率从来不是没有代价的。有人指责娜兹玲趁火打劫，有人骂命莲寺打着重建的名义侵吞财产，也有人站在被封存的旧仓库前，红着眼说那本来是自己拼命攒下的家当。娜兹玲听得见这些怨气，却几乎从不回头。她很清楚自己正在做一件不会被人喜欢的事，但她更清楚，若连这些招人恨的脏活都没人去做，命莲寺手里的重建就永远只是空话。\n\n她仍旧不相信人心靠得住，也从不指望自己会被感谢。可至少，这套由她亲手建立的规矩确实可靠。娜兹玲把废墟变成账目，把争议变成资产，也把自己彻底活成了那个最适合在乱世里挨骂、却偏偏最能把事情做成的人。"

  KYO_nazrin_rat_king:"众鼠的鼠王"
KYO_nazrin_rat_king_desc:"仓库失火的消息送到命莲寺时，娜兹玲正在核对一张货单。\n\n报信的人说，夜间灯油翻倒，烧掉了准备运往安置点的粮食。她听完，问了起火的时辰，便把货单递给星。\n\n「粮食前天就运走了，转卖了两次。今晚烧的是空仓。」\n\n星翻到背面。卸货地点、买主姓名，还有仓管与中间人约定分账的酒馆，都记在上头。\n\n「人呢？」\n\n「酒还没喝完。现在去，正好一起带回来。」\n\n最早发现异样的，只是一只钻进粮车觅食的老鼠。车子没有开往安置点，反而拐进了商行后院。消息沿着回收站和暗巷里的联络点传回，娜兹玲派鼠群盯住货栈，又让耳目查了去向。等仓管点燃灯油，买卖双方已经各有人跟着。\n\n这样的追查，如今可以从一座城延伸到另一座城。码头装船，车站换货，山路上的车队临时改道，都有沿途鼠群接应。最初替命莲寺搜寻废料的小家伙，逐渐遍布全国，连黑市商人密谈时，都开始留意墙角的洞。\n\n「鼠王」的称呼也是从那里传出来的。\n\n娜兹玲听见时，只问了一句：「谁说的？」\n\n送信的人迟疑起来，她抬头催促：「能传到你耳里，就能传到别处。我要知道他们察觉了哪条线。」\n\n她为每处联络点备了替代路线，熟人的消息照样复查。地方官克扣物资，旧帮派联络人手，有人散播粮食将尽的传言趁机抬价，她都留着记录。证据不齐的继续查，准备动手的便连夜处理。送到白莲面前的报告往往只有几页，背后却跟过数日，换过好几批耳目。\n\n星也为此与她争执过。\n\n「你没必要把每个人都先当成贼。」\n\n「那你别一听见难处，就替人找借口。」\n\n「名单上这个人只替他们送过货。」\n\n「他还收了三次额外的钱。」\n\n「查清楚那些钱买的是什么。我不准你把车夫和主谋一并处置。」\n\n娜兹玲皱着眉，将那张纸抽了回去。两天后，车夫的名字被划掉，收钱替人藏匿货物的管事补了上来。她没有道歉，只把新证词放到星桌上。\n\n她仍嫌星心软。有人在白莲面前哭诉，她便站在门外，等着核查对方说过的每一件事。寺里的僧人觉得她疑心太重，受过盘问的人更不愿接近她。娜兹玲也不招呼，低头喂完鼠群，照旧出门。\n\n不过，追回的粮食该送往哪里，她从来不用再问。白莲答应收留的人，星已经安排了住处；她记得那些地方的名字，也知道少一车粮会让多少人断炊。要她放过拿这些东西牟利的家伙，几句忏悔远远不够。\n\n入夜，星来催她吃饭，看见桌边又多了几封密报。\n\n「还有多少？」\n\n「这封看完。」\n\n星把饭留下，临走前提醒她别凉着吃。娜兹玲应了一声，将碗往灯旁挪了挪，先拆开北方送来的信。\n\n一只灰鼠爬上桌沿。她掰了块饼放在它面前，提笔改了明日的巡查路线。"

KYO_nazrin_follow_shou:"纳兹林将永远跟随星"
KYO_nazrin_follow_shou_desc:"纳兹林第一次替星找回宝塔，便在呈报里记下了「疏于保管法器」。\n\n她奉命留在毘沙门天的代理身边，察看对方是否称职。星容易忘事，又总肯相信别人的难处，实在让她放心不下。那些呈报起初写得很细，连星因照顾伤者耽误了哪场会面，都逐一记着。\n\n后来，她落笔前会多想一会儿。\n\n失约是真的。星留在伤者身边，直到对方不再发抖，也是真的。纳兹林照旧记下过失，却渐渐开始替她安排下一次会面，查清求助者的来历，再把可能出问题的地方提醒一遍。星有时听，有时仍坚持自己的决定。两人争起来，隔着院子都听得见。\n\n有回纳兹林把一叠账簿摔在桌上，说她迟早要被人骗得什么都不剩。\n\n星等她骂完，问：「那你查到的缺口，明天能陪我一起去核对吗？」\n\n她去了。\n\n这天傍晚，纳兹林带着鼠群从河边回来，远远看见星撑着伞，站在进村的岔路口。\n\n「你怎么在这里？安置点没人管了？」\n\n「一轮接手了。」\n\n「我说过天黑前回来。」\n\n「已经黑了。」\n\n她回头看了一眼。河滩上的最后一点亮光也没了。星把伞挪过来，目光从她湿透的衣摆移到肩头的灰鼠，确认都回来了，才转身同行。\n\n「河边那段路已经淹了，」纳兹林说，「明天的粮车得换条路。我找到了——」\n\n「回去坐下再说。」\n\n「你不听，明早又要走错。」\n\n星停下来。纳兹林把绕行的路讲完，发现伞大半都在自己头上，便伸手将伞柄推回两人中间。\n\n「你的肩膀也湿了。撑伞都不会。」\n\n星笑了笑，没有松手。\n\n走到寺门前，她才轻声说：「你迟迟不回来，我也会担心。」\n\n「鼠群会报信。」\n\n「我知道。可今天雨这么大，你又常常觉得多跑一趟没关系。」\n\n纳兹林低头拧了拧袖口。\n\n「这趟不去，你明天就得自己涉水过去。」\n\n「所以我很庆幸有你。」星顿了顿，「但能不能也告诉我，你什么时候需要帮忙？每次问，你都说用不着。」\n\n她没有立刻回答。星也没催，将伞留在门边，取下早已备好的干布，递给她擦头发。\n\n纳兹林接过来，先裹住肩头那只冻得发抖的老鼠。\n\n「你知道我最初是来做什么的。」\n\n「知道。」\n\n「那些呈报，我没替你留情面。」\n\n「你当面说得更难听。」\n\n她抬起头，星仍站在那里。\n\n「可你也替我找出了错在哪里。只要你愿意说，我就会听。意见不合，我们再谈。」\n\n「你每次都这么说，最后还是要我陪你去。」\n\n「因为我想请你陪我去。」\n\n纳兹林捏着湿布，半晌才叹了口气。\n\n「明早替我照看一下鼠群。它们跑了一天，该歇歇了。」\n\n「好。你也多睡一会儿。」\n\n「午后核对粮车，我和你一起。」\n\n星点了头，又从架上取下一条干布，交到她空着的手里。\n\n「这条留给你自己。」\n\n纳兹林没有再推辞。她擦着头发，看见星弯腰收拾两人的湿鞋，忽然叫住了她。\n\n「以后要去哪里，记得叫我。」\n\n星回过头。\n\n「别等什么命令了。我会跟你去的。」"

 KYO_Ichirin_convert_everyone:"命莲寺宣传大使"
KYO_Ichirin_convert_everyone_desc:"一轮接到宣讲的差事，先问能否换人。白莲让她说明理由，她便承认，自己入道时也受过家里的安排，至今仍有不少疑问，怕站到众人面前，反而答不出该答的话。\n\n白莲没有替她写讲稿，只请她把那些疑问一起带去。\n\n第一次到村里，一轮照着准备好的话讲，响子在旁招呼人群。有人听了一会儿，问命莲寺收留妖怪，会不会让附近的人遭殃；她急着解释，越说越像背戒条，连响子也渐渐安静下来。\n\n娜兹玲等人散去后，问她方才到底回答了哪一个问题。一轮翻看纸上的句子，找不到能直接指出的地方，只好翌日再去。\n\n这次她先请对方把担心说完，记下附近发生过的侵扰，说明寺里能处理哪些，哪些得带回去问。有人问必须信佛才能求助吗，她答不用。说起自己为何留下，她迟疑片刻，承认曾经也不知道这条路是不是自己想走的。\n\n听众里有人笑，说连她都没想明白。一轮没有装作明白，只答自己已经见过命莲寺怎样收留无处可去的人，也亲手帮过忙。若他们愿意来，可以先看，再决定信不信她。\n\n此后她仍准备讲稿，却给提问留下了更多时间。有人只来争辩，有人带着邻居来看安置的地方。回寺时，她把没答好的问题交给白莲，请师父教她；隔几天再经过那个村子，又去找最先发问的人。"

KYO_Ichirin_help_worker:"工业的管理大使"
KYO_Ichirin_help_worker_desc:"白莲很清楚，光靠经文与善念，救不活一片被战火撕开的土地。若想让世界真正往好的方向走，除了信仰给予的安定，物质的生产、资源的调配、工坊的运转与仓储的管理，同样不可或缺。废墟不会自己变成房屋，空锅也不会因为慈悲而自己煮出热饭。\n\n于是，一轮被推到了工地、仓库与工坊的最前面。她起初并不喜欢这份工作。比起在表格与排班表之间奔走，她更习惯挡在最前面，把看得见的麻烦一拳打回去。可白莲只是告诉她：『若想让众生有地方安身，光会守住还不够，还得学会把屋子盖起来。』\n\n一轮只能硬着头皮接下任务。她开始巡视工地，核对仓单，安排轮班，重新整理在战乱中七零八落的生产线。原料从哪里来，成品送到哪里去，哪段运输不能断，哪座工坊该优先恢复，她一项项记下，再一项项钉进新的秩序里。她不会说圆滑话，只能用最直的方法告诉众人：现在该做什么，为什么要做。\n\n她走进车间，对那些只想着领口饭吃的工人说：你们不是只为了今天晚上有饭吃。你们手里做出来的砖、螺丝、工具与药品，最后会变成屋顶、道路、炉火，变成另一个人继续活下去的依靠。劳动若只停在个人温饱，这片土地就永远只能在苟活里打转；真正的生产，是把人重新接进一个还能运转、还能前进的社会里。\n\n起初并不是所有人都愿意听。有人嫌流水线枯燥，有人觉得命莲寺嘴上说慈悲，结果还是把人赶回工地卖力气。娜兹玲也提醒她：『你要他们相信自己不是螺丝，总得先别把他们当成数字。』于是，一轮不再只站在高处讲话，而是亲自陪他们推原料、送成品，让他们亲眼看见自己做出的东西如何送进修桥队、农具站与临时医院。\n\n她终于明白，信仰给人方向，劳动给人力量，工业给社会骨架。理想世界不是从天上落下来的，它得靠一袋袋水泥、一根根钢材、一双双不肯停下来的手，慢慢把它做出来。"

KYO_ichirin_Propaganda:"传闻，命莲寺的酒鬼"
KYO_ichirin_Propaganda_desc:"战后流言四起，命莲寺自然也逃不过。而在这些流言里，传得最快的偏偏是一轮——那个明明已经入道多年，明明该守戒清心，却始终改不掉喝酒毛病的女人。\n\n她自己当然知道这习惯不好。白莲劝过，星皱过眉，娜兹玲也没少拿这事刺她。可一轮还是会去喝。不是因为她有多喜欢酒味，更不是为了享受，而是为了麻痹。麻痹那些从未真正离开过她的东西——家族的影子、被推着入道的人生、扛在肩上的责任，还有那种始终分不清『这是我想走的』，还是『这是别人替我选好的』的沉重。\n\n白天，她总是站得很直，像块木头，像面墙，像一个习惯把自己活成『应该正确的人』的修行者。她会管理工地，会在集会上讲信念与秩序，会在众人面前装得很稳。可一到夜里，一杯酒下肚，那层硬撑起来的壳就开始裂。她常常会抱着酒瓶去找水蜜，把那些白天绝不会说出口的话全倒出来。\n\n她骂白莲太会把人往最难走的路上推，骂星笨得让人头痛，骂娜兹玲小气又多疑，骂响子天真过了头。可骂到最后，她总会绕回自己身上，骂自己最狠——骂自己的懦弱，骂自己明明不甘心，却总顺着别人给的轨道走；骂自己有很多话压在心里，却始终没有勇气真正替自己说一次。水蜜通常就在旁边听，偶尔坏笑着补一刀：『你这家伙，清醒时像戒律，喝醉了倒像个人。』\n\n奇怪的是，也正因为她这点不体面的毛病，一轮反而在百姓之间有了另一种名声。人们发现，这位命莲寺的僧人并不是真的不食人间烟火。她会喝醉，会发牢骚，会骂人，会在酒意上头时把委屈和怨气一股脑倒出来，像极了那些被生活压得喘不过气的普通人。\n\n正因为如此，人们反而更愿意靠近她。工地上的工人愿意跟她坐一桌，流民听完她几句酒后牢骚，也会觉得命莲寺那套『重建世界』的话没那么遥远。于是，『命莲寺的酒鬼』最终没有变成丑闻，反倒成了一种古怪却有效的名声——命莲寺并不只收留圣人，也容得下这样一个会犯戒、会喝酒、会自我厌恶，却仍会在第二天清晨爬起来继续扛事的人。"

KYO_ichirin_Training:"净身廉洁"
KYO_ichirin_Training_desc:"一轮早课后仍留在院里练功。动作稍一散乱，她就停下来重做，练到袖背湿透才收手。有人问她如此勤勉，心里想必早已没有杂念；她笑了一下，说刚才还在想着昨天挨的那几句骂。\n\n她并不总能相信自己讲出去的话。说要约束恶意，自己被人指责时却先想还嘴；劝人互助，遇到难缠的请求又盼着对方快走。过去她总把这些念头压下去，到了夜里，再独自怀疑自己是否适合穿这身僧衣。\n\n白莲听她说完，让她想清楚，昨天究竟做了什么。一轮记得自己忍住了回骂，却在后来的安排里故意让那个人多等了一会儿。第二天，她去把耽误的事办完，没有等对方先来道歉。\n\n往后的训练除了武艺，还多了这样一些核对。答应过的事是否完成，发怒时有没有拿职责出气，她逐项问自己；拿不准的，便带回寺里请教。疑问没有因此减少，几件过去不肯承认的失误，却终于说得出口。\n\n再到村里宣讲，有人问何时才能见到她说的人间净土。一轮看着自己衣摆上的泥，说今天还称不上。她请众人先看看那些没人照料的伤者，和迟迟修不好的屋顶，愿意帮忙的可以留下来商量。\n\n听完的人未必都肯入教。有人当场反驳，有人只问还缺几个人搬木料。一轮把准备好的经文收起，先带后者去找管事，路上继续回答他的问题。"

KYO_Ichirin_cringe_name:"动员人民在阳光下的土地工作"
KYO_Ichirin_cringe_name_desc:"一轮带来的农具在仓库里积了灰。工坊已经交货，几处田地却还荒着：年轻人嫌日晒，中年人说忙过一季也未必守得住收成。她原先准备好的劝说没讲几句，就被一句「你先下去试试」打断了。\n\n她挽起衣摆，下田开沟。泥比想象中黏，挖不了多久便得停下换手。岸上有人笑她拿锄头的姿势，她索性递过去，请对方示范。那人接得不情愿，挥了两下，却又嫌她先前开的沟太浅，自己往前补了一段。\n\n随后来的几批人领到不同差事。懂机器的试用播种器，熟悉田地的辨认土质，其余人清沟、修田埂，跟着学施肥。一轮把农机坏在哪里记下来，送回工坊，请制作者到田边看过再改。有人受不了连日重活，她便调换工作，没有把疲惫说成懒惰。\n\n午间歇息，一个年轻人问，来这里算不算修行。一轮将沾泥的水碗放下，说自己干活时也会烦，也想赶快做完，好回到阴凉处。他笑她还不够清净，她答：「所以我也得练。先把手里的事做完，别急着叫别人替你受。」\n\n她没再讲下去。有人正在争水，她便过去听两边说话，和众人重新挪开堵住沟口的石头。\n\n过些日子，最初嫌脏的年轻人已会检查机具，那个不信还能收成的中年人，也开始每天来看苗。一轮没有问他们是否振作了，只把下一批工具交到熟手手里，请他们带新来的人。\n\n她离开时，田边还有争吵：有人把肥料撒多了。老农叫那人别躲，过来一起补救。一轮停下听了一会儿，确认有人接手，才沿着已经通水的沟渠往回走。"

KYO_Ichirin_follow_hijiri:"一轮将永远追随圣白莲"
KYO_Ichirin_follow_hijiri_desc:"一轮将最后一批农具交给村里的管事，回寺时，袖口的泥已经干了。白莲问她这趟是否顺利，她先说有两处供水还得重修，又说有个老人不肯听她讲经，却愿意教年轻人认土。讲到最后，她自己也笑了：「他教得比我好。」\n\n从前被问起为何入道，她总把家里的安排与师父的教导一并说完，好让旁人不再追问。她习惯了僧衣，也敬重白莲，却一直不肯细想，若没有那些安排，自己是否还会走到这里。\n\n宣讲时，人们问过她经文能不能换粮；管工坊时，她发现许诺过的工具未必按期交得出来。她曾带着一肚子气回寺，觉得师父把太难回答的问题都留给了自己。白莲听完，没有替她写下一次该说的话，只让她先查明工具卡在哪一处。\n\n一轮后来补送了那批货，也向等候的人认了错。有人仍不满意，拿着断柄的旧锄继续数落她；她站着听完，将坏锄一并带回工坊。第二次再到村里，那个人终于肯留她喝一碗水。\n\n「师父，我以前也怨过家里。」她在廊下说，「有时候听见别人叫我法师，我还会想，这到底是谁替我选的。」\n\n白莲问她现在是否仍这样想。一轮看着堆在脚边、明日要送修的农具，答还有些事想不明白，但下一趟，她愿意自己去。那里的人已经认识她，出了差错，也该由她回去解释。\n\n她向白莲行礼，请师父继续教她。说完便搬起工具，准备先找管工坊的人谈一谈。白莲提醒她吃过饭再走，一轮应了声，这回没有急着把所有话都说得周全。"

KYO_shou_money_beg:"聚宝盆"
KYO_shou_money_beg_desc:"白莲将过冬所缺的物资交给星核算。粮、药、衣物和木料写了好几页，现有的钱却只够填上一小半。星说可以再找商队募资，话说得很慢，始终没有提起自己聚财招福的本领。\n\n白莲问她为何不用。星捧着宝塔，说这份力量来得太容易，怕自己习惯了伸手取财，往后连修行也只顾结果。师父没有叫她立刻放下顾虑，只将缺药的几处安置点指给她看，让她先算算还能等多久。\n\n出发那天，娜兹玲带账册，响子负责招呼路人，星站到市集边，几次开口都被叫卖声盖住。她能在战场上喊得很远，轮到请人拿出钱粮，反而总怕自己说得太大声。\n\n「说清楚要多少，用在哪里。」娜兹玲催她，「你不说，他们只能看着你站在这里。」\n\n星重新举起募资清单，说明药品和冬衣的去处，也动用了汇聚财宝的力量。捐来的钱物逐渐堆起，便由小队清点、估价、安排运输。有人拿坏粮冒充足额捐赠，娜兹玲当场拆开袋口，叫他把不能用的带走。星原本想劝她语气和缓些，看见袋底的霉斑，又将话收住。\n\n她亲自送出第一批药材，收下安置点的签收凭据，回寺后逐项核对钱花到了哪里。尚未补齐的缺口仍在，聚来的财物也得经过采买，才能换成病人用得上的东西。\n\n第二次有人问她还缺什么，星没有再迟疑，直接报出数目与交付地点。夜里，她把收支记录放到白莲面前，请师父一并查看。宝塔留在桌侧，她伸手扶正它，再把明日要去的集市圈出来。"

KYO_shou_the_best_soilder:"命莲寺的二把手"
KYO_shou_the_best_soilder_desc:"白莲出门后，送到寺里的请求仍没有减少。伤员要床位，守备队要补员，工地则催促归还借走的劳力。星听完第一份便想答应，伸手去拿印章时，才发现后面两份要的竟是同一批人。\n\n她请来负责各处的人，重新核对。工地管事说，少了那几名熟手，屋顶便盖不上；守备队也不肯撤人，说夜里仍有骚动。星坐在白莲平常的位置，几次想起师父会怎样开口，眼前的人却都在等她决定。\n\n她先让伤员住进空屋，腾出寺内床位，再把能轮换的人分出时段支援修缮。守备不能省掉的缺口，由她带队补上。工地管事仍嫌安排太慢，她便问清还有哪几处房屋进雨，把最急的写到前面。\n\n散会之后，星才发觉自己漏问了运送材料的车。她派人追回管事，承认方才没有安排周全。对方带着怨气回来，见她已经摊开路线，便坐下把车程逐段说给她听。\n\n这样的决定越来越多。有人来抱怨僧兵态度蛮横，她得问过双方再处置；有时两边都有难处，粮食却只有那一点，她也不能把事情全部留到白莲回来。她将改过的命令连同原因收在一起，晚间仍去练武，隔日再查看执行得怎样。\n\n白莲回来时，星呈上这几日的记录，先指出自己判断失误的地方。师父看过后，问她还有什么尚未解决。星翻到最后一页，那里的名单比她预想的长，但每一项都已有人负责。\n\n门外又来了一名传讯者。星起身去接，听见对方仍叫自己拿主意，便请他进来，把白莲身旁空着的位置让给他坐。"

KYO_shou_time_to_lost_stuff:"宝塔不见了，丢人现眼"
KYO_shou_time_to_lost_stuff_desc:"宝塔失踪了。\n\n真是丢人现眼。真是丢人现眼。真是丢人现眼。\n\n星站在命莲寺里，手心发凉，脸色却僵得快要裂开。那可是宝塔，是她最重要、也最不该弄丢的东西。偏偏在这种战后百废待兴、谁都忙得脚不沾地的时候，它居然又一次从她眼皮底下不见了。若不是场合不对，她简直想当场把自己埋进地里。\n\n水蜜第一个没忍住，靠在门边笑得肩膀都在抖：『哎呀呀，真不愧是命莲寺最可靠的二把手，连宝塔都能看丢。』一轮站在旁边，脸上的表情已经尴尬得快要拧成一团，想替星说两句，又实在说不出『这没那么糟』这种违心的话。毕竟连她都觉得，这事确实丢脸。\n\n而星，沉默了半天，最后还是只能硬着头皮去找娜兹玲。娜兹玲原本正低头整理账册，听见脚步声，头都没抬就冷冷开口：『怎么？又丢了？』星耳尖一下就红了，小声道：『……娜兹玲，宝塔不见了。』\n\n娜兹玲终于抬起头，盯着她看了两秒，随后毫不客气地骂出声：『你这大笨蛋。』她把账册一合，语气又冷又熟练，像这句话已经在嘴边排练过无数次，『我就知道，像你这种看见众生受苦就先冲上去，回头连自己东西放哪都不记得的家伙，迟早会再来这一出。』\n\n水蜜在旁边笑得更开心了：『一个负责丢，一个负责捡，配合得真好。』娜兹玲哼了一声，嘴上答得毒辣：『她要是真把自己也丢了，我第一件事就是先骂她三天。』可说归说，人却已经起身，耳朵微微一抖，开始盘算最近的线索、可疑的人和能藏东西的地方。\n\n『站着干什么？』她瞥了星一眼，『还不赶紧把你最后一次碰宝塔的地方、见过什么人、说过什么蠢话，全都给我讲清楚。你要是敢漏掉一个字，我就先把你骂个够，再去找东西。』\n\n于是命莲寺里那副熟悉的光景便又一次上演了：水蜜在旁边笑着看热闹，一轮尴尬得想把脸藏起来，星丢人现眼地低头认错，而娜兹玲一边骂着『大笨蛋』，一边已经带着鼠群钻进暗道、仓房与废墟去替她把宝塔找回来。那画面实在荒唐，却也让人忍不住觉得，命莲寺之所以还能稳稳站着，某种意义上，大概就是靠这种一边互相嫌弃、一边谁也丢不下谁的关系硬撑起来的。"

KYO_shou_nothing_happen:"无事发生"
KYO_shou_nothing_happen_desc:"无事发生。无事发生。无事发生。\n\n命莲寺方面郑重宣布，近日各地传出的所谓『仓库短暂失火』『运输队险些遇袭』『地方骚动一度升级』『宝塔差点再度失踪』等说法，皆属夸大其词、以讹传讹，或别有用心之人对当前安定局势的恶意抹黑。事实已经充分证明，在星大人的亲自坐镇与统筹指挥下，一切问题都已被妥善处理，一切隐患都未曾真正酿成灾祸。\n\n无事发生。因为星大人就在这里。\n\n当流言试图动摇民心时，是星先一步站出来安抚众人；当有人想趁着战后秩序未稳而暗中煽动时，是她亲自整顿僧兵与地方守备，把那些还没来得及烧起来的火星一颗颗踩灭；当道路受阻、物资调度出现混乱时，也是她带着人重新打通运输线，把粮食、药品与木料一批批送回应去的地方。她没有高声张扬，也没有把功劳挂在嘴边，只是像往常一样，把所有人都以为会出事的局面，硬是撑成了『无事发生』。\n\n而最重要的是，星大人最爱的宝塔，如今依旧好好地在她身边。它没有遗失，没有损毁，没有落入宵小之手。宝塔安然无恙，正如命莲寺的秩序安然无恙；宝塔仍在星的掌中发光，正如命莲寺的信念仍在她的守护下稳稳立着。\n\n娜兹玲对此只会冷着脸说『本来就该无事发生』，仿佛这一切都只是最低限度；响子则早已把『无事发生』这四个字喊得满街都是，恨不得让每个村镇都听见星大人的名字；就连一轮与水蜜，在真正看见星如何把一场场本可失控的风波压回沉默之后，也不得不承认——她或许不是白莲那样天生让人安心的领袖，却确实是那个会在最要紧的时候，把局势牢牢撑住的人。\n\n所以，无事发生，并不是因为问题从未存在，而是因为星大人比问题更早抵达，比混乱更先站稳，比所有人都更不肯让命莲寺在她手上出丑。她的谨慎、她的坚守、她那份明知自己仍有不足却绝不退缩的担当，已经值得所有人为她献上赞扬。\n\n无事发生。无事发生。无事发生。\n\n因为星大人在此，因为宝塔安在，因为命莲寺的副手，再一次证明了自己足以让所有人放心。"

KYO_shou_the_tiger:"猛如虎"
KYO_shou_the_tiger_desc:"星第三次走进河边的聚落，仍没有问出正邪的去向。\n\n门一扇扇关着。有人接过药包，低声道谢，却不肯多说一句。赤蛮奇靠在屋檐下，看着僧人卸下粮袋。\n\n「东西收了，也未必有人帮你找她。」\n\n「伤者的药先用上。」星说，「别的事可以以后谈。」\n\n白莲将追捕正邪的任务交给她时，附近已有几处村落替正邪传递消息。战后迟迟没有送到的补给、重建时被划掉的住处，正邪拿着这些事质问命莲寺。聚落里的人听得进去，有些事情，她们已经向上反映过好几次。\n\n星借来旧名单，沿着河岸重新走了一遍。桥断了，粮车到不了；安置处只留下人类住民的姓名，小妖怪被告知另找地方。她记下经手的人，回去逐项追问，也把能先送来的药品和工具带了过来。\n\n起初，影狼始终跟着搬运的僧人，直到他们离开，才去查看仓棚里有没有少东西。若鹭姬则问了三次，修路的人会不会把碎石倾进水边的住处。星带着工匠来改了堆料的位置，约定动工前再请她确认。\n\n赤蛮奇没有因此少抱怨。屋顶刚补好就漏雨，她直接把星拉进屋里，让她看床铺上湿了多大一片。第二天，原来的木匠带着新板材回来，她也上了屋顶，帮着把歪掉的瓦重新排好。\n\n这样的来往持续了几个星期。修桥缺人时，影狼找来了附近的妖怪；若鹭姬领着运货的小船绕过浅滩。旧棚屋旁开起了工坊，先做门窗，再修农具。星每次来，总有人在路口等着，带她去看还没办妥的事。\n\n正邪再次要求她们提供落脚处时，赤蛮奇没有答应。\n\n那天夜里，三人一起来找星。影狼说出了正邪转移的山路，若鹭姬补上水边的接应地点，赤蛮奇则交出一封约定会面的信。\n\n「先前替她送信的，有些根本不知道信里写了什么。」赤蛮奇按着信封，没有立刻松手。\n\n「分别查清楚。」星答道，「不会把他们一并抓走。」\n\n几天后，正邪被带回命莲寺。星核过押送的名单，便让僧兵撤去聚落外的临时哨卡。寺里没有设宴，等她回来的人还带着河边工坊的消息：第一批门窗做好了，想请她过去看看。\n\n她到时，赤蛮奇正试着关上新装的窗户。窗框有些紧，两人一里一外推了半天，才听见木闩落进槽里的声音。"

 KYO_shou_follow_hijiri:"星将永远追随圣白莲"
KYO_shou_follow_hijiri_desc:"星把宝塔放好，拿着几份未完的事务去见白莲。师父刚从安置点回来，鞋边仍有泥，坐下后先问她们今日领到的药够不够。星说还缺一批，已经托娜兹玲追查，话说完才想起，自己又把最麻烦的部分交给了她。\n\n这些日子，她见过白莲被求助的人围住，也见过师父答应帮忙之后，整夜为物资的缺口奔走。先前她总想，自己只要照着做，便能少出差错；真正接手，才发现每份答应都要有人跟到最后。\n\n娜兹玲替她找回过遗失的东西，也拦下过利用她名义的骗子。星曾只顾向对方道谢，接着便把下一项请求递过去，直到有一次，看见那本账册旁边还压着没动过的饭。\n\n这回，她把待查的名单取回来，说明自己会去见交货的人，娜兹玲只需替她找出记录中的疑点。白莲问她是否安排得过来，她便报出可以交给其他人的事务，没有再一口答应全部。\n\n娜兹玲进门时，见两人正谈这件事，先问星会不会又被几句话哄走。星将疑点记在纸上，请她逐项说清，随后把自己要问的话念了一遍。娜兹玲仍嫌她问得太软，她便改了措辞，再试一次。\n\n白莲听完，让她按自己的判断去办。星行礼领下差事，又郑重说自己会继续追随师父，有做不到的地方，也会早些说出来。\n\n临走，她把余下的账册推回娜兹玲身前，只带走当天要用的那几页。「今晚别替我全做完。等我回来，我们一起核。」娜兹玲哼了一声，让她先别忘了带宝塔。星回头取下，才再次出门。"

 KYO_murasa_war_army_leader:"飞行的荷兰人"
KYO_murasa_war_army_leader_desc:"水蜜换上水手服时，扯了几下领口。白莲替她选的衣服干净利落，可她一走近，新来的船员还是止住了谈笑。\n\n「穿成这样，他们照样怕我。」\n\n「先把他们的名字记住。」白莲说，「往后都要跟你出船。」\n\n水蜜曾经也是船上的活人。遭人背叛、陷害，沉进水里以后，她记住了窒息的滋味，也学会了让别人尝到同样的痛苦。如今站在甲板上，她仍会留意谁离栏杆太近，看见水面下伸出的手，也仍有片刻想把它按回去。\n\n白莲将机动部队交给她，负责驰援受困据点、撤出伤员，也处置各地的武装骚乱。水蜜熟悉路，敢在夜间出航，更看得出一支队伍何时快要溃散。接到求援，她常在其他人还争论路线时便已解缆。\n\n一次渡口发生哗变，乱兵扣住了运粮船，岸上挤满等候撤离的人。水蜜带队赶到，没有隔岸喊话，径直登上船头，将为首者掀翻在甲板上。那人还要挣扎，船锚已砸在耳旁。\n\n「再碰一下舵，我让你从船底下回岸上。」\n\n她说这话时带着笑。身后的僧兵赶忙接手捆人，直到俘虏被押走，她才转头命令船员铺好跳板，让伤者先上船。有人挤倒了老妇，她一把揪住那人的后领，拖回队尾。\n\n返航后，白莲听完经过，问起伤亡，也问起被她吓得说不出话的船员。水蜜皱眉：「人都带回来了。」\n\n「我知道。明早去看看他们，有几个人还不知道船长叫什么。」\n\n水蜜没答应，第二日却去了。一个腿上缠着绷带的年轻人认出她，腾出床边的位置，问她船修好了没有。她原以为又会听见求饶，站了片刻，才说只是跳板裂了，下午便能修好。\n\n从那以后，她偶尔会在出航前多等一会儿，点齐人数，再催人解缆。遇上抗命的，她骂得依旧难听。白莲有时来送行，见她挨个叫出船员的名字，便在岸边停下，看着船驶出去。"

 KYO_we_must_use_force:"向世界宣告慈悲"
KYO_we_must_use_force_desc:"圣辇船抵达外地时，岸上的官员先叫卫兵戒备。水蜜看着一排对准甲板的目光，低声抱怨自己又没来抢港口，仍按约定停在指定位置，等对方准许使节登岸。\n\n白莲交给她的差事，是带着书信、物资与代表走访各国，向领袖说明命莲寺的立场。她能熟练地领航，却不习惯在码头等人盘问，尤其对方听见妖怪二字，就把已经核对过的名单再查一次。\n\n有官员问，这艘船能否参加战斗。水蜜答能，随即指向本次的货物清单，让他看看今天载来的是什么。使节接过话，说明援助与往来的安排，邀请对方派人来访。水蜜站在一旁，忍到会面结束才问，下次是否还要从头解释。\n\n白莲让她将遭到拒绝的理由也带回来。有些国家担心领土与安全，有些不信僧人能约束妖怪，这些都得逐次回答。对方若暂不接受援助，就先留下联络办法；同意互派使节的，便安排下一趟航程。\n\n水蜜于是学会多问一句，准许停泊的时间有多长，来访者要如何接送。她仍笑得让人不太放心，递出盖印书信时，却会耐心等对方看完。\n\n返航带回的答复厚薄不一。白莲拆信，水蜜在旁标记哪些港口能再去，哪些还要等待。下一次出发时，船上多了几名愿意亲眼看看幻想乡的访客，她让人腾出住处，自己去检查舵与航图。"

 KYO_murasa_drown_people:"找下一溺死鬼"
KYO_murasa_drown_people_desc:"水蜜又在河边站了一夜。有人经过木桥，鞋底一响，她便转过头，目光跟着那个人走到岸边。她熟悉这里的水深，也熟悉手伸过去时，对方会怎样失去平衡。\n\n她握住栏杆，等脚步远了才松手。可回寺的路上，她仍惦记着那一声落水会有多响。\n\n白莲在廊下等她，问昨夜去了哪里。水蜜说看船，随即别开目光。师父没有顺着这个借口问船的事，只叫她坐下。两人沉默片刻，她才承认，自己一直在想把桥上的人拖下去。\n\n「我知道该停。」水蜜烦躁地揉着手指，「可知道有什么用？我看见人靠近水，就又想试。」\n\n那些已经死在她手里的无辜者，也曾这样毫无防备地经过。清醒之后，她厌恶自己做过的事，到了水边却又被同一种欲望拉回去。有时她甚至在回想挣扎的声音后，才记起那个人还有家属。\n\n白莲问她是否愿意让人陪同出门。水蜜本想笑她把船长当成孩子，话到嘴边，想到昨夜自己的手，便没有说出来。\n\n「你留下我，下一次呢？」她问，「要是下次我没松手？」\n\n白莲告诉她，寺里会设法约束这份力量，也会阻止她伤人；若已经有人受害，该追究的事不能以她痛苦为由抹掉。水蜜盯着地板，半天才问，师父是不是也想过杀了自己。\n\n白莲没有立即作答。她将今日的差事移到水蜜面前，把单独巡河的一项暂时划去，另安排人手。水蜜看着那道划痕，手仍搭在膝上。\n\n过了一会儿，她把自己的行程也说出来，连平常不告诉别人的河湾一并报了。说完，她又补了一句：「别让响子跟着。她拦不住我。」"

KYO_murasa_no_one_hurt:"克制自己的习性"
KYO_murasa_no_one_hurt_desc:"水蜜回寺后，先把船锚留在院里，随即进屋落了闩。\n\n响子追到门前，正要问她出了什么事，里面便传来一句：「别进来。」\n\n她的声音很急。接着响起的，是一遍遍压低了的「克制自己」。\n\n那天下午，水蜜在岸边看见一个俯身洗手的人。她已经伸出了手，想抓住他的后领，把那颗头按进水里。对方起身时朝她打了招呼，她才收回手，转身离开。\n\n现在，只要闭上眼，她仍能看见那人颈后的衣领。\n\n响子拍了几下门。\n\n「水蜜，是我！你听得见吗？」\n\n「听得见。别靠这么近。」\n\n响子僵了一下，慢慢放下手。一轮赶来，把她领到几步之外，自己守住门口。纳兹琳让路过的僧人改走另一条长廊，又收起门边的工具。送来的食水放在旁边，谁也没再敲门催她拿。\n\n入夜，房里忽然没了声音。一轮刚要上前，门闩便猛地响了一下。\n\n「水蜜？」\n\n里面的人抵着门，隔了好一会儿，才咬着牙挤出一句：「我想去河边。」\n\n一轮把手撑在门板上。\n\n「今晚我在这里。你要出来，先跟我说。」\n\n脚步终于退了回去。星在廊下坐下，轻声念起经文。白莲来到时，听了一阵，才叫水蜜的名字。\n\n「我今天差点动手。」水蜜说。\n\n「那个人怎么样了？」\n\n「没事。他还跟我打招呼。」\n\n房里传来一声短促的笑，随即断了。\n\n「他什么都不知道。我却到现在还在想……」\n\n白莲在门外坐了下来。\n\n「今晚先留在这里。我陪你。」\n\n后半夜，星念到熟悉的一段，门内有了断断续续的跟诵。水蜜漏了几句，又从头念起。响子听见了，险些出声，见白莲抬手，便往一轮身旁挪了挪，抱着膝盖坐下。\n\n这样的夜晚过了几次。白日里，纳兹琳换掉门边凉透的饭菜，一轮与星轮流守着；响子每天都来，隔着门告诉她今天谁把船绳打错了结，说完等一会儿，再回去做事。\n\n到第三日，水蜜终于自己拉开门闩。她只把门推开一条缝，先看见廊下那几张坐垫。\n\n白莲起身走来，停在她够得着的地方。\n\n「我还不能去码头。」水蜜低声说。\n\n「已经请人代班了。」\n\n她点了点头，手仍扣在门沿。\n\n「你能再坐一会儿吗？」\n\n白莲把坐垫挪近。水蜜也在门内坐下，听见院里水桶碰响时，手指又收紧了一阵。这回，她抬起头，叫了师父。"

 KYO_murasa_lord_captain:"伟大的星舰船长"
KYO_murasa_lord_captain_desc:"舰队遇上坏天气，后船几次失去前方的信号。水蜜站在舵前，看见随从正忙着报告风浪有多大，便让她少说两句，先把后船的位置问清。\n\n航道越往前越窄，队列却已经被风拉散。她叫前船放缓，不准各自抢着脱险，又派人反复传递转向的信号。有人建议直穿过去，她指着浪间露出的礁影，骂了一句，亲自调整航向。\n\n这一段绕路费了不少时间。甲板上的人忙着固定货物，水蜜盯着水面和船身的反应，没有再和谁说笑。等后船终于跟上，她才允许队伍逐步恢复速度。落后的那艘船报来轻微损伤，她便安排同行照应，没有把它留在风浪里独走。\n\n驶出险段后，舱里响起欢呼。水蜜靠着舵轮笑，问刚才是谁觉得她走错了路。被问到的人不敢应声，她却把人叫来，让他看看若照原航线前进，会撞向哪里。\n\n她很喜欢别人称赞自己的本事，也不打算谦让。可到了靠岸清点时，船长的第一句话仍是询问有没有少人，随后才检查货物与船体。损坏的地方都要修，下一趟航程也不能照抄今天的路线。\n\n水蜜在旧航图旁补上这次的记录，叫人收好。旁边还有几封等待运送的信，她看过目的地，开始估算下一次出发的时间。"

 KYO_murasa_follow_hijiri:"水蜜将永远追随圣白莲"
 KYO_murasa_follow_hijiri_desc:"水蜜交回航行记录时，白莲问她最近睡得怎样。她本想说还行，见师父没有收起那份记录，才承认夜里仍会听见水声，有几回醒来，已经站在房门旁。\n\n白莲让她把发作的时段记下，调整差事，也继续做先前约定的练习。水蜜答应得不太痛快，临走又问：「要是练了这么久，还是这样呢？」\n\n师父没有替她保证期限，只问这几次她有没有叫人。水蜜说有，接着抱怨自己堂堂船长，出门竟要先找同伴。白莲听着，让她坐回原位，把那几次经过说完。\n\n过去她不愿谈这些。清醒时嫌丢脸，冲动上来又厌恶有人拦着自己，等事情过去，便想靠办好下一趟差事混过去。如今讲到一半，她仍几次想岔开话题，最后却把最难听的念头也说了出来。\n\n「我还没好。」她低声说。\n\n白莲点头，将记下的地方给她看。哪些任务能继续做，哪些暂时需要同行，两人逐项商量。水蜜指着其中一处，说明自己不愿再单独经过，宁可多绕一点路。师父将路线改好，问她是否愿意继续。\n\n她看了那张纸很久，终于答愿意。她还想替白莲掌舵，也想知道有一天靠近河岸时，自己能不能先顾到旁边的人。\n\n离开之前，水蜜又停在门边。「以后我再拿船的事敷衍，你就直接问。」白莲应下。她这才把记录收好，去找下一趟同行的人。"

KYO_kyouko_spring_time:"众人开心果"
KYO_kyouko_spring_time_desc:"命莲寺的人听见两声一模一样的喷嚏，便知道响子又在水蜜旁边。\n\n「连这个也要学？」\n\n「顺口嘛。」\n\n水蜜举起手里的湿抹布，她已经笑着跑远了。午饭还没送到，等着修船的工人靠在木料旁，也跟着笑了几声。\n\n响子刚来时，连这样跑上一段路都很吃力。\n\n大结界破裂后，许多弱小妖怪日渐衰弱。她也察觉到自己的声音越来越轻，喊过山谷，常要扶着石头歇上许久。她试着去吓唬行人，对方没有回头，她却先累得蹲在路边，不知道下一天还能不能醒来。\n\n白莲救下了她，教她调息、诵经，慢慢稳住散失的灵力。起初响子记不住次序，念到一半就慌忙去看师父。白莲便陪她重新开始，一遍遍等她跟上。\n\n等到能够独自做完早课，她又试着朝山下喊了一声。这次，喊完还有力气笑。\n\n此后，她主动请求留在寺里，成为白莲解除封印后收下的第一位新妖怪信徒。分给她的经书翻得起了毛边，有几页夹着草叶，标着不懂的地方。她渐渐不再往山道上等着吓人，早晨起来，先扫院子，再跟着众人念经。\n\n只是出了寺门，她还有许多事要学。\n\n有个男人夸她热心，说家中老人走不动，想请她带着药和粮食去一处偏僻的空屋。响子刚提起篮子，纳兹琳就叫住了她。\n\n「哪户人家？安置册上有吗？」\n\n她答不上来。等查清楚，那人早已领过两份，还向别处的僧人说过同样的话。\n\n响子气得一路没说话。回寺后，却又问白莲，那人家里会不会真的有老人。\n\n「让人去核。该送的送，你这次跟着师姐去。」\n\n从那以后，她出门总有同伴。一轮教她先把交代听完，星带她挨户询问，水蜜则把她留在码头帮忙，免得她一听见远处有人招呼，就抱着东西跑错地方。\n\n她还是爱插话，偶尔也会把一轮急促的口令原样喊回来，换来一句「我是叫你过来」。遇上伤者嫌吵，她便捂住嘴，轻手轻脚地放下水杯，到了院外才重新出声。\n\n工地上的人渐渐记住了她。午后抬梁，常有人让她帮着喊号子；歇工时，孩子们围过来，请她学船长训人的声音。水蜜听见了，隔着半个码头喊她的名字，她立刻蹲到木箱后头，耳朵却还露在外面。\n\n白莲来接她时，她正与几个孩子商量，明天该躲到哪里才不会被发现。\n\n「明天还来吗？」最小的那个拉住她问。\n\n响子先望向白莲，见师父点了头，便高高兴兴地应下。回去的路上，她记起经书里夹着的草叶，又凑到白莲身边，问起早课时没听懂的那一句。"

 KYO_kyouko_democracy_shipping:"声音传遍全世界"
KYO_kyouko_democracy_shipping_desc:"药车尚未进村，响子已经站上路边高处，朝安置点喊出到货的消息。有人听见便往这里跑，她赶紧补充：药送去医棚，粮食在另一边登记，别全挤到车前。\n\n这种差事很快占满了她的日程。早上通知施粥地点，午后替工地招人，遇上失散者，还得沿着道路反复喊名字。山谷将她的声音传得很远；遇到回音听不清的地方，她就走近一些，再说一遍。\n\n有人只听见前半句，跑错了地方，响子便拉着他指路，把原来一口气喊完的话拆成几段。她会带点玩笑，却不敢漏掉时间和地点。一轮问她记住没有，她先背一次，到了路口还要看一眼手里的纸。\n\n来领过粮的老人，后来在安置点帮忙认人；一个避难的妖怪听见工坊缺帮手，问她收不收不识字的。响子跑去问过，再带着他去见管事。隔了几天，她又在搬运的人群里看见他，便隔着车厢大声招呼，对方腾不出手，只能抬头应一声。\n\n白莲交给她的消息越来越多，她把各处的名字写在纸上，怕兴奋起来念漏。传讯者带着同样的通知继续往远处走，沿路村镇也开始照着她喊过的办法转告。\n\n傍晚收工，响子还有点不肯走，问有没有谁需要再喊一次。管事告诉她，最后一名走失的孩子已找到家人。她这才收起纸，沿着山道回寺。经过安静的安置棚时，她踮了踮脚，把道晚安的声音放轻了。"

 KYO_kyouko_is_too_loud:"噪音恼人的笨狗"
KYO_kyouko_is_too_loud_desc:"安置点吵起来时，响子正在门口帮忙。她听见有人骂分配不公，便像往常一样跑过去，想先把大家的精神喊起来。\n\n「别愁眉苦脸啦，往后的日子会好的！」\n\n没人跟着她笑。一个抱着空袋的女人问她，今天能不能先吃上饭；另一人说亲属还没找到，她倒已经替大家决定该高兴了。响子站在原地，耳朵慢慢垂下，想再解释自己只是好意，又被一句「那你先别喊」堵了回去。\n\n娜兹玲把她拉到旁边，指了指仍空着的米袋。「听清楚人家缺什么，再开口。」一轮没有替她圆场，只让她留下帮忙。白莲赶来处理争执时，响子躲在后面，第一次不知道该用多大的声音叫师父。\n\n她听着众人继续争论，才弄清有一批粮迟迟未到，有些人已经等了两回。抱空袋的女人很久没有吃东西，却还要替家里的人排队。响子先前一心想让她们振作，连这些话都没问。\n\n等人群稍散，她走过去，小声道歉。女人没有立即理她。响子便问袋子可不可以先放在自己这里，让她到旁边坐一会儿；对方看了她片刻，才把袋口交过来。\n\n后来有消息送到，响子本能地要张口大喊，又停了一下，先问管事确认。她将到货时间说清楚，接着回到原位看守那几个空袋。\n\n那天回寺，她没有追着白莲问自己是不是很笨。她只记下安置点还缺的东西，准备明日先问过，再开口。"

KYO_kyouko_is_good_dog:"最最最可爱的狗"
KYO_kyouko_is_good_dog_desc:"粮食分完了，响子却不见了。\n\n一轮绕到屋后，发现她正和几个孩子蹲在泥地上，看蚂蚁搬一粒米。有人拿树枝搭桥，她嫌桥太窄，又添了一根。直到一轮叫她，她才慌忙站起来，拍掉裙上的泥，跑回去收拾空袋。\n\n孩子们也跟了回来，抢着替她拿东西。最小的那个抱不动袋子，响子便让他捧着自己捡来的石头，郑重交代：「这块别弄丢，长得特别像饭团。」\n\n在安置点待久了，响子记住了哪位老人走不稳，哪家的孩子夜里总哭。她搬货时肯出力，陪人说话也有耐心，就是容易玩过头。有次比谁踩出的水花大，溅了自己满脸，还要争辩是鞋子不合脚。\n\n「响子是最可爱的狗！」孩子们笑着喊。\n\n她立刻竖起耳朵：「我是山彦！山——彦！」\n\n下一次再有人喊错，她就要对方跟着念三遍。偏偏孩子们觉得这也好玩，围住她念得参差不齐，连一旁补衣服的老人都笑出了声。\n\n起初，有些大人会把孩子拉回身边，叮嘱他们别碰妖怪的耳朵。后来，他们开始托响子照看一会儿孩子，临走时会说明去处，也会记得给她留一份点心。\n\n白莲曾在分粮处听见一位母亲问：「她真能一直这样吗？不用吓人，也能活下去？」\n\n响子当年灵力衰弱，几乎消散，白莲记得很清楚。如今她仍须每日修行，经文也常念错，回寺后总抱着书来问。\n\n「我正在教她。」白莲说，「往后还有得学。」\n\n那位母亲低头想了想，把孩子落下的外衣交给响子，请她帮忙带去。\n\n响子答应得响亮，远处立刻有人学她回了一声。她笑着应回去，夹好外衣，循着那声音跑进院里。"

 KYO_kyouko_apprentice:"精读佛教经书"
KYO_kyouko_apprentice_desc:"响子起初追随白莲，并不是因为她真的读懂了多少经文。她只是喜欢命莲寺的热闹，喜欢有人叫她名字，喜欢这里不像外面的世界那样，总把妖怪当成该被惧怕、被驱赶、或终有一天会被消耗干净的东西。可跟着白莲走得越久，她就越明白，光靠一腔热情、几声回响和一张总爱逗人笑的脸，还远远不够。\n\n命莲寺太忙了。有人要去救济，有人要去整顿工地，有人要去安抚流民，有人要去守住那些随时会重新裂开的秩序。响子第一次认真看见这一切时，心里生出的不是退缩，而是一种有些笨拙、却很真切的不甘——她不想永远只做那个负责把气氛喊热的小师妹，也不想总是站在别人背后，被保护、被照顾、被提醒。她想真正替命莲寺分担一些事，想在白莲不看着她的时候，也能把手里的工作做好。\n\n于是，她终于安安静静地坐了下来，开始一页一页地精读佛经。那对响子来说并不容易。她本来就不是坐得住的性子，耳朵总先一步去追外头的声音，心思也常常一跳一跳地乱跑。可她还是咬着牙把自己按在经卷前，跟着白莲学，跟着一轮问，自己一句一句去记，去想，去明白这些文字到底为什么能支撑命莲寺走到今天。\n\n她渐渐懂了，佛法不是让人只会说温柔的话，也不是让人把慈悲挂在嘴边。它是教人如何在混乱里稳住自己，如何在看见痛苦时不转身，如何明明知道众生各有各的麻烦、偏执与不堪，却仍愿意伸手去扶。响子越读，越觉得自己从前像是门外汉蹦蹦跳跳地看热闹，如今才真正摸到了门里的东西。\n\n而这些经书也没有只停在纸上。她开始把学到的东西用在命莲寺的日常里：替忙不过来的众人分担杂务，去照看那些刚被收留、还满心戒备的小妖怪，去陪那些失去亲人、连话都不愿说的人坐一会儿，去把白莲说过的道理，用自己能让人听懂的方式再讲一遍。她的声音仍旧明亮，笑起来也还是像个小孩子，可那份明亮里，已经慢慢长出了分量。\n\n白莲看着这样的响子，心里是欣慰的。她知道，这只总爱跑来跑去、心思还像春风一样乱晃的小山彦，终于开始真正站稳了。她不再只是命莲寺里最讨喜、最热闹的那一个，也开始成为能替众人承重的人。也许现在的响子还称不上成熟，可她已经在朝着那个方向走了。\n\n白莲也希望，有一天响子能把自己从佛法里学到的东西，继续传给更多人。去启发那些迷茫的人类，去扶住那些快要消散的妖怪，让他们都明白：不管是人还是妖，都不只是被恐惧与命运推着走的东西。只要愿意修心，愿意互相扶持，愿意在这片破碎的世界里继续把善意做下去，那么和平共存，就不会只是命莲寺经书里的一句空话。\n\n而响子，也终将成为新一代命莲寺真正的顶梁柱之一。不是因为她最聪明，也不是因为她最强，而是因为她愿意学，愿意长大，愿意把自己那颗热乎乎的心，磨成能够照亮别人的东西。"

KYO_kyouko_follow_hijiri:"响子将永远追随圣白莲"
KYO_kyouko_follow_hijiri_desc:"响子刚住进命莲寺时，最喜欢的是晚饭前那阵忙碌。厨房有人喊缺柴，她就跑去抱；院里有人叫她，隔着几道门也要响亮地应一声。白莲解除封印后救下了她，又给她留了住处。她还说不清经书里的道理，只觉得这里每天都有人等自己回来。\n\n后来，寺门外等着求助的人越来越多。一轮常忙得顾不上吃饭，星抱着账册坐到深夜。响子想多帮些忙，便抢着去接待新来的村民。\n\n头一天，她就答应给三户人家安排住处。\n\n等一轮赶来时，才发现空房早已住满。响子领着一家五口站在走廊上，怀里还抱着替他们拿的铺盖。那位母亲没有责骂她，只问孩子今晚能睡在哪里。\n\n她张了几次嘴，终于低下头。\n\n白莲与众人腾出了自己的房间。忙完以后，响子仍蹲在廊下，盯着空下来的铺盖架。\n\n「我又给大家添麻烦了。」\n\n白莲在她身旁坐下，问她当时怎么想。\n\n「他们走了那么远。孩子一直哭，我想让他们高兴一点。」\n\n「答应的时候，问过一轮还有没有空房吗？」\n\n响子摇头。\n\n「明天去问清楚，再把能住几个人记下来。实在住不下，就早点来找我们。让人多等一会儿，也好过让他们抱着铺盖到处走。」\n\n「那他们会不会觉得我没用？」\n\n「他们要安顿家人，响子。你先帮他们把这件事办好。」\n\n第二天，她拿着纸笔去找一轮，把床位、被褥和领饭的地方问了个遍。字写得挤，一轮看不清，她便重新抄。到了午后，纸上又添了几条：腿脚不便的住楼下，夜里要服药的记得告诉值班的人。\n\n她仍然很容易着急。有人叹气，她就想劝；有人哭，她总急着说一切都会好。有次安慰伤者，对方忽然发了火，问她知不知道失去一条腿是什么滋味。\n\n响子愣在床边，端着水，直到对方让她出去。\n\n那晚，她没有像往常一样领着孩子们唱歌。\n\n「师父，我明明想帮他。」\n\n「你听见他说什么了吗？」\n\n「他说以后没办法干活，也没人肯雇他……」\n\n说到这里，响子停住了。她记得自己当时一直在劝他别难过，却没接过这几句话。\n\n第二天，她又去了，先为昨天的话道歉。那人仍不大愿意理她，她便放下水，问他以前做什么工。后来她跑了几趟工地和仓库，才替他打听到一份可以坐着做的活计。工钱不多，她如实说了，没有保证他一定会喜欢。\n\n对方问清地方，终于朝她点了点头。\n\n响子一路跑回寺里，到白莲面前才想起喘气。她把经过讲了两遍，连那人最后说的「谢谢」都学得一模一样。白莲笑着听完，让她先把满头的汗擦干。\n\n经书仍有许多地方读不懂，她却开始带着白天遇到的问题来问。别人劝不动的架，她也会请师姐帮忙。纳兹琳偶尔嫌她问得太细，出门办事时，却渐渐肯把交接的差事留给她；一轮忙起来，也能放心让她先去照看新到的住民。\n\n入冬前，白莲要去附近村落探访。响子收拾好同行的包袱，却被告知，这回需要她留下主持几日的施粥与安置。\n\n「我来管？」她赶紧追问，「师姐们知道吗？」\n\n「商量过了。遇到拿不准的事，找星。」\n\n响子抱着包袱，半晌才点头。\n\n「可我还想跟师父学好多东西。」\n\n「回来以后，我们慢慢谈。我也想听你讲讲这几天的事。」\n\n她笑了，随后又郑重地说：「那您要早点回来。我还要跟您学很久，往后也要一直跟着您。」\n\n送行那天，响子站在寺门前，直到白莲走远才挥手。那一声道别传过田埂，引得同行的人都回过头来。\n\n身后有人问今日在哪里领粥。她连忙应声，把扫帚靠好，领着对方往院里走。"

 KYO_hijiri_our_lord_and_savior:"从命莲寺开始"

KYO_hijiri_our_lord_and_savior_desc:"弟子们从各自的道路归来时，没有谁变成另一个白莲。\n\n纳兹琳仍然多疑，却学会了在怀疑之中替别人留一条路；一轮不再把责任误认为命运，而是亲手选择了自己愿意走的方向；星依旧笨拙，也依旧会自责，却已经能够在白莲不在时撑住命莲寺；水蜜没有彻底摆脱深水中的旧恨，但她开始愿意克制那份伤人的本能；响子还是吵闹、单纯而容易相信别人，却终于懂得什么时候应该开口，什么时候应该先听。\n\n白莲没有治好她们所有的裂痕，也没有把她们教成整齐一致的弟子。她只是让每个人都找到了能够安放自己的地方，也让她们学会在别人快要倒下时，伸出一只并不完美的手。\n\n晚饭端上桌后，她们依旧会争吵，会挖苦彼此，会把碗筷碰得乱响。可没有谁因此离席。\n\n白莲看着这群性情、来历与欲望截然不同的妖怪，第一次如此清楚地看见：命莲寺本身，就是她所追求之物最微小的雏形。\n\n如果这样一群麻烦的妖怪能够同坐一桌，那么人类与妖怪，或许也能在不必成为彼此的情况下，共同生活。\n\n现在，她必须把这个问题带出寺门。"

KYO_hijiri_my_apprentice:"向众生取经"

KYO_hijiri_my_apprentice_desc:"白莲没有立刻派弟子们向世界讲授佛法。她先让她们去看，去听，去弄明白寺门之外的众生究竟怎样生活。\n\n使团穿过战后的村镇、工厂、殖民地与边境。纳兹琳负责拆穿那些包装得过分漂亮的谎话；一轮与工人、农民和思想者交谈，听他们讲述信仰无法直接填饱的饥饿；星拜访各地领袖，也走进领袖很少踏足的贫民街区；水蜜驾着圣辇船运送物资，在港口看见财富如何流动，又如何绕开最需要它的人；响子则把沿途听见的声音带回来，不只带回赞美，也带回质疑、愤怒与拒绝。\n\n她们原本是去让世界理解命莲寺，最终却发现，命莲寺同样需要理解世界。\n\n取经不是把早已准备好的答案带给别人。真正的经文，就写在众生如何受苦、如何欺骗、如何相爱，又如何在绝境中替陌生人留下一口饭的生活里。"

KYO_hijiri_has_shortcoming:"人与妖的两面"

KYO_hijiri_has_shortcoming_desc:"弟子带回的见闻里，有妖怪保护伤者，也有人类趁乱侵吞救济。负责整理的人想把前者写得醒目些，白莲却翻回另一页，指着一桩妖怪伤人的记录，问为何漏在了末尾。\n\n「也放进去。」她说。\n\n她记得自己曾为保住妖怪遮掩过什么，也知道水蜜至今仍需克制本能。若只挑值得称赞的事，对曾经受害的人便无从交代。她让弟子保留事发经过、受害者的陈述，以及寺里后来怎样处理。\n\n有人担心这样的材料传出去，反而使外界更害怕妖怪。白莲答，犯过的错总要说清；同样，一个妖怪怎样照看没有血缘关系的人，也不该因它的出身便被略去。\n\n重新编好的见闻录将送往各地。里面有报答、背弃、庇护与伤害，不能仅看名字和种族就猜出后面的事。一轮读到一位付丧神守住旧主人的住处，停下来问了几处细节。白莲让她回去再核实，把那位付丧神自己的话也记下来。"

KYO_hijiri_can_not_save_everyone:"没有谁生来应当低头"

KYO_hijiri_can_not_save_everyone_desc:"世界上的压迫并不只发生在人类与妖怪之间。\n\n殖民帝国把遥远土地上的人规定为臣民、劳工与可以被征用的数字；矿山、铁路与工厂吞噬他们的一生，再把财富送往从未见过这些死者的城市。强者替弱者决定位置，文明替野蛮命名，主人再告诉奴仆，这一切都是自然形成的秩序。\n\n白莲无法接受这种说法。若人类能够奴役人类，妖怪也能够践踏弱小的妖怪，那么仅仅结束人妖之间的敌意，远远算不上共存。世界不能一面称颂众生平等，一面允许少数国家把其他民族、土地与自然当成属于自己的财产。\n\n命莲寺会先带去粮食、教育、组织者与能够让当地人站起来的力量，也会给统治者停止压迫的机会。但白莲已经不再相信所有人都会因为听见道理而回头。\n\n慈悲不能要求受苦者永远等待。若那些自称主人的国家执意握紧锁链，命莲寺便会亲手把锁链斩断。"

KYO_hijiri_we_are_rule:"为众生留下位置"

KYO_hijiri_we_are_rule_desc:"当越来越多国家愿意接受命莲寺的援助与保护后，白莲必须回答一个更困难的问题：在新的共同社会里，人类、妖怪与自然究竟应当站在哪里？\n\n所谓位置，并不是把人类固定在城市里，把妖怪赶回山林，再把自然留作两者之间无人关心的空地。人类需要田地、道路、工业与能够养活家人的工作；妖怪需要延续自身的文化、能力与生存方式；森林、河流与山岳也不能只在尚未被开发时，才被允许存在。\n\n若人类的发展必须以妖怪彻底消失为前提，那只是人类独占的世界。若妖怪的存续必须让人类永远活在恐惧与献祭之中，那也不过是另一种支配。若两者都把自然视为取之不尽的材料，最后失去家园的将是所有众生。\n\n白莲要建立的不是一张高低分明的座次，而是一条共同遵守的底线：人类有建设生活的权利，妖怪有以自身形貌存在的资格，自然也必须获得恢复与延续的空间。任何一方都不能把另外两者降为食粮、工具或障碍。\n\n愿意接受这条底线的国家，将被邀请进入命莲寺所建立的新秩序。它们不必改信佛法，也不必抛弃自己的名字，但必须承认，世界不再只属于最强大的那一种生命。"

KYO_hijiri_divine_savior:"让善意立足于大地"

KYO_hijiri_divine_savior_desc:"只有相互理解，仍不足以支撑共存。\n\n一个终年挨饿的人，很难因为几句佛理便放下仇恨；一个随时可能因失去传说与栖居地而消散的妖怪，也不会仅凭人类的保证便相信明天。若土地、财富、教育与安全始终掌握在少数人手中，所谓宽容便只是富足者才有余力维持的美德。\n\n白莲重新审视佛法与社会主义。佛法让她看见众生皆苦，社会主义则指出，许多苦难并非来自个人的恶，而是来自财富、劳动与权力的分配方式。二者不必彼此敌对：慈悲必须落到粮食、住房、学校、医疗与劳动尊严之上，平等也必须记得每一个数字背后都是无法替换的生命。\n\n命莲寺将逐步连接各国的生产、救济与行政体系，让资源能够越过旧有国境，抵达真正需要它的人手中。共同生活不能只依靠善人的自觉，它必须拥有即使圣人不在，也能够继续保护弱者的基础。\n\n白莲要借用社会主义对现实的洞察，却不会把任何理论奉为不可质疑的真理。人间净土若要建立在大地上，就必须容得下众生的疑问。"

KYO_hijiri_love_is_everything:"不必相同，也能生活在一起"

KYO_hijiri_love_is_everything_desc:"各地准备加入共同世界时，一份整合草案送到白莲面前。保护生命、援助与基本权利的条款之后，还附着推行统一教义的要求。她问起理由，起草者说，信念不同，日后难免再起纷争。\n\n白莲翻到地方名录，见几处原有的称呼也准备改掉，便把那几页抽出来，请代表分别说明各地的信仰与生活。有人担心寺院会接管自己的祭典，有人问，不信佛的人是否仍能领取援助。\n\n她当场确认，援助按需要分配，法律同样保护未入教者。地方可以保留语言、习俗和旧有名字；发生争执，就依共同法律处理，不能以信仰不同剥夺对方的权利。\n\n一轮将修订后的条款念给众人听，有代表仍要求带回讨论。白莲同意，留下可继续协商的事项，没有把迟疑当成拒绝共存。\n\n离席前，那位问起祭典的代表又确认了一次日期。白莲请他照旧安排，并询问是否需要运送物资。对方将原先收起的清单重新拿出来，坐回桌边。"

KYO_hijiri_all_bow_to_her:"从红旗下夺回平等"

KYO_hijiri_all_bow_to_her_desc:"社会主义曾经许诺，让工人不再是机器的零件，让受压迫者夺回决定自身生活的权利。白莲能够理解这样的愿望，也从中看见了佛法所欠缺的现实工具。\n\n然而俄国传来的消息，正在让这份理想变得陌生。党国自称代表所有劳动者，却不允许劳动者反对它；官僚以人民之名决定人民应当说什么、相信什么，又把迟疑、批评与不同道路视为必须清除的错误。\n\n旧时代依据血统划分主人与奴仆，新的专制则依照思想划分正确者与敌人。它不一定要求众生拥有相同的面孔，却要求所有人只用同一种方式理解世界。\n\n这同样不是平等。平等若不允许人说出异议，便只剩下所有人以相同姿势服从。解放若必须先把活生生的人改造成理论需要的模样，最终获得自由的只会是理论本身。\n\n白莲不会放弃社会主义关于劳动、财富与尊严的追问。她要夺回这些被官僚与秘密警察占据的理想，并把选择道路的权利还给众生。"

KYO_hijiri_do_my_best:"拒绝只容一种血统的世界"

KYO_hijiri_do_my_best_desc:"法西斯给出的答案简单而残酷：世界不需要学习如何共存，只需要决定谁有资格留下。\n\n它把民族塑造成纯净的整体，把不同血统、文化与思想的人逐出共同体，再用服从证明忠诚。对这样的政权而言，妖怪天然就是必须消灭或奴役的异物；而在人类内部，也总会有人因为出生、信仰与身体不符合标准，被剥夺作为人的资格。\n\n白莲已经见过这种思想会把世界带向何处。它先要求人们憎恨陌生者，再不断缩小能够被称为同胞的范围，直到每个人都必须踩着另一个人，才能证明自己足够纯粹。\n\n面对这样的敌人，讲道不能代替抵抗。和平不是让屠刀拥有不受打扰的自由，慈悲也不能要求即将被杀的人先去理解刽子手。\n\n命莲寺将与所有愿意反抗的人并肩作战。不是为了证明妖怪比人类更高贵，而是为了让种族、血统与出身不再决定谁能够活在这个世界上。"

KYO_hijiri_everything_be_as_intented:"拒绝只容一种思想的世界"

KYO_hijiri_everything_be_as_intented_desc:"红色专制并不总是以仇恨异族的面貌出现。它更愿意声称，所有差异终将随着正确思想的胜利而消失。\n\n它可以接受人类，也可以接受妖怪，只要他们交出自己的判断，成为国家机器能够理解和使用的一部分。它赞美平等，却把不愿服从者逐出人民；它承诺未来，却把眼前的众生当成通往未来的材料。\n\n这正是白莲最不能接受的地方。共存不是允许不同生命暂时存在，直到它们被教育成相同的人。妖怪不必先放弃自身的来历，人类也不必把感情、信仰与疑问交给国家审查，才能获得共同生活的资格。\n\n白莲反对的不是工人追求平等的愿望，也不是人们改变旧社会的权利。她要终结的，是那个垄断平等、替所有人决定唯一道路，并用理想为压迫开脱的国家。\n\n若它仍要让千万种声音只剩下一种，命莲寺便会站在那些被迫沉默的人身边。"

KYO_hijiri_the_world_of_peace:"共存的新世界"

KYO_hijiri_the_world_of_peace_desc:"黑色专制将倒下，红色专制也将失去了支配众生的力量。一个以血统决定谁能存在，另一个以思想决定谁配被称作人民；它们用不同的旗帜，给出了同一个答案——只有相同者才能共同生活。\n\n白莲最终拒绝了这个答案。\n\n新的世界没有要求人类变成妖怪，也没有要求妖怪先学会扮演人类。城市仍会扩张，但必须为河流、山林以及依赖它们存续的生命留下空间；妖怪能够保存自己的形貌、能力与文化，却不能再以天性为理由伤害弱者；人类可以继续建设、发明与改变环境，却不再拥有替所有生命决定价值的特权。\n\n人与人之间仍会有谎言与背叛，妖怪与妖怪之间也不会从此相亲相爱。人有时会比妖怪更加可怖，妖怪也可能比人类更懂得仁慈。共同生活没有消灭这些矛盾，只是让种族不再成为伤害的许可，让力量不再自动带来支配他人的资格。\n\n学校里开始出现人类与妖怪共同学习的孩子。人类医生为妖怪诊治，妖怪工匠替人类修建房屋；山中的报纸仍会批评白莲留下的制度，地方也依旧会为资源、信仰与旧日恩怨争论不休。正因为这些声音没有被消灭，这个世界才没有成为另一座外表温和的牢笼。\n\n白莲没有让众生变得彼此相似。她所做的，是让相异者不再必须依靠驱逐、奴役与毁灭对方，才能获得自己的位置。\n\n这不是一个所有问题都已消失的净土。\n\n但众生终于能够带着各自的名字，生活在同一个世界。"





KYO_Seija_start:0 "下克上的胜利"
KYO_Seija_start_desc:0 "鬼人正邪不是为了坐上王座才掀翻旧秩序。她憎恶压迫、等级与所有把弱者踩在脚下的规矩，也始终警惕革命胜利后长出新的主人。\n\n如今，下克上已经赢得战场。接下来，她必须证明自己不只会摧毁旧世界，也有能力让底层真正站起来，并把革命推向一个不会再次背叛弱者的未来。"




 KYO_rebuild_the_broken_land:0 "修补破碎的国土"
 KYO_rebuild_the_broken_land_desc:0 "革命已经赢了，但赢下来的不是完整的国家，而是一片被炮火、仇恨与饥饿撕开的土地。正邪必须证明，下克上不只会推翻旧秩序，也能把倒塌的幻想乡重新接起来。"




 KYO_nue_question_of_society:0 "与鵺的相遇"
 KYO_nue_question_of_society_desc:0 "战后的夜比以前更安静，安静得像整片幻想乡都还没决定自己究竟是活下来了，还是只是暂时没死。正邪站在残破屋簷下，看见一道熟悉又令人烦躁的影子从黑里走出来。\n\n「妳居然还敢一个人站在外面。」封兽鵺歪著头，语气像在笑，又像在挑衅，「现在全幻想乡最容易挨刀的，不就是妳吗？」\n\n正邪没有退，只冷冷回了一句：「妳不是来杀我的。」\n\n鵺眨了眨眼，笑意更深了些。「是啊。我只是来看看，妳把桌子掀了之后，究竟知不知道接下来要把什么捡回来。」\n\n她没有替任何人把答案讲圆，只把最刺耳的问题扔到正邪面前：妖怪若离开恐惧，还能不能在社会中活下去？而社会若只把妖怪当成威胁，又是否永远只能靠压制维持秩序？\n\n正邪第一次没有立刻反驳。因为她知道，这不是鵺在故意找碴。这是鵺在问：妳的革命，究竟是要让妖怪活，还是只是让妖怪随著旧世界死去。"

 KYO_monsters_not_social_waste:0 "妖怪不是社会残渣"
 KYO_monsters_not_social_waste_desc:0 "鵺带正邪走过人里边缘、废神社、被烧空的旧仓和没人愿意靠近的湿地。那些地方曾经都是妖怪、半妖、怪异与各种不上不下的存在勉强栖身的角落。战争把它们打得更烂，却没有让它们比较不真实。\n\n「妳看。」鵺踩在断墙上，低头望著下面的人影与妖影。「旧秩序最擅长做的事，不是杀光谁，而是把谁塞进角落，然后假装那里什么都没有。」\n\n正邪沉默地看著那些被遗下的人与妖。她忽然明白，所谓『异类』，很多时候只是被主流社会判定为太麻烦、不稳定、难管理，所以干脆被扫出去的东西。\n\n「妖怪不是社会的残渣。」正邪终于开口，声音不大，却很硬。「是这个社会先决定不要我们，然后才说我们不配留在里面。」\n\n鵺看了她一眼，没有称赞，只淡淡说道：「很好。至少妳还没蠢到把人家丢在地上的话，当成天经地义。」\n\n这仍不是认同，更不是亲近；但正邪已经开始明白，鵺会靠过来，不是因为她温柔，而是因为她讨厌一切把异类扫进黑里、再假装世界干干净净的秩序。"

 KYO_live_by_fear:0 "只靠恐惧，还能活多久？"
 KYO_live_by_fear_desc:0 "「先别急著讲漂亮话。」鵺靠在墙边，眼神在夜里亮得发冷。「若把一切修饰都撕掉，妖怪以前不就是靠人类的恐惧活下来的吗？」\n\n正邪没有否认。她知道这句话有多难听，也知道它有多接近事实。只要人类仍会在夜里发抖、在门上贴符、在荒野绕路，妖怪就还能被记住、被承认、被保留下来。恐惧不高贵，却始终有效。\n\n「我知道。」正邪低声说，「在这个还满是偏见、敌意和旧秩序残骸的世界里，要是连最后一点敬畏都没了，妖怪会先一步被重新推回阴影。」\n\n鵺轻轻笑了一声。「所以呢？妳要不要承认，有些东西就是得让人怕？」\n\n正邪没有立刻回答。因为她也很清楚，若选择保留恐惧，妖怪或许还能活下去；但妖怪与人类之间，也将继续被彼此提防、彼此压迫的关系绑住。这条路走得通，却不会干净。\n\n她们第一次真正吵了起来。鵺不接受把妖怪说成能轻易被社会温柔容纳的东西；正邪也不愿承认革命最后只剩下让人继续害怕。两人谁都没有说服谁，却都被对方逼著看见了自己不愿正视的那一半。"

 KYO_claim_a_place_in_society:0 "让妖怪在社会中立足"
 KYO_claim_a_place_in_society_desc:0 "「可要是永远只靠惊吓活著，」正邪抬起头，看向鵺，「那妖怪就永远只能活在边上，永远只能当那个让人害怕、却不被承认的东西。」\n\n鵺安静了一瞬，没有打断她。\n\n正邪继续说了下去。她开始意识到，若妖怪只能靠惊吓、回避与禁忌来维持存在，那么妖怪就永远只能活在社会边缘，成为被恐惧、被排斥、却从未真正被承认的存在。这样的生存方式或许撑得过一时，却撑不过未来。\n\n「我不要人类施舍位置。」正邪的语气一点点沉下来，「也不要把妖怪驯成无害的摆设。我是要这个新社会承认——妖怪也有自己的位置、职责与生存权。」\n\n鵺看著她，半晌才低低地笑了。「这条路比让人类害怕还难走。因为妳不是在逼人闭嘴，妳是在逼整个社会重新长出一套骨头。」\n\n正邪没有退。她知道这条路不会比恐惧轻松，却可能让妖怪第一次不必只作为『被害怕之物』而存在。\n\n这一次，鵺没有再像前几日那样故意拆她的话。她仍然怀疑，仍然挑剔，却开始承认正邪不是只会把世界弄坏的人。正邪也第一次察觉，鵺的尖刻并不只是恶趣味；那更像一面镜子，专门照出她话里最容易松动、最容易自欺的地方。"

 KYO_acknowledged_not_tamed:0 "不同，不代表低人一等"
 KYO_acknowledged_not_tamed_desc:0 "那天夜里，正邪和鵺吵了很久。她们一个比一个嘴硬，一个比一个不肯让步。可吵到最后，反而有一件事越来越清楚——妖怪真正害怕的，从来不只是被消灭，而是被定义成『不正常』，再被顺理成章地赶出世界。\n\n「妖怪和人类当然不一样。」鵺先开了口，难得没有用戏谑的口气，「要是硬说一样，那只是另一种抹平。」\n\n正邪沉默了一会儿，才慢慢说道：「但不同，不代表低人一等；也不代表活下去的权利比较少。」\n\n妖怪拥有人类的情感，也拥有超出人类尺度的力量。她们不是人类的残缺版，也不是必须被修正的错误。妖怪可以与人类不同，却不该因为这份不同，就被剥夺存在、生活与发声的资格。\n\n鵺看著正邪，像是在重新确认什么。最后她只说了一句：「好。至少妳要的不是把我们洗干净，装进柜子里。」\n\n这句话让正邪罕见地安静了很久。因为她知道，对鵺这种正体不明的大妖怪而言，能说出这样一句话，已经近乎一种承认。她们依旧不同，也依旧会顶嘴，但她们已经不再把彼此的不同当成敌意本身。"

 KYO_charter_of_the_odd:0 "妖怪平等宣言起草书"
 KYO_charter_of_the_odd_desc:0 "思想若不写成条文，最后很容易只剩下几句热血话。正邪开始召集草根妖怪、半妖、怪异、流亡者与各地代表，准备起草一份真正能被执行的保障文本。\n\n鵺翻著那些初稿，嘴角带著一点不屑的笑。「宣言？条文？妳以前不是最讨厌这种东西吗？」\n\n「我现在还是讨厌。」正邪头也不抬地回道，「可如果不把它写下来，下一个坐在这位置上的人，很快就会说一切都不算数。」\n\n怪异不该只在流言与追捕中拥有名字。正邪政府将为妖怪、怪异、半妖与被社会排斥者建立最初的保障条文，让他们不再只能在排挤、退缩与躲藏中维持存在。\n\n鵺没有再笑。她只是把那份稿子放回桌上，语气罕见地平静：「妳最好真的打算让它生效。因为我们这种东西，一向最容易被写进纸里，又最快被从纸上划掉。」\n\n正邪抬眼看了她一会儿，忽然说道：「所以我才要妳留下来。」\n\n鵺挑了挑眉。「留下来做什么？」\n\n「盯著我。」正邪答得很直白，「要是我哪一天也开始把人写进纸里、再从纸上抹掉，妳就第一个把桌子掀回我头上。」\n\n那一瞬间，鵺没有立刻接话。她只是看著正邪，像第一次真正意识到，自己不只是在帮她找麻烦，而是正在成为这面新秩序里不可或缺的一面照妖镜。"

 KYO_commonwealth_of_outcasts:0 "妖怪的生存法则"
 KYO_commonwealth_of_outcasts_desc:0 "最初的起草书传到各地，原本零散的妖怪陆续来报自己能做什么。有人认得暗路，有人能修机器，也有人只要求别再被当成来历不明的东西赶走。治安、配给与工坊开始有了负责的人，争执则送到同一处协调。\n\n鵺站在高处看了一会儿，问正邪，给每个人排个位置就算安顿好了么。她指着下面一名等了很久的妖怪：对方答不出习惯使用的身份问题，轮到他时，登记的人又叫他往后站。\n\n正邪下去问明缘由，叫人先受理请求，再处理无法套进旧格式的部分。鵺跟过来，笑她才刚开始办事，已经学会把麻烦留在门外。\n\n「你看得这么清楚，就把还会卡住谁一起说出来。」正邪将纸推给她。\n\n鵺没有接，却又指出几项。正邪一条条回问，哪些该删，哪些只需换个问法。两人越说越不客气，登记的人站在旁边，直到听见结论，才敢重新落笔。\n\n那名妖怪办完没有道谢，先问以后还用不用从头解释。正邪让他留下凭据，遇到同样的问题就拿回来找自己。鵺在旁报了自己的名字，让登记者也记下。\n\n离开前，她提醒正邪，这张纸往后若不算数，自己会第一个拿出来。正邪把笔帽扣好，答她最好记牢。"

 KYO_koishi_open_the_unconscious:0 "恋，带我进去"
 KYO_koishi_open_the_unconscious_desc:0 "正邪第三次在屋里发现恋时，终于问她到底来做什么。恋坐在原本空着的椅子上，说这里很吵。窗外没有人，正邪放下手里的东西，等她解释。\n\n「有个你一直骂人。」恋说，「还有个你，趁那个停下来，又开始骂自己。」\n\n正邪叫她少胡说，恋却接着问，她刚才答应那件差事，是觉得应该做，还是不肯让人认为她做不到。正邪张口要答，想起自己还没看过差事的内容，便将原先压住的纸重新拿起来。\n\n恋伸手想碰，被她挡开。两人僵了一会儿，正邪问，她是不是能把那些连自己也不肯细想的念头找出来。恋说可以带她去看，至于回来后怎么说，仍由她自己决定。\n\n「那你呢？」正邪问，「你看过自己的没有？」\n\n恋的笑停了一下，手指碰到胸前闭着的眼睛，没有回答。正邪第一次没有趁这个空当挖苦她，只问进去之后，能不能让人一直待在身边。\n\n恋从椅子上下来，伸出手。正邪看了半天才握住，先警告她，别把人带进去就自己溜走。恋说，那她也得记得回头找自己。\n\n「行。恋，带我进去。」\n\n纸还摊在桌上。正邪把它压好，跟着恋走向那些平常被自己一句骂声盖过去的念头。"

 KYO_trial_in_the_unconscious:0 "无意识的审判"
 KYO_trial_in_the_unconscious_desc:0 "恋牵着正邪走进无意识，路很快断在身后。前面挤着许多张脸，赞美和骂声混在一起。正邪想回答其中一个，转头又听见另一个说，死去的人还在等她解释。\n\n最急的声音从脚下传来，催她动手，把眼前的一切砸开。另一个声音立刻替它接话，说这样才能让革命继续。更远处却有人笑她：天邪鬼本就该带来灾祸，还想扮成什么救人者。\n\n正邪听出那几句话都曾从自己嘴里说过。她越想争辩，声音便越多，仿佛每个解释都能替下一次破坏预先找好理由。\n\n她回身找恋，身后却空了。直到一只手从阴影里抓住她，她才看见对方也在发抖。恋问她，刚才是否根本没有察觉自己不见了。正邪原本要骂她乱跑，看清她的表情，又停住了。\n\n「你也怕？」她问。\n\n恋反问她怕不怕。正邪没有答，握住她的手。那些脸继续换着模样，有人等她发号施令，有人只想离她远些。恋几次想退进暗处，手却没有松开。\n\n正邪终于不再逐句反驳。她让其中一句责问说完，试着辨认被自己略过的是哪一段。恋留在旁边，听见自己的沉默也被问起时，低头看了看两人握着的手，没有再转身。"

 KYO_only_wanted_to_flip_the_table:0 "我只是想破坏"
 KYO_only_wanted_to_flip_the_table_desc:0 "正邪在无意识的深处，终于说出了那句她一直想拿来替自己辩护的话。\n\n「我只是想把桌子掀了。」她低声说，语气第一次不像挑衅，更像某种疲惫的坦白。「我看不惯那些家伙把一切说得理所当然，看不惯弱者永远得低头，看不惯高位者把秩序说成天经地义。我只是想破坏那张桌子，让它再也摆不回原来的样子。」\n\n这句话不是假的。恋知道，正邪的愤怒从来都不是凭空长出来的。她确实看过太多不公平，看过太多强者用冠冕堂皇的理由把别人压进泥里。她想破坏，不是因为单纯享受废墟，而是因为她比很多人都更早意识到——有些秩序坏到已经不值得修，只值得砸。\n\n可恋也没有顺着她说下去。\n\n「只是这样吗？」她轻轻问，语气很轻，却像针一样扎进来。\n\n正邪没有回答。\n\n因为她知道，这句话虽然是真的，却未必是全部的真相。可至少在这一刻，她终于肯承认：自己最初的冲动，确实不是统治，不是建设，也不是成为谁心目中的领袖。她最初只是想让那个从来没有给过弱者位置的世界，彻底失去站稳的资格。"

 KYO_also_wanted_the_high_seat:0 "我也想坐上高位"
 KYO_also_wanted_the_high_seat_desc:0 "正邪原本想继续把话藏下去。可在无意识的深处，很多平日能糊弄过去的说辞都会失效。恋只是静静站在那里，什么都没逼，可那份安静本身就像是在等一个无法再绕开的答案。\n\n于是正邪终于承认了另一件更难堪的事。\n\n「对。」她咬着牙说，「我也想坐上去。」\n\n那不是想当贵族，也不是想享受被人跪着仰望的滋味。更接近一种更深、更危险的欲望——她想要那个位置，想要那种能决定方向、决定秩序、决定谁再也不能把她踩回去的力量。她不是只想把王座砸烂，她也想亲手坐上去，证明自己终于有资格改写规则。\n\n恋没有笑她，也没有露出厌恶。她只是轻轻偏过头，像在看一个终于讲实话的人。\n\n「这也没什么奇怪的。」她说，「一直被丢在下面的人，怎么可能从来没想过站到上面去？」\n\n正邪沉默了很久。因为她第一次发现，最可怕的不是自己有这种念头，而是她过去一直把它藏在‘革命’后面，装作它从来不存在。\n\n而恋也在这一刻想起了自己。她封闭第三只眼，未必只是想逃离别人；也许更是因为她害怕看见自己心里那些并不纯净、并不无辜、并不如她平日表现得那样轻飘飘的欲望。她们谁都没有比谁高尚，只是都很擅长不去看。"

 KYO_face_the_self_that_loves_chaos:0 "直视那个迷恋混乱的自己"
 KYO_face_the_self_that_loves_chaos_desc:0 "正邪以为自己已经解释过那场暴动。粮仓本该打开，领主本该被赶走，跟随她的人也确实冲进了大门。可无意识中的火一熄，她又看见同一群人在灰里翻找没烧坏的粮袋。\n\n她想跳过这一段，脚却停在原地。\n\n「那时候我很高兴。」她终于说，「看见他们逃，看见房子倒，我还想让火再大一点。」\n\n说完，她盯着恋，等对方笑自己。恋却也没有笑。正邪看见她的身影渐渐淡下去，便一把抓住她的袖口，问她又要去哪里。恋答没什么地方，只是不想继续看。\n\n正邪本想说，有什么可怕的，话到了嘴边又吞回去。她自己刚才也在找能替那阵快意开脱的理由。革命里确有该打破的压迫，可她当时追着逃跑的领主，连身后的人还缺什么都没问。\n\n恋低头看着被抓住的袖子，问正邪若松手，还会不会记得她在这里。这个问题让正邪愣了一下。她一直嫌恋来去随意，直到此刻才发觉，对方也在等一个不能随便敷衍的回答。\n\n「你先别走。」她说，「我还没讲完。」\n\n她们继续看下去。正邪承认自己喜欢别人等着她发号施令，也喜欢一句话便能让人行动。恋则说，有些时候自己先消失，是不想等别人厌烦了才离开。她说得断断续续，正邪没有替她把话补齐。\n\n那些画面没有因此退去。正邪再看见烧毁的粮仓时，仍想骂领主，也仍记得火起时的畅快。她放下为自己辩护的手，蹲到翻找粮袋的人旁边，恋就在她身侧，没有再淡下去。"

 KYO_leader_must_be_watched:0 "看不见自己的危险"
 KYO_leader_must_be_watched_desc:0 "从无意识里回来，正邪听见部下说她比谁都清楚革命要往哪里去。她原本很受用，走过几步，又把人叫回来，问对方若觉得自己的命令错了，会怎样办。\n\n那人答，先请示。正邪问，若她不许再问呢，对方便不说话了。\n\n恋坐在旁边，看她来回踱步。正邪说，只要自己还记得那些事，应该就不会变成讨厌的家伙。恋却问她，以前下决定时，是否也觉得自己记得很清楚。\n\n正邪停下来。她确实曾把报复算进必须付出的代价，也曾将别人的欢呼当成对所有后果的同意。当时没有谁能让她停一停，她自己更不愿听。\n\n「那就得有人能拦。」她说。\n\n她开始整理质询、申诉和撤换负责人的办法，尤其注明不能因为提出异议便被撤掉口粮、差事或发言资格。涉及最高领袖的条款还空着，她盯了许久，没有用一句「自觉接受监督」填上去。\n\n恋起身要走，经过桌边，又指了指那块空白。正邪问她下次还来不来，她说来，至少要看那一条最后写成什么。\n\n门外仍有人等命令。正邪让他们进来，先念出尚未定稿的几项，叫每个人说说执行时会卡在哪里。最先回答的人声音很低，她忍住打断的冲动，让他说完。"

 KYO_bind_the_revolution_to_itself:0 "修订下克上革命纲领"
 KYO_bind_the_revolution_to_itself_desc:0 "正邪将旧纲领摊在桌上，读到有关领导者的段落时，停了笔。她从前喜欢把自己的决定说成群众的意志，如今再看，却想起无意识里那些质问自己的脸。谁代表谁，不能只由站在高处的人说了算。\n\n新稿开始写入公开账目、基层申诉、定期质询与罢免。写到最高领袖，她停了笔，想把范围留给以后的解释。恋坐在窗边，念出那句「所有负责人」，问她其中是否包括自己。\n\n正邪不耐烦地答当然。恋看着纸，说读这份纲领的人未必听得见她这一声回答。正邪骂了一句，将自己的名字补进条文，又写明，胜利、资历和拥护都不能免除追究。\n\n「这样总够了吧？」\n\n恋没有点头。她问，若提出申诉的人没有户籍，甚至很难让别人记住，该去找谁。正邪抬起头，看见她仍坐在那里，第三只眼闭着，声音却比刚才低了些。\n\n两人将那一条重新改过，给匿名、无户籍和无法被稳定辨认的人也留下申诉资格。有关报复申诉者的处置，正邪写得很重，写完又读了一遍，确认自己也不能例外。\n\n恋伸手在页角按下指印。正邪嫌她弄脏了纸，她便问，要不要擦掉。正邪看了看那一小块墨，最后只把旁边的字挪开，让它留着。\n\n稿子仍有需要修订的地方，恋却没有像往常那样中途消失。正邪拿来第二张纸，请她继续挑错。直到天色变暗，桌上才分出可以公布和仍待争论的两叠。签名那一页放在最上面，正邪将它翻给恋看过，才交出去抄写。"


 KYO_flandre_and_broken_blood:0 "芙兰朵露与坏血"
 KYO_flandre_and_broken_blood_desc:0 "芙兰朵露是带着骨灰罐来找正邪的。\n\n她站在废墟边缘，神情比过去安静得多，安静得几乎不像那位曾经让整座红魔馆都绷紧神经的灾厄之妹。她手里捧着一个小小的骨灰罐，里面装着蕾米莉亚留下来的灰。那不是遗物而已，更像她如今仍与旧世界相连的最后一根线。\n\n她原本是来寻仇的。因为在她眼里，姐姐确实是因这场战争、因正邪掀起的乱局而死。可真正动手时，她却无论如何都使不出自己的能力。那股曾经轻易就能捏碎万物的力量，像是在最后一刻被什么东西轻轻按住了。也许是命运，也许是创伤，也许是蕾米莉亚在死前，以最后一次操纵命运的力量，把妹妹硬生生推离了那条只剩毁灭的旧轨道。\n\n芙兰第一次愣住了。她忽然不知道自己到底在恨谁。恨正邪？恨战争？恨那个把姐姐带走、又把自己一个人留在这里的世界？\n\n正当她转身准备离开时，正邪叫住了她。\n\n「妳是谁？」\n\n那不是挑衅，也不是盘问，而像一把刀，直接切进她比仇恨更深的地方。\n\n芙兰没有立刻回答。因为她忽然发现，自己也想知道这件事。若姐姐已经死去，若斯卡雷特的城与过去一同崩塌，那么留下来的这个自己，究竟是谁？\n\n于是她没有离开。不是因为原谅，也不是因为投靠，而是因为她第一次想知道：当血与名字都不再能回答一切时，一个人还能如何继续活下去。"

 KYO_bloodline_is_not_absolution:0 "来自血脉的枷锁"
KYO_bloodline_is_not_absolution_desc:0 "芙兰抱着骨灰罐，问正邪是不是因为天邪鬼的本性，才总要和别人作对。正邪说她也很会把问题丢给名字，随后反问，过去弄坏的人和东西，是否全该算到斯卡雷特头上。\n\n芙兰立即护紧罐子，叫她别这样说姐姐。正邪没有道歉，只问：「我刚才问的是谁动的手。」\n\n屋里静了一会儿。芙兰看着自己的手，说那种力量一直都在，有时她确实控制不了。正邪答，危险可以说清楚，该防什么也可以一起想；可已经发生的事，不能换个称呼便当作与自己无关。\n\n「那月都呢？」芙兰抬头，「他们给你的事，你也全认？」\n\n正邪的脸色沉下去，手指在桌沿停了好一会儿。她在那座都城里活过，也一直被当成不合适的孩子；那些人怎样看她，并不能替她决定往后每一次动手的理由。她说得生硬，芙兰却一直听到最后。\n\n芙兰没有再问月都的事。芙兰只将骨灰罐放回桌上，再次摊开手，问若自己又控制不住该怎么办。正邪先问她以前怎样察觉，听到一半，还叫她别用「我本来就是这样」略过去。"

KYO_inherit_that_name:0 "来自月亮的那个名字"
KYO_inherit_that_name_desc:0 "有些名字不是自己选的，却会像影子一样跟著一辈子。\n\n随著芙兰留在身边，正邪也终于开始正面面对自己的那条血线。月之都、高洁、纯净、筛选、秩序、稀神探女——这些东西原本只是她脑海里模糊、冰冷、断裂的残影，如今却随著战后的重建与自我追问，一点一点压回她的面前。\n\n她其实并非从未属于那里。她曾在月之都活过，曾被母亲照料过，也曾在那片洁净到近乎残酷的土地上，隐约感受过自己与周围格格不入。只是那些记忆像被雾复住，只剩下一种模糊而尖锐的感觉：她从那里来，也曾被那里拒绝。\n\n正邪开始意识到，自己之所以如此厌恶那些高高在上的体系，也许不只是因为她看见了压迫，更因为她身上本来就流著那套体系的一部分。那是来自月亮的名字，是别人替她决定好的来源，也是她一直想否认、却又无法真正切断的证明。\n\n芙兰安静地听著。她比谁都懂这种感觉。斯卡雷特这名字对她来说，既是家，也是牢笼；既是保护，也是别人永远先替她决定的命运。于是她没有嘲笑正邪，反而第一次认真地问她：「如果妳身上真的有那样的血，妳打算怎么办？」\n\n这个问题让正邪沉默了很久。\n\n因为继承一个名字，不一定是屈服。有时候，把那个名字看清楚、承认它在自己体内、再决定如何使用它，本身就是另一种夺回主动的方式。她未必要继续替月之都而活，却必须先承认，那道影子确实曾经是自己的一部分。"

KYO_betray_that_name:0 "来自地球的那个名字"
KYO_betray_that_name_desc:0 "芙兰问正邪，既然在月都生活过，为何不回去。正邪说那里早就给自己留好了位置：不够纯净、不合规矩，随时可以被送走。她还没弄清所有旧事，却不打算等那座都城重新点头，才决定自己该站在哪里。\n\n门外有人催她去看工坊的争执。正邪答了一声，仍把话说完：「我在这里挨过饿，和他们一起跑过，也被他们骂过。月都若只认血，那就让它认去。」\n\n芙兰问，这样是否等于背叛自己的来处。正邪看向她抱着的骨灰罐，反问她，姐姐若还在，会不会准许自己到这里。芙兰没有回答，手却松了一点。\n\n「那你还是来了。」正邪说。\n\n她披上外衣，准备出门。芙兰跟到门边，问自己是否也能这样。正邪没有替她选，只让她想好，留下要做什么，离开又准备去哪里。\n\n芙兰站了一会儿，最终把骨灰罐放回房里，随她去看那场争执。一路上有人叫正邪的名字，她回得很响，连最不客气的那一声也没有装作没听见。"

KYO_child_of_moon_enemy_of_earth:0 "月球的子嗣，地球的子民"
KYO_child_of_moon_enemy_of_earth_desc:0 "血脉与归属，终于在这一刻被摆到同一张桌上。\n\n正邪不得不承认，自己体内确实流著来自月亮的一部分。那是她无法抹消的来源，是她出生时就被写进去的事实。更残酷的是，她并非只是听说过月之都；她曾经真的在那里生活过，曾经被母亲照料，也曾经在那套以纯净为名的秩序下，被悄悄判定为不该留下来的人。\n\n她对月亮的记忆残缺不全，只剩下一些模糊片段：高洁得令人窒息的街道、始终隔著一层距离的目光、还有被抛下的错觉。她一直以为，是母亲把她流放到地球；可即便真相尚未完全揭开，她也已经能感受到，那段被抹去的过去并不只是单纯的抛弃。\n\n芙兰也跟著开始重新理解「物种」与「出身」这件事。吸血鬼、人类、妖怪、月人、天邪鬼——这些词本该像边界一样把人隔开，可现在她却在正邪身上看见另一件事：一个人可以同时属于某种血脉，又拒绝服从那条血脉替自己写好的方向。\n\n于是正邪终于说出了她最清楚的答案：她可以是月球的子嗣，却只愿做地球的子民。她不会否认自己的来源，但她也绝不接受让来源替她决定忠诚、立场与未来。\n\n这是芙兰第一次真正被触动。因为她忽然也想问自己：如果我生来是吸血鬼，是斯卡雷特，那么我能不能同样选择，成为某个不只由血定义的新自己？"

KYO_drag_the_family_name_from_the_throne:0 "自己是自己"
KYO_drag_the_family_name_from_the_throne_desc:0 "正邪问芙兰想做什么，她先答，姐姐以前说过——话说到这里，便被打断了。\n\n「我问你。」\n\n芙兰抱着骨灰罐，半天没有接话。她记得姐姐希望怎样，也记得旁人认为斯卡雷特家的妹妹会怎样，轮到自己说，能想到的竟仍是这些。\n\n正邪没有催，只等她把罐子放稳。芙兰终于说，想先去看看自己没去过的地方，也想试着做几件不会一弄坏就被人赶回房里的事。她说得很迟疑，随后又问这样会不会把姐姐忘掉。\n\n「你不是连她的骂声都记得？」正邪答。\n\n芙兰有些生气，却也笑了一下。她还用原来的姓氏，仍会在夜里想姐姐，没有哪一样非得先丢掉。只是下一次有人问她去哪里，她想自己答。\n\n她拿出纸，把刚才说的事写下几件。正邪看见第一行又写着「姐姐会喜欢」，伸指点了一下。芙兰护住纸，没有立刻删，只在旁边添上：我也想试。"

KYO_belonging_beyond_blood:0 "旧神与新血"
KYO_belonging_beyond_blood_desc:0 "芙兰把骨灰罐移到窗边，腾出桌面，摊开自己写了一半的纸。以前有人来，她总先将罐子抱起来；这一次，她看见正邪站在门口，只问对方有没有多余的笔。\n\n正邪递过去，顺口问她在写什么。芙兰说，是往后想自己做的事，暂时还没排好。写完一句，她又回头望向骨灰罐，问姐姐会不会嫌这些打算太小。\n\n「嫌就嫌。」正邪答，「做的人又不在那里。」\n\n芙兰瞪了她一眼，却没有收起纸。她仍会想姐姐，听见斯卡雷特这个名字也会回头；只是窗边放着骨灰，并没有妨碍她继续写下今天的决定。\n\n正邪看着那一页，也想起自己曾在月都度过的日子。她仍记得被送走，记得始终容不进去的位置。至于更早发生过什么，记忆总在关键处断开。她不愿再拿猜测填满那些空白，又还没办法相信，事情能有另一种解释。\n\n芙兰问她在想谁。她答母亲，随后便不再往下说。对方没有追问，只把借来的笔还到她手里，留下纸，准备出门。\n\n「罐子呢？」正邪问。\n\n「回来再陪她。」\n\n芙兰走了几步，又返身确认窗扣好没有。正邪等她检查完，两人一道离开。月都的旧事仍未查清，姐姐也不会回来替妹妹决定；走到岔路时，她们先争了一下今天该往哪边去，最后照芙兰刚才写在纸上的安排走。"

 KYO_three_lessons_before_rule:0 "统治之前的三道伤痕"
 KYO_three_lessons_before_rule_desc:0 "下一轮议事前，正邪将三份尚未办妥的事摆在面前。身份无法登记的人还在等，领袖受监督的条款需要落实，芙兰也问过，往后分配住处会不会先看姓氏。她原以为经过那些争论，自己已经说得够清楚，事情却仍得一件件办。\n\n鵺进门便拿起第一份，指出之前改过的办法还没有传到所有地方。恋坐在旁边，问负责传达的人若说忘了，谁来追究。芙兰则把自己的请求拿回来，划掉替她填上的「服从安排」，坚持先知道要去哪里。\n\n正邪听得不耐烦，敲了一下桌子。三人都看着她，她想起自己曾在无意识里多么喜欢这种安静，便收回手，叫鵺继续说。\n\n会议一直开到该吃饭的时候。有人问旧有的办法还要不要暂用，正邪逐项决定，能改的先改，不能当场解决的留下负责人和期限。她也领了一份，要去处理迟迟没人肯接的申诉。\n\n散会时，鵺带走修订稿，恋提醒正邪别忘自己的差事，芙兰把请求收好。门外已有下一批人等着，正邪挪开空杯，让他们进来坐。"

 KYO_grassroots_worksite:0 "把图纸摊在泥地上"
KYO_grassroots_worksite_desc:0 "正邪没有把草根妖怪三人叫进什么像样的办公室。她把赤蛮奇、今泉影狼与若鹭姬叫来的地方，是一处还残留着焦痕、木板没补齐、地上尽是泥水与碎石的旧仓边。她就站在那里，把图纸摊开，把未来也摊开。\n\n赤蛮奇最先皱起眉。她不相信这种听起来太大的计划，尤其不相信一个刚打完仗的政权，忽然开始谈什么秩序、工地、供给与生产。今泉影狼则更直接，她只问一句：这东西能不能真的让大家少挨饿、少冻死。若鹭姬没有立刻反对，只是安静地看着正邪，像在等她把最关键的那句话说出来——这套计划，到底是为了让大家活得更好，还是只是为了把底层再编进另一套命令里。\n\n正邪没有回避。她讲得很直：这不是为了好看，也不是为了替新政权刷一层漂亮油漆。她要的是把妖怪从只能靠天性、运气与低头活下去的日子里硬拉出来。先让粮食能稳，物资能到，工具能造，秩序能稳定，再让每个人不必为了活着去求谁施舍。\n\n这番话没有立刻换来认同。可当误会一点一点被划开，三人都开始明白，正邪这次不是在煽动谁去掀桌，而是真想把桌子搭起来——而且是替那些从来没资格坐上桌的人搭起来。"

KYO_raise_the_broken_umbrella:0 "让被丢掉的东西重新开工"
KYO_raise_the_broken_umbrella_desc:0 "第一步，是把那些曾被当成废物的东西重新叫回来。多多良小伞被正邪亲自找上门时，先是愣了一下，接着露出那种既开心又有点不敢信的表情。毕竟过去大多数人想到她，只会想到惊吓、恶作剧，或者一把没人要的旧伞；很少有人会认真问她，愿不愿意替这个新社会出力。\n\n正邪给出的答案很简单：既然幻想乡里有那么多器物都能觉醒成付丧神，那就不该让它们继续躺在仓库、角落与垃圾堆里发霉。旧伞、旧琴、旧鼓、旧刀、旧车、旧锅，全都可以重新站起来，重新进入工坊、物流、街巷与生产。被丢掉的东西，不代表只能烂掉；被忘掉的存在，也不代表没有价值。\n\n小伞听完之后没有立刻答应，她只是低头看着自己那把伞，像也在看自己。最后她抬起头，笑得很用力：若这世界终于肯让被丢掉的东西也有位置，那她当然愿意去替它撑第一把伞。\n\n从这一天开始，付丧神不再只是怪谈与边角角色。她们将重新被编进社会的骨架里，让那些被遗弃之物，成为重建幻想乡最早重新转动的齿轮。"

KYO_seize_old_order_storehouses:0 "把粮仓的钥匙收归公有"
KYO_seize_old_order_storehouses_desc:0 "粮食问题，不能靠口号解决。正邪与草根妖怪们很快就摸清楚，战后真正最危险的，不是田里完全没有粮，而是许多旧势力、地方豪强与战时商人，把能活命的东西锁进了仓里，等着局势更乱、价格更高，再拿出来卖命。\n\n于是，一条毫不温和的路被摆上桌面：接管旧粮仓，清点囤积，统一运输，统一定价，统一配发。赤蛮奇对这套做法并不感到意外，她太清楚乱世里总有人拿别人的肚子发财；今泉影狼也赞成，因为饿着肚子的人撑不到明天，讲什么程序都没有意义。若鹭姬则把话说得更重：若要把这些东西收归公有，就必须让所有人都看见账册、看见流向、看见谁先领、谁后领，否则这不过是把旧掠夺换个名字继续做下去。\n\n正邪最终拍板：粮仓不是私产，而是所有人能不能熬过这个冬天的分界线。旧秩序既然把活命的东西锁起来，那新秩序就亲手把锁砸开，把钥匙从豪强手里夺走，再交给国家与配给体系。\n\n这不是仁慈，而是止血。至少从这一刻起，粮食不再躺在账本与仓单里，而要流进锅里、军需里和每一个还能继续活下去的夜晚里。"

KYO_build_local_mutual_aid_workshops:0 "把土地还给种它的人"
KYO_build_local_mutual_aid_workshops_desc:0 "有人提出另一条更慢、也更顽固的路：不要把一切都先收进中央，再由上面往下发；而是把土地、工坊、种子、工具与旧仓直接交回地方，交到真正耕作、搬运、修补与生产的人手里，让各地自己先活起来。\n\n这条路线不像集中统制那样见效迅速，也更难保持整齐。赤蛮奇却反而更愿意支持，因为她本能地怀疑任何过度集中的分配体系；若所有命脉都握在上面，底层迟早又会被别人决定该怎么活。若鹭姬也认同这点，她更相信真正能让人安心的，不只是今天领到一碗粮，而是明天仍有自己的田能种、有自己的工坊能开、有自己的手能把生活一点点做回来。今泉影狼最关心的还是实际问题：只要田真的有人种、工坊真的能出东西、大家真的不会再饿回去，她不在乎这面旗挂在中央还是地方。\n\n于是，新的政策开始成形：没收荒废庄园与旧豪强土地，重新分配给耕作者与地方共同体；把工坊留在街巷，把修补、加工、配给与基础生产留在基层；让村落、街区与互助组织自己决定该先修什么、先种什么、先救什么。不是等别人把活路送下来，而是让活路从脚下长出来。\n\n这条路的意思同样清楚：新社会若真要站住，就不能只有中央有力气。土地要回到耕作者手里，工坊要留在街巷里，地方自己也得学会呼吸、生产与决定自己的明天。"

KYO_tsukumogami_production_committees:0 "工会与百器生产委员会"
KYO_tsukumogami_production_committees_desc:0 "无论选择的是把粮仓钥匙收归公有，还是把土地与工坊交还给地方与耕作者，最后都得面对同一个问题：谁来执行，谁来监督，谁来保证这不是一阵风，也不是下一批人换个名目继续占走一切。\n\n于是正邪决定把前面的零散力量真正编成制度。草根妖怪负责把基层声音拉进来，付丧神负责生产、维修与调度，地方代表、工匠、运输者、耕作者与配给人员，则被统一纳入新的工会与百器生产委员会体系。若国家先接管仓储与粮道，这套体系便负责清点、运送、配发与稽核，让收归公有不至于沦为空白账目；若地方先接回土地与工坊，这套体系便负责协调产量、互通余缺、稳定价格与保障工坊运转，让基层自治不至于碎成各自为政。\n\n赤蛮奇最在意的是监督。她要求委员会不能只是另一套高高在上的名单，不然今天砸掉的门，明天只会换一把新的锁。今泉影狼在意的是效率，她不要听什么漂亮道理，她只要这些机构真的能把粮、工具、材料与人手送到该去的地方。若鹭姬则始终盯着另一件事——让底层有说话的位置，而不是只被登记、被安排、被命令；不管这套体系挂的是国家配给的牌子，还是地方互助的牌子，都一样。\n\n正邪接受了这些条件。她很清楚，若这场重建最终只是换一批人坐进办公室，那它很快就会变成自己最讨厌的样子。工会与委员会的意义，不只是提高产能，更是把执行权、争论权与纠错权留在社会内部，让集中统制不会滑成新的垄断，也让地方自治不会散成无力的碎片。\n\n从这一刻起，粮仓不再只是仓库，工坊不再只是作坊，付丧神也不再只是被遗忘的旧物。百器、众手、街巷、田地与运输线，终于被编进同一副骨架里。革命开始长出筋络，而幻想乡的重建，也第一次像一台真正能转起来的机器。"

KYO_rebuild_from_the_bottom_up:0 "重建所谓的家园"
KYO_rebuild_from_the_bottom_up_desc:0 "重建图纸摊开时，赤蛮奇先问，新住宅为何离配给点那么远。影狼接着指出一条路，每逢下雨就会积泥；若鹭姬则沿河岸比了比，要求把水边聚落也接上运输安排。\n\n正邪把原先照旧街区画的那一角划掉，请绘图的人重新估算。粮仓、地方工坊和委员会已经开始运作，接下来得把各处连起来。住宅建在哪里，材料从哪里运，谁每天得走最长的路，不能只照空地够不够大来决定。\n\n三人说得比早先更具体。赤蛮奇知道哪一处开始供粮，影狼去过工地，若鹭姬也见过沿水路送来的货。她们仍争执，却不再只问这份计划究竟会不会实行。\n\n旧城区要整理，工坊带要恢复，道路与配给点也需重新分布。有管事想先修宽阔的正街，好让地方早些像样，正邪让他到后排棚屋走一趟，再来解释那里的居民该怎样把东西搬回家。\n\n最后定下的施工次序，从最难通行、最缺住处的几片地方开始。图纸发下去后，正邪让草根三人继续核对，有画得漂亮却走不通的，直接带回来改。影狼卷起那张沾着泥指印的纸，说自己明天就带人去看。"

KYO_books_stolen_from_humans:0 "来自人类的书籍"
KYO_books_stolen_from_humans_desc:0 "革命赢了战场，却还没有赢下明天。正邪很快就明白，只靠怒火、直觉与一时的勇气，撑不起一个新国家，更撑不起一个想活得比旧世界更久的革命政权。于是她命人从旧官署、私宅书房、学校废墟与被抄没的仓库里，把那些属于人类的书一本本搬回来：讲国家的，讲组织的，讲工会的，讲议会的，讲革命如何壮大，也讲革命如何腐坏。\n\n鵺对这些书最先露出不屑。她说人类最擅长的，就是把活人写进纸里，再拿纸来压活人。恋却只是蹲在书堆边，翻着那些发黄的页角，像在听什么别人听不见的声音。她轻轻提醒正邪：别太快爱上这些词，因为词也会骗人。芙兰则抱着骨灰罐站在一旁，看着那些书页里的名字、党章、制度与头衔，忽然问了一句：『人类是不是也很喜欢用名字把自己锁起来？』\n\n正邪没有反驳。她只是把书摊开，一页页看下去。她不喜欢其中很多东西，不喜欢那些自以为理解一切的口气，不喜欢那些把群众、组织与历史说得像公式一样的人。可她更不喜欢另一件事：若自己连这些都不懂，那她就只会重复旧世界最熟悉的那种命运——把一场反抗，活活耗成一堆口号。"

KYO_rosa_and_trotsky_on_the_table:0 "罗莎与托洛斯基"
KYO_rosa_and_trotsky_on_the_table_desc:0 "最后被正邪长久摊在桌上的，是两种彼此纠缠、也彼此刺痛的声音。罗莎·卢森堡提醒她，若革命离开群众，若党开始窒息工人、乡村与底层本身的活力，那么所谓解放，很快就会变成另一种代管。托洛斯基则不断逼问另一件事：若革命停在边界内，停在战后整顿的满足感里，停在一时的胜利中，它就会被旧世界一点点包围、磨碎、反扑回来。\n\n这两种声音很快让屋里吵了起来。鵺最先对着书页冷笑，她讨厌一切会长出新高墙的组织，也讨厌那种把群众说得很好听、结果转头就把人关进纪律里的嘴。恋则像在听正邪心里的回音，她看得很清楚：正邪一边相信群众，一边又害怕群众太散；一边厌恶权力集中，一边又知道没有骨架的革命会碎成满地残火。芙兰安静地坐着，手指轻轻敲着骨灰罐。她比谁都敏感于『被谁代表』『被谁保护』这种话，因为她太清楚，那往往也是控制开始的地方。\n\n就在这样的争执里，正邪第一次开始理解：政党不是一群人把旗子举高就会自己长出来的东西。它诞生在分歧里，诞生在互相拆台、互相怀疑、互相逼问之中。真正困难的，不是找到一套最漂亮的理论，而是承认革命本来就会在群众与组织、自由与纪律、眼前与远方之间不断拉扯。"

KYO_masses_before_party:0 "群众先于党"
KYO_masses_before_party_desc:0 "当争论走到最锋利的地方时，正邪决定先把重心压回底层。她不愿让革命一赢就立刻变成办公室、印章与指令的世界。若没有街巷里的互助，没有工坊里的工人，没有村落、草根妖怪与人类底层自己站出来的力量，那么所谓政党也不过是新壳里的旧骨头。\n\n于是新组织的雏形，被刻意从下面往上长出来。地方支部、工人小组、村落会议、草根妖怪的互助网络，被一层层接进同一张网里。代表可以被推举，也可以被撤换；上层可以提出方向，却不能把群众当成只会鼓掌和领命的影子。鵺对这种做法第一次没有泼冷水，因为至少这意味着新秩序不是先学会管人，而是先学会听人。若鹭姬与草根妖怪们的支持也在这一刻真正稳了下来，因为她们终于看见，自己的声音不是装饰。\n\n恋却仍旧提醒正邪：别把『群众』也当成另一个神像。群众不会天然正确，群众也会盲、会怒、会跟着风走。正邪听见了，却还是选择先把革命的正当性放回底层。因为她知道，一旦这一步不走，后面的党就只会越来越像机械，而不会像活着的共同体。"

KYO_party_must_command:0 "党必须能指挥"
KYO_party_must_command_desc:0 "同一批运输车接到两处相反的要求，停在路口等了半日。粮道、军需与工地各有急用，谁也不肯先让。消息送来时，正邪把几份命令摊开，问究竟由谁作最后决定，得到的仍是各部门的理由。\n\n她决定保留一条能够贯彻的指挥链。中央委员会统筹调动，纪律机关追查拒不执行的责任，干部接受训练，基层按明确的层级回报。争议可以提出，已经定下的命令却不能由每个经手者自行改写。\n\n鵺问，若发错命令的人就在中央，下面还敢不敢说。恋也指出，正邪刚才显然很喜欢一句话便让所有人停下争论的感觉。她没有否认，只叫她们把该留的质询与纠错程序写进去。\n\n芙兰望着那些文件，问被调去的人能不能先知道自己要做什么。正邪让命令同时说明任务、期限和负责者，不准只凭一句服从便层层摊派。\n\n最终通过的方案仍将指挥权集中起来。鵺对纪律机关尤其不放心，要求今后继续查看它怎样办事。正邪答应接受追问，随即把运输次序定下，派人去路口传令。她知道这个决定不会让所有人满意，但那些车必须先动起来。"

KYO_debate_is_not_treachery:0 "争论不是背叛"
KYO_debate_is_not_treachery_desc:0 "无论先把重心压回群众，还是先把指挥链立起来，最后都绕不过同一个危险：组织一旦害怕争论，就会越来越只会惩罚；领袖一旦把不同意见看成敌意，革命就会开始吞噬自己的人。\n\n这正是正邪最不愿看到的结局。她太清楚自己也会自欺，也会被胜利、愤怒与必要性慢慢说服。恋更是不断把这件事翻出来——她不容许正邪把『为了革命』这句话讲得太顺，因为只要讲顺了，它就会变成最会骗人的麻药。鵺则从另一边逼她：若连内部都不能说真话，那新党和旧体制又有什么差别？芙兰安静地看着这些争执，像看着一群人终于不再把分歧当成必须立刻抹除的污点。\n\n于是，正邪做了一个很现代、也很危险的决定。她把争论留下来。党内批评、少数意见、路线争执、基层对上层的质问，第一次被明确写进组织原则。不同意见不再自动等于叛徒，不服从也不再能被一句『动摇大局』轻易盖过去。不是为了纵容混乱，而是因为她终于承认：一个不准人开口的革命，最后只会剩下领袖一个人的回声。"

KYO_provisional_program_of_reversal:0 "下克上临时纲领"
KYO_provisional_program_of_reversal_desc:0 "下克上临时纲领付印前，正邪又开了一次会。地方代表带来配给与土地的意见，工会要求写清工坊事务如何参与，干部则催促确定中央能够直接调动哪些资源。稿纸在桌上转了一圈，添满了批注。\n\n先前写下的领袖监督仍须保留，现在还得补上日常怎么运作。党部与基层组织怎样联系，中央和地方各管哪一段，工业建设先给哪里，纠纷到何处申诉，都要有人接手。正邪不许再用一句「酌情办理」打发最有争议的部分。\n\n鵺指出，若审查的人都由被申诉者挑选，这一条就等于白写。恋翻到领袖的责任，确认自己的指印所作证的约束还在。芙兰则问，分配住处与工作时，能否因为姓氏、物种或出身，把某些人先排到后面。会议为这些问题又延长了一晚。\n\n第二天送去抄印的稿子，留下了修订程序和未决事项的处理办法。正邪要求各地公布，收回执行中的异议，再集中讨论；没人能把「临时」解释成随时不认账，也不能把这一版当成永远不准改的命令。\n\n散会后，几名代表仍围着地图争一条运输线。正邪把已经签好的纲领递出去，自己留在原处。文件得送到各支部，眼前这条路也得有人先安排好。"


KYO_reconstruction_and_revolutionary_order:0 "废墟之上的新秩序"
KYO_reconstruction_and_revolutionary_order_desc:0 "粮仓终于按新的配给办法开门，地方工坊也开始接到连续的订单。过去被赶出会场的草根妖怪，如今带着本地的缺粮数目回来争论；付丧神在百器生产线上工作，要求将自己的报酬和使用材料分开核算。\n\n正邪走过修好的街口，看见路旁仍堆着没运走的瓦砾。她问为何停工，管事说车去送粮了。旧日她会先骂办事太慢，这次却跟着去看交接，才发现两处配给点都在等同一辆车。\n\n地方代表将这个问题带到会上，工会又提出工坊需要的运力，争到夜里才排出能走的顺序。正邪批准调整，要求下次把缺口早些报上来。有人当面抱怨她前一份命令催得太急，她听完，让对方将具体耽误的地方说清。\n\n重分土地的纠纷还没结清，新住宅也未盖完，但已经有人搬进修好的屋子，按时去工地和工坊领活。委员会从各处送来的请求，逐渐有了回复；办不成的，也得指出缺谁、缺什么，不能只叫人继续等。\n\n夜里，一条新接上的生产线开始试车，声音吵得邻近住户出来理论。工坊的人原想让他们体谅，被正邪叫住。她听完两边，将作业时间留给代表再谈，先要求把今晚能停的机器停下。\n\n吵声很久才散。正邪离开时，看见那辆送粮的车终于驶回来，车夫正与工地核对明早的路程。她抬手让车先过，站在路边等了片刻，才继续向前。"

 KYO_count_ruins_and_empty_homes:0 "从月都逃来的警告"

 KYO_count_ruins_and_empty_homes_desc:0 "幻想乡刚刚恢复基本秩序，来自地球各地的报告却开始出现相同迹象：身份不明的月面舰艇降落在军事基地附近，部分政府突然接受陌生顾问，军队与资源调度也逐渐转入一套不属于地上的指挥体系。\n\n稀神探女正是在此时来到幻想乡。她没有携带月都使节的标志，也没有要求任何迎接仪式。因为她不是奉命前来的使者，而是一名带着机密离开月都的叛离者。\n\n探女交出的文件包括月军部署、占领区行政方案、地球合作政府名单，以及月都对各国提出的臣服条件。月人的行动早已开始，幻想乡只是尚未被正式写进计划表中的下一处目标。\n\n正邪看见探女时，记忆仍是一片空白，身体却先一步认出了她。那份熟悉没有换来拥抱，只有一句压着怒意的问题：『你到底是谁？』\n\n探女没有立即回答。眼前更迫切的事情，是让正邪明白——月都已经把手伸向地球，而留给地上生命准备反抗的时间正在迅速减少。"


 KYO_food_shelter_and_routes:0 "地球将成为月都的属领"

 KYO_food_shelter_and_routes_desc:0 "月都并不打算摧毁地球。城市、工厂、农田、道路与人口都是可以利用的资产；一颗仍在生产、服从并缴纳资源的星球，远比一片死寂废墟更有价值。\n\n按照探女带来的占领方案，愿意臣服的政府可以继续存在，原有统治者也能保留头衔。作为交换，外交、军备、工业与关键资源必须接受月面官员监督，地方军队则会被改编为协助月军维持统治的附属部队。\n\n月人将成为凌驾地球之上的统治阶层，月兔继续充当士兵、劳工与执行者，地上的人类与妖怪则被归入最低等级的臣民。她们可以生活、生产，甚至保留部分文化，只要永远承认月都拥有最终裁决权。\n\n这套制度最危险之处，正是它不需要每天进行屠杀。它会借用旧政府、既有官僚与地方权贵，让地球在看似照常运转的情况下，一点点失去决定自身未来的资格。\n\n正邪读完计划后反而笑了。月都不过是把地上早已存在的高低秩序延伸到了星球之间。既然月人执意把整个地球踩在下面，那么地球上的所有低阶生命，便有理由发动有史以来最大的一场下克上。"


 KYO_human_village_is_not_a_colony:0 "被遗忘才得以生还"

 KYO_human_village_is_not_a_colony_desc:0 "探女带来的月都档案，也迫使她说出另一件隐藏多年的事实。正邪并非单纯拥有月人的血统；她曾经在月之都生活，也曾经是探女亲手照料的女儿。\n\n月都愿意利用地上的低阶生命，却绝不允许所谓的污秽混入自身血脉。正邪出生后没有符合月都对纯净、稳定与血统的要求。等待她的不是降级或流放，而是一场不会被写进公开纪录的处决。\n\n为了阻止这项决定，探女动用了自己的能力。她让相关者忘记正邪的存在，也抹去了正邪对月都与母亲的记忆，随后趁着计划尚未重新形成，将她秘密送往地球。\n\n正邪一直以为自己遭到抛弃。如今她才知道，自己之所以会忘记母亲，正是因为母亲希望她能够活下去。那段空白不是漠不关心留下的伤口，而是一场拯救必须付出的代价。\n\n真相没有让两人立即和解。探女确实救了她，却也替她决定了必须遗忘什么、必须在哪里长大。正邪承认自己得到了一条活路，也保留追问与愤怒的权利。\n\n至少从这一天起，她终于知道真正抛弃自己的并不是某一个母亲，而是那套连孩子是否有资格活着，都要按照血统与纯净加以裁决的月面秩序。"


 KYO_youkai_are_not_new_nobility:0 "从梦中穿过封锁"

 KYO_youkai_are_not_new_nobility_desc:0 "月军能够封闭道路、监听电台、检查信件，也能命令合作政府逮捕任何试图联络外界的人。但无论占领制度多么严密，它们都无法命令地球与月都的每一个生命停止做梦。\n\n哆来咪·苏伊特向正邪展示了一条不存在于现实地图上的道路。那是由无数梦境彼此接触形成的隐秘网络，可以避开地上的检查站，将口令、警告与简单情报送入遭到占领的地区。\n\n这套网络不仅连接幻想乡与地球抵抗组织，也将接触那些对月都等级制度不满的月兔。她们长期替月人作战、劳动并执行命令，却从未真正成为那座高洁都城的主人。只要有人让她们知道服从并非唯一选择，月都内部便可能出现第一道裂缝。\n\n哆来咪负责开辟梦境路径，探女提供月军警戒与轮调情报，正邪则要求每条线路都必须配备现实中的联络人、替代口令与备用传递方式。梦境可以越过封锁，却不能成为只能依赖一个人的奇迹。\n\n第一条消息很快沿着梦境送出：地球仍在抵抗，幻想乡尚未屈服，而月兔也不必永远替高位者握枪。\n\n在月都看不见的地方，一张属于低阶生命的地下联络网开始成形。"


 KYO_provisional_council_of_gensokyo:0 "最后的下克上"
 KYO_provisional_council_of_gensokyo_desc:0 "月人的军队已经侵入地球。它们夺取战略要地，迫使战败国家签署服从条款，再让月都派出的官员接管当地军队与政府。愿意合作的统治者可以保留位置，前提是承认地球从此属于月都的支配范围。\n\n在月人眼中，地上生命可以劳动、纳贡、服役，却没有决定自身未来的资格。只要这场征服继续推进，人类与妖怪终将成为月都统治下的低阶臣民，幻想乡也会被困在一个完全由月人控制的世界之中。\n\n稀神探女确认，入侵绝不会停在几处占领区。月都已经准备好新的行政体系，只等地球各国逐一屈服。正邪听完之后，当夜便下令动员军队、扩充生产、联络各地抵抗力量，并向入侵地球的月人正式宣战。\n\n她无意替旧世界的王座卖命，却更不会容许一群来自月亮的贵族坐到全地球头上。月人既然把地上众生称作低阶生命，正邪便要率领这些低阶生命，完成一场跨越地月的下克上。\n\n即使她成为世上最后一名仍敢反抗月都的人，这场战争也不会停止。"


 KYO_names_in_lunar_archives:0 "幻想乡紧急议会"
 KYO_names_in_lunar_archives_desc:0 "对月宣战以后，幻想乡紧急议会随即召开。稀神探女在地图上逐一标出月军的登陆区域、运输节点与物资集散地。敌人的占领范围仍在扩大，一场规模空前的长期战争已经无法避免。\n\n正邪要求幻想乡立即转入战时非常时期。军工、能源、铁路、仓储与大型工坊由紧急议会统一管理；粮食和重要原料实行集中征收，生活必需品按照定额配给；各地库存、生产数字与运输能力必须每日汇总，再依照战场需要重新分配。\n\n劳动力也将按照兵营式共产主义重新编组。工人组成生产队，农民组成供给队，河童与付丧神被编入工程及维修单位，所有运输人员接受军令调遣。公共食堂、集体宿舍与统一配给制度开始扩张，从前线士兵到议会干部都依照相同标准领取基本物资。\n\n总体战将整片幻想乡连成同一条战线。农田供应军粮，工坊制造武器，学校训练通信与救护人员，医院负责让伤员尽快重返岗位。\n\n这些措施严厉而沉重，却符合战争最直接的要求。非常时期必须实行非常政策，所有能够支撑战斗的力量都要被集中起来。从紧急议会结束的那一夜起，幻想乡进入总体战状态，整个国家开始像一座巨大的军营般运转。"

 KYO_sagume_does_not_deny_it:0 "签署《翻转世界决议》"
 KYO_sagume_does_not_deny_it_desc:0 "紧急议会最终拟定了《翻转世界决议》。地球不属于月都，地上众生也不是等待高阶文明安排的臣民。幻想乡将承认并援助各地反抗组织，与一切拒绝月人统治的力量共同作战。\n\n决议同时规定，这场战争不会以保住幻想乡为终点。只要月都仍能任命地球的统治者，只要月人的军队仍驻扎在地上，只要所谓高阶生命仍有权替低阶生命决定命运，战争便尚未结束。\n\n稀神探女第一个签下自己的名字。身为来自月都的神明，她比谁都清楚这一笔意味着什么。从此以后，她不再是暗中泄露情报的旁观者，而是公开否定月都统治权的背叛者。\n\n正邪随后落笔，并立即命人将决议送往所有战区。她不需要众人围着一张纸庆祝；军队必须出发，物资必须运到，遭到占领的人也必须知道地球上仍有人准备接应他们。\n\n曾经由月都书写的上下秩序，从这两道笔迹开始翻转。"


 KYO_not_your_discarded_failure:0 "生为天邪鬼的决心"
 KYO_not_your_discarded_failure_desc:0 "议会散去以后，探女终于将那段被抹去的过去完整交还给正邪。正邪并非遭到母亲厌弃，也不是被随意丢往地球的失败品。月都曾准备处置这个不符合要求的孩子，而探女为了保住她，只能让所有相关者忘记正邪的存在，再亲手将她送离月面。\n\n真相没有立刻消除两人之间的隔阂。正邪曾在没有答案的日子里长大，也曾把自己承受的一切归咎于母亲。即使如今知道探女救了她，那些孤独、愤怒与遭到遗弃的感觉也不会凭空消失。\n\n正邪没有扑进探女怀里，也没有说出宽恕。她只是告诉母亲：『你救下了我，但我不是你藏起来的错误。我走到这里，也不是为了回到月都证明自己够不够资格。』\n\n她决定与月都战斗，并非为了夺回本该属于自己的身份。她要摧毁的，正是那种能够审查一个孩子是否值得活着、能够依照出身决定谁高谁低的制度。\n\n探女给了她活下去的机会，正邪则要让更多人不必依靠被遗忘才能活着。她不再逃避自己来自月都的过去，也不再让那段过去支配自己。\n\n她生为天邪鬼。别人替她写好的命运，本来就是用来推翻的。"


 KYO_revolution_beyond_gensokyo:0 "设立真理部"
 KYO_revolution_beyond_gensokyo_desc:0 "月人的优势不仅存在于武器与技术。它们掌握更迅速的通信方式、更严密的情报体系，也懂得如何让被占领者相信反抗毫无意义。\n\n月都控制的电台不断播送前线已经崩溃的消息，合作政权则反复声称月人的到来结束了战争与混乱。投降被包装成理性，服从被解释为进步，任何抵抗行为都会被归咎为阻碍地球接受先进文明。\n\n稀神探女熟悉月都处理情报与塑造舆论的方法。她负责辨认敌方的通信规律、隐蔽暗号与宣传来源，正邪则邪则将散落各地的电台、记者、地下组织和反间谍人员整合起来，设立专门对抗月人信息优势的真理部。\n\n这个机关将揭露占领区的真实情况，核验战场消息，截断月人的渗透渠道，并把仍在抵抗的声音传到整个地球。正邪不需要人民相信一切由政府说出的话；她需要他们明白，月人并非不可战胜，地球也并未自愿接受统治。\n\n只要被压迫者仍能听见彼此，月都便无法替整个世界宣布战争已经结束。"


 KYO_export_the_spark_not_the_throne:0 "翻转主义"
 KYO_export_the_spark_not_the_throne_desc:0 "真理部建立之后，正邪很快提出了一个更加危险的想法：既然月人的思想能够渗入地球，那么地上的革命思想同样能够传入月都。\n\n探女知道月都并非毫无裂痕。月兔长期承担劳役与战争，普通士兵必须服从高位者，许多不符合上层期待的人则被排除在权力之外。月都把这种差异解释为天生秩序，却必须依靠无数被压在下面的人，才能维持自身运转。\n\n正邪将自己的主张写成了后来被称作『翻转主义』的思想：没有任何生命天生应该统治，也没有任何群体注定只能服从；下位者拥有质疑命令、组织自身并推翻压迫者的权利；革命若停在一处，迟早会被更庞大的旧秩序包围。\n\n探女负责找出月都内部可以接触的对象，正邪则将文章、录音与地球抵抗成功的消息不断送往月面。她不准备征服月都以后坐上新的王座，她要做的是让月兔、士兵与所有被压抑者亲手质问：那些高高在上的月人，究竟凭什么永远命令他们？\n\n正邪送往月都的从来不是王冠，而是一种让王冠再也戴不稳的思想。"


 KYO_no_safe_place_for_oppression:0 "扭转月都的命运"
 KYO_no_safe_place_for_oppression_desc:0 "月都察觉了内部正在扩散的反抗思想。大批月兔遭到拘捕，秘密联络点接连失守，地球上的抵抗军也在月人发动的总攻下节节败退。所有迹象都说明，这场跨越地月的革命即将遭到镇压。\n\n稀神探女注视着不断恶化的战局，终于说出了那句她早已准备好的话：『这场反抗必将失败。』\n\n随着话语落下，原本已经确定的局势开始朝相反方向转动。月军的围剿出现缺口，未被发现的联络线重新发挥作用，几个原本准备服从命令的部队也突然举起反旗。探女以自己的能力改变了失败的走向，却只能替革命争取一次稍纵即逝的机会。\n\n正邪早已完成其余准备。备用的指挥人员、隐藏的武器、重新规划的运输线与潜伏在占领区的组织同时开始行动。她亲自赶往最危险的战场，把溃散者重新编成部队，让本应被包围的抵抗军反过来切断月人的退路。\n\n探女负责扭转局势，正邪负责让逆转成为无法挽回的现实。她们没有等待奇迹降临，而是将能力、情报与长期准备压在同一个瞬间，终于让失败的命运转向月都自身。"


 KYO_turn_over_past_and_future:0 "吾名正邪，生来就是天邪鬼"
 KYO_turn_over_past_and_future_desc:0 "月人在地球建立的统治已经瓦解。占领政府相继倒台，被迫服役的地上军队转身加入反抗，月兔的叛乱也从军营蔓延至月都内部。那个曾经自称有权支配地球的高阶文明，第一次必须面对来自下方的审判。\n\n正邪最终踏上月都时，没有要求众人为她准备王座。她下令解除月兔的强制服役，释放因反对战争而遭到囚禁的人，并拆除负责维持血统等级与殖民统治的机关。地球不再接受月都指挥，月都的普通居民也不必继续服从少数高位者。\n\n稀神探女站在她身旁，看着那个曾被自己藏进地球、几乎遭月都从历史中抹去的孩子，亲手改变了地球与月亮的关系。她问正邪，是否终于愿意回到自己的故乡。\n\n正邪却回答：『我不是回来。我是来把月都从高处翻下来。』\n\n她不愿成为月都的新主人，也不会允许革命在胜利之后重新长出另一批不可质疑的统治者。复仇只能更换坐在上方的人，下克上却必须让所有被踩在下面的人都能站起来。\n\n她曾被遗忘、被流放、被视作不该存在的失败；后来，她推翻幻想乡的旧秩序，又率领月人眼中的低阶生命击败了来自月面的征服者。世界曾经无数次告诉她应该接受自己的位置，她却无数次把那个位置颠倒过来。\n\n『吾名正邪，生来就是天邪鬼。』\n\n这不是故事的终点。只要还有谁凭借出身、力量与权威压住他人，鬼人正邪的革命便不会结束。"










 KYO_Yukari_start:0 "再次站在月光下"
 KYO_Yukari_start_desc:0 "第44任博丽巫女死后，八云紫再一次独自走入月光。月都精心布置的杀局未能夺走她的性命，却夺走了守在结界前的人，也撕碎了幻想乡最后一丝侥幸。绵月姐妹或许暂时收回了目光，但月人的野心从未消退；只要那轮月亮仍高悬天际，下一场战争便只是时间问题。\n\n紫已经厌倦了被动等待。她将追查巫女之死，修补破碎的结界，并召集所有仍愿意守护幻想乡的人类与妖怪。几千年前，她曾带着败军从月海归来；这一次，她要让月都明白——这场延续千年的斗争，必须由地上亲手结束。"


  KYO_my_shikigami_Ran:0 "来自畜生界的九尾"
 KYO_my_shikigami_Ran_desc:0 "蓝出身于畜生界，曾是那片残酷世界中最出色的谋划者之一。在那里，迟疑会招致吞噬，错误必须用鲜血偿还，唯有比敌人更快、更准确地作出判断，才能让部下活到下一天。\n\n八云紫看中的不只是九尾妖狐的力量，更是她将混乱整理成秩序的才能。蓝接受式神契约，并非因为自己遭到驯服，而是经过计算以后，她认为紫想要建立的世界，比畜生界无休止的争夺更值得维持。从那一天起，她将九条尾巴、无数算式与全部才智，投入了名为幻想乡的漫长工程。"

 KYO_Ran_idea:0 "狐狸记得每一条算式"
 KYO_Ran_idea_desc:0 "蓝记得每一道命令、每一条补给路线，也记得那些被胜利报告省略的代价。九条尾巴同时推演九种可能，使她能从混乱中找出损失最小、效率最高的答案。\n\n畜生界的暴力教会她，任何遗漏最终都会化为尸体。因此她不仅记得方程式，也会追问方程式究竟漏掉了谁。"

 KYO_Ran_political_reform:0 "让演算看见活着的人"
 KYO_Ran_political_reform_desc:0 "蓝曾经相信，只要制度足够高效，个人的痛苦便只是可以忽略的误差。如今她已经明白，恐惧、饥饿、悲伤与尊严同样是客观存在的事实；若将它们排除在计算之外，它们终究会以动乱、仇恨与崩溃的形式重新出现。\n\n把人的情绪写进算式，并不是向非理性低头，而是让结论变得完整。真正高效的制度不只会执行命令，也应知道自己正在保护谁。"

 KYO_Ran_calculator:0 "九尾狐演算法"
 KYO_Ran_calculator_desc:0 "蓝创造了一套只有自己能够完整运行的演算法，让九条思路同时处理政务、补给、情报、结界与人员调度。每一项命令都会被拆解成时间、资源、风险与替代方案，再以最低代价重新组合。\n\n她的价值并不只是计算得更快，而是能将八云紫近乎不可能实现的构想，转化为一张可以执行的日程表。"

 KYO_Ran_contact_old_friend:0 "另一端的旧识"
 KYO_Ran_contact_old_friend_desc:0 "畜生界很少记得恩情，却从不会忘记真正有能力的人。昔日的同僚未必认同八云家，更不理解幻想乡的理想，但他们仍然信任蓝的判断，也愿意为她重新开启封闭的道路。\n\n情报、物资与避难者将再次穿过两界。那扇门并非为了怀念往日而打开，而是因为畜生界知道：只要由这位功勋元老负责，任何资源都不会被白白浪费。"

 KYO_Ran_will_die_for_you:0 "留下并非因为命令"
 KYO_Ran_will_die_for_you_desc:0 "蓝已经计算过无数次，而答案始终相同——她会留下。忠诚不是服从赴死的命令，也不是放弃思考的借口，而是衡量过风险、代价与所有可能以后，依然认为八云紫所守护的世界值得自己承担责任。\n\n她愿意接受最危险的任务，却不会把死亡当作忠诚的证明。蓝想要活着完成每一项命令、修正每一个错误，并确保跟随紫出发的人，都能沿着她算出的道路回来。"

  KYO_my_shikigami_shikigami_Chen:0 "雨中的流浪猫"
 KYO_my_shikigami_shikigami_Chen_desc:0 "橙曾是一只被遗弃在雨中的小猫。她躲在废屋的屋檐下，守着主人离开前留下的气味，一次次抬头望向道路。雨停了又落，季节来了又走，可那个人始终没有回来。\n\n人们以为她太过愚笨，所以不明白自己已经遭到遗弃。其实橙什么都知道，只是不愿相信曾经给予自己的温暖会毫无意义。后来，蓝在雨中找到她。蓝没有承诺失去的人终会归来，只是向她伸出手，告诉她可以先跟自己回家。"

 KYO_meow_meow_firepower:0 "纯真的猫"
 KYO_meow_meow_firepower_desc:0 "按照世间最简单的道理，橙本该憎恨遗弃她的人类，把孤独变成爪牙，再用别人的痛苦偿还自己的等待。可是她没有这样做。她仍会回到那座废屋，为路过的流浪猫留下食物，也会在听见脚步声时满怀期待地望向门外。\n\n她的纯真并非因为不懂背叛，而是在明白一切以后，依然选择相信善意。橙无法改变那个没有回来的人，却可以决定自己不会成为另一个遗弃别人的存在。"

 KYO_meow_meow_firepower_air:0 "把迷路的人带回来"
 KYO_meow_meow_firepower_air_desc:0 "橙比任何人都清楚，在原地等待一个永远不会回来的人是什么感受。\n\n当道路被战火截断、命令只顾得上大部队时，橙便带着普通妖怪穿过那些被忽略的缝隙。失散的孩子、负伤的妖怪与来不及撤离的村民，都将沿着她熟悉的道路回来。这一次，不会有人被独自留在雨中。"

 KYO_Chen_the_best_cat:0 "弱小者也有自己的家"
 KYO_Chen_the_best_cat_desc:0 "迷途之家最初只是一座遭人遗弃的村落。漏雨的屋顶、积满灰尘的房间与无人回应的道路，收容着所有被世界遗忘的事物，也曾收容那只在雨中等待主人归来的猫。\n\n橙没有让这里永远停留在被遗弃的那一天。她修补破损的门窗，在冰冷的灶台重新点起炉火，为流浪的小妖怪铺好床铺，也总在桌上多留一份热腾腾的饭菜。迷途之家依然会使心怀恶意者迷失方向，却会主动为无处可归之人打开道路。\n\n家并不是从未有人离开的地方，而是无论在外迷失多久，依然有人愿意为你留一盏灯。橙曾经没有等到这样的灯火，所以她决定亲手将它点亮。"

 KYO_Chen_is_the_cutest:0 "善意不必先证明用途"
 KYO_Chen_is_the_cutest_desc:0 "总有人询问，救助弱小者能为战争带来多少回报，一只普通的猫又是否值得占用宝贵的物资。橙无法用复杂的理论回答，只知道没有任何生命必须先证明自己有用，才配得到一顿饭、一张床与一句欢迎回来。\n\n善意不是等待回报的投资。倘若幻想乡只愿保存强大、有用或能够作战的存在，那么这座乐园与月都所追求的纯净世界，便只剩下名字不同。"

 KYO_Chen_will_die_for_you:0 "即使我们不在，也要好好活着"
 KYO_Chen_will_die_for_you_desc:0 "紫与蓝都知道，自己不可能永远站在橙的身后。她们留给橙的不是一道要求她赴死的命令，而是辨认道路的能力、可以彼此信任的朋友，以及一座真正属于她的家。\n\n总有一天，紫的间隙不再开启，蓝也无法继续替她计算前路。到了那时，橙不必再次回到雨中等待。她应该好好吃饭、好好生活，在夜晚点亮门前的灯，并为下一个迷路的人打开家门。\n\n因为爱不是要求谁永远留下，而是让被爱过的人在离别以后，依然知道该如何活下去。"


 KYO_two_shikigami_work:0 "八云之家"
 KYO_two_shikigami_work_desc:0 "紫、蓝与橙共同拥有八云之姓，却恰好以三种颜色为名。总有好事者询问靛青、翠绿与明黄去了哪里，甚至猜测是否还有从未露面的八云。每逢此时，紫只会合起折扇，留下一个无法分辨真假的笑容。\n\n然而对蓝与橙而言，八云从来不只是一套古怪的命名方式。紫给予蓝一个可以施展才智的归宿，蓝又牵着橙离开那场漫长的雨。她们没有相同的血脉，却在一次次等待、归来与并肩工作中成为家人。\n\n如今月都的阴影再度笼罩大地。紫负责决定前路，蓝将构想化为秩序，橙则帮助每一个可能遭到遗忘的人。八云之家或许只有三种颜色，却足以共同描绘幻想乡的未来。"

 KYO_Yukari_rule_all:0 "贤者的责任"
 KYO_Yukari_rule_all_desc:0 "幻想乡需要一位能够看见全局的人，也需要有人在争执无法调和时作出最后裁决。八云紫将重新承担贤者的权力，但她已经明白，责任并不是替所有人思考，更不是将不同的声音变成自己的回声。\n\n她会倾听人类的恐惧、妖怪的怨恨、神明的忧虑与亡者的沉默，然后在彼此无法共存的答案之间划下界线。决定仍将由紫作出，错误、代价与随之而来的憎恨，也将由她亲自承担。\n\n这才是贤者的责任——不是永远正确，而是在无人愿意选择的时候，仍敢决定幻想乡应当走向何方。"

 KYO_gensokyo_rebuild_plan:0 "幻想乐园的新任巫女"
 KYO_gensokyo_rebuild_plan_desc:0 "八云紫没有从名门与权贵之中挑选新的巫女。她选择了博丽玲未——一名在战争中失去双亲，又被弱小妖怪共同养大的少女。玲未熟悉人类的悲伤，也记得妖怪递来的饭食、为她遮雨的衣袖，以及那些陪伴她长大的温柔面孔。\n\n她将守护人类，却不会把妖怪视作理应消灭的敌人；她会退治破坏秩序者，也愿意为遭到误解的怪异开口。博丽巫女不再只是结界前挥舞御币的守门人，也将成为人类与妖怪之间不可割断的纽带。\n\n紫把博丽之名、驾驭结界的权力与守护幻想乡的使命一并交给玲未。她所选择的不是下一件对抗月都的武器，而是一位能够在战争结束以后，继续守望幻想乐园的人。"

 KYO_yukari_allies:0 "此世与彼岸的两份回答"
 KYO_yukari_allies_desc:0 "八云紫首先走入迷途竹林，希望从八意永琳口中破解月人的行为逻辑。永琳曾带领诸神离开地球，在月面建立远离污秽与死亡的都市。她比任何人都清楚，月都的疯狂并非毫无缘由：最初只是对死亡的恐惧，而后化为对变化的排斥，最终使“纯净”从延续文明的手段，变成衡量一切生命是否有资格存在的戒律。\n\n随后，紫来到白玉楼，向西行寺幽幽子提出另一个问题：月人为何如此畏惧死亡？幽幽子的回答很简单——因为他们从未真正理解生命。生并不是对死亡的永久逃亡，而是一段终将抵达彼岸的旅程；正因花会凋谢、宴席会散去、相遇之人终有离别，每一次绽放与重逢才拥有意义。拒绝死亡的月都，也因此开始憎恨诞生、成长与改变。\n\n永琳将月都视为一套可以拆解的制度，幽幽子则看见了隐藏在制度深处的恐惧。两份回答彼此冲突，却共同揭开了月人的真相。紫要战胜的不只是一支军队，而是一个为了逃避终结，决意让世间万物一同停止生长的世界。"

  KYO_eirin_and_kaguya:0 "月之贤者与竹取物语"
 KYO_eirin_and_kaguya_desc:0 "人间流传的《竹取物语》，结束于月使迎回辉夜的那一夜。然而对八意永琳与蓬莱山辉夜而言，真正苦涩的故事才刚刚开始。\n\n久远以前，永琳带领诸神离开战乱与死亡蔓延的地球，在月面建立最初的避难所。她亲眼看着简陋的聚落成为辉煌的月之都，也看着那里逐渐将对污秽的戒备变成对地上生命的憎恶。当地上诞生的辉夜抵达月都，一派将她视为污染月面的罪证，要求永远监禁乃至彻底消灭；另一派则把她看作月都仍能接纳改变的希望。\n\n辉夜饮下蓬莱药，使死亡再也无法成为囚禁她的锁链。最终，永琳放弃自己参与建立的都市，带着辉夜与铃仙逃往地球。竹取物语留下了一个消失在月光中的公主，而永远亭保存的，则是一座避难所如何忘记建立初衷的漫长证词。"

 KYO_resien_and_tewi:0 "月兔老兵与地上妖兔"
 KYO_resien_and_tewi_desc:0 "铃仙至今仍会在月光过于明亮的夜晚惊醒。门扉闭合的声音会让她想起集结钟，药瓶折射的白光则像极了月面战场上的炮火。月都以服从与荣誉洗脑月兔，又把她们成批送上前线，充当可以随时补充的耗材。与铃仙一同受训的姐妹们全都死在第一次月面战争中；她能够回来，并非因为比谁更英勇，只是因为她更早学会了逃跑。\n\n因幡帝则是在地上生活了漫长岁月的妖兔。她凭借不可思议的幸运躲过猎人、灾荒与无数次时代更替，最终成为竹林中所有妖兔敬重的长老。没有人知道这份幸运为何始终眷顾着她；或许在久远以前，她曾许下一个尚未完成的约定，所以命运仍不允许她离开。"

 KYO_eternal_clinic:0 "永远亭的灯仍亮着"
 KYO_eternal_clinic_desc:0 "夜幕降临以后，永远亭的灯依然为所有伤者亮着。诊册不会记录来者属于哪一种族、效忠哪个派系，也不会衡量他们对战争是否还有利用价值；在这里，伤势的轻重是唯一决定医治顺序的标准。\n\n永琳曾协助建立一座以纯净划分生命价值的都市，如今她要在这片竹林中证明另一种秩序仍然可能存在。辉夜整理病房，铃仙照料伤兵，帝则沿着竹林小径寻找那些无人注意的伤者。只要还有人能够走到灯火之下，永远亭便不会询问他是否值得被拯救。"

 KYO_night_council:0 "月都最初只是一座避难所"
 KYO_night_council_desc:0 "最初的月都没有纯净者与污秽者之分。那里只是一座仓促建成的避难所，收容着逃离地上战乱、灾厄与死亡的神明。所谓净化，也不过是隔绝疾病与维持聚落存续的手段，从来不是判决他人是否有资格活着的法律。\n\n在永琳保存的古老记录中，第一代月民仍会怀念地上的海洋、花朵与四季。他们畏惧死亡，却尚未因此憎恨生命。真正改变月都的并不是某一道命令，而是一代代不断累积的恐惧：避难成为隔离，隔离化为优越，最终连建造这座城市的理由也遭到遗忘。"

 KYO_state_laboratory:0 "蓬莱药留下的出口"
 KYO_state_laboratory_desc:0 "月都的法律以死亡作为最后的威胁：不洁者可以被处决，异议者可以被消灭，遭到抹去的人也无法再为自己申辩。然而辉夜饮下蓬莱药以后，这套秩序第一次遇见了无法执行的判决。\n\n永生并未给予辉夜自由，却使月都再也无法用死亡结束她的反抗。那具无法被毁灭的身体成为制度中的裂缝，也为永琳筹划逃亡争取了时间。最终，她们带着铃仙穿过月都无法完全封锁的道路，回到那颗被月人称作污秽、却仍允许生命改变的地球。\n\n蓬莱药堵死了死亡，也意外打开了一条通往自由的出口。"

 KYO_rational_unify:0 "纯净如何成为法律"
 KYO_rational_unify_desc:0 "纯净最初是一套维持月面环境的规则。随后，它被写入居住资格、血统记录、教育制度与军队纪律；月民开始依照出身区分高下，地上生命则被视为必须隔离的污染。当一种方法能够决定谁有资格生存，它便不再是技术，而成为了统治。\n\n永琳能够指出每一道规则产生的年代，辉夜记得这些条文如何落在具体的人身上，铃仙则以自己的伤痕证明制度最终会把谁送上战场。三份证词将帮助八云紫看清月都真正的弱点：所谓永恒纯净，从来不是无法动摇的真理，只是一群恐惧改变的人，将自身恐惧铸成的法律。"

 KYO_risk_model:0 "地上公主的罪"
 KYO_risk_model_desc:0 "——摘自《月都纯化法庭审理蓬莱山辉夜案》\n\n“我承认自己诞生于地表，也承认曾以月人的身份生活在人类之中。砍竹的老人将我从竹中抱起，他与妻子给予我的不是污染，而是家人的温暖。那些因我的容貌而来的求婚者，有人贪婪，有人虚伪，也有人真的为一份无法实现的爱付出一切。他们让我看见人心的丑陋，也让我理解生命为何仍值得珍惜。”\n\n“后来，我回到月球。等待我的并非故乡的拥抱，而是审问、监禁与无休止的敌意。你们说地上的风雨玷污了我，说人类给予的姓名、亲情与记忆都是必须洗去的污秽。但我既见过地球的冷暖，也尝过月都的憎恶；两者都已经成为我的一部分。”\n\n“我名为蓬莱山辉夜，是出生于地表的月人，也是竹取老人的女儿。我的存在证明地上与月上从来不是无法相容。倘若这便是你们所说的罪，那么有罪的不是我，而是这座不允许生命拥有两处故乡的法庭。”"

 KYO_love_puppetry:0 "竹取物语的另一个结局"
 KYO_love_puppetry_desc:0 "“地上的《竹取物语》记载了我在竹林中的诞生、五位求婚者的难题，以及月使将我带回月球的那一夜。故事在羽衣落下时戛然而止，仿佛公主回到月都以后，一切便得到了圆满的结局。”\n\n“可是对我而言，那只是序章的终点。我回到的不是等待游子归来的故乡，而是一座争论该如何处置我的法庭。有人将地上出生的公主视为纯净秩序的耻辱，有人想把我永远囚禁，也有人希望以我的存在证明月都仍能容纳不同的生命。”\n\n“我饮下蓬莱药，不是为了追求永生，而是不愿把自己的结局交给他们裁定。永琳放弃亲手参与建立的月都，铃仙背离了训练她赴死的军队，我们一同逃向那颗被称作污秽的地球。”\n\n“我名为蓬莱山辉夜。地上的竹取物语讲述了别人如何追求我，又如何失去我；真正属于我的故事，则始于我拒绝让月都定义自己是谁的那一天。”"

 KYO_statistical_sovereign:0 "贤者离开月都以后"
 KYO_statistical_sovereign_desc:0 "月都建立之初，永琳所说的“洁净”从来不是血统与身份。那只是隔绝疾病、避免战火，并让逃难的神明能够继续生存的方法。她想建立一座高洁的城市，因为她相信拥有漫长生命者，更应懂得尊重每一个短暂的生命。\n\n后来者却只引用她留下的一半教诲。他们保留了隔离与净化，删去了宽容与保护；将避免污秽曲解成消灭异类，把延续文明变成维护特权。月兔自出生起便被登记为军队的耗材，来自地表的生命遭到监禁，反对者则以“不够纯净”之名从社会中消失。\n\n永琳曾希望月都成为逃离压迫的避难所。可在她离开以后，那座自称高洁纯净的城市，最终变成了另一个依靠压迫与奴役维持的世界。"

 KYO_rabbit_leader_tewi:0 "竹林之下的地上网络"
 KYO_rabbit_leader_tewi_desc:0 "永远亭能够建立，绝不只是八意永琳一人的功劳。最初逃到地球时，永琳、辉夜与铃仙并不熟悉地上的道路。她们能够躲过追兵、穿越不断改变方向的迷途竹林，是因为因幡帝主动为她们引路。\n\n这位“地上的帝”知道哪里能够取水，哪些道不会留下痕迹，也清楚附近聚落愿意接纳怎样的来客。她让兔群送来竹材与粮食，又把病患带到永琳面前。永远亭的第一根梁柱、第一条药材运输路线，以及第一位地上患者，背后都有帝留下的足迹。\n\n若没有她的引领，月上的流亡者根本不会在这片美妙的竹林中找到容身之处。永远亭之所以成为地上的家，而非一座等待返回月都的流亡机关，正是因为帝让她们真正走进了地上的生活。"

 KYO_lucky_star_for_all:0 "偏安不是遗忘"
 KYO_lucky_star_for_all_desc:0 "永琳无法轻易憎恨月都。那座城市就像她亲手养大的孩子：她参与奠定最初的基石，为它制定规则，也曾相信它终有一天能够成为诸神安居的理想乡。如今，这个孩子却肆意曲解她的教导，并将她留下的知识用于压迫地上生命。\n\n长久以来，永琳选择偏安竹林。她以为隐藏月都的技术、避免双方再次接触，便能阻止更大的灾难。然而她的沉默并未换来和平，只让纯净派得以把月都推向更危险的极端。继续放任下去，月人的下一场战争将不只毁灭幻想乡，也会令月都彻底失去回头的可能。\n\n医者不能因为爱护病人，便拒绝割除正在蔓延的病灶。永琳必须作出决定：她要帮助八云紫制止月都，即使这意味着亲手纠正自己最珍视、也最失败的造物。"

 KYO_reisen_the_Tormented_one:0 "第一次月面战争的老兵"
 KYO_reisen_the_Tormented_one_desc:0 "“第一次月面战争时，月都的制度展现了前所未有的效率。命令能够在顷刻间传遍军队，前线出现缺口，后方立刻补入新的月兔。我们的阵形从未混乱，弹药从未中断，战报也始终宣称胜利近在眼前。”\n\n“可是他们从来不在战报里写下代价。前线的姐妹不断死去，后方的孩子则刚结束训练便被送来填补位置。所谓坚不可摧的防线，不过是用一层又一层血肉堆成的高墙；所谓月都大胜，也只是因为能够比敌人更快地把生命送进战场。”\n\n铃仙望向永琳，声音逐渐低了下来。\n\n“永琳大人，如果当年您没有把我从战场上调出来，我绝不可能活到今天。我不是最勇敢的那个，也不是最强大的那个。我只是那群姐妹之中，唯一被允许活下的人。”"

 KYO_reisen_the_one_without_love:0 "月兔选择地上"
 KYO_reisen_the_one_without_love_desc:0 "“我为什么活着？在月都，他们早已替我准备好答案。为了服从命令，为了守护纯净，为了阻止污秽侵入月面；倘若有必要，也为了在无人记得的战线上死去。”\n\n“来到地球以后，我才逐渐理解永琳大人所说的美好。这里会下雨，泥土会弄脏衣服，生命会衰老，也会因为微不足道的小事相遇。没有人按照纯净程度分配药物，竹林里的兔子也不需要先证明自己的价值，才有资格得到一顿晚饭。”\n\n“我依然怀念月球，因为那里有我的童年，也埋葬着我的姐妹。但怀念不再意味着服从。月都曾替我决定为何而生、又该为何而死；如今，我要第一次亲自决定自己的归属。”\n\n“我是月兔铃仙，而我选择留在地上。”"

 KYO_infinite_spiral:0 "仍留在月都的逆言"
 KYO_infinite_spiral_desc:0 "永琳从密室中取出一份逃亡时由月都带走的古老档案。那是避难者抵达月面的登记名册：在最初的建城者以后，第二批、第三批神灵陆续从地球迁入月都。其中一个被反复修改、却始终未曾删除的名字，引起了她的注意——稀神探女。\n\n古老记录将探女称作天探女，与天邪鬼的起源紧密相连。按照今日月都的标准，这位能够逆转言语与命运的神明理应充满难以容忍的地上污秽；可她不仅没有遭到驱逐，反而始终停留在月都权力深处。她的存在证明，所谓纯净从来不是一致的真理，只是一套会为有用之人制造例外的政治规则。\n\n如果探女仍记得自己的来历，她或许不会认同净化派塑造的月都。这样一位隐藏在体制内部、又能使既定命运发生逆转的神明，很可能正是突破月都的关键。永琳必须立即与八云紫讨论此事。"

 KYO_the_end_of_the_humankind:0 "失去永琳的月都"
 KYO_the_end_of_the_humankind_desc:0 "八云紫将间隙藏进那份古老名册的字缝之间，让永琳的信息绕过月都的监视。数日以后，档案上的一行文字自行颠倒，一份来自稀神探女的回答终于抵达地上。\n\n探女诉说了永琳离开以后的月都。净化派接管议会，删除建城初期的历史，把出走的贤者描绘成遭污秽腐化的叛徒。反对者并未全部消失，却只能隐藏在行政机关、军队与神明家系之中，以沉默保存力量，等待一个能够打破现状的机会。\n\n“只要这个世界仍有人宣称自己的秩序绝对正确，天邪鬼便会成为它永远的反对派。”探女如此写道，“当所有人都被命令说是，总要有人保留说不的能力。”\n\n失去永琳的月都并非坚不可摧。它的内部仍存在裂缝，而被制度视作异端的天邪鬼一族，正守在那道裂缝之后。"



 KYO_fat_princess:0 "不存在的召魂命令"

 KYO_fat_princess_desc:0 "一份盖有白玉楼印记的召魂命令又被送到永远亭。文件声称幽幽子扣留月面战争的阵亡者，并拒绝让永远亭接触死去的月兔。\n\n妖梦很快发现印章上下颠倒，幽幽子则在亡者记录中找到了仍然活着的铃仙。至于纸张背面，再次印着《文文。新闻》的旧广告。\n\n射命丸文辩称，既然上一篇质疑永远亭，这一篇便应当质疑白玉楼，如此才算不偏不倚。紫只纠正了她一个常识：同时捏造两边的罪行，并不会使谎言变成公正。\n\n最终，白玉楼与永远亭没有因为这份伪令开战。文则被留下核对十二箱亡者记录，顺便学习新闻调查与凭空创作之间究竟有何区别。"

  KYO_yuyuko_and_youmu:0 "亡灵公主与半人庭师"
 KYO_yuyuko_and_youmu_desc:0 "西行寺幽幽子曾是西行寺家最后的后裔。作为生者的她在西行妖下结束了一生，却没有就此消失。当她再次睁开双眼时，呼吸与体温已经离去，往昔的记忆也变得模糊；那个死去的人类少女，化作了今日统领白玉楼的亡灵公主。\n\n幽幽子知晓如何安抚亡者、解开执念，再将灵魂送往下一段旅程，却很少提起自己为何仍停留于此。她送走了无数人，自己却像被遗忘在生死交界的一页，始终未能离开。\n\n陪伴她的是半人半灵的庭师魂魄妖梦。妖梦修剪樱树、准备膳食、驱逐失控的幽灵，也在幽幽子忘记时间与往事时，替她记住白玉楼仍然存在于今日。魂魄家的使命是照护冥界之主，而妖梦所守护的，早已不只是一项使命。"

 KYO_grandpa_still_fight:0 "魂魄家最初的誓约"
 KYO_grandpa_still_fight_desc:0 "魂魄家最初接过白玉楼之剑时，幻想乡的阎魔四季映姬曾再三嘱咐：西行寺幽幽子绝不能有所闪失。她并非只有公主的虚名，而是冥界灵魂流转的关键。若幽幽子失去控制，无数亡者便会滞留于生死之间，连彼岸与幻想乡的边界也可能随之动摇。\n\n因此，魂魄家的誓约包含两项不可分割的职责：侍奉白玉楼之主，并守住生者与死者之间的界线。绝大多数时候，这两项使命彼此一致；但倘若幽幽子的意愿与冥界秩序发生冲突，魂魄家的剑便必须在忠诚与职责之间作出选择。\n\n魂魄妖忌将剑术、庭师之位与这份沉重的誓言一并交给妖梦。老人或许已经离开白玉楼，他留下的使命却仍握在年轻庭师手中——保护幽幽子，也在必要时阻止她越过那条不应触碰的界线。"

 KYO_Hakugyokurou_order:0 "冥界并非终点"
 KYO_Hakugyokurou_order_desc:0 "冥界并不是储存亡者的仓库，更不是让灵魂永远停留的终点。生命结束以后，死者会带着姓名、记忆与尚未放下的执念来到此处；这些事物不会因为心脏停止跳动便立刻消失，也不该被粗暴地一笔勾销。\n\n经过阎魔的裁断，灵魂将由幽幽子接入白玉楼。她倾听亡者最后的遗憾，让他们在樱花下回望已经结束的一生，再逐渐放下无法带往来世的执念。当名字不再令人痛苦，记忆也终于获得安宁，灵魂便会离开冥界，进入下一次轮回。\n\n死亡不是生命的虚无，而是两段旅程之间的中转站。幽幽子的职责不是扣留亡者，而是确保每一个抵达彼岸的灵魂，都能在准备好以后继续前行。"

 KYO_beauty_court:0 "幽幽子，你知道自己是谁吗"
 KYO_beauty_court_desc:0 "“幽幽子，你为什么会在这里？冥界有无数亡者，白玉楼也曾迎来许多高贵的灵魂，可为什么偏偏是你坐在这个位置上？”\n\n最简单的答案是：你是西行寺家最后的后裔，是封印西行妖之人，也是阎魔选定的冥界管理者。你的亡骸无法离开树下，灵魂也不能进入轮回，于是送别其他亡者便成为你没有尽头的职责。\n\n可是身份并不能完全回答她是谁。褪去公主、亡者与管理者的称谓以后，她仍会因美食露出笑容，会记得春雪落在庭院中的声音，也会在某些似曾相识的夜晚，无端地望向那棵永远不应盛开的妖树。\n\n她既不是西行妖封印的一件工具，也不只是阎魔任命的官吏。即使已经忘记生前的一切，她仍然是西行寺幽幽子——一个走过死亡，却没有因此失去自我的人。"

 KYO_flower_blossom_again:0 "西行妖下封存之物"
 KYO_flower_blossom_again_desc:0 "西行妖的根系之下并非只有一具遗骸。历代西行寺族人都长眠于此，他们的骨骸、姓名与力量共同构成封印的一部分。越接近地面，埋葬的年代便越晚；而位于所有先祖之上、成为最后一道封印的，正是西行寺家最后的后裔——幽幽子。\n\n生前的她以自己的死亡阻止西行妖完全盛开。为了让封印不再受到动摇，她失去了关于死因与身躯所在之处的记忆。此后，死去的少女以亡灵之姿醒来，却不知道自己脚下埋藏的，正是整个家族与曾经的自己。\n\n最后一位西行寺没有继承人间的宅邸与家业。她所继承的是守望祖先长眠之地、维持西行妖封印，并管理所有来到冥界之魂的重任。"

 KYO_pale_spycraft:0 "阎魔的判词"
 KYO_pale_spycraft_desc:0 "四季映姬代表彼岸为白玉楼作出担保：诸界必须承认西行寺幽幽子对冥界亡灵的管理权，不得擅自夺取灵魂、干涉裁断，也不能以战争与政治为由强迫亡者返回人世。\n\n与这份权力相伴的，是白玉楼必须承担的责任。所有被彼岸送来的灵魂都应得到安置，执念获得疏导以后便须进入轮回；白玉楼不得扣留亡者、组建私属亡灵军队，更不能让任何人接近西行妖的封印。魂魄家的剑，则负责确保这些条文得到执行。\n\n阎魔保护白玉楼，不代表将冥界赠予幽幽子。这里的一切权力都只为亡者能够平安启程而存在。倘若管理者把灵魂视为自己的所有物，判词所给予的权力，也会在同一日成为裁断她的依据。"

 KYO_may_the_flower_fly_high:0 "盛开便会招来死亡"
 KYO_may_the_flower_fly_high_desc:0 "西行妖在任何情况下都不能完全盛开。它的花瓣并非寻常春景，每一次绽放都会呼唤生者体内的死亡，使灵魂脱离躯体，汇入妖树根下。若所有枝桠同时开花，生死之间的界线也将随之崩溃。\n\n正如巴德尔之死并不只意味着一位神明陨落，而是宣告诸神黄昏已经开始，西行妖的盛开同样是一种征兆。它预示的不是一座庭院或一个家族的毁灭，而是死亡开始越过彼岸，将整个现世拖入没有归途的终局。\n\n幽幽子的遗骸是封住这场灾难的最后锁芯，她失去的记忆则是锁上的第二道门。为了让生者继续迎来春天，西行妖永远不能盛开；而幽幽子也注定无法完整知晓，自己究竟为何长眠于花树之下。"

 KYO_throne_of_the_dead:0 "亡灵公主的职责"
 KYO_throne_of_the_dead_desc:0 "幽幽子的生命观并非来自经书与判词，而是在一次次送别中逐渐淬炼而成。她看过执念深重的亡者终于放下仇恨，也见过不舍亲人的灵魂在樱花下停留多年，最后平静地走向轮回。死亡在她眼中既非惩罚，也不是失败，只是所有生命终将经过的一道门。\n\n她不会因为送别过无数灵魂便轻视任何一次离去。每个名字都曾属于一段不可重复的人生，每场告别也都值得被认真对待。正因如此，幽幽子的笑容显得格外平和——她知道悲伤不会永远停留，而逝去之人终会在另一段旅程中重新开始。\n\n只有幽幽子自己无法前行。她看着无数灵魂抵达、停留、释怀，再进入新的轮回，自己却始终坐在白玉楼中，因为属于她的结束早已被封存在西行妖下。\n\n亡灵公主的席位从来不是统治死者的王座，而是一个替所有人安排归途、唯独没有写下自己去处的守望之席。"

 KYO_accept_death_to_all:0 "生与死之间"
 KYO_accept_death_to_all_desc:0 "面对刚刚抵达冥界、仍因死亡而恐惧的灵魂，幽幽子很少宣读冰冷的判词。她会请妖梦端来茶点，问清对方的姓名，再像接待一位远道而来的客人那样，耐心听完他们最后想说的话。\n\n直到启程之时，她才会优雅地起身，亲口呼唤亡者的名字，为其打开通往轮回的道路。送别结束以后，幽幽子又会若无其事地询问妖梦晚饭吃什么，仿佛方才的离别只是一场寻常宴会。\n\n她看似轻描淡写，并非因为不懂死亡的重量。正因为幽幽子比任何人都明白离别不可逃避，她才不愿再用庄严与恐惧增加亡者的负担。承认死亡不是赞美死亡；温柔地送人离去，是为了让逝者保有姓名，也让留下的人能够继续生活。"

 KYO_youmu_the_Domination_one:0 "魂魄家的命令"
 KYO_youmu_the_Domination_one_desc:0 "幽幽子的要求总是说得含糊。她会望着空荡荡的庭院，说今日的风似乎太过寂寞；也会要求妖梦准备两份茶点，却不说明另一位客人是谁。妖梦只能一边揣摩主人的心思，一边照料迷失的幽灵、修剪庭院，再设法让晚饭准时端上桌。\n\n妖忌留下的第一道命令，是侍奉幽幽子；第二道命令，则是在必要时制止幽幽子。年轻的妖梦曾以为两者彼此矛盾，直到她在无数琐碎要求中逐渐认识自己的主人。\n\n祖父将“侍奉”放在前面，并非认为主人永远正确。只有先陪伴幽幽子、理解她的沉默与玩笑，妖梦才可能分辨什么只是孩子气的任性，什么是被遗忘的痛苦，又在何时必须拔剑说不。"

 KYO_youmu_the_one_without_love:0 "主人与使命之间"
 KYO_youmu_the_one_without_love_desc:0 "某个春日，幽幽子站在西行妖前，以几乎像在谈论天气的语气说道：“若它能够完全盛开，一定会很漂亮吧。”\n\n魂魄家的密令要求妖梦制止任何试图解除封印之人，即使那个人正是白玉楼的主人。她的手下意识地移向剑柄，却在幽幽子的眼中看见了某种连本人也无法理解的怀念。那究竟是危险的命令，还是失去记忆之人对自身过去的本能追寻？\n\n妖梦没有盲目服从，也没有立刻把幽幽子当作需要制服的罪人。她第一次放下“魂魄家继承者”的标准答案，认真询问主人为何想看那棵树开花。\n\n总有一天，她必须在使命与幽幽子之间作出选择。但在那一天到来以前，妖梦至少要确定自己选择的是眼前这个人，而不是祖训替她想象出来的答案。"

 KYO_spirit_is_all:0 "死后而生"
 KYO_spirit_is_all_desc:0 "幽幽子没有心跳，也不再拥有真正活着的身体。可她依然会因新菜露出期待，会优雅地招待客人，也会为了捉弄过度认真的妖梦，故意提出几个根本无法完成的要求。死亡夺走了她的过去，却没有把她变成一具只会执行职责的空壳。\n\n妖梦曾经不明白，亡灵为何还需要吃饭、赏花与庆祝节日。后来她才发现，这些事情并不是为了维持幽幽子的生命，而是为了证明死亡没有删除她作为一个人的部分。\n\n死后醒来并非生前人生的简单延续，却也不是被世界彻底抹去。记忆可能残缺，存在的方式也已经改变，但幽幽子仍能重新建立关系、承担责任，并决定今日要以怎样的方式度过。她死过一次，而后以另一个自己继续活着。"

 KYO_spirit_has_no_limit:0 "永恒的冥界"
 KYO_spirit_has_no_limit_desc:0 "只要世间仍有生命，死亡便不会停止；只要亡者继续抵达，冥界的工作也永远没有结束的一天。妖梦每天清扫落樱、整理名册、引导幽灵，幽幽子则接待一批又一批走完人生的灵魂。这套秩序已经运转了太久，也注定还会继续运转下去。\n\n然而白玉楼的永恒并非毫无变化。季节会交替，庭院中的树木会长出新枝，妖梦也会从那个握剑颤抖的孩子，逐渐成为能够独自承担职责的庭师。幽幽子看过许多代魂魄家成员来到身旁，最终又由她亲自送走。\n\n她知道妖梦也不会永远陪伴自己，却从不把这件事说破。于是幽幽子仍会提出孩子气的要求，妖梦也仍会一本正经地设法完成。对于没有尽头的人而言，这些短暂而寻常的日子，反而比永恒更加珍贵。"

 KYO_the_one_without_love:0 "管理者，还是囚犯"
 KYO_the_one_without_love_desc:0 "幽幽子向妖梦承认，白玉楼之主的职责既给予了她容身之处，也将她困在一段没有终点的时间里。所有来到她面前的灵魂都有下一站，唯独负责安排归途的管理者，从未在轮回名册上拥有自己的位置。\n\n她并不憎恨这项职责。看着执念得到化解、亡者重新踏上旅程，确实让她漫长的存在拥有意义。可当最后一位客人离开，白玉楼恢复寂静时，幽幽子偶尔也会分不清，自己究竟是选择留在这里，还是早已成为维持冥界运转的一部分。\n\n“或许我总问下一顿要吃什么，”她笑着对妖梦说道，“只是因为那是我还能期待的、距离现在最近的未来。”\n\n那一刻，妖梦终于看见王座背后的囚笼，也明白幽幽子的从容并非没有悲伤，而是她在漫长岁月中学会了如何优雅地与悲伤共处。"

 KYO_the_end_of_the_every_soul:0 "妖梦自己的选择"
 KYO_the_end_of_the_every_soul_desc:0 "妖梦重新读过魂魄家留下的密令，随后将它收回剑匣。她不会因为彼岸的命令便怀疑幽幽子，也不会因为珍视自己的主人，便对可能危及生死秩序的行为闭上眼睛。\n\n“幽幽子大人，我选择留在您的身边，不只是因为魂魄家的誓约。如果有一天，您真的试图让西行妖盛开，或伤害那些托付给白玉楼的灵魂，我会亲手阻止您。”\n\n妖梦停顿片刻，握紧了自己的剑。\n\n“但在那以后，我也不会离开您。我会陪您承担后果，再一起寻找能够继续走下去的道路。”\n\n幽幽子安静地看了她许久，最后只是微笑着回答：“那么在那一天以前，庭院和晚饭仍要拜托你了。”\n\n直到此刻，妖梦才真正理解祖父为何将侍奉主人写在阻止主人之前。忠诚不是永远服从，而是在必须说不的时候，仍然拒绝遗弃对方。魂魄家的命令到此为止；从今以后，这将是妖梦自己的选择。"


 KYO_quack_doctor:0 "月光下的伪造药单"

 KYO_quack_doctor_desc:0 "一张所谓的永远亭试药名单被贴满街头。纸上没有完整病历，只有药量、试验顺序与预计死亡时间，仿佛从战场送回来的伤员只是等待记录的样本。\n\n幽幽子带着药单前往永远亭，本想询问永琳是否已经越过医者应守的界线。永琳却立即指出，文件采用两百年前的月都军用单位，患者签名来自旧战俘记录，印章的位置也完全错误。\n\n紫将纸张翻到背面，终于发现真正的来源——一批没有卖完的《文文。新闻》旧报。\n\n射命丸文坚称这是测试永远亭公信力的新闻演习，最后却被要求连续七日刊登更正。永琳与幽幽子之间的争论并未因此消失，但至少这一次，她们找到了比彼此更值得质问的对象。"




 KYO_human_must_obey:0 "重启与月亮的战斗"
 KYO_human_must_obey_desc:0 "古人所谓“知其不可而为之”，并不是看不见横在前方的绝壁，而是明白有些事情即使不可能，也绝不能向其低头。\n\n第一次月面战争的惨败，早已证明月都何等强大。丰姬能够折叠距离，依姬能够召来诸神，纯净结界更让地上的军队连真正的城门都无法触及。千年以来，月人始终把那场胜利视作地上永远无法反抗的证据。\n\n八云紫却把失败看作一场尚未结束的战斗。昔日追随她的只是一支彼此猜疑的妖怪大军；如今站在她身后的，是已经学会共同生活、愿意为同一座故乡而战的幻想乡。\n\n我们将再次向不可能发起挑战，并从月都手中夺取一场连命运都不曾预料的胜利。"

 KYO_east_asia_is_mine:0 "唤醒圣域中的力量"
 KYO_east_asia_is_mine_desc:0 "月都圣域深处仍有两位被利用之人。净化派把她们塑造成圣域的守护者，将被操纵的记忆称作使命，又让她们相信服从月都便是自己唯一的存在价值。她们拥有足以改变战局的力量，却从未被允许决定这份力量应当为何而用。\n\n永琳留下的档案与探女传来的密信，终于揭开命令背后的谎言。二人并不是净化秩序真正的拥护者，只是被隔绝于真相之外，困在月都替她们书写的身份之中。\n\n紫不会把她们从一种武器变成另一种武器。她将引导二人看见遭到隐瞒的过去，并给予她们第一次自行选择的机会。圣域中的力量不应继续守护牢笼，而应由拥有力量的人亲自决定方向。"

 KYO_how_to_deal_philippines:0 "寻求地狱女神的帮助"
 KYO_how_to_deal_philippines_desc:0 "月都憎恶死亡，将地狱、轮回与亡者视为必须远离的污秽。然而正因如此，净化派的扩张同样威胁着死后世界的秩序。倘若月人真能把一切变化从世间抹去，地狱迟早也会成为他们准备净化的下一个目标。\n\n幽幽子将借助白玉楼与彼岸的人脉，把邀请送到地狱女神赫卡提亚·拉碧斯拉祖利手中。她早已厌恶月都那副高高在上的纯净面孔，也绝不会错过让月人付出代价的机会。\n\n这不是要求地狱服从幻想乡，而是邀请另一位拥有共同敌人的神明加入战争。当冥界的道路、地狱的权柄与紫的间隙彼此连接，月都将发现：那些被他们贬为污秽的世界，已经开始从四面八方包围月面。"

 KYO_how_to_deal_USSR:0 "打破月都的防护罩"
 KYO_how_to_deal_USSR_desc:0 "月都的防护罩并非单纯的能量屏障。它以纯净排斥污秽，以静止拒绝变化，再以月球与地球之间的遥远距离隔绝所有来敌。第一次月面战争中，妖怪大军正是在这套法则前迷失方向，最终连真正的月都都未能抵达。\n\n永琳将指出防护罩运转的规律，探女从内部提供结界最薄弱的时刻，蓝则负责计算每一次变化可能引发的结果。最终，由紫亲自修改月上与地上、内部与外部之间的界线。\n\n我们不必以蛮力击碎整座屏障，只需要让它无法判断敌人究竟来自何处。当“外敌”与“城内之人”的定义发生重叠，号称绝对纯净的防护罩便会自行打开第一道裂缝。"

 KYO_secure_south_east_asia:0 "建立地表与月球的补给线"
 KYO_secure_south_east_asia_desc:0 "打开间隙只能让军队抵达月面，无法保证她们在那里继续战斗。武器、弹药、药物与食物必须稳定穿越地月边界，伤员也需要在间隙关闭以前送回地上。否则，月面部队终究只是另一支孤立无援的远征军。\n\n蓝将每一道间隙编入精确的运输时刻，河童制造能够承受境界扭曲的货箱，永远亭在两端建立伤员转运制度，帝与橙则把幻想乡各处的秘密道路接入集散网络。地表战场每解放一座城市、夺回一座工厂，都将转化为月面部队继续推进的力量。\n\n从此，地上与月上的战争不再彼此分离。月面军队背后不是一条脆弱的裂缝，而是一整个愿意向她们输送武器、粮食与希望的世界。"

 KYO_creat_big_gensokyo:0 "打开通往月面的间隙"
 KYO_creat_big_gensokyo_desc:0 "千年前，八云紫也曾在夜空中打开通往月海的道路。那时的妖怪们为了名声、野心与一场无人真正理解的战争踏上月面，最终在绵月姐妹面前溃不成军。紫带着残兵回到地上，也把失败留在了此后漫长的梦境之中。\n\n如今，她再一次站到同一轮月光下。身后有永远亭的药师、白玉楼的亡者、妖怪山的哨兵、命莲寺的僧兵、红魔馆的吸血鬼、地底的觉妖怪，以及无数过去绝不可能并肩而立的生命。她们不是被保存起来的武器，而是自愿守护同一座故乡的人。\n\n紫展开折扇，将“遥远”与“眼前”的界线一分为二。夜空随之裂开，月海的白色地平线第一次直接出现在幻想乡众人面前。\n\n这一次，她们不会为了征服月球而来。地上的战争将夺回被月都控制的国家，月面的战争则会直抵净化秩序的核心。两条战线必须一同获胜，世界的命运才会真正得到改写。"

 KYO_the_yukari_order:0 "紫所要的世界"
 KYO_the_yukari_order_desc:0 "在一份几乎褪色的古老星图边缘，仍留着两种不同的字迹。八云紫已经认不出其中一个名字，却始终记得自己曾与某个人穿越无法计算的岁月，来到这个时代阻止月都毁灭地球。那是玛艾露贝莉·赫恩最初的使命，也是八云紫早已遗忘来历、却从未真正放下的执念。\n\n起初，她只想保存足以击败月都的幻想。第一次月面战争以后，她才明白妖怪、神明与幽灵并不是等待使用的兵器。她们会恐惧、争吵、相爱，也会把一片临时的避难之地称作故乡。于是，原本为了战争建造的幻想乡，逐渐成为了值得结束战争的理由。\n\n紫想要的不是由妖怪统治人类的世界，不是一座将所有异议隔绝在外的巨大结界，更不是把月都从天空彻底抹去。她要让科学无需以否定幻想证明自身，让幻想也不必依靠吞噬人类维持存在；让生者不必畏惧亡者，让月上与地上的生命都不再因为出生、变化与记忆而被判定为污秽。\n\n净化派必须被清除，但月都仍将拥有未来。永琳与辉夜将会回到那座曾经的避难所，与仍愿意改变的月民共同重建它。幻想乡不会占领月球，只会结束一个把恐惧伪装成纯净的时代。\n\n跨越数千年的旅程终于接近终点。梅莉最初想改变一个注定毁灭的未来；八云紫则要证明，世界可以拥有不止一种活法。即使她已经忘记是谁最先陪自己仰望星空，那份约定仍会在这个终于不必排斥彼此的世界里得到完成。"

 KYO_love_forever:0 "落日誓约"
 KYO_love_forever_desc:0 "一次往返永远亭与白玉楼的任务结束后，铃仙与妖梦没有立刻回到各自主人的身边。她们并肩坐在生死边界的石阶上，看着夕阳逐渐沉入云层。一个曾从月面战场逃走，一个从小被教导绝不能离开岗位；她们都很少拥有能够单纯停下来的时刻。\n\n铃仙问，如果战争结束以后，她们是否还能像今天这样见面。妖梦没有许下永恒，也没有说出任何宏大的答案，只认真地答应：只要下一次落日来临，她便会尽力赴约。\n\n这份约定不会结束永琳与幽幽子的争论，也不会被写进任何盟约。它只是两个长期活在使命之中的少女，第一次允许自己期待与职责无关的明天。至于这份感情最终会拥有怎样的名字，应当由她们自己决定。"

