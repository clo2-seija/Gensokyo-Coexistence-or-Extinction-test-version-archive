 Renko_LUN_lunarian_manufacturing_organization:0 "月人制造"
 Renko_LUN_lunarian_manufacturing_organization_desc:0 "月都的军械工坊以统一的制造定式统合陆海空军装备。从侵军的单兵武器到跨海舰队与远程飞行器，每一件成品都经过精密加工与净化检验，为月人指挥下的军势提供可靠而高效的军备。"
 Renko_LUN_lunarian_manufacturing_initial_trait:0 "高天原制造商"
 Renko_LUN_lunarian_craftsmanship_policy:0 "月人工艺"
 Renko_LUN_lunarian_craftsmanship_policy_desc:0 "以月人的精密工艺与材料统筹，提高装备可靠性并减少生产资源消耗。"
