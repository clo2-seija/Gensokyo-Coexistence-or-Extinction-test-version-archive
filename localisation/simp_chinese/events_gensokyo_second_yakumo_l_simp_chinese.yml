l_simp_chinese:

yakumo.1.t:0 "八云之家"

 yakumo.1.d:0 "雨从傍晚一直下到入夜。八云蓝坐在矮桌前，将粮食、药品与可用车辆逐项列好，又在地图上划出三条撤离路线。\n\n「照这个安排，天亮以前可以接走一百六十二人。」\n\n房门忽然被推开。橙浑身湿透地跑进屋内，两条尾巴还滴着水。\n\n「是一百七十三人。」\n\n她将一张揉皱的纸摊到桌上。上面没有规整的表格，只有十一名住在山脚、尚未被统计的居民：不愿丢下旧屋的木匠、腿脚不便的老妇、几只尚未登记的幼小妖怪，还有一个高烧不退的孩子。\n\n蓝看完以后皱起眉：「这些住处不在原定范围内。通往那里的木桥也已经断了。」\n\n「所以我绕过去看了。」橙指着纸上的几道墨线，「果园后面还有一条小路。很窄，但我走得过去。」\n\n「你独自穿过了正在涨水的山沟？」\n\n蓝的声音冷了下来。橙缩了缩脖子，却没有收回那张纸。\n\n「他们真的在那里。」\n\n蓝沉默片刻，先扯来干布裹住橙的头发，才将原先的计算全部划去。\n\n「坐好，把沿途看见的坡度、积水和倒木重新说一遍。一处也不许省略。」\n\n紫始终坐在桌子另一端。她没有催促，只在橙说得含糊时询问几句，在蓝重新核算后又确认了剩余的药量。\n\n等两人的说法终于能够落在同一张图上，紫才开口：「南面的车队抽出两辆，先送药，再接行动不便的人。蓝负责改道，与白狼天狗协调沿途护送。」\n\n她随后看向橙：「明早由你带路。」\n\n橙立即挺直身体，蓝却摇头：「那段山沟还可能再次坍塌。」\n\n「所以让她带上两名护卫。」紫说道，「她熟悉那里的人，也知道哪一扇门必须亲自敲开。」\n\n橙刚要高兴，紫又补了一句：「但不准再独自涉水。要接回的人里，也包括你。」\n\n名义上，蓝是紫的式神，橙又是蓝的式神。到了八云家的桌边，命令却不只从上往下传递。蓝让每件事都有可行的方法，橙将被忽略的声音带回家中，而紫听完两边，决定八云家接下来要走向何处。\n\n蓝在新路线旁写下最后一个数字。橙裹着干布，悄悄挤到她的尾巴旁取暖。紫看了她们一眼，将那十一人一并添进救援范围。"

 yakumo.1.a:0 "先把那十一人接回来。"

 yakumo.2.t:0 "折扇边缘的陌生星图"

 yakumo.2.d:0 "这原本只是八云家再寻常不过的傍晚。\n\n蓝站在灶台前清点食材，认真宣布今晚还能做油豆腐。橙趴在桌边，当场发出一声长长的哀号。\n\n「昨天是豆腐汤，前天是炸豆腐，上次休息又吃了油豆腐！」\n\n蓝纠正道：「前天用的是甜酱，上次加了山椒，做法并不相同。」\n\n「吃起来还是豆腐！」\n\n紫坐在一旁，半掩着折扇看她们争论。橙坚持今晚应该吃鱼，蓝则开始计算现有存粮还能搭配多少种菜色。两人的声音挤在并不宽敞的屋里，吵闹，却也让这个家显得比平日暖和许多。\n\n紫正要替晚饭作出决定，扇面边缘忽然闪过一点微光。\n\n屋内的灶火、桌椅与争吵声在一瞬间退去。陌生的星空铺展在她眼前，群星之间画满经纬、时刻与细密的修正线。远处似乎坐着两个人，桌上放着尚未喝完的茶，其中一人正在用笔追逐另一人指出的星辰。\n\n紫骤然合起折扇。\n\n数道间隙同时在屋内张开。她检查了结界、庭院与附近残留的妖力，却没有发现任何入侵者。蓝立即放下手中的食材，橙也从桌边坐直。\n\n「紫大人，有人在干涉这里？」蓝问。\n\n「暂时没有。」\n\n紫重新展开折扇。扇面依旧陈旧，既没有星光，也没有那些纵横交错的线。只有她的手指仍停在某颗不存在的星旁，仿佛曾经无数次沿着相同方向寻找答案。\n\n「或许只是最近没有睡好。」橙小声说道。\n\n蓝显然不接受这种解释，已经准备取来纸笔记录刚才发生的一切。紫却将折扇收进袖中，没有让她继续。\n\n「不必查了。无论是谁留下的，它都已经过去很久。」\n\n她看向仍摆在灶台上的豆腐，又看了看满脸期待的橙。\n\n「今晚吃鱼。油豆腐只能当配菜。」\n\n橙立刻欢呼起来。蓝沉默片刻，转身重新安排晚饭。\n\n屋里很快恢复了方才的喧闹。紫没有再次打开那把折扇，也没有告诉她们，那片陌生的星空曾让她感到近乎失而复得的怀念。"

 yakumo.2.a:0 "让那片星空留在过去。"

yakumo.3.t:0 "神前之誓"

yakumo.3.d:0 "玲未穿着尚不合身的红白衣装，独自走到博丽神社的神前。铜铃响起后，一道无人能够辨认的声音从风中传来。\n\n「你生为人类，却由妖怪养大。若两者发生争斗，你要站在哪一边？」\n\n玲未握紧御币。\n\n「我会站在正在被伤害的人身边。养育我的妖怪若伤害无辜，我会阻止他们；人类若因恐惧迫害妖怪，我也不会沉默。」\n\n「若人类、妖怪与贤者都要求你服从呢？」\n\n「我会听他们说完，但不会把判断交给最强的人。」她回答，「如果我错了，我愿意接受纠正；如果他们错了，即使只剩我一个人，我也会挡在前面。」\n\n神社恢复寂静。片刻以后，沉寂的大结界重新发出回应，前任巫女留下的力量沿御币流入玲未体内。\n\n少女向神前俯身。\n\n「我，博丽玲未，今日继承博丽之名。我无法保证永远正确，但我发誓，不会因为任何人的身份，预先决定谁应当被舍弃。」\n\n铜铃再次响起。第四十五任博丽巫女，就此得到神灵的承认。"

yakumo.3.a:0 "她以自己的名字立下誓言。"

#  yakumo.4.t:0 "结界覆盖大地之日"
#  yakumo.4.d:0 "大幻想乡结界闭合时，十处曾经破裂的节点依次亮起。庆典的灯火从人间之里延伸到妖怪山，许多人以为漫长危机终于结束。\n\n紫却在结界外缘听见同一段月面脉冲。数个遥远首都的无线电、军令网与外交电文同时出现相同的停顿，仿佛整颗地球在同一秒抬头望月。结界保护了故乡，却也让月都确认必须公开出手。"
#  yakumo.4.a:0 "真正的战争才刚刚显形。"

 yakumo.5.t:0 "此世与彼岸的两份回答"

 yakumo.5.d:0 "永琳带来了一叠诊疗记录。里面的人都曾徘徊在生死之间，有些最终康复，有些至今仍未醒来。\n\n「伤势严重，不等于已经无救。」她说道，「疼痛、恐惧与药物都会影响判断。只要病情仍有转机，医者就应当先稳定伤势，让病人在清醒以后重新作出决定。」\n\n幽幽子带来的则是亡者留下的书信。有人希望骨灰送回故乡，有人不愿再接受只会延长痛苦的法术，也有人到最后都没能把想说的话交给亲属。\n\n「死亡不是能够随意催促的事情，也不是必须藏起来的失败。」幽幽子说道，「当治疗已经无法使人康复，只能延长最后的痛苦时，就该让本人知道实情。是否继续，不应由害怕告别的亲属替他决定。」\n\n永琳担心的是过早放弃。她见过伤员在高烧与剧痛中请求结束一切，数日后却庆幸医者没有照做。一次无法收回的判断，可能夺走原本存在的明日。\n\n幽幽子在意的则是另一种伤害。她见过治疗早已失去意义，亲属仍要求不断施术，只因为谁也不愿承认离别已经来到。病人被留在床上，却再也没有机会安排自己的最后时光。\n\n紫问道：「那么，什么时候才能停止治疗？」\n\n永琳回答：「先确认病情已经无法逆转，再确认病人神志清醒，也充分理解选择的结果。在这以前，我会继续救治。」\n\n幽幽子接着说道：「若这些条件都已确认，就应当尊重他的决定。我们可以陪他、减轻痛苦、完成未尽之事，却不能因为自己不愿失去，便要求他继续承受。」\n\n两人的分歧不在于生命是否珍贵，而在于应当坚持到何时。永琳宁愿多争取一次可能，也不愿让绝望抢先作出判断；幽幽子则认为，当可能已经耗尽，坦然承认终点也是对生命的尊重。\n\n紫没有立即裁定。幻想乡必须决定，此刻应当优先争取尚未消失的明日、尊重已经清楚作出的选择，还是让两份答案共同成为彼此的界线。"

 yakumo.5.a:0 "不可轻弃生者，也不可替他人决定终点。"
 yakumo.5.b:0 "此刻先采用永琳的方案。"
 yakumo.5.c:0 "此刻先采用幽幽子的方案。"
 
 yakumo.6.t:0 "月之贤者与地上公主"

 yakumo.6.d:0 "紫来到永远亭时，诊室里躺着一名身穿白衣的月都使者。\n\n对方是在竹林东侧被发现的。身上没有任何身份证明，只带着追踪符、束缚用的银线，以及一支足以让妖怪魂魄停止活动的药针。铃仙将他制服时，他还试图咬碎藏在牙后的毒囊。\n\n永琳刚替他处理完伤口。她把染血的器具放进托盘，吩咐妖兔将人关进内院，在对方恢复意识以前不得审问。\n\n紫看了一眼桌上的银线：「月都派人来接你们回去了？」\n\n辉夜坐在窗边，忍不住笑了一声。\n\n「月都从未承认我们离开，又怎么会公开接我们回去？」\n\n永琳擦净双手，纠正道：「我们的去向被列为最高机密。宫中没有追捕告示，公开文书也不会出现我们的名字。」\n\n「因为无法承认？」紫问。\n\n「因为太难看。」辉夜替她回答，「月都内战结束以后，大贤者带着公主离开了。若这件事传出去，所有人都会开始追问：究竟发生了什么，才会让月都最古老的大贤者放弃自己参与建立的一切？」\n\n紫重新看向永琳：「大贤者？」\n\n「以前的职务而已。」永琳答得平淡。\n\n辉夜却没有让她这样带过：「月都至今仍在使用她制定的医术、历法与工造标准。那些人可以封存她的名字，却不能把她从月都的根基里挖出去。」\n\n永琳没有反驳，只将使者携带的物品逐件排开。追踪符负责寻找目标，银线用于拘束，最后那支药针则不会留下明显伤痕。\n\n「过去来到地上的使者，有些负责监视，有些试图强行带我们回去，也有一些只想确认秘密不会开口。」她说道，「他们不会携带正式命令。月都不会为三个不存在的人留下命令。」\n\n紫问道：「你们为何离开？」\n\n诊室安静了片刻。\n\n「内战结束以后，月都已经没有我们能够安全留下的位置。」永琳说道。\n\n辉夜望向竹林之外：「所以在他们替我们决定结局以前，我们先选择了地上。」\n\n紫又看了一眼昏迷的使者。\n\n「月都在公开记录里抹去了你们，却仍不断派人前来寻找。」\n\n「这样最方便。」永琳收起那支药针，「月面继续保持纯洁，所有不能见光的事情则在地上处理。」"

 yakumo.6.a:0 "三个不存在的人，仍被月都追赶。"

 yakumo.7.t:0 "月兔老兵与地上妖兔"

 yakumo.7.d:0 "永远亭后院的训练又被妖兔搅得一团混乱。铃仙下意识地喊出月面军队的整队口令，四周却没有一只兔子听得懂。\n\n因幡帝坐在围墙上问道：「你是在生气，还是在羡慕她们？」\n\n「羡慕。」铃仙望着那些擅自离队、又笑着跑回来的妖兔，「她们不知道那句命令意味着什么。」\n\n她没有继续谈论第一次月面战争，只说自己曾相信服从能够换来安全。直到真正走上战场，她才看见长官如何计算伤亡，也看见月都怎样把幸存者的记忆改写成一场伟大胜利。\n\n远处又有一只妖兔翻过围栏。铃仙看见了，这次却没有吹响集合哨。\n\n「至少在地上，她们可以自己决定什么时候回来。」"

 yakumo.7.a:0 "她们至少可以决定相信什么。"

 yakumo.8.t:0 "永远亭在幻想乡的位置"

 yakumo.8.d:0 "《文文。新闻》将一个问题送到了人里：永远亭究竟是什么？医馆、月面流亡者的住所，还是竹林中的另一座政府？\n\n慧音给出了最完整的回答。\n\n「历史不会因为当事人沉默就消失。永远亭出现前后的记录有许多断层，但我知道他们来自何处，也知道月都曾派人进入竹林。」她说道，「他们救治地上的居民，却仍保留月都的技术、秩序与秘密。把永远亭只当成医馆，是看得太浅。」\n\n妹红的回答则简单得多。\n\n「一群把竹林当成自家后院的月面人。永琳的药可以拿，她说的话别全信。至于辉夜——把她的名字从报道里删掉。」\n\n米斯蒂娅承认，夜摊的客人出了问题，多半还是会被送往永远亭；莉格露却抱怨妖兔的巡逻队经常惊动虫群，还会封锁她们熟悉的小路。\n\n射命丸文最终写道：永远亭能够救人，也藏着足以令人不安的过去。幻想乡需要它，却还没有决定该如何看待它。"

 yakumo.8.a:0 "医馆之外，还有一段被藏起的历史。"

  yakumo.9.t:0 "月都最初是一座避难所"

 yakumo.9.d:0 "紫跟着永琳走进永远亭最深处的藏室。门后没有药柜，只有一只被数层封印包住的木匣。永琳从中取出一册纸页发黄、书脊几乎散开的古书。\n\n「《神灵史记》。」她将书放到灯下，「世上最后一本没有经过月都删改的原本。」\n\n书中没有纯净之都的颂词。最初的月面居民不是天选之民，而是一群逃离战争、疫病与信仰衰退的地上避难者；所谓纯净，也不过是防止灾祸进入居住区的方法。\n\n永琳又取出一本月都通行史。相同的开端已被改写，地上移民的姓名遭到删除，临时规章则成了自古存在的天理。\n\n「每一次改变都有合理的理由。」永琳按住两本史书，「我想让你看看，一座避难所是怎样变成今日的月都。」"

 yakumo.9.a:0 "把月都删去的开端说完。"
 
 yakumo.10.t:0 "冥界"

 yakumo.10.d:0 "紫越过生与死的境界，沿着望不到尽头的石阶来到白玉楼。无数尚未进入轮回的幽灵停留于此，等待放下姓名、遗憾与最后的执念。\n\n「这里不是地狱，也不是彼岸。」西行寺幽幽子展开折扇，「只是让亡者在继续上路以前，暂时歇脚的地方。」\n\n她曾经也是人类，却在死后失去了关于结局的记忆。如今，她替每一位来到冥界的亡者安排归途，自己却始终没有离开。\n\n紫望向庭院深处那棵从未完全盛开的巨樱。幽幽子顺着她的目光看去，笑容没有改变。\n\n「那棵树下有什么？」紫问。\n\n「若我知道，就不会让你问得这么容易了。」\n\n亡灵公主仍在微笑。藏在西行妖下的过去，却没有随她一同开口。"

 yakumo.10.a:0 "离开尘世的人，也应当有所归处。"

 yakumo.11.t:0 "橙，你的使命"

 yakumo.11.d:0 "那天夜里，紫与蓝一同将橙叫到八云邸最深处。屋内没有地图，也没有尚待处理的公文，只有一道安静悬在半空中的境界。\n\n紫伸出手，从境界中取出一团微弱的紫光，轻轻按入橙的胸口。\n\n「若有一天，我与蓝都没有回来，这份力量便会苏醒。」\n\n橙低头看着自己的双手：「要我替你们继续战斗吗？」\n\n「不。」紫答道，「是让你关闭失控的境界，保护还能回家的人，并在无路可走时，亲手开出一条路。」\n\n蓝蹲下身，替橙整理好衣领。\n\n「继承力量，不代表你必须成为紫大人，也不必变成我。先判断危险，再寻找帮助；无法取胜就撤退，受伤便回家。绝不允许为了证明忠诚而舍弃性命。」\n\n橙的耳朵垂了下来：「可是，如果你们都不在，哪里还是我的家？」\n\n蓝一时没有回答。紫则将手放在她头上。\n\n「你曾在雨里等过一个不会来的人，所以我们更不能让你再次回到那里。八云邸是你的家，你认识的朋友也是。点亮灯、好好吃饭、照顾自己，再替下一个迷路的孩子打开门——这就是你的使命。」\n\n紫没有要求橙守住八云家的名字，也没有命令她为任何人牺牲。她留给橙的最后一道命令，仅仅是活下去。\n\n橙擦掉眼泪，用力点了点头。\n\n「我会守住回家的路。也会一直把灯点着。」"

 yakumo.11.a:0 "即使我们不在，也要好好活着。"

  yakumo.12.t:0 "留下并非因为命令"

 yakumo.12.d:0 "蓝将危险的转移方案放到紫面前，并在执行者一栏写下自己的名字。紫看完计算，没有批准，只用折扇将那个名字划去。\n\n「这是成功率最高的方案。」蓝说道。\n\n「可承担，不代表必须由你赴死。」\n\n这句话让蓝想起了她们最初的相遇。\n\n那时，她还不是八云蓝，只是一只在畜生界各方势力之间寻找生路的九尾狐。畜生界的道路分别掌握在不同组织手中，货物、情报乃至亡魂想要通过，都必须交出利益。蓝不愿永远听命于它们，于是花费数月测量界线，准备秘密打通一条连接地上的走私通道。\n\n通道开启的那一刻，所有坐标却同时失效。紫坐在出口另一侧，脚边放着蓝准备运走的第一批货物。\n\n「计算得不错。」紫说道，「只是你把幻想乡算成了无人之地。」\n\n蓝知道自己已经失败。她没有求饶，只平静地说明路线、用途与背后的参与者，试图证明留下自己比杀死自己更有价值。\n\n紫却只问：「为何非要开这条路？」\n\n「因为畜生界没有不属于强者的道路。」蓝回答，「若不想被任何一方吞掉，就必须拥有自己的出口。」\n\n紫告诉她，自己正在建立幻想乡。那里将收容被现实排斥的妖怪、神灵与异类，不询问它们是否足够强大，也不准任何势力把弱者当成财产。这样的地方需要结界，也需要有人计算道路、资源与无数可能出现的错误。\n\n蓝听完后说道：「它迟早会崩溃。」\n\n「那么留下。」紫看着她，「算出它为何崩溃，再阻止那一天到来。」\n\n紫没有命令她成为式神，也没有封死返回畜生界的路。那一夜，蓝重新计算了所有结果。到了清晨，她仍站在原地。\n\n多年以后，紫再次将选择交还给她。\n\n「你最初留下，不是因为服从我。」紫说道，「所以今日，也不必用死亡证明忠诚。」\n\n蓝看着被划去的名字，沉默片刻，取回方案。\n\n「明白。我会准备第二种办法。」"

 yakumo.12.a:0 "可承担，不等于必须赴死。"

 yakumo.13.t:0 "月光下的伪造药单"

 yakumo.13.d:0 "一夜之间，幻想乡的街口贴满了《文文。新闻》号外。报纸宣称永远亭正在拿不同派系的伤员试药，旁边还附有一张盖着月兔军医印章的试验名单。\n\n幽幽子带着报纸来到永远亭，开口便问：「如果我自愿参加，试药期间供应点心吗？」\n\n永琳没有回答。她只看了一眼，便指出药量采用的是两百年前的月都军用单位，其中三名患者的签名来自旧战俘记录，还有一人的死亡日期甚至早于出生日期。\n\n紫将报纸举向灯火，纸张背面逐渐透出几个反写的大字——《文文。新闻·春季赏花特刊》。显然，伪造者为了节省纸张，直接拿卖不完的旧报印制证据。\n\n房梁上随即传来快门声。\n\n射命丸文从屋顶探出脑袋，坚持这不是造谣，而是一场测试永远亭公信力的「新闻演习」。她还声称，读者踊跃讨论便证明报道具有公共价值。\n\n「更正启事，明日头版。」紫说道。\n\n「字体必须与原来的标题一样大。」永琳补充。\n\n幽幽子打开折扇：「还要注明试药不供应点心，免得继续误导读者。」\n\n一场足以破坏救援合作的风波，最后变成了射命丸文连续七日占用头版向永远亭道歉。唯一真正受到伤害的，大概只有《文文。新闻》的纸张库存。"

 yakumo.13.a:0 "下次伪造证据，记得别用自家的旧报纸。"
 yakumo.13.b:0 "臭天狗。"


 yakumo.14.t:0 "不存在的召魂命令"

 yakumo.14.d:0 "药单风波结束不到三日，另一份《文文。新闻》号外又出现在永远亭门前。这次报纸声称白玉楼扣留月面战争的阵亡者，并以归还魂魄为条件，迫使家属接受冥界统治。\n\n妖梦检查所谓召魂令，发现白玉楼的印章上下颠倒，日期使用月都历法，连公文格式都是从永远亭药单照抄而来。\n\n幽幽子翻阅亡者记录，很快找到更直接的破绽。\n\n「这位遭到扣留的月兔，好像还活着呢。」\n\n众人一同看向铃仙。铃仙拿过报纸，确认上面的确是自己的军籍编号。\n\n「我不记得自己什么时候阵亡了。」\n\n紫又将纸张翻到背面。这次透出来的是《文文。新闻》的订阅价格表。\n\n被请进屋内的射命丸文对此振振有词：「上一篇质疑永远亭，这一篇当然要质疑白玉楼。两边都写，才叫新闻公正。」\n\n「两边都造谣，不会让你变得公正。」紫回答。\n\n幽幽子倒没有生气，只提议让文亲自到白玉楼核对每一位亡者的去处。妖梦随即搬来足足十二箱记录，整齐放在记者面前。\n\n文盯着那堆比自己还高的文件，终于承认这次采访或许准备得不够充分。\n\n此后一个月，《文文。新闻》再也没有刊登过白玉楼扣留亡者的消息。据说射命丸文只核对到第三箱，便开始认真思考新闻伦理。"

 yakumo.14.a:0 "同时得罪两边，也算不上不偏不倚。"
 yakumo.14.b:0 "笨天狗。"


 yakumo.15.t:0 "妖怪怀里的人类孩子"

 yakumo.15.d:0 "十五年前，一名年老的伞妖在废弃驿站里发现了一个人类婴儿。她被裹在湿透的布中，哭声已经十分微弱，附近没有父母，也没有人前来寻找。\n\n伞妖不懂如何照顾人类，只能把她抱回妖怪聚落。兽妖负责寻找羊乳，草木妖怪替她熬药，几只小妖轮流守在摇篮旁，生怕这个过于脆弱的生命熬不过夜晚。\n\n有人主张将孩子送回人里，也有人担心人类会以此为由袭击聚落。但每次争论结束，仍会有妖怪替她盖好被子。久而久之，再也没有谁提起将她送走。\n\n一位认识人类文字的老妖怪替她取名玲未，希望这个孩子不必由出身决定未来。她学会说话时，最先喊出的不是父亲或母亲，而是聚落里那些奇怪而又亲切的称呼。\n\n紫曾在巡视结界时见过她。年幼的玲未正躺在伞妖怀里，伸手抓住一只兽妖的耳朵。那时博丽神社仍有巫女，幻想乡也不需要另一名继承者。\n\n紫没有带走她，只在聚落外围补上一道抵御野兽的结界。\n\n这个人类孩子应当先拥有自己的人生，而不是在尚未学会走路以前，就被贤者写进某种安排。"

 yakumo.15.a:0 "在成为巫女以前，她先是被妖怪养大的孩子。"


 yakumo.16.t:0 "她所理解的朋友"

 yakumo.16.d:0 "玲未在人类与妖怪的猜疑中长大。进入人里时，有人称她是被妖怪迷惑的孩子；回到聚落以后，也有年轻妖怪怀疑她迟早会站回人类一方。\n\n她没有力量证明任何事情。发生争执时，她无法夺走武器，也挡不住真正愤怒的人。她能做的只有替受伤者包扎、把躲起来的孩子带走，再一遍遍告诉双方，眼前的人并不等于关于整个种族的传闻。\n\n一次，人类巡逻队误将兽妖的搬运队视为袭击者。枪声响起后，一名年轻妖怪扑倒了落单的士兵，准备为受伤同伴报复。玲未冲到两者之间，却被轻易推倒在地。\n\n她没有请求妖怪看在人情上放过士兵，也没有替首先开枪的人类辩解。\n\n「他开枪伤人，所以必须被追究。」她指向巡逻队，又转向压住士兵的妖怪，「但他现在已经没有武器。你再动手，就轮到你在伤害别人。」\n\n玲未无法强迫任何人听从。她只能跪在伤员旁边，拒绝让路。最终，双方还是放下了武器，不是因为害怕她，而是因为谁也不愿成为第一个将这个毫无力量的孩子推向枪口的人。\n\n从那以后，玲未逐渐明白：朋友不是永远正确的人。真正将对方视为朋友，便不能在他伤害无辜者时保持沉默；阻止、救治与追究，可以同时发生。\n\n她没有终止人妖之间的争端，却已经习惯站在争端最先抵达的地方。"

 yakumo.16.a:0 "朋友犯错时，也必须有人阻止他们。"


 yakumo.17.t:0 "紫的眼光"

 yakumo.17.d:0 "第四十四任博丽巫女死后，紫再次来到那座隐藏在废弃驿站后的聚落。十五岁的玲未正在替老伞妖修补伞骨。\n\n蓝并不认同紫的选择。玲未没有接受过系统的灵力训练，也从未独自处理真正的异变。让她继承博丽之名，无论如何计算都过于危险。\n\n「我看中的不是她现在拥有多少力量。」紫说道，「而是当力量不对等时，她仍会判断是谁正在伤害谁。」\n\n「善良不足以维系大结界。」蓝回答。\n\n「所以她还需要学习。」\n\n橙听完两位大妖怪的讨论，忍不住插嘴：「你们为什么不先问玲未愿不愿意？」\n\n紫沉默片刻，收起原本准备好的任命文书，亲自走进聚落。\n\n玲未得知来意后没有立刻答应。她只问紫，博丽巫女究竟是在保护人类，还是在管理妖怪。\n\n「都不是。」紫回答，「她要阻止任何一方越过不能越过的界线。有时对手是妖怪，有时是人类，有时也会是贤者。」\n\n玲未看着自己那双连年轻兽妖都无法制伏的手。\n\n「如果力量只是让我帮助一边打败另一边，我不想要。」\n\n「如果它能让双方先停下来呢？」\n\n玲未没有作出决定。紫也没有催促，只邀请她去见最后一个真正能够说明博丽职责的人。\n\n那份任命文书仍然留白。因为紫可以挑选候选者，却不能替玲未决定她的一生。"

 yakumo.17.a:0 "在作出选择以前，她必须知道自己将继承什么。"


 yakumo.18.t:0 "红白之衣"

 yakumo.18.d:0 "紫带着玲未与前任遗留在神社的折断御币越过生死境界，在白玉楼见到了尚未前往轮回的第四十四任博丽巫女。\n\n她并不像传说中的英雄，只是一名神情疲惫的年轻女子。\n\n前任巫女问玲未：「你认为博丽巫女应该保护人类不受妖怪伤害吗？」\n\n玲未摇头：「她应该保护正在被伤害的人。」\n\n「如果伤人的妖怪是养育你的家人？」\n\n玲未沉默许久。\n\n「我会阻止他们。事情结束以后，再陪他们一起承担结果。」\n\n前任巫女终于笑了。\n\n她告诉玲未，博丽之名不会让所有人信任她。人类会指责她偏袒妖怪，妖怪也会憎恨她维护人类；贤者需要她稳定结界，却可能在她拒绝命令时将她视为阻碍。\n\n巫女必须维护大结界、处理异变并制止越界者。她可以听取贤者的建议，却不属于八云家；她出生为人类，也不能因此把人类预先判定为无罪。\n\n玲未问道：「你后悔成为巫女吗？」\n\n「后悔过很多次。」前任巫女坦然回答，「但如果没有人站在中间，最后便只剩最强的一方有资格说明什么是正确。」\n\n她将残余的灵力附在紫带来的御币上。\n\n「红白衣装不是奖赏。穿上它，就意味着即使两边都要求你让路，你仍然必须站在那里。现在，你还愿意继承吗？」\n\n玲未握住御币，第一次真正理解了博丽巫女为何总是孤身面对异变。\n\n「我愿意。但我会用自己的方法去做。」"

 yakumo.18.a:0 "她所继承的不是服从，而是判断与制止的权力。"


 yakumo.19.t:0 "幻想乐园的巫女"

 yakumo.19.d:0 "博丽神社的鸟居刚被重新扶正，石阶旁仍堆着尚未运走的碎木。人类、妖怪与各方代表聚集在山下，等待幻想乡新的守门人。\n\n十五岁的玲未独自走上石阶。红白衣装略显宽大，折断的御币则已由多多良小伞重新接好。蓝捧来任命文书，橙替她系紧发饰，紫站在鸟居之外，没有替她走完最后几步。\n\n玲未在神前写下自己的名字。\n\n当最后一笔落下，沉寂的大结界重新发出回应。灵力沿着神社地下的结界节点汇入御币，前任巫女留下的力量穿过生死界线，最终停在玲未体内。\n\n她没有立刻变得无所不能。她依旧会害怕，也仍需学习符术、结界与异变的规则。但从这一刻起，她终于拥有了让争斗停下的力量。\n\n玲未拉响铜铃，面对阶下的人与妖。\n\n「我，博丽玲未，今日继承博丽之名。」\n\n「我不会因为对方是人类便认定其无罪，也不会因为对方是妖怪便容许其伤人。任何受到追赶的人都可以来到鸟居之下，任何仗势欺人的家伙也必须在这里停步。」\n\n她停顿片刻，又望向紫与在场的贤者。\n\n「神社不属于任何势力。如果有一天，贤者的命令违背了这些原则，我也会拒绝。」\n\n紫没有反驳，只向众人宣布了她的新身份。\n\n「从今日起，她是第四十五任博丽巫女。」\n\n人类看见了红白衣装，妖怪则认出了那个在聚落里长大的孩子。她同时属于两者，却不再只是夹在两者之间。\n\n新的博丽巫女，将亲自守住那条谁也不得越过的界线。"

 yakumo.19.a:0 "第四十五任博丽巫女——博丽玲未。"


  yakumo.20.t:0 "地上的诸神开始撤离"

 yakumo.20.d:0 "永琳至今仍记得第一张月面轨道图是在何处完成的。\n\n那是一座被战争烧毁的神殿。屋顶已经坍塌，神像倒在灰烬里，几名失去信徒的神祇守着最后一点祭火。地上的战争不断蔓延，疫病、诅咒与信仰衰退则让更多神灵失去形体。即使躲过刀兵，她们也可能在无人记得以后悄然消失。\n\n永琳把轨道图铺在残破的供桌上，提出前往月球。那里远离地上的战场，也没有蔓延各国的疫病与仇杀。她没有许诺永生，只保证避难者能够获得重新生活的时间。\n\n第一批愿意同行的人没有携带军旗。他们带上能够在贫瘠土地生长的种子、保存医术的书籍、祖先留下的祭具，还有记录各自姓名与故乡的石板。\n\n有人问永琳，抵达月球以后是否还会回来。\n\n「当然。」她回答，「避难所不是坟墓。等地上的战争结束，愿意回家的人便应当回家。」\n\n那时的永琳尚未想过建立国家。她只想替那些即将消失的人保住一个明日。"

 yakumo.20.a:0 "月都最初不是王国，而是一条生路。"


 yakumo.21.t:0 "月都最初的建立"

 yakumo.21.d:0 "最初的月面城市没有高墙，也没有悬浮于天际的宫殿。第一代居民使用地上的木构方法搭建房屋，神明、工匠与普通避难者共同排队取水，永琳本人也曾搬运木材、检查水井。\n\n城市最早只有三条共同规则：病患暂时隔离，有限物资依人数分配，任何人不得把地上的战争带进避难区。\n\n当时所谓的纯净，只是清除病源、诅咒与危险神具。隔离结束以后，居民可以自由返回街区；没有人因出生地不同而失去住处，也没有孩子需要证明自己的血统。\n\n一名出生在月面的孩子曾问永琳，地球与月球究竟哪一个才是自己的故乡。\n\n永琳指向远处的蓝色星球。\n\n「你的父母从那里来，而你在这里出生。两者都可以是家。」\n\n城门旁长年点着一盏月灯，为迟来的避难者指示方向。那道光并不是警告地上人远离，而是告诉所有仍在逃亡的人：这里还有位置。\n\n永琳记得那时的月都。正因记得，她才无法把今日的一切说成理所当然。"

 yakumo.21.a:0 "那道月光曾经是为迷路者留下的。"


 yakumo.22.t:0 "纯净成为法律"

 yakumo.22.d:0 "月都的变化并非发生在一夜之间。\n\n一次疫病使隔离期限延长，一场刺杀让守卫开始检查地上来客，物资短缺又促使议会限制新居民进入。每一项修改都有充分理由，也都被称作暂时措施。\n\n然而，隔离区没有再次开放。防疫证明逐渐变成居住资格，前往地表的人必须接受越来越漫长的审查。后来，连他们的子女也被要求居住在指定区域，因为纯化院认为污秽可能沿血统延续。\n\n永琳签署过最初的隔离命令。她当时相信，只要规则足够准确，恐惧便不会伤害无辜者。等她试图撤回那些措施时，议会只需引用她过去的签名，便能证明一切拥有建立者的许可。\n\n真正令她醒悟的，是一堂儿童课程。教师指着地球的图像，要求学生回答什么是污秽。一名孩子举起手，指向负责打扫教室的地上移民。\n\n没有人纠正他。\n\n永琳终于意识到，纯净已经不再是一种防疫方法。它先成为身份，再成为道德，最后成为决定谁有资格留在城内的法律。\n\n她建立的墙原本用于阻挡战争，如今却开始阻挡所有被掌权者定义为不同的人。"

 yakumo.22.a:0 "临时措施，最终把自己写成了天理。"


 yakumo.23.t:0 "竹取物语抵达月球"

 yakumo.23.d:0 "辉夜在地表的竹林中长大。她记得养父粗糙的双手、屋外竹叶摩擦的声音，也记得那座狭小房屋如何在冬夜替她挡住寒风。\n\n当月都使者确认她拥有古老的月之血统时，辉夜一度以为自己找到了另一个故乡。她登上月船，带着竹林的泥土、养父母缝制的衣物，以及一段后来被地上称作《竹取物语》的往事抵达月球。\n\n迎接她的队伍分成两边。一边跪下，称她为归来的公主；另一边戴上净化面具，唯恐她衣袖上的地表尘埃落到自己身上。\n\n负责接待的官员要求辉夜焚毁来自地上的物品，并在净化仪式中承认养育她的人类只是受污染的暂时监护者。\n\n辉夜拒绝了。\n\n「若他们不曾养育我，你们今日迎接的只会是一具尸体。」\n\n她的存在使月都无法再回避一个问题：如果出生在地球、由人类抚养的女子仍能拥有月之血统，那么纯净究竟来自血脉、居住地，还是掌权者当下需要的解释？"

 yakumo.23.a:0 "她带来的不只是竹香，还有月都不愿回答的问题。"


 yakumo.24.t:0 "地表公主的审判"

 yakumo.24.d:0 "纯化院没有指控辉夜犯下某种行为。审判书上真正的罪证，是她出生于地表、接受人类抚养，并拒绝否认那段生活。\n\n反对审判者从封存档案中找出月都最早的居民记录。上面的名字大多来自地球，其中甚至包括今日几个纯净家族的祖先。若地表出身本身就是污染，那么月都的建立者没有任何人能够通过审查。\n\n永琳以大贤者的身份出席审判。她没有坐在为大贤者准备的位置，而是站到辉夜身旁。\n\n「第一批居民由我带离地球，第一道隔离规则也由我制定。」永琳面对纯化院说道，「若她因地表出身有罪，便先审判我。」\n\n纯化院无法公开处置月都最古老的建立者，也不敢承认自身理论会使整座城市失去正统性。最终判决因此变成另一种囚禁：辉夜不会被立即处死，却不得离开指定宫殿，不得接触地球，也不能公开谈论自己的养父母。\n\n辉夜走出审判庭时，永琳仍跟在她身旁。\n\n直到那一天，辉夜才明白，永琳已经不再只是试图修补月都。她开始站到自己参与建立的制度对面。"

 yakumo.24.a:0 "审判辉夜，也等于审判月都的开端。"


 yakumo.25.t:0 "蓬莱药没有回头路"

 yakumo.25.d:0 "永琳把蓬莱药放在辉夜面前时，没有将它说成救命的仙药。\n\n「饮下以后，你将不会死亡。」她说道，「毒药、处刑与时间都无法结束你的生命。但你也无法恢复原状。即使有一天厌倦永恒，死亡仍不会回来。」\n\n纯化院已经秘密提出处决方案，准备在下一次公开审判以前结束这个麻烦。只要辉夜仍会死亡，月都便始终拥有决定她何时结束的权力。蓬莱药能够夺走这种权力，却也会让她永远背负自己的选择。\n\n永琳没有替她决定，只把药留在桌上。\n\n辉夜坐了很久，最终亲手拿起药杯。\n\n「他们把我的出生写成罪，把养育我的人写成污秽，又想替我决定应该活到什么时候。」她看着杯中的月光，「至少这一次，由我选择。」\n\n辉夜饮下蓬莱药。月都从此无法处决她，只能改以永久监禁、封锁消息与抹除相关记录来处理这个无法死亡的政治问题。\n\n不死之身因此成为新的牢笼，却也是纯化院永远无法封死的可能。只要辉夜仍然存在，关于月都起源的矛盾便不可能真正消失。"

 yakumo.25.a:0 "她失去了死亡，也夺回了自己的生命。"


 yakumo.26.t:0 "月兔受训的年代"

 yakumo.26.d:0 "铃仙进入月兔学校以后，最先失去的是名字。\n\n教官以编号称呼学员，要求她们熟练队列、波长通信、射击、战场急救与对地作战。每天起床、进食、训练与休息都有固定时间，任何迟疑都会被记录为纪律缺陷。\n\n课程反复告诉月兔，地上的居民受污秽支配，情绪混乱、贪恋死亡，也无法像月都居民一样进行理性判断。地球并不是生活着无数人的世界，而是一处不断产生战争、疫病与疯狂的危险区域。\n\n训练靶纸从不画出完整的脸。敌人只有轮廓、距离、威胁等级与必须命中的位置。教官不允许学员询问对方是谁，因为军人不需要理解目标，只需要准确执行命令。\n\n铃仙曾经因为射击前迟疑半息，被罚在训练场独自站到天亮。教官告诉她，那半息足以害死整支部队。第二天，她没有再次迟疑。\n\n月兔学校并不只训练身体。教官会检查学员之间的谈话，要求她们互相报告异常情绪；失败被解释为个人不够纯净，服从则被称为获得安全的唯一方法。久而久之，学员开始主动压下疑问，甚至会纠正那些仍保留地上习惯的同伴。\n\n那时的铃仙并不认为自己受到压迫。她相信月都保护了月兔，相信教官的严厉是为了让她们活下来，也相信地上的敌人一旦抵达月球，便会毁掉这里的一切。\n\n毕业那天，她以最优秀的成绩完成射击考核，接过军装与编号。她已经能够毫不犹豫地瞄准任何被标记为敌人的目标。\n\n直到第一次月面战争真正开始以前，铃仙从未亲眼见过地上的敌人，也从未想过靶纸上的轮廓可能拥有自己的名字。"

 yakumo.26.a:0 "那时的她，相信服从就是生存。"


 yakumo.27.t:0 "第一次月面战争的老兵"

 yakumo.27.d:0 "开战那天，我相信自己会在日落以前回来。\n\n教官说，地上的妖怪没有纪律，只是一群被污秽驱使的野兽。只要我们守住外墙，敌人便会在月海失去方向。运输车上的月兔甚至讨论胜利以后能得到几日休假，没有谁认真检查遗书是否写完。\n\n第一道防线只维持了半日。\n\n妖怪从我们认为不可能通过的方向出现。鬼族顶着炮火搬运伤员，小妖怪趴在弹坑里替同伴压住伤口。她们会害怕、会呼喊彼此的名字，也会为了救回一个人冒险离开掩体。那不是训练靶纸上的轮廓。\n\n我的小队被调往第二道防线。第一次清点时还有三十二人，第二次剩下十九人，第三次只剩七人。我向上级报告死者姓名，参谋却打断我，只问还能开枪的有几个。\n\n我们接到的命令永远相同：坚守、等待增援、不得后退。增援来到以后，不过是另一批刚离开学校的月兔。她们站到死者留下的位置，使用相同的编号，然后在下一轮炮火中消失。\n\n后来我不再问今天守的是哪一处阵地。外墙、月海堑壕、地下通道，全都只有不同形状的尸体。上级说伤亡仍在预计范围内，阵地可以夺回，月兔也可以补充。对他们而言，我们的死亡只是报告中减少的数字。\n\n直到永琳接管前线指挥，命令才第一次改变。她放弃数处无法防守的阵地，要求部队带上伤员撤退，将地上远征军引向远离补给通道的月海平原。许多军官称这有损月都威严，我却只知道，那是开战以来第一道允许我们活着离开的命令。\n\n我没能完整走完撤退路线。\n\n爆炸发生时，我只看见白光。冲击将我掀进弹坑，耳边的通信全部中断。我以为自己已经死了，醒来时却躺在地下医疗区，永琳正坐在床边翻阅我的作战记录。\n\n「你的部队呢？」她问。\n\n「只剩我。」\n\n「你还记得其他人怎样死去吗？」\n\n「全部记得。」\n\n永琳合上记录。\n\n「那么到我这里来。只看战报的人已经够多了。我需要一个真正从战报里活下来的人。」\n\n她将我调入自己的直属部队。不是因为我最忠诚，也不是为了奖励我活了下来。她相信，一个经历过外墙溃败、月海撤退与地下战斗的普通士兵，能够看见指挥者在地图上永远看不见的东西。\n\n战争结束以后，广播宣布月都取得伟大胜利。我们被要求相信纯净击败了污秽，所有撤退都是预先安排，所有死亡都是光荣且必要的奉献。\n\n我躺在病床上听完整篇报道。\n\n那一刻我终于明白，月都赢得的并不是真相。它只是活到了足以重新编写真相的时候。"

 yakumo.27.a:0 "我从战争中活了下来，却再也回不到出征的那一天。"


  yakumo.28.t:0 "逆言者留在月下"

 yakumo.28.d:0 "蓬莱药使辉夜无法被处死，也让她的审判永远无法结束。\n\n纯净派要求永久封印辉夜、销毁蓬莱药记录，并剥夺永琳的大贤者之位。仍记得建城初衷的月人则指出：月都的第一代居民本就来自地球，若地表出身是一种罪，那么整座城市都建立在污秽之上。\n\n最后一次议会因此裂成两半。永琳动用建立者的否决权，纯化院却宣布她已受辉夜污染。争论随即越过议场，军队封锁旧城，医疗区与部分旧神拒绝服从，月宫之间第一次互相开火。\n\n反对纯净派者拥有永琳的威望，却没有控制军队、通信与交通。战争持续到第六日，旧城已经被完全孤立。继续抵抗只会使辉夜落入纯化院手中，也会让月都毁于内斗。\n\n当夜，一名展开白鹭双翼的月人来到永琳面前。她名为稀神探女，拥有以言语逆转局势的能力。探女交出一张地图，并让原本封锁月宫的关卡暂时成为出口。\n\n永琳邀请她同行，探女却选择留下。\n\n「若知情者全部离开，他们便能让月都相信，避难所从未存在。」\n\n第七日，永琳带着辉夜与铃仙离开。失去大贤者以后，旧城停止抵抗，持续一周的内战就此结束。\n\n纯化院随即逮捕幸存者，封存建城记录，并将内战改称为污染骚乱。探女则隐藏自己的立场，把残存史料与联络方式藏入月宫深处。\n\n她没有背叛失败者。拥有白鹭双翼的逆言者，只是在等待下一次能够改变月都的机会。"

 yakumo.28.a:0 "内战结束了，月下仍有人记得真相。"


 yakumo.29.t:0 "永琳离开以后"

 yakumo.29.d:0 "永琳离开后的第二天，月都照常运转，仿佛七日内战从未发生。\n\n纯化院宣称大贤者已经隐居，辉夜与铃仙则从公开记录中消失。月都不能承认建立者带着地表公主出走，更不能让月兔知道，服从并非唯一选择。\n\n没有永琳制衡以后，纯净派开始重新编写历史。月都不再是逃离地上战乱的避难所，而被描述为自古存在的纯净国度；第一次月面战争的惨重伤亡被改写成完美胜利，内战则成为少数受污染者发动的骚乱。\n\n学校要求孩子相信月人天生高于地表生命。家庭互相监督，质疑教材、保存旧史或谈论永琳者都会接受纯净审查。月都不再满足于居民遵守法律，而是要求所有人拥有相同的记忆与敌人。\n\n经过漫长岁月，封锁地球仍无法满足纯净派。只要地上生命继续繁衍，死亡与污秽便会不断出现。于是，防止污染进入月都逐渐变成清除污染源本身。\n\n对地观测、秘密使者与武器计划相继出现。月都开始渗透地上的政权，操纵战争与对妖怪的围剿，为未来的全面纯化铺路。守护月面的军队，也逐渐变成准备毁灭地表生命的力量。\n\n只有月宫深处，那名拥有白鹭双翼的人仍保存着避难所的旧史。\n\n月都曾经为了逃离战争而诞生。永琳离开以后，它却开始等待把战争送回地球的时机。"

 yakumo.29.a:0 "避难所最终变成了地上的敌人。"



 yakumo.30.t:0 "死亡之后，她仍然醒来"

 yakumo.30.d:0 "幽幽子睁开双眼时，发现自己躺在一条陌生的白色回廊上。\n\n她本能地想要吸气，胸口却没有任何起伏。肌肤失去温度，双手也变得近乎透明。她记得西行寺家的庭院、春雪与饥饿，却记不起自己为何走到西行妖下，更不知道死亡为何没有将她带入轮回。\n\n回廊另一端传来哭声。一名刚刚死去的灵魂不肯承认自己的结局，不断寻找回家的路。幽幽子走过去，陪他说完未能告别的话，再陪他走到通往彼岸的路口。\n\n她不知道自己为何懂得安抚亡者。或许操纵死亡的力量并未消失，只是从夺走生命，变成了引导已经离去的人。\n\n完成第一次送别以后，幽幽子忽然觉得有些饿。\n\n「原来死后还是要吃饭呀。」\n\n她笑着说出这句话。那不是轻视自己的死亡，而是她确认了一件事：生前的自己已经结束，眼前这个仍会饥饿、会害怕、也会帮助别人的亡灵，同样是真实的西行寺幽幽子。"

 yakumo.30.a:0 "她死过一次，而后以亡灵继续生活。"


 yakumo.31.t:0 "西行妖下的身躯"

 yakumo.31.d:0 "西行妖的封印出现偏移后，妖梦奉命检查树根外围。她没有挖开泥土，只沿着显露的封印石逐一确认术式。\n\n石面刻满西行寺族人的姓名。越往深处，年代便越久远；他们的遗骸与力量共同压住妖树，使那些会引来死亡的花永远无法完全盛开。\n\n位于所有姓名最上方的，是西行寺幽幽子。\n\n妖梦终于明白，主人并非只是死在树下。她生前的身躯就是封印最后的锁芯，而她在死亡后失去的最后记忆，也使她无法找到并触碰封印核心。\n\n封印保护了无数生者，也切断了幽幽子认识自己的道路。\n\n妖梦没有触碰那块石头。她只是将主人的姓名重新覆盖，再带着这个过于沉重的发现回到白玉楼。"

 yakumo.31.a:0 "树下封存的不只是灾难，也是她的一生。"


 yakumo.32.t:0 "幽幽子，你知道自己是谁吗"

 yakumo.32.d:0 "早餐结束后，妖梦忽然问道：「幽幽子大人，您知道自己是谁吗？」\n\n幽幽子展开折扇。\n\n「白玉楼的主人、冥界的管理者、西行寺家的亡灵公主。还需要第四个答案吗？」\n\n「那些都是您的身份。」妖梦没有退让，「我问的是您自己。」\n\n幽幽子本想用晚饭转开话题，妖梦却一直坐在原处。直到茶水变凉，她才慢慢收起折扇。\n\n她承认自己害怕西行妖，也害怕知道树下究竟埋着什么。她会因美食高兴，会故意捉弄过度认真的庭师，也会在无人看见时怀疑，今日的笑容究竟属于自己，还是维持亡灵公主体面的习惯。\n\n妖梦听完以后，只把冷掉的茶换成一杯新的。\n\n幽幽子失去了生前的大部分记忆，却没有失去在今日重新认识自己的权利。她不是封印、职位或姓氏留下的影子。\n\n她仍然是那个能够回答「我想怎样生活」的人。"

 yakumo.32.a:0 "职位可以说明责任，却不能概括一个人。"


 yakumo.33.t:0 "冥界的任命"

 yakumo.33.d:0 "幽幽子死后不久，大量迷失的亡灵开始聚集在她身旁。她能够听懂他们的执念，也能使狂乱的灵魂安静下来。\n\n地狱女神赫卡提亚因此来到白玉楼，代表地狱承认幽幽子对冥界亡灵的管理权。四季映姬则带来彼岸的判词，逐条说明这份权力的界线。\n\n亡者可以暂时停留，却不得被永久扣押；生者不可遭到强留，灵魂也不能被用于战争。幽幽子负责安抚执念、安排去处，却无权因私人愿望改变审判与轮回。\n\n「如果我不接受呢？」幽幽子问。\n\n赫卡提亚没有威胁她。\n\n「那是你的选择。但这些迷路的家伙，明日仍会来找你。」\n\n幽幽子望向回廊外徘徊的亡魂。她同样在死亡后失去方向，知道无人指引意味着什么。\n\n最终，她接下了白玉楼的职责。不是为了成为死者的女王，而是不愿让其他亡者像自己醒来时那样，独自困在陌生的回廊里。"

 yakumo.33.a:0 "她接过的不是王冠，而是替亡者指路的灯。"


 yakumo.34.t:0 "魂魄家最初的誓约"

 yakumo.34.d:0 "第一位魂魄庭师在白玉楼石阶前立下誓约。\n\n他将修整庭院、护卫幽幽子，并以半人半灵之身维持生死界线。彼岸承认魂魄家可以携剑进入冥界，却要求这把剑不得只为主人而拔。\n\n四季映姬问道：「若白玉楼之主亲自越过界线，你又当如何？」\n\n庭师沉默许久，最终将剑横放在膝前。\n\n「我会先劝她回来。若她仍继续前行，我便拔剑阻止。」\n\n这句话成为魂魄家誓约的最后一条。它没有被写在公开家训中，而是封入剑匣，只有正式继承庭师之位者才能阅读。\n\n侍奉幽幽子与守护生死秩序通常并不冲突。但从最初开始，魂魄家的忠诚便不是没有判断的服从。\n\n他们佩剑留在白玉楼，正是为了有朝一日能够守护幽幽子，也能够阻止她。"

 yakumo.34.a:0 "没有锋刃的忠诚，保护不了任何人。"


 yakumo.35.t:0 "第二道命令"

 yakumo.35.d:0 "妖忌离开白玉楼以后，妖梦终于打开了祖父留下的剑匣。\n\n第一道命令要求她侍奉幽幽子。第二道命令则写道：若西行寺幽幽子试图解除西行妖封印、扣留亡者或破坏生死界线，魂魄家的继承者必须立即制止。\n\n这道命令从未向白玉楼之主公开。它不是对幽幽子的判决，而是为了防备那个谁也不愿面对的时刻。倘若主人受到西行妖影响，事先告诉她只会使最后的防线失去意义，也可能让长久建立的信任变成无休止的猜疑。\n\n剑匣底部留着妖忌的一行小字。\n\n「第一道命令说给主人听，第二道命令只留给持剑者。」\n\n妖梦将纸页读了数遍，最终重新锁上剑匣。她没有告诉幽幽子，也没有改变日常的侍奉。庭院依旧需要修剪，迷失的幽灵仍要引导，晚饭也必须准时准备。\n\n然而，从那一天起，幽幽子每次望向西行妖，妖梦都会注意她的眼神；每当主人随口提起妖树盛开的模样，她的手也会不自觉地靠近剑柄。\n\n秘密没有破坏她们的关系，却在妖梦心中留下了一道无法忽视的界线。\n\n她希望自己永远不必执行第二道命令。可若那一天真的到来，她必须比幽幽子更早察觉。"

 yakumo.35.a:0 "她重新锁上剑匣，没有向主人提起。"

 yakumo.36.t:0 "阎魔的手令"

 yakumo.36.d:0 "妖梦在清扫庭院时，发现西行妖长出了一枚不合时节的花苞。\n\n花尚未开放，附近的幽灵却已开始失去方向，不断向树下聚集。四季映姬亲自检查封印，在外层术式中找到了来自月面方向的残留。她无法确认月都的目的，却能确定有人正在试探西行妖与生死境界的联系。\n\n映姬当场写下手令：封锁西侧庭院，转移附近亡灵，任何人不得接近妖树，也不得触碰树下封印。\n\n「幽幽子大人也包括在内吗？」妖梦问。\n\n「尤其是她。」映姬回答，「她的遗骸位于封印中心，力量又与死亡相连。若妖树借她的灵力盛开，便不是白玉楼一处的灾难。」\n\n「如果她坚持靠近呢？」\n\n「阻止她。这正是魂魄家佩剑的理由。」\n\n妖梦没有迟疑。她立即封闭庭院、疏散幽灵，并在通往西行妖的石阶前布下结界。\n\n傍晚，幽幽子看见被封住的道路，只问了一句：「连我也不能进去？」\n\n「是。」妖梦如实说明花苞与阎魔的手令，却没有提起剑匣中的第二道命令。\n\n幽幽子望了树梢片刻，没有强行越过结界。她只是收起折扇，安静地返回白玉楼。\n\n当夜，妖梦重新打开剑匣。祖训与阎魔手令写着近乎相同的内容。直到此刻，她才明白第二道命令不再只是前人留下的假设。\n\n如果自己真的可能向幽幽子拔剑，那么有些事情便不能永远瞒着她。"

 yakumo.36.a:0 "第二道命令，第一次有了明确的对象。"


  yakumo.37.t:0 "主人与使命之间"

 yakumo.37.d:0 "封锁西行妖的当晚，妖梦将魂魄家的第二道命令与阎魔手令放在幽幽子面前。\n\n「这是什么？」幽幽子问。\n\n「魂魄家留下的密令。」妖梦回答，「如果您试图解除封印，或危害生死边界，我必须阻止您。必要时，也包括拔剑。」\n\n幽幽子的笑容消失了。\n\n「所以这些年，每当我看向那棵树，你都在判断是否应该砍我？」\n\n妖梦无法否认。\n\n长久的沉默以后，幽幽子问她为何偏偏在此时坦白。\n\n「因为它已经不再只是假设。」妖梦握紧剑鞘，「下一次若您受到妖树影响，我可能真的必须出剑。我不希望您直到看见剑锋，才知道我为什么站在对面。」\n\n幽幽子没有立即原谅她。\n\n「我不喜欢这道命令，也不喜欢你一直瞒着我。」她说道，「但若你什么都不说便拔剑，我会更加无法原谅你。」\n\n两人最终约定，在月面术式完全清除以前，谁也不接近西行妖。妖梦负责执行封锁，幽幽子则协助安抚被花苞吸引的亡灵。\n\n这不是和解。只是从这一夜起，隐藏在侍奉之下的另一把剑，终于被放到了两人都能看见的地方。"

 yakumo.37.a:0 "真相没有立刻修复信任，却阻止了下一次背叛。"


 yakumo.38.t:0 "管理者，还是囚犯"

 yakumo.38.d:0 "三日后，四季映姬清除了附着在封印外层的月面术式。异常花苞随即枯萎，聚集在庭院附近的亡灵也恢复了方向。\n\n危机解除以后，幽幽子没有立刻前往西行妖。她先向映姬索取了白玉楼最初的任命判词。\n\n判词详细规定了幽幽子的权力与责任，却没有任期、继任方式，也没有辞去职位的程序。制定者当年认为，既然她的遗骸必须永远封住西行妖，她便没有离开冥界的可能，自然也不需要结束职务的方法。\n\n「所以，你们不是把我关进白玉楼。」幽幽子说道，「只是发现我已经无法离开，便顺手把所有工作交给了我。」\n\n映姬没有否认。\n\n封印才是幽幽子无法轮回的原因，管理者的职位却把这种处境变成了理所当然。她确实珍惜自己送走的每一个亡者，但这不代表千年前的一次任命，可以永远替她回答是否愿意继续。\n\n幽幽子没有要求立即卸任。她提出的是另一件事：白玉楼必须建立继任制度，管理者也应当拥有重新选择的权利。\n\n映姬收回旧判词，答应将修订请求交给赫卡提亚。\n\n幽幽子依然留在原来的位置上。不同之处在于，这一次，她明确说出了自己愿意暂时留下。"

 yakumo.38.a:0 "无法离开，不等于已经同意永远任职。"


 yakumo.39.t:0 "幽幽子自己的回答"

 yakumo.39.d:0 "确认月面术式已经清除后，映姬允许幽幽子在妖梦陪同下进入西行妖外围。核心封印仍未开启，两人只能隔着结界看见刻有西行寺姓名的石面。\n\n幽幽子将手停在结界外，没有触碰封印。\n\n她原以为来到这里以后，失去的记忆便会突然回来。然而石面没有回答她。没有生前最后的话，也没有走向妖树时的想法。她只知道，自己的遗骸确实沉睡在树下。\n\n「或许我永远不会知道，她当时为什么作出选择。」幽幽子说道。\n\n「还要继续查下去吗？」妖梦问。\n\n「要。但不是今天，也不会用盛开西行妖的方法。」\n\n幽幽子没有把过去视为无关之物，也没有让一个已经无法回答的人类少女继续支配现在。她决定保留封印，同时要求彼岸不得再次删除她的记忆；此后任何关于西行妖的调查，都必须由她、妖梦与映姬共同确认。\n\n妖梦也作出自己的选择。\n\n「我会继续留在您身边，不只是因为魂魄家的命令。若您有一天越过界线，我仍会阻止您。但在那以后，我不会离开。」\n\n幽幽子看着她，终于重新露出笑容。\n\n「那么回去吧。今日的晚饭还没有决定呢。」\n\n她没有在树下找到最终答案。她只是取回了继续追问、暂时留下，以及将来改变决定的权利。"

 yakumo.39.a:0 "她没有得到终点，只取回了继续作答的权利。"



 yakumo.40.t:0 "没有署名的星图"

yakumo.40.d:0 "紫让蓝整理久未使用的博丽神社仓库。蓝搬开倒塌的祭具柜时，从墙缝中发现一只不曾生锈的金属匣。\n\n匣内没有法器，只有两张褪色的车票、一枚写着「秘封俱乐部」的徽章，以及一张记录着未来星空的观测图。星图尽头标注着博丽神社，日期却来自一个尚未到来的时代。\n\n紫接过星图。她不记得这些字迹，却本能地看懂了每一次修正，也知道最后那条计算线通向极其遥远的过去。\n\n星图背面只留下一句话：\n\n「如果幻想乡真的存在，我们总会找到入口。」"

yakumo.40.a:0 "故事开始于两张尚未作废的车票。"

yakumo.41.t:0 "幻想乡真的存在吗"

yakumo.41.d:0 "咖啡馆靠窗的位置永远坐着两名少女。莲子摊开旧地图，梅莉则负责把甜点挪到不会沾上墨水的地方。\n\n地图记载着一片曾经存在、后来却从所有档案中消失的土地。那里据说仍有神明接受祭祀，妖怪与人类共同生活，连季节都可能被一场异变打乱。\n\n「没有坐标、没有人口记录，也没有可靠照片。」莲子敲着桌面，「比较合理的结论是，它根本不存在。」\n\n「那我们来打赌。」梅莉把最后一块蛋糕切成两半，「如果找到了，你要承认我的直觉比你的计算可靠。」\n\n「如果没找到呢？」\n\n「不存在的地方，当然也无法证明我们输了。」\n\n此时的她们尚不知道星空能够向莲子报时，也不知道梅莉终有一日能看见世界的缝隙。对两名少女而言，幻想乡还只是一个适合逃课调查的秘密。"

yakumo.41.a:0 "寻找不存在的地方，正适合秘封俱乐部。"

yakumo.42.t:0 "雾中的洋馆"

yakumo.42.d:0 "线索把两人带到一座废弃洋馆。那里终年被雾笼罩，附近居民声称，铁门关闭以前，馆中曾住着不会衰老的吸血鬼。\n\n「既然你相信吸血鬼，就由你先进去。」莲子说道。\n\n梅莉推开饰有蝠翼花纹的大门：「科学家不是应该负责证明传闻错误吗？」\n\n洋馆内的钟全部停在同一刻，走廊散落着银制飞刀，地下酒窖的门则从外侧锁了三层。最奇怪的是那座几乎占满地底的图书馆：书架上保存着关于月人、纯净与月面战争的记录，许多内容甚至没有出现在人类历史中。\n\n她们抄下其中几页。离开时，二楼一扇破窗忽然自行合拢，仿佛这栋沉睡多年的宅邸仍不欢迎客人。\n\n梅莉没有回头，只问莲子：「现在还觉得吸血鬼不存在吗？」"

yakumo.42.a:0 "有些传闻只是忘记了自己的名字。"

yakumo.43.t:0 "月光下的陌生军队"

yakumo.43.d:0 "紧急新闻里的世界地图没有前线。\n\n敌军并未越过边境。上一刻仍在后方的基地，下一刻便被不属于当地的海水吞没；士兵向空无一物的天空开火，随后又被突然降临的神光整排抹去。各国不断宣布新的防御计划，却连敌人究竟位于何处都无法回答。\n\n莲子把画面暂停，翻开从雾中洋馆抄出的记录。\n\n「是丰姬。她把海洋和空间折叠在一起，所以距离对她没有意义。」\n\n另一段影像中，白衣女子举起手，早已无人祭祀的神祇便回应了她的召唤。\n\n「这个是依姬。」\n\n梅莉看着街外不断增加的逃难车辆：「人类连神明也能输掉吗？」\n\n「地上已经忘记它们的名字了。」莲子合上终端，「我们甚至没有描述这种攻击的词，又该怎样反击？」\n\n洋馆抄本的最后几页提到了另一个遭人遗忘的名字。幻想乡曾经保存妖怪、神明与奇迹，它的入口则由一座名为博丽的神社维系。莲子循着残缺记录找到坐标，却只查到一片早已废弃的山地。\n\n「那里不是避难所。」莲子说道，「更像是一扇已经关闭的门。如果星图没有错，它曾经连接过幻想仍然存在的时代。」\n\n「能够回来吗？」\n\n莲子没有回答。\n\n远处再次响起警报。梅莉把抄本塞进背包，拉起莲子的手。\n\n「那就别计算返程了。这个时代已经没有其他方向。」"

yakumo.43.a:0 "她们没有逃向安全之地，而是逃向尚能改变的年代。"

yakumo.44.t:0 "失去归途的穿越"

yakumo.44.d:0 "两人抵达博丽神社时，最后一座城市的广播刚刚中断。\n\n鸟居已经倒塌，杂草间只剩半块写着「博丽」的牌匾。莲子的仪器在正殿下方测不出任何异常，梅莉却从残破的赛钱箱后听见了蝉鸣。\n\n那声音不属于正在下雨的山林。境界另一侧阳光炽热，仿佛仍是某个尚未到来的盛夏。\n\n「我找到门了。」梅莉将手放在木板上。\n\n莲子抬头望向破损屋顶。她看见冬季、盛夏与陌生年代的星空重叠在同一片夜色中。\n\n「那我来找出口。」\n\n月都军队的白光已经照上石阶。莲子报出年代与经纬，梅莉沿着她的声音伸手，第一次主动碰触「此刻」与「彼时」之间的界线。\n\n神社在眼前裂开。\n\n跨入缝隙以后，梅莉感觉无数时代从身体两侧擦过。海岸向陆地退去，陌生城市变回荒野；寒冬在一次呼吸间化为盛夏，尚未诞生的语言像雨声般掠过耳边。莲子紧握她的手，不断根据逆行的星辰修正方向。\n\n通道却在抵达目标以前开始闭合。梅莉很快明白，境界需要某种东西留在生与死、现在与过去之间，充当支撑两人继续前进的楔子。\n\n她没有告诉莲子代价，只把自己的生命放进那道空缺。\n\n心跳仍然存在，时间却不再从她身上经过。属于人类的衰老、死亡与归途被留在关闭的境界里，而通往远古的出口终于出现在两人前方。\n\n「别放手。」梅莉说道。\n\n「你也是。」\n\n月光摧毁神社的前一刻，两人一同消失在尚未发生的历史之中。"

yakumo.44.a:0 "梅莉以自己的生命，撑开了两人通往过去的门。"



yakumo.45.t:0 "远古的第一座鸟居"

yakumo.45.d:0 "莲子在尚能使用的笔记本上写下了抵达后的第一份观测记录。\n\n「年代确认。误差仍在允许范围内。地点没有名称，附近也找不到任何人造道路。梅莉抱怨这里的蚊子比未来凶猛——至少说明我们没有落到月面。」\n\n她没有把另一项发现写得那么轻松。梅莉依然可以呼吸、进食与说笑，身体却不再随时间衰老。正午时，她的影子甚至比本人慢了半步。穿越没有夺走她的意识，却切断了她与人类寿命之间的联系。\n\n两人带来的仪器大多已经损坏。莲子只好把那块写着「博丽」的残破牌匾立在抵达之处，再用石块与木枝搭起一座简陋鸟居。\n\n附近居民问她是哪座神社的巫女。莲子望了眼牌匾，顺势答道：「博丽。」\n\n这个临时回答后来成为了她在远古的名字。她以星辰制定历法，用仪式固定穿越留下的裂隙，又将神社作为两人确认时代与方位的锚点。\n\n记录末尾，莲子的字迹变得潦草。\n\n「星象偏移时，我会被拖入别的年代。下一次回来可能是明日，也可能已经过去数十年。梅莉，如果我突然消失，就在鸟居下等我。只要博丽仍在原处，我总能找到回来的方向。」"

yakumo.45.a:0 "第一座鸟居，是莲子留给两人的路标。"

yakumo.46.t:0 "来自未来的残缺使命"

yakumo.46.d:0 "梅莉也曾试着记录自己的记忆。\n\n「我来自科学世纪。月都毁灭了地球。我和莲子回到过去，是为了保存幻想，改变未来。」\n\n最初，这几句话写得十分完整。数十年后，她却开始在城市名称旁留下空白；再过百年，咖啡馆、大学与秘封俱乐部也只剩下无法解释的图画。\n\n她记不清莲子何时离开，也不知道下一次重逢要等待多久。唯有「阻止月都」这项使命始终没有消失。\n\n梅莉开始收容遭人类驱逐的妖怪、失去祭祀的神明与即将被现实遗忘的怪异。她为他们寻找住所，也把每一种能力写进反攻月面的计划。她仍称这些存在为同伴，纸上的记录却已经把他们分成了前锋、后援与可以承受的损失。\n\n与此同时，附近的人开始畏惧她。有人声称在门后看见金色眼睛，也有人说黄昏的道路会把旅人送往不该存在的地方。这些传闻不断落在她身上，使人类少女的轮廓愈发模糊。\n\n莲子某次循着星辰回来，在鸟居下喊了几声「梅莉」。她没有回头，只问那个陌生名字属于谁。\n\n莲子沉默许久，望向暮色中的云层。\n\n「那就叫八云紫吧。」\n\n「这是她的名字吗？」\n\n「不是。」莲子回答，「这是现在的你。」\n\n紫第一次听见这个名字，却觉得自己已经等待它很久。"

yakumo.46.a:0 "旧名字逐渐远去，莲子替现在的她留下了坐标。"




yakumo.47.t:0 "第一次月面战争"

yakumo.47.d:0 "数百年后，紫认为反攻的时机已经成熟。她集结被保存下来的妖怪、神明与怪异，率领第一支远征军攻向月面，试图在科学世纪到来以前摧毁月都。\n\n最初的进攻远比月人预料得猛烈。境界从月海上空撕开，鬼族冲垮外层阵地，妖怪越过城墙，迫使月兔部队连续后撤。月都军队从未想过地上的怪异能够逼近城市，仓促投入的部队成片倒下，地下通道很快挤满伤员。\n\n远征军付出的代价同样惨重。月兔的弹幕撕碎前锋，陌生的月面环境使伤口难以愈合，后续部队则在混乱的境界中失去方向。每推进一步，月海上都会留下双方的尸体。\n\n永琳判断正面防御无法继续，命令守军接连放弃三道阵地，将远征军引向远离补给通道的平原。丰姬随后扭曲距离，使通往月都的道路不断延长，也让返回地球的方向逐渐偏移；依姬则在关键阵地请下神明，逐一击溃已经疲惫不堪的妖怪军团。\n\n月都用一座座阵地与大量月兔的生命完成了包围。远征军无法前进，也失去了原本的退路；包围圈外的月兔同样伤亡殆尽，已经没有余力发动最后的追击。\n\n紫直到此刻才真正看见自己带来的并非一批可以计算的力量。鬼族背着伤员寻找出口，小妖怪抱着同伴的遗体，还有人在临死前询问，幻想乡的春天是否已经到来。\n\n她放弃了进攻，将剩余妖力全部用于重新打开通往地上的境界。幸存者踩着双方的尸骸撤离月海，许多来不及抵达出口的人则永远留在了月下。\n\n月都最终守住了城市，却不敢承认这是一场几乎耗尽守军的险胜。幻想乡失去了大半远征军，也第一次明白月都并非不可战胜——只是在这场战争里，双方都比对方多承受了一刻，月人才成为最后仍站在战场上的一方。"

yakumo.47.a:0 "月都赢得了战场，双方却都没有值得庆祝的胜利。"


yakumo.48.t:0 "幻想乡与博丽巫女"

yakumo.48.d:0 "从月面回来以后，紫独自坐在鸟居下，反复擦拭衣袖上洗不去的月尘。\n\n莲子循着星辰出现时，没有先询问胜负。\n\n「多少人回来了？」\n\n紫报出了准确的数字。\n\n「他们叫什么？」\n\n这一次，她答不上来。\n\n紫曾把同行者按照能力、数量与用途写进计划。到了月海，她才听见伤员呼喊故乡，才知道那些被自己称作兵力的妖怪，也会害怕死亡，也有人等着他们回家。\n\n「我想拯救未来。」紫低声说道。\n\n「但死在月面的人没有活在那个未来。」\n\n「我知道。」\n\n从那以后，紫不再把幻想乡当作等待反攻的军械库。她问妖怪想住在哪里，询问神明需要怎样的祭祀，也允许人类划出不受捕食侵扰的村落。原本写满兵力与补给的地图，逐渐出现了道路、田地、市场和宴会场所。\n\n莲子每次归来，都会与她重新修改神社的守界规则。博丽巫女负责看守入口，也有权拒绝贤者；紫维护边界，却必须保证巫女不被任何势力变成工具。\n\n许多年后的某次重逢，紫看着莲子的脸，礼貌地问道：「请问你是？」\n\n莲子握紧星图，最后只回答：「博丽巫女。」\n\n她没有强迫紫记起自己，而是把无法继续依靠记忆维持的约定，写成后来每一任博丽都能继承的职责。"

yakumo.48.a:0 "当记忆无法留下，约定便成为制度。"

yakumo.49.t:0 "八云紫的名字"

yakumo.49.d:0 "蓝把星图铺在神社地板上。纸页边缘写满不同时代的批注，有些属于莲子，有些则出自紫自己早已不记得的年月。\n\n「这些地方都是紫大人建立的吗？」蓝指着地图上的妖怪山、旧都、人间之里与冥界。\n\n「我只替他们打开道路。」紫回答，「鬼族自己入住旧都，天狗修建山路，河童让工坊沿溪流运转。人里的房屋也不是从我的间隙里长出来的。」\n\n她继续翻阅。地图上还有白玉楼的通行规则、旧地狱的封锁线，以及红魔湖畔一份来自异国妖魔的血契。每一处边界旁，都留着与当地居民商议后的修改痕迹。\n\n「那为什么所有记录都围绕八云紫？」\n\n「因为划下边界的人，也必须替边界造成的错误负责。」\n\n紫曾以为自己可以独自安排所有人的位置。后来，她邀请其他大贤者共同分担判断，也让博丽巫女保有反对她的权力。当博丽大结界终于闭合时，幻想乡早已不是她一个人的计划，而是无数被遗忘者共同选择留下的故乡。\n\n星图最后夹着一张褪色纸条。\n\n「梅莉，如果你已经忘记我，也请不要忘记为所有离开的人留下条路。」\n\n紫读了两遍，仍然想不起写信者的声音。\n\n「紫大人是梅莉吗？」蓝问。\n\n「或许曾经是。」紫合上星图，「但我不必为了证明她存在，就假装自己仍记得她的一切。」\n\n她望向纸上的两个名字。梅莉属于那名决定回到过去的人类少女，八云紫则属于承受了这项选择，并一路活到今日的妖怪。它们并不互相取代，只是同一段人生在不同年代留下的称呼。\n\n紫把星图放回写着「博丽」的木匣。\n\n「至于这句话，我虽然忘了是谁教的，却一直照做到了今天。」"

yakumo.49.a:0 "她忘记了约定的人，却没有忘记约定本身。"

 yakumo.50.t:0 "月人不再躲在阴影里"

 yakumo.50.d:0 "战争已经无法避免。\n\n潜伏在地表的月兔与月人同时现身。他们接管政府、改写军令，并利用恐慌控制军队。数个受月都操纵的国家已经向幻想乡宣战，隐藏在幕后数百年的敌人终于公开了自己的存在。\n\n从这一刻起，幻想乡必须击败月都在地表扶植的敌国，摧毁其军事据点，逐步削弱月面防线，最终将战火带到月都。\n\n§O以下选择仅用于调整本次战争的敌方强度。§!\n§O月都的防卫值与增援规模将根据所选战局进行调整。§!"

 yakumo.50.a:0 "§G稳健战局§!：降低月都防卫值与增援强度。"

 yakumo.50.b:0 "§Y标准战局§!：按照完整规则与默认强度开战。"

 yakumo.50.c:0 "§R严苛战局§!：提高月都防卫值与增援强度。"




 yakumo.51.t:0 "圣域之下的囚徒"

 yakumo.51.d:0 "紫在圣域深处找到了浅间净秽山。\n\n这座埋藏于地下的金字塔并非神明的宫殿，而是月都留下的净化装置。月人将不愿留在月面的污秽送入其中，再以被囚禁者的力量加以处理。\n\n维缦·浅间被篡改记忆，日复一日地维持装置运转；磐永阿梨夜则被封印在最深处，成为制止一切变化的最后保险。月都称她们为祭神，使用她们时却只把她们视作两件不会损坏的部件。\n\n紫关闭了净化装置，沉重的石门随之开启。\n\n「我们正准备攻上月面。」她看向重获自由的两位神明，「如果你们还记得是谁把这里变成牢狱，就与我们同行。」\n\n浅间没有立刻回答，只是回头望向那座吞噬了她无数岁月的金字塔。阿梨夜则从岩壁前站起，石之女神停滞千年的时间终于再次向前流动。"

 yakumo.51.a:0 "上船吧。让月都看看它曾经遗弃了什么。"


 yakumo.52.t:0 "欢迎来到地狱"

 yakumo.52.d:0 "地狱没有为来客举行仪式。紫跨过间隙时，只看见赫卡提亚坐在灼热岩层之上，纯狐则沉默地站在她身旁。\n\n赫卡提亚对月人从来没有好感。月都拒绝生与死，将欲望、变化和生命本身称为污秽；在她看来，那不是高洁，而是对一切活物的蔑视。\n\n「你们终于要攻上月亮了？」赫卡提亚笑着问道，「这可比过去那些试探有趣多了。」\n\n纯狐没有参与寒暄。她只提出一个条件：月都陷落以后，嫦娥必须交给她。那份被纯化至今的仇恨从未因岁月消退，也不可能通过谈判平息。\n\n幻想乡需要能够突破月面防线的力量，而眼前两人早已与月都交战了无数次。\n\n「嫦娥归你。」紫答道，「月都归这场战争。」\n\n赫卡提亚站起身，三颗象征不同世界的星球在她身后缓缓转动。纯狐也终于抬起眼睛，望向地狱上方那轮无法看见的月亮。\n\n地狱不会服从幻想乡，却愿意与他们乘上同一艘前往月面的船。"

 yakumo.52.a:0 "这一次，地狱将与我们一同登月。"


#################修改#######################没有触发的地点

yakumo.53.t:0 "地图两端的旧识"

yakumo.53.d:0 "通往畜生界的间隙刚刚打开，饕餮尤魔便毫不客气地坐上蓝的位置，将桌上的点心一扫而空。\n\n「你还是老样子。」蓝放下准备谈判的文件，「总要先吃掉别人的份，才肯讨论如何分配。」\n\n「你也没变。」尤魔舔去指尖的糖粉，「还没开口，就已经算好我会吃几盘。」\n\n她们面前摊开的并不是今天的谈判地图，而是一张残破的畜生界旧图。许多年前，各方势力为了地盘相互撕咬，尤魔负责打破僵局，蓝则算计怎样让胜利者不至于把整个畜生界一同吞掉。她们合作过，也互相设过陷阱；曾在同一张地图前熬过数日，转身后又各自准备下一场争斗。\n\n「你当年要是留下，现在说不定已经坐在畜生界最高的位置。」尤魔说道。\n\n「所以我才离开。」蓝收起旧图，「在那里，算计只能决定谁吃掉谁。紫大人让我看见，它也能用来保护一个地方。」\n\n橙从门后探出脑袋：「所以你们是朋友吗？」\n\n「不是。」\n\n两人同时回答。"

yakumo.53.a:0 "畜生界没有朋友，只有记得太久的对手。"

yakumo.54.t:0 "稚嫩外表下的成熟"

yakumo.54.d:0 "迷途之家新收留的小妖怪偷走了厨房里的馒头。被发现时，她把食物紧紧藏在怀里，缩在墙角，不肯让任何人靠近。\n\n负责照料的人正要上前，橙却拦住了她们。\n\n「现在追问，她只会以为我们在乎的是馒头，不是她。」\n\n橙在门边放下一杯热水，又让厨房留下属于那个孩子的一份晚餐。她没有纵容这次偷窃，只是决定等对方吃饱以后，再谈这里的规矩。\n\n第二天，橙亲自带她来到厨房。\n\n「这里的食物不用抢，但要记得来领。想多拿一份可以开口，也可以帮大家揉面、搬柴。只要说出来，就会有人回答你。」\n\n几天以后，那个孩子开始主动到厨房帮忙，也愿意把点心分给其他人。橙确认一切无事，转身便跑进院子，与妖精们争抢一只纸球，最后还因为输了比赛趴在地上耍赖。\n\n蓝站在走廊上看了许久。橙从不摆出成熟稳重的模样，却懂得何时应该保护，何时必须立下规矩，也愿意耐心等待别人自己走出角落。"

yakumo.54.a:0 "真正的成熟，不必总摆出严肃的模样。"

yakumo.55.t:0 "被九尾狐看中的猫又"

yakumo.55.d:0 "蓝第一次见到橙时，她已经是一只拥有两条尾巴的猫又。\n\n那天，蓝在山林里发现了十几条相互重叠的妖力痕迹。几只野猫按照不同叫声轮流行动，一边把迷路的孩子引向山下，一边带着追赶它们的猎人绕回原地。负责指挥这一切的橙则蹲在树上，得意地晃着尾巴。\n\n蓝故意移动了一处路标。橙立刻察觉变化，重新安排猫群，还从气味与落叶的方向找出了躲在远处观察的蓝。\n\n「看了这么久，要么帮忙，要么别捣乱。」橙毫不客气地说道。\n\n她的妖力尚不稳定，布置也称不上精密，却已经懂得观察环境、分派任务，并在计划出错后迅速寻找新的道路。蓝原本只是路过，最后却在树下停了下来。\n\n「你愿意跟我学习式神术吗？」\n\n「学了有什么好处？」\n\n「你会变得更强，也会拥有可以回去的住处。」\n\n橙想了一会儿。\n\n「有鱼吗？」\n\n「有。」\n\n「那我学。」\n\n多年以后，橙已经能够独自维持阵法、联络各地妖怪，也能替蓝完成许多复杂任务。她同样会把阵图改成猫脸，会在课程开始前躲上屋顶，还会为了多吃一条鱼与蓝争论半天。\n\n紫问蓝当初是否看错了人。\n\n蓝望着正在树上装睡的橙。\n\n「她的才能一直没有问题。」"

yakumo.55.a:0 "那份才能，从未变得安分。"


yakumo.59.t:0 "演算中的一项例外"

yakumo.59.d:0 "暴雨封住山路后，橙比约定时间晚了两个时辰。\n\n蓝坐在桌前批阅文件，声称自己毫不担心。可她每隔一刻钟便会重新计算一次雨势、山洪、道路损坏和橙可能停留的位置。紫经过时，桌上已经叠着十四份搜索方案。\n\n「这只是必要的风险评估。」蓝面无表情地解释。\n\n间隙外终于传来熟悉的叫声。浑身湿透的橙刚踏进屋，蓝便开始责备她擅自改变路线、没有及时回报，还把自己置于完全可以避免的危险之中。\n\n她一边训话，一边擦干橙的头发，又从炉边端来始终温着的汤。\n\n「这也是风险评估？」紫问。\n\n「只是避免浪费食物。」\n\n过去的蓝只会计算任务能否完成。自从有了橙，她的所有方案里便多出了一项从不允许删除的条件——无论发生什么，那孩子都必须回家。"

yakumo.59.a:0 "九尾狐将其称作风险管理。"

yakumo.60.t:0 "没有目的地的列车"

yakumo.60.d:0 "难得没有会议的一天，紫以检查结界为由离开了八云邸。\n\n蓝循着残留的妖力找到她时，那位幻想乡的贤者正坐在一节穿行于外界的旧列车中。紫靠着车窗，膝上摊着看反的报纸，身旁放着没吃完的点心。列车驶过山野与城镇，她却没有准备在任何一站下车。\n\n「紫大人若想去某处，直接打开间隙不是更快吗？」\n\n紫没有睁眼。\n\n「正因为哪里都能立刻抵达，偶尔才要坐一趟没有用处的车。」\n\n她喜欢车轮经过接缝时发出的声响，也喜欢看陌生乘客在不同车站相遇、分别。至于这种消遣究竟始于何时，她自己也说不清楚。\n\n蓝收走那份倒置的报纸。紫顺势靠上她的肩膀，准备把所谓的结界视察继续睡完。\n\n「到站再叫我。」\n\n「我们根本没有目的地。」\n\n「那就晚一点叫。」"

yakumo.60.a:0 "老习惯果然改不掉。"

yakumo.61.t:0 "总是多出来的那一份"

yakumo.61.d:0 "蓝发现，紫独处时仍会准备两只茶杯。\n\n她观测星空时会摆好两把椅子，整理地图时会在对面留下纸笔，偶尔还会突然念出日期与坐标，停下来等待一个永远不会出现的回答。\n\n「另一份是为谁准备的？」蓝终于问道。\n\n紫看向空着的位置。那里没有式神，没有来客，也没有任何她能够想起的面容。\n\n「不知道。」\n\n她拿走其中一杯茶，却没有收起另一杯。\n\n「只是觉得应该有人坐在那里。」\n\n那杯茶在星光下慢慢冷却。紫早已忘记科学世纪的咖啡馆，忘记秘封俱乐部，也记不起曾有一名少女坐在自己对面，依据星辰说出她们所在的时间与地点。\n\n记忆可以被漫长岁月磨去，身体却仍替那个人保留着位置。"

yakumo.61.a:0 "被遗忘的人，仍留在习惯里。"

yakumo.62.t:0 "幽幽子的今日菜单"

yakumo.62.d:0 "幽幽子把一张长得拖到地面的菜单交给妖梦。\n\n「今晚想吃春天的竹笋、夏天的鳗鱼、秋天的栗子饭，还有冬天的火锅。」\n\n妖梦看了看窗外。现在既没有竹笋，也不是栗子成熟的季节。\n\n「幽幽子大人，这四样食材不可能同时取得。」\n\n「所以才交给可靠的妖梦呀。」\n\n妖梦只得跑遍市场、竹林与储藏室，甚至向河童借来保存食材的冷库。等她端着最后一道菜回到白玉楼时，庭院早已入夜，原本的打扫和剑术训练全被耽搁。\n\n桌上摆着两副碗筷。\n\n「幽幽子大人不是自己想吃吗？」\n\n「如果直接叫你休息，你一定会说还有事情没做。」幽幽子替她盛好栗子饭，「所以只好给你一件必须坐下来才能完成的工作。」\n\n妖梦沉默片刻，终于坐到对面。\n\n「吃完以后，还有一道代表第五个季节的甜点。」\n\n妖梦又站了起来。"

yakumo.62.a:0 "庭师今天也没能按时扫完庭院。"

yakumo.80.t:0 "是非曲直的例行视察"

yakumo.80.d:0 "四季映姬踏入白玉楼时，妖梦已经准备好厚厚一叠记录，幽幽子则准备了茶和点心。\n\n映姬依次指出三名亡魂错过转生日期、六份通行文书缺少印章、两盏引魂灯悬挂过低，以及一只躲在楼梯下不肯前往彼岸的幽灵。妖梦奋笔疾书，幽幽子不断替她添茶。\n\n「还有，西行寺幽幽子。审查期间以点心分散审判者注意，同样是不够端正的行为。贪食虽然不是重罪，却会使判断受到欲望左右。况且今日的糖分已经——」\n\n幽幽子默默把点心换成了润喉的枇杷膏。\n\n检查接近黄昏时，映姬注意到妖梦握笔的手正在发抖。\n\n「疲惫时继续工作并不值得赞许。无法判断自身极限，也是一种失职。」\n\n「请映姬大人劝劝她吧。」幽幽子微笑道，「我说多少次都没有用。」\n\n于是妖梦又坐着听了半个时辰，内容是休息为何同样属于庭师的职责。\n\n映姬离开前，妖梦小心询问白玉楼是否通过了本次视察。\n\n「关于这一点，我还有十三项需要说明。」"

yakumo.80.a:0 "映姬大人的话还没有说完。"

yakumo.64.t:0 "公主照顾兔子的方式"

yakumo.64.d:0 "铃仙从月面战场的噩梦中惊醒时，不允许任何人靠近。她缩在房间角落，双耳紧贴头顶，眼前仍残留着炮火落下时的白光。\n\n辉夜没有追问她梦见了什么，只在铃仙能够看见的地方坐下，把被褥与热茶轻轻推到两人之间。\n\n辉夜年幼时，每逢受到惊吓，家人从不会强行把她拉出藏身之处。他们只是留在附近，谈论第二天要吃什么、庭院里有什么花开了，以及天亮以后还要完成哪些寻常小事。那些关于明日的话，会让漫长的黑夜重新出现尽头。\n\n于是辉夜也说起了明天。她说明早会有新做的团子，院里的竹叶需要修剪，帝还欠着仓库三箱胡萝卜没有归还。\n\n「她不会还的。」铃仙终于低声说道。\n\n「那就从她的薪水里扣。」\n\n「她根本没有固定薪水。」\n\n辉夜故意沉思片刻：「看来明天的问题很多，需要你亲自起来处理。」\n\n铃仙慢慢拉过被褥。等她主动伸出手时，辉夜才靠近，替她理好凌乱的头发。\n\n永琳带着药物来到门前，看到这一幕后，又悄然把药瓶收回袖中。"

yakumo.64.a:0 "只要还有明天，黑夜就会结束。"

yakumo.66.t:0 "辉夜究竟有多美"

yakumo.66.d:0 "帝发现，外界游客愿意花大价钱观看「竹取物语中真正的辉夜姬」。辉夜本人拒绝被摆在台上供人参观，于是帝立刻推出了替代方案——举办一场完全还原古代辉夜姬的公开展览。\n\n她负责出售门票，二岩猯藏负责变身，永琳则被强行请来担任历史顾问。\n\n「按照故事变就行了。」帝挥着宣传单说道，「肌肤要比月光洁白，长发要能铺满房间，走路时最好还有花瓣落下来。」\n\n猯藏依言变化，结果出现的辉夜光芒耀眼、长发拖地，每走一步都会凭空落下大片樱花。永琳只看了一眼便摇头。\n\n「衣装勉强接近，面容过于夸张。公主当年没有发光，附近也不会自动出现花瓣。」\n\n「这样才有人愿意买票嘛。」帝理直气壮。\n\n猯藏最后只得参考现在的辉夜，换上古代衣装，再稍微调整妆容。她刚完成变化，真正的辉夜便拿着帝擅自印制的宣传单走进会场。\n\n两名几乎一模一样的辉夜姬同时出现在众人面前。观众一片哗然，连铃仙都无法立刻分辨谁才是真的。\n\n帝仅仅愣了一瞬，随即举起新的牌子。\n\n「今日限定活动！猜中真正的辉夜姬，就能获得公主亲笔签名！参加费用另计！」\n\n辉夜追着帝冲出会场时，猯藏仍顶着她的脸，在台上笑得直不起腰。永琳则向满场观众给出了最后结论：\n\n「公主的美貌没有改变。改变得最多的，是负责讲述她的人。」"

yakumo.66.a:0 "传说是否夸张，取决于帝卖了多少张门票。"




 #####################

   yakumo.63.t:0 "地表的胜利抵达月球"

    yakumo.63.d:0 "又一个受控国家摆脱了月都。胜利的消息穿过间隙抵达月海时，前线爆发出久违的欢呼——地上的盟友正在赢得自己的战争。\n\n为阻止地表控制网继续崩溃，月都不得不将预备部队、运输能力与大量物资调往地球。月面守军的增援因此放缓，数处原本严密的防线开始出现空缺。\n\n被解放者也交出了月都使用的补给密码、军令格式与部队调动记录。蓝迅速整理这些情报，将其转化为一道无需消耗资源的战术命令。\n\n地表夺回的每一寸土地，都正在替月面远征军打开新的道路。"

    yakumo.63.a:0 "两条战线开始互相支援。"

 yakumo.56.t:0 "通往月亮的门"

 yakumo.56.d:0 "巨型间隙在博丽神社的鸟居后方展开。另一端没有风，也没有温度，只有灰白色的月海一直延伸至地平线。\n\n紫认得这片土地。第一次月面战争中，她曾在这里失去大半远征军。那时的她计算兵力、妖力与推进速度，却直到战线崩溃以后，才开始计算还有多少人能够回家。\n\n这一次，她亲自确认每支部队的返航坐标、撤退信标与备用通道。蓝反复核对人员数字，工程队则沿途布设能够引导间隙重新开启的定位装置。即使主通道遭到月都封锁，紫也预留了将残军送回地上的妖力。\n\n集结于鸟居前的军队没有听见必胜的保证。紫只是站在间隙旁，向所有即将踏上月面的人说道：\n\n「我无法保证每场战斗都能取胜。但只要你们还活着，我就不会把任何人留在月海。」\n\n先头部队越过鸟居，月球的寂静第一次被幻想乡军队整齐的脚步声打破。"

 yakumo.56.a:0 "第二次月面战争开始。"


 yakumo.57.t:0 "拆解月都防线"

 yakumo.57.d:0 "月都的防御并不只由城墙与军队构成。净化结界会识别闯入者，空间通道能够自行改变方向，月兔部队则通过一套不断更新的口令与观测网络调动增援。\n\n正面摧毁这些设施需要付出过多伤亡。紫因此将缴获的月面密码、通信记录与防御图交给了两位最适合处理它们的人。\n\n永琳只看了一遍，便认出其中许多结构。月都沿用了她昔日参与制定的基础规则，即使后来增加无数密钥与限制，最深层的运转方式仍未改变。\n\n蓝则把所有防线拆成节点、频率与增援间隔。她连续数日推算月都的指挥规律，寻找每次更新之间最短暂的空白。\n\n「不必破解整个系统。」永琳指向防御图中央，「只要让它在关键时刻相信一条错误命令。」\n\n蓝迅速完成最后一组计算。\n\n「十三处防御节点将同时关闭。月兔增援会被送往错误的阵地，净化结界则会把友军识别为未经许可的闯入者。」\n\n当永琳留下的旧口令重新进入月都网络，坚固的防线没有发生爆炸。它只是按照错误的命令，井然有序地为幻想乡打开了道路。"

 yakumo.57.a:0 "让月都引以为傲的秩序成为缺口。"


 yakumo.58.t:0 "月海之上的补给线"

 yakumo.58.d:0 "打开通往月球的间隙只是第一步。武器、粮食、药品与伤员仍要持续往返两地，而每次开启大型通道都会消耗紫的力量，也可能暴露后方位置。\n\n河童拿着厚重的合同来到指挥部。她们要求足够的报酬、完整的技术权限，以及战后保留部分月面设备的权利。条件并不便宜，但河童也确实拿出了相称的本事：密封仓库、月尘运输车、可移动定位台，以及能够接替主通道的小型中继装置。\n\n草根妖怪负责让这些设备真正运转起来。赤蛮奇检查每条路线，专门寻找那些会让物资凭空消失的漏洞；影狼带领运输队穿过尚未清理的区域，把弹药送到最靠前的阵地；若鹭姬则管理饮水、药品与伤员转运，确保弱小部队不会因为分不到物资而被放弃。\n\n她们很清楚，一场战争并不只会败在强敌手中。迟到一日的粮食、送错地点的弹药，以及无人接走的伤员，同样能够摧毁一支军队。\n\n当第一批永久补给站在月海上开始运转时，幻想乡将不再只是一支随时可能被切断归路的远征军。河童让通道能够延伸，草根网路则保证每一箱物资都能抵达真正需要它的人手中。"

 yakumo.58.a:0 "大人物谋划登月，小人物让军队留在月面。"




 yakumo.65.t:0 "月海上的归魂"

 yakumo.65.d:0 "攻势失败以后，月海上没有风，粉白色的樱花却从弹坑之间缓缓飘过。\n\n幽幽子撑着扇走过战场。她没有询问亡者属于幻想乡还是月都，只逐一唤醒那些仍在尸身旁徘徊的灵魂。妖怪、月兔、人类与神明留下的微光跟在她身后，汇成一条通往间隙的寂静长队。\n\n妖梦捧着从战场上收回的武器与遗物，低声问道：「敌人的亡魂也要带走吗？」\n\n「活着的时候，他们必须选择站在哪一边。」幽幽子回头看向身后的队伍，「死后就不必再替别人守城了。」\n\n有故乡的亡魂被送回地上，没有归处的则由白玉楼引往冥界。至少这一次，月尘不会掩埋他们存在过的痕迹。\n\n另一边，蓝将失利原因逐项写入战报：错误的推进路线、迟到的补给、被低估的月都增援，以及每一道未能及时开启的撤退通道。有人建议删去最难看的部分，以免动摇军心。\n\n紫拒绝了。\n\n「一次失败不会毁掉远征军。」她合上战报，「把失败写成胜利，才会让同样的人再死一次。」"

 yakumo.65.a:0 "失败必须留下完整记录。"


 yakumo.67.t:0 "帝国最后的疯狂"

 yakumo.67.d:0 "月都外层城墙已经倒下。联军越过月海防线，占领了数个城区，月兔守军成批放下武器。远处的中央宫殿成为这场战争最后仍在抵抗的目标。\n\n然而，纯化院没有准备投降。\n\n当联军进入内城，白色光柱突然从宫城升起。极端派启动了埋藏在各城区下方的净化阵列，命令尚未撤离的居民、伤员与月兔部队一同接受「最终纯化」。他们宁愿烧毁自己的城市，也不允许任何被地上生命触碰过的事物继续存在。\n\n月都街道在无声白光中一段段消失。刚刚投降的月兔拖着伤员逃离阵地，宫城守军则收到命令，必须向所有后退者开火。甚至连绵月姊妹的停火指令，也被纯化院以「受污秽影响」为由驳回。\n\n蓝望着不断熄灭的城区标记，第一次停下了手中的计算。\n\n「他们正在清除自己的军队。」\n\n紫收起折扇。月都已经不是在保卫城市，而是在证明只要纯净仍然存在，城中还有多少生命便无关紧要。\n\n「那就攻下宫殿。」她说道，「在他们把月都变成坟墓以前。」"

 yakumo.67.a:0 "他们已经疯了。"


 yakumo.68.t:0 "纯净帝国的毁灭"

 yakumo.68.d:0 "最后一道月门从内外同时开启。\n\n门外，幻想乡联军已经突破宫城广场；门内，拒绝执行最终纯化命令的月兔与反对派夺取了控制室。当沉重的白色门扉向两侧退去，两支军队第一次看见彼此，却没有继续开火。\n\n绵月依姬走下宫阶，将佩剑平放在地。丰姬随后关闭仍在运转的空间通道，切断纯化院最后一条调动增援的路线。\n\n「月都守军接受停火。」依姬说道，「继续抵抗只会让城中居民与伤员成为陪葬品。」\n\n紫没有要求她们跪下。她只命令联军解除宫城武装、关闭净化阵列，并允许医疗队首先进入仍在燃烧的城区。\n\n纯化院的旗帜从宫殿上方降下。军令所、控制中枢与城防节点相继交出，剩余守军也开始成队离开阵地。\n\n月都仍然存在，生活在这里的人也仍然存在。但那个能够躲在月光背后，替两个世界决定谁有资格活下去的政权，已经在这一刻终结。"

 yakumo.68.a:0 "月都旧政权不复存在。"


 yakumo.69.t:0 "战争结束后的月都"

 yakumo.69.d:0 "地表最后一个受控政权解除月都指令时，作战地图上的白色信号接连熄灭。地球控制网与月面城防同时失效，这场跨越无数年代的战争终于有了明确的终点。\n\n联军将领在宫城内等待紫宣布战后安排。有人主张占领月都，有人要求没收全部科技，也有人认为月人曾试图毁灭地球，理应承受同等的清洗。\n\n紫坐在空置的御座前，却没有走上台阶。\n\n「这场战争因月都擅自判定其他生命不配存在而开始。」她望向殿内众人，「如果我们现在宣布月都属于幻想乡，那么改变的只是坐在高处的人。」\n\n她接受守军的军事投降，却拒绝将月都写成幻想乡的领土。纯化院、军法机关与极端派武装将被解除权力；控制地球的记录会被保存，相关责任则依照个人行为审理。普通居民、月兔与放下武器的士兵不会因为出生于月面而遭到报复。\n\n战争以胜利结束，但胜利不再以另一场驱逐开始。"

 yakumo.69.a:0 "战争结束，政权更替开始。"


 yakumo.70.t:0 "纯化院的最后命令"

 yakumo.70.d:0 "宫城失守前，纯化院向地下档案库发出最后命令：焚毁地球控制记录、秘密处决文件，以及所有曾反对纯净政策之人的资料。\n\n火焰沿着书架迅速蔓延。负责销毁证据的官员封死出口，试图让整座档案库连同知情者一起消失。\n\n稀神探女站在紧闭的门前。她为了保存这些证据沉默了太多年，如今终于说出那句准备已久的话：\n\n「这里的一切都会被彻底烧毁。」\n\n话音落下，已经确定的结局开始反转。灭火装置重新启动，封锁门自行开启，原本失效的储存设备也恢复运转。探女从暗室中取出多年保存的备份，将地表渗透、秘密处决与纯化实验的完整记录交到紫手中。\n\n「这不是用来报复整个月都的武器。」紫翻开第一份档案，「它只负责让真正作出命令的人无法躲进集体责任之中。」\n\n联军随后解除纯化院残部武装。绵月姊妹交出军队指挥权，并同意接受公开审查。普通月兔不再替上级承担罪责，反对派也不再需要通过沉默证明忠诚。"

 yakumo.70.a:0 "责任只按个人行为审理。"


 yakumo.71.t:0 "永琳与辉夜重返月都"

 yakumo.71.d:0 "紫在宫城前打开间隙时，永琳站在门槛另一侧，久久没有迈步。\n\n眼前的石阶、拱门与水渠仍沿用她昔日参与设计的结构。经过漫长流亡以后，她第一次不是作为逃犯，而是作为被月都重新需要的人回到这里。\n\n辉夜越过门槛，旧宫廷的侍从下意识准备跪迎。她却抬手阻止了他们。\n\n「我不是回来恢复从前的宫廷。」辉夜望向仍有白烟升起的城区，「如果所谓永恒只能靠不断排除生命维持，那留下的不过是一座不会腐朽的坟墓。」\n\n永琳接管医疗设施、司法记录与城市维生系统。她首先开放原本只供上层使用的医院，又命令各处收治联军伤员、月兔和平民，不得按照身份与纯净程度排序。\n\n辉夜则以月之公主的政治正统姓保护地表出生者、月兔、异议者，以及所有曾被纯化院称为污秽的人。探女负责联络反对派，让隐藏多年的改革力量能够公开进入过渡议会。\n\n她们重新掌权，不是为了让旧时代返回宫殿，而是为了让月都第一次能够由内部否定那个时代。"

 yakumo.71.a:0 "让愿意改变的人重建月都。"


 yakumo.72.t:0 "月都重建敕令"

 yakumo.72.d:0 "辉夜没有在宫殿内宣读重建敕令。她命人将文本分别送往城区、工厂、军营与月兔聚居地，让每一个曾被排除在政治之外的人都能亲耳听见。\n\n第一道命令解散纯化院与极端军令体系，相关设施立即封存；第二道命令拆除控制地球的观测与干涉网络，禁止任何机构再次改写地表政权；第三道命令承认月兔、地表出生者与旧有异议者拥有完整的居民权；最后一道命令则重新确认月都建立之初的本义——这里应当庇护逃离灾难之人，而不是决定哪些生命应被灾难吞没。\n\n宣读者念到第三道命令时，聚集在广场上的月兔没有欢呼。许多人只是反复查看墙上的文字，仿佛担心那些句子会像过去的承诺一样在翌日消失。\n\n铃瑚将自己的居民证明折好，塞进口袋。清兰看了许久，低声说道：「所以这一次，我们不是装备，也不是消耗品了？」\n\n「不是。」负责登记的官员回答，「是居民。」\n\n月都的科技、神祇与文化被完整保留。真正遭到废除的，是少数人以纯净为名，替两个世界决定生死的权力。"

 yakumo.72.a:0 "月都不再以纯净决定谁能活着。"


 yakumo.73.t:0 "紫所设想的新月都"

 yakumo.73.d:0 "数月以后，月都的灯火重新铺满城区。永琳恢复了城市运作，辉夜让过渡议会开始处理积压多年的争议，街头也终于听得见未经审查的交谈声。\n\n紫独自站在宫城露台上，看着遥远的地球。辉夜来到她身旁，问出了所有人都想知道的问题。\n\n「你打赢了战争，却没有要求领土、王座或臣服。你究竟想从月都得到什么？」\n\n「一扇门。」紫回答。\n\n那不是供幻想乡占领月都的通道，也不是让月人重新干涉地表的入口。紫提议建立由双方共同管理的往来制度，让学者、医师、使者与避难者能够越过距离，同时让地球与月都都拥有关闭通道、拒绝侵犯的权力。\n\n永琳提醒她，门也可能成为下一次战争的入口。\n\n「所以它必须能从两边打开，也能从两边关上。」紫展开折扇，「边界可以区分彼此，却不该替任何一方证明另一方不应存在。」\n\n月都不必变成幻想乡，幻想乡也不会接受纯化。两个世界可以保留自己的道路、秩序与信仰，只是不再有谁能把差异写成灭绝的理由。"

 yakumo.73.a:0 "一个容得下两者的世界。"


 yakumo.74.t:0 "间隙关闭以前"

 yakumo.74.d:0 "宫城前的攻势已经无法挽回。前锋被月都守军分割，补给节点接连失效，鸟居后的间隙也开始从边缘崩解。\n\n蓝仍在计算最后一种反攻方案，紫却从地图上抬起头。眼前的景象与第一次月面战争太过相似：越来越长的伤亡数字、逐渐失去回应的部队，以及所有人对下一道命令的等待。\n\n第一次，她等到包围完全形成才承认失败。\n\n这一次，她没有。\n\n「停止进攻，全军撤退。」\n\n间隙中的妖力被全部转向返航。伤员首先通过，随后是失去指挥的部队、收回的遗物与阵亡者。每当一支队伍抵达地上，蓝便划去一个仍在月面的编号。\n\n有人请求紫先行返回，她摇了摇头。\n\n「我说过，不会把还能回来的人留在这里。」\n\n直到最后一声回应穿过间隙，紫才从月海退回鸟居。通道在她身后闭合，第二次远征暂时失败，却没有重演全军覆没的结局。"

 yakumo.74.a:0 "撤回地上，整补九十日。"


 yakumo.75.t:0 "鸟居后再次升起月光"

 yakumo.75.d:0 "九十日后，修复完成的定位装置在博丽神社后方依次亮起。\n\n重新集结的远征军与上一次并不相同。有人仍缠着绷带，有人接替了未能归来的指挥者，也有人选择留在地上。紫没有强迫任何幸存者再次踏入月海，却仍有许多人主动回到鸟居前。\n\n蓝报告新的坐标与月都防线变化。河童替补给装置增加了备用结构，草根运输队则把上次走不通的路线全部划去。失败没有从记录中消失，而是被改写成下一次进攻能够避开的陷阱。\n\n橙望着鸟居后逐渐成形的月面，轻声问道：「这一次还是同一个地方吗？」\n\n「是同一片月海。」蓝回答，「但已经不是同一支远征军。」\n\n紫将折扇向两侧展开。月光再次越过间隙，落在神社石阶之上。\n\n「那么，继续。」"

 yakumo.75.a:0 "重新开始远征。"


 yakumo.76.t:0 "长路归乡"

 yakumo.76.d:0 "最后一支联军穿过鸟居时，地上的风迎面吹入月面通道。许多士兵直到听见树叶声，才真正相信自己已经回到故乡。\n\n玲末与妖怪混合队伍守在间隙两侧，逐一核对返回部队的编号。永远亭医疗队将伤员直接送往临时病房，妖梦则领着白玉楼的使者接过遗物与亡魂。\n\n命莲寺在石阶下架起热锅，红魔馆的运输车辆卸下药品、毛毯与干净衣物。昔日彼此敌视的势力没有站在高台上庆祝，而是在泥地里抬担架、寻找失散者，并把温热的食物递给刚从月海回来的士兵。\n\n蓝念出最后一个编号。\n\n「全体返航确认。」\n\n紫站在已经开始缩小的间隙前，没有看向月都宫殿，只望着鸟居下那些重新与家人相认的人。她曾经想以一场战争拯救遥远的未来，如今终于明白，所谓胜利首先应当让眼前的人能够回来。\n\n间隙闭合以后，百妖协议的各委员会没有解散。曾经维持远征的运输、医疗与协调体系，将继续用于修复地表与月都留下的废墟。"

 yakumo.76.a:0 "让百妖协议转入共同重建。"

 yakumo.77.t:0 "科学与幻想"

 yakumo.77.d:0 "月都重新开放的第一座研究所里，河童正围着月面仪器争论结构，月人学者则试图为妖术建立能够重复观测的模型。隔壁庭院中，一位长期无人祭祀的地上神明收到月兔献上的第一份供品。\n\n一名年轻研究员看着仪器无法记录的神光，向紫问道：「无法测量的东西，也能算作真实吗？」\n\n紫没有直接回答，只让她回头看那部正在运转的机器。\n\n「科学让你理解已经显现的规律，幻想则提醒你，尚未被理解的事物并不等于不存在。」\n\n科学不会因为妖怪存在便失去意义，神明也不会因为有人能够解释雷电便立刻消失。一个依靠观察、验证与推理接近世界；另一个生长于信仰、记忆，以及人们仍愿意为未知留下的位置。\n\n真正使两个世界走向战争的，从来不是理解方式不同，而是其中一方坚持只有自己的真实配得上继续存在。\n\n研究员重新启动仪器。神光依旧没有出现在读数上，她却没有再急着把它判定为错误。"

 yakumo.77.a:0 "让已知与未知并肩存在。"


 yakumo.78.t:0 "梅莉与八云紫"

 yakumo.78.d:0 "庆典结束后的深夜，紫独自回到博丽神社。\n\n她展开那把陪伴自己多年的折扇。最内侧的扇骨上仍留着一行几乎褪尽的字迹——「梅莉」。数百年以后，她又在旁边签下「八云紫」。两种笔锋原本相距很远，随着岁月过去，却逐渐拥有了相同的停顿与转折。\n\n蓝不知何时来到身后。\n\n「梅莉已经消失了吗？」\n\n紫用指尖轻轻擦过那个旧名字。\n\n「没有。她只是走了太久，忘记了许多事情，也犯了许多无法挽回的错误。后来，世界开始用另一个名字称呼她。」\n\n梅莉并未在成为妖怪的那一天突然死去，八云紫也不是占据了她身体的陌生存在。穿越、孤独、幻想乡、两次月面战争，以及所有被她保护或伤害过的人，共同把那个来自科学世纪的少女带到了今日。\n\n紫不必回到过去，才能证明梅莉曾经存在；也不必抹去贤者的一生，才能怀念最初的自己。\n\n她提笔在两种字迹之间画下一条细线，然后重新合上折扇。"

 yakumo.78.a:0 "她从未凭空消失。"


 yakumo.79.t:0 "同一片星空下"

 yakumo.79.d:0 "战争结束后的第一个春夜，紫在最初的鸟居下摆了两杯咖啡。\n\n其中一杯放在自己面前，另一杯留给早已不可能按时赴约的人。她已经记不起科学世纪咖啡馆的模样，甚至把咖啡煮得过于苦涩，却仍记得从前每次观测结束以后，桌上总该有两个位置。\n\n紫展开莲子留下的星图。过去，这些线条指向一个被月都摧毁、只能向远古逃亡的未来；如今相同的星辰依旧悬在天上，通往那个结局的道路却已经偏离。\n\n她像莲子当年那样，根据星空说出观测结果。\n\n「时间：第二次月面战争结束后的第一个春天。」\n\n「地点：博丽神社。」\n\n紫停顿片刻，望向鸟居外安静的幻想乡，又透过细小的间隙看见月都重新亮起的街灯。\n\n「月亮仍在。地上也还在。」\n\n她把第二杯咖啡推向空着的位置。\n\n「莲子，我们没有回到原来的未来。」紫轻声说道，「但那个未来，终于不再只有一种结局。」\n\n没有人回答。星辰仍在两杯逐渐冷却的咖啡上方缓慢移动。\n\n对秘封俱乐部而言，这已经足以完成最后一次观测。"

 yakumo.79.a:0 "跨越千年的秘封故事，到此结束。"

 yakumo.81.t:0 "今日无需贤者出手"

yakumo.81.d:0 "紫在道路旁打开一道极窄的间隙，花了整个下午观察一家杂货铺。\n\n小妖怪买东西时少付了一枚铜钱，年迈的店主没有责骂，只让她下次帮忙搬货。河童修好了商人的车轮，双方却为了报酬争论许久，最后以一袋黄瓜成交。两名刚刚吵完架的孩子，则在下雨后挤进同一把伞下回家。\n\n蓝看过紫写下的内容，找不到任何值得上报的异常。\n\n「这些事情不会影响结界，也没有观察价值。」\n\n「正因如此才值得看。」紫合上笔记，「如果只有灾难与战争配得上记录，我们建立的世界便只在濒临毁灭时才算活着。」\n\n今天没有异变，没有人跨越不该跨越的边界，也没有谁需要贤者出面仲裁。紫对此十分满意。"

yakumo.81.a:0 "最好的观察结果，是无人需要她出手。"

yakumo.82.t:0 "购物清单只有一个答案"

yakumo.82.d:0 "紫让蓝去市场采购米、茶叶、蔬菜和晚餐食材。\n\n蓝回来时，篮子里装着白豆腐、嫩豆腐、冻豆腐、豆皮、豆腐干以及一盒刚做好的豆腐糕。紫翻遍篮底，没有找到清单上的任何东西。\n\n「豆腐含有充足营养，价格稳定，可以煎、煮、炸或凉拌。」蓝平静解释，「足以代替大部分原定采购项目。」\n\n橙从最底层翻出一包特意用油纸包好的油豆腐。\n\n「那这个也是为了营养吗？」\n\n「那是紧急储备。」\n\n「为什么紧急储备藏在最下面？」\n\n「避免被你偷吃。」\n\n当天晚上，八云家的餐桌上出现了七道豆腐料理。蓝坚持认为它们没有一道重复。"

yakumo.82.a:0 "狐狸的账本里，豆腐从不算重复。"

yakumo.83.t:0 "橙的完美潜入"

yakumo.83.d:0 "蓝禁止橙参加当天的会议，因为众人正在讨论如何替她准备一场惊喜宴会。\n\n会议开始不久，一只纸箱缓缓穿过走廊。箱底伸出两只脚，后方露着两条不断摆动的尾巴。它在门边停下，调整方向，又若无其事地向桌底移动。\n\n没有人揭穿她。紫继续讨论宴会日期，蓝继续安排食物，所有人都装作没有看见那只偶尔撞上桌脚的箱子。\n\n「关于橙最喜欢的菜——」\n\n「鱼！」箱子里立刻传出回答。\n\n房间陷入沉默。纸箱也僵在原地。\n\n片刻以后，橙从里面探出脑袋。\n\n「如果我说刚才是箱子在说话，你们会相信吗？」\n\n紫认真点了点头，蓝则在宴会采购单上默默增加了一条鱼。"

yakumo.83.a:0 "潜入十分完美，可惜箱子喜欢吃鱼。"

yakumo.84.t:0 "公主的强制休诊"

yakumo.84.d:0 "辉夜发现永琳已经连续数日没有离开诊室，于是以公主的名义宣布永远亭今日休诊。\n\n她先没收诊室钥匙。永琳从袖中取出备用钥匙。辉夜又找出七把备用钥匙，永琳则平静地打开了藏在药柜后的另一扇门。\n\n最终，辉夜直接躺上诊疗床。\n\n「我身体不适。」\n\n永琳终于停下工作：「哪里不舒服？」\n\n「我的主治医生长期过劳，导致我焦虑、烦躁，而且非常想把她绑到茶室休息。」\n\n「这不属于医学上的病症。」\n\n「患者已经明确表达不适，医生却拒绝处理。这样的诊断符合八意式规范吗？」\n\n永琳沉默片刻，确认自己找不到可以反驳的条文。半个时辰后，两人终于坐进庭院喝茶。\n\n辉夜宣布治疗顺利，永琳则把此次病例归类为公主滥用医疗制度。"

yakumo.84.a:0 "永琳第一次败给了自己的诊疗规范。"

yakumo.85.t:0 "医生看得见的谎话"

yakumo.85.d:0 "铃仙抱着药箱走进诊室，声称自己只是稍微有些疲倦。\n\n永琳没有拆穿她，只递来一张药方，让她念出上面的内容。铃仙逐字读完，甚至没有发现纸张始终倒在手里。\n\n「视线无法对焦，反应迟缓，妖力波动也不稳定。」永琳抽回药方，「你昨晚没有睡。」\n\n「月兔可以连续作战三天。」\n\n「你已经离开那支军队了，不必继续遵守它最糟糕的规定。」\n\n永琳重新写下一张处方。上面没有药物名称，只有八个时辰的强制休息，以及醒来后必须吃完的热粥。\n\n铃仙仍想抗议，却在诊疗床上坐了不到片刻便睡着了。永琳替她盖好外衣，继续处理文件，只把翻页的声音放得比平常更轻。\n\n铃仙醒来后抱怨这份处方毫无医学根据。\n\n永琳在记录末尾补上一句：患者已有力气顶嘴，恢复情况良好。"

yakumo.85.a:0 "在医生面前，「我没事」从来不是有效诊断。"

yakumo.86.t:0 "幸运胡萝卜大抽奖"

yakumo.86.d:0 "因幡帝推出了永远亭第一届幸运胡萝卜抽奖。每根胡萝卜售价不菲，其中一根藏着金色兔印，中奖者可以要求帝完成一个愿望。\n\n她印制宣传单、安排摊位，还在规则最下方写满几乎无法辨认的小字。活动开始不到半日，所有胡萝卜便被抢购一空。帝坐在成堆的钱币旁，确信自己再次完成了一项无人能够模仿的天才生意。\n\n她唯一没有预料到的是，铃仙为了保证公平，事前重新打乱了全部胡萝卜。\n\n辉夜打开自己随手买下的一根，金色兔印从中掉了出来。\n\n「我的愿望很简单。」辉夜展开一叠账单，「请帝偿还拖欠仓库的货款，整理三个月没有核对的账目，再把活动结束后的垃圾全部收拾干净。」\n\n抽奖所得恰好足够偿还欠款。帝忙到深夜，最终一枚铜钱也没有留下。\n\n她的计划获得空前成功，只是受益者不包括她自己。"

yakumo.86.a:0 "她赚到了一个偿还全部债务的机会。"

yakumo.87.t:0 "庭师的园艺课程"

yakumo.87.d:0 "妖梦决定开设园艺课程，纠正众人认为修剪花木只需挥刀的误解。\n\n第一课很简单：观察面前的幼树，在确认哪些枝条妨碍生长以前，任何人都不许动剪刀。\n\n一名妖精认为树苗口渴，连续浇了三桶水。另一名学生为了观察根部，直接把幼树从土里拔了出来。橙发现树上有毛毛虫，追赶时又撞翻了装满肥料的木桶。\n\n妖梦花了整个下午排水、培土、重新栽种，还救回了那只差点被橙踩扁的毛毛虫。课程结束时，原本准备讲解的修枝技巧一个字也没能提到。\n\n学生们围着勉强站直的幼树，询问什么时候开始高级课程。\n\n妖梦看了看手中的教学计划，默默划掉了「使用长刀修剪高枝」这一章节。"

yakumo.87.a:0 "高级修枝课程将无限期延期。"

yakumo.88.t:0 "完成之后再加一点"

yakumo.88.d:0 "妖梦花费整个上午，在白玉楼庭院里完成了一座枯山水。白砂、青石与一株修剪整齐的矮松彼此呼应，没有任何多余之物。\n\n幽幽子看了一会儿，觉得庭院太空，于是放下一把纸伞。纸伞旁边没有座位显得奇怪，她便搬来桌椅；有了桌椅却没有茶点，又显得不够周到。\n\n等妖梦回来时，庭院里已经摆满点心、灯笼与酒壶。幽灵乐师在矮松旁演奏，几名亡魂则围着原本象征流水的白砂跳舞。\n\n「幽幽子大人，我原来的庭院呢？」\n\n「还在呀。」幽幽子指向宴席底下仅剩的一小块白砂，「我只是觉得完成以后，可以再加一点。」\n\n妖梦望着彻底消失的留白，又看见所有来客都玩得十分开心，最终不知道该从哪里开始收拾。\n\n幽幽子则满意地宣布，这座枯山水现在终于有了生气。"

yakumo.88.a:0 "幽幽子从不允许留白保持空白。"

yakumo.89.t:0 "纯狐并不在意那只月兔"

yakumo.89.d:0 "铃仙最近总能在迷途竹林边缘看见纯狐。\n\n第一次，纯狐声称自己只是经过。第二次，她带来一篮适合月兔食用的胡萝卜，解释那是赫卡提亚买多了。第三次，她甚至准确指出铃仙连续值了两个夜班，应该暂时停止使用会影响睡眠的药物。\n\n「你为什么知道得这么清楚？」铃仙终于问道。\n\n「只是听说。」\n\n「从谁那里听说？」\n\n纯狐没有回答。她知道铃仙何时结束巡逻，知道她已经很少使用月面的军礼，也知道每逢满月，永远亭总有一扇窗会整夜亮着。\n\n「你曾是月都的士兵，却选择离开那里。」纯狐许久后才开口，「我只是想知道，一个逃离月亮的人，是否真能不再被月亮决定余生。」\n\n铃仙沉默了一会儿。\n\n「有时还是会梦见以前的事。」她说道，「不过明天还有患者等我送药，帝也一定会惹出新的麻烦。所以醒来以后，我还是得起床。」\n\n纯狐似乎得到了答案。她留下一个能够驱散噩梦的护符，转身走向竹林之外。\n\n「那不是特意为你准备的。」\n\n「我还什么都没问。」"

yakumo.89.a:0 "她只是碰巧知道得太多。"

yakumo.90.t:0 "三界无法理解的流行"

yakumo.90.d:0 "赫卡提亚穿着本季新装出席会议时，所有人都停止了交谈。\n\n她的上衣写着醒目的「WELCOME ♥ HELL」，左右衣袖分别采用红色和蓝色，腰间挂着锁链与缩小的星球，鞋子则只有一只是长靴。射命丸文盯着那套服装研究许久，最终谨慎地询问其中是否隐藏着三界运行的神秘象征。\n\n「没有。」赫卡提亚回答，「只是很酷。」\n\n她随后展示了替联军设计的新制服：火焰形披肩、能够自行发光的星球帽，以及印着地狱入口位置的短裙。永琳指出发光装饰会暴露夜间位置，蓝认为星球帽会妨碍行动，妖梦则无法理解短裙为何需要十二条锁链。\n\n所有设计接连遭到否决。赫卡提亚仍不气馁，将最后一件样品递给纯狐。那是一件黑色上衣，胸前的月亮被画上了一个巨大的红叉。\n\n纯狐仔细看了片刻。\n\n「这一件可以留下。」\n\n赫卡提亚立刻宣布自己的设计已经获得专业认可。"

yakumo.90.a:0 "这种审美已经超越三界。"

yakumo.91.t:0 "一莲二幽三大八"

yakumo.91.d:0 "六封相同的邀请函，将圣白莲、西行寺幽幽子、风见幽香、八云紫、八意永琳与八坂神奈子请到同一场下午茶会。\n\n白莲带来亲手泡制的茶，幽幽子准备了足够十人享用的点心，幽香为桌面换上新鲜花卉。永琳带来帮助消化的药物，神奈子坚持茶会也应该准备酒，紫则在所有工作完成以后才从间隙中出现。\n\n桌上只留着一张卡片：\n\n「献给幻想乡最具资历的六位少女——一莲二幽三大八。」\n\n短暂的沉默后，神奈子首先质疑排列顺序，认为神明的岁月不能与人类算法相提并论。永琳指出不老者的生理年龄没有统计价值，紫则坚持自己永远只有十七岁。\n\n白莲试图说明年龄象征阅历，不应被视为冒犯。幽幽子对此毫不在意，因为她已经吃完第一盘点心。幽香始终保持微笑，只想知道究竟是谁寄出了邀请。\n\n第二天，《文文。新闻》刊出了六人围坐饮茶的照片，标题正是「幻想乡最具资历的少女们」。\n\n当日下午，妖怪山的报社紧闭门窗，无人应门。"

yakumo.91.a:0 "射命丸文今天似乎不在家。"

yakumo.92.t:0 "翘课地点选择错误"

yakumo.92.d:0 "在科学世纪，秘封俱乐部也曾认真从事过一项普通学生都能理解的活动——翘课。\n\n莲子与梅莉避开大学的监控，前往一座废弃地下观测站。那里刚好出现无法用现有理论解释的空间偏移，比梦美教授下午那堂理论物理课程有趣得多。\n\n两人完成仪器架设，正准备庆祝行动成功，观测站尘封多年的铁门却突然从外面打开。\n\n冈崎梦美抱着点名册与折叠黑板走了进来。\n\n「两名学生同时缺席，而城市里又出现了未经申报的空间异常。」她放下黑板，「要推算你们的位置，并不困难。」\n\n莲子试图解释这是秘封俱乐部的独立研究。梅莉则悄悄收起写有两人姓名的器材箱。\n\n梦美没有要求她们返回学校。她直接把黑板立在异常空间旁，宣布今天改为现场教学，并让两名逃课学生负责分析观测结果。\n\n「既然你们认为这里比教室有趣，我就把教室搬过来。」\n\n那天下午，莲子与梅莉获得了梦寐以求的实地研究机会，以及一场没有任何准备时间的口头考试。"

yakumo.92.a:0 "她们逃出了教室，却没能逃过课程。"


 yakumo.99.t:0 "感谢游玩八云紫路线"

 yakumo.99.d:0 "感谢你陪伴八云紫走完这段跨越千年的旅程。\n\n从结界危机、百妖集结，到地表解放与第二次月面战争，你见证了她重新面对第一次远征留下的失败，也陪她回答了那个从梅莉时代延续至今的问题：当彼此不同的生命、记忆与世界发生冲突时，是否只能由最强的一方决定谁有资格留下。\n\n她最终没有以幻想乡的胜利摧毁月都，也没有让月都的科学、神祇与文化随着旧政权一同消失。她保留了两个世界之间的边界，也为双方留下了一扇能够共同开启的门。\n\n因为差异可以让我们成为彼此，却不该成为抹去对方的理由。\n\n八云紫的故事暂时在这里落下句点，但《幻想乡：共存或灭绝》的世界其他人的故事还没结束。\n\n无论你如何抵达这里，都谢谢你愿意陪她走到同一片星空之下。"

 yakumo.99.a:0 "愿同一片星空，容得下所有人。"