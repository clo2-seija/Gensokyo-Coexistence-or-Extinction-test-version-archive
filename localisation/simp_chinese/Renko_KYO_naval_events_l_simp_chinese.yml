l_simp_chinese:
 Renko_KYO_naval_event1_preview_tt:0 "§Y事件前瞻§!：整理§C旧日本帝国的海军设计资料§!，选择舰船与舰载机设计的§Y命名语言§!。\n随后触发：“§Y来自未来的通信§!”。"
 Renko_KYO_naval_event2_preview_tt:0 "§Y事件前瞻§!：收到一则“§Y来自未来的通信§!”，可以§C将现有舰队替换为一支更精良的舰队§!。"
 Renko_KYO_naval.1.t:0 "选择设计名称的语言"
 Renko_KYO_naval.1.d:0 "由于技术限制，由我提供的舰船与舰载机设计名称无法随游戏语言自动切换。在将这些设计正式编入幻想乡的海军名录以前，请先选择它们今后采用的命名语言。\n\n这一选择也会决定随后获得的联合舰队使用中文名称还是英文名称。"
 Renko_KYO_naval.1.a:0 "中文"
 Renko_KYO_naval.1.b:0 "英文"
 Renko_KYO_naval.2.t:0 "来自未来的通信"
 Renko_KYO_naval.2.d:0 "幻想乡的朋友们，如果你们能看到这段来信，说明你们大概已经缴获了旧日本帝国的联合舰队，尽管这已经是一支庞大的海军力量，但如果你们未来需要和月之都的舰队交战，他们可能起不到什么作用。我有一个提议，将你们所有的舰队交给我，我会从另一个时空中给你们带来一支更强大的联合舰队，他们应该能撑的更久一些，不过由于月之都采取的是更加先进的海战思想，即使是这支舰队也不能帮助你们轻松获胜。那么，你们接受这笔交易吗？——宇佐见莲子"
 Renko_KYO_naval.2.a:0 "当然！"
 Renko_KYO_naval.2.b:0 "不，现在的就好"
 Renko_KYO_replace_naval_fleet_tt:0 "§R失去当前所有舰队§!，§C获得一支更加强大的联合舰队以及相关设计§!"
