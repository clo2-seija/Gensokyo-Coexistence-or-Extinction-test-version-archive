l_simp_chinese:
 Renko_KYO_naval_event1_preview_tt:0 "事件前瞻：整理旧日本帝国的海军设计资料，选择舰船与舰载机设计的命名语言。"
 Renko_KYO_naval_event2_preview_tt:0 "事件前瞻：一则来自未来的通信，允许我们将当前舰队替换为一支更加优良的舰队。"
 Renko_KYO_naval.1.t:0 "旧帝国的海军遗产"
 Renko_KYO_naval.1.d:0 "缴获的舰艇图纸与海军研究所的资料终于整理成册。河童们从中选出了一批适合我们建造的舰船和舰载机设计，并将后续制造工作交给幻想乡的军工组织。\n\n在正式编入设计目录之前，还有一个小问题：这些舰船与飞机，应当以中文名称登记，还是沿用英文名称？我们的选择也将决定随后接收舰队时使用的名称。"
 Renko_KYO_naval.1.a:0 "使用中文名称。"
 Renko_KYO_naval.1.b:0 "使用英文名称。"
 Renko_KYO_naval.2.t:0 "来自未来的通信"
 Renko_KYO_naval.2.d:0 "一则来源不明的通信接入了海军的联络频道。对方自称来自未来，并提出用一支编制更加完善的舰队，替换我们目前拥有的全部海军。河童们反复核对了随通信送来的资料：主力舰、侦察舰、袭击舰与护航舰各司其职，整支舰队将在横须贺集结。\n\n这份提议需要我们作出决定。接受后，现有全部军舰将被移除，代之以四大舰队、二十个特遣舰队，共一百九十二艘舰船。我们也可以拒绝，继续依靠自己的舰队。"
 Renko_KYO_naval.2.a:0 "接受提议，替换现有全部舰队。"
 Renko_KYO_naval.2.b:0 "保留我们自己的舰队。"
 Renko_KYO_replace_naval_fleet_tt:0 "§R删除幻想乡当前所有海军舰船，不限所在地。§!\n随后在横须贺获得§Y192艘§!舰船，编为§Y4大舰队、20个特遣舰队§!，使用此前选择的命名语言。\n本次替换不附带舰载机航空队。"
 Renko_KYO_keep_naval_fleet_tt:0 "保留当前舰队，不接收替换舰队。"
