# 分节：Renko_LUN_annual_technology_l_simp_chinese
 Renko_LUN_annual_technology_category:0 "月都年度技术整备"
 Renko_LUN_annual_technology_category_desc:0 "每年年初，可免费接收上一年度的技术成果，每个年度批次仅能领取一次。工业路线采用分散工业与流水线生产；不发放特殊项目直接授予的隐藏成果。沿用全DLC科技范围：1936年以前的技术归入1936年批次，1945年以后的技术归入1945年批次。"
 Renko_LUN_free_tech_1936:0 "接收1936年度技术成果"
 Renko_LUN_free_tech_1936_desc:0 "自1937年1月1日起，免费取得1936年度批次中的91项技术。每个批次仅可领取一次，已掌握的技术保持不变。具体范围遵循本分类的技术整备规则。"
 Renko_LUN_free_tech_1937:0 "接收1937年度技术成果"
 Renko_LUN_free_tech_1937_desc:0 "自1938年1月1日起，免费取得1937年度批次中的10项技术。每个批次仅可领取一次，已掌握的技术保持不变。具体范围遵循本分类的技术整备规则。"
 Renko_LUN_free_tech_1938:0 "接收1938年度技术成果"
 Renko_LUN_free_tech_1938_desc:0 "自1939年1月1日起，免费取得1938年度批次中的20项技术。每个批次仅可领取一次，已掌握的技术保持不变。具体范围遵循本分类的技术整备规则。"
 Renko_LUN_free_tech_1939:0 "接收1939年度技术成果"
 Renko_LUN_free_tech_1939_desc:0 "自1940年1月1日起，免费取得1939年度批次中的43项技术。每个批次仅可领取一次，已掌握的技术保持不变。具体范围遵循本分类的技术整备规则。"
 Renko_LUN_free_tech_1940:0 "接收1940年度技术成果"
 Renko_LUN_free_tech_1940_desc:0 "自1941年1月1日起，免费取得1940年度批次中的32项技术。每个批次仅可领取一次，已掌握的技术保持不变。具体范围遵循本分类的技术整备规则。"
