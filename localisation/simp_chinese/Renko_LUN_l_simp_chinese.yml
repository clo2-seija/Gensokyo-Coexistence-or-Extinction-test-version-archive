 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols:0 "增派巡逻"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols_desc:0 "增派巡逻"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training:0 "全天候训练"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training_desc:0 "全天候训练"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery:0 "熟练舰艇袭击"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery_desc:0 "熟练舰艇袭击"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics:0 "月人航空雷击"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_desc:0 "地上舰队把港湾视作屏障，把波涛视作掩护。月都的航空兵将反复校准进攻航线，寻找舰艇在近岸和远洋暴露的空隙。\n\n巡逻机送回目标，雷击机贴近海面，护航战机掩护接敌。投下鱼雷以前，每支编队都必须清楚自己的航向与归路。"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_add_mastery_bonus_effect_tooltip:0 "获得§Y月人航空雷击§!学说精通度增长加成。"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes:0 "广泛使用可抛副油箱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes_desc:0 "广泛使用可抛副油箱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover:0 "全方位阵型防守"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover_desc:0 "全方位阵型防守"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors:0 "全面的飞行员训练"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors_desc:0 "全面的飞行员训练"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting:0 "战斗机引诱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting_desc:0 "战斗机引诱"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce:0 "省油专家"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce_desc:0 "省油专家"
 Renko_LUN_air_subdoctrine_long_range_escort:0 "月人远程护航"
 Renko_LUN_air_subdoctrine_long_range_escort_desc:0 "随着地表据点向外延伸，航空部队也将离开熟悉的机场与海岸。护航机必须把受保护的航路延续到目标上空，再把同伴带回。\n\n航线、油料与相互掩护一并列入飞行计划。即使远离月都的白色据点，远征军也不应在返航途中失去接应。"
 Renko_LUN_air_subdoctrine_long_range_escort_add_mastery_bonus_effect_tooltip:0 "获得§Y月人远程护航§!学说精通度增长加成。"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_high_level_bombing:0 "防御方阵"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_high_level_bombing_desc:0 "防御方阵"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_experienced_gunners:0 "集体火力"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_experienced_gunners_desc:0 "集体火力"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_pilot_rescue_missions:0 "失效引擎顺桨"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_pilot_rescue_missions_desc:0 "失效引擎顺桨"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_extensive_training:0 "资深机组团队合作"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_extensive_training_desc:0 "资深机组团队合作"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_safety_landing_procedures:0 "量产可靠性改进"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_safety_landing_procedures_desc:0 "量产可靠性改进"
 Renko_LUN_air_subdoctrine_flying_fortresses:0 "月人空中堡垒"
 Renko_LUN_air_subdoctrine_flying_fortresses_desc:0 "地上的反抗仍有工厂、铁路与坚固据点支撑。重型航空部队将奉命攻击这些目标，使远征军推进时面对更少的增援与补给。\n\n远程出击需要训练有素的机组、严整的自卫火力与可靠的返航规程。月面的命令要持续抵达，执行命令的人就必须能够再次升空。"
 Renko_LUN_air_subdoctrine_flying_fortresses_add_mastery_bonus_effect_tooltip:0 "获得§Y月人空中堡垒§!学说精通度增长加成。"
 Renko_LUN_lunar_host:0 "月之军势"
 Renko_LUN_lunar_host_desc:0 "白衣先遣队已经越过地月之间的道路，月兔的波长通信在地上的军营中接连响起。绵月姐妹要将这些分散的部队编成能够执行净化敕令的侵军。\n\n步兵越过山林与河岸，装甲沿打开的缺口推进，舰炮与航空兵依次接应。月都的兵器与术式须在同一道号令下运转，直到白色据点连成通向敌人腹地的战线。"
 Renko_LUN_lunar_host_add_mastery_bonus_effect_tooltip:0 "获得§Y月之军势§!学说精通度增长加成。"
 Renko_LUN_lunar_host_Renko_highland_armaments:0 "月面军械定式"
 Renko_LUN_lunar_host_Renko_highland_armaments_desc:0 "来自月面的兵器必须按统一规程整备与补充。把装备交到熟悉山路的先遣队手中，让每一次攀登都能得到足够的火力支持。"
 Renko_LUN_lunar_host_Renko_pathfinder_breakthrough:0 "白衣穿林"
 Renko_LUN_lunar_host_Renko_pathfinder_breakthrough_desc:0 "林木、街巷与起伏的地势遮断装甲视野时，由侵军步兵先行查清进路。待波长通信传回位置，中坦便沿她们打开的缺口投入突击。"
 Renko_LUN_lunar_host_Renko_joint_fire_coordination:0 "奉敕合围"
 Renko_LUN_lunar_host_Renko_joint_fire_coordination_desc:0 "岸上的炮火、海上的舰队与空中的编队必须回应同一道军令。先遣队标出目标，装甲稳住突破口，后续兵力依照司令部的时序抵达。"
 Renko_LUN_lunar_host_Renko_assault_cohesion:0 "侵军战列"
 Renko_LUN_lunar_host_Renko_assault_cohesion_desc:0 "月兔分队收紧突击队形，在狭窄的进路上保持火力与联络。前队越过岸线，后队立即接续；装甲随后跟进，不让刚刚打开的道路重新落入敌手。"
 Renko_LUN_lunar_host_Renko_special_warfare_integration:0 "月都之威"
 Renko_LUN_lunar_host_Renko_special_warfare_integration_desc:0 "从月面出发时，她们分属不同的部队；走向地上敌阵时，她们共同承接绵月姐妹的军令。步兵与装甲反复磨合，直至整支侵军能够按照同一节奏前进。"
 Renko_LUN_adopt_designated_doctrines:0 "确立月都三军学说"
 Renko_LUN_adopt_designated_doctrines_desc:0 "地表的白色据点陆续接通，分散待命的先遣队等待来自月面的命令。月战最高司令部将颁行统一的征战规程，使陆海空各军与侵军特战部队依照同一套部署行动。\n\n敕令下达以后，各部须完成训练与协同演练。待军旗升起，月都在地上准备已久的力量，便将一同投入战争。"
 Renko_LUN_adopt_designated_doctrines_tt:0 "将陆海空主学说切换为§Y月人缜密战备§!、§Y月人航空制海§!、§Y月人空域统合§!，并选用全部§Y12项§!配套专属子学说。\n特种主学说选用§Y精英特种部队§!，第一轨道选用§Y月之军势§!。\n为以上§Y13项子学说§!各给予§G1000§!精通度，足以完成全部奖励。"

