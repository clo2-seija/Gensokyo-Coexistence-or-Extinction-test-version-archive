 Renko_LUN_commandos:0 "月人卓越单兵"
 Renko_LUN_commandos_desc:0 "月人负责指挥，月兔组成精锐。这支踏上地表的军队必须以严格训练维持月都的威仪，不能只依赖武器上的优势。\n\n从分队射击、伤员转送到战场情报回报，每名士兵都须熟悉自己的职责。即使在山林与街巷中脱离大队，白色军服下的队列仍要服从同一道军令。"
 Renko_LUN_commandos_add_mastery_bonus_effect_tooltip:0 "获得§Y月人卓越单兵§!学说精通度增长加成。"
