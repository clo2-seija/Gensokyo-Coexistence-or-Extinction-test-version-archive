# 分节：Renko_LUN_elite_training_l_simp_chinese
 Renko_LUN_elite_soldier_training:0 "月都精锐士兵训练"
 Renko_LUN_elite_soldier_training_desc:0 "将月都科技、术式运用与战场纪律纳入统一训练体系，扩大能够承担地表远征任务的精锐军队规模。"
 Renko_LUN_elite_soldier_training_tt:0 "永久获得：\n特种部队容量上限：§G+1000%§!\n特种部队上限：§G+1000§!"
 Renko_LUN_elite_soldier_training_hidden_idea:0 "月都精锐训练体系"
 Renko_LUN_elite_soldier_training_hidden_idea_desc:0 "月都统一的精锐训练体系为特种部队扩编提供持续保障。"

# 分节：Renko_LUN_infrastructure_l_simp_chinese
 Renko_LUN_automated_infrastructure:0 "月都自动化基建"
 Renko_LUN_automated_infrastructure_desc:0 "将月都的自动化施工力量投入地面道路与运输网络建设，迅速完善各控制地区的基础设施。"
 Renko_LUN_automated_infrastructure_tt:0 "立即将所有控制地区未满级的基础设施建至§Y5级§!，包括占领地区。"

# 分节：Renko_LUN_integration_l_simp_chinese
 Renko_LUN_integrate_controlled_states:0 "月都领土整合：[FROM.GetName]"
 Renko_LUN_integrate_controlled_states_desc:0 "将[FROM.GetName]正式纳入月都。该州由我们控制且顺从度达到50%后，即可免费将其转为月都核心州。"

# 分节：Renko_LUN_invasion_units_l_simp_chinese
 Renko_LUN_invasion_infantry:0 "月都侵军步兵营"
 Renko_LUN_invasion_infantry_desc:0 "以月都科技与术式强化的精锐作战营，计入特种部队容量。负责复杂地形中的突击与占领，使用步兵装备。"
 Renko_LUN_invasion_medium_armor:0 "月都侵军中坦营"
 Renko_LUN_invasion_medium_armor_desc:0 "以月都科技与术式强化的精锐作战营，计入特种部队容量。以中型坦克承担正面突破，使用普通中型坦克装备。"
 Renko_LUN_invasion_medium_tankdestroyer:0 "月都侵军中坦歼营"
 Renko_LUN_invasion_medium_tankdestroyer_desc:0 "以月都科技与术式强化的精锐作战营，计入特种部队容量。负责反装甲作战，使用中型坦克歼击车装备。"
 Renko_LUN_invasion_medium_anti_air_support:0 "月都侵军中防空团属支援连"
 Renko_LUN_invasion_medium_anti_air_support_desc:0 "以月都科技与术式强化的团属支援连，不计入特种部队容量。为步兵、机动与装甲团提供随行防空，使用中型自行防空炮装备。"
 Renko_LUN_invasion_heavy_tankdestroyer_support:0 "月都侵军重坦歼团属支援连"
 Renko_LUN_invasion_heavy_tankdestroyer_support_desc:0 "以月都科技与术式强化的团属支援连，不计入特种部队容量。为装甲及战斗支援团提供重型反装甲火力，使用重型坦克歼击车装备。"
 Renko_LUN_invasion_units_tech:0 "月都侵军编制"
 Renko_LUN_invasion_units_tech_desc:0 "解锁月都侵军三个特种营及两种团属支援连。"

# 分节：Renko_LUN_lunar_sea_fleet_l_simp_chinese
 Renko_LUN_form_lunar_sea_fleet:0 "组建月海舰队"
 Renko_LUN_form_lunar_sea_fleet_desc:0 "月都已在地上掌握海军基地。月战最高司令部将一次性调集海上兵力，以主力舰相互掩护、舰载航空兵夺取海空优势，将月都的军令送往远方海岸。"
 Renko_LUN_form_lunar_sea_fleet_tt:0 "一次性接收§Y3批§!海军增援。各类设计齐备时，共计§Y120艘§!：12艘护航航母、18艘重巡洋舰、12艘正规航母、48艘战列舰（含超重战列舰）和30艘潜艇（含潜母），足以组成§Y3支理想制海舰队及3支理想潜艇特遣队§!。未定型舰种将跳过；载机舰还须具备舰战和舰攻设计。舰船进入预备舰队，由后续编组分配。\n同时按载机舰基础甲板容量发放舰战和舰攻库存，合计两套容量，不自动建立或装载航空队。"
 Renko_LUN_lunar_sea_fleet_disrupted_idea:0 "月海舰队：指挥失序"
 Renko_LUN_lunar_sea_fleet_disrupted_idea_desc:0 "反抗思想与失效的命令打乱了月海舰队的统一部署。主力舰仍保有月都技术赋予的防护与火力，舰载机也仍能出击，但过去贯通侦察、伏击与追击的严密协作已经瓦解。"
 Renko_LUN_lunar_sea_fleet_idea:0 "月海舰队"
 Renko_LUN_lunar_sea_fleet_idea_desc:0 "月都的舰队将以主力舰相互掩护，以舰载航空兵夺取海空优势。自海上展开的统一军令，将使巡逻、迎击与远征彼此衔接，让月之都的威势抵达地上每一片海岸。\n\n本精神提供60%的只使用主力舰时的屏卫加成；当“月人航母集群”的“航母独立性”奖励同时生效时，该修正合计为90%。"

# 分节：Renko_LUN_lunar_war_high_command_l_simp_chinese
 Renko_LUN_lunar_war_high_command_category:0 "月战最高司令部"
 Renko_LUN_lunar_war_high_command_category_desc:0 "月之都地表远征的最高指挥机构，负责统筹战争准备、军需与后续作战事务。"
 Renko_LUN_mount_connects_sea_and_mountain_supply:0 "连接山海"
 Renko_LUN_mount_connects_sea_and_mountain_supply_desc:0 "绵月丰姬能够连接月之海与地上的山川。月战最高司令部将以此建立不受凡世距离束缚的补给体系。"
 Renko_LUN_mount_connects_sea_and_mountain_supply_tt:0 "为§Y月之都§!获得§Y+9999%补给范围§!，并为§Y全球所有州§!增加§Y50当地补给§!。州级补给由当前控制方使用，敌我双方均可受益。"
 Renko_LUN_connects_sea_and_mountain_state_modifier:0 "连接山海的能力"
 Renko_LUN_connects_sea_and_mountain_state_modifier_desc:0 "绵月丰姬将月之海与地上的山川相连，使横亘世界的距离不再成为军队运输补给的阻碍。"

# 分节：Renko_LUN_manpower_l_simp_chinese
 Renko_LUN_recruit_moon_rabbits:0 "征兆月兔入伍"
 Renko_LUN_recruit_moon_rabbits_desc:0 "人力低于100万时，可征集月兔入伍，获得100万人力。此决议可重复执行。"
 Renko_LUN_block_moon_rabbit_recruitment_tt:0 "月都将无法再使用“征兆月兔入伍”决议补充人力。"
 Renko_LUN_moon_rabbit_recruitment_available_tt:0 "月兔征募尚未被“翻转主义”瓦解"

# 分节：Renko_LUN_mio_l_simp_chinese
 Renko_LUN_lunarian_manufacturing_organization:0 "月人制造"
 Renko_LUN_lunarian_manufacturing_organization_desc:0 "月都的军械工坊以统一的制造定式统合陆海空军装备。从侵军的单兵武器到跨海舰队与远程飞行器，每一件成品都经过精密加工与净化检验，为月人指挥下的军势提供可靠而高效的军备。"
 Renko_LUN_lunarian_manufacturing_initial_trait:0 "高天原制造商"
 Renko_LUN_lunarian_craftsmanship_policy:0 "月人工艺"
 Renko_LUN_lunarian_craftsmanship_policy_desc:0 "以月人的精密工艺与材料统筹，提高装备可靠性并减少生产资源消耗。"

# 分节：Renko_LUN_occupation_laws_l_simp_chinese
 Renko_LUN_lunar_administration_law:0 "月都统制"
 Renko_LUN_lunar_administration_law_desc:0 "以月都的行政体系接管地上社会，迅速建立服从秩序，将当地工业、资源与人力纳入月都的统一调度。"

# 分节：Renko_LUN_offsite_industry_l_simp_chinese
 Renko_LUN_lunar_industrial_support:0 "月面工业支援"
 Renko_LUN_lunar_industrial_support_desc:0 "调动月面的工业产能，为地上行动提供持续的建设与军备支援。"
 Renko_LUN_lunar_sea_dockyard_support:0 "月海船坞支援"
 Renko_LUN_lunar_sea_dockyard_support_desc:0 "以控制的港口为接应点，引入月海船坞的造舰产能，支援舰队建设。"

# 分节：Renko_LUN_production_l_simp_chinese
 Renko_LUN_production_loop_start:0 "启动军备生产调度"
 Renko_LUN_production_loop_start_desc:0 "由军备局定期检查中型坦克与中型歼击车的库存，协调陆军装备生产。"
 Renko_LUN_production_cycle_mission:0 "军备生产调度"
 Renko_LUN_production_cycle_mission_desc:0 "每30日检查一次装甲装备库存：中型坦克按需增产，中型歼击车按需增产或温和减产。"

# 分节：Renko_LUN_resources_l_simp_chinese
 Renko_LUN_lunar_resource_stockpile:0 "月面资源贮藏"
 Renko_LUN_lunar_resource_stockpile_desc:0 "将月面贮藏的战略物资运至当前首都，建立支撑工业生产和三军行动的资源与燃油保障。"
 Renko_LUN_lunar_resource_support_hidden_idea:0 "月面资源保障"
 Renko_LUN_lunar_resource_stockpile_tt:0 "获得永久隐藏增益：战略资源获取§G+200%§!、燃油获取§G+200%§!、燃油容量§G+400%§!，陆军、海军和空军燃油消耗各§G−50%§!。"

# 分节：Renko_LUN_special_tank_modules_l_simp_chinese
 Renko_LUN_special_tank_modules_tech:0 "莲子特供装甲配件"
 Renko_LUN_special_tank_modules_tech_desc:0 "为月都装甲部队提供专门定制的引擎、武器与辅助模块。"
 Renko_LUN_tank_petrol_electric_engine:0 "莲子特供燃油-电力引擎"
 Renko_LUN_tank_petrol_electric_engine_desc:0 "供月都装甲部队使用的特制燃油-电力引擎。"
 Renko_LUN_tank_gas_turbine_engine:0 "莲子特供燃气涡轮发动机"
 Renko_LUN_tank_gas_turbine_engine_desc:0 "供月都装甲部队使用的特制燃气涡轮发动机。"
 Renko_LUN_easy_maintenance:0 "莲子特供易维护改装"
 Renko_LUN_easy_maintenance_desc:0 "供月都装甲部队使用的特制易维护改装。"
 Renko_LUN_auto_loader:0 "莲子特供自动装弹机"
 Renko_LUN_auto_loader_desc:0 "供月都装甲部队使用的特制自动装弹机。"
