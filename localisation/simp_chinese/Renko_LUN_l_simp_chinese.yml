 Renko_LUN_land_air_supply_cycle_mission:0 "陆空定期补给"
 Renko_LUN_land_air_supply_cycle_mission_desc:0 "月之军势每180天接收一批陆空增援。补给沿用现行编制与装备定型条件；每期另补充2000辆卡车、200列火车、500艘运输船。"
 Renko_LUN_naval_supply_cycle_mission:0 "月海舰队定期补给"
 Renko_LUN_naval_supply_cycle_mission_desc:0 "月海舰队每365天接收一批海军增援。补给沿用现行舰船定型与港口控制条件；每期另补充1000辆卡车、100列火车、1000艘运输船。"

# 分节：Renko_LUN_templates_l_simp_chinese
 Renko_LUN_mobilize_lunar_army:0 "整编月之军势"
 Renko_LUN_mobilize_lunar_army_desc:0 "以统一编制整合侵军步兵、装甲突击力量与骑兵镇压部队，完成配套技术准备，并在首都集结首批军势。"
 Renko_LUN_mobilize_lunar_army_tt:0 "额外获得10000辆卡车、1000列火车、2000艘运输船。\n先完成9种基础陆空装备定型，再创建编制与部队。\n获得编制：Renko Lunar Infantry Division、Renko Lunar Armored Division、Renko Lunar Cavalry Garrison。\n解锁配套科技、基础中型与重型坦克底盘，并完成直升机、工程车辆和喷火坦克特殊项目。\n在首都直接生成80个步兵师和20个装甲师，再接收3批陆空增援（每批4个步兵师、4个装甲师及配套装备库存）。合计生成92个步兵师和32个装甲师，初始装备比例设为100%。飞机仅发放已定型机种。"
 Renko_LUN_grant_dynamic_equipment_tt:0 "月都获得一批§Y陆军增援§!与§Y陆空装备补给§!。"
 Renko_LUN_grant_dynamic_navy_tt:0 "月都获得一批§Y海军舰艇增援§!。"

 # 月都独立难度与莲子的协助
 Renko_LUN_request_difficulty_selection:0 "发起月都难度选择"
 Renko_LUN_request_difficulty_selection_desc:0 "向幻想乡发送月都独立难度选择事件。"
 Renko_LUN_difficulty.1.t:0 "月都难度调整选单"
 Renko_LUN_difficulty.1.d:0 "建议您在此存档，以便之后有需要时重新读档选择难度。\n\n现在的月之都比发布初版强大许多，因此我们为其设计了专属难度选择页面。如果您希望获得轻松的体验，或者游戏经验尚不丰富，建议选择 §7EASY§! 难度进行挑战。\n\n§7EASY§!：月都对幻想乡作战时将受到大量攻击与防御惩罚。\n§6NORMAL§!：没有额外奖励或惩罚。\n§4HARD§!：月都将拥有更多部队。\n§OLUNATIC§!：月都在拥有更多部队的基础上，还会获得额外的强化加成。"
 Renko_LUN_difficulty.1.a:0 "§7白雪纷飞的程度(EASY)§!"
 Renko_LUN_difficulty.1.b:0 "§6漫天风霜的程度(NORMAL)§!"
 Renko_LUN_difficulty.1.c:0 "§4暴雪蔽日的程度(HARD)§!"
 Renko_LUN_difficulty.1.e:0 "§O雪虐风饕的程度(LUNATIC)§!"
 Renko_LUN_quantum_disturbance:0 "量子扰动"
 Renko_LUN_quantum_disturbance_desc:0 "在遥远的未来，魔法与神秘皆能被科技干涉；为了保护梅莉曾看见过的世界，莲子给月都的装备做了点手脚。"
 Renko_LUN_unlock_arcane_decryption_tt:0 "解锁决议组「§Y莲子的协助§!」及决议「§Y奥术解密§!」，允许在与§Y月都§!交战时获取月都的§Y特殊营§!和§Y特殊配件§!。"
 Renko_KYO_lunar_technology_category:0 "莲子的协助"
 Renko_KYO_arcane_decryption:0 "奥术解密"
 Renko_KYO_arcane_decryption_desc:0 "获得月都的特殊作战营和配件。"
 Renko_KYO_lunar_technology_category_desc:0 ""
 Renko_KYO_arcane_decryption_effect_tt:0 "获得月都的特殊作战营和配件。"
 Renko_LUN_extra_equipment_supply_tt:0 "§R月都获得更多额外装备补给§!"
 Renko_LUN_eternal_moon:0 "永恒之月"
 Renko_LUN_eternal_moon_desc:0 "月都的生产与军令如弦月般恒常。旧有经验不会随装备更迭消逝，整备完毕的军势也不会因进攻而遗忘防御。"
