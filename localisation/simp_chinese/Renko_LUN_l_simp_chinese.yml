 Renko_LUN_streamlined_deployment:0 "月人精简装甲"
 Renko_LUN_streamlined_deployment_desc:0 "覆盖净化材料的装甲车辆已经进入地表，但再先进的兵器也需要整备、弹药与合适的编制。月战最高司令部将统一装甲部队的装备与补充规程。\n\n中坦集中用于突破，中坦歼维持反装甲火力，随行支援各司其职。让军械持续抵达，让受损部队及时补齐，远征才能按月都的时序继续。"
 Renko_LUN_streamlined_deployment_add_mastery_bonus_effect_tooltip:0 "获得§Y月人精简装甲§!学说精通度增长加成。"
