 Renko_LUN_grand_battleplan:0 "月人缜密战备"
 Renko_LUN_grand_battleplan_desc:0 "地上的诸国仍在以自己的名义发布军令，月面的敕令却早已先于军队抵达。秘密通道、军需仓库与待命部队，必须依照同一份计划投入战争。\n\n月战最高司令部将每一次集结、每一轮炮击与每一支预备队编入既定时序。待先遣队升起月都的旗帜，地上的抵抗者才会发现，包围已经完成。"
