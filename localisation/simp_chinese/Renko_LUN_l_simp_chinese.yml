 Renko_LUN_long_range_submarines_Renko_support_the_surface_desc:0 "主力舰队支援战术"
 Renko_LUN_long_range_submarines_Renko_stowage_efficiency:0 "潜艇积载效率"
 Renko_LUN_long_range_submarines_Renko_stowage_efficiency_desc:0 "潜艇积载效率"
 Renko_LUN_long_range_submarines_Renko_deep_water_supremacy:0 "深海优势"
 Renko_LUN_long_range_submarines_Renko_deep_water_supremacy_desc:0 "深海优势"
 Renko_LUN_long_range_submarines:0 "月人远洋潜航"
 Renko_LUN_long_range_submarines_desc:0 "地上的舰队可以封锁港口，却难以看清远洋深处。月都的潜航部队将在漫长航路上监视敌舰，为主力舰队寻找接近与攻击的时机。\n\n航程、隐蔽与积载必须服从长期远征的需要。让敌人每一次出海，都无法确定水下是否已有月都的兵器在等待。"
 Renko_LUN_long_range_submarines_add_mastery_bonus_effect_tooltip:0 "获得§Y月人远洋潜航§!学说精通度增长加成。"
