l_simp_chinese:
 

kyo_postwar.1.t:0 "胜利品的两种用途"
kyo_postwar.1.d:0 "帝国议会的侧厅已被改成战利品清查处。\n\n日军留下的卡车、列车、机床、火炮与零件堆满走廊。部分器材仍可直接使用，部分已被前线修补数次，还有不少物资在转交途中失去原始纪录。若照现有方式送入仓库，很快就能补足战后最缺乏的装备；可幻想乡仍会依赖一批无法自行制造、也无法稳定维修的外界机械。\n\n蓝提出彻底清查。将现有支援器材与车辆逐件拆解，核对结构、材料与生产方式，再把日本的工业与装甲设计整理成可供河童工坊复制的技术。这会消耗大量仍能使用的后勤装备，却能替未来建立真正属于幻想乡的生产能力。\n\n另一种方法则更直接：停止追查每批物资的来源，把能开动的车辆、能射击的武器与尚未损坏的列车全部送入仓库，并将一处军用库房改造成民用工场。重建能立刻获得所需物资，只是混乱的帐目将暂时保留下来。\n\n战利品不能永远堆在议会里。它们必须成为今日的补给，或明日的技术。"
kyo_postwar.1.a:0 "蓝，全部拆开重算，留下我们能自行制造的东西。"
kyo_postwar.1.b:0 "停止追查来源，先让仓库与工场运转起来。"

kyo_postwar.2.t:0 "战时兵工体系的去留"
kyo_postwar.2.d:0 "战争期间，学校、车站、寺社与民营工场都曾被纳入军需体系。生产线昼夜不停，地方仓库塞满步枪与炮弹，道路也只以部队能否迅速通过作为修筑标准。\n\n如今前线已经沉默，这套体系却仍在继续运转。大量劳力被军工生产占用，民生器具与建筑材料长期短缺，部分地区甚至仍依照战时命令征收物资。\n\n蓝建议拆除一部分临时兵工设备，回收过剩武器，将厂房改造为民用工场，并修复那些被重型运输压坏的道路。这会削减现成军备，却能让战后经济重新服务居民。\n\n军方则主张保留战时统制。外界尚未接受妖怪政权，日本各地也仍有武装抵抗；现在关闭兵工厂，等同在局势最不稳定时主动放下武器。只要保留生产线，部队便能继续获得枪械、火炮与防空装备。\n\n战争留下的工厂可以拆成重建家园的材料，也可以继续铸造下一场战争所需的兵器。"
kyo_postwar.2.a:0 "拆除部分兵工体系，把工厂与道路还给重建。"
kyo_postwar.2.b:0 "保留战时生产线，现在还不是解除武装的时候。"

kyo_postwar.3.t:0 "来不及撤离的城市"
kyo_postwar.3.d:0 "新结界的测量报告确认，数个人口稠密地区正位于不稳定的边界带上。\n\n道路的距离会在夜间改变，部分建筑偶尔从观测术式中消失，还有居民声称自己推开家门后，看到的并非原本的街道。异常尚未扩大到整座城市，却没有人能保证下一次变动何时到来。\n\n最稳妥的方案，是在裂区封闭以前展开大规模迁移。列车、卡车与工程器材将被集中征用，把居民分批送往已完成测量的安置区。当地必须立即扩建道路、住宅与民用工场，才能容纳突然增加的人口。这项行动将几乎耗尽现有运输能力，但能让大部分居民离开危险地带。\n\n河童提出另一种方案：取消全面撤离，在异常区架设监测设备，封锁最危险的街区，并让其余城市继续运作。运输体系得以保存，对结界异常的研究也能迅速推进；只是那些来不及离开封锁区的人，只能等待下一次测量结果。\n\n列车足以带走许多人，却带不走整座城市。"
kyo_postwar.3.a:0 "征用车辆与列车，把能带走的人送往安置区。"
kyo_postwar.3.b:0 "封锁异常区并架设监测设备，停止全面疏散。"

kyo_postwar.4.t:0 "尚未放下武器的人"
kyo_postwar.4.d:0 "日本军已经投降，但战争并未在所有山林与街巷中同时结束。\n\n溃散的士兵、地方警备队与拒绝承认新政权的居民仍控制著不少据点。他们熟悉道路，藏有日军撤退时留下的武器，也得到部分村落暗中供应。巡逻队每天都会遇到伏击，铁路与补给站则不断遭到破坏。\n\n第一种方案是发布有限赦免。愿意交出武器、据点位置与补给路线的人，可以免于追究，甚至经过审查后加入地方守备与运输队。这会让部分前线军官认为胜利遭到妥协，却能以较少伤亡收回大量装备，并让熟悉地方的人协助恢复秩序。\n\n另一种方案是集中兵力逐区清剿。山路、村落与地下据点将被一处处攻破，部队也能在行动中累积实战经验，收缴更多武器。可是每一次交火都会增加双方伤亡，并让仍在观望的居民更加恐惧新政权。\n\n必须有人决定，战后秩序是从投降书开始，还是从最后一声枪响开始。"
kyo_postwar.4.a:0 "以赦免换取投降、情报与武器。"
kyo_postwar.4.b:0 "动用军队逐区清剿，直到所有据点停止抵抗。"

kyo_postwar.5.t:0 "谁的军队"
kyo_postwar.5.d:0 "百妖军赢得了战争，却从来不是一支真正统一的军队。\n\n红魔馆、妖怪山、白玉楼、命莲寺与各地妖怪集团仍保有自己的编制、补给与指挥者。她们会接受共同作战命令，却更习惯听从原本的主人。战时，这种结构让各方能迅速投入战场；战后，它却使中央无法确认自己究竟能调动多少兵力。\n\n紫提出建立统一的结界军。各派部队将使用共同编制，补给、训练与指挥链全部纳入中央。缴获的日本装甲资料则交给河童重新设计，以现有车辆、步兵装备与支援零件改造出幻想乡自己的轻型战车。这项整编会消耗大量器材，也必然削弱地方首领对军队的控制。\n\n另一种选择，是允许各派继续保留自己的军队。作为交换，她们将交出一部分武器、车辆与工业设备供中央使用。如此能迅速填满仓库，也不必立刻触碰各方最敏感的兵权；但幻想乡仍然不会拥有一支真正由中央指挥的装甲军。\n\n旗帜可以同时飘扬，军令却不能永远各自为政。"
kyo_postwar.5.a:0 "建立统一结界军，让河童把日本战车改造成我们的兵器。"
kyo_postwar.5.b:0 "各派暂时保留部队，并向中央交出部分军备。"

kyo_postwar.6.t:0 "重建权应交给谁"
kyo_postwar.6.d:0 "战后政府每天都要处理数以千计的报告：结界偏移、粮食配给、铁路修复、地方抵抗、居民迁移，以及仍未完成清查的军用仓库。\n\n现有体系依靠各地自行回报，再由中央逐层核准。这让地方能按照实际情况处理问题，却也使情报彼此矛盾，物资在等待批示时滞留，中央甚至无法确定某些命令是否真正抵达。\n\n紫与蓝主张集中权限。结界监视、情报搜集与行政调度将由八云家直接掌握，建立专门研究边界与外界情报的机构。所有重要资料都必须送往中央，并由同一套指挥体系处理。这能提高渗透、监测与应变效率，但也需要大量支援器材维持庞大的情报网。\n\n另一种方案，是把重建与配给交给地方议事机构。妖兔后勤队负责连接工场、仓库与聚落，让物资不必等待中央逐项批准。地方能更快恢复生产，并建立新的民用与军用工场；相对地，中央对各地资源与决策的掌控将会减弱。\n\n一个方法让所有眼睛看向中央，另一个方法则让各地的手先动起来。"
kyo_postwar.6.a:0 "集中情报与结界权限，建立八云家的监测体系。"
kyo_postwar.6.b:0 "把重建与配给交给地方，让妖兔后勤队负责联络。"
kyo_postwar.6.c:"谁也不选"




  kyo_postwar.7.t:0 "幻想乡帝国会议"
  kyo_postwar.7.d:0 "原本属于人类帝国议会的圆形会场，如今铺满结界符纸与妖怪纹章。八云紫端坐主位，双眼平静地扫过一圈——古明地觉、蕾米莉亚、八意永琳、魂魄妖梦与幽幽子、四季映姬、饭纲丸龙、河城荷取、琪露诺、今泉影狼……来自幻想乡与日本列岛各地的势力齐聚一堂。\n\n她在众目睽睽之下描绘未来蓝图：结界将扩展到整个日本，人类与妖怪的秩序将被重新书写，帝国不再由人类主宰，而是由幻想乡的规则封印在新世界之中。会议上的掌声、质疑与沉默交织成一片低频的轰鸣，谁也说不清自己是在同意，还是只是被声势推著点头。\n\n在决议通过后，与会者将随紫一同前往新结界仪式的会场——那将是她向所有见证者宣告「谁才是主人」的最终时刻。"
  kyo_postwar.7.a:0 "会议在掌声与肃然的沉默中落幕，一切看似完美无缺。"
  kyo_postwar.7.b:0 "会场外些微异样的杂讯——被所有人刻意忽视了。"

  kyo_postwar.8.t:0 "仪式的举行"
  kyo_postwar.8.d:0 "夜色覆盖了仪式场，高处架起的祭台与帝国议会的圆顶相连，符文沿著墙壁与地脉延伸，直至整个日本列岛。八云紫立于中央，背后是翻涌的「间隙」，像无数张重叠的幕布，等待她最后一笔将世界缝合。\n\n妖怪领袖们站在下方，抬头看著她抬起手。妖力与信仰聚拢，旧结界与新边界交叠。只要再推动一步，新秩序就会被写入现实；同时，任何一丝潜伏的恶意，也都能在这一刻将她与整个构想一起撕碎。"
  kyo_postwar.8.a:0 "仪式开始，一切将被改写。"

  kyo_postwar.9.t:0 "仪式顺利进行"
  kyo_postwar.9.d:0 "符文在空中一一点亮，没有爆炸，没有刺耳的尖叫，只有一股深沉而稳定的震荡贯穿大地。博丽大结界的结构被无比精确地重新调整，新的层次向外推展，将整个日本牢牢锁入由八云紫设计的幻想乡式法则之中——世界本身，开始依她的意志运转。\n\n当八云紫从祭台上走下来时，场内一片死寂，随后才爆发出压抑已久的欢呼与跪拜。妖怪领袖们在震慑之中低下头，人类代表则在恐惧与本能求生的驱使下选择沉默。亲眼目睹她以「间隙」改写现实之后，质疑变得毫无意义：从今以后，服从八云紫等同于服从这个新世界本身。在这样的景象前，没有人再敢怀疑或抗拒她的命令。"
  kyo_postwar.9.a:0 "所有人将心甘情愿地，跟随这位无庸置疑的领袖，八云紫。"

  kyo_postwar.10.t:0 "异常爆炸的袭来"
  kyo_postwar.10.d:0 "就在最后一道符文收束、结界准备固定的瞬间，异常发生了——不是来自某个角落的火光，而像是整个空间被判了死刑。\n\n高空中先出现一道细长的裂缝，如同被撕开的黑日，无声地向下塌陷；同一时刻，祭台下方的地板也像被什么从内部顶开，光与碎石、泥土与妖力从地下同时喷出。爆炸不是「在」某处发生，而是从天空与地底一同炸开，将整个仪式场夹击在两股相反却同步的冲击之间。\n\n站在高处的八云紫被双重冲击瞬间吞没，她背后翻涌的「间隙」也一同扭曲崩裂，只留下疯狂跳动的结界残响与爆炸后的静默。等到烟雾稍稍散去，祭台只剩焦黑与残骸，八云紫的身影消失得无影无踪——死不见尸，生无确证，连她留下的指令也在结界混乱中成为无效的符纸。\n\n帝国议会在一夜之间化为破碎的石块与烧焦的旗帜。群龙无首的妖怪领袖彼此对望，谁也不愿向谁低头。被紫压制已久的矛盾、怨恨与野心纷纷浮上台面：有人要夺下她曾握在手中的统治权，有人要改写她的理念，有人干脆想推翻她构筑的一切。下一步不再是会议或谈判，而是旗帜对旗帜、信条对信条的内战。"
  kyo_postwar.10.a:0 "八云紫下落不明，妖怪们将为了统治权与理念彼此撕裂整个日本。"


  kyo_postwar.16.t:0 "平衡的打破：只剩消灭彼此"
  kyo_postwar.16.d:0 "原本勉强维持的平衡，终于在一连串宣言与出兵中彻底崩溃。\n\n关西，雷米莉亚以鲜血与红雾宣布她的「统一战争」已经展开，要把所有妖怪纳入贵族帝国的羽翼之下；北方，鬼人正邪高举下克上旗帜，公开点名一切旧势力是该被推翻的既得利益者，革命军沿著铁路与航线向南渗透。\n\n八云重组政府与佛教自卫团尝试维持秩序、谈判与停火线，却很快发现已经没有人愿意再回到谈判桌。每一支军队都宣称自己代表「真正的未来」，每一面旗帜都把对手当作必须从地图上抹去的障碍。\n\n平衡一旦被打破，就不会自己恢复。幻想乡与整个日本被迫在多股力量的拉扯下滑向同一个结论：只有在其他一切候选者被消灭之后，「真正的统治者」才会出现。内战不再是可能性，而是唯一的道路。"
  kyo_postwar.16.a:0 "尘归尘，土归土。"




 kyo_postwar.19.t:0 "古明地大小姐的去向"
  kyo_postwar.19.d:0 "内战开始后，地底入口接连送来换防与封路的消息。古明地觉叫使者进厅，先听他复述地上的条件，再问药物何时能到。使者口头保证供应照旧，心里却已经在担心下一处关卡会扣住车队。\n\n觉让他把担心也说出来。厅里静了一阵，谈判终于落到了能运多少、从哪条路走、由谁放行这些事情上。地灵殿的储备还能维持一时，入口若被围住，病者和依赖外部物资的居民都得跟着受困。怨灵也不会因为地上的战争而变得容易看管。\n\n她反复问到的还有恋。妹妹常在外面游荡，遇上哪一方的部队都未必肯报出姓名。觉能读懂眼前使者的疑虑，却无法凭这些消息知道恋现在在哪里，更不能替她决定将来愿意跟谁走。\n\n送往红魔馆的誓书最终与结盟条款一同封好：维持贸易与医疗供应，共同封锁地底入口，合作清查渗透者。对这项选择，地底也有人不满，问她难道没听过斯卡雷特家的手段。\n\n「听过。所以要把条件写清楚。」觉答道。\n\n她认为蕾米莉亚会遵循明确的利益与命令，这比不断变化的许诺更容易应付。但她仍让人逐条核对双方可派驻的人手，没有把红魔馆递来的文本直接盖印。盟约一旦送出，地灵殿的立场便会被其他各方记下，这一点她同样清楚。\n\n公告挂起以后，入口的守卫开始照新约定核验车队。觉留在厅里，等第一批药物实际入库的回报。桌边还空着一个座位；她吩咐来报信的人，若在路上见到恋，就告诉她家里一切照常，不必躲着回来。"
  kyo_postwar.19.a:0 "在读尽人心之后，她选择了最可控的黑暗。"



 

  kyo_postwar.20.t:0 "琪露诺的决心"
  kyo_postwar.20.d:0 "战火蔓延到湖面时，第一个结冰的不是水，而是笑声。\n\n曾经把战争当成游戏的妖精们，开始在砲火与饥饿中一个个消失又一个个复活；每一次回来，都被更冷的现实迎面打回去——在那些高高在上的妖怪眼里，妖精永远只是廉价的扰乱者、可丢弃的诱饵、用完就能忘的噪音。\n\n琪露诺听见了鬼人正邪的宣言，也听见了宣言背后那句真正刺进心里的话：『弱者之所以被踩住，是因为习惯了自己该被踩住。』\n\n于是「最强的妖精」做出选择。她不是为了好玩，也不是为了凑热闹。她要证明妖精不是点缀季节的碎片，更不是谁的工具。她要让所有人记住，寒冰不只会冻住湖泊，也能冻住傲慢与阶级。她把翅膀收得更紧，把拳头握得更紧，站到革命阵线的旗帜下，像是在对全世界宣告——\n\n妖精不再被看扁，从今天开始。"
  kyo_postwar.20.a:0 "最强不是口号，而是她的宣誓。"

  kyo_postwar.21.t:0 "不死鸟妹红与吞噬历史的慧音"
  kyo_postwar.21.d:0 "战争全面爆发后，人里的夜晚不再有灯火的温度，只剩巡逻的脚步与远方炮声的回音。孩子被赶进地窖，商铺用木板封死窗户，流言像雾一样在巷子里游走——今天是哪一支军队会进城？他们会征粮，还是征命？\n\n上白泽慧音站在寺子屋的门前，陷入沉思。她了解历史的固定规律：每当大势力互相撕咬时，最先被碾碎的永远是没有旗帜、没有军队的平民。她不能让人里变成任人取用的战利品，更不能看著「人类的记忆」被战火抹去。\n\n于是，她做了一个清醒而沉重的决定——不再只当记录者。慧音带著人里的代表亲自前往命莲寺，向圣白莲请求援助。她没有谈政治，只谈一件事：让人里能活下去，让孩子能继续学会读写，让历史不被屠刀改写成单一势力的宣传。\n\n而在慧音身后，藤原妹红像一道不肯熄灭的火。她不需要誓言，她本身就是誓言。对妹红而言，人里不是地图上的点，而是她在漫长岁月里看著长大、看著死去、又重新长出的『家』。她知道自己无法给停止战火，但她能做最简单也最残酷的事——站在慧音身后，让任何想踏进人里的残暴者先踩到火焰。\n\n慧音与妹红把希望押在圣白莲身上：不是因为白莲一定能胜利，而是因为在这个只剩统治权与仇恨的年代，命莲寺仍愿意把「共存」写成能落地的承诺。只要这道曙光还在，人里就还有未来可选。"
  kyo_postwar.21.a:0 "她们把未来交给白莲，也把背后交给彼此。"

 kyo_postwar.23.t:0 "月之都入侵地球"
 kyo_postwar.23.d:0 "当地上的妖怪、人类与各方势力仍深陷于无止境的内斗与清算时，真正的毁灭却已自天穹之上降临。\n\n没有宣战，没有使者，也没有任何谈判的余地。月之都的军势撕开云层，带著冰冷而洁净的杀意，自高天之上对整个地表展开无差别打击。光束与砲火如暴雨般落下，山岳被削平，湖泊被蒸干，城市与聚落在刺眼的白光中化为灰烬。那些还在互相争斗的势力，甚至来不及理解究竟发生了什么，便被更高层次的力量一并碾碎。\n\n在月之都眼中，这片土地早已失去被容忍的价值。充满污秽、混乱、死亡与野心的地上世界，从来都不值得拯救。幻想乡的分裂，给了她们最完美的时机；而那来自月面的审判，也终于彻底落下。\n\n曾经争夺这片土地归属的人们，如今都在同一场天罚中迎来了相同的结局。无论是高傲的强者，还是挣扎求存的弱者，无论怀抱理想、野心、仇恨，或只是想活下去——一切都在月之都的铁与光之前变得毫无意义。\n\n幻想乡的历史，至此迎来终结。"
 kyo_postwar.23.a:0 "一切，都结束了。"






