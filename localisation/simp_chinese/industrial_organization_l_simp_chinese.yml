l_simp_chinese:

 KYO_MOKU_coal:0 "妹红炭火"
 KYO_MOKU_coal_desc:0 "迷途竹林每天都会留下大量枯竹、倒木与无法直接利用的植物废料，藤原妹红便把它们送进炭窑、气化炉与燃料工坊，转化为焦炭、燃气及工业燃料。漫长的岁月让她比任何工匠都熟悉火焰的温度与变化，哪怕炉膛失控，她也敢站在最危险的地方调整火候。问题在于，妹红偶尔会忘记其他工人并非蓬莱人，因此所有安全规程都被慧音亲自重写了三遍。"


 KYO_chireiden_nuclear_org:0 "地灵殿核能研究院"
 KYO_chireiden_nuclear_org_desc:0 "灼热地狱遗址深处的太阳不再只为地底燃烧。研究院围绕灵乌路空的力量修建反应设施、冷却系统与多重封闭区，试图把足以焚毁旧地狱的能量转化为可以测量、控制和复制的技术。古明地觉会察觉研究人员尚未说出口的疏忽，火焰猫燐则负责事故处置与撤离路线。这里研究的不只是如何释放更强大的能量，也包括失去控制以后，如何让地底仍然存在。"


 KYO_yakumo_boundary_labs:0 "八云境界情报所"
 KYO_yakumo_boundary_labs_desc:0 "八云境界情报所没有公开地址，也没有任何一扇门会永远通往同一处。八云紫利用间隙越过地图上不该相连的地点，蓝则将目击报告、截获电文与人员动向整理成严密的推演，橙负责接触那些不会与正式情报机关说话的小人物。情报所不满足于收集秘密，它更擅长从谣言与事实的边界中找出被刻意遗漏的部分。许多人曾在不知情的情况下替它工作，却没有人能够证明自己见过它的总部。"


 KYO_rabbit_qm_corps:0 "因幡工业局"
 KYO_rabbit_qm_corps_desc:0 "因幡工业局的仓库看上去永远处于混乱之中：妖兔扛着零件穿过走廊，生产表格不断被涂改，紧缺材料却总能及时送上流水线。因幡帝负责采购、交换与寻找规则没有禁止的捷径，铃仙重新编排班次、标签和检验流程，八意永琳则决定哪些设计可以投入生产。工业局尤其擅长在材料不足时更换零件、调整工序，让工厂不必为了某一种短缺而停摆。至于部分物资为何能在申请单写好以前抵达，帝通常只将其归功于好运。"


 KYO_nareko_road_construction:0 "道祖神道路建设"
 KYO_nareko_road_construction_desc:0 "道神驯子曾经守着一条漫长到几乎被世间遗忘的道路，因此她比任何工程师都清楚：修好一条路很容易，让它继续被人使用才困难。她会亲自检查桥梁、隧道、驿站与危险弯道，也会利用挡道拦路的能力测试关卡和绕行路线是否真正有效。驯子并不主张把所有地方连接起来，有些道路应当开放，有些入口则必须永远封闭。每逢新路通行，她仍会在路口准备一道谜题；至少在她看来，连路标都不愿阅读的人不该独自走进荒野。"


 KYO_mystia_food_industry:0 "夜雀餐饮"
 KYO_mystia_food_industry_desc:0 "竹林边缘那盏昏黄的灯，如今已从一辆小推车扩展成遍布夜路的食堂与流动厨房。米斯蒂娅·萝蕾拉将烤鳗、热汤和便于保存的饭食送往夜班工厂、巡逻岗位及偏远驿站，她的歌声则负责把疲惫的客人引到仍有热食的地方。夜雀餐饮没有固定菜单，厨师会根据当天得到的食材临时决定菜色，但无论如何都少不了米斯蒂娅引以为傲的烤鳗。她坚称烤鳗能够治疗夜盲，至于客人为何总在找到餐馆以前突然看不清路，她从不正面回答。"


 KYO_yorigami_ensurance:0 "依神保险"
 KYO_yorigami_ensurance_desc:0 "很少有人愿意相信由贫穷神与疫病神经营的保险公司，直到他们发现，没有谁比依神姐妹更懂灾祸会从哪里降临。女苑负责招揽客户、评估资产与拟定合同，紫苑只需在建筑里停留片刻，便能指出客户最可能遇到的风险。公司的审查严格得近乎刻薄，保费也从不便宜，但一旦保单正式生效，灾后赔款便不会无故拖延。姐妹二人或许不擅长安慰别人，却比任何人都明白，当一个人失去最后一件财产时，漂亮话毫无用处。"


 KYO_komeiji_hot_spring_hotel:0 "古明地温泉旅社"
 KYO_komeiji_hot_spring_hotel_desc:0 "旧地狱的地热从石缝间升起，将地灵殿附近的浴池终年蒸得雾气弥漫。住客不必开口，古明地觉便能提前准备合适的水温、药浴与安静房间；这种周到有时令人放松，有时也让人无处隐藏。旅社深处还藏着几座由恋发现的露天浴池，据说只有彻底忘记自己正在寻找它们时，才可能误打误撞地走进去。"


 KYO_Komachi_shipping_company:0 "小町运输公司"
 KYO_Komachi_shipping_company_desc:0 "若只看时刻表，小町运输公司大概早已倒闭。货船偶尔迟到，船夫也可能靠在货箱旁睡上一觉，但没有第二家公司比小野冢小町更熟悉幻想乡的河道、暗流与浓雾。无论货物要穿过暴雨、妖怪领地，还是那些活人不该靠近的水域，她总能找到一条可以抵达的航路。四季映姬定期检查公司的积压订单，而那通常是一年中运输效率最高的几天。"


 KYO_yuuka_flower_farm:0 "幽香花卉农场"
 KYO_yuuka_flower_farm_desc:0 "农场入口只写着一条规矩：不要伤害花。风见幽香在这里培育药草、观赏花卉与外界早已绝迹的品种，拒绝让嘈杂机械打乱它们的生长。花农必须学会辨认土壤的湿度、风向的变化，以及幽香微笑时究竟代表满意还是警告。只要遵守规矩，来客便能看见幻想乡最壮丽的花田；至于践踏花圃的人，通常不会留下第二次参观的心得。"


 KYO_chen_cat_store:0 "橙橙猫咪收容所"
 KYO_chen_cat_store_desc:0 "在成为猫又以前，橙也曾是一只没有名字、没有住处，仍会亲近路人的流浪猫。她记得寒夜里的屋檐，也记得伸出去却没有得到回应的爪子，因此不愿让其他猫再经历同样的日子。收容所不追求尽快把猫送走：想要领养的人必须学习照料、接受观察，还得得到猫本身的认可。橙相信，住所可以由别人安排，但谁能够成为家人，应该让它们自己决定。"


 KYO_youmu_gardening_club:0 "红梦园艺社"
 KYO_youmu_gardening_club_desc:0 "魂魄妖梦习惯把枝叶修剪得整齐分明，如同庭院也该接受剑术训练；红美铃则更相信气的流动，认为植物偶尔长歪一些并不是坏事。两人经常为一根枝条该剪还是该留争论半天，却也因此救活了许多被战火、寒害与疏于照料毁坏的庭园。红梦园艺社不只教授种花，还会替村落重整荒地，让废墟重新长出能够遮阴、结果和被人记住的东西。"


 KYO_raccon_raccoon_organization:0 "阿狸狸变形变形"
 KYO_raccon_raccoon_organization_desc:0 "二岩猯藏认为，换一身衣服只能骗过眼睛，真正的变装还必须改变声音、姿态，甚至让人忘记自己原本是谁。阿狸狸变形变形因此既承接服装与舞台造型，也提供由狸猫妖术完成的外貌改造。顾客可能在镜前见到贵族、老人、妖怪或另一个完全陌生的自己。工作室从不追问客人为何需要新面孔，只会提醒他们：外表可以临时借用，习惯却最容易让伪装露馅。"


 KYO_kaguya_waste_day_and_night:0 "辉夜 Waste Day and Night"
 KYO_kaguya_waste_day_and_night_desc:0 "这家旅行社没有所谓最短路线。蓬莱山辉夜亲自设计的行程往往从竹林赏月开始，途中穿插谜题、夜宴、寻宝与几处地图上不存在的景点；负责带路的妖兔还会擅自增加新的岔路。旅客出发时可能只打算消磨一个下午，回来后却觉得自己已经在外度过了整整一周。辉夜对此十分满意——若旅行只负责把人送到目的地，那未免太浪费永远的夜晚。"


 KYO_cirno_ice_cream_factory:0 "最强冰淇淋工厂"
 KYO_cirno_ice_cream_factory_desc:0 "工厂没有复杂的制冷机，琪露诺本人就是整条生产线最重要的冷源。妖精们依照当天心情决定口味、形状与配料，因此菜单时常在开门以后才完成；偶尔出现没人说得清是什么味道的新品，也会被琪露诺直接命名为最强限定款。她对品质只有一个要求：冰淇淋绝不能在客人吃完以前融化。若真的融了，她便会立刻重新冻好，并宣布问题已经被完美解决。"


 KYO_wriggle_bug_company:0 "皇虫公司"
 KYO_wriggle_bug_company_desc:0 "莉格露·奈特巴格不接受“看见虫就全部消灭”这种委托。皇虫公司的昆虫群会先分辨啃食作物的害虫、维持土壤的虫群与负责授粉的种类，再利用气味、灯光和迁徙路线把真正造成危害的族群引离农地。效果不如毒药来得迅速，却不会让下一季的田地跟着失去生机。许多农民起初并不相信由昆虫经营的除虫公司，直到他们发现莉格露往往比任何人都清楚，田里究竟少了什么。"


 KYO_momoyo_mining_company:0 "百百蚣矿业"
 KYO_momoyo_mining_company_desc:0 "姬虫百百世不喜欢坐在办公室里阅读产量报告，她通常就在矿道最深处，和工人一起追踪岩层后的矿脉。百百蚣矿业利用蜈蚣妖怪对地下震动的感知勘探矿藏，再由河童机械负责开凿、支撑与运输。矿区纪律粗犷，抱怨也从不拐弯，但当坑道出现危险时，百百世永远是第一个进入、最后一个撤出的人。对她而言，能让所有工人活着带回矿石，才算真正挖到了东西。"



  KYO_yukari_train_train_love:0 "秘封列车协会"
 KYO_yukari_train_train_love_desc:0 "八云紫对列车怀有一种连她自己也无法解释的感情。汽笛声、车轮碾过铁轨的震动，以及窗外不断远去的风景，总会唤醒一段残缺的记忆：在某个早已无法辨认的年代，似乎曾有一名少女与她并肩坐在车厢里，谈论星空、境界与尚未抵达的远方。\n\n紫已经记不起那人的名字，甚至无法确信这一切究竟是真实的往事，还是漫长岁月留下的一场旧梦。她只知道，那曾是自己最熟悉的朋友；而经过如此漫长的时间，对方或许早已不在人世。\n\n于是，紫出资成立了秘封列车协会，收藏旧车票、修缮废弃车站，并组织通往幻想乡各地的列车旅行。每一班纪念列车上都会留下一张无人入座的座位，紫却从未解释它属于谁。或许她想纪念的从来不是列车，而是那个已经被她遗失、却始终没有真正离开的名字。"


 KYO_backdoor_dancer_coupon:0 "后户舞娘"
 KYO_backdoor_dancer_coupon_desc:0 "后户舞娘从不公开售票，也没有固定舞台。尔子田里乃与丁礼田舞会穿过遍布各处的后户，突然出现在工厂、矿场与训练营的后方，以舞蹈唤醒旁人沉睡的精神力与生命力。疲惫的工人重新握紧工具，涣散的队伍也会在乐声中恢复行动。然而，每场演出同时也是摩多罗隐岐奈的一次观察。没有人知道两名舞者究竟只是来帮助工作，还是正在替后户之神寻找下一位值得带走的人。"


 KYO_yakuza_organization:0 "三合会"
 KYO_yakuza_organization_desc:0 "三合会由刚欲同盟、鬼杰组与劲牙组共同组成，却没有任何一方真正信任另外两家。刚欲同盟控制矿产、燃料与地下交易，鬼杰组负责契约、情报和利益分配，劲牙组则提供运输、护卫，以及不宜写进合同的强制手段。三方平时争夺地盘，遇到外来竞争者时却会迅速站到同一边。它不是一家讲究信誉的企业，而是一套让违约成本高到无人敢于尝试的力量。"


 KYO_ran_calculator_organization:0 "八云蓝会计"
 KYO_ran_calculator_organization_desc:0 "八云蓝会计不负责把账目修饰得好看，只负责找出它究竟从哪里开始腐烂。在蓝看来，一笔账的意义不是解释昨天花了多少，而是计算明天哪座仓库会先见底、哪条运输线即将停摆，以及哪项计划根本不可能按期完成。库存、税收、工时、损耗与风险都被送入式神演算，再整理成没有一句多余解释的报告。客户可以质疑结论，却很难说服算式改变答案。事务所唯一长期无法核清的项目，是橙每次外勤后交回来的零食报销。"


 KYO_three_fairies_organization:0 "三月精公司"
 KYO_three_fairies_organization_desc:0 "三月精公司登记的业务包括环境勘察、设施保全、舞台布置、寻物、运输与恶作剧善后，因为三位创办者始终无法决定公司究竟应该经营什么。桑尼·米尔克能够折射光线，适合布置照明与伪装；露娜·切露德可以消除声音，专门处理隔音和隐蔽运输；斯塔·萨菲雅则凭借感知活动事物的能力负责巡查与搜索。她们几乎什么委托都敢接，而且多数时候确实能够完成。客户唯一需要分辨的是，眼前的混乱究竟是工作的一部分，还是三只妖精临时觉得这样比较有趣。"





 KYO_koppa_organization:0 "河童万用兵器制造社"
 KYO_koppa_organization_desc:0 "河童万用兵器制造社由妖怪山沿河的机械工房联合组成，负责生产步枪、机枪、迫击炮与各类步兵器材。河童将复杂的水力机械经验运用于武器制造，使产品具备良好的防水性与耐用度，即使沾满泥水也能迅速恢复运作。零件规格偶尔令人费解，但只要交到熟悉机械的人手中，几乎没有什么损坏是现场修不好的。"


 KYO_koppa_tank_organization:0 "河童水陆装甲制造社"
 KYO_koppa_tank_organization_desc:0 "河童水陆装甲制造社专门研发能够穿越河川、泥地与山间险路的装甲车辆。密封车体、水压传动与浮渡设备是这里最受重视的技术，使战车能够从敌人认为不可能通行的方向出现。虽然早期原型偶尔沉入水底，河童工程师仍坚持那只是尚未完成上浮程序。"


 KYO_Eirin_organization:0 "永远亭八意制药所"
 KYO_Eirin_organization_desc:0 "永远亭八意制药所依照八意永琳的配方，生产军用药物、急救器材、抗毒剂与战地卫生用品。铃仙负责药品检验与使用训练，因幡们则将成箱物资送往各处医疗站。这里的药物往往能挽救被其他医师判定无望的伤员，但永琳从不容许任何人擅自修改剂量。"


 KYO_byakuren_air_lift_organization:0 "命莲寺圣辇空运社"
 KYO_byakuren_air_lift_organization_desc:0 "命莲寺圣辇空运社继承圣辇船远行的经验，将法术与现代航空技术结合，用于运输人员、粮食及医疗物资。一轮与云山承担重型装卸，村纱熟悉恶劣天气下的航路，白莲则要求每架飞机都为伤员和避难者保留位置。成员们经常争论航线、纪律与风险，却很少有人会在真正需要起飞时退缩。"


 KYO_lunarian_aero_organization:0 "月都玉兔航天局"
 KYO_lunarian_aero_organization_desc:0 "月都玉兔航天局负责制造月面飞行器、远程观测设备与高空作战系统。所有零件都必须在无尘设施内接受反复净化，任何偏差都会被记录、追查，并归咎于可能存在的地上污染。玉兔技术员维持着近乎苛刻的精度，只是航天局从不记录她们为此连续工作了多少个夜晚。"


 KYO_nethernight_interceptor_organization:0 "白玉楼夜航队"
 KYO_nethernight_interceptor_organization_desc:0 "白玉楼夜航队利用亡灵对黑暗、雾气与生命气息的感知，研发专门执行夜间截击任务的飞行器。幽灵可以在无灯环境中担任领航者，魂魄妖梦则以严格训练约束那些容易偏离航线的机组。西行寺幽幽子很少干涉设计，只要求夜航编队不要惊扰西行妖附近的樱花。"


 KYO_tengu_aero_organization:0 "天狗疾风航空社"
 KYO_tengu_aero_organization_desc:0 "天狗疾风航空社由天狗飞行员、山中工匠与河童技师共同经营，主要制造高速战斗机、侦察机和通讯机。天狗将自身对风向与气流的理解写进每一项设计，追求在敌人察觉以前完成侦察与攻击。新机的性能有时尚未通过正式审查，射命丸文便已经替它准备好了足以占满头版的试飞纪录。"


 KYO_shrine_maiden_organization:0 "博丽神社御札印刷所"
 KYO_shrine_maiden_organization_desc:0 "博丽神社御札印刷所将符纸裁切、咒文绘制与基础术式改为标准化生产，再由巫女完成最后的灵力灌注。这里制造的御札可用于驱邪、封印、警戒与维持小型结界，使原本难以大量供应的术具得以送往各地。印刷机可以日夜不停，真正限制产量的始终是巫女本人能够支撑多久。"


 KYO_magican_study_organization:0 "魔法森林联合魔法工房"
 KYO_magican_study_organization_desc:0 "魔法森林联合魔法工房尝试将彼此封闭的术式、魔导器与炼金技术整理为可以重复制造的军用成果。爱丽丝·玛格特洛依德提供精密的人偶技术，森林中的其他魔法使则带来各自珍藏的材料与研究。她们很少愿意公开全部秘密，却一致同意：只要实验纪录仍然完整，一次爆炸就不能算作毫无收获。"




  KYO_tsukumogami_drydocks:0 "百器船坞"
 KYO_tsukumogami_drydocks_desc:0 "这座船坞由付丧神、修理匠与一大批不肯退休的旧工具共同经营。报废锅炉、断裂锚链和来历不明的舰炮都会在这里获得第二次用途，有时还会顺便获得自我意识。这里制造的军舰未必安静，但哪个零件不高兴，往往会在真正损坏以前先抱怨出来。"


 KYO_moriya_shipyards:0 "神风造船社"
 KYO_moriya_shipyards_desc:0 "神风造船社由守矢神社主持，仿造河童的造船技术纳入神社产业。每艘船下水前都要接受煞有其事的神前祝祷与廉价河童的检验：前者负责振奋船员，后者负责确保祝祷结束后船不会沉。河童们坚称工程是神圣的完美的，却没有人敢试航。"


 KYO_oni_ironworks:0 "豪鬼醉锻重工"
 KYO_oni_ironworks_desc:0 "豪鬼醉锻重工以厚重装甲、粗暴锻造和工作时间供应的烈酒闻名。这里检验装甲的方法十分直接：把钢板放在宴会场中央，只要挨过一夜打斗仍未裂开，便可以送进生产线。至于图纸上的酒渍，则被解释为鬼族独有的技术标记。"


 KYO_youkaimountain_arsenal:0 "天狗风飞行器总局"
 KYO_youkaimountain_arsenal_desc:0 "飞行器总局由天狗试飞员与河童技师共同经营，双方长期争论究竟是飞行器重要，还是飞行员本来就足够优秀。这里衡量飞机的标准除了速度、升限与转向性能，还有它能否在下一份号外印完以前绕妖怪山一圈。事故报告通常写得很短，因为射命丸文总能比调查人员更早抵达现场。"


 KYO_scarlet_armory:0 "猩红拼装车房"
 KYO_scarlet_armory_desc:0 "猩红拼装车房专门将不同来源的底盘、引擎与武器组合成符合红魔馆审美的车辆。咲夜负责让生产流程维持秩序，帕秋莉解决违反常识的动力问题，小恶魔则负责替那些来历可疑的零件重新贴上标签。成品外观一律优雅整洁，至于打开装甲板以后看见什么，红魔馆概不负责。向伟大的蕾米莉亚大人敬礼。"


 KYO_old_hell_smeltery:0 "无照战车黑炉"
 KYO_old_hell_smeltery_desc:0 "无照战车黑炉不询问零件来源，不提供长期保修，也拒绝解释为何同一辆战车上会同时出现河童引擎、混乱线路与地上界座椅。这里唯一的验收标准，是车辆能否从旧地狱最恶劣的道路开出去。若它最后还能自己开回来，老板才会考虑补开收据。"


 KYO_rapid_colt_armor_bureau:0 "黑驹飞驰装甲局"
 KYO_rapid_colt_armor_bureau_desc:0 "黑驹早鬼认为，装甲车辆只有两种状态：正在加速，或者挡住别人加速。装甲局的设计会议大多直接在跑道上举行，工程师必须骑着车辆向她说明修改方案。这里的产品速度极快、冲击力惊人，座椅的主要功能则是避免驾驶员在转弯时被甩出车外。"


 KYO_kourindou_refit_works:0 "香霖堂旧物再就业所"
 KYO_kourindou_refit_works_desc:0 "森近霖之助坚信，每件来自外界的机械都有正确用途，只是说明书通常没有跟着一起进入幻想乡。于是农业引擎、废弃车辆与没人认得的电子设备，都可能在这里被重新组装成军用器材。它们未必按照原本的用途工作，但香霖堂坚持这正是古代技术的深奥之处，而且价格概不商议。 所有人都讨厌的奸商。"


 KYO_keystone_armor_board:0 "天石与天人重工"
 KYO_keystone_armor_board_desc:0 "比那名居天子相信，无论问题是后坐力过大、车体不稳还是地面过于松软，都可以靠再加一块要石解决。工程师的任务不是否定她，而是在车辆把桥梁压垮以前设法补强悬挂。最终产品沉重得极有说服力，也稳定得几乎不讲道理。"


 KYO_earthspider_mechanics:0 "土蜘蛛八足机动工房"
 KYO_earthspider_mechanics_desc:0 "土蜘蛛八足机动工房擅长制造能够穿越隧道、废墟与崎岖山路的步行机械。工匠可以在极为狭窄的地底空间拆装整辆载具，并始终无法理解地上工程师为何坚持车辆只能拥有四个轮子。按照工房的说法，多安装几条腿不是奇怪，而是替机械保留摔倒后的尊严。"


 KYO_inversion_works:0 "下克上倒置火力所"
 KYO_inversion_works_desc:0 "火力所规定，所有公认正确的设计都必须先上下颠倒一次。炮塔可能藏在底盘下方，诱饵被放在最显眼的位置，真正的武器则从敌人最不愿相信的方向开火。正邪的验收标准很简单：如果将领第一眼便能看懂这件武器，它就必须退回重做。"


 KYO_chimata_convoy_trust:0 "千亦交易所"
 KYO_chimata_convoy_trust_desc:0 "千亦交易所负责替商船、补给船与来历复杂的货物安排航线。这里的船旗往往比舰体涂装更加鲜艳，货物清单也经常比航海图更厚。天弓千亦坚称海上不存在真正的无主之物，只有尚未完成登记、估价与收取交易费的货物。"


 KYO_sanzu_shipyards:0 "三途河渡船联营会"
 KYO_sanzu_shipyards_desc:0 "联营会的船夫熟悉浓雾、暗流，以及那些通常不该由活人通航的水域。航期并不总是准确，因为小野冢小町认为平安抵达比遵守时刻重要，也因为她偶尔会在岸边睡过头。奇怪的是，航线越危险，联营会运送的货物反而越少迟到。"


 KYO_wakasagihime_littoral:0 "人鱼潜航工房"
 KYO_wakasagihime_littoral_desc:0 "人鱼潜航工房依靠水中居民对暗流、回声与湖底地形的理解，制造低噪音潜航船只。每艘新船都必须从雾之湖的鱼群旁安静驶过，若没有把它们吓散，才算通过试航。工房并不追求最凶猛的外表，因为真正安静的猎手本来就不需要让所有人看见。"


 KYO_parsee_coastalworks:0 "水桥「对岸凭什么更好」造船社"
 KYO_parsee_coastalworks_desc:0 "水桥帕露西从不称赞自己制造的船，却能立刻指出敌方舰艇比它多出的一门炮、快出的一节航速或厚出的一层装甲。每一次嫉妒都会被写成新的改进要求，再送到疲惫的工程师手中。员工很少得到赞美，但他们制造的船确实从未停止进步。"


 KYO_nazrin_salvage:0 "鼠鼠沉船寻宝打捞会"
 KYO_nazrin_salvage_desc:0 "打捞会利用探宝杖、鼠群与纳兹琳对值钱物品近乎本能的判断，搜寻沉船、遗失货物与被人刻意隐瞒的残骸。她经常在船主承认货物失踪以前便将它们找回来，然后递上一张计算得毫厘不差的账单。纳兹琳始终提醒客户：免费的沉船，通常藏着最高昂的麻烦。"


 KYO_prismriver_acoustics:0 "普莉兹姆里弗交响社"
 KYO_prismriver_acoustics_desc:0 "普莉兹姆里弗三姊妹将声呐、舰内通讯与声学诱饵编写成一份份能够演奏的乐谱。每套设备完成后都要接受现场试奏：若船员还能准确分辨敌舰方向，设备便通过检验；若所有人都已听不清方向，它就会被重新登记为声学干扰器，并照常出售。"
 
 