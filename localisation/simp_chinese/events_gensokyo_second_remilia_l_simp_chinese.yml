scarlet.31.t:"风中的报告书"
scarlet.31.d:"妖怪山的会议室一向不暖。风从高处灌进窗缝，把桌上的纸角一点点吹起来。饭钢丸龙坐在主位，手指轻敲桌面，没有催，也没有问。她知道射命丸文若是回来得这么快，就代表红魔馆那边已经给了答案。\n\n文把相机往桌上一放，羽翼收得整齐，笑容还是那副不紧不慢的样子。\n「我见到她了。」文说。\n\n饭钢丸龙抬眼。\n「红美铃？」\n「对。」文点头，「门番本人。比传闻里还麻烦。」\n\n她把当时的情况说得很快，没有漏掉一个细节：门前的风向、花园的死角、她抬相机时美铃的反应、还有那句不算威胁却比威胁更像警告的话。\n「她不凶，也不吵。」文说，「可她站在那里，红魔馆的门就像多长了一层骨头。你很难把她当成单纯的守卫。」\n\n饭钢丸龙没有立刻评价，只问了一句。\n「她在护什么？」\n\n文笑意淡了点。\n「不是单纯在护一座馆。」她说，「她护的是规矩。谁能进，谁该退，话能说到哪里，线能踩到哪里——她全知道。」\n\n她顿了顿，又补上一句。\n「更麻烦的是，她不是那种靠蛮力撑场面的人。她懂分寸，懂礼貌，也懂怎么把一句客气话说成『再往前一步就试试看』。」\n\n饭钢丸龙往后靠了一点，像在把这个名字重新放进棋盘上。\n\n文看著她，嘴角又勾起来。\n「还有件事很有趣。」\n「说。」\n「红魔馆的人，比我们以为的更像一个国家。」文说。「门番守门，女仆长治内，图书馆那位负责脑子，吸血鬼大小姐则站在最上面当王。那地方不是一群妖怪凑在一起过日子，是已经开始用制度活著了。」\n\n会议室里安静了两秒。\n\n饭钢丸龙终于开口，语气很平。\n「你的结论？」\n\n文把相机重新挂回肩上，笑容收得很干净。\n「红魔馆不是在装样子。」她说。\n「而且那位门番，是认真的。」"
scarlet.31.a:"这不是一座普通的宅邸。"

scarlet.32.t:"白狼天狗的判断"
scarlet.32.d:"文的报告刚放下没多久，犬走椛就把另一份纸推到桌前。和文不同，她的字迹很直，内容也更硬，像刀口切出来的线。\n「我从山道、风向和目击痕迹补了红魔馆外围的资料。」椛说。\n\n饭钢丸龙示意她继续。\n「红魔馆的门前没有多余巡逻，可那不是松懈，是因为红美铃本人就抵得上一整条前哨线。」椛的语气一板一眼，「她平时看起来松，但那只是表面。只要外围有不对，她醒得比谁都快。」\n\n文坐在旁边，托著下巴笑了一声。\n「我不是已经说她很麻烦了吗？」\n\n椛没理她，只看著饭钢丸龙。\n「如果红魔馆真要封门，她会是第一道，也是最难过的一道。」\n「理由？」\n「因为她不只会打。」椛答得很快，「她知道什么时候该拦，什么时候该放。她让人产生一种错觉——只要守规矩，就还有得谈。可一旦她判定你越线，她下手不会慢。」\n\n她把调查图往前摊开，上面标著几个红圈与箭头。\n「更重要的是，她很少让冲突扩大。」椛说，「这代表她不是喜欢厮杀的类型。她偏向把问题压在门外，不让馆内的人被惊动。」\n\n饭钢丸龙看了那张图一会儿。\n「所以？」\n\n椛沉默半秒，才把话说完。\n「所以她很危险。」\n「不是因为她像怪物，而是因为她像个训练完整的人。」\n\n这句话落下后，连文都难得没插嘴。\n\n椛抬起头，目光很稳。\n「妖怪山若要和红魔馆打交道，最好把她当成第一个要过的关口。」\n「不是因为她地位最高。」\n「是因为她真的守得住。」"
scarlet.32.a:"先看门番，再看王座。"

scarlet.33.t:"镜头外的红魔馆"
scarlet.33.d:"姬海棠果来得最晚。她抱著一叠散乱笔记和洗出的照片，走进来时先看了文一眼，又看了椛一眼，像在确认这两个人有没有把该说的都说完。\n「我看的角度不一样。」果小声说。\n\n饭钢丸龙看向她。\n「那就说你看到的。」\n\n果把照片一张张排开。门柱、花园、窗格、走廊边角，还有几张红美铃的背影。她不像文那样擅长直闯，也不像椛那样擅长守备分析，她更像是在捡那些没人特别注意，却又藏不住的东西。\n「红魔馆给人的感觉很奇怪。」果说。\n\n文扬了扬眉。「怎么个奇怪法？」\n\n果把其中一张照片往前推。\n「太整齐了。」她说。「不是干净而已，是每个人都知道自己该站哪里。门番站在门前，女仆走路的距离差不多，连灯开到什么亮度都像有规矩。」\n\n椛皱了皱眉。「这也算情报？」\n「算。」果低声回答。「因为这代表红魔馆不是靠一个蕾米莉亚撑著。它里面每个人都在替那座馆维持形状。」\n\n她停了一下，才继续。\n「而红美铃最奇怪的地方也在这里。」\n\n饭钢丸龙没有打断。\n\n果把目光落到其中一张抓拍上。画面里，美铃站得很直，却没有凶相，像只是很自然地站在那里。\n「她明明是妖怪，却活得像个人。」果说。「不是伪装，也不是讨好。她会记住来客的表情，会先看对方是不是紧张，甚至像是在替红魔馆保留一点『可以讲道理』的样子。」\n\n文笑了笑。「所以你觉得她很善良？」\n\n果摇头。\n「不是善良。」她说。「是克制。」\n\n这句话让会议室静了一下。\n\n果把最后一张照片收回掌心，声音仍然很轻。\n「一个强大的妖怪，却一直在用人的方式守门。这种人，往往比单纯凶狠的更难对付。」\n\n饭钢丸龙终于把三份报告都收拢到一起。她没有立刻下结论，只把手指按在桌面上，像在重新衡量那座红色洋馆。\n\n天狗看到的，不再只是红魔馆的威胁。\n\n而是一群各司其职、彼此咬合得很深的人。\n\n以及那个站在门前，把整座馆与外界隔开的华人姑娘。"
scarlet.33.a:"红魔馆，比传闻更像一个国。"

 scarlet.34.t: "月下的提问 上"
 scarlet.34.d: "那天夜里，月色很好。\n\n好到连红魔馆外墙的阴影都淡了一点。美铃靠在花园栏杆边，看著咲夜站在一旁。她还是站得很直，肩线绷著，像连看月亮都只是临时允许自己的分神。\n\n美铃没有立刻开口。她知道咲夜不是那种你一问，她就会把心打开的人。她把自己收得太紧，紧得像一个随时准备上场的人，哪怕四下无人，也不敢先把手放下。\n\n过了好一会儿，美铃才低声问。\n「咲夜，妳为什么总是这么拼？」\n\n咲夜没有看她，只淡淡回了一句。\n「我不明白妳的意思。」\n\n美铃笑了一下，没被这句话打发。\n「妳明白。」她说，「妳不是单纯做事认真。妳是在拼命把自己塞进这座馆里，像怕哪里露出一点不合，就会立刻被人看出来。」\n\n咲夜的睫毛动了一下。\n\n美铃看著她，语气依旧很轻。\n「妳很努力地学妖怪的规矩，学红魔馆的规矩，学怎么说话、怎么站、怎么把自己弄得毫无破绽。」\n\n她停了一下，才把那句最关键的话问出来。\n「妳到底在怕什么？」\n\n夜风穿过花丛，吹得玫瑰微微摇动。\n\n咲夜沉默了很久，久到美铃以为她不会答。\n\n可最后，咲夜还是开口了。\n「因为我是人类。」\n\n她说得很平，像在念一个早就背熟的事实。\n「在红魔馆里，咲夜不是名字，先是『人类』。」\n\n美铃没有插话。\n\n咲夜终于转头，看了她一眼。那眼神很安静，却比平常更累。\n「妖怪可以犯错，可以任性，可以坏脾气，因为那是她们本来就有的位置。」她说，「我不行。」\n「我不是妖怪，也不是血亲。我能站在这里，不是因为我理所当然该在这里，是因为我有用。」\n\n她把手指收进掌心，像把什么也一起捏紧。\n「所以我不能慢，不能乱，不能不完美。只要我有一点不够好，『人类』这两个字就会先被拿出来。」\n\n美铃望著她，眉头慢慢皱起来。\n\n咲夜却像终于把话说出来一样，声音更低，也更直。\n「妳知道吗？我有时候不是在工作。」\n「我是在证明，自己值得被留下。」\n\n这句话落下时，花园安静得连水声都显得太响。"
 scarlet.34.a: "咲夜说著实话"



 scarlet.35.t: "月下的提问 下"
 scarlet.35.d: "美铃看著她，像第一次真正碰到那层她平常藏得太好的东西。不是完美，不是冷静，也不是女仆长的体面——而是一个人类，在一群妖怪之中，日复一日地把自己磨得够锋利，只为了不被丢下。\n「……原来是这样。」美铃低声说。\n\n咲夜像想笑一下，却没笑出来。\n「很可笑吧？」\n「不可笑。」美铃回得很快。\n\n她站直一点，语气还是平和，却比刚才更重。\n「咲夜，我在意妳，不是因为妳够有用。」\n「也不是因为妳把红魔馆打理得多漂亮。」\n\n她看著咲夜，没有闪躲。\n「我是因为妳这个人，才在意妳。」\n\n咲夜怔了一下，像没料到她会说得这么直接。\n\n美铃自己也安静了两秒，才把后面的话慢慢接上。\n「我想懂妳，是因为妳太特别了。」\n「明明是人类，却比很多妖怪都更能撑；明明心里怕得要命，表面还是站得那么稳。」\n\n她笑了一下，笑意很淡。\n「我不想只看见妳做得多好。」\n「我也想知道，妳到底是怎么把自己逼成这样的。」\n\n咲夜站在原地，月光落在她脸上，把那份平日藏得很好的脆弱照出来一点点。她没有立刻回答，只把视线转回远处。\n\n过了很久，她才低声说。\n「美铃，妳真的很奇怪。」\n\n美铃笑了。\n「彼此彼此。」\n\n咲夜没有再反驳。她只是站在那里，肩膀终于比一开始松了一些。\n\n美铃也没再追问。\n\n她知道，有些话能说到这里，已经很不容易了。\n\n月亮还挂在上头，红魔馆的灯一盏盏亮著。两人站在花园边，谁都没有再动。\n\n只是从那一夜开始，美铃终于真正明白——咲夜不是天生就适合红魔馆。\n\n她只是太害怕失去，所以才把自己活成了最适合留下来的样子。"
 scarlet.35.a: "至少，现在有人想懂她。"

 scarlet.36.t: "美铃的馆内导览"
 scarlet.36.d: "新来的妖精女仆抱著扫帚，站在门口时连翅膀都不敢乱动。红美铃看了她一眼，笑著招手。\n「别紧张，先跟我走一圈。红魔馆大得很，乱闯可是真的会出事。」\n\n她先带人看前庭。石阶、铁门、花圃、喷泉，全都收拾得干净俐落。\n「这里是门面，也是第一道关。」美铃拍了拍门柱，「外面的人先看到这里，所以不能乱。谁能进、谁该停，先过我这一关。」\n\n再往里走，就是大厅。吊灯高，地板亮，连脚步声都会被放大。小妖精下意识放轻了步子，美铃看得想笑。\n「对，就是这样。这里最容易让人出错，因为咲夜小姐一眼就看得出来。」\n\n她接著把人带到左侧。那边是餐厅、厨房、储藏室，空气里有面包和热汤的味道，女仆们正忙著端盘、记数、换班。\n「妳大多时候会在这一带帮忙。」美铃说，「盘子别摔，食材别拿错，还有——厨房生气的时候，比鬼还可怕。」\n\n再往另一头走，气味一下变成纸、灰和墨。高高的书架一直往上叠，看得小妖精脖子都酸了。\n「这里是帕秋莉大人的图书馆。」美铃把声音放低，「能不碰就别碰，能不问就少问。小恶魔小姐看起来好说话，真让妳收拾烂摊子时，可不会替妳哭。」\n\n穿过长廊后，就是会客厅和宴会厅。桌布、银器、烛台全摆得一丝不乱。\n「大小姐平常在这里见人。」美铃看了看四周，「记住，这种地方不是让妳东张西望的。该站哪里、该低头多久，都照咲夜小姐教的做。」\n\n上了楼，走廊一下安静许多。美铃指了指两侧房门。\n「这里是生活区，客房、备用房，还有主人们的房间。打扫可以，乱看不行，乱碰更不行。」\n\n说到这里，她停了一下，带著小妖精走到往下的石阶前。地下室的门很厚，锁也很重。\n「最后，这里。」美铃的语气难得更稳了些，「没有命令，绝对不要靠近。馆里每个人都知道原因，妳也只要记住这句就够了。」\n\n绕完整座馆，小妖精早就抱著扫帚点头点到发晕。美铃看她那副样子，终于笑出来。\n「别怕。」她拍了拍对方肩膀，「红魔馆规矩很多，但只要妳肯学、肯做事，就有位置站。」\n\n她回头看了一眼整座馆，语气又轻了下来。\n「门口归我，里面归大家。妳现在也是这里的一份子了。」"
 scarlet.36.a: "我、我会努力记住的！"

 

scarlet.37.t:0 "图书馆里的请求"
scarlet.37.d:0 "大图书馆的烛火烧得很稳，纸页、墨水与药味混在一起，让空气比外面更冷。帕秋莉坐在桌后，咳了两声，连头都没抬。小恶魔抱著一叠资料站在旁边，难得安静。\n\n先开口的是咲夜。\n「我需要妳的帮助。」她把一张地图摊开，上面圈著人里边缘的巷口与暗线。「鬼人正邪不是靠兵力，她靠的是缝隙、错位和煽动。我需要能压住她把戏的术式、反制她颠倒空间的标记，还有一套能把她逼出来的情报布置。」\n\n美铃接著把另一份文书放上桌，语气还是平常那样松，眼神却很正。\n「我这边也要借妳的脑子。」她指了指妖怪山方向的资料。「天狗不会因为我笑得好看就收手。我要他们家系、派系、旧怨、商路，还有一份能让饭钢丸龙闭嘴的筹码。」\n\n帕秋莉这才抬眼，看了咲夜，再看美铃。\n「妳们要的不是一本书。」她说，「是我的时间、小恶魔的人手、现成的术式库，还有现在红魔馆根本不富裕的材料。」\n\n小恶魔低声补了一句。\n「只能给一边。」\n\n房间安静了。\n\n咲夜的手指压在地图边缘，声音平得像刀。\n「正邪不拔掉，内部永远不会安静。」\n\n美铃靠在桌角，没和她抢话，只把文件往前推了一寸。\n「天狗不压下来，外面永远有人盯著我们。」\n\n帕秋莉没有替谁做决定。她只是把两份资料拢到一起，冷冷地说：\n「资源只够押一边。选吧。」"
scarlet.37.a:0 "把帕秋莉的资源交给咲夜——先断掉正邪这根刺"
scarlet.37.b:0 "把帕秋莉的资源交给美铃——先压住妖怪山的风声"




 scarlet.38.t: "倒著活的人"
 scarlet.38.d: "雨停了，鬼人正邪躲在一间快塌掉的破屋里，背靠著湿冷的墙，喘得胸口发疼。\n\n外头很安静。\n安静得让她发笑。\n\n以前她最喜欢看这种安静被自己打碎。贴几张纸、煽几句话、把几个活不下去的家伙凑在一起，就能让那些坐在高位上的人一整晚睡不安稳。她不是不知道自己的人弱，也不是不知道那点火种随时会灭。可她总觉得，只要还有人肯咬牙，这个世界就不该这么顺。\n\n结果现在，顺了。\n\n草根妖怪被抓的被抓，散的散，死的死。她熟悉的暗线全断了，连藏身的角落都变得陌生。她往哪里钻，都像会撞上咲夜那张干净得讨厌的脸。\n「哈……」正邪抹了一把嘴角，指尖全是血和泥，「搞半天，就剩我一个。」\n\n她笑得很难听，笑到最后又沉下去。屋顶还在滴水，一滴一滴，像有人在替她数输了几次。\n\n她想起那些跟著自己的人。\n想起赤蛮奇嘴硬时的样子，想起影狼拔刀时那股蠢得发热的狠，想起若鹭姬一边骂一边还是把火药抱走的背影。她不是什么好头领，也没给过谁像样的未来。她能给的，只有一句「不服就动手」，和一条随时会断的路。\n\n可就连这种东西，红魔馆都不肯留。\n\n正邪低下头，看著自己发抖的手。那双手翻过天、倒过地，把不该站得稳的东西掀翻，也把一堆本来该认命的人拖起来过。她一直以为自己是在替弱的、穷的、被踩在下面的人找一口气。\n\n现在她才发现，这口气太薄了。\n薄到根本撑不过一把银刀、一套名册、一座运转得像机器的红魔馆。\n\n她咬著牙，声音低得发哑。\n「凭什么……」\n\n没有人回她。\n「凭什么她们生来就在上面，凭什么我就得在下面翻？凭什么我每次拼命把东西弄乱，最后都只是让自己更像个笑话？」\n\n她一拳砸在地上，砸得指节裂开。\n「我明明做了那么多。」\n\n可这世界从来不按努力给结果。\n它只看谁够强，谁够狠，谁能把秩序做得更像真理。她反抗压迫，反抗不公，反抗那种一出生就把人分好上下的规矩，反到最后，自己却成了被清理掉的杂音。\n\n这不是输给咲夜。\n这是输给一个比她更完整、更稳、更不讲理的世界。\n\n正邪把额头抵在膝盖上，呼吸一下比一下乱。她不甘心，恨得胃里发酸，恨命运永远偏心，永远先站在那些高高在上的人那边。可在恨之外，剩下的只有一种她最讨厌的东西——懊悔。\n\n如果她更狠一点。\n如果她更早一点。\n如果她没有把希望押在那些和自己一样破烂的人身上。\n\n可现在说这些都晚了。\n\n屋外的天一点点亮起来，亮得让她烦。她还活著，可也只剩活著。那些曾经跟著她往前冲的人，那些她以为至少能留下几句名字的人，现在都成了红魔馆秩序底下被扫掉的灰。\n\n鬼人正邪缩在阴影里，第一次没有想著怎么翻盘。\n她只是看著天色变白，然后很慢、很用力地，把牙咬进自己的手背里，像在提醒自己——\n\n这个世界从来没有公平过。\n而她，终究还是没能把它翻过来。"
 scarlet.38.a: "……连愤怒都快不够用了。"

 scarlet.39.t: "山上的妥协"
 scarlet.39.d: "会客厅安静下来后，饭钢丸龙没有立刻翻那份文书。\n\n她只是坐在原位，指尖压著桌面，像在把心里那股厌恶一寸寸按回去。\n\n她不喜欢红魔馆。\n\n不喜欢那座馆说话时总像早就替别人决定好结局；不喜欢蕾米莉亚那种把威压包进优雅里的作风；也不喜欢红美铃方才那副客气却不容拒绝的态度。那不是协商，那是把刀放在桌上，再问你愿不愿意自己把手伸过去。\n\n可她更不喜欢另一件事——\n\n天狗因为一时的高傲，把自己拖进无谓的消耗里。\n\n射命丸文站在旁边，难得没有立刻开口。犬走椛也沉默著，手还按在刀柄上，像心里那口气怎么都顺不下去。\n\n饭钢丸龙终于把文书翻开，目光很冷。\n\n贸易权、工坊合约、情报交换、既往不咎。\n\n每一条都像施舍。\n\n每一条也都实用。\n\n她很清楚，妖怪山不是不能打，而是不能为了面子一直打下去。红魔馆现在气势正盛，内部稳，外部也开始收网。若天狗还要把人手丢在监视、试探、彼此拉扯上，那消耗掉的只会是妖怪山自己的血。\n\n文终于开口，语气比平常低了一点。\n「龙大人，真要答应？」\n\n饭钢丸龙没有抬头。\n「妳不想答应？」\n\n文笑了一下，那笑意却不轻松。\n「我是不喜欢。」\n「我也不喜欢。」饭钢丸龙说。\n\n她把文书合上，声音不重，却比刚才更硬。\n「可喜不喜欢，不是现在最重要的事。」\n\n椛皱起眉。\n「让天狗向红魔馆低头，山上不会服。」\n「那就让他们学著服。」饭钢丸龙抬眼，看向窗外的云海，「高傲不能当饭吃，警惕也不能替族群过冬。妖怪山若想继续站著，就得先活下去。」\n\n这句话落下时，连风都像停了一瞬。\n\n饭钢丸龙不是没有火。\n\n她有。\n\n她只是把那团火压得很深，压到足够换来一条能走下去的路。她讨厌被红魔馆逼到这一步，也知道蕾米莉亚不是值得亲近的对象。可她更明白，统治从来不是靠喜欢决定的。\n\n有时候，最难以下咽的命令，也得吞。\n\n因为天狗必须活下去。\n\n哪怕是被自己看不上的人压在头上，哪怕是与那座红色洋馆分享这片天空，妖怪山也不能在这个时候断掉。\n\n饭钢丸龙缓缓起身，把那份文书交回文手里。\n「传下去。」她说。\n「停止对红魔馆的监视与试探，撤回外围耳目，按协议交换情报与通行。」\n\n她停了一下，眼神冷得像刀背。\n「还有——」\n「别把这当成臣服。」\n「这是让天狗继续活著的代价。」"
 scarlet.39.a: "就算不喜欢，也得先活下去。"

 scarlet.40.t: "门口的午餐"
 scarlet.40.d: "中午的太阳落不到红魔馆正门，只把铁栏杆的影子压得笔直。红美铃照旧站在门边，帽沿压低，像随时都能睡过去；可真有风吹动、脚步靠近，她又比谁都醒得快。\n\n那天送饭来的人不是普通女仆。\n\n是咲夜。\n\n她端著托盘走过石阶，步子稳得像量过。汤没有晃，茶没有洒，连筷子都对得很正。美铃一看见她，先是一愣，接著就笑了。\n「哎呀，今天是女仆长亲自送饭？」\n\n咲夜把托盘放到门柱旁的小桌上，语气平平。\n「妳昨天午饭没吃，晚饭吃到一半又被叫走。照这样下去，守门的不是妳，是一具空壳。」\n\n美铃眨了眨眼，像被抓包了也不打算认错。\n「我有喝水。」\n\n咲夜看了她一眼。\n「水不能当午餐。」\n\n美铃低头看著托盘，里面不是随便凑的东西。饭是热的，菜是刚起锅的，连茶都还留著最刚好的温度。她嘴角的笑慢慢淡了点，变得更真。\n「妳很忙。」她说，「这种事让别人送就好了。」\n\n咲夜把手套拉平，语气依旧干净。\n「别人会送，但不一定会盯著妳真的吃完。」\n\n风从山道吹下来，带著草味与一点潮气。美铃看著她，忽然有点想笑。\n「妳这样很像在养一只不会照顾自己的大狗。」\n\n咲夜顿了半秒。\n「若妳愿意配合，也不用我像现在这样盯。」\n\n美铃坐到石阶旁，端起碗，边吃边看她还站著不走。\n「妳不回去？」\n「等妳吃完。」\n「怕我倒掉？」\n「怕妳说两句话就忘了继续吃。」\n\n美铃笑出了声。她低头扒了两口饭，忽然又放慢动作。\n「咲夜。」\n「什么？」\n「谢啦。」\n\n这句话很轻，轻得像门前吹过的一小阵风。咲夜没有立刻回答，只把视线转开一点。\n「吃完再说。」\n\n可她没有离开。\n\n她就站在那里，看著美铃把每一口都吃下去，看著门前的风照常吹过，看著整座红魔馆在白日里稳稳立著。\n\n对咲夜来说，这不过是一顿饭。\n\n可对美铃来说，那像是一种很安静的承认——\n\n门口有她守著，而她自己，也有人在盯著。"
 scarlet.40.a: "先把饭吃完。"

 scarlet.41.t: "桌边睡著的人"
 scarlet.41.d: "夜深之后，红魔馆的灯一盏盏熄下去，只剩走廊转角与办公室里还留著光。红美铃巡完最后一轮，路过咲夜的房门时，发现门没关紧。\n\n她本来想提醒一声，可一推开，就先看见桌上散开的帐册、排到一半的轮班表，还有伏在文件中间睡著的咲夜。\n\n她睡得很浅，眉心却还皱著，像连梦里都在核对哪一页少了签名。羽毛笔还握在手边，墨水差一点就要沾到袖口。\n\n美铃站在门口，先是安静了一会儿，才轻轻叹了口气。\n「又来了啊……」\n\n她走过去，把笔从咲夜指间慢慢抽出来，再把那些快滑到桌边的文件一张张收好。咲夜没有醒，只是在她碰到自己手腕时微微皱了一下。\n\n美铃看著那张累得发白的脸，最后还是弯下身，把人从桌前抱了起来。\n\n咲夜比看起来更轻。轻得像她平常那些端正、锐利、毫无破绽的样子，全是靠意志硬撑出来的。\n\n她刚把人放到床上，咲夜就半醒过来了。眼睛没全睁开，声音也还哑著。\n「……美铃？」\n「嗯，是我。」美铃替她把鞋脱了，顺手把被子拉上来，「妳在桌边睡著了。」\n\n咲夜像是想立刻坐起来，肩膀才一动，就被美铃按了回去。\n「帐册……还没——」\n「明天不会跑。」美铃说。\n\n咲夜的意识还没完全清醒，却还是本能地反驳。\n「流程不能断。」\n\n美铃听了，忍不住笑了一下。\n「妳都快断了，还管流程。」\n\n咲夜皱眉，像不喜欢这种说法。可她睁眼睁到一半，就又被疲倦压了回去。她看著美铃替自己把帐册合好、把灯调暗、把散掉的纸重新压平，那动作不熟练，却很小心。\n「妳明天会忘记东西放哪。」她低声说。\n「那妳明天再骂我。」美铃回答得很自然。\n\n咲夜沉默了几秒，像终于没力气再撑。她把脸往枕头里埋了一点，声音很低。\n「……别走太远。」\n\n美铃的动作停了一下。\n「我不走。」她坐到床边，语气放得很轻，「门口巡完了，这里我陪妳一会儿。」\n\n咲夜没有再说话，呼吸慢慢稳下去。她终于真正睡著了，手指却还抓著一点被角，像怕自己一醒来又回到桌前。\n\n美铃看著她，忽然明白一件事。\n\n白天的咲夜，是红魔馆最锋利的刀。\n可到了夜里，她也只是个会累、会撑过头、会在没人看见时倒在文件里的人。\n\n于是她伸手，把咲夜散下来的一缕发丝轻轻拨开。\n「睡吧，女仆长。」她低声说，「今晚换我看著妳。」"
 scarlet.41.a: "先睡，其他明天再说。"

 scarlet.42.t: "刀与墙"
 scarlet.42.d: "第二天傍晚，咲夜在回廊上拦住了美铃。\n\n她已经恢复成平常那副样子，制服整齐，表情端正，像昨晚那个在桌边睡著的人根本不是她。可美铃一看她站的位置，就知道这不是来谈工作的。\n「妳昨晚进我房间了。」咲夜说。\n「嗯。」美铃坦白得很快。\n「还动了我的文件。」\n「有整理好。」\n「还把我抱到床上。」\n\n美铃咳了一声，摸了摸鼻子。\n「那个……情况需要。」\n\n咲夜看著她，像在忍，又像在想该先从哪一句开始责备。最后，她只是把视线偏开了一点。\n「……谢谢。」\n\n这两个字说得很小，却比她平常任何一句命令都来得慢。美铃听见了，反而笑不出来，只是看著她。\n「彼此。」她说，「昨天的午餐，也谢了。」\n\n走廊外的风穿过长窗，把两人的衣角都吹得动了一下。她们站得不远，却都没有立刻往前一步。\n\n过了一会儿，美铃才靠到墙边，懒懒地开口。\n「说真的，我以前没想过我们两个会变成现在这样。」\n\n咲夜抬眼。\n「哪样？」\n「这样啊。」美铃比了比她，又比了比自己，「一个是人类，一个是妖怪；一个恨不得把每件事都排成直线，一个老是被说太松；看起来怎么都不该合得来。」\n\n咲夜难得没有立刻反驳。她顺著美铃的话想了一下，最后淡淡回了一句。\n「妳太吵。」\n\n美铃笑了。\n「妳太硬。」\n「妳会在工作时睡著。」\n「妳会在工作时把自己累到睡著。」\n\n两句话撞在一起，最后谁也没再往下争。因为她们都知道，对方说的不是挑刺，是事实。\n\n咲夜站在窗边，手指轻轻搭著窗框，声音比平常低一点。\n「可如果少了妳，门口会乱。」\n\n美铃看著她，笑意慢慢收敛。\n「少了妳，馆里也会乱。」\n\n回廊安静了几秒。\n\n咲夜没有否认。\n美铃也没有再故意闹她。\n\n她们忽然都明白了一件事：红魔馆不是只靠一个蕾米莉亚撑著，也不是只靠命令和规矩转动。它能稳稳站著，是因为有些人站在不同的位置，却在替彼此补上看不见的缺口。\n\n咲夜是刀，往前的时候不会犹豫。\n美铃是墙，站住的时候不会后退。\n\n她们太不一样了。\n\n可也正因为不一样，才刚好能一起走到这里。\n\n美铃最后笑著伸了个懒腰。\n「好啦，女仆长，妳去忙妳的。我去守我的门。」\n\n咲夜点了点头，往前走了两步，又停住。\n「美铃。」\n「嗯？」\n「午餐，记得吃完。」\n\n美铃先是一愣，接著笑出声。\n「知道了。」\n\n她看著咲夜走远，背影还是那么直，却没有以前那么冷。美铃忽然觉得，这大概就是红魔馆最奇怪、也最刚好的地方。\n\n两个完全相反的人，最后却成了彼此最不能少的一部分。"
 scarlet.42.a: "刀与墙，缺一都不行。"


scarlet.43.t:0 "火药敲响城门"
scarlet.43.d:0 "那时候的蕾米莉亚还很小，小到还不懂「时代」是什么，只知道这座城堡已经存在很久，久到墙上的裂纹、长廊里的烛火、窗外的夜雾，都像理所当然会永远陪著她。\n\n直到那一夜。\n\n先传来的不是喊杀声，而是炮声。\n\n第一发砲弹砸上外墙时，整座城堡都震了一下。石块碎裂，灰尘像暴雨一样从拱顶洒下来。接著是第二发、第三发，火光接连在夜里炸开，把那些曾经只属于吸血鬼的高塔与窗櫺照得像一具正在被拆开的尸体。\n「人类攻进来了！」\n\n喊声沿著长廊传开，女仆在奔跑，侍从在拉门，年老的吸血鬼拿起早已不适合这个时代的剑与枪。可城外的人类不是带著草叉来的。他们带来了火药、大砲、成排的火器，还有一种积压太久的愤怒——他们要的不是驱逐，而是彻底消灭盘踞在这里多年的怪物。\n\n蕾米莉亚站在长廊尽头，还没来得及理解发生了什么，就听见窗外传来整齐得可怕的口令。下一瞬，枪声齐发，玻璃与血一起炸开。她看见一名熟悉的侍从倒下，胸口被打穿，身体往后撞上墙，连哀号都只来得及发出一半。\n\n有人一把抱起她。\n「大小姐，快走！」\n\n她被塞进另一条走廊时，芙兰朵露已经在那里了。比她更小的妹妹缩在墙边，眼里满是受惊后的空白，翅膀紧贴在背后，连哭都忘了。\n\n蕾米莉亚抓住她的手，第一次真正感觉到恐惧不是传说里的词，而是会流汗、会发抖、会让心脏跳得像要裂开的东西。\n\n城堡的门正在被炸开。\n人类的火器正一间房一间房地推进来。\n\n而那个只属于吸血鬼的旧夜晚，也在炮火里开始崩塌。"
scarlet.43.a:0 "快跑，芙兰！"

scarlet.44.t:0 "燃烧的长廊"
scarlet.44.d:0 "她们一路往城堡深处逃。\n\n不是有方向地撤退，只是不断避开炮火、避开坍塌、避开那些端著火枪冲进来的人类士兵。长廊一段接一段地燃烧，天花板被震裂，挂画掉下来，火焰沿著窗帘往上爬，把原本华丽的厅室烧成一个个吞人的火坑。\n\n蕾米莉亚拉著芙兰朵露往前跑。她年纪还小，力气不够，却死死抓著妹妹不放。\n「不要停！」\n\n芙兰跑得跌跌撞撞。她还太年幼，根本跟不上这种逃命的速度。城堡里到处都是烟、热、枪声与血腥味，芙兰的呼吸很快乱掉，脚下也越来越不稳。\n\n就在她们冲过一段半塌的回廊时，外头一排火枪对准了窗。\n\n枪声响成一片。\n\n蕾米莉亚只来得及把芙兰往下一拉。碎玻璃、铅弹与烧热的木屑一起扫进来。芙兰发出一声短促的尖叫，背后的翅膀当场被轰烂一半，羽片与血沫一起飞散。她整个人摔倒在地，痛到连站都站不起来。\n「芙兰！」\n\n蕾米莉亚回头去抱她，下一秒，自己肩头与侧腹也连中两枪。冲击把她整个人带得踉跄，脚下一滑，两人一起跌进墙边的阴影里。\n\n士兵的脚步声越来越近。\n\n火把的光晃进来，照亮她们躲藏的角落。有人在喊：「她们在那里！把那两个也烧掉！」\n\n蕾米莉亚咬著牙，把芙兰抱在怀里。血从她自己的伤口里往外渗，烫得她发昏。她第一次感觉到，原来命运根本不会因为妳是吸血鬼、是贵族、是斯卡雷特，就给妳任何体面。\n\n她们已经逃不了了。\n\n城堡被炸烂了，出口被堵死了，守卫与侍从倒在各处，连夜色都救不了她们。\n\n芙兰缩在她怀里，翅膀破得不成形，身体抖得厉害。她痛得说不出完整的句子，只能一遍遍叫著姐姐。\n\n蕾米莉亚抱紧她，胸口却一点一点沉下去。\n\n她第一次明白，自己也有抓不住的东西。\n\n而下一刻，芙兰抬起头时，眼神已经不对了。"
scarlet.44.a:0 "别看，芙兰……"

scarlet.45.t:0 "坏掉的那一刻"
scarlet.45.d:0 "芙兰朵露先是安静了下来。\n\n那种安静很不对。不是因为她不痛了，而是因为某种更可怕的东西，正从她身体最深处醒过来。\n\n她抬头，看著那些靠近的人类。火把在她眼里晃动，枪口在她眼里晃动，整个燃烧的世界都像变成了一堆脆弱又讨厌的东西。她小小的胸口还在起伏，手指却慢慢抬了起来，像在抓一个谁都看不见的点。\n「不要——」蕾米莉亚话才出口，就晚了。\n\n第一个士兵在冲上来的瞬间，整个人像被看不见的手捏碎。不是被刀砍开，不是被子弹打穿，而是连骨头带血肉一起崩成一团。后面的人甚至还没反应过来，第二个、第三个就接著裂开。惨叫声一瞬间挤满整条走廊，又立刻被更大的爆裂声盖过。\n\n芙兰朵露站了起来。\n\n她背后那对被轰烂的翅膀还在滴血，眼神却亮得发狂。她像根本不明白自己做了什么，只是顺著那股失控的本能，把看见的一切都当成可以被毁掉的东西。\n\n士兵、火枪、墙壁、柱子、门、楼梯。\n\n整座城堡开始连著一起崩塌。\n\n有人跪著求神，有人转身逃命，有人还想开枪，可没有任何东西快得过芙兰此刻的破坏。她不再是小女孩，也不再只是蕾米莉亚的妹妹。她在那一刻变成了一个不稳定的怪物，一个连自己都不会停手的灾厄。\n\n火光一路往上窜，石墙整片整片塌下来。那些本来带著愤怒、带著火药、带著「要把吸血鬼彻底消灭」这个念头冲进城堡的人类，全被埋进了他们亲手点燃的毁灭里。\n\n蕾米莉亚倒在地上，看著妹妹站在崩塌中央，像看著命运终于露出它最丑陋的真面目。\n\n这不是胜利。\n不是反击。\n\n这是所有东西一起坏掉的声音。\n\n吸血鬼的城堡毁了。\n屠杀吸血鬼的人类也死了。\n\n而芙兰朵露，从这一刻起，再也不可能只是那个会跟在她身后的小妹妹。"
scarlet.45.a:0 "芙兰……停下来！"

scarlet.46.t:0 "废墟之后的流亡"
scarlet.46.d:0 "等蕾米莉亚再醒来时，天快亮了。\n\n她躺在碎石与灰烬里，四周只剩烧焦的木头味、干掉的血味，还有被清晨风吹散的烟。城堡不见了。那些高塔、长廊、宴会厅、窗外的夜色，全都被埋在废墟下面，像从来没存在过。\n\n她动了一下，伤口立刻痛得发黑。肩上的枪伤还在流血，侧腹像被火烧过。可她第一个想到的不是自己。\n「……芙兰。」\n\n她撑著爬起来，在断墙与碎石之间找，最后在一片塌掉的拱门下看见了她。\n\n芙兰朵露还活著。\n\n她蜷缩在那里，翅膀破得几乎不能看，手上和脸上全是血与灰。她没有哭，也没有笑，只是睁著眼睛，看著前方一片空的地方，像还没从昨夜里那场失控中回来。\n\n蕾米莉亚走过去，跪下来，把她抱进怀里。芙兰没有反抗，只是在被碰到的瞬间很轻地颤了一下。\n\n她们都还活著。\n\n可也只剩她们还活著了。\n\n蕾米莉亚抱著妹妹，抬头看向那片已经不再属于她们的天空。她忽然知道，这里不能待了。人类不会停，新的军队还会来，新的枪炮还会来；而她怀里的妹妹，已经变成一个连自己都不知道何时会再次爆开的怪物。\n\n从这一刻起，她们不再是某座古老城堡的主人。\n她们成了幸存者。\n成了流亡者。\n\n蕾米莉亚慢慢站起来，把芙兰背到背上。她年纪还小，身体也还在流血，可她已经没有别的选择。\n\n她回头看了最后一眼。\n\n那不是告别。\n而是记住。\n\n记住人类如何带著火药与大砲闯进来，记住吸血鬼如何被时代追杀，记住妹妹如何在生死一线间坏掉，也记住自己是如何从灰烬里醒来，第一次真正开始恨命运。\n\n然后她转身，带著那个不稳定却仍是她妹妹的孩子，一步一步离开废墟。\n\n吸血鬼的流亡，就从这里开始。"
scarlet.46.a:0 "我们还活著，这就够了。"

scarlet.47.t:0 "余烬中的誓言"
scarlet.47.d:0 "命莲寺没有随著内战结束而安静下来。\n\n白莲死了，寅丸星也死了。佛堂烧过，经卷散了，钟声停了，可剩下来的人还活著——而活著的人，最难处理。\n\n夜里的废寺只剩几盏压低的灯。纳兹玲把斗篷裹得很紧，手里仍握著那座宝塔，像握著一截不肯熄灭的遗骨。她把地图摊在断裂的供桌上，红魔馆、补给线、巡逻点、成员习惯，全被她用细小的记号圈了出来。\n「我们不是去送死。」她开口，声音低，却比刀还直，「要痛，就让她们痛在骨头里。要怕，就让她们每天醒来先摸摸自己的脖子还在不在。」\n\n村纱水蜜靠在阴影里，指尖敲著桌角，眼神阴得像海底。\n「先挑谁？」她问。\n\n纳兹玲抬眼，目光扫过红魔馆那几个名字。\n「门番、女仆长、图书馆那个魔女……还有那个自以为坐上王位就能把一切写成命运的吸血鬼。」\n\n云居一轮站在一旁，拳头攥得很紧。入道的影子在她身后一晃一晃，像压不住的怒。\n「白莲大人救过太多人。」她说，「她们把这一切踩碎，还要我们低头。这口气，我咽不下去。」\n\n纳兹玲把宝塔放在桌上，发出一声很轻的碰撞。\n「那就别咽。」\n\n她看著那群还肯留下的人，眼里没有狂热，只有被痛磨出来的硬。\n「白莲大人和星大人是堂堂正正死在战场上的。」\n「我们不一样。我们活下来，就是要让蕾米莉亚知道——命莲寺没死，佛门的火也没灭。」\n\n外头的风穿过破掉的窗纸，把残烬吹得四散。有人沉默，有人点头。没有人提投降。\n\n从那一夜起，命莲寺残党不再只是失败者。\n\n她们成了影子。\n成了匕首。\n也成了红魔馆再也不能安心睡下去的理由。"
scarlet.47.a:0 "她们还没有放弃。"

scarlet.48.t:0 "老鼠的失手"
scarlet.48.d:0 "第一次暗杀没有成功。\n\n纳兹玲原本算得很准。她知道演说的人群最乱，知道红雾、火光、旗帜和惊惶能替她藏住那一下出手。她甚至想过，如果能当场把蕾米莉亚打穿，那就算自己死在台下也值。\n\n可她没打中。\n\n光束擦过女王，炸开的是红魔馆，而不是那个该死的吸血鬼。人群崩溃时，她本来还想撤退，可红魔馆的反应快得像早就等著这一刻。咲夜的刀、门番的封锁、士兵的枪托，最后把她从人群里硬生生拖了出来。\n\n地牢很冷。\n\n纳兹玲被锁在铁椅上，双手绑得发白，宝塔也被夺走，放在她永远碰不到的地方。她抬头时，蕾米莉亚正站在牢门外，披风垂下来，像一片遮住月亮的血。\n「一只老鼠。」蕾米莉亚看著她，语气冷得发笑，「胆子倒不小。」\n\n纳兹玲啐出一口带血的气。\n「我没杀掉妳，是我失手。」她咬著牙说，「不是我错了。」\n\n蕾米莉亚的眼神没有动。\n「有差别吗？」\n\n她往前一步，高跟鞋敲在石地上，像给人数最后几下心跳。\n「妳以为炸掉我家、刺杀我的人，还能靠『信念』替自己留一条命？」\n\n纳兹玲笑了，笑得很难看，却不退。\n「妳不懂。」\n「白莲大人死了，星大人也死了，可她们没有输。输的是妳这种东西——赢了天下，却永远得不到人心。」\n\n地牢里安静了片刻。\n\n蕾米莉亚忽然也笑了，笑意轻得像刀。\n「人心？」她说，「那种会饿、会变、会背叛的东西，我从来不稀罕。」\n\n她转身，把手套慢慢拉平。\n「明天处刑。」\n「把她吊上台，让所有人看看：命莲寺剩下的忠诚，最后也只是这副样子。」\n\n牢门关上的那一刻，纳兹玲终于低下头。\n\n不是因为怕。\n而是因为她知道，这次真的走不到下一步了。\n\n可即使到了这里，她心里想到的，还是那个总站得很稳、总会低头看著她的身影。\n\n星大人。\n\n再等等。\n\n她想。\n\n至少在死之前，再让我看见妳一次。"
scarlet.48.a:0 "明日，公开处刑。"

scarlet.49.t:0 "佛火未灭"
scarlet.49.d:0 "处刑台搭在广场中央，和前几日蕾米莉亚演讲的位置隔得不远。这一次，没有烟火，没有宣言，只有铁链、绳索、士兵，还有一张被迫来看的脸。\n\n纳兹玲被押上台时，走得不快，却很直。她身上全是伤，斗篷破了，耳边还沾著干掉的血。人群在底下窃窃私语，有人骂她愚蠢，有人怕得不敢抬头，也有人看著她，像在看一个明明知道会死还是硬要往前撞的疯子。\n\n蕾米莉亚没有亲自上台，只坐在高处，冷冷看著。\n「命莲寺的余孽。」宣读的人声音很大，「刺杀王权，罪无可赦。」\n\n纳兹玲没有听完。她只是抬起头，看著灰白的天。\n\n视线开始发飘的时候，她真的看见了。\n\n不是广场，不是绳索，也不是那些模糊的人影。她看见的是寅丸星站在更远、更明亮的地方，还像从前那样安静，手里托著那座本该属于她的宝塔。没有血，没有火，也没有战争留下的灰。\n\n纳兹玲的嘴唇颤了一下，眼神第一次真正软了下来。\n「星大人……」\n\n她轻得几乎听不见。\n「这次，我没做好。」\n\n台下没人知道她在看什么。只有纳兹玲自己知道，那不是幻觉，是她最后能抓住的希望。\n\n她笑了一下，眼里终于有了点温度。\n「下次……」她喘了一口气，声音断断续续，「如果真有转生，就别再生在这种烂世道了。」\n「去一个更好的地方。」\n\n绳索落下。\n\n广场静了一瞬。\n\n人群里，村纱水蜜把帽檐压得很低，手指却攥得发白。她看著纳兹玲的身影慢慢停住，眼神黑得像要把整个处刑台吞下去。\n\n云居一轮站在她身旁，牙关紧得发颤。入道的影子在她背后微微晃动，像压著一声还没吼出来的怒。\n「现在冲上去，只是一起死。」村纱低声说。\n\n一轮没有回头，只盯著台上那具刚刚还会说话的身体。\n「我知道。」\n「那就忍。」\n\n村纱的声音更低了，像从海底冒出来。\n「等下一次。」\n\n一轮终于点了一下头。\n\n蕾米莉亚的怒火没有把她们吓退。\n纳兹玲的死也没有把命莲寺最后那点火踩灭。\n\n那天处刑结束后，广场上的血很快被冲掉，绳子也被收走，像什么都没发生。\n\n可村纱与一轮都知道——\n\n这不是结束。\n\n这只是佛火换了一种更暗、更久的方式，继续烧著。"
scarlet.49.a:0 "她们会等，直到下一次。"

 scarlet.50.t: "舞者的最后一步"
 scarlet.50.d: "刀落下之前，时间像被拉得很长。\n\n尔子田里乃的呼吸已经乱了，汗水沿著额角滑下来，沾在被扯破的舞衣上。她还想把背挺直，还想让自己看起来像过去那个能替后户之神传递意志的舞者。可绳子太紧，膝盖太软，血也流得太快。\n\n丁礼田舞站在她旁边，安静得近乎死寂。她没有再看台下那些低著头的人，也没有再看那些带著嘲意的红魔馆士兵。她只是望著红雾深处，像在等某道永远不会真正关上的门。\n「舞。」里乃忽然低低喊了她一声。\n\n舞偏过头，眼神还是很平。\n「嗯。」\n\n里乃咬著牙笑了一下，那笑已经不再漂亮，只剩最后一点硬撑的骨头。\n「真难看啊。」\n\n舞看著她，竟也轻轻笑了。\n「是啊。」\n「被这种家伙押上来，还要给她当戏看。」里乃抬起头，眼里最后那点火还没熄，「真让人恶心。」\n\n蕾米莉亚站在前方，像没听见，又像根本不在乎。她只是垂眼看著她们，像看两件很快就会被移走的障碍。\n\n里乃忽然把目光转向她，声音一下提了起来。\n「听著，吸血鬼！」\n\n广场上的人群全颤了一下。\n「妳可以砍下我们的头，可以把我们挂起来给所有人看。」她喘了一口气，嘴角还带著血，「可妳别真以为自己踩的是两个舞者。」\n\n她的眼神亮得发狠。\n「我们是后户之神的手足，是贤者手里伸出去的影子。妳今天砍的，不是两条命，是在贤者面前撕脸。」\n\n丁礼田舞这时才慢慢开口。她的声音不大，却比里乃更冷。\n「妳现在站得很高。」她说，「可站得高，不代表妳看得远。」\n\n她望著蕾米莉亚，像望著一个已经踏进陷阱却还不自知的人。\n「后门不在妳看得见的地方。」\n「妳以为自己封住了一切，只是因为妳根本不知道，有些门从来不是给妳这种人走的。」\n\n刽子手的刀在半空微微颤了一下。\n\n里乃忽然笑得更用力，像把最后一口气全烧起来。\n「来啊！」她喊，「把我们挂起来！让那群躲起来的人看清楚，这就是妳的王道——一个靠砍头证明自己不是怪物的王！」\n\n舞闭了闭眼，像终于把什么放下。\n「隐岐奈大人会看见的。」她低声说。\n\n这句话不知道是说给里乃、说给自己，还是说给蕾米莉亚。\n\n下一瞬，刀锋终于落下。\n\n血洒开时，红雾像也跟著抖了一下。\n\n她们没跪。\n\n到最后一步，都没有。"
 scarlet.50.a: "她们把最后的不屑，留给了王座。"

 scarlet.51.t: "后户之神的怒火"
 scarlet.51.d: "广场上的血还没干透，后户已经打开了。\n\n不是谁都能看见的门，不是建在墙上的门，也不是红魔馆士兵能用枪托砸开的门。那道门开在视线的背后，开在规矩的死角，开在贤者的怒意所能抵达的一切缝隙里。\n\n摩多罗隐岐奈站在门后，看完了整场处刑。\n\n她没有出手。\n\n不是不想，而是她看得太清楚——蕾米莉亚要的就是这一幕。她要用两颗头，让残党颤抖；她要用舞者的血，去试贤者的底线。她甚至是在故意等著后户之神露面，好让自己有理由把刀再往上抬。\n\n可看得清楚，不代表能忍。\n\n隐岐奈垂著眼，看著那两具刚刚还会说话、还会替她起舞的身体被拖下去。她的脸上没有太大波动，只有指尖慢慢收紧，像要把整扇门捏出裂痕。\n「……很好。」\n\n她说得很轻，却让整片后户的空气都跟著冷了下来。\n\n里乃与舞是她的舞者，是她放到人前的手，是替她踩在地上、替她把意志跳给世人看的影子。她们可以死，可以败，可以被逼到无路可退——可她们不该被这样挂上台，像两件战利品一样示众。\n\n贤者的尊严，不是给吸血鬼拿来踩著立威的。\n\n门后传来一阵脚步声。那不是人类的脚步，也不是红魔馆那种训练过的整齐节奏，而是某种带著不安与躁意的靠近。\n「隐岐奈大人……」一个声音压得很低，「我们要动手吗？」\n\n隐岐奈没有回头。\n\n她仍望著广场，望著红雾，望著那座以为自己已经把一切踩在脚下的红魔馆。\n「现在？」她淡淡地问。\n\n那声音立刻沉了下去，不敢再答。\n\n隐岐奈终于笑了一下。那笑意很薄，也很冷，像一把贴著骨头滑过去的刀。\n「不。」\n「她现在气势正盛，刀也正热。」\n「这种时候撞上去，只会让她更像个赢家。」\n\n她抬起手，指尖在空中轻轻一划，一道新的后户便在她身侧无声张开。门里没有光，只有深不见底的暗。\n「可她总要睡。」\n「总要松。」\n「总会以为自己真的封住了所有门。」\n\n她的声音越来越轻，也越来越危险。\n「到那时，我会让她知道，贤者不是给她拿来挂头颅取乐的东西。」\n\n她最后看了一眼广场。\n「蕾米莉亚。」\n\n这一次，她终于完整地叫出了那个名字。\n「妳会为今天这一幕付出代价。」\n\n后户随即关上。\n\n红雾仍压著广场，王座仍立在高处，广场上的人群也还在发抖。\n\n可有些门，已经在看不见的地方打开了。"
 scarlet.51.a: "贤者的帐，还没开始算。"


 scarlet.52.t: "流亡路上的施舍"
 scarlet.52.d: "我还记得流亡欧洲时看见的那些教堂。\n\n钟声很大，门很高，玻璃窗上的圣人一个个低头垂眼，像真的在怜悯世人。门外跪著的是饿到发抖的母亲、抱著死孩子不肯放手的老人、还有一群连鞋都没有的流民。他们把最后一枚铜币放进奉献箱，像把命交给一个看不见的东西。\n\n神职人员站在高处，袍子干净，声音温和。\n「忍耐吧。上帝会看见你们的痛苦。」\n「奉献吧。主会记住你们的虔诚。」\n「死去的人不是真正死去，他们会在天国得救。」\n\n真会说啊。\n\n我站在阴影里，看著那些人一边安慰、一边收钱。穷人把面包钱塞进木箱，富人把银币丢进去，得到一句更响亮的祝福。教堂里的蜡烛烧得比谁都亮，厨房里的肉汤比谁都香，可门外的人还是照样饿，照样病，照样倒在雪地里。\n\n有个修士甚至当著流民的面说：「主正在考验你们的信心。」\n\n考验？\n\n我看见的只有生意。\n\n他们把别人的恐惧包成经文，把别人的眼泪换成铜币，再把这一切叫做慈悲。那群高高在上的东西，从来不是在救人。他们只是在确保那些快要活不下去的人，别在饿死前先学会愤怒。\n\n宗教最有用的地方，不是让人得救。\n\n是让人继续忍。"
 scarlet.52.a: "他们贩卖的不是希望，是麻醉。"

 scarlet.53.t: "神不会从火里走出来"
 scarlet.53.d: "后来我又看见更多。\n\n看见村庄被狼人撕开，房子烧著，血沿著泥路往下流；看见人类抱著十字架缩在屋角，嘴里不停念著名字，像以为多念几次，奇迹就会降临。结果呢？狼人照样咬断他们的脖子，火照样把屋顶烧穿，尖叫照样在半夜里断掉。\n\n神没有来。\n\n可神职人员来了。\n\n等一切结束之后，他们披著干净的袍子走进废墟，对著幸存者画十字，说这是试炼，是原罪，是主不愿言明的安排。有人问：「那我的孩子为什么会死？」\n\n他们回答：「因为主自有旨意。」\n\n有人问：「那祈祷有什么用？」\n\n他们回答：「至少你的灵魂不会迷失。」\n\n真漂亮。\n\n活著时救不了你，死了之后还要收走你的眼泪，把它包成一句高贵的废话。\n\n我甚至看见有人在灾后贩卖圣骨、护符、沾过圣水的布条，价钱一件比一件高。那群神职人员嘴上说著仁爱，手却比谁都快，先把善款收进教会，再把活路卖给那些本来就没有路的人。\n\n所以我很早就明白了。\n\n在这个妖怪仍能踩碎村庄、人心又比玻璃更脆的时代，宗教不是光。\n\n宗教是毒。\n\n它让弱者以为忍耐就是美德，让绝望的人把最后的反抗也跪著交出去，让一群虚伪的嘴脸踩在众人的苦难上，把腐败说成神意。\n\n若这世上真有什么值得信，那也绝不是教堂里那些会收钱的慈悲。\n\n我宁可相信火、相信刀、相信握在自己手里的力量。\n\n至少它们不会骗人。"
 scarlet.53.a: "宗教若不肯闭嘴，我就替它们闭嘴。"


 scarlet.54.t: "被划掉名字的人"
 scarlet.54.d: "他原本有名字。\n\n不算好听，也不算响亮，就是那种只会出现在小巷、烂酒馆和旧户籍上的普通名字。可在红魔馆接管之后，名字先是变成标记，后来又变成问题。有人说他替旧势力送过信，有人说他帮反抗者藏过粮，也有人说他只是在酒后多骂了两句「那个吸血鬼」。\n\n最后，这些都不重要了。\n\n重要的是，文书下来了。\n\n两名士兵在清晨敲开他的门，动作不粗暴，甚至还先确认了门牌与册号。邻居隔著窗纸偷看，只看见他被套上粗绳，胸口挂了一块写著编号的木牌。他没挣扎，也没喊。他只是站在门口，回头看了一眼屋里那张还没收好的小桌，像突然发现自己活了那么久，最后能带走的记忆竟只剩这么一点。\n\n卡车关上门时，他才终于低声问了一句。\n「我做了什么？」\n\n没人回答。\n\n到了劳工营，他的名字彻底被收走。人们叫他那串编号，像叫一件工具。白天搬石、抬木、挖沟，夜里缩在铁丝网后，听别人的咳嗽和哀号。这里没有神，也没有说理的地方。只有班次、哨声、饥饿，还有每个人都学得很快的一件事：别问。\n\n他有时会想起街上的新路、准时发下来的配给、孩子们手里不再空著的碗。红魔馆确实让很多地方变好了。\n\n可那又怎样？\n\n被抓进来的人，不会因为外面的秩序而比较不痛。名字被划掉的人，也不会因为城里繁荣就重新变回人。\n\n有一天夜里，他靠在冰冷的墙上，听见新来的囚犯低声问：「蕾米莉亚真的那么伟大吗？」\n\n他沉默了很久，最后只笑了一下。\n「对站在外面的人来说，也许是吧。」\n「可对我们这种被收进流程里的人，她不是王。」\n「她是结案。」"
 scarlet.54.a: "被抹掉的名字，不会替王歌颂。"

 scarlet.55.t: "模范子民"
 scarlet.55.d: "她家以前总是缺东西。\n\n米缺半袋，药缺半盒，灯油缺半壶。夜里街上不安全，孩子一咳就是大事，谁家若倒了霉，第二天多半也只会得到几句可怜。\n\n红魔馆接手后，这些事慢慢少了。路修好了，配给准时了，巡逻的脚步每天都照著固定时辰经过街口。她第一次领到足量的粮票时，甚至愣了很久，像不敢相信这种事真的会落到自己家头上。\n\n所以当里长叫大家去学习新规矩、背诵新口号时，她没有犹豫。\n「蕾米莉亚大人英明。」\n「感谢红魔馆带来安定。」\n\n她背得很快，也背得很真。\n\n不是因为她特别忠诚，而是因为她真的看见孩子吃饱了，看见丈夫的伤有药可拿，看见夜里终于有人巡街，不必再靠自己拿木棍守门。这些东西太实际，实际到足够让人把很多疑问吞回去。\n\n有一天，她隔壁那户人忽然不见了。门关著，床铺整齐，碗还摆在桌上，像只是出门了一趟。街坊没人提，里长只说那家被列进了「清查名单」，叫大家不要多问。\n\n她那晚失眠了。\n\n可第二天清晨，孩子照样喊饿，街上照样发面包，药铺照样开门。她站在队伍里，看著人们一个接一个低头道谢，忽然明白一件事：在这个新世界里，最安全的活法不是懂太多，而是站对边。\n\n从那之后，她更认真地配合。开会时坐前排，检举时不落后，红魔馆来人巡查，她会主动端茶，还会提醒孩子遇见士兵要先低头问好。\n\n有人在私下骂她软弱。\n\n她听见了，只把衣角拉平。\n「你可以叫我什么都行，」她小声说，「可我家的人现在活著。」\n\n她不是没看见那些被带走的人，也不是不知道恐惧正在替秩序工作。\n\n她只是选了另一条路。\n\n在蕾米莉亚的阴影里，把日子过下去。"
 scarlet.55.a: "对吃得饱的人来说，安定本身就是恩典。"

 scarlet.56.t: "来自美国的笔记"
 scarlet.56.d: "他从美国来，带著记事本、相机和一口不太合时宜的外地口音。\n\n表面上，他是来观察战后重建的记者。实际上，连他自己都说不清，自己是在记录一个新兴政权，还是在记录一场被包装得极其高效的统治实验。\n\n他看见的第一个场景，是整齐。\n\n街道宽了，店铺开了，粮袋成堆，工厂的烟囱昼夜不停。孩子们在街角追逐，大人排队领配给，士兵巡逻时几乎没有多余动作。以一个外来者的标准来看，这地方的秩序好得惊人。\n\n可他也很快看见第二个场景。\n\n每当提到某些名字，周围的人就会停一下；每当问起失踪的邻居，回答永远是「不清楚」；每当远处有卡车驶过，人群会本能地让开，像在替某种不能提的流程腾出空位。\n\n他试著采访一位妇人。对方先说蕾米莉亚是救世主，让她一家终于吃饱；可在记者提到隔壁那户被带走的人时，她的声音立刻低下去，眼神也飘开，像忽然想起哪里有双眼睛正看著。\n\n他在笔记本上写下两行话：\n「秩序是真的。」\n「恐惧也是真的。」\n\n几天后，他在一次公开场合远远看见蕾米莉亚。她站得不高声，不张扬，却能让整个广场先安静下来，再开始呼吸。那不是单纯的魅力，也不是单纯的暴力，而是一种把两者结合后、极度有效的权威。\n\n他回到住处，对著写满速记的纸沉默了很久。\n\n最后，他在报导的结尾写道：\n「若以效率衡量，她是一位出色的统治者；若以自由衡量，她的影子覆盖得过于完整。她没有消灭混乱，而是把混乱收编进自己的规则里。于是，在她治下的人民同时得到两样东西——安全，与不敢开口的沉默。」\n\n写完后，他没有立刻寄出稿件。\n\n因为连一个外来者都看得出来：在这里，真相不是不能写。\n\n只是写了之后，要看谁付得起代价。"
 scarlet.56.a: "她既是秩序，也是压迫。"



scarlet.57.t:0 "坏掉的神与姐姐的笑"
scarlet.57.d:0 "我跟姐姐流亡的时候，看过很有趣的东西。\n\n不是糖，也不是新玩具，是神自己坏掉的样子。\n\n那时候欧洲到处都在吵。有人把教堂的门钉得砰砰响，有人撕画像，有人烧书，还有人站在广场上大声骂那些穿得很体面、却总爱替神收钱的人。大家都说那是改革，说神不能再这样管人，说天主教的权力太大、太脏、太重。\n\n我站在屋顶上看，姐姐站在我旁边。\n\n下面的人在喊，钟声乱敲，修士的帽子被扯掉，金色的圣像倒在泥里，脸朝下，像被谁踩了一脚。\n\n我问姐姐：「他们是在打架吗？」\n\n姐姐笑了一下。\n\n她那种笑你们知道吧？就是嘴角只翘一点点，可眼睛亮亮的，好像看见很喜欢的东西。\n「不是打架，芙兰。」她说，「是人类终于敢咬神了。」\n\n我就蹲在烟囱边边，歪著头看。\n「那不是很好吗？」我问。\n\n姐姐看著下面那些拿著经书、旗帜、火把和木槌的人，红眼睛里一点同情都没有，只有兴味。\n「好，但不够好。」她说。\n「他们只是换了一个神的说法。」\n「今天砸的是旧教堂，明天就会盖新教堂；今天恨的是教皇，明天又会跪另一种规矩。」\n\n我不太懂，就拉她袖子。\n「那要怎样才算够？」\n\n姐姐低头看我，声音很轻。\n「要把『神应该管人』这件事本身也砸掉。」\n\n我那时候只觉得姐姐说话真坏。\n可我后来越想越觉得，她说得对。\n\n因为那些人嘴上说著自由，转头又要别人照他们的自由来活；嘴上说神爱世人，手却还是要伸进别人的碗和脑袋里。宗教就像一条又长又黏的布，会先把你包起来，再跟你说这样很温暖。\n\n姐姐讨厌那种东西。\n\n她看著教堂起火，看著修士逃跑，看著人群把神像从高处拖下来，最后只是淡淡地说了一句：\n「这世界若真要改，就该改得更彻底。」\n\n那天夜里，我们没有停留太久。教堂烧得很亮，亮到我眼睛都有点痛。\n\n姐姐牵著我往更暗的地方走，一边走一边说：\n「记住，芙兰。」\n「神从来不会救妳。」\n\n我点点头。\n\n因为我已经看见了。\n那些跪在教堂里哭的人，哭到最后，还是得自己从火里爬出来。"
scarlet.57.a:0 "姐姐说，神只会替自己活。"

scarlet.58.t:0 "饿得像纸一样的女孩"
scarlet.58.d:0 "后来我们去了爱尔兰。\n\n那地方不太好闻。风很湿，地很冷，人也很薄。不是瘦一点点喔，是那种连影子都轻得像会飘走的薄。姐姐说那是饥荒，说人类有时候就算没有妖怪来咬，也能自己把自己弄到快死掉。\n\n我本来不想看那些路边的人，因为他们的眼神都很像。空空的，像饿太久以后，连恨都懒得恨了。\n\n可是姐姐停下来了。\n\n我顺著她的视线看过去，看见一个女孩坐在破书店门口。她抱著一本比她手臂还大的书，脸白得像窗纸，瘦得像一折就断，咳起来时整个人都在抖，像胸口里卡了很多很多碎玻璃。\n\n我那时候拉拉姐姐的手。\n「她快死了。」\n\n姐姐嗯了一声，却没有马上走。\n\n那女孩抬起头来看我们。她眼睛很深，不像别人那样只会求。她是那种……就算快饿死了，还在看字的人。她手里的书都湿了，边角卷起来，她还舍不得放。\n\n姐姐走过去，蹲下来问她：「妳在看什么？」\n\n她先咳了一阵，才很慢地说：「能让我活下去的方法。」\n\n我就盯著她看。\n\n哇，这句话很厉害。不是「给我面包」，不是「救救我」，是「方法」。她饿成那样，脑子还在转，像一盏小灯死活不肯灭。\n\n姐姐听完，嘴角动了一下。\n「饿死在这里，真浪费。」她说。\n\n我知道那是姐姐在称赞人。\n她平常很少这样。\n\n那女孩看著姐姐，没有马上答应，也没有哭。她只是把书抱得更紧一点，像在想：眼前这个穿得这么漂亮、还闻起来像夜色和血的人，到底是什么东西。\n\n姐姐朝她伸手。\n「跟我走。」\n\n她问：「你能给我什么？」\n\n姐姐回答得很快。\n「食物、药，还有时间。」\n\n女孩盯著那只手很久，久到我都想替她握了。最后，她终于伸出自己冷得像冰块的手，放到姐姐掌心里。\n\n她说她叫帕秋莉。\n\n我就凑过去看她，问她：「妳真的很会看书吗？」\n\n她喘了一口气，居然还有力气回我：「比妳会。」\n\n我当场就不喜欢她一点点了。\n\n不过也只有一点点。\n\n因为从那天开始，她就跟我们一起走了。姐姐让她上车，让她喝热汤，还让我别再故意吓她。她裹著毯子，一边咳一边看书，看起来像一张快被风撕掉的纸，可那张纸里面装的东西，后来多得吓人。\n\n姐姐说得对。\n\n让这样的人饿死，真的很浪费。"
scarlet.58.a:0 "她瘦得像纸，脑子却亮得吓人。"

scarlet.59.t:0 "魅魔、老师，还有幻想乡"
scarlet.59.d:0 "再后来，我们遇到一个很怪的女人。\n\n她自己说自己是魅魔，也是魔法使。她笑起来坏坏的，帽子很大，裙底很黑看不清脚，声音像在拿针尖刮玻璃。她看见帕秋莉的第一眼，就像姐姐看见金子一样，眼睛整个亮起来。\n「这孩子是谁的？」她问。\n\n姐姐没什么表情地回答：「现在是我的。」\n\n那女人就笑得更开心了。\n「借我养一养。」她说，「我把情报给妳，妳把这孩子给我教。」\n\n我立刻抱住帕秋莉的一条手臂。\n「不行！」\n\n帕秋莉被我扯得差点跌倒，一边咳一边皱眉。她还没长大多少，脸还是白，手也还是冷，可她已经不像爱尔兰那时候那么像快断掉的人了。\n\n姐姐没有立刻拒绝。她问：「什么情报？」\n\n那个自称魅魔的魔法使转了转手杖，语气轻得像在讲一个秘密。\n「东方。」\n「很远的东方，有一个地方叫幻想乡。」\n\n我那时候坐在石头上晃脚，听见新名字就立刻抬头。\n「幻—想—乡？」我一个字一个字跟著念。\n「嗯。」她瞇起眼睛，像在看很远很远的地方，「那里收留被外面世界忘掉的怪物、传说和异类。是一个会把『不该存在』收起来的地方。」\n\n姐姐安静了。\n\n我知道她在想事情。她只要一安静，周围的空气都会跟著缩起来。\n\n魅魔又笑了一下，往前靠近桌边。\n「别只是去躲。」她说。\n「夺下来。」\n「夺下一个可以让怪物生存的地方。那才像妳，蕾米莉亚。」\n\n好喔。\n这句话一出来，姐姐的眼神就变了。那不是单纯「有兴趣」，是她那种很少见的、真的把某件事看进心里的样子。\n\n帕秋莉在旁边抱著书，低低地问：「我可以自己决定吗？」\n\n魅魔歪头笑她。\n「当然，前提是妳够聪明，能在我手底下活下来。」\n\n帕秋莉咳了两声，居然点了头。\n\n所以事情就这样定下来了。姐姐跟魅魔交换了情报，把帕秋莉短暂交给她学习魔法、符文和更难的东西。我不太高兴，因为帕秋莉不在的时候，我讲故事就少一个人听。\n\n可是姐姐很高兴。\n\n那天晚上，她难得在篝火旁坐了很久，手里转著杯子，对我说：\n「芙兰，我们不用一直跑了。」\n「我们要去幻想乡。」\n\n我问她：「去了以后呢？」\n\n姐姐抬头看我，笑得很漂亮。\n「去了以后，找个地方站住。」\n「或者，抢一个。」"
scarlet.59.a:0 "幻想乡——听起来就像要藏很多怪物。"

scarlet.60.t:0 "一路往东的人"
scarlet.60.d:0 "我们真的开始往东走了，而且走了很久很久，久到我以为地图根本没有尽头。\n\n大概很大的战争结束没几年的时候，我们差不多把丝绸之路走成了一条自己的故事。姐姐披著披风，白天躲、夜里走；帕秋莉裹得像一团会咳嗽的布，边走边记东西；我则一路数著沙子、月亮、骆驼和死人骨头。\n\n中东很热，热到连空气都像在烤人。沙漠白天会把鞋底晒烫，晚上又冷得像有人把刀贴在脖子上。我有一次把脚埋进沙里，姐姐立刻把我拎出来，说如果我再乱玩，就把我绑在骆驼上。\n\n我笑得很大声，因为我知道她不会真的绑。\n\n就是在那段路上，我们遇到了水桥帕露西。\n\n她先自称是妖怪，然后又补一句自己很讨厌别人比她快乐。哇，那句话真有她的味道。她站在一座快干掉的桥边，头发乱乱的，眼神绿得像有火在里面烧。\n「你们也去幻想乡？」她问。\n\n姐姐点头。\n\n帕露西哼了一声，像不太想承认自己其实也一样。\n「那就一起吧。」她说，「路上若有人笑得太开心，我正好可以顺手讨厌一下。」\n\n之后人越来越多，像整条路都在把不属于外面世界的东西往东边推。\n\n我们遇见古明地觉和古明地恋。那对姊妹很有趣，一个看人像在拆盒子，一个看起来像根本没在看你，却又已经从旁边走过去了。她们静得很怪，怪得我很喜欢。\n\n后来又有爱丽丝。她身边总带著人偶，讲话不多，可每一个字都像在跟谁赌气。再后来是藤原妹红，白头发，眼神凶，背后像拖著一整条烧不完的火路。\n\n大家都去幻想乡。\n\n好像那地方不是地图上的一点，而是一块会把所有不合时宜的人吸过去的磁石。\n\n我有时候走到一半会忽然回头看，看我们这一长串影子：吸血鬼、病弱魔女、忌妒的妖怪、会读心的姊姊和不想被读心的妹妹、带人偶的女孩子、死不掉的复仇鬼。\n\n我就忍不住笑。\n「姐姐，我们好像一支马戏团。」\n\n姐姐头也不回地说：「那妳就是最吵的那一个。」\n\n我接受了。\n\n因为这条路本来就很适合怪人走。"
scarlet.60.a:0 "人越多，路反而没那么无聊了。"

scarlet.61.t:0 "火堆边的第一半故事"
scarlet.61.d:0 "有一次晚上，风很小，我们围著火坐了一圈。\n\n帕露西先开口，因为她盯著别人的碗看了很久，盯到我都想把自己的分她一口。她说她住的地方全是忌妒，连呼吸都带著酸味。谁比谁多一点，谁就要被看不顺眼；谁稍微亮一点，就会被拖下去。\n「我不是不会忌妒，」她说，眼睛映著火，很绿，「我只是受够了连骨头里都泡著那种东西。」\n\n我听完点点头。\n「听起来很臭。」\n\n她居然笑了一下。\n\n接著是古明地觉。\n\n她说话总是很稳，稳得像已经把自己跟别人的心一起看完了。她说有些地方不喜欢她，因为她看得太深；有些人表面说没关系，心里却早就把门关上了。她不怕寂寞，她只是知道妹妹不能一直那样被看待。\n\n说到这里，她看了一眼恋。\n\n恋正蹲在旁边玩树枝，像根本没在听。可她忽然抬头，笑著说：\n「我想去一个不会一直叫我怪物的地方。」\n\n她讲得很轻很轻，轻到像在说别人的愿望。\n\n我一下就不笑了。\n\n因为我懂。\n\n太懂了。\n\n后来帕秋莉把手缩在袖子里，咳了两声，说幻想乡或许也不会比外面干净多少。她说只要有地方有人，就会有偏见、排斥、上下、规矩。她的意思大概是：别太早做梦。\n\n可古明地姊妹没有反驳。\n\n她们只是安静地看著火，像知道希望这种东西，本来就不是因为有保证才值得抓。\n\n我那晚抱著膝盖坐在姐姐旁边，忽然觉得很奇怪。\n\n原来我们这群看起来一个比一个怪的人，想要的东西居然差不多。\n\n不是王位，不是掌声，也不是谁跪在面前。\n\n只是想找一个地方，让自己不用每一秒都证明「我不是多余的」。"
scarlet.61.a:0 "想被留下，原来不是只有我一个。"

scarlet.62.t:0 "火堆边的另一半故事"
scarlet.62.d:0 "第二天晚上，轮到剩下的人讲故事。\n\n爱丽丝先开口。她的人偶全坐在她旁边，像一排比她更听话的小孩。她说她不是单纯在旅行，她是在逃。逃她的母亲，逃那种把「为妳好」说成绳子的声音，逃那种明明长著自己的手脚，却每一步都像被别人先决定过的感觉。\n「我不要再被摆成谁喜欢的样子。」她说。\n\n我看了看她的人偶，又看了看她自己，忽然觉得她嘴上说得冷，心里其实烫得很。\n\n接著是藤原妹红。\n\n她讲话最短，也最像刀。她说她去幻想乡，不是为了安身，不是为了交朋友，也不是想开始新生活。她是去找一个人。\n「蓬莱山辉夜。」她说这名字时，火都像跟著晃了一下。\n「我要找到她，然后把很久以前没打完的帐打完。」\n\n我眨眨眼。\n「只是为了复仇喔？」\n\n她看了我一眼。\n「够了。」\n\n哇，好凶。\n可我不讨厌。因为那种一路被什么东西撑著往前走的样子，我也见过。姐姐背著我走在废墟里时，大概就是那个眼神。\n\n帕秋莉那晚难得多说了几句。她说幻想乡不是天堂，只是一个可能让怪物不至于立刻被世界擦掉的地方。姐姐听完没有反驳，反而点了点头。\n「那就够了。」她说。\n「天堂是给会做梦的人去的，我们要的是地盘。」\n\n大家都笑了，连帕露西都哼了一声，像不想承认这句话其实挺对。\n\n我看著火堆边那些脸，忽然有种很怪的感觉。\n\n我们根本不是同一路的人。\n有人为了逃，有人为了找，有人为了不被看见，有人为了终于能被看见。\n\n可那一夜，大家都朝同一个地方去。\n\n我就把下巴放到膝盖上，小小声地对姐姐说：\n「如果我们真的到了幻想乡，它会不会其实只是另一条会坏掉的路？」\n\n姐姐看著火，停了几秒。\n「那也得先走到那里。」\n\n好吧。\n\n我喜欢这答案。\n\n因为姐姐从来不保证结局，她只保证会往前。"
scarlet.62.a:0 "只要还在走，故事就还没完。"

scarlet.63.t:0 "西安、分岔，还有上海的门"
scarlet.63.d:0 "最后我们到了西安。\n\n城很大，墙也很高，尘土和人声黏在一起，像整个世界都在这里喘气。走到这里的时候，我们这一路捡来的队伍终于开始散开了。\n\n帕露西先走，她嘴上说只是嫌我们太吵，可临走前还是看了姐姐一眼，像在说别死得太快。\n\n古明地姊妹也走了。觉向我们点头，恋则笑著挥手，转个身就不知道跑哪里去了。爱丽丝带著她的人偶往另一条路走，背挺得很直，像终于把自己的线握回手里。妹红是走得最干脆的，她只留下一句「若在幻想乡看见辉夜，先别拦我」，然后就头也不回地走了。\n\n我站在城门边看著她们的背影，忽然有点郁闷。\n「她们就这样走啦？」\n\n姐姐摸摸我的头。\n「本来就只是同行一段路。」\n\n我噘了一下嘴。\n「我还以为大家会一起进幻想乡。」\n「不会。」帕秋莉在旁边咳了一声，语气还是很平，「幻想乡是终点，不是队伍。」\n\n哼。她有时候真的很会把话讲得冷冷的。\n\n可她说得对。\n\n到了西安之后，我们的路也改了。姐姐没有打算直接从内陆一路硬闯到日本，她说那太慢，也太容易把一身麻烦全拖进来。她要从上海走海路，先去港口，再找船，然后用她最会的那种方式——优雅地、理直气壮地，把自己送进下一个命运里。\n\n所以我们又往上海走。\n\n上海，潮、乱、亮，白天有白天的喧闹，晚上有晚上的枪声。就是在那里，姐姐把红美铃带回来了。\n\n不是从街中央捡的，也不是在什么热闹的地方遇见的。那时候的美铃已经中了很多枪，替一整条街的商人挡完军阀后，自己却被逼到桥底下等死。她满身是血，眼神还是很凶，像就算快没命了，也不肯先低头。\n\n我那时候躲在姐姐后面看，拉著她的袖子小声说：\n「她看起来不像快死掉的人。」\n\n姐姐低头看了她很久，嘴角很轻地翘了一下。\n\n「因为她还有用。」她说。\n\n后来我才知道，美铃以前好像是什么神龙、信仰啊、妖怪啊那一类很麻烦的东西。可她自己根本不在乎。她只认自己叫红美铃，然后答应替姐姐工作。\n\n于是我们身边又多了一个人——或者说，多了一扇门。\n\n那时候我站在码头边，海风吹得我的头发乱七八糟，船的汽笛长得像在替谁告别。\n\n我忽然觉得很奇怪。\n\n从被烧掉的城堡到这里，从欧洲的废墟到东方的港口，我们一路失去、一路捡、一路坏、一路补，最后居然真的快要走到那个叫幻想乡的地方了。\n\n我回头看姐姐，看帕秋莉，看新来的美铃，然后偷偷对自己说：\n「这次，说不定真的能有家。」"
scarlet.63.a:0 "从上海出发，去把幻想乡变成我们的地方。"

 scarlet.64.t:0 "上错船的海"
scarlet.64.d:0 "我们本来是要去日本的。\n\n真的喔，姐姐一开始讲得很笃定，帕秋莉也把航线、港口、补给和躲人的方法全写在纸上。结果上船的第二天，事情就开始不对了。\n\n先是船上的口音不对，再来是海风吹过来的方向也不对。姐姐站在甲板上看了很久，最后把地图一折，语气冷得像刚吞了一块冰。\n「我们上错船了。」\n\n我先愣了一下，然后笑到蹲下去。\n\n美玲那时候刚跟著我们不久，还没完全习惯姐姐说话的方式。她看看海，又看看姐姐，最后小心地问：「所以……我们现在是去哪？」\n\n姐姐回答得很干脆。\n「不知道。」\n\n哇，那可太好玩了。\n\n既然回不了头，我们就只好跟著船一起漂。海上的日子长得像被拉开的橡皮，白天看水，晚上看月亮，有时候风大得要把整艘船翻过来，有时候平静得像连时间都睡著了。\n\n我在船上玩得很开心。帕秋莉本来还想看书，结果书页老是被风吹乱，后来只好拿笔在纸上记些我看不懂的东西。美玲陪我趴在栏杆边看海，教我分海鸟、浪头和远处船影。我问她海里会不会有比我更怪的东西，她说一定有，而且说不定也在看我们。\n\n晚上最有趣。我缠著帕秋莉讲魔法，缠著美玲讲上海，缠著姐姐讲我们到底什么时候才会走回正路。姐姐一开始还不太理我，后来被我问烦了，干脆说：\n「芙兰，船都开成这样了，妳再问也不会多长出一个日本。」\n\n可她自己其实也没生气。\n\n我知道的。因为那段时间里，她也难得没有一直皱著眉。好像只要还没靠岸，我们就还不是流亡者，不是统治者，不是怪物，只是一群暂时被海收留的人。\n\n上错船当然不是好事。\n\n可那段错掉的航线，却是我们很久以来少数能笑著过的日子。"
scarlet.64.a:0 "既然错了，那就先漂吧。"

scarlet.65.t:0 "失业的人海"
scarlet.65.d:0 "等我们终于靠岸的时候，看见的不是日本。\n\n是美国。\n\n码头很大，城市也很大，可一走上去，我就觉得不对。街上挤满了人，却安静得吓人。男人穿著旧西装，女人抱著孩子，排成很长很长的队，像在等什么，又像根本不知道自己还能等到什么。\n\n他们手里拿著纸板，有的写著「要工作」，有的写著「求一口饭」，更多的人什么都没写，只是站著，眼睛空空的，像魂先被饿走了一半。\n\n我扯了扯姐姐的袖子。\n「这就是那个……饥荒吗？」\n\n姐姐看著街边那些缩著肩膀的人，没有立刻答话。倒是帕秋莉先咳了一声，低低地说：「工厂停了，银行倒了，工作也一起没了。文明有时候不用打仗，也能把人饿成这样。」\n\n美玲站在我旁边，眉头皱得很深。她大概想起了上海，也想起了那些一旦没有饭吃，就什么都会开始烂掉的日子。\n\n我不喜欢这种地方。\n\n不是因为丑，是因为太安静了。大家都还活著，可那种活著看起来很薄，像一碰就会整片倒下去。\n\n街角有个男人靠著墙坐著，帽子盖住眼睛，脚边放著一块写了「我曾有工作」的纸板。我不知道为什么要写「曾」，可看见那个字，我心里就怪怪的。\n\n姐姐倒是看得很平静。她只看了一会儿，就轻轻说了一句：\n「人类总以为世界会一直往前。」\n「可一旦齿轮停了，他们就只剩排队。」\n\n我问她：「那我们呢？」\n\n她低头看我，嘴角动了一下。\n「我们至少知道，不能把命交给齿轮。」\n\n嗯，好吧。还是很难懂。\n\n不过我记住了那座城市的颜色。\n\n灰灰的、旧旧的、又冷又饿，连高楼都像在忍著咳嗽。\n\n美国很大，可那时候的大，并没有让里面的人比较有希望。"
scarlet.65.a:0 "原来最亮的地方，也会饿成这样。"

scarlet.66.t:0 "码头边的孩子"
scarlet.66.d:0 "我们本来只打算在美国停一下，补点东西，再找对的船去日本。\n\n可姐姐总是这样。她说只是走一圈，最后却又从街角捡回来一个人。\n\n那天很冷，风里有煤烟和海水的味道。我先看见的是一个小女孩，缩在码头后面的墙边，外套不合身，手里紧抓著一把小刀。她没哭，也没叫，只是盯著每一个路过的人，像随时准备被抢、被踢、或者被彻底忘掉。\n\n哇，这画面我很熟。\n\n跟我们第一次遇见帕秋莉的时候好像，只是这次不是快饿死的纸片，是一把咬著牙不肯断掉的小刀。\n\n姐姐停下来了。\n\n我在旁边小声说：「妳又要捡了吗？」\n\n姐姐没理我，只蹲下去问那女孩。\n「妳在等谁？」\n\n那孩子的嘴唇动了一下，最后只吐出一句：「没有人会来。」\n\n她说得很平，平到像在讲天气。这种话最麻烦，因为说得越平，就表示她已经信了很久。\n\n姐姐看著她，看了好一会儿，忽然笑了一下。\n「命运有时候真喜欢把好材料往垃圾堆里丢。」她说。\n\n我又听不太懂了。\n\n美玲站在后面，眼神有点复杂；帕秋莉则抱著手，看那孩子的站姿、呼吸和握刀的方式，像已经在替她估价。\n\n姐姐朝她伸出手。\n「跟我走。」\n\n那孩子抬头看她，眼神一下子尖起来。\n「妳是谁？」\n\n姐姐回答得很轻。\n「能让妳不用再待在这里的人。」\n\n她又补了一句。\n「妳可以继续用那把刀活下去，活成某天没人记得的样子；也可以跟我走，去一个会记得妳的地方。」\n\n那孩子没有立刻握住她。她先看了姐姐，再看我们，最后看向停在港口那艘真正要去日本的船。\n\n风把她的头发吹得乱乱的，她终于慢慢站起来，把刀收回去，手放进姐姐掌心。\n\n于是我们又多了一个人。\n\n等船真正开向日本的时候，我趴在栏杆上往后看，看那座灰色的城市慢慢退远。姐姐站在我旁边，帕秋莉在看新捡来的孩子，美玲则靠著船舷吹风。\n\n我忽然觉得很好笑。\n\n我们明明只是想去幻想乡，结果一路上却像在把整个世界那些不该被丢掉的东西，一件一件捡起来带走。"
scarlet.66.a:0 "这次，终于是往日本的正确航线了。"


 scarlet.67.t: "笑著弄坏一切的妹妹"
 scarlet.67.d: "芙兰朵露真正可怕的地方，不是在她大喊大叫的时候。\n\n是她笑著的时候。\n\n流亡路上最糟的几次，几乎都没有前兆。没有长篇疯话，也没有夸张预告，只有一点很小的变化——她忽然安静下来，眼睛亮得过头，手指在空气里轻轻一捏，像在玩什么只有她看得见的东西。\n\n然后，事情就坏了。\n\n有一次是在破旅馆里。外面还在下雨，姐姐刚从楼下带回吃的，我坐在窗边晃腿，数著桌上的杯子。结果隔壁房间有人吵架，摔了一个盘子。就那么一声。\n\n我抬起头，觉得那声音好刺。\n\n下一秒，墙裂了。\n\n不是慢慢裂，是整片墙像被谁从里面掐住，直接往内凹下去。桌子翻了，椅子碎了，楼下的马也开始嘶鸣。我那时候还在笑，因为我只是想让那个声音停下来，没想到整间屋子都跟著安静了。\n\n姐姐冲过来时，脸色比外面的雷雨还难看。她一把抓住我的手腕，抓得很紧，像怕我再碰一下，连整条街都会不见。\n「芙兰。」她说。\n\n只有两个字。\n\n没有发火，也没有安慰。\n\n可我知道她在怕。她嘴角没动，眼睛却一直盯著我的手，像那不是妹妹的手，而是什么刚从地狱里爬出来、还没想好要捏碎哪个方向的东西。\n\n还有一次是在一座荒废掉的小城堡里。帕秋莉在角落看书，姐姐站在窗边看地图。我本来只是想把停在窗框上的鸟抓下来给姐姐看。真的喔，只是想抓一下。\n\n结果那只鸟在我手还没碰到之前，就先变成了一团红雾。\n\n啪。\n\n很小声。\n\n羽毛、血、骨头，一起不见了。\n\n我愣住了，帕秋莉也抬头了，姐姐则整个人都僵了一瞬。她没有靠近我，反而先把帕秋莉往后挡了一下。那动作很快，快得她自己都来不及装成若无其事。\n\n我那时候还歪著头问她。\n「姐姐，我是不是又太用力了？」\n\n她沉默两秒，才说：\n「……妳先别碰东西。」\n\n你看，她连『没事』都没说。\n\n因为连姐姐都知道，我要是情绪一歪，不是摔杯子、打架、乱发脾气那种麻烦。\n\n我是会把『东西本身』弄坏。\n把房间弄坏，把人弄坏，把整段活著的声音一起弄坏。\n\n所以后来只要我安静得太久，或者笑得太开心，姐姐就会开始紧张。她会把手套拉平，把杯子拿远一点，把房间里能碎的东西都悄悄移开。她装得很自然，像只是顺手整理，可我知道她在做什么。\n\n她在防我。\n\n哇，说起来还真有点伤心。\n\n可是也没办法嘛。\n\n因为我最可爱的时候，可能下一秒就会变成最糟的怪物。"
 scarlet.67.a: "姐姐怕我，不是没有理由。"


 scarlet.68.t: "门后的妹妹"
 scarlet.68.d: "后来我们到了幻想乡。\n\n照理说，那里应该是家才对。\n\n有结界，有妖怪，有能让怪物活下去的地方。姐姐为了找到这里，走了那么久，捡了那么多人，坏了那么多次，最后终于把我们塞进一个不用天天逃跑的世界。\n\n可很好笑的是——不逃了之后，我反而更容易坏掉。\n\n可能是因为以前一直在跑，痛也只能跟著跑。现在停下来了，那些路上的东西就一个个自己追上来。流亡时烧起来的房子、枪声、血味、那些被我弄坏的人，还有姐姐站在远处不敢靠近我的样子，全都慢慢跑回脑子里，半夜比谁都准时。\n\n一开始只是睡不好。\n\n后来是突然听不得笑声，突然讨厌玻璃反光，突然很想把整间房里所有会响的东西都捏烂。有几次我在馆里走著走著，就会莫名其妙停住，盯著某一盏灯、某一块瓷砖、某个刚好经过的女仆，心里一直想：如果我现在碰一下，会碎成什么样子？\n\n而且越来越容易来。\n\n有一次是在花园里。月亮很大，喷泉的水声一直响，我本来心情还不错，正想去找姐姐。结果远处有人搬东西，铁器撞了一声。就一声而已。\n\n我整个人一下子就不对了。\n\n那种感觉像有人把很多很多火塞进我胸口，却又不让它烧出去。我站在原地，连呼吸都开始痛。玫瑰先裂开，喷泉边缘开始掉石粉，接著是整片花园的地面微微往下沉。女仆们当场吓得不敢动，有一个甚至连盘子都不敢放下。\n\n姐姐来得很快。\n\n她站在我前面，没有碰我，只是一字一句地说：\n「芙兰，看著我。」\n\n我有看喔。\n\n可我那时候眼里的姐姐，已经不是姐姐了。我看见的是火、是墙、是以前那些追著我们跑的人。我差点就伸手了。真的只差一点点。\n\n后来是帕秋莉用术式硬压，美铃把外围的人赶走，咲夜把整条走廊和花园封起来，事情才没有大到整座馆一起坏掉。\n\n那天晚上，姐姐终于下决定了。\n\n地下室的门被加厚，锁被换掉，帕秋莉开始画新的封印。她没有说『这样对妳比较好』那种好听话。她只是站在门口，声音很稳地告诉我：\n「妳要住在这里。」\n\n我问她：「是怕外面伤到我吗？」\n\n姐姐停了一下。\n\n她没有骗我。\n「不是。」她说。\n\n然后她走近一步，把手放在门框上，红眼睛盯著我，像盯著自己最心爱、也最不敢松手的东西。\n「是怕妳伤到外面。」\n\n哇。\n\n真过分。\n\n可也真诚实。\n\n所以我被关起来了。不是因为幻想乡不够好，也不是因为姐姐不爱我。恰恰相反，是因为她太清楚了——最可爱的妹妹，随时都可能变成恶魔；最像家的地方，也可能在我情绪歪掉的那一秒，变成下一片废墟。\n\n门锁上之后，我坐在里面听那个声音，忽然觉得很好笑。\n\n我们跑了那么久，最后终于找到一个地方停下来。\n\n结果真正停下来的人，变成了我。"
 scarlet.68.a: "姐姐把门锁上时，我就知道她是真的怕。"

  
 scarlet.69.t: "所有东西都开始著火"
 scarlet.69.d: "一开始，不是很明显。\n\n只是烛火跳得比平常快一点，墙角的影子晃得比平常凶一点，空气里那股灰尘和石头的味道，也忽然变得有些热。\n\n芙兰朵露坐在地上，抱著膝盖，眼睛却一眨不眨地看著前面。\n\n桌子还是桌子。\n椅子还是椅子。\n玩偶也还是玩偶。\n\n可她看著看著，那些东西的边缘开始变了。\n\n木头的纹路不再是纹路，而像是一条条正在发亮的裂口；墙上的影子不再只是黑，像被火烤得一缩一缩；连玩偶歪掉的那颗眼珠，都像藏著一点很小很小的红。\n「……不对。」她小声说。\n\n她把手背贴到额头上，像在量自己是不是又烧起来了。\n「这里明明很冷。」\n\n可她眼里的世界一点都不冷。\n\n烛火开始往外爬。\n不是烧在烛芯上，是烧在桌沿、地板、墙角、玩偶的裙边，烧在每一个本来不该有火的地方。它们没有真的燃起来，可在芙兰眼里，所有东西都像裹著一层透明又跳动的焰。\n\n她慢慢站起来，步子很轻，像怕自己一走快，整间房就会一起爆开。\n「你们也看见了吗？」她问那些玩偶。\n\n当然没有回答。\n\n她却很认真地点点头，像替它们答了。\n「对吧。」\n「我就知道不是我在乱想。」\n\n她伸手去碰桌角，指尖还没碰到，就猛地缩回来。\n\n因为她看见那张桌子在烧。\n不是真的烧成灰，是那种……你一碰，它就会立刻裂开、散掉、化成一堆发光的碎片。\n\n她的呼吸慢慢急起来。\n「不行。」她说。\n「不可以碰。」\n\n可不碰也没有比较好。\n\n因为火越来越多了。\n\n床沿在烧，门框在烧，天花板的石缝里也像塞满了红光。就连她自己的手，在她眼里都像被某种看不见的高热包著，指节一收，就会把眼前的东西全部点著。\n\n她转过头看镜子。\n\n镜子里的自己，脸很白，眼睛很红，背后的影子却像被火光照著，一抽一抽地乱动。那不是一个普通的小女孩影子。比较像某种被烧过头、只差最后一下就要从皮肤底下爬出来的东西。\n\n芙兰朵露盯著镜子里的自己，嘴唇动了动。\n「又来了。」\n\n她说得很轻，像这句话已经讲过很多遍。\n「世界又开始烧了。」\n\n她退后一步，脚跟撞到椅子，发出一声很轻的响。\n\n可那一声落进她耳里，却像木梁断掉的脆声，像窗户炸开的尖响，像整栋房子在火里发出那种撑不住的呻吟。\n\n她一下子摀住耳朵。\n「不要。」\n\n可是没有用。\n\n火没有真的来。\n可在她眼里，整个地下室已经在烧了。"
 scarlet.69.a: "她看见的不是房间，是火。"

 scarlet.70.t: "城堡倒下来的声音"
 scarlet.70.d: "接著来的，是声音。\n\n先是一点很低很低的嗡鸣，像有谁在墙后面推动一台旧机器。那声音不大，却一直在，贴著骨头震，震得牙根都发酸。\n\n芙兰朵露把手按在耳边，想把它压下去。\n\n没有用。\n\n因为那不是从外面传进来的。\n\n那声音是从她脑子里醒过来的。\n\n嗡——\n\n又一声。\n\n这一次更像了。像炮口点火前那一瞬的颤，像火药塞进铁管后，整个世界会先屏住呼吸的那一下。\n\n她的眼睛一下睁大。\n「不要……」\n\n她往后退，背碰到墙，整个人却像已经不在地下室了。脚下不再是冷石地，而是被血、灰和玻璃碎片弄得又湿又滑的长廊；眼前不再是玩偶和桌子，而是著火的窗、塌掉的柱子、还有一排排冲进来的人。\n\n轰——！\n\n这一次，声音真的在她耳边炸开了。\n\n芙兰朵露猛地蹲下去，手抱住头，肩膀抖得厉害。她明明知道那只是地下室里的一盏灯、一张桌、一面墙，可她眼里看到的，全是那座和姐姐一起住过的城堡。\n\n那座现在早就不在了的城堡。\n\n她看见火炮轰进来。\n看见窗格碎开。\n看见长廊在烧。\n看见侍从倒下。\n看见自己被姐姐拽著手往前跑，跑得鞋子都掉了一只。\n\n她甚至还记得那股味道。\n\n铁、火药、烧焦的布、还有血。\n「姐姐！」她脱口而出。\n\n声音在地下室里弹了一下，又被她自己吓到。可记忆没有停。\n\n她看见芙兰自己的翅膀被打烂，看见姐姐肩上开出血，看见那些拿著火器的人从烟里冲出来，嘴里喊著她听不懂却知道一定很讨厌的话。\n\n轰鸣声越来越大。\n\n大到她分不清是外面的锁链在响，还是城堡真的又塌了一次。\n\n她抬起头，眼前的门在她眼里不再是地下室的厚门，而是那扇当年怎么都逃不出去的门；墙上的抓痕也不再只是抓痕，而像被炮弹震裂的石缝；连烛光落下来时，都像火从天花板一路往下舔。\n\n芙兰朵露喘得很急，眼泪都快逼出来了，嘴里却还在反复念同一句。\n「我不是现在……」\n「我不是在这里……」\n\n她说不清自己是想骗谁。\n\n因为她身体还在地下室，心却已经整个掉回那一天了。\n\n那一天，姐姐抓著她跑。\n那一天，整座城堡在她们身后裂开。\n那一天，世界不是慢慢坏掉的，而是一下子全坏了。\n\n她忽然伸出手，对著空气狠狠一抓。\n「走开！」\n\n她是对记忆里那些士兵喊。\n\n可那一瞬间，地下室桌上的杯子一起炸裂，玩偶的头掉了两颗，连门锁都发出一声重得吓人的闷响。\n\n芙兰朵露看著那一地碎片，眼神一下空了。\n\n她知道自己又把现在和以前弄混了。\n\n也知道一旦那座烧掉的城堡在她脑子里回来，她眼前所有正常的东西，都会一起变成能被毁掉的目标。\n\n她靠著墙慢慢滑下去，把手藏回袖子里，像把一场灾难重新塞回身体里。\n「……姐姐。」\n\n她小声得像在做梦。\n「我还在那一天里。」"
 scarlet.70.a: "对她来说，城堡从来没有真正烧完。"


 scarlet.71.t: "我看著她一天天坏掉"
 scarlet.71.d: "我一开始以为，把芙兰留在地下室，是保护。\n\n外面的声音太多，光太亮，活人的气味、妖怪的目光、走廊上的脚步，都可能把她推向失控。只要门关上，只要房间够安静，她就不会再被那些东西扯碎。\n\n可我错了。\n\n我每次去看她，都能看见新的痕迹。不是墙裂了，不是玩偶坏了——那些我早就习惯了。真正让我厌恶的，是她眼里的东西在一点点变少。\n\n她还会笑，却越来越像在演给我看。她会把玩偶排好，会跟它们说话，会在我进门时抬头喊我姐姐。可等我坐下，她的目光又会慢慢飘走，像人还在这里，心却已经缩回某个我碰不到的地方。\n\n有时她很安静，安静到我宁可她发脾气。她抱著膝盖坐在床边，听我说话，点头，嗯一声，然后在我以为她稳下来的时候，忽然问我一句：\n「姐姐，我今天有比较像正常人吗？」\n\n那种问题，比失控更糟。\n\n我宁可她砸碎一整面墙，也不想听她这样问。\n\n她是芙兰朵露，是我妹妹，不该活得像一件被封存的危险品。可地下室把她变成了这样——越来越轻，越来越空，越来越像只剩一层壳的孩子。再这样关下去，她也许不会立刻坏掉，却会慢慢烂掉。\n\n我可以忍受一个危险的妹妹。\n我不能忍受一个被我亲手关成空壳的妹妹。\n\n所以我终于承认：再把她留在门后，她只会恶化。"
 scarlet.71.a: "我不能再假装这是保护。"

 scarlet.72.t: "我必须把她带出来"
 scarlet.72.d: "我很清楚，把芙兰带出地下室，是冒险。\n\n不是小风险，是那种一步踏错，整座红魔馆都要替我付代价的冒险。咲夜知道，美铃知道，帕秋莉也知道。她们不说，不代表她们不怕。\n\n可我比谁都清楚另一件事——若我什么都不做，芙兰只会继续往下沉。\n\n她不是需要更多锁链。\n她需要光，需要声音，需要有人真的站在她面前，而不是隔著门把她当成禁区。她必须重新学会看著别人说话，学会在同一个屋簷下呼吸，学会把手伸出去而不是只会捏碎。\n\n所以我去找帕秋莉。\n\n我告诉她，我要一个限制，不是为了把芙兰变乖，而是为了让她有机会走出来。帕秋莉说那会很痛，说那不会让她正常。我说我不在乎正常，我只要她别再一天天烂在门后。\n\n我也知道，这么做会让所有人都紧张。女仆会怕，美铃会守得更紧，咲夜会把每一步都排进应变表里。可那又怎样？她们怕的是失控，我怕的是失去。\n\n芙兰是我最重要的家人。\n不是王座，不是权力，不是那些挂在嘴上的威严。若我连她都只能靠隔离来维持，那我赢再多东西，也只是个把妹妹关进地底的空壳女王。\n\n所以这次，我要亲手把门打开。\n\n就算她会颤抖，就算别人会后退，就算整座馆都得为她重新学习一次呼吸，我也得让她出来。\n\n因为只有走出来，她才还有机会变回我的妹妹。"
 scarlet.72.a: "把门打开，让她重新学会活著。"



scarlet.73.t:0 "还没有红魔馆的时候"
scarlet.73.d:0 "那时候我们已经到了日本，可还没有红魔馆。\n\n没有大门，没有花园，没有长长的走廊，也没有现在这些会替姐姐低头的人。只有几间暂时借来的屋子、几个还不算忠诚的手下，还有姐姐那张明明很累、却还是不肯输的脸。\n\n我记得她那段时间很忙。白天不见人，晚上才回来，披风上总带著雨味、泥味，还有一点很新的血味。她会坐在桌边摊开地图，手指沿著日本各处慢慢滑，像在摸一头还没被驯服的野兽。\n\n魅魔以前说过，幻想乡不是一扇会自己打开的门，要找对入口，也要有足够的手去推。姐姐把这句话记得很牢。\n\n所以她开始积蓄实力。\n\n不是靠祈祷，不是靠招手叫人来，是靠最直接的那一种方法。她在各地抓人，挑那些失踪了也不会立刻有人追查的，挑那些已经被时代压到快没声音的人。姐姐把血喂给他们，再把意志拿走。最后站起来的，就不是人了。\n\n我叫牠们血疫怪物。因为牠们闻起来像坏掉的血，走起路来像梦游，眼睛空空的，嘴里只剩饥饿。很听话，也很丑。\n\n姐姐不在乎丑不丑。\n她只在乎好不好用。\n\n她把那些东西藏起来、养起来，让牠们一批一批地变多。她说想夺下幻想乡，光靠我们这些从旧世界逃过来的怪物还不够，还要有能先去撞门、先去流血、先去替她把路踩出来的东西。\n\n我那时候坐在窗边看她，觉得姐姐真的很厉害。\n\n她明明什么都还没有，却已经在替我们的王国准备牙齿了。"
scarlet.73.a:0 "姐姐说，门不开，就把门撞开。"

scarlet.74.t:0 "魅魔留下来的入口"
scarlet.74.d:0 "后来姐姐真的找到魅魔说的那些入口线索了。\n\n不是一扇画在山上的门，也不是谁喊一句咒语就会亮起来的洞。比较像……裂缝。像世界有几个地方缝得不够紧，只要你够会找、够敢挖，就能摸到幻想乡的边。\n\n姐姐很喜欢那种东西。\n\n她带著地图、笔记、还有帕秋莉那时候整理出来的一堆麻烦符号，在日本各处来回跑。她试过山里的雾、废神社后面的阴地、旧战场上空气最薄的时刻，也试过那些人类自己都不太敢靠近的怪地方。\n\n每试一次，她就往前多知道一点。\n\n而血疫怪物也越养越多。\n\n牠们被锁在暗处，平常只会低著头晃，像一堆坏掉的影子。可只要姐姐一声令下，牠们就会往前走，撞墙、咬人、流血，直到前面那条路真的被撞出裂口。\n\n我有一次问姐姐：「一定要这样吗？」\n\n姐姐没有生气，只是低头看我。\n\n「要。」她说。\n「幻想乡不是给我们乖乖敲门进去的地方。」\n\n她那时候的眼神很亮，亮得像她又回到很久以前、站在烧起来的城堡前那样。不是高兴，是决心硬到已经不能回头。\n\n她要夺下幻想乡，不只是因为那里能让怪物活。\n她还想把流亡、饥饿、被追杀、没地方去的那些日子，全部一次讨回来。\n\n所以在红魔馆还没有真正立起来之前，姐姐就已经开始入侵了。\n\n先找门。\n再养怪物。\n再把整个世界最不肯让路的那条缝，硬生生撬开。\n\n那时候我就知道，她不是想找家。\n\n她是想替我们，把家抢过来。"
scarlet.74.a:0 "幻想乡不肯收留我们，就让它学会收留。"



 scarlet.75.t:0 "裂隙前的迎战"
scarlet.75.d:0 "我们找到裂隙时，夜还没完全落下。\n\n那不是一扇门，更像世界表皮上被硬生生划开的一道伤口。雾从里面往外渗，带着不属于外面世界的冷气与草木味。蕾米莉亚站在最前，披风被风扯得猎猎作响，身后是她一路带来的血疫怪物、帕秋莉、红美铃，还有年纪尚小、却已经学会把眼神压得很静的咲夜与芙兰朵露。\n\n她本以为自己会先看见结界，或者先看见一片陌生的土地。\n\n可站在裂隙另一边等她的，不是景色。\n\n是八云紫。\n\n她像早就知道这一天会来，伞尖轻轻点地，笑意淡得像月色。她身旁站着八云蓝与橙，蓝的眼神冷而稳，橙则绷紧了身体，尾巴都炸开了毛。再往后，是摩多罗隐岐奈与她的舞者，三位鬼王伊吹萃香、星熊勇仪与茨木华扇都到了，连那位早已被传成旧时代影子的前代博丽巫女，也站在最靠前的位置，手里捏着御札，脚下的结界光纹已经亮起。\n\n蕾米莉亚看着对面的阵容，非但没有后退，反而笑了。\n\n「真隆重。」她说。\n\n八云紫把伞微微一抬，语气温柔得近乎刻薄。\n\n「对待带着怪物、疫血和野心闯进来的吸血鬼，礼数总要周到一些。」\n\n前代博丽巫女往前半步，御札一振，空气里立刻绷出锋利的灵力。\n\n「退回去。」她说。\n\n蕾米莉亚却把手抬起，指尖轻轻一合。\n\n「晚了。」\n\n下一瞬，裂隙两侧同时震动。血疫怪物低吼着往前扑，博丽的结界与八云的缝隙同时亮起，隐岐奈的后户在战场侧面无声张开，三鬼王迈步向前，地面像被沉重的鼓点砸响。\n\n那一夜，由吸血鬼的入侵所引发的异变，就此开始。"
scarlet.75.a:0 "吸血鬼异变，爆发。"

scarlet.76.t:0 "鬼王之前的红美玲"
scarlet.76.d:0 "第一次交锋先撞上的，不是蕾米莉亚和八云紫。\n\n是红美铃和三位鬼王。\n\n萃香先出拳，酒气裹着怪力，像把整座山压了过来；勇仪紧跟着踏进，拳风沉得几乎能把地面整块掀开；华扇没有硬拼，她的链与术走得更细，专挑空隙、关节与呼吸节奏下手。这样的阵容，别说门番，换成任何站在前线的人，都该在第一轮就被碾开。\n\n可美铃从一开始就没想赢。\n\n她很清楚，自己不是鬼王的对手。\n她能做的，只有守。\n\n她把气沉进丹田，再一寸寸推到四肢。不是把力量炸出去，而是把自己变成一层会呼吸的壁。萃香的拳砸来时，她不硬碰，只在最后一瞬偏肩卸力，让那股怪力顺着脚下导进地面；勇仪的重击压过来，她借气稳住下盘，双臂交错，把冲势引偏；华扇的链子从侧面缠进来时，她立刻收肘转身，以气护住筋骨，硬吃那一下，也不肯让缺口被撕开。\n\n她守得很难看。\n\n袖口裂了，脚下的石地也一寸寸往后碎。气在体内翻涌得发疼，像每接一拳，骨头里都要跟着响一声。她没有反攻，因为她知道自己只要贪那一下，下一瞬就会被三位鬼王同时打穿。\n\n所以她一步都不多走，只守在该守的位置上。\n\n萃香看着她，咧嘴一笑，眼里满是战意。\n\n「喂，你这家伙，不会还想拦住我们三个吧？」\n\n美铃吐出一口带血的气，帽沿都被震歪了，嘴上却还留着笑。\n「拦不久。」她说。\n「可久一点，就够了。」\n\n她这句话，不是说给鬼王听的。\n\n是说给身后的帕秋莉。\n\n另一边，帕秋莉已经开始铺术。七曜的光一层压一层，火、土、金、水在半空交错，魔法阵一环套一环，像把整片夜空慢慢写成她的书页。可这种规模的术式不能急，一急就会乱，一乱就会死。\n\n所以美铃必须站着。\n\n必须替她把时间抢出来。\n\n勇仪看穿了这一点，拳势更重，几乎是明着要把这堵墙直接砸烂；华扇的链与术也开始专门逼她换气；萃香则像一团带笑的灾厄，不断从正面给她压力。三位鬼王一旦认真起来，连空气都像被打得发颤。\n\n可美铃还是没退。\n\n她把气一次次提起来，又一次次压回去，让呼吸稳住，让脚下不散，让自己始终挡在那条线上。她不是在和鬼王比强，而是在用自己的身体，硬把三头猛兽拴在这里。\n\n终于，帕秋莉那边的术式亮到极限。\n\n高热的爆裂魔弹先压向前代博丽巫女，逼得她横移半步；紧接着冰壁升起，挡住蓝的式神突进；再下一瞬，七曜重叠的光束直接轰碎了隐岐奈放出的后户。\n\n美铃听见那一声术式完成的轰鸣，嘴角才终于松了一点。\n\n她的任务成了。\n\n咲夜站在更后面，年纪还小，手却已经按在刀上，一动不动地盯着整片战场。芙兰朵露则坐在石头上晃腿，眼睛亮得惊人，像看的是烟火，不是厮杀。\n\n而战场中央，蕾米莉亚终于抬起头，看向了八云紫。"
scarlet.76.a:0 "门番守住了时间，接下来轮到王与贤者。"

scarlet.77.t:0 "贤者与吸血鬼"
scarlet.77.d:0 "帕秋莉的术式完成时，整片战场像被人硬生生按亮了一层。\n\n七曜的光在半空重叠，火、土、金、水一层压一层，像把夜空写成一页会燃烧的书。她先用高热的爆裂魔弹逼得前代博丽巫女侧身，再以冰壁截断蓝的式神突进，最后一束压缩到极致的魔力正面轰碎了隐岐奈放出的后户投影。\n\n就是这一瞬的空档，蕾米莉亚动了。\n\n她不是那种会把机会让出去的人。红雾顺着她的披风一卷而起，整个人像一道被夜色磨过的枪锋，直切八云紫面前。枪尖挑开空气，压过去的不只是杀意，还有她一路流亡、一路抢来的全部不甘。\n\n八云紫却只是后退半步。\n\n不是慌，是让。\n\n她脚边的缝隙一开一合，把残余的魔法余波吞掉，又把蕾米莉亚最锋利的冲势轻轻拨偏。每当枪尖要真正碰到她时，空间就会自己弯一下；每当红雾要把她罩进去时，距离又会被拉开一点。\n\n「妳太急了。」八云紫说。\n\n蕾米莉亚笑得很冷。\n\n「而妳太会躲了。」\n\n她没有退。\n\n因为她知道，这不是能拖的战。美铃那边还在硬撑。她能感觉到那股气场正在一点点往下沉——门番不是在赢，她是在用自己的身体把三鬼王钉在原地。帕秋莉也不可能无止尽地连发那种术式，再多一轮，整片战场都会先被魔力压裂。\n\n所以她只能向前。\n\n前代博丽巫女趁隙压上，御札像雨一样砸进蕾米莉亚周围；蓝也立刻补位，符线与式神封住她的侧后；橙则从更低处扑上来，爪风带着兽性的狠。蕾米莉亚一瞬间像被整个幻想乡最锋利的那一批人一起按住。\n\n可她还是把枪送了出去。\n\n这一击终于逼得八云紫抬了伞。\n\n「很好。」八云紫轻声说。\n\n下一刻，整片空间像翻了一面。\n\n蕾米莉亚脚下的地面骤然成了侧壁，红雾被扭成细长的带，连她的重心与枪势都被生生错开。她落地时虽未倒下，却已经慢了半拍。前代巫女的第二道封印正好拍上她胸前，蓝与橙的合击也在同一瞬补到。\n\n等蕾米莉亚重新站稳时，披风已经裂开，肩头与胸前都见了血。\n\n她还站着。\n\n可她已经输了。\n\n不是被打到爬不起来。\n\n而是被八云紫那种从头到尾都没乱过一步的打法，硬生生压输。"
scarlet.77.a:0 "她输了，但没有低头。"

scarlet.78.t:0 "不该醒来的妹妹"
scarlet.78.d:0 "八云紫看着被逼退的蕾米莉亚，终于往前走了一步。\n\n战场上的声响没有停，可真正决定胜负的地方，已经安静下来了。美铃那边还在守，可她的气已经明显乱了，肩膀与手臂全是硬吃下来的伤；帕秋莉站在后方，指尖还残留着术式余热，咳得比刚才更重，显然也不可能立刻再补出第二轮同等级的魔法。\n\n局面已经很清楚了。\n\n「到这里为止了。」八云紫说。\n\n前代博丽巫女把御札一抖，意思再明显不过——若贤者点头，这个带着怪物与疫血闯进幻想乡的吸血鬼，就该在这里结束。\n\n蕾米莉亚半跪在地，肩头带血，胸口还压着封印的残光，却仍抬着头，像宁可被处决，也不愿做出求饶的样子。\n\n就在八云紫抬手的那一瞬——\n\n后方忽然传来一声很轻的、像小女孩吸气一样的声音。\n\n芙兰朵露站了起来。\n\n她刚才一直在看，看得很安静，安静得像根本不属于战场。可现在，那份安静裂开了。她望着半跪的姐姐，眼里的光一点点缩成针尖，背后的气息却在往外膨胀。\n\n不是妖力。\n\n是某种连名字都不该有的破坏本身。\n\n她抬起手时，连八云紫都停住了。\n\n空气先是安静，然后开始轻轻发出碎裂声。不是地面裂，不是石头裂，而像整片空间都被一只看不见的手抓住，只要再多半分力，就会连战场、结界、鬼王、贤者、巫女，一起被她捏进同一个崩坏里。\n\n萃香的笑没了，勇仪第一次真正皱紧眉，华扇的锁链都慢了一瞬。蓝和橙同时护到八云紫前侧，前代博丽巫女把御札压低，连隐岐奈都把后户收得更紧。\n\n芙兰朵露却只是看着姐姐，轻轻地说：\n\n「不可以。」\n\n她不是在命令谁。\n\n她是在告诉这个世界——不许碰她姐姐。\n\n八云紫终于收了手。\n\n她看着那个年幼、漂亮、却随时可能把一切都弄坏的孩子，眼神第一次真正沉了下去。她知道自己现在若杀蕾米莉亚，接下来要面对的，就不再是这场吸血鬼异变，而是另一个更不稳定、更没有边界的灾厄。\n\n而那种东西，就算是贤者，也不想在结界边上试。"
scarlet.78.a:0 "连贤者都停了手。"

scarlet.79.t:0 "写进命里的誓约"
scarlet.79.d:0 "最后，刀没有落下。\n\n八云紫站在战场中央，望着半跪的蕾米莉亚，又望了一眼仍举着手、像随时会把天地一起捏碎的芙兰朵露，终于笑了。\n\n不是宽容的笑。\n\n是重新算清利害之后，贤者才会有的那种笑。\n\n「妳可以进幻想乡。」她说。\n\n所有人都愣了一下。\n\n就连还在另一侧喘息的美铃都抬起了头，帕秋莉也难得停住咳嗽，像在确认自己是不是听错了。\n\n蕾米莉亚抬头看她，眼神里先是警惕，随后才是一点近乎本能的怀疑。\n\n「条件？」她问。\n\n「当然有。」八云紫的伞尖轻轻一点地面，「第一，妳与妳的人，从今以后必须听我的命令。不是永远替我低头，而是在我判定幻想乡需要的时候，妳不能违逆。」\n\n她停了停，目光落到芙兰朵露身上。\n\n「第二，把她看好。」\n\n这句一出，整片战场比刚才更静。\n\n八云紫的声音依旧很轻，却每个字都像直接钉进骨头里。\n\n「我允许妳们活，也允许妳们留下。」\n「但这孩子不能失控。」\n「若她再像今天这样，把力量朝幻想乡抬起来——我会先杀妳，再杀她。」\n\n蕾米莉亚听完，没有立刻说话。她知道自己输了，也知道眼前这不是施舍，是带着锁链的通行证。\n\n可她更知道，自己已经没有更好的路。\n\n于是她慢慢站起身，披风沾着血，姿态却仍旧保持得很直。她先看了一眼芙兰，又看了一眼那边还在带伤站着的美铃与帕秋莉，最后才重新望向八云紫。\n\n「若我答应呢？」\n\n八云紫笑意不变。\n\n「那妳就能活着把妳的人带进幻想乡。」\n\n风从裂隙之间吹过，吹得旗与雾一起发颤。芙兰朵露还站在那里，眼中的光没有完全散，手却终于慢慢放下了。\n\n蕾米莉亚看着她，最后闭了闭眼，再睁开时，声音已经稳了下来。\n\n「好。」\n\n她说。\n\n「我以斯卡雷特之名起誓。」\n\n八云紫微微侧头，像在等最重要的那一句。\n\n蕾米莉亚的声音更低了，却也更清楚。\n\n「我会遵守妳的命令。」\n「我会看住芙兰。」\n「对妳的誓言，不会被打破——除非妳本人死亡。」\n\n那一瞬间，八云紫脚边的缝隙微微亮了一下，像把誓约本身也收进了幻想乡的规则里。\n\n自此之后，红魔馆的众人得以进入幻想乡。\n\n不是以征服者的身份。\n\n而是以一个被贤者允许、也被贤者束住的外来者身份。\n\n蕾米莉亚输了那一战，却没有输掉未来。\n\n而她与八云紫之间那道写进命里的誓约，也从那一天起，牢牢压在了斯卡雷特家的屋檐之上。"
scarlet.79.a:0 "直到八云紫死亡之前，这誓言都不能被打破。"

scarlet.80.t:0 "像壳一样的妹妹"
scarlet.80.d:0 "封印生效后的第三天，红魔馆安静得过分。\n\n不是没有脚步，也不是没有命令，而是少了一种本该存在的东西——芙兰朵露的声音。\n\n蕾米莉亚站在地下室门口，看着妹妹坐在床边。她背挺得很直，手放在膝上，像一个被摆好的洋娃娃。阳光落到她脸上，她会转头；玩偶倒下，她会伸手扶正；有人叫她名字，她会抬眼回应。\n\n可也仅止于此。\n\n她不再忽然笑出声，不再盯着某个东西看太久，不再闹，也不再怕。她的眼里没有敌意，也没有依恋。红魔馆对她来说，像一幅被仔细描好的背景画——墙是墙，门是门，姐姐是姐姐，可都只是「存在」，不再有重量。\n\n蕾米莉亚走近时，芙兰抬头，很乖地问了一句。\n\n「姐姐，今天需要我做什么吗？」\n\n那语气太平了。\n\n平得不像芙兰。\n\n蕾米莉亚看着她，喉咙像被什么轻轻勒住。她宁可妹妹发脾气，宁可她把玩偶撕成两半，宁可她哭、她闹、她扑上来抱住自己，也不想看见这一副被封得干干净净的安静。\n\n她伸手去碰芙兰的发顶。芙兰没有躲，也没有靠过来，只是安静地让她碰，像在配合一件自己已经学会的事。\n\n「妳想出去吗？」蕾米莉亚问。\n\n芙兰眨了眨眼，像在认真思考。\n\n「如果姐姐觉得可以，我就出去。」\n\n「那妳想不想我？」\n\n芙兰停了一秒，嘴角很轻地弯了一下。\n\n「我应该想。」\n\n那一句像针，扎得极轻，却很深。\n\n蕾米莉亚终于明白，帕秋莉的术式不是把妹妹救回来，而是把灾厄压制，也把她一并压薄了。眼前这具身体还会呼吸，还会说话，还会听命令，可里面那个会笑、会怕、会偷偷撒娇、会在夜里缠着姐姐不放的孩子，像被关进了更深的地方。\n\n从那一刻起，蕾米莉亚就知道——这不是答案。\n\n这只是把问题推迟。"
scarlet.80.a:0 "这不是我想要的妹妹。"

scarlet.81.t:0 "帕秋莉提出的方法"
scarlet.81.d:0 "那天夜里，蕾米莉亚直接去了图书馆。\n\n帕秋莉正坐在长桌后，面前摊着一堆关于封印、血统与妖怪结构的手稿。她像是早就知道蕾米莉亚会来，连头都没抬，只在她走近时淡淡问了一句：\n\n「妳终于发现她不对了？」\n\n蕾米莉亚没有坐下。\n\n「我不是来听废话的。」她说，「我只要方法。我要她摆脱那股破坏力，我要她能正常地活，能高兴，能像个真正的……」\n\n她停住了。\n\n因为她忽然发现，自己竟然不敢把那个词说完。\n\n帕秋莉替她说了。\n\n「像个普通的孩子？」\n\n蕾米莉亚的目光冷下来。\n\n「有方法吗？」\n\n帕秋莉沉默了很久。久到图书馆里的钟都走了两格，她才把笔放下，慢慢抬头。\n\n「有。」\n\n蕾米莉亚的手指立刻收紧。\n\n帕秋莉看着她，声音却比平常更稳，也更冷。\n\n「让她不再是吸血鬼。」\n\n空气像一下子冻住了。\n\n蕾米莉亚没有立刻听懂，或者说，她不想听懂。\n\n「……妳再说一遍。」\n\n「把她从吸血鬼变成人类。」帕秋莉重复得毫不留情，「不是伪装，不是压制，是从根上改。只要她不再拥有那套过于强大的结构，不再拥有吸血鬼那种把世界一把抓碎的资质，她就能摆脱那股超出控制的破坏力。」\n\n她顿了顿，又补了一句：\n\n「换句话说，妳想要一个正常、快乐、能安稳长大的妹妹，就得先把『斯卡雷特家的怪物』从她身上切掉。」\n\n蕾米莉亚盯着她，眼神像刀。\n\n「妳知不知道妳在说什么？」\n\n「我当然知道。」帕秋莉咳了一声，「我也知道这听起来像亵渎。」\n\n她把一页写满公式的纸推到桌前。\n\n「可若妳要的是结果，这是最接近结果的方法。」\n\n「封印只能压，不能治；隔离只能拖，不能救。要让芙兰真正摆脱那份力量，就得让她变成一个不会天生携带灾厄的人。」\n\n图书馆里安静得可怕。\n\n蕾米莉亚站在桌前，第一次觉得自己宁可帕秋莉说根本无解，也不愿听见这个答案。\n\n因为这个方法太有效，也太残忍。\n\n它不是在修补妹妹。\n\n它是在要求她，放弃自己是谁。"
scarlet.81.a:0 "成为人类……？"

scarlet.82.t:0 "吸血鬼，还是妹妹"
scarlet.82.d:0 "蕾米莉亚一个人在长廊里站了很久。\n\n窗外的红雾还在，墙上的灯也还亮着，可她第一次觉得整座红魔馆都离自己很远。帕秋莉的话还卡在耳边，像一把极细的锯子，慢慢割着她最不愿碰的地方。\n\n让芙兰成为人类。\n\n那当然是个办法。\n\n人类会痛，会老，会饿，会怕；可人类不会因为一时情绪歪斜，就把整条走廊和整座花园一起捏碎。人类可以有日常，可以长大，可以在阳光下走路，也可以在不需要封印的情况下，被别人正常地拥抱。\n\n那听起来几乎是她一直想给妹妹的东西。\n\n可问题也在这里。\n\n若芙兰变成人类，那她还是芙兰朵露·斯卡雷特吗？\n\n蕾米莉亚靠着窗，慢慢闭上眼。她想起很久以前的欧洲，想起燃烧的城堡，想起一路流亡时自己是怎样拖着妹妹往前走；想起那些夜晚里，芙兰缩在她怀里，翅膀破破烂烂，身上全是血，眼里却还只认得她一个人。\n\n那是她的妹妹。\n\n是吸血鬼的妹妹，是斯卡雷特家的孩子，是和她流着同样夜色的存在。\n\n她不想把这一切亲手切掉。\n\n可她也知道，自己没有更好的方法。\n\n继续封着，芙兰就会一天天变成空壳；解除封印，她又随时会变回灾厄。帕秋莉给出的答案很可怕，却是第一个真正指向「活路」的答案。\n\n蕾米莉亚睁开眼时，目光已经重新冷了下来。\n\n她没有立刻同意。\n也没有立刻拒绝。\n\n她只是低低地说了一句，像在对自己起誓：\n\n「我不会让她只剩一种选择。」\n\n若要失去吸血鬼之名，才能换来平静的人生，那她就得先把这条路看得再清楚一点；若还有别的方法，她就一定要把它从绝路里挖出来。\n\n因为芙兰首先是她妹妹。\n\n在那之后，才是灾厄、力量、血统，或任何别人替她贴上的名字。\n\n而蕾米莉亚绝不会轻易接受——为了救妹妹，就必须先杀死她身上那半个吸血鬼。"
scarlet.82.a:0 "我还没有选，但我已经没有退路了。"

 scarlet.83.t:0 "女仆长的誓言"
scarlet.83.d:0 "咲夜是在夜里接到命令的。\n\n航线、补给、出发时间、馆内留守名单——每一项都被她整理成册，字迹干净得像刀锋。她比谁都清楚，蕾米莉亚这次不是简单地远行，而是要把红魔馆的意志重新压到更远的地方。\n\n可她没有劝，也没有问值不值得。\n\n因为对十六夜咲夜来说，这件事从来不需要衡量。\n\n她记得自己还没有姓氏的时候，记得美国西岸那条冷得发疼的巷子，记得那种被人丢下之后、连哭都像多余的感觉。是蕾米莉亚把她从那种地方捡起来，给她衣服、名字、规矩，也给了她一个能活下去的位置。\n\n没有蕾米莉亚，就没有十六夜咲夜。\n\n所以当大小姐决定重返欧洲、决定向外扩张、决定去和命运本身抢路的时候，咲夜唯一会做的事，就是把那条路铺平。\n\n她站在书桌前，把最后一页计划翻过去，低声自语，像在对自己下命令。\n\n「只要大小姐还在，我就会跟随。」\n\n她从来不是因为理念才留在红魔馆。\n她是因为蕾米莉亚这个人而存在。\n\n若大小姐要征服世界，她便整理世界的秩序；若大小姐要向命运开战，她便把自己磨成最锋利的刀。她不需要被说服，也不需要被安慰。她只需要知道——蕾米莉亚还活着，还在往前。\n\n那就够了。"
scarlet.83.a:0 "没有蕾米莉亚，就没有十六夜咲夜。"

scarlet.84.t:0 "门前之人的想法"
scarlet.84.d:0 "美铃听完命令的时候，正站在门口看雾。\n\n她没有像咲夜那样立刻去写表，也没有像帕秋莉那样先去想补给和研究。她只是安静了一会儿，把手背到脑后，望着门外很久没说话。\n\n她知道蕾米莉亚为什么非走不可。\n\n她也知道，蕾米莉亚不是那种会因为风险太大就停下来的主人。若是为了芙兰，为了替红魔馆抢出更多选择，她真的会把海另一边也变成自己的战场。\n\n美铃其实不讨厌这一点。因为当年在上海，若不是蕾米莉亚把她从桥底下捞起来，她早就死在那一夜了。她感激这份救命之恩，也愿意为此替红魔馆守门、替蕾米莉亚挡人。\n\n只是她心里始终还有一点没改掉的念头。\n\n若能少死一点人，就好了。\n若能多留几条路，就好了。\n\n她知道自己这想法有时候太天真。世界不是看谁心软就对谁温柔，蕾米莉亚更不是会靠温柔坐上王座的人。可她还是希望，自己能在执行命令的时候，替那些不该死的人多挡一下，多劝一句，多留一点活口。\n\n她最后还是笑了，笑得跟平常差不多。\n\n「好吧。」她轻声说，「大小姐往前走，我就替她把门看住。」\n\n她会听令。\n因为那是救她的人。\n\n可她也会尽量让自己守住的，不只是红魔馆的威严，还有一些不必死去的东西。"
scarlet.84.a:0 "我会听命，但我还是想多留几个人活着。"

 scarlet.85.t:0 "图书馆里的私心"
 scarlet.85.d:0 "帕秋莉很早就猜到，蕾米莉亚终究会走到这一步。\n\n她太了解那个吸血鬼了。越是被命运逼到角落，蕾米莉亚就越不可能缩回去。她会反过来咬住命运，直到把整个局面都拖进自己的夜里。\n\n所以当重返欧洲、扩大研究与工业、为未来的「更多选择」做准备这些词摆到她桌上时，帕秋莉没有意外。她只是把一页页手稿压平，把航线、药剂、术式、设备、人才与可行性，一个个列出来。\n\n她会帮。\n\n不仅因为红魔馆离不开她，也不仅因为这条路最后确实可能替芙兰找到答案。\n\n更因为她欠蕾米莉亚一条命。\n\n那年在爱尔兰饥荒里，若不是蕾米莉亚停在那间破书店门口，她早就死了。不是死在战争里，不是死在什么伟大的命运转折里，而是死在门边，抱着一本书，安静又廉价地饿死。\n\n是蕾米莉亚把她带走，给她药、给她时间，也给了她继续读下去、继续活下去的机会。\n\n所以她当然会尽力。\n\n可在尽力之外，帕秋莉还有一点很不体面的私心。\n\n她希望蕾米莉亚能多看她一眼。\n不是看一个会施法的魔女，不是看一个能管理图书馆和研究的工具，而是看她这个人。她不要求温柔，也不奢望什么夸奖。她只是偶尔会想，若有一天自己不再只是「那个能帮上忙的帕秋莉」，那她们之间还剩下什么？\n\n她把这个念头压得很深，最后只化成一句冷淡的话。\n\n「我会把你要的方案做出来。」\n\n说完之后，她停了一下，才把后半句咽回心里。\n\n——你最好也别总把我当成理所当然。"
 scarlet.85.a:0 "我会帮你，因为我还没把命还清。"

 scarlet.86.t:0 "那本书与病弱的女孩"
 scarlet.86.d:0 "帕秋莉不是一开始就是魔女。\n\n在成为「帕秋莉·诺蕾姬」之前，她也只是个会咳、会饿、会在冬夜里把手指冻得发白的普通人类女孩。身体不好，呼吸短，走几步就得停。这种人若生在安稳年代，顶多被说一句命薄；可她偏偏活在一个连面包都不够分的时代里，于是她很早就明白，靠别人的怜悯活不久。\n\n她能抓住的东西不多。\n\n其中一样，就是书。\n\n不是什么镀金圣典，也不是贵族书房里拿来装体面的厚册，只是一本旧得快散页的书。封皮磨损，书角泡过水，页边还留著被反复翻阅后的深色指痕。可她一直抱著它，饿的时候抱著，咳得最厉害的时候也抱著，像抱著一块不肯沉下去的浮木。\n\n那本书里写的东西，起初并不全是魔法。\n有草药、病理、古代语的残句、几段错误百出的炼金笔记，还有一小部分已经看不出完整脉络的术式草图。大部分人翻两页就会觉得晦涩无用，帕秋莉却把它当成唯一能让自己往前多活一点的东西。\n\n她从那些凌乱的知识里学会一件事：世界不是只能照表面运作。\n火不一定只会烧，水不一定只会流，字句与符号若排对位置，就能把现实撬开一条很细的缝。\n\n所以她开始学。\n\n咳著学，饿著学，在别人睡著时借著快熄掉的烛火学。她没有名师，没有系统，也没有谁保证她走的方向是对的。她只是靠著近乎固执的钻研，把书里那些残破的线头一根根接起来。她先学会辨认，后学会推演，再学会把那些古怪的记号化成可以实际运作的东西。\n\n她不是突然得到力量的。\n\n她是硬把力量一页一页读出来的。\n\n也就是在那段时日里，蕾米莉亚第一次看见她。\n\n不是在高塔，不是在宴会，而是在一间破旧书店门口。那时的帕秋莉瘦得像一折就断，脸色白得近乎透明，胸口起伏得很慢，像下一口气随时都可能接不上。可她手里还抱著那本书，抱得比自己的命还紧。\n\n蕾米莉亚那时没有先看她的脸。\n\n先看的是那本书。\n\n再看她握书的手。\n\n一个快饿死、快病死的人，却还在抓著知识不放——那种模样比任何求生都更有意思。因为那代表这孩子不是在等人救，她是在从书里找一条能自己活下去的路。\n\n那一眼之后，帕秋莉的命就没有丢在那间书店门口。\n\n而那本从不离身的旧书，也从「活下去的凭证」，慢慢变成了她成为魔女的起点。"
 scarlet.86.a:0 "她先抓住了书，才抓住了命。"

 scarlet.87.t:0 "把知识读成魔法的人"
 scarlet.87.d:0 "后来的帕秋莉，才真正像人们口中的魔女。\n\n可那不是因为天赋突然降临，也不是因为她被谁赐予了神秘的恩典。她只是把那本书读得太深，深到书页里原本只是断裂线索的东西，在她手里重新连成了完整的结构。\n\n她开始不满足于照抄。\n\n她修正错误，补完残缺，替那些早就失传的术式重新计算节点与流向。她知道哪种草药配错一滴就会毒死人，也知道哪种咒文多一笔就会把整个房间点著。她学得很慢，也学得很准，因为她从一开始就没有犯大错的本钱。\n\n那本旧书始终跟著她。\n\n它不只是纪录，也不只是教材。里面有她最早做的批注、第一次成功时留下的记号、咳著血也不肯停笔的夜里写下来的修正式，还有某几页被翻得特别薄，几乎一碰就要碎。那本书见过她还是凡人时的倔强，也见过她一步步把自己从「快死掉的读书人」磨成「真正的魔法使」。\n\n有些人以为成为魔女是一场变身。\n\n帕秋莉不是。\n\n她比较像是在长年累月的阅读、推演与实验里，把自己一点点改写成了另一种存在。当她第一次能不靠抄录、而是只靠自己的理解把魔法阵完整展开时，她没有欢呼；当她第一次成功稳定住危险术式时，她也没有得意。她只是把那一页记进书里，像在确认——好，这部分现在归我了。\n\n蕾米莉亚后来见过她施法很多次。\n\n火焰、冰霜、金属、重压、封印，帕秋莉用起来都不华丽，却极准。可比起那些会发光的结果，蕾米莉亚更记得的，反而是最早那一幕：那个快要倒下的女孩，仍死死抓著一本旧书不放。\n\n因为她知道，真正让帕秋莉成为魔女的，不是魔法本身。\n\n是她对知识那种近乎病态的执著。\n\n所以直到今天，那本书还在她身边。\n放在书桌最近的位置，带著旧时代的磨损与她亲手留下的笔迹。它不再是她最强的书，也不是图书馆里最危险的藏品，可它比任何禁书都更不能被碰。\n\n那是她成为魔女的契机。\n是她从凡人一路读到魔法使的证明。\n也是蕾米莉亚第一次看见她时，她紧紧握在手里、怎样都不肯交出去的知识。\n\n有些人是先得到力量，才替自己找理由。\n\n帕秋莉不是。\n\n她是先抓住理由，再把力量一点一点读出来。"
scarlet.87.a:0 "那本书，从来不是装饰。"


 scarlet.88.t: "工厂里的影子"
 scarlet.88.d: "帕秋莉的工业化重整刚起步，阻碍就跟着来了。\n\n图纸会在入夜后少掉关键页，矿石会在清点前被调包，刚装好的机具会在试运转时莫名停摆。最麻烦的不是破坏本身，而是每一次破坏都恰好卡在最要命的位置——不多毁一分，却足够把进度拖慢、把人心弄乱。\n\n帕秋莉起初以为只是旧势力残余作祟，直到她把事故时间、物资流向与人员出入全摊在桌上，才看见那条藏得极深的线：这些人不是为了抢东西，也不是为了制造混乱，他们是在观察，在测算，在一寸寸拆解红魔馆未来的工业骨架。\n\n「他们不是来偷。」帕秋莉把笔停在图纸边缘，声音冷得发直。\n「他们是来让我们永远造不起来。」\n\n小恶魔俯身看了一眼那份整理出来的脉络，笑意收得很干净。\n「这手法……不像地上的人。」\n\n帕秋莉没有抬头，只把月都制式的暗记轻轻圈了出来。\n\n「是月都。」\n\n她终于明白，红魔馆正在面对的，不只是几只伸进工坊的脏手，而是一整套来自月面的监视与破坏。只要这些眼线还在，任何蓝图、任何工厂、任何新武器，都随时可能在落成之前先被掐断。"
 scarlet.88.a: "把藏在工厂里的眼睛全挖出来。"

 scarlet.89.t: "永远亭的沉默"
 scarlet.89.d: "答案不是帕秋莉先找出来的。\n\n是永琳自己送上门的。\n\n她来时没有带护卫，也没有带多余的辩解，只站在图书馆里，像一位终于决定把旧账摊开的人。她看着帕秋莉桌上的资料，看着那些被拆开的月都暗记，沉默了很久，才开口。\n\n「博丽巫女的死，我早就知道不对。」\n\n小恶魔的眼神立刻冷了。帕秋莉却没有打断，只等她继续。\n\n「我知道那不是单纯的意外，也知道调查会指向月都的人。」永琳的声音很平，平得近乎无情，「可当时我选择了压下去。」\n\n她承认得很干脆，也很难听。\n\n在那时的她眼里，死掉的只是巫女。一个地上的人类，一个会被替换的位置。若为此把月都的影子整个翻出来，只会让局面提早失控。于是她把线索剪断，把调查引偏，让原本还能追下去的脉络一点点烂掉。\n\n「我以为这样能避免更大的乱。」她说。\n\n帕秋莉终于抬眼，声音像冰。\n「然后八云紫也死了。」\n\n永琳闭了闭眼。\n\n「是。」\n\n这一次，她没法再把事情当作可以容忍的代价。巫女的死，她还能用冷静去算；可八云紫一死，整个幻想乡都被扯开了口子。她终于明白，自己当初那点自以为是的包庇，不是在止血，而是在替月都的人把刀磨得更快。"
 scarlet.89.a: "她终于承认，自己当初错得彻底。"
 # scarlet.89.b: ""

 scarlet.90.t: "月之贤者的责任"
 scarlet.90.d: "永琳没有求原谅。\n\n她只是把一份名单放到桌上。暗桩、接应点、月都常用的替换身份、藏在商队、医馆与补给线里的联络节点，全都写得一清二楚。那不是推卸责任的人会拿出来的东西，那是准备亲手把旧秩序撕开的姿态。\n\n「我不认同月之都现在的做法。」她说。\n「更不接受他们把幻想乡当成可切开的标本。」\n\n她抬起头，眼神第一次真正像一位月之贤者，而不是永远亭的医者。\n\n「巫女的死、八云紫的死、这之后连着发生的一切，我都有责任。」\n「因为我早就知道月都的人在动手，却没有当场斩断。」\n\n她没有把责任推给别人，也没有替自己找一个好听的理由。她只是把话说到底。\n\n「所以这一次，我会负责。」\n\n帕秋莉看着那份名单，没说信，也没说不信。她只知道，红魔馆的工业、工坊与未来，不可能再容许这些月都势力继续躲在暗处下手。\n\n小恶魔把那叠资料收进手里，笑容薄得发冷。\n「很好。」\n\n她轻轻敲了敲名单封面。\n\n「那就从你们月都的人开始清。」\n\n永琳没有反驳。\n\n因为她很清楚，这一次不是谈条件，也不是做交换。\n\n这是她这个月之贤者，必须亲自偿还的责任。"
 scarlet.90.a: "她会为月都留下的烂账负责。"


 scarlet.91.a: "月之贤者设下的局"
 scarlet.91.d: "永远亭的夜一向安静，这一晚却安静得近乎发冷。\n\n八意永琳把讯号送出去了。字句不多，语气平稳，像往常任何一次需要月都高层介入的紧急通报：地上局势失衡，证据已回收，红魔馆尚未掌握真正的指挥链，请月之都派最高层人员亲自前来处置。\n\n她写得很准。\n准得像过去无数次替月都收尾时那样。\n\n可这一次，她不是在替月都擦血。\n她是在替红魔馆开门。\n\n讯号送出后，她没有回头，只站在竹林边缘，看著风从叶间穿过。很多年前，她与同伴建立月之都，原本只是想让那些在地表活不下去的人，有一个不再被污染、不再被追赶的地方。那时候的理想很简单：避难、延续、保存文明。\n\n可后来一切都变了。\n\n月之都开始厌恶污秽，厌恶得近乎病态；开始把洁净当作高贵，把俯视地上生命当成理所当然。从排斥，到切割，到观察，到操纵，到最后连巫女与八云紫这样的人都敢动手。她当初想建的是避难所，月之都最后却长成了一座把阴谋当秩序、把屠戮当必要手段的高墙。\n\n她知道，这里面有她的责任。\n\n而今晚，她要亲眼看著自己曾经教导过的学生、曾经亲手培养的利刃，被另一群怪物折断。\n\n红魔馆的人已经到了。\n\n咲夜负责封路，美玲守住竹林外圈，帕秋莉与小恶魔在更深处叠术，蕾米莉亚本人则安静站在阴影里，像一场真正杀局里最后才会现身的答案。\n\n永琳没有再说话。\n\n她只是低声自语，像在对一个已经死掉的理想做最后一次告别。\n\n「若这真是我做错的结果……那就由我看著它被清算吧。」"
 scarlet.91.t: "饵已放下，月人会自己走进来。"

 scarlet.92.a: "竹林中的月都高层"
 scarlet.92.d: "最先落进竹林的是稀神探女。\n\n她没有大张旗鼓，只带著那种月都高层特有的冷静与傲慢，像世上的局势本就该让她来校正。她站定后没有立刻开口，显然也察觉到了不对——风太静，路太干净，连竹影都像被谁预先修整过。\n\n接著是绵月依姬与绵月丰姬。\n\n姊妹两人一刚一柔，一位带著几乎不加掩饰的杀意，一位则仍维持著月人式的从容。她们看见永琳时，都明显停了一瞬。那一瞬间里没有怀疑，只有本能的信任——对师长、对前辈、对那位曾替她们打下月之都根基的贤者。\n\n也就是那一瞬，杀局合拢。\n\n帕秋莉的术式先亮。不是炫目的大魔法，而是数十层预先埋好的封锁阵一齐启动，整片竹林像被一本看不见的厚书啪地合上。小恶魔把最后一道封条按进空气里，笑得很甜。\n\n「通讯切断，退路封死。」她说。\n\n探女的眼神终于沉了。\n\n「永琳。」依姬先开口，声音冷得像要把竹叶都冻住，「这是什么意思？」\n\n永琳站在更远处，没有回答。\n\n她不能回答。\n因为她只要开口，这场局就会变得像辩解。\n\n蕾米莉亚于是从阴影里走了出来。\n\n红雾在她脚边慢慢铺开，她的语气不高，却像刀刃刮过月光。\n\n「意思很简单。」\n\n她看著眼前三位月都高层，笑意很薄。\n\n「你们把手伸得太长了，现在轮到红魔馆把它砍下来。」\n\n依姬几乎是立刻拔刀，丰姬则向后半步，准备以扇开隙。可咲夜的身影已经先一步切进她们侧后，把时间与距离一起压短；美玲站在唯一能硬冲出去的方向，肩膀微沉，气息稳得像一堵墙。\n\n月都高层这才明白。\n\n她们不是来处理地上的混乱。\n她们是被永琳亲手引来，送进红魔馆的屠场。"
 scarlet.92.t: "她们来了，也出不去了。"

 scarlet.93.a: "把月亮的牙拔掉"
 scarlet.93.d: "真正的厮杀没有持续太久。\n\n因为红魔馆这一次不是来交手。\n\n是来清洗。\n\n稀神探女最先被针对。她的能力太麻烦，话一旦说出口，局势就可能反向扭转。帕秋莉从一开始就没给她开口的空间，七曜封印一层套一层，把她周围的声与意都压得极窄。小恶魔从侧面切进，符纸一张接一张拍上去，像在替一个危险的句子封口。\n\n「今晚，妳最好安静。」她笑著说。\n\n探女抬眼看她，眼神仍冷，却已经失了说话的余地。下一瞬，咲夜的刀光掠过，她的喉间先见血，封印再压上。这位月都高层甚至没能真正把自己的能力完整展开，就被从战场上切了出去。\n\n绵月依姬则完全不同。\n\n她一出手便是正面硬撕，刀势与请神之力一层接一层，像要把整片封锁阵连竹林一起斩开。她的确强得惊人，甚至逼得美玲后退了半步。可红魔馆根本不和她讲武德——美玲正面顶住，咲夜从死角切节奏，蕾米莉亚亲自从上方压杀意，帕秋莉还不忘在她脚下补一道重压术，把她每一次借神力转势的瞬间都拖慢。\n\n依姬最后还是伤到了蕾米莉亚的披风，也把美玲一只手臂震得发麻。可她没能冲出去。\n\n当咲夜的刀把她逼到停顿那一刹，蕾米莉亚直接近身，枪尖穿进胸口。依姬还想再动，美玲已经把她整个人往地上压住。\n\n绵月丰姬比她姊姊更难抓。\n\n她擅长的是开隙、转移、脱离，把战场变成她自己的通路。若只靠一两人，恐怕真会被她从竹林里整个滑出去。可小恶魔早就等著她了。所有预设好的坐标全被改写，所有她以为能接上的「外面」，最后都通向红魔馆的人。\n\n丰姬第一次打开扇面时，看见的是咲夜。\n第二次，是帕秋莉的术。\n第三次，则是蕾米莉亚本人。\n\n她终于失了从容，扇骨碎裂的瞬间，红雾整个压了上来。\n\n战斗结束时，竹林里只剩断裂的术痕、被压坏的叶影，和三位月都高层逐渐冷下去的身体。\n\n红魔馆用了全馆之力，没有留下任何余地。\n\n她们不是在示威。\n她们是在把月亮的牙，一颗一颗拔掉。"
 scarlet.93.t: "月都的高层，今晚死在竹林里。"

 scarlet.94.a: "永琳看著月都死去"
 scarlet.94.d: "战后的竹林安静得异常。\n\n永琳一直站在旁边，从头到尾都没有出手。\n\n她看著稀神探女被封住，看著依姬与丰姬在围杀中一点点失去反击的可能，看著自己曾经教导过、扶持过、甚至寄予过期望的那对姊妹，最后倒在地上，再也站不起来。\n\n她不是不舍。\n\n恰恰相反。\n\n她太清楚依姬的刀路是怎么练出来的，也太知道丰姬那种从容的站姿，是经过多少次训导才养成的。她们是她从前的学徒，是月之都延续下去的象征，是她曾以为「至少还有未来可言」的一部分。\n\n可她也只能看著。\n\n因为她知道，现在死掉的，不只是三个人。\n\n死掉的还有她当初建立月之都的理由。\n\n她曾经以为，月之都该是让地表活不下去的人有一处可安身的地方，是避难所，是文明的延续，是不必再受地上混乱与衰败牵连的净土。可不知从哪一步开始，净土变成了洁癖，高贵变成了傲慢，秩序变成了蔑视，最后连其他生命本身都被视为可切割、可操纵、可丢弃的材料。\n\n她亲手壮大的地方，长成了她最不愿承认的模样。\n\n阴谋、切割、屠杀、观察、否认。\n\n月之都不再是避难所。\n而是一个把「非我族类」视作理所当然可以处理掉的高墙。\n\n蕾米莉亚从血与雾之间走过她身边，没有说安慰，也没有说讽刺。只是淡淡留下一句。\n\n「这是妳要我看的结果。」\n\n永琳没有否认。\n\n她低下头，看著地上的尸体，第一次没有用医者或贤者的角度去分类、去分析，而只是很慢地说：\n\n「是我做错了。」\n\n不是一步。\n\n是很多步。\n\n她放任月都把洁净当作刀，放任高层把地上的生命视作污秽，放任自己一次次用「还能控制」去拖延该斩断的东西。直到巫女死了，直到八云紫死了，直到今晚，她终于只能站在这里，看著红魔馆替她把这笔帐结清。\n\n竹林的风从她袖间穿过，冷得像月面。\n\n可永琳知道，这不是结束。\n\n这只是她开始真正替月之都的堕落负责。"
 scarlet.94.t: "她终于承认，月之都是坏在自己手里。"


 scarlet.95.a: "书商之女"
 scarlet.95.d: "帕秋莉不是生来就属于阴影与咒文的人。\n\n她最早的家，只是一间普通的书店。门面不大，木架老旧，冬天会透风，夏天纸页又容易受潮。她的家人不是学者，也不是什么高贵的收藏家，只是一群靠兜售知识过活的普通书商。教会的人会来找经文，落魄的学生会来翻旧教材，想做买卖的人会来问帐本与地图，偶尔也有些神色古怪的客人，压低声音来问禁忌的东西。\n\n帕秋莉从小就在那样的地方长大。\n\n她的身体很差，差到连跑两步都会喘，夜里冷一点就咳，天气湿一点胸口就像被铁箍勒住。别的孩子在街上追逐时，她多半只能坐在柜台后，或者缩在书架最深的角落里，看著别人的脚步从门口来来去去。\n\n可她并不讨厌。\n\n因为她有书。\n\n别人觉得书是货物，是能换钱的东西；她却很早就把书看成另一种门。翻开一本，就像能从那间小小的店里走出去一点。药草、地理、炼金、历史、神学、古语，她什么都看，什么都记。她读得很杂，也读得很深，像一个身体不能远行的人，把所有路都先折进脑子里。\n\n也就是在那些书里，她找到了一本不该出现在普通书店的东西。\n\n那本书旧得厉害，封皮磨损，页角泛黑，里面的字有一半像笔记，有一半像被人硬塞进去的咒式草图。它既不像正经的医书，也不像教会认可的典籍，更不像能拿去卖个好价钱的珍本。可帕秋莉一翻开，就知道那里面藏著别的东西。\n\n那不是单纯的知识。\n\n那是方法。\n\n那本书没有直接给她力量，也没有一页写著「如何成为魔法使」。它只是把一条很细、很难走、却确实存在的路摆在她眼前——原来文字可以排列出力量，原来符号与药材、呼吸与意志，都能被拼成一种能改变现实的结构。\n\n从那天开始，帕秋莉看书的方式变了。\n\n她不再只是记住。\n她开始推演，开始比对，开始把零碎知识重新拼成自己的答案。\n\n后来很多人都说，她成为魔法使是因为天分。\n\n可只有她自己知道，最开始那一步，根本不是天分。\n\n那只是一个身体虚弱、只能坐在书堆里长大的孩子，在书海深处找到了一本不肯放手的书。"
 scarlet.95.t: "她先抓住了书，才抓住了路。"

 scarlet.96.a: "饥荒与门前的人"
 scarlet.96.d: "后来，饥荒来了。\n\n不是一下子把世界推翻，而是一层一层把人掏空。先是粮价开始乱，接著熟客不来了，再来是店里那些本来还能勉强卖出去的书，也越来越少人问。到了最后，人们已经不想买知识了。他们只想买面包、买蔬菜、买能撑过明天的东西。\n\n书店先变冷，然后变空。\n\n帕秋莉看著那些熟悉的架子一天比一天更像骨头。家里能卖的东西被拿去换粮，能典当的东西被一件件搬走，连某些原本绝不该离开书架的书，也被迫卖给了不懂得珍惜的人。她的家人起初还在硬撑，说只要再过一阵子就好，可饥荒从来不因为谁的体面就停手。\n\n一个接一个，人先倒下了。\n\n病、饿、冷、无药可用、无食可吃，这些东西合在一起，比战争还安静，也更难反抗。帕秋莉很快就明白，她保不住那间书店，也保不住原本那个「卖书就能活下去」的家。\n\n可她还是留下了那本书。\n\n不是因为它值钱。\n而是因为那是她最后还能抓住的东西。\n\n到了最糟的时候，她已经没法坐在店里看书了。她只能抱著那本旧书，坐在门槛旁，像守著一块快沉下去的木板。身体越来越差，咳得越来越厉害，胸口的每一次起伏都像借来的。雨水把她的头发打湿，寒意钻进骨头里，她却还是把书抱得很紧。\n\n因为她还没认输。\n\n那时的她已经几乎一无所有。\n没有家，没有食物，没有能替她挡风的人，也没有任何会从天上掉下来的奇迹。她能做的，只剩用最微薄的力气，继续把那本书里的东西读下去。\n\n她不是在等谁救她。\n\n她是在用自己最后那一点点残存的清醒，硬去找一个答案：有没有什么方法，能让她不只是死得慢一点，而是能真正把命运扳回来一点。\n\n所以当旁人看见的只是个快饿死、快病死的孩子时，帕秋莉自己心里想的，却还是那一句——\n\n我要活。\n\n不是靠施舍，不是靠眼泪。\n\n是靠方法。"
 scarlet.96.t: "她快失去一切了，却还没放下那本书。"

 scarlet.97.a: "被捡起来的未来"
 scarlet.97.d: "也就是在那种时候，蕾米莉亚看见了她。\n\n不是看见一个可怜的孩子。\n而是看见一个快被饿死、却还在死死抓著知识不放的人。\n\n帕秋莉后来自己也承认，当时的她已经虚弱得不像样。站起来都很勉强，咳一声就要把整个人折下来，脸色白得像随时会跟著雨一起融掉。可她偏偏还能抬起眼，完整地说出那句话——\n\n「我在找能让我活下去的方法。」\n\n蕾米莉亚喜欢那句话。\n\n因为那不是求饶，也不是示弱。那是一个还没认命的人，用最后力气守住的骨头。\n\n所以她把帕秋莉带走了。\n\n不是因为心软。\n是因为浪费太可惜。\n\n从那之后，帕秋莉有了药，有了食物，有了能安静读书与试验的空间，也有了足够长的时间，把那本书里的线索真正读透。她的身体依旧不好，病依旧会发，夜里咳嗽还是会把胸口扯得生疼。可和从前不同的是，她终于不必把所有力气都先用在「活过今天」这件事上。\n\n多出来的那部分，她全拿去读书、记录、修正、推演。\n\n她开始不只照著书本做。\n她开始质疑，开始补完，开始把那些残破的笔记一点点接起来，最后变成自己的术式。失败的纪录叠了一层又一层，咳著血写下的批注也越来越多。她不是突然得到了魔法，而是靠著自己的努力，把魔法从书页里一点点掘出来。\n\n而蕾米莉亚给她的，不是答案。\n\n蕾米莉亚给她的是活下去的条件。\n\n于是在那之后，帕秋莉·诺蕾姬不再只是那个会抱著一本书坐在书店门口等死的孩子。她变成了真正的魔法使，变成了大图书馆里那块不动的石，变成了把知识分层封存、把禁忌编成系统、把现实拆开重写的人形图书馆。\n\n而那本书，直到今天都还留在她身边。\n\n因为那不只是一本书。\n\n那是她最早握住的知识，也是她与蕾米莉亚第一次相遇时，唯一还不肯交出去的未来。"
 scarlet.97.t: "她活下来了，也把自己读成了魔法使。"

scarlet.98.t:0 "她召唤出的第一个秘密"
scarlet.98.d:0 "小恶魔抱著清单在书架间穿梭，步子轻，手却很稳。她知道哪一排书不能碰，哪一格封印不能碰，甚至知道帕秋莉咳嗽前会先停哪一瞬。帕秋莉看著她，笔尖停在纸上，思绪却往回退了很多年。\n\n那时她还在跟著魅魔学习。魅魔总爱靠在窗边说一些像玩笑、却偏偏很对的话。\n\n「召唤使魔，」她说，「不是找个仆人。」\n「那是把妳脑子里最深的结构，和妳心里最不肯承认的东西，一起拖到现实里。」\n\n年轻时的帕秋莉不喜欢这种说法。她只相信公式、阵列、媒介、代价，不相信什么『心』。\n\n可当红魔馆终于建成，图书馆归位，第一批封印也稳定下来后，她还是动手了。\n\n那一夜，整座图书馆的书页像被同一阵风翻开。符文沿著地板一圈圈亮起，魔力像水一样被抽进阵心。帕秋莉站在中央，没有念错一个音，也没有让手抖一下。她本来只想召来一个足够聪明、足够听话、能替她整理书籍与维持秩序的使魔。\n\n可阵完成时，从光里走出来的，不只是工具。\n\n小恶魔抬起头，先看见的是她，然后才是书架、烛火与整座馆。\n她笑得很自然，像早就知道自己该站在哪里。\n\n那一瞬间，帕秋莉终于想起魅魔说过的另一句话：\n\n「妳以为妳召的是劳力，实际上妳召出来的，往往是妳自己最不愿说出口的答案。」\n\n帕秋莉后来承认，魅魔那次没说错。\n\n因为她召唤出的第一个秘密，从来不是『便利』。\n\n而是小恶魔。"
scarlet.98.a:0 "使魔从来不只是工具。"

scarlet.99.t:0 "最深层的欲望"
scarlet.99.d:0 "魅魔教她召唤术时，曾经用很轻佻的语气说过一句很不负责任的真话。\n\n「使魔是魔法使智慧的展现，也是欲望的倒影。」\n\n帕秋莉那时候只当她在胡说。她相信知识，相信控制，相信一切都该有可验证的结构。欲望那种东西太模糊，太不干净，也太不值得写进术式里。\n\n可小恶魔出现之后，她慢慢发现，有些事不是不承认就不存在。\n\n小恶魔很像她，却又不像她。\n\n她同样迷恋知识，喜欢在书海里翻找答案；同样擅长整理、拆解、归档，把混乱重新排成可控的秩序。可她比帕秋莉更轻快、更直接，也更不遮掩。她会笑著黏在帕秋莉身边，会在帕秋莉咳得最厉害时立刻把药与水递上来，也会在蕾米莉亚踏进图书馆时，先一步抬头去看主人的反应。\n\n那不是单纯的服从。\n\n那是一种近乎本能的在意。\n\n帕秋莉花了很久才承认，小恶魔真正象征的，并不是她对书本的执著，也不只是她想把世界分门别类的习惯。\n\n小恶魔象征的是她对蕾米莉亚的爱。\n\n不是那种会被她写在纸上的爱，也不是她愿意坦白承认的爱。那份感情太深，太安静，也太早就被她压进了理性底下。她把它藏在研究、服从、解答与无数个「我只是替妳处理问题」里，藏到连自己都快信了。\n\n可召唤术不会替人保守这种秘密。\n\n所以小恶魔来了。\n她爱著帕秋莉，就像帕秋莉爱著蕾米莉亚一样：靠近，服从，观察，记住，愿意把自己放在一个最靠近、也最不被明说的位置。\n\n帕秋莉不喜欢这个答案太直白。\n\n但她更讨厌否认。"
scarlet.99.a:0 "有些秘密，术式比本人更早知道。"

scarlet.100.t:0 "红魔馆最后一位成员"
scarlet.100.d:0 "红魔馆真正成形之后，门有人守，帐有人管，主人坐上了属于自己的位置，图书馆也终于不再只是暂时借来的空间。很多事情都稳下来了，却还差最后一块。\n\n那一块，不是墙，也不是书。\n\n是小恶魔。\n\n她是红魔馆最后一位加入的成员，却不是被谁带进来的。她是帕秋莉亲手召唤出来的，是在图书馆最深处、在魔法阵与无数本书的见证下，从术式里诞生的。\n\n她出现时，没有夸张的宣言，也没有惊人的威压。只是从光与纸页翻动的声音里走出来，像自然而然地补上了一个早就该存在的位置。\n\n她先向帕秋莉行礼。\n\n「主人。」\n\n然后才抬头看向这座馆，看向烛火，看向一排排禁书，看向远处那扇通往走廊与其他人的门。\n\n她没有问自己是谁，也没有问自己为什么会在这里。她像从一开始就知道，自己就是该站在帕秋莉身边的人。\n\n从那天起，她替图书馆补上了最后一层运转。递书、归档、封印、换烛、试药、记录实验偏差、在访客踏错一步时先露出笑容——这些事她做得越来越熟，像血一样流进日常。\n\n而帕秋莉也默许了她靠近。\n\n没有说喜欢，没有说需要，却把她留在最靠近自己的位置。这对帕秋莉来说，已经比任何夸奖都更直接。\n\n红魔馆里的人后来都习惯了小恶魔的存在，好像她本来就该在这里。\n\n可只有帕秋莉自己知道，不是红魔馆选中了小恶魔。\n\n是她把她召了出来。\n\n把自己的知识、自己的秩序、自己的秘密，还有那份始终没说出口的爱，一起写进了那一夜的召唤里。\n\n于是红魔馆最后一位成员，终于到齐。\n\n而图书馆，也从那一刻起，不再只是帕秋莉一个人的疆域。"
scarlet.100.a:0 "她是最后加入的人，也是最早被写进答案的人。"

 scarlet.101.t:0 "炼金术开始前先吵一架"
scarlet.101.d:0 "大图书馆难得不安静。\n\n帕秋莉把一整张长桌清空，摆上坩埚、量杯、符纸、金属粉末、三种颜色可疑的液体，还有一本摊开到快散页的炼金笔记。小恶魔抱著材料表，在桌边来回转圈，越看越觉得今天不像在做实验，比较像在准备一场合法爆炸。\n\n「我先确认一下。」小恶魔拿起一个小瓶子，对著烛光晃了晃，「这个是催化剂，不是果酱？」\n\n帕秋莉头也不抬。\n「妳若把它涂在面包上，明天就不必吃早餐了。」\n\n「懂了，不是果酱。」\n\n小恶魔放下瓶子，又指著另一盆闪闪发亮的粉。\n「那这个呢？」\n\n「星砂。」\n\n「看起来像妳上次嫌太甜不肯喝的砂糖。」\n\n帕秋莉终于抬眼，语气冰冷。\n「妳可以试吃。我会顺手把遗书也替妳写好。」\n\n小恶魔立刻把手缩回去，嘴上却还是不停。\n「我只是想帮妳确认标示够不够清楚。毕竟这一桌东西里，有一半都像能让红魔馆少一层楼。」\n\n「妳今天话很多。」\n\n「因为妳今天打算把石头煮成黄金。」\n\n帕秋莉把笔记翻到某一页，语气平得像在宣读菜单。\n「先加盐灰，再加金属粉，等坩埚稳定后倒入第三号溶液。」\n\n「哪一瓶是第三号？」\n\n「写著三的那瓶。」\n\n小恶魔低头一看，桌上有两瓶都写著三。\n\n「……妳故意的吧？」\n\n帕秋莉沉默两秒，伸手把其中一瓶挪开。\n「那是昨天的三。」\n\n「昨天的三跟今天的三有什么差别？」\n\n「昨天的三会把妳的眉毛炸掉，今天的不会。」\n\n小恶魔瞪大眼睛。\n「这种事妳应该早点说！」\n\n「我现在说了。」\n\n两人一来一往，声音越来越大，连书架上的灰都像被吵得抖了一层。等小恶魔把坩埚点起来时，整座图书馆已经不只是在做炼金术，更像在用嘴皮子先炼出一场灾难。"
scarlet.101.a:0 "先别炸，先分清楚哪瓶是今天的三。"

scarlet.102.t:0 "女仆长与危险清单"
scarlet.102.d:0 "第一个被吵来的是咲夜。\n\n她推开图书馆的门时，脸色比平常还冷。手套雪白，裙摆笔直，显然原本是来抓违反馆内安静规范的犯人。结果一进门，她就看见小恶魔踩在梯子上，左手拿量杯，右手拿锅铲，嘴里还在大喊：\n\n「我说了这个颜色看起来很不妙！」\n\n帕秋莉则坐在桌前，面无表情地回她：\n「炼金术若看起来很安全，那才是真的有问题。」\n\n咲夜站在门口，沉默了整整三秒。\n\n「请问，」她终于开口，「这是实验，还是厨房政变？」\n\n小恶魔立刻像看到救星一样转头。\n「咲夜！妳来得正好！快帮我看看，这一行到底写的是『搅拌三圈』还是『搅拌到冒烟』？」\n\n咲夜走近看了一眼。\n「这是『三圈后若不冒烟，表示前一步已经做错了』。」\n\n小恶魔倒吸一口气。\n「这种说明方式是谁教她的？」\n\n咲夜淡淡回答。\n「我猜是同一个会把昨天的三和今天的三放在一起的人。」\n\n帕秋莉咳了一声，像在表示自己听见了，但不打算道歉。\n\n咲夜的视线又往下扫，很快就开始本能性整理。\n坩埚左移半寸，危险药剂按颜色重排，抹布与灭火毯分开，甚至连小恶魔随手乱丢的夹子都被她收进盒子里。\n\n「妳们若真想在图书馆里进行高风险炼金术，至少该先有一份危险清单。」咲夜说。\n\n小恶魔立刻把纸笔塞给她。\n「拜托妳写！」\n\n帕秋莉皱眉。\n「妳是来帮忙，还是来接管？」\n\n咲夜拿起笔，语气平稳得近乎残酷。\n「我是在阻止红魔馆因为两位书房住民的即兴发挥而提早重建。」\n\n帕秋莉安静了一瞬，最后竟没反驳。\n\n于是女仆长就这样被拖进了炼金现场——负责计时、记录、警告哪一瓶不能碰，以及在小恶魔把锅铲伸向坩埚时，用两根手指精准地把她的手腕按回去。"
scarlet.102.a:0 "有了咲夜，爆炸流程终于看起来专业了。"

scarlet.103.t:0 "大小姐亲临投资现场"
scarlet.103.d:0 "第二个被惊动的是蕾米莉亚。\n\n她进门时，图书馆正处于一种奇妙的平衡：坩埚在冒泡，小恶魔在碎念，咲夜在计时，帕秋莉在咳嗽，四个人都一副随时可能互相动手、却偏偏还没出事的样子。\n\n蕾米莉亚看了一圈，笑了。\n\n「我还以为有人在图书馆里炼国策。」\n\n小恶魔立刻行了个夸张的礼。\n「差不多，大小姐。我们正在炼您的工业预算。」\n\n蕾米莉亚听了更有兴趣，直接走到桌前，看著坩埚里那团颜色不太吉利的液体。\n\n「所以，这一锅如果成功，我就有钱。」\n\n「对。」帕秋莉说。\n\n「失败呢？」\n\n帕秋莉连头都没抬。\n「妳会少一座图书馆。」\n\n蕾米莉亚安静了半秒，然后居然笑出声。\n\n「很好，至少妳很诚实。」\n\n咲夜在旁边平静补充。\n「我已经把最重要的书先移出去了。」\n\n小恶魔震惊地转头。\n「妳什么时候移的？！」\n\n「妳刚才跟帕秋莉讨论昨天的三和今天的三时。」\n\n蕾米莉亚满意地点头，像在审核一个过于危险却很有趣的投资案。\n\n「那我现在的角色是什么？」她问。\n\n小恶魔立刻答：「金主。」\n\n咲夜补一句：「监督人。」\n\n帕秋莉冷冷道：「不要碰任何东西的人。」\n\n蕾米莉亚挑眉。\n「真无情。」\n\n她倒也没生气，反而拉了张椅子坐下，手支著脸，看著她们忙成一团。那种姿态不像主人比较像观众，还是买了最前排位置、专门等看最后会不会炸的那种观众。\n\n等坩埚开始发出第三次危险的嗡鸣时，蕾米莉亚终于慢悠悠地说了一句：\n\n「提醒妳们一下，若图书馆真的炸了，我会先把帐记在帕秋莉头上，再从小恶魔工资里扣重建费。」\n\n小恶魔立刻抗议。\n「凭什么我也要扣！」\n\n蕾米莉亚笑得很优雅。\n「因为妳看起来最像会把锅铲伸错地方的人。」\n\n「……这是偏见！」\n\n「这是管理。」"
scarlet.103.a:0 "大小姐坐下了，现在谁都不准先爆。"

scarlet.104.t:0 "门番、锅铲与一小块黄金"
scarlet.104.d:0 "第三个被吵来的是美玲。\n\n她探头进来时，手上还端著一壶茶，本来大概只是想看看图书馆是不是又有人咳到快断气。结果一进门，就看见大小姐坐著看戏，咲夜拿著笔做纪录，小恶魔拿锅铲站在坩埚前，帕秋莉则一脸「再多一秒就要把全世界都炼了」的表情。\n\n美玲站在门口，沉默了一下。\n\n「……我是不是该先去拿水桶？」\n\n「拿两个。」咲夜头也不抬。\n\n「再拿一个给小恶魔洗脑子。」帕秋莉补充。\n\n小恶魔立刻抗议。\n「我今天明明表现得很专业！」\n\n她话才说完，锅铲就「当」一声掉进了坩埚。\n\n全场安静。\n\n美玲把茶壶往旁边一放，语气很真诚。\n「我现在去拿水桶应该还来得及吧？」\n\n帕秋莉的太阳穴很明显地跳了一下。咲夜已经先一步把蕾米莉亚往后护了半步。小恶魔则瞪著坩埚，像希望锅铲自己爬出来。\n\n结果下一秒，坩埚没有爆。\n\n它只是开始发光。\n\n先是很小的一点金色，接著整团液体像被谁从里面点亮，慢慢沉下去、凝起来，最后在锅底「啪」地掉出一块拇指大小、形状丑得很有尊严的金属块。\n\n所有人都愣住了。\n\n小恶魔最先反应过来，指著那一小块东西，声音几乎变调。\n「成功了？！」\n\n帕秋莉快步走近，把它夹出来，放到冷盘上检查。她看了三秒，又看三秒，最后才很不情愿地承认：\n\n「……是黄金。」\n\n蕾米莉亚笑了，笑得非常满意。\n\n「很好。」她站起身，看著桌上那一小块歪歪扭扭的成果，「所以红魔馆的第一桶工业资金，是用锅铲炼出来的。」\n\n小恶魔立刻挺胸。\n「我就说我是关键人才！」\n\n帕秋莉冷冷看她。\n「妳只是把事故做成了结果。」\n\n美玲端起茶，终于松了口气。\n「不管怎样，没炸就是好事。」\n\n咲夜在纪录纸上写下最后一行，语气平静得像什么都很正常。\n「实验结果：成功。附注：下次禁止小恶魔携带锅铲接近坩埚。」\n\n「喂！」\n\n图书馆里总算第一次真正笑了起来。\n\n帕秋莉看著那块丑得很明显、却确实是黄金的小东西，轻轻咳了一声，没有再说话。\n\n而蕾米莉亚已经在心里算起来：\n若一把锅铲能炼出这么一小块，那么只要再多几次，红魔馆也许真的能把下一艘船、下一批机械，甚至下一场战争的开销，都从炼金炉里硬生生挖出来。"
scarlet.104.a:0 "先把锅铲收好，再来炼第二块。"

 scarlet.105.t:0 "帕秋莉带著小恶魔去要钱 上"
scarlet.105.d:0 "红魔馆缺钱。\n\n这件事一旦被帕秋莉用平静的语气说出来，往往比大喊大叫更可怕。她把募资名单、工业计划、预估报酬、风险分摊与「捐款后可获得的政治友谊」整理成册，然后带著小恶魔出门了。\n\n第一站是永远亭。\n\n铃仙一开门，看见帕秋莉和小恶魔站在门口，表情就先僵了一下。\n\n「妳们……是来看病的？」\n\n「不是。」帕秋莉把文件递出去，声音很平，「是来要钱的。」\n\n铃仙低头看了看封面，上面赫然写著《永远亭对红魔馆工业建设自愿性高额赞助计划》。\n\n「这哪里自愿了？！」\n\n小恶魔笑得很甜。\n「妳看，这上面不是写了『自愿』吗？」\n\n「可是后面那一行『若不自愿，红魔馆将协助妳重新理解自愿的定义』是什么啊！」\n\n永琳最后还是出来了。她看完计划书，只沉默了两秒，就抬头看著帕秋莉。\n\n「妳们红魔馆现在已经缺钱缺到来敲永远亭的门了？」\n\n帕秋莉面不改色。\n「永远亭的药材、器材、库房与财务稳定性都高于幻想乡平均值。从投资角度来说，妳们有义务帮助比较有未来性的组织。」\n\n「原来妳们把要钱叫做投资。」永琳说。\n\n小恶魔立刻点头。\n「不然叫抢听起来多难听。」\n\n最后永琳揉了揉眉心，还是从抽屉里拿出一笔钱。\n\n「拿去。」她说，「然后别再把这种东西拿给铃仙看，她之前已经被妳们的吓过一次了。」\n\n第二站是河童工坊。\n\n河城荷取在看见帕秋莉走进来时，还以为是来谈技术合作的，表情甚至有点期待。结果帕秋莉把赞助书往桌上一放，她的期待立刻死了。\n\n「等等，妳不是来买机器的？」\n\n「不是。」帕秋莉说，「是来让妳赞助机器的。」\n\n荷取的护目镜都快滑下来了。\n\n「妳凭什么觉得我会答应？」\n\n帕秋莉把第二份资料抽出来。\n\n「因为妳若赞助，我会把红魔馆未来三年的一部分工业订单给妳。」\n\n荷取眼睛一亮。\n\n「那如果我不赞助呢？」\n\n小恶魔笑咪咪地补上一句。\n\n「那妳就只能眼睁睁看著山童赚走这笔钱。」\n\n荷取立刻把钱袋抱紧。\n\n「……妳们红魔馆的人谈判都这么阴吗？」\n\n帕秋莉淡淡道。\n\n「不，这已经是比较有礼貌的版本了。」"
scarlet.105.a:0 "至少永远亭和河童有『钱』这个概念。"

scarlet.106.t:0 "帕秋莉带著小恶魔去要钱 中"
scarlet.106.d:0 "第三站是天狗报社。\n\n射命丸文一听说帕秋莉来了，还以为自己终于有什么大新闻可以免费拿，翅膀一拍就飞到门口。\n\n「哎呀，图书馆的魔女亲自上门！怎么，是要投稿吗？还是红魔馆终于打算公开财政危机了？」\n\n帕秋莉把一份《天狗媒体赞助红魔馆重建计划》放到她手里。\n\n文低头看了两行，差点没笑到从窗台掉下去。\n\n「妳要我们报社给钱？！」\n\n「不是给。」帕秋莉纠正她，「是赞助。」\n\n姬海棠果在旁边探头看了一眼，念出其中一行。\n\n「赞助报酬：可优先获得红魔馆官方消息、工业建设独家采访权、以及未来女王巡访的摄影名额……」\n\n文的笑容慢慢消失了。\n\n小恶魔一看就知道有戏，立刻补刀。\n\n「妳不是最爱独家吗？」\n\n果也小声说：「而且……如果别家先拿到独家，我们会很丢脸。」\n\n文的眼神开始挣扎。\n\n「这不是勒索，这是内容合作……」她低声说服自己。\n\n「对。」帕秋莉说，「妳总算学会用正确的词。」\n\n最后，天狗报社捐了一笔钱，还外加一份「保证后续报导偏正面」的口头承诺。\n\n第四站是地灵殿。\n\n古明地觉一见到帕秋莉，就先把茶放下了。\n\n「妳是来借钱的。」\n\n帕秋莉面无表情。\n「妳读我心？」\n\n「妳现在满脑子都是预算缺口、炉心材料和『谁还有钱』，很难不读到。」觉说。\n\n小恶魔在旁边很不服气。\n「那妳应该也读到，我们这个方案非常值得支持。」\n\n觉轻轻一笑。\n\n「我还读到妳刚才在心里想，『地灵殿这么大，不收点场地税太可惜了』。」\n\n小恶魔立刻把嘴闭上。\n\n帕秋莉把文件推过去。\n\n「那妳应该也读得到，红魔馆真的缺钱。」\n\n觉翻了两页，叹了口气。\n\n「我可以出一部分。」她说，「不是因为妳的方案多动人，而是因为如果妳们缺钱缺到来地底拉赞助，那代表局势真的开始奇怪了。」\n\n她顿了一下，看向帕秋莉。\n\n「还有，妳脑子里那句『地底居民若不投钱，日后也得投命』，我建议妳别拿去对外说。」\n\n帕秋莉难得沉默了一秒。\n\n「……我本来就没打算说出来。」\n\n「妳只是打算写进附录。」觉平静地纠正。"
scarlet.106.a:0 "连读心妖怪都觉得这笔钱该出。"

scarlet.107.t:0 "帕秋莉带著小恶魔去要钱 下"
scarlet.107.d:0 "第五站，是湖边。\n\n琪露诺正叉著腰站在石头上，三月精蹲在旁边不知道在策画什么。小恶魔一看就头痛。\n\n「妳该不会真要跟她们募款吧？」\n\n「能要的地方都要。」帕秋莉说。\n\n她把《妖精友善捐款倡议书》展开。\n\n「我们需要财政支持。」\n\n琪露诺皱眉。\n「财政是什么？比冰还强吗？」\n\n桑尼先举手。\n「我有叶子。」\n\n露娜摸出一颗不知道哪里捡来的玻璃珠。\n「这个很亮。」\n\n斯塔想了想，递出半包饼干。\n「这算资产吗？」\n\n帕秋莉沉默。小恶魔已经笑到弯腰。\n\n「红魔馆成功获得第一批妖精投资：一片叶子、一颗珠子、半包饼干。」\n\n琪露诺不服。\n「我也有！」\n\n她从裙子口袋里掏出一枚冻住的青蛙，骄傲地举高。\n\n「最强的资产！」\n\n帕秋莉盯著那只冰青蛙，第一次露出近乎放空的表情。\n\n最后她还是收下了玻璃珠。\n\n「至少这个比较像钱。」她低声说。\n\n第六站，是是非曲直厅。\n\n四季映姬听完她们一路募款的经历，神情非常复杂。\n\n「妳们从永远亭、河童、天狗、地灵殿，一路要到琪露诺和三月精？」\n\n「对。」帕秋莉说。\n\n「现在还想向审判机构募款？」\n\n「对。」\n\n映姬沉默很久，才开口。\n\n「这件事本身，就足够我写妳们三页判词。」\n\n小恶魔立刻补上一句。\n\n「但若您愿意赞助，我们可以把部分建设命名为『四季映姬法治友善工程』。」\n\n映姬手里的悔悟棒微微一抖。\n\n「这是行贿。」\n\n「不是。」帕秋莉平静地说，「是冠名赞助。」\n\n最后，她们居然真的凑出一笔能开工的资金。\n\n回程路上，小恶魔抱著钱袋、票据、合约、玻璃珠、半包饼干，笑得快走不动。\n\n「我们成功了。」\n\n帕秋莉咳了一声。\n\n「我知道。」\n\n「妳现在是不是觉得，直接要钱比炼金术有效率？」\n\n帕秋莉想了想。\n\n「不。」\n\n「我只觉得，幻想乡比我想的还有钱。」"
scarlet.107.a:0 "至少这次没有把冰青蛙也算进国库。"



 scarlet.108.t:0 "报告之后的回音"
scarlet.108.d:0 "我把工业重整的报告交上去之后，王座厅还是那么安静。蕾米莉亚翻著文件，目光落在那些数字、路线、产能与备库上，神情没有太多起伏。她从来都是这样，真正重要的东西，反而不会用多余的表情去接。\n\n我站在台阶下，看著她的手指压住书页似的纸张，忽然想起很多年前的都柏林。那时候我抱著一本湿透的书，坐在破书店门口，饿得快站不起来，胸口像被铁丝勒住。旁人路过，只会把眼神挪开，像我已经半只脚踏进坟墓。\n\n只有她停下来。\n\n她先看见的不是我这个人，而是我手里那本书。她看著我，像在衡量一件东西值不值得从地上捡起来。我那时候其实该讨厌那种目光的，可我没有。因为那不是怜悯。那是判断，是承认，是一句无声的——妳还能用。\n\n后来我才知道，对蕾米莉亚而言，那已经很接近温柔了。\n\n她把我从那场饥荒里带走，给我药，给我灯，给我够用的时间与纸。她没有说什么漂亮话，也从不保证明天一定会更好。她只是把活下去的条件丢到我面前，然后看我自己能走到哪一步。\n\n我走到了今天。\n\n所以当她合上报告，淡淡说一句「做得好」时，我胸口那种讨厌的闷意还是浮了上来。真可笑。我明明早就知道，她不是会把情感放在语句表面的人。\n\n可我还是会在意。\n\n因为从她在书店门口停下来的那一刻起，我看著的，就一直是她。"
scarlet.108.a:0 "她先看见了我的书，后来我才学会一直看著她。"

scarlet.109.t:0 "图书馆深处的身影"
scarlet.109.d:0 "我回到图书馆时，小恶魔正在替我收拾桌面。她看了我一眼，没有多问，只把烛台往我手边推近半寸。她有时候聪明得让人烦。\n\n我坐下，指尖压著那本最旧的书，却没有立刻翻开。脑子里浮上来的，反而是红魔馆这些年的样子。\n\n门是美铃守著的，走廊是咲夜撑起来的，地下室锁著芙兰，图书馆则由我维持运转。每个人都在自己的位置上，把一座本来只像流亡者暂居之地的馆，慢慢变成了真正能向外伸手的城。\n\n而她始终站在最前面。\n\n蕾米莉亚总是那样。她明明背著最多的东西，说出口时却仍像在开玩笑；她可以冷酷，也可以残忍，能把命令说得像一场宴会的邀请。旁人只看见她坐在高处，像天生就该是王。只有离得够近的人才知道，那个位置不是天生的，是她硬从命运手里抢来的。\n\n我知道她有多固执，也知道她有多累。\n\n知道她半夜还会去地下室，知道她看著芙兰时眼神会比平常更沉，知道她每往外扩一步，不只是为了权力，也是为了替那个妹妹多争一条未来。\n\n而我所能做的，就是把她需要的答案准时放到桌上。术式、工业、封印、药剂、整顿方案——我把自己变成最可靠的那部分，让她在需要的时候，知道图书馆会给她一个结果。\n\n感情这种东西，我一向不擅长表达。\n\n可若要我说，我这些年最习惯的一件事，大概就是抬头时，看见她还站在那里。\n\n那种感觉比任何公式都更像秩序。"
scarlet.109.a:0 "她站在最前面，而我早就习惯把答案送到她手里。"

scarlet.110.t:0 "不说出口也无妨"
scarlet.110.d:0 "我有时会想，若我更像人类一点，也许就该把那些话说出来。\n\n说我在意她。说我不是只因为契约、利益或红魔馆才留在这里。说我望著她的时间，比望著任何一页书都久。说从都柏林到现在，我心里一直有一部分是朝著她去的。\n\n可我终究没有说。\n\n不是因为那份感情不够深，恰恰相反。正因为它太深，我才知道，一旦说出口，就会把很多现在还能维持的东西推向另一种不稳定。蕾米莉亚的肩上已经压了太多东西，王座、战争、命运、芙兰、整座馆的未来。我不想再把自己的心也塞进她的手里，逼她替我做一个答案。\n\n何况，我大概早就得到答案了。\n\n只是那答案不是一句话，也不是一个名字。它藏在她愿意把图书馆交给我，藏在她需要时会直接走进来，藏在她看见我咳嗽时那一瞬停顿的目光里。她不说，我也不说。这样很好，至少比把一切摊开来，再看著它变得难看要好。\n\n所以就这样吧。\n\n我继续做我的事，继续算她要的答案，继续把红魔馆撑成她能用的形状。她往前走，我就在后面替她把书页翻到正确的位置；她若要与世界为敌，我就把世界拆成能被理解、也能被击穿的结构。\n\n至于那些没有说出口的东西——\n\n我会把它们放在心里，像把一本不给外人看的书，收进最深的书架。\n\n默默地守著。\n默默地看著。\n\n只要她还在，我就会一直这么做。"
scarlet.110.a:0 "不说出口也没关系，我会一直在这里。"




 scarlet.111.t:0 "失败，黄金没有出现"
 scarlet.111.d:0 "火点下去后的前三秒，一切都还像帕秋莉算过的那样稳定。铜盘里的盐、灰与金属碎屑开始发亮，暗色液体沿着刻纹缓慢爬行，像一圈即将闭合的咒。小恶魔抱着记录板，连呼吸都放轻了。\n\n第四秒，颜色错了。\n\n那不是黄金该有的光，而是一种发冷的惨黄。帕秋莉的眼神立刻沉下去，手指在桌面敲了两下。\n\n「压力过快。」她说。\n\n「我就知道！」小恶魔刚喊完，铜盘中央猛地鼓起一个不该存在的球体，像金属与火焰一起得了病。下一瞬，整个炼成阵轰然塌掉。\n\n不是大爆炸，而是更糟的那种——高热、浓烟、失控增殖。黄得发绿的半流体像呕吐物一样从铜盘里喷出来，黏上书桌、地毯、书架，甚至还在沿途不断把碰到的金属变成一坨坨丑得发指的假金块。\n\n小恶魔一边尖叫一边拿封印布去盖：「这不是黄金！这是会传染的丑东西！」\n\n帕秋莉咳得眼前发黑，还是硬撑着抬手补阵。\n「闭嘴，先封门！」\n\n结果下一秒，假金块炸开了。\n\n整座实验室像被一只涂满金漆的拳头狠狠干了一下。天花板落灰，书页乱飞，窗框震得直响。等烟终于散了一些，大图书馆已经黄了一半。\n\n咲夜第一个推门进来，脚步只停了半秒。\n「……我能问这是新型建筑材料，还是单纯失控吗？」\n\n小恶魔趴在地上，满脸灰和金粉，虚弱地举手。\n「两者都有。」\n\n帕秋莉扶着桌沿站稳，看着那堆失败产物，脸色比平常更白。\n\n她想炼出启动工业的钱，结果先炼出了一场必须花钱收拾的灾难。\n\n黄金没有出现。\n\n出现的是一整间等着清理的炼金废墟，和一本必须重写的实验记录。"
scarlet.111.a:0 "先把这些鬼东西从书上刮下来。"



  scarlet.112.t:0 "红魔馆例行视察"
 scarlet.112.d:0 "红雾尚未散尽时，红魔馆往往已先一步醒来。走廊的烛火亮得整齐，石地干净得近乎冷硬，连女仆们交接器皿与文件的动作都看不出半分多余。蕾米莉亚从不喜欢事先通知视察，因为一旦提前准备，能看见的往往只剩下表面；只有在毫无预告的时候，馆内真正的秩序才会自己浮上来。\n\n门厅里，咲夜已经把库存、配给与巡查纪录整理妥当。她站在那里，像整座馆的时钟：精准、安静、没有借口。只要她还在，失序就很难在红魔馆里停留太久。\n\n正门外侧，红美铃依旧守著出入口。她手里扣著通行纪录，视线扫过来往的人影、货车与卫兵。她没有咲夜那种近乎苛刻的细致，却像一道厚墙，把试探、混乱与侥幸都挡在馆外。\n\n蕾米莉亚沿著长廊慢慢走过，披风在地面拖出一道深红的影。一路上没有人敢急著邀功，也没有人敢用夸张的忠诚换取她多看一眼。这场视察从来不是为了奖赏谁，而是为了确认：谁真正有资格站在红魔馆的秩序里。\n\n而当她停下脚步时，问题便自然落在所有人心头——这一轮视察，谁最值得被她记住？"
 scarlet.112.a:0 "咲夜，妳没让我失望。"
 scarlet.112.b:0 "没有我，这一切本就不会运转。"
 scarlet.112.c:0 "美铃，这道门妳守得很好。"

 scarlet.113.t:0 "芙兰的状况检查"
 scarlet.113.d:0 "地下室的门每次打开，红魔馆里最让人无法松懈的事物，往往都不是那道锁，而是芙兰朵露当下的状态。有时她很安静，像刚从很深的水底浮上来；有时她只是望著烛火出神，像在确认那些光会不会忽然失控；也有些时候，她只因一点微小刺激，呼吸与妖力就会一同乱掉。\n\n因此，检查成了不得不维持的惯例。\n\n帕秋莉将仪式纸、纪录本与限制术式一样样排开。她很清楚，这从来不是普通的不适，而是情绪、记忆与力量互相拉扯后留下的裂痕。任何一处波动，都可能沿著那道裂缝扩散。\n\n芙兰朵露坐在椅上，双脚悬空，手指却抓得很紧。她并非不愿配合，只是每一次检查，都像是在逼她再次碰触自己最危险的部分。她知道大家是在帮她，也知道所有人的帮忙背后，都始终带著提防。\n\n蕾米莉亚始终站在一旁，没有离开。她的神情很淡，像只是在旁听一次例行确认，可谁都知道，她其实比谁都更在意结果。毕竟芙兰不是能交给流程便算结束的麻烦，她是斯卡雷特家的妹妹，也是红魔馆最不能失手的一部分。\n\n每当这项检查再度开始，问题便只剩下——该由谁来主导这一次的判断。"
 scarlet.113.a:0 "让帕秋莉按她的方法来。"
 scarlet.113.b:0 "这件事，由我亲自看著。"
 scarlet.113.c:0 "芙兰，告诉我们妳现在的感觉。"

 scarlet.114.t:0 "图书馆的闲聊"
 scarlet.114.d:0 "大图书馆并不总是只有翻页声与咳嗽声。有些时候，午后的光会穿过高窗，落在书脊与灰尘之间，把整座图书馆照得像一座沉静的宫殿；而在那样的时刻，连谈话都会显得比别处更有重量。\n\n帕秋莉合上手里的书，指尖仍压在书角，像她只是暂时停下，而不是打算真正休息。对她来说，休息通常只是从一本书换到另一本书。\n\n蕾米莉亚坐在她对面，随手拨著茶匙。她不常承认自己喜欢这里，却总会在馆内最安静的时候走进图书馆。因为只有在这里，许多话不必被包装成命令，也不必刻意抬高声势。\n\n咲夜站在一旁，替两人换茶，又顺手把小恶魔偷偷堆高的书册往内推齐。她没有插话，却一直在听。主人说过的每一句话、帕秋莉每一次轻咳、书架上多出来的一丝凌乱，她全都不会漏掉。\n\n话题有时是新书，有时是物价，有时是馆外的人类与流言。三人的语气各不相同，却恰好把红魔馆的另一面拼了出来：知识、掌控，以及把一切缝回秩序的手。\n\n若要说这场闲谈里最值得被记住的是谁，答案恐怕从来都不只一个。"
 scarlet.114.a:0 "帕秋莉，妳总能看得比别人更深。"
 scarlet.114.b:0 "蕾米莉亚，连闲谈都像在掌握局势。"
 scarlet.114.c:0 "咲夜，妳连安静都整理得如此完美。"

 scarlet.115.t:0 "美铃送来的点心"
 scarlet.115.d:0 "只要地下室没有传出东西碎裂的声音，对红魔馆而言，就已经算得上是一段难得的平稳。\n\n红美铃隔些时候便会亲自端些点心下去。她端来的东西未必昂贵，也未必华丽，却总是把甜度、口感与份量调得恰到好处。她记得芙兰朵露有时喜欢酥的，有时只肯碰软的；有时会因为颜色高兴，有时又会盯著同一块糕点看上很久。\n\n门开著一条缝，芙兰就坐在里头。她的情绪并不总是稳定，但在闻到甜味的时候，那双眼睛常会先亮一下，接著才慢慢放下戒心。美铃从不把她当成需要哄的小孩，也不把她当成随时会炸裂的危险品，她只是很自然地把托盘放好，把叉子递过去，像这只是馆里再平常不过的一次探望。\n\n蕾米莉亚有时会站在一旁，看著妹妹试探性地咬下一口，再慢慢咬第二口。那种细小到几乎不值一提的安稳，反而比许多漂亮话都更有分量。\n\n芙兰朵露偶尔会抬起头，朝美铃露出一个短暂却真实的笑。地下室里没有掌声，也没有人会把这种事说成奇迹；但在红魔馆，能让危险暂时安静下来的温柔，本来就值得被记住。\n\n而这一次，又该把这份安宁算在谁身上？"
 scarlet.115.a:0 "芙兰，妳做得很好。"
 scarlet.115.b:0 "蕾米莉亚，只有妳最懂得怎么守著她。"
 scarlet.115.c:0 "美铃，妳的温柔比点心更有用。"

 scarlet.116.t:0 "美铃揹著帕秋莉出门巡查"
 scarlet.116.d:0 "馆外的工事、仓储配置与术式刻印，总有些部分必须由帕秋莉亲自确认。旁人看图只能看见数字与位置，只有她能一眼看出哪一道刻印差了一笔、哪一段墙面少了一层处理，又会在什么时候开始出问题。她不信任含糊其词，也不接受把缺口留到之后再补。\n\n可她的身体从来不会因她的意志而变得合作。\n\n于是红美铃半蹲下来，语气平稳得像在说一件再自然不过的小事：「上来吧，我揹妳过去。」帕秋莉向来不喜欢这种过于直接的帮助，可美铃不催也不劝，只是维持那个姿势，耐心等她做决定。最后，帕秋莉总还是会伏上去，手指抓住她肩头，冷冷补上一句：「别晃。」\n\n蕾米莉亚有时站在台阶上看著这一幕，唇角带著一点若有若无的笑。她不阻止，也不多说。红魔馆本就不是一群完美之人组成的地方；也正因如此，那些不够漂亮、却足够实际的承接，反而更显得可贵。\n\n一路上，美铃走得很稳，帕秋莉则一边伏在她背上，一边照常指出沿路的问题。她的语气还是挑剔，美铃的回应还是平静，像这样的巡查早已成了两人之间一种奇特却稳固的默契。\n\n而当这趟巡查结束，谁最值得因这件事被记上一笔，答案也就落在眼前。"
 scarlet.116.a:0 "帕秋莉，妳连虚弱时都不肯放过任何细节。"
 scarlet.116.b:0 "蕾米莉亚，这座馆终究是依妳的意志在运转。"
 scarlet.116.c:0 "美铃，妳比看起来更可靠得多。"

  scarlet.117.t:0 "红魔馆的例行视察"
 scarlet.117.d:0 "红魔馆的清晨依旧安静，只是那份安静，已经和过去有些不同了。走廊的烛火、女仆们的脚步、门厅里整齐堆放的纪录册，一切仍旧精准而冷冽，但在这些毫无偏差的秩序之中，已经多出一种不必说出口的默契。\n\n咲夜站在门厅中央，手中的名册与库存纪录被整理得一丝不乱。她依旧像红魔馆的钟表，把每一道流程、每一次交接、每一处细节都压回正确的位置。只是如今，当她抬眼望向正门时，那目光不再只是检查，而更像是在确认另一道防线是否也同样稳固。\n\n门外的红美铃仍守在原来的位置。她照旧记录出入、核对货物、检查卫兵轮换，可她和咲夜之间已不再像从前那样，只靠命令与回报维持关系。很多时候，一个眼神、一句很短的提醒，甚至只是交接时多停留半秒，对方就已经明白该补上哪一处缺口。那种默契不张扬，也不柔软，却正好让红魔馆的内外两道秩序接得更紧。\n\n蕾米莉亚沿著长廊走来，披风扫过地面。她看著这座馆仍旧照她的意志运转，也看见那些曾经彼此错开的人，正在逐渐长成可以互相承接的形状。她从不把这种事说成温情；在她眼里，这只是秩序终于有了更牢固的骨架。\n\n而当这场视察走到尾声，问题便再次落下——如今这座红魔馆里，谁最值得被记上一笔？"
 scarlet.117.a:0 "咲夜，妳让整座馆保持锋利。"
 scarlet.117.b:0 "能把这一切串起来的，终究只有我。"
 scarlet.117.c:0 "美铃，妳和咲夜把门内门外都守住了。"

 scarlet.118.t:0 "芙兰的状况检查"
 scarlet.118.d:0 "地下室依旧安静。可这份安静，已经不再像过去那样只是暂时的平稳，而更像某种被过度消耗后留下的空白。\n\n芙兰朵露坐在椅上，双手放在膝上，姿势很端正，甚至安静得有些过分。她不再因为一点细小刺激就立刻颤动，也很少忽然抬头露出警惕或困惑的神色。她只是看著前方，目光落得很远，像是有些东西还在她眼里，却已经很难真正映进心里。\n\n帕秋莉把仪式纸与纪录本摊开时，动作比往常更慢。她当然看得出来，这种平稳并不值得轻易放心。力量没有真正消失，情绪也不是被治愈了；只是那些原本会掀起波澜的东西，如今像沉进了更深的地方。她知道这比单纯的失控更麻烦，因为沉默并不代表痊愈。\n\n蕾米莉亚始终站在一旁，神情比过去更冷。可帕秋莉很清楚，那不是无动于衷，而是压得太深。她偶尔会在翻页的间隙抬眼，看向馆主的侧脸，再低头把记录补得更仔细一些。比起单纯确认芙兰的状况，她如今更在意另一件事——若这样的安静继续下去，蕾米莉亚还能撑著那张若无其事的表情多久。\n\n芙兰依旧没有说太多话。地下室里只有纸页翻动、笔尖划过纪录本的声音，还有那种让人不知该称之为稳定，还是空洞的沉寂。\n\n而当检查重新开始时，该由谁来主导这一次的判断，也再次成了问题。"
 scarlet.118.a:0 "让帕秋莉依她的方式继续。"
 scarlet.118.b:0 "这件事，我会亲自看著。"
 scarlet.118.c:0 "芙兰，哪怕只是一点也好，告诉我们妳的感觉。"

 scarlet.119.t:0 "图书馆里的午后"
 scarlet.119.d:0 "大图书馆仍是红魔馆里最安静的地方之一。午后的光穿过高窗，落在书脊、桌沿与茶杯上，把空气中的灰尘都照得一清二楚。这里依旧像一座与外界隔绝的沉静宫殿，只是如今，那份沉静之中多了一点不容易察觉的牵挂。\n\n帕秋莉合上书，抬手扶了一下额角。她还是习惯坐在书堆与术式笔记之间，把每件事拆成足够精确的条目来处理；可当蕾米莉亚走进图书馆时，她的视线已不再只是短暂掠过，而会下意识多停留一瞬，确认对方的神色、语气，甚至是坐下时那一点比平时更轻的动作。\n\n蕾米莉亚坐在她对面，仍像往常一样漫不经心地拨著茶匙，像是来消磨时间，又像只是单纯想待在这里。她嘴上不会承认自己需要这样的片刻，可帕秋莉很清楚，馆主并非不会疲惫，只是不允许自己在别处显露出来。\n\n咲夜照例站在一旁替两人换茶。她并不插话，但她也已经习惯了这种场面：一位不愿说自己累，一位看出来了却不会直白点破。她只是把温度刚好的茶放下，把过多的声音与多余的打扰都隔在外面，替这场安静留出可以停靠的空间。\n\n有时三人谈的是馆内新近添购的书册，有时是外头的流言与物价，有时则只是很短、很淡的几句闲话。可红魔馆真正珍贵的，或许正是这种时刻——不必高声，不必命令，也不必伪装得比实际更坚强。\n\n而在这样的午后里，最值得被记住的是谁，往往并没有那么容易分清。"
 scarlet.119.a:0 "帕秋莉，妳看得不只是一页书。"
 scarlet.119.b:0 "蕾米莉亚，连沉默都还是妳的领域。"
 scarlet.119.c:0 "咲夜，妳总能让一切恰到好处。"

 scarlet.120.t:0 "送往地下室的点心"
 scarlet.120.d:0 "红美铃仍会定期把点心送到地下室去。只是如今，这已经不只是为了哄芙兰朵露高兴，而更像一种小心翼翼维持联系的方式。\n\n托盘上的东西依旧细心地调过甜度与口感。美铃记得芙兰以前对这些细节很敏感，哪怕只是一点颜色差异，都可能让她露出很直接的反应。可现在，门打开之后，坐在里头的少女往往只是安安静静地看过来，眼神落在托盘上，又很快移开，像是知道那是为她准备的，却很难真的生出明亮的情绪。\n\n美铃不会因此露出失望。她仍然把托盘放好，把叉子递过去，语气和平常一样，仿佛这只是一件再普通不过的事。她知道，有些时候，太刻意的温柔反而会让人更难靠近；倒不如把关心藏进这些平稳的动作里，让对方至少还能感受到，自己没有被放著不管。\n\n蕾米莉亚站在一旁，看著芙兰慢慢拿起叉子，动作很轻，也很慢。妹妹不再像以前那样因为一点甜味就短暂露出高兴的神情，更多时候，只是安静地咬下一口，再咬第二口，像是在完成某种被交代下来的事情。这种平静并不让人安心，却又比空著不动更令人不敢移开视线。\n\n地下室里没有谁说太多话。可正因如此，那些没有被说出口的东西反而变得更重：美铃的耐心、蕾米莉亚压下去的心绪，还有芙兰那双仿佛离这里很远的眼睛。\n\n而这一次，谁最值得因这段短暂的相处被记上一笔，答案又落回了眼前。"
 scarlet.120.a:0 "芙兰，妳愿意吃下去就很好。"
 scarlet.120.b:0 "蕾米莉亚，妳从来没有离开过她身边。"
 scarlet.120.c:0 "美铃，妳的耐心比点心更珍贵。"

 scarlet.121.t:0 "帕秋莉的馆外巡查"
 scarlet.121.d:0 "馆外的工事与仓储安排仍然需要有人亲自确认，而这种事，帕秋莉向来不愿只靠别人的回报。她知道哪些刻印差了一笔，知道哪一面墙若少一道处理，日后就会留下隐患。她对细节的要求没有变，身体的虚弱也同样没有变。\n\n于是，红美铃仍像往常那样半蹲下来，把背留给她。只是和过去不同的是，这已经不再是一件带著明显尴尬的事。帕秋莉依旧会皱眉，依旧会冷淡地提醒一句别晃，可她已不再真的抗拒这份帮助；而美铃也早就懂得，什么时候该回嘴一句，什么时候只要安安静静把人稳稳背起来就够了。\n\n蕾米莉亚有时会站在台阶上看著她们出门。帕秋莉趴在美铃背上，还在路上挑出沿途的细节问题；美铃则一步一步走得很稳，把她那些挑剔与不满一并背过去。这画面说不上体面，却有种红魔馆特有的可靠——每个人都带著裂缝，却还是能把别人的重量接住。\n\n而比起巡查本身，帕秋莉其实也越来越在意每次回程时，蕾米莉亚是否仍站在原处。她不会把这种事说出口，只会在看见馆主仍在时，把原本压得过紧的眉头稍微松开一些。\n\n当这趟巡查告一段落，谁最值得因此被记上一笔，问题也就自然留下。"
 scarlet.121.a:0 "帕秋莉，妳连虚弱时都不肯放过任何漏洞。"
 scarlet.121.b:0 "蕾米莉亚，妳始终是她们回头要确认的人。"
 scarlet.121.c:0 "美铃，妳把别人的重量背得很稳。"

 scarlet.122.t:0 "废墟上的伞"
scarlet.122.d:0 "阳光落在断墙之间，也落在蕾米莉亚身上。\n\n那座旧城堡已经只剩残垣断壁，石缝里长满了草，爬藤沿着塌陷的塔楼往上走，像这片废墟自己也在慢慢把伤口缝起来。可阳光对吸血鬼没有半点慈悲。它落在蕾米莉亚的肩头、手背、侧脸，发出细微却清楚的滋滋声，像要把她一路走来的胜利与疲惫，一起烙进皮肤里。\n\n她没有躲。\n\n她只是站在那里，看着这座自己长大的地方，看着这场漫长征服最后剩下的安静。\n\n咲夜、美铃、帕秋莉和小恶魔就是在这时走到她身后的。\n\n先开口的是美铃。她看着蕾米莉亚站在太阳底下，皱了皱眉，还是把那把早就准备好的伞撑开，往前递去。\n\n「大小姐。」她说得很轻，「妳已经赢了，不用再跟太阳较劲了。」\n\n蕾米莉亚没有立刻接，只是偏头看了她一眼。\n\n咲夜站在另一侧，语气一如既往地平稳。\n\n「请别在这种时候让自己受伤。」\n\n帕秋莉没有催，只看着那片废墟，慢慢咳了一声。\n\n「这里不像家。」她说。\n「更像一具被时间啃空的骨头。」\n\n「但至少是她曾经有过的骨头。」小恶魔低声接了一句。\n\n风从断墙间吹过去，带起一点草叶和灰。众人都安静了一会儿。\n\n他们看着蕾米莉亚，也看着这座旧城。直到这一刻，他们才更清楚地意识到——原来在认识他们之前，蕾米莉亚和他们一样，也曾是个没有家的人。她不是天生就该坐在王座上的，她也是一路被赶、一路失去、一路把自己从废墟里拖出来的人。\n\n美铃望着那断掉的塔楼，忽然笑了一下，笑意却很轻。\n\n「说起来，我们几个也都差不多。」\n\n「谁不是被大小姐捡回来的。」小恶魔晃了晃尾巴，「虽然她捡人的态度都不怎么温柔。」\n\n咲夜没有否认，只低声说了一句。\n\n「没有大小姐，就没有今天的红魔馆。」\n\n帕秋莉看着蕾米莉亚终于抬手，把伞接了过去，目光也沉了一点。\n\n「她傲慢，残忍，自我中心。」她说。\n「但她确实是个优秀的领导者。」\n\n「也是个不错的家人。」美铃补上。\n\n没有人反驳。\n\n因为他们心里都很清楚，自己会站在这里，不是因为命运把他们放到一处，而是因为蕾米莉亚把他们一个个从各自的废墟里捞了出来，给了他们可以跟随的方向，给了他们一个能称作“自己人”的地方。\n\n于是最后，蕾米莉亚撑着伞，站在这座旧城的废墟上，听见身后那些她最熟悉的人，用并不整齐的沉默说出同一个意思——\n\n我们都是蕾米的人。"
scarlet.122.a:0 "把伞撑好，别让太阳先赢。"

scarlet.123.t:0 "回家去看妹妹"
scarlet.123.d:0 "伞撑开之后，阳光终于被挡住了一半。\n\n蕾米莉亚站在阴影里，没有再看天。她的目光慢慢从断裂的墙、塌陷的走廊、被草吞掉的庭院上收回来，像把一段太长的过去一点点关进脑海深处。\n\n「结束了。」她低声说。\n\n这句话不是宣言，更像一种确认。\n\n打到这里，征服也好，复仇也好，回到旧故乡也好，能做的几乎都做完了。她把曾经把自己逐出去的世界踩在脚下，也重新站回了故事开始的地方。可真正重要的人，并不在这里。\n\n芙兰不在。\n\n这个念头一浮上来，所有人的表情都跟着安静了一点。\n\n美铃先把视线移开，望向远处的荒草。\n「可惜妹妹大人没来。」\n\n咲夜低下眼，像在确认一个谁都不想说得太重的事实。\n「她若在这里，也未必会高兴。」\n\n帕秋莉把手拢进袖子里，声音比平常更低。\n「旧城只是旧城。真正需要她的地方，不在这里。」\n\n小恶魔轻轻点了点头。\n「在家里。」\n\n那一句“家里”说出来时，连废墟的风都像停了一瞬。\n\n蕾米莉亚握着伞柄，没有说话。可她知道她们说得对。她花了这么久回到这里，不是为了在断墙前多站一会儿，也不是为了让自己的过去终于有个像样的结尾。\n\n她最该做的事情，从来都还在红魔馆里。\n\n在那道地下室的门后。\n在那个被封印压平、被安静困住、还在等着姐姐回去的妹妹身边。\n\n她缓缓转身，披风擦过碎石，伞沿把阳光切开一条整齐的线。\n\n「走吧。」她说。\n\n没有谁问去哪里。\n\n咲夜自然地站到她左后方，像那把永远收在鞘里的刀。美铃活动了一下肩，像准备重新准备去守门。帕秋莉把视线从废墟上收回来，不再看那段已经结束的旧历史。小恶魔则快步跟上，顺手把掉在地上的一小块旧砖踢回草里。\n\n他们都知道，真正属于他们的地方不是这座烧毁的老城堡。\n\n而是红魔馆。\n\n那里有他们一起撑起来的秩序，有他们各自的位置，也有那位不在场、却始终是这一切核心的妹妹大人。\n\n蕾米莉亚最后回头看了一眼自己的故乡。\n\n然后她说：\n\n「回家。」\n\n这一次，没有人再停下来。"
scarlet.123.a:0 "回去看芙兰。"

scarlet.124.t:0 "封印解开之时"
scarlet.124.d:0 "地下室的门缓缓打开时，连空气都像不敢先动。\n\n芙兰朵露坐在房间中央，背挺得很直，手放在膝上，眼里空得像一层冻住的湖。那些年里，她被封印、被压平、被磨成一个不会失控、也不会真正活着的壳。玩偶整整齐齐地围在她身边，像一群不会呼吸的见证者。\n\n帕秋莉站在门边，指尖停在最后一道术式上，脸色比纸还白。她很清楚，一旦解开这层封印，回来的人不会是那个安静乖顺的空壳，而是被压抑太久、被关得太久、把所有痛苦、愤怒、委屈与渴望都塞进骨头里的真正芙兰。\n\n「准备好了？」她低声问。\n\n蕾米莉亚没有回头。\n\n她只是看着妹妹，看着那张自己最熟悉、也最不愿再看见空洞的脸。\n\n「解开。」\n\n帕秋莉闭了闭眼，把最后一道符文从门框与额前一起抹去。\n\n下一瞬，芙兰的瞳孔猛地收缩。\n\n像死水被突然砸开。像被冻住的血重新流动。她先是眨了一下眼，然后呼吸乱了，肩膀也跟着抖了一下。那些被压了太久的情绪，不是慢慢回来，而是一起撞进她的身体里——恐惧、委屈、依赖、愤怒、被锁住的漫长时光、被当成灾厄看待的每一秒，全都在这一刻活了过来。\n\n「……姐姐？」\n\n她终于叫出了这一声，声音发颤，像快哭了。\n\n可下一秒，整间地下室开始崩裂。\n\n不是因为她想破坏，而是她已经控制不住。墙壁先裂开，玩偶在半空被撕碎，桌椅像被看不见的手揉烂，连空气都发出刺耳的碎裂声。芙兰抱住自己的头，眼泪刚掉下来，力量却已经朝四周炸开。\n\n「我停不下来……」她喘着气，声音一下高一下低，「姐姐，我停不下来！」\n\n咲夜和美铃同时冲上前一步，却被蕾米莉亚抬手拦住。\n\n她没有退。\n\n她只是一步步走向那团正在失控的风暴，帽子被撕开，手臂被碎裂的石片划出血痕，眼神却稳得吓人。\n\n「看着我，芙兰。」她说。\n\n芙兰抬起头，满脸都是泪，翅膀与力量一同失控地震颤。她想扑过去，想抱住姐姐，想把自己缩回那个最熟悉的人怀里，可她的手才一抬，地面又炸开一道裂口。\n\n红魔馆众人全都明白——这一刻，已经不能再拖了。\n\n要么，蕾米莉亚用身体去接住这场灾厄，用血与命把妹妹从疯狂里唤回来。\n要么，她用自己的技巧与力量把这一切压住，把芙兰重新逼回命运的岔路口。\n\n地下室的碎石还在下落。\n芙兰哭着看着姐姐。\n而蕾米莉亚，终于必须在爱与控制之间，做出最后的选择。"
scarlet.124.a:0 "我来接住你——哪怕代价是我的命"
scarlet.124.b:0 "先把她压住，再替她选择未来"

scarlet.125.t:0 "以血唤回的妹妹"
scarlet.125.d:0 "蕾米莉亚没有闪。\n\n芙兰失控的那一瞬，她反而更快地往前踏了一步。不是进攻，而是拥抱。那股足以撕裂墙壁、捏碎整座地下室的力量，先撞上了她的肩、胸口、腹侧，把她整个人打得几乎站不稳。血一下就涌了出来，染红裙摆，也染红芙兰发抖的手。\n\n「姐、姐姐……」\n\n芙兰彻底慌了。她最怕的事情终于还是发生了——她又在伤害姐姐。她拼命想把力量收回去，可情绪越乱，破坏就越猛。石块、木屑、玻璃和扭曲的空气一起乱飞，整座房间像在崩塌边缘尖叫。\n\n可蕾米莉亚还是不退。\n\n她一边咳血，一边伸出手，硬是按住了芙兰的脸，让妹妹那双被恐惧与疯狂冲得破碎的眼睛，只能看着自己。\n\n「看着我。」她低声说。\n\n「不是看这些，不是看你做坏了什么，不是看你有多可怕。」\n\n她的声音已经很轻，像一碰就会断，可每个字都还撑着。\n\n「看着我，芙兰。」\n\n芙兰哭得发抖，翅膀乱颤，牙齿都在打战。她想把姐姐推开，怕自己再多碰一下就会把姐姐真的弄死。可蕾米莉亚却更近地抱住了她，把自己整个送进那场风暴中心。\n\n「你不是怪物。」\n「你也不是灾难。」\n「你是我妹妹。」\n\n这句话像一根钉子，终于钉进芙兰已经快散开的心里。\n\n力量还在暴走，可方向开始乱了。那些原本朝四面八方撕开的破坏，渐渐只剩下颤抖。芙兰死死抓住蕾米莉亚的衣服，哭得几乎喘不上气。\n\n「我不要你死……」\n\n蕾米莉亚的身体已经很冷了。她知道自己撑不住太久。可她还是笑了一下，笑得疲惫，却又像终于放下了什么。\n\n「那就活得像个正常的吸血鬼。」她说。\n「去哭，去笑，去闹，去咬人，去讨人厌，去活下去。」\n\n芙兰的力量终于一点点收了回去。\n\n不是被封印压回去，不是被规则按回去，而是她自己在姐姐的血和声音里，硬生生把那股疯意拉住了。她的眼神慢慢聚焦，呼吸乱得不像样子，却终于不再像刚才那样随时会把世界一起拖进毁灭里。\n\n而蕾米莉亚在她怀里一点点失去力气。\n\n最后，她只是摸了摸芙兰的头，像很多很多年前一样。\n\n「这次……别再问我你乖不乖了。」\n\n「你只要活成你自己。」\n\n芙兰发出一声像孩子一样破掉的哭喊，紧紧抱住姐姐。地下室终于安静下来，只有血还在一滴一滴落。\n\n红魔馆救回了芙兰。\n\n代价，是女王亲手把自己的命，塞回了妹妹已经快要死掉的心里。"
scarlet.125.a:0 "她用命，把妹妹从灾厄里抱了回来"

scarlet.126.t:0 "被压住的翅膀"
scarlet.126.d:0 "蕾米莉亚动了。\n\n她没有后退，只是侧身让开。芙兰那一下足以把地下室拦腰捏碎的力量，从她耳侧擦过，轰穿后方墙壁。碎石、灰尘与断裂的符文一起崩落，咲夜和美铃立刻护住帕秋莉与小恶魔。\n\n可蕾米莉亚没有倒下。\n\n她快得近乎优雅，也冷得近乎残忍。披风掠过裂开的地面，她一折、一转、一让，从那股连空气都在崩坏的力量中穿了过去。\n\n芙兰还在哭。\n\n她的眼睛终于恢复了光，却不是平静，而是被封印压抑太久后一次性涌出的恐惧、痛苦与失控。\n\n「姐姐！」\n\n她喊得像求救，也像警告。\n\n「不要过来……我停不下来！」\n\n蕾米莉亚没有听。\n\n下一瞬，她已经逼到芙兰面前，一掌按住她的肩，另一只手精准扣住她翅膀与核心力量之间最敏感的位置。不是拥抱，不是安抚，而是压制。\n\n「停下。」蕾米莉亚命令道。\n\n芙兰剧烈挣扎，水晶般残破的翅膀颤得像要裂开。墙面继续龟裂，玩偶被震成碎布，地面像被无形的爪子撕开。可蕾米莉亚太熟悉她了，熟悉到知道哪一瞬该闪，哪一处该挡，哪一道力量还没成形就该被打断。\n\n这不是胜利。\n\n这只是姐姐对妹妹太了解后，形成的一种残酷技巧。\n\n终于，芙兰被硬生生按跪在地上。她双手撑着碎裂石板，哭得几乎喘不过气。那双眼睛不再呆滞，却也不再安全。她回来了，也把所有被压抑的痛苦与破坏欲一并带了回来。\n\n蕾米莉亚慢慢松开手。\n\n地下室没有完全崩塌，她也没有受伤。\n\n可所有人都明白，这不叫解决。\n\n帕秋莉靠着小恶魔，脸色白得厉害。\n\n「再这样下去，只会重复。」她低声说。\n\n蕾米莉亚没有回答。\n\n帕秋莉继续道：\n\n「封印会把她变成空壳。」\n「解开封印，她又会被自己的力量撕碎。」\n「你可以继续压住她，但那不是救她。」\n\n芙兰跪在碎石与布偶残片之间，肩膀发抖。她像终于明白，自己还在牢笼里。只是这一次，牢笼不是铁门与符文，而是她自己的力量。\n\n蕾米莉亚低头看着妹妹。\n\n很久后，她才开口。\n\n「所以呢？」\n\n帕秋莉咳了一声。\n\n「来大图书馆。」\n\n她抬眼，目光冷静得近乎残酷。\n\n「我有两个方法。」\n「都能让她离开地下室。」\n「也都不是干净的答案。」\n\n咲夜沉默，美铃握紧拳，小恶魔没有笑。\n\n蕾米莉亚俯身，把芙兰抱了起来。芙兰很轻，轻得不像刚才差点毁掉整座地下室的人。\n\n「姐姐……」她小声叫。\n\n蕾米莉亚抱紧她，声音仍旧平稳。\n\n「别怕。」\n\n她没有说没事。\n\n因为事情远远还没结束。\n\n红魔馆众人离开地下室，走向大图书馆。真正的结局，还在帕秋莉的书页深处等着她们。"
scarlet.126.a:0 "去大图书馆。帕秋莉会给出最后的方案。"

 scarlet.127.t:0 "王座没有空下"
scarlet.127.d:0 "蕾米莉亚死后，整个红魔馆沉默了很久。\n\n没有人敢先开口。王座还在，旗帜还在，帝国还在，可那个总是站在最前面、用傲慢与意志把一切压住的人，已经不在了。她留下的不是一座空掉的城，而是一个被血与战争、征服与牺牲硬生生撑起来的世界。\n\n而芙兰朵露，活了下来。\n\n像一个奇迹，也像一道伤口终于停止流血。\n\n姐姐用自己的命，把她从崩坏边缘拉了回来。那之后，芙兰朵露不再是被锁在门后的灾厄，不再是随时会把一切都捏碎的恶魔。她依旧是吸血鬼，依旧是斯卡雷特家的妹妹，可她终于能看清眼前的人，能分清拥抱与破坏，能在想哭的时候哭，在想笑的时候笑，而不必再害怕自己的手先一步毁掉一切。\n\n她第一次坐上王座那天，比任何人想象中都安静。\n\n没有歇斯底里的笑，没有孩子气的胡闹，也没有试图学姐姐说话。她只是穿着不太合身的礼服，抬头看着站在殿下的咲夜、美铃、帕秋莉和红魔馆的众人，沉默了很久，然后很轻地说了一句。\n\n「姐姐已经很累了。」\n\n那句话让整个大厅低了下去。\n\n芙兰朵露没有否定姐姐留下的一切。她知道，这个帝国是蕾米莉亚亲手打下来的，是姐姐为了她，为了让她能活下去，才一路踩着火与血走到今天。她不会背叛那份意志，也不会让斯卡雷特这个名字在自己手里衰落。\n\n咲夜仍旧站在她身后，像守着两代斯卡雷特的刀。美铃守着门，沉默得比平常更稳。帕秋莉望着王座上的新主人，没有说话，只把那句判断压回了心里——\n\n那个被关在地下室里的孩子，已经结束了。\n\n从今天起，坐在这里的是芙兰朵露·斯卡雷特。\n\n也是斯卡雷特帝国新的主人。"
scarlet.127.a:0 "王座没有空下，它只是换了新的主人。"

scarlet.128.t:0 "千年的斯卡雷特"
scarlet.128.d:0 "新的统治开始后，世界很快发现，芙兰朵露并不像蕾米莉亚。\n\n红雾依旧覆盖着帝国，可不再只是警告，也成了庇护。旧日那些只会带来窒息的高压法令，被一条条改写；被征服的土地不再只学会服从，也开始学会如何活下去。粮食、学校、工坊、道路、医院与港口被重新整理，巡逻队的脚步不再只为了威慑，也为了让夜里真的不会再有人无声消失。\n\n芙兰朵露不像姐姐那样热衷于让所有人畏惧自己。她更喜欢走进花园、街道与长廊，亲眼看看这个世界如今变成了什么样子。她会蹲下来听孩子说话，会在重建中的城市上空停很久，会在议会里突然问出谁也没准备好的问题。\n\n她的治理方式因此显得古怪，却也出奇有效。因为她不喜欢把人逼到绝路。她比任何人都清楚，被关起来、被压抑、被当成危险本身是什么感觉。所以她留着帝国的锋，却慢慢磨掉了那层只会让人窒息的刺。\n\n人们后来常说，蕾米莉亚征服了世界，而芙兰朵露学会了让世界留在手中。\n\n前者像雷霆，后者像长夜过后的火。\n\n斯卡雷特这个名字并没有因为第一位女王的死而结束，反而在第二位女皇手中，真正走进了千年的岁月。帝国没有坍塌，没有在胜利之后腐烂，也没有在权力交替中四分五裂。它像蕾米莉亚当年执拗地想要证明的那样，终于屹立在世界之上。\n\n而每当夜深，芙兰朵露仍会独自走进那间放着旧王座与旧披风的房间，安静地站一会儿。\n\n她没有忘记姐姐。\n她永远不会忘记。\n\n因为她知道，自己如今能这样坐在光下，能这样看着一个不再逼她发疯的世界，全都是那个人亲手替她换来的。\n\n所以她会继续活下去，继续统治，继续让斯卡雷特这个名字，沿着姐姐未竟的意志，在这个世界上延续下去。\n\n一年，又一年。\n\n直到千年以后，世人仍会记得——帝国并没有随着旧日女王的死去而终结。\n\n它在芙兰朵露这位英明的女皇手中，真正成为了永恒。"
scarlet.128.a:0 "斯卡雷特的夜，将长存于世界。"



 scarlet.129.t:0 "献给红月的葬礼 上"
scarlet.129.d:0 "那一天，红魔馆没有升起往常那样锋利的红雾。\n\n天色低着，风也很轻，像整座世界都知道今天不该太吵。黑纱垂在长廊与高窗之间，白玫瑰与深红玫瑰一同铺满石阶。那口棺木被安放在大厅中央，木面漆得深，银饰冷得发亮，像她生前那种优雅又不肯低头的样子。没有人敢说她只是“睡着了”，因为所有人都知道——这一次，蕾米莉亚·斯卡雷特是真的不会再睁开眼了。\n\n红魔馆的所有人都到了。\n\n咲夜站得最直。她穿着一身漆黑的女仆服，手套也是黑的，像把平日里一切多余的洁白都一起收了起来。她先开口，声音很稳，稳得像不容许自己在这种时候碎掉。\n\n「大小姐把我从无处可去的地方捡回来，给了我名字，给了我位置，也给了我活下去的方式。」\n\n她望着棺木，没有低头。\n\n「很多人怕她，很多人恨她，很多人说她傲慢、残忍、自我中心。」\n\n「他们说得没错。」\n\n大厅里响起一阵极轻的、压不住的抽气声。可咲夜没有停。\n\n「但她也是我见过最了不起的主人。」\n「她会命令，会惩罚，会把人逼到极限；可她也真的会记住每一个被她留在身边的人。」\n\n说到这里，她的声音终于轻轻抖了一下。\n\n「若没有她，就没有今天的十六夜咲夜。」\n\n她停住，行礼，动作完美得像最后一次向主人回报。\n\n然后是红美铃。\n\n她走上前时，眼睛已经红了，鼻音也压不住。她平常总是笑，哪怕挨骂、受伤、守夜，都还能把语气放轻一点。可这一次，她没有笑出来。\n\n「大小姐啊……」她一开口，声音就先哑了。\n\n她吸了口气，像在和自己较劲。\n\n「我以前一直觉得，妳这个人真难伺候。」\n\n有人低低笑了一声，又很快忍住。\n\n「妳脾气坏，嘴又毒，吩咐起人来一点也不客气。」美铃看着那口棺木，眼泪终于掉下来，「可是，是妳把我从快死的地方捞出来，给了我一扇门，一个能站的位置，一个能让我继续守着别人的家。」\n\n她抹了一把脸，还是没抹干净。\n\n「妳不是什么好人，真的。」\n「可妳是我的大小姐。」\n\n她说完这句，就再也说不下去了，只能低头站到一边，肩膀还在轻轻发抖。"
scarlet.129.a:0 "第一声告别，献给她最忠诚的刀与门。"

scarlet.130.t:0 "献给红月的葬礼 中"
scarlet.130.d:0 "接着走上来的是帕秋莉。\n\n她本来就苍白，这天更像一张一碰就会碎掉的纸。她走得不快，像每一步都耗着力气。小恶魔想扶她，被她轻轻挡开了。她站到棺前时，先低头咳了一声，再抬眼看向里面那张安静得过分的脸。\n\n然后，她就哭了。\n\n不是红着眼眶，不是声音发哑，是根本压不住地哭。\n\n眼泪一颗一颗往下掉，掉得比她说出的话还快。她明明一直是最会忍、最会把自己缩进冷静里的人，可现在那些东西全都不见了。她看着蕾米莉亚，像看着自己最重要的一页被硬生生撕走。\n\n「……妳怎么能这样。」\n\n她开口时，声音已经碎了。\n\n「妳把我从都柏林捡回来，把书、药、灯、房间都丢给我，让我活下去，让我读，让我算，让我替妳把这个世界拆开。」\n\n她抬手抹眼泪，可越抹越多。\n\n「妳把我留在身边，留了这么多年……然后现在，妳就这样死了？」\n\n没有人说话。\n\n帕秋莉哭得最凶，凶得像要把这些年没说过的话全一起哭出来。\n\n「我还有很多事没跟妳说。」\n「我还有很多研究没做完。」\n「我还没——」\n\n她卡住了，喉咙像被什么扼住。最后她只是把额头抵在棺边，很久都没抬起来。\n\n「……蕾米莉亚，我讨厌妳这样。」\n\n那不是诅咒，也不是抱怨。\n那是一个一生都不擅长把心摊开的魔法使，最后能说出来的最深的哀伤。\n\n小恶魔在后面已经哭得跟着一起抽气了，却还记得把帕秋莉扶住。她自己也红着眼，声音轻得快听不见。\n\n「大小姐，图书馆会继续开着的。」\n「我会替帕秋莉大人看着，也会替妳看着。」\n\n大厅里没有人插话。因为谁都知道，这一刻，最痛的人不是失去主人，而是失去那个把自己从死地里捡回来、又让自己活成今天模样的人。"
scarlet.130.a:0 "第二声告别，献给她最沉默也最深爱她的人。"

scarlet.131.t:0 "献给红月的葬礼 下"
scarlet.131.d:0 "最后，轮到芙兰朵露。\n\n大厅里一下子静到连呼吸都很轻。\n\n她走得很慢，像每一步都还不习惯。她已经恢复了神智，也恢复了眼神，可正因为如此，她比任何人都更明白这里摆着的是什么。她站到棺木前，盯着姐姐看了很久，久到所有人都开始害怕她会不会突然说不出话。\n\n可她最后只是伸出手，很轻很轻地碰了一下棺木边缘。\n\n「姐姐。」\n\n她的声音很轻，轻得像小时候在地下室门后第一次喊出的那一声。\n\n「我现在……不会再问妳我乖不乖了。」\n\n她抬起头，眼睛通红，却没有失控。\n\n「妳叫我活成我自己。」\n「那我会活下去。」\n\n眼泪终于顺着她的脸掉下来。\n\n「我会把妳留下来的东西守住。」\n「所以，妳可以睡了。」\n\n这一次，连咲夜都忍不住偏开了脸。\n\n葬礼最后，红魔馆的钟声响了七次。\n\n棺木被缓缓抬起，穿过长廊，穿过花园，穿过那些她曾经走过无数次的地方。没有人高声哭喊，没有人扑上去失态挽留。因为所有人都明白，蕾米莉亚不会喜欢那种难看的告别。\n\n她该拥有的，是一场体面的送别。\n\n可即便如此，当棺木真正被送入墓园，第一把土落下去的时候，红魔馆还是彻底失去了它的主人。\n\n红月落了。\n\n但所有站在这里的人都知道，自己身上仍留着她亲手刻下的痕迹。从今以后，他们会继续活下去，继续守着这座馆，继续让斯卡雷特这个名字在世界上延续。\n\n可有些夜里，当风吹过走廊，吹过窗帘，吹过那张曾经空着又总会有人坐上的王座时，他们还是会想起那个傲慢、残忍、自我中心，却也把他们一个个从废墟里捡回来的吸血鬼。\n\n而那时，所有人都会知道——\n\n有些告别，是一辈子也说不完的。"
scarlet.131.a:0 "献给我们的大小姐。"



 scarlet.132.t:0 "以血维系的千年"
scarlet.132.d:0 "帕秋莉最终还是给出了方法。\n\n不是救赎，也不是奇迹。\n\n而是一条能用、能算、能维持，却丑陋得近乎诅咒的路：用庞大到足以淹没历史的鲜血，去喂养芙兰朵露体内那份失衡的力量，让她不再坠回疯狂的深渊。\n\n蕾米莉亚接受了。\n\n于是，帝国开始献祭。\n\n不是一次，不是一城，也不是一场会被写进报纸、让人哗然数日的屠杀。为了把芙兰从彻底崩坏中拉回来，为了让她维持住如今这副仍能说话、仍能微笑、仍能认出姐姐的样子，数以千万计的人被送上祭坛。血被抽干，名字被抹去，尸体被焚毁，运送、记录、封存、处理，全都变成了帝国日常运转的一部分。\n\n而这，还只是开始。\n\n从那以后，每一天都必须继续。\n每天都要有数万人的鲜血被送入红魔馆深处，送到那套帕秋莉亲手建立的仪式里。只有这样，芙兰朵露才能维持理智，才能不在夜里重新变回那个会把世界一起捏碎的恶魔。\n\n蕾米莉亚知道这有多难看。\n她知道自己在做什么。\n\n她只是已经不在乎了。\n\n帝国太大了。疆域太广，人口太多，铁路、矿山、港口、农庄、城市、殖民地与附庸国像血管一样铺满世界。对这样一个庞然大物而言，每天数万人的消失，足以让地方官僚用新账册盖掉，足以让工厂的烟和军队的脚步把真相压过去，足以让大多数仍活着的人假装一切照旧。\n\n表面上，一切都不会有事。\n\n红雾依旧覆盖天空。\n工厂依旧运转。\n军队依旧忠诚。\n芙兰朵露依旧坐在窗边，能看着姐姐，能轻声说话，能像一个真正活着的人那样存在。\n\n可帝国的裂痕，也从这一天起，真正扎进了根里。\n\n那些被抽血的人并不都沉默。那些被掠走亲人、被榨干村庄、被要求献出“帝国所需之生命”的土地，也并不都会永远低头。最初只是窃窃私语，是地下印刷物，是失踪的运输队，是被烧毁的征血站。后来，便会是枪，是炸药，是山里的旗，是城市巷口突然升起的火。\n\n他们会开始反抗。\n\n不是因为他们赢得了希望，而是因为活下去本身，已经比死更像羞辱。\n\n蕾米莉亚看得见这一切，却没有停手。她宁可让整个世界恨她，也不愿再让妹妹跌回疯狂。于是斯卡雷特帝国继续存在，继续扩张，继续辉煌，也继续把自己的根基，一点一点埋进剥削、奴役与献祭里。\n\n千年之后，或许城墙仍在，王座仍在，红魔馆的尖塔仍刺向天空。\n\n可那时，人们提起斯卡雷特这个名字，想起的不会是优雅，不会是高贵，也不会是女王征服世界的伟业。\n\n他们会想起祭坛，想起血槽，想起每天被运往红魔馆的成千上万条命，想起一个为了妹妹而不惜让全世界成为祭品的帝国。\n\n到那时，斯卡雷特将不再是令人敬畏的姓氏。\n\n而会成为所有人唾弃、诅咒、恨不得从历史里刮去的名字。\n\n可即便如此，蕾米莉亚也不会后悔。\n\n因为在这个结局里，她最终还是选了妹妹。\n\n只是她为此买下的，不是一个世界。\n\n而是这个世界对斯卡雷特永世不肯宽恕的恨。"
scarlet.132.a:0 "让世界恨我，也比失去妹妹更能忍受。"

scarlet.133.t:0 "帕秋莉提出的答案"
scarlet.133.d:0 "大图书馆里没有风，只有烛火在书页边缘轻轻摇晃。帕秋莉把最后一张写满公式与注释的纸推到蕾米莉亚面前时，连小恶魔都收起了笑。\n\n这不是普通的研究报告。\n\n这是芙兰朵露的未来。\n\n蕾米莉亚站在桌前，没有立刻伸手。她只是盯着那些复杂得近乎残忍的术式结构，像在看一把终于被磨出来、却同样会伤人的刀。\n\n帕秋莉先开口，声音很平，平得像怕多一点起伏都会让结论显得动摇。\n\n「我把所有可能都算过了。」\n\n她顿了一下，咳嗽压得很轻。\n\n「如果要让芙兰保持吸血鬼的本质，保持她现在的力量，同时又能离开封印、正常活动，不是做不到。」\n\n蕾米莉亚终于抬眼。\n\n帕秋莉的指尖点在第一份方案上。\n\n「但代价是供养。」\n「不是一杯血，不是一场仪式，而是每天都要有数以万计的鲜血灌进术式里，让她体内那股快要崩裂的东西一直维持在可控边缘。」\n\n烛火映在纸面上，像血在流。\n\n「只要帝国还在，只要领土、人口、运输和祭坛都还运转，这套东西就能继续。」帕秋莉说，「她可以走出来，可以说话，可以笑，可以像正常的吸血鬼一样活着。」\n\n她没有把后半句说轻。\n\n「但这会让整个帝国，变成她的血袋。」\n\n房间里安静了很久。\n\n蕾米莉亚没有立刻回应，只把目光移向第二份方案。\n\n帕秋莉也跟着看过去。\n\n「另一条路，」她说，「是剥掉她作为吸血鬼的根。」\n\n这一次，连小恶魔都低下了头。\n\n「我可以把她的力量一点点拆开，把那份过于庞大的破坏性从她身上拿走。她会失去那些危险的东西，失去吸血鬼的力量，也失去作为灾厄的可能。」\n\n帕秋莉的声音仍旧冷静，可越冷静，越显得这句话残酷。\n\n「代价是，芙兰不再是现在这个芙兰。」\n「她会变成人类。脆弱，有限，会受伤，会老去，甚至终有一天会死。」\n\n蕾米莉亚的手指终于收紧。\n\n帕秋莉看着她，把最后的话说完。\n\n「但她会真正安全。」\n「她可以拥抱别人，不必害怕弄坏谁；她可以走在阳光下，不再需要被锁起来；她可以哭，可以笑，可以活成一个普通而完整的人。」\n\n烛火轻轻响了一声。\n\n桌上摆着两条路。\n\n一条让芙兰继续作为吸血鬼活着，却要整个帝国每天替她流血。\n\n一条让芙兰成为人类，失去力量，失去斯卡雷特血脉最危险也最耀眼的那一部分，却能真正正常地活下去。\n\n帕秋莉没有催促。\n\n她只是低声说出结论。\n\n「蕾米莉亚，这一次没有第三个答案。」"

scarlet.133.a:0 "让她作为吸血鬼活下去——哪怕帝国每天都要为此流血。"
scarlet.133.b:0 "让她成为人类——失去力量，也换回真正平静的人生。"

 scarlet.134.t:0 "短暂的人类之梦"
scarlet.134.d:0 "仪式结束后，地下室安静得不像红魔馆。\n\n没有崩裂的墙，没有失控的力量，也没有那股随时会把世界捏碎的压迫感。芙兰朵露坐在椅子上，低头看着自己的手。那双手仍然很小，仍然属于蕾米莉亚最熟悉的妹妹，可它们已经不再带着毁灭一切的力量。\n\n帕秋莉成功了。\n\n她剥去了芙兰体内那份失衡的吸血鬼本质，也一并带走了她那可怕而美丽的破坏能力。水晶般的翅膀不再闪烁，尖锐的气息沉入无声，曾经让整个世界都必须警戒的恶魔之妹，如今只是一个脸色苍白、刚刚学会重新呼吸的人类女孩。\n\n芙兰抬头看向姐姐，眼神里还有不安。\n\n「姐姐……我还是我吗？」\n\n蕾米莉亚站在她面前，很久没有回答。\n\n她看见的当然还是芙兰。那是她的妹妹，是她曾经牵着逃过火光、穿过流亡、藏进地下室，又一次次想从命运手里抢回来的孩子。\n\n可她也知道，有些东西已经永远不一样了。\n\n芙兰会成长。\n会老去。\n会在数十年之后，像所有人类一样，慢慢走向生命的尽头。\n\n这不是封印，不是囚禁，也不是疯狂。她终于能拥抱别人，终于能在阳光下站立，终于能不再害怕自己一抬手就毁掉所爱之人。可代价是时间——那种短暂、脆弱、无法被王权与魔法轻易买回的时间。\n\n蕾米莉亚轻轻蹲下，握住芙兰的手。\n\n温热。\n柔软。\n不再危险。\n\n这让她几乎感到陌生。\n\n「妳当然还是妳。」她说。\n\n芙兰像终于松了一口气，慢慢靠进她怀里。那是一个真正的拥抱。没有术式警戒，没有咲夜按住刀柄，没有美铃绷紧肩膀，也没有帕秋莉在旁边计算下一次失控的临界点。\n\n只是妹妹抱住了姐姐。\n\n蕾米莉亚闭上眼，第一次没有命令自己立刻思考下一步。\n\n她赢了，也失去了。\n\n斯卡雷特帝国仍会继续。红魔馆的旗帜仍会高悬，世界仍会在她的统治下运转。她还有王座，还有军队，还有无数被红雾笼罩的土地。\n\n可数十年后，王座旁将不会再有芙兰。\n\n那时，蕾米莉亚仍会年轻，仍会高傲，仍会作为女王统治这个世界。可她会记得，有一个短暂的人类女孩曾坐在她身边，曾学着喝茶，曾在花园里慢慢走路，曾因为一束阳光、一块点心、一句普通的问候而笑得很开心。\n\n人类的生命如此短暂。\n\n短到吸血鬼只要一次漫长的沉睡，就可能错过他们半生。\n\n可也正因为短暂，他们才会如此认真地珍惜每一天。芙兰将不再拥有永恒，却第一次拥有了真正属于自己的日常。她不必再作为灾厄活着，也不必再被爱她的人关进黑暗里。\n\n蕾米莉亚低头，轻轻摸了摸妹妹的头。\n\n「那就好好活吧，芙兰。」\n\n她的声音很轻，轻得不像命令。\n\n「把妳剩下的时间，全部活成妳自己的。」\n\n芙兰抬起头，眼眶发红，却笑了。\n\n那一刻，蕾米莉亚终于明白——\n\n她没能让妹妹永远留在身边。\n\n但她终于让妹妹，真正活在了世界上。"
scarlet.134.a:0 "人类的生命很短，所以每一天都必须被珍惜。"

scarlet.135.t:0 "鲜红帝国的终章"
scarlet.135.d:0 "故事到这里，终于该合上了。\n\n红魔馆的旗帜曾越过山岭、海洋与旧世界的废墟；红雾曾笼罩列岛、东亚、欧亚大陆，最后回到那座被火焚毁的故乡。蕾米莉亚·斯卡雷特用傲慢、鲜血、意志与近乎疯狂的爱，建立了一个属于吸血鬼与妖怪的帝国。她曾反抗命运，曾征服人类，也曾为了妹妹，把整个世界都变成可以被她握住的筹码。\n\n这个帝国不会永恒。\n\n没有任何王朝真正永恒。再坚固的城墙都会被风雨磨裂，再锋利的军队都会在岁月里钝去，再高贵的姓氏也会被后来者重新解释。鲜红帝国终有一天会衰落、分裂、被推翻，或在漫长的和平中慢慢失去最初的形状。那些曾经让世界颤抖的命令，会变成档案；那些曾经照亮夜色的红月，会变成壁画、传说与史书里的注脚。\n\n但它确实存在过。\n\n它曾把被遗忘的怪物重新推上历史的王座；它曾让人类政权承认，夜色并非只能躲在文明的边缘；它曾以残酷的方式证明，幻想也能拥有钢铁、法律、军队与帝国。无论后世如何审判它——称它为暴政、奇迹、灾厄，还是妖怪最后一次宏大的反击——都无法抹去这段鲜红的痕迹。\n\n而在那所有辉煌与罪孽的中心，始终有一个名字。\n\n蕾米莉亚·斯卡雷特。\n\n她不是完美的君主，也不是温柔的救世主。她傲慢、残忍、自我中心，却又确实带着红魔馆的众人走过了最漫长的夜。她给了咲夜名字，给了美铃一扇门，给了帕秋莉活下去的灯，也用自己最极端的方式，替芙兰争来了一条未来。\n\n这就是鲜红帝国的结局。\n\n它会像历史上所有王朝一样，终有一日走向尽头。\n\n可当后世翻开泛黄的史页，看见红雾、王座、远征、废墟与那对斯卡雷特姐妹时，他们仍会明白——\n\n曾有一轮红月升上世界的天空。\n\n它燃烧过。\n\n也照亮过。"
scarlet.135.a:0 "感谢游玩《幻想乡：共存或灭绝》。"


