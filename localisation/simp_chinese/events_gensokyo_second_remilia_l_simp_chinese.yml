l_simp_chinese:



 scarlet_news.1.t:0 "《文文。新闻》特刊：红魔馆藏了第二个恶魔？！"
scarlet_news.1.d:0 "【文文。新闻／射命丸文 特别直击】\n\n各位读者，准备好发抖了吗？因为本报这次拍到的，不是普通的权贵秘闻，也不是哪家妖怪又在半夜偷搬东西——而是红魔馆最不能见光的那一位，终于露面了！\n\n没错，就是那个只存在于传闻里的名字：芙兰朵露·斯卡雷特！\n\n长年以来，关于她的说法多到能出一本怪谈集：有人说她被锁在地下室，不能见人；有人说她一发疯就能把整座馆拆掉；还有人信誓旦旦地说，红魔馆那些「处理得太干净」的事件，背后都有她的影子。以往这些都只是传闻——但现在，不是了。\n\n本报记者亲眼目击，并成功拍下这位「恶魔之妹」现身红魔馆走廊的决定性画面！\n\n首先，必须说明：她比想像中更小、更安静，也更让人发毛。不是那种张牙舞爪的可怕，而是另一种——像一把被包得很好、却谁都知道它能切开东西的刀。她走路很轻，停下来时也没什么声音，可只要她一抬眼，整条走廊都像跟著绷住。\n\n更有趣的是，她不是一个人出来的。\n\n她身边有蕾米莉亚，而且是由蕾米莉亚亲自带著。不是远远看著，不是让女仆代劳，而是像在带一件重要到不能离手的东西——或者说，一张终于可以翻开来打的牌。\n\n问题来了：为什么是现在？\n\n内战刚结束，红魔馆刚完成权力整合，外面还在议论新秩序到底稳不稳，结果这时候，那位被藏了不知多少年的妹妹突然现身。各位，这叫什么？这不叫巧合，这叫安排！\n\n红魔馆向来不做没有意义的事。她们连茶杯摆哪里都有讲究，更别提把一位传说级别的危险人物放到走廊上给人看。若这不是示威，那还能是什么？\n\n难道蕾米莉亚想告诉所有人：我不只坐稳王座，我手里还有更可怕的东西？\n\n还是说，这位妹妹已经被成功「调教」到足以公开展示，红魔馆准备让世人重新理解什么叫斯卡雷特家的真正力量？\n\n本报不能下定论——但本报可以肯定一件事：如果芙兰朵露·斯卡雷特过去一直被藏起来，那她今天的出现，就绝不是单纯的家庭散步。\n\n读者们，请记住这个名字。\n\n因为从今天起，红魔馆不再只有一位令人发冷的主人。\n\n还有一位，终于从门后走出来的——\n\n恶魔之妹。"
scarlet_news.1.a:0 "这新闻，够大。"

scarlet_news.2.t:0 "《花果子念报》特刊：被看见的妹妹，与被安排的现身"
scarlet_news.2.d:0 "【花果子念报／姬海棠果 特别观察】\n\n我们常常把「看见」误以为是理解。\n\n尤其当一个长年被传闻包围的人，终于走到光下时，旁人很容易在第一秒就替她决定意义：她是证据、是警告、是阴谋、是象征。可真正站在红魔馆走廊上的那位芙兰朵露·斯卡雷特，首先不是这些。\n\n她首先是一个被长期藏在门后、直到现在才被允许进入他人视野的存在。\n\n这件事本身，就值得深想。\n\n若她只是红魔馆单纯的家人，为何多年以来没有公开露面？若她只是需要被保护的妹妹，为何偏偏在权力重整后现身？而若她是一张被刻意保存至今的牌，那么我们此刻所见的，究竟是她本人，还是红魔馆安排给外界阅读的一个姿态？\n\n我比射命丸文看得更久，也更慢。\n\n我看见她的脚步不像散步，更像试探。她走得很小心，不是出于胆怯，而像是在确认地面、光线、气味、声音，是否都还在她能承受的范围内。那不是从容者的步伐，而更像一位刚从长期封闭中被带出来的人，正在重新学习如何与世界保持距离。\n\n她停在窗边的时间很短，可那一停比任何传闻都真实。她不是在展示自己，她甚至不像习惯被观看。若一定要形容，那更像有人把她从一个极深、极安静的地方带到光下，而她暂时还不知道，这光究竟是出口，还是另一种新的安排。\n\n因此，我认为真正值得追问的问题，不是「红魔馆是否藏了一位危险人物」，而是：\n\n红魔馆为何选择在此刻，让这位妹妹被看见？\n\n是出于治疗与修复，试图让她重新与馆中众人建立关系？\n\n还是出于权力的展示，让世人明白斯卡雷特家尚有更深一层、也更不可测的力量？\n\n或者，这两者原本就不是对立的。\n\n保护与控制，关爱与管理，家人与工具——在权力中心，这些界线往往比旁人愿意承认的更模糊。\n\n所以，当我们看见芙兰朵露·斯卡雷特，不妨先放下急著定义她的冲动。她的出现当然具有政治意味，但若只把她读成一则警告，那便太轻率了。被长年藏起来的人，突然被推到视野里，从来不只是她一个人的事。\n\n那同时也暴露了藏她的人，正在面对什么。\n\n红魔馆也许想让外界看见一位妹妹。\n\n可外界真正看见的，可能是这座馆的另一道裂缝。"
scarlet_news.2.a:0 "被看见，不等于被理解。"



  scarlet.7.t:0 "红月的清晨"
 scarlet.7.d:0 "内战最后一声炮火沉下去时，幻想乡没有迎来欢呼。树梢上还挂著烟，泥地里还埋著碎铁与血，人里的门窗关得很死，像整片土地都还不敢确定——这场厮杀到底是真的结束了，还是只是换了一种方式继续。\n\n红魔馆的旗帜立在高处，被风扯得笔直。蕾米莉亚站在台阶尽头，身后是她夺下来的馆，脚下是刚被压进沉默的人群。她没有讲胜利，不提荣耀，也懒得替任何人编造安慰。她只是看著众人，语气平稳得近乎冷酷。\n「从今天起，怪物不再替别人的秩序让路。」\n\n那句话不大声，却像直接钉进每个人的耳里。她没有要谁理解，她只要他们记住——这个新清晨，不属于旧世界。"
 scarlet.7.a:0 "命运站在蕾米莉亚身边"

 scarlet.8.t:0 "银刀与帐簿"
 scarlet.8.d:0 "战后最先被整理的，不是尸体，也不是废墟，而是秩序。咲夜把缴获的粮、钢、枪械与药品分门别类，把俘虏、降者与旧势力残部一一登记，再把混乱压进一条条能执行的规则里。\n\n她做事一向干净。桌上的帐册摊开时，旁人看到的是数字与分类；可在她手里，那些东西其实都一样——都是需要被摆回正确位置的失序。\n「人里先登记，再配给。旧据点逐一清点，武器集中回收。」她头也不抬地说。\n\n旁边的人迟疑了一下：「若有人不服呢？」\n\n咲夜的笔尖停住，语气仍旧端正。\n「那就让他学会服。」\n\n她说得很平，像只是在擦一只银杯。可谁都听得出来，这位女仆长真正厉害的地方，从来不是优雅，而是她能把优雅变成一种毫不留情的管理。"
 scarlet.8.a:0 "咲夜，我完美的十六夜咲夜"

 scarlet.9.t:0 "微笑的门神"
 scarlet.9.d:0 "新设的关卡前，红美铃依旧站得很稳。她脸上的笑没有消失，语气也不重，可光是那一句「请出示通行证」，就已经把流民、残兵、商队、间谍与投机者全都隔在了规矩之外。\n\n她不像咲夜那样用条文压人，也不像蕾米莉亚那样天生带著压迫感。她更像一道墙，平时看著不显眼，真要硬闯时才发现根本推不动。\n\n白天，她站在门前，把混杂的人流一个个分开，让该进的人进，该停的人停。夜里，她把笑收起来，对著地图与哨点重新画线，把山道、河口与馆外巡逻都接进同一张防网。\n「这边再加两班守卫，这条路改成夜间封锁。」她指著图说。\n\n部下问她：「有必要这么细吗？」\n\n美铃抬起眼，语气仍然不急。\n「有啊。」\n「门只要漏一次，里头的人就得替外面的错收拾很久。」\n\n她守的从来不只是入口。她守的是红魔馆能不能安稳地站著，让蕾米莉亚的意志一路延伸下去。"
 scarlet.9.a:0 "红美铃，我很高兴在上海把你拉上船"

 scarlet.10.t:0 "大图书馆里的研究"
 scarlet.10.d:0 "胜利宴开得很热闹，大图书馆里却还是老样子。帕秋莉没有出席，她只是收下缴获来的外界器械、技术图纸与研究笔记，再把自己关进书堆与烛火之间。\n\n蕾米莉亚要她做的事很清楚：把这些不属于幻想乡的技术，和红魔馆现有的魔法、工坊与工业能力接起来，做出新的东西。\n\n帕秋莉翻开拆下来的机械外壳，看了几页纪录，又咳了一声。\n「材料粗糙，结构倒不算蠢。」她淡淡说。\n\n小恶魔抱著另一叠图纸凑过来：「能用吗？」\n「能拆。」帕秋莉回得很短，「拆完才能知道值不值得留下。」\n\n她对知识的态度一向很冷。没有崇拜，没有陶醉，只有判断：能不能用，该不该留，会不会让红魔馆变得更强。\n\n这座图书馆里保存的，不只是过去的禁忌，也是接下来要被造出来的未来。帕秋莉很清楚，战争打完不代表结束；真正能决定下一场胜负的，往往不是广场上的掌声，而是书页翻到哪一行。"
 scarlet.10.a:0 "帕秋莉，我最欣赏你对知识的探求"

 scarlet.11.t:0 "地下室传来玻璃声"
 scarlet.11.d:0 "战后的红魔馆比以往更安静，唯独地下室例外。那里每一声细小的碰撞，都会让整条走廊的人停一下——不是因为好奇，而是因为谁都知道，门后关著的不是单纯的家人，而是一场随时可能失控的灾厄。\n\n芙兰朵露坐在房里，听见外面的动静，像孩子一样把脸贴到门边。\n「姊姊，你赢了吗？」她问。\n\n没人立刻回答。咲夜的手停在门把上，像在衡量这扇门该不该开；帕秋莉把封印的纹路重新补过一遍，笔尖压得很稳；美铃站在走廊尽头，眉头一直没有松开。\n\n门里的声音又传出来，这次轻了一点。\n「那我可以出去看看吗？」\n\n这句话本该很普通，可落在这里，却比命令更沉。因为每个人都明白，芙兰不是不想靠近这个家，她只是太危险；而越是知道她的寂寞，就越没人敢轻易把门打开。\n\n玻璃又碎了一声，很轻，像她自己也没控制好力道。\n\n走廊上的沉默因此更重了。谁都没有忽视她，恰恰相反——正因为每个人都太清楚她的分量，所以才谁也不敢把这份重量当成普通的亲情去对待。"
 scarlet.11.a:0 "有人……有人可以陪我玩吗？"

 scarlet.12.t:0 "红雾笼罩天际，蕾米莉亚的决心"
 scarlet.12.d:0 "露台上的风带著湿冷，红雾一路铺到天边，把远方的灯火都染得像血。蕾米莉亚站在栏杆前，手指搭著石面，目光却早已不在眼前。\n\n她想起四百多年前的欧洲。想起那些曾属于吸血鬼的高墙、厅堂与夜色，如何在科学、工业与新秩序的碾压下，一点一点被挤出世界。不是一夕崩溃，而是被时代慢慢擦掉，像从历史里被抹去的旧字。\n\n她能操纵命运，却从不相信命运会善待自己。恰恰相反，她比谁都厌恶那条早就替她写好的路：躲藏、退让、等待消失。\n\n咲夜走到她身后，停在半步之外。\n「大小姐。」\n\n蕾米莉亚没有回头，只低声开口。\n「我见过太多东西被说成『天意』。」\n\n她的指尖慢慢收紧，语气也跟著沉下去。\n「但我从来不承认。」\n\n红雾在她身后翻动，像某种巨大的幕正在被拉开。她终于转过身，眼里没有动摇，只有已经压到极致的决心。\n「既然这世界不肯给我想要的命运，」她说，「那我就亲手改写它。」"
 scarlet.12.a:0 "掌管命运的我，怎可能被命运击败"
 

 scarlet.13.t:0 "门前的试探"
 scarlet.13.d:0 "战后不可能只有沉默。总会有人先来试底线——有时是妖怪山派下来的天狗使者，有时是永远亭放出来探风向的兔子，有时甚至只是几个看似天真、其实把消息记得很牢的妖精。\n\n红美铃一律照单全收。她不摆架子，也不急著翻脸，照样请人进门前停步、照样让茶水上桌、照样把每一句问候都说得很周全。可来客很快就会明白，她那份客气不是退让，而是一种被打磨得很圆的警告。\n「红魔馆欢迎客人。」她笑著说。\n「可进到哪里、听到多少、能带走什么，得由我们决定。」\n\n有个天狗使者抬了抬眉，像想把话再往前探一步：「那若是我们只是来看看呢？」\n\n美铃把茶杯往前一推，语气仍然不重。\n「看当然可以。」\n「只是看完之后，最好记得自己站在哪一边。」\n\n她从不靠威吓把人赶走，她只让对方自己意识到——红魔馆如今还肯留一分礼数，已经算是给足了面子。门前的风还是那样吹，来访的人也还是那样换，可从她站在那里开始，每个人都得学会一件事：红魔馆可以谈，却不是谁都配拿来试。"
 scarlet.13.a:0 "让他们知道自己的位置，美铃"

 scarlet.14.t:0 "禁书目录与小恶魔的微笑"
 scarlet.14.d:0 "大图书馆里，真正危险的东西从来不会自己发光。它们被塞进没有标题的书脊、被夹进注解的空白处、被封在只差一步就能打开的锁后面。帕秋莉很清楚，战后比知识更重要的，是谁能碰知识。\n\n于是她列出了一份新名单。哪些书必须封存，哪些术式只能由指定人员查阅，哪些外来技术应该暂时拆散保存，还有那些在混乱里冒出头来的「天才」——要嘛收编，要嘛处理，不能让他们留在规格之外。\n\n小恶魔抱著清单站在她身旁，一页一页往下看，笑意却越来越明显。\n「这样是不是太整齐了？」她偏头问，「留一点点缝，不是比较有趣吗？」\n\n帕秋莉没抬头，只把羽毛笔往下一压。\n「缝隙不是给你玩的。」\n\n小恶魔眨了眨眼，像根本没被责备到。\n「我只是觉得，若有几个自以为聪明的人因为『小小的疏失』碰到不该碰的东西，反而能替我们省下很多筛选时间。」\n\n这话听起来像玩笑，却不是胡闹。帕秋莉知道她的使魔一向爱在规则边缘绕，可那份绕法有时也确实比条文更快见效。\n\n她终于抬眼，看了小恶魔一会儿。\n「别做得太明显。」她说。\n\n小恶魔的笑意更深，抱著清单轻快地转过身去。\n「明白。」\n\n没多久，大图书馆里的书架仍然整齐，封条仍然完好，流程看起来也和帕秋莉要求的没有差太多。只是有些人拿到的书，会刚好多翻一页；有些自作聪明的试探，会刚好撞进一个不该碰的陷阱。\n\n帕秋莉没有再追问。\n\n她知道，小恶魔从来不会完全照做。\n但只要最后结果仍在她手里，那点故意留下的偏差，也可以算是另一种管理。"
 scarlet.14.a:0 "小恶魔总会用她自己的方式完成"


 scarlet.1.t:0 "完美潇洒的女仆长"
 scarlet.1.d:0 "红魔馆最晚熄灯的房间，往往不是主人的寝室，而是咲夜的办公桌前。银盘、账册、访客名单、巡逻时刻，全都在她手里被排成毫无缝隙的秩序。她名义上是女仆长，实际上却管着馆内运转、物资调度、对外接待，连许多本该由官僚决定的事，也会先经过她的判断。\n\n她在红魔馆的地位很特别。她是人类，却站得比多数妖怪都靠近王座。有人敬她，有人怕她，也有人始终记得——她之所以能留在这里，不是因为被怜悯，而是因为她足够有用。\n「女仆长，今晚的访客名单要改吗？」年轻女仆小声问。\n\n咲夜没有抬头，只把羽毛笔一转，在纸面上划去两个名字，又添上三个时段。\n「左侧走廊加一班巡查。宴会厅的酒提前半小时醒。」\n「是。」\n\n她说话一向不重，却没人敢拖慢动作。那不是靠威吓换来的服从，而是因为所有人都知道，只要咲夜还站着，红魔馆就不会乱。\n\n蕾米莉亚曾看着她，像看一件做工精确的器物，也像看一把自己亲手磨亮的刀。「妳很适合这里。」\n\n咲夜低头答道：「能为大小姐效劳，是我的职责。」\n\n她从不追问自己在主人眼里究竟算什么。她只把每一件事做到无可挑剔，因为这是她留在红魔馆、也留在蕾米莉亚身边的方式。"
 scarlet.1.a:0 "最实用的工具咲夜"

 scarlet.2.t:0 "红美铃与门"
 scarlet.2.d:0 "天刚亮，红美铃就已经站在门前了。她背后是红魔馆高墙，面前是所有必须被筛过一遍的人与消息。很多外来者第一次见她，都会先被那张温和的笑脸骗过去，以为她只是个守门的。可真到了要紧时候，最先拦下刀枪、流言和试探的人，往往也是她。\n\n她负责的从来不只是门。外围警戒、关卡盘查、驻军训练、战时防线，这些事都归她管。若咲夜负责馆内的秩序，那美铃守着的，就是红魔馆与外界之间那条不能轻易被踩坏的线。\n「请出示通行证。」她对来客说话时，总还是那副不急不慢的语气。\n\n一个败兵模样的男人皱眉：「我只是来送信。」\n\n美铃接过信，却没有立刻放人。她低头扫了一眼封口，又抬眼看向对方靴边的泥。\n「信可以进，你不行。」\n「为什么？」\n「因为你身上带着第二份消息，而且不是写在纸上的。」\n\n她说完仍在笑，身后的卫兵却已经围了上来。\n\n红美铃平日不爱摆架子，甚至常被人看成懒散。可熟悉她的人都明白，她不是松，只是稳。该出拳时，她从不犹豫；该守住位置时，她能在门前站到天亮。\n\n蕾米莉亚曾半带玩笑地说：「我当初把妳带上船，不是为了让妳晒太阳的。」\n\n美铃拍了拍衣袖，笑着回答：「我知道。所以门这边，交给我就好。」\n\n她就这样站在最前面，把红魔馆的第一道安全，守成了许多人不敢轻视的规矩。"
 scarlet.2.a:0 "继续"

 scarlet.3.t:0 "掌控命运的吸血鬼女王"
 scarlet.3.d:0 "露台上的风吹不散红雾。蕾米莉亚站在那里，看着远处的灯火，像在看一场早就写好、却仍不肯认输的戏。\n\n她是红魔馆唯一的主人，也是这座馆里所有权力最后归拢的地方。咲夜替她整理行政，美铃替她守门，帕秋莉替她计算知识与火力，但决定谁能留下、谁该退场、红魔馆要走向哪里的人，始终只有她一个。\n\n很少有人知道，她对“统治”这件事的执念，不只是贵族脾气。她生在一个属于妖魔的旧时代，却眼看着科学、工业与人类国家一点点把那些古老存在逼出舞台。吸血鬼的高傲没有死，只是被时代压进了阴影里。\n\n咲夜站在她身后，轻声问：「大小姐，接下来要做什么？」\n\n蕾米莉亚晃了晃杯里的酒，语气平静得近乎轻慢。\n「做一件很简单的事。」\n「让世界重新记住，谁才有资格定义夜晚。」\n\n她看起来任性，爱夸口，偶尔还像个不肯认输的孩子。可真到了该下令的时候，她比谁都清楚自己要什么。她要的不是短暂的胜利，而是一种不能被忽视的存在感；不是讨好谁，而是逼世界承认红魔馆还站在这里。\n\n传闻她能操纵命运。也许那能力并不会直接改写一切，但她总能在最关键的时候，把偶然推成必然，把别人的犹豫变成自己的机会。\n\n蕾米莉亚抬起下巴，像在对整个世界说话。\n「命运若不肯低头，我就亲手把它按下来。」"
 scarlet.3.a:0 "以秩序让世界记住我们"
 scarlet.3.b:0 "以威慑让世界不敢遗忘"

 scarlet.4.t:0 "被囚禁的公主"
 scarlet.4.d:0 "地下室的门外总比别处安静。那里没有宴会的笑声，也没有女仆匆忙走动的脚步，只有封印、锁链和每个人刻意压低的呼吸。\n\n门后住着芙兰朵露·斯卡蕾特。她不是红魔馆的臣下，也不是能被随意调度的武器。她是斯卡蕾特家的另一位主人，是蕾米莉亚唯一的妹妹，也是整座馆里最危险、最难被定义的存在。\n\n她有孩子般的好奇和直白，会因为一点小事高兴，也会因为一句话突然沉下脸。问题在于，她的情绪从来不只是情绪。她的力量太直接，直接到足以把一场争执、一座房间、甚至整段秩序一起捏碎。\n\n门里传来玻璃轻碰的脆响。\n「姐姐。」芙兰朵露的声音贴着门板传出来，轻得像在撒娇，「外面现在好玩吗？」\n\n走廊上的人都安静了一瞬。咲夜的手停在门把上，帕秋莉把刚写好的术式纸压得更紧。\n\n蕾米莉亚向前一步，语气没有太多起伏。\n「还不到妳出场的时候。」\n「可我也想看看呀。」\n「我知道。」\n\n这句回答很平，却让所有人都明白了一件事：蕾米莉亚不是不在乎她，恰恰相反，正因为在乎，才要把她留在最安全、也最寂寞的地方。\n\n芙兰朵露在红魔馆的地位从来很高，高到没人能轻易命令她；可她真正拥有的自由，却又少得可怜。她既是家族的血亲，也是国家层面的隐患。每个人都得承认这一点，却没人能轻松说出口。\n\n门后安静了片刻，随后传来一声很轻的笑。\n「那姐姐记得，别让我等太久。」"
 scarlet.4.a:0 "把她留在身边"
 scarlet.4.b:0 "总有一天，她也要走到地面上"

 scarlet.5.t:0 "掌握无限知识的魔法使"
 scarlet.5.d:0 "大图书馆里没有白天黑夜的分别，只有纸页翻动、药味浮动，以及一盏盏始终不灭的灯。帕秋莉就坐在这些灯下，披着长发，咳嗽两声，又把目光压回书页与图纸之间。\n\n她是红魔馆的学者，也是整个阵营最不可替代的头脑之一。对外，她不常露面；对内，技术整合、术式研究、情报封存、工业改造，许多真正决定未来走向的事，最后都会落到她的桌上。若说咲夜让红魔馆运转，美铃让红魔馆安全，那么帕秋莉负责的，就是让这座馆拥有超出这个时代的知识与火力。\n\n桌上摆着缴获来的电台零件、外界发动机图纸，以及一叠刚写完的魔法回路记录。小恶魔站在旁边，正把资料分门别类。\n「这些能直接用吗？」小恶魔问。\n\n帕秋莉翻了一页，头也不抬。\n「能拆，不代表能用。先分类，再比对，再决定哪些值得改。」\n\n这时，蕾米莉亚从书架间走来，停在她桌边。\n「我需要结果。」\n\n帕秋莉终于抬眼，声音还是轻，却一点都不退。\n「那就别催一个正在替妳省掉三次失败的人。」\n\n换成别人，这句话已经算得上冒犯。可蕾米莉亚只是笑了笑，没有发火。因为她知道，帕秋莉就是这样的人：安静、挑剔、聪明，身体不算好，脾气也绝不温顺，但她一旦认定某件事值得做，就会把它推到旁人跟不上的深处。\n\n在红魔馆里，她不是最显眼的那位，却始终坐在最接近核心的位置。很多命令由蕾米莉亚说出口，很多实现这些命令的方法，却先在帕秋莉脑中成形。"
 scarlet.5.a:0 "红魔馆的大脑"


#不要比这个长就好

 scarlet.6.t:0 "被挑中的影子"
 scarlet.6.d:0 "女仆们以为咲夜天生就冷静、天生就不会出错。只有她自己知道，那不是天赋，是被逼出来的本能。\n\n很久以前，她只是街角的一道影子：没有姓氏，没有家，连哭都得掐住声音。饥饿要吞下去，恐惧要藏起来，因为任何暴露都会换来更糟的下场。她手里那把破旧小刀不是武器，只是提醒自己还活著。\n\n那晚红雾很重，寒意像贴著骨头走。她缩在墙边，以为自己会像其他人一样被世界推著消失。然后，有人停在她面前。\n\n不是施舍，也不是同情。那双眼睛在「挑选」：看重量、看耐用、看能不能派上用场。蕾米莉亚·斯卡雷特俯视著她，笑意干净得让人发冷。\n「你很安静。」\n\n那句话不是称赞，是起点。\n\n她被带进红魔馆，换上制服、洗去污迹、学会站姿与礼节，也学会把「人类」两个字压到胸腔最深处。她第一次踏进宴会厅时，银器亮得刺眼，香料与酒气重得像锁链。她立刻明白：这里不是收容所，是舞台，也是牢笼。\n\n在妖怪的王宫里，人类不是同伴，是例外；例外意味著随时能被替换、被抛下、被当成一次性的消遣。她没有血统可倚，没有族群可护，唯一能抓住的只有一件事——把每一次任务做成无可挑剔的成果。\n\n所以她把服务当成审判：托盘不许晃，茶不许溢，刀叉角度不许偏，回话不许多一字。她把情绪压进胃里，把疲倦锁在眼底，把每个失误切碎在发生之前。\n\n如今她接管内政与政治，整理帐册到深夜，核对物资到指尖发痛；她替主人处理来访者的试探，替红魔馆挡下外界的耳目，把风险拆成一张张可执行的清单。她让门禁有规矩可循，让需求有供应可接，让每一名女仆知道自己的位置与下一步。\n\n她看起来从容。\n只有她知道，那份镇定是用力按住的。\n\n因为她不敢松。\n一旦松开，过去那个挨饿的影子就会爬回来，提醒她：你什么都没有。\n\n所以咲夜把红魔馆运转得像上紧的钟。\n每一声滴答，都是她替自己争来的「留下」。"
 scarlet.6.a:0 "把钥匙交给她。"
 


 scarlet.16.t:0 "猩红的凌晨"
 scarlet.16.d:0 "第一道谕令在夜里发出，送往四方：所有妖怪，立即前往红魔馆集结。\n\n消息传出去后，整座馆很快亮了起来。不是宴会前那种浮华的亮，而是一种为了迎接权力而生的光。走廊被擦得能映出人影，烛台与旗帜全被重新校正，连脚步声都被安排进该有的位置。咲夜站在最前面，把每一条动线都整理得没有破绽；美铃守在门前，脸上的笑还在，眼神却比平日更硬；帕秋莉把一叠一叠的名册推上桌，字迹平整得近乎冷酷；小恶魔抱著印章、文件与封条在旁边来回穿梭，像把一场大规模的权力接收当成某种复杂又有趣的游戏。\n\n唯独王座后方那扇门始终没有完全打开。\n\n有人听见里面传来一声很轻的笑，随后又立刻安静下去。没人多问，因为那不是插曲，而是提醒——红魔馆的中心不只是一位女王，还有一颗谁都不敢忽视的不稳定心脏。\n\n当最后一批人踏进大厅时，蕾米莉亚终于抬手。\n\n整个厅堂立刻止声。\n\n她站在高处，披风与红雾几乎融成一体。她没有提高音量，却让每个字都像直接落进骨头里。\n「从今天起，我说了算。」\n\n她的目光扫过所有人，像在点名，也像在挑选。\n「你们不再是各自为战的夜行者，也不再是躲在裂缝里等人类施舍位置的残余。」\n\n她停了一下，语气仍然平稳。\n「你们是我的臣属。」\n\n台下没有人敢动。\n「我的国度会扩张，会武装，会生产，会命令这片土地重新学会恐惧。」她说，「而从今天开始，恐惧不再只是传闻，它会被写进法令、刻进税簿、印进每一道征召与命令里。」\n\n那一刻，红魔馆不再只是偏安一隅的城堡。它成了王宫，成了司令部，也成了整座列岛新的中心。\n\n而蕾米莉亚，也不再只是人们私下低声提起时会发抖的名字。她开始被正式写进告示、被刻在权力的外壳上、被一遍遍确认成不可质疑的统治者。\n\n黎明仍然会来。\n只是从这一天起，黎明不再是白的。\n它是红的。"
 scarlet.16.a:0 "大地将被染成红色"



 scarlet.17.t:"门外的敲击声 上"
 scarlet.17.d:"房间安静得可怕。\n\n咲夜坐在床沿，背挺得笔直，双手放在膝上，像仍站在王座前等候审判。她照命令「休息」了，可她的大脑拒绝停下。她盯著墙上钟摆的影子，数著每一次摆动，仿佛只要把时间切得够细，就能找出自己是哪一秒出了差错。\n\n她开始拆解当晚所有细节：托盘是否离桌面太近？回话的音量是不是过轻？视线下垂的角度是否不够恭敬？她把自己逼进一个狭窄的框里，反复撞击，直到呼吸变得短促。每一个「可能」都像新的罪名。\n\n蕾米莉亚的语气越平淡，越像宣判。咲夜明白主人的世界里「多余」是怎样的结局：不需要解释，不需要怜悯，只要一句话，人就会被从舞台上移走。\n\n她想站起来，想去工作，想用成果把一切补回来。可命令像锁扣在喉咙上。她一动，就像违逆；她不动，又像被弃置。\n\n她的指尖无意识地抓紧裙摆，布料被拉出一道细微的皱褶。\n\n皱褶。\n\n那一瞬间她像被雷击。她猛地松手，立刻起身把那道褶痕抹平，抹到纤维重新服帖。她的动作快得失控，像在抢救一场不存在的灾难。她把手套重新摆正，把外套的衣角拉到完全一致，把鞋尖再对齐一次。她越整理越乱，越追求无瑕越觉得自己肮脏。\n「我到底做错了什么……」她低声说，像不敢让任何人听见。\n\n声音落下后，胸口忽然一空，接著是更深的窒息。她把额头抵在冰冷的镜面上，镜子里的自己依旧端正，却像一具被打磨过的壳。她的眼神没有焦点，只有一个念头在反复撞击：如果主人不需要我了，我还剩下什么？\n\n敲门声就在这时响起。\n\n三下，沉稳，不急不慢。\n\n咲夜僵住。她第一个反应不是放松，而是恐惧——是不是被叫去领罚？是不是要被换掉？她用力吞咽，才让声音回到可用的状态。"
scarlet.17.a:"谁在外面?"

 scarlet.18.t:0 "门外的敲击声 中"
 scarlet.18.d:0 "「……请进。」\n\n门开了一条缝，红美玲站在外面。她没有笑得太轻浮，也没有装作什么都不知道，只是把姿态收得很稳，像守门人的墙慢慢挪进屋里。\n「咲夜。」美玲的声音低，带著刻意压住的担忧，「妳没开灯。我怕妳……不太好。」\n\n咲夜立刻想回「我很好」。这句话她讲过太多次，几乎像本能。可这次她说不出口。她的嘴唇动了动，只吐出一个毫无力量的字。\n「……我没事。」\n\n美玲没有拆穿。她看向那面镜子，看向床沿整齐得过头的摆放，看向咲夜指节泛白的手。她沉默了一秒，像在选择措辞，然后把带来的东西放到桌上——一杯还温著的茶，还有一小碟点心。\n「大小姐只是说妳该休息。」美玲说得很慢，像把一句话按进咲夜耳朵里，逼她听清楚，「不是说妳不好用，也不是说妳做错了什么。」\n\n咲夜的肩膀轻微一颤，却立刻又把那个颤抖压回去。她不允许自己在别人面前露出裂缝。\n「命令就是命令。」她硬生生挤出一个端正的语气，「我会遵守。」\n「妳遵守得太像在受刑了。」\n\n美玲的话像一拳，打在咲夜最不能碰的位置。咲夜想反驳，想用礼节把距离拉开，可她忽然发现自己已经用尽力气了。她的喉咙发紧，胸口发酸，像长时间憋住的水终于要溢出来。\n「我不能停。」她终于开口，声音比她想像得更哑，「我一停……就会出问题。会被看见。会被……」\n\n她没把最后两个字说完。\n\n会被抛弃。"
 scarlet.18.a:0 "我不想被抛弃，不想要再被抛弃"

 scarlet.19.t:0 "门外的敲击声 下"
 scarlet.19.d:0 "美玲往前一步，停在不会让咲夜感到被逼迫的距离，语气却更重了。\n「妳以为只有妳在撑这座馆吗？」她盯著咲夜的眼睛，像守门时盯著敌人那样专注，「咲夜，妳不是工具。妳是我们的一份子。没有妳，这里真的会乱。但不是因为妳要把自己磨碎。」\n咲夜的呼吸开始乱。她努力想把它按回去，却越按越失控。她的指甲掐进掌心，像要用痛把眼眶的热逼回去。\n美玲的声音更低，却更清楚。\n「妳知道我最怕什么吗？」她说，「不是打仗，不是刺客。是我哪天站在门口，回头一看，发现妳不在了。因为妳把自己逼得太紧，逼到坏掉。」\n\n咲夜的防线终于断了一角。\n\n她没有哭出声，只是眼眶发红，睫毛颤得像被风吹著。她死死咬著牙，仍然想把那份失态吞回去。可美玲没有让她躲。\n「大家都在乎妳。」美玲补上那句，像把一把热放到她冰冷的手里，「帕秋莉也问了，说妳今天的脚步声不对；小恶魔偷塞了点心要我带来；女仆们整个走廊都不敢大声讲话，怕妳听见会觉得自己没管好。」\n\n咲夜怔住。她像第一次听见「自己被注意」这件事。\n\n她一直以为只有主人在看。\n\n原来不是。\n\n美玲伸出手，没有碰她，只把掌心停在她能选择接受的位置。\n「妳可以休息。」她说，「不是因为妳不够格，而是因为妳早就撑得太久了。妳不需要用完美来证明妳能留下。」\n\n咲夜的喉咙颤了一下，终于吐出一口长到发抖的气。那口气像从胸腔深处被拔出来，带著压抑太久的酸。\n\n她低下头，声音几乎听不见。\n「……如果我不完美呢？」\n\n美玲回答得很快，像早就想过。\n「那我就站在门口，替妳挡住那些要把妳赶走的东西。」\n\n屋里的烛火仍然稳，却不再像刑具。\n咲夜握紧又松开手指，像在学一件全新的事。\n\n她没有说谢。\n她只是把那盏茶端起来，喝了一口。\n很烫。\n\n可那份烫，让她第一次觉得自己还活著。"
 scarlet.19.a:0 "你泡的茶真好喝，美玲"


 scarlet.20.t:0 "烛光下的名字 上"
 scarlet.20.d:0 "宴会厅的门在她指尖下推开。\n光先扑上来，像一张不给人退路的网。烛台排得整齐，银器亮得刺眼，桌布没有一丝皱痕，连花瓶的角度都像被谁用尺量过。咲夜本能地扫过四周：出入口、阴影、窗边、柱后——她在找威胁，也在找错误。可今晚的「不对劲」不是破绽，而是整座红魔馆都在等她。\n她才踏进一步，门就被合上。\n那一瞬间，她的背脊绷紧到像被线拉住。她没有托盘，没有名册，没有命令列表。她的手指下意识想去摸手套边缘，确认自己的姿态是否合格，确认自己仍是「可用」。\n然后，声音落下。\n不是掌声的热闹，而是一种整齐到可怕的齐声呼喊——像点名，像审查。\n「咲夜——！」\n她的名字被整个宴会厅推过来，撞在胸口。女仆们站成两排，目光不躲不藏；厨房的人靠在门边，连平常爱窃笑的小恶魔都把嘴角收得很正；帕秋莉坐在席位上，手里还握著一本薄册，像是把话写好才敢来；芙兰朵露坐在较暗的角落，晃著腿，眼睛亮得像要把她拆开看清楚。\n咲夜的第一反应不是受宠若惊。\n是恐惧。\n她太习惯在众人的注视里被评分。她脑中闪过一串问题：是不是她的管理出了缺口？是不是她让谁不满？是不是主人已经决定——用一场体面、干净、无可指摘的方式，把她从位置上拿掉？\n她把呼吸压到最小，挤出最标准的礼节。\n「大小姐。」\n蕾米莉亚坐在王座旁的高背椅上，红酒在杯里微微晃动。她看咲夜的眼神和平常一样，轻、冷、像在看一个必然存在的秩序。她抬了抬指尖，示意咲夜往前。\n「今晚，妳不用工作。」\n咲夜的喉咙一紧，差点反射性说出「遵命」并立刻开始巡查。但她被那句话钉在原地：不用工作——在她的世界里，这不是奖励，是失去用途。\n蕾米莉亚没有多解释，只像在宣告一条新规。\n「妳坐下。以『宾客』的身分。」\n命令仍是命令。\n她只能照做。\n她被安排在主桌的正中。那位置平常不属于她，属于被敬畏的人。椅背贴上脊椎的瞬间，她全身肌肉更紧了：她坐得太直，太端正，像一尊被摆上台的器物。她能感觉到每一道视线都在她身上停留，连烛火的热都像被放大。\n第一杯酒被举起。\n咲夜最熟悉的是把酒送到别人手里，从来不是接受敬酒。\n小恶魔先跳出来，像刻意用轻快掩住严肃。\n「女仆长！今天不准妳说『我来』！我们会自己端盘子！」\n几个女仆忍不住笑出声，笑意却很快收住，像怕她误会成嘲弄。咲夜的指尖微微一缩，她想纠正秩序，想提醒大家站位不够齐，可她又想起主人的话——今晚她不是管理者。"
 scarlet.20.a:0 "忽然看见，帕秋莉居然走上舞台发言"

 scarlet.21.t:0 "烛光下的名字 中"
 scarlet.21.d:0 "帕秋莉清了清喉咙，声音依旧很轻，却比平常更直接。\n「红魔馆的运转，有一半是妳解决了混乱。」\n她停了一下，像不擅长把感情摆在桌上。\n「谢谢。」\n那两个字比任何长篇都重。\n女仆们接著举杯，一个接一个。\n有人说她把每个人从错误里拉回来；有人说她在最危险的夜里也能让所有人按时回到位置；有人低声承认——自己曾经怕她，后来才明白那不是冷酷，是她替所有人把麻烦挡在外头。\n咲夜听著，胸口像被一点点挤压。她的表情仍维持端正，嘴角只允许一个非常细的弧度。她不敢露出太多，仿佛一旦放松，整个人就会散。\n蕾米莉亚终于放下酒杯。\n宴会厅立刻安静，安静得像等待裁决。\n「十六夜咲夜。」\n蕾米莉亚喊她全名时，咲夜的心脏猛地一沉，几乎要站起来受命。\n「妳把红魔馆整理得很好。」蕾米莉亚语气平淡，像在评价一件合用的物品，却又刻意停顿了一瞬。\n「所以我不希望妳坏掉。」\n那句话落下时，咲夜的指尖发麻。她听不出那是关心还是警告，但她清楚主人的意思：她仍被需要。\n她想立刻回应、立刻保证、立刻把自己重新锁回完美。\n可下一秒，全场又一次喊起她的名字。\n「咲夜——！」\n声音更大、更整齐，像把她从椅子上推向聚光下。她被迫抬头，被迫承受这份「看见」。她一向把自己藏在效率后面，藏在礼节里，藏在时间的缝隙里。今天没有缝隙。\n她的呼吸乱了一拍。\n就在她快要把指甲掐进掌心时，一道更熟悉、更沉稳的气息靠近。\n红美玲站到她面前。\n她没有嬉皮笑脸，也没有用玩笑带过。她把背挺得很直，像守门时一样可靠。她伸出手，掌心向上，停在一个不逼迫、却不容她逃掉的位置。\n「跟我跳一支舞。」\n咲夜愣住。\n「我……我不该——」\n「大小姐说妳是宾客。」美玲打断她，声音不大，却硬得像铁。\n「宾客就该接受。」\n四周的女仆自动退开，清出一块空地。有人把唱机的针放下，旋律流出来，节制、缓慢，像给她一个可以呼吸的速度。\n咲夜把手放上去的瞬间，才发现自己的掌心是冷的。\n美玲的手却很热。\n舞步开始。\n咲夜本能想带节奏，想把每一步踩到绝对精准，想确认裙摆不会扫到桌脚，想确认烛火不会被气流扰动。她甚至在计算转身角度，像把舞当成一项任务。\n美玲把她拉回来。\n不是用力，而是一种稳定的牵引。\n「不用算。」美玲低声说，几乎只让她听见。\n「看著我就好。」"
 scarlet.21.a:0 "优美的舞步进行中"

 scarlet.22.t:0 "烛光下的名字 下"
 scarlet.22.d:0 "咲夜抬眼。\n美玲的目光没有躲，也没有试探。那不是守门人对敌人的视线，而是某种更私人的、更直接的注视——像把她当成一个人，而不是一个职位。\n咲夜的胸口忽然一痛。\n她想把那份痛压回去，想用礼节遮住，可美玲的眼神像把她所有防备一层层剥开。\n旋律转到最安静的段落时，美玲的声音贴著她的耳侧落下。\n「咲夜，我会保护妳一辈子。」\n咲夜的脚步差点乱掉。她立刻想补救，想把错误消掉，却被美玲扶得更稳。美玲没有笑，语气也没有浮夸，像在对自己下誓言，像在把话钉进地板。\n「我不是因为妳有用才这么说。」美玲看著她，眼神很深。\n「妳是我心里最在意的人。」\n她停了一下，像把最后那个字吞了又吐出。\n「妳是我爱的人。」\n咲夜的喉咙像被狠狠掐住。\n她一直以为，自己只要完美就能留下。她把自己练成一把刀、一个齿轮、一个永远不会停的机件。可在这一刻，她忽然被迫面对另一种答案：有人在乎她，不是因为她把红魔馆整理得多干净，而是因为她存在。\n她的眼眶迅速发热，几乎要失控。她死咬著牙，仍然不允许自己掉泪。她只能把脸偏开一点，像是在调整呼吸。\n美玲没有逼她说什么。\n她只是更稳地握著她的手，带著她完成最后一个旋转。\n当音乐停下，全场再一次叫她。\n「咲夜——！」\n这次的呼喊不再像检查。\n更像把她留在这里。\n咲夜站在烛光中央，背挺得很直，却第一次觉得自己不是被摆上台的器物。\n她张了张口，声音很轻，却真实。\n「……我知道了。」\n她没有说谢。\n她只是把美玲的手握紧了一点。\n而红魔馆的夜依旧冷。\n只是在那份冷里，她终于摸到了一点不需要靠完美换来的温度。"
 scarlet.22.a:0 "咲夜，所有人最爱的咲夜"
 
 
 scarlet.23.t:0 "咲夜永远不会被丢下 上"
 scarlet.23.d:0 "人类很喜欢用漂亮的字眼包装抛弃。\n「养父母」——听起来多体面。可在二十世纪初的美国西岸，那些人把她当成一笔会出错的投资。孩子病了一次、麻烦多了一点、哭声大了半分，他们就开始计算，开始嫌弃，开始找理由。\n最后，他们选了一个最省事的方法：把她丢掉。\n那是雾气很重的港城夜晚，海风带著盐味，路灯的光在湿冷里散开，像一张脏掉的薄纱。马车声、电车铃、码头工人的吆喝混在一起——热闹，却没有任何一声是为了她。她被留在教堂后巷，身上只有一件不合身的外套，手里紧抓著一把破旧的小刀，像抓著最后的「我还活著」。\n她没有哭得很大声。\n那种孩子最麻烦。她不吵、不闹，只用眼睛把世界看得很清楚：没有人会回头。她吞下眼泪，背挺得僵硬，像在逼自己不要倒下。那份倔强，不是勇敢，是被抛下的人学会的生存手段。\n我就站在巷口看著。\n别误会。我不是因为心软才走过去。我只是讨厌浪费。\n一个能在这种夜里不崩溃的孩子，一个在被丢弃时还懂得把恐惧压回去的孩子——这种材料，放在街角腐烂，太可笑了。\n她抬头看我，眼神像钉子。她不求救，也不乞怜，只是把刀握得更紧，像准备跟整个世界交换最后一口气。\n我笑了。\n「妳的『父母』把妳扔了。」我把事实说得很平静，因为事实不需要温柔。\n她的呼吸停了一瞬，眼底的火却没有灭。她明明怕得要命，仍硬撑著不退。\n很好。\n我蹲下来，让她看清我的脸，也让她看清我的规矩。\n「妳有两条路。」我说。\n「留在这里，等人类的善心施舍妳一张床，然后再把妳丢第二次、第三次。」\n「或者跟我走。」\n她没有立刻答应。她先看我的手，再看我的鞋，再看我身后的车与随从——像在判断自己是不是又要被骗。那份警惕很对。相信太快的人，活不久。\n「跟妳走，要做什么？」她终于开口，声音干得像砂。\n我没有哄她。\n「活下去。」我说。\n「但不是用祈求。」\n「用结果。」\n我伸出手，不是求她握，是命令她选。\n她的手很冷，指节都是硬的。她握上来的那一刻，我就知道她已经做决定了——不是因为我给她温暖，而是因为我给她一个位置。"
 scarlet.23.a:0 "成为潇洒的女仆长"

 scarlet.24.t:0 "咲夜永远不会被丢下 下"
 scarlet.24.d:0 "我把她带回我在西岸的宅邸。第一晚，我没有给她故事，也没有给她安慰。我只给她干净的水、干净的床，还有一句话。\n「从今天起，妳不再是被丢在巷子里的垃圾。」\n「妳是我的人。」\n\n她看著我，像想反驳，却又找不到能反驳的立足点。她太明白「被谁拥有」至少比「无人要」更能活。\n\n我给她名字，给她制服，给她训练。她学会站姿、学会礼节、学会把情绪锁进最深处。她把自己磨得锋利，把每个细节做到没有缺口，因为她知道——身为人类，她要留下，就必须比任何人都可靠。\n\n而我允许她留下。\n\n不是因为慈悲。\n是因为她配得上。\n\n所以我现在把话说清楚：咲夜不会「死」。\n不是因为命运偏爱她。\n是因为我不许任何人把她从我身边拿走。\n\n她是红魔馆的女仆长，是我手里最精准的秩序。\n也是我亲自捡回来、亲自锻造、亲自留下的人。"
 scarlet.24.a:0 "她是我的人。"

 scarlet.25.t:0 "在上海的那些年 上"
scarlet.25.d:0 "你们总喜欢把上海说得很浪漫。霓虹、旗袍、爵士乐、洋房。好像灯一亮，血就会看不见。\n\n可我记得的一九二零年代，只有煤烟、潮气、枪油，还有黄浦江边洗不掉的腥味。军阀把地盘切成一块块，白天是巡捕，夜里是帮会；今天挂这家的旗，明天就换另一家的枪。那种地方最适合藏东西，也最适合看清一个人到底剩下什么。\n\n我是在那时见到红美铃的。\n\n但在见到她之前，我其实已经听过一些零碎的传闻。有人说她是个行脚的武人，哪里有人被欺负，她就在哪里出手；也有人说她根本不是人，是一条失了香火的龙，是从神位上掉下来、在世间漂了三百年的东西。\n\n后来我才知道，那些话都不算错。\n\n她曾是被村庄供奉的存在，是象征神明的龙。可村庄覆灭后，信仰也跟著断了。神位失了根，留在地上的东西就慢慢妖化。她既不是单纯的神，也不是寻常的妖怪。可她自己早已不在乎那些了。\n\n她只认自己叫红美铃。\n\n我看到她的命运。\n自从带她修行的道士死后，她就在中国各地流浪了三百年。帮过很多人，也得罪过很多家族；救过一些快活不下去的地方，也因此被更多记仇的人盯上。她不是不懂代价，她只是到最后也没学会见死不救。\n\n我第一次真正看见她，是在上海一条快被打烂的小街上。\n\n那条街的商人已经被逼到墙角。收税的军阀来得很凶，嘴上说是征用，实际上就是要把整条街榨干。几个店家跪著，手抖得连帐本都拿不稳。谁都知道，再被刮一次，这里就活不下去了。\n\n红美铃站了出来。\n\n她那时候穿得很简单，袖口束紧，身上没有什么多余的装饰，像一个普通得不能再普通的习武姑娘。可她一动手，就知道她不是普通人。\n\n拳快，步子稳，气走得很深。她不靠蛮力乱砸，而是把力送进关节和筋骨里，让人一个接一个地倒。她能打死，却刻意不打死；能把人胸骨震断，却还是留了条命。那不是心软，是她不想让事情立刻烂到没法收拾。\n\n可上海从来不奖励好心。\n\n她替那条街挡下第一波，第二波、第三波马上就来了。巷口和屋顶都响起枪声，更多军阀的人包了上来。有人喊著放火，有人喊著先打死那个多管闲事的。\n\n这次她没能全挡下。\n\n她肩上中了一枪，腹侧又挨了一发，腿边擦过去的子弹把石板都打裂了。她还能打，却已经不可能再把整条街护到底。她若继续留在那里，死的不只会是她，还会有一整排被她救下来的人，替她一起被报复。\n\n她最后还是退了。\n\n不是因为怕死。\n\n是因为她终于知道，自己再撑下去，只会把更多人拖进来。"
scarlet.25.a:0 "她终于退了，可已经退得太晚。"

scarlet.26.t:0 "在上海的那些年 下"
scarlet.26.d:0 "我找到她时，她躲在桥底下。\n\n雨水从桥面缝隙一滴一滴落下来，黄浦江边的风又湿又冷。她背靠著石墩坐著，呼吸很重，身上中了好几枪，血把半边衣服都染深了。她的手还按在伤口上，眼神却没散，像只要有人靠近，她还是会先抬手打过来。\n\n很好。\n\n我不喜欢太早认命的人。\n\n她看见我时，先皱眉，再把背挺直一点。\n\n「别过来。」她说。\n\n我站在雨影外，看了她一会儿。\n\n「妳快死了。」\n\n她没反驳。\n\n因为那是事实。\n\n我慢慢走近，鞋跟踩在积水里，声音不大，却足够让她知道我没有要躲。她盯著我，像在判断我到底是来补刀，还是来看笑话。\n\n「妳帮了一条街。」我说。\n「结果把整个收税的军阀都惹毛了。现在那些商人活下来了，妳却得躲在这里等血流干。」\n\n她的嘴角抽了一下。\n\n「我知道。」\n\n「那妳还帮？」\n\n她沉默了一会儿，才低低地回。\n\n「总不能看著他们死。」\n\n真麻烦。\n\n可也真有用。\n\n我蹲下来，看著这个已经流浪了三百年、连自己是神是妖都不在乎的东西。她不在意身分，不在意名头，也不在意别人怎么称呼她。她只认一件事：自己叫红美铃。\n\n那就够了。\n\n「我救妳。」我说。\n\n她立刻抬眼。\n\n「条件？」\n\n这句问得很好。快死的人还记得问条件，代表脑子还活著。\n\n「为我工作。」我说得很干脆。\n「从今天起，替我做事。守卫我，替我挡麻烦，替我把那些不该靠近的人挡在外面。」\n\n她盯著我，没有马上答应。\n\n我就把话再说得更明白一点。\n\n「跟我走，妳就不用再这样流浪。」\n「我知道一个地方。」\n「很远，在东方的另一端，叫幻想乡。」\n\n她的眼神第一次真正动了一下。\n\n我看著她，慢慢把最后一句话放下去。\n\n「跟著我，妳就不必再到处替别人的世界收拾烂摊子。」\n「我给妳一个工作，一个位置，还有一个不必继续流亡的地方。」\n\n桥底安静了很久。\n\n最后，她把沾血的手从伤口上挪开，放到我掌心里。\n\n「我叫红美铃。」她说。\n\n「我知道。」\n\n那一夜，我把她从上海带走。\n\n不是捡了一件垃圾，也不是救了一个可怜人。\n\n我是替自己带走了一道门。\n\n而她，也终于找到了一条不必再独自流浪下去的路。"
scarlet.26.a:0 "从那天起，她不再只是漂泊的龙。"
 

 
 scarlet.27.t:0 "地下室里的审问"
 scarlet.27.d:0 "红魔馆的地下室一向很冷。这次更冷。\n\n赤蛮奇、今泉影狼、若鹭姬被分开绑在三张椅子上，彼此看得见，却碰不到。咲夜站在正中，手里没有鞭子，只有一册薄薄的纪录簿。她先把三人的名字写下来，再把笔盖阖上，像在宣布这不是拷打，是整理。\n「我只问一次。」她说。\n「鬼人正邪在哪里。」\n\n影狼先吐了口血沫，嗓子哑得发狠。「你做梦。」\n\n咲夜点头，像是听见了预料中的答案。下一瞬，时间被切开。烛火停住，呼吸停住，只剩她还能动。刀尖没有刺进要命的地方，只是沿著皮肤最敏感的边缘轻轻划过，把痛切得又长又细。\n\n时间恢复时，影狼整个人猛地弓起，椅脚在地上拖出刺耳的声音。\n「下一个。」咲夜看向若鹭姬。\n\n若鹭姬脸色发白，却还咬著牙笑。「你们贵族就这点本事？不就是想让人喊疼——」\n\n话没说完，她的笑就碎了。咲夜把她整个人按进短暂停止的时间里，让一口气上不来也下不去，像被看不见的水灌进肺里。她没让她死，只让她清楚知道窒息有多长。\n\n赤蛮奇的头颅颤了一下，声音终于发虚。「喂……够了吧……」\n\n咲夜转头看她，眼神平得吓人。\n「还没轮到你。」\n\n地下室里没有惨叫太久，因为咲夜连惨叫的节奏都能切碎。她让她们看见彼此怎么被折断，又不让任何一个人真正晕过去。\n\n最后，她把簿子翻到空白那页，重新问了一遍。\n「鬼人正邪，在哪里。」"
 scarlet.27.a:0 "让她们开口。"

 scarlet.28.t:0 "裂缝里的名字"
 scarlet.28.d:0 "撑到最后先崩溃的，不是影狼，也不是若鹭姬。\n\n是赤蛮奇。\n\n她的头垂得很低，呼吸乱成一团，像每吸一口气都会扯到哪里。她本来最嘴硬，现在却连抬头都费力。咲夜把茶杯放到她看得见却碰不到的位置，声音还是那么稳。\n「说了，我就停。」\n\n赤蛮奇笑了一下，笑得比哭还难看。「你们……这群穿得干干净净的怪物……」\n\n咲夜没接话，只把一枚飞刀轻轻钉进桌面。刀身颤著，发出细小的鸣音。另一边，若鹭姬还在咳，影狼的手指已经抖到握不起拳。\n\n赤蛮奇闭了闭眼，终于骂出声。\n「妈的……她在旧采石场下面。」\n\n咲夜没有立刻动，只问得更细。\n「入口。」\n「河堤后面……枯井……」赤蛮奇喘著气，像每个字都在割喉咙，「她设了幌子，还留了两条假路……别信地上的脚印……」\n\n若鹭姬猛地抬头，嗓子都裂了。「赤蛮奇！妳——」\n\n影狼也像疯了一样挣起来，铁链撞得满屋乱响。「妳这是卖了她！」\n\n赤蛮奇没回嘴，只把额头抵在椅背上，肩膀抖得很厉害。\n\n咲夜安静记完，才把笔收起来。她看著三人，没有得意，只有一种事情终于排回正位的冷静。\n「很好。」她说。\n\n她转身走到门口，美铃已经在外面等著。美铃看了她一眼，又往屋里看了一眼，眉头压得很低。\n「问出来了？」\n\n咲夜点头。\n「旧采石场，枯井。」\n\n美铃沉默两秒，才开口。「她们怎么办？」\n\n咲夜把手套重新拉整，语气干净得不带灰。\n「关起来。」\n\n她回头看了那三个草根妖怪最后一眼。\n「等我把鬼人正邪带回来，再决定她们还值不值得活。」"
 scarlet.28.a:0 "去把正邪拖出来。"

 kyo_sakuya_best_maid_event.2.t:"裂缝里的名字"
kyo_sakuya_best_maid_event.2.d:"撑到最后先崩溃的，不是影狼，也不是若鹭姬。\n\n是赤蛮奇。\n\n她的头垂得很低，呼吸乱成一团，像每吸一口气都会扯到哪里。她本来最嘴硬，现在却连抬头都费力。咲夜把茶杯放到她看得见却碰不到的位置，声音还是那么稳。\n「说了，我就停。」\n\n赤蛮奇笑了一下，笑得比哭还难看。「你们……这群穿得干干净净的怪物……」\n\n咲夜没接话，只把一枚飞刀轻轻钉进桌面。刀身颤著，发出细小的鸣音。另一边，若鹭姬还在咳，影狼的手指已经抖到握不起拳。\n\n赤蛮奇闭了闭眼，终于骂出声。\n「妈的……她在旧采石场下面。」\n\n咲夜没有立刻动，只问得更细。\n「入口。」\n「人里边缘的雨后巷口、低矮屋顶与阴影交错处。」赤蛮奇喘著气，像每个字都在割喉咙，「她设了幌子，还留了两条假路……别信地上的脚印……」\n\n若鹭姬猛地抬头，嗓子都裂了。「赤蛮奇！妳——」\n\n影狼也像疯了一样挣起来，铁链撞得满屋乱响。「妳这是卖了她！」\n\n赤蛮奇没回嘴，只把额头抵在椅背上，肩膀抖得很厉害。\n\n咲夜安静记完，才把笔收起来。她看著三人，没有得意，只有一种事情终于排回正位的冷静。\n「很好。」她说。\n\n她转身走到门口，美铃已经在外面等著。美铃看了她一眼，又往屋里看了一眼，眉头压得很低。\n「问出来了？」\n\n咲夜点头。\n「人里边缘的雨后巷口、低矮屋顶与阴影交错处。」\n\n美铃沉默两秒，才开口。「她们怎么办？」\n\n咲夜把手套重新拉整，语气干净得不带灰。\n「关起来。」\n\n她回头看了那三个草根妖怪最后一眼。\n「等我把鬼人正邪带回来，再决定她们还值不值得活。」"
kyo_sakuya_best_maid_event.2.a:"去把正邪拖出来。"

scarlet.29.t:0 "废墟里的龙 上"
scarlet.29.d:0 "很多人都问过红美铃同一个问题。\n\n你明明是妖怪，为什么活得这么像人？\n\n美铃很少正面回答。她通常只是笑笑，把茶递过去，或者把话题轻轻带开。可若真要往前追，就得追到很久以前——追到她还不是红魔馆门番，只是一条失去信仰、也失去方向的龙。\n\n那时的她没有现在这副样子。她不懂什么叫分寸，也不懂什么叫克制。她只知道自己曾被一座村落供奉，被香火与祈祷养大。人们向她求雨、求平安、求丰年；她盘踞在山与云之间，也理所当然地以为，那就是自己的位置。\n\n后来那座村落没了。\n\n不是慢慢衰败，是一夜之间被屠干净。火烧过屋梁，血泡烂泥地，老人、小孩、牲口，全倒在一起。她赶回去时，只看见断墙、焦木，还有供桌上那块裂开的牌位。\n\n她站在灰烬里，很久都没有动。\n\n没有人再向她祈愿。\n也没有人再需要她。\n\n她第一次发现，原来一条龙也会来不及。\n\n那之后，她离开了那片地方。不是为了复仇，也不是为了重建。她只是忽然不知道，自己还能为什么活。她的信仰没了，守护的东西没了，连愤怒都烧不久，最后只剩一副还能走的身体。\n\n她四处游荡，脾气比现在坏得多，也更像妖怪。谁靠近，她就瞪；谁多看两眼，她就想动手。她那时候觉得，这世界既然能把一整座村子碾碎，那自己也没必要对它客气。\n\n直到有一天，一个游历四方的道士在废墟边把她捡了起来。\n\n那人衣服旧，背著一把木剑，鞋底都是泥，脸上却没什么怕意。他看著蹲在断墙上的美铃，先是叹了口气，然后才开口。\n「妳要在这里守多久？」\n\n美铃没理他。\n\n他就自己坐下，从包袱里掏出半块干粮，放在石头上。\n「村子回不来了。」\n\n这句话一出口，美铃立刻抬头，眼神凶得像要咬人。\n「闭嘴。」\n\n道士却只是看著她。\n「我没叫妳忘。」\n「我是说，妳再蹲下去，也只会跟这堆灰一起烂掉。」\n\n美铃后来想想，自己大概就是从那时候开始，没办法把这人赶走的。\n\n她跟著那个道士走了。\n\n不是因为信任。\n只是因为，她已经没有地方可去。"
scarlet.29.a:0 "跟著他，往前走。"

scarlet.30.t:0 "废墟里的龙 下"
scarlet.30.d:0 "美铃跟著那个道士走过很多地方。\n\n他们走山路、过河道、进城镇，也穿过荒郊。那道士会教她看天象、辨地气、记水脉，也会在夜里坐在火堆旁，讲些她一开始根本听不懂的东西。\n\n什么清静，什么无为，什么守拙，什么收锋。\n\n美铃常常皱著眉。\n「你们人类就是喜欢把话说得弯弯绕绕。」\n\n道士听了就笑。\n「那是因为妳太急。」\n「龙一向都这样？」\n「我怎么知道。」美铃没好气地说，「我又没见过第二条。」\n\n道士笑了很久，最后才慢慢补一句。\n「那妳就先学学人吧。」\n\n这句话她记了很久。\n\n往后的日子里，她跟著他看过很多人。看过穷得只剩半碗粥的人家，还是会把最后一口留给家里最小的孩子；看过被山匪抢光的商队，第二天照样把车轮修好继续上路；也看过快病死的老人，躺在门口晒太阳，还有力气叮嘱孙子记得把鸡喂了。\n\n人类真的很弱。\n\n会病，会老，会饿，会被刀砍死，也会被一场火烧得什么都不剩。\n\n可他们又很奇怪。明明什么都抓不久，却总想著守住点什么；明明活得短，却总爱把承诺说得很长。\n\n美铃一开始不懂，后来慢慢看懂一点。\n\n强大不一定是把别人踩下去。\n有时候，强大只是明明能毁掉，却选择不毁掉；明明能夺走，却愿意替人留一条路。\n\n那道士没有把她教成圣人。他只是让她明白，活著不一定非得像野兽一样张牙舞爪。守规矩不是懦弱，克制也不是屈服。真正有力量的人，不是想做什么就做什么，而是知道自己能做，却还愿意收手。\n\n某天，美铃问他。\n「你当初为什么不怕我？」\n\n道士背著手往前走，头也不回。\n「因为妳眼里有火，没有烂。」\n「只要没烂，就还能活成别的样子。」\n\n很多年后，红美铃站在红魔馆门口，穿著整齐的衣服，对来客微笑，替人让路，也替人划线。旁人看她，总觉得她像在学人。\n\n也许没错。\n\n她确实是在学。\n\n学怎么像人那样，把一扇门守成一个地方；学怎么像人那样，在失去一切之后，还愿意相信有些东西值得留下。"
scarlet.30.a:0 "她选择像人那样活。"



 # ======================================================
 # Gensokyo: Coexistence or Extinction
