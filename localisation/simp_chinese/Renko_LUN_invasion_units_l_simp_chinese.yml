l_simp_chinese:
 Renko_LUN_invasion_infantry:0 "月都侵军步兵营"
 Renko_LUN_invasion_infantry_desc:0 "以月都科技与术式强化的精锐作战营，计入特种部队容量。负责复杂地形中的突击与占领，使用步兵装备。"
 Renko_LUN_invasion_medium_armor:0 "月都侵军中坦营"
 Renko_LUN_invasion_medium_armor_desc:0 "以月都科技与术式强化的精锐作战营，计入特种部队容量。以中型坦克承担正面突破，使用普通中型坦克装备。"
 Renko_LUN_invasion_medium_tankdestroyer:0 "月都侵军中坦歼营"
 Renko_LUN_invasion_medium_tankdestroyer_desc:0 "以月都科技与术式强化的精锐作战营，计入特种部队容量。负责反装甲作战，使用中型坦克歼击车装备。"
 Renko_LUN_invasion_medium_anti_air_support:0 "月都侵军中防空团属支援连"
 Renko_LUN_invasion_medium_anti_air_support_desc:0 "以月都科技与术式强化的团属支援连，不计入特种部队容量。为步兵、机动与装甲团提供随行防空，使用中型自行防空炮装备。"
 Renko_LUN_invasion_heavy_tankdestroyer_support:0 "月都侵军重坦歼团属支援连"
 Renko_LUN_invasion_heavy_tankdestroyer_support_desc:0 "以月都科技与术式强化的团属支援连，不计入特种部队容量。为装甲及战斗支援团提供重型反装甲火力，使用重型坦克歼击车装备。"
 Renko_LUN_invasion_units_tech:0 "月都侵军编制"
 Renko_LUN_invasion_units_tech_desc:0 "解锁月都侵军三个特种营及两种团属支援连。"
