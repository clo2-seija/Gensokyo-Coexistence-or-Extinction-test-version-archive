 # ==============================
 # Scarlet prestige decision system
 # ==============================
    scarlet_prestige_system:0 "红魔馆权力中枢：权威评议"
    scarlet_prestige_system_desc:0 "真正的统治，不只建立在君主的威名之上，也建立在核心臣属的权威秩序之中。红魔馆诸位核心人物的地位高低，将决定谁能分掌权力、谁能传达王意，并直接影响这座政权的统御效率、内部倾轧与对外扩张。"

 

 # ==============================
 # Scarlet prestige GUI
 # ==============================
    scarlet_prestige_gui_title:0 "红魔馆§Y统治权势§!"
    scarlet_prestige_gui_subtitle:0 "吸血鬼霸权"
    scarlet_prestige_gui_close_tt:0 "关闭"
    scarlet_prestige_gui_hint:0 "提示：威严只会增加；当某位成员的威严明显高于或低于其他成员（差距≥3）时，将触发特殊的政治优势与内部失衡效果。"

 scarlet_prestige_tt_sakuya:0 "咲夜\n当前威望：[?scarlet_prestige_sakuya]"
 scarlet_prestige_tt_meiling:0 "美铃\n当前威望：[?scarlet_prestige_meiling]"
 scarlet_prestige_tt_remilia:0 "蕾米莉亚\n当前威望：[?scarlet_prestige_remilia]"
 scarlet_prestige_tt_flandre:0 "芙兰朵露\n当前威望：[?scarlet_prestige_flandre]"
