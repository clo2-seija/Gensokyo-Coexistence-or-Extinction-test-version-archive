KYO_afterwar.23.t:0 "四个没有共同未来的国家"
KYO_afterwar.23.d:0 "最后一班列车停在分界桥前。司机递出百妖协议时期签发的通行证，守军看了一眼，要他换成当地的新证件。桥那头也有一座检查站，挂着另一面旗；两边都说粮车不能耽搁，却谁也不肯先抬起栏杆。\n\n八云蓝的使者正是在这时赶往另外三个控制区。蓝要求各方暂缓进军一日，好让维护队完成新结界的节点交接。文件避开了统治权，仍盖着八云紧急政府的印章。她交代使者带回明确答复，随后去检查中央档案的转移名单。紫留下的会场已经封闭，外面站着持枪的卫兵。\n\n红魔馆退回了原封未动的信。蕾米莉亚正在检阅部队，军官把信放到她手边，她只问邻境的道路能否通行。得到答复后，她让军官照原定时刻出发。战时礼服已经换好，她也无意再把对统治权的要求藏在协商措辞里。\n\n命莲寺的回信由白莲亲自签署。寺方愿意保障本区节点的维护，却不接受八云家继续作为中央发号施令。送走使者后，她留在山门前，听守备队报出防区和避难处的位置。钟声响起，僧兵陆续下山；原本搬运救济品的车辆，也分出了几辆去运伤员所需的药物。\n\n正邪把同一封信贴上工坊的墙。围过来的人读到印章处，有人骂了一句旧中央。她让各地扣住粮食，撤掉能替敌军指路的标记，准备天亮后的行动。工人拿走了自己的工具，墙上的文件无人取下。\n\n使者们返回时，蓝面前只多了一份有签名的拒绝。她听完汇报，命部队守住节点、档案与尚能控制的道路。边界上的士兵开始辨认对面岗哨的人影，有几个名字，他们在对日作战时还叫得出来。\n\n月面的观测记录添上了这些调动。观测者暂未提出新的攻击要求，列岛内部已经截断了运输，架好了炮位。它们要继续看的，是四方是否会连同刚保住的新结界一起毁掉。\n\n夜里，粮车仍停在桥前。司机熄了灯，怕自己的车厢遮住了身后机枪的射界。"
KYO_afterwar.23.a:0 "四封作战命令，同时送往前线。"





kyo_postwar.11.t:0 "四道声音，四个未来"
kyo_postwar.11.d:0 "同一个夜晚，四道声音沿著不同的电台、寺钟与地方联络网传遍列岛。\n\n八云蓝的声音最先响起，冷静得像仍在紫身旁报告。\n\n「结界完成度尚可维持。行政、补给、节点修正，皆有既定程序。八云紫大人留下的世界不需要新的主人，它需要有人确保明日仍然存在。悲伤暂缓，争论暂缓。所有人返回位置，完成她最后交付的工作。」\n\n红魔馆的广播随后覆过夜色。蕾米莉亚没有掩饰笑意。\n\n「你们已经看够了无休止的会议，也看清了没有统治者的国家会变成什么模样。幻想乡不需要更多胆怯的妥协。跪下，服从，然后看著我把月亮、叛徒与混乱一同踩在脚下。我不许诺平等——我只许诺胜利。」\n\n命莲寺的钟声穿过收容所与战后废墟。白莲站在山门之前，面向那些仍未得到安葬与归所的人。\n\n「我们不能用另一场压迫纪念八云紫的牺牲。人类、妖怪、神明与亡者都曾为这个世界流血，便没有谁生来只能服从。和平不会自行到来，我们也不能靠祈求避开战斗。若慈悲必须披甲而行，那么今日，我将走在最前面。」\n\n最后传来的是正邪的声音。没有庄严的会场，只有工坊的铁器声、村落的火光，以及逐渐聚集的人群。\n\n「听见了吗？一个要你们服从旧秩序，一个要你们跪在王座前，另一个要你们再相信一次高位者的善意。」\n\n「紫已经死了。她最后留下的空位，不该再交给另一个自称更懂你们的人。这次别等待，别请愿，也别把未来送到别人的桌上。把旗帜颠倒，把门踢开——幻想乡该由一直被踩在下面的人亲手夺回。」\n\n四道声音都在谈论八云紫留下的世界。\n\n但那个世界只能朝一个方向前进。"

kyo_postwar.11.a:0 "§W「把旗帜颠倒——跟随鬼人正邪。」§!"
kyo_postwar.11.b:0 "§3「完成最后的工作——跟随八云蓝。」§!"
kyo_postwar.11.c:0 "§0「让慈悲披甲而行——跟随圣白莲。」§!"
kyo_postwar.11.e:0 "§R「跪下，然后见证胜利——跟随蕾米莉亚。」§!"

kyo_postwar.12.t:0 "颠倒的旗帜升起"
kyo_postwar.12.d:0 "百妖协议的地方联络网已经不再向中央回报。\n\n工坊敲响铁器，村落封闭道路，地方自卫队拆下原有徽记。那些曾替联军运送粮食、修补武器、引导部队的底层妖怪，如今将颠倒的旗帜升上自己的聚落。\n\n鬼人正邪宣布下克上阵线成立。她拒绝承认任何人有权继承八云紫的位置，也不接受红魔馆、命莲寺或八云紧急政府重新命令地方。\n\n这不是一个整齐的国家。它由互不相同的村落、工坊、弱小妖怪与地方武装组成，有人为革命而来，有人只想保住自己的家，也有人等待向昔日的压迫者报仇。\n\n但在这一刻，她们拥有同一个敌人：所有准备把权力重新收回高处的人。\n\n下克上阵线已经成为独立的交战政权。昔日百妖协议的道路，从此成为它与其他势力之间的战线。"
kyo_postwar.12.a:0 "§W权力不会被归还，它将被底层夺走。§!"

kyo_postwar.13.t:0 "命莲寺敲响集结之钟"
kyo_postwar.13.d:0 "命莲寺的钟声越过收容所、寺社与战后废墟。\n\n救护队停止向其他势力移交物资，地方寺院封闭军队征用的道路，曾受到命莲寺庇护的人类与妖怪开始在山门之外集结。\n\n圣白莲宣布成立新的临时政权。她拒绝承认任何军队、血统或中央档案能够自动带来统治资格，也不允许战后救济体系成为其他势力补充兵力与物资的仓库。\n\n她仍谈论和平，却不再把和平理解为退让。若红魔馆以秩序要求服从，若八云紧急政府以存续要求延续旧有权力，若下克上阵线以革命之名煽动报复，命莲寺都将予以抵抗。\n\n寺社、救护站、收容所与地方信任共同连成新的疆域。曾经属于百妖协议的盟友，现在必须在命莲寺的防线前停下。\n\n命莲寺政权已经成为独立的交战政权。白莲将以武力证明，慈悲并不等于任人宰割。"
kyo_postwar.13.a:0 "§0若和平必须披甲而行，我们便守住这条道路。§!"

kyo_postwar.14.t:0 "红魔馆宣布新秩序"
kyo_postwar.14.d:0 "红雾再次越过湖面，却不再只笼罩红魔馆的领地。\n\n近卫部队接管沿途要塞，各地军官收到重新效忠的命令。曾在对日战争中服从共同指挥的军团，如今必须选择是否接受斯卡雷特家的旗帜。\n\n蕾米莉亚宣布红魔馆政权成立。她不接受由寺院、地方议会或一名式神决定幻想乡的未来。在她看来，八云紫留下的空位不是一场需要反复讨论的难题，而是一个等待真正统治者坐上的王座。\n\n红魔馆以军功、服从与明确的阶级划定自己的秩序。愿意效忠者将得到保护与地位；拒绝承认新主人者，则会被视为阻碍幻想乡统一的叛逆。\n\n昔日盟军的旗帜已经从红魔馆防区降下，通往另外三方的道路也被正式封锁。\n\n红魔馆政权已经成为独立的交战政权。蕾米莉亚不准备与其他人分享胜利后的世界。"
kyo_postwar.14.a:0 "§R黑夜只能有一位主人。§!"

kyo_postwar.15.t:0 "八云紧急政府接管中央"
kyo_postwar.15.d:0 "八云紫死后，中央会场没有立刻关闭。\n\n蓝封存紫留下的命令，接管结界纪录与仍愿意服从中央的行政人员。各地节点继续运作，补给表仍在更新，命令也仍以八云家的印章送往远方。\n\n她没有宣称自己继承八云紫，也没有要求任何人向她效忠。\n\n她只是宣布，在新结界能够脱离紧急维护以前，任何势力都不得夺取中央、拆分节点或将紫留下的体系据为己有。红魔馆的接管、命莲寺的另立政权与正邪的地方动员，皆被列为危及结界存续的行动。\n\n然而，另外三方所看见的并不是一个暂时维持秩序的机构。她们看见的是八云家仍在发布命令，仍在占据中央，仍试图以紫留下的名义要求所有人服从。\n\n中央所能控制的地区已经与另外三方断开联系。曾属于同一套行政体系的土地，如今被命令、封锁线与互不承认的权威分割。\n\n八云紧急政府已经成为独立的交战政权。蓝只想守住紫留下的世界，但她也必须先击败所有试图重新塑造它的人。"
kyo_postwar.15.a:0 "§3在结界稳定以前，中央不能再倒下。§!"




 kyo_postwar.17.t:0 "百妖联军解体"
 kyo_postwar.17.d:0 "八云紫死后的七日里，列岛上没有爆发大规模交火。\n\n这并非因为四方仍愿意谈判，而是新结界尚未完成稳定。没有人知道哪一座桥梁下埋著锚点，哪一处军营建立在脆弱的边界上，也没有人敢在尚未确认以前，用炮火摧毁维持世界运转的部分。\n\n短暂的寂静之中，百妖联军开始从内部消失。\n\n军团的共同番号被撤下，中央调令失去效力。红魔馆出身的军官带著部下返回原有主君身旁；命莲寺的信众离开营地，转而守卫寺社与收容所；地方出身的士兵携带武器回到村落与工坊；仍愿意服从八云家的部队，则被重新编入结界守备与紧急行政体系。\n\n有些营区在一夜之间空无一人，有些部队在行军途中自行分成数支。仓库的武器被附近势力接管，铁路上的军需列车也被改送至新的控制区。昨日仍并肩作战的士兵，如今已在不同的旗帜下重新登记姓名。\n\n蓝没有能力阻止这场解体。她所掌握的命令仍属于一个已经不存在的中央，而继续维持百妖联军的外壳，只会让任何一方都能假借旧番号夺取武器与土地。\n\n于是，最后一份共同解编令被送往各地。\n\n百妖联军至此不复存在。\n\n留下的士兵、装备与军官，将由四个新生政权重新召集。当下一次命令抵达时，他们不会再以盟友的身分集合，而会在彼此对面的战线上重新成军。\n\n§R所有现有部队都将解散。各内战势力将依照自己的控制区与支持基础重新组建军队。§!"
kyo_postwar.17.a:0 "共同的军队已经成为过去。"


 kyo_postwar.23.t:0 "月面上的失败报告"
 kyo_postwar.23.d:0 "月都高层收到地上回传的最后一份报告：四方内战的胜利者已经看穿第二次攻击，并追溯到绵月家的指挥链。一次暗杀不再足以终结幻想乡。月都远征总署因此成立。"
 kyo_postwar.23.a:0 "下一次不会只是一道光。"

    
    kyo_postwar.24.t:0 "争取幻想乡的支持"
    kyo_postwar.24.d:0 "内战不仅取决于前线，也取决于谁能赢得各地势力的信任。\n\n在§R“战火中的归属”§!决议中，可以通过援助与承诺提高好感度。好感度达到§G5§!时，中立势力将公开支持我们，并提供相应加成。\n\n若目标已经支持敌方，达到5点只会先使其恢复中立，之后必须再次争取。其他阵营每隔§R15日§!也会展开一次拉拢行动。\n\n集中争取接近5点的势力，并及时阻止敌人完成交涉。获得的支持越多，最终决战时能够动员的力量便越强。"
    kyo_postwar.24.a:0 "胜利也需要盟友。"











 KYO_yukari_legacy.1.t:0 "她回来得太晚"
 KYO_yukari_legacy.1.yakumo:0 "爆炸当夜，宇佐见莲子独自从废弃地底车站走出。她的外貌与战前毫无差别，梅莉却不在身边。寄给八云家的信只写著：『妳们正在继承她留下的档案，月亮要摧毁的却不是她的政府。若想知道她真正留下了什么，去找一座没有终点的车站。』"
 KYO_yukari_legacy.1.remilia:0 "爆炸当夜，宇佐见莲子独自从废弃地底车站走出。寄给红魔馆的信写著：『妳可以夺走她的疆界，却不能只把那份力量当成武器。月亮要杀死的是比国家更古老的东西。去找一座没有终点的车站。』"
 KYO_yukari_legacy.1.hijiri:0 "爆炸当夜，宇佐见莲子独自从废弃地底车站走出。寄给命莲寺的信写著：『她建立这个地方并不只为保护现在活著的人。若想知道那份保护最初为谁准备，去找一座没有终点的车站。』"
 KYO_yukari_legacy.1.seija:0 "爆炸当夜，宇佐见莲子独自从废弃地底车站走出。寄给正邪的信写著：『妳最讨厌所有人把世界交给一个主人。那就去看看她为何把世界做成只能由自己维持的样子。答案在一座没有终点的车站。』"
 KYO_yukari_legacy.1.a:0 "只有这一封信会成为本局的调查。"




 KYO_yukari_legacy.history_unseen:0 "§8这段被遗忘的历史。§!"



 KYO_yukari_legacy.10.t:0 "第一章：没有作者的遗诗"
 KYO_yukari_legacy.10.d:0 "八云紫死后，那把总被她藏在笑容后面的折扇留在了祭台上。\n\n没有人能够打开它。扇骨之间残留着浓重的境界妖力，每当有人试图触碰，近处与远方、清醒与梦境便会短暂混淆。直到紫的气息彻底消散，失去主人的力量才开始自行崩解。\n\n过去与未来之间的距离骤然缩短，被遗忘之事越过记忆的界线，纷纷回到扇面。墨迹沿着空白纸页缓慢浮现，时而是残缺诗句，时而是无人见过的星图；古老神社、寂静月海与遥远未来的城市，也在字迹之间彼此重叠。\n\n这些诗并非紫亲手写下。它们是她在漫长岁月中舍弃的名字、忘却的约定，以及为了继续作为八云紫而割离出去的记忆。死亡解除了最后一道封锁，使那些不属于同一时代的往事重新汇聚。\n\n当第一行诗完整显现，持扇者看见的不是贤者八云紫的诞生，而是一个早已被她自己遗忘的人类少女。"

  KYO_yukari_legacy.20.t:0 "第二章：只剩现实的上阙"
 KYO_yukari_legacy.20.d:0 "扇面诗歌的上阙写道：月上尚有神，地上已无梦。\n\n遥远的科学世纪里，幻想早已从地球消逝。神明死于无人祭祀，妖怪沦为书页上的怪谈，灵魂、梦境与奇迹皆被归入无法验证的迷信。人类拥有足以重塑山海的技术，却只相信能够测量的现实。\n\n月都向地球发动战争时，这份现实成为了人类最大的弱点。依姬请下那些仍被月面铭记、却早已被地上遗忘的神祇；丰姬则折叠海洋与空间，让炮火越过距离直接降临城市。人类能够计算攻击的能量，却无法理解神明为何回应，也无法瞄准一条随时改变的境界。地球的防线逐一崩溃，只剩科学的文明终于败给了自己早已遗忘的事物。\n\n战争末期，秘封俱乐部的宇佐见莲子与玛艾露贝莉·赫恩进入博丽神社遗迹。倒塌的鸟居后只剩半块写着“博丽”的牌匾，地下却保存着一层无法被仪器记录的空间。莲子抬头时，看见星空中同时重叠着数个时代的天象；梅莉触碰残破的赛钱箱，则听见境界另一端传来尚未存在的蝉鸣。\n\n莲子以星辰确定时间，以经纬确定落点；梅莉则沿着神社残存的力量，撕开“此刻”与“彼时”之间的界线。当月面的白光再次照亮遗迹，两人一同跨过了那道缝隙。\n\n那里没有道路，也没有可以乘坐的列车。城市的灯火在她们身后拉成长线，星座逆转方向，月相在一次呼吸间盈亏千百次。海岸、山脉与语言从脚下不断退去，无数尚未发生的历史像薄纸般从身旁掠过。莲子紧盯星辰，维持通往目标年代的方向；梅莉则以自己的身体撑住不断闭合的境界。\n\n这场穿越夺走了梅莉作为人类的生命。抵达远古时，她依然能够行走、思考与呼吸，身体却不再衰老，影子也开始偏离阳光。她被留在生与死、人类与妖怪的夹缝之间，只能依靠逐渐觉醒的境界之力继续存在。\n\n莲子将那块“博丽”牌匾立在她们抵达之处，作为确认时代与方位的第一座锚点。最初的鸟居由此竖立，梅莉则在其旁度过远比人类一生漫长的岁月。\n\n她的力量愈发强大，自我的边界却日益模糊。科学世纪的街道、秘封俱乐部与自己的姓名相继从记忆中脱落。当她终于不再回应“梅莉”，残存的思绪便在境界深处汇成了另一个名字。\n\n莲子最先将它念了出来——八云紫。"

  KYO_yukari_legacy.30.t:0 "第三章：以博丽为名的下阙"
 KYO_yukari_legacy.30.d:0 "诗歌的下阙没有继续哀悼毁灭的未来，而是写下了一座尚不存在的故乡。\n\n莲子从神社遗迹带回的残破牌匾上取下“博丽”二字，将其作为自己在这个时代的名字。她隐去宇佐见莲子的身份，成为传说中的第一任博丽巫女，在两人抵达之处重新竖起鸟居，以星辰制定历法，以仪式固定被穿越撕裂的时空。\n\n梅莉却无法再回到原本的时代。穿越已经夺走她作为人类的生命，使她停留在生死、过去与未来的夹缝之中。村民开始传说黄昏的道路会突然裂开，旅人则声称在门扉与阴影的另一侧看见了金色眼睛。人类对于界线之外的恐惧与想象逐渐汇聚到她身上，使那个正在遗忘自己姓名的少女，成为名为八云紫的妖怪。\n\n紫以神社为中心划下最初的边界，将遭到驱逐的妖怪、失去信徒的神明，以及所有即将从现实中消失的怪异带入其中。幻想乡由此萌芽。它最初并非乐园，而是一项跨越时代的计划：在科学与现实吞没一切以前，为地球保存足以对抗月都的幻想。\n\n数百年后，紫集结这些被保存下来的力量，发动了第一次月面战争。绵月丰姬扭曲距离，使妖怪大军始终无法抵达真正的月都；绵月依姬则请下神明，将那些自以为能够凭数量取胜的入侵者逐一击溃。\n\n紫带着败军返回地上，却没有空手而归。月都第一次看见本应走向无神时代的地球，重新拥有了妖怪、神明与境界。她未能改变未来，却让月人开始畏惧：这个名为八云紫的存在，或许真的能够使注定的结局偏离轨道。"


 KYO_yukari_legacy.40.t:0 "第四章：名为八云紫的怪谈"
 KYO_yukari_legacy.40.d:0 "月面败退以后，紫第一次意识到，自己带去月都的并不是被保存起来的武器。那些妖怪会因同伴死去而悲伤，会惦记山林的春天，也会在返回幻想乡时庆幸家园仍未遭到战火吞没。\n\n于是，她开始改变这项工程。她为神明划分信仰，为妖怪保留容身之处，也为人类留下能够安全生活的村落。最初用来储存幻想力量的边界，逐渐有了季节、道路、宴会与传说。幻想乡不再只为一场尚未发生的战争存在，而成为居民愿意为之活下去的故乡。\n\n莲子偶尔会循着星辰重新出现在这个时代。每一次相见，她都能看见梅莉的痕迹变得更加稀薄。紫先忘记科学世纪的城市，继而忘记秘封俱乐部，最后连莲子的容貌也只能勾起一阵无法解释的熟悉。\n\n莲子没有强迫她恢复记忆。她将两人的约定改写成博丽巫女与境界妖怪之间的职责：巫女守住幻想乡与外界的入口，紫则保证没有任何一任巫女必须独自承担整个世界。完成最后一项仪式后，莲子从公开的历史中消失，只留下博丽之名继续传承。\n\n梅莉原本的记忆终究被漫长岁月磨去，但她并未彻底消失。人类对于门后、夜色、远方与未知世界的恐惧，替她维持了妖怪的形体；而她想要保护某种事物的执念，则留在八云紫的每一道境界之中。\n\n她已经忘记幻想乡最初是为了战争而建，却再也没有把生活其中的人称作储备。"


  KYO_yukari_legacy.50.t:0 "第五章：被遗忘者的故乡"
 KYO_yukari_legacy.50.d:0 "幻想乡并非在某一天突然建成。月面败退以后，紫用了数百年时间，将散落在世界各处的怪异一一带到自己划下的边界之中。\n\n鬼族曾在妖怪山建立聚落，以力量与酒宴维持粗犷的秩序。后来，人类与鬼之间的信任彻底破裂，鬼族选择离开地表，沿着废弃地狱的通道迁往地下。紫没有阻止，只替他们封住追兵，并保证地上的争端不会越过旧都入口。\n\n鬼族离去后，天狗迁入空出的山岳。她们建立哨所、道路与消息网络，河童则沿溪流开设工坊。曾经只有强者能够占据的妖怪山，逐渐成为拥有自身法律、产业与领地意识的共同体。\n\n与此同时，越来越多弱小妖怪逃入幻想乡。她们无力在人类扩张的世界中维持存在，也无法与强大的妖怪争夺领地。紫为她们划出栖身之所，又将散落的人类聚集起来，建立人间之里。里内不得捕食，里外也不许随意猎杀妖怪；这条并不公平却足以维持生存的界线，成为幻想乡最早的秩序。\n\n活人的边界确定以后，紫又前往彼岸与冥界交涉。死者归于白玉楼，罪业交由是非曲直厅裁断，怨灵则不得任意返回地上。遭人畏惧的古明地姐妹被安置在旧地狱深处：觉负责监视怨灵与地底异变，恋则穿行于无人注意的道路，为封闭的地下保留一线与外界相连的可能。\n\n来自西方的吸血鬼也曾带着眷属越过边界。她们逃离猎人与战火，以不可违背的血契换取红魔湖畔的容身之处。此后，失去故土的妖魔、无人祭祀的神明与遭现代世界否定的传说陆续从各地抵达，在这里重新获得名字。\n\n紫终于承认，仅凭自己无法管理这样一个世界。她邀请其他有能力看见全局的人分担贤者之责，让不同的意志共同维持边界、后门与人妖之间的平衡。\n\n当博丽大结界最终闭合时，幻想乡已经不再属于八云紫一人。它成为被世界遗忘者共同建立的避难所——外界可以忘记她们，但在这道边界以内，没有任何存在必须因为无人相信而消失。"
 
 






 KYO_yukari_legacy_poem_title:0 "《界外遗歌》"

 KYO_yukari_legacy_poem_1:0 "§Y其一·无主之扇§!\n\n月白无声照故台，\n扇底残香旧界开。\n昨日明朝同入墨，\n人名鬼号共成埃。\n一身曾隔千重世，\n一死还教万忆来。\n若问诗从何处起，\n且听无主故扇哀。"

 KYO_yukari_legacy_poem_2:0 "§Y其二·无神之世§!\n\n神去人间月尚明，\n妖归故纸梦无名。\n铁城尽测乾坤理，\n不识神威越矩衡。\n丰姬折海临诸国，\n依姬请神破重城。\n末世双姝寻古社，\n残匾犹存博丽名。\n\n莲子循辰牵旧岁，\n梅莉开隙裂今生。\n月相千回一息尽，\n山河万古逆流行。\n灯火倒悬沉昨日，\n回眸身后已无城。"

 KYO_yukari_legacy_poem_3:0 "§Y其三·博丽与八云§!\n\n残匾借来博丽姓，\n孤祠镇住古今程。\n莲子持幡称巫女，\n梅莉无坟亦不生。\n路尽人疑藏异境，\n门开童惧有妖睛。\n千村畏语凝新魄，\n八云紫自梦中生。\n\n收神纳怪归山野，\n一乡自此名幻想。\n本非桃源逃乱世，\n只为来日拒天兵。"

 KYO_yukari_legacy_poem_4:0 "§Y其四·月海败军§!\n\n曾引百妖登月海，\n丰姬移路隔天京。\n依姬降神摧众阵，\n败旗卷尽返东瀛。\n月人自此书其隙，\n惧有凡尘改宿命。\n\n归来方识非兵库，\n伤者犹询故里樱。\n若使群灵唯待战，\n未逢明日已先倾。\n遂将边界留尘世，\n不只藏兵更护生。"

 KYO_yukari_legacy_poem_5:0 "§Y其五·遗忘者之乡§!\n\n鬼族曾居妖怪山，\n人鬼盟残辞岭月。\n沿焰沉身入地关，\n天狗继来栖故岳。\n河童凿水转机轮，\n山路新闻通昼夜。\n\n弱怪携名投界里，\n孤神抱祭入乡门。\n聚人灯火成人里，\n约使人妖各守分。\n强者不得欺微命，\n巫女亦难尽斩尘。\n\n彼岸定评生死案，\n冥樱收骨渡亡魂。\n觉听怨语看幽火，\n恋过无心未锁门。\n地上无容栖地下，\n旧都从此亦为村。\n\n西来血裔辞兵猎，\n红馆凭约卧湖滨。\n万国遗神同避世，\n百方旧怪共为邻。\n乡音虽隔千重海，\n入界皆能再有名。\n\n一贤难理千般界，\n茨仙持戒定人妖。\n秘神开门收异客，\n三贤各守一方门。\n博丽长悬分世幕，\n八云暗引往来程。\n\n大界终成忘者国，\n世间不忆此间存。\n若有传说无家去，\n此山仍为旧梦留。"

 KYO_yukari_legacy_poem_6:0 "§Y其六·双名一生§!\n\n梅莉初寻界外声，\n八云后来定死生。\n梅莉惧看无神世，\n八云敢向月宫征。\n\n梅莉只知双人约，\n八云能容万类争。\n梅莉渐忘来时路，\n八云长守万家灯。\n\n梅莉曾在星间笑，\n八云行遍万重境。\n非有新魂吞旧我，\n只因旧我历长生。\n\n梅莉曾思救末世，\n八云终愿护灯明。\n一个名字留昨日，\n一个名字度千春。\n\n扇中两字相交叠，\n再辨何者旧时人。\n梅莉未曾凭空逝，\n八云亦非陌路魂。\n\n莲子读完千载字，\n方知双名本同生。\n不愿抹除紫此世，\n只求梅莉再回身。\n\n轻抚扇骨低声唤：\n故人可否返星庭？\n扇合无言，长风亦止——\n\n余行留白，静待归人。"

 KYO_yukari_legacy_poem_stop:"合上折扇，停止阅读"


