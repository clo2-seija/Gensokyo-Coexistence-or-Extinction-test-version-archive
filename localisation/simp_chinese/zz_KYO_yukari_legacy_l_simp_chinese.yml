 KYO_cws_legacy_story_final_option:0 "她留下的不是王座，而是一套仍必须继续运转的责任。"
 KYO_cws_legacy_story_lost_event.t:0 "线索已经落入他人手中"
 KYO_cws_legacy_story_lost_event.d:0 "我们沿着往来记录追查间隙坐标时，另一支内战势力已经拼合通行印并接管紧急调度权限。余下档案失去作用，八云紫的遗产暂时有了新的持有者。"
 KYO_cws_legacy_story_lost_event.a:0 "这场战争连死者留下的答案也有人争夺。"

 KYO_yukari_legacy.60.t:0 "没有署名的星图"
 KYO_yukari_legacy.60.d:0 "会议结束后，空椅旁只留下了一张没有署名的星图。上面的坐标连接科学世纪与幻想乡，却没有要求任何人重演过去。紫把它收入档案：缺席者留下的方法仍能帮助后来者理解世界。"
 KYO_yukari_legacy.60.a:0 "保存星图，也保存空白。"
