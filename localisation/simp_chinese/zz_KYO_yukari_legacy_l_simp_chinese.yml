l_simp_chinese:

KYO_after_war_reform:0 "胜利之后，没有人离席"
KYO_after_war_reform_desc:0 "日本政府已经投降，前线的炮声也逐渐沉寂，但百妖协议所面对的问题反而比战争期间更加混乱。\n\n数十万士兵等待复员，占领区居民需要粮食与新的身分，战时被征用的铁路、工坊与土地则各自有人主张所有权。旧博丽大结界仍在恶化，日本列岛却已经被妖力、亡灵与战争留下的异常纳入幻想乡的命运。\n\n共同敌人消失后，昔日盟友不再需要压下彼此的分歧。军队要求战功得到回报，寺社要求先救济居民，地方组织拒绝把所有权力交回中央，各方都相信自己的方案才有资格定义胜利。\n\n八云紫不能允许百妖协议在此刻解散。至少在日本完成接管、新结界建立以前，这个由猜忌与共同危机勉强维持的联合体，仍必须坐在同一张桌前。"

KYO_reform_the_system:0 "百妖协议没有和平条款"
KYO_reform_the_system_desc:0 "百妖协议是为战争而生的。\n\n它能决定军团向哪里进攻、物资送往哪一段前线，也能以生存为理由要求各势力暂时服从。但协议从未规定战争结束后，日本居民应当获得什么身分，被占领的工业与港口属于谁，地方武装是否必须交械，又该由谁调查胜利者在战争中犯下的罪行。\n\n蕾米莉亚要求承认军功与征服权，白莲拒绝让保护成为永久支配，地方代表要求亲自参与工坊与土地的管理，映姬则坚持胜利不能使任何人免于追究。每一个问题都存在数种答案，而每一种答案都会造就不同的战后秩序。\n\n紫必须逐项作出裁定。这些决定未必能让各方满意，却会让原本模糊的争议逐渐形成四套彼此冲突的未来。"

KYO_reform_the_barrier:0 "重新测定幻想乡的位置"
KYO_reform_the_barrier_desc:0 "旧博丽大结界原本只需区分幻想乡与外界，如今却必须容纳整座被战争改写的日本列岛。\n\n妖力渗入城市，亡灵徘徊于旧战场，外界技术与幻想现象在铁路、港口与地脉中彼此缠绕。若只是把旧结界向外延伸，所有压力都会集中在原有节点上，最薄弱的区域迟早再次撕裂。\n\n紫、蓝与橙必须重新测量山川、都市、生死与内外之间的关系，在各地建立新的锚点，并决定结界应由中央统合、地方分担，或以不断改变的真实座标躲避外部观测。\n\n然而，每次校准都会留下细微纪录。失踪的测量设备、无法确认来源的讯号，以及远方那道没有妖力残留的白光，都在暗示另一双眼睛正沿著误差寻找八云紫的位置。"

KYO_kill_the_rebel:0 "未交回的武器"
KYO_kill_the_rebel_desc:0 "复员命令已经送往各支军团，军火库的数字却始终无法吻合。\n\n成箱步枪与弹药在运回途中失踪，地方自卫队拒绝交出最后的武器，部分工坊也藏起战时制造的装备。对中央而言，这些未受控制的军械可能成为骚乱与私人武装的起点；对村落而言，它们却是巡逻队尚未抵达以前，唯一能守住道路与粮车的东西。\n\n赤蛮奇、影狼与若鹭姬不相信一纸命令能立刻带来平等的保护。她们要求中央先证明，最偏远的聚落不会再次被排在铁路、仓库与结界工地之后。\n\n更令人不安的是，失踪的并不只有枪械。通讯零件与空间测量设备也被人从不同仓库分批取走。地方或许只想自保，但另一些藏在混乱中的人，正在组装足以追踪间隙与结界偏移的仪器。"

KYO_make_youkai_warlord_surrender:0 "谁的军队，谁的胜利"
KYO_make_youkai_warlord_surrender_desc:0 "百妖联军共同赢得了战争，却从未真正成为一支统一的军队。\n\n红魔馆近卫首先服从蕾米莉亚，天狗守卫自己的天空，河童将装备交给熟悉的部队，鬼族依靠旧日情谊集结，寺社武装与地方民兵则更相信各自的领袖与聚落。战时，八云紫的权威与共同敌人足以让这些军团朝同一方向前进；战后，中央调令开始在原有旗帜之前停下。\n\n统一番号、补给与指挥程序，能建立真正由中央调度的结界军，却会迫使各势力交出最重要的武装基础。承认军团独立，则能暂时维持合作，也意味著幻想乡仍然只是数支军队之间的协议。\n\n真正的问题不是旗帜是否保留，而是当八云紫无法亲自出面时，究竟还有谁能让所有枪口在同一道命令下转向。"

KYO_all_bow_yukari:0 "最后一次总仲裁"
KYO_all_bow_yukari_desc:0 "战后各项争议已经有了暂行答案，但命令落到现实后，新的冲突仍在不断出现。\n\n地方权利何时生效、征集令由谁监督、军火库何时交接、哪一批粮食应优先送往结界工地，以及仪式期间各军团负责守卫哪一段道路——每一项细节都足以让已经通过的方案停在纸上。\n\n蕾米莉亚不允许军队得到的权限在执行时被削减；白莲要求所有紧急措施都写明期限；赤蛮奇则指出，中央文件中的模糊语句正被地方官员用来扩大征用。没有人打算直接挑战八云紫，却都希望她的裁定更接近自己的立场。\n\n这不是要求各方臣服，而是紫最后一次把彼此矛盾的命令收束成同一套安排。方向已经决定，剩下的工作必须在仪式开始前完成。"

KYO_future_start:0 "旧结界的最后一夜"
KYO_future_start_desc:0 "所有可以延后的争议都已被暂时压下，所有能够调动的物资与人员也已抵达各自的位置。\n\n旧博丽大结界的符文将从幻想乡上空逐一熄灭，日本各地新建的鸟居与锚点则按照既定顺序启动。紫必须固定在祭台中央，以间隙将北海道、九州、妖怪山、冥界、地底与人里的节点接入同一条边界。\n\n仪式开始后，她不能离开，也不能中途停止。任何一处接合失败，都可能让城市、山川与生死之间的道路同时错位。蓝能完成所有计算，永琳能判断她还能承受多久，其他势力也能守住祭台周围的道路；但最后让整座结界成形的人只能是八云紫。\n\n而在月面上，那门曾经杀死博丽巫女的武器已经重新完成校准。它所欠缺的，只剩一个足够精确、也足够固定的落点。"









 



 KYO_lunar_interference_penalty:0 "月光中的错误座标"
 KYO_lunar_interference_penalty_desc:0 "月都的反制暂时污染了情报与计划系统；它不会封锁任何遗产章节。"
 KYO_ownerless_barrier:0 "没有主人的结界"
 KYO_ownerless_barrier_desc:0 "一处节点受损时，周围区域会隔离、路线会重算、权限与知识不会再随守护者死亡。任何单次攻击都无法引发整座结界连锁崩坏。"



KYO_afterwar.1.t:0 "胜利者没有散会"
KYO_afterwar.1.d:0 "日本投降后的第三天，百妖协议会场仍然亮著灯。\n\n墙上的作战地图尚未撤下，前线箭头旁却已被复员部队、难民营、失联仓库与结界裂口的标记覆盖。昨日还能用一纸军令处理的问题，今日全都成了彼此冲突的请愿。\n\n蓝将伤亡、欠款、粮秣与失踪物资分成数十份报告。橙则从地方带回另一种消息：占领区缺粮，村落不愿缴械，日本居民也在追问自己今后究竟算是俘虏、臣民，还是仍能守住家门的人。\n\n蕾米莉亚要求优先确认军功与占领权。白莲则反问，若胜利只意味著新的征收者走进村落，这场战争究竟拯救了谁。两人的声音尚未真正升高，四周代表便已分成数群。\n\n紫坐在主位，面前的茶早已冷透。\n\n她没有要求任何人和解，只合起扇子。\n\n「接管日本与新结界完成以前，百妖协议继续运作。」\n\n没有人满意。\n\n也没有人离席。"
KYO_afterwar.1.a:0 "共同敌人消失了，共同问题才刚开始。"


KYO_afterwar.2.t:0 "被征服者该叫什么"
KYO_afterwar.2.d:0 "第一场争论始于行政文件上的一处空白。\n\n日本人究竟应被登记为战败臣民、受保护居民，还是拥有地方权利的新公民？这个称呼将决定他们能否保有土地、组织自治、领取配给，乃至拒绝胜利者的征用。\n\n白莲拒绝让「保护」成为永久支配的别名。她要求承认最基本的权利，并让地方居民对自己的生活保有发言资格。\n\n蕾米莉亚端起酒杯，从容地提醒她：「土地是军队打下来的。若胜利不能带来统治权，那些死者得到的便只剩一座墓碑。」\n\n正邪依旧没有走进会场。赤蛮奇坐在万民委员会的位置上，把她带来的意见放到桌面，又添上自己的问题。\n\n「臣民、居民、公民。写得再好看，最后还是得看他们能不能拒绝你们。」\n\n映姬要求称呼必须对应明确权利，不能只成为方便统治的文字游戏。蓝已备妥数套户籍与配给方案，却无法替众人决定哪一种秩序才算正当。\n\n争论从清晨延续到深夜，直到紫在最后一页文件上落笔。其他人可以反对，但没有人准备在此刻推翻她的裁定。"
KYO_afterwar.2.a:0 "先承认受保护居民的最低权利。"
KYO_afterwar.2.b:0 "先确立征服秩序，再讨论未来权利。"
KYO_afterwar.2.c:0 "让地方议事组织决定自己的身分。"


KYO_afterwar.3.t:0 "胜利品不够所有人分"
KYO_afterwar.3.d:0 "港口、矿区、铁路与兵工厂的清单铺满整张长桌。\n\n蕾米莉亚要求按照战功分配。红魔馆承受了正面作战与城市攻坚，理应获得长期军需与部分港口的管理权。\n\n永琳反对把工业设施拆成军团奖赏。医疗、运输与机械维修必须由能维持整体运转的人统一规划，而不是由胜利者各自圈走。\n\n雷鼓把几份工人请愿推到桌前。她问得很直接：「机器是他们修的，铁路是他们重新接上的。为什么最后只有旗子决定工厂归谁？」\n\n幽香倚在窗边，带著令人不安的微笑。她不在意制度叫什么，只提醒众人，粮食、土地与地方生产不会因会议表决便自动服从。若有人打算把农地当成可任意搬动的数字，最好先亲自去花田说明。\n\n蓝提出由中央建立统一采购与分配体系。这能阻止各军团先行占领设施，却立刻被质疑是在替八云家集中整个列岛的资产。\n\n众人最后都看向紫。\n\n她所决定的，不会结束争端，只会决定下一场争端发生在会场、工厂，还是持枪的警戒线前。"
KYO_afterwar.3.a:0 "由中央建立统一分配规则。"
KYO_afterwar.3.b:0 "军功必须得到明确回报。"
KYO_afterwar.3.c:0 "让实际生产者参与管理。"


KYO_afterwar.4.t:0 "谁来审判胜利者"
KYO_afterwar.4.d:0 "战争结束后，报复并未随停火命令一同停止。\n\n私刑、掠夺、失踪与战时处决的卷宗堆满走廊，其中既有日军留下的案件，也有妖怪联军不愿提起的名字。\n\n映姬要求逐案审理。她不接受胜败改变是非，也不允许任何军旗遮住死者。\n\n白莲支持公开调查。她知道审判不会让伤口消失，却也知道沉默会让仇恨继续在地方生长。\n\n蕾米莉亚拒绝让军队成为和平到来后最方便的祭品。她承认前线做过残酷的事情，却冷冷反问：「坐在后方的人，有什么资格用一张干净的纸审判沾血的手？」\n\n幽幽子翻阅死者纪录，语气仍然轻柔。她不替任何一方辩护，只指出那些没有得到处理的亡魂正逐渐聚集。活人可以拖延，死者却未必愿意等候。\n\n紫听完所有意见，没有让争论变成互相揭短。她只要求蓝列出公开审判、有限赦免与延后处理可能造成的结果。\n\n最后的决定仍由她作出。\n\n没有人相信这是完美的裁决，但也没有人敢直接否认它。"
KYO_afterwar.4.a:0 "公开审判，无论身分。"
KYO_afterwar.4.b:0 "有限赦免，先阻止报复循环。"
KYO_afterwar.4.c:0 "将争议延后到结界完成。"


KYO_afterwar.5.t:0 "幻想乡现在位于何处"
KYO_afterwar.5.d:0 "要把日本纳入妖怪世界，并不是把旧博丽大结界向外拉伸那么简单。\n\n战争已将妖力、怨灵、外界技术与受损地脉散布到整座列岛。若继续沿用旧有结构，新结界迟早会从最薄弱的地方重新裂开。\n\n蓝提出中央节点、分散节点与游移锚点三套方案。中央节点最容易由紫维持，却也让整个结界依赖八云家的核心；分散节点能由各地共同承受压力，但更多势力也会因此接触结界架构。\n\n神奈子偏向分散建设。她认为一套覆盖列岛的结界不能只是一件巨大术式，它必须像道路、水利与电力一样，让各地都有维护与修复的能力。\n\n饭纲丸龙则要求先确认资料权限。谁掌握节点数据，谁便能看见军队、人口与地方资源的变化。她不会让妖怪山在毫无保障的情况下交出所有观测结果。\n\n觉只听了一会儿，便指出两方真正担心的都不是技术，而是将来谁能关闭别人的道路。\n\n紫没有否认。\n\n她需要的不是一套没有政治争议的结界。那种东西从来不存在。她需要的是一套在各方互不信任时，仍不会立刻崩溃的结界。"
KYO_afterwar.5.a:0 "以中央节点统合所有边界。"
KYO_afterwar.5.b:0 "让分散节点共同承担结界。"
KYO_afterwar.5.c:0 "设置游移锚点。"


KYO_afterwar.6.t:0 "新结界需要多少双手"
KYO_afterwar.6.d:0 "最初的工程预估，只计算了幻想乡能提供的人力与物资。如今疆界突然扩张到整座日本，原有数字便显得近乎可笑。\n\n采石、伐木、铺路、运送符材与挖掘锚点基座，每一项都需要数以万计的劳动者。\n\n神奈子主张征用仍能运作的日本行政体系。地方官署、未复员部队与失业人口可以迅速编成工程队，否则新结界永远只会停留在图纸上。\n\n白莲当场反对。她不是否认工程急迫，而是不允许战败者被整体视为可以随意使用的人力。\n\n萃香对繁复规定没有耐心。她认为能工作的便上工，缺粮便先分粮，真正的问题不是自愿或命令，而是上面的人总想让底下先扛最重的部分。\n\n赤蛮奇替地方代表提出更直接的质疑：「你们说是限期征集。谁来保证期限到了，工具真的会放下？」\n\n永琳则将逃亡率、事故率、完工时间与粮食消耗排成数列。她不评价哪一种方案更高尚，只指出有偿招募会拖慢工程，而强制征集会让破坏与抵抗持续增加。\n\n紫看完所有估算。\n\n她没有足够时间等待每个人自愿，也没有足够资源让所有善意都得到妥善安排。现在只能决定，由谁承担最沉重的部分。"
KYO_afterwar.6.a:0 "发布限期劳务征集令。"
KYO_afterwar.6.b:0 "削减其他重建配额，改采有偿招募。"


KYO_afterwar.7.t:0 "山上的两份标书"
KYO_afterwar.7.d:0 "结界工程尚未正式动工，河童与山童便为第一批标案争得不可开交。\n\n河城荷取提出精密仪器、标准化零件与统一维修体系。山城高岭则主张山童更熟悉山脉、地层与地方运输，即使工厂停摆，也能利用现地材料完成工程。\n\n争执很快越过技术问题。双方互相指控偷窃设计、收买勘测员、垄断材料，甚至有人在竞争对手预定的工地上连夜竖起自己的测量旗。\n\n神奈子支持统一规格。她需要一套能由守矢神社、河童工坊与地方神社共同维护的系统，而不是数百种只有施工者本人看得懂的结构。\n\n饭纲丸龙则偏向山童。地方施工网若完全依赖河童工厂，妖怪山以外的区域将永远受制于少数设备供应者。\n\n蓝重新审核数百份报价，发现两套方案都刻意低估了自己的缺点。\n\n紫没有兴趣替她们判断谁更诚实。她只需要选出一套能在争吵仍未结束时继续施工的方案。"
KYO_afterwar.7.a:0 "采用河童的标准化方案。"
KYO_afterwar.7.b:0 "把工程交给山童。"


KYO_afterwar.8.t:0 "新的鸟居在各地竖立"
KYO_afterwar.8.d:0 "从北海道到九州，一座座全新的鸟居在废墟、山口、铁路交会处与海岸线旁竖立。\n\n它们不是装饰，而是新结界露在现实中的骨架。符文被埋入基座，地脉经过重新导引，每一处都通往蓝反复校正的座标。\n\n橙带著地方勘测队四处奔走。她的回报中夹著居民送来的食物、孩童画下的妖怪，也有被破坏的基座与失踪工人的名字。\n\n神奈子要求依原定时刻启动。工程不可能等到所有节点都完美无缺，越是延后，地方越会怀疑新政府是否真的有能力完成它。\n\n永琳则指出，少数锚点的偏差已超过原始预估。同步启动可以缩短新旧结界同时失效的时间，却也可能把尚未发现的错误一次接入整体。\n\n映姬要求留下完整责任纪录。无论立即启动或延后重验，都不能让事故最终只被归咎于没有发言权的施工者。\n\n幽幽子察觉到部分鸟居附近的亡灵流向正在改变。她没有要求停止，只提醒紫，有些错误不会立刻出现在仪器上。\n\n紫已记不清自己上一次完整休息是在何时。\n\n众人仍在争论，但启动的时刻只能由她决定。"
KYO_afterwar.8.a:0 "依原定时刻，同步启动所有节点。"
KYO_afterwar.8.b:0 "延后仪式，逐区重验每一座锚点。"


KYO_afterwar.9.t:0 "复员数字对不上"
KYO_afterwar.9.d:0 "军火库的清点数字始终无法吻合。\n\n成箱步枪与弹药在运回途中消失，通讯零件被拆散送往不同村镇，几套用于战时空间测量的设备也不知去向。\n\n赤蛮奇不相信中央收走武器后便会平等保护底层。她冷冷指出，战争期间没有人替草根妖怪守门，如今上面的人却突然记得每支枪都有编号。\n\n雷鼓承认部分地方互助网藏起了武器。那些村落不打算进攻谁，只是不愿在巡逻队到来以前赤手空拳地等待。\n\n饭纲丸龙要求封锁消息，避免更多地方趁乱转移装备。她同时指出，失踪物资的比例过于整齐，不像单纯的地方私藏。\n\n蓝将另一份清单放上桌面。有人刻意从不同仓库凑齐了一整套通讯与空间测量设备。\n\n地方武装或许藏起了枪。\n\n另一些人正在组装的东西，显然不是为了守住村口。"
KYO_afterwar.9.a:0 "全面收缴地方武装。"
KYO_afterwar.9.b:0 "承认受监督的地方自卫。"
KYO_afterwar.9.c:0 "暂缓抓捕，先追查测量器材。"


KYO_afterwar.10.t:0 "谁会替村落守夜"
KYO_afterwar.10.d:0 "缴械命令抵达村落时，中央承诺的巡逻队还在数十里外。\n\n影狼把村里唯一的步枪压在桌上，只问交出去以后，今晚由谁守住通往村落的路。\n\n若鹭姬在意的不是谁握有兵权，而是粮车能否安全抵达，孩子是否还要在枪声中躲进地窖。她愿意接受登记，却不愿让村落在中央兑现承诺以前先失去保护自己的能力。\n\n赤蛮奇逐条读完命令，然后问出那个没人愿意回答的问题：「若巡逻队先保护铁路、仓库和结界工地，我们在顺序里排第几？」\n\n雷鼓提出由地方互助网监督自卫队，避免武器落入单一首领手中。橙则要求中央立即派人，哪怕必须暂时抽走部分工地守备，也不能再让地方只收到纸上的保证。\n\n会场讨论的是统一编制、武器流向与长期风险。\n\n村落只想知道，天黑以后究竟由谁站在路口。"
KYO_afterwar.10.a:0 "调走工地守备，先兑现中央的保护。"
KYO_afterwar.10.b:0 "登记枪械，承认村落自卫队。"


KYO_afterwar.11.t:0 "失踪器材的去向"
KYO_afterwar.11.d:0 "调查队最终在数座结界锚点附近找到失踪的零件。\n\n通讯器材与空间测量设备被重新组装成一批从未登记的仪器，埋在地底或藏进废弃建筑，持续记录每次间隙开启后留下的空间扰动。\n\n蓝将观测资料重叠，发现仪器并非试图理解新结界，而是在寻找一个反复出现的人——八云紫。\n\n永琳只看了几页纪录，便认出其中的测量方式。它不是日本技术，而是经过简化的月面观测法。地面仪器只负责搜集偏差，真正的计算在更远的地方完成。\n\n觉审问过几名负责搬运零件的人。她没有找到完整计划，只读到同一种被刻意留下的空白：协力者知道自己在替某个力量工作，却从未被允许知道那个力量的全貌。\n\n饭纲丸龙要求立即控制所有通信站。若传输仍在继续，敌人便可能已经取得足够资料。\n\n蓝将传输方向标在地图上。\n\n那不是日本，也不是幻想乡。\n\n而是月面。"
KYO_afterwar.11.a:0 "月都的轮廓终于出现在报告上。"


KYO_afterwar.12.t:0 "谁的军队，谁的长官"
KYO_afterwar.12.d:0 "所有军团都声称愿意保护新结界，却没有一支愿意永久放弃自己的旗帜、军火库与补给线。\n\n蕾米莉亚首先拒绝将红魔馆近卫交给一套尚未证明能运作的中央指挥。她用指尖敲著桌面，语气从容得近乎无礼：「若没有红魔馆的力量，新秩序凭什么要求红魔馆服从？」\n\n萃香不喜欢统一编号与层层审批。鬼族愿意打仗，也愿意在真正的敌人出现时并肩作战，但不会因一张表格便忘记自己跟谁一起喝过酒、流过血。\n\n幽幽子没有直接反对统一军队。她只指出，白玉楼可以接受共同调度，但亡者与冥界守军不可能完全套入活人的编制。\n\n蓝提出统一补给口径、调动程序与最低共同指挥权，允许各军团保留象征与部分内部结构。\n\n紫听完所有条件，只问了一句：「当我不在场时，谁能让所有枪口转向同一个方向？」\n\n会场安静下来。\n\n因为每个人都知道，真正的答案仍是她。"
KYO_afterwar.12.a:0 "建立统一结界军。"
KYO_afterwar.12.b:0 "承认各方军团的独立指挥。"
KYO_afterwar.12.c:0 "由军务委员会共同管理。"


KYO_afterwar.13.t:0 "一张没有人签名的调令"
KYO_afterwar.13.d:0 "一处结界工地发生骚乱后，中央发出紧急调令，要求邻近军团封锁道路并保护技师。\n\n命令盖有八云中央、军务委员会与地方司令部的真实印章，送达时却没有任何一支部队立即行动。\n\n地方军官等待自己的首领确认，军务委员会要求补上联署，中央则坚称紧急命令不应再次审批。等第一支部队抵达，仪器已被焚毁，人群也早已散去。\n\n蕾米莉亚认为问题十分简单：命令若不能让拒绝者受罚，便不算命令。\n\n饭纲丸龙反对把所有临时调动权交给中央。情报抵达八云家、完成核对再送回地方时，最快的处置时机可能早已过去。\n\n雷鼓指出，真正让部队停下来的不是程序，而是各方都害怕自己率先服从后，其他人会趁机取得优势。\n\n蓝逐项检查命令，找不到任何错误。她只能提出两种方案：确立中央紧急调令的最高效力，或授权地方守军自行保护辖区。\n\n紫赶到时，已没有敌人可以逮捕，只剩一座烧焦的工地。\n\n她不能再让每一道命令都等著自己亲自证明。"
KYO_afterwar.13.a:0 "让中央紧急调令高于各方旗帜。"
KYO_afterwar.13.b:0 "授权地方守军自行保护辖区。"


KYO_afterwar.14.t:0 "军火库的钥匙"
KYO_afterwar.14.d:0 "真正的军权并不只存在于会场席位，而在军火库钥匙、铁路调度表、燃料配给与补给站的交接文件中。\n\n八云中央要求统一保管，以免地方军团私自扩充。军务委员会主张多方共同签署，防止中央垄断。各地司令官则拒绝交出战争期间由自己建立的仓库。\n\n蕾米莉亚公开表示，谁想拿走红魔馆的钥匙，可以亲自到门前索取。她没有提高声音，反而让那句话更像真正的威胁。\n\n幽香只看了一眼保管方案，便问军队是否也准备统一征用地方粮仓。若军火与粮食都被集中，地方便只剩服从的资格。\n\n白莲担心统一收缴成为日后清洗的前奏。她不反对监督，却要求任何一方都不能单独决定谁能取得武器。\n\n映姬则指出，共同保管若没有明确责任，最后只会让每次失窃都变成所有人互相推卸。\n\n紫面前摆著三个保管箱。\n\n每一种安排都声称能防止内战，也都可能成为内战的第一项准备。"
KYO_afterwar.14.a:0 "交由中央总务统一保管。"
KYO_afterwar.14.b:0 "由军务委员会共同保管。"
KYO_afterwar.14.c:0 "保留地方军团的既有仓库。"


KYO_afterwar.15.t:0 "八云紫的总仲裁"
KYO_afterwar.15.d:0 "新结界仪式的日期已经确定，百妖协议也已经为战后最重要的问题作出选择。\n\n日本居民的身分已有暂行规定，工业与军备的分配方式已被写入命令，地方武装、工程征集、军团调度与锚点权限也各自有了处理方案。\n\n真正积压下来的，是那些方案落到现实之后产生的细节。\n\n蓝依次列出仍待确认的事项：地方权利从何日开始生效，征集令由谁监督，军火库应在何时完成交接，结界工地能否优先取得粮食与铁路，以及仪式期间各军团究竟负责哪一段守备。\n\n蕾米莉亚要求已经承诺给军队的权限不得在执行时遭到削减。白莲则要求所有临时措施都留下明确期限，不能只写著『局势稳定后另议』。\n\n赤蛮奇带来地方组织对既有决议的疑问。她没有要求推翻任何结果，只指出中央命令中的几处空白，足以让地方官员把有限征用解释成无限服从。\n\n映姬则要求每一项命令都标明责任归属。若工程延误、粮食失踪或居民遭到滥权对待，必须能找到真正作出决定的人，而不是最后由最弱小的一方承担后果。\n\n紫坐在主位，将各方修订过的文件逐份看完。\n\n她没有重新开放已经结束的表决，也没有允许任何人借由细节推翻先前的决定。她只是划定范围、补上期限，并把相互冲突的命令重新排列成一套能够执行的安排。\n\n『方向已经决定。』紫合起扇子，『现在把它做完。』\n\n众人仍有不满，也仍会在离开会场后继续争论，但没有人否认她的裁定。\n\n在新结界完成以前，八云紫仍是唯一能让所有既定方案同时运作的人。"
KYO_afterwar.15.a:0 "由紫直接划定权限与期限。"
KYO_afterwar.15.b:0 "补上书面保证，再交由各方执行。"
KYO_afterwar.15.c:0 "维持既有决议，不再追加新的条件。"



KYO_afterwar.16.t:0 "仪式以前，一切必须就位"
KYO_afterwar.16.d:0 "总仲裁结束后，各项命令终于有了明确的权限、期限与负责者。然而，从会场上的裁定到真正能够执行，中间仍隔著大量尚未完成的交接。\n\n部分军火库已清点完毕，钥匙却因新旧管理者的纪录不符而无法移交；地方施工队正在等待符材，运送符材的列车却停在尚未重新分配的月台；数支负责仪式守备的军团甚至被安排在同一条道路上，谁也不愿先让出通行顺序。\n\n这些问题并非公开抗命。每一方都声称自己正在遵守裁定，只是所有人都优先完成对自己最有利的部分，把麻烦留给下一个环节处理。\n\n萃香带著鬼族搬开堵在铁路与仓库之间的大批军需品。她没有耐心等待新的搬运文件，只要求负责人当场说清楚东西究竟该送到哪里。\n\n幽香则重新划定花田周边的运输道路。工程队可以通过，军队也可以驻守，但任何人都不得擅自践踏农地或把临时征用变成永久占用。她的规定没有写进中央命令，却没有人打算试探第二次。\n\n觉将各地送来的急报重新分类。真正危及仪式的问题被放在最前面，单纯争取更多预算、设备与管辖权的请求则被退回原部门。许多看似紧急的报告，至此才显露出真正目的。\n\n紫已经两日没有离开会场。她看完最后一批进度表，将文件推到蓝面前。\n\n「不要再替他们重新讨论。」\n\n蓝点头，按照仪式时刻倒排所有工作：确认军火库交接、重新分配列车、错开军团行军时间、补足锚点物资，并要求每一名负责者在完成后留下可供追查的纪录。\n\n她不能让所有人彼此信任，也不需要这样做。\n\n新结界开始以前，只要每一把钥匙、每一批物资与每一支部队，都准时抵达它应在的位置。"
KYO_afterwar.16.a:0 "蓝，把所有准备收束到同一个时刻。"


KYO_afterwar.17.t:0 "旧结界的最后一夜"
KYO_afterwar.17.d:0 "旧博丽大结界的符文，正从幻想乡的夜空中逐一熄灭。\n\n它曾将妖怪、神明、亡灵与一切不再被外界相信的事物藏在常识之外。如今，那道守护幻想乡数百年的边界已经无法承受战争留下的重量，更不可能覆盖整座被妖力、炮火与亡魂重新塑造的日本列岛。\n\n从北海道的雪原到九州的海岸，新建立的鸟居与锚点依序亮起。山巅、都市、铁路、寺社与废墟之间，一道尚未接合的巨大轮廓横跨夜色。无数居民停下手中的工作，仰望那些从未出现在旧世界中的光。\n\n蓝提交最后一次校准结果。三千七百余处节点已经回应，十二处偏差仍在容许范围内，所有护卫、工程队与应急部队也已抵达指定位置。她的声音平稳，手中的报告却被握出细微皱痕。\n\n这是她能替紫完成的最后一步。\n\n永琳亲自检查紫的状态。长期维持间隙、处理结界偏移与主持战后仲裁，已使她的妖力接近极限。永琳列出七项必须中止仪式的条件，又在念完后沉默下来。她比任何人都清楚，只要紫还能站立，她便不会承认任何一项条件已经成立。\n\n幽幽子站在冥界节点旁，望著新旧结界交替时聚集的亡灵。那一夜，连她也没有用玩笑掩去沉重，只让妖梦握紧双剑，守住生者与死者之间最后尚未接合的道路。\n\n蕾米莉亚的近卫封锁天空，天狗控制所有高空航路，守矢的神明维持地脉，命莲寺将救护队部署到每一条撤离线。赤蛮奇与地方联络者守在最外围的聚落，确认那些无法进入会场的人，也没有被排除在新世界之外。\n\n橙反复确认祭台周围的撤离道路，直到紫叫住她。\n\n「橙。」\n\n她立即回头。\n\n「不要靠近祭台。」\n\n橙张了张嘴，像是想用某个简单的理由拒绝。最后，她只把手中的地图抱得更紧，低声回答：\n\n「……我会在这里等妳回来。」\n\n百妖协议的所有势力都守在仪式场周围。她们仍不信任彼此，仍记得会议上的争执，也仍准备在明日为土地、军队与权力继续争论。\n\n但当八云紫独自走向祭台时，没有人再开口。\n\n数个月以来，她第一次不再处理请愿、军令、粮食与争端。这一刻，所有人的生存、所有人的野心、所有尚未来得及完成的未来，都落在她一人身上。\n\n紫站在旧结界熄灭后留下的黑暗中央，缓缓打开扇子。\n\n层层间隙在她身后展开，跨越山川、海洋、生死与现实。整座列岛的边界在同一刻向她聚拢，如同一个尚未成形的世界，等待第一道命令。\n\n「开始吧。」"
KYO_afterwar.17.a:0 "幻想乡将在今夜重新诞生。"


KYO_afterwar.18.t:0 "从月面落下的光"
KYO_afterwar.18.d:0 "最初没有任何警报。\n\n没有飞机越过海岸，没有术式触碰外层结界，也没有敌人出现在任何一座瞭望塔的视野中。\n\n夜空只是多出了一道白线。\n\n它比星光更细，比刀刃更直，从月面延伸至祭台上方，仿佛某种遥远而冷漠的意志，正在天地之间确认一个不容许偏离的座标。\n\n下一瞬，白线骤然扩张。\n\n月光越过云层、天空、结界与所有地面防御，没有经过任何可以被拦截的距离，直接在仪式场上空出现。沿途的夜色被压成纯白，数百座锚点同时发出尖锐震动，刚刚接合的边界开始向同一个位置弯曲。\n\n紫终于明白了。\n\n博丽巫女遇害时，没有敌人穿过结界，没有凶器留下痕迹，神社附近却像被某种力量从内部抹去。那并非攻击跨越了边界，而是月都短暂地将月面与地上的一处座标视为同一个地方。\n\n敌人从来没有进入幻想乡。\n\n它们只是让死亡直接出现在目标所在的位置。\n\n紫不能移动。\n\n她的妖力已经接入整座新结界。只要离开祭台，尚未完成的节点便会从北海道到九州同时脱离，数千万居民、妖怪与亡灵将被抛进彼此冲突的边界之中。\n\n蓝望见白光，瞬间将失踪的测量设备、异常传输与游移座标全部连在一起。她第一次在计算完成以前失去冷静。\n\n「紫大人，离开那里！」\n\n永琳在同一刻认出了姬光炮的原理。她没有发布拦截命令，因为任何从地面射出的力量都不可能阻止一场已经在座标内部发生的攻击。\n\n觉听见祭台周围所有人的恐惧在同一瞬间升起。红魔馆的士兵握紧武器，命莲寺的僧众开始祈祷，天狗抬头寻找根本不存在于天空中的敌军。\n\n蕾米莉亚展开双翼，命令近卫向祭台集结。白莲冲入救护线，要求所有人准备承受结界崩坏。神奈子将御柱打入地面，试图替正在颤动的节点分担压力。幽幽子则望著突然沉默的亡灵，脸上的笑意彻底消失。\n\n橙挣脱护卫，向祭台奔去。\n\n紫没有回头。\n\n她只是望著那道足以把自己从世界上抹去的白光，将最后一批节点拉入间隙之中。\n\n月都已经选定了它相信的座标。\n\n在光芒抵达以前，整个幻想乡只剩下一个问题。\n\n那个座标，究竟是不是真实。"
KYO_afterwar.18.a:0 "月亮只击中了一个谎言。"
KYO_afterwar.18.b:0 "白光准确落在祭台中央。"


KYO_afterwar.19.t:0 "月亮击中了一个不存在的位置"
 KYO_afterwar.19.d:0 "新结界进入最后接合时，八云紫站在祭台中央，以间隙将日本各地的锚点接入同一结构。她不能离开，也不能中断；任何迟疑，都可能让尚未稳定的边界从内部崩解。\n\n几乎同时，月面的中央观测中枢失去回应。莲子已经摧毁卫星控制与定位系统，却来不及取消姬光炮获准执行的发射。失去中枢后，独立备用单元自动采用最后一组通过地表、轨道与月面三重验证的坐标。\n\n那不是祭台。\n\n三座受控中继站重放了八云紫过去开启间隙的记录，错误星图又替假信号完成轨道校准。月都最终认定，紫正站在仪式场外一处早已撤空的山地锚点上。那里没有八云紫，只有莲子替月都拼出的最后一个答案。\n\n月都相信了它。\n\n白光偏离祭台，贯穿那处不存在的目标。山地被照成惨白，岩层随即裂开，迟来的轰鸣席卷列岛。冲击仍使鸟居倾斜、节点熄灭，海岸与冥界通道一同震动。神奈子、诹访子与白玉楼众人各自压住失控区域，永琳则调动医疗队。\n\n紫依旧没有松开间隙。鲜血沿手腕落进符文，蓝在祭台外重算断裂节点，橙几次试图靠近，又被翻涌的妖力逼退。\n\n北海道的雪、东京的灯火、幻想乡的山林、白玉楼的樱花与旧地狱的火焰，依次被纳入同一条边界。最后一道缺口终于闭合，新结界从整座列岛升起，将幻想重新固定在世界之中。\n\n八云紫活了下来。\n\n而月都的攻击也暴露在所有势力眼前。蕾米莉亚仰望月亮，冷声说道：「它们向我的领土开火。」\n\n白莲没有纠正她，只回答：「它们向所有人开火。」\n\n饭纲丸龙立即清查地表观测者，永琳接管残留的月面记录。没有人再把这次攻击称为偶然。\n\n紫走下祭台时，蓝伸手扶住她，橙直到确认她仍有体温，才终于哭出声来。紫没有接受欢呼，只抬头望向依然洁白的月亮。\n\n「封住日本，已经不够了。」\n\n在无人看见的远方，赫卡提亚关闭最后一条道路。莲子没有留下姓名，只带走一份证明八云紫仍然活着的星图。"
 KYO_afterwar.19.a:0 "月都射失了这一炮，也暴露了自己。"


KYO_afterwar.20.t:0 "世界失去了中央"
KYO_afterwar.20.d:0 "白光没有偏离。\n\n姬光炮直接在仪式座标内出现。祭台、符纸与层层展开的间隙同时被纯白吞没，所有色彩、声音与距离都在一瞬间消失。片刻后，轰鸣才从地底涌出，震倒鸟居与观测塔，让整座列岛的新生节点一同颤动。\n\n蓝仍在计算。她把互相冲突的数值重新排列，试图找出紫仍然存在的可能；可每一项结果都指向同一处空白。\n\n橙冲进白光散去后的尘埃，徒手挖开破碎的石板与符材，一遍又一遍喊著紫的名字。\n\n没有回应。\n\n光芒抵达以前，紫已经知道自己无法离开。她没有切断仪式，也没有将最后的力量用来保护自身，而是把对境界的掌控拆解，沿著尚未接合的节点送往整座列岛。\n\n北海道的雪原、九州的海岸、妖怪山、冥界、地底、人里与红魔湖依序亮起。她将自己的力量注入每一道鸟居、每一处锚点与每一条已经成形的边界。\n\n当她的身影被白光吞没时，新结界完成了最后一次接合。\n\n它没有崩溃。\n\n一道庞大而沉默的边界从日本海岸升起，越过城市、山川与幻想乡。它仍能阻隔外界，维持妖怪的存在，也能让生者与亡者停留在各自的位置。\n\n只是再也没有人能让整座结界服从同一个意志。\n\n蓝站在祭台残骸中央。紫留下的力量仍在节点之间流动，结界也依旧回应她的式神术式。她能维持它、修正它，继续执行紫留下的最后命令。\n\n但她不能成为八云紫。\n\n橙跪在尘埃里，双手紧握一块已经失去温度的扇骨。\n\n新结界活了下来。\n\n它的创造者没有。\n\n而那个曾让所有命令、争端与野心最终停下来的位置，也在同一夜彻底空了。"
KYO_afterwar.20.a:0 "结界仍在运作，幻想乡却失去了中央。"

KYO_afterwar.21.t:0 "没有下一次会议"
KYO_afterwar.21.d:0 "祭台的尘埃尚未落定，第一批命令便已越过彼此。\n\n蕾米莉亚要求军务委员会接管道路、通信站与军火库。月都已向幻想乡开火，她认为只有掌握军队的人，才有资格在紫死后维持整个国家。\n\n「中央不能空著。」她站在红魔馆近卫之前，语气从容而决断，「既然没有人能继承她，那就由有能力统治的人接手。」\n\n白莲要求所有军团留在原位，先救治伤者、维持配给，并由百妖协议选出临时管理者。她拒绝让一场袭击变成永久集权的理由。\n\n「她以生命留下的，是让众人活下去的结界。」白莲说，「不是任谁先夺得，便能坐上去的王座。」\n\n第三道命令没有经过任何委员会。\n\n鬼人正邪向工坊、村落、地方武装与万民委员会的联络点发出讯息，要求各地扣住物资、控制道路，拒绝承认任何自称继承八云紫权力的势力。\n\n「总仲裁已经死了。」她将颠倒的旗帜插进地面，「现在不是替旧秩序挑选下一个主人。这是底层夺下幻想乡的机会。」\n\n正邪要在红魔馆完成接管、命莲寺恢复议会以前，将草根组织与地方武装集结成足以夺取中央的力量。她不打算让革命再次停在高位者的承诺前。\n\n神奈子要求掌握新结界的维护权，饭纲丸龙则切断未经许可的通信。映姬试图维持原有职权，却再也找不到一个能迫使各方接受仲裁的人。\n\n百妖协议没有正式解散。会场仍然封存，席位与文件也都留在原处，只是没有人能决定下一次会议何时召开。\n\n红魔馆的旗帜向军火库移动，命莲寺的钟声召集救援队，正邪的信使奔向工坊与村落。\n\n每一方都声称自己正在保护紫留下的世界。\n\n每一方也都要求那个世界服从自己的方向。\n\n月都只发射了一炮。\n\n它没有摧毁结界，却让所有争夺统治权的人，再也不必先经过八云紫的席位。"
KYO_afterwar.21.a:0 "所有成果，都在等待新的主人。"


