 KYO_executive_pair_cycle:0 "Quarterly Executive Nominees"
 KYO_executive_pair_cycle_desc:0 "Every 90 days, two of the twelve candidates are chosen at random. If either becomes chair of their committee, they may spend 20 Fulfillment to enact one powerful 60-day mandate."
 KYO_barrier_postwar_deterioration_cycle:0 "Postwar Barrier Inspection Cycle"
 KYO_barrier_postwar_deterioration_cycle_desc:0 "After the war, the barrier deteriorates only once every 150 days. Complete $KYO_gensokyo_rebuild_plan$ and restore all ten nodes to retire this system."
 KYO_restored_great_barrier:0 "The Restored Great Barrier"
 KYO_restored_great_barrier_desc:0 "All ten nodes have been restored, providing a stable foundation for Greater Gensokyo."

