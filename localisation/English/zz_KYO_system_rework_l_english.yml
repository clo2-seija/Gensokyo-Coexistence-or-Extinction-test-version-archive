 KYO_spawn_tengu_contingent_tt:0 "The tengu provide §Y120 fighters, 24 transports, and 3 airborne divisions§!, and unlock Paratroopers."
 KYO_spawn_kappa_contingent_tt:0 "The kappa provide the §YType-1 Water Strider tank design, 240 light tanks, and 2 armored engineer divisions§!."
