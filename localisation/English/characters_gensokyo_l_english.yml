l_english:


 Seizo_Kobayashi:"Seizou Kobayashi"

  gensokyo_Remilia_desc:0 "Remilia Scarlet is the vampire heiress of Scarlet Devil Mansion. Despite her petite appearance, she exudes the pride and pomp of an aristocratic lord: she enjoys lavish banquets, being admired, and treating trouble as stage lighting, finding the most chaotic moments “interesting.” She often issues orders in a capricious and childish tone, but don't mistake it for a joke—when she decides to act, the entire situation unfolds like a chessboard being gently manipulated, gradually leading to the ending she desires.\n Rumors suggest she possesses the ability to “manipulate fate”: not necessarily with the power to instantly overturn the world, but more like a force that transforms chance into inevitability. What you think is just bad luck may actually be her chosen one. Nevertheless, Remilia is not simply a villain; she is extremely protective of Scarlet Devil Mansion and has an almost self-righteous protective instinct towards her family. Scarlet Devil Mansion is her city—whenever “her own” is involved, she'll take full responsibility like a pampered young lady."
  gensokyo_Yukari_desc:0 "Yukari Yakumo is one of the most difficult entities to “categorize” in Gensokyo—she's not always in the spotlight, but often acts like the architect of the stage itself. As a sage who manipulates the “boundaries,” she excels at connecting seemingly unrelated people and events with an invisible thread, creating inevitability: what's a small coincidence today could become a turning point that rewrites the situation tomorrow. She speaks with a composed humor and a detached goodwill, as if everything is just “incidental,” but what's truly terrifying is—you can hardly be sure how many layers her “incidental” arrangements actually involve.\n Yukari is not simply a schemer. Her perspective is more like that of a manager: for Gensokyo to function, there must be rules, buffers, and boundaries, and she will maintain this system in her own way, even if the methods seem ruthless, even like using people as pawns. She can fan the flames of chaos, and she can also reach out and redraw the boundaries before collapse; she allows incidents to happen, because sometimes incidents are necessary renewals and trials. Dealing with Yukari Yakumo, the most important thing is not guessing her emotions, but understanding her scale: what she cares about is never just the wins or losses of any one person, but whether the entire stage can continue to exist."

