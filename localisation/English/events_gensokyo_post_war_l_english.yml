kyo_postwar.1.t:0 "Two uses for the spoils"
kyo_postwar.1.d:0 "The side hall of the Imperial Diet has been converted into a spoils inventory area.\n\n Trucks, trains, machine tools, artillery, and spare parts left behind by the Japanese army fill the corridors. Some equipment is still usable, some has been repaired several times on the front lines, and many supplies lost their original records during transit. If sent to the warehouse in the current manner, the most needed equipment after the war can be replenished quickly; however, Gensokyo will still rely on a batch of Outside World machines that cannot be manufactured or reliably maintained.\n\n Ran proposes a thorough inventory. Disassemble the existing support equipment and vehicles piece by piece, check the structure, materials, and production methods, and then organize Japan's industrial and armor designs into technologies that can be replicated by kappa workshops. This will consume a large amount of still usable logistical equipment, but it will establish Gensokyo's true production capacity for the future.\n\n Another method is more direct: stop tracing the origin of each batch of supplies, send all operable vehicles, firing weapons, and undamaged trains into warehouses, and convert a military warehouse into a civilian factory. Reconstruction will immediately provide the necessary supplies, but the chaotic accounts will remain temporarily.\n\n War spoils cannot remain piled up in Parliament forever. They must become today's supplies or tomorrow's technology."
kyo_postwar.1.a:0 "Ran, dismantle everything and recalculate, keeping only what we can manufacture ourselves."
kyo_postwar.1.b:0 "Stop tracing the origins, get the warehouses and factories running first."

kyo_postwar.2.t:0 "The fate of the wartime ordnance system"
kyo_postwar.2.d:0 "During the war, schools, stations, temples, and civilian factories were all incorporated into the military supply system. Production lines ran day and night, local warehouses were crammed with rifles and shells, and roads were constructed solely for the purpose of troop movement.\n\n The front lines were now silent, but this system continued to operate. A large workforce was tied up in military production, leading to chronic shortages of civilian goods and building materials; some areas were even still requisitioning supplies according to wartime orders.\n\n Ran suggested dismantling some temporary military equipment, recovering surplus weapons, converting factories into civilian workshops, and repairing roads damaged by heavy transport. This would reduce readily available armaments but allow the postwar economy to serve the population again.\n\n The military, however, advocated maintaining wartime control. The Outside World had not yet accepted the Youkai regime, and armed resistance persisted throughout Japan; closing the arsenals now was tantamount to voluntarily laying down arms during the most unstable period. As long as production lines remained, troops could continue to acquire firearms, artillery, and anti-aircraft equipment.\n\n Factories left over from the war can be dismantled for materials to rebuild homes, or they can continue to forge weapons needed for the next war."
kyo_postwar.2.a:0 "Dismantle part of the military industrial system and return the factories and roads to the reconstruction."
kyo_postwar.2.b:0 "Preserve the wartime production lines; now is not the time to disarm."

kyo_postwar.3.t:0 "Cities that couldn't be evacuated in time"
kyo_postwar.3.d:0 "Measurement reports from the new barrier confirm that several densely populated areas are located on an unstable boundary zone.\n\n Road distances change at night, some buildings occasionally disappear from observation spells, and some residents claim that when they open their doors, they don't see the original streets. The anomaly hasn't spread to the entire city, but no one can guarantee when the next change will occur.\n\n The safest solution is to launch a large-scale migration before the gap is sealed. Trains, trucks, and engineering equipment will be requisitioned to transport residents in batches to designated resettlement areas that have already been surveyed. Local roads, housing, and civilian factories must be expanded immediately to accommodate the sudden increase in population. This operation will almost exhaust existing transportation capacity, but it will allow most residents to leave the danger zone. kappa proposes an alternative: cancel the full evacuation, install monitoring equipment in the anomaly zone, seal off the most dangerous neighborhoods, and allow the rest of the city to continue operating. The transportation system is preserved, and research on the anomaly can proceed rapidly; however, those who cannot leave the sealed-off area will have to wait for the next measurement results.\n\n Trains are sufficient to carry many people, but not the entire city."
kyo_postwar.3.a:0 "Requisition vehicles and trains to transport those who can be taken to resettlement areas."
kyo_postwar.3.b:0 "Seal off the anomaly zone and install monitoring equipment, halting the full evacuation."

kyo_postwar.4.t:0 "Those Who Have Not Yet Lay Down Their Arms"
kyo_postwar.4.d:0 "The Japanese army has surrendered, but the war has not ended simultaneously in all the mountains and streets.\n\n Scattered soldiers, local garrisons, and residents who refuse to recognize the new regime still control many strongholds. They are familiar with the roads, possess weapons left behind by the retreating Japanese army, and are secretly supplied by some villages. Patrols are ambushed daily, and railways and supply depots are constantly being destroyed.\n\n One option is to issue a limited amnesty. Those willing to hand over weapons, stronghold locations, and supply routes can be exempted from prosecution and even, after vetting, join local garrisons and transport teams. This would make some frontline officers believe that victory has been compromised, but a large amount of equipment can be recovered with fewer casualties, and those familiar with the area can help restore order.\n\n Another option is to concentrate forces to clear out the enemy area by area. Mountain roads, villages, and underground strongholds will be breached one by one, allowing troops to gain combat experience and seize more weapons. However, each engagement will increase casualties on both sides and intensify the fear of the new regime among the still-observant residents.\n\n Someone must decide whether the post-war order begins with the surrender or with the last gunshot."
kyo_postwar.4.a:0 "Surrender, intelligence, and weapons in exchange for amnesty."
kyo_postwar.4.b:0 "Deploy troops to clear out each area until all strongholds cease resistance."

kyo_postwar.5.t:0 "Whose army?"
kyo_postwar.5.d:0 "The Hundred Youkai Army won the war, but it was never a truly unified army.\n\n Scarlet Devil Mansion, Youkai Mountain, Hakugyokurou, Myouren Temple, and various Youkai groups still retain their own organization, supplies, and commanders. They would accept orders to fight together, but were more accustomed to obeying their original masters. In wartime, this structure allowed all sides to quickly deploy to the battlefield; after the war, however, it made it impossible for the central government to ascertain the exact number of troops it could mobilize.\n\n Yukari proposed establishing a unified Barrier Army. All factions would use a common organizational structure, with supplies, training, and the command chain all integrated into the central government. Captured Japanese armor data would be given to Kappa for redesign, using existing vehicles, infantry equipment, and support parts to create Gensokyo's own light tanks. This reorganization would consume a large amount of equipment and inevitably weaken the local leaders' control over their armies.\n\n Another option was to allow each faction to retain its own army. In exchange, they would hand over some weapons, vehicles, and industrial equipment for the central government's use. This would quickly fill the warehouses without immediately touching the most sensitive issue of military power; however, Gensokyo would still not possess a truly centrally commanded armored army.\n\n Flags can fly simultaneously, but military orders cannot forever be issued independently."
kyo_postwar.5.a:0 "Establish a unified barrier army and have Kappa convert Japanese tanks into our weapons."
kyo_postwar.5.b:0 "Each faction should temporarily retain its troops and hand over some military equipment to the central government."

kyo_postwar.6.t:0 "To whom should the right to rebuild be given?"
kyo_postwar.6.d:0 "The post-war government had to process thousands of reports daily: barrier shifts, food rations, railway repairs, local resistance, resident relocation, and military warehouses that were still not fully cleared.\n\n The existing system relied on reports from various regions, which were then approved layer by layer by the central government. This allowed local authorities to handle problems according to the actual situation, but it also led to conflicting intelligence, supplies being held up while awaiting approval, and the central government even being unable to confirm whether some orders had actually arrived.\n\n Yukari and Ran advocate centralized authority. Barrier surveillance, intelligence gathering, and administrative control will be directly managed by the Yakumo family, establishing a specialized agency to study border and Outside World intelligence. All important data must be sent to the central government and processed under a unified command system. This improves infiltration, monitoring, and response efficiency, but requires substantial support equipment to maintain a vast intelligence network.\n\n Another option is to delegate reconstruction and distribution to local councils. The Youkai rabbit Logistics Team will connect factories, warehouses, and settlements, allowing supplies to proceed without waiting for central approval. Local areas can resume production more quickly and establish new civilian and military factories; conversely, the central government's control over local resources and decision-making will be weakened.\n\n One method focuses all eyes on the central government; the other gets local hands moving first."
kyo_postwar.6.a:0 "Centralize intelligence and barrier authority, establishing the Yakumo family's monitoring system."
kyo_postwar.6.b:0 "Leave reconstruction and rationing to local authorities, with the Youkai Rabbit Logistics Corps as liaison."
kyo_postwar.6.c:"Choose no one"




  kyo_postwar.7.t:0 "Gensokyo Imperial Conference"
  kyo_postwar.7.d:0 "The circular meeting hall, originally belonging to the Human Empire's council, was now covered with barrier talismans and Youkai crests. Yukari Yakumo sat in the main seat, her eyes calmly sweeping over the assembled figures—Satori Komeiji, Remilia, Eirin Yagokoro, Youmu Konpaku and Yuyuko, Eiki Shiki, Megumu Iizunamaru, Nitori Kawashiro, Cirno, Kagerou Imaizumi… forces from Gensokyo and all over the Japanese archipelago gathered together.\n\n Before everyone's eyes, she outlined her vision for the future: the barrier would expand throughout Japan, the order between humans and Youkai would be rewritten, and the empire would no longer be dominated by humans, but rather sealed within a new world by the rules of Gensokyo. The applause, questioning, and silence at the meeting intertwined into a low-frequency rumble; no one could tell whether they were agreeing or simply nodding under the pressure of the atmosphere.\n\n After the Decision was passed, the attendees would accompany Yukari to the venue for the new barrier ritual—the final moment when she would declare to all witnesses “who is the master.”"
  kyo_postwar.7.a:0 "The meeting concluded amidst applause and solemn silence, everything seemingly perfect."
  kyo_postwar.7.b:0 "Slight unusual noises outside the venue—deliberately ignored by everyone."

  kyo_postwar.8.t:0 "The Ritual Begins"
  kyo_postwar.8.d:0 "Night covered the ritual ground. The raised altar was joined to the dome of the Imperial Diet, while runes followed walls and ley lines across the Japanese archipelago. Yukari Yakumo stood at the centre, the gap surging behind her like countless overlapping curtains waiting for her final stitch to close the world.\n\n Below, the youkai leaders watched her raise one hand. Youkai power and faith converged; the old barrier overlapped the new boundary. One final effort would write the new order into reality. In that same instant, the slightest hidden malice could tear Yukari apart—and take the entire design with her."
  kyo_postwar.8.a:0 "The ritual begins, everything will be rewritten."

  kyo_postwar.9.t:0 "The ritual proceeds smoothly."
  kyo_postwar.9.d:0 "Runes lit up one by one in the air. There were no explosions, no piercing screams, only a deep and steady tremor that resonated throughout the earth. The structure of the Great Hakurei Barrier was precisely readjusted, new layers expanding outwards, firmly locking all of Japan into the Gensokyo-style laws designed by Yukari Yakumo—the world itself began to operate according to her will.\n\n When Yukari Yakumo descended from the altar, the arena fell silent, before erupting into long-suppressed cheers and prostrations. The Youkai leaders bowed their heads in awe, while the human representatives, driven by fear and the instinct for survival, remained silent. Having witnessed her rewrite reality with “gap,” questioning became meaningless: from this day forward, obedience to Yukari Yakumo was tantamount to obedience to this new world itself. Before such a sight, no one dared doubt or resist her commands."
  kyo_postwar.9.a:0 "Everyone would willingly follow this undisputed leader, Yukari Yakumo."

  kyo_postwar.10.t:0 "An unusually explosive attack"
  kyo_postwar.10.d:0 "Just as the last rune was converging and the barrier was about to solidify, an anomaly occurred—not a fire from some corner, but as if the entire space had been sentenced to death.\n\n A thin crack first appeared in the sky, like a black sun torn apart, silently collapsing downwards; at the same moment, the floor beneath the altar seemed to be ripped open from the inside, light and rubble, soil and youkai energy erupting from the ground simultaneously. The explosion didn't happen “in” one place, but rather exploded from the sky and the ground simultaneously, trapping the entire ritual site between two opposing yet synchronized impacts.\n\n Yukari Yakumo, standing high above, was instantly engulfed by the double impact, the surging “gap” behind her twisting and collapsing, leaving only the frantically pulsating echoes of the barrier and the silence after the explosion. As the smoke cleared, only charred remains and ruins remained of the altar. Yukari Yakumo had vanished without a trace—no body found, no proof of life, even the instructions she left behind became ineffective talismans in the chaos of the barrier.\n\n The Imperial Diet was reduced to shattered stones and charred flags overnight. The leaderless Youkai leaders stared at each other, none willing to yield. Long-suppressed contradictions, resentments, and ambitions resurfaced: some wanted to seize the power she had once held, some wanted to rewrite her ideals, and some simply wanted to overthrow everything she had built. The next step would no longer be meetings or negotiations, but a civil war of flags against flags, creeds against creeds."
  kyo_postwar.10.a:0 "Yukari Yakumo's whereabouts are unknown; the Youkai will tear Japan apart for power and their ideals."


  kyo_postwar.16.t:0 "The Breaking of the Balance: Only Mutual Annihilation Remains"
  kyo_postwar.16.d:0 "The barely maintained balance finally collapsed completely amidst a series of declarations and military interventions.\n\n In Kansai, Remilia declared her “War of Unification” with blood and crimson mist, aiming to bring all Youkai under the wing of the aristocratic empire; in the north, Seija Kijin raised the banner of overthrowing superiors, openly declaring all old forces as vested interests to be overthrown, and the revolutionary army infiltrated southward along railways and air routes.\n\n Yakumo reorganized the government and the Buddhist Self-Defense Corps, attempting to maintain order, negotiate, and establish a ceasefire line, but quickly discovered that no one was willing to return to the negotiating table. Every army claimed to represent the “true future,” and every flag regarded its opponent as an obstacle to be erased from the map.\n\n Once the balance is broken, it will not recover on its own. Gensokyo and the rest of Japan were forced, pulled by multiple forces, to the same conclusion: only after all other candidates were eliminated would a “true ruler” emerge. Civil war was no longer a possibility, but the only path."
  kyo_postwar.16.a:0 "Dust to dust, ashes to ashes."




 kyo_postwar.19.t:0 "Where the Elder Komeiji Sister Stands"
  kyo_postwar.19.d:0 "After the civil war began, reports of changing garrisons and road closures arrived one after another at the underground entrance. Satori Komeiji called the envoy into the hall, heard him repeat the surface's terms, then asked when the medicine would arrive. He assured her aloud that supplies would continue as before. In his thoughts, he was already worrying that the next checkpoint would detain the convoy.\n\nSatori asked him to voice those concerns too. After a silence, the negotiations finally turned to quantities, routes, and who would authorize passage. The Palace of the Earth Spirits had enough reserves for a while. But if the entrance were surrounded, the sick and those who depended on outside supplies would be trapped with it. The war above would not make the vengeful spirits any easier to manage.\n\nShe also kept asking about Koishi. Her sister often wandered outside and might not give her name to the troops of any faction she encountered. Satori could read the doubts of the envoy before her, but these reports could not tell her where Koishi was now. Still less could she decide whom her sister would choose to follow in the future.\n\nThe pledge bound for the Scarlet Devil Mansion was finally sealed together with the alliance terms: continued trade and medical supplies, joint control of access to the underground, and cooperation in rooting out infiltrators. Some below objected to the choice, asking whether she had never heard of the Scarlet family's methods.\n\n“I have. That is why the terms must be explicit,” Satori replied.\n\nShe believed Remilia would follow clear interests and orders, which made her easier to deal with than continually shifting promises. Even so, Satori had the personnel each side could station checked line by line. She did not simply stamp the text the mansion had supplied. She understood equally well that once the pact was sent, every other faction would take note of the palace's position.\n\nAfter the notice went up, the entrance guards began checking convoys under the new agreement. Satori remained in the hall, waiting for confirmation that the first shipment of medicine had actually reached the stores. One seat beside the table was still empty. She told those bringing reports that, if they saw Koishi on the road, they should tell her everything at home was as usual. She need not stay away."
  kyo_postwar.19.a:0 "Having read the hearts of men, she chose the most controllable darkness."



 

  kyo_postwar.20.t:0 "Cirno's Determination"
  kyo_postwar.20.d:0 "When the flames of war spread to the lake, the first thing to freeze wasn't the water, but the laughter.\n\n The fairies who once treated war as a game began to disappear one by one amidst gunfire and hunger, only to be resurrected again; each time they returned, they were met with an even colder reality—in the eyes of those high and mighty youkai, fairies were forever just cheap disruptors, disposable bait, noise to be used and forgotten.\n\n Cirno heard Seija Kijin's declaration, and also heard the words behind the declaration that truly pierced her heart: “The weak are trampled on because they are used to being trampled on.” So the “strongest fairy” made a choice.\n\n She wasn't doing it for fun, nor was she just joining in the fun. She wanted to prove that fairies were not fragments adorning the seasons, much less tools for anyone. She wanted everyone to remember that ice not only freezes lakes, but also arrogance and class.\n\n She folded her wings tighter, clenched her fists more firmly, and stood beneath the banner of the revolutionary front, as if declaring to the world—fairy will no longer be looked down upon, starting today."
  kyo_postwar.20.a:0 "The strongest is not a slogan, but her oath."

  kyo_postwar.21.t:0 "The Immortal Phoenix Mokou and Keine, Devourer of History"
  kyo_postwar.21.d:0 "After the full-scale outbreak of war, the nights in the city no longer held the warmth of lamplight, only the footsteps of patrols and the echoes of distant cannon fire. Children were driven into cellars, shops boarded up their windows, and rumors swirled like fog in the alleys—which army would enter the city today? Would they requisition grain, or life itself?\n\n Keine Kamishirasawa stood before the temple house, lost in thought. She understood the fixed pattern of history: whenever powerful forces tear each other apart, the first to be crushed are always the civilians without banners or armies. She couldn't allow the people to become spoils of war, nor could she watch “human memory” be erased by the flames of war.\n\n Therefore, she made a sober and sobering decision—to no longer be merely a recorder. Keine, leading representatives of the people, personally went to the Myouren Temple to plead for aid from Byakuren Hijiri. She didn't discuss politics, only one thing: to ensure the people of the people could survive, to allow the children to continue learning to read and write, and to prevent history from being rewritten by the sword as propaganda for a single power.\n\n Behind Keine, Fujiwara no Mokou was like an inextinguishable flame. She didn't need oaths; she herself was the oath. For Mokou, the people of the people weren't just points on a map, but the “home” she had watched grow, die, and regenerate over the long years. She knew she couldn't stop the war, but she could do the simplest and cruelest thing—stand behind Keine, letting any tyrannical person who wanted to step into humanity step on the flames first.\n\n Keine and Mokou placed their hopes on Byakuren Hijiri: not because Byakuren were guaranteed victory, but because in this age of only power and hatred, the Myouren Temple was still willing to write “coexistence” into a tangible promise. As long as this glimmer of hope remained, humanity still had a future to choose from."
  kyo_postwar.21.a:0 "They entrusted their future to Byakuren, and also entrusted their backs to each other."

 kyo_postwar.23.t:0 "Lunar Capital invaded Earth."
 kyo_postwar.23.d:0 "While the Youkai, humans, and various forces on Earth were still mired in endless infighting and purges, true destruction had already descended from the heavens.\n\n There was no declaration of war, no messengers, and no room for negotiation. Lunar Capital's forces tore through the clouds, unleashing a cold, clean killing intent as they swept across the land from the heavens. Beams of light and artillery fire rained down like a storm, flattening mountains, drying up lakes, and reducing cities and settlements to ashes in a blinding white light. Those factions still locked in conflict didn't even have time to comprehend what was happening before being crushed by a higher power.\n\n In Lunar Capital's eyes, this land had long lost its value. A world filled with filth, chaos, death, and ambition was never worth saving. Gensokyo's split provided them with the perfect opportunity; and the judgment from the Moon had finally fallen.\n\n Those who once fought for control of this land now faced the same fate in the same divine punishment. Whether proud and powerful or struggling to survive, whether harboring ideals, ambitions, hatred, or simply wanting to live—everything became meaningless before the iron and light of Lunar Capital.\n\n The history of Gensokyo thus came to an end."
 kyo_postwar.23.a:0 "Everything is over."






