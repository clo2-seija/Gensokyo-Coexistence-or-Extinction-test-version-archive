  Tsukumogami_ship_decision:0 "Tsukumogami Tuning Project"
  Tsukumogami_ship_decision_desc:0 "A hundred instruments ring out as spiritual light draws the bowstring taut. Old objects take the stage, and the tsukumogami §Ytune§! the system one part at a time:\n— §YEnable§! a companion's blessing to let that instrument take the lead, immediately quickening the tempo of research;\n— §RDisable§! it with a sudden break in the rhythm, returning its resources to the ensemble before the next movement begins.\n\n Switch freely among Surprise, Beat, Biwa, Koto, Menreiki, and Miracle Mallet, turning Gensokyo's research programme into an orchestra that moves from lyrical passages to explosive crescendos."

