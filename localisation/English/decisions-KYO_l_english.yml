 five_precepts_progressbar_category:0 "The Rudder of the Five Precepts"
 five_precepts_progressbar_category_desc:0 "Byakuren clearly understands that if Myouren Temple wants to bring postwar Gensokyo back on track, compassion and aspirations alone are far from sufficient. The nation is like a ship navigating storms, with each disciple holding different ropes and oars, but the one who truly corrects the course is always Byakuren Hijiri.\n\n Not killing, not stealing, not committing adultery, not lying, not drinking alcohol—these five precepts are not merely the rules for monks, but also the self-restraint of the postwar regime, the five bottom lines that Myouren Temple attempts to reconnect with youkai, humanity, the nation, and ideals.\n\n Every adjustment is a trade-off; every step forward means another must be brought to a halt. What Byakuren aims to do is not to make everyone perfect immediately, but to gradually guide the entire ship back onto a path of coexistence amidst swaying and deviation."

 five_precepts_progressbar_daily_add:0 "Test: Five Precepts Progress"
 five_precepts_progressbar_daily_add_desc:0 "Temporarily increase the progress of the Five Precepts to test the internal practices and national changes within the Myouren Temple."

 five_precepts_progressbar_daily_decrease:0 "Test: Five Precepts Regression"
 five_precepts_progressbar_daily_decrease_desc:0 "Temporarily decrease the progress of the Five Precepts to test the internal practices and national changes within the Myouren Temple."

 decision_peace_and_honest:0 "Peace Through Sincerity"
 decision_peace_and_honest_desc:0 "When Byakuren corrects the nation's direction, they often cannot allow all virtues to grow simultaneously. To minimize harm to all beings and foster greater peace, we must first sacrifice some of the overly sharp “truth.” Peace will prevail, and the sharpness of outspokenness must be temporarily tempered."

 decision_honest_and_lust:0 "Suppress Desire with Righteousness"
 decision_honest_and_lust_desc:0 "When Myouren Temple chooses to face the nation and all living beings with greater candor and clarity, many runaway desires are brought back under control. Teaching everyone to face themselves honestly is itself a step toward Byakuren's path."

 decision_lust_and_wine:0 "Temper Drink with Clarity"
 decision_lust_and_wine_desc:0 "When desire is held in check, obsession and excess naturally begin to recede. Byakuren does not seek to sever every instinct by force. She means to bring the indulgences that could drag the nation down within the bounds of restraint."

 decision_wine_and_peace:0 "Drown Conflict in Drink"
 decision_wine_and_peace_desc:0 "A nation does not always regain its balance through the most rational means. Sometimes pent-up emotions must first be given room to escape. Indulgence will grow, but peace will weaken with it. Byakuren knows perfectly well that this can never be a lasting answer—only a temporary turn of the rudder amid the storm."

