 prestige_random_event_part_1:0 "Scarlet Devil Anecdotes from the Scarlet Devil Mansion"
prestige_random_event_part_1_desc:0 "In this mansion, even a tea party, a casual remark, or a glance can become an echo of power."

prestige_random_event_part_2:0 "Behind-the-Scenes Turbulence of Scarlet Devil Mansion"
prestige_random_event_part_2_desc:0 "Behind the curtain, there is never peace. Favoritism, imbalance, testing, and neglect are all quietly rewriting the ruling order of Scarlet Devil Mansion."

prestige_system_value_change_monthly:0 "Monthly Fluctuations in Authority"
prestige_system_value_change_monthly_desc:0 "Authority doesn't come from nowhere. Every month, performance, public opinion, and the master's preferences reshuffle the positions of the members of Scarlet Devil Mansion."


scarlet_prestige_sakuya:0 "Sakuya's Governing Talent"
scarlet_prestige_sakuya_desc:0 "Sakuya Izayoi's most formidable talent has never been mere combat prowess, but her ability to hammer chaos into order. Documents, deployments, rationing, coordination—everything in her hands becomes an almost flawless process. The greater the Scarlet Devil Mansion's administrative efficiency, the more §YPolitical Power§! it will steadily generate for the regime."

scarlet_prestige_meiling:0 "Meiling's Guardian Demeanor"
scarlet_prestige_meiling_desc:0 "Hong Meiling does more than guard the gate: she steadies the spirit of the entire Scarlet Devil Mansion. Her reliability, warmth, and martial bearing inspire more people to follow the Mansion—and to believe this is a regime worth rallying behind. The stronger that faith becomes, the more §Ymanpower§! the Scarlet Devil Mansion can mobilize."

scarlet_prestige_remilia:0 "Remilia's Deterrence"
scarlet_prestige_remilia_desc:0 "Remilia's rule is built on awe. Her name, her crimson mist, and her supreme vampire monarchy command the bowing of her subjects and the hesitation of her enemies. The greater the stability within the regime and the higher the public's acceptance of war, the more stable §YStability§! and §YWar Support§! become."

scarlet_prestige_flandre:0 "Flandre's Fairy Tale"
scarlet_prestige_flandre_desc:0 "Flandre's existence is like a dark fairy tale: beautiful, innocent, bizarre, yet dangerous enough to make one afraid to think too deeply. The more rumors about her spread, the harder it is for the enemy to maintain peace. It makes hostile countries more prone to panic and unease, thereby reducing their §YStability§! and §YWar Support§!."

scarlet_prestige_patchouli:0 "Patchouli's Knowledge"
scarlet_prestige_patchouli_desc:0 "Patchouli's knowledge isn't just ordinary knowledge, but answers that can be directly translated into a war advantage. Magical theory, industrial models, experimental techniques, tactical support—her knowledge will continuously propel Scarlet Devil Mansion to greater heights. Scarlet Devil Mansion gains a §YResearch Speed bonus§!."


 scarlet_prestige_sakuya_1:0 "Silver Pen and Ledgers"
scarlet_prestige_sakuya_1_desc:0 "From inventory to document filing, from rationing to list transcription, Sakuya Izayoi's most basic yet terrifying side is revealed: she can transform a chaotic mess into a flawless answer."

scarlet_prestige_sakuya_2:0 "The Head Maid's Etiquette"
scarlet_prestige_sakuya_2_desc:0 "Further emphasizing Sakuya's dominance in reception, demeanor, and court etiquette. She's not just good at getting things done, she knows who should speak first, who should bow their head, and who doesn't even deserve to make a mistake in their posture."

scarlet_prestige_sakuya_3:0 "Arrangements Engraved on the Clock Face"
scarlet_prestige_sakuya_3_desc:0 "Promotes Sakuya's almost obsessive control over time and processes. Banquets, inspections, supplies, orders, and dispatches are all scheduled to the precise minute, as if the entire Scarlet Devil Mansion breathes to her second hand."

scarlet_prestige_sakuya_4:0 "Leaves No Room for Disorder"
scarlet_prestige_sakuya_4_desc:0 "Promotes Sakuya's image as order itself. Wherever she goes, chaos is flattened, delays are cut off, and any attempt to exploit loopholes within Scarlet Devil Mansion will ultimately crash into her meticulously organized walls."

scarlet_prestige_sakuya_5:0 "Perfection is the Answer"
scarlet_prestige_sakuya_5_desc:0 "Sculpts Sakuya into the irreplaceable head maid. She is no longer merely efficient, elegant, or meticulous, but the most intricate core component of Scarlet Devil Mansion's governing machine—her very existence is perfect administration."

 scarlet_prestige_meiling_1:0 "The Smile at the Door"
scarlet_prestige_meiling_1_desc:0 "First, let people remember Hong Meiling's most easily overlooked yet irreplaceable aspect: she stands at the door, speaks first, then strikes. That composure, friendliness, and tact are Scarlet Devil Mansion's first impression."

scarlet_prestige_meiling_2:0 "Demeanor Between Fists and Feet"
scarlet_prestige_meiling_2_desc:0 "Further emphasize Meiling's demeanor as a martial artist. She doesn't just throw people away; she knows when to block, when to yield, and when to deliver a decisive victory to save face for Scarlet Devil Mansion."

scarlet_prestige_meiling_3:0 "Qi Flows Like a Wall"
scarlet_prestige_meiling_3_desc:0 "Promote Meiling's mastery of qi and her ability to solidify her defenses. When she's serious, the doorway is no longer just a doorway, but a true boundary; the wind can pass through, but people cannot."

scarlet_prestige_meiling_4:0 "A Gentle Guardian"
scarlet_prestige_meiling_4_desc:0 "High-profile portrayal of Meiling's rare dual nature: she can hold off enemies, yet also offer a way out to visitors. Strength isn't about bullying the weak, but about ensuring the order behind the door doesn't always bleed."

scarlet_prestige_meiling_5:0 "The Shield of Scarlet Devil Mansion"
scarlet_prestige_meiling_5_desc:0 "To mold Meiling into the most solid defense of Scarlet Devil Mansion. Her name represents not only a dashing fighter, but also reliable, steadfast, and reassuring protection—as long as she stands, the door will not fall."


scarlet_prestige_remilia_1:0 "The Descent of the Young Moon"
scarlet_prestige_remilia_1_desc:0 "First, let people get used to looking up at Remilia again. She doesn't need lengthy pronouncements; she only needs to stand high, letting the arrogance and beauty of vampire nobility subside."

scarlet_prestige_remilia_2:0 "The Crimson Pressure"
scarlet_prestige_remilia_2_desc:0 "Further emphasizing Remilia's suffocating oppressive aura. Her cloak, her gaze, her tone that seems to look down on a toy—all these things silence those around her."

scarlet_prestige_remilia_3:0 "The Throne in the Crimson Mist"
scarlet_prestige_remilia_3_desc:0 "Promoting Remilia's image as a ruler bound to the crimson mist, the night, and a sense of dominance. She is not merely a leader, but an entity that makes the entire space feel like her domain."

scarlet_prestige_remilia_4:0 "Even Fate Should Bow Down"
scarlet_prestige_remilia_4_desc:0 "High-profile portrayal of Remilia's almost arrogant narrative of kingship: she is not one to accept fate, but one to bend it. Her rule, therefore, carries an undeniable aggressiveness."

scarlet_prestige_remilia_5:0 "The Scarlet Queen"
scarlet_prestige_remilia_5_desc:0 "To mold Remilia into a truly unchallengeable Scarlet Queen. Her name is no longer just that of the mistress of Scarlet Devil Mansion, but a symbol that makes nations bow down, armies tremble, and night itself seem to be crowning her."


scarlet_prestige_flandre_1:0 "Children with Crystal Wings"
scarlet_prestige_flandre_1_desc:0 "Let's start with the gentlest, yet most dangerous, place—let people know that there's a beautiful little sister in Scarlet Devil Mansion, as pretty as a fairytale illustration. What lies behind that beauty, we'll leave that for now."

scarlet_prestige_flandre_2:0 "The Little Princess in the Tower"
scarlet_prestige_flandre_2_desc:0 "Further, we'll package Flandre as a story shrouded in towers, locks, and secrets. She's like a princess, and also like a calamity; the less she's seen, the more allure she gains from rumors."

scarlet_prestige_flandre_3:0 "Danger in the Candy House"
scarlet_prestige_flandre_3_desc:0 "Let Flandre's image begin to take on a more pronounced dark fairytale feel: sweet, innocent, and inviting, but one wrong step, and what lies beneath the icing is no longer a treat, but a tooth."

scarlet_prestige_flandre_4:0 "The Sister in the Depths of a Dream"
scarlet_prestige_flandre_4_desc:0 "Cast Flandre as a figure straight out of Alice in Wonderland. She is a child who seems to have stepped from a dream, her logic and emotions never quite belonging to the ordinary world—endearing enough to put others at ease, yet dangerous enough to send a chill down their spines."

scarlet_prestige_flandre_5:0 "The Most Beautiful Bad Ending"
scarlet_prestige_flandre_5_desc:0 "Complete Flandre's transformation into a dark fairy tale: the most dazzling figure in the final chapter, the Scarlet Devil Mansion's most cherished little sister, and the one person no one truly wishes to anger."


scarlet_prestige_patchouli_1:0 "Whispers Between the Pages"
scarlet_prestige_patchouli_1_desc:0 "First, let people remember Patchouli's most basic authority: she always sits behind the books, yet knows everything. Every turn of the pages in the library slowly carries her name far and wide."

scarlet_prestige_patchouli_2:0 "The Classification of Forbidden Books"
scarlet_prestige_patchouli_2_desc:0 "Further emphasizing Patchouli's ability to organize and control knowledge. She doesn't simply collect books; she classifies dangers, numbers arcane arts, and establishes order in the forbidden world."

scarlet_prestige_patchouli_3:0 "The Research of the Seven-Colored Mage"
scarlet_prestige_patchouli_3_desc:0 "Promoting Patchouli's in-depth exploration of spells, experiments, and magical theory. Her value lies not only in knowing the answers but also in her ability to dismantle the unknown and create new answers herself."

scarlet_prestige_patchouli_4:0 "The Central Hub of the Great Library"
scarlet_prestige_patchouli_4_desc:0 "High-profile portrayal of Patchouli as the central hub of knowledge. Resources, industry, magic, sealing, research—everything ultimately returns to her desk, and she rewrites the chaos into actionable solutions."

scarlet_prestige_patchouli_5:0 "Humanoid Library"
scarlet_prestige_patchouli_5_desc:0 "Patchouli is molded into an irreplaceable embodiment of knowledge within Scarlet Devil Mansion. She is no longer merely a librarian, but the library itself—a living, breathing, thinking, and rewriting humanoid books that understand the world."



 KYO_lunar_invasion_warning_category:0 "Lunar Capital Invasion Countdown"
 KYO_lunar_invasion_warning_category_desc:0 "After Yukari Yakumo's return, Lunar Capital will need approximately two years to gain control of the major surface nations. The invasion will automatically begin when the countdown reaches zero; completing the invasion “before Lunar Capital” will grant a preemptive strike and a six-month bonus."
 KYO_lunar_invasion_countdown:0 "Lunar Capital Invasion Preparation Complete"
 KYO_lunar_invasion_countdown_desc:0 "§R730 days later, Lunar Capital will control the major surface nations and launch an invasion of Gensokyo.§! can be completed before the countdown, §Y, to preempt Lunar Capital,§!, initiate the war, and gain §G180 days of preemptive strike advantage,§!."



 KYO_lunar_campaign_category:0 "Final Battle for the Moon"
 KYO_lunar_campaign_category_desc:0 "The surface war can be viewed after it begins, but it will only officially start after completing National Focus (§Y and opening the gap to the Moon §!). Each round lasts 60 days; Lunar Capital's expected value retains its original dynamic calculation and difficulty selection, but is additionally reduced by 6 points (§G during the final calculation §!). The attacker wins when the attack value X is strictly greater than the defense value T; if X = T, the defender wins. When the player achieves their 3rd win, the Lunar Capital faction will declare full-scale war on any independent nations that have not yet engaged in combat; the United States will lift control upon the 4th win. The first side to achieve 6 wins ends the series."

 KYO_lunar_reconstruction_category:0 "Lunar Capital Reconstruction and Secret Seal Post-War Dialogue"
 KYO_lunar_reconstruction_category_desc:0 "Post-war work is divided into nine phases, each requiring 35 days. Players decide when to continue; the entire post-war dialogue will no longer automatically pop up from a single event."

 KYO_love_story_category:0 "Sunset Vow: Optional Story"
 KYO_love_story_category_desc:0 "These life stories are independent of each other. You can choose any chapter, or ignore them all."

 KYO_yukari_archive_category:0 "Yukari Yakumo's File"
 KYO_yukari_archive_category_desc:0 "Reimi's File and the Sealed Old Files: Progress on each item. Complete one to unlock the next."

