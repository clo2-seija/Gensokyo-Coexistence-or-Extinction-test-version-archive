 KYO_lunar_report_1_win:0 "§YThe Moon Login | Victory in This Round§!\n The Moon Sea is calm, yet Tengu spreads its location throughout the army with a whirlwind. Satori Komeiji peels away the surveillance gaps from the defenders' thoughts, and Koishi lights up the landing point on an unnoticed path; Gap tears open the long night behind the Moonbow Watchtower, and Gensokyo's banner falls on the Moon for the first time."

 KYO_lunar_report_1_loss:0 "§YLunar Landing | Defeat This Round§!\n Yorihime calls down the gatekeeper god, whose divine light drives the beachhead back to the gap. The Komeiji sisters redraw the blind spots, the tengu recover those cut off from the force, and the advance team defends the last route home.\n\n Yukari closes her folding fan: “The moon is still there. We are still here too. Regroup. We will try again.”"

 KYO_lunar_report_2_win:0 "§YFirst Gate | Victory This Round§!\n Byakuren stood before the descending gods, her Buddha-light opening the army's first breach. Suika laughed as she rallied the oni and hurled them against the gate on the schedule Ran had calculated; the hundred youkai who had fought as scattered bands a thousand years ago now crossed the Lunar Capital's threshold in a single, united stride."

 KYO_lunar_report_2_loss:0 "§YFirst Gate | Defeat in this round§!\n Toyohime folded the long street, the charging army deviating from the gate in a few steps. Byakuren used magic to protect the retreating army, the oni braving divine fire to drag back the Kappa heavy artillery.\n\n Yukari gazed at the ever-changing long street: “She can fold roads, but she can't break our army. Bring back the wounded. Next time, breach the gate head-on.”"

 KYO_lunar_report_3_win:0 "§YLunar Capital Outer Wall | Victory in this round§!\n Red mist obscured Lunar Capital's silver-white sky, and Nitori directed artillery fire to pierce the outer wall following the beacon in the fog. Humans and Youkai crossed the same section of the wall, but did not turn their weapons on the civilian houses; the Lunarians hiding behind the doors saw for the first time that the newcomers were not the city-slaughtering fiends the Lunar Capital had described."

 KYO_lunar_report_3_loss:0 "§YLunar Capital Outer Wall | Defeat in this round§! moon Rabbit fired crisscrossing shots from the rooftops and corridors, forcing the besieging army to retreat from the breach.\n Kappa left a trail of escape in the red mist, while Scarlet Devil Mansion covered the rear of the convoy with a final volley.\n\n Yukari stood outside the walls: “What we've lost is only a section of the outer wall, not this war. Everyone come back, and we'll cross it again.”"

 KYO_lunar_report_4_win:0 "§YInner City Moon Canal | Victory in this round§!\n Eientei allowed the wounded to stand again, while Hakugyokurou led the spirits of the fallen across the moon canal. The living advanced along the left bank, while the dead followed from the right; the two armies met before the inner city gate, and even death could not stop Gensokyo's advance."

 KYO_lunar_report_4_loss:0 "§YInner City Moon Canal | This round's defeat§!\n The purification spell sealed off the Moon Canal, separating the wounded soldiers from their return journey. Reisen disrupted the moon rabbit's signal with her Mad Eyes, and Youmu escorted the wounded one by one through the remaining passage.\n\n Yukari personally held up the closing gap: “Bring back the living first, and don't forget the names of the dead. If the road is blocked, I will open another one.”"

 KYO_lunar_report_5_win:0 "§YBefore the palace steps | Victory this round§!\n Reimi erected a temporary torii gate on the lunar land, pinning the Hakurei's return path before the palace steps. The Moriya gods, following the coordinates calculated by Ran, descended their pillars; the moment the retreat was secured, Yukari gathered the countless gaps, causing them to simultaneously bite into the royal castle's protective walls."

 KYO_lunar_report_5_loss:0 "§YBefore the Palace Steps | Defeat in This Round§!\n The Watatsuki sisters concentrated all their divine spirits and moon rabbits before the palace steps, and the sacred pillars were shattered one by one by the divine light. Reimi failed to hold the ceremony, and Ran and Chen kept shortening their return path. The allied forces retreated to their defensive line before the gap closed.\n\n Yukari did not turn around: “They only held the steps. Go back, stand firm, and come back up.”"

 KYO_lunar_report_6_win:0 "§YThe Final Moon Gate | Victory in This Round§!\n Crimson mist covered the sky, war drums shook the moon, the sacred pillars and the sea of flowers crossed the final gap together, and Hakugyokurou's soul-guiding butterflies followed the military flag into the royal city. An inside agent broke the seal from within the city, and the allied forces shattered the gate hinges from outside. Finally, the Moon Gate opened with a deafening roar between the two forces. No single banner could claim this victory alone."

 KYO_lunar_report_6_loss:0 "§YThe Final Moon Gate | This Round's Defeat§!\n The Final Moon Gate closed again before the entire army, and Lunar Capital's divine fire poured down the city walls. Byakuren and Suika held the flanks, while Yukari ordered all forces to retreat along the same gap, leaving no one behind on the moon.\n\n She was the last to cross the passage: “Doors can close again, gaps can open again. As long as Gensokyo is still here, this war is not over.”"

