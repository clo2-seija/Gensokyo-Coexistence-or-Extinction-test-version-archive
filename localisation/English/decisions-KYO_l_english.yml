  the_end_of_japan_youkai_war:0"Fight or exterminate"


 GSK_indproj_civ_1:0 "[FROM.GetName] Regional civilian industrial expansion"
 GSK_indproj_civ_1_desc:0 "The kappa bring in machine tools, boilers, and crates of disassembled Outside World parts. Yamawaro measures the soil layers and reinforces the supports beside the foundation, connecting the previously scattered workshops into a usable production area. Once the chimney rises and the conveyor belt starts turning, [FROM.GetName] will have additional construction space and will establish a Civilian Factory, ensuring a stable supply of tools, building materials, and daily necessities to the market."

 GSK_indproj_civ_2:0 "[FROM.GetName] Large-scale Civil Industrial Expansion"
 GSK_indproj_civ_2_desc:0 "This is not an isolated workshop, but an entire new industrial district. Kappa is responsible for laying power lines and mechanical frames, while the yamawaro dig warehouses and level roads. Fairies relay messages among the material piles, making the entire construction site bustling with activity. Upon completion, [FROM.GetName] will add more construction space and establish two Civilian Factories, enabling local productivity and commerce to take off simultaneously."

 GSK_indproj_mil_1:0 "[FROM.GetName] Regional Military Industrial Expansion"
 GSK_indproj_mil_1_desc:0 "Kappa will transform old forges into standardized military production lines, while the yamawaro will house heavy steel and gunpowder magazines in reinforced factory buildings. The sounds of hammers, test firings, and haul truck wheels echoed across [FROM.GetName], symbolizing the formal integration of this land into the wartime production system. After completion, additional construction space will be added, and a Military Factory will be established."

 GSK_indproj_mil_2:0 "[FROM.GetName] Large-scale Military Industrial Expansion"
 GSK_indproj_mil_2_desc:0 "An even larger military production line will be established at [FROM.GetName]. Kappa (professional engineers) calibrate presses, assembly lines, and ammunition testing equipment day and night, while Yamawaro (professional engineers) delve underground to construct secure warehouses and transport routes, ensuring raw materials can enter, finished products can leave, and explosions won't blow the entire construction site to the sky. Upon completion, even more construction space will be added, and two Military Factories will be established, becoming a crucial core of the frontline military industry."

 GSK_indproj_infrastructure:0 "[FROM.GetName] Regional Infrastructure Construction Projects"
 GSK_indproj_infrastructure_desc:0 "Roads were widened, bridges were reinforced, and previously muddy and difficult sections of road were gradually compacted by the yamawaro. Kappa laid drainage ditches, simple repair stations, and cargo transfer points along the route, allowing convoys, supply teams, and patrols to pass more quickly. Upon completion, [FROM.GetName] will see a significant upgrade in infrastructure, making the flow of people, goods, and military supplies much smoother."

 GSK_indproj_resource_prospecting:0 "[FROM.GetName] Regional Resource Exploration"
 GSK_indproj_resource_prospecting_desc:0 "Yamawaro, equipped with probes and miners' lamps, drilled deep into the rock strata, while Kappa set up analyzers, steam cranes, and temporary smelting furnaces on the surface. They chipped away at the rock walls, recorded the veins, and searched for resources that could support industry in the soil, valleys, and abandoned pits. Upon completion of the project, [FROM.GetName] will commence resource exploration and discover different types of exploitable resources based on the characteristics of the region."

 GSK_indproj_special_facility:0 "[FROM.GetName] Special Research Facility Construction"
 GSK_indproj_special_facility_desc:0 "This project requires more meticulous planning than a typical factory. Kappa is responsible for installing precision instruments, isolation devices, and experimental power systems, while yamawaro constructs thick walls, underground pipelines, and safe passages, transforming the entire area into a closed facility capable of withstanding high-risk research. Once the final seal and security gate are lowered, [FROM.GetName] will complete the corresponding special research facility, paving the way for deeper technological breakthroughs."






 KYO_industry_projects:0 "Construction Abounds"
 KYO_industry_projects_desc:0 "From river workshops to mountain clinics, from mines to arsenals, a massive construction boom has swept across the land. Kappa, yamawaro, tengu, oni, fairies, and human craftsmen all join forces to bring back the sounds of machines, hawking, and the flow of wealth to the silent land."

 GSK_indproj_282_civ_1:0 "River Bend Machine Workshop"
 GSK_indproj_282_civ_1_desc:0 "Nitori converted an old waterwheel into a continuous machine tool, and fairies flew back and forth between scaffolding carrying screws and blueprints. New civilian workshops sprang up, and timber, pottery, and farm tools began to flood the market, instantly making the area bustling."

 GSK_indproj_282_mil_2:0 "Raven Feather Armory Corridor"
 GSK_indproj_282_mil_2_desc:0 "Aya Shameimaru touted this place as “the fastest-completed military supply miracle,” while Momiji Inubashiri truly kept a close watch on the construction site. The two military supply factories operated day and night, with firearms and ammunition rolling off the production line, even making a fortune for the surrounding vendors."

 GSK_indproj_1018_mil_1:0 "Armored Weaponry Shop"
 GSK_indproj_1018_mil_1_desc:0 "Outside the mountain gate, there was no longer only the sound of bells, but also the roar of hammers and bellows. With the support of monks and the Youkai, craftsmen established weapons workshops, and the new military supply factory gave this land its first stable and respectable armed production capacity."

 GSK_indproj_1018_civ_1:0 "Morning Bell Commercial District"
 GSK_indproj_1018_civ_1_desc:0 "As soon as the morning bell rang, carpenters, tailors, and grain merchants opened their shops. The new Civilian Factory spurred the gathering of warehousing, transportation, and vendors, transforming the once quiet area into a bustling, lucrative district."

 GSK_indproj_1019_civ_2:0 "Autumn Harvest Processing Zone"
 GSK_indproj_1019_civ_2_desc:0 "Minoriko Aki was busy overseeing the grain warehouses, while Shizuha Aki meticulously managed the drying, storage, and packaging processes. After the completion of the two Civilian Factories, grain was no longer simply harvested and left to its own devices; it could be processed, sold, and exchanged for more wealth and jobs."

 GSK_indproj_1019_civ_1:0 "Abundant Grain Cooperative"
 GSK_indproj_1019_civ_1_desc:0 "The harvest shouldn't just stop in the fields, so new cooperative workshops were built. Grains, dried fruits, and minimally processed foods began to be shipped steadily, ensuring that farmers, porters, and caravans all had food to eat and money to earn."

 GSK_indproj_1020_civ_1:0 "Yamaguchi Distribution Center New Street"
 GSK_indproj_1020_civ_1_desc:0 "What was originally just a crossroads has now sprouted warehouses, workshops, and stalls. The newly built Civilian Factory became the first pillar of the trade route, directly transforming the flow of goods passing through into local business and tax revenue."

 GSK_indproj_1020_mil_1:0 "White Wolf Armory"
 GSK_indproj_1020_mil_1_desc:0 "Momiji, accompanied by White Wolf Tengu, patrolled the area again and again, ensuring that every crate of ammunition was stored on time. The new supply factory finally provided a decent supply point behind the defensive line, putting the soldiers at ease, and the surrounding transportation industry also flourished."

 GSK_indproj_526_civ_1:0 "Riverside Woodworking Association"
 GSK_indproj_526_civ_1_desc:0 "The riverbank once held nothing but damp air and wood shavings. Now rows of saw benches and storage sheds line the water. The Civilian Factory has spurred lumber processing, furniture making, and tool repair—and the workers have even kept the nearby taverns thriving."

 GSK_indproj_526_mil_1:0 "Will-o'-Wisp Forge"
 GSK_indproj_526_mil_1_desc:0 "Yuugi came in person, carrying iron stock as casually as firewood before tossing it beside the furnace. Under the oni's vigorous hands, the new munitions plant took shape at remarkable speed. It produced more than weapons: it gave everyone the feeling that they truly could keep fighting."

 GSK_indproj_528_mil_2:0 "Gale Artillery Assembly Line"
 GSK_indproj_528_mil_2_desc:0 "The tengu calculated the mountain winds as precisely as the production process. Parts came uphill, gun carriages went down, and even the assembly line ran like a military exercise. Two Military Factories have turned this place into a genuine center of firepower, with orders and materiel surging together."

 GSK_indproj_528_civ_1:0 "Cloudtop Trading Post"
 GSK_indproj_528_civ_1_desc:0 "Aya photographs and writes from above while merchants below scramble for stalls and haggle over prices. The new Civilian Factory has brought storage and processing capacity to the highlands, allowing the mountain's goods to become money in the lowlands far more quickly."

 GSK_indproj_529_civ_1:0 "Lamplit Artisan Street"
 GSK_indproj_529_civ_1_desc:0 "The nights are quiet no longer. Once the lamps come on, shops and workshops open one after another. The new Civilian Factory has stabilized the production of textiles, food, and daily necessities, and the whole street seems to have suddenly learned how to grow by itself."

 GSK_indproj_529_mil_2:0 "Red-Flame Steel Armaments Bureau"
 GSK_indproj_529_mil_2_desc:0 "The oni take on the heaviest and dirtiest work, while the kappa regulate furnace temperatures and molds with almost punishing precision. With two Military Factories running, steel is no longer mere raw material: it becomes an unbroken stream of gun barrels, artillery frames, and the hard power needed to steady the situation."








 GSK_indproj_524_resource_coal:0 "Oni Coal-Seam Works"
 GSK_indproj_524_resource_coal_desc:0 "One wave of Yuugi's hand banished every trace of idleness from the mine. Entire coal seams were opened, mine carts thundered back and forth, and the black-gold boom lifted not only fuel supplies but every nearby workshop, kiln, and freight line."

 GSK_indproj_525_infrastructure:0 "Eientei Emergency Lifeline"
 GSK_indproj_525_infrastructure_desc:0 "This road was not built for appearances. It was built to save lives. Once the roads, bridges, and supply junctions were improved together, Eientei's medicine chests, stretchers, and physicians could reach every district more quickly. Patients survived, and workers could tackle major projects with greater confidence."

 GSK_indproj_527_resource_steel:0 "Tengu Steel Ridge"
 GSK_indproj_527_resource_steel_desc:0 "The tengu surveyed the mountain down to the last contour. Momiji sealed off the dangerous ground, while Aya had already begun drafting a special edition on the “steel boom.” Iron ore is now extracted more efficiently, steelmaking has expanded with it, and the whole region seems infused with newfound resolve."

 GSK_indproj_1028_resource_steel:0 "Subterranean Ironworks Plan"
 GSK_indproj_1028_resource_steel_desc:0 "The deeper veins are stifling and hot, but places like these hide what is truly valuable. New mining and smelting organizations are hauling iron out of the depths in bulk, supplying the armaments, construction, and railway sectors with the strength they lacked."

 GSK_indproj_1029_resource_tungsten:0 "Mountain-Rock Tungsten Vein"
 GSK_indproj_1029_resource_tungsten_desc:0 "The yamawaro chipped their way through cracks in the rock until they finally exposed a tungsten vein hard enough to make anyone swear. It is difficult to mine, but immensely valuable; this rare resource has at last given advanced industry and armaments the means to move up a generation."

 GSK_indproj_1030_infrastructure:0 "White Wolf Patrol Highway"
 GSK_indproj_1030_infrastructure_desc:0 "Momiji did not want an ordinary road. She wanted a hard-surfaced artery that patrols, supplies, and ambulances could all race along. Since its completion, Eientei's medicines arrive sooner, caravans run more often, and security and commerce have risen together."

 GSK_indproj_1031_infrastructure:0 "Crow Tengu Airlift Towers"
 GSK_indproj_1031_infrastructure_desc:0 "The tengu linked towers, cableways, and signal posts into a single network in one sweep. Aya even boasted that “we have drafted the wind itself into logistics.” With the infrastructure improved, casualty evacuation, emergency medicine deliveries, and high-value freight now move with astonishing speed, bringing the whole district to life."

 GSK_indproj_537_resource_oil:0 "Underground Oil Wells"
 GSK_indproj_537_resource_oil_desc:0 "When Kappa brought in their drilling rigs, everyone thought they were crazy; but when the black oil actually gushed from the ground, everyone immediately thought they were geniuses. With more fuel, machines, vehicles, and power generation all had more power, and the economy accelerated accordingly."

 GSK_indproj_633_infrastructure:0 "Minoriko Aki Grain Transport Route"
 GSK_indproj_633_infrastructure_desc:0 "Grain is most afraid of rotting on the way, so this route was designed from the beginning to accommodate storage, transportation, and resupply along the route. Minoriko Aki watched with satisfaction as convoys passed by, and the makeshift medical stations set up by Eientei greatly reduced the worries of laborers and merchants."

 GSK_indproj_645_infrastructure:0 "Myouren Temple Rescue Route"
 GSK_indproj_645_infrastructure_desc:0 "This wasn't just about building a road; it was about connecting resettlement, rescue, and distribution into a lifeline. After the roads were repaired, the wounded could be transported to treatment points faster, and supplies could reach surrounding settlements more reliably. The once quiet place gradually regained its vibrancy and the sounds of trade."

 GSK_indproj_646_infrastructure:0 "Youkai Mountain Tunnel Network"
 GSK_indproj_646_infrastructure_desc:0 "Yamawaro excel at turning ‘impossible’ into ‘open by this afternoon.’ Once the tunnels and mountain roads were cut through, tengu patrols moved faster, caravans made fewer detours, and both emergency medicine and military transport flowed far more smoothly."

 GSK_indproj_647_resource_aluminium:0 "Wind Cave Light Metal Mine"
 GSK_indproj_647_resource_aluminium_desc:0 "The light metal mine deep within the Wind Cave was finally developed by the system, and the Kappa were overjoyed, as if they had struck gold. With an abundance of aluminum, the aviation, machinery, and light industries all benefited, transforming this remote resource point into a sought-after territory."

 GSK_indproj_648_infrastructure:0 "Human Village Roads and Clinics"
 GSK_indproj_648_infrastructure_desc:0 "Newly paved roads, rebuilt bridges, and roadside clinics made daily life in the Human Village dependable again. Eientei's medical teams could arrive in time, goods moved more quickly, and the market grew livelier by the day."

 GSK_indproj_684_infrastructure:0 "Oni Heavy Transport Route"
 GSK_indproj_684_infrastructure_desc:0 "The oni found the original roads too narrow, too slow, and too cumbersome, so they simply widened, reinforced, and rebuilt them. With the heavy transport route opened, ore, steel, and large equipment could pass smoothly, and rescue and rest points were also set up along the way, significantly increasing the transportation capacity of the entire area."

 GSK_indproj_745_infrastructure:0 "Border Link Line"
 GSK_indproj_745_infrastructure_desc:0 "This line connected outposts, warehouses, clinics, and markets into one integrated system. Tengu handled information relay, while Eientei provided medical support. With the road completed, tasks that used to take days could now be completed in a single day, and the border finally felt like a truly breathing place."

 GSK_indproj_609_resource_coal:0 "Old Mine Revitalization Project"
 GSK_indproj_609_resource_coal_desc:0 "Long-abandoned mines have been relit, and truckloads of black coal are being transported out. The resumption of coal production not only feeds the boilers and furnaces but also sustains nearby workshops, freight depots, and small restaurants, bringing life back to the old area."


 GSK_indproj_645_infrastructure:0 "Ambulance Route"
 GSK_indproj_645_infrastructure_desc:0 "This wasn't just about building a road; it was about creating an unbroken lifeline connecting resettlement, rescue, and transportation. Keine helped coordinate manpower and supplies from settlements along the route, while Mokou personally led teams to clear obstacles and escort the wounded. With roads open, patients could be transported to treatment centers faster, and trucks could run more smoothly. The once-dull area finally lit up again."

 GSK_indproj_530_civ_2:0 "Lifestyle, Consumer, and Industrial Zone"
 GSK_indproj_530_civ_2_desc:0 "From sweets and textiles to tableware and lamps, two new civilian factories have transformed the entire district. The Three Fairies of Light steal materials one day and plaster advertisements everywhere the next, causing no end of commotion—but their mischief only makes the grand opening livelier. Once reserved for a privileged few, these refined goods now sustain jobs, trade, and a thriving street economy."

 GSK_indproj_530_civ_1:0 "Glass and Fabric Factory"
 GSK_indproj_530_civ_1_desc:0 "Rolls of fabric, glassware, and packaging boxes were produced one by one on the assembly line. The previously scattered small workshops were finally integrated into a factory capable of stable production. While the mischievous spirit would occasionally sneak into the warehouse and cause minor disturbances, once the finished products were actually rolling out of the factory gates, everyone could see that the money-making opportunities here had been completely secured."

 GSK_indproj_531_civ_1:0 "Engineering Experimental Manufacturing Workshop"
 GSK_indproj_531_civ_1_desc:0 "Blueprints were no longer just empty dreams lying on a desk, but were transformed into machines, tools, and marketable finished products. Kogasa always managed to find strange yet useful inspirations in old materials and scrap, saving prototypes a lot of time and effort. Once research and mass production were truly integrated, knowledge was no longer just empty talk, but the ability to generate profit."

 GSK_indproj_531_mil_1:0 "Standard Armory"
 GSK_indproj_531_mil_1_desc:0 "Every box number, every record, every process was meticulously checked, even screws and rivets had to be placed according to regulations. Eiki scrutinized the quality inspection reports line by line, forcing the entire military supply factory to become one of order and precision. The results were direct: stable production, low losses, and crystal-clear warehousing—everyone had to admit it was a resounding success."

 GSK_indproj_532_civ_2:0 "Human Village Expansion Project"
 GSK_indproj_532_civ_2_desc:0 "Carpenters, bricklayers, merchants, and apprentices were all swept up in this bustling construction frenzy. Keine helped coordinate manpower and schedules, ensuring the district expansion wasn't a chaotic mess. With the two Civilian Factories completed, Human Village immediately transitioned from “barely making ends meet” to a new phase of “being able to do business and support more people,” and the shouts on the streets were much louder than before."

 GSK_indproj_532_mil_1:0 "Garrison Armory"
 GSK_indproj_532_mil_1_desc:0 "This munitions factory wasn't for show; it was to ensure that checkpoints, patrols, and local garrisons received truly reliable equipment. Mokou was very direct with the samples, throwing anything unsuitable back for rework on the spot; Cirno, while leading a group of fairies busily working around the construction site, unexpectedly made the moving and delivery incredibly fast. When the first batch of munitions was distributed, even the surrounding blacksmiths and transport teams were busy."

 GSK_indproj_533_mil_2:0 "Armory Joint Factory"
 GSK_indproj_533_mil_2_desc:0 "These two military supply factories weren't the facades of any bigwig; they were the result of hard work and dedication, painstakingly built from the ground up. Some oversaw quality control, some pushed for progress, and some were responsible for smoothing things over when disputes arose. Small umbrellas refurbished and reused old parts, while ordinary workers seized every opportunity to save money, repair, and build, transforming this place into a truly capable and resilient base."

 GSK_indproj_533_civ_1:0 "Mutual Aid and Cooperation Market"
 GSK_indproj_533_civ_1_desc:0 "No one waited for handouts. Tools were gathered when needed, manpower was filled when needed, and space was provided for self-built stalls. The new Civilian Factory spurred the development of a market, warehouses, and a large number of small vendors. The Three Fairies of Light occasionally darted among the stalls, creating a lively atmosphere. Once money began flowing among the lowest strata of society, this place finally showed signs of turning its fortunes around."

 GSK_indproj_534_mil_2:0 "Comprehensive Supply Depot Cluster"
 GSK_indproj_534_mil_2_desc:0 "These two supply factories and depots operate as a unified whole, prioritizing speed. Mokou leads the escort, while Fairy relays messages everywhere. Goods that are in the rear warehouse today can be delivered to the front lines tomorrow. With supply lines secured, the war machine truly gets going, and even those in the surrounding area who make wooden crates, repair wheels, and transport provisions benefit from this windfall."

 GSK_indproj_534_mil_1:0 "Supply Forge"
 GSK_indproj_534_mil_1_desc:0 "Iron, timber, gunpowder, and spare parts are fed into the forge in sequence, then forged piece by piece into the most needed items for the front lines. Eiki is very strict about the process; anyone who dares to cut corners will be reprimanded on the spot. Cirno and Fairy run around the construction site, significantly speeding up the originally slow delivery process. The new supply factories not only support the front lines but also revitalize the artisans and businesses throughout the region."

 GSK_indproj_535_mil_1:0 "Border Emergency Ordnance Depot"
 GSK_indproj_535_mil_1_desc:0 "Here, the focus isn't on fancy features, but on speed—fast delivery, fast repair, and fast distribution. Once the supply factory was built, border outposts could immediately replenish any shortages, and old stockpiles no longer had to be artificially stretched to the point of obsolescence. Mokou occasionally personally tested new goods, and her few words of assertiveness and decisiveness were more persuasive than a full-page report."

 GSK_indproj_535_civ_1:0 "Border Trade Workshop Area"
 GSK_indproj_535_civ_1_desc:0 "Traveling merchants, short-distance transport, and small-scale processing gradually coalesced here. The new Civilian Factory transformed the border from a mere transit point into a place that truly retains money, people, and livelihoods. Keine also helped restore order along the border, preventing this bustling activity from descending into chaos."

 GSK_indproj_536_civ_2:0 "Muddy Land Transformation Project"
 GSK_indproj_536_civ_2_desc:0 "What was once a despised, neglected place has now been transformed, shovel by shovel, into a construction site, warehouses, and a new neighborhood. After two Civilian Factories were erected, vendors, workers, and moving crews flocked in, and even Cirno felt it was “finally starting to look decent.” The muddy land hadn't decreased much, but this area could now genuinely earn its own living and support more people."

 GSK_indproj_536_mil_1:0 "Assault Weapons Factory"
 GSK_indproj_536_mil_1_desc:0 "This military supply factory was all about directness: make what could be immediately deployed to the battlefield, then worry about anything else. Mokou appreciated this style; testing guns, inspecting knives, checking powder charges—nothing was overlooked. The fairies handled errands and deliveries, creating a strangely efficient atmosphere amidst the chaos of the construction site. The tension was rising, but the livelihoods of the nearby residents were becoming increasingly secure."


 GSK_indproj_555_infrastructure:0 "Grassroots Mutual Aid Transportation Network"
 GSK_indproj_555_infrastructure_desc:0 "There were no earth-shattering slogans, only shovels of earth, planks of wood, and sections of road slowly pieced together. Some carried messages, some moved materials, some kept watch at night, and some set up makeshift supply and aid stations along the route. Once this mutual aid transportation network was fully formed, the previously isolated and impoverished area was finally able to gradually attract people, goods, and life."

  GSK_indproj_282_land_facility:0 "Ground Fortifications"
 GSK_indproj_282_land_facility_desc:0 "Barracks, firing ranges, granaries, and training grounds will be organized and transformed from scattered open spaces into a true military preparedness zone. Wooden stakes are driven into the ground, talismans are affixed to fences, and transport vehicles and equipment move back and forth, gradually giving this land the appearance of “preparedness for war.”"

 GSK_indproj_1082_air_facility:0 "Sky Dome Airfield"
 GSK_indproj_1082_air_facility_desc:0 "New flight facilities will be built here. Runways will be leveled, control towers will be erected, and hangars and maintenance yards will be gradually completed. When the weathervane, lighting, and guiding barriers are all operational, this place will no longer be just a place to look up at the sky, but will become the true starting point for wings, machinery, and youkai power to take to the skies together."

 GSK_indproj_530_nuclear_facility:0 "Deep Nuclear Energy Complex"
 GSK_indproj_530_nuclear_facility_desc:0 "This construction will be quiet, yet destined to be arduous. Thick outer walls, enclosed passageways, layers of restricted areas, and core facilities will be gradually built, like sealing a scorching and dangerous force deep into the earth. When the reactor truly begins operation, this will become a silent yet undeniable complex, causing the entire region to revolve around its light and heat once more."


