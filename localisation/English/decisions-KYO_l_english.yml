  KYO_lunar_tactic_1:0 "Gap of Ten Thousand Armies"
 KYO_lunar_tactic_1_desc:0 "Yakumo's system merges the landing points, timing, and return routes of each army into a single boundary channel, allowing the vanguard to simultaneously penetrate the Moon.\n\n§YConsumption:§! Rifle 400\n§YEffect:§! X ← X + 14\n§YAfter use X:§![?KYO_lunar_preview_1|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_1:0 "§Y01§! §WGap of Ten Thousand Armies§!"


 KYO_lunar_tactic_2:0 "Night Parade Shatters the Gate"
 KYO_lunar_tactic_2_desc:0 "The oni acts as the spearhead of the siege, gathering superhuman strength under unified command to forcibly break open the gates of Lunar Capital, paving the way for the mixed army.\n\n§YConsumption:§! Rifle 700\n§YEffect:§! X ← X + 26\n§YAfter use X:§![?KYO_lunar_preview_2|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_2:0 "§Y02§! §WNight Parade Shatters the Gate§!"


 KYO_lunar_tactic_3:0 "Kappa Artillery Salvo"
 KYO_lunar_tactic_3_desc:0 "Kappa workshops publish firing tables, coordinates, and ammunition scheduling, allowing artillery scattered in various locations to unleash firepower on the same target.\n\n§YConsumption:§! Artillery 80 + Rifle 100\n§YEffect:§! X ← X + 20\n§YAfter use, X:§![?KYO_lunar_preview_3|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_3:0 "§Y03§! §WKappa Artillery Salvo§!"


 KYO_lunar_tactic_4:0 "Peerless Wind God"
 KYO_lunar_tactic_4_desc:0 "The tengu reconnaissance network shares wind direction, enemy location, and the Moon's terrain, allowing the Allied forces to gain advance knowledge of garrison movements and positional weaknesses.\n\n§YConsumption:§! Command Power 25\n§YEffect:§! X ← X + 8 + 2G\n§YAfter use X:§![?KYO_lunar_preview_4|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_4:0 "§Y04§! §WPeerless Wind God§!"


 KYO_lunar_tactic_5:0 "A Hundred Instruments Sound the Charge"
 KYO_lunar_tactic_5_desc:0 "Tsukumogami awaken vehicles and workshop machinery, organizing transport, repair, and assault forces into a high-speed mobile column.\n\n§YConsumption:§! Motorized Equipment 180\n§YEffect:§! X ← X + min(21, 6 + 3G)\n§YAfter use X:§![?KYO_lunar_preview_5|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_5:0 "§Y05§! §WA Hundred Instruments Sound the Charge§!"


 KYO_lunar_tactic_6:0 "Eirin Takes the Field"
 KYO_lunar_tactic_6_desc:0 "Eientei leveraged its longstanding prestige to persuade Lunar Capital's medical officers and technicians to defect, while simultaneously rotating wounded soldiers to preserve strength for the next offensive.\n\n§YConsumption:§! Support Equipment 100+ Political Power 15\n§YEffect:§! X ← X + 10; Next Round Initial X + 6\n§YAfter Use X:§![?KYO_lunar_preview_6|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_6:0 "§Y06§! §WEirin Takes the Field§!"


 KYO_lunar_tactic_7:0 "Roukanken and Hakurouken"
 KYO_lunar_tactic_7_desc:0 "Hakugyokurou records the fallen, gathers the lost souls, and escorts the wounded back to the front lines via safe passages.\n\n§YConsumption:§! Command Power 35\n§YEffect:§! X ← X + 12\n§YAfter use, X:§![?KYO_lunar_preview_7|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_7:0 "§Y07§! §WRoukanken and Hakurouken§!"


 KYO_lunar_tactic_8:0 "Fantasy Seal"
 KYO_lunar_tactic_8_desc:0 "The Hakurei Barrier fixes the retreat routes of humans, Youkai, and God at the same coordinates, making it impossible for the Lunar Capital spell to easily sever the allied forces.\n\n§YConsumption:§! Political Power 35\n§YEffect:§! X ← X + 6 + 4H\n§YAfter use, X:§![?KYO_lunar_preview_8|0]\n This tactic does not consume resources when holding a free token."

 KYO_lunar_slot_tactic_8:0 "§Y08§! §WFantasy Seal§!"


 KYO_lunar_tactic_9:0 "Dance of the Powerful Clans"

 KYO_lunar_tactic_9_desc:0 "Divine Spirit Mausoleum reorganized the allied forces' deployment using ancient military tactics, integrating the main attack, feint, and reserve forces into the same battle formation, rapidly expanding their existing advantage.\n\n§YConsumption:§! Army Experience 20\n§YEffect:§! X ← floor(1.15X) + 5\n§YAfter use, X:§![?KYO_lunar_preview_9|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_9:0 "§Y09§! §WDance of the Powerful Clans§!"


 KYO_lunar_tactic_10:0 "Grassroots Supply Network"
 KYO_lunar_tactic_10_desc:0 "Beast Path, Small Settlements, and Grassroots Youkai are linked together to form a transport line outside of military orders, delivering supplies to positions that are difficult to reach by regular supplies.\n\n§YConsumption:§! Motorized Equipment 120\n§YEffect:§! X ← X + 10; Next additional draw -15PP\n§YAfter use X:§![?KYO_lunar_preview_10|0]\n This tactic does not consume resources when holding a free token."

 KYO_lunar_slot_tactic_10:0 "§Y10§! §WGrassroots Supply Network§!"


 KYO_lunar_tactic_11:0 "Scarlet Mist over the Moon"
 KYO_lunar_tactic_11_desc:0 "Scarlet Devil Mansion expands the red fog across the entire war zone, blocking the moon rabbit's observation and firing range, providing cover for the Allied advance.\n\n§YConsumption:§! Command Power 50 + Aircraft Equipment 40\n§YEffect:§! X ← floor(1.25X)\n§YAfter use X:§![?KYO_lunar_preview_11|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_11:0 "§Y11§! §WScarlet Mist over the Moon§!"


 KYO_lunar_tactic_12:0 "Superhuman “Byakuren Hijiri”"
 KYO_lunar_tactic_12_desc:0 "Myouren Temple units jointly charged into the breach in the position; the vanguard broke through the enemy lines head-on, while the rearguard held the wounded and the entire army's retreat route.\n\n§YConsumption:§! Political Power 40 + Command Power 25\n§YEffect:§! If X < T: +ceil((T-X)/2) + 8; otherwise + 8\n§YAfter use, X:§![?KYO_lunar_preview_12|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_12:0 "§Y12§! §WSuperhuman “Byakuren Hijiri”§!"


 KYO_lunar_tactic_13:0 "Beasts of the Wicked Path"
 KYO_lunar_tactic_13_desc:0 "Animal Realm Legion reinforces the weakest point of the defense, expanding existing gains with ruthless and efficient assaults.\n\n§YConsumption:§! Political Power 45\n§YEffect:§! X ← floor(1.18X) + 8\n§YAfter use X:§![?KYO_lunar_preview_13|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_13:0 "§Y13§! §WBeasts of the Wicked Path§!"


 KYO_lunar_tactic_14:0 "Flowers, Birds, Wind, and Moon"
 KYO_lunar_tactic_14_desc:0 "Garden of the Sun transformed its youkai power into a sea of flowers covering the battlefield, and then concentrated its firepower according to the allied forces' timing to avoid affecting the vanguard.\n\n§YConsumption:§! Artillery 100 + Command Power 45\n§YEffect:§! X ← floor(1.30X) + 4\n§YAfter use X:§![?KYO_lunar_preview_14|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_14:0 "§Y14§! §WFlowers, Birds, Wind, and Moon§!"


 KYO_lunar_tactic_15:0 "The Strongest Fairies"
 KYO_lunar_tactic_15_desc:0 "The fairy army, relying on the Moon's natural regeneration, used continuous charges to contain the defending forces and fill every gap in the battle line.\n\n§YConsumption:§! Motorized Equipment 150 + Political Power 20\n§YEffect:§! X ← X + 5 + 5G\n§YAfter use, X:§![?KYO_lunar_preview_15|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_15:0 "§Y15§! §WThe Strongest Fairies§!"


 KYO_lunar_tactic_16:0 "Sea of Trees of Hourai — Phoenix Reborn"
 KYO_lunar_tactic_16_desc:0 "Hourai immortals take turns enduring fatal spells, wearing down the defenders with an unyielding frontal offensive, ultimately tearing apart Lunar Capital's formation.\n\n§YConsumption:§! Support Equipment 120 + Army Experience 30\n§YEffect:§! X ← max(X+8, floor((X+30)^2/100))\n§YAfter use, X:§![?KYO_lunar_preview_16|0]\n When holding a free token, this tactic does not consume resources."

 KYO_lunar_slot_tactic_16:0 "§Y16§! §WSea of Trees of Hourai — Phoenix Reborn§!"


 KYO_lunar_tactic_17:0 "Necro-Fantasia"
 KYO_lunar_tactic_17_desc:0 "The Yakumo Front simultaneously rewrites multiple boundaries, allowing forces from all sides to transcend distances, walls, and defenses, arriving at the decisive battle position at the same instant.\n\n§YConsumption:§! Political Power70＋Command Power60\n§YEffect:§! X ← max(X+8, floor((X/8)^2))\n§YAfter use, X:§![?KYO_lunar_preview_17|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_17:0 "§Y17§! §WNecro-Fantasia§!"


 KYO_lunar_tactic_18:0 "Reverse Hierarchy"
 KYO_lunar_tactic_18_desc:0 "The underdog's insubordination reverses the balance of power, while the rebels within Lunar Capital disrupt the imperial edict with their dissenting voices, turning their initial disadvantage into an opportunity to attack.\n\n§YConsumption:§! Army Experience 45\n§YEffect:§! If X < T: +floor(0.60(T-X)) + 10; otherwise +8\n§YAfter use, X:§![?KYO_lunar_preview_18|0]\n This tactic does not consume resources when holding a free order."

 KYO_lunar_slot_tactic_18:0 "§Y18§! §WReverse Hierarchy§!"


 KYO_lunar_tactic_19:0 "Super Ego"
 KYO_lunar_tactic_19_desc:0 "Palace of the Earth Spirits reconnaissance network simultaneously captures conscious hostility and unconscious blind spots, transforming traces of previous engagements into new battlefield intelligence.\n\n§YConsumption:§! Army Experience 30 + Political Power 20\n§YEffect:§! X ← X + max(6, floor(0.70A))\n§YAfter use, X:§![?KYO_lunar_preview_19|0]\n This tactic does not consume resources when holding a free order."

