 KYO_lunarian_controlled_major:0 "Lunar Capital's Rule"
 KYO_lunarian_controlled_major_desc:0 "The terrestrial regime acts under the orders of Lunar Capital; military, political, and public opinion must all submit to the so-called pure order."

 KYO_lunarian_control_idea_1:0 "Lunar Capital's Rule I"
 KYO_lunarian_control_idea_1_desc:0 "Lunar Capital's orders begin to suppress the terrestrial regime. Current Overall Penalty: §R5%§!."
 KYO_lunarian_control_idea_2:0 "Lunar Capital Reign II"
 KYO_lunarian_control_idea_2_desc:0 "Lunar Capital suffers its first defeat, and the control system begins to intensify conscription. Current Overall Penalty: §R10%§!."
 KYO_lunarian_control_idea_3:0 "Lunar Capital Reign III"
 KYO_lunarian_control_idea_3_desc:0 "Lunar Capital suffers continuous setbacks, and the surface military and political system bears a heavier price. Current Overall Penalty: §R20%§!."
 KYO_lunarian_control_idea_4:0 "Lunar Capital Reign IV"
 KYO_lunarian_control_idea_4_desc:0 "The Moon's defenses crumble, and the purification order is tearing apart surface nations. Current Overall Penalty: §R30%§!."
 KYO_lunarian_control_idea_5:0 "Lunar Capital's Rule V"
 KYO_lunarian_control_idea_5_desc:0 "Lunar Capital is on the verge of collapse; out-of-control conscription and repression have severely weakened the nation. Current total penalty: §R40%§!."
 KYO_lunarian_control_idea_6:0 "Lunar Capital's Rule VI"
 KYO_lunarian_control_idea_6_desc:0 "Lunar Capital's rule is collapsing; the surface control system has reached its most severe stage. Current total penalty: §R50%§!."

 KYO_lunarian_faction_lock:0 "By Imperial Decree"
 KYO_lunarian_faction_lock_desc:0 "The nation under this decree is forbidden from withdrawing from the purification front; any arbitrary actions are considered a form of defilement."

 KYO_lunarian_control_fractured:0 "Lunar Orders Severed"
 KYO_lunarian_control_fractured_desc:0 "The connection between Earth and the Moon has been severed; edicts from Lunar Capital no longer reach the entire land."

 KYO_lunarian_crossline_disrupted:0 "The Celestial Path Blocked"
 KYO_lunarian_crossline_disrupted_desc:0 "The Moon's defeat disrupts the Celestial Path, temporarily cutting off supplies and reinforcements for the surface armies."

 KYO_lunarian_defeat_pressure_1:0 "The Moon's Prestige Fades: Celestial Voices Distorted"
 KYO_lunarian_defeat_pressure_1_desc:0 "Lunar Capital suffers its first defeat; conflicting military orders begin to circulate on Earth."

 KYO_lunarian_defeat_pressure_2:0 "The Moon's Prestige Fades: Edicts Collapse"
 KYO_lunarian_defeat_pressure_2_desc:0 "Successive defeats shake the connection between the Moon and Earth; supplies, reinforcements, and morale all crumble."

 KYO_lunarian_defeat_pressure_3:0 "The Moon's Power Fades: The Mandate of Heaven Ends"
 KYO_lunarian_defeat_pressure_3_desc:0 "Lunar Capital can no longer dominate the land, and the controlled nations are gradually breaking free of the purification front."

 KYO_gensokyo_wartime_coalition:0 "A Hundred Youkai Unite to Defend Lunar Capital"
 KYO_gensokyo_wartime_coalition_desc:0 "The Three Committees of Hundred Youkai Accord put aside their differences and combined their forces, intelligence, and rescue efforts into a single battle."

 KYO_lunar_preemptive_strike:0 "Before the Full Moon"
 KYO_lunar_preemptive_strike_desc:0 "Taking advantage of Lunar Capital's inability to tighten its control over the surface, Gensokyo launched the first attack; for the next six months, the initiative on the battlefield remained with them."

 KYO_world_life_can_change:0 "The Living Still Have Tomorrow"
 KYO_world_life_can_change_desc:0 "Living is not about being forever sealed in today, but about still having the right to choose tomorrow."

 KYO_world_memory_remains:0 "The Deceased Remain Named"
 KYO_world_memory_remains_desc:0 "The deceased leave their names, the living carry on with their memories; farewell is therefore not forgetting."

 KYO_world_science_and_fantasy:0 "Sharing the Same Starry Sky"
 KYO_world_science_and_fantasy_desc:0 "Science no longer banishes fantasy, nor does fantasy fear the pursuit of knowledge; both will jointly understand this world."



 KYO_lunar_debug_category:0 "Moon War Test Tool"
 KYO_lunar_debug_category_desc:0 "Only displayed when the game is launched with -debug. Used for quickly checking countdowns, intrusion entry points, the GUI, and the display of wins for both sides; it will not appear in normal gameplay."
 KYO_lunar_debug_open_gui:0 "DEBUG: Enables and resets the Moon War panel"
 KYO_lunar_debug_open_gui_desc:0 "Without declaring war, directly unlocks the Moon War GUI, resets the win count for both sides, draws the first round of tactics, and grants four free commands. Suitable for purely checking the interface."
 KYO_lunar_debug_start_countdown:0 "DEBUG: Add a two-year countdown."
 KYO_lunar_debug_start_countdown_desc:0 "Initiate a 730-day Lunar Capital Invasion mission to test the natural expiration process."
