 KYO_lunar_debug_start_prewar_events_desc:0 "Set the invasion timer to 43 days and immediately execute a pre-war tick to test faction naming and six weekly events."
 KYO_lunar_debug_start_natural_invasion:0 "DEBUG: Immediately trigger a natural invasion."
 KYO_lunar_debug_start_natural_invasion_desc:0 "Immediately enter the normal invasion portal after the countdown ends, without granting the preemptive strike buff."
 KYO_lunar_debug_start_preemptive_invasion:0 "DEBUG: Immediately trigger a preemptive invasion."
 KYO_lunar_debug_start_preemptive_invasion_desc:0 "Immediately enter the player-manual war portal and grant a 180-day preemptive strike buff."
 KYO_lunar_debug_add_yukari_point:0 "DEBUG: Yukari Yakumo wins +1"
 KYO_lunar_debug_add_yukari_point_desc:0 "Updated the GUI for Yukari Yakumo wins, and simultaneously tested Lunar Capital faction's phased debuffs and controlled nation breakaways."
 KYO_lunar_debug_add_lunarian_point:0 "DEBUG: Lunar Capital wins +1"
 KYO_lunar_debug_add_lunarian_point_desc:0 "Only updated the GUI for Lunar Capital wins and battle report markers, without performing formal round settlements."

