 KYO_lunar_restore_eirin_and_kaguya:0 "Old friends return to Lunar Capital"
 KYO_lunar_restore_eirin_and_kaguya_desc:0 ""

 KYO_lunar_issue_reconstruction_edict:0 "The Edict of the New Lunar Capital"
 KYO_lunar_issue_reconstruction_edict_desc:0 "The Purification Institute is hereby abolished. Moon Rabbits and surface-born individuals gain equal residency rights. The Pure Ones shall no longer decide who is entitled to exist."

 KYO_lunar_define_common_sky:0 "A Covenant for a Shared Sky"
 KYO_lunar_define_common_sky_desc:0 "Life can change, departure still has meaning, and science and fantasy need not erase each other. Post-war Lunar Capital must accommodate these answers."

 KYO_lunar_return_home:0 "The Allied Forces Embark on Their Return Journey"
 KYO_lunar_return_home_desc:0 "Gap after gap opens on the lunar sea, sending survivors back to their respective homelands. Hundred Youkai Accord will also lay down its military orders and turn to repairing the world left by the war."

 KYO_lunar_science_and_fantasy:0 "Allowing the Unknown to Exist"
 KYO_lunar_science_and_fantasy_desc:0 "Observation can question the unknown, and barriers will reserve a place for the unknown. Science and fantasy no longer see each other as errors that must be eliminated."

 KYO_lunar_reconcile_merry:0 "Two Names, One Life"
 KYO_lunar_reconcile_merry_desc:0 "On the day she became Yukari Yakumo, Merry did not disappear. The maiden and the sage are not two people replacing each other, but rather two names for the same long life."

 KYO_lunar_same_starry_sky:0 "Under the same starry sky"
 KYO_lunar_same_starry_sky_desc:0 "Yukari adds the final coordinates to the ancient star map. She doesn't know if her former companions will see it, but she has finally written down the answer that is thousands of years overdue."

 KYO_lunar_route_epilogue:0 "The Last Page of the Journey"
 KYO_lunar_route_epilogue_desc:0 "The Surface Report, the Moon's Records, and the Secretly Sealed Manuscript are placed together. Yukari closes her folding fan and, for the first time, looks towards a tomorrow where she no longer needs to calculate for the war."

