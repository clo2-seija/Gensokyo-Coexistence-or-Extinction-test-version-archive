 shou_mission_one:0 "Shou's Trial: Shouldering the Myouren Temple"
 shou_mission_one_desc:0 "Byakuren has placed the heaviest responsibility on Shou's shoulders. If she truly wants to become the second-in-command of the Myouren Temple, she cannot simply be a protector; she must learn to shoulder the weight of morale, order, and the nation's functioning."

 shou_mission_two:0 "Shou's Test: The Pagoda and the Heart"
 shou_mission_two_desc:0 "Shou has already shared the burden with Byakuren, but she still must confront her most genuine weaknesses. The pagoda, responsibility, mistakes, and shame will all force her to answer during this time: Can she maintain order even in her vulnerability?"

 shou_mission_three:0 "Shou's Test: The Heart of a Tiger"
 shou_mission_three_desc:0 "As the nation gradually stabilizes, Byakuren also demands that Shou face a higher level of responsibility. She cannot forever remain a kind guardian; she must learn to become a force that deters chaos and calms storms when necessary."

 shou_mission_four:0 "Shou's Test: The Step After Master"
 shou_mission_four_desc:0 "As infrastructure gradually recovers, Myouren Temple finally has the resources to ask deeper questions: If Byakuren isn't around, is Shou capable of handling things independently? This isn't a test of ability, but a final confirmation of faith."

 nazrin_mission_one:0 "Nazrin's Test: Treasure and Truth"
 nazrin_mission_one_desc:0 "Nazrin's nose and rat swarms can already find anything of value in the ruins. But Byakuren wants her to find not just resources, but also the order and reality that can restore the nation's function."

 nazrin_mission_two:0 "Nazrin's Test: The Cold-Blooded Recycling"
 nazrin_mission_two_desc:0 "Some reconstruction must be done with the taste of iron and blood. If Nazrin is to reclaim assets for Myouren Temple, she must prove she can turn the most unforgiving and dirty work into the foundation for the nation's survival."

 nazrin_mission_two_part_2:0 "Nazrin's Test: Desserts and Fundraising"
 nazrin_mission_two_part_2_desc:0 "Not every resource has to be salvaged from ruins. Byakuren wants Nazrin to try a softer, more complicated method to bring the Myouren Temple's goodwill and funds into the community."

 nazrin_mission_three:0 "Nazrin's Test: Winning Hearts and Minds"
 nazrin_mission_three_desc:0 "As intelligence, assets, and informants gradually weave a network, Nazrin will no longer be just someone patching up the loopholes for the Myouren Temple. She must prove that she can become a true pillar maintaining the nation's underworld order."

 nazrin_mission_four:0 "Nazrin's Test: Staying by Shou's Side"
 nazrin_mission_four_desc:0 "Byakuren sees it clearly: Nazrin's ultimate goal is never just recognition of her abilities, but rather her willingness to finally acknowledge where her heart truly belongs. If she can reach this point, it means that the wary mouse has finally found a place to settle down."

 ichirin_mission_one:0 "Ichirin's Test: From Preaching to Building"
 ichirin_mission_one_desc:0 "Ichirin has learned to speak in front of people, but Byakuren wants her to go further. Ideals that cannot be implemented on construction sites, in warehouses, and on production lines will remain mere slogans. Now, she must turn scriptures into reality."

 ichirin_mission_two:0 "Ichirin's Test: Self-Discipline and Cultivation"
 ichirin_mission_two_desc:0 "Ichirin is not a flawless monk. Her doubts, hesitations, and vulnerabilities remain. Byakuren wants her to undergo a deeper training in the truly heavy reality: not feigning purity, but struggling while still keeping her back straight."

 ichirin_mission_two_part_2:0 "Ichirin's Test: Stepping into the Dust"
 ichirin_mission_two_part_2_desc:0 "What the people see is never the scriptures, but the people themselves. If Ichirin can continue to face all beings with her own unsavory life, she might become the most down-to-earth and understandable disciple of Myouren Temple."

 ichirin_mission_three:0 "Ichirin's Test: Planting Pure Land in the Ground"
 ichirin_mission_three_desc:0 "Fields, sunshine, farm tools, and sweat—these most basic things can also become part of spiritual cultivation. Byakuren wants Ichirin to prove that the Pure Land on earth is not a lofty illusion, but a world that can be built inch by inch."

 ichirin_mission_four:0 "Ichirin's Test: Stepping Out of Her Own Buddhist Practice"
 ichirin_mission_four_desc:0 "When Ichirin truly arrives here with questions, responsibilities, and the dust of the world, she will no longer just be a disciple behind Byakuren, but someone who can interpret and carry the Dharma in her own way."

 murasa_mission_one:0 "Minamitsu's Test: Sailing the Ship to the World"
 murasa_mission_one_desc:0 "Byakuren wants Minamitsu to do more than just rescue and suppression; she must take the Palanquin Ship to meet the nations of the world. A dangerous spirit must learn to use her ship and flag to proclaim mercy and peace for the Myouren Temple."

 murasa_mission_two:0 "Minamitsu's Test: Suppressing the Desire to Drown"
 murasa_mission_two_desc:0 "Minamitsu's greatest enemy is not the Outside World, but herself. If she wants to remain by Byakuren's side, she must learn to confront the instinct that drags her to the bottom, instead of letting it control everything."

 murasa_mission_two_part_2:0 "Minamitsu's Test: Falling into the Depths"
 murasa_mission_two_part_2_desc:0 "Sometimes, the old wounds and resentments of the spirit speak before reason. If Minamitsu fails on this path, she will be dragged back to the bottom by her darkest instincts, forcing Myouren Temple to face its cruelest problems."

 murasa_mission_three:0 "Minamitsu's Test: Helmsman"
 murasa_mission_three_desc:0 "No matter how many shadows remain in her heart, as long as she holds the helm, Minamitsu is Myouren Temple's most reliable captain. Byakuren hopes she will slowly hone that danger into a power capable of leading everyone through the storms."

 murasa_mission_four:0 "Minamitsu's Test: Unfinished Redemption"
 murasa_mission_four_desc:0 "Minamitsu's journey is far from over. Byakuren doesn't demand she immediately become a harmless good person, but only hopes she continues this long and arduous task, ensuring that coexistence is not just an empty wish."

 kyouko_mission_one:0 "Kyouko's Test: Sending Her Voice Further"
 kyouko_mission_one_desc:0 "Kyouko's voice shouldn't remain confined within the walls of Myouren Temple. Byakuren hopes she can extend this enthusiasm and positive feedback further, letting those in need know where to go and letting those who want to lend a hand know what they can do."

 kyouko_mission_two:0 "Kyouko's Test: The Qualification to Be Liked"
 kyouko_mission_two_desc:0 "Kyouko wants everyone to like her, and she also wants more people to come closer to Myouren Temple because of her. But true closeness doesn't just come from excitement; it also comes from whether she can place her kindness where others need it most at the right time."

 kyouko_mission_two_part_2:0 "Kyouko's Test: Learning to Be Quiet"
 kyouko_mission_two_part_2_desc:0 "Kyouko's voice isn't always a lifesaver. If she consistently fails to discern timing and context, even the most sincere words will become jarring noise. Byakuren wants her to learn when to speak and when to listen first."

 kyouko_mission_three:0 "Kyouko's Test: From Cheerleader to Disciple"
 kyouko_mission_three_desc:0 "Kyouko has already brought warmth to many, but she can't stop there forever. Byakuren wants her to go further: study scriptures, cultivate her mind, and take on responsibilities, allowing her to grow from a gentle, carefree child into a pillar of the new generation of Myouren Temple."

 kyouko_mission_four:0 "Kyouko's Test: Leaving Her Voice for Tomorrow"
 kyouko_mission_four_desc:0 "When Kyouko finally learns to combine passion, judgment, and spiritual practice, she will no longer just be the little Youkai saved by Byakuren, but someone who can continue to speak for humanity and Youkai, ensuring the continuation of the ideal of coexistence."

 decision_make_china_puppet:0 "Taking Over China with Compassion"
 decision_make_china_puppet_desc:0 "Byakuren knows that if peace is to truly spread further, the Myouren Temple alone is not enough. If China is willing to submit to this banner, then the Myouren Temple's order will, for the first time, truly extend beyond Gensokyo."

 decision_puppet_every_asia_country:0 "Taking Over China"
 decision_puppet_every_asia_country_desc:0 "Byakuren Hijiri does not view the nation as merely conquerable land, but as a group that can still be guided towards peace. If Asian nations are willing to accept the Myouren Temple's order, then this ship will sail to a wider sea."

 decision_puppet_every_democratic_country:0 "Inspiring Nations with Peace"
 decision_puppet_every_democratic_country_desc:0 "Some nations are more likely to understand Byakuren's path because they are at least still willing to acknowledge public opinion, negotiation, and that people are not only meant to trample on each other. Myouren Temple will reach out to these countries, spreading the ideals of coexistence to a wider world."



KYO_hijiri_world_revolution:0 "Buddhist Peaceful Revolution"
KYO_hijiri_world_revolution_desc:0 "Myouren Temple will no longer wait for the world to heal itself. We will missionary work, negotiation, pressure, forge alliances, and ultimately integrate those countries that accept the path to salvation."

KYO_hijiri_goodwill_mission:0 "Promoting Buddhist Goodwill to [FROM.GetName]"
KYO_hijiri_goodwill_mission_desc:0 "Sending large missions of monks, organizers, teachers, and rescue workers. Their work will enhance foreign goodwill towards us, making future attempts to establish puppet regimes more likely to succeed."

KYO_hijiri_attempt_peaceful_puppet_major:0"Promote Buddhist goodwill towards [FROM.GetName]"

KYO_hijiri_prepare_puppet_network:0 "Prepare a redemption network"
KYO_hijiri_prepare_puppet_network_desc:0 "Before another country can be brought into our sphere of influence, we must first establish channels of envoys, local liaisons, and a disciplined network of influence."

KYO_hijiri_attempt_peaceful_puppet:0 "Demand peaceful submission from [FROM.GetName]"
KYO_hijiri_attempt_peaceful_puppet_desc:0 "Attempt to transform the target into our puppet state. Higher favorability will increase the success rate. If there are too many puppet states that have not yet been integrated, other countries will become more difficult to control."

KYO_hijiri_integrate_puppet_stage_one:0 "Begin gradual integration of [FROM.GetName]"
KYO_hijiri_integrate_puppet_stage_one_desc:0 "Push the low-integration [FROM.GetName] into a deeper administrative relationship."

KYO_hijiri_integrate_puppet_stage_two:0 "Completed integration of [FROM.GetName]"
KYO_hijiri_integrate_puppet_stage_two_desc:0 "Completed the incremental integration process and absorbed the already integrated [FROM.GetName]. This will reduce some of the diplomatic fear caused by the puppet network."

KYO_hijiri_unlock_goodwill_decisions_tt:0 "Unlocks a Decision to increase foreign favorability towards §YGensokyo§!."
KYO_hijiri_prepare_puppets_tt:0 "Unlocks a Decision for preparations required before attempting puppetization."
KYO_hijiri_unlock_puppet_decisions_tt:0 "Unlocks a Decision for the peaceful puppetization of other countries. Success rate depends on favorability and the current puppet burden."
KYO_hijiri_unlock_integration_stage_1_tt:0 "Unlocks the first stage of puppet integration."
KYO_hijiri_unlock_integration_stage_2_tt:0 "Unlocks the final stage of puppet integration and annexation."
KYO_hijiri_unlock_anti_fascist_war_goal_tt:0 "After completing several puppetization operations, unlocks the anti-fascist war objective, National Focus."
KYO_hijiri_unlock_anti_communist_war_goal_tt:0 "After completing more puppetization operations, unlocks the anti-communist war objective, National Focus."
KYO_hijiri_puppet_success_tt:0 "The objective is to accept puppet status. The number of puppet states not yet integrated will increase, reducing the chances of future success."
KYO_hijiri_puppet_failed_tt:0 "The target resisted our pressure, and its goodwill towards us has decreased."
KYO_hijiri_integration_finished_tt:0 "This puppet state has been fully integrated. Future attempts at puppetization will bear less burden."

KYO_hijiri_buddhist_goodwill:0 "Buddhist Goodwill Mission"
KYO_hijiri_failed_puppet_pressure:0 "Resisting Political Pressure from the Myouren Temple"







    civil_war_overcharge_combat:0 "Doomsday Call"
    civil_war_overcharge_combat_desc:0 "All who breathe within our territory must be named; all who can lift stones, grasp blades, and carry provisions must not refuse. Women, children, and the elderly are all enlisted, like the last bricks of the city wall.\n We seek not retreat, but the end; until the bugle falls silent, the flag is broken, and the enemy and I return to dust."

    civil_war_buring_the_road:0 "Order to Burn the Roads"
    civil_war_buring_the_road_desc:0 "Behold, where we go, we leave neither ears of wheat nor wells; all that may be used by the enemy will first turn to ashes. The granaries will be emptied, the bridges broken, the fields burned, so that the pursuers will find no bread, the horses no grass.\n We set the roads ablaze, as if writing a curse upon the earth: Better this land be desolate for a time than let the enemy prolong its life with its harvest."

    civil_war_deadless_attack:0 "The Rush of Immortality"
    civil_war_deadless_attack_desc:0 "Behold, the people shout together and rush forward like a flood bursting its banks, asking neither of return nor of life or death. Those who hesitate will be utterly defeated, those who retreat will be disgraced; only those who press forward will trample fear underfoot.\n They smashed through enemy lines with their flesh and blood, their roars drowning out the cannon fire, until the enemy's ranks crumbled, or our army turned to dust."

    civil_war_twenty_four_work_time:0 "24-hour work system"
    civil_war_twenty_four_work_time_desc:0 "Day and night are no longer separated; sunlight and lamplight are one day. All who have hands to wield a hammer, all who have eyes to read a map, must work in shifts, without rest. The workshop doors are never closed, the furnace fires never extinguished, and the looms turn continuously like a heartbeat.\n Because the needs of war are like a thirsting famine, even a moment's rest is a luxury; we must exchange exhaustion for steel, darkness for ammunition, until the bugle calls cease, or until our bodies too return to dust."

    civil_war_brainwash:0 "Forced Brainwashing"
    civil_war_brainwash_desc:0 "Behold, let words be like iron chains on the hearts of all; let ears be sealed, mouths taught, and eyes see only one light. All who doubt will be called unclean, all who question will be called traitors.\n We will establish one voice, etch one memory, so that people forget their yesterday's selves and remember only today's commands; until all are of one mind and one tongue, there will be no more hesitation in war."

  civil_war_bad_youkai:0 "The Law for Restraining Youkai"
    civil_war_bad_youkai_desc:0 "Behold, those whose hearts are driven by lust and who boast of their blood will corrupt military discipline and scatter the hearts of the people. Therefore, this law is hereby established: Restrain the actions of those who plunder without permission, devour without cause, and slaughter in anger; all who desert their posts and disturb the people will be investigated.\n\n Remember this: swords can seize cities, but they cannot win hearts; if unleashed like wildfire, they will inevitably consume you. Only those who exercise restraint can form an army, only those who uphold the law can establish a nation, so that our people will not collapse due to their own rage."

  civil_war_battle_guide:0 "The Laws of the Battlefield"
    civil_war_battle_guide_desc:0 "Behold, even with swords drawn, laws must still be in hand. Therefore, let us establish rules for warfare, so that our troops may not kill indiscriminately out of anger, nor disturb the people out of greed; all those who arbitrarily slaughter surrendered or wounded, seize non-military supplies, or burn innocent dwellings shall be punished.\n\n Marches must be disciplined, defenses must be orderly, prisoners of war must be properly guarded, and spoils of war must be recorded. For an army without laws is like wildfire, burning away the enemy and itself; only those who uphold rules can unite the soldiers, keep the people's hearts from wavering, and ensure that war has boundaries to be maintained."

  civil_war_instant_repair:0 "Repair immediately"
    civil_war_instant_repair_desc:0 "Behold, bridges have broken across rivers, tracks are broken in the fields, and roads are full of rubble; if an army marches upon them, it will be slowed down, like sheep lost on their way. Therefore I issue this decree: Summon craftsmen, laborers, and porters, so that iron and wood may no longer be silent; let firelight illuminate the night, and let the sound of mallets serve as commands.\n\n All that has collapsed, let it be lifted; all that has cracked, let it be mended; all that has been burned, let it be rebuilt. Let supply routes be reopened, let the wheels of workshops turn again, and let our army not be defeated by its depletion."

  civil_war_martial_law:0 "Martial Law Order"
  civil_war_martial_law_desc:0 "Behold, war is imminent, and the city gates can no longer function as usual; therefore I hereby issue this decree of martial law, that all streets be guarded, and all entrances be checked. All who walk at night shall be questioned; all who gather in crowds shall be dispersed; all who spread rumors shall be investigated; all who disobey orders shall be punished.\n\n Granaries and workshops are for military use, roads and bridges are under military control; all entry and exit require documents, all travel is subject to bugle calls. For without strict orders, chaos will arise like worms in rotten wood, gnawing at the morale of the army; only by binding the people with laws and military discipline can the rear be kept in order, and the front lines be able to stand firm."

  civil_war_banned_art:0 "The Forbidden Art"
  civil_war_banned_art_desc:0 "Behold, under the red moon, the sealed gates are opened, ancient arts are unsealed once more; their names should not be uttered lightly, their forms should not be gazed upon for long. Demons will gather in darkness, dance with death; fire and sulfur will rain down, wails will fill the streets.\n\n Mortals are like grass, born in the morning and wither in the evening; once breath ceases, they return to dust. Destruction is imminent, judgment is at the door; know that all men must die, none can escape. What is done tonight will be a curse tomorrow, or a mark of the end times."

  civil_war_seija_last_chance:0 "The Upside-Down End Times"
    civil_war_seija_last_chance_desc:0 "Behold, a demon walks among mortals, constantly stirring up people to reject the old laws and despise the statutes; her mouth spews words of rebellion like fire igniting dry grass.\n\n She will lead people to destroy order, to break down doors and boundaries, so that kings will no longer be kings, and servants will no longer be servants; the superiors will be pulled down, and the inferiors will be pushed up; righteousness will be called evil, and evil will be called righteousness. The laws of the world will be overturned, the order of the sun and moon will be reversed, and everything will be revolutionized until dust rises and cities fall, and then people will know that the end times have come."

  civil_war_in_the_name_of_yukari:0 "In the Name of Yukari"
  civil_war_in_the_name_of_yukari_desc:0 "Behold, Yukari Yakumo walked the earth, and every word she spoke and every action she took was called the will of God; the boundaries she set were like commandments, and the arrangements she left behind were like prophecies. Though she is no longer before them, her name still shines above the darkness and the flames of war.\n\n The apostles Ran Yakumo and Chen did not look aside, but carried the name and went forth; they proclaimed the words of Yukari in the cities and the order of Yukari in the armies, that they might remember and follow it and not depart from it. All who doubt will be admonished, and all who turn away will be rebuked, for they say: This is not the way of man, but the way that Yukari has shown.\n\n Even if the world trembles, city walls crumble, and all things are overthrown, they still declare: even if heaven and earth change, this name cannot be abandoned; they would rather let flames engulf the earth than let “the will of Yukari” be fulfilled."














  the_civil_war_start_timer:0 "The Moment of Collapse"
  the_civil_war_start_timer_desc:0 "The Civil War Begins. This is not a storm to be watched from the sidelines, but a year of devastation: after the waters recede, silt will remain; after the fires extinguish, scorched earth will remain.\n\n No one can escape, for all roads are cut off; no one can survive, for time only deepens the wounds. Cities collapse, villages lie empty, youkai perish, and humans die.\n\n If there is any outcome, there is only the coldest common sense: there are no winners here, only survivors."

  the_civil_war_destory_all:0 "On the Brink of Collapse"
  the_civil_war_destory_all_desc:0 "Reaching the critical point, the dam is about to burst. The final piece of the puzzle that Lunar Capital sought has now been replaced. What follows is no longer war, but catastrophe: like a flood overflowing its banks, like a drought demon devouring the fields, like a plague sweeping across the land.\n\n The so-called “purification,” which sounds like salvation to mortals, appears on earth as dust covering cities and blood flowing into rivers. The moment the filth is washed away, many names will be washed away with it."

  the_civil_war_cheak_for_seija:0 "The Extinction of the Flame of Revolution"
  the_civil_war_cheak_for_seija_desc:0 "The flames that once illuminated the night road have finally been extinguished by the wind and snow. The clamor has stopped, the slogans have dissipated, and only ashes and unfinished grievances remain in the streets and alleys. The cruelest aspect of revolution lies not in its ignition, but in the survival after it is extinguished, facing the shattered tiles and the unclaimed costs."

  the_civil_war_cheak_for_remilia:0 "The End of Vampire Domination"
  the_civil_war_cheak_for_remilia_desc:0 "The scarlet banners finally fell to the ground, like lingering clouds in the twilight. The iron hooves that once swaggered down on the city have ceased, the court music has stopped, leaving only empty cups and empty seats.\n\n The end of domination is not romantic; it is more like the silence after a landslide: leaving behind trampled streets, torn subjects, and an era that can never return to “nobility”."

  the_civil_war_cheak_for_chen:0 "The Scattered Wishes of the Sages"
  the_civil_war_cheak_for_chen_desc:0 "The wishes of the sages were not a piece of paper, but a thin layer of ice bought with years of balance. Now the thin ice has cracked, and fragments are scattered across the water.\n\n Some pick up the fragments as amulets, some use them to gap throats, and some simply throw them into the mud. The dying wish wasn't denied, but shattered by reality: the more one tries to hold onto it, the more one's hands are cut and bleeding from the fragments."

  the_civil_war_cheak_for_hijiri:0 "The Sinking of the Ideal of Great Harmony"
  the_civil_war_cheak_for_hijiri_desc:0 "Great Harmony was once described as spring water, nourishing all things; but when war breaks out, even spring water is stained with blood. The ideal wasn't wrong, just too slow, too slow to catch up with famine, gunfire, and fear.\n\n When the temple bell still rings, but can no longer call back people's hearts, one understands that this is not a failure of debate, but the common truth in years of disaster: in dire straits, survival comes first, then compassion."

  the_civil_win_political_available:0 "Victors of the Youkai Civil War"
  the_civil_win_political_available_desc:0 "The victors stand on the ruins, their feet not on steps, but on rubble and scorched earth. Flags can still be raised, commands can still be conveyed, but every order carries aftershocks.\n\n Because this civil war had no true victory, only a post-disaster reckoning: how many cities were reduced to empty shells, how many ethnic groups lost their roots, how many names were written into the register of the missing. What the victors gained was a Gensokyo that must be repaired immediately, but can never be restored to its former state."

  





