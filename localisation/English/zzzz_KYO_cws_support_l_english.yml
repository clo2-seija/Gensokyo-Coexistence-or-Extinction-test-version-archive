 KYO_cws_target_magic_forest_proposal_desc:0 "Delineate the operational boundaries between the surface world and Animal Realm to prevent either side from taking advantage of the civil war to annex the other's strongholds."


KYO_cws_yakumo_campaign:0 "Yakumo's Remnants are Searching for Old Contracts"
KYO_cws_yakumo_campaign_desc:0 "Yakumo's Reorganized Government has unearthed several agreements stamped with purple seals from old archives. Ran and her bureaucrats are visiting local powers under the guise of “continuing order,” as if simply invoking Yukari Yakumo's legacy would force everyone to bow down to them again.\n\n Five days later, they will choose one seat to negotiate, increasing the target's favorability towards the Yakumo faction by 1, and will not continuously try to win over the same seat. When the favorability reaches 5, the neutral faction will join the Yakumo faction; if the target has already sided with another party, they will first be swayed to neutrality, forcing the four parties to vie for their support again."

KYO_cws_remilia_campaign:0 "Scarlet Devil Mansion is using protection to demand obedience."
KYO_cws_remilia_campaign_desc:0 "Scarlet Devil Mansion's emissaries, carrying weapons, provisions, and a promise of protection, have entered local strongholds. They claim that only the walls of vampires are enough to withstand the war, yet they remain silent about the conditions attached to every act of protection: loyalty to the Scarlet family.\n\n In 15 days, they will choose a position to influence, increasing the target's favorability towards the Scarlet Devil Mansion faction by 1, and will not target the same position repeatedly. When favorability reaches 5, neutral forces will submit to Scarlet Devil Mansion; if the target already belongs to a faction, they will be lured away from their original faction and become a target of contention again."

KYO_cws_hijiri_campaign:0 "Myouren Temple is turning relief into bargaining chips."
KYO_cws_hijiri_campaign_desc:0 "Myouren Temple monks are distributing food, medicine, and asylum slots along refugee routes. They call missionary work “appeasement” and registering supporters “relief needs.” Once people become accustomed to receiving everything from the temple, Byakuren can subtly transform gratitude into political allegiance.\n\n In 15 days, they will choose a seat to expand the relief network, increasing the target's favorability towards the Myouren Temple faction by 1, and will not continuously manage the same seat. When favorability reaches 5, neutral forces will join the Myouren Temple; if the target has already supported another side, they will be persuaded to return to neutrality, awaiting further negotiations from all sides."

KYO_cws_seija_campaign:0 "Gekokujou Front is inciting local discontent"
KYO_cws_seija_campaign_desc:0 "Seija's agitators are infiltrating workshops, villages, and military camps, dredging up unpaid wages, conscription, and old grievances. They promise to overthrow all oppressors, but never explain who will clean up the mess left behind after the old order collapses. Revolutionary slogans cost nothing, but the consequences are always borne by others.\n\n In 15 days, they will choose a seat to incite opposition, increasing the target's favorability towards the Gekokujou Front by 1, and they will not infiltrate the same seat consecutively. When favorability reaches 5, neutral forces will side with Seija; if the target already has a master, they will be incited to leave their original camp and become a target of contention again."




 KYO_cws_recover_scattered_legacy:0 "Reclaiming the lost owner's Yukari legacy"
 KYO_cws_recover_scattered_legacy_desc:0 "The original holder has been defeated. With at least 5 publicly supported seats, scattered legacies can be regrouped."
 


KYO_cws_support_village:0 "Human Village Self-Defense Mobilization"
KYO_cws_support_village_desc:0 "Keine Kamishirasawa reorganized the self-defense forces and guides in each district. Keine Kamishirasawa's assistance prevented conscription from becoming indiscriminate plundering and allowed the front lines to accurately obtain manpower and local intelligence.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_kappa:0 "Higan Wartime Decisiveness"
KYO_cws_support_kappa_desc:0 "Eiki Shiki established unified guidelines for casualties, prisoners of war, and military conscription, while Komachi Onozuka was responsible for recovering remains, delivering lists, and maintaining the Netherworld passage. Their intervention curbed atrocities on the front lines and made our orders more easily trusted by the locals.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_tengu:0 "Youkai Mountain Joint Supply Network"
KYO_cws_support_tengu_desc:0 "Megumu Iizunamaru oversees the logistics and intelligence of Youkai Mountain, Aya Shameimaru and Hatate Himekaidou traverse the front lines gathering air intelligence, and Nitori Kawashiro directs the workshops to produce and repair damaged equipment day and night. The speed of the tengu and the technology of the kappa thus create a support network covering the sky and mountain roads.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_eientei:0 "Eientei Field Medical Services"
KYO_cws_support_eientei_desc:0 "Eirin Yagokoro establishes standards for field medical treatment and medicine distribution, Reisen leads a medical team to the front lines, and Tewi Inaba uses the paths familiar to the youkai rabbits to transfer the wounded and supplies. Kaguya allows Eientei to open some of their concealed facilities, ensuring even the most critically wounded can receive shelter.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_hakugyokurou:0 "Netherworld Rear Support"
KYO_cws_support_hakugyokurou_desc:0 "Yuyuko Saigyouji receives and soothes the souls of the dead on the battlefield, while Youmu Konpaku leads the ghosts to patrol rear roads, escort supplies, and eliminate out-of-control vengeful spirits. Hakugyokurou's intervention prevents the dead from interfering with the living, allowing the front lines to focus on the still-living enemies.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_chireiden:0 "Underground Energy and Reconnaissance Network"
KYO_cws_support_chireiden_desc:0 "Satori Komeiji sifted reliable intelligence from the consciousness of prisoners and visitors, Rin Kaenbyou used Former Hell's secret passages to transport personnel, and Utsuho Reiuji maintained geothermal facilities and military energy supplies. The assistance of the Palace of the Earth Spirits enabled our forces to appear from unexpected directions.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_oni:0 "Former Capital Oni Assault Team"
KYO_cws_support_oni_desc:0 "Yuugi Hoshiguma personally reorganized the Oni warriors of Former Capital, while Suika Ibuki used banquets and old reputations to recall her scattered kin. They are not good at tedious planning, but they can carve a path for the entire army to advance on the strongest defenses.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_fairies:0 "Fairy reconnaissance and replenishment team"
KYO_cws_support_fairies_desc:0 "Cirno gathers fairies by the lake and in the forest. The three fairies of light are responsible for covert reconnaissance, while Clownpiece leads the most daring members to harass enemy rear. Although they lack discipline, their large numbers and rapid recovery make them capable of relaying orders, putting out fires, reconnaissance, and filling gaps in the battle line.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_tsukumogami:0 "Tsukumogami Supply Workshop"
KYO_cws_support_tsukumogami_desc:0 "Raiko Horikawa summons tsukumogami, materialized from abandoned artifacts. Benben Tsukumo and Yatsuhashi coordinate the workshop equipment using their spiritual power, while Kogasa Tatara repairs weapons and metal components. The machines they awaken can continue production, transportation, and self-maintenance even without operators.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_moriya:0 "Moriya Mobilization Network"
KYO_cws_support_moriya_desc:0 "Kanako Yasaka transformed the shrine's religious organization into a network of resources and manpower; Suwako Moriya was responsible for maintaining mountain paths, water sources, and ley line infrastructure; and Sanae Kochiya traveled between settlements to oversee relief and mobilization. This division of labor among the three Moriyas ensured that even remote areas could continuously respond to our call to arms.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_senkai:0 "Divine Spirit Mausoleum Military and Political Staff"
KYO_cws_support_senkai_desc:0 "Toyosatomimi no Miko listens to the demands of various regions and adjusts military and political plans; Mononobe no Futo is in charge of camps, transportation, and defense engineering; and Soga no Tojiko uses lightning to maintain emergency communications. The staff of the Divine Spirit Mausoleum ensures that frontline operations and rear administration no longer operate independently.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_support_magic_forest:0 "Animal Realm Beast Spirit Legion"
KYO_cws_support_magic_forest_desc:0 "Yachie Kicchou orchestrates the Kiketsu Family's infiltration network, Saki Kurokoma leads the Keiga Family in a high-speed assault, and Yuuma Toutetsu secures fuel and supplies for the legion. The three leaders remain wary of each other, but until their shared interests disappear, their beast spirits are enough to tear apart the enemy's flanks.\n\n§YOnly active while this faction openly supports our side.§!"

KYO_cws_yukari_legacy_holder:0 "Bearer of Yukari's Legacy"
KYO_cws_yukari_legacy_holder_desc:0 "Ran organizes the covenants, boundary passages, and secret supply lines Yukari left behind, while Chen travels across Gensokyo to reconnect with those still willing to answer the Yakumo family. They inherited not Yukari's power, but the old framework that once allowed countless factions to act together in a crisis."



KYO_cws_final_offensive_1:0 "Last Chance: Scattered Assistance"
KYO_cws_final_offensive_1_desc:0 "Only a handful of local figures are willing to risk themselves for us. They have scraped together some equipment, volunteers, and makeshift supplies. It is not much, but it may still provide the first spark needed to launch the final offensive."

KYO_cws_final_offensive_2:0 "Last Chance: Local Response"
KYO_cws_final_offensive_2_desc:0 "Several local leaders began coordinating warehouses, guides, and self-defense forces. Aid remained scattered, but was sufficient to sustain a short but fierce offensive."

KYO_cws_final_offensive_3:0 "Last Chance: Allies Gather"
KYO_cws_final_offensive_3_desc:0 "Supporters from different regions finally connected with each other. They sent personnel, weapons, and intelligence, and were willing to send their troops with us to join the offensive that would decide the course of the battle."

KYO_cws_final_offensive_4:0 "Last Chance for Victory: Cooperation from All Sides"
KYO_cws_final_offensive_4_desc:0 "Several influential figures have publicly joined our ranks. Workshops, temples, transport teams, and local armed forces have begun operating under the same plan, providing stable and continuous support for the general offensive."

KYO_cws_final_offensive_5:0 "Final Chance of Victory: The Trend Is Inevitable"
KYO_cws_final_offensive_5_desc:0 "Gensokyo Most key figures have concluded that we are the most likely to end the civil war. Equipment and volunteer troops are pouring into the front lines from all over the country, and the enemy's local relations are beginning to crumble under pressure."

KYO_cws_final_offensive_6:0 "Last Chance: Gensokyo's Choice"
KYO_cws_final_offensive_6_desc:0 "Leaders, artisans, monks, youkai, and ordinary residents from all over have staked their futures together. What is being launched now is no longer an attack by one faction, but a collective choice made by Gensokyo to end the civil war."

