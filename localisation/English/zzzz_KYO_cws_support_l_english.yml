 KYO_cws_focus_beast_reward_tt:0 "Animal Realm: 600 infantry equipment pieces, 80 trucks, 10 Army Experience points; 60-day Army Attack +5%, Army Speed +3%; Animal Realm's favorability towards us +1."
 KYO_cws_focus_kappa_reward_tt:0 "Kappa Workshop: 800 infantry equipment pieces, 150 support equipment pieces; Retains original 60-day Factory Output +50%, Production Efficiency growth +50%; Tengu and Kappa's combined favorability towards us +1."
 KYO_cws_focus_ghost_reward_tt:0 "Netherworld: 400 infantry equipment, 80 support equipment, 10 Army Experience; 60-day Organization Recovery +10%, Army Defense +5%; Hakugyokurou's favorability towards us +1."
 KYO_cws_focus_tengu_reward_tt:0 "Tengu: 80 basic aircraft, 12 transport aircraft, 10 Air Experience; 60-day Air Force Mission Efficiency +10%, Army Intelligence +10%; Tengu and Kappa's combined favorability towards us +1."
 KYO_cws_focus_fairy_reward_tt:0 "Fairy: 30, 000 manpower, 500 infantry equipment; Retains original 60-day Winter Loss -40%, Supply Consumption -10%, Speed/Defense +5%, Militia Attack and Defense +10%, River Crossing Penalty -20%; Fairy's favorability towards us +1."
 KYO_cws_focus_oni_reward_tt:0 "Oni: 700 infantry equipment pieces, 100 artillery pieces, 15 Command Power; retains the original 60-day land attack/defense +20%; Oni affinity towards us +1."
 KYO_cws_focus_eientei_reward_tt:0 "Eientei: 200 support equipment pieces, 50 trucks; 60-day experience loss -10%, supply consumption -5%, Organization recovery +5%; Eientei affinity towards us +1."
 KYO_cws_last_chance_reward_tt:0 "First, recalculate the publicly available support slots, then distribute them:\n0–2 slots: 500 infantry/100 support/30 trucks, 45 days, Tier 1 offensive;\n3–4 slots: 750/150/50, 60 days, Tier 2;\n5–7 slots: 1000/200/75, 60 days, Tier 3;\n8–9 slots: 1250/250/100, 75 days, Tier 4;\n10–11 slots: 1500/300/125, 75 days, Tier 5;\n12 slots: 2000/400/150, 90 days, Tier 6. The three numbers in represent infantry equipment, support equipment, and trucks, respectively."

 KYO_cws_debug_initialize_debug:0 "Fast forward to the eve of the Four-Way Civil War"
 KYO_cws_debug_initialize_debug_desc:0 "§RFor new test save only.§! Immediately annex the existing Japan, establish a medium pre-war power level, and trigger the Four-Way Civil War faction selection event. After selecting a faction, proceed at maximum speed; the other three factions will be established within 30 days, and automatically complete approximately 21 days later. §YThe war will never change.§! War officially begins and support decisions are enabled."



