l_english:

    KYO_civil_war_decision:0 "Belonging in the Flames of War"
KYO_civil_war_decision_desc:0 "Yukari The order left behind by Yakumo has crumbled in the flames of war. Gensokyo no longer has an arbiter who can force everyone to back down; this civil war is not just about land and military power, but about who is qualified to take over the world she left behind and decide under what order humans, youkai, and many other races will live from now on.\n\n Workshops, temples, villages, and local militias are still watching from all sides. They control manpower, supplies, intelligence, technology, and the hearts and minds of the people. Every organization that openly joins us will bring new strength to the front lines and convince more neutrals that we are indeed capable of ending the war and taking responsibility for Gensokyo's future.\n\n Providing aid, fulfilling promises, and responding to the demands of all parties can gradually gain their trust; the enemy will also negotiate and even preemptively seize allies that may have originally belonged to us. Even those who have chosen sides are not forever loyal. By exposing the enemy's breach of faith and shaking their convictions, there is a chance to force them back to neutrality.\n\n Never underestimate the choice of any local organization. A single side may not be enough to sway the course of a war, but when numerous small forces unite under the same banner, they can determine whether armies receive supplies, whether orders are disseminated, and whether the victor gains recognition throughout Gensokyo.\n\n The era of Yukari Yakumo is over. Whoever wins the most support before the war ends is most likely to become the new leader of the world after her."


