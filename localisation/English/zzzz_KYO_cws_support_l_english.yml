 KYO_cws_direct_court:0 "Increase the favorability of the selected faction"
 KYO_cws_direct_court_desc:0 "Directly increases the favorability of the currently selected faction towards us by §G+1§!."

 KYO_cws_direct_court_fast:0 "Focus on Negotiation: Quickly Increase Favorability"
 KYO_cws_direct_court_fast_desc:0 "Investing more political resources will directly increase the favorability of the currently chosen forces towards us by §G+2§!, with a maximum of no more than 5."
 KYO_cws_direct_request:0 "Requests public support from the chosen faction."
 KYO_cws_direct_request_desc:0 "After our favorability reaches 5, the current neutral forces will officially take sides; the favorability of the four parties will then be reset to zero."
 KYO_cws_direct_dislodge:0 "Causes the selected faction to withdraw from the enemy camp."
 KYO_cws_direct_dislodge_desc:0 "After our side's favorability reaches 5, the current faction withdraws from the enemy camp and returns to neutrality; the favorability of all four sides then resets to zero."


 KYO_cws_legacy_story:0 "Trace the Correspondence Yukari Yakumo Left Behind"
 KYO_cws_legacy_story_desc:0 "Yukari Yakumo, how did you get to where you are today?"

 KYO_cws_legacy_story_book:"Reading “The Song of the Beyond”"

 KYO_cws_legacy_story_final_option:0 "What she left behind was not a throne, but a set of responsibilities that must continue to function."
 KYO_cws_legacy_story_lost_event.t:0 "The clues have fallen into the hands of others."
 KYO_cws_legacy_story_lost_event.d:0 "As we traced the gap coordinates along the travel logs, another civil war faction had already pieced together the pass and taken over emergency dispatch authority. The remaining files became useless, and Yukari Yakumo's legacy temporarily found a new owner."
 KYO_cws_legacy_story_lost_event.a:0 "In this war, even the answers left behind by the dead are being contested."

 
 KYO_cws_direct_counter_yakumo:0 "Weakening the impact of Yakumo's government reorganization"
 KYO_cws_direct_counter_yakumo_desc:0 "Directly increases the favorability of the Yakumo Reorganization Government among the currently chosen factions.§R-1§!."
 KYO_cws_direct_counter_remilia:0 "Nerf the impact of Scarlet Devil Mansion"
 KYO_cws_direct_counter_remilia_desc:0 "Directly increases Scarlet Devil Mansion's favorability with the currently selected faction by §R-1§!."
 KYO_cws_direct_counter_hijiri:0 "Weakening the influence of Myouren Temple"
 KYO_cws_direct_counter_hijiri_desc:0 "Directly increases the Myouren Temple's favorability with the currently selected faction by §R-1§!."
 KYO_cws_direct_counter_seija:0 "Weakening the impact of the Seija front"
 KYO_cws_direct_counter_seija_desc:0 "Directly increases the Gekokujou Front's favorability with the currently selected faction by §R-1§!."
 KYO_cws_gui_village_player_favor_yakumo:0 "[?KYO_cws_village_yakumo_support|0]/5"
 KYO_cws_gui_village_player_favor_remilia:0 "[?KYO_cws_village_remilia_support|0]/5"
 KYO_cws_gui_village_player_favor_hijiri:0 "[?KYO_cws_village_hijiri_support|0]/5"
 KYO_cws_gui_village_player_favor_seija:0 "[?KYO_cws_village_seija_support|0]/5"
 KYO_cws_gui_village_player_favor_yakumo:0 "[?KYO_cws_village_yakumo_support|0]/5"
 KYO_cws_gui_village_player_favor_remilia:0 "[?KYO_cws_village_remilia_support|0]/5"
 KYO_cws_gui_village_player_favor_hijiri:0 "[?KYO_cws_village_hijiri_support|0]/5"
 KYO_cws_gui_village_player_favor_seija:0 "[?KYO_cws_village_seija_support|0]/5"
 KYO_cws_view_village_neutral:0 "Lessons continue at the temple school, but the self-defense force now keeps its weapons beside the door. The Human Village cares little whose banner is prettiest. It wants to know whether the next grain shipment will arrive, who will patrol after dark, and whether it will retain the right to defend itself when the war is over."
 KYO_cws_view_village_yakumo:0 "The Human Village handed its self-defence register to the Yakumo Reorganized Government. Not everyone longed for the old order, but Ran promised to restore transport and public safety while recognizing the village's own representatives and armed force. Faced with an unknown future, they chose a familiar system that could still be held to account."
 KYO_cws_view_village_remilia:0 "After Scarlet Devil Mansion's forces dispersed the raiders and reopened the supply lines, the villagers chose to accept their protection. Remilia promised to preserve the local militia and not turn the villagers into blood slaves or private soldiers; for those besieged by war, immediate security was more valuable than distant ideals. The grain carts from"
 KYO_cws_view_village_hijiri:0 "Myouren Temple arrived in the Human Village before the messengers, and the monks did not inquire which side the wounded had fought for. Byakuren promised to involve local representatives in postwar governance and to preserve the right to self-defense; the Human Village therefore believed that the coexistence she spoke of had at least begun with a bowl of hot rice."
 KYO_cws_view_village_seija:0 "The Gekokujou Front accepted the Human Village's conditions: its self-defence corps would remain intact, requisitions would require local consent, and ordinary people would receive seats in the postwar assembly. Those who had long been forced to wait while youkai decided their fate finally took up arms for a political standing of their own."

 KYO_cws_gui_kappa_player_favor_yakumo:0 "[?KYO_cws_kappa_yakumo_support|0]/5"
 KYO_cws_gui_kappa_player_favor_remilia:0 "[?KYO_cws_kappa_remilia_support|0]/5"
 KYO_cws_gui_kappa_player_favor_hijiri:0 "[?KYO_cws_kappa_hijiri_support|0]/5"
 KYO_cws_gui_kappa_player_favor_seija:0 "[?KYO_cws_kappa_seija_support|0]/5"
 KYO_cws_view_kappa_neutral:0 "Komachi's boat can no longer carry all the newly arrived souls, and Eiki's case files grow thicker by the day. Higan has no intention of endorsing any living ruler's ambitions. Whoever seeks its help must first guarantee that military orders will never interfere with judgment, and that the Sanzu River will not become a shortcut for troop movements or smuggling."
 KYO_cws_view_kappa_yakumo:0 "The Yakumo government reorganized and acknowledged that Higan's jurisdiction was not subject to wartime orders, and also returned several Netherworld passages that had been occupied by the military. Eiki therefore chose to support Ran—not for the Yakumo family's name, but because she was the most capable of redrawing the lines between the living, the dead, and the military."
 KYO_cws_view_kappa_remilia:0 "Scarlet Devil Mansion accepted Higan's proposed wartime laws, promising to treat prisoners of war and remains the same regardless of friend or foe. Eiki did not approve of the vampires' imperial ambitions, but believed that Remilia's strict order could most quickly stop indiscriminate killing and restore the dead to their rightful place and judgment."
 KYO_cws_view_kappa_hijiri:0 "Myouren Temple actively protected funerals, assisted in identifying the deceased, and acknowledged that mercy cannot replace judgment. Higan therefore joined Byakuren's side, hoping that her relief network could reduce unnecessary deaths and that postwar forgiveness would be based on responsibility rather than forgetting."
 KYO_cws_view_kappa_seija:0 "Seija turned over records of illegal requisitions and unauthorized execution grounds, and promised to end interference by the living in Higan's affairs. Eiki does not support a lawless revolution, but an opportunity to purge privilege—even if the old order falls, cause and consequence, judgment and sentence, must remain."

 KYO_cws_gui_tengu_player_favor_yakumo:0 "[?KYO_cws_tengu_yakumo_support|0]/5"
 KYO_cws_gui_tengu_player_favor_remilia:0 "[?KYO_cws_tengu_remilia_support|0]/5"
 KYO_cws_gui_tengu_player_favor_hijiri:0 "[?KYO_cws_tengu_hijiri_support|0]/5"
 KYO_cws_gui_tengu_player_favor_seija:0 "[?KYO_cws_tengu_seija_support|0]/5"
 KYO_cws_view_tengu_neutral:0 "Bunbunmaru Newspaper was busy calculating the odds of victory from all sides, Hatate's camera was fixed on the foot of the mountain, and Nitori locked the most important machinery in the warehouse. Youkai Mountain wouldn't gamble the sky, workshops, and news networks for a few promises; anyone who wanted support had to answer how much autonomy on the mountain was really worth."
 KYO_cws_view_tengu_yakumo:0 "The Yakumo government restored the old shipping routes and officially recognized Youkai Mountain's autonomy, press rights, and workshop ownership. Megumu Iizunamaru believed that Ran needed the mountain's capabilities but would not easily annex it; therefore, Tengu and Kappa chose to use intelligence and technology to help rebuild a familiar order."
 KYO_cws_view_tengu_remilia:0 "Scarlet Devil Mansion secured the mountain roads with the military and provided the kappa workshop with a stable supply of orders and raw materials. Remilia also promised not to take over the tengu newspaper, only requesting wartime intelligence cooperation; for Youkai Mountain, which hoped to preserve its industry and the skies, this was a dangerous but practical deal."
 KYO_cws_view_tengu_hijiri:0 "Myouren Temple agreed to let Youkai Mountain manage its workshops and newspapers independently, and to include its transportation network in the relief program instead of central requisition. Tengu needed an ally willing to listen, and Kappa needed customers who wouldn't take away its technology; therefore, both sides chose to jointly maintain Byakuren front."
 KYO_cws_view_tengu_seija:0 "Seija granted official representation to lower-ranking tengu, kappa technicians, and workshop apprentices, and promised to break the monopoly of a few elders over information and production. The reforms threatened the old class on the mountain, but for the first time, many residents felt that this war might change their position in Youkai Mountain."

 KYO_cws_gui_eientei_player_favor_yakumo:0 "[?KYO_cws_eientei_yakumo_support|0]/5"
 KYO_cws_gui_eientei_player_favor_remilia:0 "[?KYO_cws_eientei_remilia_support|0]/5"
 KYO_cws_gui_eientei_player_favor_hijiri:0 "[?KYO_cws_eientei_hijiri_support|0]/5"
 KYO_cws_gui_eientei_player_favor_seija:0 "[?KYO_cws_eientei_seija_support|0]/5"
 KYO_cws_view_eientei_neutral:0 "Eirin placed all wounded soldiers from all factions on the same medical chart and ordered Reisen to refuse entry to the medical corridor to those carrying weapons. Eientei could heal anyone, but did not wish to become a pharmacy for either side; whoever breached medical neutrality first would forever lose the path through the bamboo forest."
 KYO_cws_view_eientei_yakumo:0 "Ran promised to maintain medical neutrality, not to requisition medicines, and not to investigate enemy wounded treated by Eientei. Eirin chose to support the Yakumo government because it was best positioned to protect the Bamboo Forest Pass and maintain secrecy; this was a cooperation built on clear boundaries, not a repayment of old favors."
 KYO_cws_view_eientei_remilia:0 "Scarlet Devil Mansion deployed troops to guard the medical corridor and accepted Eirin's conditions: there would be no friend or foe at the sickbeds, and medicine would not be given priority to nobles. Eientei therefore sided with Remilia, hoping her power could stop the front line from advancing further into the bamboo forest."
 KYO_cws_view_eientei_hijiri:0 "Myouren Temple's relief team was willing to fully adhere to the medical standards set by Eirin and also proactively undertook the evacuation of the wounded and the resettlement of refugees. Eientei chose to join because Byakuren not only respected life but also possessed an organizational network that enabled medical aid to reach ordinary people."
 KYO_cws_view_eientei_seija:0 "Seija guaranteed that medicine would be allocated by severity of injury rather than status, and brought the moon rabbits long burdened with menial work into the management of logistics. Reisen and Tewi saw an opportunity to overturn the old hierarchy, while Eirin received guarantees of medical and research autonomy. Eientei therefore chose to support this revolution—on carefully defined terms."

 KYO_cws_gui_hakugyokurou_player_favor_yakumo:0 "[?KYO_cws_hakugyokurou_yakumo_support|0]/5"
 KYO_cws_gui_hakugyokurou_player_favor_remilia:0 "[?KYO_cws_hakugyokurou_remilia_support|0]/5"
 KYO_cws_gui_hakugyokurou_player_favor_hijiri:0 "[?KYO_cws_hakugyokurou_hijiri_support|0]/5"
 KYO_cws_gui_hakugyokurou_player_favor_seija:0 "[?KYO_cws_hakugyokurou_seija_support|0]/5"
 KYO_cws_view_hakugyokurou_neutral:0 "Regardless of which side wins, the dead will continue to arrive at Hakugyokurou. Yuyuko is in no hurry to place bets, while Youmu is busy sealing off the passages opened up by the artillery fire; Netherworld only hopes that the living will not bring the war to the Courtyard of the Dead, nor treat the dead as an inexhaustible source of soldiers."
 KYO_cws_view_hakugyokurou_yakumo:0 "Ran personally confirmed that Netherworld does not belong to the Yakumo government; the two sides are merely re-establishing the cooperative relationship from the time of Yukari and Yuyuko. Hakugyokurou therefore chose to help her stabilize the boundary between life and death—not to obey the Yakumo family heir, but to protect the world that an old friend had strived to maintain."
 KYO_cws_view_hakugyokurou_remilia:0 "Remilia acknowledges that Scarlet Devil Mansion's sovereignty ends at the entrance to Netherworld and sends troops to prevent any party from misappropriating the souls of the dead. Yuyuko is therefore willing to provide rear access and ghostly services; as long as the vampires respect the borders of the dead, Hakugyokurou will help her end the war of the living."
 KYO_cws_view_hakugyokurou_hijiri:0 "Byakuren promised to preserve the names and funerals of all those who died in battle, and not to force the souls of the dead to leave under the guise of rituals. Yuyuko agreed with her respect for death, and Youmu believed that the Myouren Temple could reduce the number of new vengeful spirits; Hakugyokurou therefore sided with the compassionate side."
 KYO_cws_view_hakugyokurou_seija:0 "Seija repealed the forced conscription of phantoms and the seizure of corpses, and promised that souls long subjected to unpaid labour could once again choose whether to stay or depart. Hakugyokurou does not endorse every revolutionary method she employs, but it will support a transformation that recognizes the dead as beings in their own right."

 KYO_cws_gui_chireiden_player_favor_yakumo:0 "[?KYO_cws_chireiden_yakumo_support|0]/5"
 KYO_cws_gui_chireiden_player_favor_remilia:0 "[?KYO_cws_chireiden_remilia_support|0]/5"
 KYO_cws_gui_chireiden_player_favor_hijiri:0 "[?KYO_cws_chireiden_hijiri_support|0]/5"
 KYO_cws_gui_chireiden_player_favor_seija:0 "[?KYO_cws_chireiden_seija_support|0]/5"
 KYO_cws_view_chireiden_neutral:0 "Satori Komeiji read in every surface envoy's mind the calculations omitted from their written agreements. The Palace of the Earth Spirits would rather keep its gates closed than exchange autonomy for temporary safety. Anyone who wishes to enter the Underworld should first prepare a promise that can withstand scrutiny—even when read directly from the heart."
 KYO_cws_view_chireiden_yakumo:0 "The Yakumo government reaffirmed the Underworld's autonomy and returned control of the Former Hell entrance to the Palace of the Earth Spirits. Once Satori read in Ran's heart that she had no intention of annexing the depths, she agreed to provide intelligence and energy. For the Palace, it is a choice to trade clearly defined boundaries for stable exchange."
 KYO_cws_view_chireiden_remilia:0 "Scarlet Devil Mansion acknowledges Former Hell as an allied territory and protects its entrance and surface trade routes with military force. Sensing Remilia's thirst for energy, yet also recognizing her willingness to abide by the agreed-upon terms of exchange, the Palace of the Earth Spirits accepts this cooperation bound by power and mutual benefit."
 KYO_cws_view_chireiden_hijiri:0 "Byakuren promised not to forcibly proselytize in the underground world, nor to discriminate against residents based on their mind-reading abilities, vengeful spirit origins, or Hell origins. The Palace of the Earth Spirits chose to support the Myouren Temple because she was willing to allow those who had long been rejected on the surface to enter the New Order in their own form."
 KYO_cws_view_chireiden_seija:0 "Seija promised that the people of the Underworld could choose their own representatives, and that surface powers would no longer make unilateral demands on their energy or passageways. Satori still sees danger in her plans—but also the first chance for Former Hell to become something more than a hinterland to be exploited. The Palace of the Earth Spirits has therefore joined the revolutionary front."

 KYO_cws_gui_oni_player_favor_yakumo:0 "[?KYO_cws_oni_yakumo_support|0]/5"
 KYO_cws_gui_oni_player_favor_remilia:0 "[?KYO_cws_oni_remilia_support|0]/5"
 KYO_cws_gui_oni_player_favor_hijiri:0 "[?KYO_cws_oni_hijiri_support|0]/5"
 KYO_cws_gui_oni_player_favor_seija:0 "[?KYO_cws_oni_seija_support|0]/5"
 KYO_cws_view_oni_neutral:0 "The oni invited the envoys from all directions to the same table, demanding that they state their conditions face-to-face, without consulting a draft or hiding anything in the small print. Whoever could drink, fight, and keep their word would be the one Former Capital would follow; all other rhetoric was merely decoration for cowards."
 KYO_cws_view_oni_yakumo:0 "Ran came to the Former Capital and laid every condition on the drinking table: no hidden clauses, no appeals to Yukari's name as grounds for obedience. She promised to preserve the oni's freedom of action and repay old debts of assistance. Yuugi respected that candour and decided to let the Former Capital's fists clear a path for her."
 KYO_cws_view_oni_remilia:0 "Remilia did not demand that the Oni kneel, but only invited them to join her in breaking through the strongest lines of defense, promising not to interfere with Former Capital after the victory. Yuugi admired her undisguised ambition and respected the strength to bear it; this alliance was built between the strong, not between ruler and subject."
 KYO_cws_view_oni_hijiri:0 "Byakuren came to the Former Capital in person and accepted its challenge, proving through strength and sincerity that compassion is not weakness. She asked neither that the oni give up drink nor that they repent—only that they protect the weak from being consumed by war. Yuugi chose to trust a monk willing to practise her convictions with her own two hands."
 KYO_cws_view_oni_seija:0 "Seija didn't hide behind slogans; instead, she personally stood on the most dangerous dueling ground in Former Capital, promising that the revolution wouldn't shackle the Oni Clan with new chains. She dared to challenge the strong and was willing to bear the consequences of failure; the Oni Clan therefore chose to follow this person who truly dared to overturn the table."

 KYO_cws_gui_fairies_player_favor_yakumo:0 "[?KYO_cws_fairies_yakumo_support|0]/5"
 KYO_cws_gui_fairies_player_favor_remilia:0 "[?KYO_cws_fairies_remilia_support|0]/5"
 KYO_cws_gui_fairies_player_favor_hijiri:0 "[?KYO_cws_fairies_hijiri_support|0]/5"
 KYO_cws_gui_fairies_player_favor_seija:0 "[?KYO_cws_fairies_seija_support|0]/5"
 KYO_cws_view_fairies_neutral:0 "Fairies do not debate constitutions or borders. They remember who fed them, who let them shelter indoors, and who sent them out to clear minefields. Winning their support is not difficult: treat them as living companions, not expendable things that happen to come back."
 KYO_cws_view_fairies_yakumo:0 "Ran acknowledges the fairies' contributions to the war and registers each team's supply, rest areas, and withdrawal rights. The Yakumo government no longer views them as an infinitely replenishable number; the fairies are therefore willing to once again protect the barrier that sustains the forests, lakes, and their own regeneration."
 KYO_cws_view_fairies_remilia:0 "Scarlet Devil Mansion offers open accommodations and a kitchen, and promises that the Fairy troops will not be sent on missions that will result in certain death. While the uniforms, food, and powerful castle are certainly tempting, what's more important is that Remilia is willing to treat them as soldiers of the Empire, not toys that can be replaced at any time."
 KYO_cws_view_fairies_hijiri:0 "Myouren Temple gives every fairy unit food, names, and a safe place to stay, while still allowing harmless mischief. The fairies' reason for choosing Byakuren is very simple: she remembers that they feel fear and hunger—and that they, too, are worth bringing home."
 KYO_cws_view_fairies_seija:0 "Seija allowed fairies to participate in the rally and publicly declared that the voices of the weakest were just as important as those of the wise. For them, who had always been measured by numbers, this revolution made them, for the first time, the ones who decided the future, rather than just expendable supplies to fill the front lines."

 KYO_cws_gui_tsukumogami_player_favor_yakumo:0 "[?KYO_cws_tsukumogami_yakumo_support|0]/5"
 KYO_cws_gui_tsukumogami_player_favor_remilia:0 "[?KYO_cws_tsukumogami_remilia_support|0]/5"
 KYO_cws_gui_tsukumogami_player_favor_hijiri:0 "[?KYO_cws_tsukumogami_hijiri_support|0]/5"
 KYO_cws_gui_tsukumogami_player_favor_seija:0 "[?KYO_cws_tsukumogami_seija_support|0]/5"
 KYO_cws_view_tsukumogami_neutral:0 "Raiko has the tsukumogami fall silent for the moment, to hear how the four sides planned to address them: property, military supplies, cultural heritage, or inhabitants with their own will. Using the wrong word could cause the entire workshop to leave on its own during the night."
 KYO_cws_view_tsukumogami_yakumo:0 "Ran agrees to register tsukumogami as a resident rather than property and promises to prohibit the confiscation of awakened artifacts during wartime. Raiko believes that the Yakumo government is capable of protecting the workshops and roads; having obtained legal status, tsukumogami is willing to use its technology to maintain this order of transition between the old and new."
 KYO_cws_view_tsukumogami_remilia:0 "Remilia promised not to add tsukumogami to her private collection and to entrust the Scarlet Devil Mansion workshop to their own management. Scarlet Devil Mansion cherishes ancient artifacts and is willing to pay the price for excellent craftsmanship; as long as this appreciation does not turn into possession, they are willing to awaken the machines for the Empire."
 KYO_cws_view_tsukumogami_hijiri:0 "Byakuren publicly recognizes that once an object awakens to spirit, it possesses a will of its own. She offers homeless tsukumogami sanctuary without making conversion a condition. They have chosen Myouren Temple in the hope that a world where anything may acquire a soul can truly make room for them."
 KYO_cws_view_tsukumogami_seija:0 "Seija abolished the old rule that classified tsukumogami as private property and promised that the workshops would be jointly managed by the workers and the tools. For them, who had been used, discarded, and forced to obey, the revolution finally offered an opportunity to reclaim their use from their owners."

 KYO_cws_gui_moriya_player_favor_yakumo:0 "[?KYO_cws_moriya_yakumo_support|0]/5"
 KYO_cws_gui_moriya_player_favor_remilia:0 "[?KYO_cws_moriya_remilia_support|0]/5"
 KYO_cws_gui_moriya_player_favor_hijiri:0 "[?KYO_cws_moriya_hijiri_support|0]/5"
 KYO_cws_gui_moriya_player_favor_seija:0 "[?KYO_cws_moriya_seija_support|0]/5"
 KYO_cws_view_moriya_neutral:0 "Kanako calculates how many projects each side can sustain. Suwako checks whether the front lines will scar the mountains and rivers. Sanae continues caring for refugees who have fled into the hills. Moriya Shrine will not gamble on abstractions: faith, public works, and the people themselves must all survive the war."
 KYO_cws_view_moriya_yakumo:0 "Ran recognized Moriya Shrine's religious autonomy and guaranteed that major projects would be decided jointly. Kanako believes the Yakumo government can restore order across the mountains, while Suwako accepts an arrangement that respects both the land and old covenants. Moriya has therefore chosen to aid a central government willing to negotiate."
 KYO_cws_view_moriya_remilia:0 "The Scarlet Devil Mansion offers protection, capital, and industrial contracts, while promising not to interfere with Moriya's rites or network of faith. Kanako sees an opportunity to turn wartime mobilization into lasting development. So long as both sides call one another allies, a god has no objection to sharing interests with a vampire."
 KYO_cws_view_moriya_hijiri:0 "Byakuren agreed to establish an interfaith council and allow Moriya to administer its own worshippers and facilities on the mountain. The two sides may compete for faith, but both see the value of cooperation in relief and reconstruction. Moriya has chosen to support a future in which coexistence does not require destroying one's rivals."
 KYO_cws_view_moriya_seija:0 "Seija promised to treat the faith organization as a local community, not an old authority awaiting dismantling, and to involve the mountain inhabitants in projects and resource allocation. Kanako accepted the risks of reform, as revolution could also break the central monopoly that had long restricted Moriya's development."

 KYO_cws_gui_senkai_player_favor_yakumo:0 "[?KYO_cws_senkai_yakumo_support|0]/5"
 KYO_cws_gui_senkai_player_favor_remilia:0 "[?KYO_cws_senkai_remilia_support|0]/5"
 KYO_cws_gui_senkai_player_favor_hijiri:0 "[?KYO_cws_senkai_hijiri_support|0]/5"
 KYO_cws_gui_senkai_player_favor_seija:0 "[?KYO_cws_senkai_seija_support|0]/5"
 KYO_cws_view_senkai_neutral:0 "Miko listened to the ten desires of the four messengers, but heard no complete post-war system from any of them. The Divine Spirit Mausoleum was not concerned with who made the most promises, but with who was willing to allow humans to truly participate in administrative, legislative, and religious affairs."
 KYO_cws_view_senkai_yakumo:0 "Ran agreed to allow human representatives to participate in the reorganized government and to delegate some administrative and judicial affairs to the humans themselves. Miko chose to support the Yakumo camp because it possessed the system needed to end the chaos and was finally willing to transform humans from the managed into co-governors."
 KYO_cws_view_senkai_remilia:0 "Remilia promises humans explicit citizenship, property rights, and seats in the administration rather than treating them merely as imperial subjects. Miko recognizes Scarlet Devil Mansion's ability to build a central authority; so long as the law does not value one species above another, the Divine Spirit Mausoleum will help her govern."
 KYO_cws_view_senkai_hijiri:0 "Byakuren accepts the coexistence of Buddhism and Taoism, and agrees that the Divine Spirit Mausoleum will administer part of humanity's civil affairs and education. Miko joins not because their doctrinal rivalry has ended, but because she believes both sides will build a world in which humans and youkai share in politics."
 KYO_cws_view_senkai_seija:0 "Seija agrees to convene a constitutional assembly where humans, youkai, and local organizations will decide the postwar system together. Miko now sees an administrative structure in her plans, not merely slogans of destruction; the Divine Spirit Mausoleum therefore offers its experience in statecraft to ensure that the revolution leaves behind a functioning country."

 KYO_cws_gui_magic_forest_player_favor_yakumo:0 "[?KYO_cws_magic_forest_yakumo_support|0]/5"
 KYO_cws_gui_magic_forest_player_favor_remilia:0 "[?KYO_cws_magic_forest_remilia_support|0]/5"
 KYO_cws_gui_magic_forest_player_favor_hijiri:0 "[?KYO_cws_magic_forest_hijiri_support|0]/5"
 KYO_cws_gui_magic_forest_player_favor_seija:0 "[?KYO_cws_magic_forest_seija_support|0]/5"
 KYO_cws_view_magic_forest_neutral:0 "Yachie weighs access routes against political leverage; Saki cares only which side is stronger, while Yuuma has already named her price for every possible outcome. The Animal Realm never supports a surface war for free. Only a faction that can preserve the balance among its three organizations—and leave enough profit for each—has earned the right to negotiate."
 KYO_cws_view_magic_forest_yakumo:0 "Ran guarantees that the passage to the Animal Realm will remain open and recognizes the Kiketsu Family, the Keiga Family, and the Gouyoku Alliance as equal negotiating partners. She understands the rules of the beast spirits' world and knows that balance is more valuable than conquest; the three organizations therefore offer military support in exchange for stable, long-term access to the surface."
 KYO_cws_view_magic_forest_remilia:0 "Scarlet Devil Mansion promises to share the spoils, open surface markets, and treat the beast-spirit legions as allies rather than mercenaries. Saki respects Remilia's strength, Yuuma approves of the terms, and Yachie receives a guarantee that the three-way balance will be preserved. Shared interests ultimately outweigh mutual suspicion."
 KYO_cws_view_magic_forest_hijiri:0 "Byakuren promises to prohibit the enslavement of beast spirits and provide the Animal Realm's residents with a lawful route to the surface. Its three organizations do not understand her compassion, but they do recognize the prospect of stable trade and freedom from old forms of exploitation. Once Myouren Temple proves it can protect the passage, they accept the arrangement."
 KYO_cws_view_magic_forest_seija:0 "Seija offers to break the surface powers' monopoly over passageways and resources and give all three Animal Realm organizations a direct share in the postwar settlement. Saki admires her nerve in challenging the strong, Yuuma scents a new opportunity, and Yachie secures clear rules. The beast spirits therefore see the revolution as their best chance to reshuffle the deck."
