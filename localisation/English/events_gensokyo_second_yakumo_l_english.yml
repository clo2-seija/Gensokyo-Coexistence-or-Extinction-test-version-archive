l_english:

yakumo.1.t:0 "Yakumo House"

 yakumo.1.d:0 "The rain fell from dusk until nightfall. Ran Yakumo sat at the low table, listing the food, medicine, and available vehicles one by one, and then drawing three evacuation routes on the map. “According to this plan, we can evacuate 162 people before dawn.” The door was suddenly pushed open.\n\n Chen ran into the room, soaking wet, her two tails still dripping water. “It's 173 people.”\n\n She spread a crumpled piece of paper on the table.\n\n There was no neat table on it, only eleven residents living at the foot of the mountain who had not yet been counted: a carpenter who did not want to abandon his old house, an elderly woman with mobility issues, several unregistered young Youkai, and a child with a persistent high fever. After reading it, Ran frowned. “These accommodations aren't in the original area. The wooden bridge leading there is also broken.”\n\n “So I went around to check,” Chen said, pointing to several ink lines on the paper. “There's a path behind the orchard. It's narrow, but I could get through.” “You crossed the flooded ravine alone?”\n\n Ran's voice turned cold. Chen shrank back but didn't take the paper back. “They really are there.”\n\n Ran was silent for a moment, then first pulled a dry cloth to wrap Chen's hair before crossing out all her previous calculations. “Sit still and repeat everything you saw along the way: slopes, puddles, and fallen trees.\n\n Don't omit anything.” Yukari remained seated at the other end of the table.\n\n She didn't rush Chen, only asking a few questions when Chen's explanations were unclear, and confirming the remaining dosage after Ran recalculated.\n\n Once their accounts finally aligned on the same map, Yukari spoke: “The convoy heading south will send two vehicles to deliver the medicine first, then pick up the people with mobility issues. Ran will be responsible for changing the route, along with White Wolf...” Tengu coordinated the escort along the way.\n\n She then looked at Chen: “You'll lead the way tomorrow morning.”\n\n Chen immediately straightened up, but Ran shook her head: “That ravine might collapse again.”\n\n “So let her take two guards with her,” Yukari said. “She knows the people there and knows which door she must knock on herself.”\n\n Just as Chen was about to be happy, Yukari added: “But she's not allowed to wade through the water alone again.\n\n You're included among those being brought back.” Nominally, Ran was Yukari's shikigami, and Chen was Ran's shikigami. At the Yakumo family's table, the orders weren't just passed down from top to bottom. Ran made sure there was a workable way for everything. Chen brought the ignored voice home, and Yukari, after listening to both sides, decided where the Yakumo family should go next.\n\n Ran wrote down the last number beside the new route. Chen, wrapped in a dry cloth, quietly huddled next to her tail for warmth. Yukari glanced at them and added the eleven to the rescue effort."

 yakumo.1.a:0 "First, bring those eleven people back."

 yakumo.2.t:0 "An unfamiliar star map on the edge of a folding fan"

 yakumo.2.d:0 "It should have been an evening like any other in the Yakumo household.\n\n Ran stood at the stove taking stock of the ingredients, then solemnly announced that there was still enough fried tofu for dinner. Chen collapsed over the table with a long, theatrical wail.\n\n “Yesterday was tofu soup! The day before was fried tofu! And last time we had a day off, we ate fried tofu too!”\n\n Ran corrected her. “The day before yesterday's was served with sweet sauce. Last time I added sanshō. They are not the same dish.”\n\n “They still taste like tofu!”\n\n Yukari sat to one side, half hiding her smile behind a folding fan as they argued. Chen insisted that they ought to have fish, while Ran began calculating how many different side dishes their remaining stores could support. Their voices crowded the little room—noisy, certainly, but warmer for it.\n\n Yukari was about to settle the question of dinner when a glimmer ran across the edge of her fan.\n\n In an instant, the stove, the furniture, and the bickering fell away. An unfamiliar starfield opened before her, scored with coordinates, times, and hair-fine lines of correction. Far away, two figures seemed to be seated at a table beside unfinished cups of tea. One chased with her pen the stars that the other pointed out.\n\n Yukari snapped the fan shut.\n\n Several gaps opened around the room at once. She examined the barrier, the garden, and every trace of youkai power nearby, but found no intruder. Ran immediately set down the ingredients in her hands; Chen sat bolt upright.\n\n “Lady Yukari, is someone interfering with this place?” Ran asked.\n\n “Not at present.”\n\n Yukari opened the fan again. It was as worn as ever. There was no starlight, no lattice of intersecting lines. Only her finger remained poised beside a star that did not exist, as though it had searched along that same bearing countless times before.\n\n “Maybe you just haven't been sleeping well lately,” Chen ventured.\n\n Ran plainly rejected that explanation and was already reaching for brush and paper to record every detail. Yukari slipped the fan into her sleeve before she could begin.\n\n “There is no need to investigate. Whoever left it behind did so a very long time ago.”\n\n She glanced at the tofu still waiting by the stove, then at Chen's hopeful face.\n\n “We will have fish tonight. The fried tofu may be a side dish.”\n\n Chen cheered at once. Ran was silent for a moment, then turned back to reorganize dinner.\n\n Before long, the room had recovered all its earlier commotion. Yukari did not open the old fan again, nor did she tell them that the unfamiliar stars had filled her with the aching fondness of something almost recovered from loss."

 yakumo.2.a:0 "Let that starry sky remain in the past."

yakumo.3.t:0 "Oath Before the Gods"

yakumo.3.d:0 "Reimi, dressed in ill-fitting red and white attire, walked alone before the Hakurei Shrine. A copper bell rang, and a voice, unrecognizable to anyone, drifted on the wind.\n\n “You were born human, yet raised by Youkai. If the two were to fight, which side would you take?”\n\n Reimi gripped her gohei tightly.\n\n “I will stand by those who are being harmed. If the Youkai who raised me harms the innocent, I will stop them; if humans persecute the Youkai out of fear, I will not remain silent.”\n\n “What if humans, the Youkai, and the Sages all demand your obedience?”\n\n “I will listen to them, but I will not leave my judgment to the strongest.” She replied, “If I am wrong, I am willing to accept correction; if they are wrong, even if I am the only one left, I will stand in front of them.”\n\n The shrine returned to silence. A moment later, the silent the Great Hakurei Barrier responded again, and the power left by the former shrine maiden flowed into Reimi's body through the gohei.\n\n The girl bowed before the god.\n\n “I, Reimi Hakurei, today inherit the name of Hakurei. I cannot guarantee I will always be right, but I swear I will not predetermine who should be abandoned because of anyone's status.”\n\n The copper bell rang again. The forty-fifth Hakurei shrine maiden was thus recognized by the divine spirit."

yakumo.3.a:0 "She swore an oath in her own name."

#  yakumo.4.t:0 "结界覆盖大地之日"
#  yakumo.4.d:0 "大幻想乡结界闭合时，十处曾经破裂的节点依次亮起。庆典的灯火从人间之里延伸到妖怪山，许多人以为漫长危机终于结束。\n\n紫却在结界外缘听见同一段月面脉冲。数个遥远首都的无线电、军令网与外交电文同时出现相同的停顿，仿佛整颗地球在同一秒抬头望月。结界保护了故乡，却也让月都确认必须公开出手。"
#  yakumo.4.a:0 "真正的战争才刚刚显形。"

 yakumo.5.t:0 "Two answers from this life and Higan"

 yakumo.5.d:0 "Eirin brought a stack of medical records. The people listed had all teetered on the brink of death; some eventually recovered, while others remained unconscious.\n\n “Severe injuries don't mean there's no hope,” she said. “Pain, fear, and medication can all affect judgment. As long as there's still a chance for improvement, doctors should stabilize the injuries and allow the patient to make a new decision after regaining consciousness.”\n\n Yuyuko brought letters left by the deceased. Some wanted their ashes returned to their hometowns, some refused to accept spells that would only prolong their suffering, and some never got to tell their families what they wanted to say.\n\n “Death is not something that can be hastily rushed, nor is it a failure that must be hidden,” Yuyuko said. “When treatment can no longer cure a person and can only prolong their final suffering, the person should know the truth. Whether to continue should not be decided for them by relatives who are afraid of saying goodbye.”\n\n Eirin was worried about giving up too early. She had seen wounded patients beg for an end while suffering from high fever and excruciating pain, only to be thankful a few days later that the doctors hadn't complied. A single, irreversible judgment can rob a future from which it was meant to exist.\n\n Yuyuko, however, is concerned with a different kind of harm. She has witnessed treatments that have long since lost their meaning, yet relatives still insist on continued procedures, simply because no one wants to acknowledge that separation has arrived.\n\n Patients are left in bed, never again having the chance to plan their final moments.\n\n Yukari asked, “So, when can treatment be stopped?” Eirin replied, “First, confirm that the condition is irreversible, then confirm that the patient is conscious and fully understands the consequences of their choice.\n\n Until then, I will continue treatment.” Yuyuko added, “If these conditions are confirmed, we should respect their decision. We can remain with them, ease their pain, and help them finish what they have left undone, but we cannot demand that they continue to suffer merely because we are afraid to lose them.”\n\n Their disagreement wasn't about the preciousness of life, but about how long they should persevere. Eirin preferred to try one more chance rather than let despair preemptively make a judgment; Yuyuko believed that when all possibilities were exhausted, accepting the end was also a form of respect for life.\n\n Yukari did not make an immediate decision. Gensokyo must decide whether to prioritize securing the remaining tomorrow and respecting the choices already made, or to let both answers become a dividing line between them."

 yakumo.5.a:0 "One should not abandon the living, nor decide the end for others."
 yakumo.5.b:0 "For now, let's adopt Eirin's plan."
 yakumo.5.c:0 "For now, let's adopt Yuyuko's plan."
 
 yakumo.6.t:0 "The Sage of the Moon and the Princess of the Earth"

 yakumo.6.d:0 "When Yukari arrived at Eientei, a Lunar Capital messenger dressed in white lay in the clinic.\n\n He was found on the east side of the bamboo forest. He carried no identification, only a tracking talisman, silver threads for binding, and a needle powerful enough to stop Youkai's soul from moving. When Reisen subdued him, he even tried to bite off the poison sac hidden behind his teeth.\n\n Eirin had just finished treating his wounds. She placed the bloodstained instruments on a tray and instructed the youkai rabbit to lock him in the inner courtyard, forbidding any interrogation until he regained consciousness.\n\n Yukari glanced at the silver thread on the table: “Lunar Capital sent people to pick you up?”\n\n Kaguya, sitting by the window, couldn't help but chuckle. “Lunar Capital never admitted we left, so why would they publicly invite us back?”\n\n Eirin wiped her hands clean and corrected her: “Our whereabouts are classified as top secret. There are no arrest warrants in the palace, and our names won't appear in any public documents.”\n\n “Because they can't admit it?” Yukari asked. “Because it's too ugly,” Kaguya answered for her. “After the civil war in Lunar Capital ended, the Great Sage left with the princess. If this gets out, everyone will start asking: What happened that made Lunar Capital's oldest Great Sage abandon everything she helped establish?”\n\n Yukari looked at Eirin again: “The Great Sage?” “Just a former position,” Eirin replied calmly.\n\n Kaguya didn't let her gloss over it: “Lunar Capital still uses the medical techniques, calendar, and construction standards she established. Those people can seal her name, but they can't dig her out of Lunar Capital's roots.”\n\n Eirin didn't refute, but simply laid out the items the messenger carried one by one. The tracking talisman locates the target, the silver thread is used for restraint, and the final needle leaves no visible scar.\n\n “The messengers who came to Earth in the past—some were there to monitor, some to try and forcibly take us back, and some who just wanted to confirm the secret without speaking,” she said. “They didn't carry official orders. Lunar Capital wouldn't leave orders for three non-existent people.”\n\n Yukari asked, “Why did you leave?”\n\n The clinic was silent for a moment. “After the civil war, there was no safe place for us in Lunar Capital,” Eirin said.\n\n Kaguya looked beyond the bamboo forest: “So before they decided our fate, we chose Earth.” Yukari glanced again at the unconscious messenger.\n\n “Lunar Capital has erased you from public records, yet they continue to send people to search for you.” “This is the most convenient.”\n\n Eirin put away the needle. “The Moon will continue to remain pure; all things that cannot be seen in the light will be handled on the ground.”"

 yakumo.6.a:0 "Three non-existent people are still being chased by Lunar Capital."

 yakumo.7.t:0 "Moon Rabbit Veteran and Earthbound Youkai Rabbits"

 yakumo.7.d:0 "Eientei's backyard training is once again thrown into chaos by the youkai rabbits. Reisen subconsciously shouts out the Moon army's formation command, but not a single rabbit around understands.\n\n Tewi Inaba, sitting on the wall, asked, “Are you angry, or are you envious of them?”\n\n “Envious.” Reisen watched the rabbits who had deserted and then returned laughing. “They don't know what that order meant.”\n\n She didn't continue talking about the First Lunar War, only saying that she had once believed that obedience would bring safety. It wasn't until she actually went to the battlefield that she saw how officers calculated casualties, and how Lunar Capital rewrote the memories of survivors into a great victory.\n\n Another rabbit jumped over the fence in the distance. Reisen saw it, but this time didn't blow the assembly whistle.\n\n “At least on the ground, they can decide for themselves when to come back.”"

 yakumo.7.a:0 "At least they can decide what to believe."

 yakumo.8.t:0 "Eientei's location in Gensokyo"

 yakumo.8.d:0 "The Bunbunmaru Newspaper put a question to the Human Village: what, exactly, is Eientei? A clinic, a refuge for lunar exiles, or another government hidden in the Bamboo Forest?\n\n Keine offered the most complete answer.\n\n “History does not disappear merely because its witnesses refuse to speak. The record around Eientei's arrival is riddled with gaps, but I know where they came from, and I know the Lunar Capital once sent agents into the forest,” she said. “They treat the people of Earth, yet retain the Lunar Capital's technology, order, and secrets. To see Eientei as nothing but a clinic is dangerously shallow.”\n\n Mokou's answer was considerably simpler.\n\n “A pack of Lunarians who treat the Bamboo Forest as their private garden. Take Eirin's medicine if you need it, but don't believe everything she says. And Kaguya—leave her name out of the article.”\n\n Mystia admitted that when something went wrong with a customer at her night stall, Eientei was usually where they were sent. Wriggle, meanwhile, complained that the moon rabbits' patrols regularly scattered the insect swarms and blocked familiar paths through the forest.\n\n Aya Shameimaru's final verdict was that Eientei could save lives, but also concealed a deeply troubling past. Gensokyo needed it; Gensokyo had not yet decided what to make of it."

 yakumo.8.a:0 "Beyond the clinic, there is a hidden history."

  yakumo.9.t:0 "The Lunar Capital Began as a Refuge"

 yakumo.9.d:0 "Yukari followed Eirin into the deepest chamber of Eientei. Behind the door, there was no medicine cabinet, only a wooden box sealed with several layers of seals. Eirin took out an ancient book with yellowed pages and a nearly torn spine.\n\n “The Chronicles of the Divine Spirit.” She placed the book under the lamp. “The last original copy in the world that hasn't been edited by Lunar Capital.”\n\n The book contained no praise for the Pure City. The original inhabitants of the Moon were not chosen ones, but a group of refugees fleeing war, disease, and the decline of faith; the so-called purity was merely a method to prevent disaster from entering their settlements.\n\n Eirin then took out a history of Lunar Capital. The same beginning had been rewritten, the names of the immigrants on Earth had been deleted, and the temporary regulations had become the eternal laws.\n\n “Every change has a reason.” Eirin held up two history books. “I want you to see how a shelter became Lunar Capital today.”"

 yakumo.9.a:0 "Let's finish telling the story of how Lunar Capital was removed."
 
 yakumo.10.t:0 "Netherworld"

 yakumo.10.d:0 "Yukari crossed the boundary between life and death and climbed the seemingly endless stone steps to Hakugyokurou. Countless phantoms lingered there before entering the cycle of reincarnation, waiting to relinquish their names, regrets, and final attachments.\n\n “This is neither Hell nor Higan.” Yuyuko Saigyouji opened her folding fan. “It is only a place for the dead to rest before continuing on their way.”\n\n She, too, had once been human, but death had taken every memory of how her life ended. Now she arranged the onward journey of every soul that reached the Netherworld, while never departing it herself.\n\n Yukari looked toward the enormous cherry tree deep in the garden, the one that had never fully bloomed. Yuyuko followed her gaze without losing her smile.\n\n “What lies beneath that tree?” Yukari asked.\n\n “If I knew, I would hardly let you ask so easily.”\n\n The ghost princess was still smiling. The past buried beneath the Saigyou Ayakashi did not answer with her."

 yakumo.10.a:0 "Those who leave this world should also have a place to return to."

 yakumo.11.t:0 "Chen, your mission"

 yakumo.11.d:0 "That night, Yukari and Ran summoned Chen to the deepest part of the Yakumo Mansion. There were no maps or unprocessed documents inside, only a silent boundary suspended in mid-air.\n\n Yukari reached out and took a faint ball of Yukari Light from the boundary, gently pressing it into Chen's chest.\n\n “If one day Ran and I do not return, this power will awaken.”\n\n Chen looked down at her hands: “Do you want me to continue fighting for you?”\n\n “No,” Yukari replied, “It's for you to shut down the out-of-control boundary, protect those who can still return home, and, when there is no way forward, personally forge a path.”\n\n Ran knelt down and straightened Chen's collar.\n\n “Inheriting power doesn't mean you have to become Lady Yukari, nor do you have to become me. Assess the danger first, then seek help; retreat if you can't win, go home if you're injured.\n\n Never sacrifice your life to prove loyalty.” Chen's ears drooped: “But if you're all gone, where is my home?”\n\n Ran didn't answer immediately.\n\n Yukari placed her hand on her head. “You once waited in the rain for someone who wouldn't come, so we can't let you go back there. The Yakumo residence is your home, and so are your friends. Light the lamps, eat well, take care of yourself, and open the door for the next lost child—that's your mission.”\n\n Yukari didn't ask Chen to uphold the Yakumo family name, nor did she order her to sacrifice herself for anyone. Her last command to Chen was simply to survive.\n\n Chen wiped away her tears and nodded firmly.\n\n “I will guard the way home. And I will keep the light burning.”"

 yakumo.11.a:0 "Even if we are not here, we must live well."

  yakumo.12.t:0 "Staying was not because of orders"

 yakumo.12.d:0 "Ran presented Yukari with the dangerous relocation plan and wrote her name in the executor column. Yukari reviewed the calculations but didn't approve, simply crossing out the name with her folding fan.\n\n “This is the plan with the highest success rate,” Ran said.\n\n “Being able to take responsibility doesn't mean you have to die.”\n\n These words reminded Ran of their first encounter.\n\n Back then, she wasn't Ran Yakumo, but a nine-tailed fox searching for a way to survive among the various factions in the Animal Realm. The paths in the Animal Realm were controlled by different organizations; goods, intelligence, and even the dead had to surrender their interests to pass through. Ran didn't want to be subservient to them forever, so she spent months measuring the boundaries, preparing to secretly open a smuggling route connecting to the surface.\n\n The moment the passage opened, all coordinates simultaneously became invalid. Yukari sat on the other side of the exit, the first batch of goods Ran had prepared to transport lying at her feet.\n\n “You calculated it well,” Yukari said, “but you treated Gensokyo as a no-man's-land.”\n\n Ran knew she had failed. She didn't beg for mercy, but calmly explained the route, its purpose, and the people involved, trying to prove that staying alive was more valuable than being killed.\n\n Yukari only asked, “Why open this path?”\n\n “Because in the Animal Realm, there are no paths that don't belong to the strong,” Ran replied. “If you don't want to be swallowed up by any party, you must have your own exit.”\n\n Yukari told her that she was building Gensokyo. There, they would shelter the youkai, divine spirits, and otherworldly beings rejected by reality, without questioning their strength or allowing any power to treat the weak as property. Such a place required a barrier, and someone to calculate the paths, resources, and countless possible errors. After listening, Ran said, “It will collapse sooner or later.”\n\n “Then stay,” Yukari said, looking at her.\n\n “Calculate why it will collapse, and then prevent that day from coming.”\n\n Yukari didn't command her to become a shikigami, nor did she block the path back to the Animal Realm. That night, Ran recalculated all the results. By dawn, she was still standing in the same place.\n\n Years later, Yukari once again gave her the choice.\n\n “You stayed in the first place not because you obeyed me,” Yukari said. “So today, there's no need to prove your loyalty with death.”\n\n Ran looked at the crossed-out name, remained silent for a moment, and retrieved the plan.\n\n “Understood. I will prepare the second method.”"

 yakumo.12.a:0 "Being able to bear it does not mean that one must die."

 yakumo.13.t:0 "Fake prescription under the moonlight"

 yakumo.13.d:0 "Overnight, the street corners of Gensokyo were plastered with special editions of the Bunbunmaru Newspaper. They alleged that Eientei was testing drugs on wounded soldiers from different factions, and even printed a list of subjects bearing the seal of a moon-rabbit medical officer.\n\n Yuyuko arrived at Eientei with a copy and immediately asked, “If I volunteer, will refreshments be served during the trial?”\n\n Eirin did not answer. One glance was enough for her to note that the dosages used Lunar military units two centuries out of date, that three patients' signatures came from old prisoner-of-war records, and that one subject's recorded date of death preceded their date of birth.\n\n Yukari held the paper before a lamp. Several large, reversed characters slowly appeared through the sheet: Bunbunmaru Newspaper — Spring Flower-Viewing Special. Evidently, the forger had saved paper by printing the evidence on unsold back issues.\n\n A shutter clicked in the rafters.\n\n Aya Shameimaru poked her head down from the roof and insisted that this was no false report, but a “journalistic exercise” intended to test Eientei's public credibility. The readers' spirited discussion, she added, proved that the story possessed public value.\n\n “A correction on tomorrow's front page,” Yukari said.\n\n “In type the same size as the original headline,” Eirin added.\n\n Yuyuko opened her fan. “And it must state that refreshments are not provided during drug trials. We mustn't mislead the readers any further.”\n\n A scandal that might have destroyed the relief partnership ended instead with Aya devoting the front page to an apology to Eientei for seven consecutive days. The only true casualty was the Bunbunmaru Newspaper's stock of printing paper."

 yakumo.13.a:0 "Next time you forge evidence, remember not to use your own old newspapers."
 yakumo.13.b:0 "That stinking tengu."


 yakumo.14.t:0 "Non-existent Summoning Command"

 yakumo.14.d:0 "Less than three days after the prescription controversy ended, another extra edition of “Bunbunmaru Newspaper” appeared in front of Eientei's door. This time, the newspaper claimed that Hakugyokurou was detaining the fallen soldiers of the Moon War and forcing their families to accept Netherworld rule in exchange for the return of their souls.\n\n Youmu examined the so-called summoning order and found that Hakugyokurou's seal was upside down, the date used the Lunar Capital calendar, and even the document format was copied directly from Eientei's prescription.\n\n Yuyuko reviewed the records of the deceased and quickly found a more direct flaw. “This detained Moon Rabbit seems to be still alive.” Everyone looked at Reisen. Reisen took the newspaper and confirmed that it was indeed her military ID number.\n\n “I don't remember when I died.”\n\n Yukari flipped the paper over again. This time, it revealed the subscription price list for “Bunbunmaru Newspaper.”\n\n Aya Shameimaru, invited inside, argued vehemently, “The last article questioned Eientei, so this one should question Hakugyokurou. Writing from both sides is what makes journalism fair.”\n\n “Spreading rumors from both sides won't make you fair,” Yukari replied.\n\n Yuyuko wasn't angry, but suggested that Aya personally go to Hakugyokurou to verify the whereabouts of each deceased person. Youmu then brought out twelve boxes of records, neatly placing them in front of the reporter.\n\n Staring at the pile of documents taller than herself, Aya finally admitted that the interview might not have been adequately prepared.\n\n For the next month, *Bunbunmaru Newspaper* never published another report about Hakugyokurou detaining the deceased. It is said that Aya Shameimaru only checked the third box before beginning to seriously consider journalistic ethics."

 yakumo.14.a:0 "Offending both sides at the same time is hardly considered impartial."
 yakumo.14.b:0 "You silly tengu."


 yakumo.15.t:0 "A Youkai's Human Child"

 yakumo.15.d:0 "Fifteen years ago, an elderly umbrella spirit found a human baby in an abandoned post station. She was wrapped in a soaked cloth, her cries barely audible. There were no parents nearby, and no one came looking for her.\n\n The umbrella spirit, not knowing how to care for a human, could only take her back to the Youkai settlement. Beast spirits searched for goat's milk, herbal spirits brewed medicine for her, and several smaller spirits took turns guarding the cradle, fearing this fragile life wouldn't survive the night.\n\n Some advocated sending the child back to humans, while others worried that humans would use this as an excuse to attack the settlement. But after each debate, a Youkai would still cover her with a blanket. Over time, no one mentioned sending her away anymore.\n\n An old Youkai who could read named her Reimi, hoping that this child's future wouldn't be determined by her birth. When she learned to speak, the first words she uttered weren't “father” or “mother,” but rather the strange yet affectionate names used by the villagers.\n\n Yukari had seen her while inspecting the barrier. Young Reimi was lying in the arms of an umbrella spirit, reaching out to grab the ear of a beast spirit. At that time, the Hakurei Shrine still had shrine maidens, and Gensokyo didn't need another successor.\n\n Yukari didn't take her away, but simply added another barrier around the village to protect it from wild beasts.\n\n This human child should have her own life first, instead of being written into some kind of plan by the sage before she even learned to walk."

 yakumo.15.a:0 "Before she became a shrine maiden, she was a child raised by youkai."


 yakumo.16.t:0 "Her understanding of friends"

 yakumo.16.d:0 "Reimi grew up amidst suspicion between humans and Youkai. When she entered the human community, some called her a child bewitched by Youkai; after returning to the settlement, some young Youkai suspected she would eventually side with humans.\n\n She had no power to prove anything. In disputes, she couldn't seize weapons, nor could she stop those who were truly enraged. All she could do was bandage the wounded, take away the hiding children, and repeatedly tell both sides that the people before her were not the same as the rumors about the entire race.\n\n Once, a human patrol mistook a beast-youkai transport team for attackers. After the gunshots rang out, a young Youkai tackled a lone soldier, preparing to avenge his wounded comrade. Reimi rushed between the two, but was easily pushed to the ground.\n\n She didn't ask the Youkai to spare the soldier out of human kindness, nor did she defend the human who fired the first shot.\n\n “He shot and injured someone, so he must be held accountable,” she said, pointing to the patrol team and then turning to Youkai, who was pinning down a soldier. “But he's unarmed now. If you make a move, you'll be the one hurting others.”\n\n Reimi couldn't force anyone to obey. She could only kneel beside the wounded, refusing to give way. In the end, both sides laid down their weapons, not out of fear of her, but because neither wanted to be the first to push this powerless child towards the gun.\n\n From then on, Reimi gradually understood: friends aren't always right. To truly consider someone a friend means not remaining silent when they harm innocent people; prevention, treatment, and accountability can happen simultaneously.\n\n She didn't end the conflict between humans and youkai, but she had become accustomed to standing where the conflict first arrived."

 yakumo.16.a:0 "When friends make mistakes, someone must stop them."


 yakumo.17.t:0 "Yukari's perspective"

 yakumo.17.d:0 "After the death of the 44th Hakurei Shrine Maiden, Yukari returned to the settlement hidden behind the abandoned post station. Fifteen-year-old Reimi was repairing the umbrella ribs for the old umbrella spirit.\n\n Ran didn't agree with Yukari's choice. Reimi hadn't received systematic spiritual training, nor had she ever handled a real incident alone. Letting her inherit the Hakurei name was far too dangerous, no matter how you calculated it.\n\n “What I value isn't how much power she possesses now,” Yukari said, “but whether she can still judge who is harming whom when the power is unequal.”\n\n “Kindness alone isn't enough to maintain the Great Hakurei Barrier,” Ran replied.\n\n “So she still needs to learn.”\n\n Chen, after listening to the two great Youkai's discussion, couldn't help but interject, “Why don't you ask Reimi if she's willing first?”\n\n Yukari paused for a moment, put away the prepared appointment document, and personally entered the settlement.\n\n Reimi didn't immediately agree after learning the purpose of the visit.\n\n She only asked Yukari whether the Hakurei Shrine Maiden was protecting humans or managing Youkai. “Neither,” Yukari replied. “She wants to prevent either side from crossing the insurmountable boundary.\n\n Sometimes the opponent is Youkai, sometimes humans, and sometimes even sages.”\n\n Reimi looked at her hands, which even young beast youkai couldn't subdue. “If power only allows me to help one side defeat the other, I don't want it.”\n\n “What if it could stop both sides first?”\n\n Reimi didn't make a decision. Yukari didn't urge her, only inviting her to see the last person who could truly explain the duties of the Hakurei.\n\n The appointment document remained blank. Because Yukari could choose the candidates, but couldn't decide Reimi's life for her."

 yakumo.17.a:0 "Before making a choice, she must know what she will inherit."


 yakumo.18.t:0 "The Red and White Robe"

 yakumo.18.d:0 "Yukari, carrying the broken gohei left by Reimi and the previous one at the shrine, crossed the boundary between life and death and met the forty-fourth Hakurei shrine maiden in Hakugyokurou, who had not yet gone to reincarnation.\n\n She wasn't like the legendary hero, just a weary young woman.\n\n The former shrine maiden asked Reimi, “Do you think the Hakurei shrine maiden should protect humans from the Youkai?”\n\n Reimi shook her head: “She should protect those who are being harmed.”\n\n “What if the Youkai who are hurting you are your family?”\n\n Reimi remained silent for a long time.\n\n “I will stop them. After it's all over, I'll face the consequences with them.”\n\n The former shrine maiden finally smiled.\n\n She told Reimi that the name Hakurei wouldn't make everyone trust her. Humans would accuse her of favoring Youkai, and Youkai would hate her for protecting humanity; the sages needed her to stabilize the barrier, but might see her as an obstacle if she refused orders.\n\n The shrine maiden must maintain the Great Hakurei Barrier, handle incidents, and stop those who overstep their boundaries. She can heed the sages' advice, but she doesn't belong to the Yakumo family; she was born human, but that doesn't prejudge humanity as innocent.\n\n Reimi asked, “Do you regret becoming a shrine maiden?”\n\n “I've regretted it many times,” the former shrine maiden answered frankly, “but if no one stands in the middle, in the end only the strongest will be qualified to say what is right.”\n\n She imbued the remaining spiritual power into the gohei brought by Yukari.\n\n “The red and white attire is not a reward. Wearing it means that even if both sides demand you make way, you must still stand there. Now, are you still willing to inherit it?”\n\n Reimi grasped the gohei, truly understanding for the first time why the Hakurei shrine maiden always faced incidents alone.\n\n “I am willing. But I will do it my own way.”"

 yakumo.18.a:0 "What she inherited was not obedience, but the power to judge and stop."


 yakumo.19.t:0 "The shrine maiden of the fantasy paradise"

 yakumo.19.d:0 "The Hakurei Shrine's torii had only just been set upright again, and broken timbers still lay beside the stone steps. Humans, youkai, and delegates from every faction gathered at the foot of the hill to await Gensokyo's new gatekeeper.\n\n Fifteen-year-old Reimi climbed the steps alone. Her red-and-white robes were a little too large, and Kogasa Tatara had repaired her broken gohei. Ran carried the letter of appointment, Chen fastened her hair ornament, and Yukari waited beyond the torii without walking those final steps for her.\n\n Reimi wrote her name before the altar.\n\n When the final stroke fell, the dormant Great Hakurei Barrier answered. Spiritual power flowed from the barrier nodes beneath the shrine into the gohei. The strength left by the previous shrine maiden crossed the boundary of life and death and finally came to rest within Reimi.\n\n She did not become omnipotent in an instant. She could still be afraid, and she still had to learn talismans, barriers, and the rules governing incidents. From that moment onward, however, she finally possessed the power to make a conflict stop.\n\n Reimi rang the bronze bell and faced the humans and youkai below.\n\n “I, Reimi Hakurei, inherit the Hakurei name today.”\n\n “I will not presume someone innocent merely because they are human, nor permit someone to harm others merely because they are youkai. Anyone being hunted may come beneath this torii. Anyone who preys upon the weak must stop here.”\n\n She paused, then looked towards Yukari and the assembled sages.\n\n “The shrine belongs to no faction. If a sage's command should ever violate these principles, I will refuse it.”\n\n Yukari did not argue. She simply announced the girl's new station to the crowd.\n\n “From this day forward, she is the forty-fifth Hakurei shrine maiden.”\n\n The humans saw the red-and-white robes; the youkai recognized the child raised among their settlements. She belonged to both, yet she was no longer merely caught between them.\n\n The new Hakurei shrine maiden would guard, with her own hands, the boundary no one was permitted to cross."

 yakumo.19.a:0 "The forty-fifth Hakurei shrine maiden—Reimi Hakurei."


  yakumo.20.t:0 "The gods on earth began to evacuate."

 yakumo.20.d:0 "Eirin still remembers where the first orbital map of the Moon was completed.\n\n It was a temple burned down by war. The roof had collapsed, the idols lay in the ashes, and a few deities, devoid of followers, guarded the last embers of the sacrificial fire. War raged on Earth, and plague, curses, and the decline of faith caused more divine spirits to lose their form. Even those who escaped the fighting might vanish quietly after being forgotten.\n\n Eirin laid out the orbital map on the broken altar and proposed a journey to the moon. There, far from the battlefields on Earth, there was no plague or bloodshed spreading between nations. She did not promise immortality, only that the refugees would have time to rebuild their lives.\n\n The first group willing to go did not carry a military flag. They brought seeds that could grow in barren land, books preserving medical knowledge, sacrificial implements left by their ancestors, and stone tablets recording their names and homelands.\n\n Someone asked Eirin if she would return after reaching the moon.\n\n “Of course,” she replied. “The refuge is not a grave. When the war on earth ends, those who wish to return home should return.”\n\n At that time, Eirin hadn't considered establishing a nation. She only wanted to preserve a tomorrow for those who were about to disappear."

 yakumo.20.a:0 "Lunar Capital wasn't initially a kingdom, but a path to survival."


 yakumo.21.t:0 "Lunar Capital's Initial Establishment"

 yakumo.21.d:0 "The original city of the Moon had no high walls, nor palaces floating in the sky. The first generation of residents built their houses using local timber construction methods. Gods, craftsmen, and ordinary refugees lined up together to fetch water. Eirin herself also carried timber and inspected wells.\n\n The city initially had only three common rules: the sick were temporarily isolated, limited supplies were allocated according to the number of people, and no one was allowed to bring the war from the ground into the refuge area.\n\n The so-called purity at that time only meant the removal of the source of disease, curses, and dangerous artifacts. After the isolation ended, residents were free to return to their neighborhoods; no one lost their home because of their birthplace, and no child needed to prove their lineage.\n\n A child born on the Moon once asked Eirin which was her home, Earth or the Moon.\n\n Eirin pointed to the distant blue planet.\n\n “Your parents came from there, and you were born here. Both can be home.”\n\n A moonlight has been burning by the city gate for years, guiding latecomers to seek refuge. That light is not a warning to earthlings to leave, but a message to all those still fleeing: there is still a place here.\n\n Eirin remembers Lunar Capital back then. It is because she remembers that she cannot take everything today for granted."

 yakumo.21.a:0 "That moonlight was once left for those who were lost."


 yakumo.22.t:0 "Purity Becomes Law"

 yakumo.22.d:0 "The changes in Lunar Capital didn't happen overnight.\n\n A pandemic extended the quarantine period, an assassination attempt led guards to inspect visitors from the surface, and shortages prompted Parliament to restrict new residents. Each change had its reasons and was called a temporary measure. However, the quarantine zones did not reopen.\n\n Quarantine certificates gradually became residency qualifications, and those going to the surface had to undergo increasingly lengthy screenings. Later, even their children were required to live in designated areas because the Purification Institute believed that impurity could perpetuate through bloodlines.\n\n Eirin had signed the initial quarantine order. She believed at the time that as long as the rules were accurate enough, fear would not harm the innocent. When she tried to withdraw those measures, Parliament could simply cite her past signature to prove that everything had the permission of the founders.\n\n What truly awakened her was a lesson for children. The teacher pointed to an image of the Earth and asked the students what filth was. One child raised his hand and pointed to the immigrants on the floor who were responsible for cleaning the classroom.\n\n No one corrected him. Eirin finally realized that purity was no longer a method of epidemic prevention. It had first become identity, then morality, and finally the law determining who was eligible to remain in the city.\n\n The walls she had built, originally intended to stop war, were now beginning to block all those defined as different by those in power."

 yakumo.22.a:0 "Temporary measures, in the end, made themselves into the embodiment of justice."


 yakumo.23.t:0 "The Tale of the Bamboo Cutter Arrives on the Moon"

 yakumo.23.d:0 "Kaguya grew up in a bamboo forest on Earth. She remembered her adoptive father's rough hands, the sound of bamboo leaves rustling outside the house, and how that small house sheltered her from the winter winds.\n\n When the Lunar Capital messengers confirmed her ancient lunar bloodline, Kaguya briefly thought she had found another homeland. She boarded the lunar ship, carrying soil from the bamboo forest, clothes sewn by her adoptive parents, and a story later known on Earth as “The Tale of the Bamboo Cutter,” arriving on the moon.\n\n The welcoming party split into two groups. One group knelt, calling her the returning princess; the other group donned purification masks, fearing that the dust from Earth on her sleeves would fall onto them.\n\n The officials in charge of receiving her demanded that Kaguya burn the items from Earth and, during the purification ceremony, acknowledge that the humans who raised her were merely contaminated temporary guardians.\n\n Kaguya refused.\n\n “If they hadn't raised me, you would only be welcoming a corpse today.”\n\n H ..."

 yakumo.23.a:0 "She brought not only the scent of bamboo, but also questions that Lunar Capital was unwilling to answer."


 yakumo.24.t:0 "The Trial of the Surface Princess"

 yakumo.24.d:0 "The Purification Institute did not accuse Kaguya of any specific act. The real evidence in the trial document was that she was born on the surface, raised by humans, and refused to deny that period of her life.\n\n The judges objected to the search of the sealed archives for Lunar Capital's earliest resident records. Most of the names on them came from Earth, including ancestors of several of today's Pure Families. If being born on the surface is itself a form of contamination, then none of the founders of Lunar Capital could pass scrutiny.\n\n Eirin attended the trial as the Great Sage. She did not sit in the seat reserved for the Great Sage, but stood beside Kaguya.\n\n “I led the first inhabitants away from Earth, and I also established the first isolation rules,” Eirin said to the Purification Institute. “If she is guilty because of her surface origins, then judge me first.”\n\n The Purification Institute could not publicly punish Lunar Capital's oldest founder, nor dared to admit that its theories would render the entire city illegitimate. The final verdict thus became another form of imprisonment: Kaguya would not be immediately executed, but she was forbidden from leaving her designated palace, from contacting Earth, and from publicly discussing her adoptive parents.\n\n When Kaguya walked out of the courtroom, Eirin was still by her side.\n\n It wasn't until that day that Kaguya understood that Eirin was no longer merely trying to repair Lunar Capital. She had begun to stand against the very system she had helped establish."

 yakumo.24.a:0 "The trial of Kaguya is tantamount to the trial of Lunar Capital."


 yakumo.25.t:0 "Hourai Elixir: There is no turning back."

 yakumo.25.d:0 "When Eirin placed Hourai Elixir before Kaguya, she didn't present it as a life-saving elixir.\n\n “After drinking it, you will not die,” she said. “Poison, execution, and time cannot end your life. But you also cannot be restored to your former state. Even if one day you tire of eternity, death will not return.”\n\n The Pure Institute had secretly proposed an execution plan, preparing to end this trouble before the next public trial. As long as Kaguya was destined to die, Lunar Capital would always have the power to decide when her end came. Hourai Elixir could take away that power, but it would also forever burden her with the weight of her own choices.\n\n Eirin didn't decide for her, only leaving the medicine on the table.\n\n Kaguya sat for a long time, finally picking up the cup herself.\n\n “They wrote my birth as a sin, those who raised me as filthy, and now they want to decide for me how long I should live.” She looked at the moonlight in her cup. “At least this time, it's my choice.” Kaguya drank Hourai Elixir.\n\n Lunar Capital could no longer execute her, but could only deal with this political problem of immortality through permanent imprisonment, information blackout, and erasure of related records.\n\n Immortality thus became a new cage, but also a possibility that the Purification Institute could never completely eliminate. As long as Kaguya still existed, the contradictions about the origins of Lunar Capital could never truly disappear."

 yakumo.25.a:0 "She lost death, but also regained her life."


 yakumo.26.t:0 "A Moon Rabbit's Training Days"

 yakumo.26.d:0 "After Reisen entered the Moon Rabbit School, the first thing she lost was her name.\n\n Instructors addressed trainees by numbers, requiring them to master drills, wavelength communication, shooting, battlefield first aid, and ground combat. There were fixed times for waking up, eating, training, and resting each day; any hesitation was recorded as a disciplinary fault.\n\n The curriculum repeatedly told the Moon Rabbit that the inhabitants of the Earth were dominated by filth, emotionally confused, greedy for death, and incapable of rational judgment like the inhabitants of Lunar Capital. Earth was not a world inhabited by countless people, but a dangerous zone constantly generating war, disease, and madness.\n\n Training targets never showed complete faces. Enemies were only outlined, their distance, threat level, and the location where they had to be hit. Instructors did not allow trainees to ask who the target was, because soldiers did not need to understand the target, only to accurately execute orders.\n\n Reisen was once punished by being forced to stand alone on the training field until dawn for hesitating for half a breath before shooting.\n\n The instructor told her that the half-breath could have killed the entire unit. The next day, she didn't hesitate again. Moon Rabbit School didn't just train the body. Instructors would check conversations between trainees, requiring them to report any unusual emotions; failure was explained as personal impurity, and obedience was considered the only way to safety.\n\n Over time, trainees began to suppress their doubts and even correct their comrades who still retained terrestrial habits. At that time, Reisen didn't feel oppressed. She believed Lunar Capital protected Moon Rabbit, believed the instructors' strictness was for their survival, and believed that once the enemy on Earth reached the moon, they would destroy everything.\n\n On graduation day, she completed her shooting assessment with top marks and received her uniform and number. She was able to aim at any target marked as an enemy without hesitation.\n\n Until the First Lunar War truly began, Reisen had never seen an enemy on the ground, nor had she ever imagined that the outlines on the target paper might have their own names."

 yakumo.26.a:0 "At that time, she believed that obedience was the key to survival."


 yakumo.27.t:0 "Veteran of First Lunar War"

 yakumo.27.d:0 "On the day the war started, I believed I would be back before sunset.\n\n The instructor said that the Youkai on the ground were undisciplined, just a bunch of beasts driven by filth. As long as we held the outer wall, the enemy would lose their way in the Moon Sea. The moon rabbits on the transport trucks even discussed how many days off they would get after the victory, and no one seriously checked whether their wills were finished.\n\n The first line of defense only lasted half a day.\n\n The Youkai appeared from a direction we thought was impossible to pass through. The Oni carried the wounded under artillery fire, and little Youkai lay in the shell craters pressing on the wounds of their comrades. They were afraid, they called out each other's names, and they risked leaving their cover to save someone.\n\n That wasn't the outline on the training target paper. My squad was transferred to the second line of defense. The first count left thirty-two men; the second, nineteen; the third, only seven. I reported the names of the dead to my superiors, but the staff officer interrupted me, asking only how many were still able to fire.\n\n Our orders were always the same: hold the line, await reinforcements, and do not retreat. When reinforcements arrived, they were just another group of Moon Rabbits fresh out of school. They took the positions left by the dead, used the same numbers, and then disappeared in the next round of artillery fire.\n\n Later, I stopped asking which position we were defending that day. The outer walls, the Moon Sea trenches, the underground passages—all were filled with corpses of different shapes. The superiors said the casualties were still within expectations, the positions could be retaken, and Moon Rabbits could be replenished.\n\n To them, our deaths were just a decrease in the reported numbers. The orders only changed for the first time when Eirin took command of the front lines. She abandoned several indefensible positions, ordering her troops to retreat with the wounded, leading the ground expeditionary force to the Lunar Plains, far from supply routes. Many officers said this tarnished the prestige of Lunar Capital, but all I knew was that it was the first order since the start of the war allowing us to leave alive.\n\n I didn't complete the entire retreat route. When the explosion occurred, I only saw a white flash. The shockwave threw me into a crater, and all communications were cut off. I thought I was dead, but when I awoke, I was lying in the underground medical ward, and Eirin was sitting beside my bed reviewing my combat logs.\n\n “Where are your troops?” she asked.\n\n “Only I'm left.”\n\n “Do you remember how the others died?”\n\n “I remember them all.” Eirin closed the record. “Then come to me. There are enough people who only look at the battle reports.\n\n I need someone who actually survived the battle reports.” She transferred me to her direct command. Not because I was the most loyal, nor as a reward for surviving. She believed that an ordinary soldier who had experienced the collapse of the outer walls, the retreat from the Moon Sea, and the underground battles could see things that commanders could never see on the map.\n\n After the war, the broadcast announced a great victory for Lunar Capital. We were asked to believe that purity had defeated filth, that all retreats were pre-arranged, and that all deaths were glorious and necessary sacrifices.\n\n I listened to the entire report while lying in my hospital bed.\n\n At that moment, I finally understood that Lunar Capital hadn't won the truth. It had simply survived long enough to rewrite it."

 yakumo.27.a:0 "I survived the war, but I can never go back to the day I went to war."


  yakumo.28.t:0 "The dissenter remains under the moonlight"

 yakumo.28.d:0 "Hourai Elixir prevented Kaguya from being executed, but also ensured her trial would never end.\n\n The Purists demanded the permanent sealing of Kaguya, the destruction of Hourai Elixir's records, and the stripping of Eirin of her position as Great Sage. Lunarian, still remembering the city's founding purpose, pointed out that the first inhabitants of Lunar Capital were originally from Earth; if being born on the surface was a sin, then the entire city was built on filth.\n\n The final council thus split in two. Eirin exercised the veto power of the founders, but the Purification Institute declared that she had been corrupted by Kaguya. The debate then spilled over into the council chambers; the army blockaded the Old City, the Medical District and some of the Old Gods refused to obey, and the Moon Palaces opened fire on each other for the first time.\n\n Those who opposed the Purists possessed Eirin's prestige but lacked control over the army, communications, and transportation. The war continued until the sixth day, and the Old City was completely isolated. Continuing to resist would only lead to Kaguya falling into the hands of the Purification Institute and Lunar Capital being destroyed by internal strife.\n\n That night, a Lunarian with outstretched egret wings appeared before Eirin. Her name was Sagume Kishin, and she possessed the ability to reverse the situation with words. Sagume handed over a map and temporarily turned the gate that had sealed off the Moon Palace into an exit.\n\n Eirin invited her to accompany her, but Sagume chose to stay. “If all those who know leave, they can convince Lunar Capital that the Sanctuary never existed.”\n\n On the seventh day, Eirin left with Kaguya and Reisen. With the loss of the Great Sage, the Old City ceased its resistance, ending the week-long civil war.\n\n The Purification Institute immediately arrested the survivors, sealed the city's founding records, and renamed the civil war the Contamination Riot. Sagume concealed her allegiance, hiding the remaining historical materials and contact information deep within the Moon Palace.\n\n She did not betray the losers. The rebellious one with the wings of a white heron was simply waiting for the next opportunity to change Lunar Capital."

 yakumo.28.a:0 "The civil war is over, but some people still remember the truth under the moon."


 yakumo.29.t:0 "Eirin left"

 yakumo.29.d:0 "The day after Eirin's departure, Lunar Capital operated as usual, as if the Seven Days' Civil War had never occurred.\n\n The Purification Institute declared that the Great Sage had gone into seclusion, and Kaguya and Reisen disappeared from public records. Lunar Capital could not admit that its founder had abducted the surface princess, nor could it let the Moon Rabbit know that obedience was not the only option.\n\n Without Eirin's checks and balances, the Purification faction began rewriting history. Lunar Capital was no longer a refuge from the war on Earth, but was described as a pure nation that had existed since ancient times; the heavy casualties of the First Lunar War were rewritten as a perfect victory, and the civil war became a riot started by a few corrupted individuals.\n\n Schools required children to believe that Lunarians were inherently superior to surface life. Families monitored each other, and anyone who questioned textbooks, preserved old history, or discussed Eirin was subject to Purification censorship. Lunar Capital is no longer content with its residents obeying the law; it demands that everyone share the same memories and enemies.\n\n After countless years, sealing off Earth is no longer enough for the Purists. As long as life on Earth continues to proliferate, death and filth will continue to occur. Thus, preventing pollution from entering Lunar Capital gradually becomes about eliminating the source of pollution itself.\n\n Earth observation, secret agents, and weapons programs emerge one after another. Lunar Capital begins to infiltrate Earth's political systems, manipulating wars and the suppression of Youkai, paving the way for future complete purification.\n\n The army guarding the Moon gradually transforms into a force preparing to destroy life on the surface. Only deep within the Moon Palace, the person with egret wings still preserves the refuge's history.\n\n Lunar Capital was born to escape war. After Eirin left, it began waiting for the opportunity to send war back to Earth."

 yakumo.29.a:0 "The shelter ultimately became the enemy on the ground."



 yakumo.30.t:0 "After death, she still awoke."

 yakumo.30.d:0 "When Yuyuko opened her eyes, she found herself lying in an unfamiliar white corridor.\n\n She instinctively tried to breathe, but her chest remained flat. Her skin was cold, and her hands had become almost transparent. She remembered the garden of the Saigyouji family, the spring snow, and the hunger, but she couldn't remember why she had ended up under Saigyou Ayakashi, nor why death hadn't taken her into the cycle of reincarnation.\n\n A weeping sound came from the other end of the corridor. A recently deceased soul refused to accept its fate, constantly searching for its way home. Yuyuko went over, accompanied him to finish the words she couldn't say goodbye, and then walked with him to the crossroads leading to Higan.\n\n She didn't know why she knew how to comfort the dead. Perhaps the power to manipulate death hasn't disappeared; it has simply shifted from taking lives to guiding those who have already departed.\n\n After completing her first farewell, Yuyuko suddenly felt hungry.\n\n “So, even after death, you still need to eat,” she said with a smile. It wasn't a dismissive attitude towards her own death, but rather a confirmation of something: her past self was over, and the spirit before her, still hungry, afraid, and capable of helping others, was also the real Yuyuko Saigyouji."

 yakumo.30.a:0 "She had died once, and continued to live as a spirit."


 yakumo.31.t:0 "The Body Beneath Saigyou Ayakashi"

 yakumo.31.d:0 "After the seal on Saigyou Ayakashi shifted, Youmu was ordered to inspect the outer perimeter of the tree roots. She didn't dig into the soil, but instead checked the spell along the exposed sealing stones one by one.\n\n The stone surface is engraved with the names of the Saigyouji clan. The deeper one goes, the older the era; their remains and power together suppress Saigyou Ayakashi, preventing the flowers that bring death from ever fully blooming.\n\n At the very top of all the names is Yuyuko Saigyouji.\n\n Youmu finally understands that her master didn't just die under the tree. Her body in life was the final lock of the seal, and the last memories she lost after death prevented her from finding and touching the core of the seal.\n\n The seal protected countless living beings, but it also severed Yuyuko's path to self-discovery.\n\n Youmu didn't touch the stone. She simply overwrote her master's name again, then returned to Hakugyokurou with this overwhelming discovery."

 yakumo.31.a:0 "What's sealed beneath the tree isn't just disaster, but also her entire life."


 yakumo.32.t:0 "Yuyuko, do you know who you are?"

 yakumo.32.d:0 "After breakfast, Youmu suddenly asked, “Lady Yuyuko, do you know who you are?”\n\n Yuyuko unfolded her folding fan.\n\n “The master of Hakugyokurou, the administrator of Netherworld, the spirit princess of the Saigyouji family. Do you need a fourth answer?”\n\n “Those are all your identities.” Youmu didn't back down. “I'm asking yourself.”\n\n Yuyuko wanted to change the subject with dinner, but Youmu remained seated. Only when the tea cooled did she slowly close her folding fan.\n\n She admitted she was afraid of Saigyou Ayakashi, and also afraid of knowing what lay buried beneath the tree. She would be happy because of delicious food, would deliberately tease the overly serious gardener, and would wonder, when no one was watching, whether her smile today truly belonged to her, or was merely a habit to maintain the dignity of a spirit princess.\n\n After hearing this, Youmu simply replaced the cold tea with a new one.\n\n Yuyuko lost most of her memories from her previous life, but she did not lose the right to rediscover herself today. She was not a shadow left by a seal, a position, or a surname.\n\n She was still the one who could answer, “How do I want to live?”"

 yakumo.32.a:0 "A position can define responsibility, but it cannot define a person."


 yakumo.33.t:0 "Netherworld's Appointment"

 yakumo.33.d:0 "Shortly after Yuyuko's death, a large number of lost spirits began to gather around her. She could understand their obsessions and calm their frantic souls.\n\n Therefore, the goddess Hecatia came to Hakugyokurou, representing Hell's recognition of Yuyuko's authority over the souls of the Netherworld. Eiki Shiki brought Higan's judgment, explaining the boundaries of this power point by point.\n\n The dead may stay temporarily, but not be permanently detained; the living cannot be forcibly detained, and souls cannot be used for war. Yuyuko is responsible for appeasing obsessions and arranging their fate, but has no right to alter judgment and reincarnation based on personal desires.\n\n “What if I don't accept?”\n\n Yuyuko asked. Hecatia did not threaten her.\n\n “That was your choice. But these lost souls will come looking for you again tomorrow.”\n\n Yuyuko gazed at the wandering spirits outside the corridor. She, too, had lost her way after death, knowing what it meant to be unguided.\n\n Ultimately, she accepted the duties of Hakugyokurou. Not to become the queen of the dead, but because she didn't want other dead to be trapped alone in unfamiliar corridors, as she had been when she awoke."

 yakumo.33.a:0 "She accepted not a crown, but a guiding light for the dead."


 yakumo.34.t:0 "The First Oath of the Konpaku clan"

 yakumo.34.d:0 "The first Konpaku gardener made an oath before the stone steps of Hakugyokurou.\n\n He will tend the garden, protect Yuyuko, and maintain the boundary between life and death as a half-human, half-phantom. The Higan acknowledges that the Konpaku clan can bring swords into the Netherworld, but demands that the sword not be drawn solely for its master.\n\n Eiki Shiki asked, “What if the lord of Hakugyokurou personally crosses the boundary?”\n\n The gardener remained silent for a long time, finally placing the sword horizontally before his knees.\n\n “I will first persuade her to return.\n\n If she continues on her way, I will draw my sword to stop her.” This sentence became the last clause of the Konpaku clan's oath. It was not written in the public family precepts, but sealed in a sword case, and only those who formally inherit the position of gardener can read it.\n\n Serving Yuyuko and upholding the order of life and death are not usually contradictory. However, from the very beginning, the loyalty of the Konpaku clan was not uncritical obedience.\n\n They left their swords in Hakugyokurou precisely so that one day they could protect Yuyuko and also stop her."

 yakumo.34.a:0 "Loyalty without a blade can protect no one."


 yakumo.35.t:0 "The Second Command"

 yakumo.35.d:0 "After leaving Hakugyokurou, Youmu finally opened the sword case left by her grandfather.\n\n The first command in the case required her to serve Yuyuko. The second command stated: If Yuyuko Saigyouji attempts to break the seal of Saigyou Ayakashi, detain the dead, or breach the boundary between life and death, the heir of the Konpaku clan must immediately stop her.\n\n This command was never revealed to the lord of Hakugyokurou. It was not a judgment against Yuyuko, but rather a precaution against a moment no one wanted to face. If the master were influenced by Saigyou Ayakashi, informing her beforehand would only render the last line of defense meaningless and could turn long-established trust into endless suspicion.\n\n At the bottom of the sword case was a line of small writing by Youmu.\n\n “The first command is given to the master; the second is reserved only for the swordswoman.”\n\n Youmu read the page several times before finally locking the sword case again. She didn't tell Yuyuko, nor did she change her daily routine. The garden still needed pruning, the lost spirits still needed guiding, and dinner had to be prepared on time.\n\n However, from that day on, every time Yuyuko looked at Saigyou Ayakashi, Youmu would notice her gaze; whenever her master casually mentioned the appearance of the Saigyou Ayakashi in bloom, her hand would unconsciously move closer to the sword hilt.\n\n The secret didn't destroy their relationship, but it left an unavoidable boundary in Youmu's heart.\n\n She hoped she would never have to carry out the second command. But if that day truly came, she had to realize it before Yuyuko."

 yakumo.35.a:0 "She locked the sword case again, without mentioning it to her master."

 yakumo.36.t:0 "The Yama's Order"

 yakumo.36.d:0 "While cleaning the courtyard, Youmu discovered that Saigyou Ayakashi had sprouted an out-of-season flower bud.\n\n The flower had not yet opened, but the ghosts nearby had already begun to lose their way, constantly gathering under the tree. Eiki Shiki personally examined the seal and found remnants from the direction of the Moon in the outer layer of the spell. She could not confirm Lunar Capital's purpose, but she was certain that someone was probing Saigyou Ayakashi's connection to the boundary between life and death.\n\n Eiki immediately wrote an order: Seal off the west courtyard, relocate the nearby spirits, and no one is allowed to approach Saigyou Ayakashi or touch the seal under the tree.\n\n “Is Lady Yuyuko included?”\n\n Youmu asked. “Especially her,” Eiki replied. “Her remains are at the center of the seal, and her power is linked to death. If Saigyou Ayakashi blooms with her spiritual power, it won't just be a disaster for Hakugyokurou.”\n\n “What if she insists on getting closer?”\n\n “Stop her. That's the reason the Soul Reapers carry their swords.”\n\n Youmu didn't hesitate. She immediately sealed off the courtyard, dispersed the ghosts, and set up a barrier before the stone steps leading to Saigyou Ayakashi.\n\n In the evening, Yuyuko saw the blocked road and only asked, “Even I can't go in?”\n\n “Yes,” Youmu truthfully explained the flower bud and the Yama's order, but didn't mention the second order in the sword case.\n\n Yuyuko gazed at the treetops for a moment, then didn't force her way across the barrier. She simply closed her fan and quietly returned to Hakugyokurou.\n\n That night, Youmu reopened the sword case. The ancestral instructions and Yama's command contained almost identical content. Only now did she understand that the second command was no longer just a hypothesis left by her predecessors.\n\n If she might actually draw her sword against Yuyuko, then some things couldn't be kept from her forever."

 yakumo.36.a:0 "The second command, for the first time, had a definite target."


  yakumo.37.t:0 "Between master and mission"

 yakumo.37.d:0 "On the night of sealing off Saigyou Ayakashi, Youmu placed the Konpaku clan's second command and Yama's command before Yuyuko. “What is this?”\n\n Yuyuko asked.\n\n “A secret order left by the Konpaku clan,” Youmu replied. “If you attempt to break the seal or endanger the boundary between life and death, I must stop you. If necessary, that includes drawing my sword.”\n\n Yuyuko's smile vanished.\n\n “So all these years, every time I look at that tree, you've been deciding whether or not to cut me down?”\n\n Youmu couldn't deny it.\n\n After a long silence, Yuyuko asked her why she had to confess now.\n\n “Because it's no longer just a hypothesis.” Youmu gripped the scabbard. “Next time you're affected by Saigyou Ayakashi, I might really have to draw my sword. I don't want you to only know why I'm standing against you when you see the blade.” Yuyuko didn't forgive her immediately.\n\n “I don't like this order, and I don't like you keeping it from me,” she said. “But if you draw your sword without saying anything, I'll be even less able to forgive you.”\n\n The two ultimately agreed that neither would approach Saigyou Ayakashi until the Moon spell was completely removed. Youmu would carry out the seal, while Yuyuko would help soothe the spirits attracted by the flower buds.\n\n This wasn't reconciliation. It was simply that from that night on, another sword, hidden beneath the guise of service, was finally placed where both of them could see it."

 yakumo.37.a:0 "The truth didn't immediately restore trust, but it prevented the next betrayal."


 yakumo.38.t:0 "Manager, or Prisoner?"

 yakumo.38.d:0 "Three days later, Eiki Shiki removed the Moon spell attached to the outer layer of the seal. The abnormal flower buds withered immediately, and the spirits gathered near the courtyard regained their direction.\n\n After the crisis was resolved, Yuyuko did not immediately go to Saigyou Ayakashi.\n\n She first asked Eiki for Hakugyokurou's initial appointment decree. The decree detailed Yuyuko's powers and responsibilities, but did not specify her term of office, succession method, or resignation procedure. The drafter believed that since her remains had to be sealed in Saigyou Ayakashi forever, she had no possibility of leaving Netherworld, and therefore no need for a method to end her duties.\n\n “So, you didn't lock me up in Hakugyokurou,” Yuyuko said. “You just found I couldn't leave, so you handed all the work over to me.”\n\n Eiki didn't deny it. The seal was the reason Yuyuko couldn't reincarnate, but the position of administrator made this situation seem natural. She did cherish every deceased person she sent away, but that didn't mean an appointment a thousand years ago could forever answer whether she wanted to continue.\n\n Yuyuko didn't demand immediate resignation. She proposed something else: Hakugyokurou must establish a succession system, and administrators should have the right to choose again.\n\n Eiki withdrew her old judgment and agreed to submit the revision request to Hecatia.\n\n Yuyuko remained in her original position. The difference was that this time, she explicitly stated her willingness to stay temporarily."

 yakumo.38.a:0 "Unable to leave does not equate to agreeing to permanent employment."


 yakumo.39.t:0 "Yuyuko's own answer"

 yakumo.39.d:0 "After confirming that the Moon spell had been cleared, Eiki allowed Yuyuko, accompanied by Youmu, to enter the outer perimeter of Saigyou Ayakashi. The core seal remained closed, and the two could only see the stone face engraved with Saigyouji's name through the barrier.\n\n Yuyuko stopped her hand outside the barrier, not touching the seal. She had thought that after arriving here, her lost memories would suddenly return. However, the stone face did not answer her. There were no last words from her life, nor any thoughts from when she walked towards Saigyou Ayakashi.\n\n She only knew that her remains were indeed sleeping under the tree.\n\n “Perhaps I will never know why she made that choice,” Yuyuko said. “Should we continue investigating?” Youmu asked. “Yes.\n\n But not today, and not by using the method of blooming Saigyou Ayakashi.” Yuyuko didn't consider the past irrelevant, nor did she allow a human girl who could no longer answer to continue dominating the present. She decided to preserve the seal, while demanding that Higan not erase her memories again; any future investigations into Saigyou Ayakashi must be jointly verified by her, Youmu, and Eiki.\n\n Youmu also made her own choice.\n\n “I will continue to stay by your side, not just because of the Konpaku clan's orders. If you ever cross the line, I will still stop you. But after that, I will not leave.”\n\n Yuyuko looked at her, finally smiling again. “Then let's go back. Dinner hasn't been decided yet.”\n\n She didn't find the final answer under the tree. She merely regained the right to continue asking questions, to stay temporarily, and to change her decision in the future."

 yakumo.39.a:0 "She didn't reach the end; she only regained the right to continue answering."



 yakumo.40.t:0 "An Unsigned Star Chart"

yakumo.40.d:0 "Yukari asked Ran to tidy up the long-unused Hakurei Shrine warehouse. While moving a collapsed ritual implement cabinet, Ran discovered a metal box that hadn't rusted through a crack in the wall.\n\n Inside the box were no ritual implements, only two faded train tickets, a badge that read “Hifuu Club,” and an observation chart depicting the future starry sky. The star chart was marked with Hakurei Shrine at the end, but the date came from an era that hadn't yet arrived.\n\n Yukari took the star map. She didn't remember the handwriting, but instinctively understood every correction, and knew that the final calculation line led to an extremely distant past.\n\n On the back of the star map was only one sentence:\n\n “If Gensokyo really exists, we will always find the entrance.”"

yakumo.40.a:0 "The story begins with two train tickets that haven't been invalidated yet."

yakumo.41.t:0 "Does Gensokyo really exist?"

yakumo.41.d:0 "Two girls always sit by the window in the café. Renko spreads out an old map, while Merry is responsible for moving the desserts to a place where they won't get stained with ink.\n\n The map records a land that once existed but later disappeared from all records. There, gods are said to still be worshipped, youkai live alongside humans, and even the seasons can be disrupted by an accident.\n\n “No coordinates, no population records, no reliable photographs,” Renko tapped the table. “The most reasonable conclusion is that it simply doesn't exist.”\n\n “Then let's make a bet,” Merry said, cutting the last piece of cake in half. “If we find it, you have to admit my intuition is more reliable than your calculations.”\n\n “And if we don't find it?” “A place that doesn't exist doesn't prove we lost.”\n\n At this point, they didn't know that the stars could tell Renko the time, nor that Merry would one day see the cracks in the world. To the two girls, Gensokyo was still just a secret suitable for skipping school to investigate."

yakumo.41.a:0 "Looking for places that don't exist is perfect for Hifuu Club."

yakumo.42.t:0 "The Mansion in the Fog"

yakumo.42.d:0 "The clues led the two to an abandoned mansion. It was shrouded in fog year-round, and nearby residents claimed that before the iron gates were closed, it was inhabited by ageless vampires.\n\n “Since you believe in vampires, you can go in first,” Renko said.\n\n Merry pushed open the bat-wing-patterned door: “Shouldn't scientists be responsible for proving the rumors wrong?”\n\n All the clocks in the mansion were stopped at the same time, silver throwing knives were scattered in the corridors, and the doors to the underground wine cellar were locked three times from the outside. Most strangely, there was a library that almost filled the entire underground space: the bookshelves contained records about the war between Lunarians, Pure Ones, and the Moon, much of which didn't even appear in human history.\n\n They copied down several pages. As they left, a broken window on the second floor suddenly closed by itself, as if this mansion, dormant for many years, still did not welcome guests.\n\n Merry didn't turn back, only asking Renko, “Do you still think vampires don't exist?”"

yakumo.42.a:0 "Some rumors simply forget their own names."

yakumo.43.t:0 "Strange Army Under the Moonlight"

yakumo.43.d:0 "The world map in the emergency news had no front line.\n\n The enemy hadn't crossed the border. One moment a base was in the rear, the next it was swallowed by seawater that didn't belong there; soldiers fired at the empty sky, only to be wiped out by a sudden divine light. Countries kept announcing new defense plans, yet they couldn't even answer where the enemy was located.\n\n Renko paused the screen and flipped through the records copied from the misty mansion.\n\n “It's Toyohime. She folded the ocean and space together, so distance means nothing to her.”\n\n In another video, a woman in white raises her hand, and a deity long since abandoned responds to her call. “This is Yorihime.”\n\n Merry looks at the ever-increasing number of fleeing vehicles outside the street: “Can humans even lose to God?”\n\n “The earth has forgotten their names.” Renko closes the terminal. “We don't even have words to describe this kind of attack, so how can we fight back?”\n\n The last few pages of the mansion manuscript mention another forgotten name. Gensokyo once preserved Youkai, God, and miracles, and its entrance is maintained by a shrine called Hakurei. Renko follows the incomplete records to find the coordinates, but only finds a long-abandoned mountain area.\n\n “That's not a refuge,” Renko said. “It's more like a closed door. If the star map is correct, it once connected to an era when fantasy still existed.” “Can we come back?”\n\n Renko didn't answer.\n\n An alarm sounded again in the distance.\n\n Merry stuffed the manuscript into her backpack and took Renko's hand.\n\n “Then don't bother calculating the return journey. There's no other way in this era.”"

yakumo.43.a:0 "They didn't flee to safety, but to an era that could still be changed."

yakumo.44.t:0 "A Transmigration with No Way Back"

yakumo.44.d:0 "When the two arrived at Hakurei Shrine, the broadcast from the last city had just ended.\n\n The torii gate had collapsed, and only half of a plaque bearing the name “Hakurei” remained among the weeds. Renko's instruments detected nothing unusual below the main hall, but Merry heard cicadas chirping from behind the broken offering box.\n\n The sound didn't belong to the rain-soaked forest. On the other side of the boundary, the sun was blazing, as if it were still some unseen summer.\n\n “I found the door.” Merry placed her hand on the wooden plank.\n\n Renko looked up at the broken roof. She saw winter, summer, and the starry sky of an unfamiliar era overlapping in the same night.\n\n “Then I'll find the exit.”\n\n The white light of Lunar Capital's army had already illuminated the stone steps. Renko recited the era and coordinates, and Merry reached out, following her voice, for the first time actively touching the boundary between “this moment” and “that time.”\n\n The shrine cracked open before her eyes. Stepping into the gap, Merry felt countless eras brush past her sides. The coast receded into the land, the unfamiliar city turned back into wilderness; winter transformed into summer in a breath, and unborn languages swept past her ears like rain. Renko gripped her hand tightly, constantly adjusting their direction based on the retrograde stars.\n\n But the passage began to close before they reached their destination. Merry quickly understood that the boundary needed something to remain between life and death, the present and the past, acting as a wedge to support their continued progress.\n\n She didn't tell Renko the price, only placing her own life into that void. Her heartbeat still lingered, but time no longer passed over her. Human aging, death, and the journey home remained within the closed boundary, while the exit to antiquity finally appeared before them.\n\n “Don't let go,” Merry said.\n\n “You too.” Just before the moonlight destroyed the shrine, the two disappeared together into history yet to unfold."

yakumo.44.a:0 "Merry, with her own life, opened the door to the past for them."



yakumo.45.t:0 "The First Torii Gate of Antiquity"

yakumo.45.d:0 "Renko wrote her first observation record since arriving in a still-usable notebook. “Date confirmed.\n\n Error is still within acceptable limits. The location has no name, and no man-made roads can be found nearby. Merry complains that the mosquitoes here are more ferocious than in the future—at least that means we didn't land on the Moon.”\n\n She didn't write about another discovery as lightly. Merry could still breathe, eat, and laugh, but her body no longer aged. At noon, her shadow was even half a step slower than her. The journey hadn't taken away her consciousness, but it had severed her connection to human lifespan.\n\n Most of the instruments they brought were damaged. Renko could only place the broken plaque with “Hakurei” written on it at their arrival point and build a simple torii gate out of stones and branches.\n\n Nearby residents asked her which shrine maiden she was from. Renko glanced at the plaque and casually replied, “Hakurei.”\n\n This impromptu answer later became her name in ancient times. She used stars to create a calendar, rituals to fix the gap left by time travel, and the shrine as an anchor point for the two to confirm their era and location.\n\n At the end of the record, Renko's handwriting became messy.\n\n “When the stars shift, I will be dragged into other eras. The next time I return might be tomorrow, or decades may have passed. Merry, if I suddenly disappear, wait for me under the torii gate. As long as Hakurei is still there, I can always find my way back.”"

yakumo.45.a:0 "The first torii gate was a signpost Renko left for the two."

yakumo.46.t:0 "A Fragmented Mission from the Future"

yakumo.46.d:0 "Merry also tried to record her memories.\n\n “I come from the scientific century. Lunar Capital destroyed the Earth. Renko and I went back in time to preserve illusions and change the future.”\n\n Initially, these words were perfectly complete. Decades later, however, she began leaving blanks next to city names; a century later, cafes, universities, and Hifuu Club were reduced to inexplicable drawings.\n\n She couldn't remember when Renko left, nor how long it would be before they met again. Only the mission to “stop Lunar Capital” remained.\n\n Merry began to shelter the youkai driven out of humanity, the gods who had lost their priests, and the anomalies about to be forgotten by reality. She found them shelter and wrote each of their abilities into the plan to counterattack the Moon. She still called these beings her companions, but the records on paper had already divided them into vanguard, support, and those who could be taken for granted.\n\n Meanwhile, the people nearby began to fear her. Some claimed to have seen golden eyes behind the door, while others said that the road at dusk would send travelers to places they shouldn't exist. These rumors continued to fall upon her, making the outline of the human girl increasingly blurred.\n\n One day, Renko returned following the stars and called out “Merry” a few times under the torii gate. She didn't turn around, only asking who that unfamiliar name belonged to.\n\n Renko remained silent for a long time, gazing at the clouds in the twilight.\n\n “Then let's call her Yukari Yakumo.”\n\n “Is that her name?”\n\n “No,” Renko replied, “This is who you are now.”\n\n Yukari heard this name for the first time, yet felt she had been waiting for it for a long time."

yakumo.46.a:0 "The old name gradually faded away, and Renko left coordinates for her present self."




yakumo.47.t:0 "First Lunar War"

yakumo.47.d:0 "Centuries later, Yukari believed the time for a counterattack was ripe. She gathered the preserved youkai, gods, and other supernatural beings, leading the first expeditionary force to the Moon, attempting to destroy Lunar Capital before the scientific century arrived.\n\n The initial attack was far more ferocious than Lunarian had anticipated. The boundary was torn apart from the Moon Sea, the Oni race breached the outer defenses, and the Youkai crossed the walls, forcing the Moon Rabbit forces to retreat continuously. The Lunar Capital army never imagined that the strange creatures on the ground could approach the city; hastily deployed troops fell in droves, and the underground tunnels quickly filled with wounded.\n\n The expeditionary force also paid a heavy price. The Moon Rabbit's Danmaku tore apart the vanguard, the unfamiliar Moon environment hindering healing, and the follow-up troops lost their way in the chaotic boundary. With each advance, corpses from both sides were left on the Moon Sea.\n\n Eirin, judging that the frontal defense could not continue, ordered the defenders to abandon three lines of defense in succession, leading the expeditionary force to a plain far from the supply routes. Toyohime then distorted distances, continuously lengthening the path to Lunar Capital and gradually shifting the direction back to Earth; Yorihime, meanwhile, summoned God at key positions, systematically defeating the exhausted Youkai army.\n\n Lunar Capital completed the encirclement with fortified positions and the lives of countless Moon Rabbits. The expeditionary force could not advance and had lost its original retreat route; the Moon Rabbits outside the encirclement were also almost wiped out, and had no strength left to launch a final pursuit.\n\n Yukari only now truly realized that the force she had brought was not a quantifiable force. Oni carried the wounded, searching for an exit; little Youkai held the bodies of her companions; and someone asked before dying whether spring had arrived in Gensokyo.\n\n She abandoned the attack, using all her remaining youkai power to reopen the boundary to the surface. Survivors retreated from the Moon Sea over the corpses of both sides, while many who could not reach the exit remained forever under the moon.\n\n Lunar Capital ultimately defended the city, but dared not admit that it was a narrow victory that had almost exhausted the defenders. Gensokyo lost most of its expeditionary force and realized for the first time that Lunar Capital was not invincible—it was just that both sides had endured a little longer than the other in this war, which is why the Lunarians were the last ones standing on the battlefield."

yakumo.47.a:0 "Lunar Capital won the battle, but neither side had a victory to celebrate."


yakumo.48.t:0 "Gensokyo and Hakurei Shrine Maiden"

yakumo.48.d:0 "After returning from the Moon, Yukari sat alone under the torii gate, repeatedly wiping the moon dust that wouldn't wash off her sleeves.\n\n When Renko appeared following the stars, she didn't ask about the outcome of the battle.\n\n “How many people returned?” Yukari gave an exact number.\n\n “What were their names?” This time, she couldn't answer.\n\n Yukari had written her companions into her plan according to their abilities, numbers, and purposes. Only when she reached the Moon Sea did she hear the wounded calling for their homeland, and only then did she realize that those youkai, whom she called her soldiers, also feared death, and that some were waiting for them to come home.\n\n “I want to save the future,” Yukari whispered.\n\n “But those who died on the Moon didn't live on in that future.” “I know.” From then on, Yukari no longer treated Gensokyo as an armory awaiting a counterattack. She asked each youkai where they wanted to live, inquired about the rituals God needed, and allowed humans to carve out villages untouched by predation. The map, originally filled with troop strength and supplies, gradually showed roads, fields, markets, and banquet halls.\n\n Each time Renko returned, she would work with her to revise the shrine's boundary rules. The Hakurei shrine maiden guarded the entrance and had the right to refuse the sage; Yukari maintained the boundaries but had to ensure the shrine maiden wasn't used as a tool by any power.\n\n Many years later, during a reunion, Yukari looked at Renko's face and politely asked, “May I ask who you are?”\n\n Renko gripped the star chart tightly and finally only answered, “Hakurei shrine maiden.”\n\n She didn't force Yukari to remember her, but instead wrote down the promise that could no longer be maintained by memory as a duty that every subsequent Hakurei could inherit."

yakumo.48.a:0 "When memories cannot be preserved, agreements become systems."

yakumo.49.t:0 "Yukari Yakumo's name"

yakumo.49.d:0 "Ran spread the star map on the shrine floor. The edges of the pages were covered with annotations from different eras, some belonging to Renko, others from years Yukari herself could no longer remember.\n\n “Did Lord Yukari establish all these places?” Ran pointed to Youkai Mountain, Former Capital, Human Village, and Netherworld on the map.\n\n “I only opened the roads for them,” Yukari replied. “The oni moved into Former Capital themselves, the Tengu built the mountain roads, and the Kappa made the workshops operate along the stream.\n\n The houses in the Human Village didn't grow out of my gap.” She continued flipping through the map. The map also showed the passage rules for Hakugyokurou, the blockade line of Former Hell, and a blood pact with a foreign youkai on the shores of Misty Lake.\n\n Each border bore traces of modifications made in consultation with the local residents.\n\n “Then why do all the records revolve around Yukari Yakumo?”\n\n “Because those who draw the boundaries must also be held responsible for the mistakes they create.” Yukari once thought she could arrange everyone's positions alone. Later, she invited other great sages to share the judgment, and also allowed the shrine maiden Hakurei to retain the power to oppose her. When the Great Hakurei Barrier finally closed, Gensokyo was no longer her plan alone, but the homeland chosen by countless forgotten ones to remain.\n\n The star map ended with a faded note.\n\n “Merry, if you have forgotten me, please don't forget to leave a way for all those who leave.”\n\n Yukari read it twice, but still couldn't remember the writer's voice.\n\n “Is Lady Yukari Merry?” Ran asked.\n\n “Perhaps she was,” Yukari closed the star chart. “But I don't need to pretend I still remember everything about her just to prove she existed.”\n\n She looked at the two names on the paper. Merry belonged to the human girl who decided to return to the past, while Yukari Yakumo belonged to Youkai, who bore that choice and lived to this day. They didn't replace each other; they were simply names left behind by the same life in different eras.\n\n Yukari put the star chart back into the wooden box labeled “Hakurei.”\n\n “As for that phrase, although I've forgotten who taught it to me, I've always followed it to this day.”"

yakumo.49.a:0 "She forgot the person she made the promise to, but she did not forget the promise itself."

 yakumo.50.t:0 "Lunarian no longer hides in the shadows"

 yakumo.50.d:0 "War is inevitable.\n\n The Moon Rabbit and Lunarians, lurking on the surface, have simultaneously revealed themselves. They have taken over the government, rewritten military orders, and used panic to control the army. Several nations manipulated by Lunar Capital have declared war on Gensokyo, and the enemy, hidden behind the scenes for hundreds of years, has finally revealed its existence.\n\n From this moment on, Gensokyo must defeat the enemy nations supported by Lunar Capital on the surface, destroy their military strongholds, gradually weaken the Moon's defenses, and ultimately bring the war to Lunar Capital.\n\n§OThe following choices are only used to adjust the enemy strength in this war.§!\n§OLunar Capital's defense value and reinforcement scale will be adjusted according to the selected battle situation.§!"

 yakumo.50.a:0 "§GStable Battle Strategy§!: Reduces Lunar Capital's defense value and reinforcement strength."

 yakumo.50.b:0 "§YStandard Battle§!: Battle according to full rules and default strength."

 yakumo.50.c:0 "§RHarsh Battle Situation§!: Increases Lunar Capital's defense value and reinforcement strength."




 yakumo.51.t:0 "Prisoner Beneath the Sanctuary"

 yakumo.51.d:0 "Yukari found Mount Asama, the Purification Mountain, deep within the Sanctuary.\n\n This underground pyramid was not a palace of God, but a purification device left behind by Lunar Capital. Lunarians sent the impurities that refused to remain on the Moon into it, then processed them with the power of those imprisoned.\n\n Yuiman Asama's memories were altered, keeping the device running day after day; Ariya Iwanaga was sealed in the deepest part, becoming the last insurance against all changes. Lunar Capital called them sacrificial deities, but used them only as two indestructible components.\n\n Yukari shut down the purification device, and the heavy stone door opened. “We are preparing to storm the Moon.”\n\n She looked at the two gods who had regained their freedom. “If you remember who turned this place into a prison, come with us.”\n\n Asama didn't answer immediately, but turned back to look at the pyramid that had swallowed countless years of her life. Ariya, meanwhile, stood up from the rock wall, and time, which had stood still for a thousand years for the Stone Goddess, finally began to flow forward again."

 yakumo.51.a:0 "Get on board. Let Lunar Capital see what it has abandoned."


 yakumo.52.t:0 "Welcome to Hell"

 yakumo.52.d:0 "Hell held no ceremony for its guests. As Yukari crossed the gap, she saw Hecatia sitting atop the scorching rock, with Junko standing silently beside her.\n\n Hecatia had never liked the Lunarians. Lunar Capital rejected life and death, calling desire, change, and life itself filth; in her view, that was not nobility, but contempt for all living things.\n\n “You're finally going to attack the moon?” Hecatia asked with a smile. “This is much more interesting than those past tests.”\n\n Junko didn't participate in the pleasantries. She only made one condition: after Lunar Capital fell, Chang'e must be handed over to her. That hatred, purified to this day, had never faded with time, nor could it be quelled through negotiation.\n\n Gensokyo needs power to break through the Moon's defenses, while the two before them have already fought Lunar Capital countless times.\n\n “Chang'e is yours,” Yukari replied, “Lunar Capital belongs to this war.”\n\n Hecatia stood up, three planets symbolizing different worlds slowly rotating behind her. Junko finally raised her eyes, looking at the invisible moon above Hell.\n\n Hell will not obey Gensokyo, but is willing to board the same ship to the Moon with them."

 yakumo.52.a:0 "This time, Hell will go to the moon with us."


