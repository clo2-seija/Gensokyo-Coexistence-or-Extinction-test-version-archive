yakumo.53.t:0 "Old Acquaintances at Both Ends of the Map"

yakumo.53.d:0 "The gap to Animal Realm had just opened when Yuuma Toutetsu unceremoniously sat in Ran's seat and devoured all the snacks on the table. “You're still the same.”\n\n Ran put down the documents she was preparing for negotiations. “You always have to eat other people's portions before you'll even discuss how to divide them.”\n\n “You haven't changed either.” Yuuma licked the sugar powder off her fingertips.\n\n “Before you even opened your mouth, you'd already calculated how many plates I'd eat.” What was spread out in front of them wasn't today's negotiation map, but a tattered old map of Animal Realm. Many years ago, various factions tore each other apart for territory. Yuuma was responsible for breaking the deadlock, while Ran calculated how to prevent the victor from swallowing up the entire Animal Realm. They had cooperated, and they had set traps for each other; they had spent days poring over the same map, only to turn away and prepare for their next battle.\n\n “If you had stayed back then, you might be sitting at the highest position in Animal Realm now,” Yuuma said.\n\n “That's why I left,” Ran said, putting away the old map. “There, scheming only determines who eats whom. Lord Yukari showed me that it can also be used to protect a place.”\n\n Chen peeked out from behind the door: “So you're friends?”\n\n “No,” they both answered simultaneously.\n\n"

yakumo.53.a:0 "Animal Realm has no friends, only rivals remembered for too long."

yakumo.54.t:0 "Maturity Beneath a Naïve Exterior"

yakumo.54.d:0 "Youkai, the new child taken in by the Lost Home, stole steamed buns from the kitchen. When discovered, she hid the food tightly in her arms, cowering in a corner, refusing to let anyone near.\n\n The caregiver was about to approach when Chen stopped them.\n\n “If we question her now, she'll only think we care about the buns, not her.”\n\n Chen placed a cup of hot water by the door and left a portion of dinner for the child in the kitchen. She didn't condone the theft, but decided to discuss the rules after the child had eaten.\n\n The next day, Chen personally brought her to the kitchen.\n\n “Don't fight over the food here, but remember to come and get it. If you want more, just ask. You can also help others knead dough or carry firewood. Just say so, and someone will answer you.”\n\n A few days later, the child started helping in the kitchen and was willing to share snacks with others. Chen, confirming everything was alright, turned and ran into the yard, fighting with the fairies for a paper ball. She even threw a tantrum after losing the game.\n\n Ran stood in the corridor watching for a long time. Chen never put on a mature and composed act, yet she knew when to protect, when to set rules, and was willing to patiently wait for others to step out of their corners."

yakumo.54.a:0 "True maturity doesn't always require a serious demeanor."

yakumo.55.t:0 "The Bakeneko Chosen by the Nine-Tailed Fox"

yakumo.55.d:0 "When Ran first met Chen, she was already a two-tailed bakeneko.\n\n That day, Ran discovered over a dozen overlapping trails of youkai energy in the mountains. Several wild cats took turns moving according to different calls, leading lost children down the mountain while guiding the hunters chasing them back to their original location. Chen, in charge of directing everything, perched in a tree, smugly wagging her tail.\n\n Ran deliberately moved a landmark. Chen immediately noticed the change, rearranged the cats, and even located Ran, who was observing from a distance, by following the scent and the direction of fallen leaves.\n\n “You've been watching for so long, either help or don't cause trouble,” Chen said bluntly.\n\n Her youkai energy was still unstable, and her arrangements weren't exactly precise, but she already knew how to observe the environment, assign tasks, and quickly find new paths when the plan went wrong. Ran had originally just been passing by, but ended up stopping under a tree.\n\n “Would you like to learn Shikigami from me?”\n\n “What are the benefits of learning it?”\n\n “You'll become stronger, and you'll have a place to go back to.”\n\n Chen thought for a while.\n\n “Are there any fish?”\n\n “Yes.”\n\n “Then I'll learn.”\n\n Years later, Chen was able to maintain the array independently, contact Youkai in various places, and complete many complex tasks for Ran. She would still change the array diagram to a cat's face, hide on the roof before the class started, and argue with Ran for a long time about eating an extra fish.\n\n Yukari asked Ran if she had misjudged Chen.\n\n Ran looked at Chen, who was pretending to sleep in the tree.\n\n “Her talent has never been a problem.”"

yakumo.55.a:0 "That talent has never become complacent."


yakumo.59.t:0 "An exception in the calculation"

yakumo.59.d:0 "After the torrential rain blocked the mountain road, Chen was two hours late.\n\n Ran sat at her desk reviewing documents, claiming she wasn't worried at all. But every fifteen minutes she would recalculate the rainfall, flash floods, road damage, and Chen's possible location. When Yukari passed by, fourteen search plans were already stacked on the table.\n\n “This is just a necessary risk assessment,” Ran explained expressionlessly. gap Finally, a familiar voice called from outside. Soaked to the bone, Chen stepped inside, and Ran immediately began scolding her for changing the route without permission, failing to report in time, and putting herself in completely avoidable danger.\n\n As she scolded her, she dried Chen's hair and brought over a bowl of soup that had been kept warm by the stove.\n\n “Is this also a risk assessment?” Yukari asked.\n\n “Just to avoid wasting food.” In the past, Ran only calculated whether the task could be completed. Since Chen came along, all her plans included an unchangeable condition—no matter what happened, the child had to come home."

yakumo.59.a:0 "Nine-Tailed Fox called it risk management."

yakumo.60.t:0 "A Train Without a Destination"

yakumo.60.d:0 "On a rare day without meetings, Yukari left the Yakumo residence under the pretext of checking the barrier.\n\n When Ran found her following the lingering youkai energy, the Gensokyo sage was sitting in an old train traveling through the Outside World. Yukari leaned against the window, a newspaper lying on her lap, half-eaten snacks beside her. The train passed through mountains and towns, but she had no intention of getting off at any station.\n\n “If Lady Yukari wants to go somewhere, wouldn't it be faster to just open a gap?”\n\n Yukari didn't open her eyes.\n\n “It's precisely because you can get anywhere instantly that you occasionally need to take a useless train ride.”\n\n She liked the sound of wheels passing over seams, and she liked watching strangers meet and part ways at different stations. As for when this pastime started, she herself couldn't say.\n\n Ran took away the upside-down newspaper. Yukari leaned on her shoulder, preparing to continue sleeping through her so-called barrier inspection.\n\n “Wake me when we get there.”\n\n “We don't even have a destination.”\n\n “Then wake me up later.”"

yakumo.60.a:0 "Old habits die hard."

yakumo.61.t:0 "Always the Extra One"

yakumo.61.d:0 "Ran noticed that Yukari still prepared two teacups when she was alone.\n\n She would set up two chairs when observing the starry sky, leave paper and pen opposite when organizing maps, and occasionally suddenly recite the date and coordinates, stopping to wait for an answer that would never come.\n\n “Who is the other one for?” Ran finally asked.\n\n Yukari looked at the empty seat. There was no Shikigami there, no visitor, and no face she could remember.\n\n “I don't know.”\n\n She took one cup of tea, but didn't take the other one.\n\n “I just felt someone should be sitting there.”\n\n The tea slowly cooled under the starlight. Yukari had long forgotten the café in the Science Century, forgotten Hifuu Club, and couldn't recall a girl who had once sat across from her, recounting their time and place based on the stars.\n\n Memories may be worn away by the long years, but the body still holds a place for that person."

yakumo.61.a:0 "The forgotten person remains in habit."

yakumo.62.t:0 "Yuyuko's Menu for Today"

yakumo.62.d:0 "Yuyuko handed Youmu a menu that dragged on the ground.\n\n “Tonight I want to eat spring bamboo shoots, summer eel, autumn chestnut rice, and winter hot pot.”\n\n Youmu looked out the window. There were no bamboo shoots, and it wasn't chestnut season.\n\n “Lady Yuyuko, it's impossible to get all four ingredients at the same time.”\n\n “That's why I entrusted it to the reliable Youmu.”\n\n Youmu had to scour the market, bamboo groves, and storage rooms, even borrowing Kappa's cold storage to preserve the ingredients. By the time she returned to Hakugyokurou with the last dish, it was already night in the courtyard, and her usual cleaning and sword practice had been delayed.\n\n Two sets of bowls and chopsticks were on the table.\n\n “Didn't you want to eat, Lady Yuyuko?”\n\n “If I just told you to rest, you'd definitely say you still have things to do.” Yuyuko served her chestnut rice. “So I'll give you a task that requires you to sit down to complete.”\n\n Youmu was silent for a moment, then finally sat down opposite her.\n\n “After you finish eating, there's a dessert representing the fifth season.”\n\n Youmu stood up again."

yakumo.62.a:0 "The gardener also failed to finish sweeping the garden on time today."

yakumo.80.t:0 "The routine inspection of right and wrong"

yakumo.80.d:0 "When Eiki Shiki stepped into Hakugyokurou, Youmu had already prepared a thick stack of notes, while Yuyuko had prepared tea and sweets.\n\n Eiki pointed out three souls who missed their reincarnation dates, six travel documents lacking seals, two soul-guiding lamps hanging too low, and a ghost hiding under the stairs refusing to go to Higan. Youmu wrote furiously, while Yuyuko kept refilling her tea.\n\n “Also, Yuyuko Saigyouji. Distracting the judge with snacks during the investigation is also improper. Although gluttony is not a serious crime, it can make judgments influenced by desire. Besides, today's sugar intake is already—”\n\n Yuyuko silently replaced the snacks with loquat syrup to soothe the throat.\n\n As the investigation approached dusk, Eiki noticed that Youmu's hand holding the pen was trembling.\n\n “Continuing to work when exhausted is not commendable. Failing to judge one's own limits is also a dereliction of duty.”\n\n “Please, Lady Eiki, persuade her.” Yuyuko smiled, “No matter how many times I say it, it's useless.”\n\n So Youmu sat and listened for another half hour, the content being why rest is also a gardener's responsibility.\n\n Before Eiki left, Youmu cautiously asked Hakugyokurou if she had passed the inspection.\n\n “Regarding this, I have thirteen more points to explain.”"

yakumo.80.a:0 "Lady Eiki's words were not yet finished."

yakumo.64.t:0 "The way the princess takes care of the rabbit"

yakumo.64.d:0 "When Reisen awoke from the nightmare of the Moon battlefield, she did not allow anyone to approach. She huddled in the corner of the room, her ears pressed to her head, the white light of the falling cannon fire still lingering before her eyes.\n\n Kaguya didn't press her about her dream, but simply sat down where Reisen could see her, gently pushing the blankets and hot tea between them.\n\n When Kaguya was young, whenever she was frightened, her family never forcibly pulled her from her hiding place. They would simply stay nearby, talking about what to eat the next day, what flowers were blooming in the yard, and the ordinary little things to do after dawn. Those words about tomorrow made the long night seem to have an end again. So Kaguya started talking about tomorrow too.\n\n She said there would be newly made dumplings in the morning, the bamboo leaves in the yard needed trimming, and Tewi still owed the warehouse three boxes of carrots.\n\n “She won't pay them back,” Reisen finally whispered. “Then deduct it from her salary.”\n\n “She doesn't even have a fixed salary.”\n\n Kaguya deliberately pondered for a moment:\n\n “It seems there are many problems tomorrow, requiring you to handle them personally.”\n\n Reisen slowly pulled the covers over her head. Only when she reached out her hand did Kaguya approach and tidy her disheveled hair.\n\n Eirin arrived at the door with medicine, and upon seeing this scene, quietly put the medicine bottle back into her sleeve."

yakumo.64.a:0 "As long as there is tomorrow, the night will end."

yakumo.66.t:0 "Just how beautiful is Kaguya?"

yakumo.66.d:0 "Tewi discovered that Outside World tourists are willing to pay a high price to see “the real Kaguya-hime from The Tale of the Bamboo Cutter.” Kaguya herself refused to be displayed for public viewing, so Tewi immediately came up with an alternative—a public exhibition that perfectly recreated the ancient Kaguya-hime.\n\n She was in charge of selling tickets, Mamizou Futatsuiwa was responsible for the transformation, and Eirin was forcibly brought in as a historical consultant.\n\n “Just transform according to the story,” Tewi said, waving a flyer. “Her skin should be whiter than moonlight, her hair long enough to fill a room, and ideally, flower petals should fall as she walks.”\n\n Mamizou transformed as instructed, and the resulting Kaguya was dazzlingly beautiful, with hair trailing on the ground, and cherry blossoms falling from the sky with every step she took. Eirin shook her head after just one glance.\n\n “The clothing is barely acceptable, the face is too exaggerated. The princess didn't glow back then, and flower petals didn't automatically appear nearby.”\n\n “That's how people are willing to buy tickets.”\n\n Tewi said righteously. In the end, Mamizou had no choice but to refer to the current Kaguya, change into ancient clothing, and slightly adjust her makeup. As soon as she finished the transformation, the real Kaguya walked into the venue with the flyer that Tewi had printed without her permission.\n\n Two almost identical Kaguya princesses appeared in front of everyone at the same time. The audience was in an uproar, and even Reisen couldn't immediately tell which one was the real one.\n\n Tewi only hesitated for a moment before raising the new sign.\n\n “Today's limited-time event! Guess the real Princess Kaguya and you'll receive the princess's autograph!\n\n Participation fee not included!” As Kaguya chased Tewi out of the venue, Mamizou, still sporting her face, laughed uncontrollably on stage. Eirin then gave the audience her final conclusion:\n\n “The princess's beauty hasn't changed. What has changed the most is the person responsible for telling her story.”"

yakumo.66.a:0 "Whether the legend is exaggerated depends on how many tickets Tewi sold."




 #####################

   yakumo.63.t:0 "Victory on Earth Reaches the Moon"

    yakumo.63.d:0 "Another controlled nation has broken free of Lunar Capital. When news of the victory reached the lunar maria through the gap, long-awaited cheers erupted on the front lines—the allies on Earth were winning their war.\n\n To prevent the surface control network from collapsing further, Lunar Capital had to transfer reserve troops, transport capacity, and large amounts of supplies to Earth. This slowed the reinforcements from the Moon's garrison, and gaps began to appear in several previously tight defensive lines.\n\n The liberated forces also handed over the supply codes, order formats, and troop movement records used by Lunar Capital. Ran quickly processed this intelligence, transforming it into a tactical order that consumed no resources.\n\n Every inch of land reclaimed on the surface was opening new paths for the Moon's expeditionary force."

    yakumo.63.a:0 "The two fronts began to support each other."

 yakumo.56.t:0 "The Gate to the Moon"

 yakumo.56.d:0 "A giant gap unfolded behind the torii gate of the Hakurei Shrine. At the other end, there was no wind, no temperature, only a greyish-white lunar maria stretching to the horizon.\n\n Yukari recognized this land. During the First Lunar War, she had lost most of her expeditionary force here. Back then, she calculated troop strength, youkai power, and the speed of advance, but only after the battle lines collapsed did she begin to calculate how many could return home.\n\n This time, she personally confirmed the return coordinates, retreat beacons, and backup routes for each unit. Ran repeatedly checked the personnel numbers, while the engineering team deployed positioning devices along the route to guide the gaps back to normal. Even though the main passage was blocked by Lunar Capital, Yukari reserved youkai power to send the remnants back to the surface.\n\n The army assembled in front of the torii gate heard no assurances of victory. Yukari simply stood beside the gap and addressed all those about to set foot on the Moon:\n\n “I cannot guarantee victory in every battle. But as long as you live, I will not leave anyone behind in the Moon Sea.”\n\n The vanguard crossed the torii gate, and for the first time, the silence of the Moon was broken by the orderly footsteps of the Gensokyo army."

 yakumo.56.a:0 "Second Lunar War begins."


 yakumo.57.t:0 "Dismantling the Lunar Capital defenses"

 yakumo.57.d:0 "Lunar Capital's defenses weren't just walls and an army. Purification barriers could identify intruders, spatial portals could change direction on their own, and the Moon Rabbit forces mobilized reinforcements through a constantly updated password and observation network.\n\n Destroying these facilities head-on would incur too many casualties. Therefore, Yukari entrusted the captured Moon codes, communication logs, and defense maps to the two most suitable individuals to handle them.\n\n Eirin recognized many of the structures after just one glance. Lunar Capital used the fundamental rules she had helped establish; even with the addition of countless keys and restrictions, its deepest operating principles remained unchanged.\n\n Ran, on the other hand, broke down all the defenses into nodes, frequencies, and reinforcement intervals. For several days, she calculated Lunar Capital's command patterns, searching for the briefest gaps between each update.\n\n “No need to hack the entire system,” Eirin said, pointing to the center of the defense diagram. “Just make it believe a wrong command at a critical moment.”\n\n Ran quickly completed the final calculation.\n\n “Thirteen defense nodes will be shut down simultaneously. Moon Rabbit reinforcements will be sent to the wrong positions, and the purification barrier will identify friendly forces as unauthorized intruders.”\n\n When the old password left by Eirin re-entered the Lunar Capital network, the formidable defenses did not explode. It simply followed the wrong command, orderly opening the way for Gensokyo."

 yakumo.57.a:0 "Turn the Lunar Capital's vaunted order into a breach."


 yakumo.58.t:0 "Supply Line Above the Moon Sea"

 yakumo.58.d:0 "Opening the gap to the moon was only the first step. Weapons, food, medicine, and wounded soldiers still needed to travel back and forth between the two locations, and each time a large passage was opened, it would deplete Yukari's resources and could potentially expose their rear positions.\n\n Kappa arrived at command post with a hefty contract. They demanded sufficient compensation, full technical access, and the right to retain some of the Moon's equipment after the war. The conditions weren't cheap, but Kappa certainly delivered: sealed warehouses, lunar dust transport vehicles, mobile positioning stations, and small relay devices to take over the main passage.\n\n Grassroots Youkai was responsible for getting these devices operational. Sekibanki inspected every route, specifically looking for loopholes that could cause supplies to disappear into thin air; Kagerou led transport teams through uncleared areas, delivering ammunition to the front lines; Wakasagihime managed water, medicine, and the transfer of wounded soldiers, ensuring that weaker units wouldn't be abandoned due to lack of supplies.\n\n They knew very well that a war wasn't only lost to a powerful enemy. A day's delay in rations, ammunition delivered to the wrong place, and wounded soldiers left unattended could also destroy an army.\n\n When the first permanent supply stations began operating on the Moon Sea, Gensokyo would no longer be just an expeditionary force whose return route could be cut off at any moment. Kappa extended the passageways, and the grassroots network ensured that every crate of supplies reached those who truly needed it."

 yakumo.58.a:0 "Big shots plan to land on the moon, while ordinary people leave the army on the moon."




 yakumo.65.t:0 "The Returning Soul on the Moon Sea"

 yakumo.65.d:0 "After the failed offensive, there was no wind on the moon sea, yet pink and white cherry blossoms drifted slowly through the craters.\n\n Yuyuko, fan in hand, walked across the battlefield. She didn't inquire whether the dead belonged to Gensokyo or Lunar Capital, but simply awakened the souls still lingering beside the corpses. Youkai, Moon Rabbit, and the faint light left by humans and gods followed behind her, forming a silent line leading to the gap.\n\n Youmu, holding the weapons and relics salvaged from the battlefield, asked softly, “Should we take the souls of the enemy as well?”\n\n “While alive, they had to choose which side to stand on.” Yuyuko turned to look at the troops behind her. “After they die, they don't have to defend cities for others anymore.”\n\n Souls with homelands were sent back to the earth, while those without a home were led to Netherworld by Hakugyokurou. At least this time, Moon Dust would not bury the traces of their existence.\n\n On the other side, Ran wrote down the reasons for the defeat in the battle report: the wrong advance route, the delayed supplies, the underestimated Lunar Capital reinforcements, and every retreat route that failed to open in time. Someone suggested deleting the ugliest parts to avoid shaking morale.\n\n Yukari refused. “One defeat won't destroy the expeditionary force.” She closed the battle report. “Only by writing defeat as victory can the same people die again.”"

 yakumo.65.a:0 "Failure must leave a complete record."


 yakumo.67.t:0 "The Last Madness of the Empire"

 yakumo.67.d:0 "Lunar Capital's outer walls have collapsed. The allied forces crossed the Moon Sea defense line, occupying several districts, and the Moon Rabbit garrison laid down their weapons en masse. The distant central palace became the last remaining target of resistance in this war.\n\n However, the Purification Institute was not prepared to surrender.\n\n As the allied forces entered the inner city, a white pillar of light suddenly rose from the palace. The extremists activated the purification arrays buried beneath the districts, ordering the remaining residents, the wounded, and the Moon Rabbit troops to undergo “final purification.” They preferred to burn their city down rather than allow anything touched by life on the ground to continue existing.\n\n The streets of Lunar Capital disappeared piece by piece in the silent white light. The Moon Rabbits, who had just surrendered, dragged the wounded away from their positions, while the palace garrison received orders to open fire on all those who retreated. Even the ceasefire order from the Moon Sisters was rejected by the Purification Institute on the grounds of “being affected by defilement.”\n\n Ran, watching the city markers fading into the distance, stopped her calculations for the first time.\n\n “They're purging their own army,” Yukari said, closing her folding fan.\n\n Lunar Capital was no longer defending the city; it was proving that as long as purity remained, the number of lives within was irrelevant.\n\n “Then take the palace,” she said, “before they turn Lunar Capital into a tomb.”"

 yakumo.67.a:0 "They've gone mad."


 yakumo.68.t:0 "The Destruction of the Pure Empire"

 yakumo.68.d:0 "The final moon gate opened simultaneously from both inside and outside.\n\n Outside, the Gensokyo allied forces had breached the palace plaza; inside, Moon Rabbit, who refused to carry out the final purification order, and the opposition seized the control room. As the heavy white doors slid to the sides, the two armies saw each other for the first time, but did not continue firing.\n\n Watatsuki no Yorihime descended the palace steps and laid her sword flat on the ground. Toyohime then closed the still-operating spatial portal, cutting off the Purification Institute's last route for mobilizing reinforcements.\n\n “Lunar Capital's garrison accepts the ceasefire,” Yorihime said. “Continuing to resist will only make the city's inhabitants and the wounded pay for their deaths.”\n\n Yukari did not demand that they kneel. She only ordered the allied forces to disarm the palace, shut down the purification array, and allowed the medical team to enter the still-burning city first.\n\n The banner of the Purification Institute was lowered from above the palace. The command post, control center, and city defense nodes were surrendered one after another, and the remaining garrison began to leave their positions in formation.\n\n Lunar Capital still existed, and the people who lived there still existed. But the regime that could hide behind the moonlight and decide which of the two worlds deserved to live had ended at this moment."

 yakumo.68.a:0 "Lunar Capital The old regime no longer exists."


 yakumo.69.t:0 "Lunar Capital after the war"

 yakumo.69.d:0 "As the last controlled regime on Earth lifted the Lunar Capital order, the white signals on the battle map went out one after another. The Earth control network and the Moon's defenses simultaneously failed, and this war spanning countless ages finally had a definite end.\n\n The allied generals awaited Yukari's announcement of the post-war arrangements within the palace. Some advocated occupying Lunar Capital, some demanded the confiscation of all technology, and others believed that the Lunarians, having attempted to destroy Earth, deserved equal purge.\n\n Yukari sat before the empty throne but did not ascend the steps.\n\n “This war began because Lunar Capital arbitrarily declared other life forms unworthy of existence.” She looked at the people in the hall. “If we now declare Lunar Capital to belong to Gensokyo, then only those sitting on high will change.”\n\n She accepted the military surrender of the garrison but refused to include Lunar Capital as Gensokyo territory. The Purification Institute, military law enforcement agencies, and extremist armed groups will be stripped of their powers; records of their control over Earth will be preserved, and related responsibilities will be investigated according to individual conduct. Ordinary residents, moon rabbits, and soldiers who lay down their arms will not be punished for being born on the Moon.\n\n The war ended in victory, but victory will not begin with another expulsion."

 yakumo.69.a:0 "The war ended, and the change of regime began."


 yakumo.70.t:0 "The final order from the Purification Institute"

 yakumo.70.d:0 "Before the fall of the palace, the Purification Institute issued a final order to the underground archives: burn the Earth control records, secret execution documents, and information on all those who had opposed the Purification Policy.\n\n Flames rapidly spread along the bookshelves. Officials responsible for destroying the evidence sealed the exits, attempting to make the entire archives disappear along with those in the know.\n\n Sagume Kishin stood before the closed door. She had remained silent for too many years to preserve this evidence, and now she finally uttered the words she had long prepared: “Everything here will be completely burned.”\n\n As her words fell, the already predetermined outcome began to reverse. The fire extinguishing system restarted, the sealed door opened by itself, and the previously malfunctioning storage devices resumed operation. Sagume retrieved a backup preserved for many years from the darkroom, handing the complete records of surface infiltration, secret executions, and purification experiments to Yukari. “This isn't a weapon to retaliate against the entire Lunar Capital,” Yukari said, opening the first file. “It's only meant to prevent those who actually gave the orders from escaping collective responsibility.”\n\n The Allied Forces subsequently disarmed the remnants of the Purification Institute. The Moon Rabbits relinquished command of the army and agreed to public scrutiny. Ordinary moon rabbits no longer took the blame for their superiors, and the opposition no longer needed to prove their loyalty through silence."

 yakumo.70.a:0 "Liability will only be adjudicated based on individual conduct."


 yakumo.71.t:0 "Eirin and Kaguya return to Lunar Capital"

 yakumo.71.d:0 "As Yukari opened the gap in front of the palace, Eirin stood on the other side of the threshold, hesitant to move.\n\n The stone steps, archways, and waterways before her still bore the structure she had helped design. After a long exile, she returned not as a fugitive, but as someone Lunar Capital needed again.\n\n Kaguya stepped across the threshold, and the old court's servants instinctively prepared to kneel in welcome. She raised her hand to stop them.\n\n “I'm not back to restore the old court,” Kaguya said, gazing at the still-smoldering city. “If eternity can only be maintained by constantly eliminating life, then all that remains is an imperishable tomb.” Eirin took over the medical facilities, judicial records, and the city's survival system.\n\n She first opened the hospital, originally reserved for the upper class, and then ordered that allied wounded soldiers, moon rabbits, and civilians be treated elsewhere, without regard to status or purity.\n\n Kaguya, using the political orthodoxy of the Moon Princess, protected those born on the surface, moon rabbits, dissidents, and all those whom the Purification Institute had once labeled as impure. Sagume was responsible for contacting the opposition, allowing the reformist forces, hidden for many years, to openly enter the Transitional Council.\n\n Their return to power was not to bring the old era back to the palace, but to allow Lunar Capital, for the first time, to internally negate that era."

 yakumo.71.a:0 "Let those willing to change rebuild Lunar Capital."


 yakumo.72.t:0 "Lunar Capital Reconstruction Decree"

 yakumo.72.d:0 "Kaguya did not read the reconstruction decree aloud in the palace. She ordered the text to be sent to the city, factories, military camps, and the Moon Rabbit settlement, so that everyone who had been excluded from politics could hear it.\n\n The first decree disbanded the Purification Institute and the extreme military command system, and related facilities were immediately sealed off; the second decree dismantled the observation and interference network controlling the Earth, and prohibited any organization from rewriting the surface regime again; the third decree recognized the full residency rights of the Moon Rabbits, surface-born individuals, and former dissidents; the final decree reaffirmed the original purpose of Lunar Capital—to shelter those fleeing disaster, not to decide which lives should be swallowed by disaster.\n\n When the reader read the third decree, the Moon Rabbits gathered in the square did not cheer. Many simply looked repeatedly at the text on the wall, as if worried that the sentences would disappear the next day like past promises.\n\n Ringo folded her residency certificate and stuffed it into her pocket. Seiran looked at it for a long time, then whispered, “So this time, we're not equipment, nor are we consumables?”\n\n “No,” the registration official replied, “We're residents.”\n\n Lunar Capital's technology, gods, and culture were completely preserved. What was truly abolished was the power of a few, in the name of purity, to decide the life and death of both worlds."

 yakumo.72.a:0 "Lunar Capital no longer determines who survives based on purity."


 yakumo.73.t:0 "The New Lunar Capital Yukari Envisioned"

 yakumo.73.d:0 "Months later, the lights of Lunar Capital once again illuminated the city. Eirin resumed city operations, Kaguya allowed the transitional council to address years of pent-up disputes, and finally, uncensored conversations could be heard on the streets.\n\n Yukari stood alone on the palace terrace, gazing at the distant Earth. Kaguya approached her and asked the question everyone wanted to know. “You won the war, yet you didn't demand territory, a throne, or submission. What do you want from Lunar Capital?”\n\n “A door,” Yukari replied.\n\n It wasn't a passage for Gensokyo to seize Lunar Capital, nor an entrance for the Lunarians to re-intervene on the surface. Yukari proposes a jointly managed system of communication, allowing scholars, physicians, envoys, and refugees to cross distances, while granting both Earth and Lunar Capital the power to close passages and refuse invasion.\n\n Eirin reminds her that the door could also become the entrance to the next war. “So it must be able to open from both sides, and close from both sides,” Yukari unfolds her fan. “Borders can distinguish one from another, but they shouldn't prove that the other shouldn't exist.”\n\n Lunar Capital doesn't have to become Gensokyo, and Gensokyo won't accept purification. The two worlds can retain their own paths, order, and beliefs, but no one can use differences as a reason for extinction anymore."

 yakumo.73.a:0 "A world that can accommodate both."


 yakumo.74.t:0 "Before the Gap Closes"

 yakumo.74.d:0 "The offensive before the palace was beyond recovery. The vanguard had been cut apart by the Lunar Capital's defenders, supply nodes were failing one after another, and the gap beyond the torii was beginning to fray at its edges.\n\n Ran was still calculating one final counterattack when Yukari lifted her eyes from the map. The scene was far too much like the First Lunar War: the lengthening lists of casualties, the units falling silent one by one, and everyone waiting for her next order.\n\n The first time, she had waited until the encirclement was complete before admitting defeat.\n\n This time, she did not.\n\n “Break off the attack. All forces withdraw.”\n\n Every measure of youkai power in the gap was redirected toward the retreat. The wounded passed through first, followed by units that had lost their commanders, recovered relics, and the bodies of the fallen. Each time another detachment reached Earth, Ran struck one more number from the list of those still on the Moon.\n\n Someone urged Yukari to return ahead of the others. She shook her head.\n\n “I gave my word. I will leave no one here who can still come home.”\n\n Only after the final reply passed through the gap did Yukari retreat from the lunar sea and cross the torii. The passage closed behind her. The second expedition had failed for now—but it had not ended in another annihilation."

 yakumo.74.a:0 "Withdraw to Earth and regroup for ninety days."


 yakumo.75.t:0 "The moonlight rises again behind the torii gate"

 yakumo.75.d:0 "Ninety days later, the repaired navigation devices lit one after another behind the Hakurei Shrine.\n\n This expeditionary force was not the one that had marched before. Some soldiers still wore bandages; some had assumed the commands of those who never returned; others had chosen to remain on Earth. Yukari compelled no survivor to set foot on the Lunar Sea again, yet many returned to the torii of their own accord.\n\n Ran reported the new coordinates and every change in the Lunar Capital's defences. The kappa had fitted the supply equipment with redundant systems, while the grassroots transport corps struck off every route that had failed them last time. Defeat had not been erased from the record; it had been turned into a map of traps the next assault could avoid.\n\n Chen watched the lunar landscape take shape beyond the torii and asked softly, “Are we going to the same place again?”\n\n “The same Lunar Sea,” Ran replied, “but not the same expeditionary force.”\n\n Yukari opened her folding fan wide. Moonlight crossed the gap once more and fell upon the shrine's stone steps.\n\n “Then onward.”"

 yakumo.75.a:0 "Begin the expedition anew."


 yakumo.76.t:0 "Returning Home on a Long Road"

 yakumo.76.d:0 "As the last allied force passed through the torii gate, the wind on the ground blew into the Moon Passage. Many soldiers didn't truly believe they had returned home until they heard the rustling of leaves.\n\n Reimi and Youkai's mixed team stood guard on both sides of the gap, checking the numbers of the returning troops one by one. The Eientei medical team transported the wounded directly to temporary wards, while Youmu led Hakugyokurou's messengers to receive the belongings and souls of the dead.\n\n Myouren Temple set up a hot pot at the foot of the stone steps, and Scarlet Devil Mansion's transport vehicles unloaded medicine, blankets, and clean clothes. The former enemies did not celebrate on the high platform, but instead carried stretchers in the mud, searched for the lost, and handed warm food to the soldiers who had just returned from the Moon Sea.\n\n Ran read out the last number.\n\n “All return confirmed.”\n\n Yukari stood before the shrinking gap, not looking at the Lunar Capital palace, but only at those reunited with their families beneath the torii gates. She had once wanted to save the distant future with a war, but now she finally understood that true victory meant first and foremost bringing those before her back.\n\n After the gap closed, the various committees of Hundred Youkai Accord did not disband. The transportation, medical, and coordination systems that had sustained the expedition would continue to be used to repair the surface and the ruins left by Lunar Capital."

 yakumo.76.a:0 "Let Hundred Youkai Accord transition to joint reconstruction."

 yakumo.77.t:0 "Science and Fantasy"

 yakumo.77.d:0 "In the first research institute reopened by Lunar Capital, kappa was arguing about the structure of the Moon instrument, while Lunarian scholars were trying to create a model for sorcery that could be repeatedly observed. In the neighboring courtyard, a long-abandoned earth god received its first offering from the moon rabbit.\n\n A young researcher, gazing at the divine light that the instruments couldn't record, asked Yukari, “Can something that can't be measured be considered real?”\n\n Yukari didn't answer directly, only telling her to look back at the running machine.\n\n “Science helps you understand the laws that have already manifested; fantasy reminds you that what is not yet understood does not mean it doesn't exist.”\n\n Science doesn't lose its meaning because Youkai exists, and gods don't immediately disappear just because someone can explain lightning. One approaches the world through observation, verification, and reasoning; the other grows from faith, memory, and the space people still willingly leave for the unknown.\n\n What truly drove the two worlds to war was never the difference in understanding, but rather one side's insistence that only its own truth deserved to continue existing.\n\n The researcher restarted the instrument. The divine light still didn't appear on the reading, but she didn't rush to label it as an error."

 yakumo.77.a:0 "Let the known and the unknown coexist."


 yakumo.78.t:0 "Merry and Yukari Yakumo"

 yakumo.78.d:0 "Late at night after the celebration, Yukari returned alone to the Hakurei Shrine.\n\n She unfolded the folding fan that had been with her for many years. On the innermost fan rib, a line of almost faded writing remained—“Merry.” Centuries later, she signed “Yukari Yakumo” next to it. The two strokes, originally far apart, gradually acquired the same pauses and turns over the years.\n\n Ran appeared behind her unnoticed.\n\n “Has Merry disappeared?”\n\n Yukari gently traced the old name with her fingertips.\n\n “No. She just went too long, forgot many things, and made many irreparable mistakes. Later, the world began to call her by another name.”\n\n Merry didn't suddenly die on the day she became Youkai, and Yukari Yakumo wasn't a strange being occupying her body. Time travel, loneliness, Gensokyo, the two wars of the Moon, and everyone she protected or hurt, together brought that girl from the scientific century to the present day.\n\n Yukari doesn't need to go back to the past to prove Merry once existed; nor does she need to erase the sage's life to remember her original self.\n\n She picked up her brush and drew a thin line between the two handwritings, then closed her folding fan again."

 yakumo.78.a:0 "She never vanished into thin air."


 yakumo.79.t:0 "Under the same starry sky"

 yakumo.79.d:0 "On the first spring night after the war, Yukari placed two cups of coffee under the original torii gate.\n\n One cup was placed in front of herself, and the other was reserved for someone who could no longer keep their appointment. She could no longer remember what the Science Century Café looked like, and even brewed the coffee too bitter, but she still remembered that after each observation, there were always two seats on the table.\n\n Yukari unfolded the star map left by Renko. In the past, these lines pointed to a future destroyed by Lunar Capital, a future from which one could only flee to antiquity; now the same stars still hang in the sky, but the path to that ending has deviated.\n\n Like Renko back then, she spoke her observations based on the stars.\n\n “Time: The first spring after the end of the Second Lunar War.”\n\n “Location: Hakurei Shrine.”\n\n Yukari paused, looking at the quiet Gensokyo outside the torii gate, and then through the small gap, she saw the streetlights of Lunar Capital lit up again.\n\n “The moon is still there.\n\n The ground is still there.” She pushed the second cup of coffee to the empty seat.\n\n “Renko, we didn't go back to the original future,” Yukari said softly, “but that future, at least, no longer has only one ending.”\n\n No one answered. The stars still moved slowly above the two cups of coffee, which were gradually cooling.\n\n For Hifuu Club, this was enough to complete their final observation."

 yakumo.79.a:0 "The secret story spanning a thousand years has come to an end."

 yakumo.81.t:0 "No need for a sage's intervention today."

yakumo.81.d:0 "Yukari opened a very narrow gap by the roadside and spent the entire afternoon observing a general store.\n\n Little Youkai paid one copper coin less than she should have, but the elderly shopkeeper didn't scold her, only asking her to help carry goods next time. Kappa repaired the merchant's wheels, but the two argued for a long time about the payment, finally settling on a bag of cucumbers. Two children who had just finished arguing squeezed under the same umbrella to go home after the rain.\n\n Ran read Yukari's notes but couldn't find anything unusual worth reporting.\n\n “These things won't affect the barrier, and they're not worth observing.”\n\n “That's precisely why they're worth watching.” Yukari closed her notebook. “If only disasters and wars deserve to be recorded, then the world we've built is only alive when it's on the verge of destruction.”\n\n There was no incident today, no one crossed the line, and no one needed the sage to arbitrate. Yukari was quite satisfied."

yakumo.81.a:0 "The best outcome of her observation was that no one needed her intervention."

yakumo.82.t:0 "The shopping list has only one answer."

yakumo.82.d:0 "Yukari sent Ran to the market to buy rice, tea, vegetables, and ingredients for dinner.\n\n When Ran returned, her basket contained white tofu, soft tofu, frozen tofu, bean curd sheets, dried tofu, and a box of freshly made tofu cakes. Yukari searched the bottom of the basket but found nothing on the list.\n\n “Tofu is nutritious, its price is stable, and it can be pan-fried, boiled, deep-fried, or used in cold dishes,” Ran explained calmly.\n\n “It's enough to replace most of the originally planned purchases.” Chen pulled out a package of fried tofu wrapped in oil paper from the very bottom.\n\n “Is this also for nutrition?”\n\n “That's an emergency reserve.”\n\n “Why is the emergency reserve hidden at the bottom?”\n\n “To prevent you from stealing it.”\n\n That evening, seven tofu dishes appeared on the Yakumo family's table. Ran insisted that none of them were the same."

yakumo.82.a:0 "In the fox's ledger, tofu is never repeated."

yakumo.83.t:0 "Chen's perfect infiltration"

yakumo.83.d:0 "Ran forbade Chen from attending the meeting that day because everyone was discussing how to prepare a surprise banquet for her.\n\n Shortly after the meeting began, a cardboard box slowly made its way down the corridor. Two legs protruded from the bottom of the box, and two constantly wagging tails were visible behind it. It stopped by the door, adjusted its direction, and then casually moved under the table.\n\n No one called it out. Yukari continued discussing the banquet date, Ran continued arranging the food, and everyone pretended not to see the box that occasionally bumped into the table leg. “About Chen's favorite dish—” “Fish!” came the immediate reply from the box. The room fell silent.\n\n The cardboard box also froze in place.\n\n A moment later, Chen poked her head out. “If I said it was the box talking just now, would you believe me?”\n\n Yukari nodded seriously, while Ran silently added a fish to the banquet shopping list."

yakumo.83.a:0 "The infiltration was perfect, but unfortunately the box likes to eat fish."

yakumo.84.t:0 "The Princess's Forced Closure"

yakumo.84.d:0 "Kaguya noticed that Eientei hadn't left the clinic for several days, so she announced, in the name of the princess, that Eientei would be closed for the day.\n\n She first confiscated the clinic key. Eientei took out a spare key from her sleeve. Kaguya then found seven spare keys, and Eientei calmly opened another door hidden behind the medicine cabinet.\n\n Finally, Kaguya lay down directly on the examination bed.\n\n “I'm not feeling well.”\n\n Eirin finally stopped working: “Where does it hurt?”\n\n “My attending physician has been overworked for a long time, causing me anxiety, irritability, and a strong urge to tie her up and take her to the tea room to rest.”\n\n “This doesn't fall under the category of medical ailments.”\n\n “The patient has clearly expressed discomfort, yet the doctor refuses to treat her. Does such a diagnosis conform to the Eightfold Equilibrium?”\n\n Eirin remained silent for a moment, confirming that she couldn't find any clause to refute it. Half an hour later, the two finally sat down in the courtyard to drink tea.\n\n Kaguya announced that the treatment was successful, while Eirin categorized this case as the princess abusing the medical system."

yakumo.84.a:0 "Eirin was defeated by her own treatment guidelines for the first time."

yakumo.85.t:0 "A Lie That Doctors Can See"

yakumo.85.d:0 "Reisen walked into the clinic carrying her medicine box, claiming she was just a little tired.\n\n Eirin didn't call her out on it, but simply handed her a prescription and asked her to read its contents. Reisen read it word for word, not even noticing that the paper was still lying face down in her hand.\n\n “Your vision is unfocused, your reactions are slow, and your youkai energy fluctuations are unstable.” Eirin took back the prescription. “You didn't sleep last night.”\n\n “Moon Rabbit can fight continuously for three days.”\n\n “You've already left that army; you don't need to continue to abide by its worst rules.”\n\n Eirin wrote out a new prescription. It didn't list any medicines, only eight hours of mandatory rest, and hot porridge that she had to eat upon waking.\n\n Reisen still wanted to protest, but fell asleep after sitting on the examination table for only a short while. Eirin covered her with her coat and continued working on the documents, only making the sound of turning pages quieter than usual.\n\n Reisen complained after waking up that the prescription had no medical basis.\n\n Eirin added at the end of the record: The patient has the strength to talk back and is recovering well."

yakumo.85.a:0 "In front of doctors, “I'm fine” is never an effective diagnosis."

yakumo.86.t:0 "Lucky Carrot Grand Lottery"

yakumo.86.d:0 "Tewi Inaba launched Eientei's first Lucky Carrot Lottery. Each carrot was quite expensive, and one of them contained a golden rabbit seal. The winner could ask Tewi to grant them a wish.\n\n She printed flyers, arranged a stall, and even wrote almost illegible small print at the bottom of the rules. In less than half a day, all the carrots were sold out. Tewi sat beside a pile of coins, convinced that she had once again completed a brilliant business deal that no one could imitate.\n\n The only thing she hadn't anticipated was that Reisen, to ensure fairness, had shuffled all the carrots beforehand.\n\n Kaguya opened the carrot she had casually bought, and the golden rabbit seal fell out.\n\n “My wish is simple.” Kaguya unfolded a stack of bills. “Please have Tewi repay the outstanding warehouse payments, sort out the accounts that haven't been checked for three months, and clean up all the trash left after the event.”\n\n The lottery winnings were just enough to pay off the debt. Tewi worked until late at night, and in the end, she didn't keep a single copper coin.\n\n Her plan was an unprecedented success, except that she herself wasn't among the beneficiaries."

yakumo.86.a:0 "She gained an opportunity to pay off all her debts."

yakumo.87.t:0 "The Gardener's Gardening Course"

yakumo.87.d:0 "Youmu decides to offer a gardening course to correct the common misconception that pruning trees only requires wielding a scissor.\n\n The first lesson was simple: observe the sapling in front of you, and no one is allowed to use the scissors until they identify which branches are hindering growth.\n\n A fairy thought the sapling was thirsty and watered it three buckets in a row. Another student, in order to examine the roots, simply pulled the sapling out of the soil. Chen discovered a caterpillar on the tree and, while chasing it, knocked over a bucket full of fertilizer.\n\n Youmu spent the entire afternoon draining the water, adding soil, replanting, and even rescuing the caterpillar that Chen almost trampled. By the end of the course, not a single word of the pruning techniques that were supposed to be taught was mentioned.\n\n The students surrounded the sapling, which was barely standing upright, asking when the advanced course would begin.\n\n Youmu glanced at the teaching plan in her hand and silently crossed out the chapter on “Using a long knife to prune tall branches”."

yakumo.87.a:0 "The advanced pruning course will be postponed indefinitely."

yakumo.88.t:0 "Add a little more after it's finished"

yakumo.88.d:0 "Youmu spent the entire morning completing a dry landscape garden in the Hakugyokurou courtyard. White sand, bluestone, and a neatly trimmed dwarf pine tree complemented each other perfectly, with nothing superfluous.\n\n Yuyuko looked at it for a while, feeling the courtyard was too empty, so she placed a paper umbrella down. It seemed strange that there were no seats next to the umbrella, so she moved a table and chairs; however, having a table and chairs but no tea or snacks seemed inconsiderate.\n\n When Youmu returned, the courtyard was already filled with snacks, lanterns, and a sake pot. A ghostly musician played beside the dwarf pine tree, while several spirits danced around the white sand that had originally symbolized flowing water.\n\n “Yuyuko-sama, where is my original garden?”\n\n “It's still there.” Yuyuko pointed to the only remaining small patch of white sand under the banquet table. “I just thought that after it was finished, I could add a little more.”\n\n Youmu looked at the completely vanished blank space, and saw that all the guests were having a great time, and finally didn't know where to start tidying up.\n\n Yuyuko then announced with satisfaction that this dry landscape garden had finally come to life."

yakumo.88.a:0 "Yuyuko never allows blank spaces to be left."

yakumo.89.t:0 "Junko didn't care about the moon rabbit."

yakumo.89.d:0 "Reisen has been seeing Junko frequently lately at the edge of the Bamboo Forest of the Lost.\n\n The first time, Junko claimed she was just passing by. The second time, she brought a basket of carrots suitable for moon rabbits, explaining that Hecatia had bought too many. The third time, she even accurately pointed out that Reisen had worked two consecutive night shifts and should temporarily stop taking medication that affects sleep.\n\n “How do you know so much?”\n\n Reisen finally asked.\n\n “Just heard it.” “From whom?”\n\n Junko didn't answer. She knew when Reisen finished her patrol, knew that she rarely used the Moon's salute anymore, and knew that every full moon, one of Eientei's windows would be lit all night.\n\n “You were a soldier in Lunar Capital, yet you chose to leave,” Junko finally spoke after a long pause. “I just want to know, can someone who escapes the moon truly escape having their life dictated by it?”\n\n Reisen remained silent for a moment.\n\n “Sometimes I still dream about the past,” she said. “But I have patients waiting for me to deliver medicine tomorrow, and Tewi will definitely cause new trouble. So after waking up, I still have to get up.”\n\n Junko seemed to have found an answer. She left behind a charm that could dispel nightmares and turned to walk out of the bamboo forest.\n\n “That wasn't prepared especially for you.”\n\n “I haven't asked anything yet.”"

yakumo.89.a:0 "She just happened to know too much."

yakumo.90.t:0 "A Trend Incomprehensible to the Three Realms"

yakumo.90.d:0 "When Hecatia arrived at the meeting in this season's new outfit, everyone stopped talking.\n\n Her top featured the eye-catching words “WELCOME ♥ HELL,” with red and blue sleeves on the left and right sides respectively. Chains and miniature planets hung from her waist, and she wore only one pair of boots. Aya Shameimaru stared at the outfit for a long time, finally cautiously asking if it contained any mysterious symbolism about the operation of the Three Realms.\n\n “No,” Hecatia replied, “It's just cool.”\n\n She then showed off the new uniform she designed for the Allied Forces: a flame-shaped cape, a self-illuminating planet hat, and a short skirt printed with the location of the Hell entrance. Eirin pointed out that the glowing decorations would reveal their position at night, Ran thought the planet hat would hinder their movement, and Youmu couldn't understand why the short skirt needed twelve chains.\n\n All designs were rejected in succession. Undeterred, Hecatia handed the last sample to Junko. It was a black top with a large red X drawn on the moon on the chest.\n\n Junko examined it carefully for a moment.\n\n “This one can stay.”\n\n Hecatia immediately announced that her design had received professional approval."

yakumo.90.a:0 "This aesthetic transcends the three realms."

yakumo.91.t:0 "One Lotus Two Ghosts Three Great Eights"

yakumo.91.d:0 "Six identical invitations invited Byakuren Hijiri, Yuyuko Saigyouji, Yuuka Kazami, Yukari Yakumo, Eirin Yagokoro, and Kanako Yasaka to the same afternoon tea party.\n\n Byakuren brings tea she brewed herself, Yuyuko prepares enough snacks for ten people, and Yuuka replaces the flowers on the table with fresh ones. Eirin brings digestive medicine, Kanako insists that alcohol should also be served at the tea party, and Yukari only appears from her gap after all her work is finished. Only one card remains on the table:\n\n “Dedicated to the six most senior girls of Gensokyo—one Ren, two Yuu, and three great Ya.”\n\n After a brief silence, Kanako first questions the order, arguing that God's age cannot be compared to human algorithms.\n\n Eirin points out that the physiological age of the ageless has no statistical value, while Yukari insists that she is forever only seventeen years old.\n\n Byakuren tries to explain that age symbolizes experience and should not be considered offensive. Yuyuko didn't care at all, as she had already finished her first plate of dessert. Yuuka maintained her smile, only wondering who had sent the invitation.\n\n The next day, the *Bunbunmaru Newspaper* published a photo of the six sitting around drinking tea, with the headline “Gensokyo's Most Experienced Girls.”\n\n That afternoon, the newspaper office at Youkai Mountain was closed, and no one answered the door."

yakumo.91.a:0 "Aya Shameimaru seems to be out today."

yakumo.92.t:0 "Wrong choice of skipping class location"

yakumo.92.d:0 "In the age of science, the Hifuu Club also seriously engaged in an activity that any ordinary student could understand—skipping class.\n\n Renko and Merry evaded the university's surveillance and went to an abandoned underground observatory. There, a spatial shift that couldn't be explained by existing theories occurred, far more interesting than Professor Yumemi's afternoon theoretical physics class.\n\n The two had finished setting up their instruments and were preparing to celebrate their successful operation when the long-sealed iron gate of the observatory suddenly opened from the outside.\n\n Yumemi Okazaki walked in carrying a attendance list and a folded blackboard.\n\n “Two students are absent, and an unreported spatial anomaly has appeared in the city.” She put down the blackboard. “Determining your location isn't difficult.”\n\n Renko tried to explain that this was an independent study by the Hifuu Club. Merry quietly put away the equipment box with their names on it.\n\n Yumemi didn't ask them to return to school. She simply placed the blackboard next to the anomalous space, announced that today's teaching would be conducted in person, and assigned the two absent students to analyze the observation results.\n\n “Since you think this is more interesting than the classroom, I'll move the classroom here.”\n\n That afternoon, Renko and Merry got the field research opportunity they had dreamed of, as well as an oral exam with no preparation time."

yakumo.92.a:0 "They escaped the classroom, but couldn't escape the lessons."


 yakumo.99.t:0 "Thank you for visiting Yukari Yakumo route."

 yakumo.99.d:0 "Thank you for accompanying Yukari Yakumo on this journey across a thousand years.\n\n From the barrier crisis and the gathering of the hundred youkai to the liberation of the surface and the Second Lunar War, you witnessed her facing the failure left by the first expedition again, and you also accompanied her in answering the question that has continued since Merry's time: When different lives, memories, and the world clash, can only the strongest side decide who deserves to stay?\n\n She ultimately did not destroy Lunar Capital with Gensokyo's victory, nor did she allow Lunar Capital's science, gods, and culture to disappear along with the old regime. She preserved the boundary between the two worlds and left a door that both could open together.\n\n Because differences can make us each other, but should not be a reason to erase each other.\n\n Yukari Yakumo's story temporarily ends here, but the stories of others in the world of *Gensokyo: Coexistence or Extinction* are not yet over.\n\n No matter how you got here, thank you for accompanying her under the same starry sky."

 yakumo.99.a:0 "May the same starry sky accommodate everyone."
