 kyo_news.51.t:0 "The Lunar Capital Declares War on Gensokyo"

 kyo_news.51.d:0 "Today, several major nations simultaneously interrupted their normal broadcasts and issued identical war notices to Gensokyo. The notices referred to Youkai, God, and all life forms inexplicable by the Lunar Capital system as “surface contamination that must be eradicated,” and declared the immediate commencement of full-scale military action.\n\n Following the declaration of war, Lunarians, long hidden within the governments and armies of various nations, openly seized command. Moon Rabbit forces entered cities and military bases, and large quantities of The Moon's weapons were also transported from sealed facilities. The original military command systems of various nations were overwritten, and armies began to converge on Gensokyo-controlled areas.\n\n The Gensokyo coalition immediately entered a state of full-scale war. Yukari Yakumo announced that all parties would jointly resist the surface nations controlled by Lunar Capital and prepared to cross the gap, bringing the war directly to The Moon.\n\n The changes of government, cognitive interference, and covert military expansion that have occurred over the past few years have finally revealed their common origin. Lunar Capital is no longer hiding behind the nations of Earth; a war spanning the Earth's surface and the Moon has begun."

 kyo_news.51.a:0 "The world is recording this moment."


 kyo_news.52.t:0 "Lunar Capital's control network on the ground has been dismantled"

 kyo_news.52.d:0 "Today, the last major nation under Lunar Capital's control ceased receiving orders from the Moon. Its military command system regained its independence, and facilities used for transmitting cognitive frequencies and remote military commands across the land were shut down.\n\n With government agencies and secret bases taken over, a large amount of sealed data began to surface. Records show that heads of state and high-ranking military officials from multiple countries were replaced, and officials who opposed Lunar Capital's interference were secretly detained or deleted from public records. The Lunarian forces hidden on the surface, having lost unified command, have successively surrendered or withdrawn.\n\n The Gensokyo coalition thus completed the liberation of the surface front. The controlled nations regained their autonomy, and Lunar Capital lost its main channel for acquiring manpower, industry, and intelligence from Earth.\n\n However, the Moon's defenses have not completely collapsed. The war on the surface is over, but the battle that will determine Lunar Capital's future continues."

 kyo_news.52.a:0 "The world is recording this moment."


 kyo_news.53.t:0 "Gensokyo's allied forces achieved victory on the Moon."

 kyo_news.53.d:0 "News from the Moon confirms that the Gensokyo alliance has defeated Lunar Capital's main defenses.\n\n The expeditionary force landed on the Moon Sea through the giant gap behind the Hakurei Shrine, capturing supply nodes, spatial passages, and outer defenses in multiple rounds of battle. The Moon Rabbit's main force was forced to retreat, and the purification barrier, long considered impenetrable, became ineffective with the assistance of Eirin Yagokoro and Ran Yakumo.\n\n The alliance now controls the main roads leading to Lunar Capital, and the Moon's defense system has lost the ability to launch a large-scale counterattack. Gensokyo, who suffered a crushing defeat and retreated in the First Lunar War, have finally stepped onto the walls of Lunar Capital again.\n\n This victory has not automatically ended the remaining fighting on the surface, nor has it determined the post-war political arrangements for Lunar Capital. But it has proven that the pristine city high above the earth is neither inaccessible nor invincible."

 kyo_news.53.a:0 "The world is recording this moment."


 kyo_news.54.t:0 "Lunar Capital's purists have lost their dominance"

 kyo_news.54.d:0 "With the simultaneous collapse of the surface control network and the Moon's defenses, the Purifiers, who ruled Lunar Capital, lost all major military and administrative power.\n\n The Purifiers attempted to initiate the final purification, demanding that the garrison burn down the districts contacted by the Allied Forces and destroy Earth's control records. This was rejected by numerous Moon Rabbits, administrators, and Lunar Capital's opposition. The palace control node subsequently opened from within, and the remaining garrison ceased resistance.\n\n The Watatsuki Sisters relinquished command of the Moon's defense forces, and the Purifiers, the extreme military law apparatus, and their affiliated armed forces were disbanded. The Gensokyo Allied Forces accepted the military surrender and declared that they would not collectively punish Lunar Capital residents and ordinary Moon\n\n Rabbits based on their origins. Lunar Capital itself was not destroyed, but the regime that interfered with Earth in the name of purity, eliminated dissent, and decided whether other life had the right to exist has officially ended."

 kyo_news.54.a:0 "The world is recording this moment."


 kyo_news.55.t:0 "Eirin and Kaguya return to Lunar Capital to oversee restructuring"

 kyo_news.55.d:0 "After the collapse of the old regime in Lunar Capital, Eirin Yagokoro and Kaguya Houraisan returned to the Moon through the gap opened by Yukari Yakumo and began overseeing post-war reconstruction.\n\n As one of the founders of Lunar Capital's early institutions and city system, Eirin took over medical, judicial, and life support facilities to prevent the administrative system from completely collapsing during the change of regime. Kaguya, as the Moon Princess, organized a transitional council to protect the Moon Rabbit, surface-born individuals, and residents who had been persecuted by the Purification Institute in the past.\n\n The new authorities announced the dissolution of the Purification Institute and the extreme military command system, abolished the system of classifying residents based on their purity level, and continued to dismantle the observation, control, and cognitive interference networks spread across Earth. Lunar Capital's technology, gods, and culture will be preserved, but they must no longer be used to determine whether other worlds are eligible to exist.\n\n Eirin and Kaguya emphasized that their return was not a restoration of the old court, but rather a means to allow Lunar Capital, originally established as a refuge, to truly accommodate those who had been excluded by it for the first time."

 kyo_news.55.a:0 "The world is recording this moment."




   kyo_seija_news.1.t:0 "Lunar Capital Task Force Descends on Earth"
  kyo_seija_news.1.d:0 "The Moon's army has established occupation zones on Earth. The Moon forces have swiftly seized control of transportation and military nodes and are demanding obedience from surrounding governments. Former rulers willing to cooperate can retain their positions, but diplomacy, military equipment, and key resources will be controlled by Moon officials.\n\n Lunar Capital calls this operation a necessary takeover of Earth's order, while some governments claim that accepting the rule of a higher civilization will prevent even greater casualties. Resistance groups have begun operating in various locations, and a war spanning Earth and the Moon is brewing."
  kyo_seija_news.1.a:0 "The moon extended its dominion over the entire Earth for the first time."
  # 事件概况：月都殖民战争公开化的世界新闻，应在月军势力实际生成时触发。
  # 新闻方向：保持冷静第三人称，强调征服与政治接管，不使用紫线的灭绝或净化设定。

  kyo_seija_news.2.t:0 "Gensokyo declares war on the Moon occupation forces"
  kyo_seija_news.2.d:0 "The Gensokyo government, led by Seija Kijin, has rejected Lunar Capital's demands for submission and declared its intention to fight alongside all Earth forces resisting the Moon's rule. Gensokyo also issued the “World Flip Decision,” denying Lunar Capital the right to determine the political status of Earth's inhabitants.\n\n Even more surprisingly, Sagume Kishin, a former high-ranking member of Lunar Capital, signed the decision. Lunar Capital immediately labeled this a betrayal and warned that any nation aiding Gensokyo would be considered a hostile force."
  kyo_seija_news.2.a:0 "The rebels on Earth pointed their spears at the moon."
  # 事件概况：正邪宣战与探女签署决议合并成一则世界新闻。
  # 新闻方向：突出地月政治等级受到挑战，以及探女公开倒向地球造成的震动。

  kyo_seija_news.3.t:0 "Rebellious sentiments are spreading within the Moon Rabbit unit"
  kyo_seija_news.3.d:0 "Lunar Capital's military has acknowledged that several Moon Rabbit units have disobeyed orders, deserted, and concealed acts of resistance. Unauthorized leaflets and copies of Earth broadcasts have also been found in military camps and transport units.\n\n These materials promote an ideology known as flippancy, advocating that those in lower positions have the right to question and overthrow their oppressors. Lunar Capital has launched a large-scale search, while Gensokyo denies establishing a new vassal state of the Moon, claiming that Lunar Capital's future should be decided by local resistance fighters."
  kyo_seija_news.3.a:0 "Obedience is no longer seen as the only destiny of the Moon Rabbits."
  # 事件概况：翻转主义传播达到世界可观察规模后的新闻事件。
  # 新闻方向：让外界第一次确认月都内部出现阶级反抗，避免只写成幻想乡单方面宣传。

  kyo_seija_news.4.t:0 "The Earth-Moon War Turns Against Each Other"
  kyo_seija_news.4.d:0 "Lunar Capital's near-complete suppression operation suddenly descends into chaos. Multiple Moon Rabbit units defect simultaneously, the Earth Resistance reconnects supply lines, and launches a counterattack against the Moon Army's command nodes.\n\n Outside World cannot confirm whether this reversal stems from intelligence failure, internal mutiny, or some kind of Moon ability. What is certain is that Lunar Capital has lost its previous initiative, and Gensokyo and the Moon Resistance are pushing the battle lines towards Lunar Capital's homeland."
  kyo_seija_news.4.a:0 "The predicted defeat did not materialize."
  # 事件概况：探女与正邪共同逆转败局后的世界新闻。
  # 新闻方向：外界只看见结果，不公开探女能力的完整运作，使私人事件仍保有独特信息。

  kyo_seija_news.5.t:0 "The High Order of Lunar Capital Collapses"
  kyo_seija_news.5.d:0 "The main institutions of Lunar Capital that maintain the colonial war and bloodline hierarchy have been taken over by the rebels. The lunar forces stationed on Earth lost their legitimate command, and various cooperating governments successively declared their secession from the Moon's control.\n\n Seija Kijin refused to become the new ruler of Lunar Capital and supported the establishment of a new political organization by the moon rabbit, ordinary residents, and anti-war activists. The long-standing hierarchical relationship between Earth and the Moon was thus broken, but where this new order will lead remains unanswered."
  kyo_seija_news.5.a:0 "The Moon was forced to look up at the beings on Earth."
  # 事件概况：正邪路线完成后的世界终局新闻，可与超级事件同时触发。
  # 新闻方向：宣布殖民与等级体系瓦解，同时保留革命之后仍需继续建设的开放结局。
