l_english:
 Renko_LUN_grand_battleplan:0 "Lunarian Meticulous Preparation"
 Renko_LUN_grand_battleplan_desc:0 "The nations of Earth still issue orders in their own names, but lunar edicts have arrived ahead of the armies. Secret passages, supply depots and waiting formations must all serve the same plan.\n\nThe Lunar War High Command assigns every concentration, bombardment and reserve its appointed hour. By the time the advance force raises the lunar banner, resistance on Earth will discover that the encirclement is complete."
 Renko_LUN_commandos_Renko_isolated_combat_elements:0 "Isolated Combat Elements"
 Renko_LUN_commandos_Renko_isolated_combat_elements_desc:0 "Isolated Combat Elements"
 Renko_LUN_commandos_Renko_security_zone_operations:0 "Dispersed Element Coordination"
 Renko_LUN_commandos_Renko_security_zone_operations_desc:0 "Dispersed Element Coordination"
 Renko_LUN_commandos_Renko_rigorous_training_regimen:0 "Rigorous Training Regime"
 Renko_LUN_commandos_Renko_rigorous_training_regimen_desc:0 "Rigorous Training Regime"
 Renko_LUN_commandos_Renko_field_intel_retrieval:0 "Field Intelligence Gathering"
 Renko_LUN_commandos_Renko_field_intel_retrieval_desc:0 "Field Intelligence Gathering"
 Renko_LUN_commandos_Renko_integrated_assaults:0 "Integrated Assaults"
 Renko_LUN_commandos_Renko_integrated_assaults_desc:0 "Integrated Assaults"
 Renko_LUN_commandos:0 "Lunarian Individual Excellence"
 Renko_LUN_commandos_desc:0 "Lunarians command; moon rabbits form the elite. The army sent to Earth must uphold lunar authority through rigorous training as well as superior weapons.\n\nEvery soldier must know her place in squad fire, casualty evacuation and battlefield reporting. Even when separated from the main force in forests or streets, those in white uniforms must continue to follow the same order."
 Renko_LUN_commandos_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Individual Excellence§! doctrine."
 Renko_LUN_air_cavalry_Renko_airborne_observers:0 "Heliborne Observers"
 Renko_LUN_air_cavalry_Renko_airborne_observers_desc:0 "Heliborne Observers"
 Renko_LUN_air_cavalry_Renko_service_and_support:0 "Service & Support"
 Renko_LUN_air_cavalry_Renko_service_and_support_desc:0 "Service & Support"
 Renko_LUN_air_cavalry_Renko_rescue_liasions:0 "Rescue Liaison Officers"
 Renko_LUN_air_cavalry_Renko_rescue_liasions_desc:0 "Rescue Liaison Officers"
 Renko_LUN_air_cavalry_Renko_transport_assault:0 "Transport-Assault"
 Renko_LUN_air_cavalry_Renko_transport_assault_desc:0 "Transport-Assault"
 Renko_LUN_air_cavalry_Renko_intervention_units:0 "Intervention Units"
 Renko_LUN_air_cavalry_Renko_intervention_units_desc:0 "Intervention Units"
 Renko_LUN_air_cavalry:0 "Lunarian Air Cavalry"
 Renko_LUN_air_cavalry_desc:0 "Passages from the Moon can deliver armies, but cannot replace reconnaissance, rescue and transport at every front. Once advance troops leave their bases, someone must reach them across broken bridges and congested roads.\n\nHelicopter units follow wavelength communications, carrying observers, medics and reinforcements to the invasion force and keeping lunar command abreast of its advance."
 Renko_LUN_air_cavalry_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Air Cavalry§! doctrine."
 Renko_LUN_streamlined_deployment_Renko_streamlined_armored_layout:0 "Streamlined Armored Organization"
 Renko_LUN_streamlined_deployment_Renko_streamlined_armored_layout_desc:0 "Streamlined Armored Organization"
 Renko_LUN_streamlined_deployment_Renko_compact_assault_groups:0 "Compact Assault Groups"
 Renko_LUN_streamlined_deployment_Renko_compact_assault_groups_desc:0 "Compact Assault Groups"
 Renko_LUN_streamlined_deployment_Renko_integrated_fire_elements:0 "Integrated Fire Elements"
 Renko_LUN_streamlined_deployment_Renko_integrated_fire_elements_desc:0 "Integrated Fire Elements"
 Renko_LUN_streamlined_deployment_Renko_lightened_breakthrough_drill:0 "Lightened Breakthrough Drill"
 Renko_LUN_streamlined_deployment_Renko_lightened_breakthrough_drill_desc:0 "Lightened Breakthrough Drill"
 Renko_LUN_streamlined_deployment_Renko_economized_forward_deployment:0 "Economized Forward Deployment"
 Renko_LUN_streamlined_deployment_Renko_economized_forward_deployment_desc:0 "Economized Forward Deployment"
 Renko_LUN_streamlined_deployment:0 "Lunarian Streamlined Armor"
 Renko_LUN_streamlined_deployment_desc:0 "Armored vehicles clad in purification materials have reached Earth, but even advanced weapons need maintenance, ammunition and suitable formations. The Lunar War High Command will standardize armored equipment and replacement procedures.\n\nMedium tanks concentrate on breakthroughs, tank destroyers maintain anti-armor fire, and accompanying support serves its assigned role. The expedition can keep its schedule only while equipment and replacements continue to arrive."
 Renko_LUN_streamlined_deployment_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Streamlined Armor§! doctrine."
 Renko_LUN_infiltration_tactics_Renko_infiltration_assault:0 "Infiltration Assault"
 Renko_LUN_infiltration_tactics_Renko_infiltration_assault_desc:0 "Infiltration Assault"
 Renko_LUN_infiltration_tactics_Renko_nightly_assaults:0 "Attacks At Night"
 Renko_LUN_infiltration_tactics_Renko_nightly_assaults_desc:0 "Attacks At Night"
 Renko_LUN_infiltration_tactics_Renko_self_sustaining_infiltration_units:0 "Self-sustaining Infiltration Units"
 Renko_LUN_infiltration_tactics_Renko_self_sustaining_infiltration_units_desc:0 "Self-sustaining Infiltration Units"
 Renko_LUN_infiltration_tactics_Renko_terrain_and_situation_assessment:0 "Terrain and Situation Assessment"
 Renko_LUN_infiltration_tactics_Renko_terrain_and_situation_assessment_desc:0 "Terrain and Situation Assessment"
 Renko_LUN_infiltration_tactics_Renko_infiltration_in_depth:0 "Infiltration in Depth"
 Renko_LUN_infiltration_tactics_Renko_infiltration_in_depth_desc:0 "Infiltration in Depth"
 Renko_LUN_infiltration_tactics:0 "Lunarian Deep Infiltration"
 Renko_LUN_infiltration_tactics_desc:0 "Lunar agents entered the centers of terrestrial power before their hosts understood the danger. Battlefield infiltration demands the same patience: identify sentries, remain concealed and wait for the coordinated advance.\n\nApproach under darkness, coordinate assaults by wavelength communication and penetrate before the enemy can regroup. When the frontal bombardment begins, invasion troops should already be beyond the line."
 Renko_LUN_infiltration_tactics_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Deep Infiltration§! doctrine."
 Renko_LUN_new_base_strike:0 "Lunarian Naval Air Supremacy"
 Renko_LUN_new_base_strike_desc:0 "The oceans of Earth divide its nations and carry their armies and supplies. To enforce lunar edicts across the surface, the expedition must first command these routes.\n\nCarrier aircraft strike from the sea, submarines watch the oceans, and surface forces escort the following troops. Enemy ports, fleets and coastal positions will face a single, ordered campaign."
 Renko_LUN_long_range_submarines_Renko_ocean_patrols:0 "Marathon Patrols"
 Renko_LUN_long_range_submarines_Renko_ocean_patrols_desc:0 "Marathon Patrols"
 Renko_LUN_long_range_submarines_Renko_improved_dive_protocols:0 "Crash Dive Drills"
 Renko_LUN_long_range_submarines_Renko_improved_dive_protocols_desc:0 "Crash Dive Drills"
 Renko_LUN_long_range_submarines_Renko_support_the_surface:0 "Battlefleet Support Tactics"
 Renko_LUN_long_range_submarines_Renko_support_the_surface_desc:0 "Battlefleet Support Tactics"
 Renko_LUN_long_range_submarines_Renko_stowage_efficiency:0 "Stowage Efficiency"
 Renko_LUN_long_range_submarines_Renko_stowage_efficiency_desc:0 "Stowage Efficiency"
 Renko_LUN_long_range_submarines_Renko_deep_water_supremacy:0 "Deep Sea Supremacy"
 Renko_LUN_long_range_submarines_Renko_deep_water_supremacy_desc:0 "Deep Sea Supremacy"
 Renko_LUN_long_range_submarines:0 "Lunarian Oceanic Submarines"
 Renko_LUN_long_range_submarines_desc:0 "Terrestrial fleets can blockade ports, but struggle to see into the open ocean. Lunar submarines will watch distant routes and find opportunities for the main fleet to approach and strike.\n\nRange, concealment and stowage must support a prolonged expedition. Whenever the enemy puts to sea, it should be uncertain whether lunar weapons are already waiting below."
 Renko_LUN_long_range_submarines_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Oceanic Submarines§! doctrine."
 Renko_LUN_torpedo_primacy_Renko_modern_broadsides:0 "Modern Broadsides"
 Renko_LUN_torpedo_primacy_Renko_modern_broadsides_desc:0 "Modern Broadsides"
 Renko_LUN_torpedo_primacy_Renko_coordinated_fire_patterns:0 "Audacious Attacks"
 Renko_LUN_torpedo_primacy_Renko_coordinated_fire_patterns_desc:0 "Audacious Attacks"
 Renko_LUN_torpedo_primacy_Renko_dedicated_torpedo_task_forces:0 "Flotilla Leaders"
 Renko_LUN_torpedo_primacy_Renko_dedicated_torpedo_task_forces_desc:0 "Flotilla Leaders"
 Renko_LUN_torpedo_primacy_Renko_improved_escort_role:0 "Periscope Spotting"
 Renko_LUN_torpedo_primacy_Renko_improved_escort_role_desc:0 "Periscope Spotting"
 Renko_LUN_torpedo_primacy_Renko_task_force_integration:0 "Task Force Integration"
 Renko_LUN_torpedo_primacy_Renko_task_force_integration_desc:0 "Task Force Integration"
 Renko_LUN_torpedo_primacy:0 "Lunarian Torpedo Primacy"
 Renko_LUN_torpedo_primacy_desc:0 "Great hulls cannot keep terrestrial fleets from sinking. Screens must hold formation at night and release their torpedoes into the enemy path on a common signal.\n\nObservation, approach, salvo and withdrawal must follow precisely. Every small ship must know its station, expressing the will of the fleet through converging torpedo tracks."
 Renko_LUN_torpedo_primacy_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Torpedo Primacy§! doctrine."
 Renko_LUN_massed_carrier_fleet_Renko_deep_operative_support:0 "Carrier Force Projection"
 Renko_LUN_massed_carrier_fleet_Renko_deep_operative_support_desc:0 "Carrier Force Projection"
 Renko_LUN_massed_carrier_fleet_Renko_carrier_independence:0 "Carrier Independence"
 Renko_LUN_massed_carrier_fleet_Renko_carrier_independence_desc:0 "Carrier Independence"
 Renko_LUN_massed_carrier_fleet_Renko_crew_shifts:0 "Crew Shifts"
 Renko_LUN_massed_carrier_fleet_Renko_crew_shifts_desc:0 "Crew Shifts"
 Renko_LUN_massed_carrier_fleet_Renko_efficient_rearming:0 "Efficient Re-arming"
 Renko_LUN_massed_carrier_fleet_Renko_efficient_rearming_desc:0 "Efficient Re-arming"
 Renko_LUN_massed_carrier_fleet_Renko_unceasing_airpower:0 "Unceasing Airpower"
 Renko_LUN_massed_carrier_fleet_Renko_unceasing_airpower_desc:0 "Unceasing Airpower"
 Renko_LUN_massed_carrier_fleet:0 "Lunarian Carrier Concentration"
 Renko_LUN_massed_carrier_fleet_desc:0 "One air raid will not open the expedition routes. Carrier squadrons must strike in succession, pursuing enemy ships as they regroup, replenish and retreat.\n\nDeck maintenance, crew rotations and escort movements must prepare the next launch. These floating bases will carry the lunar offensive to more distant shores."
 Renko_LUN_massed_carrier_fleet_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Carrier Concentration§! doctrine."
 Renko_LUN_battleship_antiair_screen_Renko_all_seas_anti_aircraft:0 "High Seas AA"
 Renko_LUN_battleship_antiair_screen_Renko_all_seas_anti_aircraft_desc:0 "High Seas AA"
 Renko_LUN_battleship_antiair_screen_Renko_efficient_navigation:0 "Efficient Navigation"
 Renko_LUN_battleship_antiair_screen_Renko_efficient_navigation_desc:0 "Efficient Navigation"
 Renko_LUN_battleship_antiair_screen_Renko_broad_air_cover:0 "Air Strike Detection Priority"
 Renko_LUN_battleship_antiair_screen_Renko_broad_air_cover_desc:0 "Air Strike Detection Priority"
 Renko_LUN_battleship_antiair_screen_Renko_inaccessible_skies:0 "Inaccessible Skies"
 Renko_LUN_battleship_antiair_screen_Renko_inaccessible_skies_desc:0 "Inaccessible Skies"
 Renko_LUN_battleship_antiair_screen_Renko_capital_screens:0 "Capital Screens"
 Renko_LUN_battleship_antiair_screen_Renko_capital_screens_desc:0 "Capital Screens"
 Renko_LUN_battleship_antiair_screen:0 "Lunarian Capital Air Defense"
 Renko_LUN_battleship_antiair_screen_desc:0 "Terrestrial pilots will search for weaknesses around carriers and transports. Capital ships must guard the fleet with observation and anti-aircraft fire, preventing a sudden raid from severing the expedition route.\n\nShips cover one another and turn their batteries on command. The center of the fleet must remain ready to receive lunar aircraft when they return."
 Renko_LUN_battleship_antiair_screen_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Capital Air Defense§! doctrine."
 Renko_LUN_new_operational_integrity:0 "Lunarian Air Integration"
 Renko_LUN_new_operational_integrity_desc:0 "Lunar agents, relay stations and observation networks already operate on Earth. Once their reports reach command, aviation must turn coordinates on a map into an advantage in battle.\n\nFighters, escorts and bombers follow a common schedule so that each force entering the surface receives air support. Orders from the Moon must pass through the clouds and reach the enemy positions."
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_decoy_tactic:0 "Combat Air Patrol"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_decoy_tactic_desc:0 "Combat Air Patrol"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_three_plane_formation:0 "Moon-Rabbit Crossing Cover"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_three_plane_formation_desc:0 "Cover one another on crossing flight paths, drawing pursuers into a comrade's line of attack."
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_aggressive_spirit:0 "Naval Aces"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_aggressive_spirit_desc:0 "Naval Aces"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_naval_expertise:0 "Fighter Escort Target Spotting"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_naval_expertise_desc:0 "Fighter Escort Target Spotting"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_all_weather_operations:0 "All-Weather Operations"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_all_weather_operations_desc:0 "All-Weather Operations"
 Renko_LUN_air_subdoctrine_fighter_central_field:0 "Lunarian Air Superiority Coordination"
 Renko_LUN_air_subdoctrine_fighter_central_field_desc:0 "The wavelength communications familiar to moon rabbits will connect air formations, helping scattered aircraft answer their comrades and the fleet. Pilots must know both the enemy position and the condition of friendly units.\n\nMaintain formation through crossing cover and gain the first sighting above cloud and sea. A lunar ace should bring the formation home, along with her victories."
 Renko_LUN_air_subdoctrine_fighter_central_field_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Air Superiority Coordination§! doctrine."
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_port_strikes:0 "Shallow-Running Torpedos"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_port_strikes_desc:0 "Shallow-Running Torpedos"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_low_level_attack_runs:0 "Wavetop Attack Runs"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_low_level_attack_runs_desc:0 "Wavetop Attack Runs"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols:0 "Extensive Patrolling"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols_desc:0 "Extensive Patrolling"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training:0 "All-Weather Training"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training_desc:0 "All-Weather Training"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery:0 "Naval Strike Mastery"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery_desc:0 "Naval Strike Mastery"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics:0 "Lunarian Aerial Torpedo Tactics"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_desc:0 "Terrestrial fleets trust their harbors and the waves to shelter them. Lunar aviation will refine its approaches and identify openings both near shore and on the open sea.\n\nPatrols report targets, torpedo aircraft descend toward the water, and fighters cover the approach. Before releasing their weapons, every formation must know its course and its way home."
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Aerial Torpedo Tactics§! doctrine."
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes:0 "Widespread Drop Tanks Usage"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes_desc:0 "Widespread Drop Tanks Usage"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover:0 "All-Around Formation Defense"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover_desc:0 "All-Around Formation Defense"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors:0 "Comprehensive Pilot Training"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors_desc:0 "Comprehensive Pilot Training"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting:0 "Fighter Baiting"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting_desc:0 "Fighter Baiting"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce:0 "Fuel-Saving Expertise"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce_desc:0 "Fuel-Saving Expertise"
 Renko_LUN_air_subdoctrine_long_range_escort:0 "Lunarian Long-Range Escort"
 Renko_LUN_air_subdoctrine_long_range_escort_desc:0 "As surface bases expand, aircraft will leave familiar airfields and coasts behind. Escorts must carry protection all the way to the objective and bring their comrades back.\n\nRoutes, fuel and mutual cover belong in the same flight plan. Even far from the white lunar outposts, the expedition must not lose support on its return."
 Renko_LUN_air_subdoctrine_long_range_escort_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Long-Range Escort§! doctrine."
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_high_level_bombing:0 "Combat Box"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_high_level_bombing_desc:0 "Combat Box"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_experienced_gunners:0 "Collective Firepower"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_experienced_gunners_desc:0 "Collective Firepower"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_pilot_rescue_missions:0 "Dead Engine Prop Feathering"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_pilot_rescue_missions_desc:0 "Dead Engine Prop Feathering"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_extensive_training:0 "Veteran Crew Teamwork"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_extensive_training_desc:0 "Veteran Crew Teamwork"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_safety_landing_procedures:0 "Mass Production Reliability Improvements"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_safety_landing_procedures_desc:0 "Mass Production Reliability Improvements"
 Renko_LUN_air_subdoctrine_flying_fortresses:0 "Lunarian Flying Fortresses"
 Renko_LUN_air_subdoctrine_flying_fortresses_desc:0 "Resistance on Earth still relies on factories, railways and fortified bases. Heavy aviation will strike these targets, reducing the reinforcements and supplies confronting the expedition.\n\nDistant sorties demand trained crews, disciplined defensive fire and reliable return procedures. For lunar orders to keep reaching their targets, the crews carrying them must be able to fly again."
 Renko_LUN_air_subdoctrine_flying_fortresses_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Flying Fortresses§! doctrine."
 Renko_LUN_lunar_host:0 "Lunar Host"
 Renko_LUN_lunar_host_desc:0 "White-clad advance troops have crossed the passages between Moon and Earth, and moon-rabbit wavelength signals now sound through terrestrial camps. The Watatsuki sisters will organize these scattered forces into an invasion army capable of carrying out the edicts of purification.\n\nInfantry cross forests and riverbanks, armor follows through the openings, and naval guns and aircraft provide support in turn. Lunar weapons and arts must answer one command until the white outposts form a front reaching into enemy territory."
 Renko_LUN_lunar_host_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunar Host§! doctrine."
 Renko_LUN_lunar_host_Renko_highland_armaments:0 "Lunar Armament Standards"
 Renko_LUN_lunar_host_Renko_highland_armaments_desc:0 "Weapons from the Moon must follow common maintenance and replacement procedures. Equip the advance troops familiar with mountain paths, and support each ascent with sufficient firepower."
 Renko_LUN_lunar_host_Renko_pathfinder_breakthrough:0 "White Uniforms through the Forest"
 Renko_LUN_lunar_host_Renko_pathfinder_breakthrough_desc:0 "When trees, streets and uneven ground obscure armored sightlines, invasion infantry lead the reconnaissance. Once their positions arrive by wavelength communication, medium tanks assault through the opening."
 Renko_LUN_lunar_host_Renko_joint_fire_coordination:0 "Encirclement by Edict"
 Renko_LUN_lunar_host_Renko_joint_fire_coordination_desc:0 "Coastal guns, fleets and air formations must answer the same command. Advance troops mark targets, armor holds the breach, and following forces arrive on the timetable set by high command."
 Renko_LUN_lunar_host_Renko_assault_cohesion:0 "Invasion Battle Order"
 Renko_LUN_lunar_host_Renko_assault_cohesion_desc:0 "Moon-rabbit squads tighten their assault formations, maintaining fire and contact along narrow approaches. The next wave follows the first across the shore, with armor close behind to keep the route open."
 Renko_LUN_lunar_host_Renko_special_warfare_integration:0 "The Might of the Lunar Capital"
 Renko_LUN_lunar_host_Renko_special_warfare_integration_desc:0 "They left the Moon as separate formations. They advance on terrestrial positions under the shared command of the Watatsuki sisters. Infantry and armor train together until the whole invasion force can move at the same pace."
 Renko_LUN_adopt_designated_doctrines:0 "Establish Lunar Service Doctrines"
 Renko_LUN_adopt_designated_doctrines_desc:0 "The white outposts on Earth are establishing contact, while scattered advance troops await orders from the Moon. The Lunar War High Command will issue common campaign regulations, coordinating the army, navy, air force and invasion special forces.\n\nUpon receiving the edict, each formation must complete its training and joint exercises. When the banners rise, the forces long prepared on Earth will enter the war together."
 Renko_LUN_adopt_designated_doctrines_tt:0 "Select §YLunarian Meticulous Preparation§!, §YLunarian Naval Air Supremacy§! and §YLunarian Air Integration§!, with all §Y12§! exclusive service subdoctrines.\nSelect §YElite Special Forces§! and place §YLunar Host§! in the first special forces track.\nGrant §G1000§! mastery to each of these §Y13 subdoctrines§!, enough to complete every reward."
