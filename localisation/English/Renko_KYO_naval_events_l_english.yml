l_english:
 Renko_KYO_naval_event1_preview_tt:0 "§YEvent Preview§!: Catalogue §Cthe former Imperial Japanese naval designs§! and choose the §Ynaming language§! for ships and carrier aircraft.\nThen triggers: “§YA Message from the Future§!”"
 Renko_KYO_naval_event2_preview_tt:0 "§YEvent Preview§!: Receive “§YA Message from the Future§!” and choose whether to §Creplace the current fleet with a superior fleet§!."
 Renko_KYO_naval.1.t:0 "Choose a Language for the Designs"
 Renko_KYO_naval.1.d:0 "Due to technical limitations, the names of the ship and carrier aircraft designs I provide cannot change automatically with the game's language. Before these designs are formally entered into Gensokyo's naval register, please choose the language their names will use.\n\nThis choice will also determine whether the Combined Fleet received later uses Chinese or English names."
 Renko_KYO_naval.1.a:0 "Chinese"
 Renko_KYO_naval.1.b:0 "English"
 Renko_KYO_naval.2.t:0 "A Message from the Future"
 Renko_KYO_naval.2.d:0 "Friends of Gensokyo, if you can read this message, then you have probably already captured the former Imperial Japanese Combined Fleet. It is a vast naval force, but if you must fight the fleet of the Lunar Capital in the future, it may not be of much use. I have a proposal: hand all of your fleets over to me, and I will bring you a stronger Combined Fleet from another timeline. They should be able to hold out a little longer. However, the Lunar Capital follows more advanced concepts of naval warfare, so even this fleet will not grant you an easy victory. Do you accept this trade? —Renko Usami"
 Renko_KYO_naval.2.a:0 "Of course!"
 Renko_KYO_naval.2.b:0 "No, what we have now is fine."
 Renko_KYO_replace_naval_fleet_tt:0 "§RLose all current fleets§! and §Creceive a more powerful Combined Fleet and its associated designs§!"
