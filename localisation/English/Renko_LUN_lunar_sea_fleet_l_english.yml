l_english:
 Renko_LUN_form_lunar_sea_fleet:0 "Form the Lunar Sea Fleet"
 Renko_LUN_form_lunar_sea_fleet_desc:0 "With a naval base under lunar control, the Lunar War High Command will assemble its expeditionary fleet in a single mobilization. Capital ships will cover one another while carrier aircraft secure the skies above the sea."
 Renko_LUN_form_lunar_sea_fleet_tt:0 "Receive §Y3 naval reinforcement packages§! once. With all required designs commissioned, this grants §Y120 ships§!: 12 escort carriers, 18 heavy cruisers, 12 fleet carriers, 48 battleships (including super-heavy battleships), and 30 submarines (including submarine carriers), enough for §Y3 optimal sea-control fleets and 3 optimal submarine task forces§!. Uncommissioned ship types are skipped; aviation ships also require commissioned carrier fighter and naval bomber designs. Ships enter reserve fleets for subsequent organization.\nCarrier fighters and naval bombers are also added to stockpiles, totaling twice the ships' base deck capacity. Air wings are not created or automatically embarked."
 Renko_LUN_lunar_sea_fleet_idea:0 "Lunar Sea Fleet"
 Renko_LUN_lunar_sea_fleet_idea_desc:0 "Capital ships cover one another as carrier aviation secures the skies. Patrols, strikes, and expeditions answer to a single command, carrying the authority of the Lunar Capital to every distant shore.\n\nThis spirit grants 60% screening without screens. When the Carrier Independence reward from Lunar Carrier Concentration is also active, the modifier totals 90%."
