scarlet.31.t:"Report in the Wind"
scarlet.31.d:"The meeting room at Youkai Mountain was never warm. A draft blew in through the window cracks, ruffling the corners of the papers on the table. Megumu Iizunamaru sat at the head of the table, tapping her fingers lightly, neither urging nor asking. She knew that if Aya Shameimaru returned so quickly, it meant Scarlet Devil Mansion had already given their answer.\n\n Aya placed the camera on the table, its wings neatly folded, her smile still unhurried. “I saw her,” Aya said. Megumu Iizunamaru looked up. “Hong Meiling?”“Yes.”\n\n Aya nodded. “The gatekeeper herself.\n\n More troublesome than rumored.”\n\n She recounted the situation quickly, not omitting a single detail: the wind direction in front of the gate, the blind spot in the garden, Meiling's reaction when she raised her camera, and that sentence, which wasn't a threat but felt more like a warning.\n “She's not fierce, nor is she noisy,” Aya said, “but when she stands there, the gate to Scarlet Devil Mansion seems to have an extra layer of bones. You can hardly see her as a simple guard.”\n\n Megumu Iizunamaru didn't immediately comment, only asking one question. “What is she protecting?”\n Aya's smile faded slightly. “It's not simply about protecting a building,” she said. “It's about protecting the rules. Who can enter, who should retreat, how far can words be spoken, and where the line can be crossed—she knows it all.”\n\n She paused, then added. “What's more complicated is that she's not the kind of person who uses brute force to maintain order. She knows her limits, she knows politeness, and she knows how to turn a polite remark into “Try taking another step forward.”” Megumu Iizunamaru leaned back slightly, as if placing the name back on a chessboard.\n\n Aya looked at her, a smile playing on her lips again. “There's something else interesting,” Aya said. “Go ahead.”“The people at Scarlet Devil Mansion are more like a nation than we thought,” Aya said. “The gatekeepers are in charge, the maids manage the interior, the librarian is in charge of the brains, and the vampire princess stands at the top as queen. That place isn't just a bunch of rascals living together; it's started living by a system.”\n\n A two-second silence fell over the meeting room.\n\n Megumu Iizunamaru finally spoke, her tone flat. “Your conclusion?”\n\n Aya slung the camera back over her shoulder, her smile vanishing completely. “Scarlet Devil Mansion isn't just for show,” she said. “And that gatekeeper, she's serious.”"
scarlet.31.a:"This is not an ordinary mansion."

scarlet.32.t:"The White Wolf Tengu's Judgment"
scarlet.32.d:"Not long after Aya's report was put down, Momiji Inubashiri pushed another sheet of paper onto the table. Unlike Aya, her handwriting was straight, and the content was more rigid, like lines cut by a knife.\n “I supplemented the data on the perimeter of Scarlet Devil Mansion with information from mountain roads, wind direction, and eyewitness accounts,” Momiji said.\n\n Megumu Iizunamaru gestured for her to continue. “There aren't many extra patrols in front of Scarlet Devil Mansion, but that's not laxity; it's because Hong Meiling herself is worth an entire outpost.” Momiji's tone was serious. “She usually seems relaxed, but that's just on the surface. As long as something is wrong on the perimeter, she wakes up faster than anyone else.”\n\n Aya sat next to her, resting her chin on her hand and chuckled.\n “Didn't I already say she's troublesome?”\n\n Momiji ignored her, only looking at Megumu Iizunamaru.\n “If Scarlet Devil Mansion really wants to close down, she'll be the first, and also the hardest, obstacle.”\n\n “Why?” “Because she's not just good at fighting.” Momiji answered quickly, “She knows when to stop and when to let go. She gives people the illusion that as long as you follow the rules, there's still room for negotiation. But once she determines that you've crossed the line, she won't be slow to act.”\n\n She spread out the survey map in front of her, which was marked with several red circles and arrows.\n “More importantly, she rarely lets conflicts escalate,” Momiji said. “That means she's not the type to enjoy fighting. She prefers to keep problems outside the door, not letting the people inside get involved.”\n\n Megumu Iizunamaru looked at the picture for a while.\n “So?”\n\n Momiji paused for half a second before finishing her sentence.\n “So she's dangerous.”\n “Not because she's like a monster, but because she's like a fully trained person.”\n\n After she finished speaking, even Aya didn't interrupt, which was unusual.\n\n Momiji raised her head, her gaze steady.\n “If Youkai Mountain wants to deal with Scarlet Devil Mansion, she'd better treat her as the first hurdle to overcome.”\n “Not because she has the highest status.”\n “It's because she really can hold her ground.”"
scarlet.32.a:"First look at the gatekeeper, then the throne."

scarlet.33.t:"Scarlet Devil Mansion off-camera"
scarlet.33.d:"Hatate Himekaidou arrived last, carrying a disordered stack of notes and developed photographs. As she entered, she looked first at Aya and then at Momiji, as though checking whether they had said everything that needed saying.\n “I saw it from a different angle,” Hatate said quietly.\n\n Megumu Iizunamaru turned towards her.\n “Then tell us what you saw.”\n\n Hatate arranged the photographs one by one: gateposts, gardens, window frames, corners of corridors, and several views of Hong Meiling from behind. She did not excel at Aya's headlong intrusions or Momiji's analysis of a defensive position. Instead, she gathered the details no one deliberately noticed and that could not quite be concealed.\n “The Scarlet Devil Mansion feels strange,” she said.\n\n Aya raised an eyebrow. “Strange in what way?”\n\n Hatate pushed one photograph forward.\n “It is too orderly. Not merely clean—everyone knows precisely where to stand. The gatekeeper remains at the gate. Every maid walks almost the same distance. Even the brightness of the lamps seems regulated.”\n\n Momiji frowned. “You call that intelligence?”\n “I do,” Hatate replied. “It means the mansion is not held together by Remilia alone. Everyone inside is helping it retain its shape.”\n\n She paused before continuing.\n “And that is what makes Hong Meiling strangest of all.”\n\n Megumu did not interrupt.\n\n Hatate studied a candid photograph in which Meiling stood perfectly straight without looking threatening, as though that were simply the most natural place for her to be.\n “She is a youkai, yet she lives like a person. It is neither a disguise nor an attempt to ingratiate herself. She remembers the expressions of visitors, notices whether they are frightened, and seems to preserve the possibility that the Scarlet Devil Mansion can still be reasoned with.”\n\n Aya smiled. “So you believe she is kind?”\n\n Hatate shook her head.\n “Not kind. Restrained.”\n\n The room fell silent.\n\n Hatate gathered the last photograph into her palm, her voice still quiet.\n “A powerful youkai who insists on guarding a gate in a human way is often more difficult to face than someone who relies upon simple ferocity.”\n\n Megumu brought the three reports together. Rather than announce a conclusion, she placed one finger upon the table, weighing the red mansion anew.\n\n The tengu no longer saw only a threat called the Scarlet Devil Mansion.\n\n They saw a group whose members each knew their role and fitted tightly around one another—and the Chinese girl at the gate who stood between the entire household and the world outside."
scarlet.33.a:"Scarlet Devil Mansion, more like a country than rumored."

 scarlet.34.t: "Question under the moon"
 scarlet.34.d: "That night, the moonlight was beautiful.\n\n So beautiful that even the shadows on the exterior walls of Scarlet Devil Mansion seemed lighter. Meiling leaned against the garden railing, watching Sakuya standing to the side. She stood very straight, her shoulders taut, as if even looking at the moon was just a fleeting distraction.\n\n Meiling didn't speak immediately. She knew Sakuya wasn't the type to open up just because you asked. She kept herself too tightly guarded, like someone ready to go on stage at any moment, not daring to lower her hands even when no one was around.\n\n After a while, Meiling asked in a low voice.\n\n “Sakuya, without looking at her, only replied faintly.” “I don't understand what you mean.”\n\n Meiling smiled, not dismissed by those words. “You understand,” she said.\n “You're not just diligent in your work. You're desperately trying to fit yourself into this place, as if afraid that any slight imperfection will be immediately noticed.” Sakuya's eyelashes fluttered.\n\n Meiling looked at her, her tone still soft.\n\n “You've worked very hard to learn the rules of Youkai, the rules of Scarlet Devil Mansion, how to speak, how to stand, how to make yourself flawless.” She paused before asking the most crucial question.\n\n “What are you afraid of?”\n The night breeze rustled through the flowers, causing the roses to sway gently.\n\n Sakuya remained silent for a long time, so long that Meiling thought she wouldn't answer.\n\n But finally, Sakuya spoke. “Because I am human.”\n\n She spoke calmly, as if reciting a fact she had long memorized.\n “In Scarlet Devil Mansion, Sakuya wasn't a name; first and foremost, she was “human.”” Meiling didn't interrupt.\n\n Sakuya finally turned her head and glanced at her. Her eyes were quiet, yet more weary than usual.\n “Youkai can make mistakes, be willful, and have a bad temper, because that's where they're supposed to be,” she said. “I can't.”\n “I'm not Youkai, nor am I a blood relative. I'm standing here not because I'm entitled to be here, but because I'm useful.”\n\n She clenched her fingers into her palm, as if she were holding onto something else.\n “So I can't be slow, I can't be chaotic, I can't be imperfect. If I'm even slightly lacking, the word “human” will be the first thing to be said.”\n\n Meiling looked at her, her brows slowly furrowing.\n\n Sakuya, however, seemed to have finally spoken, her voice lower and more direct.\n “You know what? Sometimes I'm not working.”\n “I'm proving that I deserve to be kept.”\n\n When these words were spoken, the garden was so quiet that even the sound of water seemed too loud."
 scarlet.34.a: "Sakuya speaks the truth"



 scarlet.35.t: "A Question Under the Moon (Part 2)"
 scarlet.35.d: "Meiling looked at her, as if encountering for the first time that layer she usually hid so well. It wasn't perfection, it wasn't calmness, it wasn't the dignity of a head maid—it was a human being, among a group of youkai, honing herself day after day to be sharp enough, just so she wouldn't be left behind.\n “... So that's how it is,” Meiling said softly.\n\n Sakuya seemed to want to laugh, but didn't.\n “Isn't it ridiculous?”\n “Not ridiculous,” Meiling replied quickly.\n\n She straightened up a little, her tone still calm, but heavier than before.\n “Sakuya, I care about you, not because you're useful.”\n “Not because you make Scarlet Devil Mansion so beautiful.”\n\n She looked at Sakuya without flinching.\n “I care about you because of who you are.”\n\n Sakuya paused, as if she hadn't expected her to be so direct.\n\n Meiling was also silent for two seconds before slowly continuing her sentence.\n “I want to understand you because you're so special.”\n “You're human, yet you're more resilient than many Youkai; you're terrified inside, yet you stand so calmly on the surface.”\n\n She smiled, a very faint smile.\n “I don't want to just see how well you've done.”\n “I also want to know, how did you manage to push yourself to this point?”\n\n Sakuya stood there, moonlight falling on her face, revealing a hint of the vulnerability she usually hid so well. She didn't answer immediately, only turning her gaze back into the distance.\n\n After a long time, she whispered.\n “Meiling, you're really strange.”\n\n Meiling smiled.\n “Likewise.”\n\n Sakuya didn't argue anymore. She just stood there, her shoulders finally relaxing a little more than before.\n\n Meiling didn't press the matter further.\n\n She knew that it was already quite an achievement to have said all this.\n\n The moon still hung high in the sky, and the lights of Scarlet Devil Mansion were on one by one. The two stood by the garden, neither of them moving.\n\n Only from that night onwards, Meiling finally truly understood—Sakuya wasn't born to be in Scarlet Devil Mansion.\n\n She was just too afraid of losing her, so she lived her life in the way that best suited her to stay."
 scarlet.35.a: "At least, now someone wants to understand her."

 scarlet.36.t: "Meiling's Guided Tour of the Museum"
 scarlet.36.d: "The new fairy maid, carrying a broom, stood at the doorway, too afraid to even move her wings. Hong Meiling glanced at her, smiled, and waved.\n “Don't be nervous, come with me for a walk. Scarlet Devil Mansion is huge; wandering around can really cause trouble.”\n\n She first led them to the front courtyard. The stone steps, iron gates, flowerbeds, and fountain were all neatly arranged.\n “This is the entrance, the first hurdle.” Meiling patted the doorpost. “People outside see this first, so we can't be careless. Who can enter, who should stop, must get past me first.”\n\n Further inside was the hall. The chandeliers were high, the floor was bright, and even footsteps were amplified. Little fairy subconsciously softened her steps, making Meiling want to laugh.\n “Yes, that's it. This is where mistakes are most likely to happen, because Miss Sakuya can spot them immediately.”\n\n She then led her to the left. There was the dining room, kitchen, and pantry; the air smelled of bread and hot soup, and maids were busy serving dishes, keeping count, and changing shifts.\n “You'll be helping out in this area most of the time,” Meiling said. “Don't drop the plates, don't take the wrong ingredients, and—when the kitchen gets angry, it's scarier than a ghost.”\n\n Moving to the other end, the smell suddenly changed to paper, ash, and ink. The tall bookshelves stacked higher and higher, making little fairy's neck ache.\n “This is Lady Patchouli's library,” Meiling said in a low voice. “Don't touch it if you can avoid it, and ask as few questions as possible. Miss Koakuma seems easygoing, but she won't cry for you when you have to clean up the mess.”\n\n After passing through the corridor, you reach the reception room and banquet hall. Tablecloths, silverware, and candlesticks are all arranged meticulously.\n “The young lady usually meets people here,” Meiling said, glancing around. “Remember, this isn't a place for you to look around. Stand where you should stand, and keep your head down for how long—do as Miss Sakuya taught you.”\n\n Upstairs, the corridor became much quieter.\n Meiling pointed to the doors on either side. “This is the living area, with guest rooms, spare rooms, and the masters' rooms.\n\n Cleaning is allowed, but looking around is not allowed, and touching anything is absolutely forbidden.” She paused here, leading little fairy to the stone steps leading down.\n The basement door was thick, and the lock was heavy. “Finally, here,” Meiling's tone was unusually steady, “Do not approach without orders. Everyone in the mansion knows why, and you only need to remember that.”\n\n After walking around the entire mansion, little fairy was already nodding dizzily, clutching a broom. Meiling, seeing her like that, finally laughed.\n “Don't be afraid,” she patted the other's shoulder. “Scarlet Devil Mansion has many rules, but as long as you're willing to learn and work, you'll have a place.”\n\n She glanced back at the entire building, her tone softening.\n “The entrance is mine, the inside belongs to everyone. You're part of this place now too.”"
 scarlet.36.a: "I... I'll try my best to remember!"

 

scarlet.37.t:0 "A Request in the Library"
scarlet.37.d:0 "The candlelight in the Great Library burned steadily, the smell of paper, ink, and medicine mingling, making the air colder than outside. Patchouli sat behind a table, coughing twice without even looking up. Koakuma stood beside her, holding a stack of documents, unusually quiet.\n\n Sakuya spoke first.\n “I need your help.” She spread out a map, circling the alleyways and hidden lines on the outskirts of the city. “Seija Kijin doesn't rely on military force; she relies on gaps, misdirection, and incitement. I need a formula to suppress her tricks, a countermeasure to her spatial manipulation, and an intelligence network to force her out.”\n\n Meiling then placed another document on the table, her tone as relaxed as ever, but her eyes were sharp. “I also need to borrow your brains.”\n She pointed to the data in the direction of Youkai Mountain. “Tengu won't stop just because I smile nicely. I need their family lines, factions, old grudges, trade routes, and a bargaining chip to shut Megumu Iizunamaru up.” Patchouli finally looked up, glancing at Sakuya, then at Meiling.\n\n “What you want isn't just a book,” she said.\n “It's my time, Koakuma's manpower, the existing spell library, and the materials Scarlet Devil Mansion simply doesn't have right now.” Koakuma added in a low voice. “Only one side.”\n\n The room fell silent.\n Sakuya's fingers pressed against the edge of the map, her voice flat as a knife.\n\n “If Seija isn't pulled out, there will never be peace inside.”\n\n Meiling leaned against the corner of the table, not arguing, but simply pushing the file forward an inch.\n “If Tengu isn't suppressed, there will always be people watching us from the outside.”\n\n Patchouli didn't make a decision for anyone. She simply gathered the two documents together and said coldly, “Resources are only enough to bet on one side.\n Choose.”"
scarlet.37.a:0 "Give Patchouli's resources to Sakuya—cut off Seija's thorn first."
scarlet.37.b:0 "Give Patchouli's resources to Meiling—suppress the rumors about Youkai Mountain first."




 scarlet.38.t: "A person living backwards"
 scarlet.38.d: "The rain stopped. Seija Kijin huddled in a dilapidated, crumbling house, her back against the damp, cold wall, her chest aching from panting.\n\n It was quiet outside.\n The quiet made her laugh.\n\n She used to love seeing this kind of quiet shattered by herself. A few notes, a few inflammatory words, a few desperate people gathered together, and those in high positions could keep them up all night. She wasn't unaware of her own weakness, nor was she unaware that her spark could be extinguished at any moment. But she always felt that as long as someone was willing to grit their teeth, the world shouldn't be so smooth.\n\n But now, it is smooth.\n\n The grassroots were either arrested, scattered, or dead. All the familiar undercover agents had vanished, even the corners where she hid felt unfamiliar. Wherever she went, it felt like she'd bump into Sakuya's obnoxiously clean face.\n “Ha...” Seija wiped her mouth, her fingers smeared with blood and mud.\n\n “So, it turns out I'm the only one left.” Her laughter was grating, then faded. Water was still dripping from the roof, drop by drop, like someone counting her losses.\n\n She remembered those who had followed her.\n She remembered Sekibanki's stubbornness, the blindingly ruthless glint in Kagerou's eyes when she drew her sword, and Wakasagihime's cursing yet still carrying away the gunpowder. She wasn't a good leader, nor had she given anyone a decent future. All she could offer was a “fight if you disagree,” and a path that could be severed at any moment.\n\n But even something like this, Scarlet Devil Mansion wouldn't leave behind.\n\n Seija lowered her head, looking at her trembling hands. Those hands had turned the world upside down, overturned things that shouldn't have stood firm, and dragged up a bunch of people who should have resigned themselves to their fate.\n\n She had always thought she was trying to find a foothold for the weak, the poor, and the trampled underfoot.\n Now she realized that this foothold was too weak.\n\n Too weak to withstand a silver knife, a register, and a Scarlet Devil Mansion that operated like a machine.\n She gritted her teeth, her voice low and hoarse.\n\n “Why...”\n No one answered her. “Why are they born on top, and I have to rummage around on the bottom?\n\n Why do I always end up making a bigger joke of myself by desperately messing things up?”\n She slammed her fist on the ground, cracking her knuckles.\n\n “I did so much.”\n But the world never rewards effort. It only cares who is strong enough, ruthless enough, and who can make order resemble truth. She rebelled against oppression, against injustice, against the rules that divide people into superiors and inferiors from birth, only to end up being the noise that gets swept away.\n\n This wasn't losing to Sakuya.\n This was losing to a world that was more complete, more stable, and more unreasonable than hers.\n\n Seija rested her forehead on her knees, her breathing becoming increasingly erratic. She was resentful, her stomach aching with hatred, hating that fate was always biased, always favoring those in power.\n\n But beyond hatred, only one thing remained—regret.\n If only she had been more ruthless.\n If only she had acted sooner. If only she hadn't placed her hopes on those as worthless as herself.\n\n But now it was too late.\n\n The sky outside gradually brightened, a brightness that irritated her. She was still alive, but that was all she had left. Those who had charged forward with her, those she thought would at least leave their names behind, were now just dust swept away under the order of Scarlet Devil Mansion.\n\n Seija Kijin huddled in the shadows, for the first time not thinking about how to turn the tables.\n She simply watched the sky lighten, then slowly and forcefully bit her teeth into the back of her hand, as if reminding herself—this world has never been fair.\n\n And she, in the end, couldn't turn it around.\n"
 scarlet.38.a: "…Even anger was almost insufficient."

 scarlet.39.t: "Compromise on the Mountain"
 scarlet.39.d: "After the living room quieted down, Megumu Iizunamaru didn't immediately open the document.\n\n She simply sat in her seat, her fingertips pressing against the table, as if pressing back the disgust in her heart inch by inch.\n\n She disliked Scarlet Devil Mansion.\n\n She disliked how the mansion always spoke as if it had already decided the outcome for others; she disliked Remilia's style of concealing her intimidation within elegance; and she disliked Hong Meiling's polite yet unyielding attitude just now. That wasn't negotiation; it was placing a knife on the table and asking if you were willing to reach out your hand.\n\n But she disliked something else even more—\n\n In a moment of arrogance, the tengu had dragged themselves into a pointless war of attrition.\n\n Aya Shameimaru stood beside her, unusually silent. Momiji Inubashiri was also silent, her hand still on the hilt of her knife, as if she couldn't swallow the anger in her heart.\n\n Megumu Iizunamaru finally opened the document, her gaze cold.\n\n Trade rights, workshop contracts, information exchange, forgiveness of past transgressions.\n\n Each clause felt like a handout.\n\n Each clause was also practical.\n\n She knew very well that Youkai Mountain wasn't incapable of fighting, but rather that they couldn't continue fighting for the sake of appearances. Scarlet Devil Mansion was currently riding high, internally stable, and beginning to close in externally. If Tengu continued to waste its manpower on surveillance, probing, and infighting, it would only drain Youkai Mountain's own resources.\n\n Aya finally spoke, her tone slightly lower than usual.\n “Lady Megumu, are you really going to agree?”\n\n Megumu Iizunamaru didn't look up.\n “You don't want to agree?”\n\n Aya smiled, but the smile wasn't easy.\n “I don't like it.”\n “I don't like it either.” Megumu Iizunamaru said.\n\n She closed the document, her voice not loud, but harder than before.\n “Whether you like it or not isn't the most important thing right now.”\n\n Momiji frowned.\n “Making the tengu bow to Scarlet Devil Mansion won't work on the mountain.”\n “Then let them learn to submit.” Megumu Iizunamaru looked up at the sea of clouds outside the window. “Arrogance won't feed you, and vigilance won't help your tribe survive the winter. If Youkai Mountain wants to stand, it must first survive.”\n\n When these words fell, even the wind seemed to stop for a moment.\n\n Megumu Iizunamaru wasn't without fire.\n\n She did.\n\n She just suppressed that fire very deeply, enough to create a path she could walk. She hated being forced to this point by Scarlet Devil Mansion, and she knew Remilia wasn't someone worth getting close to. But she understood even more clearly that rule was never decided by personal preference.\n\n Sometimes, even the hardest orders must be swallowed.\n\n Because the tengu must survive.\n\n Even if they must live under someone they despise, even if they must share the sky with that red mansion, Youkai Mountain cannot be cut off at this moment.\n\n Megumu Iizunamaru slowly stood up and handed the document back to Aya.\n “Pass it on,” she said.\n “Cease surveillance and probing of Scarlet Devil Mansion, withdraw your peripheral informants, and exchange intelligence and passage according to the agreement.”\n\n She paused, her eyes as cold as the back of a knife.\n “And—”\n “Don't take this as submission.”\n “This is the price for Tengu to continue living.”"
 scarlet.39.a: "Even if you don't like it, you have to survive first."

 scarlet.40.t: "Lunch at the door"
 scarlet.40.d: "The midday sun didn't reach the main entrance of Scarlet Devil Mansion, only casting straight shadows on the iron railings. Hong Meiling stood by the door as usual, her hat brim pulled low, as if she could fall asleep at any moment; but if a breeze stirred or footsteps approached, she would wake up faster than anyone else.\n\n The person who brought the meal that day wasn't an ordinary maid.\n\n It was Sakuya.\n\n She carried the tray up the stone steps, her steps as steady as if she had measured them. The soup didn't spill, the tea didn't spill, even the chopsticks were perfectly aligned. When Meiling saw her, she was first taken aback, then smiled.\n “Oh my, is the head maid bringing the meal herself today?”\n\n Sakuya placed the tray on the small table next to the doorpost, her tone flat.\n “You skipped lunch yesterday, and then got called away halfway through dinner. At this rate, you'll be the doorman, not an empty shell.”\n\n Meiling blinked, looking like she'd been caught red-handed but not intending to admit it.\n “I did drink water.”\n\n Sakuya glanced at her.\n “Water can't replace lunch.”\n\n Meiling looked down at the tray; it wasn't just a random pile of things. The rice was hot, the dishes were freshly cooked, and even the tea was still at the perfect temperature. The smile on her lips faded slightly, becoming more genuine.\n “You're busy,” she said. “You can have someone else deliver this.”\n\n Sakuya straightened her gloves, her tone still clear.\n “Others might bring it, but they won't necessarily watch you finish it.”\n\n The wind blew down from the mountain path, carrying the scent of grass and a hint of dampness. Meiling looked at her and suddenly felt like laughing.\n “You're acting like you're raising a big dog that can't take care of itself.”\n\n Sakuya paused for half a second.\n “If you're willing to cooperate, I don't need to watch you like this.”\n\n Meiling sat down by the stone steps, picked up her bowl, and ate while watching her still standing there.\n “Aren't you going back?”\n “After you finish eating.”\n “Afraid I'll throw it away?”\n “Afraid you'll forget to continue eating after saying a few words.”\n\n Meiling laughed. She lowered her head and ate a couple of bites of rice, then suddenly slowed down.\n “Sakuya.”\n “What?”\n “Thanks.”\n\n The words were very soft, as soft as a small breeze blowing in front of the door. Sakuya didn't answer immediately, but just turned her gaze away a little.\n “We'll talk after you finish eating.”\n\n But she didn't leave.\n\n She stood there, watching Meiling eat every bite, watching the wind blow as usual in front of the door, watching the entire Scarlet Devil Mansion stand firmly in the daytime.\n\n For Sakuya, it was just a meal.\n\n But for Meiling, it was like a quiet acknowledgment—\n\n She was guarding the door, and she herself was being watched."
 scarlet.40.a: "Finish your meal first."

 scarlet.41.t: "The person sleeping at the table"
 scarlet.41.d: "As night deepened, the lights in Scarlet Devil Mansion went out one by one, leaving only the corner of the corridor and the offices still lit. After finishing her final round of inspections, Hong Meiling passed Sakuya's door and noticed it wasn't closed properly.\n\n She intended to point it out, but upon pushing it open, she saw scattered ledgers on the table, a half-finished shift schedule, and Sakuya asleep amidst the documents.\n\n She was a light sleeper, her brow furrowed, as if even in her dreams she was checking which page was missing a signature. The quill pen was still clutched in her hand, ink almost staining her sleeve.\n\n Meiling stood in the doorway, silent for a moment before letting out a soft sigh. “Here we go again..\n.” she murmured.\n\n She walked over, slowly removing the pen from Sakuya's fingers, and carefully gathered up the documents that were about to slide to the edge of the table. Sakuya didn't wake up, only slightly furrowing her brow when Meiling touched her wrist.\n\n Looking at her pale, exhausted face, Meiling finally bent down and lifted her from the table. Sakuya was lighter than she looked.\n\n So light, in fact, that her usual composed, sharp, and flawless demeanor was all a facade maintained by sheer willpower. As soon as she placed her on the bed, Sakuya half-awake.\n\n Her eyes weren't fully open, and her voice was still hoarse. “... Meiling?” “Yes, it's me.” Meiling took off her shoes and pulled the blanket up.\n\n “You fell asleep at the table.” Sakuya seemed to want to sit up immediately, but Meiling pressed her back down before she could even move her shoulder.\n\n “The ledger... isn't it yet—” “It won't run away tomorrow,” Meiling said.\n\n Sakuya's consciousness wasn't fully awake, but she still instinctively retorted. “The process can't be interrupted.”\n\n Meiling couldn't help but smile upon hearing this.\n “You're almost done, and you're still concerned about the process.”\n\n Sakuya frowned, as if she didn't like this statement. But halfway through opening her eyes, she was overwhelmed by fatigue again. She watched Meiling close the ledger for her, dim the light, and flatten the scattered papers again, her movements clumsy but very careful.\n “You'll forget where you put things tomorrow,” she whispered.\n “Then you can scold me tomorrow,” Meiling replied naturally.\n\n Sakuya was silent for a few seconds, as if she finally had no strength left to hold on. She buried her face a little deeper into the pillow, her voice very low.\n “...\n\n Don't go too far.” Meiling paused. “I won't go.”\n She sat on the edge of the bed, her tone very soft. “I've finished patrolling the doorway, I'll stay here with you for a while.”\n\n Sakuya didn't speak again, her breathing gradually becoming steady. She finally fell truly asleep, her fingers still clutching a corner of the blanket, as if afraid she would wake up and return to the table.\n\n Meiling looked at her and suddenly understood something.\n\n By day, Sakuya was the sharpest knife in Scarlet Devil Mansion.\n But at night, she was just someone who got tired, overexerted herself, and collapsed into her files when no one was watching.\n\n So she reached out and gently brushed aside a stray strand of Sakuya's hair.\n “Sleep, Head Maid,” she whispered. “I'll watch over you tonight.”"
 scarlet.41.a: "Sleep first, we'll talk about the rest tomorrow."

 scarlet.42.t: "Knife and Wall"
 scarlet.42.d: "The next evening, Sakuya stopped Meiling in the corridor.\n\n She had returned to her usual self, neatly dressed, with a composed expression; the person who had fallen asleep at the table the night before was not her at all. But Meiling knew from her position that this wasn't a work-related discussion. “You came into my room last night,” Sakuya said. “Yes,” Meiling readily admitted.\n “And you touched my files.”“I tidied them up.”\n\n “And you carried me to bed.”\n\n Meiling coughed and touched her nose. “Well… it was necessary.”\n\n Sakuya looked at her, as if trying to suppress her anger, or perhaps contemplating where to begin her reprimand. Finally, she simply looked away slightly. “... Thank you.”\n\n The word was spoken softly, slower than any of her usual commands. Meiling heard it, but couldn't smile; she just looked at her. “Likewise,” she said. “Thanks for yesterday's lunch too.”\n\n The wind from the corridor blew through the long windows, causing their clothes to flutter. They stood not far apart, but neither immediately took a step forward.\n\n After a while, Meiling leaned against the wall and spoke lazily. “Honestly, I never imagined we'd end up like this.”\n Sakuya looked up. “How so?” “I see.”\n\n Meiling gestured towards her, then towards herself, “One is human, the other is Youkai; one wants to arrange everything in a straight line, the other is always told she's too lenient; they don't seem like they should get along.” Sakuya, unusually, didn't immediately refute.\n\n She thought about Meiling's words for a moment, and finally replied calmly. “You're too noisy.” Meiling laughed. “You're too tough.”\n “You'll fall asleep while working.”\n\n “You'll exhaust yourself to the point of falling asleep while working.”\n\n The two sentences collided, and in the end, neither of them argued any further. Because they both knew that what the other said wasn't nitpicking, but the truth.\n\n Sakuya stood by the window, her fingers lightly touching the frame, her voice a little lower than usual. “But without you, the entrance will be chaotic.”\n\n Meiling looked at her, her smile slowly fading. “Without you, the entire mansion will be chaotic.”\n\n The corridor was silent for a few seconds.\n Sakuya didn't deny it.\n\n Meiling didn't tease her anymore. They suddenly understood one thing: Scarlet Devil Mansion wasn't held together by Remilia alone, nor was it solely driven by orders and rules. It stood firm because some people, in different positions, were filling the unseen gaps in each other's lives.\n\n Sakuya is a knife, never hesitating when moving forward.\n Meiling is a wall, never retreating when standing still. They are so different.\n\n But it is precisely because they are different that they have been able to come this far together.\n\n Meiling finally stretched with a smile. “Alright, Head Maid, you go about your business. I'll go guard my door.”\n\n Sakuya nodded, took two steps forward, and then stopped. “Meiling.”\n “Hmm?”\n\n “Lunch, remember to finish it.”\n\n Meiling was taken aback at first, then laughed out loud. “Okay.”\n\n She watched Sakuya walk away, her back still so straight, but not as cold as before. Meiling suddenly felt that this was probably the strangest, yet most perfect, aspect of Scarlet Devil Mansion.\n\n Two completely opposite people, in the end, became the most indispensable part of each other."
 scarlet.42.a: "Knife and wall, neither can be missing."


scarlet.43.t:0 "Gunpowder knocks on the city gate"
scarlet.43.d:0 "Remilia was very young then, too young to understand what “era” meant. She only knew that the castle had existed for a very long time, so long that the cracks in the walls, the candlelight in the corridors, and the night fog outside the windows seemed to be hers forever.\n\n Until that night.\n\n The first sound wasn't shouts of battle, but the roar of cannons.\n\n When the first shell hit the outer wall, the entire castle trembled. Stones shattered, and dust rained down from the vaulted ceiling. Then came the second, the third, and bursts of light exploded in the night, illuminating the towers and windows that had once belonged only to vampires, making them look like a corpse being dismantled. “Humans have broken in!” The shouts echoed down the corridor. Maids ran, servants scrambled to open doors, and an elderly vampire brandished swords and guns long out of date. But the humans outside hadn't come with pitchforks. They brought gunpowder, cannons, rows of firearms, and a pent-up rage—they didn't want to drive them away, but to annihilate the monster that had inhabited the city for so many years.\n\n Remilia stood at the end of the corridor, not yet understanding what was happening, when she heard a terrifyingly orderly command coming from outside the window. The next instant, gunfire erupted, glass shattering and blood gushing forth. She saw a familiar servant fall, a bullet piercing his chest, his body slamming backward against the wall, barely managing a half-uttered cry.\n\n Someone scooped her up. “Young lady, run!”\n\n Flandre was already there when she was shoved into another corridor. Her younger sister, even younger than her, huddled against the wall, her eyes blank with shock, wings pressed tightly against her back, forgetting even to cry.\n\n Remilia grabbed her hand, for the first time truly feeling that fear wasn't just a legendary word, but something that made you sweat, tremble, and pound your heart as if it would burst.\n\n The castle doors were being blown open.\n Human firearms were being pushed into room by room.\n\n And that old night, belonging only to vampires, was beginning to crumble amidst the gunfire."
scarlet.43.a:0 "Run, Flandre!"

scarlet.44.t:0 "Burning Corridor"
scarlet.44.d:0 "They fled deeper into the castle.\n\n It wasn't a directional retreat; they simply avoided artillery fire, collapses, and the human soldiers charging in with muskets. Section after section of the corridor burned, ceilings cracked, paintings fell, and flames climbed up the curtains, turning the once magnificent halls into infernos. Remilia pulled Flandre forward.\n\n She was still young and lacked strength, but she clung tightly to her sister. “Don't stop!” Flandre ran, stumbling and falling.\n\n She was too young to keep up with this frantic escape. The castle was filled with smoke, heat, gunfire, and the stench of blood; Flandre's breathing quickly became erratic, and her steps grew increasingly unsteady.\n\n Just as they rushed through a half-collapsed corridor, a row of muskets outside aimed at the windows. Gunfire erupted.\n\n Remilia only had time to pull Flandre down.\n\n Broken glass, lead bullets, and hot wood chips swept in. Flandre let out a short scream as half of her wing was instantly blasted off, feathers and blood scattering everywhere. She fell to the ground, too pained to stand. “Flandre!” Remilia turned to catch her, but the next second, she herself was shot twice in the shoulder and side.\n\n The impact made her stagger, her foot slipped, and the two of them fell into the shadows against the wall. The soldiers' footsteps grew closer.\n\n The torchlight flickered in, illuminating the corner where they were hiding.\n\n Someone shouted, “They're over there! Burn those two too!” Remilia gritted her teeth, holding Flandre in her arms.\n\n Blood seeped from her own wounds, burning her until she felt dizzy. For the first time, she realized that fate wouldn't grant you any respect just because you were a vampire, a noblewoman, or a Scarlet. They couldn't escape anymore.\n\n The castle was destroyed, the exits were blocked, guards and servants lay dead everywhere, even the night couldn't save them. Flandre huddled in her arms, her wings torn beyond recognition, her body trembling violently.\n\n She was in too much pain to speak complete sentences, only able to call out “sister” over and over again.\n\n Remilia hugged her tightly, but her chest sank lower and lower.\n\n For the first time, she understood that there were things she couldn't hold onto.\n\n The next moment, when Flandre looked up, her eyes were different."
scarlet.44.a:0 "Don't look, Flandre..."

scarlet.45.t:0 "The Moment It Broke Down"
scarlet.45.d:0 "Flandre fell silent. That silence was very strange.\n\n It wasn't because she was no longer in pain, but because something far more terrifying was awakening from the deepest part of her body.\n\n She looked up at the approaching humans. Torches flickered in her eyes, gun barrels flickered in her eyes, and the whole burning world seemed to have turned into a pile of fragile and disgusting things. Her small chest was still rising and falling, but her fingers slowly rose, as if grasping at a point that no one could see.\n\n “No—” Remilia's words were barely out of her mouth before it was too late. The first soldier, the moment he charged forward, was crushed as if by an invisible hand. Not cut open by a knife, not pierced by a bullet, but his bones and flesh shattered into a heap. Before the people behind could even react, the second, the third, followed suit. Screams filled the corridor in an instant, only to be drowned out by an even louder explosion.\n\n Flandre stood up. Her shattered wings were still dripping blood, but her eyes shone with a maddening light. She seemed completely unaware of what she had done, simply following her uncontrolled instincts, treating everything she saw as something to be destroyed.\n\n Soldiers, muskets, walls, pillars, doors, stairs.\n\n The entire castle began to collapse.\n\n Some knelt and prayed, some turned and fled, some tried to fire, but nothing could outrun Flandre's destruction. She was no longer a little girl, no longer just Remilia's sister. In that moment, she became an unstable monster, a calamity that wouldn't even stop itself. Flames leaped upwards, and stone walls collapsed in sections.\n\n Those humans who had stormed the castle with anger, gunpowder, and the thought of “annihilating the vampires,” were all buried in the destruction they themselves had set ablaze.\n\n Remilia lay on the ground, watching her sister stand in the center of the collapse, as if witnessing fate finally revealing its ugliest true face. This was not victory.\n\n This was not a counterattack.\n\n This was the sound of everything breaking down together.\n\n The vampire castle was destroyed.\n The humans who slaughtered the vampires were also dead.\n\n And Flandre, from this moment on, could no longer simply be the little sister who followed behind her."
scarlet.45.a:0 "Flandre... stop!"

scarlet.46.t:0 "Exile after the ruins"
scarlet.46.d:0 "When Remilia woke up again, it was almost dawn.\n\n She lay in the rubble and ashes, surrounded only by the smell of burnt wood, dried blood, and smoke dispersed by the morning breeze. The castle was gone. The towers, the corridors, the banquet halls, the night outside the windows—all were buried beneath the ruins, as if they had never existed.\n\n She moved, and her wound immediately turned black with pain. The gunshot wound in her shoulder was still bleeding, and her side felt like it had been burned.\n\n But her first thought wasn't for herself. “... Flandre.”\n\n She struggled to her feet, searching among the broken walls and rubble, finally finding her under a collapsed archway.\n\n Flandre was still alive. She was curled up there, her wings torn beyond recognition, her hands and face covered in blood and ash.\n\n She neither cried nor laughed, just stared at the empty space ahead, as if she hadn't yet recovered from the chaos of the previous night. Remilia went over, knelt down, and pulled her into her arms.\n\n Flandre didn't resist, only trembling slightly at the touch.\n\n They were all still alive. But only they were still alive. Remilia, holding her younger sister, looked up at the sky that no longer belonged to them. She suddenly knew they couldn't stay here. Humanity wouldn't stop; new armies would come, new guns would come; and her sister in her arms had become a monster that even she didn't know when it would explode again.\n\n From this moment on, they were no longer the masters of that ancient castle.\n\n They became survivors.\n\n They became exiles. Remilia slowly stood up and carried Flandre on her back. Flandre was still young, and her body was still bleeding, but she had no other choice.\n\n She looked back one last time.\n\n It wasn't a farewell.\n\n It was a remembrance. Remember how humans stormed in with gunpowder and cannons, remember how vampires were hunted by the times, remember how your sister broke down on the brink of death, and remember how you awoke from the ashes, truly beginning to hate fate for the first time.\n\n Then she turned, carrying the unstable child who was still her sister's, and left the ruins step by step.\n\n The vampire's exile began here."
scarlet.46.a:0 "We are still alive, that's enough."

scarlet.47.t:0 "A vow in the embers"
scarlet.47.d:0 "Myouren Temple did not quiet down with the end of the civil war.\n\n Byakuren died, and Shou Toramaru died too. The temple burned down, the scriptures scattered, the bells stopped ringing, but the survivors were still alive—and the survivors were the hardest to deal with.\n\n At night, only a few dimly lit lamps illuminated the ruined temple. Nazrin wrapped her cloak tightly, still clutching the pagoda in her hand, as though gripping the last ember of a relic that refused to die. She spread the map on the broken altar, marking Scarlet Devil Mansion, supply lines, patrol points, and members' habits with tiny marks. “We're not going to our deaths,” she said, her voice low but sharper than a knife. “If they feel pain, let it be deep in their bones. If they're afraid, let them wake up every day and check if their necks are still there.”\n\n Minamitsu Murasa leaned against the shadows, her fingertips tapping the corner of the table, her eyes as dark as the seabed. “Who to choose first?” she asked.\n Nazrin raised her eyes, her gaze sweeping over the names of Scarlet Devil Mansion. “The gatekeeper, the head maid, that witch in the library... and that vampire who thinks she can write everything down as destiny just by sitting on the throne.”\n\n Ichirin Kumoi stood to the side, her fists clenched tightly. Nyudo's shadow flickered behind her, like barely suppressed rage. “Byakuren-sama has saved too many people,” she said, “They crushed all of this and still expect us to bow down.\n\n I can't swallow this.” Nazrin placed the pagoda on the table, making a very soft clinking sound. “Then don't swallow it.” She looked at the group of people who had still stayed, her eyes devoid of fanaticism, only hardened by pain. “Byakuren-sama and Shou-sama died honorably on the battlefield.”\n “We are different. We survived to let Remilia know—Myouren Temple is not dead, and the fire of Buddhism has not been extinguished.”\n\n The wind outside blew through the torn window paper, scattering the embers. Some were silent, some nodded. No one mentioned surrender.\n\n From that night on, the remnants of Myouren Temple were no longer just losers.\n\n They became shadows. They became daggers.\n\n They also became the reason why Scarlet Devil Mansion could no longer sleep peacefully."
scarlet.47.a:0 "They haven't given up yet."

scarlet.48.t:0 "The Mouse's Mistake"
scarlet.48.d:0 "The first assassination attempt failed.\n\n Nazrin's calculations were spot on. She knew the crowd during the speech would be the most chaotic, and she knew the red mist, firelight, flags, and panic would conceal her attack. She even considered that if she could pierce Remilia on the spot, it would be worth dying in the audience.\n\n But she missed.\n\n The beam grazed the Queen, exploding Scarlet Devil Mansion, not that damned vampire. As the crowd collapsed, she tried to retreat, but Scarlet Devil Mansion reacted as if it had been waiting for this moment. Sakuya's sword, the gatekeepers' blockade, the soldiers' rifle butts—in the end, they dragged her out of the crowd. The dungeon was cold.\n\n Nazrin was chained to an iron chair, her hands bound until they were white, her pagoda stolen and placed where she could never reach it. When she looked up, Remilia stood outside the cell door, her cloak hanging down like a patch of blood obscuring the moon.\n “A rat,” Remilia said, looking at her with a cold laugh, “quite bold.” Nazrin spat out a breath of bloody breath.\n\n “I didn't kill you, it was an accident,” she said through gritted teeth, “It wasn't my fault.” Remilia's eyes didn't move.\n\n “Does it make a difference?”\n\n She took a step forward, her high heels clicking on the stone floor like the last few heartbeats of a person.\n “You think the people who blew up my house and assassinated me can save their lives with “belief”?”\n\n Nazrin laughed, a hideous laugh, but it didn't fade.\n “You don't understand.”\n “Byakuren-sama is dead, Shou-sama is dead, but they didn't lose. What lost was something like you—winning the world, but never winning people's hearts.”\n\n The dungeon was silent for a moment.\n\n Remilia suddenly laughed too, a laugh as light as a knife.\n “People's hearts?” she said, “Things that can go hungry, change, and betray, I've never cared for.”\n\n She turned around and slowly straightened her gloves.\n\n “Execution tomorrow.” “Hang her on the platform, let everyone see: the remaining loyalty of the Myouren Temple, in the end, is nothing more than this.”\n\n The moment the cell door closed, Nazrin finally lowered her head.\n Not out of fear. But because she knew this time, there was truly no next step.\n\n Even here, what she thought of was still that figure who always stood firm, always looking down at her. Lord Shou.\n\n Wait a little longer.\n\n She thought.\n\n At least before I die, let me see you one more time."
scarlet.48.a:0 "Tomorrow, a public execution."

scarlet.49.t:0 "The flame of Buddhism has not been extinguished."
scarlet.49.d:0 "The execution platform was set up in the center of the square, not far from where Remilia had given her speech a few days ago. This time, there were no fireworks, no declarations, only chains, ropes, soldiers, and a face forced to watch.\n\n When Nazrin was led onto the platform, she walked slowly but straight. She was covered in wounds, her cloak was torn, and dried blood was still stained around her ears. The crowd whispered below; some cursed her for being stupid, some were too afraid to look up, and some looked at her as if she were a madwoman who knew she would die but still insisted on charging forward.\n\n Remilia did not go onto the platform herself, but sat high up, watching coldly.\n “Remnants of the Myouren Temple,” the voice proclaimed loudly, “assassination of the monarchy, an unforgivable crime.”\n\n Nazrin didn't hear the rest.\n\n She simply looked up at the grey sky.\n\n As her vision began to blur, she truly saw it. It wasn't the square, the ropes, or those blurry figures. She saw Shou Toramaru standing in a farther, brighter place, as quiet as before, holding the pagoda that should have been hers. There was no blood, no fire, and no ashes of war.\n\n Nazrin's lips trembled, and her eyes softened for the first time. “Lord Shou...” she murmured, almost inaudibly.\n “This time, I didn't do well.”\n\n No one in the audience knew what she was looking at.\n Only Nazrin herself knew that it wasn't an illusion, but the last hope she could grasp.\n\n She smiled, and a hint of warmth finally appeared in her eyes.\n\n “Next time...” she gasped, her voice broken, “If there really is reincarnation, don't be born into this rotten world again.” “Go to a better place.”\n The rope fell.\n\n The square fell silent for a moment.\n\n In the crowd, Minamitsu Murasa pulled her hat brim low, her fingers clenched until they turned white.\n\n She watched Nazrin's figure slowly come to a stop, her eyes so black they seemed to want to devour the entire execution platform.\n\n Ichirin Kumoi stood beside her, her jaw clenched so tightly it trembled. Nyudo's shadow flickered slightly behind her, like suppressed rage.\n “Charging in now will only lead to mutual death,” Murasa whispered.\n\n Ichirin didn't turn around, her gaze fixed on the body on the stage that had just been speaking.\n “I know.”\n “Then endure it.”\n\n Murasa's voice was even lower, as if rising from the depths of the sea.\n “Wait for next time.”\n\n Ichirin finally nodded.\n\n Remilia's rage hadn't deterred them.\n Nazrin's death hadn't extinguished the last embers of the Myouren Temple.\n\n After the execution that day, the blood on the square was quickly washed away, and the ropes were taken away, as if nothing had happened.\n\n But both Minamitsu and Ichirin knew— This wasn't the end.\n\n This was just the Buddha's flame continuing to burn in a darker, longer way.\n\n"
scarlet.49.a:0 "They will wait, until the next time."

 scarlet.50.t: "The Dancer's Last Step"
 scarlet.50.d: "Time seemed to stretch out before the knife fell.\n\n Satono Nishida's breathing was erratic, sweat trickling down her forehead and staining her torn tutu. She still wanted to straighten her back, still wanted to look like the dancer who could convey the will of the god of the back door. But the ropes were too tight, her knees too weak, and her blood was flowing too fast.\n\n Mai Teireida stood beside her, almost deathly silent. She no longer looked at the people below the stage with their heads bowed, nor at the Scarlet Devil Mansion soldiers with their mocking expressions. She just stared into the depths of the red mist, as if waiting for a door that would never truly close.\n “Mai,” Satono suddenly called her softly.\n\n Mai turned her head, her eyes still calm.\n “Hmm.”\n\n Satono forced a smile through gritted teeth; the smile was no longer pretty, just a last shred of bone holding it together.\n “How ugly.”\n\n Mai looked at her and even smiled softly.\n “Yeah.”\n “Being forced up here by this kind of guy, and then having to watch her like a show.” Satono raised her head, the last spark of fire in her eyes still burning.\n\n “It's disgusting.” Remilia stood in front, as if she hadn't heard, or as if she didn't care at all.\n\n She just looked down at them, like looking at two obstacles that would soon be removed.\n Satono suddenly turned her gaze to her, her voice rising abruptly.\n\n “Listen, vampire!”\n The crowd in the square trembled. “You can cut off our heads, you can hang us up for everyone to see.” She gasped, blood still at the corner of her mouth, “But don't really think you're stepping on two dancers.”\n\n Her eyes gleamed fiercely.\n “We are the hands and feet of the God of the Back Door, the shadows extended from the Sage's hand. What you're cutting off today isn't two lives, it's tearing off the Sage's face.”\n\n Mai Teireida finally spoke slowly. Her voice wasn't loud, but it was colder than Satono's.\n “You're standing very high now,” she said, “but standing high doesn't mean you can see far.”\n\n She looked at Remilia as if she were looking at someone who had already stepped into a trap without realizing it.\n “The back door isn't where you can see it.”\n “You think you've sealed everything off, but that's only because you don't know that some doors are never meant for people like you.”\n\n The executioner's blade trembled slightly in mid-air.\n\n Satono suddenly laughed even harder, as if she were burning her last breath.\n “Come on!” she shouted, “Hang us up! Let those hiding people see clearly, this is your way of the king—a king who proves she's not a monster by beheading!”\n\n Mai closed her eyes, as if finally letting go of something.\n “Lady Okina will see,” she whispered.\n\n It was unclear whether she was speaking to Satono, herself, or Remilia.\n\n The next instant, the blade finally fell.\n\n As the blood splattered, the red mist seemed to tremble as well.\n\n They didn't kneel.\n\n Not even at the very last step."
 scarlet.50.a: "They reserved their final disdain for the throne."

 scarlet.51.t: "The Wrath of the God of the Back Door"
 scarlet.51.d: "The blood on the square hadn't even dried yet, and the back door was already open.\n\n It wasn't a door anyone could see, not a door built into the wall, nor a door that the soldiers of Scarlet Devil Mansion could smash open with their rifle butts. That door opened behind sight, in a blind spot of rules, in every crack that the sage's wrath could reach.\n\n Okina Matara stood behind the door, watching the entire execution.\n\n She didn't intervene.\n\n It wasn't that she didn't want to, but that she saw it all too clearly—this was exactly what Remilia wanted. She would use her two heads to make the remnants tremble; she would use the dancer's blood to test the sage's bottom line. She was even deliberately waiting for the god of the back door to appear, so that she would have a reason to raise her sword again.\n\n Seeing clearly doesn't mean one can endure.\n\n Okina lowered her eyes, watching the two bodies that had just been speaking and dancing for her being dragged away. Her face showed little emotion, only her fingertips slowly tightened, as if she wanted to crack the entire door.\n “... Very good.”\n\n She spoke softly, yet the air in the entire back door seemed to grow cold.\n\n Satono and Mai were her dancers, the hands she placed before others, the shadows that trampled on the ground for her, dancing their will for the world to see. They could die, they could be defeated, they could be driven to a dead end—but they shouldn't be hung on this stage like two trophies.\n\n The dignity of a sage is not for vampires to trample on and establish their authority.\n\n Footsteps came from behind the door. They weren't human footsteps, nor were they the trained, rhythmic footsteps of Scarlet Devil Mansion; rather, they were approaching with unease and restlessness.\n “Lady Okina…” a voice whispered, “Should we make our move?”\n\n Okina didn't turn around.\n\n She remained gazing at the plaza, at the red mist, at Scarlet Devil Mansion, the place she thought she had trampled underfoot.\n “Now?” she asked softly.\n\n The voice immediately fell silent, no longer daring to answer.\n\n Okina finally smiled. The smile was thin and cold, like a knife gliding along bone. “No.”\n “She's at the height of her power right now, and her blade is hot.”\n “Rushing in at this time will only make her look more like the winner.”\n She raised her hand, her fingertips lightly tracing a line in the air, and a new back door silently opened beside her.\n\n There was no light inside, only bottomless darkness.\n “But she always has to sleep.”\n “Always has to loosen.”\n “Always thinks she's really sealed all the doors.”\n\n Her voice grew softer and softer, and more and more dangerous.\n “Then I'll let her know that the Sage isn't something she can use to hang her head on for amusement.”\n\n She took one last look at the plaza.\n “Remilia.”\n\n This time, she finally uttered the name completely.\n “You will pay for what happened today.”\n\n The back door closed immediately.\n\n The red mist still hung over the plaza, the throne still stood high, and the crowd in the plaza still trembled.\n\n But some doors had already opened where they couldn't be seen."
 scarlet.51.a: "The Sage's debt hasn't even been settled yet."


 scarlet.52.t: "Giving on the Road to Exile"
 scarlet.52.d: "I still remember the churches I saw during my exile in Europe.\n\n The bells were loud, the doors were high, and the saints in the stained glass windows all bowed their heads and lowered their eyes, as if they were truly pitying the world. Kneeling outside were mothers shivering from hunger, old people holding their dead children and refusing to let go, and a group of vagrants who didn't even have shoes. They put their last copper coin into the offering box, as if entrusting their lives to something unseen.\n\n The clergy stood on high, their robes clean, their voices gentle.\n “Endure. God will see your suffering.”\n “Give. The Lord will remember your piety.”\n “The dead are not truly dead; they will be saved in heaven.”\n\n How eloquent!\n\n I stood in the shadows, watching those people comforting others while collecting money. The poor stuffed money for bread into their wooden chests, the rich tossed in silver coins, and received a louder blessing in return. The candles in the church burned brighter than anyone else's, the broth in the kitchen smelled better than anyone else's, yet the people outside were still hungry, still sick, still collapsed in the snow.\n\n A monk even said to the refugees, “The Lord is testing your faith.”\n\n Testing?\n\n All I saw was business.\n\n They wrapped other people's fears in scriptures, exchanged other people's tears for copper coins, and then called all of this compassion. Those high and mighty beings were never saving people. They were just making sure that those who were about to starve didn't learn to be angry before they died of starvation.\n\n The most useful thing about religion isn't salvation.\n\n It's making people continue to endure."
 scarlet.52.a: "They don't sell hope, they sell anesthesia."

 scarlet.53.t: "God won't come out of the fire."
 scarlet.53.d: "Later I saw more.\n\n I saw villages torn apart by werewolves, houses burning, blood flowing down the muddy roads; I saw humans huddled in corners, clutching crosses, chanting names incessantly, as if believing that if they chanted them a few more times, a miracle would occur. And what happened? The werewolves still bit through their necks, the fire still burned through the roofs, and the screams still fell silent in the middle of the night.\n\n God didn't come. But the clergy came.\n\n After everything was over, they walked into the ruins wearing clean robes, made the sign of the cross to the survivors, and said that this was a trial, original sin, an arrangement that God did not wish to reveal. Someone asked, “Then why did my child die?”\n\n They answered, “Because the Lord has His own will.”\n\n Someone asked, “Then what's the use of prayer?”\n\n They answered, “At least your soul won't be lost.” How beautiful.\n\n They can't save you while you're alive, but after you're dead, they'll take your tears and wrap them in a noble but meaningless statement.\n\n I even saw people selling relics, amulets, and strips of cloth soaked in holy water after the disaster, each item more expensive than the last. Those clergy talked about charity, but their hands were faster than anyone else's, first taking the donations into the church, then selling the means of survival to those who already had none.\n\n So I understood long ago.\n\n In this era where even the most cunning can crush villages, and people's hearts are more fragile than glass, religion is not light.\n\n Religion is poison.\n\n It makes the weak believe that forbearance is a virtue, makes the desperate surrender their last resistance on their knees, and allows a group of hypocritical faces to trample on the suffering of the masses, calling corruption divine will.\n\n If there is anything truly worth believing in this world, it is certainly not the charity in churches that collects money.\n\n I would rather believe in fire, believe in the knife, believe in the power in my own hands.\n\n At least they don't lie."
 scarlet.53.a: "If religions won't shut up, I'll shut up for them."


 scarlet.54.t: "The man whose name was crossed out"
 scarlet.54.d: "He used to have a name.\n\n It wasn't a nice name, nor was it particularly memorable; it was the kind of ordinary name you'd only find in alleyways, run-down taverns, and old registers. But after Scarlet Devil Mansion took over, the name first became a marker, then a problem. Some said he'd delivered messages for the old regime, some said he'd hidden grain for the rebels, and others said he'd just drunkenly cursed “that vampire.”\n\n In the end, none of that mattered anymore.\n\n What mattered was that the paperwork had come down. Two soldiers knocked on his door at dawn, their movements gentle, even checking the address and register number first. A neighbor peeked through the paper window and saw him bound with a thick rope, a wooden tag with a number hanging around his neck. He didn't struggle, nor did he shout. He just stood at the door, glancing back at the small table inside that hadn't been put away yet, as if suddenly realizing that after living so long, all he could take with him was this little bit of memory.\n\n When the truck door closed, he finally whispered, “What did I do?”\n\n No one answered. At the labor camp, his name was completely erased. People called him by his number, like a tool. By day, he moved stones, carried logs, and dug ditches; by night, he huddled behind barbed wire, listening to others cough and wail. There was no god here, no place for reason. Only shifts, whistles, hunger, and one thing everyone learned quickly: Don't ask.\n\n He sometimes thought of the new roads, the rations that came out on time, and the bowls that were no longer empty in the children's hands.\n\n Scarlet Devil Mansion had indeed made many things better.\n\n But so what? Those who were arrested didn't feel any less pain because of the order outside. Those whose names were crossed out didn't become human again just because the city prospered.\n\n One night, leaning against the cold wall, he heard a new prisoner whisper, “Is Remilia really that great?”\n\n He was silent for a long time, and finally just smiled.\n “Maybe to those standing outside.”\n “But for us, those caught in the process, she's not the queen.”\n “She's the closed case.”"
 scarlet.54.a: "The erased name won't sing praises for the queen."

 scarlet.55.t: "Model citizen"
 scarlet.55.d: "Her family used to always lack things.\n\n Half a bag of rice, half a box of medicine, half a pot of lamp oil. The streets were unsafe at night; a child's cough was a serious matter, and if someone was unlucky, they'd mostly only receive a few words of pity the next day.\n\n After Scarlet Devil Mansion took over, these things gradually decreased. The roads were repaired, rations were on time, and patrols passed the street corner at fixed times every day. When she first received a full amount of food coupons, she was stunned for a long time, as if she couldn't believe that such a thing would actually happen to her family.\n\n So when the village chief asked everyone to learn the new rules and memorize the new slogans, she didn't hesitate.\n “Remilia is wise.”\n “Thanks to Scarlet Devil Mansion for bringing stability.”\n\n She memorized them quickly and accurately.\n\n It wasn't because she was particularly loyal, but because she truly saw her children well-fed, her husband's injuries treated with medicine, and that someone finally patrolled the streets at night, so she no longer had to guard the door with a wooden stick. These things were so practical, so real, that they made her swallow many doubts.\n\n One day, the people next door suddenly disappeared. The door was closed, the bed was neatly made, and the bowls were still on the table, as if they had just gone out for a short while. No one in the neighborhood mentioned it; the neighborhood chief only said that the family was on the “inspection list” and told everyone not to ask any more questions.\n\n She couldn't sleep that night. But the next morning, the child was still hungry, bread was still being handed out on the street, and the pharmacy was still open. Standing in line, watching people bow their heads in thanks one after another, she suddenly understood something: in this new world, the safest way to live wasn't to know too much, but to stand on the right side.\n\n From then on, she cooperated even more diligently. She sat in the front row at meetings, didn't fall behind when reporting, and when people from Scarlet Devil Mansion came to inspect, she would proactively offer them tea and remind her child to bow and greet soldiers first.\n\n Some people privately criticized her for being weak. She heard it, but simply straightened the hem of her clothes.\n\n “You can call me whatever you want,” she whispered, “but my family is alive now.” She wasn't unaware of those being taken away, nor was she unaware that fear was working for order.\n\n She simply chose a different path. Living in Remilia's shadow."
 scarlet.55.a: "For those who have enough to eat, security itself is a blessing."

 scarlet.56.t: "Notes from America"
 scarlet.56.d: "He came from America, carrying a notebook, a camera, and a somewhat out-of-place accent.\n\n On the surface, he was a journalist observing post-war reconstruction. In reality, even he himself couldn't say whether he was documenting a newly emerging regime or a highly efficient, packaged experiment in governance. The first scene he saw was orderliness.\n\n The streets were wider, shops were open, grain sacks were piled high, and factory chimneys burned day and night. Children chased each other on street corners, adults lined up for rations, and soldiers patrolled with almost no unnecessary movements. By an outsider's standards, the order here was astonishing.\n\n But he soon saw a second scene.\n\n Whenever certain names were mentioned, people around would pause; whenever a missing neighbor was asked, the answer was always “I don't know”; whenever a truck drove by in the distance, the crowd would instinctively make way, as if clearing space for some unspeakable process.\n\n He tried interviewing a woman. She first said that Remilia was a savior who finally fed her family; but when the reporter mentioned the family next door who had been taken away, her voice immediately lowered, and her eyes drifted away, as if she suddenly remembered that a pair of eyes were watching.\n\n He wrote two lines in his notebook: “The order is real.”\n\n “The fear is real too.”\n\n A few days later, he saw Remilia from afar in a public place. She stood quietly and unassumingly, yet she could make the entire square fall silent before it began to breathe. It wasn't mere charisma, nor simply violence, but a combined and extremely effective authority.\n\n He returned to his lodgings and remained silent for a long time, staring at the paper filled with shorthand notes.\n\n Finally, at the end of his report, he wrote: “Measured by efficiency, she was an excellent ruler; measured by freedom, her shadow was too complete. She didn't eliminate chaos, but rather incorporated it into her own rules. Thus, the people under her rule simultaneously received two things—safety and a silence from which they dared not speak.”\n\n After finishing, he didn't immediately send the manuscript.\n\n Because even an outsider could see: here, the truth wasn't forbidden to be written.\n\n It was just a matter of who could afford the price after it was written."
 scarlet.56.a: "She is both order and oppression."



scarlet.57.t:0 "The Broken God and My Sister's Laughter"
scarlet.57.d:0 "When my sister and I were in exile, we saw something very interesting.\n\n It wasn't candy, nor a new toy; it was God himself in a broken state.\n\n At that time, there was commotion everywhere in Europe. Some people were nailing church doors shut, some were tearing up portraits, some were burning books, and some were standing in the square shouting at those who dressed well but always liked to collect money for God. Everyone said it was reform, that God could no longer govern people like that, that the power of Catholicism was too great, too dirty, and too heavy.\n\n I stood on the roof watching, and my sister stood beside me.\n\n The people below were shouting, the bells were ringing erratically, monks' hats were being ripped off, and the golden statue lay face down in the mud, as if someone had stepped on it.\n\n I asked my sister, “Are they fighting?”\n\n My sister smiled.\n\n You know that kind of smile, right? It's like the corners of her mouth just curl up a little, but her eyes are bright, as if she's seen something she really likes.\n “They're not fighting, Flandre,” she said. “Humans have finally dared to bite a god.”\n\n I squatted by the chimney, tilting my head to watch.\n “Isn't that great?” I asked.\n\n My sister looked down at the people below, carrying scriptures, flags, torches, and mallets. Her red eyes held no sympathy, only amusement.\n “Good, but not good enough,” she said.\n “They've just changed the way they say God.”\n “Today they smash the old church, tomorrow they'll build a new one; today they hate the Pope, tomorrow they'll kneel before another set of rules.”\n\n I didn't quite understand, so I tugged at her sleeve.\n “Then what would be enough?”\n\n My sister looked down at me, her voice very soft.\n “They'd smash the very idea that “God should govern people.””\n\n At the time, I just thought my sister was really mean.\n But the more I thought about it later, the more I realized she was right.\n\n Because those people talk about freedom, yet they expect others to live according to their own freedom; they say God loves the world, but their hands still reach into other people's bowls and heads. Religion is like a long, sticky cloth; it wraps you up first, then tells you it's warm.\n\n My sister hates that kind of thing.\n\n She watched the church catch fire, watched the monks flee, watched the crowd drag the idol down from its height, and finally just said calmly:\n “If this world is truly to change, it should change more thoroughly.”\n\n That night, we didn't stay long. The church was burning so brightly that it hurt my eyes.\n\n My sister led me into a darker place, saying as we walked:\n “Remember, Flandre.”\n “God will never save you.”\n\n I nodded.\n\n Because I had already seen it.\n Those who knelt and wept in the church, in the end, still had to climb out of the fire themselves."
scarlet.57.a:0 "My sister said, God only lives for himself."

scarlet.58.t:0 "A girl as thin as paper"
scarlet.58.d:0 "Later we went to Ireland.\n\n That place didn't smell good. The wind was damp, the ground was cold, and the people were thin. Not just a little thin, but the kind of thin where even their shadows seemed to float away. My sister said it was a famine, that sometimes even without predators, humans can drive themselves to near death.\n\n I didn't want to look at the people on the street because their eyes all looked the same. Empty, like they'd been starving for too long, too weary to even hate. But my sister stopped.\n\n I followed her gaze and saw a girl sitting at the entrance of a dilapidated bookstore. She was clutching a book bigger than her arm, her face as white as paper, so thin it looked like it would break at any moment, and her whole body trembled when she coughed, as if her chest was filled with shards of glass. I tugged at my sister's hand.\n\n “She's dying,” she said.\n My sister hummed in agreement, but didn't leave immediately.\n\n The girl looked up at us.\n\n Her eyes were deep, unlike others who only begged. She was the kind of person... who would still read even when she was starving. The book in her hands was wet, the edges curled up, but she couldn't bear to put it down.\n\n My sister went over, squatted down, and asked her, “What are you reading?”\n\n She coughed for a while before slowly saying, “A way to keep me alive.” I stared at her. Wow, that's a powerful statement.\n\n Not “Give me bread,” not “Save me,” but “a way.” Even though she was so hungry, her mind was still working, like a small lamp that refused to go out. My sister's lips twitched slightly after hearing this.\n\n “To starve to death here would be such a waste,” she said.\n\n I knew my sister was praising her. She rarely acted like this.\n\n The girl looked at her sister, neither agreeing immediately nor crying. She just hugged the book tighter, as if wondering: what exactly is this person in front of her, dressed so beautifully and smelling like night and blood? Her sister reached out her hand. “Come with me.”\n\n She asked, “What can you give me?”\n\n Her sister answered quickly.\n\n “Food, medicine, and time.”\n\n The girl stared at that hand for a long time, so long that I wanted to hold it for her. Finally, she extended her hand, cold as ice, and placed it in her sister's palm. She said her name was Patchouli.\n\n I leaned closer to look at her and asked, “Are you really good at reading?”\n\n She took a breath, but surprisingly still had the strength to reply, “Better than you.”\n\n I disliked her even a little bit on that spot. But only a little bit.\n\n Because from that day on, she came with us.\n\n My sister let her get in the car, gave her some hot soup, and told me not to scare her anymore. She was wrapped in a blanket, coughing as she read, looking like a piece of paper about to be torn apart by the wind, but what was inside that piece of paper later turned out to be frighteningly large. My sister was right.\n\n It would be such a waste to let someone like that starve to death."
scarlet.58.a:0 "She was as thin as paper, but her mind was frighteningly bright."

scarlet.59.t:0 "Mima, the Teacher, and Gensokyo"
scarlet.59.d:0 "Much later, we met a very strange woman.\n\nShe called herself Mima—an evil spirit and a magician. She wore a wicked grin and an enormous hat; beneath her dark skirt, I could not see her feet at all. Her voice sounded like a needle drawn across glass. The instant she saw Patchouli, her eyes lit up the way my sister's did at the sight of gold.\n\n‘Whose child is this?’ she asked.\n\n‘Mine, for now,’ my sister answered without expression.\n\nThat only made Mima grin wider. ‘Let me take her under my wing for a while. I give you information; you let me teach the girl.’\n\nI immediately clung to one of Patchouli's arms. ‘No!’\n\nI nearly pulled her off her feet. She coughed and frowned at me. She had not grown much; her face was still pale and her hands were still cold, but she no longer looked as though she might snap in two, as she had in Ireland.\n\nMy sister did not refuse at once. ‘What information?’\n\nMima twirled her staff, lowering her voice as though sharing a secret. ‘The East. Far to the east lies a place called Gensokyo.’\n\nI was sitting on a rock, swinging my legs. At the new name, I looked up at once. ‘Gen-so-kyo?’ I sounded it out one syllable at a time.\n\n‘Mm.’ Mima narrowed her eyes as if peering into the farthest distance. ‘It shelters the monsters, legends, and outcasts the Outside World has forgotten—a place that takes in everything that “should not exist.”’\n\nMy sister fell silent.\n\nI knew she was thinking. Whenever she went quiet, the very air around us seemed to draw tight.\n\nMima smiled again and leaned across the table. ‘Do not settle for hiding,’ she said. ‘Take it. Claim a place where monsters can live. That would be far more like you, Remilia.’\n\nOh, that did it. My sister's eyes changed at once. It was more than simple interest; it was that rare look she wore when an idea had truly taken hold.\n\nPatchouli hugged her book and asked quietly, ‘Do I get to decide for myself?’\n\nMima tilted her head and smiled. ‘Of course—provided you are clever enough to survive my lessons.’\n\nPatchouli coughed twice and, to my surprise, nodded.\n\nAnd so it was settled. My sister traded information with Mima and left Patchouli in her care for a while to study magic, runes, and stranger things. I was not pleased; while Patchouli was away, I had one fewer person to listen to my stories.\n\nMy sister, however, was delighted.\n\nThat night she lingered beside the campfire, turning a cup in her hand. ‘Flandre,’ she told me, ‘we do not have to keep running.’\n\n‘We are going to Gensokyo.’\n\n‘And then?’ I asked.\n\nMy sister looked up at me and smiled. ‘When we arrive, we will find ourselves a place to stand.’\n\n‘Or we will take one.’"
scarlet.59.a:0 "Gensokyo——It sounds like there are a lot of monsters hiding there."

scarlet.60.t:0 "A Person Heading East"
scarlet.60.d:0 "We really started heading east, and for a very, very long time, so long that I thought the map had no end.\n\n About a few years after the end of a major war, we practically turned the Silk Road into our own story. My sister wore a cloak, hiding during the day and walking at night; Patchouli was wrapped up like a coughing rag, taking notes as we went; and I counted the sand, the moon, camels, and dead bones along the way.\n\n The Middle East is very hot, so hot that even the air feels like it's baking you. The desert heats up the soles of your shoes during the day, and at night it's so cold it feels like someone has a knife pressed against your neck. Once I buried my feet in the sand, and my sister immediately pulled me out, saying that if I kept messing around, she would tie me to a camel.\n\n I laughed loudly because I knew she wouldn't actually tie me.\n\n It was on that road that we met Parsee Mizuhashi.\n\n She first introduced herself as Youkai, then added that she hated it when others were happier than her. Wow, that really suited her. She stood by a nearly dried-up bridge, her hair disheveled, her eyes burning green.\n “Are you going to Gensokyo too?” she asked.\n\n My sister nodded.\n\n Parsee snorted, as if she didn't want to admit that she was the same way.\n “Then let's go together,” she said, “If anyone on the road is laughing too happily, I can conveniently annoy them.”\n\n After that, more and more people appeared, as if the whole road was pushing things that didn't belong to the outside world eastward.\n\n We met Satori Komeiji and Koishi Komeiji. Those sisters were interesting; one looked at people like she was unpacking a box, and the other seemed not to be looking at you at all, yet had already walked past. They were strangely quiet, which I liked.\n\n Later, there was Alice. She always had a doll with her, didn't talk much, but every word she uttered sounded like she was sulking. Then came Fujiwara no Mokou, white hair, fierce eyes, and a trail of burning fire trailing behind her.\n\n Everyone went to Gensokyo.\n\n It seemed like that place wasn't just a point on a map, but a magnet that attracted all the out-of-place people.\n\n Sometimes, halfway through, I'd suddenly turn back to look at our long line of shadows: a vampire, a sickly witch, the jealous Youkai, the older sister who can read minds and the younger sister who doesn't want her mind read, a girl with a doll, and an immortal vengeful ghost.\n\n I couldn't help but laugh.\n “Sister, we look like a circus.”\n\n Without turning her head, my sister said, “Then you're the noisiest one.”\n\n I accepted it.\n\n Because this path is perfect for weirdos."
scarlet.60.a:0 "The more people there are, the less boring the road becomes."

scarlet.61.t:0 "The First Half of the Story by the Fire"
scarlet.61.d:0 "One evening, the wind was light, and we sat around the fire.\n\n Parsee spoke first, because she had been staring at other people's bowls for a long time, to the point that I wanted to share mine with her. She said that her place was full of jealousy, even the air smelled sour. Whoever had more than anyone else would be looked down upon; whoever shone a little brighter would be dragged down.\n “It's not that I don't feel jealous,” she said, her eyes reflecting the fire, very green, “I'm just fed up with that stuff soaking into my bones.”\n\n I nodded after listening.\n “That sounds awful.”\n\n She actually laughed.\n\n Next was Satori Komeiji.\n\n She always spoke with such composure, as if she had seen through both herself and others' hearts. She said some people disliked her because she saw too deeply; some people said it was okay on the surface, but had already closed their hearts to her. She wasn't afraid of loneliness; she just knew her sister couldn't always be seen that way.\n\n Saying this, she glanced at Koishi.\n\n Koishi was squatting beside her playing with a twig, seemingly not listening at all. But suddenly she looked up, smiling, and said:\n “I want to go somewhere where they won't always call me a monster.”\n\n She spoke so softly, so softly, as if she were talking about someone else's wish.\n\n I immediately stopped laughing.\n\n Because I understood.\n\n I understood too well.\n\n Later, Patchouli tucked her hands into her sleeves, coughed twice, and said that Gensokyo probably wasn't much cleaner than outside. She said that as long as there are places and people, there will be prejudice, exclusion, hierarchy, and rules. She meant something like: Don't dream too soon.\n\n But the Komeiji sisters didn't refute her.\n\n They just quietly watched the fire, as if they knew that hope wasn't something worth grasping just because it was guaranteed.\n\n That night, I sat next to my sister with my knees drawn up to my chest, and suddenly felt very strange.\n\n It turned out that this group of people, each seemingly stranger than the last, actually wanted pretty much the same thing.\n\n Not a throne, not applause, and not someone kneeling before you. just wants to find a place where I don't have to prove “I'm not superfluous” every second."
scarlet.61.a:0 "I wanted to be kept, but it turns out I'm not the only one."

scarlet.62.t:0 "The Other Half of the Story by the Fire"
scarlet.62.d:0 "The next evening, it was the remaining people's turn to tell stories.\n\n Alice spoke first. Her dolls all sat beside her, like a row of more obedient children than she was. She said she wasn't simply traveling; she was escaping. Escaping her mother, escaping that voice that said “for your own good” like a rope, escaping that feeling of having her own hands and feet, yet every step she took felt like it had been predetermined by someone else.\n\n “I don't want to be molded into someone else's image anymore,” she said. I looked at her dolls, then at herself, and suddenly realized that although she spoke coldly, her heart was actually very warm.\n\n Next was Fujiwara no Mokou. Her words were the shortest, and the most piercing. She said she went to Gensokyo not to settle down, not to make friends, and not to start a new life.\n She was going to find someone.\n “Kaguya Houraisan,” she said, the fire seeming to flicker as she said the name.\n\n “I'm going to find her and settle scores I haven't settled in ages.”\n I blinked.\n\n “Just for revenge?”\n\n She glanced at me.\n “Enough.” Wow, so fierce. But I don't dislike her. Because I've seen that kind of feeling, like someone is being supported by something to keep moving forward.\n\n My sister's eyes were probably like that when she carried me through the ruins. Patchouli unusually spoke a few more words that night. She said Gensokyo wasn't heaven, just a place where monsters might not be immediately wiped off the world.\n Her sister didn't argue; instead, she nodded.\n “That's enough,” she said. “Heaven is for dreamers; we want territory.”\n\n Everyone laughed, even Parsee snorted, as if unwilling to admit that what she said was actually quite true.\n\n Looking at the faces around the fire, I suddenly had a strange feeling.\n\n We weren't on the same path at all.\n Some were escaping, some were searching, some wanted to avoid being seen, and some wanted to finally be seen.\n\n But that night, everyone was heading towards the same place.\n\n I rested my chin on my knees and whispered to my sister: “If we really get to Gensokyo, is it just another road that's going to break down?”\n My sister looked at the fire and paused for a few seconds.\n\n “We still have to get there first.”\n Okay.\n\n I like that answer.\n\n Because my sister never guarantees the ending, she only guarantees that we'll move forward."
scarlet.62.a:0 "As long as we keep moving, the story isn't over."

scarlet.63.t:0 "Xi'an, the fork in the road, and the gate to Shanghai"
scarlet.63.d:0 "At last, we reached Xi'an.\n\n The city was vast and its walls towered above us. Dust and voices clung to one another, as though the whole world had stopped there to catch its breath. By the time we arrived, the little company we had gathered along the road was finally beginning to break apart.\n\n Parsee left first. She claimed she was simply tired of our noise, but before going she cast one last look at my sister, as if to say: don't die too soon.\n\n The Komeiji sisters departed as well. Satori nodded to us; Koishi smiled, waved, turned a corner, and vanished to who knew where. Alice took her dolls down another road, back held straight as if she had finally gathered her own strings into her hands again. Mokou was the most decisive of all. She left us with only one warning—“If you see Kaguya in Gensokyo, don't try to stop me”—and walked away without looking back.\n\n I watched them go from beside the city gate and felt a sudden, childish disappointment.\n “They're just leaving?”\n\n My sister patted my head.\n “We were only travelling together for a while.”\n\n I pouted.\n “I thought we would all enter Gensokyo together.”\n “We won't.” Patchouli coughed softly beside me, her voice as level as ever. “Gensokyo is a destination, not a travelling party.”\n\n Hmph. She really does know how to make everything sound cold.\n\n But she was right.\n\n Our route changed after Xi'an. My sister had no intention of forcing her way across the interior and straight on to Japan; she said it would take too long and drag far too much trouble in our wake. We would sail from Shanghai instead: reach the harbour, find a ship, and then—in the manner she knew best, with perfect elegance and absolute entitlement—deliver herself into her next destiny.\n\n And so we turned towards Shanghai.\n\n Shanghai was damp, chaotic, and brilliant, loud by day and echoing with gunfire by night. It was there that my sister brought Hong Meiling into our household.\n\n She did not find Meiling in the middle of a street or meet her amid some bustling crowd. Meiling had taken bullet after bullet protecting a whole street of merchants from the warlords, only to be left beneath a bridge to die. Blood covered her body, but her eyes remained fierce; even at death's door, she refused to be the first to bow her head.\n\n I hid behind my sister, tugged at her sleeve, and whispered,\n “She doesn't look like someone who's about to die.”\n\n My sister looked down at her for a long while. The corner of her mouth rose ever so slightly.\n\n “Because she is still useful,” she said.\n\n Only later did I learn that Meiling's past involved some hopelessly complicated tangle of divine dragons, faith, and youkai. She did not care about any of it. She knew only that her name was Hong Meiling—and then she agreed to work for my sister.\n\n One more person had joined us. Or perhaps one more door.\n\n I stood on the dock with the sea wind tossing my hair into a hopeless mess, while a ship's long whistle sounded as though it were bidding someone farewell.\n\n A strange feeling came over me.\n\n From the castle that burned behind us to this harbour, from the ruins of Europe to the ports of the East, we had lost things and found things, broken things and mended them, every step of the way. And somehow we had almost reached that place called Gensokyo.\n\n I looked back at my sister, at Patchouli, and at the newly arrived Meiling, and made myself a secret promise:\n “Perhaps this time, we really can have a home.”"
scarlet.63.a:0 "Starting from Shanghai, to make Gensokyo our place."

 scarlet.64.t:0 "The Sea of the Wrong Ship"
scarlet.64.d:0 "We were originally going to Japan. Really?\n\n My sister was so confident at first, and Patchouli even wrote down the route, ports, supplies, and ways to hide on paper. But on the second day after boarding, things started to go wrong.\n\n First, the accents on the ship were wrong, then the sea breeze was blowing in the wrong direction. My sister stood on the deck for a long time, finally folding the map and speaking in a tone as cold as if she had just swallowed an ice cube.\n “We've boarded the wrong ship.”\n\n I was stunned for a moment, then laughed so hard I squatted down.\n\n Meiling had only been with us for a short time then and hadn't fully gotten used to my sister's way of speaking. She looked at the sea, then at my sister, and finally asked cautiously, “So... where are we going now?” My sister answered very decisively.\n\n “I don't know.”\n\n Wow, that's so much fun. Since we couldn't turn back, we had no choice but to drift with the ship. Life at sea felt like a stretched-out rubber band. By day, we watched the water; by night, the moon. Sometimes the wind was so strong it threatened to capsize the ship; other times, it was so calm it seemed even time itself had fallen asleep.\n\n I had a lot of fun on the ship. Patchouli wanted to read, but the wind kept blowing the pages around, so she ended up jotting down things she couldn't understand on paper. Meiling sat with me by the railing, watching the sea, teaching me to distinguish seabirds, waves, and distant ship silhouettes. I asked her if there were anything stranger than me in the sea, and she said there definitely were, and maybe they were watching us too.\n\n The nights were the most fun. I pestered Patchouli to tell me about magic, Meiling to tell me about Shanghai, and my sister to tell me when we would finally get back on the right track.\n At first, my sister didn't pay much attention to me, but after I kept asking, she finally said, “Flandre, the ship's already like this, asking won't create another Japan.”\n\n But she wasn't actually angry. I knew. Because during that time, she unusually didn't frown all the time. It was as if, as long as we hadn't reached shore, we weren't exiles, rulers, or monsters, just a group of people temporarily sheltered by the sea.\n\n Getting on the wrong ship was certainly not a good thing.\n\n But that wrong route was one of the few days in a long time when we could laugh."
scarlet.64.a:0 "Since we're on the wrong ship, let's just drift along."

scarlet.65.t:0 "The Unemployed Sea of People"
scarlet.65.d:0 "When we finally reached the shore, what we saw wasn't Japan.\n\n It was America.\n\n The dock was huge, and the city was huge, but as soon as I stepped onto it, I felt something was wrong. The streets were crowded with people, yet eerily quiet. Men in old suits, women holding children, stood in very long lines, as if waiting for something, or perhaps not knowing what they could possibly wait for.\n\n They held signs; some said “Need work,” some said “Please feed me,” and most wrote nothing, just stood there, their eyes vacant, as if half their souls had been starved away.\n\n I tugged at my sister's sleeve.\n “Is this... the famine?”\n\n My sister looked at the hunched-over people on the street, not answering immediately. Patchouli coughed first, saying softly, “Factories shut down, banks collapsed, and jobs disappeared. Sometimes civilization doesn't need war to starve people like this.”\n\n Meiling stood beside me, her brows deeply furrowed. She was probably thinking of Shanghai, and those days when everything started to rot if there was no food. I don't like this kind of place.\n\n Not because it's ugly, but because it's too quiet.\n\n Everyone is still alive, but that kind of survival seems fragile, like it would collapse at the slightest touch.\n\n A man sat leaning against the wall on the street corner, his hat covering his eyes, a sign at his feet that read “I used to have a job.” I don't know why it said “used to,” but seeing that word made me feel strange. My sister, on the other hand, looked at it calmly.\n\n After only a moment, she softly said: “Humans always think the world will keep moving forward.”\n\n “But once the gears stop, they're just left waiting in line.”\n\n I asked her, “What about us?”\n\n She looked down at me, her lips twitching slightly.\n “At least we know we can't entrust our lives to the gears.”\n\n Hmm, okay.\n\n Still hard to understand. But I remembered the color of that city.\n\n Gray, old, cold, and hungry; even the tall buildings seemed to be coughing.\n\n America is vast, but back then, its vastness didn't bring much hope to the people inside."
scarlet.65.a:0 "Even the brightest places can be this hungry."

scarlet.66.t:0 "Children by the dock"
scarlet.66.d:0 "We originally only planned to stop in America for a short while, stock up on some supplies, and then find the right ship to Japan.\n\n But my sister is always like this. She said it was just a short trip, but in the end, she picked up someone from a street corner.\n\n That day was very cold; the wind smelled of coal smoke and seawater. The first thing I saw was a little girl, huddled against the wall behind the dock, her coat ill-fitting, clutching a small knife tightly in her hand. She didn't cry or scream, just stared at every passerby, as if ready to be robbed, kicked, or completely forgotten at any moment.\n\n Wow, this scene looks familiar. It's just like when we first met Patchouli, except this time it wasn't a starving piece of paper, but a small knife stubbornly refusing to break. The older sister stopped.\n\n I whispered beside her, “Are you going to pick it up again?”\n\n The older sister ignored me, only squatting down to ask the girl. “Who are you waiting for?”\n\n The child's lips moved, but she only managed to utter, “No one will come.”\n\n She spoke very flatly, as flatly as if she were describing the weather. This kind of talk is the most troublesome, because the flatter it is, the more it means she has believed it for a long time.\n\n The older sister looked at her for a long time, then suddenly smiled. “Fate sometimes really likes to throw good material into the trash heap,” she said.\n\n I still didn't quite understand. Meiling stood behind, her eyes somewhat complicated; Patchouli, on the other hand, crossed her arms, observing the child's posture, breathing, and the way she held the knife, as if already assessing her worth.\n\n The older sister reached out her hand to her. “Come with me.”\n\n The child looked up at her, her eyes suddenly sharpening. “Who are you?” the older sister answered softly. “Someone who can free you from this place.”\n She added. “You can continue living with that knife, living until one day no one remembers you; or you can come with me, to a place where someone will remember you.”\n\n The child didn't immediately grasp her hand. She looked at the older sister first, then at us, and finally at the ship docked in the harbor, the one truly bound for Japan.\n\n The wind tousled her hair; she finally stood up slowly, sheathed the knife, and placed her hand in the older sister's palm.\n\n So we had one more person.\n\n When the ship finally headed towards Japan, I leaned on the railing and looked back, watching the gray city slowly recede into the distance. My sister stood beside me, Patchouli was looking at the newly adopted child, and Meiling leaned against the ship's railing, enjoying the breeze.\n\n I suddenly found it very funny.\n\n We clearly only wanted to go to Gensokyo, but along the way it felt like we were picking up and taking away, one by one, all the things in the world that shouldn't have been thrown away."
scarlet.66.a:0 "This time, finally we were on the correct route to Japan."


 scarlet.67.t: "My sister, laughing as she ruined everything."
 scarlet.67.d: "The truly terrifying thing about Flandre wasn't when she was yelling and screaming.\n\n That was when she was laughing.\n\n The worst times during their exile were almost entirely without warning. No long, rambling rants, no exaggerated announcements, just a small change—she suddenly quieted down, her eyes shone unnaturally, and her fingers lightly clenched in the air, as if playing with something only she could see.\n\n Then, things went wrong.\n\n Once, it was in a run-down hotel. It was still raining outside, my sister had just brought back food from downstairs, and I was sitting by the window swinging my legs, counting the cups on the table. Then, someone in the next room started arguing, and a plate broke.\n\n Just that one loud bang.\n\n I looked up and thought the sound was piercing.\n\n The next second, the wall cracked. It wasn't a slow crack; the entire wall seemed to be gripped from the inside, caved inwards. The table overturned, the chair shattered, and the horses downstairs began to neigh. I was still laughing then, because I just wanted to stop the noise, but unexpectedly, the whole room fell silent.\n\n When my sister rushed over, her face was worse than the thunderstorm outside. She grabbed my wrist tightly, as if afraid that if I touched it again, the whole street would disappear.\n\n “Flandre,” she said. Only two words.\n\n She didn't get angry, nor did she offer any comfort. But I knew she was afraid. Her lips didn't move, but her eyes were fixed on my hand, as if it weren't my sister's hand, but something that had just crawled out of Hell, not yet deciding which way to crush it.\n\n Another time was in a deserted little castle. Patchouli was reading in the corner, and her sister was looking at a map by the window. I just wanted to catch the bird perched on the windowsill to show her. Really, I just wanted to catch it.\n\n But before my hand could touch it, the bird turned into a cloud of red mist.\n\n*snap*.\n\n Very quietly.\n\n Feathers, blood, bones—all gone.\n\n I froze, Patchouli looked up, and her sister stiffened for a moment. She didn't come closer to me; instead, she pushed Patchouli back. The movement was so fast that she didn't even have time to pretend nothing had happened. I tilted my head and asked her.\n\n “Sister, did I use too much force again?”\n She was silent for two seconds before saying: “... Don't touch anything.”\n\n See, she didn't even say “it's okay.”\n\n Because even my sister knows that if I lose my temper, it's not the kind of trouble I cause by smashing cups, fighting, or throwing tantrums.\n\n I will break “the things themselves.”\n I will break the room, break people, and break the entire living sound.\n\n So later, whenever I was quiet for too long or laughed too happily, my sister would start to get nervous. She'd straighten her gloves, move the cups further away, and quietly remove anything fragile from the room. She acted so naturally, like she was just casually tidying up, but I knew what she was doing.\n\n She was guarding against me.\n\n Wow, it's actually a little sad to think about.\n\n But there's nothing I can do.\n\n Because when I'm at my cutest, I might turn into the worst monster in the next second."
 scarlet.67.a: "My sister's fear of me isn't without reason."


 scarlet.68.t: "The Sister Behind the Door"
 scarlet.68.d: "Later we arrived in Gensokyo.\n\n Logically speaking, that should have been home.\n\n There was a barrier, there was Youkai, a place where monsters could survive. My sister traveled for so long, picked up so many people, and broke so many times to find this place, finally managing to put us into a world where we didn't have to run away every day.\n\n But what's funny is—after we stopped running, I actually broke more easily.\n\n Maybe it's because I was always running before, and the pain could only follow. Now that I've stopped, the things along the way are catching up with me one by one. The houses that burned down during our exile, the gunshots, the smell of blood, the people I broke, and my sister standing at a distance, afraid to approach me, all slowly rushed back into my mind, more punctually than anyone else at midnight.\n\n At first, I just couldn't sleep.\n\n Later, I suddenly couldn't stand laughter, suddenly hated the reflection of glass, and suddenly had a strong urge to smash everything in the room that made a sound. Several times, while walking around the building, I would inexplicably stop, staring at a lamp, a tile, or a maid who happened to pass by, thinking: If I touch it now, how will it shatter?\n\n And it became more and more frequent.\n\n Once, it was in the garden. The moon was bright, the fountain was making a constant sound, and I was in a good mood, about to go find my sister. Then, someone was moving something in the distance, and the metal clanged. Just one sound.\n\n I suddenly felt completely out of sorts.\n\n It felt like someone was stuffing tons of fire into my chest, but not letting it burn out. I stood there, even breathing hurt. The roses split open first, stone dust started falling from the edge of the fountain, then the entire garden floor began to sink slightly. The maids were so frightened they didn't dare move; one of them didn't even dare put down her plate.\n\n My sister came quickly.\n\n She stood in front of me, didn't touch me, but said, word by word:\n “Flandre, look at me.”\n\n I did look.\n\n But the sister I saw then wasn't my sister anymore. I saw fire, walls, and those people who used to chase us. I almost reached out. Just a little bit more.\n\n Later, Patchouli used her magic to forcefully suppress the situation, Meiling drove away the people outside, and Sakuya sealed off the entire corridor and garden, preventing the whole building from collapsing.\n\n That night, my sister finally made her decision.\n\n The basement door was thickened, the lock was changed, and Patchouli began drawing a new seal. She didn't say anything nice like, “This is better for you.” She just stood at the door and told me in a steady voice:\n “You're going to live here.”\n\n I asked her, “Are you afraid that I'll get hurt outside?”\n\n My sister paused.\n\n She wasn't lying to me.\n “No,” she said.\n\n Then she took a step closer, placed her hand on the doorframe, and stared at me with her red eyes, as if staring at something she cherished most and dared not let go of.\n “It's because I'm afraid you'll hurt the outside.”\n\n Wow.\n\n That's so mean.\n\n But she's also so honest.\n\n So I was locked up. Not because Gensokyo wasn't good enough, nor because my sister didn't love me. On the contrary, it was because she knew all too well—the cutest little sister could turn into a demon at any moment; the place that felt most like home could turn into ruins the next second when my emotions went astray.\n\n After the door was locked, I sat inside listening to that voice and suddenly found it very funny.\n\n We ran for so long, and finally found a place to stop.\n\n In the end, the one who actually stopped was me."
 scarlet.68.a: "When my sister locked the door, I knew she was really scared."

  
 scarlet.69.t: "Everything started to catch fire."
 scarlet.69.d: "At first, it wasn't very obvious.\n\n Only the candlelight flickered a little faster than usual, the shadows in the corner swayed a little more fiercely than usual, and the smell of dust and stone in the air suddenly became a little hot.\n\n Flandre sat on the ground, hugging her knees, but her eyes were fixed on what was ahead.\n\n The table was still a table.\n The chair was still a chair.\n The doll was still a doll.\n\n But as she looked, the edges of those things began to change.\n\n The grain of the wood was no longer grain, but like glistening cracks; the shadows on the wall were no longer just black, but seemed to shrink as if roasted by fire; even the doll's crooked eyeball seemed to hide a tiny, tiny red dot. “... No,” she whispered.\n She pressed the back of her hand to her forehead, as if measuring whether she was burning up again. “It's so cold here.” But the world in her eyes wasn't cold at all.\n\n The candle flame began to creep outwards.\n\n Not burning on the wick, but burning on the edge of the table, the floor, the corner of the wall, the hem of the doll's skirt, burning in every place where there shouldn't be a fire. They didn't actually catch fire, but in Flandre's eyes, everything seemed to be enveloped in a layer of transparent, flickering flame.\n\n She slowly stood up, her steps light, as if afraid that if she moved too fast, the whole room would explode. “Did you see it too?” she asked the dolls. Of course, there was no answer.\n\n But she nodded earnestly, as if answering for them. “Right?” “I knew I wasn't just imagining things.”\n\n She reached out to touch the corner of the table, but before her fingertips even touched it, she abruptly pulled back.\n\n Because she saw the table burning. Not actually burned to ashes, but... the kind of thing that, if you touched it, would immediately crack, scatter, and turn into a pile of glowing fragments.\n\n Her breathing quickened. “No,” she said. “Don't touch it.”\n\n But not touching it wouldn't be any better.\n\n Because the fire was getting bigger and bigger.\n\n The edge of the bed was burning, the door frame was burning, and the cracks in the ceiling seemed to be filled with red light. Even her own hands seemed to be wrapped in some kind of invisible high heat, and if she clenched her knuckles, she would set everything in front of her ablaze.\n\n She turned her head to look in the mirror. In the mirror, her face was very white, her eyes were very red, but the shadow behind her seemed to be illuminated by the firelight, twitching and moving erratically. It wasn't the shadow of an ordinary little girl.\n\n It looked more like something that had been burned too much, just one last thing about to crawl out from under the skin.\n\n Flandre stared at herself in the mirror, her lips moving. “Here we go again,” she said softly, as if she'd said it countless times before. “The world's burning again.” She took a step back, her heel hitting the chair with a soft thud.\n\n But to her ears, the sound was like the snapping of a wooden beam, the shrill crack of a window shattering, the agonizing groan of a house engulfed in flames.\n\n She covered her ears abruptly. “No!” she cried, but it was no use.\n\n The fire hadn't actually started.\n But in her eyes, the entire basement was already ablaze."
 scarlet.69.a: "What she saw wasn't a room, it was fire."

 scarlet.70.t: "The sound of a castle collapsing"
 scarlet.70.d: "Next came the sound.\n\n First, a very low hum, like someone pushing an old machine behind a wall. The sound wasn't loud, but it persisted, vibrating against her bones, making her teeth ache.\n\n Flandre pressed her hand to her ear, trying to suppress it. It didn't work.\n\n Because it wasn't coming from outside. The sound came from her mind.\n\n Hum— Another one. This time it was even more like it.\n\n Like the tremor before a cannon is fired, like the moment the whole world holds its breath after gunpowder is inserted into an iron pipe. Her eyes widened instantly.\n\n “No...”\n\n She backed away, her back hitting the wall, but she felt as if she were no longer in the basement. The cold stone floor beneath her feet was no longer there, but a long corridor wet and slippery with blood, ash, and shards of glass; before her were no longer dolls and tables, but burning windows, collapsed pillars, and rows of people rushing in.\n\n Boom—! This time, the sound truly exploded in her ears.\n\n Flandre suddenly crouched down, clutching her head, her shoulders trembling violently. She knew perfectly well that it was just a lamp, a table, a wall in the basement, but all she saw was the castle she and her sister had lived in.\n\n That castle, which was long gone now.\n\n She saw cannons blasting in.\n She saw the windowpanes shatter.\n She saw the corridor burning.\n\n She saw servants fall. She saw herself being dragged along by her sister's hand, running until she lost a shoe.\n\n She even remembered the smell.\n\n Iron, gunpowder, charred cloth, and blood.\n “Sister!” she blurted out. The sound bounced in the basement, startled by her own words. But the memories didn't stop.\n\n She saw Flandre's own wings ripped apart, saw her sister bleeding from her shoulder, saw people with firearms rushing out of the smoke, shouting words she couldn't understand but knew must be horrible.\n\n The rumbling grew louder and louder.\n\n So loud that she couldn't tell if it was the rattling chains outside or if the castle had truly collapsed again.\n\n She looked up, and the door before her no longer appeared as the thick basement door, but as the door from which she had never been able to escape; the scratches on the wall were no longer just scratches, but like cracks in stone shattered by cannon fire; even the candlelight seemed to lick fire down from the ceiling.\n\n Flandre was breathing heavily, tears welling in her eyes, yet she kept repeating the same phrase.\n\n “I'm not now...”\n\n “I'm not here...”\n\n She couldn't tell who she was trying to deceive. Because her body was still in the basement, but her heart had completely fallen back to that day.\n\n That day, her sister grabbed her and ran.\n That day, the entire castle cracked open behind them.\n\n That day, the world didn't break down slowly, but all at once.\n She suddenly reached out and grabbed at the air.\n\n “Get away!”\n\n She shouted at the soldiers in her memory. But in that instant, the cups on the basement table shattered, two doll heads fell off, and even the door lock made a frighteningly heavy thud.\n\n Flandre stared at the shards on the floor, her eyes suddenly empty.\n\n She knew she had confused the present with the past again.\n\n She knew that once the burned-out castle returned to her mind, everything normal in her eyes would become a target to be destroyed.\n\n She slid slowly down the wall, hiding her hands back in her sleeves, as if stuffing a disaster back into her body. “...\n Sister.”\n\n She whispered, as if in a dream.\n “I'm still in that day.”"
 scarlet.70.a: "For her, the castle was never truly finished burning."


 scarlet.71.t: "I watched her break down day by day."
 scarlet.71.d: "At first, I thought leaving Flandre in the basement was for protection.\n\n There were too many sounds outside, too much light, the smell of living people, Youkai's gaze, footsteps in the corridor—all of these could push her towards losing control. As long as the door is closed, as long as the room is quiet enough, she won't be torn apart by those things anymore.\n\n But I was wrong. Every time I visit her, I see new signs. It's not that the wall is cracked, it's not that the toys are broken—I'm used to those things. What truly disgusts me is that the things in her eyes are gradually diminishing.\n\n She still smiles, but it increasingly seems like she's putting on an act for me. She'll arrange the toys neatly, talk to them, and look up and call me “sister” when I come in. But once I sit down, her gaze slowly drifts away, as if she's still there, but her heart has already shrunk back to some place I can't reach.\n\n Sometimes she's very quiet, so quiet that I'd rather she throw a tantrum. She sat on the edge of the bed, hugging her knees, listening to me speak, nodding, and humming in response.\n Then, just when I thought she had calmed down, she suddenly asked me, “Sister, am I acting more like a normal person today?”\n\n That kind of question is worse than losing control. I'd rather she smashed down an entire wall than hear her ask that.\n\n She is Flandre, my sister, and shouldn't live like a sealed-off dangerous object. But the basement has turned her into this—lighter and lighter, emptier and emptier, more and more like a child with only a shell left. If she continues to be locked up like this, she might not break down immediately, but she will slowly rot away.\n\n I can tolerate a dangerous sister.\n I cannot tolerate a sister I have personally turned into an empty shell.\n\n So I finally admit: leaving her behind the door will only worsen her condition."
 scarlet.71.a: "I can no longer pretend this is protection."

 scarlet.72.t: "I must get her out."
 scarlet.72.d: "I know very well that taking Flandre out of the basement is a risk.\n\n Not a small risk, but the kind where one wrong step could cost the entire Scarlet Devil Mansion. Sakuya knows, Meiling knows, Patchouli knows. Their silence doesn't mean they aren't afraid.\n\n But I know something else better than anyone—if I do nothing, Flandre will only continue to sink.\n\n She doesn't need more chains.\n She needs light, she needs a voice, she needs someone to actually stand in front of her, not someone behind a door treating her like a forbidden zone. She needs to relearn how to look people in the eye when they speak, how to breathe under the same roof, how to reach out instead of just crushing them.\n\n So I went to Patchouli.\n\n I told her I wanted a limit, not to make Flandre obedient, but to give her a chance to step out. Patchouli said it would hurt, that it wouldn't make her normal. I said I didn't care about being normal, I just wanted her to stop rotting behind that door every day.\n\n I know this will make everyone nervous. The maid will be afraid, Meiling will be even more vigilant, Sakuya will plan every step in a contingency plan. But so what? They're afraid of losing control, I'm afraid of losing her.\n\n Flandre is my most important family member.\n It's not a throne, not power, not those empty words of authority. If I can only maintain her through isolation, then no matter how much I win, I'm just an empty shell queen who locks her sister underground.\n\n So this time, I'm going to open the door myself.\n\n Even if she trembles, even if others back down, even if the entire building has to relearn how to breathe for her, I have to let her out.\n\n Because only by coming out can she have a chance to become my sister again."
 scarlet.72.a: "Open the door, let her learn to live again."



scarlet.73.t:0 "Before Scarlet Devil Mansion existed"
scarlet.73.d:0 "We had already arrived in Japan then, but Scarlet Devil Mansion didn't yet exist.\n\n There was no gate, no garden, no long corridor, and none of the people who would bow down to my sister now. There were only a few temporarily borrowed houses, a few not-so-loyal subordinates, and my sister's face, clearly tired, yet still unwilling to give in.\n\n I remember she was very busy during that time. She was nowhere to be seen during the day, only returning at night, her cloak always smelling of rain, mud, and a hint of fresh blood. She would sit at the table, spread out a map, her fingers slowly tracing the various parts of Japan, as if petting an untamed wild beast.\n\n Mima once said that Gensokyo wasn't a door that would open by itself; you had to find the right entrance and have enough hands to push it.\n\n My sister remembered this well.\n\n So she began to accumulate strength. It wasn't through prayer, nor by beckoning people; it was through the most direct method. She rounded up people everywhere, picking those who had disappeared and wouldn't be immediately investigated, those whose voices had been silenced by the pressures of the times. She fed them blood, then took away their will.\n\n Those who finally stood up were no longer human. I call them Blood Plague Monsters. Because they smell like rotten blood, walk like sleepwalkers, have empty eyes, and only hunger in their mouths.\n\n They are very obedient, and very ugly.\n My sister doesn't care about ugliness.\n\n She only cares about their effectiveness. She hid and nurtured them, letting them multiply in batches. She said that to take over Gensokyo, we monsters who escaped from the Old World weren't enough; we needed something else—someone willing to break down doors, bleed, and pave the way for her.\n\n I was sitting by the window watching her then, and I thought she was amazing.\n\n She had nothing yet, but she was already preparing her teeth for our kingdom."
scarlet.73.a:0 "She said, if the door won't open, break it down."

scarlet.74.t:0 "The Entrance Mima Left Behind"
scarlet.74.d:0 "Later, my sister really did find clues to the entrances Mima had described.\n\nIt was not a door painted upon a mountain, nor a cavern that lit up when someone spoke the proper spell. It was more like a seam—a handful of places where the world had not been stitched quite tightly enough. If you knew where to look and had the nerve to dig, you could feel your way to Gensokyo's edge.\n\nMy sister loved that sort of thing.\n\nWith maps, notebooks, and page after page of troublesome symbols Patchouli had compiled, she roamed back and forth across Japan. She tested the mountain mists, the shadowed ground behind abandoned shrines, the hours when the air above old battlefields wore thinnest, and uncanny places even humans dared not approach.\n\nEvery attempt taught her a little more.\n\nAnd all the while, the Blood Plague Monsters multiplied.\n\nThey remained locked in darkness, heads bowed, swaying like broken shadows. At a word from my sister, they would lurch forward—battering walls, biting, bleeding—until the path before them split open.\n\nOnce, I asked her, ‘Does it have to be this way?’\n\nShe did not grow angry. She only looked down at me.\n\n‘Yes,’ she said. ‘Gensokyo is not a place that will let us in merely because we knock politely.’\n\nHer eyes shone as they had long ago, when she stood before our burning castle. It was not joy, but a resolve that had hardened past the point of retreat.\n\nShe meant to seize Gensokyo not only because monsters could live there. She also meant to exact payment for every day we had spent exiled, starving, hunted, and homeless.\n\nAnd so, before Scarlet Devil Mansion had even been built, my sister had already begun her invasion.\n\nFind the door.\nBreed the monsters.\nPry open the one seam in the world that refused most stubbornly to yield.\n\nI knew then that she was not searching for a home.\n\nShe meant to take one for us by force."
scarlet.74.a:0 "Gensokyo won't take us in, so let it learn to."



 scarlet.75.t:0 "The Battle Before the gap"
scarlet.75.d:0 "When we found the gap, night hadn't completely fallen.\n\n It wasn't a door, more like a wound forcibly torn open on the surface of the world. Fog seeped out from within, carrying a cold air and the scent of vegetation that didn't belong to the outside world. Remilia stood at the forefront, her cloak fluttering in the wind. Behind her were the plague monsters she had brought along, Patchouli, Hong Meiling, and the young Sakuya and Flandre, who had already learned to keep their gazes calm.\n\n She had expected to see the barrier first, or perhaps a strange land. But what awaited her on the other side of the gap was not a view.\n\n It was Yukari Yakumo.\n\n She seemed to have known this day would come; the tip of her umbrella lightly touched the ground, her smile as faint as moonlight. Beside her stood Ran Yakumo and Chen, their blue eyes cold and steady, while Chen's body was tense, her tail bristling. Further back were Okina Matara and her dancers. The three oni kings, Suika Ibuki, Yuugi Hoshiguma, and Kasen Ibaraki, were all present. Even the former Hakurei shrine maiden, long since relegated to the shadow of a bygone era, stood at the very front, holding her talisman, the protective barrier beneath her feet glowing.\n\n Remilia, looking at the lineup opposite her, didn't retreat but instead smiled. “How grand,” she said.\n\n Yukari Yakumo slightly raised her umbrella, her tone gentle to the point of being harsh. “One must always be courteous to vampires who intrude with monsters, plague, and ambition.”\n\n The former Hakurei shrine maiden took a half-step forward, her talisman vibrating, instantly creating a sharp spiritual energy in the air. “Go back,” she said.\n\n Remilia raised her hand, her fingertips gently closing. “Too late.”\n\n The next instant, both sides of the gap trembled simultaneously. The Blood Plague Monster roared and lunged forward. Hakurei's barrier and Yakumo's gap lit up at the same time. Okina's back door silently opened on the side of the battlefield. The three Oni Kings stepped forward, the ground pounding like heavy drumbeats.\n\n That night, the incident caused by the vampire invasion began."
scarlet.75.a:0 "The vampire incident erupted."

scarlet.76.t:0 "Before the Oni Kings, Hong Meiling"
scarlet.76.d:0 "The first clash wasn't between Remilia and Yukari Yakumo. It was Hong Meiling and the three Oni Kings.\n\n Suika threw the first punch, her alcohol-fueled strength like a mountain crashing down; Yuugi followed closely, her punch so heavy it could almost tear the ground apart; Kasen didn't fight head-on, her chains and techniques more refined, targeting gaps, joints, and breathing rhythms. With such a lineup, let alone a gatekeeper, anyone on the front lines would have been crushed in the first round. But Meiling never intended to win. She knew she was no match for the Oni Kings.\n\n All she could do was defend.\n\n She sank her qi into her dantian, then pushed it inch by inch to her limbs.\n\n Not to unleash the power, but to transform herself into a breathing wall. When Suika's fist came crashing down, she didn't meet it head-on, but at the last moment, she shifted her shoulder to deflect the force, letting the strange power flow into the ground beneath her feet; when Yuugi's heavy blow came, she used her qi to stabilize her lower body, crossing her arms to deflect the momentum; when Kasen's chain wrapped around her from the side, she immediately pulled back her elbow and turned, using her qi to protect her muscles and bones, enduring the blow head-on, refusing to let a breach be torn open.\n\n Her defense was very difficult.\n\n Her sleeves tore, and the stone ground beneath her feet crumbled inch by inch. The qi within her surged painfully, as if each punch she received caused a cracking sound in her bones. She didn't counterattack, because she knew that if she craved that one strike, she would be simultaneously pierced by the three oni kings in the next instant.\n\n So she didn't move an inch more than her assigned position.\n\n Suika looked at her, grinned, her eyes full of fighting spirit.\n\n “Hey, you, you're not still trying to stop the three of us, are you?”\n\n Meiling exhaled a breath of bloody air, her hat brim was shaken askew, but a smile still lingered on her lips. “Not long enough,” she said. “A little longer, that's enough.”\n\n She wasn't saying this to the Oni King.\n\n She was saying it to Patchouli behind her.\n\n On the other side, Patchouli had already begun to lay down her spell. The light of the seven luminaries overlapped layer upon layer, fire, earth, metal, and water intertwining in mid-air, magic circles ringing one after another, like slowly writing the pages of her book across the entire night sky.\n\n But a spell of this scale couldn't be rushed; haste would lead to chaos, and chaos would mean death.\n\n So Meiling had to stand.\n\n She had to buy her time. Yuugi saw this, and her punches became even heavier, almost openly aiming to smash the wall; Kasen's chains and spells began to specifically force her to breathe; Suika, like a smiling calamity, constantly pressured her from the front. Once the three oni kings got serious, even the air seemed to tremble. But Meiling still didn't back down.\n\n She repeatedly drew her breath up and then pushed it back down, steadying her breathing, keeping her feet firmly planted, and maintaining her position on that line. She wasn't competing with the Oni King in strength; she was using her own body to forcefully tether the three-headed beast to this spot.\n\n Finally, Patchouli's spell reached its limit.\n\n The high-temperature exploding magic bullet first pressed down on the former Hakurei Shrine Maiden, forcing her to take a half-step to the side; then an ice wall rose, blocking the blue Shikigami's charge; the next instant, the overlapping beams of the Seven Stars directly shattered the back door released by Okina.\n\n Meiling heard the booming sound of the spell's completion, and the corners of her mouth finally relaxed a little.\n\n Her mission was accomplished.\n\n Sakuya stood further back, still young, but her hand was already on her sword, staring intently at the entire battlefield. Flandre sat on a rock, swinging her legs, her eyes shining with an astonishing light, as if watching fireworks, not carnage.\n\n In the center of the battlefield, Remilia finally raised her head and looked at Yukari Yakumo."
scarlet.76.a:0 "The gatekeeper kept watch; next, it was the King and the Sage's turn."

scarlet.77.t:0 "The Sage and the Vampire"
scarlet.77.d:0 "When Patchouli's spell was completed, the entire battlefield seemed to be forcibly illuminated.\n\n The light of the seven luminaries overlapped in mid-air, fire, earth, metal, and water layered upon layer, like writing a page of a burning book in the night sky. She first forced the previous Hakurei Shrine Maiden to the side with a high-heat explosive magic bullet, then used an ice wall to cut off the blue Shikigami's advance, and finally, a burst of compressed magic power shattered the projection of Okina's back door.\n\n In that instant, Remilia moved.\n\n She wasn't the kind of person to give up an opportunity. Red mist billowed up along her cloak, and she became like a spearhead honed by the night, slashing straight at Yukari Yakumo. The spear tip parted the air, pressing down not only with killing intent, but also with all the resentment she had gained through her exile and robbery.\n\n Yukari Yakumo, however, only took half a step back.\n\n It wasn't panic, it was yielding.\n\n The gaps at her feet opened and closed, swallowing the remaining magical shockwaves and gently deflecting Remilia's sharpest charge. Each time the spear tip was about to truly touch her, space itself curved; each time the red mist was about to envelop her, the distance widened slightly. “You're too hasty,” Yukari Yakumo said.\n\n Remilia smiled coldly.\n\n “And you're too good at dodging.”\n\n She didn't retreat.\n\n Because she knew this wasn't a battle that could be dragged out.\n\n Meiling was still holding on. She could feel the aura slowly sinking—the gatekeeper wasn't winning; she was using her body to pin the Three Oni Kings to the spot. Patchouli couldn't endlessly unleash those spells; another round would cause the entire battlefield to crack under the pressure of magic. So she could only move forward.\n\n The previous generation Hakurei shrine maiden seized the opportunity to press forward, her magic spells raining down around Remilia;\n\n Ran immediately filled in, her runes and shikigami sealing her flanks and rear; Chen pounced from even lower, her claws carrying a beastly ferocity. Remilia felt as if she were being held down by the sharpest members of Gensokyo all at once. But she still managed to send her spear flying.\n\n This attack finally forced Yukari Yakumo to raise her umbrella.\n\n “Very good,” Yukari Yakumo said softly.\n\n The next moment, the entire space seemed to flip over.\n\n The ground beneath Remilia's feet suddenly became a side wall, the red mist twisted into a thin ribbon, even shifting her center of gravity and the stance of her spear.\n\n She didn't fall when she landed, but she was a beat too slow. The second seal of the previous shrine maiden struck her chest, and Ran and Chen's combined attack followed at the same instant.\n\n When Remilia regained her footing, her cloak was torn, and blood was seeping from her shoulder and chest. She was still standing.\n\n But she had already lost.\n\n Not because she was beaten to the point of being unable to get up.\n\n Instead, she was completely dominated and lost by Yukari Yakumo's consistent and flawless playing style.\n\n"
scarlet.77.a:0 "She lost, but she didn't give up."

scarlet.78.t:0 "The sister who shouldn't have woken up"
scarlet.78.d:0 "Yukari Yakumo, watching Remilia being forced back, finally took a step forward.\n\n The sounds of the battlefield didn't stop, but the place that truly decided the outcome had fallen silent. Meiling was still defending, but her breathing was clearly disordered, and her shoulders and arms were covered in wounds from enduring hardship; Patchouli stood at the rear, the residual heat of the spell still lingering on her fingertips, coughing even more violently than before, clearly unable to immediately cast a second round of magic of the same level.\n\n The situation was clear.\n\n “This ends here,” said Yukari Yakumo.\n\n The former Hakurei shrine maiden flicked her amulet, the meaning couldn't be clearer—if the sage nodded, this vampire who had stormed into Gensokyo with monsters and plagued blood should end here.\n\n Remilia knelt on one knee, blood streaming from her shoulder, the remnants of the seal still pressing against her chest, yet she held her head high, as if she would rather be executed than beg for mercy.\n\n Just as Yukari Yakumo raised her hand— A very soft sound, like a little girl inhaling, suddenly came from behind.\n\n Flandre stood up.\n\n She had been watching, watching quietly, as if she didn't belong to the battlefield.\n\n But now, that quietness shattered. She looked at her kneeling sister, the light in her eyes shrinking to pinpoints, while the aura behind her expanded outwards.\n\n It wasn't youkai power.\n\n It was a kind of destruction itself, something that shouldn't even have a name.\n\n When she raised her hand, even Yukari Yakumo stopped.\n\n The air was quiet at first, then began to crack softly. It wasn't the ground cracking, nor the stones cracking, but rather as if the entire space was being gripped by an invisible hand. With just a little more force, the battlefield, the barrier, the Oni King, the Sage, and the Shrine Maiden would all be crushed into the same collapse.\n\n Suika's smile vanished, Yuugi frowned for the first time, and even the chains of the Kasen slowed down for a moment.\n\n Ran and Chen simultaneously moved to protect Yukari Yakumo's front, the former Hakurei Shrine Maiden lowered her talisman, and even Okina tightened her grip on her back.\n\n Flandre simply looked at her sister and softly said, “No.”\n\n She wasn't ordering anyone.\n\n She was telling the world—don't touch her sister.\n\n Yukari Yakumo finally stopped.\n\n She looked at the young, beautiful child who could ruin everything at any moment, and her eyes truly darkened for the first time. She knew that if she killed Remilia now, what she would face wouldn't just be this vampire incident, but another, more unstable, more boundless calamity.\n\n And even a sage wouldn't want to test that at the edge of the barrier."
scarlet.78.a:0 "Even the sage stopped."

scarlet.79.t:0 "A vow written into one's destiny"
scarlet.79.d:0 "In the end, the sword did not fall.\n\n Yukari Yakumo stood in the center of the battlefield, looking at the kneeling Remilia, then at Flandre who still held her hand up as if she might crush the heavens and earth at any moment, and finally smiled.\n\n It wasn't a smile of forgiveness.\n\n It was the kind of smile a sage would have after recalculating the pros and cons. “You can go to Gensokyo,” she said. Everyone was stunned for a moment. Even Meiling, who was still panting on the other side, raised her head, and Patchouli, unusually, stopped coughing, as if to confirm whether she had misheard.\n\n Remilia looked up at her, her eyes first wary, then filled with an almost instinctive suspicion. “Conditions?” she asked. “Of course,” Yukari Yakumo said, lightly tapping the ground with the tip of her umbrella. “First, you and your people must obey my orders from now on.\n\n Not to always bow down to me, but when I determine that Gensokyo needs you, you cannot disobey.”\n\n She paused, her gaze falling on Flandre. “Second, keep a close eye on her.” These words silenced the battlefield even more than before.\n\n Yukari Yakumo's voice remained soft, yet each word seemed to pierce to the bone. “I allow you to live, and I allow you to stay.”“But this child cannot be out of control.”\n\n “If she again directs her power towards Gensokyo like she did today—I will kill you first, then she.” Remilia listened without speaking immediately.\n\n She knew she had lost, and she knew this was not charity, but a pass with chains.\n\n But she also knew she had no better path. So she slowly stood up, her cloak stained with blood, yet her posture remained upright. She glanced at Flandre, then at Meiling and Patchouli, who were still standing there wounded, before finally looking back at Yukari Yakumo. “What if I agree?”\n\n Yukari Yakumo's smile remained unchanged. “Then you can bring your people into Gensokyo alive.” The wind blew through the cracks, making the flag and mist tremble. Flandre was still standing there, the light in her eyes not completely gone, but her hand finally slowly lowered.\n\n Remilia looked at her, closed her eyes one last time, and when she opened them again, her voice was steady. “Okay,” she said. “I swear in Scarlet's name.”\n\n Yukari Yakumo tilted her head slightly, as if waiting for the most important sentence.\n\n Remilia's voice was lower, yet clearer. “I will obey your commands.”“I will watch over Flandre.”\n\n “My oath to you will not be broken—unless you die.” At that moment, the crack at Yukari Yakumo's feet shone faintly, as if the oath itself had been incorporated into the rules of Gensokyo.\n\n From that moment on, the people of Scarlet Devil Mansion were able to enter Gensokyo.\n\n Not as conquerors. But as outsiders permitted and bound by the sages.\n\n Remilia lost that battle, but she did not lose her future.\n\n And the vow she made to Yukari Yakumo, etched into their very being, weighed heavily on the Scarlet family's roof from that day forward."
scarlet.79.a:0 "This vow could not be broken until Yukari Yakumo died."

scarlet.80.t:0 "A sister like a shell"
scarlet.80.d:0 "On the third day after the seal took effect, Scarlet Devil Mansion was eerily quiet.\n\n It wasn't that there were no footsteps, nor commands, but something that should have been there was missing—Flandre's voice.\n\n Remilia stood in the basement doorway, watching her sister sit on the edge of the bed. Her back was ramrod straight, her hands on her knees, like a carefully arranged doll. When sunlight fell on her face, she would turn her head; if a doll fell over, she would reach out to straighten it; if someone called her name, she would look up and respond.\n\n But that was all. She no longer suddenly laughed out loud, no longer stared at anything for too long, no longer acted up, and no longer showed fear. There was no hostility in her eyes, nor any attachment. To her, Scarlet Devil Mansion was like a meticulously painted background—walls were walls, doors were doors, her sister was her sister, but they were all merely “existences,” devoid of weight.\n\n As Remilia approached, Flandre looked up and obediently asked, “Sister, is there anything I can do for you today?”\n\n Her tone was too flat. Flat, unlike Flandre's usual self. Remilia looked at her, her throat feeling slightly constricted. She would rather her sister throw a tantrum, rather she tore her doll in half, rather she cried, she screamed, she rushed to hug her, than see this completely sealed-off silence.\n\n She reached out and touched the top of Flandre's head. Flandre didn't dodge or move closer; she simply let her touch her quietly, as if cooperating with something she had already learned. “Do you want to go out?” Remilia asked.\n\n Flandre blinked, as if seriously considering.\n\n “If you think it's okay, I'll go out.”\n\n “And do you miss me?” Flandre paused for a second, her lips curving slightly. “I should.”\n\n Those words were like needles, lightly, yet deeply.\n\n Remilia finally understood that Patchouli's spell hadn't saved her sister, but rather suppressed the calamity, thinning her along with it. The body before her could still breathe, still speak, still obey commands, but the child inside—the one who could laugh, who could be afraid, who could secretly whine, who would cling to her sister at night—was like someone locked away in a deeper place.\n\n From that moment on, Remilia knew—this wasn't the answer.\n\n This was just postponing the problem."
scarlet.80.a:0 "This isn't the sister I wanted."

scarlet.81.t:0 "Patchouli's method"
scarlet.81.d:0 "That night, Remilia went straight to the library.\n\n Patchouli was sitting behind a long table, a pile of manuscripts about seals, bloodlines, and the Youkai structure spread out before her. As if she had known Remilia would come, she didn't even look up, only asking casually as Remilia approached:\n\n “You finally realized something was wrong with her?”\n\n Remilia didn't sit down.\n\n “I'm not here to listen to nonsense,” she said. “I just want a solution. I want her to get rid of that destructive force, I want her to live normally, to be happy, to be like a real…”\n\n She stopped.\n\n Because she suddenly realized she couldn't finish the word.\n\n Patchouli finished it for her.\n\n “Like a normal child?”\n\n Remilia's gaze turned cold.\n\n “Is there a way?”\n\n Patchouli remained silent for a long time. So long that the clock in the library ticked twice before she finally put down her pen and slowly looked up.\n\n “Yes.”\n\n Remilia's fingers immediately tightened.\n\n Patchouli looked at her, her voice steadier and colder than usual.\n\n “To stop her from being a vampire.”\n\n The air seemed to freeze.\n\n Remilia didn't immediately understand, or rather, she didn't want to understand.\n\n “... Say that again.”\n\n “Turn her from a vampire into a human.” Patchouli repeated mercilessly, “Not a disguise, not suppression, but a fundamental change. As long as she no longer possesses that overly powerful structure, no longer has the vampire's ability to shatter the world, she can get rid of that uncontrollable destructive power.”\n\n She paused, then added:\n\n “In other words, if you want a normal, happy, and stable younger sister, you have to cut the “Scarlet family monster” off her first.”\n\n Remilia stared at her, her eyes like knives.\n\n “Do you know what you're saying?”\n\n “Of course I know,” Patchouli coughed. “I also know it sounds blasphemous.”\n\n She pushed a sheet of paper covered in formulas onto the table.\n\n “But if you want results, this is the closest you can get.”\n\n “Sealing can only suppress, not cure; isolation can only delay, not save. To truly rid Flandre of that power, she must become someone who isn't born with calamity.”\n\n The library was eerily quiet.\n\n Remilia stood before the table, for the first time feeling that she would rather Patchouli say there was no solution than hear this answer.\n\n Because this method is too effective, and too cruel.\n\n It's not repairing her sister.\n\n It's demanding that she give up who she is."
scarlet.81.a:0 "Become human...?"

scarlet.82.t:0 "Vampire, or sister?"
scarlet.82.d:0 "Remilia stood alone in the corridor for a long time.\n\n The red mist outside the window was still there, and the lights on the wall were still on, but for the first time, she felt that the entire Scarlet Devil Mansion was very far away from her.\n\n Patchouli's words were still stuck in her ears, like an extremely fine saw, slowly cutting the place she least wanted to touch.\n\n Make Flandre human. That's certainly a solution. Humans feel pain, age, hunger, and fear; but humans won't crush the entire corridor and garden just because of a momentary emotional lapse. Humans can have daily lives, grow up, walk in the sunlight, and be embraced normally without needing to be sealed.\n\n That sounds like almost exactly what she'd always wanted to give her sister.\n\n But that's where the problem lies. If Flandre becomes human, will she still be Flandre Scarlet?\n\n Remilia leaned against the window and slowly closed her eyes. She remembered Europe from long ago, the burning castle, how she dragged her sister along during their exile; she remembered those nights when Flandre nestled in her arms, her wings tattered, her body covered in blood, yet her eyes still only recognized her.\n\n That was her sister. The vampire's sister, a Scarlet child, someone who shared the same darkness as her.\n\n She didn't want to cut it all off with her own hands.\n\n But she also knew she had no better way.\n\n If she kept her sealed, Flandre would gradually become an empty shell; if she released the seal, she could revert to calamity at any moment. Patchouli's answer was terrifying, but it was the first truly tangible answer pointing to a “way out.”\n\n When Remilia opened her eyes, her gaze had turned cold again.\n She didn't immediately agree.\n\n Nor did she immediately refuse.\n\n She simply uttered a low voice, as if swearing to herself: “I won't leave her with only one choice.”\n\n If she wanted to lose her vampire status for a peaceful life, she needed to see that path more clearly; if there were other ways, she would definitely dig them out of that dead end.\n\n Because Flandre was first and foremost her sister.\n\n Only after that came calamity, power, bloodline, or any name others had bestowed upon her.\n\n Remilia would never accept this easily—to save her sister, she must first kill the half-vampire within her."
scarlet.82.a:0 "I haven't chosen yet, but I have no way out."

 scarlet.83.t:0 "The Head Maid's Oath"
scarlet.83.d:0 "Sakuya received the orders at night.\n\n The flight path, supplies, departure time, and the list of those remaining at the mansion—everything was meticulously compiled into a booklet, the handwriting as clean as a knife's edge. She knew better than anyone that Remilia's mission wasn't just a simple long journey, but rather to push the will of Scarlet Devil Mansion even further.\n\n But she didn't try to dissuade her, nor did she ask if it was worth it.\n\n Because for Sakuya Izayoi, this was something that never needed to be weighed. She remembered when she didn't even have a surname, remembered that painfully cold alley on the American West Coast, remembered the feeling of being abandoned, where even crying seemed superfluous. It was Remilia who picked her up from that place, gave her clothes, a name, rules, and a place to survive.\n\n Without Remilia, there would be no Sakuya Izayoi.\n\n So when the young lady decided to return to Europe, to expand outwards, to fight against fate itself, the only thing Sakuya would do was pave that path.\n\n She stood before her desk, turned to the last page of the plan, and muttered to herself, as if giving herself a command.\n\n “As long as the young lady is here, I will follow.”\n\n She never stayed at Scarlet Devil Mansion because of ideals.\n She existed because of Remilia.\n\n If the young lady wanted to conquer the world, she would restore order to the world; if the young lady wanted to wage war against fate, she would sharpen herself into the sharpest blade. She didn't need to be persuaded, nor did she need to be comforted. All she needed to know was that Remilia was alive and moving forward.\n\n That was enough."
scarlet.83.a:0 "Without Remilia, there would be no Sakuya Izayoi."

scarlet.84.t:0 "The thoughts of the person in front of the door"
scarlet.84.d:0 "Meiling was standing at the door, looking at the fog, when she received the order.\n\n Unlike Sakuya, she didn't immediately fill out a form, nor did she consider supplies and research like Patchouli. She simply remained quiet for a while, putting her hands behind her head and staring out the door for a long time without speaking.\n\n She knew why Remilia had to leave. She also knew that Remilia wasn't the kind of master who would stop because the risks were too great. If it was for Flandre, to create more options for Scarlet Devil Mansion, she would truly turn the other side of the sea into her battlefield.\n\n Meiling didn't actually dislike this. Because back in Shanghai, if Remilia hadn't pulled her from under the bridge, she would have died that night. She was grateful for the life-saving grace and was willing to guard the Scarlet Devil Mansion and shield Remilia from harm.\n\n However, a lingering thought remained in her heart: If only fewer people could die.\n\n If only more escape routes could be left open.\n\n She knew this thought was sometimes naive. The world doesn't treat those with soft hearts kindly, and Remilia wasn't someone who would ascend the throne through gentleness. Yet, she still hoped that when carrying out orders, she could shield those who shouldn't die, offer a word of advice, and spare a few lives.\n\n Finally, she smiled, a smile almost as normal as ever. “Alright,” she said softly.\n\n “Young lady, go ahead, and I'll guard the door for you.” She would obey.\n\n Because that was the one who saved her.\n\n But she would also try her best to protect not only the dignity of Scarlet Devil Mansion, but also things that didn't have to die."
scarlet.84.a:0 "I will obey orders, but I still want to keep a few more people alive."

 scarlet.85.t:0 "Private Thoughts in the Library"
 scarlet.85.d:0 "Patchouli had long suspected that Remilia would eventually take this path.\n\n She knew that vampire too well. The more cornered Remilia was by fate, the less likely she was to back down. She would bite back at fate until she dragged the whole situation into her own night.\n\n So when the words “return to Europe,” “expand research and industry,” and “prepare for more options in the future” were placed on her desk, Patchouli was not surprised. She simply flattened the pages of manuscripts and listed out the routes, potions, techniques, equipment, personnel, and feasibility one by one.\n\n She would help. Not only because Scarlet Devil Mansion couldn't do without her, and not only because this path might ultimately provide Flandre with the answer.\n\n More importantly, because she owed Remilia a life. That year during the Irish famine, if Remilia hadn't stopped in front of that dilapidated bookstore, she would have died long ago. Not in the war, not in some great turning point in her life, but by the door, clutching a book, quietly and cheaply starving to death.\n\n Remilia took her away, gave her medicine, gave her time, and gave her the opportunity to continue reading and to continue living.\n\n So of course she would do her best.\n\n But beyond doing her best, Patchouli had a rather unseemly selfish motive.\n She hoped Remilia would look at her more. Not at a sorceress who could cast spells, not at a tool that could manage a library and research, but at her as a person. She didn't ask for gentleness, nor did she expect any praise. She sometimes wondered, if one day she wasn't just “that Patchouli who could help,” what would be left between them?\n\n She suppressed this thought deeply, finally letting it morph into a cold, indifferent statement.\n\n “I'll produce the solution you need.”\n\n After saying this, she paused, swallowing the rest of her sentence.\n\n—You'd better not take me for granted."
 scarlet.85.a:0 "I will help you, because I haven't paid back my life yet."

 scarlet.86.t:0 "That Book and the Frail Girl"
 scarlet.86.d:0 "Patchouli wasn't always a witch.\n\n Before becoming “Patchouli Knowledge,” she was just an ordinary human girl who coughed, got hungry, and whose fingers would turn white from the cold on winter nights. She was unwell, short of breath, and had to stop after walking a few steps. If such a person were born in a peaceful era, they would at most be called unlucky; but she lived in an era where even bread wasn't enough to go around, so she understood early on that she couldn't survive on the pity of others.\n\n She didn't have many things to hold onto.\n\n One of them was books. Not some gilded holy book, nor a thick volume used to display respectability in a noble's study, just an old book with pages almost falling apart. The cover was worn, the corners had been soaked in water, and the edges of the pages bore dark fingerprints from repeated reading. But she held onto it, when she was hungry, when her cough was at its worst, like clinging to a piece of driftwood that refused to sink.\n\n The book wasn't initially all magic.\n It contained herbs, pathology, fragments of ancient language, several error-ridden alchemical notes, and a small section of incomplete spell diagrams. Most people would find it obscure and useless after a couple of pages, but Patchouli treated it as the only thing that could keep her alive a little longer.\n\n From that jumble of knowledge, she learned one thing: the world doesn't operate solely on its surface.\n Fire doesn't just burn, water doesn't just flow; words and symbols, when arranged correctly, can pry open a tiny crack in reality. So she began to learn.\n\n She studied while coughing, studied while hungry, studied by the flickering candlelight while others slept. She had no famous teachers, no system, and no one to guarantee that she was on the right track. She simply relied on her almost stubborn dedication to piece together the broken threads in the books, one by one. She first learned to identify, then to deduce, and then to transform those strange symbols into something that could actually work. She didn't suddenly gain power.\n\n She forced herself to read the power page by page.\n\n It was during that time that Remilia saw her for the first time.\n\n Not in a tower, not at a banquet, but at the entrance of a dilapidated bookstore.\n\n At that time, Patchouli was so thin she looked like she could break at any moment, her face was almost transparently pale, and her chest rose and fell very slowly, as if she might run out of breath at any moment. But she was still clutching that book, clutching it tighter than her own life.\n\n Remilia didn't look at her face first. She looked at the book first.\n\n Then she looked at her hand holding the book.\n\n A person on the verge of starvation and death, yet still clinging to knowledge—that sight was more meaningful than any struggle for survival. Because it meant that this child wasn't waiting for someone to save her; she was finding a way to survive through the book.\n\n After that one glance, Patchouli didn't lose her life at the bookstore entrance.\n\n And that old book, which she never parted with, slowly transformed from a “proof of survival” into the starting point of her becoming a witch."
 scarlet.86.a:0 "She grabbed the book first, and then she grabbed her life."

 scarlet.87.t:0 "The person who turns knowledge into magic"
 scarlet.87.d:0 "The later Patchouli truly resembled the witch people spoke of.\n\n But it wasn't because talent suddenly descended upon her, nor because she was bestowed with a mysterious grace. She simply read that book too deeply, so deeply that what were originally broken clues on the pages were pieced together again into a complete structure in her hands.\n\n She began to be dissatisfied with simply copying.\n\n She corrected errors, filled in the gaps, and recalculated the nodes and flow of those long-lost spells. She knew which herb, if mixed incorrectly, would be deadly, and she knew which spell, if added too much, would set the entire room ablaze. She learned slowly, but she learned accurately, because she never had the luxury of making any major mistakes from the beginning.\n\n That old book always stayed with her. It was not just a record, nor was it just a textbook. Inside were her earliest annotations, the marks she made after her first success, the revisions she wrote through the nights while coughing up blood, and several pages so thin they seemed about to crumble at the slightest touch. That book witnessed her stubbornness as a mortal, and it witnessed her gradual transformation from a “dying scholar” into a “true magician.”\n\n Some people think becoming a witch is a transformation.\n\n Patchouli wasn't. She was more like someone who, through years of reading, deduction, and experimentation, gradually rewrote herself into another form of being. When she first managed to fully unfold a magic circle without copying, relying solely on her understanding, she didn't cheer; when she first successfully stabilized a dangerous spell, she didn't feel triumphant. She simply wrote that page down in the book, as if confirming—okay, this part is now mine.\n\n Remilia later witnessed her casting spells many times. Fire, ice, metal, pressure, seals—Patchouli used them without fanfare, yet with extreme precision. But more than the glowing results, Remilia remembered the earliest scene: the girl on the verge of collapse, still clutching an old book.\n\n Because she knew that what truly made Patchouli a witch wasn't magic itself.\n\n It was her almost pathological obsession with knowledge.\n\n So even today, that book remains with her.\n Placed closest to her on her desk, it bears the wear and tear of its age and her own handwriting. It's no longer her strongest book, nor the most dangerous item in the library, but it's more untouchable than any forbidden book. That was the opportunity that made her a witch.\n\n It was the proof that she had read her way up from mortal to magician.\n It was also the knowledge that Remilia held tightly in her hands when she first saw her, refusing to relinquish it no matter what.\n\n Some people gain power first and then find reasons for it.\n\n Patchouli was not like that.\n\n She grasped the reasons first, and then gradually read out the power."
scarlet.87.a:0 "That book was never just decoration."


 scarlet.88.t: "Shadow in the Factory"
 scarlet.88.d: "Patchouli's industrial restructuring had barely begun when obstacles arose.\n\n Blueprints would lose crucial pages after nightfall, ores would be switched before inventory, and newly installed machinery would inexplicably stop during trial runs. The most troublesome thing wasn't the destruction itself, but that each act of sabotage happened precisely at the most critical point—not a single extra bit of damage was enough to slow down progress and throw morale into disarray.\n\n Patchouli initially thought it was just the remnants of the old forces at work, until she laid out the incident times, resource flows, and personnel movements on the table, and saw the deeply hidden thread: these people weren't here to steal, nor to create chaos; they were observing, calculating, and dismantling the future industrial framework of Scarlet Devil Mansion inch by inch.\n\n “They're not here to steal.” Patchouli stopped her pen at the edge of the blueprints, her voice chillingly cold.\n “They're here to prevent us from ever building it.”\n\n Koakuma leaned down to glance at the compiled outline, her smile vanishing completely.\n “This method... doesn't seem like something from Earth.”\n\n Patchouli didn't look up, only lightly circling the standard Lunar Capital markings.\n\n “It's Lunar Capital.” She finally understood that Scarlet Devil Mansion was facing not just a few dirty hands reaching into the workshop, but an entire system of surveillance and sabotage from the Moon. As long as these informants remained, any blueprint, any factory, any new weapon could be cut short before it was even completed."
 scarlet.88.a: "Dig out all the eyes hidden in the factory."

 scarlet.89.t: "Eientei's silence"
 scarlet.89.d: "The answer wasn't found by Patchouli first.\n\n Eirin delivered herself to her.\n\n She came without guards or any further explanation, just standing in the library like someone finally deciding to lay bare their past. She looked at the documents on Patchouli's table, at the dismantled Lunar Capital markings, and remained silent for a long time before speaking.\n\n “I knew long ago that the death of Hakurei Shrine Maiden was wrong.”\n\n Koakuma's eyes immediately turned cold. Patchouli didn't interrupt, but waited for her to continue.\n\n “I knew it wasn't a simple accident, and I knew the investigation would point to Lunar Capital,” Eirin said, her voice flat, almost ruthless. “But I chose to suppress it.”\n\n She admitted it readily, and it sounded harsh.\n\n In her eyes at that time, the dead were just shrine maidens. A human being on the ground, a position to be replaced. Revealing the entire shadow of Lunar Capital would only hasten the loss of control. So she cut off the clues, steered the investigation astray, and let the trail that could have been followed slowly rot away.\n\n “I thought this would prevent even greater chaos,” she said.\n\n Patchouli finally looked up, her voice icy.\n “Then Yukari Yakumo died too.”\n\n Eirin closed her eyes. “Yes.”\n\n This time, she could no longer treat it as an acceptable price to pay.\n\n She could calmly analyze the death of the shrine maiden; but with Yukari Yakumo's death, the entire Gensokyo was torn open. She finally understood that her previous self-righteous cover-up wasn't stopping the bleeding, but rather sharpening the knives of Lunar Capital even faster."
 scarlet.89.a: "She finally admitted that she was completely wrong back then."
 # scarlet.89.b: ""

 scarlet.90.t: "The Sage of the Moon's Responsibility"
 scarlet.90.d: "Eirin didn't ask for forgiveness.\n\n She simply placed a list on the table. It listed undercover agents, rendezvous points, Lunar Capital's commonly used identity swaps, and communication nodes hidden within caravans, clinics, and supply lines—all meticulously documented. This wasn't something someone shirking responsibility would produce; it was a gesture of preparing to tear apart the old order with her own hands.\n\n “I don't agree with Lunar Capital's current actions,” she said.\n “Even more so, I don't accept them treating Gensokyo like a specimen to be dissected.”\n\n She looked up, her eyes for the first time truly resembling those of a lunar sage, not a healer from Eientei.\n\n “I bear responsibility for the death of Shrine Maiden, the death of Yukari Yakumo, and everything that followed.”\n “Because I knew Lunar Capital was making moves, but I didn't stop them on the spot.”\n\n She didn't shift the blame to others, nor did she try to find a plausible excuse. She simply stated her position.\n\n “So this time, I will take responsibility.”\n\n Patchouli looked at the list, neither believing nor disbelieving. She only knew that Scarlet Devil Mansion's industries, workshops, and future could no longer allow Lunar Capital forces to continue operating in the shadows.\n\n Koakuma put the stack of documents in her hand, her smile thin and cold. “Very good.”\n\n She tapped the cover of the list lightly.\n\n “Then let's start by clearing out the people from Lunar Capital.”\n\n Eirin didn't object.\n\n Because she knew very well that this wasn't about negotiating or exchanging anything.\n\n This was a responsibility she, as the Sage of the Month, had to personally fulfill."
 scarlet.90.a: "She will be responsible for the mess left by Lunar Capital."


 scarlet.91.a: "The Sage of the Moon's Scheme"
 scarlet.91.d: "Eientei's nights were always quiet, but this night was eerily quiet. Eirin Yagokoro sent out the signal.\n\n The words were few, the tone calm, like any emergency notification requiring Lunar Capital's top management: the situation on the ground was unbalanced, evidence had been recovered, Scarlet Devil Mansion had not yet gained control of the true chain of command, and Lunar Capital was requested to send its highest-ranking personnel to handle the situation personally.\n\n She wrote it accurately. As accurately as she had countless times before when she had cleaned up for Lunar Capital.\n\n But this time, she wasn't wiping away Lunar Capital's blood.\n\n She was opening the door for Scarlet Devil Mansion. After sending the signal, she didn't turn back, but stood at the edge of the bamboo forest, watching the wind pass through the leaves. Many years ago, she and her companions established Lunar Capital, originally just wanting to provide a place where those who couldn't survive on the surface would no longer be polluted or hunted.\n\n Their ideals were simple then: refuge, continuation, and preservation of civilization.\n\n But everything changed. Lunar Capital began to loathe filth, to the point of being almost pathological; it began to equate cleanliness with nobility, and to take the condescension of life on the ground for granted. From rejection to separation, to observation, to manipulation, and finally, even daring to lay hands on shrine maidens and Yukari Yakumo. What she initially wanted to build was a refuge, but Lunar Capital ultimately grew into a high wall that treated conspiracy as order and slaughter as a necessary means.\n\n She knew she bore some responsibility for this. Tonight, she would watch as the students she had once taught, the blades she had nurtured with her own hands, were broken by another group of monsters.\n\n The people from Scarlet Devil Mansion had arrived. Sakuya was in charge of blocking the road, Meiling guarded the outer edge of the bamboo forest, Patchouli and Koakuma were stacking spells deeper inside, and Remilia herself stood quietly in the shadows, like the final answer that would appear in a real killing game.\n\n Eirin didn't speak again. She just muttered to herself, as if saying a final goodbye to an ideal that had died.\n\n “If this is truly the result of my mistakes... then let me watch it be settled.”"
 scarlet.91.t: "The bait is set; the Lunarians will walk into the trap on their own."

 scarlet.92.a: "Lunar Capital executives in the bamboo forest"
 scarlet.92.d: "The first to land in the bamboo grove was Sagume Kishin.\n\n She didn't make a big fuss, only carrying the calm and arrogance unique to the high-ranking members of Lunar Capital, as if the world's situation was hers to correct. She didn't speak immediately after she stopped, clearly sensing that something was wrong—the wind was too still, the path too clean, even the bamboo shadows seemed to have been pre-arranged.\n\n Next were Watatsuki no Yorihime and Watatsuki no Toyohime.\n\n The two sisters, one strong and one gentle, one carrying an almost undisguised killing intent, the other still maintaining a Lunarian composure. When they saw Eirin, they both clearly paused for a moment. In that moment, there was no doubt, only instinctive trust—to their teacher, to their senior, to the sage who had laid the foundation for Lunar Capital for them.\n\n In that instant, the deadly trap was sealed.\n\n Patchouli's spell activated first. Not a dazzling grand magic, but dozens of pre-laid sealing arrays activated simultaneously, the entire bamboo forest slamming shut like an invisible, thick book. Koakuma pressed the final seal into the air, smiling sweetly. “Communications cut off, escape route blocked,” she said.\n\n Sagume's eyes finally darkened.\n\n “Eirin,” Yorihime spoke first, her voice so cold it seemed to freeze the bamboo leaves, “What does this mean?” Eirin stood further away, offering no answer.\n\n She couldn't answer.\n\n Because if she opened her mouth, the whole situation would turn into a defense. Remilia then stepped out of the shadows.\n\n The red mist slowly spread around her feet; her tone was low, yet it was like a blade scraping against moonlight. “The meaning is simple.”\n\n She looked at the three Lunar Capital executives before her, her smile thin.\n\n “You've overstepped your bounds; now it's Scarlet Devil Mansion's turn to cut it down.”\n\n Yorihime almost immediately drew her sword, while Toyohime took a half-step back, preparing to use her fan to create an opening. But Sakuya had already cut in from their flanks, shortening both time and distance; Meiling stood in the only direction she could force her way out, her shoulders slightly hunched, her breath as steady as a wall. The Lunar Capital executives finally understood.\n\n They weren't there to deal with the chaos on the ground.\n They were lured here by Eirin herself and sent to the slaughterhouse of Scarlet Devil Mansion."
 scarlet.92.t: "They came, and they can't get out."

 scarlet.93.a: "Pull out the moon's teeth."
 scarlet.93.d: "The real fighting didn't last long.\n\n Because Scarlet Devil Mansion wasn't there to fight this time.\n\n They were there to cleanse. Sagume Kishin was the first to be targeted. Her ability was too troublesome; once she spoke, the situation could reverse. Patchouli didn't give her any room to speak from the beginning, the Seven Luminaries Seal layer upon layer, suppressing her voice and will to an extremely narrow space.\n\n Koakuma attacked from the side, slapping on talismans one after another, as if sealing a dangerous sentence. “Tonight, you'd better keep quiet,” she said with a smile. Sagume looked up at her, her eyes still cold, but she had already lost the ability to speak.\n\n The next instant, Sakuya's blade flashed, blood first appeared on her throat, and the seal pressed down again.\n\n This Lunar Capital executive was cut off from the battlefield before she could even fully unleash her ability. Watatsuki no Yorihime was completely different. Her first move was a direct, head-on attack, layer upon layer of sword strikes and divine power, as if she wanted to slice through the entire sealing array and bamboo forest. She was indeed astonishingly strong, even forcing Meiling to take a half-step back.\n\n But Scarlet Devil Mansion didn't play by any rules—Meiling held the line head-on, Sakuya cut in from a blind spot, Remilia personally pressed down with killing intent from above, and Patchouli didn't forget to add a heavy pressure spell at her feet, slowing down every moment she used divine power to shift her stance.\n\n In the end, Yorihime still managed to injure Remilia's cloak and also made Meiling's arm go numb. But she couldn't break through. The moment Sakuya's sword forced her to a standstill, Remilia closed in, the tip of her spear piercing her chest.\n\n Yorihime tried to move again, but Meiling had already pinned her to the ground.\n\n Watatsuki no Toyohime is harder to catch than her sister.\n\n H ...\n\n When the battle ended, only broken magic marks, crushed leaf shadows, and the gradually cooling bodies of three Lunar Capital executives remained in the bamboo forest.\n\n Scarlet Devil Mansion used all its strength, leaving no room for retreat.\n\n They weren't demonstrating.\n They were pulling out the moon's fangs, one by one."
 scarlet.93.t: "The executives of Lunar Capital died in the bamboo forest tonight."

 scarlet.94.a: "Eirin watched Lunar Capital die."
 scarlet.94.d: "The bamboo forest was eerily quiet after the battle.\n\n Eirin stood by the side the whole time, never making a move.\n\n She watched Sagume Kishin get trapped, watched Yorihime and Toyohime gradually lose their chance to fight back in the encirclement, watched the two sisters she had once taught, supported, and even placed her hopes on finally fall to the ground, never to rise again. It wasn't that she was reluctant to let them go.\n\n Quite the opposite.\n\n She knew all too well how Yorihime had developed her swordswomanship, and she knew all too well how many training sessions had been required to cultivate Toyohime's composed stance. They were her former apprentices, the symbol of Lunar Capital's continuation, a part of what she had once thought “at least had a future.” But she could only watch.\n\n Because she knew that what was dying now wasn't just three people.\n\n What was also dead was the reason she had originally established Lunar Capital.\n\n She once thought that Lunar Capital should be a place where people who couldn't survive on the surface could find refuge, a sanctuary, a continuation of civilization, a pure land no longer entangled in the chaos and decay of the surface. But from some point onward, the pure land became fastidiousness, nobility became arrogance, order became contempt, and finally, even other life itself was regarded as material that could be cut, manipulated, and discarded. The place she had personally built had grown into the form she least wanted to admit.\n\n Conspiracy, cutting, slaughter, observation, denial.\n\n Lunar Capital is no longer a refuge.\n\n It's a high wall that treats those “not of our kind” as something to be disposed of as a matter of course.\n\n Remilia walked past her through the blood and mist, offering neither comfort nor sarcasm. She simply left behind a single sentence. “This is the result you wanted me to see.”\n\n Eirin didn't deny it.\n\n She lowered her head, looking at the corpses on the ground, and for the first time didn't try to categorize or analyze them from a healer's or sage's perspective, but simply said very slowly: “I made a mistake.”\n\n It wasn't a single step.\n\n It was many steps.\n\n She allowed Lunar Capital to use purity as a weapon, allowed its leaders to regard earthly life as filth, and allowed herself to repeatedly delay cutting off what needed to be cut by claiming “it's still under control.” Until the shrine maiden died, until Yukari Yakumo died, until tonight, she could only stand here, watching Scarlet Devil Mansion settle her score.\n\n The wind through the Bamboo Forest passed through her sleeves, as cold as the moon.\n\n But Eirin knew this wasn't the end.\n\n This was just the beginning of her truly taking responsibility for Lunar Capital's corruption."
 scarlet.94.t: "She finally admitted that Lunar Capital was ruined in her hands."


 scarlet.95.a: "The Bookseller's Daughter"
 scarlet.95.d: "Patchouli wasn't born into the shadows and incantations.\n\n Her earliest home was just an ordinary bookstore. The storefront was small, the wooden shelves old, drafty in winter, and the pages easily damp in summer. Her family weren't scholars, nor were they noble collectors; they were just a group of ordinary booksellers who made a living by peddling knowledge. Church people would come looking for scriptures, down-on-their-luck students would come to look through old textbooks, people wanting to do business would ask about account books and maps, and occasionally there would be some strange-looking customers who would lower their voices to ask about forbidden things.\n\n Patchouli grew up in that kind of place. Her health was very poor; she would be out of breath after running just a few steps, cough when it was a little cold at night, and feel as if her chest was being constricted by iron hoops when the weather was damp.\n\n While other children chased each other in the street, she mostly sat behind the counter or huddled in the deepest corner of the bookshelf, watching people come and go through the doorway.\n\n But she didn't dislike it. Because she had books. Others saw books as commodities, things that could be exchanged for money; she, however, had long ago seen books as another kind of door. Opening a book was like being able to step out of that little shop a little. Herbs, geography, alchemy, history, theology, ancient sayings—she read everything, memorized everything.\n\n She read widely and deeply, like someone whose body couldn't travel far, first folding all paths into her mind.\n\n It was in those books that she found something that shouldn't be in an ordinary bookstore. The book was incredibly old, its cover worn and the corners blackened. Half the writing resembled handwriting, the other half looked like forcibly inserted spell sketches. It was neither a proper medical book, nor a church-approved text, nor a rare book that could fetch a high price.\n\n Yet, Patchouli knew as soon as she opened it that something else was hidden within.\n\n It wasn't just simple knowledge. It was a method. The book didn't directly grant her power, nor did it contain a page that said “How to Become a Magician.” It simply laid out a thin, difficult, yet undeniably real path before her—that words could be arranged to create power, that symbols and herbs, breath and will, could all be pieced together into a structure capable of altering reality.\n\n From that day on, Patchouli's way of reading changed.\n She no longer just memorized. She began to deduce, to compare, and to piece together fragmented knowledge into her own answers.\n\n Later, many people said that she became a magician because of talent.\n\n But only she knew that her initial step was not due to talent at all.\n\n She was just a weak child who could only grow up sitting in piles of books, who found a book deep in the sea of books that she refused to let go of."
 scarlet.95.t: "She grasped the book first, and then she grasped the path."

 scarlet.96.a: "Famine and the man at the door"
 scarlet.96.d: "Later, famine came.\n\n It didn't overturn the world all at once, but rather hollowed people out layer by layer. First, food prices started to fluctuate wildly, then regular customers stopped coming, and then fewer and fewer people inquired about the books that were barely selling. In the end, people no longer wanted to buy knowledge. They only wanted to buy bread, vegetables, and things to get through tomorrow.\n\n The bookstore first grew cold, then empty. Patchouli watched those familiar shelves grow more and more like bones each day. Things that could be sold in her home were taken to barter for food, things that could be pawned were moved away one by one, and even some books that should never have left the shelves were forced to be sold to people who didn't know how to appreciate them.\n\n Her family initially tried to hold on, saying that things would get better soon, but famine never stops because of anyone's dignity.\n\n One after another, people collapsed. Sickness, hunger, cold, no medicine, no food—these things combined were quieter and harder to resist than war.\n\n Patchouli quickly realized she couldn't save the bookstore, nor could she save the home she once had, where “selling books was enough to survive.”\n\n But she still kept the book. Not because it was valuable, but because it was the last thing she could hold onto. At her worst, she could no longer sit in the store and read. She could only sit on the doorstep, clutching the old book, like guarding a sinking plank. Her health deteriorated, her cough worsened, and every rise and fall of her chest felt borrowed.\n\n Rain soaked her hair, and the chill seeped into her bones, yet she still held the book tightly.\n\n Because she hadn't given up. At that time, she had almost nothing left. No home, no food, no one to shelter her from the wind, and no miracles that would fall from the sky. All she could do was use her meager strength to continue reading the book.\n\n She wasn't waiting for anyone to save her. She was using her last bit of remaining consciousness to desperately search for an answer: Was there any way to not only slow her death, but to truly turn her fate around?\n\n So when others only saw a child about to starve and die of illness, Patchouli's own thoughts were still the same— I want to live.\n\n It's not about charity, it's not about tears.\n\n It's about methods."
 scarlet.96.t: "She's about to lose everything, but she hasn't put down that book yet."

 scarlet.97.a: "The Future Picked Up"
 scarlet.97.d: "It was at that moment that Remilia saw her. Not a pitiful child.\n\n But someone on the verge of starvation, yet clinging desperately to knowledge. Patchouli later admitted that she was incredibly weak at the time.\n\n Standing was a struggle; a cough nearly caused her to collapse, her face as pale as if she might melt away with the rain. Yet, she could still lift her eyes and utter those words completely— “I'm looking for a way to survive.”\n\n Remilia loved those words.\n\n Because it wasn't a plea for mercy, nor a sign of weakness.\n\n It was the last vestige of strength held onto by someone who hadn't given up. So she took Patchouli with her.\n\n Not because she was soft-hearted.\n\n Because it would be too wasteful.\n\n From then on, Patchouli had medicine, food, a quiet space to read and experiment, and enough time to truly understand the clues in that book. Her health was still poor, her illness still flared up, and her cough at night still tore at her chest. But unlike before, she no longer had to use all her energy on “getting through today.” She used the extra energy to read, record, revise, and deduce.\n\n She began to do more than just follow the book.\n\n She began to question, to fill in the gaps, to piece together those tattered notes bit by bit, eventually turning them into her own spells. Records of failure piled up layer upon layer, and the annotations written while coughing up blood grew ever larger. She didn't suddenly gain magic; rather, through her own efforts, she painstakingly unearthed magic from the pages of the book.\n\n What Remilia gave her wasn't the answer.\n\n What Remilia gave her was the means to survive.\n\n And after that, Patchouli Knowledge was no longer just that child who would sit outside a bookstore with a book, waiting to die. She became a true magician, became that unmoving stone in the Great Library, became a human library that layered and sealed knowledge, systematized taboos, and disassembled and rewrote reality.\n\n And that book, to this day, remains with her.\n\n Because it wasn't just a book.\n\n It was the first knowledge she grasped, and the only future she wouldn't relinquish when she first met Remilia."
 scarlet.97.t: "She survived, and she also became a magician."

scarlet.98.t:0 "The first secret she summoned"
scarlet.98.d:0 "Koakuma moved lightly between the bookshelves, carrying a list, but her hands were steady. She knew which row of books she couldn't touch, which shelf was sealed, and even knew the moment Patchouli would pause before coughing. Patchouli watched her, her pen hovering over the paper, but her thoughts drifted back many years.\n\n Back then, she was still learning from Mima. Mima always liked to lean against the window and say things that sounded like jokes, but were always right.\n\n “Summoning a familiar,” she said, “isn't about finding a servant.”\n “It's about dragging the deepest structures in your mind, and the things you least want to admit, into reality.”\n\n Young Patchouli disliked this notion. She only believed in formulas, arrays, mediums, and costs; she didn't believe in any “heart.”\n\n But when Scarlet Devil Mansion was finally completed, the library returned to its place, and the first batch of seals stabilized, she still acted.\n\n That night, the pages of the entire library seemed to be turned by a single gust of wind. Runes lit up in concentric circles along the floor, and magic was drawn into the core of the array like water. Patchouli stood in the center, pronouncing each word correctly, without letting her hand tremble. She had only intended to summon a familiar that was intelligent enough, obedient enough, to organize the books and maintain order.\n\n When the array was completed, what emerged from the light was not just tools.\n\n Koakuma looked up, and the first thing she saw was her, then the bookshelves, the candlelight, and the entire building.\n She smiled naturally, as if she had always known where she was supposed to stand.\n\n In that instant, Patchouli finally remembered another sentence Mima had said:\n\n “You think you're summoning labor, but what you actually summon is often the answer you least want to say.”\n\n Patchouli later admitted that Mima was right that time.\n\n Because the first secret she summoned was never “convenience.”\n\n It was Koakuma."
scarlet.98.a:0 "Familiars are never just tools."

scarlet.99.t:0 "The deepest desires"
scarlet.99.d:0 "When Mima taught her summoning magic, she once said a very irresponsible truth in a very flippant tone.\n\n “Familiars are the manifestation of a magician's wisdom, and also the reflection of desire.”\n\n Patchouli thought she was just talking nonsense at the time. She believed in knowledge, believed in control, believed that everything should have a verifiable structure. Desire was too vague, too unclean, and too unworthy to be written into spells.\n\n But after Koakuma appeared, she slowly discovered that some things don't cease to exist just because they are denied.\n\n Koakuma is very much like her, yet not like her.\n\n She was equally fascinated by knowledge, enjoying searching for answers in books; equally adept at organizing, deconstructing, and archiving, rearranging chaos into a controllable order. But she was lighter, more direct, and less secretive than Patchouli. She would smile and stick close to Patchouli, immediately handing her medicine and water when Patchouli coughed most violently, and looking up to see her master's reaction before Remilia entered the library.\n\n It wasn't simply obedience.\n\n It was an almost instinctive concern.\n\n It took Patchouli a long time to admit that Koakuma truly symbolized not just her obsession with books, nor simply her habit of categorizing the world.\n\n Koakuma symbolized her love for Remilia.\n\n It wasn't the kind of love she would write down on paper, nor was it the kind of love she would willingly admit. That feeling was too deep, too quiet, and too early to be suppressed beneath her rationality. She hid it in research, obedience, solutions, and countless “I'm just handling your problem,” hiding it until she almost believed it herself.\n\n But summoning magic won't keep such a secret.\n\n So Koakuma came.\n She loved Patchouli, just as Patchouli loved Remilia: closeness, obedience, observation, remembering, willing to place herself in the closest, yet most unspoken, position.\n\n Patchouli didn't like the answer being too direct.\n\n But she hated denial even more."
scarlet.99.a:0 "Some secrets were known to the practitioners before they were even born."

scarlet.100.t:0 "The last member of Scarlet Devil Mansion"
scarlet.100.d:0 "After Scarlet Devil Mansion truly took shape, the doors were guarded, the accounts were managed, the master sat in her rightful place, and the library was no longer just a temporarily borrowed space. Many things had settled down, but one last piece was missing.\n\n That piece wasn't a wall, nor a book.\n\n It was Koakuma. She was the last member to join Scarlet Devil Mansion, but she wasn't brought in by anyone. She was summoned by Patchouli herself, born from a spell in the deepest part of the library, witnessed by a magic circle and countless books.\n\n When she appeared, there was no exaggerated declaration, no astonishing pressure. She simply emerged from the light and the sound of turning pages, as if naturally filling a place that should have always been there.\n\n She bowed to Patchouli first. “Master.”\n\n Then she looked up at the library, at the candlelight, at the rows of forbidden books, and at the door in the distance leading to the corridor and other people.\n\n She didn't ask herself who she was, nor why she was there. It was as if she had known from the beginning that she was meant to stand by Patchouli's side.\n\n From that day on, she filled the final gap in the library's operation. Handing over books, filing, sealing, changing candles, testing drugs, recording experimental deviations, smiling before a visitor made a mistake—she became increasingly adept at these tasks, as if they flowed into her daily life like blood.\n\n And Patchouli tacitly allowed her to approach. Without saying she liked her, without saying she needed her, she kept her in the closest place to herself.\n\n For Patchouli, this was more direct than any praise. The people in Scarlet Devil Mansion later got used to Koakuma's presence, as if she was meant to be there.\n\n But only Patchouli herself knew that Scarlet Devil Mansion hadn't chosen Koakuma.\n\n She had summoned her. She wrote her knowledge, her order, her secrets, and the love she had never spoken into that summoning that night.\n\n And so, the last member of Scarlet Devil Mansion was finally complete.\n\n And from that moment on, the library was no longer just Patchouli's territory."
scarlet.100.a:0 "She was the last to join, and also the first to be written into the answer."

 scarlet.101.t:0 "A quarrel before the alchemy begins"
scarlet.101.d:0 "The Great Library was unusually noisy.\n\n Patchouli cleared out an entire long table, placing a crucible, measuring cups, talismans, metal powder, three suspiciously colored liquids, and an alchemy notebook with its pages almost falling apart. Koakuma, holding the materials list, paced back and forth around the table, increasingly feeling that today wasn't like conducting an experiment, but more like preparing for a legal explosion.\n\n “Let me check first.” Koakuma picked up a small bottle and waved it in the candlelight. “This is a catalyst, not jam?” Patchouli didn't even look up.\n\n “If you spread this on bread, you won't need to eat breakfast tomorrow.”\n “I understand, it's not jam.”\n\n Koakuma put down the bottle and pointed to another bowl of shimmering powder.\n\n “And this?” “Stardust.”\n “Looks like the sugar you refused to drink last time because it was too sweet.”\n\n Patchouli finally looked up, her tone icy.\n\n “You can try it.\n\n I'll write your will for you while I'm at it.”\n Koakuma immediately pulled her hand back, but continued talking.\n\n “I just wanted to help you make sure the labels were clear enough.\n After all, half of this food looks like it could take a floor off Scarlet Devil Mansion.” “You're talking a lot today.” “Because you're planning to turn stones into gold today.”\n\n Patchouli turned to a page in her notebook, her tone as flat as if she were reading out a menu.\n\n “Add salt ash first, then metal powder.\n\n After the crucible stabilizes, pour in solution number three.”\n “Which bottle is number three?” “The one marked “three”.”\n\n Koakuma looked down and saw two bottles on the table, both marked with the number three.\n\n “... You did this on purpose, didn't you?”\n\n Patchouli was silent for two seconds, then reached out and moved one of the bottles aside.\n\n “That's yesterday's three.”\n\n “What's the difference between yesterday's three and today's three?”\n “Yesterday's three would blow your eyebrows off, today's won't.”\n\n Koakuma's eyes widened.\n\n “You should have said this sooner!”\n\n “I'm saying it now.”\n The two went back and forth, their voices growing louder and louder, even the dust on the bookshelves seemed to be shaken off by the noise.\n\n By the time Koakuma lit the cauldron, the entire library was no longer just doing alchemy, but rather like they were concocting a disaster with their words.\n\n"
scarlet.101.a:0 "Don't blow it up yet, first figure out which bottle is today's three."

scarlet.102.t:0 "The Head Maid and the Danger List"
scarlet.102.d:0 "The first one disturbed was Sakuya.\n\n When she pushed open the library door, her face was colder than usual. Her gloves were snow-white, and her skirt was straight; she had obviously come to catch a criminal who violated the library's quiet rules. But as soon as she entered, she saw Koakuma standing on the ladder, holding a measuring cup in her left hand and a spatula in her right, shouting:\n\n “I told you this color looks ominous!”\n\n Patchouli sat at the table, replying to her expressionlessly:\n “If alchemy looks safe, then there's a real problem.”\n\n Sakuya stood in the doorway, silent for a full three seconds.\n\n “Excuse me,” she finally spoke, “is this an experiment, or a kitchen coup?”\n\n Koakuma immediately turned around as if seeing a savior.\n “Sakuya! You've come at the right time! Quickly, help me see if this line says “stir three times” or “stir until it smokes”?”\n\n Sakuya took a closer look.\n “It says “If it doesn't smoke after three stirs, it means the previous step was wrong.”” Koakuma gasped.\n\n “Who taught her this way of explaining things?”\n Sakuya replied calmly.\n\n “I bet it's the same person who puts yesterday's three together with today's three.”\n Patchouli coughed, as if to indicate that she heard her, but didn't intend to apologize.\n\n Sakuya's gaze swept downwards again, and she quickly began to tidy up instinctively.\n\n The cauldron was moved half an inch to the left, the dangerous agents were rearranged by color, the rags and fire blankets were separated, and even the clips that Koakuma had carelessly tossed aside were put into the box.\n “If you really want to conduct high-risk alchemy in the library, you should at least have a list of dangers first,” Sakuya said.\n\n Koakuma immediately shoved a pen and paper into her hands.\n\n “Please write it!”\n Patchouli frowned.\n\n “Are you here to help, or to take over?”\n Sakuya picked up the pen, her tone almost cruelly calm.\n\n “I'm preventing Scarlet Devil Mansion from being rebuilt prematurely because of the two study inhabitants' impromptu performances.”\n Patchouli was silent for a moment, then surprisingly didn't object.\n\n And so the head maid was dragged into the alchemy site—responsible for timing, recording, warning which bottles couldn't be touched, and precisely pressing Koakuma's wrist back with two fingers when she reached for the cauldron with the spatula.\n\n"
scarlet.102.a:0 "With Sakuya, the explosion process finally looked professional."

scarlet.103.t:0 "Miss personally attended the investment event"
scarlet.103.d:0 "The second one to be disturbed was Remilia.\n\n When she entered, the library was in a strange balance: the cauldron was bubbling, Koakuma was muttering, Sakuya was timing, and Patchouli was coughing. The four of them looked like they might come to blows at any moment, but nothing had happened yet.\n\n Remilia looked around and smiled. “I thought someone was refining National Focus in the library.”\n\n Koakuma immediately gave an exaggerated bow. “More or less, Miss. We're refining your Industrial Budget.”\n\n Remilia became even more interested and went straight to the table, looking at the ominous-colored liquid in the cauldron. “So, if this pot succeeds, I'll have money.”\n\n “Yes,” Patchouli said. “And if it fails?”\n\n Patchouli didn't even look up. “You'll lose a library.”\n\n Remilia was silent for half a second, then actually laughed. “Good, at least you're honest,” Sakuya calmly added from the side. “I've already moved the most important book out.”\n\n Koakuma turned her head in shock. “When did you move?!”\n\n “You were just discussing yesterday's 3 and today's 3 with Patchouli.”\n\n Remilia nodded with satisfaction, as if reviewing an overly risky yet intriguing investment. “So what's my role now?” she asked. Koakuma immediately replied, “The financier.”\n\n Sakuya added, “The supervisor.”\n\n Patchouli said coldly, “The one who doesn't touch anything.” Remilia raised an eyebrow. “How heartless.”\n\n She wasn't angry, but instead pulled up a chair, propped her chin on her hand, and watched them scramble around. Her posture was more like that of a spectator than a hostess—the kind who'd bought front-row seats specifically to see if it would explode.\n\n When the cauldron began its third dangerous hum, Remilia finally said slowly, “Just a heads-up, if the library really explodes, I'll put the bill on Patchouli first, then deduct the reconstruction cost from Koakuma's salary.”\n\n Koakuma immediately protested. “Why should I get deducted too!”\n Remilia smiled elegantly. “Because you look most like the kind of person who would throw a spatula in the wrong place.”“...\n\n That's prejudice!”\n\n “That's management.”"
scarlet.103.a:0 "The young lady sat down; no one is allowed to explode first now."

scarlet.104.t:0 "Doorman, spatula, and a small piece of gold"
scarlet.104.d:0 "The third one disturbed was Meiling.\n\n When she peeked in, she was carrying a pot of tea, probably just checking if anyone in the library was coughing so hard they were about to pass out. But as soon as she entered, she saw the young lady sitting and watching, Sakuya taking notes, Koakuma standing in front of the cauldron with a spatula, and Patchouli with an expression that said, “One more second and I'd melt the whole world down.”\n\n Meiling stood at the door, silent for a moment.\n\n “... Should I go get the buckets first?”\n\n “Get two.” Sakuya didn't even look up.\n\n “Get another one to brainwash Koakuma.” Patchouli added.\n\n Koakuma immediately protested.\n “I was clearly very professional today!”\n\n Before she finished speaking, the spatula fell into the crucible with a “clang.”\n\n The whole place was silent.\n\n Meiling put the teapot aside, her tone very sincere.\n “Is it still possible for me to get the bucket now?”\n\n Patchouli's temple throbbed noticeably. Sakuya had already pulled Remilia back half a step ahead. Koakuma stared at the cauldron, as if hoping the spatula would crawl out on its own.\n\n The next second, the cauldron didn't explode. It just started to glow.\n\n First, a tiny speck of gold, then the entire mass of liquid seemed to be lit up from within, slowly sinking, solidifying, and finally, with a “plop,” a thumb-sized, ugly yet dignified piece of metal fell from the bottom of the pot.\n\n Everyone was stunned.\n\n Koakuma was the first to react, pointing at the small piece, her voice almost trembling.\n\n “Success?!”\n Patchouli quickly approached, picked it out, and placed it on the cold plate to examine it.\n\n She looked at it for three seconds, then three seconds, before finally reluctantly admitting, “... It's gold.”\n\n Remilia smiled, a very satisfied smile.\n\n “Very good.”\n\n She stood up, looking at the small, crooked piece of her creation on the table. “So Scarlet Devil Mansion's first pot of industrial capital was refined with a spatula.”\n\n Koakuma immediately puffed out her chest.\n “I told you I was the key talent!”\n\n Patchouli looked at her coldly.\n “You just turned an accident into a result.”\n\n Meiling picked up her tea and finally breathed a sigh of relief.\n “Anyway, it's a good thing it didn't explode.”\n\n Sakuya wrote the last line on the record sheet, her tone as calm as if everything was normal.\n “Experiment results: Success. Note: Koakuma is prohibited from bringing a spatula near the crucible next time.”\n\n “Hey!”\n\n For the first time, laughter truly broke out in the library.\n\n Patchouli looked at the obviously ugly but undeniably gold-plated little thing, coughed softly, and remained silent.\n\n Remilia, meanwhile, was already calculating in her mind:\n If a spatula could produce such a small piece, then with a few more attempts, Scarlet Devil Mansion might actually be able to extract the cost of the next ship, the next batch of machinery, and even the next war from its alchemical furnace."
scarlet.104.a:0 "Put away the spatula first, then try to make the second piece."

 scarlet.105.t:0 "Patchouli takes Koakuma to ask for money."
scarlet.105.d:0 "The Scarlet Devil Mansion was short of money.\n\n Whenever Patchouli delivered that news in her usual level tone, it was somehow more terrifying than if she had shouted. She compiled a dossier of prospective donors, industrial plans, projected returns, risk-sharing arrangements, and the “political goodwill available in exchange for a contribution,” then set out with Koakuma.\n\n Their first stop was Eientei.\n\n When Reisen opened the door and saw Patchouli and Koakuma on the step, her expression froze.\n\n “Are you two... here for treatment?”\n\n “No.” Patchouli held out the papers, her voice perfectly flat. “We came to ask for money.”\n\n Reisen glanced down at the cover. In bold letters, it read: “Eientei's Voluntary High-Value Sponsorship Plan for Scarlet Devil Mansion Industrial Development.”\n\n “What part of this is voluntary?!”\n\n Koakuma gave her sweetest smile.\n “See? It says “voluntary” right there.”\n\n “Then what is that line underneath—“Should the donor decline to volunteer, the Scarlet Devil Mansion will assist her in revising her understanding of the word voluntary”?!”\n\n Eirin eventually came out to see them. She read the proposal, fell silent for precisely two seconds, then looked up at Patchouli.\n\n “The Scarlet Devil Mansion is so broke that you've come knocking on Eientei's door?”\n\n Patchouli did not so much as blink.\n “Eientei's medicines, equipment, warehouses, and financial stability all exceed the Gensokyo average. From an investor's perspective, you have an obligation to support the organization with the brighter future.”\n\n “So that is what you call begging for money,” Eirin said. “Investment.”\n\n Koakuma nodded at once.\n “Calling it robbery would sound so unpleasant.”\n\n At last, Eirin rubbed her brow and took a sum of money from a drawer.\n\n “Take it,” she said. “And stop showing these things to Reisen. You people have frightened her badly enough already.”\n\n Their second stop was the kappa workshops.\n\n When Nitori Kawashiro saw Patchouli walk in, she assumed they had come to discuss a technical partnership; for a moment, she even looked excited. Then Patchouli dropped the sponsorship agreement on her desk, and the excitement died on the spot.\n\n “Wait. You aren't here to buy machinery?”\n\n “No,” Patchouli said. “We are here for you to sponsor the machinery.”\n\n Nitori's goggles nearly slid off her face.\n\n “And what makes you think I'd agree to that?”\n\n Patchouli drew out a second document.\n\n “Because if you contribute, I will award you a share of the Scarlet Devil Mansion's industrial contracts for the next three years.”\n\n Nitori's eyes lit up.\n\n “And if I don't contribute?”\n\n Koakuma supplied the answer with a beaming smile.\n\n “Then you can stand by and watch the yamawaro take the whole contract.”\n\n Nitori clutched her purse to her chest.\n\n “... Does everyone from the Scarlet Devil Mansion negotiate this underhandedly?”\n\n Patchouli answered without inflection.\n\n “No. This is the polite version.”"
scarlet.105.a:0 "At least Eientei and Kappa have the concept of “money”."

scarlet.106.t:0 "Patchouli and Koakuma Go Fundraising"
scarlet.106.d:0 "The third stop was the tengu newspaper office.\n\n Aya Shameimaru, upon hearing that Patchouli had arrived, thought she finally had some big news to get for free, and flew to the door with a flap of her wings. “Oh dear, the witch of the library has come to my door in person! What, is she here to submit an article? Or is Scarlet Devil Mansion finally planning to publicly announce its financial crisis?”\n\n Patchouli handed her a copy of “tengu Media Sponsored Scarlet Devil Mansion Reconstruction Plan”.\n\n Aya looked down at two lines and almost laughed so hard she fell off the windowsill. “You want our newspaper to pay you?\n\n!”“No, not pay,” Patchouli corrected her, “it's sponsorship.”\n\n Hatate Himekaidou peeked over and read a line aloud.\n\n “Sponsorship benefits: priority access to official Scarlet Devil Mansion news, exclusive interviews on industrial construction, and a photography opportunity for the future Queen's tour...”\n\n Aya's smile slowly faded.\n\n Koakuma, seeing an opportunity, immediately added insult to injury. “Don't you love exclusives the most?”\n\n Hatate also whispered, “Besides... if another company gets the exclusive first, we'll be very embarrassed.” Aya's eyes began to struggle. “This isn't extortion, it's content collaboration...” she whispered to herself, trying to convince herself. “Yes,” Patchouli said, “You've finally learned to use the right words.”\n\n In the end, the tengu newspaper donated a sum of money, plus a verbal promise to “guarantee that subsequent reports will be positive.”\n\n The fourth stop was the Palace of the Earth Spirits.\n\n Satori Komeiji put down her tea as soon as she saw Patchouli. “You've come to borrow money.”\n\n Patchouli said expressionlessly. “Can you read my mind?”\n\n “Your mind is full of budget shortfalls, furnace core materials, and “who has money” right now, it's hard not to read it.”\n\n Satori said. Koakuma was very unconvinced. “Then you should also read that our plan is very worthy of support.” Satori smiled slightly. “I also read that you were thinking, “Palace of the Earth Spirits is so big, it's a shame not to charge some site tax.”” Koakuma immediately shut her mouth.\n\n Patchouli pushed the documents over. “Then you should also be able to read that Scarlet Devil Mansion is really short of money.”\n\n Satori flipped through a couple of pages and sighed. “I can contribute a portion,” she said, “not because your proposal is so appealing, but because if you're so short of money that you have to resort to underground sponsorships, then it means the situation is really starting to get strange.”\n\n She paused and looked at Patchouli. “Also, that line in your head, “If the underground inhabitants don't contribute money, they'll have to contribute their lives later,” I suggest you don't tell anyone.”\n\n Patchouli was unusually silent for a second. “... I never intended to say it.”\n\n “You just planned to include it in the appendix,” Satori calmly corrected."
scarlet.106.a:0 "Even the reader youkai thinks this money should be paid."

scarlet.107.t:0 "Patchouli took Koakuma to ask for money. (Next)"
scarlet.107.d:0 "The fifth stop was by the lake.\n\n Cirno was standing on a rock with her hands on her hips, while the Three Fairies of Light crouched beside her, seemingly plotting something. Koakuma felt a headache coming on. “You're not really going to raise funds from them, are you?”\n\n “Anything we can get, we can get.”\n\n Patchouli said. She unfolded the “Fairy Friendly Donation Initiative.”\n\n “We need financial support.”\n\n Cirno frowned. “What is finance? Is it stronger than ice?”\n\n Sonny raised her hand first. “I have a leaf.”\n\n Luna pulled out a glass bead she'd picked up somewhere. “This is very bright.”\n\n Star thought for a moment and handed over half a pack of cookies. “Does this count as an asset?”\n\n Patchouli remained silent.\n\n Koakuma was already laughing so hard she was bent over. “Scarlet Devil Mansion has successfully secured its first batch of fairy investment: a leaf, a bead, and half a pack of cookies.”\n\n Cirno protested. “I have one too!” She pulled a frozen frog from her skirt pocket and proudly held it up high. “The strongest asset!” Patchouli stared at the ice frog, her expression almost blank for the first time.\n\n In the end, she accepted the glass bead. “At least this looks more like money,” she whispered.\n\n The sixth stop, the Ministry of Right and Wrong.\n\n Eiki Shiki listened to their fundraising journey, her expression very complicated. “You went from Eientei, kappa, tengu, Palace of the Earth Spirits, all the way to Cirno and the Three Fairies of Lights?”\n\n “Yes,” Patchouli said. “You still want to raise funds from the judicial system?”\n\n “Yes.” Eiki remained silent for a long time before speaking. “This matter alone is enough for me to write a three-page verdict on you.”\n\n Koakuma immediately added. “But if you are willing to sponsor, we can name part of the construction “Eiki Shiki Rule of Law Friendly Project”.”\n\n Eiki's pen trembled slightly. “That's bribery.”\n\n “No,” Patchouli said calmly, “it's a naming rights sponsorship.”\n\n In the end, they actually managed to scrape together enough funds to start the project.\n\n On the way back, Koakuma, clutching her money bag, receipts, contracts, glass beads, and half a bag of cookies, was laughing so hard she could barely walk. “We succeeded!” Patchouli coughed. “I know,” Patchouli said. “Don't you think asking for money directly is more efficient than alchemy?”\n\n Patchouli thought for a moment. “No.”“I just feel that Gensokyo has more money than I thought.”"
scarlet.107.a:0 "At least this time they didn't include the ice frog in the national treasury."



 scarlet.108.t:0 "Echoes after the report"
scarlet.108.d:0 "After I submitted the industrial restructuring report, the throne room remained quiet. Remilia flipped through the documents, her gaze fixed on the numbers, routes, production capacity, and reserves, her expression largely unchanged. She was always like this; she wouldn't use superfluous expressions to receive truly important information.\n\n I stood at the bottom of the steps, watching her fingers press down on the pages of the book, and suddenly remembered Dublin many years ago. Back then, I was sitting at the entrance of a dilapidated bookstore, clutching a soaking wet book, so hungry I could barely stand, my chest feeling like it was being constricted by wire.\n\n Passersby would simply look away, as if I already had one foot in the grave. Only she stopped. She didn't see me first, but the book in my hand. She looked at me as if weighing whether something was worth picking up from the ground. I should have hated that look then, but I didn't. Because it wasn't pity.\n\n It was judgment, acknowledgment, a silent “You're still usable.”\n\n Later I realized that for Remilia, that was very close to tenderness. She took me from that famine, gave me medicine, a lamp, enough time and paper. She didn't say anything fancy, and never guaranteed that tomorrow would be better. She simply laid out the conditions for survival in front of me and saw how far I could go.\n\n I've come this far. So when she closed the report and casually said, “Well done,” that annoying feeling in my chest still surfaced. How ridiculous. I knew perfectly well she wasn't the type to express her emotions verbally.\n\n But I still care.\n\n Because from the moment she stopped at the bookstore entrance, I've been looking at her."
scarlet.108.a:0 "She saw my book first, and only later did I learn to keep looking at her."

scarlet.109.t:0 "A figure deep in the library"
scarlet.109.d:0 "When I returned to the library, Koakuma was tidying my desk. She glanced at me, didn't ask any questions, and simply pushed the candlestick half an inch closer to my hand.\n\n Sometimes she's so clever it's annoying. I sat down, my fingertips pressing against the oldest book, but I didn't open it immediately.\n\n What came to mind instead was the Scarlet Devil Mansion as it had been over the years. Meiling guarded the door, Sakuya held up the corridors, Flandre was locked in the basement, and I kept the library running. Everyone was in their place, slowly transforming what was originally just a temporary shelter for exiles into a city that could truly reach outwards.\n\n And she always stood at the forefront. Remilia was always like that. She carried the heaviest burden, yet spoke as if joking; she could be cold, cruel, and deliver a command like an invitation to a banquet. Others only saw her sitting high above, as if born to be queen. Only those close enough know that the position wasn't her birthright; she snatched it from the clutches of fate.\n\n I know how stubborn she is, and how tired she is.\n\n I know she still goes to the basement in the middle of the night, that her gaze towards Flandre is deeper than usual, and that every step she takes isn't just for power, but also to fight for a future for her younger sister.\n\n And all I can do is put the answers she needs on the table on time. Spells, industry, sealing, potions, reorganization plans—I've become the most reliable part, so that when she needs it, she knows the library will give her a result.\n\n I've never been good at expressing feelings.\n\n But if I had to say, the thing I've gotten most used to these past few years is probably looking up and seeing her still standing there.\n\n That feeling was more like order than any formula."
scarlet.109.a:0 "She stood at the very front, and I was already used to handing the answers to her."

scarlet.110.t:0 "It didn't matter if I didn't say it."
scarlet.110.d:0 "Sometimes I think, if I were more human, perhaps I should have said those things.\n\n I should have said I cared about her. I should have said I wasn't here just because of contracts, interests, or Scarlet Devil Mansion. I should have said I looked at her longer than I looked at any page of a book. I should have said that from Dublin until now, a part of my heart has always been directed towards her.\n\n But I didn't say it. Not because the feelings weren't deep enough, quite the opposite. Precisely because they were so deep, I knew that once spoken, it would push many things that could still be maintained into another state of instability. Remilia already carried too much on her shoulders: the throne, war, fate, Flandre, the future of the entire mansion. I didn't want to put my heart into her hands again, forcing her to give me an answer.\n\n Besides, I probably already knew the answer.\n\n It's just that the answer isn't a sentence, nor a name. It's hidden in her willingness to hand over the library to me, hidden in her coming in whenever she needs it, hidden in the momentary pause in her gaze when she sees me cough. She doesn't say it, and neither do I. This is good, at least better than laying everything out on the table and watching it become ugly.\n\n So let it be.\n\n I continue doing my thing, continuing to calculate the answer she wants, continuing to shape Scarlet Devil Mansion into a shape she can use. She moves forward, and I'll turn the pages to the right place for her; if she wants to be at odds with the world, I'll dismantle the world into a structure that can be understood and also broken down.\n\n As for those unspoken things— I will keep them in my heart, like a book never shown to outsiders, hidden away on the deepest shelf.\n\n Silently guarding them.\n Silently watching.\n\n As long as she is still here, I will continue to do so."
scarlet.110.a:0 "It's okay if she doesn't say it, I will always be here."




 scarlet.111.t:0 "Failure, the gold did not appear."
 scarlet.111.d:0 "For the first three seconds after the fire was lit, everything was as stable as Patchouli had calculated. The salt, ash, and metal fragments in the copper pan began to shine, and the dark liquid slowly crawled along the engravings, like a closing curse. Koakuma held the recording tablet, even her breathing became soft.\n\n In the fourth second, the color was wrong.\n\n It wasn't the luster of gold, but a cold, ashen yellow. Patchouli's eyes immediately darkened, and she tapped her fingers twice on the table. “Too much pressure,” she said. “I knew it!”\n\n Koakuma had just shouted when an inappropriate sphere suddenly bulged in the center of the copper pan, as if the metal and the flame had both become sick.\n\n The next instant, the entire transmutation array collapsed with a roar.\n\n It wasn't a big explosion, but something worse—high heat, thick smoke, and uncontrolled proliferation. A yellowish-green semi-fluid sprayed out of the copper pan like vomit, sticking to the desk, carpet, bookshelves, and even turning any metal it touched into hideous lumps of fake gold along the way. Koakuma screamed as she tried to cover it with the sealing cloth:\n\n “This isn't gold! This is some contagious, ugly stuff!” Patchouli coughed until her vision blurred, but still managed to raise her hand to reinforce the seal.\n\n “Shut up, seal the door first!”\n The next second, the fake gold nugget exploded.\n\n The entire laboratory felt like it had been hit hard by a fist painted with gold paint.\n\n Dust fell from the ceiling, pages flew everywhere, and window frames rattled. When the smoke finally cleared, the Great Library was half-blackened. Sakuya was the first to push open the door, her steps only lasting half a second.\n\n “... Can I ask if this is a new type of building material, or just a simple case of something going out of control?”\n Koakuma lay on the ground, her face covered in ash and gold dust, weakly raising her hand.\n\n “Both.”\n Patchouli steadied herself against the edge of the table, looking at the pile of failed products, her face paler than usual.\n\n She wanted to refine enough money to start the industry, but instead, she created a disaster that required money to clean up.\n\n The gold didn't appear.\n\n What appeared was an entire alchemical ruin waiting to be cleaned up, and an experimental record that needed to be rewritten.\n\n"
scarlet.111.a:0 "First, scrape these monstrosities off the book."



  scarlet.112.t:0 "Scarlet Devil Mansion Routine Inspection"
 scarlet.112.d:0 "Before the red mist had even dissipated, Scarlet Devil Mansion often awoke first. The candlelight in the corridors was neatly lit, the stone floors were clean to the point of being cold and hard, and even the maids' movements of passing utensils and documents showed no sign of superfluity. Remilia never liked to give advance notice of inspections, because once prepared in advance, what could be seen was often only the surface; only when there was no warning would the true order of the mansion emerge on its own.\n\n In the lobby, Sakuya had already sorted out the inventory, rations, and inspection records. She stood there, like the clock of the entire mansion: precise, quiet, and without excuses. As long as she was there, disorder would hardly linger for long in Scarlet Devil Mansion.\n\n Outside the main entrance, Hong Meiling was still guarding the entrance and exit. She clutched the passbook, her gaze sweeping over the passing figures, trucks, and guards. She lacked Sakuya's almost obsessive meticulousness, yet she stood like a thick wall, keeping probing, chaos, and wishful thinking outside the mansion.\n\n Remilia walked slowly down the corridor, her cloak casting a deep red shadow on the ground. Along the way, no one dared to boast of their achievements, nor did anyone dare to offer exaggerated loyalty in exchange for a second glance from her. This inspection was never about rewarding anyone, but about confirming: who truly deserved to stand within the order of Scarlet Devil Mansion.\n\n And when she stopped, the question naturally fell on everyone's mind—who, in this round of inspection, was most worthy of her remembrance?"
 scarlet.112.a:0 "Sakuya, you didn't disappoint me."
 scarlet.112.b:0 "Without me, none of this would have worked."
 scarlet.112.c:0 "Meiling, you guarded this door very well."

 scarlet.113.t:0 "Flandre's Condition Check"
 scarlet.113.d:0 "Every time the basement door opened, the most unsettling thing in Scarlet Devil Mansion was often not the lock, but Flandre's current state. Sometimes she was quiet, as if she had just surfaced from deep water; sometimes she would stare blankly at the candlelight, as if checking if the light would suddenly go out of control; and sometimes, even the slightest stimulus would cause her breathing and youkai power to become disordered.\n\n Therefore, checking became an unavoidable routine.\n\n Patchouli laid out the ritual paper, notebook, and restraint incantation one by one. She knew very well that this was never just ordinary discomfort, but a crack left by the mutual tug-of-war between emotions, memories, and power. Any fluctuation could spread along that crack.\n\n Flandre sat in the chair, her feet dangling in the air, her fingers clenched tightly. It wasn't that she was unwilling to cooperate, but each examination felt like forcing her to touch her most vulnerable spot again. She knew everyone was helping her, but she also knew that behind everyone's help lay constant wariness.\n\n Remilia stood by, never leaving. Her expression was calm, as if she were merely listening to a routine check, but everyone knew she cared more about the outcome than anyone else. After all, Flandre wasn't a problem that could be resolved by simply going through the motions; she was Scarlet's sister, and the most crucial part of Scarlet Devil Mansion that couldn't afford to fail.\n\n Whenever the examination began again, the only remaining question was—who should lead the judgment this time?"
 scarlet.113.a:0 "Let Patchouli do it her way."
 scarlet.113.b:0 "I will personally oversee this matter."
 scarlet.113.c:0 "Flandre, tell us how you're feeling right now."

 scarlet.114.t:0 "Casual chat in the library"
 scarlet.114.d:0 "The Great Library isn't always just the sound of turning pages and coughs. Sometimes, afternoon light streams through the high windows, falling between the spines of books and the dust, illuminating the entire library like a silent palace; and at those moments, even conversations seem more weighty than elsewhere.\n\n Patchouli closed her book, her fingertips still pressing on the corner, as if she were only pausing temporarily, not intending to truly rest. For her, rest was usually just moving from one book to another.\n\n Remilia sat opposite her, casually tossing her teaspoon. She didn't often admit she liked it here, but she always entered the library during its quietest hours. Because only here could many words not be packaged as commands, nor did they need to be deliberately raised in volume.\n\n Sakuya stood to the side, refilling their teacups and casually pushing the stack of books Koakuma had secretly piled up back in. She didn't interrupt, but listened intently. She noticed every word her master spoke, every soft cough Patchouli uttered, every slight disturbance on the bookshelf.\n\n The topics ranged from new books to prices, from the people and gossip outside the mansion. The three voices, each with a distinct tone, perfectly captured another side of Scarlet Devil Mansion: knowledge, control, and the hand that stitched everything back into order.\n\n If one were to ask who was most memorable in this conversation, there would likely be more than one answer."
 scarlet.114.a:0 "Patchouli, you always see deeper than others."
 scarlet.114.b:0 "Remilia, even your casual conversation feels like you're in control."
 scarlet.114.c:0 "Sakuya, you even manage to keep quiet perfectly organized."

 scarlet.115.t:0 "Meiling's Snacks"
 scarlet.115.d:0 "As long as nothing broke from the basement, Scarlet Devil Mansion was enjoying a rare period of peace.\n\n Hong Meiling would personally bring down some snacks every now and then. The snacks she brought weren't necessarily expensive or fancy, but the sweetness, texture, and portion were always just right. She remembered that Flandre sometimes liked crumbly pastries, sometimes only soft ones; sometimes she was pleased by the color, and sometimes she would stare at the same pastry for a long time.\n\n The door was ajar, and Flandre sat inside. Her emotions weren't always stable, but when she smelled something sweet, her eyes would often light up first, before she slowly lowered her guard. Meiling never treated her like a child needing to be coaxed, nor like a dangerous object ready to explode at any moment. She simply and naturally placed the tray down and handed over the fork, as if it were just another ordinary visit within the mansion.\n\n Sometimes Remilia would stand by, watching her sister tentatively take a bite, then slowly take a second. That subtle, almost insignificant sense of security carried more weight than many beautiful words.\n\n Occasionally, Flandre would look up and offer Meiling a brief but genuine smile. There was no applause in the basement, and no one would call it a miracle; but in Scarlet Devil Mansion, the gentleness that could temporarily quell danger deserved to be remembered.\n\n And this time, to whom should this peace be attributed?"
 scarlet.115.a:0 "Flandre, you did a good job."
 scarlet.115.b:0 "Remilia, only you truly know how to protect her."
 scarlet.115.c:0 "Meiling, your gentleness is more effective than any dessert."

 scarlet.116.t:0 "Meiling carries Patchouli out on patrol."
 scarlet.116.d:0 "The fortifications, storage layouts, and spell inscriptions outside the building—some parts always require Patchouli's personal verification. Others can only see numbers and locations in the diagrams, but she can instantly spot which inscription is missing a stroke, which section of wall is missing a layer of treatment, and when problems will begin. She doesn't trust ambiguity, nor does she accept leaving gaps to be filled later.\n\n But her body never cooperates with her will.\n\n So Hong Meiling half-squatted down, her tone as calm as if she were talking about something perfectly natural: “Come on, I'll carry you across.” Patchouli never liked this kind of overly direct help, but Meiling neither urged nor persuaded her, simply maintaining that posture, patiently waiting for her to make a decision. In the end, Patchouli would always lean over, her fingers gripping her shoulders, coldly adding: “Don't sway.”\n\n Remilia sometimes stood on the steps watching this scene, a faint smile playing on her lips. She didn't stop her, nor did she say anything more. Scarlet Devil Mansion wasn't a place made up of perfect people; and precisely because of this, those less-than-glamorous but practical acts of support seemed all the more precious.\n\n Along the way, Meiling walked steadily, while Patchouli, while leaning on her back, pointed out the problems along the way as usual. Her tone was still critical, Meiling's response still calm; these kinds of inspections had long become a peculiar yet steadfast understanding between them.\n\n And when the inspection ended, the answer to who deserved to be remembered for this was clear."
 scarlet.116.a:0 "Patchouli, you don't overlook any detail even when you're weak."
 scarlet.116.b:0 "Remilia, this mansion ultimately operates according to your will."
 scarlet.116.c:0 "Meiling, you are much more reliable than you appear."

  scarlet.117.t:0 "Scarlet Devil Mansion's routine inspection"
 scarlet.117.d:0 "Scarlet Devil Mansion's mornings are still quiet, but that quietness is different from the past. The candlelight in the corridor, the footsteps of the maids, the neatly stacked record books in the foyer—everything remained precise and cold, but within this flawless order, an unspoken understanding had emerged.\n\n Sakuya stood in the center of the foyer, her registers and inventory records meticulously organized. She was still like the clockwork of Scarlet Devil Mansion, pressing every process, every handover, every detail back to its correct place. But now, when she looked up at the main entrance, her gaze was no longer merely inspection, but rather a confirmation that another line of defense was equally secure.\n\n Hong Meiling remained in her original position outside the door. She continued to record entries and exits, check goods, and inspect guard rotations, but her relationship with Sakuya was no longer one of command and reporting. Often, a glance, a brief reminder, or even just a half-second pause during a handover is enough for the other person to understand which gap needs filling. That tacit understanding is understated and subtle, yet it perfectly binds the inner and outer order of Scarlet Devil Mansion even tighter.\n\n Remilia walked along the corridor, her cloak sweeping the floor. She watched the mansion continue to operate according to her will, and saw those who had once strayed from each other gradually growing into shapes capable of supporting one another. She never called this sentimentality; in her eyes, it was simply that order had finally acquired a more solid framework.\n\n And as the inspection drew to a close, the question arose again—in this Scarlet Devil Mansion, who now deserves to be remembered?"
 scarlet.117.a:0 "Sakuya, you keep the entire mansion sharp."
 scarlet.117.b:0 "Only I can connect all of this."
 scarlet.117.c:0 "Meiling, you and Sakuya have guarded both inside and outside the door."

 scarlet.118.t:0 "Flandre's condition check"
 scarlet.118.d:0 "The basement remains quiet. But this quiet is no longer the temporary calm of the past; it's more like a void left after excessive consumption.\n\n Flandre sat in the chair, her hands on her knees, her posture very upright, even excessively quiet. She no longer trembled immediately at the slightest stimulation, and rarely looked up suddenly with a look of vigilance or confusion. She just looked ahead, her gaze far away, as if something was still in her eyes, but it was no longer easy for it to truly enter her heart.\n\n Patchouli spread out the ritual paper and record book, her movements slower than usual. She could see, of course, that this calm was nothing to be complacent about. The power hadn't truly vanished, nor had the emotions been healed; it was just that what would have stirred up waves now seemed to have sunk deeper. She knew this was more troublesome than simple loss of control, because silence didn't equate to recovery.\n\n Remilia stood by, her expression colder than before. But Patchouli knew very well that it wasn't indifference, but rather a deep-seated repression. Occasionally, she would glance up from between pages to look at the curator's profile, then lower her head to fill in the notes more carefully. More than simply confirming Flandre's condition, she was now concerned about something else—how long could Remilia maintain that nonchalant expression if this quiet continued?\n\n Flandre still didn't say much. The only sounds in the basement were the rustling of pages, the nib of a pen scratching across a notebook, and a silence that defied easy categorization as either stability or emptiness.\n\n And when the investigation restarts, the question of who should lead the judgment again arises."
 scarlet.118.a:0 "Let Patchouli continue in her way."
 scarlet.118.b:0 "I will personally oversee this matter."
 scarlet.118.c:0 "Flandre, even just a little bit, tell us how you feel."

 scarlet.119.t:0 "An Afternoon in the Library"
 scarlet.119.d:0 "The Grand Library remains one of the quietest places in Scarlet Devil Mansion. Afternoon light streams through the high windows, falling on the spines of books, the edges of tables, and teacups, illuminating even the dust in the air. It still resembles a tranquil palace isolated from the Outside World, but now, that tranquility carries a subtle, almost imperceptible, sense of longing.\n\n Patchouli closed her book and raised a hand to her temple. She still habitually sat amidst stacks of books and spellbook notes, breaking down each task into precisely defined items; but when Remilia entered the library, her gaze no longer merely swept over her briefly, but lingered unconsciously for a moment longer, observing the other's expression, tone of voice, even the slightly lighter movement when she sat down.\n\n Remilia sat opposite her, still casually fiddling with her teaspoon as usual, as if she were there to kill time, or perhaps simply to stay. She wouldn't admit she needed such moments, but Patchouli knew perfectly well that the owner wasn't immune to fatigue; she simply wouldn't allow herself to show it elsewhere.\n\n Sakuya, as usual, stood by, refilling their tea. She didn't interrupt, but she was used to this scene: one unwilling to admit their weariness, the other sensing it but not saying it outright. She simply placed the perfectly warm tea down, shutting out excessive noise and distractions, creating a space for quiet contemplation.\n\n Sometimes the three talked about the newly acquired books, sometimes about rumors and prices outside, sometimes just a few brief, casual remarks. But perhaps the truly precious thing about Scarlet Devil Mansion was precisely these moments—no need to raise one's voice, no need to command, and no need to feign strength beyond one's capabilities.\n\n And on such afternoons, it's often not so easy to discern who is most worthy of being remembered."
 scarlet.119.a:0 "Patchouli, you read more than just one page."
 scarlet.119.b:0 "Remilia, even silence is your domain."
 scarlet.119.c:0 "Sakuya, you always manage to make everything just right."

 scarlet.120.t:0 "Snacks Delivered to the Basement"
 scarlet.120.d:0 "Hong Meiling still regularly delivers snacks to the basement. But now, it's no longer just about pleasing Flandre, but more like a careful way of maintaining contact.\n\n The items on the tray are still carefully adjusted for sweetness and texture. Meiling remembers that Flandre used to be very sensitive to these details; even a slight difference in color could elicit a direct reaction. But now, when the door opens, the girl inside usually just looks over quietly, her gaze falling on the tray before quickly looking away, as if she knows it's for her, but it's hard for her to truly feel anything.\n\n Meiling didn't show any disappointment. She still placed the tray down, handed over the fork, and spoke in the same tone as usual, as if it were just an ordinary thing. She knew that sometimes, too much deliberate gentleness could make people harder to approach; it was better to hide her concern in these steady actions, so that the other person could at least feel that they weren't being ignored.\n\n Remilia stood aside, watching Flandre slowly pick up the fork, her movements light and slow. Her sister no longer showed a brief expression of joy at the slightest sweetness as before; more often, she would just quietly take a bite, then a second, as if completing some assigned task. This calmness wasn't reassuring, yet it was more captivating than stillness, making it hard to look away.\n\n No one spoke much in the basement. But precisely because of this, the unspoken things became even heavier: Meiling's patience, Remilia's suppressed emotions, and Flandre's eyes, seemingly so far away.\n\n And this time, who deserved to be remembered for this brief time together? The answer returned."
 scarlet.120.a:0 "Flandre, it's good that you're willing to eat it."
 scarlet.120.b:0 "Remilia, you've never left her side."
 scarlet.120.c:0 "Meiling, your patience is more precious than any dessert."

 scarlet.121.t:0 "Patchouli's Inspection Outside the Pavilion"
 scarlet.121.d:0 "The construction and storage arrangements outside the pavilion still needed to be personally checked, and Patchouli never wanted to rely on others for such matters. She knew which engravings were missing a stroke, and which wall, if left untreated, would leave hidden dangers later. Her attention to detail remained unchanged, as did her physical weakness.\n\n So, Hong Meiling, as usual, half-squatted down, offering her back. The only difference was that it was no longer an awkward situation. Patchouli would still frown, still coldly remind her not to sway, but she no longer truly resisted the help; and Meiling had long since learned when to retort, and when to simply carry her quietly and steadily. Sometimes Remilia would stand on the steps watching them leave.\n\n Patchouli, perched on Meiling's back, would still point out details along the way; Meiling, however, walked steadily, carrying all her criticisms and dissatisfaction along with her. The scene wasn't exactly dignified, but it possessed a reliability unique to Scarlet Devil Mansion—everyone had their flaws, yet they could still support each other's weight.\n\n More than the patrol itself, Patchouli was increasingly concerned about whether Remilia was still standing in the same spot on each return trip. She wouldn't say it aloud, only relaxing her tightly furrowed brow slightly when she saw the Curator was still there.\n\n When the patrol came to an end, the question of who deserved to be remembered for it naturally remained."
 scarlet.121.a:0 "Patchouli, you didn't let any loopholes slip by, even when you were weak."
 scarlet.121.b:0 "Remilia, you were always the one they looked back to check on."
 scarlet.121.c:0 "Meiling, you carried the weight of others so steadily."

 scarlet.122.t:0 "Umbrella on the Ruins"
scarlet.122.d:0 "Sunlight fell between the broken walls, and also on Remilia.\n\n The old castle was now just ruins, grass growing in the cracks, vines climbing up the collapsed towers, as if the ruins themselves were slowly stitching up their wounds. But the sunlight showed no mercy to the vampire. It fell on Remilia's shoulders, the back of her hands, her cheek, making a subtle yet clear hissing sound, as if branding her victories and weariness into her skin. She didn't flinch.\n\n She simply stood there, looking at the place where she had grown up, looking at the quiet that remained after this long conquest.\n\n Sakuya, Meiling, Patchouli, and Koakuma approached her from behind at that moment.\n\n Meiling spoke first. She frowned as she watched Remilia standing in the sun, but still opened the umbrella she had prepared beforehand and handed it to her. “Young lady,” she said softly, “you've already won. You don't need to fight the sun anymore.”\n\n Remilia didn't take it immediately, only glancing at her sideways.\n\n Sakuya stood on the other side, her tone as steady as ever.\n\n “Please don't hurt yourself at a time like this.”\n\n Patchouli didn't urge her, only looking at the ruins, and slowly coughed. “This doesn't feel like home,” she said. “More like a skeleton gnawed away by time.” “But at least it was a skeleton she once had,” Koakuma murmured.\n\n The wind blew through the broken walls, carrying bits of grass and dust.\n\n Everyone fell silent for a moment. They looked at Remilia, and at the old city. Only now did they realize more clearly—before they met, Remilia, like them, had been a homeless person. She wasn't born to sit on the throne; she too had been driven away, lost everything, and dragged herself out of the ruins.\n\n Meiling gazed at the broken tower and suddenly smiled, a very faint smile. “Speaking of which, we're all pretty much the same.”\n\n “Who wasn't picked up by the young lady?”\n\n Koakuma wagged her tail. “Although her picking people up isn't exactly gentle.”\n\n Sakuya didn't deny it, only muttering something under her breath.\n\n “Without the young lady, there would be no Scarlet Devil Mansion today.”\n\n Patchouli watched as Remilia finally raised her hand and took the umbrella, her gaze darkening slightly.\n\n “She's arrogant, cruel, and self-centered,” she said. “But she is indeed an excellent leader.”\n\n “And a good family member too,” Meiling added.\n\n No one objected. Because they all knew in their hearts that they were standing here not because fate had placed them together, but because Remilia had pulled them one by one from their respective ruins, given them a direction to follow, and a place where they could call themselves “one of them.”\n\n So, finally, Remilia, holding her umbrella, stood on the ruins of this old city, and heard those she knew best behind her, in their uneven silence, utter the same meaning—We are all Remilia's people."
scarlet.122.a:0 "Hold the umbrella tight, don't let the sun win first."

scarlet.123.t:0 "Go home to see your sister."
scarlet.123.d:0 "After the umbrella was opened, the sunlight was finally half blocked.\n\n Remilia stood in the shadows, no longer looking at the sky. Her gaze slowly retreated from the broken walls, the collapsed corridor, and the courtyard swallowed by weeds, as if locking away a long past deep within her mind.\n\n “It's over,” she whispered.\n\n This wasn't a declaration, but more like a confirmation.\n\n Having fought her way here, whether for conquest, revenge, or returning to her old homeland, she had done almost everything she could. She had trampled the world that had once banished her underfoot and returned to where the story began.\n\n But the truly important person wasn't here.\n\n Flandre wasn't there. The moment this thought surfaced, everyone's expressions quieted down a little.\n\n Meiling first shifted her gaze to the distant, overgrown weeds.\n\n “It's a pity my sister didn't come.”\n Sakuya lowered her eyes, as if confirming a fact no one wanted to say too harshly.\n\n “Even if she were here, she might not be happy.”\n Patchouli tucked her hands into her sleeves, her voice lower than usual.\n\n “The old town is just the old town.\n\n The place where she's truly needed isn't here.” Koakuma nodded gently. “At home.”\n\n When that word “at home” was uttered, even the wind in the ruins seemed to pause for a moment. Remilia gripped the umbrella handle, remaining silent. But she knew they were right. She had spent so long returning here, not to linger before the broken walls, nor to finally give her past a proper ending.\n\n What she should have been doing was always in Scarlet Devil Mansion.\n Behind that basement door.\n\n Beside the younger sister, sealed and flattened, trapped in silence, still waiting for her sister to return.\n\n She slowly turned, her cloak brushing against the gravel, the edge of her umbrella cutting a neat line of sunlight.\n\n “Let's go,” she said. No one asked where they were going. Sakuya naturally stood to her left and behind, like a sword forever sheathed. Meiling stretched her shoulders, as if preparing to return to guard the gate. Patchouli withdrew her gaze from the ruins, no longer looking at that bygone history.\n\n Koakuma quickly followed, kicking a small piece of old brick back into the grass.\n\n They all knew that their true home wasn't this burned-down old castle. It was Scarlet Devil Mansion. There lay the order they had built together, their individual places, and their absent yet always central sister.\n\n Remilia glanced back at her homeland one last time.\n\n Then she said: “Go home.”\n\n This time, no one stopped."
scarlet.123.a:0 "Go back to see Flandre."

scarlet.124.t:0 "When the seal is broken"
scarlet.124.d:0 "As the basement door slowly opened, even the air seemed hesitant to move.\n\n Flandre sat in the center of the room, her back ramrod straight, hands on her knees, her eyes as empty as a frozen lake. For years, she had been sealed, flattened, and ground into a shell that would neither lose control nor truly live. The dolls stood neatly around her, like a group of lifeless witnesses.\n\n Patchouli stood by the door, her fingertips hovering over the final incantation, her face paler than paper. She knew very well that once this seal was broken, the person returning wouldn't be the quiet, obedient shell, but the real Flandre, suppressed for too long, imprisoned for too long, having crammed all her pain, anger, grievances, and desires into her very bones. “Ready?” she whispered.\n\n Remilia didn't turn around.\n\n She just looked at her sister, at that face she knew best, and that she least wanted to see again—an empty face. “Undo it.”\n\n Patchouli closed her eyes, erasing the last rune from the doorframe and her forehead.\n\n The next instant, Flandre's pupils contracted sharply.\n\n Like stagnant water suddenly shattered, like frozen blood flowing again. She blinked first, then her breathing became erratic, and her shoulders trembled. Those emotions that had been suppressed for so long didn't slowly return; instead, they all crashed into her body at once—fear, resentment, dependence, anger, the long time she had been locked up, every second treated as a calamity—all came alive in that instant. “... Sister?” she finally uttered, her voice trembling, as if she were about to cry.\n\n But the next second, the entire basement began to crumble.\n\n Not because she wanted to destroy, but because she had lost control. The walls cracked first, the dolls were torn apart in mid-air, the tables and chairs were crushed as if by unseen hands, even the air itself emitted a piercing cracking sound. Flandre clutched her head, tears just falling, when the power exploded outwards. “I can't stop...” she gasped, her voice rising and falling. “Sister, I can't stop!”\n\n Sakuya and Meiling both rushed forward, but Remilia stopped them with a raised hand. She didn't back down.\n\n She simply walked step by step towards the out-of-control storm, her hat torn open, her arms cut by shards of rock, but her eyes remained frighteningly steady. “Look at me, Flandre,” she said.\n\n Flandre looked up, her face streaked with tears, her wings trembling uncontrollably, her strength failing her. She wanted to rush forward, to hug her sister, to shrink back into the arms of the one she knew best, but the moment she raised her hand, another crack appeared in the ground.\n\n Everyone in Scarlet Devil Mansion understood—this moment could no longer be delayed.\n\n Either Remilia would use her body to catch the calamity, using her blood and life to bring her sister back from madness, or she would use her skills and strength to suppress it all, forcing Flandre back to the crossroads of fate.\n\n The rubble in the basement was still falling.\n Flandre looked at her sister, crying.\n And Remilia, finally, had to make her final choice between love and control."
scarlet.124.a:0 "I'll catch you—even if it costs me my life"
scarlet.124.b:0 "First, subdue her, then choose her future"

scarlet.125.t:0 "The sister brought back with blood"
scarlet.125.d:0 "Remilia didn't dodge.\n\n The moment Flandre lost control, she took a step forward even faster. Not an attack, but an embrace. That force, enough to tear apart walls and crush an entire basement, first struck her shoulder, chest, and abdomen, making her almost unable to stand. Blood gushed out immediately, staining her skirt and Flandre's trembling hands. “Sister, sister...”\n\n Flandre panicked completely.\n\n The thing she feared most had finally happened—she was hurting her sister again. She desperately tried to retract her power, but the more chaotic her emotions became, the more destructive it became. Stones, wood chips, glass, and distorted air flew everywhere, the entire room screaming on the verge of collapse.\n\n But Remilia didn't back down. Coughing up blood, she reached out and forcefully pressed her hand against Flandre's face, forcing her sister's eyes, shattered by fear and madness, to look only at her.\n\n “Look at me,” she whispered. “Not at these things, not at what you've done wrong, not at how terrible you are.”\n\n Her voice was already very soft, as if it would break at any moment, yet each word held its strength.\n\n “Look at me, Flandre.” Flandre trembled, her wings shaking, her teeth chattering. She wanted to push her sister away, afraid that if she touched her again, she would really kill her. But Remilia hugged her even closer, throwing herself into the eye of the storm.\n\n “You're not a monster.”\n “You're not a disaster either.”\n\n “You're my sister.” These words were like a nail, finally driven into Flandre's already crumbling heart.\n\n The power was still raging, but its direction was beginning to malfunction. The destruction that had been tearing in all directions gradually dwindled to trembling.\n\n Flandre clung tightly to Remilia's clothes, crying so hard she could barely breathe.\n\n “I don't want you to die...” Remilia's body was already very cold. She knew she couldn't hold on much longer.\n\n But she still smiled, a weary smile, yet as if she had finally let go of something.\n “Then live like a normal vampire,” she said.\n\n “Go cry, go laugh, go make a scene, go bite, go be annoying, go live.”\n\n Flandre's power finally receded little by little. It wasn't that it was sealed back, not that it was forced back by the rules, but that she herself, with her sister's blood and voice, forcibly pulled back that madness. Her eyes slowly focused, her breathing was erratic, but finally she was no longer like before, ready to drag the world into destruction at any moment.\n\n Remilia slowly lost strength in her arms. Finally, she simply stroked Flandre's head, just like many, many years ago.\n\n “This time... don't ask me if you're being good.”\n\n “Just live your own life.” Flandre let out a broken cry like a child, tightly hugging her sister. The basement finally fell silent, only blood still dripping.\n\n Scarlet Devil Mansion saved Flandre.\n\n The price was that the Queen herself stuffed her own life back into her sister's already dying heart."
scarlet.125.a:0 "She risked her life to bring her sister back from disaster."

scarlet.126.t:0 "The Wings That Were Pinned Down"
scarlet.126.d:0 "Remilia moved.\n\n She didn't retreat, but simply sidestepped. Flandre's strike, powerful enough to crush a basement in half, grazed past her ear and blasted through the wall behind her. Gravel, dust, and broken runes rained down, and Sakuya and Meiling immediately shielded Patchouli and Koakuma. But Remilia didn't fall.\n\n She was almost gracefully fast, and almost cruelly cold.\n\n Her cloak swept across the cracked ground, and with a twitch, a turn, and a dodge, she passed through the force that seemed to shatter even the air itself. Flandre was still crying.\n\n Her eyes finally regained their light, but not with calm; instead, it was a surge of fear, pain, and loss of control, suppressed for too long. “Sister!”\n\n Her cry sounded like a plea for help, yet also like a warning.\n\n “Don't come any closer... I can't stop!” Remilia didn't listen.\n\n In the next instant, she was already in front of Flandre, pressing one hand on her shoulder, the other hand precisely gripping the most sensitive spot between her wings and core strength. It wasn't an embrace, not comforting, but suppression.\n\n “Stop,” Remilia commanded.\n\n Flandre struggled violently, her crystal-clear, shattered wings trembling as if about to crack. The walls continued to crack, the dolls were shattered into pieces, and the ground seemed to be torn apart by invisible claws. But Remilia knew her too well, knew her so well that she knew when to dodge, when to block, and when to interrupt any force before it could take shape.\n\n This was not a victory.\n\n This was just a cruel technique developed by an older sister who knew her younger sister too well.\n\n Finally, Flandre was forced to her knees. She braced herself on the broken stone slabs, crying so hard she could barely breathe. Her eyes were no longer dull, but they were no longer safe. She had returned, bringing with her all the suppressed pain and destructive urges.\n\n Remilia slowly released her grip.\n\n The basement hadn't completely collapsed, and she wasn't injured.\n\n But everyone understood this wasn't a solution.\n\n Patchouli leaned against Koakuma, her face deathly pale.\n\n “If this continues, it will only repeat itself,” she whispered.\n\n Remilia didn't answer.\n\n Patchouli continued, “The seal will turn her into an empty shell.”\n “If the seal is broken, she will be torn apart by her own power.”\n “You can continue to suppress her, but that's not saving her.”\n\n Flandre knelt among the rubble and fragments of the doll, her shoulders trembling. She seemed to finally understand that she was still in a cage. Only this time, the cage wasn't an iron door and runes, but her own power.\n\n Remilia looked down at her sister.\n\n After a long while, she finally spoke.\n\n “So?” Patchouli coughed.\n\n “Come to the Great Library.” She looked up, her gaze almost cruelly calm.\n\n “I have two methods.”\n “Both will get her out of the basement.”\n “Neither is a clean answer.”\n\n Sakuya was silent, Meiling clenched her fists, and Koakuma didn't laugh.\n\n Remilia bent down and picked Flandre up. Flandre was very light, unlike the person who had almost destroyed the entire basement. “Sister…” she whispered.\n\n Remilia held her tightly, her voice still steady. “Don't be afraid.”\n\n She didn't say it was alright.\n\n Because things were far from over.\n\n The Scarlet Devil Mansion members left the basement and headed towards the Great Library. The true ending awaited them deep within Patchouli's pages."
scarlet.126.a:0 "Go to the Great Library. Patchouli will provide the final solution."

 scarlet.127.t:0 "The Throne is not empty."
scarlet.127.d:0 "After Remilia's death, the entire Scarlet Devil Mansion remained silent for a long time.\n\n No one dared to speak first. The throne was still there, the flag was still there, the empire was still there, but the one who always stood at the forefront, suppressing everything with arrogance and will, was no longer there. She left behind not an empty city, but a world forcibly held together by blood and war, conquest and sacrifice.\n\n And Flandre survived.\n\n Like a miracle, like a wound finally stopping its bleeding.\n\n Her sister used her own life to pull her back from the brink of collapse. After that, Flandre was no longer a calamity locked behind a door, no longer a demon ready to crush everything at any moment. She was still a vampire, still Scarlet's sister, but she could finally see the people before her, distinguish between embrace and destruction, cry when she wanted to cry, laugh when she wanted to laugh, without fear that her own hands would destroy everything first.\n\n The day she first sat on the throne was quieter than anyone could have imagined.\n\n There was no hysterical laughter, no childish tantrums, and no attempt to mimic her sister's speech. She simply wore an ill-fitting dress, looked up at Sakuya, Meiling, Patchouli, and the people of Scarlet Devil Mansion standing below her, remained silent for a long time, and then said very softly, “My sister is very tired.”\n\n Those words lowered the entire hall.\n\n Flandre did not deny everything her sister had left behind.\n\n She knew that this empire was built by Remilia's own hands; it was her sister who, for her sake, to ensure her survival, had traversed fire and blood to reach this point. She would not betray that will, nor would she allow the name Scarlet to fade in her hands.\n\n Sakuya still stood behind her, like a guardian sword protecting two generations of Scarlet. Meiling stood guard at the door, more silent than usual.\n\n Patchouli gazed at the new master on the throne, saying nothing, suppressing the judgment in her heart— The child locked in the basement was finished.\n\n From this day forward, sitting here is Flandre Scarlet.\n\n Also the new master of the Scarlet Empire."
scarlet.127.a:0 "The throne wasn't vacant; it simply changed masters."

scarlet.128.t:0 "Scarlet of a Thousand Years"
scarlet.128.d:0 "After the new rule began, the world quickly discovered that Flandre was not like Remilia.\n\n The red mist still covered the empire, but it was no longer just a warning; it had become a sanctuary. The old, suffocating, oppressive laws were rewritten one by one; the conquered lands no longer just learned obedience, but also began to learn how to survive. Food, schools, workshops, roads, hospitals, and ports were reorganized, and the patrols were no longer just for intimidation, but also to ensure that no one would truly disappear silently at night.\n\n Unlike her sister, Flandre was not keen on making everyone fear her. She preferred to walk into gardens, streets, and corridors, to see for herself what the world had become. She would kneel down to listen to children, hover for a long time above cities under reconstruction, and suddenly ask questions in council that no one was prepared for.\n\n H ... Because she disliked pushing people to the brink. She knew better than anyone what it felt like to be imprisoned, oppressed, and treated as a threat. So she retained the empire's edge, but slowly wore away the suffocating thorns.\n\n People often say that Remilia conquered the world, while Flandre learned to keep it in her grasp.\n\n The former was like thunder, the latter like fire after a long night.\n\n The name Scarlet did not end with the death of the first queen; rather, it truly entered a thousand years under the second empress. The empire did not collapse, did not rot after victory, nor did it fall apart in the power transition. Just as Remilia had stubbornly tried to prove, it finally stood tall above the world.\n\n And every night, Flandre would still go alone into the room with the old throne and old cloak, and stand quietly for a while.\n\n She hadn't forgotten her sister.\n She would never forget.\n\n Because she knew that she could now sit in the light, watching a world that no longer drove her mad, all thanks to that person who had bought it for her.\n\n So she would continue to live, continue to rule, continue to let the name Scarlet continue in this world, following her sister's unfinished will.\n\n Year after year.\n\n Even a thousand years later, the world would still remember—the empire did not end with the death of the old queen.\n\n In the hands of the wise Empress Flandre, it truly became eternal."
scarlet.128.a:0 "Scarlet's night will endure forever in the world."



 scarlet.129.t:0 "A Funeral for the Red Moon (Part 1)"
scarlet.129.d:0 "That day, the Scarlet Devil Mansion did not rise with its usual sharp red mist.\n\n The sky was low, and the wind was light, as if the whole world knew that it shouldn't be too noisy today. Black veils hung between the long corridors and high windows, and white and deep red roses covered the stone steps together. The coffin was placed in the center of the hall, its wood darkly painted, its silver ornaments gleaming coldly, just like her elegant yet unyielding demeanor in life. No one dared to say that she was merely “asleep,” because everyone knew—this time, Remilia Scarlet would truly never open her eyes again.\n\n Everyone from Scarlet Devil Mansion had arrived. Sakuya stood the straightest. She wore a jet-black maid's outfit and black gloves, as if she had hidden away all the superfluous white she usually wore. She spoke first, her voice steady, as if she wouldn't allow herself to shatter at this moment.\n\n “The young lady picked me up from a place where I had nowhere to go, gave me a name, gave me a place, and gave me a way to live.”\n\n She gazed at the coffin, without bowing her head.\n\n “Many people fear her, many hate her, many say she's arrogant, cruel, and self-centered.”\n\n “They're right.” A faint, barely suppressed gasp filled the hall. But Sakuya didn't stop.\n\n “But she's also the most remarkable master I've ever met.”\n “She can command, punish, push people to their limits; but she also truly remembers everyone she keeps by her side.” Her voice finally trembled slightly.\n\n “Without her, there would be no Sakuya Izayoi today.”\n\n She stopped, bowed, the movement perfect as if it were her final act of gratitude to her master.\n\n Then came Hong Meiling.\n\n When she stepped forward, her eyes were already red, and her voice was nasal. She usually always smiled, even when scolded, injured, or on night watch, she could still soften her tone. But this time, she didn't smile. “Young Miss...”\n\n Her voice went hoarse as soon as she opened her mouth.\n\n She took a breath, as if she were struggling with herself.\n\n “I always thought you were really difficult to please.”\n\n Someone chuckled softly, then quickly suppressed it.\n\n “You have a bad temper, a sharp tongue, and you're never polite when you order people around.” Meiling looked at the coffin, tears finally falling. “But you pulled me from the brink of death, gave me a door, a place to stand, a place where I could continue guarding someone else's home.”\n\n She wiped her face, but it wasn't clean.\n\n “You're not a good person, really.” “But you're my young lady.”\n\n After saying this, she couldn't speak anymore, and could only stand to the side with her head down, her shoulders still trembling slightly."
scarlet.129.a:0 "The first farewell, dedicated to her most loyal sword and door."

scarlet.130.t:0 "A Funeral for the Crimson Moon (Part 2)"
scarlet.130.d:0 "Next up was Patchouli.\n\n She was already pale, and in this daylight, she seemed like a piece of paper that would crumble at the slightest touch. She walked slowly, as if each step was a struggle. Koakuma tried to help her, but she gently pushed her away. When she stood before the coffin, she first coughed lightly, then looked up at the excessively quiet face inside.\n\n Then, she cried.\n\n Not just red-rimmed eyes, not just a hoarse voice, but an uncontrollable sob.\n\n Tears fell one by one, faster than the words she uttered. She had always been the most stoic, the most adept at hiding herself in calm, but now all of that was gone. She looked at Remilia as if watching her most important page being forcibly torn away. “... How could you do this?” she stammered, her voice broken as she spoke. “You picked me up from Dublin, gave me books, medicine, a lamp, a room, let me live, let me read, let me do math, let me tear this world apart for you.” She raised her hand to wipe away her tears, but the more she wiped, the more tears flowed. “You kept me by your side, kept me for so many years... and now, you're just going to die like this?” No one spoke.\n\n Patchouli cried the hardest, as if she wanted to cry out all the words she hadn't spoken in all these years. “I still have so many things I haven't told you.”\n\n “I still have so much research to finish.”\n “I haven't even—” She choked, as if something was choking her.\n\n In the end, she just pressed her forehead against the coffin, not lifting it for a long time. “...\n\n Remilia, I hate it when you're like this.”\n\n It wasn't a curse, nor a complaint.\n It was the deepest sorrow that a mage who had never been good at opening her heart could finally express.\n\n Koakuma was already sobbing and gasping for breath behind her, but she still remembered to support Patchouli. Her own eyes were red, and her voice was so soft it was almost inaudible. “Young Miss, the library will remain open.”\n “I will watch it for Lady Patchouli, and I will watch it for you.” No one spoke in the hall.\n\n Because everyone knew that at this moment, the person who suffered the most was not the one who lost their master, but the one who had pulled them back from the brink of death and raised them to be who they were today."
scarlet.130.a:0 "A second farewell, dedicated to the one who loved her most silently and deeply."

scarlet.131.t:0 "A funeral for the Crimson Moon (Part 2)"
scarlet.131.d:0 "Finally, it was Flandre's turn.\n\n The hall suddenly became so quiet that even breathing was faint.\n\n She walked slowly, as if each step was still unfamiliar. She had regained her senses and her eyesight, and because of this, she understood more than anyone else what was laid out here. She stood in front of the coffin, staring at her sister for a long time, so long that everyone began to fear that she might suddenly lose her voice.\n\n But in the end, she only reached out and touched the edge of the coffin very, very lightly.\n\n “Sister.” Her voice was very soft, as soft as when she first called out behind the basement door as a child.\n\n “I...\n\n I won't ask you if I've been good anymore.”\n\n She looked up, her eyes red, but she didn't lose control.\n “You told me to live as myself.”\n\n “Then I will live on.”\n\n Tears finally streamed down her face.\n “I will protect what you left behind.”\n\n “So, you can sleep now.” This time, even Sakuya couldn't help but turn her face away.\n\n At the end of the funeral, the bells of Scarlet Devil Mansion rang seven times. The coffin was slowly lifted, carried through the corridor, through the garden, through the places she had walked countless times. No one cried out, no one rushed forward to beg for her to stay.\n\n Because everyone understood that Remilia wouldn't like such an ugly farewell.\n\n She deserved a dignified send-off. Even so, when the coffin was finally placed in the cemetery, and the first handful of earth fell, Scarlet Devil Mansion had utterly lost its owner.\n\n The red moon set. But everyone standing there knew that they still bore the marks she had carved. From this day forward, they would continue to live, continue to guard this mansion, and continue to ensure that the name Scarlet lived on in the world.\n\n But some nights, when the wind blows through the corridor, through the curtains, through that throne that was once empty yet always occupied, they still remember that arrogant, cruel, self-centered vampire who also rescued them one by one from the ruins.\n\n And then, everyone will know— Some farewells are never truly finished."
scarlet.131.a:0 "Dedicated to our young lady."



 scarlet.132.t:0 "A thousand years sustained by blood"
scarlet.132.d:0 "Patchouli finally provided a solution.\n\n Not salvation, nor a miracle.\n\n It was a path that could be used, calculated, and maintained, yet was ugly to the point of being cursed: using a vast amount of blood, enough to drown history, to feed the unbalanced power within Flandre, preventing her from falling back into the abyss of madness.\n\n Remilia accepted.\n\n And so, the Empire began its sacrifice.\n\n Not once, not in one city, not even a massacre that would be written into the newspapers and cause an uproar for days. To pull Flandre back from complete collapse, to keep her in her current state—still able to speak, still able to smile, still able to recognize her sister—tens of millions were sent to the altar. Blood was drained, names were erased, corpses were burned, and transportation, recording, sealing, and disposal all became part of the Empire's daily operations.\n\n And this was only the beginning.\n\n From then on, every day had to continue.\n Every day, the blood of tens of thousands was sent deep into the Scarlet Devil Mansion, into the rituals that Patchouli had personally established. Only in this way could Flandre maintain her sanity, and prevent herself from transforming back into the demon who would crush the world at night.\n\n Remilia knew how ugly this was.\n She knew what she was doing.\n\n She simply didn't care anymore.\n\n The empire was too big. Its territory was too vast, its population too large, its railways, mines, ports, farms, cities, colonies, and vassal states spreading across the world like veins. For such a behemoth, the daily disappearance of tens of thousands was enough for local bureaucrats to cover it up with new ledgers, enough for factory smoke and the march of the army to bury the truth, enough for most of the survivors to pretend everything was as usual.\n\n On the surface, everything seemed normal.\n The red mist still covered the sky.\n\n The factories continued to operate. The army remained loyal. Flandre still sat by the window, able to look at her sister, able to speak softly, able to exist like a truly alive person.\n\n But from that day on, the cracks in the empire truly took root.\n\n Not all those who were bled dry remained silent. Not all the lands whose families were taken, whose villages were drained, and whose people were forced to offer “the lives the empire needed” would forever bow their heads. At first, it was just whispers, underground publications, missing transport convoys, and burned-down blood collection stations.\n\n Later, it became guns, explosives, flags in the mountains, and fires suddenly rising in city alleyways.\n\n They would begin to rebel.\n\n Not because they had won hope, but because simply surviving was more humiliating than death. Remilia saw all this, yet she did not stop. She would rather the whole world hate her than let her sister fall back into madness. Thus, the Scarlet Empire continued to exist, continued to expand, continued to shine, and continued to bury its foundations, bit by bit, in exploitation, enslavement, and sacrifice.\n\n A thousand years later, perhaps the walls would still stand, the throne would still stand, and the spires of the Scarlet Devil Mansion would still pierce the sky.\n\n But then, when people mention the name Scarlet, they won't think of elegance, nobility, or the queen's world-conquering achievements. They'll think of altars, blood tanks, the thousands of lives transported to Scarlet Devil Mansion every day, an empire willing to sacrifice the entire world for its sister.\n\n By then, Scarlet will no longer be an awe-inspiring surname. It will become a name that everyone despises, curses, and wishes to be erased from history.\n\n Even so, Remilia won't regret it. Because in this ending, she ultimately chose her sister.\n\n It's just that she bought a different world for it.\n\n Rather, it's the world's eternal, unforgiving hatred for Scarlet."
scarlet.132.a:0 "I can bear the world hating me more than losing my sister."

scarlet.133.t:0 "Patchouli's answer"
scarlet.133.d:0 "There was no wind in the Great Library, only the candlelight flickering gently along the edges of the pages. When Patchouli pushed the last sheet of paper, filled with formulas and annotations, towards Remilia, even Koakuma stopped laughing.\n\n This wasn't an ordinary research report.\n\n This was Flandre's future.\n\n Remilia stood before the table, not immediately reaching out. She simply stared at the complex, almost cruel, technical structures, like looking at a knife finally honed, yet equally capable of wounding.\n\n Patchouli spoke first, her voice flat, as if afraid that any slight fluctuation would undermine the conclusion. “I've considered every possibility.”\n\n She paused, coughing lightly. “If we want Flandre to retain her vampire nature, maintain her current power, and at the same time be able to leave the seal and function normally, it's not impossible.”\n\n Remilia finally looked up.\n\n Patchouli's fingertip touched the first plan. “But the price is support.”\n “Not a cup of blood, not a ritual, but tens of thousands of drops of blood must be poured into the incantation every day to keep the thing within her that's about to burst on the verge of collapse under control.”\n\n The candlelight reflected on the paper, like flowing blood. “As long as the empire exists, as long as the territory, population, transportation, and altars are still functioning, this system can continue,” Patchouli said. “She can come out, she can talk, she can laugh, she can live like a normal vampire.”\n\n She didn't downplay the latter part of her statement.\n\n “But this will turn the entire empire into her blood bag.”\n\n The room fell silent for a long time.\n\n Remilia didn't respond immediately, but instead shifted her gaze to the second proposal.\n\n Patchouli followed her gaze.\n\n “Another path,” she said, “is to strip her of her vampire roots.”\n\n This time, even Koakuma lowered her head. “I can dismantle her power piece by piece, taking away that overwhelming destructiveness from her. She will lose those dangerous things, lose her vampire powers, and lose the possibility of being a calamity.”\n\n Patchouli's voice remained calm, but the calmer she was, the more cruel her words seemed.\n\n “The price is that Flandre will no longer bethe Flandre she is now.”\n “She will become human. Vulnerable, limited, able to be hurt, able to grow old, and even one day die.”\n\n Remilia's fingers finally tightened. Patchouli looked at her and finished speaking. “But she will be truly safe.” “She can embrace others without fear of hurting anyone; she can walk in the sunlight without being locked up; she can cry, she can laugh, she can live as an ordinary, complete person.”\n\n The candlelight flickered softly.\n\n Two paths lay on the table.\n\n One allowed Flandre to continue living as a vampire, but with the entire empire bleeding for her every day.\n\n The other allowed Flandre to become human, losing her powers, losing the most dangerous and dazzling part of the Scarlet bloodline, but being able to live a truly normal life.\n\n Patchouli didn't urge her.\n\n She simply whispered her conclusion. “Remilia, this time there is no third answer.”"

scarlet.133.a:0 "Let her live as a vampire—even if the Empire bleeds for her every day."
scarlet.133.b:0 "Let her become human—losing her power, but in return, she gains a truly peaceful life."

 scarlet.134.t:0 "A brief human dream"
scarlet.134.d:0 "After the ritual, the basement was eerily quiet, unlike Scarlet Devil Mansion.\n\n There were no crumbling walls, no out-of-control power, and no oppressive feeling that threatened to crush the world at any moment. Flandre sat in her chair, looking down at her hands. Those hands were still small, still belonging to Remilia's most familiar sister, but they no longer carried the power to destroy everything.\n\n Patchouli succeeded.\n\n She stripped Flandre of her unbalanced vampire essence, taking with it her terrifying yet beautiful destructive power. The crystal-like wings no longer shimmered, the sharp aura sank into silence. The demon sister who once commanded the entire world's vigilance was now just a pale-faced human girl who had just learned to breathe again. Flandre looked up at her sister, her eyes still filled with unease.\n\n “Sister... am I still me?”\n\n Remilia stood before her, remaining silent for a long time. What she saw was, of course, Flandre.\n\n That was her sister, the child she had once led through fire, through exile, hidden in basements, and repeatedly tried to snatch back from the clutches of fate. But she also knew that some things were forever different.\n\n Flandre will grow up. She will grow old.\n\n Decades later, like all humans, she will slowly approach the end of her life. This is not a seal, not imprisonment, not madness.\n\n She can finally embrace others, finally stand in the sunlight, finally no longer afraid that she could destroy her loved ones with a single gesture. But the price is time—that brief, fragile time that cannot be easily bought back by royal power or magic. Remilia gently knelt down and took Flandre's hand.\n\n Warm. Soft. No longer dangerous.\n\n It felt almost like a stranger to her.\n\n “Of course you are still you,” she said.\n\n Flandre seemed to finally breathe a sigh of relief, slowly leaning into her embrace. It was a real embrace. There were no spell-based alerts, no Sakuya gripping the hilt of her sword, no Meiling tensing her shoulders, and no Patchouli calculating the next tipping point. It was simply the younger sister embracing the older sister.\n\n Remilia closed her eyes, for the first time not commanding herself to immediately consider her next move.\n\n She had won, and she had lost.\n\n The Scarlet Empire would continue. The banner of Scarlet Devil Mansion would still fly high, and the world would still revolve under her rule. She still had the throne, the army, and countless lands shrouded in red mist.\n\n But decades later, Flandre would no longer be beside the throne.\n\n Back then, Remilia would still be young, still proud, still ruling the world as queen. But she would remember a human girl who briefly sat beside her, who learned to drink tea, who walked slowly in the garden, who laughed happily at a ray of sunshine, a pastry, or a simple greeting. Human life is so short.\n\n So short that a vampire might miss half their life in a single long slumber. But it is precisely because it is short that they cherish each day so earnestly.\n\n Flandre would no longer possess eternity, but for the first time, she would have a daily life that truly belonged to her. She would no longer have to live as a calamity, nor would she have to be locked in darkness by those who loved her.\n\n Remilia lowered her head and gently touched her sister's head.\n\n “Then live well, Flandre.”\n\n Her voice was soft, so soft it wasn't like a command.\n\n “Use the rest of your time to live it all as your own.”\n\n Flandre looked up, her eyes red-rimmed, but she smiled.\n\n At that moment, Remilia finally understood— She couldn't keep her sister by her side forever.\n\n But she had finally made her sister truly live in the world."
scarlet.134.a:0 "Human life is short, so every day must be cherished."

scarlet.135.t:0 "The Final Chapter of the Crimson Empire"
scarlet.135.d:0 "The story finally comes to a close.\n\n The banner of Scarlet Devil Mansion once crossed mountains, seas, and the ruins of the Old World; the red mist once shrouded archipelago, East Asia, and Eurasia, finally returning to its homeland burned to the ground. Remilia Scarlet, with arrogance, blood, will, and near-mad love, built an empire for vampires and youkai. She defied fate, conquered humanity, and for her sister, turned the entire world into a bargaining chip she could hold.\n\n This empire will not last forever.\n\n No dynasty is truly eternal. Even the strongest walls will be worn down by wind and rain, even the sharpest armies will dull with time, and even the noblest surnames will be reinterpreted by those who come after. The Crimson Empire will one day decline, split, be overthrown, or slowly lose its original shape in a long period of peace. Those commands that once made the world tremble will become archives; those crimson moons that once illuminated the night will become footnotes in murals, legends, and history books.\n\n But it did exist. It once pushed forgotten monsters back onto the throne of history; it once made human regimes admit that night was not only for hiding on the fringes of civilization; it once cruelly proved that fantasy could possess steel, law, armies, and empires. No matter how posterity judges it—calling it tyranny, miracle, calamity, or Youkai's final, grand counterattack—it cannot erase this crimson mark.\n\n And at the heart of all that glory and sin, there is always one name.\n\n Remilia Scarlet. She was neither a perfect monarch nor a gentle savior. Arrogant, cruel, and self-centered, she undeniably led the Scarlet Devil Mansion through its longest night. She gave Sakuya a name, Meiling a door, Patchouli a light to live, and, in her most extreme way, secured a future for Flandre. This was the end of the Crimson Empire.\n\n Like all dynasties in history, it would one day come to an end.\n\n But when future generations turn the yellowed pages of history and see the red mist, the throne, the expeditions, the ruins, and the Scarlet sisters, they will still understand—a red moon once rose in the world's sky.\n\n It burned.\n\n It also illuminated."
scarlet.135.a:0 "Thanks for playing *Gensokyo: Coexistence or Extinction*."


