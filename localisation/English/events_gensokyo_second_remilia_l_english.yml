 scarlet_news.1.t:0 "“Bunbunmaru Newspaper” Special Issue: Scarlet Devil Mansion harbors a second demon?!"
scarlet_news.1.d:0 "【Bunbunmaru Newspaper / Aya Shameimaru — Exclusive】\n\n Readers, are you ready to tremble? Because what this newspaper has photographed this time is not an ordinary secret of the powerful and wealthy, nor is it some rich kid stealing things in the middle of the night—but the one who is most hidden in Scarlet Devil Mansion has finally shown up!\n\n That's right, it's that name that only exists in rumors: Flandre Scarlet!\n\n For years, there have been so many rumors about her that they could fill a book of ghost stories: some say she is locked in the basement and cannot see anyone; some say she can tear down the entire mansion when she goes crazy; and some even swear that she is behind all those “cleanly handled” incidents in Scarlet Devil Mansion. In the past, these were just rumors—but now, they are not.\n\n Our reporter witnessed and successfully captured the decisive moment when this “Devil's Sister” appeared in the corridor of Scarlet Devil Mansion!\n\n First, it must be stated that she was smaller, quieter, and more unsettling than imagined. Not in a menacing way, but in a different way—like a well-wrapped knife, yet everyone knew it could cut through things. She walked very lightly, and made almost no sound when she stopped, but the moment she raised her eyes, the entire corridor seemed to tense up.\n\n Even more interestingly, she didn't come out alone.\n\n Remilia was with her, and Remilia herself was leading her. Not just watching from afar, not having a maid do it for her, but as if she were carrying something so important that she couldn't bear to part with it—or rather, a card that could finally be played.\n\n The question is: Why now?\n\n The civil war has just ended, Scarlet Devil Mansion has just consolidated its power, and people outside are still debating whether the new order is stable. Then, the sister who has been hidden for who knows how many years suddenly appears. What do you call this, folks? This isn't a coincidence, it's a setup!\n\n Scarlet Devil Mansion never does anything without a reason. They even have a specific place for their teacups, let alone putting a legendary, dangerous figure in the hallway for everyone to see. If this isn't a demonstration, what is it?\n\n Does Remilia want to tell everyone: I'm not just sitting on the throne, I have something even more terrifying in my hands?\n\n Or is it that this younger sister has been successfully “trained” to the point of public display, and Scarlet Devil Mansion is preparing to let the world rediscover the true power of the Scarlet family?\n\n This newspaper cannot draw a conclusion—but it can be certain of one thing: if Flandre Scarlet has been hidden away all along, then her appearance today is definitely not a simple family stroll.\n\n Readers, please remember this name.\n\n Because from today onwards, Scarlet Devil Mansion will no longer have only one chilling master.\n\n There is another, finally emerging from behind the door—\n\n The Devil's Sister."
scarlet_news.1.a:0 "This news is big enough."

scarlet_news.2.t:0 "Special Issue of “Kakashi Spirit News”: The Seen Sister, and the Arranged Appearance"
scarlet_news.2.d:0 "【Kakashi Spirit News / Hatate Himekaidou — Special Observation】\n\n We often mistake “seeing” for understanding.\n\n Especially when someone who has been surrounded by rumors for years finally steps into the light, it's easy for others to decide her meaning in the first second: she is evidence, a warning, a conspiracy, a symbol. But Flandre Scarlet, who truly stands in the corridor of Scarlet Devil Mansion, is not primarily any of these.\n\n First and foremost, she is someone who has been hidden behind a door for a long time, only now allowed to enter the sight of others.\n\n This in itself is worth pondering.\n\n If she is merely a member of Scarlet Devil Mansion's family, why has she not appeared publicly for so many years? If she is simply a sister who needs protection, why did she suddenly reappear after the power reshuffle? And if she is a card deliberately preserved until now, then what we see now, is it the real her, or a posture arranged by Scarlet Devil Mansion for the Outside World to read?\n\n I watched longer and more slowly than Aya Shameimaru.\n\n I saw that her steps were not like a stroll, but more like a tentative exploration. She walked very carefully, not out of fear, but as if confirming whether the ground, light, smell, and sound were still within her tolerance. It was not the gait of a composed person, but more like someone who had just been brought out of long-term isolation, relearning how to maintain distance from the world.\n\n She stopped at the window for a short time, but that stop was more real than any rumor. She wasn't showing herself; she didn't even seem used to being watched. If I had to describe it, it was more like someone had brought her from a very deep, very quiet place into the light, and she didn't yet know whether this light was an exit or some new arrangement.\n\n Therefore, I think the real question worth asking isn't “Does Scarlet Devil Mansion harbor a dangerous person?” but rather: Why did Scarlet Devil Mansion choose this moment to let this sister be seen?\n\n Was it for healing and restoration, trying to help her rebuild her relationships with everyone in the mansion?\n\n Or was it a display of power, letting the world know that the Scarlet family possesses a deeper, more unfathomable force?\n\n Or perhaps, these two are not inherently contradictory. Protection and control, care and management, family and tools—in the center of power, these boundaries are often more blurred than others are willing to admit.\n\n Therefore, when we see Flandre Scarlet, we should first set aside the impulse to rush into defining her. Her appearance certainly has political implications, but it would be too hasty to read her merely as a warning. The sudden thrust into the public eye after years of being hidden is never just her own affair.\n\n That also exposes what those who hid her are facing.\n\n Scarlet Devil Mansion may want Outside World to see a younger sister.\n\n But what Outside World truly sees may be another crack in the mansion."
scarlet_news.2.a:0 "Being seen does not equal being understood."



  scarlet.7.t:0 "The Crimson Morning"
 scarlet.7.d:0 "When the last shot of the civil war faded, Gensokyo received no cheers. Smoke still lingered on the treetops, scraps of iron and blood still lay buried in the mud, and the doors and windows of the houses were tightly shut, as if the entire land was still unsure—whether the fighting was truly over or just continuing in a different form.\n\n The flag of Scarlet Devil Mansion stood high, taut in the wind. Remilia stood at the top of the steps, behind her the mansion she had captured, below her the crowd just subdued into silence. She didn't speak of victory, didn't mention glory, and didn't bother to offer any comfort. She simply looked at the crowd, her tone calm to the point of being cold.\n “From this day forward, monsters will no longer make way for the order of others.”\n\n That sentence wasn't loud, but it seemed to pierce everyone's ears. She didn't need anyone to understand; she only wanted them to remember—this new morning didn't belong to the old world."
 scarlet.7.a:0 "Fate stood beside Remilia"

 scarlet.8.t:0 "Silver knife and ledger"
 scarlet.8.d:0 "The first thing to be sorted after the war wasn't the corpses or the ruins, but order. Sakuya categorized the captured food, steel, weapons, and medicine, registered the prisoners, surrendered soldiers, and remnants of the old forces, and then shoved the chaos into enforceable rules.\n\n She always did things cleanly. When the ledgers on the table were spread out, others saw numbers and categories; but in her hands, they were all the same—disorder that needed to be put back in its proper place.\n “Register the people first, then ration them. Inventory the old strongholds one by one, and collect the weapons.” She said without looking up.\n\n The person next to her hesitated for a moment: “What if someone disagrees?”\n\n Sakuya's pen stopped, her tone still solemn.\n “Then teach him to submit.”\n\n She spoke very calmly, as if she were merely polishing a silver cup. But everyone could tell that the head maid's true strength was never elegance, but rather her ability to transform elegance into ruthless management."
 scarlet.8.a:0 "Sakuya, my perfect Sakuya Izayoi"

 scarlet.9.t:0 "The Smiling Doorkeeper"
 scarlet.9.d:0 "At the newly established checkpoint, Hong Meiling stood firmly. Her smile remained, and her tone was gentle, but the single phrase, “Please show your pass,” was enough to keep refugees, wounded soldiers, caravans, spies, and speculators outside the rules.\n\n She wasn't like Sakuya, who used rules to intimidate, nor was she as inherently oppressive as Remilia. She was more like a wall, unassuming most of the time, but impossible to push through when you really wanted to.\n\n During the day, she stood at the gate, separating the mingled crowds, allowing those who needed to enter to enter, and those who needed to stop to stop. At night, she put away her smile, redrawing lines on the map and at the outposts, connecting the mountain paths, river mouths, and patrols outside the building into a single defensive network. “Add two more shifts of guards here, and this road will be blocked off at night,” she said, pointing to the map.\n\n A subordinate asked her, “Is it necessary to be so meticulous?”\n\n Meiling raised her eyes, her tone still unhurried.\n\n “Yes.” “If the door leaks even once, the people inside will have to clean up the mess for a long time.”\n\n She wasn't just guarding the entrance. She was guarding whether Scarlet Devil Mansion could stand securely, allowing Remilia's will to continue."
 scarlet.9.a:0 "Hong Meiling, I'm so glad I brought you aboard in Shanghai."

 scarlet.10.t:0 "Research in the Grand Library"
 scarlet.10.d:0 "The victory banquet was lively, but the Grand Library remained unchanged. Patchouli didn't attend. She simply accepted the captured Outside World equipment, technical blueprints, and research notes, then locked herself among piles of books and candlelight.\n\n Remilia's instructions were clear: connect these technologies, which didn't belong to Gensokyo, with Scarlet Devil Mansion's existing magic, workshops, and industrial capabilities to create something new.\n\n Patchouli flipped through the dismantled mechanical casing, glanced at a few pages of records, and coughed.\n “The materials are rough, but the structure isn't too stupid,” she said casually.\n\n Koakuma, holding another stack of blueprints, leaned closer: “Is it usable?”\n “It can be disassembled,” Patchouli replied curtly.\n\n “We'll only know if it's worth keeping after we disassemble it.” Her attitude towards knowledge was always cold. There was no worship, no euphoria, only judgment: could it be used? Should it be kept?\n\n Would it make Scarlet Devil Mansion stronger? This library preserved not only past taboos, but also the future to be created. Patchouli knew very well that the end of the war didn't mean the end; what truly determined the next victory was often not the applause in the square, but which page of the book was turned."
 scarlet.10.a:0 "Patchouli, I admire your pursuit of knowledge most."

 scarlet.11.t:0 "The sound of glass breaking came from the basement."
 scarlet.11.d:0 "Post-war Scarlet Devil Mansion was quieter than ever, except for the basement. Every tiny bump there would make everyone in the corridor pause—not out of curiosity, but because everyone knew that behind the door lay not just family, but a calamity that could spiral out of control at any moment.\n\n Flandre sat in her room, hearing the commotion outside, and pressed her face against the door like a child.\n “Sister, did you win?” she asked.\n\n No one answered immediately. Sakuya's hand hovered over the doorknob, as if weighing whether to open the door; Patchouli retouched the seal's patterns, her pen pressed firmly; Meiling stood at the end of the corridor, her brow furrowed.\n\n The sound from inside came again, this time softer.\n “Can I go out and see?”\n\n This question, which should have been ordinary, carried a heavier weight than an order. Because everyone understood that Flandre didn't want to be near this house; she was simply too dangerous. And the more they knew her loneliness, the less willing anyone was to open the door.\n\n The glass shattered again, very softly, as if she herself hadn't controlled the force well.\n\n The silence in the corridor grew even heavier. No one ignored her; quite the opposite—precisely because everyone knew her weight all too well, no one dared to treat this weight as ordinary kinship."
 scarlet.11.a:0 "Is there... is there anyone who can play with me?"

 scarlet.12.t:0 "A red mist shrouded the sky, Remilia's determination"
 scarlet.12.d:0 "The wind on the terrace carried a damp chill, the red mist spread all the way to the horizon, staining the distant lights like blood. Remilia stood before the railing, her fingers resting on the stone surface, but her gaze was no longer on what was before her.\n\n She thought of Europe more than four hundred years ago. She recalled how those high walls, halls, and nights that once belonged to vampires were gradually squeezed out of the world under the crushing weight of science, industry, and the new order. Not a sudden collapse, but a slow erasure by time, like old words erased from history.\n\n She could manipulate fate, yet she never believed fate would treat her kindly. On the contrary, she loathed more than anyone the path already written for her: hiding, retreating, waiting to disappear.\n\n Sakuya walked behind her, stopping half a step away.\n\n “Young Miss.”\n Remilia didn't turn around, only speaking softly.\n\n “I've seen too many things described as “divine will.”” Her fingers slowly tightened, and her tone grew somber.\n\n “But I never admit it.” The red mist churned behind her, like some enormous curtain being drawn back. She finally turned around, her eyes unwavering, only filled with an unyielding resolve.\n “Since this world refuses to give me the destiny I desire,” she said, “then I will rewrite it myself.”"
 scarlet.12.a:0 "How could I, who controls destiny, be defeated by it?"
 

 scarlet.13.t:0 "The probing at the door"
 scarlet.13.d:0 "There can't be only silence after the war. There will always be someone who tests the limits first—sometimes it's a tengu messenger sent down from Youkai Mountain, sometimes it's a rabbit released by Eientei to scout the situation, sometimes it's even just a few seemingly naive fairies who actually remember the information very well.\n\n Hong Meiling accepted them all. She wasn't arrogant, nor was she in a hurry to turn hostile. She still asked people to stop before entering, still served tea, and still offered every greeting with utmost care. But the guests quickly realized that her politeness wasn't a concession, but a carefully crafted warning.\n “Scarlet Devil Mansion welcomes guests,” she said with a smile.\n “But where we go, how much we hear, and what we can take away is up to us.”\n\n One of the tengu messengers raised an eyebrow, as if wanting to push the issue further: “What if we're just here to look around?”\n\n Meiling pushed her teacup forward, her tone still not harsh. “Of course you can look.”\n\n “But after you've looked, you'd better remember which side you're on.”\n\n She never used intimidation to drive people away; she only made them realize that Scarlet Devil Mansion was still showing them any courtesy, which was already quite a lot of face. The wind at the door still blew the same way, and the visitors still came and went, but from the moment she stood there, everyone had to learn one thing: Scarlet Devil Mansion was worth talking to, but not everyone was worthy of being tested."
 scarlet.13.a:0 "Let them know their place, Meiling"

 scarlet.14.t:0 "Index of Forbidden Books and Koakuma's Smile"
 scarlet.14.d:0 "In the Great Library, the truly dangerous things never shine on their own. They are crammed into the spines of untitled books, tucked into the blank spaces of annotations, and sealed behind locks that are just a step away from being opened. Patchouli knew very well that after the war, what was more important than knowledge itself was who could access it.\n\n So she made a new list. Which books had to be sealed away, which techniques could only be accessed by designated personnel, which foreign technologies should be temporarily dismantled and preserved, and those “geniuses” who emerged from the chaos—either recruit them or deal with them; they couldn't be left outside the established order.\n\n Koakuma stood beside her, holding the list, looking through it page by page, her smile growing ever wider.\n “Isn't this too neat?” she asked, tilting her head. “Wouldn't it be more interesting to leave a little gap?”\n\n Patchouli didn't look up, only pressing her quill down.\n “Gap isn't for you to play with.”\n\n Koakuma blinked, as if she hadn't been reprimanded at all. “I just think that if a few self-proclaimed clever people accidentally stumble upon something they shouldn't because of a “small oversight,” it can actually save us a lot of screening time.”\n\n This sounded like a joke, but it wasn't nonsense. Patchouli knew that her familiar always loved to skirt the edges of the rules, but sometimes that way of skirting the edges was indeed more effective than the rules themselves.\n\n She finally looked up and stared at Koakuma for a while. “Don't make it too obvious,” she said. Koakuma's smile deepened as she turned away lightly, clutching the list.\n\n “Understood.” Soon, the bookshelves in the large library were still neatly arranged, the seals intact, and the process seemed largely as Patchouli had requested. Only some people received books that were exactly one page too many; some clever attempts to probe inadvertently stumbled into a trap they shouldn't have.\n\n Patchouli didn't press further.\n\n She knew Koakuma never followed orders completely.\n But as long as the final result remained in her hands, those deliberately left deviations could be considered another form of management."
 scarlet.14.a:0 "Koakuma always accomplishes things in her own way"


 scarlet.1.t:0 "The perfectly elegant head maid"
 scarlet.1.d:0 "The room where the lights are last turned off in Scarlet Devil Mansion is often not the master's bedroom, but Sakuya's desk. Silver trays, ledgers, visitor lists, patrol schedules—all are arranged in a seamless order in her hands. She is nominally the head maid, but in reality, she manages the mansion's operations, resource allocation, and external receptions. Even many matters that should be decided by bureaucrats are first judged by her.\n\n Her position in Scarlet Devil Mansion is special. She is human, yet she stands closer to the throne than most youkai. Some respect her, some fear her, and some always remember—she remains here not out of pity, but because she is useful enough.\n “Head maid, should we change the visitor list tonight?” the young maid asked softly.\n\n Sakuya didn't look up, but simply twirled her quill, crossing out two names and adding three time slots on the paper.\n “Add one patrol to the left corridor. Decant the wine in the banquet hall half an hour earlier.”\n\n “Yes, sir.” She never spoke loudly, yet no one dared to slow down. It wasn't obedience obtained through intimidation, but because everyone knew that as long as Sakuya stood there, Scarlet Devil Mansion wouldn't descend into chaos.\n\n Remilia had looked at her as if she were a finely crafted object, or as if she were looking at a knife she had personally sharpened.\n\n “You're well-suited to this place.”\n\n Sakuya bowed her head and replied, “Serving the young lady is my duty.” She never questioned what she meant to her master. She simply did everything flawlessly, because that was how she stayed in Scarlet Devil Mansion and by Remilia's side."
 scarlet.1.a:0 "The Most Practical Tool: Sakuya"

 scarlet.2.t:0 "Hong Meiling and the Door"
 scarlet.2.d:0 "At dawn, Hong Meiling was already standing at the door. Behind her were the high walls of Scarlet Devil Mansion, and in front of her were all the people and information that had to be sifted through. Many outsiders were initially fooled by her gentle smile, thinking she was just a gatekeeper. But when it really mattered, she was often the first to stop the swords, rumors, and tests. Her responsibilities extended far beyond just the gate.\n\n Outer perimeter security, checkpoint checks, garrison training, wartime defenses—all fell under her purview. If Sakuya was in charge of order within the mansion, then Meiling guarded the line between Scarlet Devil Mansion and Outside World that couldn't be easily crossed.\n “Please show your pass.” She always spoke to visitors in that unhurried tone. A man who looked like a defeated soldier frowned:\n\n “I'm just here to deliver a letter.”\n\n Meiling took the letter but didn't immediately let her go. She glanced down at the seal, then looked up at the mud on the man's boots.\n “The letter can come in, but you can't.”\n “Why?”\n “Because you're carrying a second message, and it's not written on paper.”\n\n She finished speaking while still smiling, but the guards behind her had already surrounded her.\n\n Hong Meiling usually didn't like to put on airs and was often seen as lazy. But those who knew her well understood that she wasn't relaxed, just steady. When it was time to strike, she never hesitated; when it was time to hold her position, she could stand in front of the door until dawn.\n\n Remilia once said, half-jokingly, “I didn't bring you aboard the ship so you could sunbathe.”\n\n Meiling patted her sleeves and replied with a smile, “I know. So leave this side of the door to me.”\n\n She stood at the very front, guarding the first line of security for Scarlet Devil Mansion, a rule many dared not disregard."
 scarlet.2.a:0 "Continue"

 scarlet.3.t:0 "The Vampire Queen Who Controls Fate"
 scarlet.3.d:0 "The wind on the terrace couldn't dispel the red mist. Remilia stood there, looking at the distant lights, as if watching a play that had been written long ago but still refused to admit defeat.\n\n She was the sole owner of Scarlet Devil Mansion, and the place where all power in the mansion ultimately converged. Sakuya handled the administration for her, Meiling guarded the gates, and Patchouli calculated the knowledge and firepower, but the one who ultimately decided who stayed, who left, and where Scarlet Devil Mansion was headed was always her alone.\n\n Few knew that her obsession with “rule” wasn't just aristocratic temperament. She was born into an old age ruled by supernatural beings, yet she watched as science, industry, and human nations gradually forced those ancient beings off the stage. The vampire's pride hadn't died; it had simply been suppressed into the shadows by the times.\n\n Sakuya stood behind her and asked softly, “Young lady, what's next?”\n\n Remilia swirled the wine in her glass, her tone calm to the point of being dismissive.\n\n “Do something very simple.” “Let the world remember again who has the right to define the night.”\n\n She seems willful, boastful, and occasionally like a child who refuses to admit defeat. But when it comes to giving the order, she knows better than anyone what she wants. She doesn't want a fleeting victory, but an undeniable presence; not to please anyone, but to force the world to acknowledge that Scarlet Devil Mansion still stands.\n\n Rumor has it that she can manipulate fate. Perhaps that ability won't directly rewrite everything, but she always manages to turn chance into certainty at the most crucial moments, and turn others' hesitation into her own opportunity.\n\n Remilia raises her chin, as if speaking to the entire world.\n “If fate refuses to bow, I will personally subdue it.”"
 scarlet.3.a:0 "Let the world remember us through order"
 scarlet.3.b:0 "Let the world never forget us through deterrence"

 scarlet.4.t:0 "The Imprisoned Princess"
 scarlet.4.d:0 "The area outside the basement door was always quieter than elsewhere. There was no laughter from a banquet, no hurried footsteps of maids, only seals, chains, and everyone's deliberately suppressed breathing.\n\n Behind the door lived Flandre Scarlet. She was not a subject of Scarlet Devil Mansion, nor a weapon to be commanded at will. She was another mistress of the Scarlet family, Remilia's only sister, and the most dangerous and undefinable presence in the entire mansion.\n\n She had a childlike curiosity and straightforwardness; she could be happy over a small thing, and her face could suddenly darken over a single sentence. The problem was that her emotions were never just emotions. Her power was too direct, direct enough to shatter an argument, a room, or even an entire order.\n\n The crisp sound of glass clinking against the door came from inside.\n “Sister,” Flandre's voice came through the door, soft as a whisper, “Is it fun outside now?”\n\n The hallway fell silent for a moment. Sakuya's hand paused on the doorknob, and Patchouli pressed the newly written formula paper even tighter.\n\n Remilia stepped forward, her tone flat. “It's not your turn yet.”\n “But I want to see too.”\n “I know.”\n\n This flat reply made everyone understand one thing: Remilia didn't not care about her; quite the opposite, it was precisely because she cared that she kept her in the safest, and loneliest, place.\n\n Flandre's status in Scarlet Devil Mansion was always very high, so high that no one could easily order her around; yet, the freedom she truly possessed was pitifully little. She was both a blood relative of the family and a potential threat to the nation. Everyone had to acknowledge this, but no one could say it easily.\n\n A moment of silence followed behind the door, then a very soft laugh.\n “Then remember, sister, don't keep me waiting too long.”"
 scarlet.4.a:0 "Keep her by your side"
 scarlet.4.b:0 "One day, she too will step onto the ground"

 scarlet.5.t:0 "A mage who possesses infinite knowledge"
 scarlet.5.d:0 "In the Great Library, there was no distinction between day and night, only the turning of pages, the wafting scent of medicine, and lamps that never went out. Patchouli sat under the lamps, her long hair flowing, coughed twice, and then pressed her gaze back to the pages of her book and blueprints.\n\n She was a scholar of Scarlet Devil Mansion, and one of the most irreplaceable minds in the entire organization. She rarely appeared in public; internally, technological integration, spell research, intelligence gathering, industrial transformation—many matters that truly determined the future ultimately fell to her. If Sakuya kept Scarlet Devil Mansion running, and Meiling kept it safe, then Patchouli was responsible for ensuring the mansion possessed knowledge and firepower far beyond its time.\n\n On the table lay captured radio parts, blueprints for the Outside World engine, and a stack of newly completed magic circuit records. Koakuma stood beside her, sorting the data.\n “Can these be used directly?” Koakuma asked.\n\n Patchouli turned a page without looking up.\n “Just because something can be disassembled doesn't mean it's usable.\n\n First, categorize it, then compare it, and then decide which parts are worth changing.”\n\n At that moment, Remilia walked from between the bookshelves and stopped at her desk. “I need results.”\n Patchouli finally looked up, her voice still soft, but unwavering.\n\n “Then don't rush someone who's saving you from three failures.” For anyone else, this would be offensive. But Remilia just smiled, without getting angry. Because she knew that Patchouli was just that kind of person: quiet, picky, intelligent, not in good health, and certainly not mild-mannered, but once she decided something was worth doing, she would push it to a depth that others couldn't keep up with.\n\n In Scarlet Devil Mansion, she wasn't the most conspicuous, yet she always sat closest to the core. Many commands were spoken by Remilia, but the methods to carry them out were first conceived in Patchouli's mind."
 scarlet.5.a:0 "The Brain of Scarlet Devil Mansion"


#不要比这个长就好

 scarlet.6.t:0 "The Chosen Shadow"
 scarlet.6.d:0 "The maids believed Sakuya was naturally calm and infallible. Only she knew that it wasn't a talent, but an instinct forced out of her.\n\n Long ago, she was just a shadow on a street corner: no surname, no home, even her cries had to be muffled. Hunger had to be swallowed, fear had to be hidden, because any exposure would bring worse consequences. The worn-out knife in her hand wasn't a weapon, but merely a reminder that she was still alive. That night, the red fog was heavy, and the chill seemed to seep into her bones.\n\n She huddled against the wall, thinking she would be pushed away by the world like everyone else. Then, someone stopped in front of her. It wasn't charity, nor pity.\n\n Those eyes were “selecting”: looking at weight, durability, and whether it could be used. Remilia Scarlet looked down at her, her smile chillingly clean. “You are quiet.” That wasn't a compliment, it was a starting point.\n\n She was led into Scarlet Devil Mansion, dressed in uniform, had her stains washed away, learned proper posture and etiquette, and also learned to suppress the word “human” deep within her chest. When she first stepped into the banquet hall, the silverware gleamed blindingly, and the aroma of spices and wine was as heavy as chains. She immediately understood: this wasn't a shelter, but a stage, and also a cage.\n\n In Youkai's palace, humans weren't companions, but exceptions; exceptions meant being replaceable, discarded, or treated as disposable entertainment. She had no bloodline to rely on, no tribe to protect her; the only thing she could grasp was one thing—to make every task a flawless success.\n\n Therefore, she treated service as a trial: the tray mustn't wobble, the tea mustn't spill, the angle of the cutlery mustn't be off, and not a single extra word could be uttered. She suppressed her emotions, hid her weariness in her eyes, and chopped up every mistake before it happened.\n\n Now she took charge of both domestic and political affairs, organizing ledgers until late at night, checking supplies until her fingertips ached; she handled the probing of visitors for her master, shielded Scarlet Devil Mansion from the eyes and ears of the Outside World, and broke down risks into actionable lists. She established rules for access control, ensured supply for every need, and made sure every maid knew her place and next step.\n\n She appeared composed.\n\n Only she knew that composure was something she held firmly.\n Because she dared not let go. If she did, the shadow of past hunger would crawl back, reminding her: You have nothing.\n\n Therefore, Sakuya kept Scarlet Devil Mansion running like a tightly wound clock.\n Every tick was a “stay” she had fought for."
 scarlet.6.a:0 "Hand her the key."
 


 scarlet.16.t:0 "Scarlet Dawn"
 scarlet.16.d:0 "The first decree was issued that night, reaching all directions: all youkai, immediately assemble at Scarlet Devil Mansion.\n\n The message spread, and the entire mansion quickly lit up. Not the ostentatious light before a banquet, but a light born to welcome power. The corridors were polished until they reflected images, candlesticks and flags were all rearranged, even footsteps were placed in their proper positions. Sakuya stood at the forefront, ensuring every movement was flawless; Meiling stood guard at the door, her smile still there, but her eyes were harder than usual; Patchouli pushed stacks of rosters onto the table, the handwriting almost coldly neat; Koakuma moved back and forth beside her, carrying seals, documents, and seals, as if treating a large-scale power takeover as some complex and intriguing game.\n\n Only the door behind the throne remained completely closed.\n\n Someone heard a soft laugh coming from inside, followed immediately by silence. No one asked any questions, because it wasn't an interlude, but a reminder—at the heart of Scarlet Devil Mansion wasn't just a queen, but also an unstable heart that no one dared to ignore.\n\n As the last group stepped into the hall, Remilia finally raised her hand.\n\n The entire hall fell silent immediately.\n\n She stood high above, her cloak almost blending into the red mist. She didn't raise her voice, yet every word seemed to sink directly into the bones. “From today onwards, I'm in charge.”\n\n Her gaze swept over everyone, as if calling out names, or perhaps selecting them.\n “You are no longer night stalkers fighting alone, nor remnants hiding in the cracks waiting for humanity to handover a place.”\n\n She paused, her tone still steady. “You are my subjects.”\n\n No one dared to move. “My kingdom will expand, will arm itself, will produce, and will command this land to learn fear anew,” she said. “And from this day forward, fear will no longer be mere hearsay; it will be written into laws, engraved in tax books, and imprinted in every summons and command.”\n\n At that moment, Scarlet Devil Mansion was no longer just a secluded castle. It became a palace, a command center, and the new center of the entire archipelago.\n\n And Remilia was no longer just a name that people trembled over in private whispers. She began to be formally written into proclamations, engraved on the shell of power, and repeatedly confirmed as the unquestionable ruler.\n\n Dawn would still come.\n But from this day forward, dawn was no longer white.\n It was red."
 scarlet.16.a:0 "The earth would be dyed red."



 scarlet.17.t:"The knocking outside the door."
 scarlet.17.d:"The room was eerily quiet.\n\n Sakuya sat on the edge of the bed, back ramrod straight, hands on her knees, as if still standing before a throne awaiting judgment. She had obeyed the order to “rest,” but her mind refused to stop. She stared at the shadow of the pendulum on the wall, counting each swing, as if by cutting time into small enough segments, she could pinpoint the exact second she had gone astray.\n\n She began to dissect every detail of that evening: Was the tray too close to the table? Was the volume of her reply too soft? Was the angle of her gaze disrespectful enough? She forced herself into a narrow box, repeatedly banging her head against it until her breath became short. Every “possibility” felt like a new crime.\n\n The flatter Remilia's tone, the more it sounded like a verdict. Sakuya understood what the fate of being “superfluous” was in her master's world: no explanation needed, no pity needed, just a single word, and she would be removed from the stage.\n\n She wanted to stand up, wanted to work, wanted to make up for everything with results. But the command felt like a lock on her throat. If she moved, it was like disobeying; if she didn't move, it was like being abandoned.\n\n Her fingertips unconsciously gripped the hem of her skirt, pulling the fabric into a tiny crease.\n\n Wrinkles. In that instant, she felt like she'd been struck by lightning. She abruptly let go, immediately stood up, and smoothed out the wrinkle until the fibers were smooth and even again. Her movements were erratic, as if she were rescuing a non-existent disaster. She straightened her gloves, pulled the hem of her coat to a perfect crease, and aligned the toes of her shoes once more.\n The more she tidied herself, the more chaotic it became; the more she strived for perfection, the more dirty she felt.\n\n “What did I do wrong...” she whispered, as if afraid to let anyone hear. After the words fell, her chest suddenly felt empty, followed by a deeper sense of suffocation. She pressed her forehead against the cold mirror. Her reflection was still upright, but like a polished shell. Her eyes were unfocused, only one thought repeatedly pounding in her head: If my master no longer needs me, what am I left?\n\n The knocking sounded at that moment.\n\n Three knocks, steady and unhurried. Sakuya froze. Her first reaction wasn't relaxation, but fear—was she being called in for punishment? Was she going to be replaced? She swallowed hard to get her voice back to normal."
scarlet.17.a:"Who's outside?"

 scarlet.18.t:0 "Knocking sound from outside"
 scarlet.18.d:0 "“...\n\n Please come in.” The door opened a crack, and Hong Meiling stood outside. She didn't laugh too frivolously, nor did she pretend not to know anything; she simply kept a steady posture, like a gatekeeper slowly inching her way into the room.\n “Sakuya,” Meiling's voice was low, carrying a deliberately suppressed worry, “You didn't turn on the light.\n\n I was afraid you... weren't feeling well.” Sakuya immediately wanted to reply, “I'm fine.” She had said those words too many times, almost instinctively. But this time, she couldn't bring herself to say them.\n\n Her lips moved, uttering only a weak, lifeless word. “... I'm alright.” Meiling didn't call her out. She looked at the mirror, at the excessively neat arrangement of the bed, at Sakuya's hands with their white knuckles. She paused for a second, as if choosing her words, then placed the things she had brought on the table—a cup of still-warm tea and a small dish of snacks.\n “Miss only said you should rest,” Meiling said slowly, as if pressing a sentence into Sakuya's ear, forcing her to hear clearly. “It's not that you're useless, nor that you did anything wrong.”\n\n Sakuya's shoulders trembled slightly, but she immediately suppressed the tremor. She wouldn't allow herself to show any cracks in front of others.\n “An order is an order,” she forced out a proper tone. “I will obey.” “You obey it like you're being tortured.”\n\n Meiling's words were like a punch, hitting Sakuya where she couldn't be touched. Sakuya wanted to retort, wanted to use politeness to create distance, but she suddenly realized she had already used up all her strength. Her throat tightened, her chest ached, like water that had been held back for a long time was finally about to overflow.\n “I can't stop,” she finally spoke, her voice hoarser than she had imagined. “If I stop... there will be problems. They'll see. They'll...”\n\n She didn't finish the last two words.\n\n She would be abandoned."
 scarlet.18.a:0 "I don't want to be abandoned, I don't want to be abandoned again."

 scarlet.19.t:0 "A Knock at the Door — Part II"
 scarlet.19.d:0 "Meiling took a step forward, stopping at a distance that wouldn't make Sakuya feel pressured, but her tone was even harsher.\n “Do you think you're the only one holding this building together?” She stared into Sakuya's eyes, as intently as a gatekeeper staring at an enemy. “Sakuya, you're not a tool. You're part of us. Without you, this place would really be in chaos. But not because you're going to grind yourself down.”\n Sakuya's breathing began to become erratic. She tried to suppress it, but the more she tried, the more out of control she became. Her nails dug into her palms, as if trying to force back the heat from her eyes with pain.\n\n Meiling's voice was lower, but clearer. “Do you know what I fear most?” she said. “It's not war, it's not assassins. It's standing at the door one day, turning around, and finding you gone. Because you pushed yourself too hard, to the point of breaking.”\n\n Sakuya's defenses finally crumbled.\n\n She didn't cry out loud, her eyes reddened, her eyelashes trembling as if blown by the wind. She clenched her teeth, still trying to swallow her loss of composure. But Meiling didn't let her escape.\n “Everyone cares about you,” Meiling added, like placing warmth into her cold hands. “Patchouli asked too, saying your footsteps sounded off today; Koakuma secretly slipped me some snacks; the maids didn't dare speak loudly in the entire corridor, afraid you'd hear and think they hadn't managed things properly.” Sakuya was stunned.\n\n It was as if she was hearing the word “being noticed” for the first time.\n\n She had always thought only her master was watching.\n\n But it turned out that wasn't the case.\n\n Meiling reached out, not touching her, but simply placing her palm where the girl could choose to accept it.\n “You can rest,” she said. “Not because you're not good enough, but because you've endured too long. You don't need to prove you can stay by being perfect.”\n\n Sakuya's throat trembled, and she finally exhaled a long, trembling breath. It was a breath pulled from deep within her chest, carrying a lingering bitterness. She lowered her head, her voice almost inaudible.\n\n “... What if I'm not perfect?”\n Meiling answered quickly, as if she had already thought about it.\n\n “Then I'll stand at the door and block those things that want to drive you away.”\n\n The candlelight in the room remained steady, but it no longer felt like an instrument of torture.\n Sakuya clenched and unclenched her fingers, as if learning something entirely new.\n\n She didn't say thank you. She simply picked up the cup of tea and took a sip.\n\n It was very hot. But that heat made her feel alive for the first time."
 scarlet.19.a:0 "The tea you brewed is delicious, Meiling"


 scarlet.20.t:0 "Names by Candlelight"
 scarlet.20.d:0 "The banquet hall door opened under her fingertips.\n The light rushed in first, like a net that gave no way out. The candlesticks were neatly arranged, the silverware was dazzlingly bright, the tablecloth was without a single wrinkle, and even the angle of the vases looked as if someone had measured them with a ruler. Sakuya instinctively scanned her surroundings: entrances and exits, shadows, windowsills, behind pillars—she was looking for threats, and also for mistakes.\n But tonight's “abnormality” was not a flaw, but rather that the entire Scarlet Devil Mansion was waiting for her.\n She had only taken one step when the door was closed. In that instant, her back tensed as if it were being pulled by a string. She had no tray, no roster, no order list.\n Her fingers instinctively reached for the edge of her gloves, checking if her posture was acceptable, confirming she was still “usable.”\n Then, the sound faded.\n It wasn't the lively applause, but a terrifyingly orderly chant—like a roll call, like an audit.\n “Sakuya—!” Her name was pushed across the entire banquet hall, striking her chest. The maids stood in two rows, their gazes unwavering; the kitchen staff leaned against the door, even Koakuma, who usually chuckled, had her lips tightly pressed together; Patchouli sat at her seat, a thin booklet in her hand, as if she had written her message before coming; Flandre sat in a darker corner, swinging her legs, her eyes shining as if trying to dissect her.\n Sakuya's first reaction wasn't flattery.\n It was fear.\n She was too used to being judged under the gaze of others. A series of questions flashed through her mind: Was there a problem with her management? Had she displeased someone? Had the master already decided—in a dignified, clean, and impeccable way—to remove her from her position?\n She held her breath, forcing out the most standard courtesy. “Young Mistress.”\n Remilia sat in the high-backed chair beside the throne, red wine swirling slightly in her glass.\n Her gaze towards Sakuya was as usual, light, cold, as if observing an inevitable order. She raised a finger, gesturing for Sakuya to move forward. “Tonight, you don't need to work.”\n Sakuya's throat tightened, almost reflexively uttering “Yes, ma'am” and immediately beginning her inspection.\n But she was rooted to the spot by those words: not needing to work—in her world, this wasn't a reward, it meant being rendered useless.\n Remilia didn't explain further, only announcing a new rule. “Sit down.\n As a “guest.”” An order is still an order. She could only obey.\n She was seated in the center of the head table.\n That position usually didn't belong to her, but to those who were revered.\n The moment the chair back pressed against her spine, all her muscles tensed: she sat too straight, too upright, like an object placed on a stage. She could feel every gaze lingering on her, even the heat of the candlelight seemed amplified. The first glass of wine was raised.\n Sakuya was most familiar with handing out drinks, never accepting toasts.\n Koakuma jumped out first, as if deliberately using lightness to mask seriousness.\n “Head Maid! You're not allowed to say “I'll do it” today!\n We'll serve the dishes ourselves!”\n Several maids couldn't help but laugh out loud, but quickly suppressed their laughter, as if afraid she would misunderstand it as mockery. Sakuya's fingertips twitched slightly. She wanted to correct the order, to remind everyone that their positions weren't aligned, but then she remembered her master's words—she wasn't in charge tonight."
 scarlet.20.a:0 "Suddenly, Patchouli walked onto the stage to speak."

 scarlet.21.t:0 "Names Under the Candlelight"
 scarlet.21.d:0 "Patchouli cleared her throat, her voice still soft, but more direct than usual.\n “Half of the chaos in Scarlet Devil Mansion is thanks to you resolving it.”\n She paused, as if unaccustomed to displaying her emotions.\n “Thank you.”\n Those two words carried more weight than any lengthy speech.\n The maids then raised their glasses, one after another.\n Some said she pulled everyone back from their mistakes; some said she could get everyone back to their positions on time even on the most dangerous nights; some whispered confessions—they used to be afraid of her, only to later realize that it wasn't coldness, but that she shielded everyone from trouble.\n Sakuya listened, her chest feeling like it was being squeezed little by little. Her expression remained composed, her lips only allowing a very thin curve. She dared not reveal too much, as if she relaxed, she would fall apart.\n Remilia finally put down her glass.\n The banquet hall fell silent instantly, as if awaiting a verdict.\n “Sakuya Izayoi.”\n When Remilia called her full name, Sakuya's heart sank, and she almost stood up to receive her command.\n “You've done a great job organizing Scarlet Devil Mansion.” Remilia's tone was flat, like she was evaluating a useful item, but she deliberately paused for a moment.\n “So I don't want you to break.”\n Sakuya's fingertips went numb as those words fell. She couldn't tell if it was concern or a warning, but she understood what her mistress meant: she was still needed.\n She wanted to respond immediately, to promise immediately, to lock herself back into perfection immediately.\n But the next second, the whole room called her name again.\n “Sakuya—!”\n The voice was louder and more uniform, as if pushing her from her chair into the spotlight. She was forced to look up, forced to endure this “seeing.” She had always hidden herself behind efficiency, behind etiquette, behind the cracks of time. Today there were no cracks.\n Her breath hitched.\n Just as she was about to dig her nails into her palms, a more familiar, more steady presence approached.\n Hong Meiling stood in front of her.\n She didn't grin or try to gloss over it with a joke. She stood very straight, as reliable as a goalkeeper. She extended her hand, palm up, stopping in a position that wasn't coercing, but didn't allow her to escape.\n “Dance with me.”\n Sakuya was stunned.\n “I... I shouldn't have—”\n “The young lady said you're a guest.” Meiling interrupted her, her voice not loud, but as hard as iron.\n “Guests should accept.”\n The maids around automatically stepped back, clearing a space. Someone put down the record player, and the melody flowed out, restrained and slow, as if giving her a breathable pace.\n The moment Sakuya placed her hand on it, she realized her palm was cold.\n Meiling's hand, however, was very warm.\n The dance began.\n Sakuya instinctively wanted to lead the rhythm, to step on each step with absolute precision, to make sure her skirt wouldn't hit the table leg, to make sure the candlelight wouldn't be disturbed by the airflow. She even calculated the turning angle, as if treating the dance as a task.\n Meiling pulled her back.\n It wasn't force, but a steady pull.\n “No need to calculate,” Meiling whispered, almost inaudible to her.\n “Just look at me.”"
 scarlet.21.a:0 "The graceful dance continues"

 scarlet.22.t:0 "Names by Candlelight (Part 2)"
 scarlet.22.d:0 "Sakuya looked up.\n Meiling's gaze didn't waver, nor did it probe. It wasn't the gaze of a gatekeeper towards an enemy, but a more personal, more direct look—as if she were a person, not a position. Sakuya suddenly felt a sharp pain in her chest.\n\n She tried to suppress the pain, to cover it with politeness, but Meiling's gaze seemed to peel away all her defenses, layer by layer. As the melody reached its quietest section, Meiling's voice fell close to her ear.\n “Sakuya, I will protect you for the rest of my life.” Sakuya almost stumbled.\n\n She immediately tried to salvage the situation, to erase the mistake, but Meiling steadied her even more. Meiling didn't laugh, nor did her tone become exaggerated; it was as if she were making a vow to herself, as if she were nailing her words to the floor.\n “I'm not saying this because you're useful.” Meiling looked at her, her eyes deep. “You are the person I care about most in my heart.”\n\n She paused, as if swallowing the last word and then spitting it out. “You are the person I love.”\n\n Sakuya felt as if her throat was being squeezed tightly.\n She had always thought that as long as she was perfect, she could stay. She had honed herself into a knife, a gear, a machine that would never stop. But at this moment, she was suddenly forced to face another answer: someone cared about her, not because of how clean Scarlet Devil Mansion was, but because of her existence. Her eyes quickly welled up, almost uncontrollably.\n She clenched her teeth, refusing to let herself cry. She could only turn her face slightly away, as if adjusting her breathing. Meiling didn't force her to say anything.\n\n She simply held her hand more firmly, leading her through the final spin. When the music stopped, the entire audience called her name again.\n “Sakuya—!” This time, the call wasn't like an inspection.\n\n It was more like wanting her to stay.\n\n Sakuya stood in the center of the candlelight, her back ramrod straight, yet for the first time, she didn't feel like an object placed on a stage.\n She opened her mouth, her voice soft, yet genuine. “... I understand.”\n\n She didn't say thank you.\n She just tightened her grip on Meiling's hand a little.\n And the night in Scarlet Devil Mansion was still cold.\n But in that coldness, she finally felt a warmth that didn't need to be obtained through perfection."
 scarlet.22.a:0 "Sakuya, everyone's beloved Sakuya"
 
 
 scarlet.23.t:0 "Sakuya will never be abandoned."
 scarlet.23.d:0 "Humans love to use beautiful words to package abandonment.\n “Foster parents”—how respectable that sounds. But on the West Coast of early 20th-century America, those people treated her as a risky investment. If the child got sick once, caused a little more trouble, or cried even slightly louder, they started calculating, started complaining, started finding excuses.\n In the end, they chose the easiest method: abandon her.\n It was a foggy night in the port city. The sea breeze carried the smell of salt, and the streetlights cast their glow in the damp cold, like a dirty veil. The sounds of horse-drawn carriages, tram bells, and dockworkers' shouts mingled together—noisy, but none of them were for her. She was left behind in the alley behind the church, wearing only an ill-fitting coat, clutching a worn-out knife tightly in her hand, as if grasping at the last “I'm still alive.”\n She didn't cry loudly.\n Those kinds of children are the most troublesome. She didn't argue or make a fuss, but simply saw the world clearly with her eyes: no one would turn back. She swallowed her tears, her back stiff, as if forcing herself not to fall. That stubbornness wasn't courage, but the survival skills learned by those who were abandoned.\n I stood at the alley entrance watching.\n Don't misunderstand. I didn't go over because I was soft-hearted. I just hated wasting time.\n A child who can't break down in a night like this, a child who knows how to suppress her fear even when abandoned—this kind of material, left to rot on a street corner, is laughable.\n She looked up at me, her eyes like nails. She didn't cry for help, nor did she beg for pity; she just gripped the knife tighter, as if preparing to exchange her last breath with the whole world.\n I smiled.\n “Your “parents” abandoned you.” I stated the fact calmly, because the truth doesn't need gentleness.\n Her breath caught for a moment, but the fire in her eyes didn't go out. She was clearly terrified, yet she stubbornly refused to back down.\n Very good.\n I crouched down, letting her see my face clearly, and letting her see my rules.\n “You have two paths,” I said.\n “Stay here, wait for humanity's kindness to give you a bed, and then throw you away a second, a third time.”\n “Or come with me.”\n She didn't agree immediately. She looked at my hands first, then my shoes, then the car and entourage behind me—as if judging whether she was about to be deceived again. That wariness was justified. Those who believe too quickly don't live long.\n “Go with you, what for?” she finally spoke, her voice dry like sand.\n I didn't coax her.\n “Live,” I said.\n “But not by begging.”\n “With results.”\n I held out my hand, not asking her to shake it, but commanding her to choose.\n Her hand was cold, her knuckles stiff. The moment she took my hand, I knew she had made her decision—not because I offered her warmth, but because I gave her a place."
 scarlet.23.a:0 "Becoming a dashing head maid"

 scarlet.24.t:0 "Sakuya will never be left behind"
 scarlet.24.d:0 "I took her back to my mansion on the West Bank. The first night, I didn't give her any stories, nor any comfort. I only gave her clean water, a clean bed, and one sentence.\n “From today onwards, you are no longer trash thrown into the alley.”\n “You are mine.”\n\n She looked at me, as if wanting to refute, but unable to find a foothold to refute. She understood all too well that “being owned” was at least more livable than “being unwanted.”\n\n I gave her a name, a uniform, and training. She learned to stand properly, learned etiquette, learned to lock her emotions deep inside. She honed herself to a sharp edge, perfecting every detail without flaws, because she knew—as a human being, if she wanted to stay, she had to be more reliable than anyone else.\n\n And I allowed her to stay.\n\n It's not out of mercy.\n It's because she deserves it.\n\n So let me be clear: Sakuya will not “die.”\n It's not because fate favors her.\n It's because I won't allow anyone to take her away from me.\n\n She is the head maid of Scarlet Devil Mansion, the most precise order in my hands.\n She is also someone I personally picked up, forged, and kept."
 scarlet.24.a:0 "She is mine."

 scarlet.25.t:0 "Those Years in Shanghai (Part 1)"
scarlet.25.d:0 "You guys always like to portray Shanghai as so romantic. Neon lights, cheongsams, jazz, Western-style houses. It's as if the blood disappears as soon as the lights come on.\n\n But what I remember about the 1920s was just coal smoke, dampness, gun oil, and the indelible fishy smell of the Huangpu River. Warlords divided their territories into pieces; by day, the police were in charge, by night, the gangs; today they'd fly one gang's flag, tomorrow they'd switch to another's gun. Those kinds of places were perfect for hiding things, and also perfect for seeing what a person really had left.\n\n That's when I met Hong Meiling. But before meeting her, I had actually heard some fragmented rumors. Some say she's a wandering martial artist, who intervenes wherever someone is bullied; others say she's not human at all, but a dragon that has lost its shrine, something that fell from its divine position and drifted in the mortal world for three hundred years.\n\n Later I learned that those words weren't entirely wrong.\n\n She was once worshipped by the village, a dragon symbolizing God. But after the village was destroyed, the faith was severed. The divine position lost its roots, and what remained on Earth slowly transformed into a youkai. She is neither a simple god nor an ordinary youkai. But she no longer cares about those things.\n\n She only recognizes herself as Hong Meiling.\n\n I see her destiny.\n Since the Taoist priest who guided her in her cultivation died, she has wandered throughout China for three hundred years. She helped many people and offended many families; she saved some struggling places, which made her a target for even more vengeful people. It wasn't that she didn't understand the consequences; she simply couldn't learn to stand by and watch someone die.\n\n The first time I truly saw her was on a nearly destroyed street in Shanghai.\n\n The merchants on that street were cornered. The warlords collecting taxes were fierce, claiming it was requisition, but in reality, they wanted to drain the entire street dry. Several shopkeepers knelt, their hands trembling so much they couldn't even hold their ledgers. Everyone knew that if they were taxed again, they wouldn't survive.\n\n Hong Meiling stepped forward.\n\n She was dressed simply then, her sleeves tightly bound, with no extra adornments, like an ordinary martial arts girl. But the moment she made a move, it was clear she was no ordinary person. Her punches were fast, her steps steady, and her energy deep.\n\n She didn't rely on brute force to smash things randomly, but rather channeled her power into the joints and bones, causing people to fall one after another. She could kill, but deliberately didn't; she could break a person's sternum, but still spared their life. That wasn't out of soft-heartedness, but because she didn't want things to immediately escalate beyond repair.\n\n But Shanghai never rewards kindness. She blocked the first wave for that street, but the second and third waves came immediately. Gunshots rang out from the alley entrance and rooftops, and more warlords' men surrounded them. Some shouted for arson, others shouted to kill the meddlesome one first.\n\n This time she couldn't block them all. She was shot in the shoulder, then again in the side, and a bullet that grazed her leg cracked the cobblestones. She could still fight, but she could no longer protect the entire street. If she stayed, not only would she die, but a whole row of people she had saved would also be killed in retaliation.\n\n In the end, she retreated.\n\n Not because she was afraid of death.\n\n Because she finally realized that if she continued, she would only drag more people into the mess."
scarlet.25.a:0 "She finally retired, but it was too late."

scarlet.26.t:0 "Those Years in Shanghai (Part 2)"
scarlet.26.d:0 "When I found her, she was hiding under the bridge.\n\n Raindrops dripped from the cracks in the bridge surface, and the wind along the Huangpu River was damp and cold. She sat leaning against a stone pier, breathing heavily. She had been shot several times, and blood had stained half of her clothes. Her hand was still pressed against her wounds, but her eyes were still bright, as if she would raise her hand to strike if anyone approached.\n\n She's fine.\n\n I don't like people who give up too easily. When she saw me, she frowned first, then straightened her back a little.\n\n “Don't come any closer,” she said.\n\n I stood outside the shadows of the rain and watched her for a while.\n\n “You're going to die.” She didn't refute it. Because it was true. I slowly approached, my heels clicking in the puddles, the sound soft but enough for her to know I wasn't going to hide.\n\n She stared at me, as if trying to determine whether I was there to finish her off or to watch the spectacle.\n “You helped an entire street,” I said. “And you angered the entire tax-collecting warlord.\n\n Now those merchants are alive, but you're stuck here waiting to bleed to death.”\n\n Her lips twitched. “I know.”\n\n “Then why are you still helping?”\n\n She was silent for a while before replying softly.\n\n “I can't just watch them die.” What a hassle. But it really works. I squatted down, looking at this thing that had been wandering for three hundred years, not even caring whether she was a god or a youkai. She didn't care about her identity, her name, or what others called her.\n\n She only recognized one thing: her name was Hong Meiling.\n\n That's enough. “I'll save you,” I said. She immediately looked up. “Conditions?” That's a good question.\n\n A dying person still remembering to ask conditions means their brain is still working. “Work for me,” I said decisively. “From today onwards, work for me.\n\n Protect me, shield me from trouble, and keep those who shouldn't be near me out.”\n\n She stared at me, not immediately agreeing.\n\n I then made my point even clearer.\n\n “Come with me, and you won't have to wander like this anymore.” “I know a place.”\n\n “It's far away, on the other side of the east, called Gensokyo.”\n\n Her eyes truly flickered for the first time.\n\n I looked at her and slowly uttered the last sentence. “Follow me, and you won't have to clean up other people's messes anymore.”\n “I'll give you a job, a position, and a place where you don't have to continue your exile.”\n\n A long silence followed under the bridge.\n\n Finally, she removed her bloodied hand from the wound and placed it in my palm.\n\n “My name is Hong Meiling,” she said.\n\n “I know,” she replied.\n\n That night, I took her away from Shanghai. It wasn't like picking up a piece of trash, nor was it about saving a pitiful person.\n\n I was taking a door away for myself. And she, finally, found a path where she no longer had to wander alone."
scarlet.26.a:0 "From that day on, she was no longer just a wandering dragon."
 

 
 scarlet.27.t:0 "Interrogation in the Basement"
 scarlet.27.d:0 "The basement of Scarlet Devil Mansion was always cold.\n\n This time it was even colder. Sekibanki, Kagerou Imaizumi, and Wakasagihime were tied separately to three chairs, able to see each other but unable to touch. Sakuya stood in the center, holding no whip, only a thin notebook. She first wrote down the three names, then closed the pen cap, as if announcing that this was not torture, but organization. “I'll only ask once,” she said. “Where is Seija Kijin?”\n\n Kagerou spat out a mouthful of blood, her voice hoarse and fierce. “You're dreaming.” Sakuya nodded, as if she had heard the expected answer. The next moment, time was cut. The candlelight went out, breathing stopped, and only she could still move. The knife tip didn't pierce a vital spot, but merely grazed along the most sensitive edge of her skin, cutting the pain long and thin.\n\n When time resumed, Kagerou arched violently, the chair legs dragging on the floor with a screeching sound. “Next,” Sakuya said, looking at Wakasagihime.\n\n Wakasagihime's face was pale, but she still forced a smile. “Is this all you nobles can do?\n\n You just want people to cry out in pain—” Before she could finish speaking, her smile shattered. Sakuya pressed her into the brief stillness of time, making her unable to breathe, as if invisible water was being poured into her lungs. She didn't let her die, but only made her clearly understand how long the suffocation would last.\n\n Sekibanki's head trembled, her voice finally trembling. “Hey... is that enough...” Sakuya turned to look at her, her eyes frighteningly flat. “It's not your turn yet.” There weren't many screams in the basement, because Sakuya could even shred the rhythm of their screams. She let them see how they were broken, yet didn't let either of them truly pass out.\n\n Finally, she turned to a blank page in the notebook and asked again. “Seija Kijin, where is she?”"
 scarlet.27.a:0 "Let them speak."

 scarlet.28.t:0 "Name in the Crack"
 scarlet.28.d:0 "The one who collapsed first in the end wasn't Kagerou, nor Wakasagihime.\n\n It was Sekibanki.\n\n Her head was hanging low, her breathing erratic, as if each breath pulled her somewhere. She was usually the most stubborn, but now even raising her head was difficult. Sakuya placed the teacup where she could see but not touch it, her voice still steady. “I said I'd stop.”\n Sekibanki smiled, a smile more painful than tears.\n\n “You... these neatly dressed monsters...” Sakuya didn't reply, but gently embedded a throwing knife into the table.\n\n The blade trembled, emitting a faint ringing sound. On the other side, Wakasagihime was still coughing, and Kagerou's fingers were trembling so much she couldn't clench her fist. Sekibanki closed her eyes and finally cursed.\n\n “Damn it... she's under the old quarry.”\n Sakuya didn't move immediately, but asked for more details.\n\n “The entrance.” “Behind the riverbank... the dry well...”\n Sekibanki gasped for breath, as if each word was cutting her throat, “She set up a decoy and left two false paths... don't believe the footprints on the ground...”\n\n Wakasagihime suddenly looked up, her throat cracking. “Sekibanki!\n\n You—” Kagerou also struggled like a madman, the chains rattling loudly throughout the room. “You sold her out!”\n\n Sekibanki didn't retort, only resting her forehead on the back of the chair, her shoulders trembling violently.\n\n Sakuya quietly finished taking notes before putting away her pen. She looked at the three of them, not with smugness, but with a calm that suggested things had finally returned to normal.\n “Very good,” she said.\n\n She turned and walked to the door, where Meiling was already waiting. Meiling glanced at her, then looked into the house, her brows furrowed.\n “Did you get the information?”\n\n Sakuya nodded.\n “The old quarry, the dry well,” Meiling said after a two-second silence.\n\n “What about them?”\n\n Sakuya straightened her gloves, her voice clean and untainted.\n “Lock them up.”\n\n She glanced back at the three ordinary young men one last time.\n “I'll decide whether they deserve to live after I bring Seija Kijin back.”"
 scarlet.28.a:0 "Go drag Seija out."

 kyo_sakuya_best_maid_event.2.t:"The name in the crack"
kyo_sakuya_best_maid_event.2.d:"The one who collapsed first wasn't Kagerou, nor Wakasagihime. It was Sekibanki.\n\n Her head hung low, her breathing erratic, as if each breath pulled her apart.\n\n She was usually the most defiant, but now even lifting her head was difficult. Sakuya placed the teacup where Sekibanki could see but not touch it, her voice still steady. “I said I'd stop.” Sekibanki smiled, a smile more like a grimace.\n “You... you bunch of neatly dressed monsters...”\n\n Sakuya didn't reply, only gently embedding a throwing knife into the table.\n\n The blade trembled, emitting a faint ringing sound. On the other side, Wakasagihime was still coughing, and Kagerou's fingers were trembling so much she couldn't clench her fist. Sekibanki closed her eyes, finally cursing.\n\n “Damn it... she's under the old quarry.”\n Sakuya didn't move immediately, only asking for more details.\n\n “The entrance.”\n “The alleyway at the edge of the human world, where low rooftops and shadows intersect.”\n Sekibanki gasped, each word sounding like it was cutting her throat. “She set up a decoy, and left two false paths... Don't believe the footprints on the ground...” Wakasagihime suddenly looked up, her throat cracking.\n\n “Sekibanki!\n\n You—” Kagerou also struggled like a madman, the chains rattling loudly throughout the room. “You sold her out!”\n\n Sekibanki didn't retort, only resting her forehead on the back of the chair, her shoulders trembling violently.\n\n Sakuya quietly finished writing before putting away her pen. She looked at the three of them, not with smugness, but with a calm that felt like everything had finally returned to its rightful place.\n “Very good,” she said.\n\n She turned and walked to the door, where Meiling was already waiting. Meiling glanced at her, then looked back into the house, her brows furrowed.\n “Did you get the answer?”\n\n Sakuya nodded.\n “In the rain-soaked alleyways on the fringes of society, where low rooftops and shadows intertwine.”\n\n Meiling paused for two seconds before speaking.\n\n “What about them?” Sakuya straightened her gloves, her tone clean and untainted.\n “Lock them up.”\n\n She turned and gave the three ordinary young men one last look.\n “I'll decide whether they're worth living after I bring Seija Kijin back.”"
kyo_sakuya_best_maid_event.2.a:"Go drag Seija out."

scarlet.29.t:0 "Dragon in the Ruins"
scarlet.29.d:0 "Many people have asked Hong Meiling the same question.\n\n You're clearly a youkai, so why do you live like a human?\n\n Meiling rarely answers directly. She usually just smiles, hands over the tea, or gently changes the subject. But if you really want to trace back, you have to go back a long time—back to when she wasn't yet a gatekeeper of Scarlet Devil Mansion, but just a dragon that had lost its faith and its direction.\n\n Back then, she wasn't like this. She didn't understand what propriety or restraint meant. She only knew that she had once been worshipped by a village, raised by incense and prayers. People prayed to her for rain, for peace, for a bountiful harvest; she perched between the mountains and the clouds, and naturally assumed that was her place. Later, that village disappeared.\n\n It wasn't a slow decay; it was slaughtered overnight.\n\n Fire burned the roof beams, blood soaked the muddy ground, and the old, children, and livestock all lay dead together. When she rushed back, she only saw broken walls, charred wood, and the cracked memorial tablet on the altar.\n\n She stood in the ashes, motionless for a long time.\n\n No one prayed to her anymore.\n No one needed her anymore.\n\n She realized for the first time that even a dragon couldn't make it in time.\n\n After that, she left that place. Not for revenge, nor for rebuilding. She simply suddenly didn't know what she could live for. Her faith was gone, what she protected was gone, even her anger couldn't burn for long, and in the end, only a body that could still walk remained.\n\n She wandered around, her temper much worse than it is now, and more like Youkai. Anyone who approached, she would glare; anyone who looked at her too long, she would want to attack. Back then, she felt that since the world could crush an entire village, she had no reason to be polite to it.\n\n Until one day, a wandering Taoist priest picked her up from the ruins.\n\n The man's clothes were old, he carried a wooden sword, his shoes were covered in mud, but his face showed no fear. He looked at Meiling crouching on the broken wall, sighed first, and then spoke. “How long are you going to stay here?”\n Meiling ignored him.\n\n He sat down by himself, took out half a piece of dry rations from his bundle, and placed it on a stone. “The village is gone forever.”\n\n As soon as these words left his lips, Meiling immediately looked up, her eyes fierce as if she wanted to bite.\n\n “Shut up.” The Taoist priest just stared at her.\n\n “I didn't tell you to forget.” “I meant, if you keep squatting down, you'll just rot away with this pile of ashes.”\n\n Looking back, Meiling realized that it was probably from that moment that she couldn't get rid of this man.\n\n She followed the Taoist priest.\n Not because of trust. Simply because she had nowhere else to go."
scarlet.29.a:0 "Follow him and walk forward."

scarlet.30.t:0 "Dragon in the Ruins (Part 2)"
scarlet.30.d:0 "Meiling followed the Taoist priest to many places.\n\n They walked mountain paths, crossed rivers, entered towns, and traversed desolate wilderness. The Taoist priest would teach her to observe celestial phenomena, discern the earth's energy, and memorize water veins. He would also sit by the fire at night, speaking of things she initially couldn't understand.\n\n What was tranquility, what was non-action, what was simplicity, what was restraint?\n Meiling often frowned. “You humans just like to speak in roundabout ways.”\n\n The Taoist priest laughed when he heard this.\n “That's because you were too hasty.”\n “Are dragons always like this?” “How should I know?”\n\n Meiling said irritably, “I've never seen another one like it.”\n The Taoist priest laughed for a long time before slowly adding, “Then you should learn from humans first.”\n\n She remembered this sentence for a long time. In the days that followed, she saw many people with him. She saw families so poor they only had half a bowl of porridge left, yet they still saved the last bite for their youngest child; she saw caravans robbed by bandits, yet they repaired their wheels and continued their journey the next day; she also saw an old man near death, lying in the doorway basking in the sun, still having the strength to remind his grandson to feed the chickens.\n\n Humans are really weak. They will get sick, grow old, starve, be killed by a knife, and be burned to ashes in a fire.\n\n But they are strange. They can't hold onto anything for long, yet they always think about protecting something; they live short lives, yet they always make promises that seem endless.\n\n Meiling didn't understand at first, but gradually came to understand a little.\n\n Strength isn't necessarily about trampling others. Sometimes, strength is simply choosing not to destroy when you can; choosing to leave a way out for others when you can take.\n\n The Taoist priest didn't turn her into a saint. He simply made her understand that living doesn't necessarily mean being a ferocious beast. Following the rules isn't weakness, and restraint isn't submission. Truly powerful people aren't those who do whatever they want, but those who know what they can do and are still willing to stop.\n\n One day, Meiling asked him, “Why weren't you afraid of me back then?”\n\n The Taoist priest walked forward with his hands behind his back, without looking back.\n “Because there was fire in your eyes, not decay.”\n “As long as you're not decayed, you can still live a different life.”\n\n Many years later, Hong Meiling stood at the entrance of Scarlet Devil Mansion, dressed neatly, smiling at visitors, making way for them, and even marking lines for them. Others thought she was imitating someone.\n\n Perhaps they were right.\n\n She was indeed imitating. Learn how to be like a human being, guarding a door as a place; learn how to be like a human being, even after losing everything, still believing that some things are worth keeping."
scarlet.30.a:0 "She chose to live like a human being."



