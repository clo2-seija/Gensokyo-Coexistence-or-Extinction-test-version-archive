l_english:
 KYO_youkai_beast_battalion:0 "Beast Youkai Battalion"
 KYO_youkai_beast_battalion_desc:0 "A formation of sturdy, beast-shaped youkai. It moves much like cavalry—slightly slower, but able to absorb heavier casualties."
 KYO_blood_spawn_battalion:0 "Blood Thrall Battalion"
 KYO_blood_spawn_battalion_desc:0 "Blood-bound thralls who hold the line through sheer numbers and unnatural vitality. Their HP and Organization are exceptional, but their offensive power is negligible."
 KYO_fairy_battalion:0 "Fairy Swarm"
 KYO_fairy_battalion_desc:0 "Cheap, readily replenished light infantry. Fairies are weaker than regular infantry across the board, but require far less manpower, equipment, and supply."
 KYO_white_wolf_tengu_battlegroup:0 "White Wolf Tengu Battlegroup"
 KYO_white_wolf_tengu_battlegroup_desc:0 "Rigorous all-terrain special forces trained for mountain warfare, river crossings, amphibious assaults, and airborne operations. Their equipment and training are extremely costly."
 KYO_ghost_battalion:0 "Phantom Battlegroup"
 KYO_ghost_battalion_desc:0 "Fast infantry only loosely bound to physical bodies. They move swiftly and consume few supplies, but struggle to maintain formation and have low Organization."
 KYO_wind_magician_battalion:0 "Wind Magician Corps"
 KYO_wind_magician_battalion_desc:0 "Combat magicians who intercept aerial targets with wind blades and barriers, filling the role of anti-air artillery. They offer excellent Breakthrough but little HP, Organization, or Defense."
 KYO_fire_magician_battalion:0 "Fire Magician Corps"
 KYO_fire_magician_battalion_desc:0 "Combat magicians who replace conventional barrages with wide-area conflagrations. Their firepower and Breakthrough exceed ordinary artillery, but they are ill-suited to defense."
 KYO_lightning_magician_battalion:0 "Lightning Magician Corps"
 KYO_lightning_magician_battalion_desc:0 "Combat magicians who pierce armored targets with high-energy lightning, filling the role of anti-tank artillery. Their Attack and Breakthrough are formidable, but the units themselves are fragile."
 KYO_water_magician_battalion:0 "Water Magician Corps"
 KYO_water_magician_battalion_desc:0 "Combat magicians who replace rocket artillery with sustained high-pressure danmaku. Their Soft Attack and Breakthrough are ferocious, but their Defense and staying power are poor."
 KYO_tsukumogami_motorized_battalion:0 "Tsukumogami Motorized Battalion"
 KYO_tsukumogami_motorized_battalion_desc:0 "A motorized formation of vehicles, machinery, and their tsukumogami. It is fast and well defended, but its fear of destruction leaves it with very low HP."
 KYO_beast_spirit_mechanized_battalion:0 "Beast Spirit Mechanized Battalion"
 KYO_beast_spirit_mechanized_battalion_desc:0 "Beast spirits bound to mechanized vehicles for high-speed assaults. They outmatch conventional mechanized infantry in mobility and attack, but have lower Defense and HP."

 KYO_kappa_engineer_maintenance_company:0 "Kappa Engineer-Maintenance Company"
 KYO_kappa_engineer_maintenance_company_desc:0 "A kappa technical company combining engineering and maintenance duties. It builds fortifications, overcomes difficult terrain, improves reliability, and recovers equipment at the cost of additional support equipment, vehicles, and supply."
 KYO_oni_overseer_company:0 "Oni Overseer Company"
 KYO_oni_overseer_company_desc:0 "Oni overseers who maintain occupation order through overwhelming intimidation, providing far greater Suppression than ordinary military police."
 KYO_rabbit_medical_company:0 "Youkai Rabbit Medical Company"
 KYO_rabbit_medical_company_desc:0 "Youkai rabbit medics trained in youkai physiology and battlefield pharmacology. They save more wounded, preserve unit experience, and raise HP, but substantially increase Supply Use."
 KYO_crow_tengu_recon_company:0 "Crow Tengu Reconnaissance Company"
 KYO_crow_tengu_recon_company_desc:0 "Crow tengu combine high-speed aerial reconnaissance with battlefield communications, increasing both Reconnaissance and Initiative. Their training and equipment are extremely costly."
 KYO_youkai_fox_logistics_company:0 "Kitsune Logistics Company"
 KYO_youkai_fox_logistics_company_desc:0 "A logistics company staffed by kitsune, reducing the supply and fuel consumption of its parent formation."

 KYO_tsukumogami_armor_module:0 "Tsukumogami Armor"
 KYO_tsukumogami_armor_module_short:0 "Tsukumogami Armor"
 KYO_tsukumogami_armor_module_desc:0 "Links the armor, transmission, hull, and vehicle spirit. The tank actively protects itself and cooperates with its crew, improving Armor, Defense, Breakthrough, Speed, and Reliability at the cost of higher production and fuel consumption."

 KYO_tech_youkai_beast:0 "Organize Beast Youkai"
 KYO_tech_youkai_beast_desc:0 "Enables §YBeast Youkai Battalions§! in division templates."
 KYO_tech_blood_spawn:0 "Organize Blood Thralls"
 KYO_tech_blood_spawn_desc:0 "Enables §YBlood Thrall Battalions§! in division templates."
 KYO_tech_fairy:0 "Mobilize Fairies"
 KYO_tech_fairy_desc:0 "Enables §YFairy Swarms§! in division templates."
 KYO_tech_white_wolf_tengu:0 "White Wolf Tengu Combat Group"
 KYO_tech_white_wolf_tengu_desc:0 "Allowed to form White Wolf Tengu All-Terrain Special Forces."
 KYO_tech_ghost:0 "Form Ghosts"
 KYO_tech_ghost_desc:0 "Allowed to use Ghost Combat Groups in Army formations."
 KYO_tech_magician_units:0 "Combat Mage System"
 KYO_tech_magician_units_desc:0 "Allowed to form Wind, Fire, Lightning, and Water Mage Firepower Units."
 KYO_tech_tsukumogami_units:0 "Tsukumogami Mobility"
 KYO_tech_tsukumogami_units_desc:0 "Allowed to use Tsukumogami Mobile Units in Army formations."
 KYO_tech_beast_spirit:0 "Beast Spirit Mechanization"
 KYO_tech_beast_spirit_desc:0 "Beast Spirit Mobile Groups are permitted in Army formations."
 KYO_tech_kappa_support:0 "Kappa Battlefield Technical Team"
 KYO_tech_kappa_support_desc:0 "Kappa Engineer Repair Company is permitted."
 KYO_tech_oni_support:0 "Oni Overseer Doctrine"
 KYO_tech_oni_support_desc:0 "Enables §YOni Overseer Companies§!."
 KYO_tech_rabbit_support:0 "Youkai Rabbit Battlefield Medicine"
 KYO_tech_rabbit_support_desc:0 "Enables §YYoukai Rabbit Medical Companies§!."
 KYO_tech_crow_tengu_support:0 "Crow Tengu Battlefield Intelligence Network"
 KYO_tech_crow_tengu_support_desc:0 "Crow Tengu Reconnaissance Group is permitted."
 KYO_tech_fox_logistics:0 "Kitsune Logistics System"
 KYO_tech_fox_logistics_desc:0 "Enables §YKitsune Logistics Companies§!."
 KYO_tech_tsukumogami_armor:0 "Tsukumogami armor"
 KYO_tech_tsukumogami_armor_desc:0 "Allows installation of tsukumogami armor in a special module slot in the tank designer."
