l_english:
 KYO_seija_dynamic_military_idea: "The lower spirit is overcome by the upper spirit"
 KYO_seija_dynamic_military_idea_desc: "This army wasn't born from military academies, aristocratic private armies, or the halls of grand mansions. It came from muddy ground, abandoned houses, mountain paths, and forgotten corners. Many people's hands trembled when they first picked up a weapon; their boots didn't even fit properly when they first lined up; they considered turning and running away when they first heard the sound of cannons.\n\n But they had no way out. Those who are trampled underfoot will only be trampled deeper if they don't learn to stand up. Every night raid, every ambush, every march through hunger honed their scattered anger into real fighting power. They may not have been the best trained, nor the most fully equipped, but they understood better than anyone else: this wasn't a fight for glory, but to make those in power hear the footsteps of the lower classes for the first time.\n\n The so-called underdog triumph is not a fairy tale of the weak becoming the strong overnight. It is about moving forward even after the wound has scabbed over, rebuilding the team after defeat, and pushing the flag forward even when you know there are gun barrels ahead."

 KYO_seija_dynamic_political_idea: "The trend of thinking of lowering and conquering higher"
 KYO_seija_dynamic_political_idea_desc: "In the past, politics was the language of the powerful. Sages, lords, temples, mountain chiefs, and nobles within the red walls set the rules and demanded that those below accept them. The weak, the poor, and the nameless wanderers could only bow their heads before the notices, endure the levies and rations, and swallow their discontent.\n\n Now, Seija Kijin has unearthed that long-suppressed question: Why must we obey? Why must those born lowly, weak, and without support be nothing more than dust on someone else's chessboard? This thought, like sparks falling into hay, spread from street corners, workshops, makeshift camps, and the back doors of taverns. People began to discuss, argue, and organize, learning to articulate their pain as demands and their anger as a roadmap.\n\n But awakening is not easy. A new order will not automatically descend with a slogan, nor will the old forces willingly yield after a protest. The politics of overthrowing superiors is about regrouping after repeated repressions; it's about pushing the “impossible” into the “must be” amidst betrayal, hunger, fear, and internal division."

 KYO_seija_dynamic_industrial_idea: "Gekokujou Economics"
 KYO_seija_dynamic_industrial_idea_desc: "Abandoned warehouses became workshops, and salvaged machinery was fitted together again. When parts ran short, workers searched battlefield wreckage for usable material. With fuel scarce, some furnaces had to burn reclaimed wood; coal still had to be prioritized wherever nothing else would serve. Every new production line drew on supplies needed elsewhere.\n\nProduction and distribution would first sustain workers' livelihoods, the needs of the front, and the capacity to keep building. Workshops could no longer surrender everything they made to their former owners. Nor could they serve only their own locality and leave hungry settlements out of the accounts. How much went to food, pay, and expanded production required continual calculation by the organizations responsible.\n\nThe workshops remained cold, the tools worn, and tired workers waited for the next shift to relieve them. One missing delivery of raw materials could stop the machines. A mistake in distribution could break a promise. Gekokujou's economy had to function amid these shortages: keeping tomorrow's materials available for the equipment repaired today, and ensuring that those who built it received enough to live on."
