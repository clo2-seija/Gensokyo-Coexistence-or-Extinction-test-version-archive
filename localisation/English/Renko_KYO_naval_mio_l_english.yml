 Renko_KYO_murasa_ghost_shipyards_desc:0 "Under Minamitsu Murasa, this shipyard applies the experience of sailing the Palanquin Ship to carriers and their escorts. The ghost captain demands a quiet approach followed by a sudden carrier strike. As for those rumors of sinking ships, the yard promises that this time only the enemy need fear the voyage."
