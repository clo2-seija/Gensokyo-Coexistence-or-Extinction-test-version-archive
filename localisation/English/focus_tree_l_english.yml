 KYO_boundary_medicine_exchange:0 "The debate with Eirin"
 KYO_boundary_medicine_exchange_desc:0 "Eirin's deductions rarely contained calculation errors; the real problem often lay in what she chose to calculate. She could accurately predict casualties, resources, and the probability of success, but she easily mistook unquantifiable emotions for errors, and when her theories ran into trouble, she used more complex formulas to protect her initial assumptions.\n\n Yukari didn't intend to overwhelm the Sage of the Moon with her eloquence, but instead invited Ran to join the debate. Ran also believed in rationality and efficiency, but understood one thing better than Eirin: fear, trust, grief, and dignity were not noises to be eliminated, but real variables that no complete calculation could overlook.\n\n Ran meticulously examined Eirin's premises, while Eirin, in turn, questioned the Yakumo family's barrier and governance. The debate continued late into the night, with no one achieving a complete victory, but the previously closed theory finally showed room for revision. The most valuable aspect of rationality is never proving oneself always right, but being willing to recalculate after discovering omissions."

 KYO_boundary_memorial_exchange:0 "A Reminiscing with Yuyuko"
 KYO_boundary_memorial_exchange_desc:0 "Yukari knew Yuyuko long before she was human. Back then, the Saigyouji girl would discuss poetry under the cherry blossoms and use the excuse of flower viewing to devour most of the table's sweets. Death changed her body, memories, and duties, but it didn't make Yukari see the spirit before her as someone else.\n\n Yuyuko once asked with a smile if she had become a stranger after death. Yukari simply closed her folding fan and replied that apart from her appetite, not much had changed. Those unspoken memories were hidden in the joke, without needing to summon a spirit or dig up the past beneath Saigyou Ayakashi.\n\n This time, Yukari also brought Chen. The kitten chased the ghost butterfly all over the garden, and then engaged in a shameless struggle with Yuyuko for the last piece of sweet. All afternoon, they didn't need to play the roles of sages, rulers of Netherworld, or shikigami; they simply laughed heartily over a few trivial matters.\n\n For those who have lived too long, being able to get along as before is itself a rare reunion."

 KYO_three_paths_joint_council:0 "A Three-Way Tea Party"
 KYO_three_paths_joint_council_desc:0 "There was no recorder, no pre-arranged agenda, and no treaties awaiting signing. Yukari simply opened the gap, invited Eirin and Yuyuko to the same low table, and had Ran refill their tea and Youmu bring out snacks.\n\n The conversation initially consisted of insignificant trifles. Yuyuko complained that the tea Eirin had prepared was too bitter, while Eirin pointed out that the snacks in front of Yuyuko were already excessive; Yukari fanned the flames until the two temporarily forgot the solemnity they had originally intended to maintain.\n\n They then discussed Lunar Capital, death, healing, and the impending war. Eirin still couldn't accept Yuyuko's calm about the end, Yuyuko couldn't agree with Eirin's persistent desire to salvage the situation, and Yukari wasn't prepared to accept anyone's answer as the sole truth of Gensokyo.\n\n This tea party didn't eliminate their differences, but it proved that three paths can share a table. True unity isn't about everyone saying the same thing, but about being willing to sit down and continue talking even when you can't understand each other, and trusting that the other person won't deny their existence because of the argument."









