  KYO_the_reform_meeting:"Youkai Military Reorganization"
 KYO_the_reform_meeting_desc:"Since ancient times, Youkai, with their supernatural abilities, superhuman strength, and experience accumulated over countless years, have been able to easily destroy villages and towns. A single Kappa can sink a wooden boat; a Tengu can traverse hundreds of miles of mountains and rivers to deliver intelligence; even the weakest fairy can instill fear in ordinary people.\n\n However, that was ultimately an era of individual dominance. In today's Outside World, humanity has propelled warfare to new heights with steel, gunpowder, industry, and discipline. Even the most powerful Youkai cannot single-handedly shake a well-trained, coordinated modern army.\n\n If Gensokyo's army remains loose, disorganized, and fighting in isolation, it will only face being crushed by the tide of war. To survive in this era, Gensokyo must abandon its old, scattered system and reunite the diverse groups and factions with their varied customs into a regular army capable of directly confronting the Outside World. This is not merely a reorganization of the military system, but a complete transformation from organization to mindset. Only in this way can Gensokyo truly possess the qualifications to confront this era."

 KYO_army_mercenary:"Incorporating Youkai Mercenaries"
 KYO_army_mercenary_desc:"Building a complete military system from scratch, integrating all Youkai into the same command chain, is not impossible, but with war looming, it's a long and arduous road.\n\n In contrast, directly incorporating existing paramilitary organizations, local armed forces, and mercenary groups, absorbing their mature combat experience and existing structures, is clearly more realistic. While these forces may have their own agendas and be difficult to completely tame, they have experienced countless bloody battles, know how to survive, and know how to kill the enemy.\n\n By exchanging resources, supplies, and status for their loyalty, Gensokyo's army can be formed in the shortest time. They may forever retain the rough edge of mercenaries, but right now, we need blades ready to be drawn, not swords still waiting to be forged in the furnace."

 KYO_army_reform:"Establishing a Brand New Youkai Regular Army Command System"
 KYO_army_reform_desc:"Rebuilding the army system from scratch is undoubtedly difficult, but it is the only path to lay the foundation for Gensokyo's future. Although the Youkai people differ in ability, personality, and background, as long as a rigorous and efficient system is introduced, training and discipline will be sufficient to solidify this chaotic force into a true military might.\n\n This path means adjustment, growing pains, repeated training, and a complete overhaul of old habits. But once this new army takes shape, Gensokyo will no longer need to rely solely on fear to maintain its power, but will be able to forge an iron torrent through order, coordination, and spiritual power.\n\n That will be a true army belonging to Gensokyo, capable of confronting any enemy head-on, on any battlefield."

 KYO_army_for_future:"For the Army of the Future"
 KYO_army_for_future_desc:"Gensokyo's battlefield is changing. Gunfire, steel, explosions, and mechanized forces are no longer just distant visions of the Outside World, but a reality we must face.\n\n To remain invincible in future wars, armies must continue to refine their systems, address weaknesses, and adopt new tactics to enable them to counter the most lethal weapons of this era. The army of the future is not merely a tool for charging, but the very foundation upon which Gensokyo survives.\n\n It must be able to withstand tanks and artillery, and maintain order and lethality in the most brutal wars of attrition. Only then can Gensokyo speak of the future."

 KYO_army_bug_youkai:"Recruiting Insect-Type Youkai"
 KYO_army_bug_youkai_desc:"In the ancient times before humans dominated the land, the true rulers were not mammals, but insects with wings that blotted out the sky and shells that reflected light. Although their size has shrunk with the passage of time, the cruelty, resilience, and collectivity of that ancient era remain.\n\n The insect-type youkai excel at not fighting alone, but rather surging onto the battlefield like a tidal wave, tearing through enemy lines with sheer numbers, endurance, and overwhelming force. Their carapaces are like natural armor, and the sound of their wings is like the prelude to death.\n\n With proper organization, these insect youkai can reclaim their place in modern warfare, crushing the enemy with sheer numbers and tenacity."

 KYO_army_bird_youkai:"Recruiting bird-type youkai"
 KYO_army_bird_youkai_desc:"The shadows of the sky sweep in from afar—not clouds, but a flock of youkai hunting high in the sky. Bird youkai are Gensokyo's most natural aerial hunters, possessing wings that move at wind speed and sharp eyes that survey the battlefield.\n\n They may not be known for brute force, but their high-speed incursions, piercing screams, and dive attacks are enough to tear apart enemy lines and break their morale in an instant. In modern warfare, they are not only aerial reconnaissance agents but also the most lethal aerial harassment force.\n\n As long as they remain hovering in the sky, the enemy will never truly feel at ease."

 KYO_army_oni_youkai:"Hear the Oni Out"
 KYO_army_oni_youkai_desc:"The oni were once among the most renowned and feared peoples of the youkai world. Even after their decline, they retain deep experience in direct confrontation with humanity.\n\n To the oni, war is simple: overwhelm the foe with superior force and make clear who rules the contest. Their doctrine prizes shock, frontal pressure, and unbreakable morale. Order may exist, but it must be forged through strength rather than fine words."

 KYO_army_tengu_youkai:"Listen to the tengu's opinions"
 KYO_army_tengu_youkai_desc:"The tengu are one of the earliest groups in Gensokyo to develop class, discipline, and organization to their fullest extent. They excel at reconnaissance, command, and intelligence coordination, and were among the first to realize that the systems, technologies, and tactics of the Outside World cannot be simply ignored.\n\n For the tengu, war is not simply about who is stronger, but about who can acquire information faster, mobilize resources, minimize errors, and deliver all their power to the most vulnerable point at the right time.\n\n If Gensokyo adopts the tengu's experience, its army will place greater emphasis on organization, coordination, and modern management, embarking on a path that values both systems and tactics."

 KYO_army_strong_youkai:"The Majesty of the Great Youkai"
 KYO_army_strong_youkai_desc:"They are beings even their own kind dare not underestimate. The Great Youkai possess power far exceeding reason and experience accumulated over countless years, having experienced countless battles and witnessed the changing of eras.\n\n They are capable of changing the course of a battle single-handedly, but precisely because of this, they are often difficult to bind by any system. To persuade these aloof and powerful beings to willingly integrate into the military system is itself a trial.\n\n If successful, Gensokyo's military system will not merely be patched up, but will be elevated to a new level. Command, morale, firepower, and tactics will all undergo a qualitative change due to the addition of the Great Youkai."

 KYO_tengu_intelligence:"Integrating Tengu's Newspaper"
 KYO_tengu_intelligence_desc:"Tengu possesses Gensokyo's fastest wings and sharpest eyes. Their intelligence network spans mountains, villages, and cities. Unfortunately, for a long time, this network has been fragmented among different families, newspapers, and factions, overlapping and competing with each other, thus wasting too much speed.\n\n To truly utilize this power in the war, a complete restructuring is necessary. All intelligence channels should be integrated into a unified central hub, and any news regarding frontline movements, enemy deployments, and changes in the Outside World must reach command in the shortest possible time.\n\n When this system is operational, Tengu's newspapers will no longer be merely places to write news, but will become intelligence agencies that truly determine the course of the war."

 KYO_tengu_place:"Authorizing Tengu to have agents independent of the central government"
 KYO_tengu_place_desc:"After the intelligence network is integrated, Tengu's value will no longer be limited to delivering messages. They will become hunters in the shadows, infiltrators, and blades outside the battlefield.\n\n However, even the most sophisticated central intelligence system cannot quickly respond to all unexpected changes. To make intelligence forces more flexible, Tengu could be granted an independently operating intelligence system, giving it greater mobility and faster operational capabilities.\n\n Such an arrangement would greatly improve efficiency, but it also means that the central government must bear some of the risks of delegating power. This is a deal made with the shadows, and whether or not this power can be controlled will determine the outcome beyond the war itself."

 KYO_more_Aya_newspaper:"Official Wartime Propaganda"
 KYO_more_Aya_newspaper_desc:"On the battlefield, bullets and artillery may capture positions, but what truly shakes morale is often a piece of paper. Propaganda, news, battle reports, and slogans can inspire one side one night and make the enemy doubt their chances of returning home alive the next.\n\n Now, Gensokyo needs no longer just scattered rumors and exaggerated street tabloids, but a propaganda publication truly serving the war effort. Through newspaper vendors, intelligence agents, garrison troops, and airdrops, this wartime report will be delivered to every corner.\n\n It will chronicle victory, amplify the enemy's fear, unify the narrative in the rear, and instill the will of war into the heart of everyone who reads it."

 KYO_air_kappa_gear:"Flying Kappa"
 KYO_air_kappa_gear_desc:"In modern warfare, air superiority often translates to initiative on the battlefield. The kappa, Gensokyo's most mechanically enthusiastic artisan group, possess an almost obsessive interest in the aircraft, engines, and airframes of the Outside World.\n\n They don't merely imitate; they completely disassemble captured aircraft and reassemble them according to Youkai's design principles. Power cores, lift structures, weapon attachments, and spiritual energy adaptation devices can all be twisted into forms never before conceived by humankind.\n\n When Gensokyo's aircraft truly take to the skies, the sky will no longer be merely enemy territory, but will become the place where Youkai redefines war."

 KYO_air_youkai_pilot:"Youkai pilot"
 KYO_air_youkai_pilot_desc:"The birth of aircraft is only the first step; what truly determines whether they can become weapons on the battlefield is the pilots who can master them. Although many youkai are born with the ability to fly, spiritual flight and piloting high-speed fighter jets are ultimately not the same thing.\n\n Altitude, speed, weapon handling, formation coordination, and judgment under high pressure are all skills that must be relearned. Therefore, Gensokyo needs a group of true pilots. They must undergo high-altitude maneuvering, simulated air combat, and extreme condition training until they can remain calm even in the most dangerous airspace.\n\n When these pilots mature, the sky will truly become Gensokyo's battlefield, no longer just a backdrop above the battlefield."

 KYO_air_youkai_flight_school:"Youkai Flight School"
 KYO_air_youkai_flight_school_desc:"While skilled pilots are invaluable, relying solely on a few exceptionally gifted individuals will ultimately jeopardize air superiority. For air power to become a truly sustainable branch of the military, a comprehensive training system is essential.\n\n The significance of the flight school lies in transforming individual talent into institutionalized training capabilities. Here, trainees will learn how to fly in storms, at night, during thunderstorms, and in complex terrain, and will also master formation warfare, aircraft maintenance, and battlefield adaptability.\n\n Once the flight school is established, Gensokyo's air force will no longer be just a small elite force, but will have a continuous stream of new blood."

 KYO_air_youkai_paratrooper:"Youkai Low-altitude pilot"
 KYO_air_youkai_paratrooper_desc:"Human paratroopers rely on aircraft, wind direction, and weather, but Youkai are born to operate outside these rules. Low-altitude flight is not their limit, but rather an instinctive tactic.\n\n They can skim close to the ground, bypassing defenses, evading radar and fire, cutting off supplies, raiding strongholds, capturing targets in a very short time, and then disappearing again into the night and mountain fog.\n\n These low-altitude pilots are not paratroopers in the traditional sense, but a truly unconstrained surprise attack force. Their purpose is to ensure that the enemy can never predict where danger will strike."

 KYO_army_general_plan:"Officer Training Program"
 KYO_army_general_plan_desc:"Victory on the battlefield depends not only on the bravery of soldiers but also on the judgment of commanders. Even the sharpest blade becomes a blunt weapon if wielded by clumsy hands.\n\n Many generals in Gensokyo possess astonishing strength and rich combat experience, but may not be familiar with the fire coordination, logistical deployment, and intelligence integration required by modern warfare. Therefore, the goal of the officer training program is to forge these strong individuals from mere soldiers into true commanders.\n\n They will learn how to command coordinated operations, how to utilize new weapons, and how to enable troops to form effective combat power in the shortest possible time. Once officers mature, the entire army will change."

 KYO_army_general_plan_2:"General's Tactical Enhancement"
 KYO_army_general_plan_2_desc:"An army that relies solely on brute force without tactics is like a toothless beast, ultimately defeated by a more composed opponent. Modern warfare demands more than just bravery; it requires anticipation, strategic planning, feints, breakthroughs, and coordination.\n\n Generals must relearn how to understand the overall battlefield situation, how to deploy forces in complex terrain and with asymmetric intelligence, and how to create the greatest opening with minimal losses.\n\n Only by truly instilling this tactical thinking into the officer corps will Gensokyo's army not merely be a collection of strongmen, but a true army that knows how to win."

 KYO_army_general_plan_3:"The final training course"
 KYO_army_general_plan_3_desc:"The blade has been honed, the tactics have been instilled, but the soldier's true final lesson is always willpower. The final training course is no longer simply physical fitness or wargaming, but pushing officers and elite troops into extreme pressure, teaching them to maintain order, judgment, and determination in the face of fear, chaos, casualties, and feelings of defeat.\n\n Only by going through this step can they become more than just qualified soldiers; they become true war machines capable of remaining calm in dire situations.\n\n Weapons may break, lines may crumble, but as long as the will remains unbroken, this army will not be truly defeated."

 KYO_army_general_training:"Officer Environmental Training"
 KYO_army_general_training_desc:"Gensokyo's land isn't cruel, but that doesn't mean future battlefields will be so mild. Deserts, snowfields, swamps, coastlines, and mountains are all possible environments in the Outside World war.\n\n If officers are only familiar with Gensokyo's roads, rivers, and mountain winds, their judgment in unfamiliar territory will be dulled. The purpose of environmental training is to force officers to leave familiar ground and learn to command, march, camp, and maintain troop combat effectiveness under extreme conditions.\n\n Only those who can endure this training are truly qualified to command an army on any battlefield."

 KYO_army_new_tech:"Learning New Technologies"
 KYO_army_new_tech_desc:"For a long time, Gensokyo has survived by relying on spiritual power, magic, and ancient experience. However, the war with the Outside World has proven that modern technology itself is a force capable of altering life and death.\n\n If we continue to indulge in the complacency of the old era, all that awaits us is to be utterly crushed by machine guns, tanks, and electromagnetic systems. We must learn to dismantle, learn, and absorb the new technologies of the Outside World, gradually transforming these unfamiliar and dangerous things into Gensokyo's own power.\n\n Technology will no longer be merely a tool for humanity, but will become a necessary means for our continued survival."

 KYO_army_new_tank:"Tank Reverse Engineering"
 KYO_army_new_tank_desc:"Tanks are one of the most imposing symbols of human warfare. Their heavy armor, roaring tracks, and relentless firepower make a mere charge relying on flesh and blood and courage seem foolish and fragile.\n\n Since direct confrontation only incurs heavy costs, the best approach is to capture, dismantle, understand, and then transform all of this into one's own power. Every gear, every track, every layer of armor, and every power system should be thoroughly studied.\n\n One day, these steel beasts will no longer be merely weapons of the enemy, but will become Gensokyo's own claws of war."

 KYO_army_theory:"Understanding Human Tactics"
 KYO_army_theory_desc:"The humans of the Outside World are not simply prey reliant on steel and gunpowder; they possess systematic tactics, robust communication, well-defined defensive lines, and sophisticated command logic. If Gensokyo continues to use outdated intuition and impulsiveness to deal with modern warfare, the result will only be a crushing defeat.\n\n To defeat the enemy, one must first understand them. Study their doctrines, dissect their marching methods, master their fire coordination and deployment patterns, and turn everything into exploitable weaknesses.\n\n Once we understand the enemy's thinking, we can turn every enemy action into our own trap."

 KYO_army_support_stuff:"Battlefield Support Equipment"
 KYO_army_support_stuff_desc:"An army cannot fight a long war on guns and artillery alone. Gensokyo must do more than copy equipment from the Outside World; it needs an entire support system adapted to the abilities of youkai.\n\n Flying youkai require equipment suited to aerial drops and assaults. Those adept at concealment need portable disruption devices. Individuals with formidable youkai power need specialized weapons that complement their abilities. Medical care, supply, spiritual recovery, and rapid maintenance are every bit as important.\n\n Once that support system is truly in place, Gensokyo's armies will possess more than claws: they will have a second skeleton capable of driving those claws through the enemy line again and again."

 KYO_army_tech_used_by_youkai:"Mastering Human Technology"
 KYO_army_tech_used_by_youkai_desc:"In just a few decades, humanity has advanced technology from steam to steel, gunpowder, radar, airplanes, and armor. Even the Youkai, whose lifespan is measured in centuries, must admit that this change is enough to suffocate the entire world.\n\n Imitating human technology is not enough; what is truly important is understanding, mastering, and completely transforming it into a new system that can be combined with the power of the Youkai.\n\n When antennas, armor, engines, and spiritual circuits are connected to the same logic, what will be born will no longer be human weapons, but war machines belonging to Gensokyo themselves."

 KYO_we_can_conutrol_ourself:"We Can Control Ourselves"
 KYO_we_can_conutrol_ourself_desc:"Discipline, training, and technology are not only for making the army stronger, but also for teaching the Youkai to restrain their most primal animalistic instincts. If even they cannot control themselves, even the greatest power will only become an uncontrolled calamity.\n\n Only by learning restraint, obedience, cooperation, and judgment can Gensokyo's army truly advance.\n\n We are no longer merely monsters relying on instinct to kill, but a force capable of mastering themselves and of mastering war."

