  KYO_econmi_reform:"Economic Reboot"
 KYO_econmi_reform_desc:"Gensokyo's industrial base is alarmingly weak—blacksmith shops are scattered, workshops are isolated, and production levels remain extremely primitive. Such a fragile economy is simply insufficient to support the impending protracted war. We must launch a comprehensive economic overhaul: consolidate scattered resources, expand workshops, introduce Outside World technology, and mobilize the entire Gensokyo workforce for production. War requires a continuous supply of weapons, ammunition, equipment, and food, not a group of artisans who only make fireworks during festivals. This is not just about rebuilding the economy; it's the first step in igniting the entire industrial engine. When the roar of steel echoes through Gensokyo, this land will never be the same again."

 KYO_metro_system:"Metro Project"
 KYO_metro_system_desc:"In the Outside World, railways are the arteries of war; in Gensokyo, we will replace them with underground tunnels and spirit-powered trains, creating a metro network for this land. These metro lines will traverse various regions, from mountains and lakesides to bamboo forests and underground, each tunnel ensuring that weapons, food, and reinforcements reach the front lines in the shortest possible time. The dark underground environment will evade detection, and special spirit-powered tracks will ensure continued operation even during barrier fluctuations. When the roar of underground trains echoes throughout Gensokyo, logistics will no longer be a weakness, but an overwhelming advantage."

 kYO_upgrade_digging_tool:"Improving Excavation Equipment"
 kYO_upgrade_digging_tool_desc:"The metro project has been established, but relying solely on manual labor and spirit power is insufficient to construct large-scale underground routes in a short time. To make the transportation network operational before the full-scale outbreak of war, excavation efficiency must first be improved. Kappa will utilize their mechanical expertise to create new drilling rigs suitable for the confined underground environment; the brute force-wielding Youkai will penetrate the hardest rock layers; and forces familiar with the underground environment will guide construction teams to avoid the most dangerous faults and cavities. Once the new excavation equipment is fully operational, the underground transportation network will extend to every corner of Gensokyo at an unprecedented speed, ensuring our troops and supplies always outpace the enemy's reaction."

 KYO_build_up_station:"Establishment of New Stations"
 KYO_build_up_station_desc:"Trains winding their way underground cannot exist solely on tracks. For this transportation system to truly function, stable and efficient station hubs must be established at key points. These new stations will become the central hubs for the transfer of supplies, troops, and intelligence. Kappa will install transportation devices combining spiritual power and machinery within the stations to ensure trains can enter and exit rapidly; intelligence personnel and station staff will also establish dedicated relay points to ensure news, military orders, and dispatch commands spread along the lines in the shortest possible time. Externally, they are strategic nodes; internally, they are the backbone that truly unites Gensokyo. When the first train, laden with soldiers and supplies, departs the station, it signifies that Gensokyo's logistical network has entered a new era."

 KYO_station_from_another_world:"A Station from Another World"
 KYO_station_from_another_world_desc:"In a newly built underground station, a train that shouldn't exist slowly pulls in. When the doors open, there is no driver, no ordinary passengers, only two women dressed in completely different attire from the modern world. They identify themselves as Renko Usami and Maribel Hearn, claiming to come from another world and possessing an extraordinary understanding of boundaries, technology, and history. For most of Gensokyo's residents, such origins are both strange and dangerous. They refuse to elaborate on their identities, leaving only a vague and unsettling explanation—time and space are, after all, unreliable illusions. Regardless of the truth, these two visitors from another world have quietly entered Gensokyo's game."

 KYO_importing_new_system:"Introducing a New System"
 KYO_importing_new_system_desc:"While the initially planned underground transportation network was sufficient to meet basic transport needs, its limitations began to surface as the battle lines expanded and logistical pressures increased. The new era demands a new system. By introducing more efficient signal control, resource allocation, and automated dispatching schemes, we can deliver troops, weapons, and supplies to wherever they are needed in the shortest possible time. This is not merely a simple infrastructure upgrade, but a complete modernization of Gensokyo's transportation arteries. Once the new system is fully operational, any enemy relying on traditional logistical lines will appear slow and cumbersome in our presence."

 KYO_underground_treasure:"Underground Treasures"
 KYO_underground_treasure_desc:"Deep beneath Gensokyo lie dormant mineral veins and rare resources, untapped since ancient times. Those shimmering metallic ores and the strange crystals, rumored to exist only in tales of the supernatural, are like treasures slumbering for millennia, quietly awaiting their awakening. Today, the demands of war and industry compel us to turn our attention to this unexplored territory. The darkness and dangers beneath the earth are not the real challenge; the true challenge lies in establishing a stable extraction and transportation system within this complex environment. Once these resources are successfully controlled, Gensokyo will no longer be reliant on the limited output of the surface, but will be able to support future construction and warfare with the wealth beneath the earth."

 KYO_kappa_development_plan:"Kappa's Industrial Plan"
 KYO_kappa_development_plan_desc:"Kappa is renowned for its unparalleled mechanical technology and engineering prowess. This time, they have presented not a solitary invention, but a grand blueprint capable of reshaping Gensokyo's industrial structure. This plan encompasses basic factory construction, resource processing, military production, transportation, and infrastructure, integrating everything into a system for sustainable expansion. It is not a workshop, a railway, or a batch of firearms, but a complete, interconnected, and mutually supportive industrial framework. Once approved, this will be a milestone for Gensokyo's formal industrialization, truly connecting rear production with frontline needs for the first time."

 KYO_farming_med:"Crop Growth Agent"
 KYO_farming_med_desc:"Even Youkai cannot wage a protracted war without food. Gensokyo's farmland has always been limited in scale and yields have consistently been insufficient, with food shortages gradually becoming an unavoidable threat on the front lines.  Now, researchers and pharmaceutical engineers have proposed a new growth agent solution. It can significantly shorten crop maturity cycles, allowing rice, wheat, and potatoes to be harvested in a shorter time. The mechanism of action may be complex and difficult to understand, but the experimental results are sufficient to illustrate everything: the fields will produce repeatedly at a previously unimaginable speed.  With this technology, granaries will no longer be empty, and the food supply for a protracted war will finally be truly guaranteed."

 KYO_yuka_arrive:"Response from the Flower Field Master"
 KYO_yuka_arrive_desc:"Recent large-scale mining and agricultural experiments have unquestionably strengthened the war effort. New seams of ore have been opened, treated fields grow at an unnatural pace, and factories and stations continue to expand.\n\n At the other end of Gensokyo, however, someone has taken grave exception to these changes. Yuuka Kazami, the flower master, will not tolerate unchecked excavation, chemical residue, and industrial smoke stripping nature—and her flower fields—of their colour and fragrance.\n\n Her arrival is a reminder that industrialisation carries a price. If we continue along this path, we must decide whether Gensokyo's future belongs entirely to cold steel and smoke, or whether flowers and living soil will retain a place within it."

 KYO_underground_factory:"Underground Industrial Plan"
 KYO_underground_factory_desc:"Former Hell has long been the dwelling place of the forgotten, vengeful spirits, and subterranean youkai. To continue viewing this area merely as a place of exile would be a waste. The thermal energy, mineral resources, and vast space it possesses are ideal conditions for supporting heavy industry. The high-temperature environment provides a natural advantage for smelting, while the vast underground space and labor force are sufficient to support the establishment of large-scale factory clusters. When chimneys pierce the darkness underground, and factories and mines rise along the abyss, Former Hell will no longer be just a desolate place, but will become the true industrial heartland of Gensokyo."

 KYO_plan_for_nuke:"Underground Core Plan"
 KYO_plan_for_nuke_desc:"Deep within Former Hell lies an extremely rare and dangerous resource—uranium ore. For a long time, it has been regarded as an ominous stone bringing disaster, but in the eyes of war and industry, it may be a power capable of rewriting the rules.  If these resources can be combined with Gensokyo's existing technology, spiritual system, and underground research capabilities, it is possible to create an ultimate weapon far surpassing contemporary conventional weapons. This path is destined to be fraught with danger and controversy, but it also signifies an unprecedented strategic deterrent.  When the atomic fire is ignited deep underground, it will no longer be merely an industrial leap, but a harbinger of the end of war."

 KYO_plan_for_hotspring:"Underground Hot Spring Project"
 KYO_plan_for_hotspring_desc:"Deep within Former Hell lies not only curses, vengeful spirits, and ores, but also extremely pure and stable geothermal energy. If guided, these springs and heat flows can be transformed into hot springs, energy sources, and therapeutic facilities. Rather than letting the underground remain forever synonymous with darkness and exile, it's better to transform it into a completely new living area. Youkai and residents can recuperate, live, heal their wounds, and even re-establish their connection with the surface, turning this land from a symbol of fear into a place of prosperity and tranquility. When the steam from geothermal energy replaces the dust of the mines, Former Hell will return to Gensokyo in a new guise."

 KYO_Satori_thank_you:"Thanks from Komeiji"
 KYO_Satori_thank_you_desc:"Whether through the atomic fire kindled underground or the hot springs opened to the surface, Former Hell's fate has been rewritten. The depths, forgotten for years and regarded only as an abyss, have at last been offered a different future.\n\n Satori Komeiji has expressed her gratitude for this development. To her and the underground youkai, it means more than additional resources, factories, or facilities: those cast into the shadows have finally been included in Gensokyo's future.\n\n In return, the underground powers will support our cause more actively. From this day forward, the depths will no longer be an abyss to exploit, but a vital force advancing alongside the surface."

 KYO_kappa_advance_plan:"Kappa Industrial Plan Upgrade"
 KYO_kappa_advance_plan_desc:"A grand industrial blueprint should not remain at the foundational stage. Kappa's initial plan merely laid the groundwork for Gensokyo's industrialization; now, it's time to propel this system into true high-speed operation. By introducing automated production systems, improving raw material refining efficiency, and optimizing transportation nodes and military production lines, we will transform previously fragmented construction achievements into a truly sustainable and scalable industrial network. This will not only increase the production of weapons and equipment but also accelerate infrastructure construction across the board, allowing Kappa's mechanical civilization to truly permeate every artery of Gensokyo."

 KYO_kappa_ultimate_plan:"The Ultimate Kappa Industrial Project"
 KYO_kappa_ultimate_plan_desc:"Years of construction, expansion, and renovation have finally come to an end. Factories, steel mills, military facilities, and transportation lines have all been integrated into the same system, supporting each other and circulating independently, forming a vast and self-sufficient industrial network.  Kappa has refined this system to its ultimate perfection: production efficiency is astonishingly high, resource allocation is seamless, and virtually no waste is left. This is no longer just a few construction achievements, but a complete industrial civilization capable of supporting both war and the economy.  From this moment on, Gensokyo not only meets its own needs but also possesses the ability to direct surplus resources to more distant goals."

 KYO_great_industry:"The Great Industry"
 KYO_great_industry_desc:"In ordinary endeavors, what diligence can achieve, genius can also accomplish; and diligence often accomplishes what even genius finds difficult to achieve. Industry is precisely this kind of field. It doesn't rely on fleeting inspiration, but on countless repetitions, the collaboration of countless people, and the ceaseless roar of countless days and nights. Factories, mines, railways, military outposts, and granaries, through this almost monotonous, continuous progress, become the backbone supporting an era. When great industry is truly established, Gensokyo will no longer be just a place living on legend, but a place capable of changing the world through its own power."

 

 
 KYO_use_outworld_mechine:0 "Introducing Machinery from Outside World"
 KYO_use_outworld_mechine_desc:0 "Machine tools, measuring instruments, and process drawings from Outside World are being transported to Gensokyo in batches through trade routes operated by Kappa. Tengu is responsible for arranging the routes and concealing the destination of the goods, while Kappa inspects, disassembles, and reassembles the goods upon arrival.\n\n The willingness of Outside World merchants to sell this equipment is not necessarily out of shortsightedness or betrayal. For them, this was merely a lucrative order with an ambiguous buyer identity; for us, however, each crate held the potential to bridge decades of industrial gaps.\n\n We will not forever rely on imports. New technical workshops will be responsible for surveying parts, translating blueprints, and standardizing specifications, gradually transforming these unfamiliar machines into production tools that Gensokyo can repair, replicate, and even improve."

 KYO_hello_human:0 "Incorporating Humanity into Production"
 KYO_hello_human_desc:0 "War has brought a large number of humans into our sphere of influence. To restore mines, roads, and factories, it is impossible to continue treating them as ordinary residents unrelated to the regime.\n\n All eligible individuals will undergo occupational and skills registration and be deployed to workshops, mines, transport teams, and construction units according to local needs. Those conscripted will receive food, wages, lodging, and basic medical care, but during mobilization, they may not leave their posts or refuse assignment.\n\n The government refers to this as wartime labor, while humans have a more direct understanding: they have been incorporated into an order they did not participate in creating and from which it is difficult to exit."

 KYO_give_me_that:0 "Takeover of Human Industries"
 KYO_give_me_that_desc:0 "Mines, factories, and transportation facilities still under private control are hindering unified management. Hoarding, production stoppages, and speculation are not only driving up prices but also preventing the front lines from receiving a stable supply.\n\n We will issue a wartime takeover order, bringing key enterprises under the supervision of the Youkai regime. Original owners may retain limited profits or continue to operate, but equipment, inventory, and production direction must comply with unified arrangements. Those who refuse takeover will have their assets directly confiscated.\n\n The law still recognizes those old contracts, but no longer recognizes them as being superior to the war and the survival of Gensokyo."

 KYO_my_properties:0 "Asset Inventory and Takeover"
 KYO_my_properties_desc:0 "Without accurate data, a takeover order will ultimately remain just a stamped document. We must know what each workshop can produce, how much material each warehouse stores, and which equipment is still operational. kappa will be responsible for equipment assessment and technical classification, tengu will be responsible for verifying the flow of goods, and human staff will continue to organize accounts and debts. Those who conceal inventory, transfer machinery, or falsify records will lose their remaining operational rights.\n\n After the inventory is completed, private property will not completely disappear, but will be rewritten into calculable, requisitionable, and redistributable production capacity."

 KYO_under_new_mangement:0 "Unified Management System"
 KYO_under_new_mangement_desc:0 "The old signboard is removed, and a new one is hung above the door. It may seem like just a name change, but the actual changes are in the accounts, procurement, personnel, and production instructions.\n\n All acquired enterprises will adopt a unified financial format, parts specifications, and inventory system. Kappa will be responsible for machinery maintenance and process improvement, Tengu will be responsible for auditing delivery status, and the original owners and skilled craftsmen will continue to serve as appointed managers.\n\n These units will still sell goods, pay salaries, and retain their respective skills; however, they are no longer businesses that can decide their own direction, but rather part of the overall industrial system."

 KYO_steal_is_that_so:0 "This is merely “borrowing”"
 KYO_steal_is_that_so_desc:0 "Everything needed for industrialization cannot be obtained solely through open trade. Some precision equipment is regulated, some blueprints are never sold, and some technologies exist only in the archives of a few factories.\n\n Therefore, we will allow specialists to acquire the necessary resources through acquisition, imitation, clandestine transfer, and temporary requisition. Some items will be paid for, some will only leave a receipt promising future return, and some will never have the original owner's consent in the first place.\n\n Official documents will refer to these actions as borrowing, transfer, or emergency safekeeping. What the person who lost the equipment is called does not affect the restart of the machinery in Gensokyo."

 KYO_german_is_good:0 "German-style Industrial Mobilization"
 KYO_german_is_good_desc:0 "Germany's recent military expansion demonstrates a highly centralized industrial organization: standardized specifications, specialization, planned quotas, and the ability to quickly convert Civilian Factories into military production.\n\n We will study these management methods, establish coordination mechanisms from raw materials and parts to final delivery, and strengthen maintenance, replacement, and production capacity statistics. What we need is its organizational capacity, not simply copying the political creed of Outside World.\n\n This system, while capable of rapidly concentrating resources, can also easily suppress civilian production and make the entire economy overly reliant on central commands. If a misjudgment is made, all factories may simultaneously head in the wrong direction."

 KYO_america_is_good:0 "American-style mass production"
 KYO_america_is_good_desc:0 "American industry's strength lies not only in the number of its factories, but in assembly lines, interchangeable parts, quality control, and supply networks spanning whole regions. Once specifications are standardized, even complex products can be divided into simple operations repeated at scale.\n\n We will redesign factory floors, introduce material-coding and warehouse systems, and enable separate workshops to produce mutually compatible parts. Kappa technology will no longer remain the private art of a few craftspeople; it will become a manufacturing standard that can be replicated everywhere.\n\n This path demands reliable transport, long-term investment, and vast quantities of raw materials. Once the system matures, however, Gensokyo can overcome its late industrial start through a scale that continues to grow."

 KYO_great_deal:0 "A Good Deal on Paper"
 KYO_great_deal_desc:0 "Directly seizing equipment easily provokes resistance, while a signed agreement can often cloak the same transfer in legality.\n\n We will use orders, debts, security guarantees, and market access as bargaining chips to force local companies to accept long-term supply, equipment transfer, and resource priority. The negotiations appear to be conducted voluntarily by both parties, but the room for refusal differs between them.\n\n These agreements are favorable to us not because they are fair, but because the risks, shortages, and liabilities for breach of contract are almost entirely left to the other party."

 KYO_human_slave:0 "Forced Labor System"
 KYO_human_slave_desc:0 "Temporary requisitions cannot provide a growing industrial system with a stable workforce. Wartime measures will become permanent institutions, linking occupational assignments, residence permits, and public rations.\n\n Human labourers will be assigned according to skill and physical capacity to mines, factories, transport units, and construction crews. They will receive prescribed wages, food, medical care, and leave. They will not, however, be free to choose where they work, and unauthorized resignation or relocation will be punished.\n\n The law will not call them slaves. Yet when every necessity of life depends on obeying one's assignment, little remains of any meaningful choice. Industry gains a dependable workforce; humans steadily become second-class residents of the state."

 KYO_work_to_die:0 "The Production Lines Must Never Stop"
 KYO_work_to_die_desc:0 "War doesn't wait for workers to recover. Safety checks, leave, and equipment maintenance all give way to output; all units must meet ever-increasing production targets within deadlines.\n\n Working hours will be extended, the injured will return to their posts after simple treatment, and accidents will only be recorded as production delays that need to be resolved as soon as possible. No order will directly demand that someone die, but the entire system has assumed that someone will always fall before the machines stop.\n\n As long as the numbers on the reports are still increasing, those in charge of production will not proactively question how those vacancies appeared."

 KYO_eight_hour_work_time:0 "Double 8-hour work system"
 KYO_eight_hour_work_time_desc:0 "Unrestrained consumption of labor will only lead to absenteeism, accidents, and production collapse. What we need is not short-lived, frenzied growth, but a high-intensity system that can operate sustainably.\n\n Each worker will work two eight-hour shifts per day, with breaks for meals, changing clothes, and simple checks. The hours are still long, but fixed rotations and minimal rest reduce chaos and keep equipment and personnel in a more stable state.\n\n This is not out of leniency, but rather management finally acknowledging that workers who can still work are more valuable than those who collapse quickly."

 KYO_miracle_industry:0 "The Youkai Industrial Miracle"
 KYO_miracle_industry_desc:0 "New railways cut through the valleys. Machine tools run all day in expanded factories. Steel, components, and military supplies now move across the country in quantities once unimaginable. At last, Gensokyo possesses an industrial base capable of sustaining modern war.\n\n The authorities credit kappa technology, centralized management, and efficient mobilization. None of that is false, but it deliberately omits the other half of the story: punishing hours, restrictions on movement, and human labourers compelled to obey production assignments.\n\n The industrial miracle is real. The people who created it and the people who enjoy its rewards are simply not the same."

 KYO_work_for_youkai:0 "Serving the community"
 KYO_work_for_youkai_desc:0 "Wartime labor will no longer be seen as a short-term measure, but will become a fundamental structure of the new society. Food, housing, education, and healthcare will all be distributed through workplaces, and it will become increasingly difficult for humans to escape their assigned roles throughout their lives.\n\n Youkai will be responsible for decision-making, technology, and management, while humans will undertake most of the mining, transportation, and basic labor. Those who obey will have a stable life, and those who perform well may receive limited promotions, but they will not be able to equally determine the direction of the nation.\n\n The official explanation for this relationship is interdependence: Youkai provides protection and order, while humans maintain production and supply. However, when this division of labor can be passed down from parents to children, it is no longer just a job, but an inherited identity."

 KYO_morden_youkai:0 "Modern Youkai's Ideal Country"
 KYO_morden_youkai_desc:0 "Electric lights illuminated the streets of Youkai, and new hospitals, schools, newspapers, and workshops were established. Youkai, who once survived on legend and fear, now possessed stable food supplies, modern industry, and a nation capable of protecting itself.\n\n Humans, too, gained basic security, rations, and healthcare, yet remained at the bottom of the production system. Overt violence decreased, replaced by work permits, salary grades, migration restrictions, and ubiquitous administrative scrutiny. Obedience no longer needed daily emphasis; it was ingrained in every aspect of life.\n\n The regime considered full granaries and stable streets proof of successful coexistence. However, when one side sets the rules and the other can only bear the assigned responsibilities, is this truly communal living, or an ideal state open only to Youkai?"










 








 












































#KYO_after_war_reform:0 "战后的盘点"
#KYO_after_war_reform_desc:0 "日本列岛仍在硝烟与妖力残响中颤抖。军报、战死名册与赔偿请求堆满帝国#议会的地板——这是胜利后第一份工作：算清战争留下的每一笔伤痕。\n\n八云紫、蓝与橙将重新盘点兵力、粮秣#与占领区秩序，决定哪些军团解编、哪些军阀收编，以及对人里与各地人类社群画出最低保护线。只有先把这些#整理清楚，之后的妖怪政权才有站稳脚跟的可能。"
#
#KYO_reform_the_system:0 "体制系统的调整"
#KYO_reform_the_system_desc:0 "战时的「妖怪联合体」是为突破结界、横扫日本而打造的临时工具：权力#集中在少数贤者与军事指挥部，地方妖怪与人类自治几乎被冻结。\n\n如今战争结束，过度军事化与高度集权正#开始拉开新的裂缝——军阀要求战功分配，人类要求最低的自治保障，宗教势力与既得利益者也在观望。若不将这#套体制拆解、调整为可以长期运作的政权架构，下一场动乱只会在更脆弱的地基上爆发。"
#
#KYO_reform_the_barrier:0 "重修大结界"
#KYO_reform_the_barrier_desc:0 "博丽大结界的裂纹在夜里呼吸，宛如一头尚未被驯服的巨兽。外界的残余#意志、怨灵与军事侦察，沿著那些细小的缺口渗入日本列岛的每一处角落。\n\n八云紫将以「间隙」重新校准边#界，把原本守护幻想乡的结界扩展、缝合，覆盖整个日本。然而，战争与大量异常生灵的涌入，令新的结界极度#不稳：短期内可能引发妖力紊乱、结界失灵与奇异灾变，长期却是换来一片可控的疆域与封闭外界干涉的屏障。#"
#
#KYO_kill_the_rebel:0 "剿灭叛乱"
#KYO_kill_the_rebel_desc:0 "胜利不代表一切臣服。各地残余的人类抵抗组织、失势的妖怪军头与不满新秩#序的宗教团体，正在暗处试探新政权的底线。\n\n紫的命令很简单：叛乱如风中火星，必须在燎原前掐灭。先礼#后兵——招抚、分化、斩首三步并行；能谈的谈，该砍的砍，让所有人明白「谈判」只属于愿意收手的一方。只#是，越是彻底地清洗，越会有人把仇恨记在心里，等待下一次报复的机会。"
#
#KYO_make_youkai_warlord_surrender:0 "迫令妖将归顺"
#KYO_make_youkai_warlord_surrender_desc:0 "在突破结界、攻占日本的过程中，许多妖怪首领以半独立军#团的形式作战，他们握有自己的部队、补给线与统治区域，战后自然不愿轻易交出。\n\n要建立稳定政权，军队#必须从「谁的私兵」转为「谁的国军」。编制重整、裁军与收编将一并推进——红魔馆的蕾米莉亚与其他妖将不会#心甘情愿，谈判桌与军事演习场都将成为新一轮角力的舞台。"
#
#KYO_all_bow_yukari:0 "跟随或毁灭"
# KYO_all_bow_yukari_desc:0 "在突破博丽大结界、横扫日本列岛的每一个夜晚，所有妖怪都亲眼见识过那个站在「间隙」上的女人——她只需轻轻一拨，边界、国境与生死便如纸张般翻面。战争结束之后，问题不再是谁赢了，而是由谁来承受这个新世界的重量。\n\n八云紫没有打算与任何人分享权柄。愿意跟随者，将在她的庇护之下获得名分与秩序；选择犹豫或反对者，等待他们的只有从这片版图上被抹除。对妖怪也好、人类也罢，未来只剩两条路——站到她身边，或在她收拢结界时一同消失。"
#
#KYO_future_start:0 "给予旧结界的最后仪式"
#KYO_future_start_desc:0 ""


  KYO_war_never_change:0 "War has never changed"
  KYO_war_never_change_desc:0 "§RThe flames of war have been ignited; no one can remain uninvolved.§!\n War, war never changes.\n\n As long as there is territory and stance, as long as there is fear and resentment between humans and youkai, steel and youkai power will once again etch cracks into the earth. The victors write history, the vanquished become legends; what remains constant is that everyone will eventually be drawn in—it's just a matter of sooner or later, in what order."

  KYO_make_sure_beast_support:0 "Signed a non-aggression pact with Animal Realm"
  KYO_make_sure_beast_support_desc:0 "Animal Realm only recognizes the strong and contracts; there are no “friends,” only “prey” and “temporary allies.” The beasts there smell blood and power, and their judgment of the situation is far faster than that of the humans of the Outside World.\n\n As long as we can ensure they don't side with either side, and even secretly restrain other competitors for us, this war won't gain another enemy emerging from the depths of Hell. The price to pay is a generous contract and recognition of their right to an “independent hunting ground.”"

  KYO_make_sure_kappa_support:0 "Secure Kappa Industrial Support"
  KYO_make_sure_kappa_support_desc:0 "Water vapor and gears hummed along the riverbank, while steel skeletons took shape deep within the caves. Kappa's factories weren't in the cities on the map, but hidden in streams, mountains, and secret docks, giving Gensokyo its first industrial capabilities resembling those of the Outside World.\n\n Trading contracts, patents, and river passage rights for Kappa's engineering teams, weapon modifications, and supply networks was essential for sustaining the protracted war. As long as this waterway remained open, our army wouldn't fall due to running out of ammunition and supplies."

  KYO_make_sure_ghost_support:0 "Ensuring order in the Netherworld"
  KYO_make_sure_ghost_support_desc:0 "The snow-covered gardens of Hakugyokurou lie silent; at the sound of bell and drum, ten thousand spirits gather. Here the boundary between living and dead is thinnest—and here, more than anywhere else, the system cannot be allowed to fail.\n\n If the Netherworld falls into chaos, the dead will run wild, judgment will cease, and the resentful spirits of those killed in battle will have nowhere to go. In time they will turn back to consume the world of the living. By then, victory in the civil war will mean nothing. Japan and Gensokyo alike will be dragged into an abyss of shadow."

  KYO_make_sure_tengu_support:0 "Secure Tengu Air Support"
  KYO_make_sure_tengu_support_desc:0 "Youkai Mountain's editorials can sway public opinion, while Eagle Wing's scouts can determine the course of battle. Tengu controls the skies, the wind, and the intelligence network; if their newspapers and reconnaissance turn in favor of the enemy, we will be blinded in both public opinion and tactics.\n\n Securing Tengu's support means we can control the air and the flow of information: ensuring our troops are on the right battlefield at the right time, and magnifying the enemy's mistakes for everyone to see. As long as the skies belong to us, ground battles will not be a mere gamble."

  KYO_make_sure_fairy_support:0 "Let the Fairy support us"
  KYO_make_sure_fairy_support_desc:0 "Fairy is a fragment of nature, an embodiment of seasons, climate, and emotions. Numerous, single-minded, impulsive, and naive, they appear fragile and clumsy—yet possess bodies capable of almost infinite resurrection.\n\n Given enough joy and benefits, fairies will surge forward like a tide, disrupting the enemy's vision, filling gaps in our formations, and even rising again nonchalantly after defeat. Ultimately, they don't care who the leader is, only which side is more fun—and our task is to make them feel that following us is the least boring thing."

  KYO_make_sure_oni_support:0 "Greetings to the Oni Clan Leader"
  KYO_make_sure_oni_support_desc:0 "The oni in the mountains still remember the battles of ancient times: Shuten-dōji, Hoshiguma-dōji, Ibaraki-dōji—once those names stood on the front lines, the enemy army would be crushed by their sheer force. Oni hate lies, but they respect the strong who face battle head-on.\n\n If a sufficiently generous reward and frank alliance can be offered to entice the Oni to join the fight, the enemy will experience firsthand what it means to “retreat without a fight” on the front lines—not that they don't want to fight, but their legs will tremble at the mere sight of those figures."

  KYO_make_sure_eientei_support:0 "Obtaining supplies from the neutral Eientei"
  KYO_make_sure_eientei_support_desc:0 "The Eientei are accustomed to observing from the sidelines, locking themselves in the bamboo labyrinth. Eirin Yagokoro no longer wishes to personally intervene in the power struggle in Gensokyo, but she still firmly controls medicine, medical care, and special supply lines.\n\n As long as the reward is sufficient and the conditions are detailed enough, she will ensure our soldiers have medicine and ammunition available even in the worst-case scenario, without revealing herself or making any statements. Whoever controls the Eientei's supplies can sustain their army for several more rounds of attack and defense."

  KYO_last_chance_of_victory:0 "Now or Forever"
  KYO_last_chance_of_victory_desc:0 "Animal Realm's neutrality, Kappa's factories, the Oni's prestige, the order of the Netherworld, Tengu's skies, Fairy's tides, and Eientei's cold, meticulous supplies—piece by piece, they've been pieced back to our side. Almost all the forces we can win over are in place, and all the factions we can persuade have stated their positions.\n\n The battle to come has no “preparation phase” to rewind and start over. This is a battle for us to rise up, to dominate, or to be written into the history of the losers. If we hesitate now, our fate will be decided by others; if we go all out now, victory or defeat, it will set a new trajectory for Gensokyo and Japan—either now, or we lose our chance forever."


 KYO_remilia_start:"Remilia's Blood Empire"
 KYO_remilia_start_desc:""




 KYO_remi_aftermath:"Red Dawn"
 KYO_remi_aftermath_desc:"Red mist, like a layer of damp, cold silk, covered the sky. The lights in the houses were tinged with a dark red, and the shadows behind the window paper shrank into a ball—not because they saw anything, but because they knew “someone was watching.”\n\n When Remilia ascended the throne, there were no cheers. Only the soft clinking of cutlery and armor buckles, like a group of people deliberately tightening their throats. She didn't need applause either. What she wanted was for everyone's first thought upon waking to be her name.\n\n She remembered fifteenth-century Europe. The church bells and the pens of academies propelled the world forward, gunpowder, gears, and the smoke from workshops scraped away youkai as though they were stains left by an older age. It wasn't a war, but a new set of rules that squeezed you out of history—even anger seemed outdated.\n\n So she no longer accepted hiding in legends. Legends would be forgotten; systems wouldn't. She wanted fear to grow beyond boundaries, to grow into documents, to grow into factory chimneys, becoming a daily necessity to obey.\n\n Remilia would issue a command, summoning all those under her rule to"

 KYO_sakuya_intro:"Head Maid Sakuya Izayoi"
 KYO_sakuya_intro_desc:"A fingerprint was just reflected on the mirror, then wiped away in the next instant. The dust didn't even have time to settle before it was visible—not that it didn't exist, but that Sakuya wouldn't allow it to remain. Where she walked, the air seemed to be calibrated: table corners aligned, candlelight at uniform height, the folds of curtains pressed to the same scale. Any deviation was like a needle piercing her eye.\n\n She held the tray steadily, but her knuckles were white. She wouldn't allow herself to tremble—not because she was afraid of making a mistake, but because she knew what “making a mistake” meant in this city: not making a mistake, but being replaced.\n\n Her perfection wasn't a habit, it was a defense. Every time she polished the silverware until it reflected light, she was giving herself orders: cleaner, more accurate, faster. She could hear the subtle sounds deep in the corridor: the friction of armor buckles, hushed conversations, the slight click of doors. They were like the second hand of a countdown, reminding her—if anything went wrong, the master's gaze would turn to someone else.\n\n Her face always wore a polite calm. Even when the tension in her heart made her breath painful, she only allowed herself to utter the shortest, cleanest words.\n “Ready.”\n\n Only she knew how much swallowed emotion was hidden behind those words.\n She wouldn't allow weariness to surface, wouldn't allow grievances to become words, and wouldn't allow any “good enough” to appear in her hands. She would return to the hall alone after everyone had left, pushing back the chair that someone had bumped, straightening the edges of the carpet, and even resetting the angle of the doorknob to the position she remembered. Time in her hands wasn't a miracle, but a tool.\n\n With a flash of her blade, she could slice an instant into smaller fragments, suppressing a mistake before it even happened, making it disappear as if it had never existed. She decomposed, rearranged, and locked down each step until only one possibility remained: perfection. Because she knew too well.\n\n This Scarlet Devil Mansion wasn't lacking in loyalty, nor was it lacking in people capable of killing. She could stand here because she could present the world her master desired—clean, precise, and without any hesitation. She didn't seek to be understood.\n\n She only prayed not to be left behind.\n So Sakuya organized everything flawlessly—even her own heartbeat felt like it had been brought back to a steady rhythm by her own hand."

  KYO_sakuya_prefect:"The Perfect and Elegant Maid"
 KYO_sakuya_prefect_desc:"Scarlet Devil Mansion's daily life wasn't life itself, but a high-pressure operating system: banquets, ledgers, security, supplies, visitor lists, corridor patrols, kitchen access, shift changes—if anyone slowed down even a fraction, the entire mansion would begin to spiral out of control.\n\n Sakuya Izayoi was responsible for turning the master's “elegance” into executable procedures: seating arrangements were signals, the order of drinks was control, and shift changes were defenses. She didn't need to raise her voice; just a simple “Let's start over” was enough for everyone to understand the protocol.\n\n She maintained everything with near-obsessive precision, because here, for humanity to survive, only results mattered."

 KYO_sakuya_must_prefect:"Order Sakuya to Stop Working"
 KYO_sakuya_must_prefect_desc:"Sakuya polished the silver, then picked it up to inspect it again. Her fingers were already stiff, yet there always seemed to be a mark on the cup's handle that would not come clean. She had just changed cloths when Remilia told her to stop.\n\n“Go to your room and rest. Now.”\n\nStill holding the cup, Sakuya first reviewed that evening's seating arrangements and accounts. She could recall no mistake, which only deepened her unease. She did not move. Remilia looked up and repeated the order before Sakuya finally set everything down and bowed her head in acknowledgment.\n\nLeaving the hall, she kept turning over the words “That is enough.” Her mistress had only ordered her to rest. She had not dismissed or punished her. Yet Sakuya could not tell how much patience remained in those words. Had she been working too slowly? Had her very presence begun to irritate milady? She wanted to go back and ask. Her steps faltered, but in the end she continued toward her room.\n\nShe hung up her clothes, aligned her gloves, and placed her shoes with their toes toward the bed. Shortly after sitting down, she rose again, remembering several shifts for tomorrow that she had not checked. Her hand was reaching for the door handle when she remembered that resting was an order. She retreated to the bedside.\n\nThe room was quiet. She could hear people passing in the corridor and even identify who was clearing the tea things in her place. Ordinarily, if she heard a cup or saucer being set in the wrong place, she would step out to correct it. Tonight she could only remain where she was and wonder whether that person suited her mistress better.\n\nShe knew these suspicions had no basis. She had heard milady's assurances before. Yet whenever she stopped working, she wanted to confirm once more that she would still be summoned to her side tomorrow. She had even rehearsed her answer in case someone knocked, so they would not have to wait.\n\nSakuya turned the bedside clock toward her. Barely any of her rest had passed, but she had already checked it several times. As the candle burned low, she remained seated upright, waiting for one set of footsteps to stop outside her door and bring her something that needed doing."

 KYO_sakuya_do_not_harsh:"Cherish us, Sakuya"
 KYO_sakuya_do_not_harsh_desc:"Scarlet Devil Mansion rarely did anything “unnecessary.” Efficiency, standards, and who should stand where—all mattered here. But that day, the standards were quietly changed.\n\n From early morning, the corridor was eerily quiet. The maids bowed as usual, but deliberately avoided Sakuya's gaze; the kitchen door opened and closed even more gently, as if afraid of disturbing some machine about to explode. Patchouli handed Koakuma a list, the handwriting so clean it sounded like an order—ingredients, time, seating, candlelight height, everything was meticulously planned; Koakuma ran quickly with the tray, yet unusually quietly.\n\n Meiling stood guard at the door, her posture more upright than usual. She wasn't guarding outsiders, but guarding “tonight.” She would stop any potential leaks, and she would also stop Sakuya from going to work—if Sakuya took a step closer, Meiling would push her back with an uncompromising look.\n\n Sakuya noticed nothing, or rather, she didn't allow herself to notice. She still patrolled regularly, still checked the reflection of the silverware, still brought every angle back to its original position. She calmed her heartbeat, suppressed her questions, because she thought she was being observed, being evaluated.\n\n In the evening, Remilia summoned her to the banquet hall with a single sentence.\n's tone was as casual as ever, yet it carried the weight of a command. “Head Maid, be on time.”\n\n Sakuya replied, “Yes, ma'am,” without asking further questions. She simply straightened her uniform once more, pulled her gloves to the perfect position, and cut each breath into the cleanest rhythm. As she pushed open the banquet hall doors, only one thought occupied her mind: she couldn't afford to make a mistake tonight.\n\n The light behind the door was brighter than she had expected. The candles were neatly arranged, but not the kind of “working” lighting she usually provided; the fragrance was stronger, but not the standard formula for entertaining distinguished guests; the tableware was excessively shiny, as if someone had deliberately polished them to the point of being blinding.\n\n The entire Scarlet Devil Mansion seemed to be governed by a different set of rules.\n\n But those rules weren't about efficiency.\n\n The target was her. Sakuya stood at the door, her first reaction not one of gratitude. It was wariness. Her fingers tightened slightly, her gaze instinctively sweeping across every corner, as if searching for an ambush. She didn't understand why everyone was here, why she had been summoned without any instructions. The worst possible answer began to surface in her mind: had she done something wrong, so they were ending her in a “dignified” way?\n\n Before she could speak, the silence in the banquet hall seemed to be abruptly cut off.\n\n Someone gasped. Someone suppressed a laugh.\n\n Someone was gradually enveloping her in an unfamiliar setting. At the other end of the throne, Remilia raised her chin, as if announcing something taken for granted.\n\n “You don't have to work tonight.”\n As those words fell, Sakuya's stomach tightened. She suddenly didn't know how to stand, how to breathe.\n\n Because for her— Not working was never a reward.\n It was the unknown."

 KYO_sakuya_will_not_die:"Sakuya was always the perfect maid"
 KYO_sakuya_will_not_die_desc:"Sakuya polished the silverware until it reflected candlelight, even her breathing seemed precisely measured. She stood there, her back too straight, but her eyes were constantly scanning—the entrance, the shadows, the corners of the corridor.\n\n She thought she was working, but she was actually protecting herself. Remilia sat high up, watching, the red wine in her glass swirling slightly. She didn't tell her to stop, nor did she remind her to relax. She simply suddenly remembered the American West Coast from long ago: the damp sea breeze, the streetlights in the fog, the child clutching a broken knife in the alley behind the church.\n\n That child didn't cry, but stared at the world with a prematurely mature wariness, as if ready to use her last breath to find another way. When Remilia approached her back then, it wasn't out of kindness. She simply loathed waste, loathed leaving usable things to rot on street corners.\n\n And now, watching Sakuya push herself to the limit, she suddenly understood that the same thing was still happening: she wasn't pursuing perfection; she was afraid of being discarded again.\n\n Scarlet Devil Mansion needed order, but Remilia didn't need a head maid who wore herself down. She set down her glass, her gaze as cold as a pause before a command is given—it's time to pull that past from the shadows, Sakuya, you are my perfect pawn."

 KYO_sakuya_best_maid:"An Internal Purge, Elegantly Executed"
 KYO_sakuya_best_maid_desc:"The civil war had been decided, but the Scarlet Devil Mansion's supply lines remained under attack. Patrols vanished, ammunition transports were intercepted, and the names Sekibanki, Kagerou Imaizumi, and Wakasagihime appeared repeatedly in the reports. Seija herself had not been sighted, so Sakuya began with the contact points still in operation.\n\nMeiling passed her information from near the river embankment, reminding her that many lesser youkai there had lost their livelihoods in the war. Sakuya read it and asked only when the ammunition would be moved. She knew where the resentment came from, and knew that arresting a few people would not satisfy those left behind. Her queen had tasked her with restoring transport and finding Seija.\n\nOn a rainy night, the three grassroots youkai were moving crates of gunpowder to the river. Sakuya emerged from behind a tree. Kagerou drew her weapon first, while Sekibanki told Wakasagihime to take the supplies and withdraw. Before they could separate, the raindrops froze in midair. Sakuya walked between them, placing throwing knives to block their access to weapons and their escape routes.\n\nTime resumed. Kagerou fell into the mud, her weapon knocked from her grasp. Blades barred Wakasagihime's way to the water, while Sekibanki's flying head was driven back, cutting off escape from above. Sakuya subdued them one by one without killing them and summoned the personnel waiting beyond the perimeter. She needed prisoners who could answer questions.\n\n“You're human too. How can you go this far for her?” Sekibanki was still struggling.\n\nSakuya checked the restraints before replying. “Where is Seija?” No one answered, and she did not continue the argument on the embankment. The three were taken back to the Scarlet Devil Mansion. The gunpowder and seized documents were packed separately and handed over for inventory.\n\nAfter hearing the report, Remilia first asked whether Seija had been captured as well. Sakuya explained that she had not been present, but the prisoners and evidence of their contacts had been secured. Interrogations would continue. The queen authorized her to follow the trail until the amanojaku could no longer use these bases to organize attacks. Sakuya acknowledged the order and left for the dungeon, where the three prisoners were still waiting."

 KYO_meiling_intro:"Hong Meiling, Gatekeeper of the Scarlet Devil Mansion"
 KYO_meiling_intro_desc:"There is always someone at the gate of the Scarlet Devil Mansion.\n\n By day, she dozes against a stone pillar with the brim of her cap drawn low, looking for all the world like the most casual of guards. But let the wind change, a footstep fall out of rhythm, or a visitor's breathing falter for a moment, and her eyes open. There is no ferocity in them, only an unshakable steadiness—as though the weight of the entire mansion rests upon her shoulders.\n\n Hong Meiling's duty is very simple and very difficult: she guards the gate.\n She must tell a lost traveller from someone testing the defences, and a guest bearing gifts from one carrying a knife. She remembers every familiar face and every shadow that ought to be stopped. When trouble comes, she must silence it before it wakes the mansion. She will smile as she asks you to halt; cross the line, and she will put you back on the proper side of it—not cruelly, but without negotiation.\n\n In truth, she has no love of trouble.\n She likes sunshine, grass-scented breezes, and practising a form between shifts until warmth returns to her limbs. She respects rules without becoming rigid and understands propriety without turning cold. If a child from the Human Village peers through the gate, she softens her voice to ask whom they are looking for. If a lost fairy bursts into tears, she escorts them back to a safe path and gently warns them not to wander off again.\n\n Many residents of the Scarlet Devil Mansion are powerful enough that others dare not approach them.\n Meiling is different. She notices whether a maid has eaten, helps the kitchen carry a crate too heavy for one person, and leaves a lamp burning for anyone still abroad during her night patrol. She is no saint. She simply treats people as people.\n\n That is also the strangest and most stubborn thing about her.\n\n Though she is a youkai, she always seems to stand between youkai and humans, leaving a little room for both. She dislikes seeing the weak ground into the mud and does not believe power exists to frighten others. She knows the world is cruel; she merely refuses to become cruel with it.\n\n Some whisper that she is a dragon who wishes she were human.\n When she hears them, she never takes offence. She only smiles, as though admitting it—or perhaps as though it does not matter.\n\n “Being human sounds rather nice,” she sometimes says, as casually as if discussing the weather.\n “At least you can speak your mind, and decide for yourself whom you choose to treat kindly.”\n\n And so she stands before the gate.\n Not because she is the strongest, nor because she is the most ruthless, but because she is willing.\n\n Willing to guard this mansion in her own way—to keep the chaos outside from entering, and give those within the peace to live as themselves.\n\n When she sleeps, she is a cat. When she wakes, she is a wall.\n Her smile is easy, but she never neglects her post."

 KYO_meiling_gatekeeper:0 "The Chinese Girl"

KYO_meiling_gatekeeper_desc:0 "Those who regularly delivered goods to the Scarlet Devil Mansion all recognized the girl in green standing before its gates.\n\nHong Meiling remembered their names. She also remembered whose cartwheels were most likely to sink into the muddy hollow outside. When she saw a familiar face, she greeted them before asking their business. If a first-time visitor was too nervous to explain themselves, she let them take a moment to recover. A low stool stood beside the gate. Messengers awaiting replies had sat there, as had peddlers resting beneath the weight of their shoulder poles.\n\nHer clothes were Chinese in style, with tight cuffs that would not hinder her arms. When people asked where she came from, her answers were vague. When asked why she always dressed that way, she answered readily.\n\n“I'm used to it. Have you ever tried kicking in a maid's skirt?”\n\nNo one knew how long she had truly lived. The mansion's maids knew only that the hands which so often helped visitors steady their cargo had once forced an intruder to his knees upon the stone steps.\n\nReeking of alcohol, the man claimed that Milady had received him before. He shoved past those waiting and tried to force his way inside. Meiling stopped him twice. He drew his sword. Before its edge could touch her sleeve, she had seized his wrist and driven half his body downward.\n\nShe applied no further pressure. Only when he released the weapon did she kick it out of reach.\n\n“Leave your name, and I will inquire on your behalf. Try to force your way in again, and you will wait here in restraints.”\n\nLater, someone vividly claimed to have seen the shadow of a coiling dragon behind her that night. The maid on duty had witnessed the encounter herself, yet the more she heard the story, the less certain she became that she had not somehow missed it. Others said that Meiling had violated the laws of Heaven and been condemned to guard a gate in the mortal world.\n\nThat evening, the maid finally gave in to curiosity and asked whether any of it was true.\n\nMeiling was mending her cuff by the gate lamp. After listening, she looked up.\n\n“If I could truly command the wind and rain, why did I have to carry so many buckets when the flower beds ran dry last month?”\n\n“Perhaps your powers were sealed away.”\n\n“How unfortunate for me.”\n\nShe laughed and bit through the loose thread, but the maid did not leave.\n\n“Why are you always so polite to those people? None of them could defeat you.”\n\nMeiling followed her gaze to the low stool beside the gate.\n\n“You remember the old gentleman who repairs our clocks, don't you? His hands tremble a little, and he never lets anyone else touch his tool case.”\n\nThe maid nodded.\n\n“The first time I met him, he still carried his tools on a shoulder pole. His son followed behind and couldn't even tell the pliers apart. Now the son repairs all the large clocks, while the old man accepts only smaller jobs.”\n\n“Then he does not need to come anymore.”\n\n“He says he cannot bear sitting idle at home. Once he repairs something and hears it ticking again, he can even eat a little more at supper.”\n\nBefore leaving that day, the old man had held the repaired pocket watch beside Meiling's ear so she could listen for a moment. Its tiny case was packed with intricate parts. She could see them clearly, but did not dare touch them for fear of breaking something.\n\n“He also promised to teach me what the pieces inside are called. Next time, he'll bring an illustrated guide.”\n\n“There are things even you don't know?”\n\n“Plenty. I couldn't even sew this straight.”\n\nShe raised her sleeve beneath the lamp. Sure enough, the stitches veered sharply to one side. The maid laughed, took the sleeve, and began undoing the thread for her.\n\nThe following day, the clockmaker's son delivered the guide. His father had hurt his back and needed to rest at home for several days. Meiling asked after him carefully, then told the son to assure the old man that he should rest without worry. She would try following the book in the meantime.\n\nWhen her relief arrived that afternoon, she carried the guide to the low stool and sat down. After reading two pages, she took out an old alarm clock that had been running slow and carefully unscrewed its back according to the diagram."

 KYO_meiling_help_sakuya:0 "Moon-Watching with Sakuya"

KYO_meiling_help_sakuya_desc:0 "Only after signing the inspection log did Sakuya notice that Meiling was still standing before her desk.\n\n“Your shift is over. Why aren't you asleep?”\n\n“The moon is beautiful tonight. I wanted someone to watch it with me.”\n\n“You certainly know how to choose your moment.”\n\n“That's why I made tea for you too.”\n\nTwo cups waited on the stone steps in the garden. Sakuya glanced at her pocket watch, sat beside Meiling, and said she could stay only a little while. Meiling handed her the tea, shifted her position, and stretched out her right leg.\n\n“What happened to your knee?”\n\n“I was practicing this afternoon and landed badly.”\n\nSakuya set down her cup and pressed the side of Meiling's knee. Meiling drew a sharp breath.\n\n“You call this landing badly?”\n\n“It'll be fine by morning.”\n\n“You said that last time.”\n\nMeiling moved aside to give her a little more room.\n\n“It took enough effort to get you out here. Don't start lecturing me yet.”\n\nSakuya withdrew her hand, though she committed the location of the swelling to memory. Moonlight shimmered across the fountain, whose flowing water made every sound from inside the mansion seem distant. She took two sips of tea, then reached for her pocket watch again.\n\n“Milady's tea has already been delivered, and the kitchen has been put in order,” Meiling said. “I checked before coming here.”\n\n“The silverware has not been counted.”\n\n“Can it not wait until tomorrow? Is one spoon going to disappear?”\n\n“If I wait until one disappears, counting them will be rather too late.”\n\nMeiling burst out laughing. Sakuya shot her a glance, then finally snapped the watch shut.\n\n“You were like this when you first arrived too. Once, your heel was rubbed raw, yet you kept running up and down the corridors without saying a word.”\n\n“You still remember that?”\n\n“You left bloody footprints across a floor I had just cleaned.”\n\nSakuya looked down at her cup. The corner of her mouth shifted slightly.\n\n“Were you the one who put those soft-soled shoes in the cabinet afterward?”\n\n“It took me ages to find out your size. Then you chased me away because the gate couldn't be left unattended.”\n\n“They were too large.”\n\n“But you wore them for a long time.”\n\nThey sat quietly for a while. A light went out in a distant window, and Sakuya instinctively looked up to confirm which floor it was on.\n\nMeiling did not follow her gaze.\n\n“If something hurts now, would you tell me?”\n\n“Nothing does.”\n\n“What if you're tired?”\n\nSakuya turned the cup by its handle but gave no answer. Meiling lifted her own tea and waited until its surface had gone still before she heard Sakuya speak.\n\n“Sometimes, even after everything is done, I still want to make another round. I'm afraid I might have missed something.”\n\n“Things have been too chaotic lately.”\n\n“It happened before that too.”\n\nSakuya rested the cup upon her knees.\n\n“When I first arrived, I did not even know what a maid was supposed to do. Milady allowed me to stay, so I thought that, at the very least, I could keep her from regretting it. Later, everyone began coming to me whenever something needed doing. In a way, that made life easier. I always knew what I was meant to do each day.”\n\n“But eventually, there is nothing left to do.”\n\n“That is why I dislike the night.”\n\nMeiling turned toward her. Sakuya was still watching the darkened window.\n\n“When no one calls for me, I go looking for something else that needs doing. It sounds ridiculous, doesn't it?”\n\n“No wonder you keep inspecting the posts in the middle of the night.”\n\n“I have caught you sleeping on duty.”\n\n“Yes, I'll admit to that one.”\n\nSakuya smiled, then asked, “What about you? We have more guards at the gate now, so why do you still spend all day standing there?”\n\n“I'm used to it.”\n\n“Even with your knee swollen like this, you still couldn't bring yourself to come inside?”\n\nMeiling rubbed the fabric over her knee with her palm, avoiding the place Sakuya had touched.\n\n“The last time someone broke in, I heard the alarm inside the mansion. The first thing I thought was: where are you?”\n\nSakuya turned to face her.\n\n“When you came out later, you had changed your sleeves and said the others had gotten dirty. It wasn't until I saw the original clothes in the laundry that I realized how much blood you had lost.”\n\n“The intruder was dealt with.”\n\n“I know. But every time I close my eyes, I remember him getting past me.”\n\nSeveral drops splashed from the fountain and landed along the edge of the stone steps. Meiling drew back her injured leg, tested it, then slowly stretched it out again.\n\n“I was lecturing you just now, but I'm hardly any better.”\n\nSakuya looked at her knee. A moment passed before she spoke.\n\n“If you fail to report an injury, I arrange the shifts under the assumption that you are fit for duty. If you push yourself until you cannot continue and get hurt again, I will not even have time to find a replacement.”\n\n“I was afraid you'd have to cover for me again.”\n\n“You may ask me first. Do not make that decision on my behalf.”\n\nMeiling nodded.\n\n“Then the same goes for you. Next time you're wounded, don't make me search the laundry to find out.”\n\nSakuya did not agree immediately. She picked up her cup and took a sip of tea that had already gone cold.\n\n“I'm not accustomed to letting others see me like that.”\n\n“When I dress your wounds, I can try to keep my comments to two.”\n\n“Only two?”\n\n“I'll do my best.”\n\nSakuya handed her the cup, then rose and took hold of her arm to help her up.\n\n“Come along. I have medicine in my room. No more training tonight.”\n\nMeiling used her support to stand. The moment her foot touched the ground, her brow tightened. This time, she did not hurry to let go.\n\n“Could you take me off tomorrow morning's shift?”\n\n“Yes.”\n\n“One more thing.”\n\nSakuya waited.\n\n“Next time, come have tea with me before I have to invent a reason to ask. Sitting out here alone isn't much fun.”\n\n“Then come find me sooner. The tea has already gone cold.”\n\n“Is that a yes?”\n\n“You wash the cups.”\n\nMeiling accepted with a smile. They walked slowly back through the garden together. When they reached the threshold, Sakuya took the cups from her hands and let Meiling lean upon her shoulder as she stepped across."

 KYO_meiling_gardening:"Keep the Gates in Order"
 KYO_meiling_gardening_desc:"During the morning patrol, Meiling noticed that the iron gates were sticking. Old grease and metal filings had collected beneath the hinge cover. A corner of the gatepost was cracked, and fallen leaves had clogged the drain beside the garden. She pushed the gates twice, noted the repairs needed, and went to fetch her tools.\n\nOnce her relief was in position, she removed the cover and cleaned the hinges. The loose edges of the gatepost had to be chipped away before fresh mortar could be applied and left to dry. While she waited, she cleared the drain, worked the soil, and pruned the roses bent and broken by the weather. She had meant to finish in a day. Toward evening, she realized that the muddy footprints on the steps still had not been washed away.\n\nKoakuma brought sweets and called her in. Meiling said she would come as soon as she had tidied up. By the time she finished drying the tools, everyone had left the banquet hall. The following day, she used another break to touch up the paint. Her shoulder ached whenever she raised her arm, but she still wanted to straighten one more section of the garden trellis.\n\nPassing by, Patchouli asked whether she intended to renovate the entire mansion herself. Meiling smiled and said there was only a little left. Sakuya had heard that before. She brought the duty roster and asked Meiling to point out when she planned to rest. After studying it for a while, Meiling promised to make up the time once she was done, then crouched to inspect the joints between the steps.\n\nOn the third night, the gates finally swung smoothly. The paint was not quite dry, so she marked it to warn people passing through. The garden paths were neat again, and all the pruned branches had been carried away. Sitting on the steps, she flexed her stiff fingers and only then remembered that she had missed dinner with everyone again.\n\nIf Remilia came, she would probably see no more than a clean gate. Meiling thought that hearing a single “well done” would make these days of work worthwhile. She brushed the dust from her skirt, returned the tools, and went back to take her shift at the gate. Someone had saved her sweets inside, but she would have to wait until the next change of guard to collect them."

 KYO_meiling_daughter_of_dragon:"Descendants of the Chinese Dragon"
 KYO_meiling_daughter_of_dragon_desc:"The guard at my door, I first saw her in Shanghai, after the collapse of the Qing Dynasty—that city was like a pot that was too full, the whistles of the docks, the sirens of the concessions, the secret codes of the gangs, the gunshots of the warlords, all mixed in the same layer of damp night air.\n\n Shanghai at that time did not believe in rules, only in power. The flags at the street corners changed every few days, today it was this warlord's soldiers, tomorrow it was another family's guns. The laughter in the restaurant was deafening; you might collapse halfway through a laugh. The lanterns in the alley were still lit, but your shadow was already calculating your worth.\n\n I was just passing through. Such places were nothing new to me—human chaos is always pretty much the same, just with a different name.\n\n But in that place, the gears of my fate began to turn; there I met Hong Meiling, the incarnation of the dragon."

KYO_meiling_sleepy_head:"A Gatekeeper Sworn to Defend the Mansion"
KYO_meiling_sleepy_head_desc:"Meiling was yawning against a gatepost when a movement in the branches caught her attention, out of step with the wind. She looked up and called for its source to show herself. Aya Shameimaru folded her wings and landed beyond the steps, camera still in hand.\n\nAya did not deny why she had come. Megumu Iizunamaru had sent her to see what the mansion had been doing lately. She called it a journalist's work. Meiling looked at the lens and told her she could ask questions outside the gates, but could not photograph the grounds without permission. Aya deliberately raised the camera and asked what would happen if she did.\n\nMeiling moved half a step forward. Riding the wind, Aya skimmed past the steps and was about to slip beyond the gatepost for a shot when a hand blocked her lens. She turned sharply and brushed past Meiling's sleeve as she withdrew. This time, she never pressed the shutter.\n\nThe next several attempts all centered on the entrance. Aya leaped high, then darted low, trying to lure Meiling away from the gate. Meiling held to those few paces, striking only when Aya approached and cutting off every angle into the corridor and the depths of the garden. Disturbed petals covered the steps. Neither woman fell.\n\nAya stopped outside the gates and rolled her wrist, complaining that the gatekeeper would not even allow her one decent photograph. Meiling brushed petals from her sleeve and asked how many more attempts she intended to make. Aya smiled, hung the camera back around her neck, and instead asked whether the mansion really had so much to hide.\n\n“If you want information, follow the rules,” Meiling answered. “And tell Megumu Iizunamaru not to send her scouts inside.”\n\nAya promised to pass on the message, adding that she would be more careful next time. She sprang into the treetops and left on the wind. Meiling waited until she was out of sight before inspecting the iron gates and nearby flowers and recording where they had exchanged blows. The tengu would find new angles from which to spy. First, she needed to establish how much Aya had seen today.\n\nShe put the notes away, returned to the gatepost, and finished her interrupted yawn."

 KYO_remilia_intro:"Scarlet Devil Mansion's Master Remilia Scarlet"
 KYO_remilia_intro_desc:"Remilia Scarlet was the master of Scarlet Devil Mansion, and also the most “etiquette-conscious” person in the night. When she held her wine glass, it was as if she were hosting a never-ending ball; her tone was gentle, but her eyes seemed to measure every possible escape route.\n\n She could see the threads of fate, able to mold “chance” into “inevitability.” Ironically, though, she could rewrite others' destinies, yet couldn't grasp her own.\n\n She witnessed the rise of humanity in Europe. Not through mythology, but through gunpowder, gears, academies, and the smoke of workshops. The light of that new era illuminated the ancient darkness, leaving it nowhere to hide. She watched vampire castles ablaze, stone walls cracking in the flames, family crests crumbling in the ashes; not defeat, but being kicked off the stage by the rules of the world.\n\n She also witnessed something even crueler—her sister. Flandre wasn't someone “defeated,” she was someone pushed to the extreme by the tide. The more the world rejects monsters, the more Flandre resembles a key out of control: capable of opening any lock, and tearing down an entire door and wall along with it. Her laughter is too soft, her destruction too absolute; each outburst is like a reminder to Remilia: this is not a problem that enemies can solve, this is a calamity in her blood.\n\n So Remilia puts away her childishness, her willfulness, and transforms everything into something more like “rule.” She is no longer just a name whispered in the night—she wants to become the system, the banner, the queen who will teach the world to fear again.\n\n Because she knows that if she doesn't take power, fate will devour her and her sister."

 KYO_remilia_queen:"Vampire Queen"
KYO_remilia_queen_desc:"Remilia's stance was never built on debate; it was based on one conclusion: fate was the enemy.\n\n She didn't believe “obedience” would bring survival. Vampires once ruled the night, but were banished from history in the dawn of civilization. She witnessed her kind disappear one by one, like old words erased by the new era. So she made up her mind—she would rebel against the pre-written script.\n\n She wanted a throne, not just the throne of Scarlet Devil Mansion, but a throne that extended to Europe, to the entire world. She wanted to turn fear into law, night into borders, to bring the existence of vampires from legend into reality, and to make any “rise” bow before her.\n\n But the deepest motivation for this journey wasn't glory.\n\n It was Flandre.\n\n Her sister's power was like an endless thunderstorm—beautiful, dangerous, and unpredictable. Remilia could temporarily suppress her with commands and shackles, but she knew that wasn't the solution. What she wanted wasn't “imprisonment,” but for Flandre to breathe normally and live without destruction.\n\n Whenever she saw the pair of crystal-adorned, now tattered wings on Flandre's back, she remembered that night that changed everything. Cannons blasted through the city walls, firearms tore through the night, and humans burned their homes to the ground. It was on that night that Flandre lost control, becoming a calamity that even her older sister dared not approach.\n\n Those wings were more than just scars.\n\n They were a mockery left by fate, a past she could never shake off, no matter where she went.\n\n Patchouli, having received the order to help Flandre, didn't give her a ready-made answer.\n She simply buried herself in books, spells, and bloodline studies, trying to find a way to help Remilia—regardless of whether that method ultimately pointed to the source of the past, a crack in the bloodline, or some forbidden technology capable of rewriting destiny itself.\n\n Remilia thus understood that she had no right to stop. As long as she wanted to save her sister, she couldn't just guard the Scarlet Devil Mansion, nor could she be content with a corner of Gensokyo. She had to continue seizing power, expanding her territory, forcing the world to make way for her, until one day, even fate could no longer treat Flandre as an out-of-control disaster.\n\n She raised her glass, as if saluting an unseen adversary.\n\n “Fate wants to trap me here?” Her smile was elegant to the point of being cold.\n\n “Then I'll drag the whole world into my night.”\n\n She would become queen. Not for praise.\n But so that her sister—would no longer be treated as a disaster by fate."

 KYO_remilia_hello_satori:"Remilia's Majesty Stands Unshaken"
 KYO_remilia_hello_satori_desc:"Guards already lined the square when Satono Nishida and Mai Teireida were brought onto the platform. They had carried messages for the remnants of the Yakumo forces, covered their retreats, and maintained contact with Okina. Remilia had summoned representatives from every faction to witness the execution in full.\n\nSatono's dancing clothes were torn, the bells on her wrists trapped beneath the knots of her bonds. Mai stood beside her, watching the edge of the platform and the crowd, waiting for a familiar back door that never opened. Remilia read out their names, then asked whether, through all their errands for a defeated army, they had ever imagined ending here.\n\n“At least we never knelt,” Satono replied.\n\nRemilia put down her wineglass and ordered the guards to bring them closer. Asked whether she had anything to say, Mai answered, “The back doors won't stay shut forever.” Someone in the crowd raised their head, then quickly lowered it when the queen looked their way.\n\n“Then let your mistress come for you.” Remilia waited a while, then gestured toward the execution block. No rescuer appeared. She called the guards to a halt again, remarking that since two dancers had come, surely the audience ought to see a performance.\n\nSatono raised her wrists, but the ropes bound her arms tightly. She struggled to straighten. The bells struck together and rang just once. Watching her knees tremble, Remilia smiled and asked whether she was afraid. Satono gave no answer. Only as she was forced toward the block did she struggle to look back. “Do you think this means you've won?”\n\nAt the command, the executioner brought the blade down twice in succession. Guards hung up both heads and ordered anyone trying to leave back into place. Some clutched their companions' sleeves. Others refused to look up until a shove from a rifle butt made them face the platform.\n\nRemilia ordered their names displayed beneath them, along with an account of their service to the Yakumo faction. She wanted everyone still in hiding to know that the Scarlet Devil Mansion would pursue them one by one. After the square was dismissed, the two dancers remained on public display. Passersby quickened their steps, but the whispers about whether the back doors would open again did not end with the execution."

KYO_remilia_hello_miko:"An Incident at the Scarlet Devil Mansion"
KYO_remilia_hello_miko_desc:"The square before the Scarlet Devil Mansion was crowded with people waiting to hear the proclamation. Those who had surrendered stood beneath the banners. Humans and youkai mingled in the crowd, waiting to learn how their new ruler would treat them. Remilia climbed the steps and told them that henceforth, orders would come from here. As someone began to cheer, she raised a hand. “Remember whom you are to obey. That will suffice.”\n\nNazrin stood at the back, hiding the pagoda Shou Toramaru had left behind beneath her cloak. She had waited a long time, watching the guards change positions and Remilia move from beside the throne to the edge of the steps. The pagoda pressed into her palm. She tightened her grip and softly called Lady Shou's name.\n\nA beam of light shot from the crowd, grazed past Remilia, and pierced the outer wall behind her. Window frames fell with the rubble, and thick smoke billowed from a burning room. People in the front ranks were knocked down while those behind struggled to flee. A fallen flagpole blocked the way to the edge of the square.\n\nRemilia looked back at the hole in the wall, then turned toward the source of the beam. Nazrin's cloak had been pulled off in the crush, and the pagoda still glimmered. She tried to raise it again, but the surrounding guards were already closing in.\n\n“Myouren Temple will never forgive you!” she shouted. Half her words were swallowed by the fleeing crowd, but her eyes remained fixed on the vampire above the steps. Byakuren and Shou were dead. She had hoped this one strike would leave Remilia lying here as well.\n\nThe queen ordered her taken alive. Guards seized the pagoda and pinned her arms. Dragged across the square, she kept turning back to hurl abuse. Remilia did not execute her on the spot. She ordered her confined to the dungeon for questioning, then told the remaining guards to seal the exits and search for accomplices.\n\nThe fire was still burning, and those who had not escaped were made to remain. Some held injured relatives. Others stared at the pagoda in the guards' hands and dared not lift their heads again. Remilia returned to the center of the steps and resumed issuing orders once order had been restored. Smoke continued to pour from the shattered windows behind her. Between her sentences, the square could hear the beams cracking in the fire."

 KYO_remilia_vampire:"The cruel removal of religion establishes vampires"
 KYO_remilia_vampire_desc:"The beginnings of religions are always similar.\n\n First, they offer you a word of comfort—“God will protect you.”\n Then they give you an exit—“God bless you.”\n Finally, they provide a way out—“It's okay to die, you will be reincarnated, you will come again.”\n\n Humans are too small in the face of fate, so they invent something bigger to support themselves. God, destiny, reincarnation, redemption. It sounds gentle, but it's actually very practical: it makes you endure, makes you wait, makes you shut up, makes you swallow your resentment.\n\n I've seen those “blessings” fall into the firelight.\n The castle is burning, the stone walls are collapsing, and screams shatter in the night. Some held crosses, some held prayer beads, all chanting the same phrase—“Please save me.”\n\n And the result?\n The flames still climbed upwards.\n Lives were still taken.\n\n God didn't reach out, and heaven didn't respond. Once, a clergyman stood before the ruins, saying to the trembling, weeping crowd, “Don't be afraid, this is a test.\n\n You will be saved.”\n I was there. I asked him, “Who will be saved?”\n\n He paused, but still maintained his smile.\n\n “Just believe, and you will—” I interrupted him.\n\n “You're quite the talker.” I took a step closer, letting him see my shadow clearly.\n “You've disguised “helplessness” as “arrangement,” and “loss” as “blessing.”\n\n You're not saving people; you're preventing them from resisting.”\n He wanted to back away, but stubbornly persisted.\n\n “That's blasphemy.” I laughed.\n\n “Blasphemy? No.” “I just hate deception.”\n Because fate won't change course just because you kneel longer. It only sees whether you have the strength, the courage, and the firmness of your grip.\n\n Therefore, resisting fate is inevitable. And rebelling against religion—those who use “divine will” as chains—is just as inevitable.\n\n I don't need people to love me.\n I don't need them to understand me. I just need them to stop handing their necks to a set of fabricated rules.\n\n From this day forward, the phrase “God will decide for you” will no longer be permitted in the territory of Scarlet Devil Mansion.\n\n The bells will stop, the incense will be extinguished, and the pulpit will be silent.\n\n Want to pray? Sure.\n In your own room. Want to proselytize? No.\n\n Put away that script of comforting others.\n For in my hands, fate only recognizes two things: Strength, and obedience.\n\n You can place your hopes in the sky. You can also reach into reality.\n\n But don't expect foolish myths to change your fate.\n I've seen too much ashes; I know that won't happen."

 KYO_remilia_b_positive:"The Scarlet Devil"
 KYO_remilia_b_positive_desc:"Under Remilia's rule, the world was divided into two scenes, like two seasons crammed onto the same map. The first was obedience.\n\n Wherever the flag of Scarlet Devil Mansion was planted, things began to “get better.” Roads were widened, warehouses were filled with sacks of grain, and factory chimneys spewed heat and steel day and night. Rationing schedules became punctual, medicine was no longer unavailable, patrols on the streets moved with rhythm, and even nighttime security seemed to be tethered.\n\n People learned to add honorifics before her name.\n\n “Lady Remilia is wise.” “She saved us.”\n\n “With her here, at least things won't be chaotic.”\n\n They spoke sincerely because their bowls were indeed full.\n They also spoke quickly because everyone around them was echoing them. The second type is resistance.\n\n Those who resist don't leave behind stories, only empty spaces.\n\n The line on the list was crossed out, the name on the household register was blacked out, and the plaque at the door was removed. The next morning, you'll find your neighbor gone: the windows are closed, the bed is neatly made, the bowl is still on the table, as if he just went out to buy something. But he didn't come back.\n\n Because “enemy” here isn't an identity, it's a process.\n\n The clerks at Scarlet Devil Mansion will give you your final farewell: Your name is taken back and replaced with a number.\n\n The reason doesn't need explanation, because the reason will cause discussion.\n Discussion will cause problems.\n\n So they're left with only numbers.\n\n With tags around their necks and thick ropes around their hands, they're not allowed to look back as they enter the truck. If someone tries to call out a family member's name, their mouth is immediately gagged; if someone tries to struggle, their knees are forced to kneel first.\n\n Once the door closes, those outside pretend they didn't see anything.\n The labor camp isn't marked on the map.\n\n It only exists in everyone's heart, in that direction they dare not speak aloud.\n There's no talk of faith, no talk of salvation, no talk of going home.\n Only shifts, whistles, barbed wire, and the daily repetition of labor.\n\n You'll learn to answer with numbers.\n\n You'll learn to swallow your pain.\n You'll learn to stop asking “why.”\n Some don't make it to the end. The file is stamped “closed.”\n\n No tombstones, no names, as if they never existed.\n\n But the most ironic thing is— The city remains prosperous.\n\n The market remains bustling. Children still chase each other on street corners.\n The better the obedient live, the more the rebels seem like a necessary purge.\n\n People began to describe fear as order, disappearance as stability, and blood as the price.\n\n Some privately said Remilia was a demon. But many more would smile in public, raise a glass, and call her “savior.”\n\n Because in this new world, good and evil are not determined by God.\n\n But by her. You can choose to eat your fill in her shadow.\n Or you can choose to be erased outside the shadow.\n\n Both paths are clear.\n And clarity itself is a form of oppression."

 KYO_flandre_intro:"Flandre Scarlet, sister of the master of Scarlet Devil Mansion"
KYO_flandre_intro_desc:"Everything outside Scarlet Devil Mansion could be organized into rules by Remilia.\n Where to plant flags, who should kneel, who should live, who should disappear—she only needed to raise her hand, and the world would turn in her direction.\n\n But there was a place inside the door, a place her commands could not enter.\n\n The basement. There were no candlelight banquets there, no etiquette of the corridors. Only heavy doors, the repeated sound of locking, and a coldness that had never seen the light of day. The air was mixed with the smell of old cloth, rust, and dried blood, like a cry that had been suppressed for too long.\n\n Flandre Scarlet lived there.\n\n Her room was large, but it didn't feel like a room; it was more like a forgotten box. Countless scratches, varying in depth, marked the walls, as if someone had repeatedly tried to dig themselves out. The floor was littered with the remains of dolls: fabric spilled from the tears, glass eyes rolled into corners, and loose threads tangled like dried blood vessels. Some dolls were torn in half, some had their necks broken, and several were neatly arranged in a row—like she was trying to rearrange the chaos, only to lose patience the next second. She rarely spoke.\n\n When she did speak, it was very soft, as if she were talking to herself.\n\n Sometimes she sat on the edge of the bed, swinging her legs, laughing like a child.\n Sometimes she stared blankly at her fingertips, her expression frighteningly empty.\n\n Then, in a sudden moment, she would grab a doll. *Snap*.\n\n With a flick of her finger, the fabric tore first, then the skeleton snapped. The sound was short and clean, like snapping a thin piece of wood.\n\n She didn't mean to be cruel.\n She just couldn't distinguish “force”.\n\n The scariest thing wasn't that she wanted to destroy, but that it was too easy for her to do so.\n\n Long ago, she was just an ordinary vampire, like Remilia.\n She would throw tantrums, act spoiled, and laugh for half a day over a single word from her sister.\n\n But the world changed. Human gunpowder was more potent, the smoke from workshops was thicker, and the light of day forced the night to retreat. These new rules flooded the bloodlines of ancient tribes like a tide, pushing what could previously be controlled to extremes. Flandre's power began to lose its shape, like an overly direct “negation”: she could crush the core of things with a single glance.\n\n Castles could crumble.\n\n People could crumble too. She knew this herself.\n So she smiled sweeter, spoke more innocently, as if trying to wrap horror in a fairy tale.\n\n “I didn't use any force.”\n “It broke on its own.”\n\n When Remilia first ordered her locked up, she didn't resist, she didn't defy. She simply waited calmly for the door to close.\n The heavy latches clicked.\n It wasn't punishment. It was isolation.\n\n To prevent her from destroying things.\n\n Also, to prevent her from being disposed of under the guise of “punishment.”\n\n From then on, the more stable the outside of Scarlet Devil Mansion became, the more the basement resembled a crack.\n People outside called Remilia the Queen.\n But those inside were like abandoned calamities. Flandre wasn't a monster.\n\n She was more like someone abandoned by the times—too old, too out of step with the rules of the new world, so she could only be hidden away. She was utterly lonely.\n\n So lonely that she started talking to dolls, started apologizing for broken things, started piecing together tattered cloths piece by piece in the corner.\n\n But the next second after piecing it back together, she would tear it to shreds again.\n\n Because what she wanted wasn't toys.\n What she wanted was for someone to come in, hold her hand, and tell her: Don't be afraid.\n\n But the lock was too thick.\n And the outside world wouldn't wait for her to learn to control herself."

 KYO_flandre_princese:"The Vampire Princess"
 KYO_flandre_princese_desc:"Flandre lined her broken dolls against the wall, propped up the last eyeless member of her audience, and climbed onto her chair. Today, she was telling the story of the Scarlet family again. When she reached their old castle, she imitated the way her sister's mouth curved upward at a compliment. She also remembered being lifted and spun around, her skirt brushing against her sister's hands.\n\nSometimes she could not say which windows had shattered first. But she remembered the cannon fire exactly, along with the burning door and the shoe left in the corridor. She had wanted to fetch it. Her sister had pulled her away and scolded her more fiercely than usual: “Don't look back.” Here, Flandre tucked her feet beneath the chair and paused before continuing.\n\nThe castle was gone, and they had moved through many lodgings in Europe. Her sister always said they were only staying for a while, but the luggage was never out of reach. Flandre used dolls to mark Paris, Vienna, and a port whose name she had forgotten. She set one down too hard, and its broken arm fell off again. She picked it up and laid it in the doll's lap. “You'll have to sit like that for now.”\n\nLater, they heard of Gensokyo and followed the clues eastward. Flandre laid scraps of thread on the floor to trace the Middle East and the Silk Road, naming cities under her breath and skipping the places she could not remember. They had traveled mostly at night, finding shelter to rest during the day. She hated getting sand in her shoes, but always had to stay close to her sister. She remembered the later ports and ships too, and added to the route as she spoke.\n\n“My sister said we'd have a home when we got there,” she told the dolls.\n\nThey had reached Gensokyo long ago. Now Flandre could hear maids passing beyond the basement door, yet she often ended the story before their arrival. She clasped one hand in the other, trying to remember her sister's grip during the journey. Back then, she had feared being separated. Later, she had come to fear an accident that might break the person holding her hand.\n\nOne doll slowly toppled over. She immediately climbed down to set it upright and asked whether it had heard the last sentence. No answer came. Flandre glanced toward the door and moved the rest of her audience a little closer.\n\n“That's all for today. Tomorrow, I'll tell you what happened next.”"

 KYO_flandre_hello_rumia:"My Sister's Troubled Mind"
 KYO_flandre_hello_rumia_desc:"Last night, Flandre had sewn her doll's belly shut and found it an eye of the wrong size. Today it sat on the table with one eye higher than the other, untrimmed threads peeking from its skirt. She had promised not to break it again once it was mended.\n\nHalfway toward it, her fingertips began to ache. Flandre stopped and stared at the little space before her palm. Only when the ache turned into an urge to close her fingers did she snatch her hand back to her chest.\n\n“Don't touch,” she told herself.\n\nThe doll was still sitting unharmed. She walked around the table, hoping to try from another angle, but as she approached she noticed the loose thread first. It swayed gently. She immediately backed away and seized her own wrist, almost calling out for her sister. A moment passed before she realized that the doll had not broken and the thread had stopped moving.\n\n“If only you were a little sturdier,” she complained to it, then lowered her head. “I didn't sew you very well. That's not your fault.”\n\nShe remembered the days when she could simply scoop a doll into her arms and carry it away. She tried to reach out as she had then, but could not make the movement feel natural. The more she watched her knuckles, the more aware she became of the power there. She went to the door and called for her sister. When no answer came, she returned to the table alone.\n\nShe had already decided what to say when her sister arrived: she had practiced today, the doll was still here, and she had not broken the cup either. That thought sent her to inspect the cup. Only after confirming there were no cracks did she feel a little reassured. If everything remained intact, perhaps her sister would not have to check the walls first when she entered.\n\nThis time, Flandre crouched and rested just her fingertips against the doll's sleeve. The fabric was soft. She waited a long time before slowly lifting it into her arms. She wanted to call someone over to see, but her excitement made her arms tighten, frightening her into quickly returning the doll to the table.\n\n“Look. I did it,” she said very quietly.\n\nFlandre arranged its skirt and sat beside it, making no further attempt. Her hands were still shaking, so she hid them in her sleeves and waited for the next sound of the door opening. The doll sat with her, whole. She looked at it again and again, then quietly added, “Tomorrow too.”"

 KYO_flandre_hello_koishi:"The Devil Abroad"
 KYO_flandre_hello_koishi_desc:"Flandre touched her lips with a fingertip. There was no blood in the basement, yet she tasted that sweetness again and could not help smiling. Then she hurriedly looked toward the dolls by the wall and explained that she had only remembered something from long ago.\n\nIt had happened in a village they passed through while fleeing. Wooden houses were burning, and people ran out through the smoke. Some carried guns; others carried children. She remembered their loud cries and reaching out to make the noise stop. When her fingers closed, the rooftops and running figures broke apart together.\n\n“I only wanted to touch them,” she said, making the gesture again.\n\nA doll toppled against the wall. She quickly caught her own wrist. She could no longer remember all the panic she had felt when she first acted, but the relief when the noise finally stopped was still there in her body. She had even wanted to try again. That was harder to shake off than the smell of blood. The more she tried to explain, the less she knew where to begin.\n\nAfterward, her sister had stood at the entrance to the village without coming closer straight away. Flandre remembered the hand hanging by her side. She also remembered waiting a long time for her to scold her, or to pull her away as she usually did.\n\n“She must have been afraid of me,” Flandre told the dolls.\n\nShe began talking about the castle and the people who had driven them out. Without the cannon fire and the pursuit, perhaps she would still be fighting her sister over sweets, and the only things she broke would be toys. She spoke quickly until she remembered the person carrying a child in the village. Then she stopped. She did not know whether that person had ever taken part in the hunt.\n\nHer fingers began to curl again without her willing it. Flandre trapped both hands between her knees and looked toward the basement door. When her sister had left her here, she had angrily asked why everyone else could go outside except her. Now she remembered the distance between them at the village entrance and dared not ask again.\n\n“I know I have to control myself,” she whispered. “But I still smiled just now.”\n\nNo one answered. She waited a while, then buried her face in her arms. Footsteps still passed outside from time to time. Whenever she heard them, her fingers tensed. Only when the sounds had faded did she slowly let them relax."

 KYO_flandre_vampire:0 "Build Bonds Between Flandre and the Maids"

KYO_flandre_vampire_desc:0 "The moment the footsteps outside the basement door stopped, Flandre set down her doll and looked up expectantly.\n\nMost of the time, it was Remilia. She brought new books and sweets, sat with her sister whenever she had time, and asked what Flandre wanted next before leaving. Everyone else delivered their items to the top of the stairs and entrusted Remilia to carry them inside.\n\nOne day, Flandre asked the name of the maid who carried the trays.\n\n“She has come here many times,” Flandre said. “But whenever I look at her, she leaves.”\n\nRemilia did not reprimand the maid. The basement door had been replaced twice, and everyone who delivered meals had seen the cracks in the walls. She merely realized that her sister had learned to distinguish visitors by their footsteps, yet had never been given the chance to exchange even a greeting with them.\n\nShe went to the Great Library to find Patchouli.\n\n“I want to bring her upstairs. Is there any way to keep her from immediately losing control when she becomes excited?”\n\nPatchouli retrieved several pages of notes and placed them between them.\n\n“I can add another restraint. It will dull her responses. At first, even touching something may feel as though there is a layer between them. Its effects will also require observation. She cannot be left alone immediately after the spell is applied.”\n\nRemilia finished reading and pushed the papers back.\n\n“Try it. I will remain with her.”\n\nThroughout the ritual, Flandre clung to her sister's hand. As the runes gradually lit up, she frowned and repeatedly loosened and tightened her fingers.\n\n“Big sister, I can't feel your hand properly.”\n\n“You are still holding it.”\n\nRemilia kept her hand in place until Flandre found her grip again. Patchouli inspected the spell, then had her lift a cup and put it down. Only after repeating the test several times did she allow the sisters to attempt leaving the room.\n\nFlandre stopped at the threshold.\n\n“Will they hide from me?”\n\n“You will meet Sakuya first. If you grow tired, we will return.”\n\nSakuya was already waiting at the top of the stairs. She bowed and stepped aside without reaching out or urging Flandre forward. Holding the railing, Flandre climbed the stairs. Upon reaching the corridor, however, she recoiled to her sister's side when a maid approached from the opposite direction.\n\nA teaspoon rattled upon the tray. The maid stopped as well.\n\nSakuya took the tray, freeing the maid's hands so she could bow. Flandre watched her for a moment before asking quietly:\n\n“Were you the one who brought my sweets before?”\n\n“Yes, Young Mistress.”\n\n“The red one last time was delicious.”\n\nThe maid glanced at Remilia before answering. “It was raspberry jam. There is still some left in the kitchen.”\n\n“Will there be more tomorrow?”\n\n“I will ask.”\n\nShe took two steps forward, then turned back and gave Flandre her name. This time, Flandre repeated it after her.\n\nThey remained in the corridor for only a short while that afternoon. Flandre was still unaccustomed to the numbness caused by the spell and needed both hands to hold her teacup. Even after setting down the sweets, the maid continued to keep her distance.\n\nRemilia ordered another chair brought over. Flandre sat beside her and slowly finished the cake on her plate. When the maid returned to clear the table, Flandre still remembered her name.\n\n“See you tomorrow.”\n\nThe maid steadied the tray in her arms and nodded to her."

 KYO_flandre_hate_blood:0 "Sister of the Devil"

KYO_flandre_hate_blood_desc:0 "Aya Shameimaru had originally intended only to photograph the Scarlet Devil Mansion's newly installed guard posts.\n\nAt dusk, the scarlet mist thinned slightly. Perched in the treetops, she moved her lens along the corridor windows. When Remilia entered the frame, a blonde girl was walking beside her. Aya nearly pressed the shutter by reflex, then stopped and readjusted the focus.\n\nThose wings were unmistakable. For years, every rumor about the Scarlet Devil Mansion's other young mistress had mentioned the multicolored crystals suspended from them.\n\nThe girl walked slowly. Remilia had already passed the next window while she remained where she was, gazing at the fountain in the garden. Only when her sister turned back did she hurry after her and take hold of Remilia's sleeve.\n\nAya took several photographs in quick succession.\n\nEven after the sisters disappeared at the end of the corridor, she continued staring through the viewfinder. No shattered windows. No maids fleeing for their lives. The sister supposedly imprisoned in the basement had merely stopped to watch the water for a while.\n\nThat was worth far more than a new guard post.\n\nThe following day, Hatate Himekaidou arrived with a telescope and spent the afternoon watching from farther away. As daylight began to fade, she too spotted the girl. Her dress and wings matched Aya's photographs exactly. This time Sakuya accompanied them as the three walked from the corridor into the garden. When they reached the steps, Flandre paused.\n\n“She really is outside.” Hatate lowered her telescope. “Have you questioned anyone at the mansion?”\n\n“I tried. No one would talk.”\n\n“Then we haven't even confirmed whether she actually spent all those years in the basement.”\n\nAya packed away her camera.\n\n“At least we now know that Remilia truly has a sister.”\n\n“How are you going to report it?”\n\n“First, I develop the photographs.”\n\nThat evening, photographs covered Aya's desk. Several showed only the window frames, while Remilia's shoulder blocked another. The final selection was the clearest: Flandre stood beside one of the corridor pillars, half her face concealed in shadow, her gaze directed beyond the garden.\n\nShe had been looking at the fountain. The readers would see no fountain in the photograph.\n\nAya placed the image on the page and wrote the headline:\n\n“THE SECOND SCARLET OF THE MANSION—SISTER OF THE DEVIL REVEALED.”\n\nThe article listed the times of both sightings and described Flandre's appearance and companions before revisiting the old rumors about the basement. When Aya reached the question of why Flandre had appeared now, her pen stopped. Nothing in her interview notes could provide an answer.\n\nShe concluded by mentioning the Scarlet Devil Mansion's recent tightening of security.\n\nElsewhere, Hatate crossed out “now under control” and replaced it with “still under close watch?” She had questioned more of the nearby residents than Aya, yet their accounts contradicted one another. Some claimed to have heard violent crashes from inside the mansion. Others insisted that the younger sister had died long ago. A few could not even tell the Scarlet sisters apart.\n\nOnly a handful of facts could be confirmed. The remaining speculation was already enough to fill an entire page.\n\nThe special edition of the Kakashi Spirit News ended with a question: the Scarlet Devil Mansion had long refused to explain the circumstances of this member of its household, yet now permitted her to appear where outsiders could see her. Did this mean that she would take part in the mansion's forthcoming operations?\n\nBoth newspapers reached the Human Village the following day.\n\nAt a tea stall, one reader pointed at the photograph and remarked that, after being confined for so long, the younger sister deserved a chance to walk outside. The person beside him asked when the Scarlet Devil Mansion had ever relaxed its security out of simple kindness. Someone else brought up a missing neighbor and suggested that the basement might have been involved. When asked for evidence, he replied that everyone had heard the same rumors.\n\nThe newspaper seller soon brought out another stack. At first, customers merely wanted to see what Remilia's sister looked like. By afternoon, newcomers were asking whether the Scarlet Devil Mansion was preparing to make another move.\n\nOne reader studied the photograph for a long time and remarked only that the child looked unwell. His companion folded the newspaper and reminded him that she was a youkai of the Scarlet family.\n\nAmong the letters of introduction delivered to the mansion that day were several inquiries about the younger sister's well-being. Their language was unfailingly polite. Some offered gifts, while others requested permission to meet her. Not one openly stated what they were truly afraid of.\n\nSakuya received the letters together, while their bearers were asked, as usual, to wait outside the gates.\n\nUp in the tree, Aya replaced the roll of film in her camera. Hatate asked whether she intended to keep watch tomorrow.\n\n“I do.” Aya aimed the lens back toward the corridor. “Someone brought two gifts today. I want to see who receives the second one.”"

 KYO_patchouli_intro:"Librarian Patchouli Knowledge"
 KYO_patchouli_intro_desc:"The quietest place in Scarlet Devil Mansion isn't the corridors or the basement.\n It's the great library.\n\n The air there is always chilly, the smell of paper is like ash, and the candlelight is fragmented by the high walls and book spines. You might think it's a scholar's haven, but it's more like an armory—except the weapons aren't guns and knives, but formulas, spells, and information that can drive you to the brink of despair.\n\n Patchouli Knowledge sits deep within the piles of books, like an unmoving stone.\n Her face is pale, her breathing is light, and her coughs come suddenly, as if her body is about to protest. But her eyes are never weak. She doesn't read for appreciation, but for control.\n\n She doesn't like wasting words.\n She doesn't like superfluous emotions.\n She especially dislikes others using “mystery” as decoration.\n\n This library holds taboos and secrets, and even more dangerous things—history forbidden to be revealed, names rewritten, and truths that keep certain forces awake at night. Many would say these books are “too dark,” that this knowledge “shouldn't be touched.” Patchouli simply turns the pages. “If you don't touch it, you'll still die.”\n\n Her assistant, Koakuma, moves among the bookshelves like a tireless shadow.\n Her laughter is flippant, but her hands and feet are swift: borrowing, filing, copying, sealing, re-inking, changing candles. She seems to be playing, but in reality, every step is meticulously planned. Patchouli coughs, and she places the water within easy reach; Patchouli stops writing, and she turns to the correct page of the next volume. “You put the seventh row of talismans in the wrong place again.”\n\n Patchouli didn't look up. “No, I put it in an “easier-to-reach” spot.”\n\n Koakuma blinked. Patchouli closed the book, her voice short. “Put it back in its place.”\n\n Koakuma stuck out her tongue but did as she was told. They managed the entire building's knowledge like a sophisticated machine. Patchouli was responsible for judging what was usable, what should be sealed, and what needed to be rewritten without leaving a trace; Koakuma was responsible for keeping the process running, ensuring every danger was properly put back in its cage.\n\n Those outside looking at Scarlet Devil Mansion only saw the Queen, the army, and that oppressive order.\n\n The real key lies here.\n A spell can make a fortress last longer.\n A sketch can double the workshop's output. A line of annotation can mark the enemy's weakness.\n\n Patchouli knows she's not suited for the battlefield.\n\n So she brings the battlefield into the pages of books. When Scarlet Devil Mansion needs new weapons, new systems, or cleaner methods, the answer is usually not on the meeting table.\n\n In this library.\n In Patchouli's pen. Also in Koakuma's ever-searching hands."

 KYO_patchouli_power:0 "The Unmoving Great Library"

KYO_patchouli_power_desc:0 "The blueprints Remilia had sent lay beneath a paperweight at one corner of the desk. Beside them sat a medicine chest from Eientei. Patchouli opened the chest first, checked the dosage written on each bottle, then instructed Koakuma to hand the visitor a copied grimoire of spells as payment.\n\nThis exchange had continued for a long time. Eientei supplied medicinal herbs and formulas from the Lunar Capital; Patchouli traded rare manuscripts and research records in return. Some copies still required several lines to be removed before delivery, lest the recipient follow the calculations and decipher what she had no intention of surrendering.\n\nThe medicine could suppress her coughing and wheezing. It could not read the books on her desk for her. In cold, damp weather, she still had to put down her pen and wait for the tightness in her chest to subside. Sometimes she managed only half a line before the ink dried upon the nib. Koakuma would remember where she had stopped and place the next volume she needed within reach.\n\nBooks from the depths of the Great Library were seldom loaned out. Forbidden works were sealed in separate cabinets, with one spell placed upon the doors and another upon the pages. A newly arrived maid once tried to wipe away a dark red mark on a book's spine. Patchouli called to her from beyond the shelves, instructed her to put down the cloth, and told her to retreat slowly. Only after the maid had left did Patchouli restore the stroke that the water had damaged.\n\nThe entire row of cabinets rustled throughout the night, as though someone inside were scraping the wood with their fingernails.\n\nKoakuma was now the only one permitted to accompany her into those depths.\n\nBefore summoning her, Patchouli had examined every contract and summoning rite she could find in the library, revising each contradictory clause one by one. Yet once the ritual was complete, her new familiar proved far less obedient than the contract implied. Koakuma peeled back a seal without permission and laughingly asked whether the things inside might also be released to keep them company.\n\nPatchouli drove a binding curse into her shadow. Koakuma's smile froze. The hand reaching toward the cabinet door would no longer obey her command to withdraw.\n\n“Next time, I will seal away your ability to speak your own name.”\n\nOnly after Koakuma lowered her head and submitted did Patchouli release the spell.\n\nFrom then on, filing, transcription, and inspection of the seals followed a fixed sequence. Koakuma still enjoyed her jokes, but her hands rarely made mistakes. When Patchouli coughed too violently to hold her pen, Koakuma steadied the ink bottle before passing her medicine. Whenever someone tried to cross the library's warning wards, she closed the book in her hands and blocked their path without even troubling to address them.\n\nOver time, Remilia sent more and more problems her way. New weapons required testing, factories needed modification, and spells meant to contain the enemy had to be adjusted as the war developed. Patchouli separated the requests, demanded the necessary materials and records, and gradually filled the space around her desk with samples returned from construction sites and battlefields.\n\nThis time, the problem was a barrier that repeatedly failed. Following the blueprints, she reconstructed its formation inside a copper plate. The moment she channeled magic into it, the rim split open.\n\nKoakuma reached for a spare plate, but Patchouli signaled her to wait.\n\n“Bring me the fourth page. It fractured in the same place as last time.”\n\nThey checked the figures again. Only on the third attempt did the copper plate withstand the full impact. Patchouli circled the material that needed replacing, gave Koakuma the required casting sequence, and instructed her to have Sakuya send someone to the site.\n\nOutside the window came the sound of vehicles departing. Patchouli turned over the blueprints and found another letter from Remilia beneath them.\n\n“Another urgent request?” Koakuma asked.\n\nPatchouli opened it and read several lines before pushing her medicine cup aside.\n\n“Fetch the key to the western cabinet. This time, we need the original text.”"

KYO_patchouli_one_Koakuma:"Koakuma Completes the Purge"
KYO_patchouli_one_Koakuma_desc:"While following the clues left by the deaths of the shrine maiden and Yukari Yakumo, Patchouli discovered covert Lunar Capital markings in several supply records. The same symbols appeared at herbalists' shops, merchant caravans, and contact points near temples. Some of the mansion's own purchase orders were among them. She handed the material to Koakuma and ordered her to establish how far the network reached.\n\nKoakuma copied the markings and compared them against documents in the library. Repeated sequences indicated handover dates and evacuation sites, connecting several apparently unrelated transport routes on the map. She first placed the exchanges under observation, then checked the identities of those involved. Only after confirming the hubs did she send out forged evacuation notices.\n\nLunar agents began emerging from their hiding places as the signal reached them. Some took their observation instruments; others hurried to burn documents or made detours to seek confirmation. Koakuma adjusted her arrangements to their reactions, drawing them into prepared spell arrays. Communications were cut, escape routes sealed, and the teams closing the trap moved in. Agents who failed to escape died at their bases. Their equipment and identification papers were secured separately.\n\nOne intercepted contact called out her name and declared that the Lunar Capital would not spare the mansion. Koakuma found a talisman inside his clothes, checked its serial number, and ordered the investigation to follow the message to its recipient. His threat did not save his life.\n\nA few days later, the last known camp in the mountain woods was overrun. Unsent reports detailed changes in the barrier since the shrine maiden's death, the situation following Yukari's death, and plans for further intervention. Koakuma packed those pages in a separate crate. Outside, bodies were being buried. Fresh earth spread along the forest's edge, forcing the people carrying away the equipment to find another route.\n\nBack at the library, Patchouli's first question was which contact points remained unconfirmed. Koakuma handed her a list. Every verified base on Earth had been eliminated, but the remaining leads still required surveillance. Those issuing orders in the Lunar Capital were far away. Even so, the recovered reports and equipment would let them investigate the enemy's arrangements further.\n\nPatchouli kept the evidence crate and told her to revise the mansion's communication and goods-inspection procedures. Koakuma acknowledged the instruction, opened a fresh ledger, and crossed out the names of the contacts whose lines had gone silent."

KYO_patchouli_many_Koakuma:0 "The Secret Deal Is Done"

KYO_patchouli_many_Koakuma_desc:0 "By the time Eientei sent its last patient home, Patchouli and Koakuma were still sitting in the waiting room. They had neither registered for an examination nor brought a prescription. When Eirin noticed the sealed case resting on Koakuma's lap, she told Reisen to retire for the night.\n\n“No more patients tonight.”\n\nOnce the consultation-room door had closed, Patchouli spread several intercepted communications across the desk. Eirin finished the first page and reached for the second, but Koakuma pressed down on its corner before she could take it.\n\n“Please read them in chronological order.”\n\nThe medicinal caravans' itineraries, testimony from their contacts, and translations of classified orders from the Lunar Capital were arranged in sequence. Several trails that had once appeared unrelated had all gone cold after passing through Eientei. Patchouli slid the final record beneath the lamp. The delivery location upon it had been amended in Eirin's own handwriting.\n\n“This man left the following day. By the time we arrived, all we found was what remained of a burned ledger.”\n\nEirin did not touch the page.\n\n“I told him to leave.”\n\n“And the others?”\n\n“The same.”\n\nKoakuma opened the lid of the case completely. Half a case of documents still remained inside.\n\nEirin glanced at her, then turned to Patchouli. “How much do you want to know?”\n\n“Everything since the shrine maiden died. What you discovered—and what you concealed on their behalf.”\n\nThe clock on the wall advanced several marks before Eirin spoke.\n\n“I uncovered their terrestrial network and learned that someone was arranging support for further operations. I intercepted several confidential messages and asked old acquaintances to withdraw their personnel. Had any of this become public, the Lunar Capital might have sent more agents to silence them, while retaliation from Earth would have given them an excuse to intervene.”\n\n“So you did not inform Yukari Yakumo.”\n\n“I believed I could settle it privately.”\n\nPatchouli drew a page from the documents and placed it beside the evacuation record.\n\n“You altered their route. These people never returned to the Lunar Capital. They proceeded to the next base.”\n\nEirin examined each of the names written upon it.\n\n“Only after Yukari died did I realize that their command had changed. Some of the replies sent to me were already false.”\n\n“By the time we found them, the transfer had already been completed.”\n\nEirin aligned the two pages and offered no further explanation.\n\nPatchouli coughed several times. Koakuma handed her a handkerchief, casually leaving another list in front of Eirin. Several names had been only partially translated, but their ranks were already marked.\n\n“I want these people brought down to Earth.”\n\n“They will not reveal themselves over a few missing agents.”\n\n“What if you tell them the evidence has been recovered and that the Scarlet Devil Mansion uncovered only the outer network?”\n\nEirin picked up the list again.\n\n“At most, they would send a courier. You do not even understand how they authenticate their communications, yet you intend to set an ambush?”\n\n“That is why we came to you.”\n\nPatchouli waited until she had finished reading before continuing. “You have dealt with their problems before. They will still listen to your explanation. Tell them the situation on Earth can be salvaged, but that the remaining deployment must be confirmed in person by those responsible. You will prepare the justification.”\n\n“And then you will kill everyone who appears?”\n\n“Not one of them can be allowed to return.”\n\nEirin placed the list facedown on the desk.\n\n“Do you understand what will happen afterward?”\n\n“What they have already done is enough for us to decide.”\n\n“Then you should take these papers to Remilia.”\n\n“She gave the order.”\n\nEirin leaned back in her chair. Her gaze passed over Patchouli and settled upon Koakuma by the door.\n\n“The fact that you can leave tonight does not mean you will leave with my answer.”\n\nKoakuma stopped packing the case.\n\n“Before we came here, Miss Sakuya received copies of everything. If you refuse, word that Eientei sheltered agents of the Lunar Capital will reach every garrison by tomorrow.”\n\n“You are welcome to try surrounding the Bamboo Forest.”\n\n“There is also Her Highness,” Koakuma said. “Will you personally escort her every time she leaves Eientei from now on?”\n\nEirin rose. The legs of her chair scraped against the floor, and Koakuma immediately withdrew her hand from the edge of the case.\n\nPatchouli remained seated.\n\n“Kaguya cannot die. What about everyone else at Eientei? When your medicines stop arriving and patients become too afraid to come here, where will you take her next?”\n\n“You will regret involving her in this.”\n\n“Then give us the people on that list.”\n\nFootsteps sounded outside and stopped at the far end of the corridor. Eirin watched the door for a moment, then sat down and drew the lamp closer.\n\n“The ambush will be staged outside Eientei. None of my people will participate, and you will not invoke the princess's name in the message.”\n\nPatchouli nodded.\n\n“I will compose the communication. You may inspect it, but you will not alter a single word without my permission. Omit even one authentication step, and they will know that someone is standing behind me with a knife.”\n\n“How long?”\n\n“Three days. Leave the translations.”\n\nKoakuma looked to Patchouli. Once she received permission, she returned the documents to the desk. Eirin had already produced pen and paper. She crossed out one title on the list and wrote another beside it.\n\n“This one has been promoted. Search according to his former position and you will miss him.”\n\nThree days later, a coded message authenticated by Eirin was dispatched to the Lunar Capital. It reported that the evidence on Earth had been secured and requested that several senior officials responsible for the operation attend a confidential meeting to reorganize the transfer and evacuation.\n\nOn the night the reply arrived, Sakuya reassigned the patrols near the meeting place while Meiling led a detachment to seal the surrounding roads. Patchouli inspected each spell meant to sever communications and block every escape route. Koakuma, following the list Eirin had completed, arranged the chairs.\n\nBehind every chair, she left enough room for someone to stand."

 KYO_patchouli_libary:"The Endless Knowledge of the Library"
KYO_patchouli_libary_desc:"I first met Patchouli during the coldest days in Dublin. Famine had emptied the city.\n\n Pots on street corners were reduced to water, bread was a legend, and the queues were eerily quiet—not out of order, but out of sheer exhaustion. The rain that day was fine, turning into thorns as it seeped into your collar. Someone collapsed on the roadside, and bystanders simply stepped aside, as if afraid of suffering the same fate.\n\n She sat on the threshold of a dilapidated bookstore, so thin she didn't look like a child. Her chest heaved rapidly, as if bound by an invisible rope, and a cough would fold her entire body. She had no family, no pleading expression, only clutching a soaked book tightly, as if it were the only thing that could save her life.\n\n I stopped to look at her. When she looked up, her pupils were deep, without pleading, only a chilling clarity.\n\n “What are you looking at?” I asked.\n\n She was breathing heavily, yet still managed to enunciate complete sentences.\n “I'm looking for... a way to survive.” Not medicine, not bread. A method.\n\n In that instant, I understood: fate had been unfair to her, but it hadn't turned her into a docile victim. Her body was failing, but her mind was still racing. She fought illness with knowledge, hunger with words, like holding a dull knife to the world's throat. I don't like waste.\n\n I dislike seeing a usable mind starve to death in the rain. “Come with me,” I said.\n\n She stared at me, her knuckles gripping the spine of the book.\n\n “What can I get in return?” she asked. I smiled slightly.\n\n “You live first.”\n\n She didn't thank me, just hugged the book tighter, then stood up. Her steps were unsteady, but her eyes were resolute.\n\n That was Patchouli's earliest self—so weak she seemed about to collapse, yet she had already learned to use knowledge to support her."

 KYO_patchouli_radio_station:"Sort the Books and Compile the Ledgers"
 KYO_patchouli_radio_station_desc:"When Remilia entered the library, Patchouli was bent over her desk checking a manuscript. At “Still alive, then?” she did not even lift her head. “Say what you want.” Koakuma suppressed a laugh as she took the dossier. Only upon opening it did she discover pages of postwar finances, workshop output, and supply shortfalls.\n\nThe civil war was over, and Remilia was already considering her next expansion. She ordered Patchouli to audit the accounts of the Human Village, the workshops, and the subordinate merchant associations, including debts left by wartime requisitions. Patchouli turned to the coal and steel supply figures and asked how much authority she would have. The answer was a mandate to reorganize everything.\n\nTaxes, donations, compensation payments, and workshop profit shares would flow into the central treasury. Local administrations would retain enough for daily operations; all other funds would be allocated centrally. Koakuma noted that the merchant associations would not surrender their books willingly. Remilia told her to draw up a list. The palace would deal with any refusals.\n\nPatchouli then divided workshop and mining operations into military, civilian, and research categories, setting quotas and procurement prices for each. Orders, inspection records, and payments had to reconcile so that substandard materials could be traced through the paperwork. She insisted that supply suspensions target the offending workshops, lest one violation bring an entire production chain to a halt.\n\nWhen they reached transport, a fit of coughing forced her to put down her pen. Koakuma passed her water while Remilia moved the map in front of her. Railways, convoys, and warehouses needed reorganizing, with named personnel taking responsibility at the front, the distribution hubs, and the rear. Every leg required an alternative route. Supplies listed on paper and supplies that could actually be delivered had to be counted separately.\n\n“Once this is done, you'll know how far you can afford to advance.” Patchouli closed the dossier.\n\nRemilia approved the plan and left a sealed authorization. Koakuma sorted the jumbled ledgers into separate stacks and prepared to issue audit notices. Patchouli moved her unfinished manuscript aside and began with the pages showing the largest arrears."

 KYO_best_month_worker:"Let Remi Inspect the Staff"
KYO_best_month_worker_desc:"Remilia gave no warning of her inspection. She walked through the entrance hall, checking the results of the previous night's inventory. Sakuya followed half a pace behind, answering each question about stock levels and patrol numbers. At the main gate, Meiling was leaning against a post with her eyes closed, her cap shading half her face.\n\n“How long have you been asleep?” Remilia tapped her cap.\n\n“I only just closed my eyes.” Meiling straightened, then immediately identified the two deliverymen who had visited, the number of items they had brought, and the tengu spotted on the mountain road who had yet to cross the perimeter. Sakuya had been about to step forward, but stopped after hearing this and merely reminded her to complete the log. Remilia checked the gate's security, arranged for someone to take over, and summoned both women to the tearoom.\n\nSakuya brewed the tea while Meiling laid out the sweets. The tray took up a little too much space; Meiling had barely moved a plate aside before Sakuya passed an empty cup into her reach. Watching them work together, Remilia asked whether anything had been giving them trouble lately. “Everything is in order,” Sakuya replied at once. Meiling, however, rubbed her shoulder and admitted that garden repairs had cost her several breaks.\n\n“If it aches, have it treated. Assign someone else the heavy work,” Remilia said.\n\nMeiling agreed and glanced at Sakuya. The head maid paused as she was about to pour more tea. Their eyes briefly met, then turned away. Remilia set down her cup. “Is there anything else you haven't told me?” Sakuya said there was not. Meiling lowered her gaze and straightened a plate that had not been crooked.\n\nRemilia did not press them. With people still watching the gates, she needed these two to keep working together. She was willing to adjust Meiling's shifts and let Sakuya hand over a few routine duties. As for their private closeness, she had no intention of exposing it just yet.\n\n“You work well together. See to your duties. Don't make me wait until something goes wrong to ask what is on your minds.”\n\nAfter she left, Meiling whispered, “Did she notice?” Sakuya gathered the tea things without looking up. “All the more reason not to fall asleep on duty.” Both still had assignments to finish, and it remained undecided who would receive the library's support next."

 KYO_sakuya_is_best:"Sakuya Never Fails to Impress"
 KYO_sakuya_is_best_desc:"Once the library's support was placed at Sakuya's disposal, she began checking Seija's usual escape points. The testimony already obtained had revealed only the entrances. To drive the amanojaku from hiding, she would have to dismantle the support waiting along her routes. Sakuya closed down the message relays and transfer points one by one, bringing the hunt to the outskirts of the Human Village.\n\nSeija appeared in a damp alley, hanging upside down from the eaves. She first mocked Sakuya for the effort of pursuing her, then asked whether the captured grassroots youkai were still alive. Sakuya did not answer. Her gaze passed beyond Seija to check the exit of another alley.\n\n“You bite whoever your mistress tells you to?” Seija flipped down to the ground. “A human cleaning up everyone who resists a vampire. You certainly enjoy your work.” As she spoke, she kept moving, trying to draw Sakuya away from her position. Sakuya merely drew her knives and offered no reply.\n\nOne knife struck the wall. A second landed beside Seija's foot. She abruptly inverted the space around them, turning the wall into a foothold and trying to slip around Sakuya's flank. The markers Sakuya had placed in the cracks between the bricks turned with it, still identifying the exits. She stopped time and repositioned both herself and her knives.\n\nWhen Seija next found her footing, her original route was blocked. She retreated to the other side and tapped twice on a window frame. No one answered. Only then did Sakuya tell her that the messenger had been intercepted and every nearby place that might shelter her had been searched. Seija's smile vanished, though she still called Sakuya nothing more than a lock on her mistress's gate.\n\nSakuya advanced to restrain her. Seija inverted their surroundings again and squeezed through a narrow opening that had not quite been sealed, abandoning her planned escape route. Sakuya followed to the end of the alley but did not rush into unfamiliar terrain. Instead, she ordered the abandoned documents secured and the search continued.\n\nSeija had escaped this time. Her local network of contacts and raiders, however, had collapsed, allowing the disrupted supply lines to resume operation. Sakuya reported that result without embellishment and kept the fugitive's name on the wanted list. Until Seija was captured, the patrols could not be withdrawn."

 KYO_meiling_is_best:"Meiling Handles the Job with Grace?!"
 KYO_meiling_is_best_desc:"Meiling went up the mountain carrying a statement of terms bearing the Scarlet Devil Mansion's seal. Momiji Inubashiri inspected the sealing wax at the checkpoint and personally escorted her to Megumu Iizunamaru. Aya Shameimaru was also present, a camera hanging against her chest. Her first question was whether the gatekeeper had come to demand an accounting for her reporting.\n\n“I remember you sticking your lens through our gates.” Meiling placed the document on the table. “Today, we're discussing the withdrawal of your agents.”\n\nThe Scarlet Devil Mansion demanded an end to tengu infiltration and probing, and the recall of informants stationed around the mansion and along its trade routes. In exchange, Youkai Mountain would receive trade access, workshop contracts, and arrangements for exchanging intelligence. Previous hostile acts could be overlooked, but recalled agents could not simply resume their work under new identities.\n\nMegumu did not hurry to turn the page. “Your palace has just been blown open, and you've come to teach us how to keep the peace?” Meiling answered, “Someone has made their move. That is precisely why milady wants to know where our neighbors stand. I've brought both the terms and a list of those we intend to hold accountable. You may choose which to read first.”\n\nMomiji's hand moved toward her sword hilt. Meiling stayed where she was and waited for Megumu to finish reading. When Aya pressed her for a guarantee that past offenses would be forgiven, she pointed to the seal and the clauses establishing her authority: once the agents withdrew and hostilities ceased, the mansion would grant the promised benefits. If the same contact points were discovered operating again, that promise would lapse.\n\nMegumu questioned her about trade routes, deliveries, and intelligence exchanges before closing the document. The mansion wanted her to acknowledge its established rule; she wanted her scouts back on the mountain and orders still coming into its workshops. She had no wish to drag Youkai Mountain into another draining conflict, but offered the envoy no welcoming smile.\n\n“We will withdraw our people. See that you remember your promises.”\n\nMeiling collected the signed document and took her leave. Even as Momiji escorted her past the checkpoint, her hand remained on her sword. Orders soon passed down the mountain: recall the outlying informants and exchange intelligence as agreed. The tengu had accepted this concession. Whether the Scarlet Devil Mansion deserved their trust would have to wait until the first contracts were fulfilled."

 KYO_workforce_ready:"Scarlet Devil Mansion's staff are ready."
 KYO_workforce_ready_desc:"The morning mist hadn't completely dissipated, but Scarlet Devil Mansion had already put everything in its proper place: the corridors were spotless, without a trace of footsteps, and the condensation on the windowpanes had been wiped away until only a thin ray of light remained.\n\n Remilia stood in the hall, not on the throne. She liked to stand at times like this—more like scrutinizing, more like waiting. She didn't urge them, because truly reliable people don't wait to be urged.\n\n Sakuya arrived first. Her uniform was flawless, her gloves were buttoned up, and although the knife wasn't in her hand, it was present in every movement. She bowed, her movements as swift as placing an answer directly on the table.\n\n “Young Mistress.”\n\n Remilia glanced at her. “Status?” “Order within the building is stable. Patrol completed.\n\n I will carry out any orders immediately.” No extra words. No emotional fluctuation. She presented herself like a blade ready to be drawn at any moment.\n\n Footsteps came from the doorway, more casual than Sakuya's, but not chaotic. Hong Meiling walked in, her hat brim pulled up, smiling easily, as if she had just finished a long vigil.\n\n “I'm here too,” she said. “Nothing's wrong at the door.\n\n The mountain path, visitors, wind direction, all normal.”\n Remilia stared at her.\n\n “You slept again?”\n Meiling raised her hand, gesturing a very small distance.\n\n “Just for a moment.”\n Sakuya turned her head, her tone indifferent.\n\n “Your “moments” are usually quite long.”\n\n Meiling coughed, her smile undiminished. “I wake up very quickly.” Remilia neither exposed her nor condoned it. She simply approached, her gaze sweeping from Sakuya to Meiling, as if checking for any wear and tear on the two instruments.\n\n “Listen carefully,” she said, “It won't be quiet from now on.\n\n Orders may be given at any time.”\n\n Sakuya replied immediately. “Yes, sir.” Meiling nodded as well. “Understood.” They stood in the same light and shadow, yet their auras were like two opposites: Sakuya was cold and precise in her execution, while Meiling was gentle yet resilient.\n\n One was responsible for turning orders into results, the other for keeping trouble at bay.\n\n Remilia suddenly found it interesting. Her sword, however, was human—alongside Youkai, yet never considering herself weak.\n Her shield, however, was human—clearly strong enough to intimidate, yet always resolving problems with restraint.\n\n This combination defied convention, yet suited Scarlet Devil Mansion perfectly. Remilia smiled softly, as if making a small counterattack against some unseen fate.\n\n “Very good,” she said. “From now on, you are my sword and shield.”\n\n Sakuya looked up, her voice low.\n “I will make sure the orders are carried out.”\n\n Meiling smiled too. “I will keep outsiders out of the way.”\n\n Remilia turned, her cloak sweeping the ground.\n\n The two in Scarlet Devil Mansion were ready.\n All that remained was for her to decide which direction to throw the orders."

 KYO_sister_is_good:"Sisters Living in Harmony?"
 KYO_sister_is_good_desc:"Flandre was arranging her dolls when unfamiliar laughter rang through the basement. She looked up for its source, but no one stood outside the door. A moment later, the same words came from another direction, and even the scent had changed. She tucked her hands into her sleeves and whispered, “Stop playing. I don't want to fall apart today.”\n\nThe runes on the doorframe lit up one after another. Patchouli set down her pen and hurried to inspect the spell, while Koakuma traced the disturbance to a gap that closed almost as soon as it appeared. Someone had bypassed the door's defenses and sent voices and scents into the room. The restraints meant to soothe Flandre's emotions were coming under mounting strain.\n\nAs Flandre stood, the doll at her feet shattered first. Sakuya rushed to the door and called for her to stop, only to be driven back by glass bursting toward her. Meiling braced the shaking door, shielding Sakuya as she regained her footing. A voice inside was still saying “Don't hurt anyone,” but the stone walls had already begun to crack.\n\nRemilia came down the corridor and called for her sister to look at her. Flandre turned and reached toward her. Another shrill laugh sounded through the gap, and her fingers snapped shut. A stone pillar burst apart. At the same instant, a wound opened in Remilia's shoulder, spilling blood onto the carpet.\n\n“Milady!” Sakuya stepped forward, but Remilia raised a hand to stop her.\n\nPressing her shoulder, Remilia called Flandre's name again. Her sister stared at the blood between her fingers. Her lips moved several times before she finally managed to say, “Sister.” Patchouli used that brief interval to complete the spell array, while Koakuma sealed the point of intrusion. The voices stopped. Flandre fell to her knees among the scraps of cloth, still afraid to unclasp her hands.\n\nThe spell would hold only for a time. Examining the lingering fluctuations, Patchouli recognized the gap techniques Ran Yakumo had inherited from Yukari. Without appearing in person, Ran had already made the mansion pay. Remilia listened, pressed the bloodstained handkerchief back against her wound, and ordered the defenses repaired and everyone without duties there removed from the area.\n\n“Add Ran Yakumo to the list of targets for elimination.” She looked into the room, where Flandre was still apologizing over and over. “And keep her away from my sister.”"

 KYO_remilia_lead:"Yukari Yakumo's Gravestone"
 KYO_remilia_lead_desc:"Remilia stopped before the gravestone and brushed aside the grass covering its inscription. Yukari Yakumo's name was clearly carved. She read it aloud, remembering her first arrival in Gensokyo: how she had led her followers to the rift, and how, wounded, she had accepted the other's terms.\n\n“You won that battle.”\n\nShe remembered Meiling holding on and refusing to retreat, Patchouli too exhausted to cast the same magic again, and the enemy finally halting its assault when Flandre raised her hand. Yukari had allowed them to remain, on condition that Remilia obey when called upon and keep her sister under control. She had sworn on the Scarlet name and made the oath binding until Yukari's death.\n\nAt the time, getting her people inside alive had been the best outcome she could secure. Whenever she later considered crossing that line, she remembered that the sage was still there. Now the gravestone stood before her. The person named in her oath was dead, and no one could demand that same obedience in Yukari Yakumo's name again.\n\n“Ran and Chen may inherit your plans. I made no oath to them.”\n\nRemilia looked at the empty ground behind the stone. Since the barrier had broken, every faction had been fighting over the remaining land and people. The arrangements Yukari left behind had lost their former force with their maker's death. Remilia knew Ran would not accept the mansion's new rule, nor step aside merely because an old oath had expired.\n\nShe had no intention of yielding either. She would requisition factories, control ports, and send her armies onward to establish a youkai state under her command. Yukari's habitual negotiations and checks on power would survive only where Remilia found them useful. Whether to accept that was a choice for each of the living to make.\n\n“If they keep standing in my way, I will kill them.” She watched the empty ground. “And bury them beside you.”\n\nWith that, Remilia put her gloves back on and bowed to the gravestone. She acknowledged the opponent who had defeated her, and remembered the humiliation of being forced to swear. Beyond the cemetery, the resistance left by the Yakumo household still awaited her attention. This time, the oath no longer bound her."

 KYO_flandre_lead:"Temporarily Seal Flandre's Power"
 KYO_flandre_lead_desc:"The cracks left by Flandre's last loss of control had not yet been repaired when Patchouli brought new talismans to the basement. Sakuya and Meiling guarded the doorway while Koakuma checked the seals one by one. Seeing the bandages on her sister's shoulder, Flandre withdrew the hand she had begun to extend.\n\nThis spell would suppress her emotions further. Patchouli explained to Remilia that restraining fear and anger would also dull excitement and happiness. Flandre's power would remain within her, and the seal would require constant maintenance. She could not guarantee what would happen once it was removed.\n\n“Proceed,” Remilia said.\n\nListening, Flandre asked whether this would make it harder for her to break things. Patchouli nodded, but Flandre was still staring at her sister's shoulder. “What about you? Could I still hurt you?” Remilia knelt and told her that this time they would restrain her power, and that she would stay with her.\n\n“Then I want to.” Flandre placed her hands in her lap and waited for them to begin.\n\nHer shoulders jerked as a talisman touched her forehead. Koakuma steadied the chair while Patchouli closed the spell arrays in sequence. Flandre tried to call her sister, then stopped halfway through and frowned, as though she had forgotten what she meant to ask. Remilia told her to stay still, and she held the same pose until the final spell settled into place.\n\nPatchouli checked several times and confirmed that the fluctuations had subsided. Meiling asked whether Flandre felt unwell. After a pause, she answered that she did not know. Sakuya picked a doll up from the floor and returned it to her lap. Flandre looked down and slowly wrapped her arms around it, but did not give it a voice as she usually did.\n\n“Sister, am I being good?”\n\nRemilia gripped the back of the chair. “Yes.” Flandre nodded and smoothed the doll's clothes. She still recognized her sister and understood their questions. Yet the little sister who always insisted on finishing her stories suddenly struggled to speak at all.\n\nRemilia told Patchouli to keep searching for another solution and stayed beside Flandre for a while. Before leaving, she looked once more at the seals on the doorframe. Whatever peace they could preserve for now depended on those runes."

KYO_for_our_great_leader:0 "The Mistress of the Scarlet Devil Mansion Stands Ready"

KYO_for_our_great_leader_desc:0 "The Scarlet Devil Mansion dismantled its last temporary checkpoint. Sakuya finished checking the registers and returned the keys to the maids; Patchouli inspected the seals throughout the mansion once more. Outside, visitors still waited for an audience, eager to praise Remilia for restoring order. She had heard it all too many times to care how much of it was sincere. So long as taxes and grain arrived on schedule and her commands were obeyed, they were free to go on calling her their savior.\n\nReports from across Japan covered her desk. The rebellions had been suppressed, the ports were operating again, and the Scarlet Devil Mansion could finally turn its attention elsewhere. Remilia leafed through several pages, left her approval on a shipbuilding plan, then rose and made her way to the basement.\n\nThe runes before the door had stabilized. As Sakuya opened it for her, her gaze lingered briefly on Remilia's shoulder.\n\n“The wound is fine. Wait outside.”\n\nFlandre sat on the carpet, straightening the dress of a doll. When she heard the approaching footsteps, she set it down and placed both hands neatly upon her knees.\n\n“Big sister, I didn't break anything today.”\n\nRemilia surveyed the room. The tables and chairs were intact, the cups remained where they belonged, and even the dolls still had all their limbs. The seal was working. She should have been satisfied, yet she stood beside her sister for a moment before sitting down.\n\n“Patchouli said you may rest. You don't have to sit like that the whole time.”\n\n“This way I won't knock anything over.” Flandre looked at her. “Have I been good?”\n\n“...Yes.”\n\nHer sister smiled and reached for her sleeve, only to notice the bandages still wrapped around her shoulder and pull her hand back.\n\nRemilia took that hand in hers.\n\nDuring the last outburst, Sakuya had nearly screamed herself hoarse while Meiling braced herself against a door on the verge of shattering. Remilia remembered the pain of something tearing through her shoulder. She also remembered Flandre kneeling on the floor after the seal had closed again, too frightened to touch even those who came to help her. Remilia herself had authorized Patchouli to reinforce the seal afterward. Faced with the same decision today, she still did not dare remove it.\n\n“Does it still hurt?” Flandre asked.\n\n“It's almost healed.”\n\nShe did not tell her sister that she had reviewed the research notes just before coming. Patchouli had already crossed out several methods, while those that remained still required testing. The mansion's collection had been searched from end to end. Some of the necessary materials could not be found anywhere in Japan; other records offered nothing more than the name of some library in Europe.\n\nRemilia remembered those places. She remembered Europe burning, the hurriedly packed luggage, and how much she had abandoned when she fled with her sister. Upon reaching Gensokyo, she had once believed that a mansion and a household of loyal servants would be enough for the two of them to settle down. Now she could not even leave the door to this basement open without fear.\n\nFlandre traced an old scar on the back of her hand with her thumb and asked no more questions.\n\nRemilia stayed with her until the candlewick curled over, then trimmed away its charred end. As she prepared to leave, Flandre suddenly clutched the hem of her dress.\n\n“Sakuya said you're going far away again.”\n\n“There are things I need to find outside.”\n\n“Will you come back?”\n\nRemilia crouched down and gently freed the hem from her sister's grasp, replacing it with her own hand.\n\n“I will. And when I return, I will come here to see you.”\n\n“Then I'll wait for you.”\n\nShe answered too quickly. The words of reassurance Remilia had prepared would no longer come. She moved the doll closer to her sister and waited until the small hand released hers before rising to leave.\n\nOn the stairs, she asked Sakuya for the list of ports.\n\nNo one would deliver what was needed to treat Flandre merely because she sent them a plea for aid. If Patchouli was to continue her research, Remilia would need the wealth to sustain this household, the industry to build its factories, and the strength to force others to surrender what she needed when negotiation failed.\n\nShe knew what that meant. Every harbor on the chart flew a flag of its own; wherever her fleet sailed, someone would lose their home. Even so, she ordered Sakuya to spread out the map and began by circling several coasts capable of sheltering warships.\n\nFor her sister, she was willing to wage war. She had also grown tired of living as a guest in foreign lands, forever waiting for others to grant youkai permission to exist. The territory left behind by Gensokyo's collapse would become the foundation of a new kingdom. She would carve out a homeland for youkai, establish its laws, and ensure that her entire household would never again have to search for another refuge.\n\nBy the time Patchouli entered, several orders had already been laid out across the desk.\n\n“Give Sakuya a list of everything your research requires,” Remilia said. “If something cannot be found, include every lead you have.”\n\n“I cannot promise that finding them will be enough to cure her.”\n\n“I know. Keep searching.”\n\nShe pushed the shipbuilding plan toward Sakuya and ordered the harbor officials to submit a complete inventory of vessels and supplies within three days. Meiling would remain behind to guard the mansion, while Patchouli would continue her daily inspections of the basement. Without Remilia's permission, no one would ever again use Flandre to test the seals.\n\nOnce every arrangement had been made, her finger moved westward across the chart and came to rest upon Europe.\n\nWhen she fled all those years ago, she had failed to preserve her home. This time, she would return at the head of a fleet—and compel the sovereigns of Europe to recognize her crown in treaty."

 KYO_patchouli_my_friend_alice:"A big bet to gather funds."
 KYO_patchouli_my_friend_alice_desc:"Patchouli turned to the last page of the ledger, her fingertip pausing.\n\n Blank.\n Not that she hadn't recorded anything, but that there was nothing to record.\n\n The blueprint for the industrial plan had been drawn up, the production capacity model had been calculated, and even the transportation nodes and backup warehouses were listed.\n\n All the steps were there, except for the one thing needed to start: money. She put down her pen and coughed.\n\n Koakuma stood by the table, holding the list, unusually without a smile. “How much do we need?”\n Koakuma asked. Patchouli didn't look up. “Enough to make anyone want to run away.”\n\n Koakuma muttered. “Then go ask the young lady.”\n Patchouli turned a page, her voice short. “Are you planning to sell all your possessions?” She reached out and pulled a worn-out alchemy notebook from deep within the bookshelf. The cover had no title, only a worn-down mark.\n\n Koakuma's eyebrows shot up when she saw the notebook. “Wait... you don't mean to—” Patchouli unfolded the notebook; the pages were covered in dense symbols, like writing with fire. “High-level alchemy,” she said.\n\n Koakuma's smile vanished completely. “You want to make gold?”\n\n Patchouli nodded. “Push the raw materials to the critical point.”\n\n She tapped one of the lines with her fingertip, “In the right time, under the right pressure, in the right enclosed space, turn it into what we want.” Koakuma swallowed. “The right enclosed space... you mean Scarlet Devil Mansion?”\n\n Patchouli glanced at her. “The barrier here is the most stable.”\n\n “And the most expensive.”\n\n Koakuma's voice tightened, “If something goes wrong, it'll blow the whole mansion to smithereens.” Patchouli didn't deny it. “Yes,” she said. “That's why it's called a gamble.”\n\n She placed several trial materials into a copper pan: salt, ash, metal shavings, and a small tube of dark liquid. Each item was unremarkable, but together they sent chills down one's spine. Koakuma took a half-step back. “Are you really going to light a fire here?”\n\n Patchouli slowly put on her gloves. “I don't like being in debt,” she said. “I especially dislike being forced to stop.”\n Koakuma gritted her teeth. “Then at least tell me what to do if things get out of control.”\n\n Patchouli flipped to the last page, writing a string of runes on the paper, her pen cold and sharp. “Seal the doors.” “Cut off the corridor.”\n\n “Drive everyone out of the radius.”\n\n Koakuma stared at the words, muttering a curse under her breath. “You're writing an evacuation plan.” Patchouli put the pen back. “No,” she said. “I'm telling you, I won't stop.”\n\n The fire hadn't been lit yet.\n\n The air was so thick it felt like it was about to crack.\n\n In that instant, Koakuma truly understood Patchouli's madness for the first time: she wasn't impulsive; she treated risk as a parameter and then proceeded according to calculations. “What if we succeed?”\n\n Koakuma asked, her voice even lower.\n\n Patchouli stared at the copper plate, her eyes fixed on a path to survival. “We'll have money.”\n\n “We'll have machines.”\n\n “We'll have industry that can drown out the noise of the Outside World.” She looked up. “If we fail, Scarlet Devil Mansion will lose a library.”\n\n Koakuma paused for a few seconds, finally tightening her cuffs and standing back beside her. “Then let's gamble,” she said.\n\n Patchouli nodded. “Light the fire.”"

 KYO_patchouli_my_friend_kaguya:"Just snatch it"
 KYO_patchouli_my_friend_kaguya_desc:"Patchouli turned to the last page of the ledger, her fingertip pausing.\n\n Blank.\n It wasn't that she hadn't recorded it yet, but rather that there was nothing to record.\n\n The blueprint for the industrial plan had been drawn up, the production capacity model had been calculated, and even the transportation nodes and backup warehouses were listed. All the steps were there, except for one crucial element: money.\n\n She put down her pen and coughed. Koakuma stood by the table, holding the list, unusually without a smile.\n\n “How much do we need?”\n\n Koakuma asked. Patchouli didn't look up.\n\n “Enough to make anyone want to run away,” Koakuma muttered.\n\n “Then go ask the young lady,” Patchouli said, turning a page in a short voice.\n “She might not be able to afford it.”\n\n She pushed a list onto the table: major merchants, grain warehouse owners, transportation companies, workshop owners. Next to each name were labeled assets, weaknesses, and dependent supply chains.\n\n Koakuma glanced at it, unable to smile.\n\n “This isn't fundraising.”\n\n “Of course not,” Patchouli said.\n\n She placed the Scarlet Devil Mansion seal on the list and pressed it down.\n\n “This is requisition,” Koakuma frowned.\n\n “They'll resist.”\n\n Patchouli looked up and coughed.\n\n “Resist and we'll cut off supplies.”\n\n “If they don't pay, we'll freeze them.”\n\n “If they try to run away, we'll confiscate their goods.” She spoke as if reciting a list, devoid of emotion.\n\n “We need cash, so we'll take it from the person with the most cash.”\n “We need low-priced materials, so we'll have the manufacturers sell to us at our prices.”\n\n Koakuma couldn't help but ask.\n\n “What's the reason?” Patchouli tapped her pen on the paper, her voice cold.\n\n “The reason is that Scarlet Devil Mansion wants to expand.”\n “They can invest and survive.”\n “They can also choose not to invest and face bankruptcy.”\n\n Koakuma was silent for a moment.\n\n “Will the young lady agree?” Patchouli put the list into a folder and closed it.\n\n “She doesn't need to agree,” she said.\n “She'll only ask me: Can it be done?”\n\n She stood up, her cloak off, but her shadow was more regal than anyone else's. “Notify Sakuya.”\n\n “Have her prepare the documents, the freeze clauses, the deportation list.” Koakuma blinked.\n\n “And what about me?” Patchouli looked at her.\n\n “You're responsible for letting them know this isn't negotiation.” Red mist churned outside the window.\n\n This time, not fire.\n\n With a knife.\n No need to bomb the mansion.\n\n Just make sure the richest people in town understand: when Scarlet Devil Mansion opens its mouth, their money will no longer belong to them."

 KYO_patchouli_knowledge_power:"Remi, the Distance Between Us"
 KYO_patchouli_knowledge_power_desc:"The report on industrial reorganization was finished. I had checked the gaps in production capacity, military supplies, rationing, and transport, yet still had not asked Koakuma to deliver it. When she asked whether I wanted to go myself, I said the report had to be presented in person. She glanced at the sealed document and said nothing.\n\nRemi gives me a library, medicine, and enough materials to continue my research. I have solved plenty of problems for her in return. This arrangement has lasted for years. There should be no reason to question it now, but lately, whenever I hear her passing, I put down my pen and wait to see whether her footsteps will turn toward my door.\n\nIn the throne room, I began with the report. Sakuya took the documents, and Remi leafed through a few pages, asked whether two supply lines could be restored on schedule, then approved the plan. She also remarked that I was coughing less. I told her the medicine from Eientei had kept coming. That could have been the end of it.\n\nBut I did not leave.\n\n“Remi, what am I to you?” Once I had spoken, Sakuya lowered her eyes and continued arranging the papers. Remi set her wineglass on the table and asked why this suddenly mattered to me. I could not explain. I could only insist on a clear answer.\n\n“You are part of the Scarlet Devil Mansion,” she said. I asked whether that part was replaceable. She laughed and asked whether I was planning to move out. Of course I was not. She knew that, so she remained seated, waiting for me to take the question back.\n\nI asked again: could we simply be friends, without every meeting requiring a report? She looked at me and said that friendship would not make the work before us do itself. I wanted to argue, but my throat began to itch, and I had to wait for the coughing to pass.\n\n“Don't take every bit of distance I keep as a punishment,” she said. “I will still provide what you need for your research.”\n\nShe had promised something familiar and avoided what I had actually come to ask. In the end, I only nodded and left the throne room. Koakuma was still waiting by my desk. I told her which parts of the industrial plan had been approved, then returned to my seat. Footsteps sounded in the corridor again. Only after they had passed my door and faded away did I realize that my pen had never touched the page."

 KYO_scarlet_mansion:"The Mansion Will Expand"
KYO_scarlet_mansion_desc:"The quiet places within Scarlet Devil Mansion are now quiet. The doors are guarded, the accounts are managed, and the library's answers are piled high on the table. Remilia no longer needs to waste her energy on the cracks within the building—now, it's time for the world to learn to face her.\n\n She won't stop at Gensokyo, nor will she be content with this corner of Japan stained red by the mist. To escape fate, to carve out a better future for Flandre, to ensure Scarlet Devil Mansion has sufficient resources, knowledge, industry, and choices, she must expand outwards, bringing a larger territory into her grasp.\n\n Thus, the expedition begins.\n\n The first stop is East Asia.\n\n China's land, ports, factories, and population, and the Soviet Union's railways, mines, and military equipment in the East, will all become spoils of war on her path. Remilia will not take detours, nor will she wait for others to make way for her. She will personally command the Scarlet Devil Mansion flag to advance outwards, from the coast to the inland, from the fog and blood of the East, all the way to the heart of the Old World in the West.\n\n This is not an ordinary war.\n\n This is the Queen's expedition.\n\n She will move from east to west, crushing borders, crossing continents, and expanding Scarlet Devil Mansion from a mansion into a true empire.\n\n And when she returns to European soil, she will no longer be the exile driven out by fire and guns.\n\n She will be a conqueror returning with armies, industry, royalty, and fury."

 KYO_join_axis:"Declaring our arrival to the world"
KYO_join_axis_desc:"Scarlet Devil Mansion no longer hides in the night.\n\n We've seen enough. Enough of humanity cutting the land into borders, writing their own names on factories, railways, ports, and steel; enough of them driving youkai, vampires, and everything that doesn't belong to “civilization” into legends, into ruins, into corners destined to be forgotten.\n\n Now, it's our turn to speak.\n\n Remilia will declare to the world: Vampires are back, youkai are back, and this time, we're not here to beg for coexistence, nor to hide in the shadows and eke out a living. We will reclaim our land, reclaim the position that rightfully belongs to the strong, reclaim everything that humanity forcibly took away in its so-called “progress.”\n\n Let the world's great powers hear this clearly.\n\n Whether it's America, Germany, or Britain, any nation that thinks it can use its fleet, factories, parliament, and steel to drag us back into darkness will become an obstacle on Scarlet Devil Mansion's expedition. And Remilia has only one way of dealing with obstacles—to crush them.\n\n The Red Mist will cross the oceans, cross borders, cross every barbed wire fence inscribed with sovereignty and order. Her army, carrying the fury of Youkai, the will of vampires, and the royal power of Scarlet Devil Mansion, will crush every nation that refuses to bow into the night. Those regimes that still believe the world belongs only to humans will soon understand: the old era is not dead; it has simply returned with a greater military force.\n\n Tremble. Because Remilia no longer intends to explain her existence to anyone.\n\n She will only make the whole world, under the red fog, learn to acknowledge her arrival."

 KYO_asia_doom:"Greater East Asia Circle"
KYO_asia_doom_desc:"China is no longer our opponent. With the collapse of front lines, the change of ports, and the control of railways and cities, the entire East Asia is being redrawn by the red fog. But conquering land never equates to truly ruling it. We have taken the map, but we haven't won over the hearts of the people, much less the human resistance hidden in the mountains, villages, and factories.\n\n They keep their heads down by day and fire at night; today they bomb a section of railway, tomorrow they burn down a warehouse. Every guerrilla blitz, every assassination, every act of sabotage may seem small, but it will drag our supplies, manpower, and security resources into the mire little by little. If we continue to deal with this with simple military suppression, we will waste too much energy on this vast land, trapping the army that should continue to expand outward in endless maintenance and sweeps.\n\n Patchouli therefore proposed a more effective and sobering solution: since old Japan had attempted to package its rule with a “Greater East Asia Co-Prosperity Sphere,” Scarlet Devil Mansion could dismantle, rewrite, and reuse this framework. The name would change, the slogan would change, and the core of the order would change—no longer the expansion of a human empire, but a reorganization of East Asia's production, transportation, security, and cooperation structure centered on Youkai and Scarlet Devil Mansion.\n\n Under this system, those willing to submit would be incorporated into the new regional order, receiving rations, jobs, trade, and limited security; those who continued to resist would be clearly marked, isolated, and eliminated. We would support compliant local governments, rebuild ports and railways, and integrate factories, granaries, and mines into a unified system, so that the entire East Asia would no longer be merely occupied land, but a peripheral system capable of continuously supplying Scarlet Devil Mansion.\n\n This was not mercy.\n This is management.\n\n As long as this “Greater East Asia Co-operation Zone” can function, we won't have to waste all our resources on an endless war of attrition. East Asia will transform from a spoil of war into a rear base; from a burden into a foundation; from a vast land that must be constantly suppressed into the first solid stepping stone supporting Scarlet Devil Mansion's continued westward advance."

 KYO_europe_to_me:"Back to our homeland, Europe"
 KYO_europe_to_me_desc:"We have already traversed Siberia, crossed permafrost, forests, and endless railways; we have also crossed the Ural Mountains, trampling the supposedly solid dividing line between Asia and Europe under our feet. The gates of Istanbul now bow to Scarlet Devil Mansion; the last choke point between Europe and Asia is finally in our hands.\n\n Europe has arrived.\n\n It's not on the map, not in history books, not in the old terms that exiles repeatedly dream of.\n We are truly returning to this land with armies, the red mist, factories, and killing intent.\n\n For others, this is just the next stage of the expedition; but for Remilia, this is not simply a new battlefield.\n This is where she grew up, where she lost everything, and where fate first forced her into this state. She will return to the ruins of that castle.\n\n Looking at the collapsed stone walls, the fire-blackened ruins, the old roads worn smooth by time and frost, she will remember how she learned nobility here, how she witnessed the decline of her family, and how she was driven from her homeland by human cannons and firearms on that night. She would remember her sister's screams, the blood, the fire, the shattered wings, and herself awakened from the ruins, left only with exile as her path. It had been a long and arduous journey.\n\n From being expelled from Europe to traversing the corpses of the Old World; from a corner of Gensokyo to crossing the entire Eurasian continent; from a vampire noble who had lost her castle to a queen returning with a vast army.\n\n And now, the road had finally circled back to its starting point.\n\n The remaining task was simple: Conquer.\n\n Subdue all the nations of Europe, crush every flag that refused to bow into the mud, and transform this continent that had once driven the vampires into Remilia's new throne. Only when the last nation submits, when the last obstacle is crushed, will this expedition truly be complete. At that time, she will no longer merely have “returned.”\n\n She will make all of Europe acknowledge—the girl driven out by fire years ago, now returned with crimson mist and royal power, to reclaim everything that rightfully belongs to her."

KYO_cross_pacific:"Where It All Ends"
KYO_cross_pacific_desc:"As the nations of Europe fell one after another beneath the rule of the scarlet mist, Remilia finally returned to the old castle. Her army had cleared the roads and waited to escort the queen into her homeland. Yet when she reached the broken walls, she had to study them for a long time before finding the steps that once led to the courtyard.\n\nThe tower had collapsed. Grass grew in the cracks. She remembered a window here, where Flandre had often looked out. Standing in the same place now, she could see only a broken roof. No one had remained to await her return. Nothing had been kept whole, ready to be restored at a conqueror's command.\n\nSunlight fell across the back of her hand, and her skin began to burn. Remilia did not immediately withdraw. She looked down at the small wound. To reach this place, she had seized land, factories, and ports, bringing more troops and research resources under the mansion's control. Resistance still awaited suppression in many regions. Officers still needed her orders. But the once-distant goal of returning to Europe had been achieved.\n\nFlandre had not come with her. Before leaving, Remilia had spoken to her of their homeland. Her sister's answer had been quiet, without any anticipation she could discern. The seal suppressed her outbursts, but also dulled the emotions that had once made her cry, protest, grow excited, or feel afraid. Remilia knew where that expression came from. She herself had given the final assent when the restraint was imposed.\n\nShe had hoped expansion would provide more ways to help. New spells, ancient records, and materials from distant lands could now reach the library. She could no longer keep postponing her sister's needs until the next war was over. Patchouli's research required her to return and face it. Whatever happened after the seal was lifted would also be hers to bear.\n\nThe ruins would not answer for her. She touched a crack in the old stone wall and remembered fleeing with her sister by the hand, unable to spare a glance behind. Then, getting Flandre out had been enough. Now her sister was still alive, but Remilia had to ask anew what kind of life she would let her have.\n\nFamiliar footsteps sounded on the path behind her. Remilia took her hand from the wall and remained in the sunlight, waiting for the others from the mansion to approach. There were things she needed to tell them. They had reached her birthplace. Once they had seen it, their journey should turn toward home. The next discussion about Flandre could no longer be pushed to the bottom of the agenda by preparations for another campaign."

 KYO_the_world_under_red_mist:"The world will be under the red mist"
 KYO_the_world_under_red_mist_desc:"Oderint dum metuant"


 KYO_Byakuren_start:0 "The path of equality"
 KYO_Byakuren_start_desc:0 "Choosing the path of Byakuren Hijiri means choosing the longest and most untimely path.\n\n The ruins left by war will not disappear on their own because of mercy, and the fear that has accumulated between humanity and the Youkai for hundreds of years will not be immediately resolved by a victory. Myouren Temple does not shelter a group of redeemed, perfect people. Nazrin remains skeptical, Ichirin struggles between responsibility and confusion, Shou blames herself for every mistake, Minamitsu suppresses her resentment, and Kyouko must learn to judge beyond her passion. Byakuren's task is to move forward with these cracks.\n\nYou will personally participate in the reconstruction of Gensokyo, bringing Buddhism from scriptures to construction sites, fields, schools, and relief stations; allowing the disciples of Myouren Temple to confront their pasts and find their own paths; negotiating with grassroots youkai, tengu, foreign powers, and rulers of the old era, proving that youkai don't have to live on fear alone, and that humanity doesn't have to see youkai as natural enemies. This path will not be without gentleness.\n\n To protect the weak, we must confront the dark tyranny of fascism and oppose the new shackles established in the name of equality; we must acknowledge the mistakes of Myouren Temple itself, preventing compassion from turning into arrogance and relief from becoming domination.\n\n Byakuren doesn't promise to create a world without suffering. What she promises is to no longer easily abandon any living being. If this path can be followed to the end, humans and Youkai will no longer just tolerate each other, but will be able to learn, work, live, and even become family together.\n\n The road is long and arduous. But someone has to take the first step."


 


   KYO_hijiri_aftermath:"The Dawn of Peace"
 KYO_hijiri_aftermath_desc:"The civil war is over, but when Byakuren stands before the temple gate, she sees not peace, but a weariness that has been dragged on for too long. The fields are barren, the roads are broken, refugees and former allies are wary of each other, and even those in the Myouren Temple are barely managing to suppress their wounds; they are far from peaceful.\n\n Byakuren understands that she cannot simply stand on high and speak of compassion. If Myouren Temple were to rise again from these ruins, it would have to send each disciple into the dirtiest, most difficult, and most unforgiving places where their true nature would be revealed. Nazrin was tasked with inventorying and searching, Ichirin with organizing and mobilizing, Shou with maintaining morale and order, Minamitsu with suppressing violence and vagrants, and Kyouko with rousing the hearts of those on the verge of collapse.\n\n She didn't treat them as mere errand boys, but rather forced them to confront the unresolved issues within themselves. Byakuren simply said softly, “Go. First, ensure others survive, then think about what kind of person you want to become.”"

 KYO_our_rat_nazrin:"The Rat in the Temple"
 KYO_our_rat_nazrin_desc:"Byakuren assigned Nazrin the most unpopular and likely to offend people tasks: inventorying the warehouses, patrolling the black market, searching for missing supplies, and dragging out those hands that had taken advantage of the chaos to sneak into the granaries and medicine cabinets. She felt no resentment whatsoever; on the contrary, she felt this was what proper work was all about.\n\n She trusted locks, ledgers, and evidence that could bite, more than empty talk of goodwill. A swarm of rats scurried through cracks in the walls, cellars, and ruins, bringing back to Myouren Temple all the information about who was stealing, who was hoarding, and who was planning to make a quick buck before reconstruction began. Shou tried to salvage some dignity for certain people, but Nazrin simply replied: “Tie the food sacks tight first, then talk about trust.\n\n When you're hungry, vows are thinner than paper.” But the more she saw, the more she realized that her own “everyone betrays others” explanation couldn't cover everything. Some were indeed stealing, and others, though just one step away, still gave their last half-sack of rice to the children. Nazrin continued her sarcastic remarks, but for the first time, she began to admit—perhaps there was kindness in the world, but kindness was often pitifully poor."

 KYO_treasure_hunter_nazrin:"The Treasure Hunter"
 KYO_treasure_hunter_nazrin_desc:"The mice dragged the corner of a cloth sack from a collapsed warehouse. Following their trail, Nazrin found an iron box underneath. Its lock had rusted shut. Murasa watched from beside a broken beam as she struggled to pry it open. “After all that trouble, it had better be full of gold.”\n\nInside were only scrolls and a few shipping lists. Murasa leaned over for a look and was about to search elsewhere when Nazrin stopped her. The lists recorded medicine and machine parts, yet the warehouse accounts had long since declared the shipment destroyed by fire. She circled the dates and sent the mice to find the hidden passage used to move the goods.\n\n“Do dead people move cargo too?” Murasa asked.\n\n“Living people put it on the dead people's accounts. Find the exit first, and don't bring it down on us.”\n\nMurasa went around through the flooded lower level, checked which passages were safe, and only then called the porters down. Nazrin uncovered medicine chests and parts behind a false wall, then gathered scattered ration tickets and land deeds separately. The medicine needed inspection, the workshops would identify the parts, and the deeds had to be checked with people still living nearby. She forbade anyone from listing goods as usable merely because they bore an intact seal.\n\nMurasa moved a beam for her and found damaged Buddhist ritual objects underneath. She could not resist asking, “We're taking these too? Does Lady Shou even refuse to part with the broken ones?”\n\nNazrin crouched and wrapped a broken piece of copper ornament. “If she knew they were here, she'd come herself tomorrow. Let her search somewhere like this, and I'll have to find her as well.”\n\n“So you keep the person safe along with her possessions.”\n\nNazrin glared and told her to talk less. Murasa's smile suddenly faded. She reached out to stop the porters behind her: the water ahead was rising, and their original exit was no longer usable. Nazrin immediately recalled the mice and led everyone out along another hidden passage. She left last, carrying the iron box.\n\nBack at the temple, the medicine chests went straight for inspection, while the falsified loss report was handed over for investigation. Shou looked through the recovered scrolls and asked where they had been found. Nazrin said only “the warehouse” and told her not to go there. Murasa laughed beside them, then hurried to unload another crate before the mouse could answer back."

 KYO_nazrin_open_shop:"A New Trade: The Confectionery"
 KYO_nazrin_open_shop_desc:"Nazrin calculated several ways of raising funds before finally setting aside a space on the treasure ship's cargo plan and labeling it “confectionery.” She disliked the fiddly business: docking, tending the fire, making change—every step took people. But Byakuren wanted both money and a reason for wary residents to approach Myouren Temple. Nazrin could find no better alternative.\n\nIchirin brought the stove and ingredients, so meticulous that even the mouths of the sacks faced the same way. Murasa leaned against the rail and watched Nazrin calculate the profit on a single sweet. Had the treasure-hunting mouse finally decided to make a living selling sugar to children?\n\n“Keep the ship steady so the first tray doesn't slide onto the floor. That will be help enough.”\n\nWhen they opened, people merely watched from the shore. Kyouko called out the prices first. Murasa followed with a shout of “Today only!” that sounded like an announcement about dividing plunder. Ichirin hurried to explain the purpose of the fundraiser. Feeling a headache coming on, Nazrin simply moved the wooden price board beside the gangplank and let the customers read it themselves.\n\nChildren following the smell came aboard first, with adults behind them. Some bought a small piece and broke it apart to share. Others asked where the money would go and dropped extra coins into the donation box. As the queue grew, vendors on shore moved their stalls closer to serve those waiting.\n\nIchirin began limiting the number aboard to keep the gangplank clear. Kyouko led impatient children aside, and Nazrin finally sent Murasa to move stock. Even after the first batch sold out, people kept asking how long the next would take. Nazrin had meant to close on time. After checking the remaining ingredients, she had to ask Ichirin to stoke the fire again.\n\nThat night, she deducted the costs of ingredients, fuel, and transport before recording the profits separately from the donations. Murasa leaned over the accounts and asked whether their little venture had been worth the trouble. Nazrin covered the page with her hand and asked the captain for the sailing time to their next stop.\n\n“Stay another half-day,” she said. “Some people wanted to take sweets home, but we'd sold out by the time they arrived.”\n\nMurasa drew out her answer, and Nazrin glared up at her. Beside them, Ichirin was already adding to the ingredient list. Kyouko turned over the price board she had miswritten and diligently practiced her calls for the next port."

 KYO_nazrin_salvage_org:"Asset Recovery"
KYO_nazrin_salvage_org_desc:"Byakuren's order to Nazrin was simple: find everything still usable from the ruins and turn it into resources that Myouren Temple could control as quickly as possible. As for how to do it, Byakuren didn't elaborate; and Nazrin, always adept at taking a broad statement and executing it in the coldest, fastest, and most ruthless way, immediately established a complete recovery system.\n\n Scattered scrap metal, discarded equipment, unclaimed convoys, warehouses left behind by the old forces, even tools, wood, and medicine boxes forgotten in corners were all marked, registered, and collected by her. Her rules were simple to the point of being cruel: if no one claimed it on the spot, if no proof could be produced, and if the ownership couldn't be determined within the stipulated time, then it was Myouren Temple's asset. She didn't ask who the former owner was, nor did she care about the excuses others used about “almost coming to claim it.” To her, the least valuable thing in the ruins was a belated explanation. After listening to the rules she set, Ichirin frowned and said it was practically taking advantage of the chaos to loot.\n\n Nazrin didn't even raise an eyelid, only replying calmly: “Reconstruction isn't charity, it's racing against time. By the time they slowly remember what they lost, this pile of scrap metal will have long since rotted into mud.” She included every rail, every box of damp medicine, every piece of still-rotting gear in her inventory, and even sent swarms of rats to ransack the dilapidated warehouses that others considered unlucky. This method was indeed astonishingly efficient.\n\n For the first time, Myouren Temple was able to quickly regroup resources scattered across various locations and redistribute them to construction sites, convoys, granaries, and repair teams. While others were still arguing over ownership, she had already sent the items on their way; while others were still reminiscing about the past, she had already begun calculating how many bricks, medicines, and hot meals these remnants could be exchanged for.\n\n But efficiency never comes without a price. Some accused Nazrin of taking advantage of the situation, some cursed Myouren Temple for embezzling property under the guise of reconstruction, and others stood before the sealed-off old warehouses, their eyes red with tears, saying that those were their hard-earned possessions. Nazrin heard these grievances, but almost never looked back. She knew very well that she was doing something no one would like, but she also knew that if even these hateful dirty tricks weren't done, the reconstruction in Myouren Temple's hands would forever remain empty words.\n\n She still didn't believe in the reliability of people's hearts, and never expected to be thanked. But at least, the rules she had personally established were indeed reliable. Nazrin turned ruins into accounts, controversy into assets, and truly became the kind of person best suited to be criticized in chaotic times, yet most capable of getting things done."

KYO_nazrin_rat_king:0 "King of All Rats"

KYO_nazrin_rat_king_desc:0 "When word of the warehouse fire reached Myouren Temple, Nazrin was checking a cargo manifest.\n\nThe messenger reported that a lamp had overturned during the night, destroying grain intended for a resettlement center. After hearing him out, Nazrin asked when the fire had started, then handed the manifest to Shou.\n\n“The grain left two days ago. It has already been resold twice. What burned tonight was an empty warehouse.”\n\nShou turned the page over. The unloading point, the buyer's name, and even the tavern where the warehouse keeper and middleman had agreed to divide the proceeds were all recorded on the back.\n\n“And the culprits?”\n\n“They haven't finished their drinks yet. Leave now, and you can bring them all back together.”\n\nThe first to notice something amiss had been nothing more than a rat that crawled into the grain cart in search of food. Instead of heading toward the resettlement center, the cart had turned into the rear yard of a trading house. Word traveled back through salvage depots and contacts in the back alleys. Nazrin sent her rats to watch the warehouse and ordered her informants to trace the shipment. By the time the warehouse keeper poured out the lamp oil, both buyer and seller were already being followed.\n\nSuch investigations could now stretch from one city to the next. Whether cargo was loaded at a harbor, exchanged at a railway station, or diverted along a mountain road, rats waited along the route to take over the pursuit. The little creatures that had once merely scavenged scrap for Myouren Temple now ranged throughout the country. Even black-market merchants had begun watching the holes in the walls whenever they held a private meeting.\n\nThat was where the title “Rat King” first began to spread.\n\nWhen Nazrin heard it, she asked only one question: “Who said it?”\n\nThe messenger hesitated. She looked up and pressed him. “If it reached your ears, it can reach others. I want to know which part of the network they have detected.”\n\nShe prepared alternate routes for every contact point and subjected even information from familiar sources to verification. Local officials withholding supplies, old gangs recruiting new hands, profiteers spreading rumors of an imminent grain shortage to drive up prices—she kept records on them all. Those lacking sufficient evidence remained under investigation. Those preparing to act were dealt with before morning. The reports delivered to Byakuren were often only a few pages long, yet each represented days of surveillance and several rotations of informants.\n\nEven Shou had argued with her over it.\n\n“You do not have to treat everyone as a thief from the outset.”\n\n“Then stop inventing excuses for people the moment you hear about their troubles.”\n\n“This man on the list only delivered goods for them.”\n\n“He also accepted extra payment on three occasions.”\n\n“Find out what that money purchased. I will not allow you to punish a cart driver alongside the one who planned the scheme.”\n\nNazrin frowned and snatched the page back. Two days later, the driver's name had been crossed out and replaced by that of the overseer who had accepted payment to conceal the stolen goods. She offered no apology, merely placed the new testimony on Shou's desk.\n\nShe still considered Shou too softhearted. Whenever someone wept before Byakuren and pleaded their case, Nazrin waited outside the door, ready to verify every claim they had made. The temple's monks thought her excessively suspicious, while those she had interrogated were even less inclined to approach her. Nazrin made no effort to greet them. She fed her rats with her head lowered, then left on her rounds as usual.\n\nYet she never needed to ask where the recovered grain should be sent. Shou had already found shelter for everyone Byakuren promised to receive. Nazrin remembered the names of those places and knew exactly how many people would go hungry if even one cartload failed to arrive. A few words of repentance would never be enough to make her spare those who profited from such supplies.\n\nAfter nightfall, Shou came to remind her to eat and found several more confidential reports piled beside the desk.\n\n“How many are left?”\n\n“Just this one.”\n\nShou left the meal behind and reminded her not to let it grow cold. Nazrin acknowledged her, moved the bowl closer to the lamp, and opened the letter from the north first.\n\nA gray rat climbed onto the edge of the desk. She broke off a piece of flatbread and placed it before the creature, then took up her pen and revised the next day's inspection route."

KYO_nazrin_follow_shou:0 "Nazrin Will Follow Shou Forever"

KYO_nazrin_follow_shou_desc:0 "The first time Nazrin recovered Shou's pagoda, she recorded “failure to safeguard a sacred artifact” in her report.\n\nShe had been ordered to remain beside Bishamonten's representative and determine whether she was fit for the role. Shou was forgetful and far too willing to believe every tale of hardship she heard. Nazrin could hardly leave her unattended. Her early reports were meticulous, even noting every meeting Shou missed because she had stayed behind to care for the wounded.\n\nLater, Nazrin began to hesitate before putting pen to paper.\n\nShou had missed the meeting. That was true. It was equally true that she had remained with the injured person until they stopped trembling. Nazrin continued recording every mistake, but gradually began arranging replacement meetings, investigating the backgrounds of those seeking help, and warning Shou where trouble was likely to arise. Sometimes Shou listened. Sometimes she insisted upon her own decision. When the two argued, they could be heard from across the courtyard.\n\nOnce, Nazrin slammed a stack of account books onto the table and told Shou that one day she would be deceived until she had nothing left.\n\nShou waited until she had finished, then asked, “Will you come with me tomorrow to investigate the discrepancy you found?”\n\nNazrin went.\n\nOne evening, Nazrin returned from the river with her mice and saw Shou standing beneath an umbrella at the fork leading into the village.\n\n“What are you doing here? Has the resettlement center been left unattended?”\n\n“Ichirin has taken over.”\n\n“I said I would return before dark.”\n\n“It is already dark.”\n\nNazrin glanced behind her. The last glimmer of light over the riverbank had vanished. Shou shifted the umbrella toward her, her eyes moving from Nazrin's soaked hem to the gray mouse perched upon her shoulder. Only after confirming that everyone had returned did she turn to walk beside her.\n\n“The road by the river is flooded,” Nazrin said. “Tomorrow's grain convoy will need another route. I found—”\n\n“Tell me after we return and sit down.”\n\n“If you don't listen now, you'll take the wrong road again tomorrow morning.”\n\nShou stopped. Nazrin finished explaining the detour, then noticed that most of the umbrella was covering her. She reached up and pushed the handle back between them.\n\n“Your shoulder is wet too. You can't even hold an umbrella properly.”\n\nShou smiled but did not loosen her grip.\n\nOnly when they reached the temple gates did she say quietly, “When you take so long to return, I worry about you too.”\n\n“The mice would have sent word.”\n\n“I know. But the rain was heavy today, and you always think one more journey will do no harm.”\n\nNazrin lowered her head and wrung out her sleeve.\n\n“If I hadn't gone, you would have tried wading through the water yourself tomorrow.”\n\n“Which is why I am so grateful to have you.” Shou paused. “But could you also tell me when you need help? Whenever I ask, you insist that you don't.”\n\nNazrin did not answer immediately. Shou did not press her. She left the umbrella beside the door, took down a dry cloth she had prepared in advance, and handed it to Nazrin for her hair.\n\nNazrin accepted it and first wrapped it around the shivering old mouse on her shoulder.\n\n“You know why I was originally sent here.”\n\n“I do.”\n\n“I spared you nothing in those reports.”\n\n“You were harsher to my face.”\n\nNazrin looked up. Shou was still standing there.\n\n“But you also showed me where I had gone wrong. As long as you are willing to speak, I will listen. If we disagree, we can discuss it.”\n\n“You say that every time. In the end, you still make me come with you.”\n\n“Because I want you to come with me.”\n\nNazrin gripped the damp cloth. After a long silence, she sighed.\n\n“Look after the mice for me tomorrow morning. They've been running all day and need to rest.”\n\n“Of course. You should sleep a little longer too.”\n\n“I'll join you in checking the grain convoy tomorrow afternoon.”\n\nShou nodded, then took another dry cloth from the rack and placed it in Nazrin's free hand.\n\n“This one is for you.”\n\nNazrin did not refuse again. As she dried her hair, she watched Shou bend down to gather their wet shoes and suddenly called out to her.\n\n“Wherever you go from now on, remember to call for me.”\n\nShou looked back.\n\n“Don't wait for an order. I will go with you.”"

 KYO_Ichirin_convert_everyone:"Myouren Temple's Ambassador"
KYO_Ichirin_convert_everyone_desc:"When assigned to give public sermons, Ichirin first asked whether someone else could do it. Byakuren asked why. She admitted that her own entry into religious life had been arranged in part by her family. She still had many questions and feared standing before a crowd without answers to the things she ought to know.\n\nByakuren did not write her speech. She simply asked her to take those questions along.\n\nOn her first village visit, Ichirin followed her prepared remarks while Kyouko gathered a crowd. After listening for a while, someone asked whether sheltering youkai at Myouren Temple would put its neighbors in danger. Ichirin hurried to explain, but sounded increasingly as though she were reciting precepts. Even Kyouko gradually fell quiet.\n\nAfter everyone left, Nazrin asked which question she had actually answered. Ichirin looked through the sentences on her paper and found none she could point to. She had to return the next day.\n\nThis time, she first invited the questioner to finish explaining their fears. She recorded the disturbances nearby and stated which the temple could address and which she would need to ask about. When someone asked whether only Buddhists could seek help, she said no. Asked why she herself had stayed, she hesitated, then admitted she had once been unsure whether this was the path she wanted.\n\nSomeone in the audience laughed that she had not even worked it out herself. Ichirin did not pretend otherwise. She said only that she had seen the temple shelter people with nowhere to go, and had helped with her own hands. If they wished to visit, they could see for themselves before deciding whether to believe her.\n\nAfterward, she still prepared speeches, but left more time for questions. Some came only to argue. Others brought neighbors to see the shelters. Back at the temple, she gave Byakuren the questions she had answered poorly and asked for guidance. A few days later, passing through the village again, she sought out the person who had questioned her first."

KYO_Ichirin_help_worker:"The Ambassador of Industrial Management"
KYO_Ichirin_help_worker_desc:"Byakuren knew very well that scriptures and good intentions alone could not save a land torn apart by war. If the world were to truly move in a better direction, in addition to the stability provided by faith, the production of materials, the allocation of resources, the operation of workshops, and the management of warehouses were equally indispensable. Ruins will not spontaneously transform into houses, and an empty pot will not automatically cook hot food out of compassion.\n\n So, Ichirin was thrust to the forefront of the construction sites, warehouses, and workshops. She initially disliked the job. Rather than running between forms and schedules, she preferred to be at the forefront, punching away any visible trouble. But Byakuren simply told her: “If you want people to have a place to live, it's not enough to just guard it; you also need to learn how to build houses.”\n\n Ichirin had no choice but to accept the task. She began inspecting the construction sites, checking warehouse receipts, arranging shifts, and reorganizing the production lines that had been scattered and broken by the war. Where the raw materials came from, where the finished products were sent, which transportation routes couldn't be interrupted, which workshops should be prioritized for restoration—she noted everything down, then nailed each item into the new order. She wasn't good at smooth talk; she could only tell everyone in the most direct way: what to do now, and why to do it.\n\n She walked into the workshop and said to the workers who were only thinking about getting a meal: You're not just doing this for dinner. The bricks, screws, tools, and medicines you make will eventually become roofs, roads, and furnaces, becoming someone else's means of survival. If labor only stops at personal subsistence, this land will forever remain stuck in a cycle of mere survival; true production is about reintegrating people into a society that can still function and move forward.\n\n At first, not everyone was willing to listen. Some found the assembly line tedious, while others felt that Myouren Temple was all talk and no action, ultimately driving people back to the construction site to do manual labor. Nazrin also reminded her: “If you want them to believe they are not just screws, you have to stop treating them as numbers.” So, instead of just speaking from a high place, she personally accompanied them as they pushed raw materials and delivered finished products, letting them see firsthand how their creations were delivered to bridge repair teams, agricultural tool stations, and makeshift hospitals.\n\n She finally understood that faith gives direction, labor gives strength, and industry gives society its framework. An ideal world doesn't fall from the sky; it must be slowly built, bag after bag of cement, steel after steel, and tireless hands."

KYO_ichirin_Propaganda:"Rumors, the Drunkard of Myouren Temple"
KYO_ichirin_Propaganda_desc:"After the war, rumors spread, and Myouren Temple was no exception. Among these rumors, the one that spread fastest was about Ichirin—that woman who, despite having been a follower of the faith for many years and should have been observing vows of purity, could never shake her drinking habit.\n\n Of course, she knew this habit was bad. Byakuren had advised her against it, Shou had frowned, and Nazrin had often used it to tease her. But Ichirin would still drink. Not because she particularly liked the taste of alcohol, nor for enjoyment, but to numb herself. Numbing the things that had never truly left her—the shadow of her family, the life she was pushed into, the responsibilities she carried, and the heavy burden of never being able to distinguish between “this is the path I want to take” and “this is what others have chosen for me.”\n\n During the day, she always stood straight, like a piece of wood, like a wall, like a hermit accustomed to living as “the person who should be right.” She managed construction sites, spoke of faith and order at gatherings, and acted composed in front of others. But at night, after a glass of wine, that hardened shell began to crack. She would often go to Minamitsu with a bottle of wine, pouring out all the things she would never say during the day.\n\n She cursed Byakuren for pushing people onto the most difficult paths, cursed Shou for being stupid to the point of being a headache, cursed Nazrin for being stingy and suspicious, and cursed Kyouko for being overly naive. But in the end, her rants always circled back to herself, criticizing herself most harshly—criticizing her own cowardice, her own unwillingness to accept things as they were, yet always following the paths others laid out for her; criticizing herself for having so much to say but never having the courage to truly speak for herself. Minamitsu usually listened nearby, occasionally adding a wicked grin: “You, when you're sober, you're like a disciplined monk; when you're drunk, you're like a human being.”\n\n Strangely, it was precisely because of this unseemly flaw that Ichirin gained a different kind of reputation among the people. People discovered that this monk from Myouren Temple wasn't truly detached from worldly affairs. She would get drunk, complain, curse, and, when intoxicated, pour out all her grievances and resentments, much like ordinary people overwhelmed by life's pressures.\n\n And it was precisely because of this that people were more willing to approach her. Construction workers were willing to sit at the same table with her, and even homeless people, after listening to her drunken rants, felt that Myouren Temple's talk of “rebuilding the world” wasn't so far-fetched. Thus, “the drunkard of Myouren Temple” didn't become a scandal, but rather a strange yet effective reputation—Myouren Temple not only sheltered saints, but also tolerated someone who would break precepts, drink, and feel self-loathing, yet still get up the next morning to continue working."

KYO_ichirin_Training:"Purity of Body and Conduct"
KYO_ichirin_Training_desc:"Ichirin remained in the courtyard to train after morning prayers. Whenever her movements slipped, she stopped and began again, continuing until the backs of her sleeves were soaked. Someone remarked that such diligence must surely have freed her mind of distracting thoughts. She smiled faintly and said she had just been thinking about the scolding she had received yesterday.\n\nShe could not always believe her own teaching. She spoke of restraining malice, yet wanted to snap back whenever someone accused her. She urged mutual help, yet wished difficult petitioners would simply leave. Once, she had suppressed these thoughts, only to wonder alone at night whether she deserved to wear her robes.\n\nAfter listening, Byakuren asked her to consider what she had actually done yesterday. Ichirin remembered holding back a retort, then deliberately making that person wait longer when arranging their request. The next day, she went to finish the delayed task without waiting for them to apologize first.\n\nHer training came to include these examinations alongside martial practice. Had she kept her promises? Had she used her duties to vent her anger? She asked herself each question, taking uncertainties back to the temple for guidance. Her doubts did not grow fewer, but she could finally admit several mistakes she had once refused to acknowledge.\n\nAt her next village sermon, someone asked when they would see the earthly Pure Land she described. Ichirin looked at the mud on her robes and said today did not yet qualify. She asked them first to look at the wounded with no one to care for them and the roofs still awaiting repair. Anyone willing to help could stay and discuss it.\n\nNot everyone who listened wished to join the faith. Some argued with her openly. Others asked only how many more people were needed to carry timber. Ichirin put away her prepared sutras and took the latter to the supervisor, answering his questions along the way."

KYO_Ichirin_cringe_name:"Mobilize the People to Work the Sunlit Fields"
KYO_Ichirin_cringe_name_desc:"The tools Ichirin had brought were gathering dust in the warehouse. The workshops had delivered, yet several fields remained fallow. Young people complained of the sun; older workers doubted they could keep their harvest even after a season's labor. She had barely begun her prepared appeal when someone interrupted: “Get down there and try it yourself.”\n\nShe tucked up her robes and went into the field to dig a channel. The mud was stickier than she expected, and she soon had to stop and change hands. Someone on the bank laughed at how she held the hoe. She handed it over and asked for a demonstration. The person took it reluctantly and swung twice, then complained that her channel was too shallow and extended it a little farther.\n\nThe next groups received different tasks. Those familiar with machinery tried the seed drill; those who knew the fields assessed the soil. The rest cleared channels, repaired ridges, and learned to apply fertilizer. Ichirin recorded where the machinery failed and sent the notes to the workshop, asking its makers to visit the fields before modifying it. When someone could not bear another day of heavy work, she changed their assignment instead of calling exhaustion laziness.\n\nDuring the midday break, a young man asked whether working here counted as spiritual practice. Ichirin put down her muddy water bowl and said that she too grew irritated while working and wanted to finish quickly so she could return to the shade. He teased her for not yet having a tranquil mind. “That's why I need to practice too,” she replied. “Finish the work in your hands before rushing to make someone else bear it.”\n\nShe said no more. People were arguing over water, so she went to hear both sides and helped move the stones blocking the channel's mouth.\n\nSome time later, the young man who had first objected to the dirt could inspect the machinery, and the older man who doubted there would be a harvest came every day to check the seedlings. Ichirin did not ask whether their spirits had revived. She handed the next set of tools to the experienced workers and asked them to teach the newcomers.\n\nAs she left, another argument broke out beside the field: someone had spread too much fertilizer. An old farmer told the culprit not to hide, but to come and help put it right. Ichirin stopped to listen. Once she was sure someone had taken charge, she walked back beside the channel, now flowing with water."

KYO_Ichirin_follow_hijiri:"Ichirin Will Always Follow Byakuren Hijiri"
KYO_Ichirin_follow_hijiri_desc:"Ichirin delivered the last of the farming tools to the village steward. By the time she returned to the temple, the mud on her cuffs had dried. Byakuren asked whether the journey had gone well. Ichirin first mentioned two water supplies that still needed rebuilding, then an old man who refused to hear her sermons but was willing to teach the young people how to judge soil. By the end, she was smiling herself. “He's a better teacher than I am.”\n\nWhenever people had once asked why she entered religious life, she had explained her family's arrangements and her teacher's guidance together, hoping to forestall further questions. She was accustomed to her robes and respected Byakuren, but had never wanted to consider whether she would have come here without those arrangements.\n\nDuring sermons, people had asked whether sutras could be exchanged for grain. Managing workshops, she had discovered that promised tools did not always arrive on time. Once she returned to the temple furious, feeling that her teacher had left her all the hardest questions. Byakuren listened, but did not write her next speech for her. She simply told her to find out where the tools had been delayed.\n\nIchirin eventually delivered the missing shipment and apologized to those who had waited. Someone remained dissatisfied, berating her with an old hoe whose handle had snapped. She listened to the end and took the broken tool back to the workshop. On her next visit, that person finally invited her to stay for a bowl of water.\n\n“Master, I used to resent my family too,” she said on the veranda. “Sometimes, when people call me a priest, I still wonder who chose that for me.”\n\nByakuren asked whether she still felt that way. Ichirin looked at the tools by her feet, due to be sent for repairs tomorrow. There were things she still could not resolve, she answered, but she wanted to make the next journey herself. The people there knew her now. If something went wrong, she ought to be the one to return and explain.\n\nShe bowed to Byakuren and asked her to continue teaching her. Then she lifted the tools, intending to speak with the person running the workshop first. Byakuren reminded her to eat before leaving. Ichirin agreed. This time, she did not hurry to make every word sound complete and certain."

KYO_shou_money_beg:"A Treasure Bowl"
KYO_shou_money_beg_desc:"Byakuren gave Shou the list of supplies still needed for winter and asked her to calculate the cost. Grain, medicine, clothing, and timber filled several pages, while their money would cover less than half. Shou said they could ask the merchant caravans for further donations. She spoke slowly, never mentioning her own power to attract wealth and good fortune.\n\nByakuren asked why she would not use it. Cradling the pagoda, Shou said the power came too easily. She feared growing accustomed to taking wealth at will, until even her spiritual practice became concerned only with results. Her teacher did not order her to abandon her doubts. She simply pointed to the shelters running short of medicine and asked her to calculate how much longer they could wait.\n\nOn the day they set out, Nazrin carried the ledger and Kyouko called to passersby. Shou stood at the edge of the market, trying several times to speak over the vendors' cries. She could make herself heard across a battlefield. Asking people for money and grain, however, left her afraid of raising her voice too much.\n\n“Tell them how much you need and where it will go,” Nazrin urged. “If you say nothing, all they can do is watch you stand there.”\n\nShou raised the appeal again and explained where the medicine and winter clothes were needed. She also called upon her power to gather treasure. As donated money and goods accumulated, the team counted, valued, and arranged transport for them. When someone tried to pass off spoiled grain as a full donation, Nazrin opened the sack on the spot and told him to take the unusable portion away. Shou had been about to ask her to speak more gently, but stopped when she saw the mold at the bottom.\n\nShe delivered the first batch of herbs herself, collected the shelters' receipts, and checked every expense after returning to the temple. Shortfalls remained. The wealth they had gathered still had to be spent before it could become something the patients could use.\n\nThe next time someone asked what she still needed, Shou answered without hesitation, naming both the quantities and the delivery point. That night, she placed the accounts before Byakuren and asked her to review them. The pagoda stood beside the papers. She reached out to straighten it, then circled the market she would visit tomorrow."

KYO_shou_the_best_soilder:"Myouren Temple's Second-in-Command"
KYO_shou_the_best_soilder_desc:"Requests kept arriving after Byakuren left the temple. The wounded needed beds, the guard units needed replacements, and the building crews wanted their borrowed workers back. Shou was ready to approve the first request. Only as she reached for the seal did she realize that the next two demanded the same people.\n\nShe summoned those responsible and checked the needs again. The building supervisor said the roofs could not be finished without those skilled workers. The guards refused to release anyone, citing continued disturbances at night. Sitting in Byakuren's usual place, Shou repeatedly wondered how her teacher would speak. But the people before her were waiting for her decision.\n\nShe first arranged for the wounded to move into vacant houses, freeing beds within the temple. Then she allotted shifts in which available personnel could help with repairs. She would lead a team to cover the guard posts that could not be left empty. The building supervisor still thought the arrangement too slow, so she asked which homes were still letting in rain and moved the most urgent cases to the top.\n\nOnly after the meeting did Shou realize that she had forgotten to ask about the carts carrying materials. She sent someone after the supervisor and admitted that her arrangements had been incomplete. He returned resentfully, but when he saw the routes already spread before her, he sat down and explained each leg of the journey.\n\nDecisions like these multiplied. When someone complained of warrior monks behaving arrogantly, she had to hear both sides before acting. Sometimes both sides faced real hardship, but there was only so much grain. She could not leave everything until Byakuren returned. She kept revised orders together with her reasons, continued her martial training at night, and checked on their execution the next day.\n\nWhen Byakuren came back, Shou presented the records of the past few days, pointing out her own errors first. After reading them, her teacher asked what remained unresolved. Shou turned to the final page. The list was longer than she had expected, but every item already had someone responsible for it.\n\nAnother messenger arrived outside. Shou rose to meet him. Hearing that he still wanted her decision, she invited him in and offered him the vacant seat beside Byakuren."

KYO_shou_time_to_lost_stuff:"The pagoda is gone, what a disgrace!"
KYO_shou_time_to_lost_stuff_desc:"The pagoda is missing.\n\n What a disgrace! What a disgrace! What a disgrace!\n\n Shou stood in the Myouren Temple, her palms cold, her face stiff as if about to crack. That was the pagoda, her most important possession, the one she should never have lost. And yet, in this time of post-war reconstruction, when everyone was incredibly busy, it had vanished right before her eyes once again. If it weren't for the inappropriate setting, she would have buried herself in the ground on the spot.\n\n Minamitsu couldn't help but laugh, leaning against the door, her shoulders shaking with laughter: “Oh dear, no wonder she's the most reliable second-in-command of the Myouren Temple, she even managed to lose the pagoda!” Ichirin stood to the side, her face contorted with embarrassment. She wanted to say something for Shou, but couldn't bring herself to say something like, “It's not that bad.”\n\n After all, even she felt it was embarrassing. Shou remained silent for a long time before finally steeling herself to go find Nazrin. Nazrin, who was busy organizing ledgers, heard footsteps and, without even looking up, coldly asked, “What? Lost again?”\n\n Shou's ears turned red instantly, and she whispered, “... Nazrin, the pagoda is gone.” Nazrin finally looked up, stared at her for two seconds, and then unceremoniously cursed, “You big idiot.” She slammed the ledger shut, her tone cold and practiced, as if she'd rehearsed this line countless times. “I knew it. Someone like you, who rushes to help those suffering and then can't even remember where you put your things, would do this again sooner or later.”\n\n Minamitsu laughed even harder beside her: “One's responsible for losing, the other for picking up—perfect teamwork.” Nazrin snorted, her words sharp: “If she really loses herself too, the first thing I'll do is yell at her for three days straight.” But despite her words, she stood up, her ears twitching slightly, and began calculating recent clues, suspicious people, and places where things could be hidden.\n\n “What are you standing there for?” she glanced at Shou. “Hurry up and tell me exactly where you last touched the pagoda, who you saw, and what stupid things you said.\n\n If you dare leave out a single word, I'll yell at you until I'm done looking for things.” And so, the familiar scene in Myouren Temple played out once again: Minamitsu watched the spectacle with amusement, Ichirin was so embarrassed she wanted to hide her face, Shou shamelessly bowed her head in apology, while Nazrin, cursing “big idiot,” led the swarm of rats into the secret passages, warehouses, and ruins to retrieve her pagoda. The scene was utterly absurd, yet it made one think that, in a sense, Myouren Temple's continued existence was sustained by this relationship of mutual disdain coupled with an inability to abandon the others."

KYO_shou_nothing_happen:"Nothing Happened"
KYO_shou_nothing_happen_desc:"Nothing happened. Nothing happened. Nothing happened.\n\n Myouren Temple solemnly announces that the recent reports circulating in various places regarding “a brief warehouse fire,” “a transport team nearly being attacked,” “a local disturbance escalating,” and “a pagoda almost disappearing again” are all exaggerations, rumors, or malicious smears by individuals with ulterior motives to undermine the current stable situation. The facts have fully proven that under Lord Shou's personal supervision and overall command, all problems have been properly handled, and no potential dangers have truly escalated into disaster.\n\n Nothing happened.\n\n Because Lord Shou is here. When rumors attempted to sway public morale, it was Shou who stepped forward to reassure everyone; when some tried to incite unrest during the post-war period, she personally reorganized the monks and local garrisons, extinguishing any sparks that hadn't yet ignited; when roads were blocked and supply lines were disrupted, she led the effort to reopen transportation routes, delivering batches of food, medicine, and timber back to their intended destinations. She didn't boast or claim credit, but simply, as always, managed to keep what everyone expected as a disaster averted.\n\n Most importantly, Shou's beloved pagoda remained safely by her side. It was neither lost, nor damaged, nor fell into the hands of villains. The pagoda stood unharmed, just as the order of the Myouren Temple remained intact; the pagoda still shone in Shou's hands, just as the faith of the Myouren Temple stood firmly under her protection.\n\n Nazrin would only coldly say, “Nothing should have happened,” as if this was merely the bare minimum; Kyouko, on the other hand, had already shouted “Nothing happened” all over the place, wanting every village and town to hear Shou-sama's name; even Ichirin and Minamitsu, after truly witnessing how Shou-sama suppressed one potentially out-of-control crisis after another, had to admit—she might not be a naturally reassuring leader like Byakuren, but she was certainly the one who would firmly hold the situation in the most crucial moments.\n\n Therefore, nothing happened not because the problems never existed, but because Shou-sama arrived before the problems, stood firm before the chaos, and was more determined than anyone else to prevent Myouren Temple from being humiliated in her hands. Her caution, her perseverance, and her unwavering responsibility despite knowing her shortcomings deserve everyone's praise. Nothing happened. Nothing happened.\n\n Nothing happened.\n\n Because Lord Shou was here, because the pagoda was still standing, because the deputy of the Myouren Temple had once again proven herself worthy of everyone's trust."

KYO_shou_the_tiger:0 "Fierce as a Tiger"

KYO_shou_the_tiger_desc:0 "When Shou entered the riverside settlement for the third time, she still learned nothing about Seija's whereabouts.\n\nEvery door remained closed. Some accepted packages of medicine and murmured their thanks, yet refused to say another word. Sekibanki leaned beneath the eaves, watching the monks unload sacks of grain.\n\n“They may accept your supplies. That doesn't mean anyone will help you find her.”\n\n“The wounded need their medicine first,” Shou replied. “We can discuss everything else later.”\n\nBy the time Byakuren entrusted Shou with capturing Seija, several nearby villages were already carrying messages for the fugitive. Supplies that had never arrived after the war, homes removed from reconstruction plans—Seija used every such grievance against Myouren Temple. The people of the settlements listened because some of them had already reported these problems several times without receiving an answer.\n\nShou borrowed the old registers and retraced the riverbank. The bridge had collapsed, leaving the grain carts unable to pass. The resettlement records listed only human residents, while lesser youkai had been told to find shelter elsewhere. She recorded the names of everyone responsible, returned to question them one by one, and brought whatever medicine and tools could be delivered immediately.\n\nAt first, Kagerou followed the monks moving the supplies everywhere they went. Only after they left did she inspect the storage shed to see whether anything was missing. Wakasagihime asked three times whether the road workers would dump rubble beside the waterside homes. Shou brought the builders back to relocate the material and promised that Wakasagihime could inspect the site again before work began.\n\nSekibanki did not complain any less. When a newly repaired roof began leaking, she dragged Shou inside and showed her how much of the bedding had been soaked. The original carpenter returned with new boards the following day. Sekibanki climbed onto the roof as well and helped him reset the crooked tiles.\n\nThese exchanges continued for several weeks. When there were too few hands to repair the bridge, Kagerou recruited youkai from the surrounding area. Wakasagihime guided cargo boats around the shallows. A workshop opened beside the old sheds, making doors and windows at first, then repairing farming tools. Whenever Shou returned, someone was waiting at the crossroads to show her what still needed attention.\n\nWhen Seija asked them to provide shelter once again, Sekibanki refused.\n\nThat night, all three went to see Shou. Kagerou revealed the mountain path Seija used when relocating. Wakasagihime supplied the waterside rendezvous point. Sekibanki handed over a letter arranging their next meeting.\n\n“Some of those who carried messages for her had no idea what the letters contained.” Sekibanki kept one hand on the envelope and did not release it immediately.\n\n“Investigate them separately,” Shou answered. “They will not all be arrested together.”\n\nSeveral days later, Seija was brought back to Myouren Temple. After checking the list of those taken into custody, Shou ordered the warrior monks to remove their temporary checkpoints outside the settlement. No banquet awaited her at the temple. Instead, those waiting brought news from the riverside workshop: its first set of doors and windows was finished, and they wanted her to inspect them.\n\nWhen Shou arrived, Sekibanki was trying to close a newly installed window. The frame was slightly too tight. With one pushing from inside and the other from outside, they struggled for some time before finally hearing the wooden latch drop into its slot."

 KYO_shou_follow_hijiri:"Shou Will Always Follow Byakuren Hijiri"
KYO_shou_follow_hijiri_desc:"Shou put away the pagoda and took several unfinished matters to Byakuren. Her teacher had just returned from a resettlement site, mud still clinging to her shoes. Once seated, she first asked whether enough medicine had arrived that day. Shou said one batch was still missing and that she had asked Nazrin to trace it. Only after saying so did she realize she had once again handed her the hardest part.\n\nLately, she had seen Byakuren surrounded by people asking for help, then spending entire nights finding supplies to keep her promises. Shou had once thought following her example would be enough to avoid mistakes. Only when she took over herself did she discover that someone had to follow every promise through to the end.\n\nNazrin had recovered her lost belongings and stopped swindlers exploiting her name. Shou had often thanked her, then simply handed her the next request—until one day she noticed the untouched meal lying beside her ledger.\n\nThis time, she took back the list awaiting investigation. She would meet the supplier herself; Nazrin need only identify discrepancies in the records. When Byakuren asked whether she could manage, Shou named the duties she could entrust to others instead of immediately agreeing to everything.\n\nNazrin entered to find them discussing the matter. Her first question was whether Shou intended to be sweet-talked into another mistake. Shou wrote down the discrepancies and asked her to explain them one by one, then rehearsed the questions she would ask. Nazrin still thought her wording too soft, so she revised it and tried again.\n\nAfter listening, Byakuren told her to act on her own judgment. Shou bowed and accepted the assignment, then solemnly said that she would continue following her teacher—and would speak sooner when something was beyond her.\n\nBefore leaving, she pushed the remaining ledgers back to Nazrin and took only the pages she needed that day. “Don't finish all of it for me tonight. Wait until I'm back. We'll check it together.” Nazrin snorted and reminded her not to forget the pagoda first. Shou turned back to collect it, then set out again."

 KYO_murasa_war_army_leader:0 "The Flying Dutchman"

KYO_murasa_war_army_leader_desc:0 "When Murasa put on her sailor uniform, she tugged at the collar several times. The clothes Byakuren had chosen for her were neat and practical, yet the new crewmen still fell silent whenever she approached.\n\n“They're still afraid of me, even dressed like this.”\n\n“Begin by learning their names,” Byakuren said. “They will all be sailing under your command.”\n\nMurasa had once been a living sailor herself. After being betrayed, framed, and left to sink beneath the water, she remembered the agony of suffocation—and learned how to inflict that same suffering upon others. Even now, standing on deck, she watched for anyone straying too close to the railing. Whenever she saw a hand reaching up from beneath the water, some part of her still wanted to push it back down.\n\nByakuren placed a mobile force under her command. Its duties were to relieve besieged positions, evacuate the wounded, and suppress armed unrest. Murasa knew the routes, dared to sail at night, and could recognize when a unit was on the verge of collapse. When a request for aid arrived, she often cast off before everyone else had finished arguing over the route.\n\nDuring one mutiny at a river crossing, rebellious soldiers seized a grain ship while the shore filled with people awaiting evacuation. Murasa arrived with her unit and wasted no time shouting demands from the bank. She boarded directly, overturned the ringleader onto the deck, and brought her anchor crashing down beside his ear when he tried to struggle.\n\n“Touch that helm again, and you'll return to shore from beneath the hull.”\n\nShe delivered the threat with a smile. The warrior monks behind her hurried to bind the prisoners. Only after the captives had been led away did Murasa turn to the crew and order them to secure the gangplank so the wounded could board first. When someone knocked an elderly woman to the ground in the rush, Murasa seized him by the back of his collar and dragged him to the end of the line.\n\nAfter their return, Byakuren listened to the report and asked about the casualties. She also asked about the crew members Murasa had frightened speechless.\n\n“We brought everyone back,” Murasa said with a frown.\n\n“I know. Visit them tomorrow morning. Several of them still do not know their captain's name.”\n\nMurasa did not agree, but went the following day nonetheless. A young man with a bandaged leg recognized her, made room beside his bed, and asked whether the ship had been repaired. Murasa had expected another plea for mercy. She stood there for a moment before answering that only the gangplank had cracked and would be repaired by the afternoon.\n\nFrom then on, she sometimes waited a little longer before departure, counted every member of the crew, and only then ordered the ship to cast off. She still cursed viciously at anyone who disobeyed her. Sometimes Byakuren came to see them depart. Whenever she heard Murasa call each crew member by name, she would stop at the water's edge and watch until the ship sailed out of sight."

 KYO_we_must_use_force:"Proclaim Compassion to the World"
KYO_we_must_use_force_desc:"When the Palanquin Ship arrived abroad, the officials ashore first ordered the guards to stand ready. Murasa looked at the rows of eyes fixed on her deck and muttered that she had not come to seize the port. Still, she moored at the agreed location and waited for permission for the envoys to disembark.\n\nByakuren had tasked her with carrying letters, supplies, and representatives to other countries to explain Myouren Temple's position to their leaders. Murasa was an accomplished navigator. She was less accustomed to waiting at a quay for questioning, especially when the word “youkai” made officials inspect a passenger list they had already checked.\n\nOne official asked whether the ship could fight. Murasa said yes, then pointed to the manifest and asked him to look at what she had brought today. The envoy took over, explaining the proposed aid and exchanges and inviting them to send visitors. Murasa stood aside, holding her tongue until the meeting ended before asking whether they would have to explain everything from the beginning next time.\n\nByakuren asked her to bring back the reasons for rejection as well. Some countries feared for their territory and security; others doubted that monks could restrain youkai. Each concern would need an answer. If aid was refused for now, they should leave a means of contact. Where an exchange of envoys was accepted, they should arrange the next voyage.\n\nMurasa learned to ask a few more questions: how long they could remain in port, and how visitors would travel. Her smile still left people uneasy, but when she handed over a sealed letter, she would wait patiently while they read it.\n\nThe replies they brought home varied in length. Byakuren opened the letters while Murasa marked which ports they could revisit and which must wait. On the next voyage, several guests willing to see Gensokyo for themselves came aboard. She had quarters cleared for them and went to inspect the helm and charts."

 KYO_murasa_drown_people:"Find the Next Drowning Victim"
KYO_murasa_drown_people_desc:"Murasa had spent another night beside the river. Whenever shoes sounded on the wooden bridge, she turned and followed the passerby with her eyes toward the bank. She knew the depth here. She also knew exactly how someone would lose their balance if she reached out.\n\nShe gripped the railing and did not let go until the footsteps had faded. Yet on her way back to the temple, she was still imagining how loud the splash would have been.\n\nByakuren waited on the veranda and asked where she had spent the night. Murasa said she had been checking the ship, then looked away. Her teacher did not follow the excuse with questions about the vessel. She simply told her to sit down. After a silence, Murasa admitted that she had kept thinking of dragging the person off the bridge.\n\n“I know I should stop.” She rubbed her fingers irritably. “What good does knowing do? I see someone near the water, and I want to try again.”\n\nThe innocent people who had already died at her hands had passed just as unsuspectingly. In her lucid moments, she hated what she had done. At the waterside, the same desire drew her back. Sometimes she remembered the sound of someone's struggle before remembering that they had a family.\n\nByakuren asked whether she would accept company when she went out. Murasa was about to laugh at being treated like a child. Then she remembered her hand the night before and said nothing.\n\n“You let me stay. What about next time?” she asked. “What if I don't let go next time?”\n\nByakuren told her that the temple would work to restrain that power and stop her from hurting people. If someone had already been harmed, her suffering could not erase her responsibility. Murasa stared at the floor for a long while before asking whether her teacher had ever thought of killing her too.\n\nByakuren did not immediately answer. She moved the day's assignments before Murasa, temporarily crossed out the solitary river patrol, and arranged for someone else to take it. Murasa watched the line drawn through it, her hands still on her knees.\n\nAfter a while, she gave her own itinerary as well, including the river bends she usually told no one about. Then she added, “Don't send Kyouko with me. She couldn't stop me.”"

 KYO_murasa_no_one_hurt:0 "Keeping Her Nature in Check"

KYO_murasa_no_one_hurt_desc:0 "When Murasa returned to the temple, she left her anchor in the courtyard, went inside, and immediately bolted the door.\n\nKyouko hurried after her and was about to ask what had happened when a voice came from within.\n\n“Don't come in.”\n\nHer voice was strained. Then came the same words, repeated again and again in a low murmur: “Control yourself.”\n\nThat afternoon, Murasa had seen a man bending down to wash his hands at the riverbank. She had already reached toward him, intending to seize the back of his collar and force his head beneath the water. When he stood and greeted her, she withdrew her hand and walked away.\n\nNow, whenever she closed her eyes, she could still see the collar at the back of his neck.\n\nKyouko knocked several times.\n\n“Murasa, it's me! Can you hear me?”\n\n“I can hear you. Don't stand so close.”\n\nKyouko froze, then slowly lowered her hand. Ichirin arrived and led her several paces away before taking up position beside the door herself. Nazrin redirected passing monks through another corridor and removed the tools lying nearby. Food and water were placed beside the door, but no one knocked again to urge Murasa to take them.\n\nAfter nightfall, the room suddenly fell silent. Just as Ichirin stepped forward, the door bolt rattled violently.\n\n“Murasa?”\n\nSomeone pressed against the other side of the door. After a long silence, Murasa forced out the words through clenched teeth.\n\n“I want to go to the river.”\n\nIchirin placed her hand firmly against the door.\n\n“I will remain here tonight. If you want to come out, tell me first.”\n\nAt last, the footsteps retreated. Shou sat down beneath the veranda and quietly began reciting a sutra. When Byakuren arrived, she listened for a while before calling Murasa's name.\n\n“I nearly did it today,” Murasa said.\n\n“Is that man safe?”\n\n“He's fine. He even greeted me.”\n\nA short laugh escaped from the room, then abruptly died.\n\n“He knew nothing. But I still can't stop thinking about...”\n\nByakuren sat down outside the door.\n\n“Remain here tonight. I will stay with you.”\n\nLate in the night, Shou reached a familiar passage. A broken voice began reciting along from behind the door. Murasa missed several lines and started again from the beginning. Kyouko heard her and nearly called out, but when Byakuren raised a hand, she merely moved closer to Ichirin and sat hugging her knees.\n\nSeveral nights passed this way. During the day, Nazrin replaced the untouched meals that had gone cold beside the door, while Ichirin and Shou took turns keeping watch. Kyouko came every day and, through the door, told Murasa who had tied a ship's rope incorrectly that morning. After finishing, she waited a little while before returning to her work.\n\nOn the third day, Murasa finally drew back the bolt herself. She opened the door only a narrow crack and first saw the cushions arranged along the veranda.\n\nByakuren rose and approached, stopping within Murasa's reach.\n\n“I still can't go back to the docks,” Murasa said quietly.\n\n“Someone has already taken your shift.”\n\nMurasa nodded, one hand still gripping the edge of the door.\n\n“Could you sit here a little longer?”\n\nByakuren moved her cushion closer. Murasa sat down just inside the doorway. When a bucket clattered in the courtyard, her fingers tightened again.\n\nThis time, she raised her head and called for her master."

 KYO_murasa_lord_captain:"The Great Starship Captain"
KYO_murasa_lord_captain_desc:"The fleet ran into bad weather, and the ships astern repeatedly lost the signals ahead. Murasa stood at the helm. Seeing her attendant busy reporting the wind strength and wave height, she told her to save her breath and establish the rear ships' positions first.\n\nThe channel narrowed ahead, but the wind had already scattered their formation. She ordered the lead ship to slow down, forbade anyone from racing for safety alone, and had the change-of-course signal relayed repeatedly. When someone suggested going straight through, she pointed to the reef showing between the waves, swore, and adjusted course herself.\n\nThe detour cost considerable time. People on deck hurried to secure the cargo. Murasa watched the water and the ship's response without joking with anyone. Only when the rear vessels caught up did she allow the formation to regain speed gradually. The lagging ship reported minor damage, so she assigned another to stay with it rather than leaving it alone in the storm.\n\nCheers rose from below once they cleared the dangerous stretch. Murasa leaned against the wheel, grinning, and asked who had thought she was taking the wrong route. The person she addressed dared not answer. She called him over anyway and showed him what they would have struck on the original course.\n\nShe enjoyed praise for her abilities and had no intention of pretending otherwise. Yet when they docked and took stock, the captain's first question was still whether anyone was missing. Cargo and hull inspections came afterward. Every damaged section needed repair, and the next voyage could not simply copy today's route.\n\nMurasa added the new observations beside the old chart and told someone to keep them safe. Several letters nearby still awaited delivery. She read their destinations and began calculating when they could set out again."

 KYO_murasa_follow_hijiri:"Murasa Will Always Follow Byakuren Hijiri"
 KYO_murasa_follow_hijiri_desc:"When Murasa returned her voyage log, Byakuren asked how she had been sleeping. She meant to say well enough. Seeing that her teacher had not put the log away, she admitted that she still heard water at night. Several times, she had woken to find herself already beside her door.\n\nByakuren asked her to record when the episodes occurred, adjust her duties, and continue the exercises they had agreed upon. Murasa accepted reluctantly. Before leaving, she asked, “What if I'm still like this after practicing for so long?”\n\nHer teacher promised no deadline. She asked only whether Murasa had called someone on those occasions. Murasa said she had, then complained that a captain now had to find company before going outside. Byakuren listened and asked her to sit back down and finish explaining what had happened.\n\nOnce, Murasa had refused to discuss these things. When lucid, she found them shameful; when the urge rose, she hated anyone restraining her. Afterward, she hoped a well-executed voyage would let her avoid the subject. Even now, she repeatedly wanted to change the topic halfway through. In the end, she spoke even the thoughts she found hardest to hear.\n\n“I'm not better yet,” she said quietly.\n\nByakuren nodded and showed her the notes. Together, they discussed which tasks she could continue and which temporarily required company. Murasa pointed to one place and explained that she no longer wanted to pass it alone, even if that meant a detour. Her teacher revised the route and asked whether she wished to keep trying.\n\nShe studied the paper for a long time before answering yes. She still wanted to steer for Byakuren. She also wanted to know whether, one day, she could approach a riverbank and think first of the person beside her.\n\nBefore leaving, Murasa paused at the door again. “If I use the ship as an excuse next time, ask me directly.” Byakuren agreed. Only then did Murasa put away the records and go to find her companion for the next journey."

KYO_kyouko_spring_time:0 "Everyone's Ray of Sunshine"

KYO_kyouko_spring_time_desc:0 "Whenever the residents of Myouren Temple heard two identical sneezes, they knew Kyouko was with Murasa again.\n\n“Do you have to imitate that too?”\n\n“It just came out.”\n\nMurasa raised the wet cloth in her hand, but Kyouko had already fled laughing. Lunch had yet to arrive, and the workers waiting beside the lumber for repairs to resume joined in the laughter.\n\nWhen Kyouko first arrived, even running that short distance would have exhausted her.\n\nAfter the Great Hakurei Barrier shattered, many weaker youkai began to fade. Kyouko also noticed her voice growing fainter. Whenever she shouted across the valley, she often had to lean against a rock and rest for a long while afterward. She tried frightening travelers, but they did not even turn around. Instead, she ended up crouching beside the road, too exhausted to know whether she would wake the following day.\n\nByakuren rescued her. She taught Kyouko how to regulate her energy and recite the sutras, gradually stabilizing the spiritual power draining from her body. At first, Kyouko could never remember the proper order. Halfway through a recitation, she would panic and look to her master. Byakuren would simply begin again with her, waiting patiently each time until she caught up.\n\nWhen Kyouko was finally able to complete the morning prayers alone, she tried shouting down the mountain once more. This time, she still had enough strength to laugh afterward.\n\nShe then asked to remain at the temple, becoming the first new youkai follower Byakuren accepted after her release from the seal. The edges of her sutra book soon became frayed. Blades of grass marked several pages whose passages she did not understand. Gradually, she stopped waiting along mountain roads to frighten passersby. Each morning, she swept the courtyard first and then joined everyone in prayer.\n\nOutside the temple gates, however, she still had much to learn.\n\nOne man praised her kindness and claimed that an elderly relative could no longer walk. He asked her to carry medicine and food to an isolated, empty house. Kyouko had barely lifted the basket when Nazrin called her back.\n\n“Which household? Are they listed in the resettlement register?”\n\nKyouko could not answer. By the time they investigated, they discovered that the man had already collected two allotments and had repeated the same story to monks elsewhere.\n\nKyouko was so angry that she said nothing all the way back. Once they returned to the temple, however, she asked Byakuren whether there might truly be an elderly person in his family.\n\n“Send someone to verify it. If aid is needed, we will provide it. This time, you will accompany one of your senior sisters.”\n\nFrom then on, Kyouko always had a companion when she left the temple. Ichirin taught her to hear the full instructions before setting out. Shou took her from house to house to verify requests. Murasa kept her working at the docks so she would not hear someone calling in the distance and run off with supplies meant for somewhere else.\n\nKyouko still loved to interrupt. Sometimes she echoed Ichirin's hurried orders word for word, only to receive an exasperated, “I was calling you over here.” When wounded people complained that she was too loud, she covered her mouth and set down their water as quietly as possible, waiting until she reached the courtyard before speaking again.\n\nThe workers gradually came to know her. When they raised beams in the afternoon, someone would often ask her to call the cadence. During breaks, children gathered around and begged her to imitate the captain scolding her crew. Whenever Murasa heard and shouted Kyouko's name from halfway across the docks, Kyouko immediately ducked behind a wooden crate—though her ears remained plainly visible above it.\n\nWhen Byakuren came to collect her, Kyouko was discussing with several children where they should hide tomorrow so Murasa would not find them.\n\n“Will you come again tomorrow?” the youngest asked, tugging at her sleeve.\n\nKyouko first looked to Byakuren. When her master nodded, she happily promised that she would. On the way home, she remembered the blades of grass tucked inside her sutra book, hurried to Byakuren's side, and asked about a passage from the morning prayers that she had not understood."

 KYO_kyouko_democracy_shipping:"A Voice Heard Around the World"
KYO_kyouko_democracy_shipping_desc:"Before the medicine cart entered the village, Kyouko had already climbed to a high point beside the road and called out its arrival to the resettlement site. People began running toward her. She hurried to add that medicine was going to the infirmary, grain registration was elsewhere, and they must not all crowd around the cart.\n\nThese errands soon filled her days. In the morning she announced where porridge would be served; in the afternoon she called for workers at building sites. When people became separated, she repeated their names along the roads. The valleys carried her voice far. Where echoes made her unclear, she went closer and said it again.\n\nWhen someone heard only the first half and went the wrong way, Kyouko took them aside to show the route and divided what she had once shouted in a single breath into shorter messages. She still made jokes, but dared not omit the time or place. When Ichirin asked whether she remembered, she recited the notice once, then checked the paper in her hand again at the junction.\n\nAn old man who had come for grain later helped identify people at the shelter. A refugee youkai heard that a workshop needed helpers and asked whether it took people who could not read. Kyouko ran to check, then brought him to meet the supervisor. Days later, she spotted him among the porters and shouted a greeting across a cart. With his hands full, he could only lift his head and call back.\n\nByakuren entrusted her with more and more announcements. Kyouko wrote each location on paper, afraid that excitement would make her skip one. Messengers took the same notices farther afield, and villages along the way began passing them on using the method they had heard from her.\n\nAt dusk, Kyouko was still reluctant to leave and asked whether anyone needed one more call. The supervisor told her the last lost child had been reunited with family. Only then did she fold the paper away and take the mountain road back to the temple. Passing the quiet shelters, she tiptoed and lowered her voice to say goodnight."

 KYO_kyouko_is_too_loud:"That Noisy, Annoying, Silly Dog"
KYO_kyouko_is_too_loud_desc:"Kyouko was helping at the entrance when an argument broke out at the resettlement site. Hearing someone denounce unfair distribution, she ran over as usual, hoping to lift everyone's spirits with a shout.\n\n“Don't look so gloomy! Things will get better!”\n\nNo one smiled with her. A woman holding an empty sack asked whether they could eat today first. Someone else said their relatives were still missing, yet Kyouko had already decided everyone ought to be happy. She stood there, her ears slowly drooping. She tried to explain that she meant well, only to be stopped by, “Then stop shouting for a moment.”\n\nNazrin drew her aside and pointed to the still-empty rice sacks. “Listen to what they need before you speak.” Ichirin did not make excuses for her, merely telling her to stay and help. When Byakuren arrived to settle the dispute, Kyouko hid at the back. For the first time, she did not know how loudly to call her teacher.\n\nOnly by listening to the continuing argument did she learn that a grain shipment was overdue and some people had already waited twice. The woman with the empty sack had gone a long time without eating, yet still had to queue for her household. Kyouko had been so intent on cheering them up that she had never asked.\n\nWhen the crowd thinned, she approached and quietly apologized. The woman did not immediately respond. Kyouko asked whether she could leave the sack with her and sit nearby for a while. After studying her, the woman finally handed over its mouth.\n\nLater, when news arrived, Kyouko instinctively opened her mouth to shout, then paused to confirm it with the supervisor. She clearly announced the arrival time and returned to watch the empty sacks.\n\nBack at the temple that day, she did not follow Byakuren around asking whether she was stupid. She simply wrote down what the site still lacked, ready to ask about it tomorrow before speaking."

KYO_kyouko_is_good_dog:0 "The Cutest, Cutest, Cutest Dog"

KYO_kyouko_is_good_dog_desc:0 "The food had all been distributed, but Kyouko was nowhere to be found.\n\nIchirin went around the back of the building and found her crouching in the mud with several children, watching ants carry away a grain of rice. One child built them a bridge from a twig. Kyouko decided it was too narrow and added another. Only when Ichirin called her name did she scramble to her feet, brush the mud from her skirt, and hurry back to gather the empty sacks.\n\nThe children followed, all clamoring to carry something for her. The youngest could not lift a sack, so Kyouko handed him a stone she had found and solemnly instructed him, “Don't lose this one. It looks exactly like a rice ball.”\n\nAfter spending so long at the settlement, Kyouko knew which elderly residents had trouble walking and whose children always cried at night. She worked hard when there were supplies to carry and listened patiently when someone needed company. Her only problem was that she could get carried away playing. Once, while competing to see who could make the biggest splash, she soaked her entire face and still insisted that her shoes were to blame.\n\n“Kyouko is the cutest dog ever!” the children shouted with laughter.\n\nHer ears immediately stood upright. “I'm a yamabiko! Ya-ma-bi-ko!”\n\nThe next time someone got it wrong, she made them repeat the word three times. Unfortunately, the children found that entertaining too. They crowded around her, chanting it in a thoroughly uneven chorus until even the elderly people mending clothes nearby began to laugh.\n\nAt first, some adults would pull their children close and warn them not to touch a youkai's ears. Later, they began asking Kyouko to watch the children for a while. Before leaving, they would tell her where they were going—and remember to leave her a share of the snacks.\n\nOnce, at the food distribution point, Byakuren overheard a mother ask, “Can she really go on living like this? Without frightening people?”\n\nByakuren remembered all too clearly how Kyouko's spiritual power had once dwindled until she nearly faded away. Even now, she still had to train every day. She often misread the sutras and would return to the temple clutching her book, ready with another question.\n\n“I am teaching her,” Byakuren replied. “She still has much to learn.”\n\nThe mother considered this for a moment, then handed Kyouko the coat her child had left behind and asked her to take it inside.\n\nKyouko answered with a resounding yes. From somewhere in the distance, someone immediately echoed her reply. Laughing, she called back, tucked the coat securely under her arm, and followed the voice into the courtyard."

 KYO_kyouko_apprentice:"Reading Buddhist Scriptures Intensively"
KYO_kyouko_apprentice_desc:"Kyouko initially followed Byakuren not because she truly understood many scriptures. She simply liked the liveliness of Myouren Temple, liked being called by name, and liked that here, unlike the outside world, youkai were not always treated as something to be feared, driven away, or eventually consumed. But the longer she followed Byakuren, the more she understood that enthusiasm, a few echoes, and a face that always made people smile were far from enough. Myouren Temple was too busy.\n\n Some had to provide relief, some had to clean up construction sites, some had to comfort the displaced, and some had to maintain the order that could crack again at any moment. When Kyouko first truly witnessed all of this, she didn't feel retreat, but rather a somewhat clumsy yet genuine sense of resentment—she didn't want to forever remain the junior disciple responsible for enlivening the atmosphere, nor did she want to always stand behind others, being protected, cared for, and reminded. She wanted to truly share some of the burden for Myouren Temple, to be able to do her job well even when Byakuren wasn't watching her.\n\n So, she finally sat down quietly and began to carefully read the Buddhist scriptures page by page. It wasn't easy for Kyouko. She wasn't the type to sit still; her ears would always chase after outside sounds, and her mind would often wander aimlessly. But she still gritted her teeth, pressed herself against the scriptures, learned from Byakuren, followed her questions, and memorized, pondered, and tried to understand why these words had sustained Myouren Temple to this day.\n\n She gradually understood that Buddhism wasn't just about speaking gentle words or constantly uttering words of compassion. It taught how to remain calm amidst chaos, how not to turn away from suffering, and how to reach out and help others even when you know they each have their own troubles, biases, and hardships. The more Kyouko read, the more she realized she had previously been like an outsider, jumping around watching the spectacle, but now she was truly grasping the essence of things.\n\n And these scriptures didn't just remain on paper. She began to apply what she had learned to her daily life at Myouren Temple: helping those who were overwhelmed with work, looking after the newly taken-in, still wary young girls, sitting with those who had lost loved ones and didn't even want to speak, and reiterating the teachings of Byakuren in a way that others could understand. Her voice remained bright, and her laughter still resembled that of a child, but that brightness had slowly gained weight. Looking at Kyouko, Byakuren felt a sense of relief.\n\n She knew that this little yamabiko, who always loved to run around and whose mind was as restless as a spring breeze, was finally beginning to stand firm. She was no longer just the most endearing and lively one in Myouren Temple; she was beginning to become someone who could bear the burdens of others. Perhaps Kyouko wasn't mature yet, but she was already moving in that direction.\n\n Byakuren also hoped that one day Kyouko could continue to pass on what she had learned from Buddhism to more people. To enlighten those lost humans, to support those youkai who were about to disappear, and to make them understand that neither humans nor youkai are simply things pushed along by fear and fate. As long as they are willing to cultivate their minds, willing to support each other, and willing to continue to do good in this broken world, then peaceful coexistence will not just be an empty phrase in the scriptures of Myouren Temple.\n\n And Kyouko will ultimately become one of the true pillars of the new generation of Myouren Temple. Not because she is the smartest, nor because she is the strongest, but because she is willing to learn, willing to grow, and willing to hone her warm heart into something that can illuminate others."

KYO_kyouko_follow_hijiri:0 "Kyouko Will Follow Byakuren Forever"

KYO_kyouko_follow_hijiri_desc:0 "When Kyouko first came to live at Myouren Temple, her favorite time of day was the bustle before supper. If someone in the kitchen called for more firewood, she would run to fetch it. If someone called her name from the courtyard, she would answer at the top of her voice, even through several closed doors. Byakuren had saved her and given her a place to stay. Kyouko could not yet explain the teachings in the sutras; she only knew that someone here waited for her to come home every day.\n\nLater, more and more people began gathering outside the temple gates in search of help. Ichirin was often too busy to eat, while Shou sat over the account books deep into the night. Wanting to do more, Kyouko eagerly volunteered to receive the newly arrived villagers.\n\nOn her first day, she promised accommodations to three families.\n\nBy the time Ichirin arrived, every vacant room was already occupied. Kyouko stood in the corridor with a family of five, still clutching the bedding she had collected for them. Their mother did not scold her. She merely asked where her children were supposed to sleep that night.\n\nKyouko opened her mouth several times before finally lowering her head.\n\nByakuren and the others gave up their own rooms. Even after everything had been settled, Kyouko remained crouched beneath the veranda, staring at the now-empty bedding rack.\n\n“I've caused trouble for everyone again.”\n\nByakuren sat beside her and asked what she had been thinking at the time.\n\n“They had traveled so far. The children wouldn't stop crying, and I wanted to make them feel better.”\n\n“When you made that promise, did you ask Ichirin whether any rooms were still available?”\n\nKyouko shook her head.\n\n“Ask her tomorrow, then write down how many people we can accommodate. If there truly is no room, come to us sooner. It is better to make someone wait a little longer than to leave them wandering around with their bedding in their arms.”\n\n“But won't they think I'm useless?”\n\n“They need you to help their family find shelter, Kyouko. See to that first.”\n\nThe next day, she took pen and paper to Ichirin and asked about every bed, blanket, and place where meals were distributed. Her writing was so cramped that Ichirin could not read it, so she copied the entire thing again. By the afternoon, several more notes had appeared: those who had difficulty walking should be placed downstairs; anyone requiring medicine at night must inform the person on duty.\n\nShe was still easily flustered. Whenever someone sighed, she tried to cheer them up. Whenever someone cried, she rushed to promise that everything would be all right. Once, while comforting a wounded man, he suddenly lashed out and demanded whether she had any idea what it felt like to lose a leg.\n\nKyouko stood frozen beside his bed, still holding his water, until he told her to leave.\n\nThat evening, she did not lead the children in song as she usually did.\n\n“Master, I really was trying to help him.”\n\n“Did you hear what he was saying?”\n\n“He said he wouldn't be able to work anymore, and that no one would hire him...”\n\nKyouko fell silent. She remembered that she had kept telling him not to be sad, yet had never responded to any of those words.\n\nShe returned the next day and began by apologizing for what she had said. The man still had little interest in speaking to her, so she set down the water and asked what kind of work he had done before. After several trips between construction sites and storehouses, she finally found him a job that could be performed while seated. The pay was poor, and she told him so honestly. She made no promise that he would enjoy it.\n\nAfter asking for the location, he finally gave her a nod.\n\nKyouko ran all the way back to the temple and did not remember to catch her breath until she was standing before Byakuren. She recounted the entire story twice, imitating the man's final “thank you” so precisely that it sounded just like him. Byakuren listened with a smile, then told her to wipe the sweat from her brow first.\n\nThere were still many passages in the sutras she could not understand, but she began bringing Byakuren questions inspired by the problems she encountered each day. When she could not break up an argument, she asked her senior sisters for help. Nazrin occasionally complained that her questions were too particular, yet gradually began entrusting her with handovers before leaving on an errand. Even when Ichirin was busy, she could now leave the newly arrived residents in Kyouko's care without worry.\n\nBefore winter, Byakuren prepared to visit the nearby villages. Kyouko packed her bundle for the journey, only to be told that she would remain behind this time to oversee several days of food distribution and resettlement.\n\n“I'm in charge?” she asked at once. “Do the others know?”\n\n“We have discussed it. If you encounter something you cannot decide, ask Shou.”\n\nKyouko held the bundle against her chest. It took her a long moment to nod.\n\n“But I still have so much I want to learn from you, Master.”\n\n“When I return, we can discuss it at our leisure. I would also like to hear what happened while I was away.”\n\nKyouko smiled, then spoke again with great solemnity. “Then you must come back soon. I still have many years of learning ahead of me—and I intend to remain at your side for all of them.”\n\nOn the day of Byakuren's departure, Kyouko stood before the temple gates and waited until her master had gone far down the road before waving farewell. Her voice carried across the fields, making everyone in Byakuren's company turn to look back.\n\nBehind her, someone asked where the food was being served that day. Kyouko answered immediately, set her broom against the wall, and led them into the courtyard."


 KYO_hijiri_our_lord_and_savior:"From the Myouren Temple"

KYO_hijiri_our_lord_and_savior_desc:"When the disciples returned from their respective paths, none of them became another Byakuren.\n\n Nazrin remains suspicious, but has learned to leave a way out for others even amidst doubt; Ichirin no longer mistakes responsibility for fate, but instead chooses the path she wants to take; Shou is still clumsy and still prone to self-blame, but has become able to support Myouren Temple even when Byakuren is absent; Minamitsu hasn't completely shaken off the old grudges from the deep waters, but she's begun to restrain her hurtful instincts; Kyouko is still noisy, naive, and easily trusting, but has finally learned when to speak and when to listen first.\n\n Byakuren didn't heal all their gap, nor did she turn them into uniform disciples. She simply helped each of them find a place to belong, and taught them to extend an imperfect hand when someone is about to fall.\n\n After dinner was served, they still argued, mocked each other, and clattered their bowls and chopsticks. But no one left the table because of it.\n\n Looking at this group of Youkai with such different personalities, backgrounds, and desires, Byakuren saw for the first time so clearly that the Myouren Temple itself was the smallest prototype of what she was pursuing.\n\n If such a troublesome group of Youkai could sit at the same table, then perhaps humans and Youkai could live together without having to become each other.\n\n Now, she had to take this question out of the temple gates."

KYO_hijiri_my_apprentice:"Seeking Insights from All Beings"

KYO_hijiri_my_apprentice_desc:"Byakuren did not immediately send her disciples to teach Buddhism to the world. She first let them see, hear, and understand how beings outside the temple gates truly lived.\n\n The mission traversed post-war villages, factories, colonies, and borders. Nazrin was tasked with exposing the overly beautifully packaged lies; Ichirin spoke with workers, farmers, and thinkers, listening to their stories of hunger that faith could not directly quench; Shou visited leaders in various places, venturing into the slums rarely visited by them; Minamitsu piloted the sacred chariot ship, transporting supplies and witnessing how wealth flowed through the port, bypassing those who needed it most; Kyouko brought back the voices she heard along the way, bringing back not only praise but also doubt, anger, and rejection.\n\n They originally went to help the world understand the Myouren Temple, but ultimately discovered that the Myouren Temple also needed to understand the world.\n\n The journey to enlightenment is not about bringing pre-prepared answers to others. The true scriptures are written in the lives of sentient beings—how they suffer, how they deceive, how they love, and how they leave a meal for a stranger in dire straits."

KYO_hijiri_has_shortcoming:"The Two Sides of Humans and Youkai"

KYO_hijiri_has_shortcoming_desc:"Among the accounts her disciples brought back were youkai protecting the wounded and humans exploiting the chaos to steal relief supplies. The compiler wanted to feature the former prominently. Byakuren turned back to another page, pointed to an account of a youkai hurting someone, and asked why it had been relegated to the end.\n\n“Include this too,” she said.\n\nShe remembered what she herself had concealed to protect youkai and knew that Murasa still had to restrain her instincts. Choosing only praiseworthy stories would leave them unable to answer those who had suffered. She instructed her disciples to retain the sequence of events, the victims' accounts, and what the temple had subsequently done.\n\nSome feared that circulating such material would make outsiders even more afraid of youkai. Byakuren replied that wrongdoing had to be explained. Equally, an account of a youkai caring for someone unrelated to it should not be omitted because of its origins.\n\nThe revised collection would be sent far and wide. It contained gratitude, betrayal, protection, and harm. A name and species alone could not tell the reader what came next. Ichirin paused at an account of a tsukumogami guarding its former owner's home and asked about several details. Byakuren told her to verify them again and record the tsukumogami's own words as well."

KYO_hijiri_can_not_save_everyone:"No one is born to bow down."

KYO_hijiri_can_not_save_everyone_desc:"Oppression in the world doesn't only occur between humans and youkai.\n\n Colonial empires defined people in distant lands as subjects, laborers, and numbers to be conscripted; mines, railways, and factories devoured their lives, then sent wealth to cities where these dead had never seen them. The strong determined the place of the weak, civilization named barbarism, and masters told their servants that all of this was the naturally formed order.\n\n Byakuren cannot accept this notion. If humans can enslave humans, and youkai can trample on the weak youkai, then merely ending the hostility between humans and youkai is far from coexistence. The world cannot praise equality for all beings while allowing a few nations to treat other peoples, lands, and nature as their own property.\n\n Myouren Temple will first bring food, education, organizers, and the power to empower the locals, and will also give the rulers a chance to stop the oppression. But Byakuren no longer believes that everyone will turn back simply because they hear the truth.\n\n Compassion cannot demand that the suffering wait forever. If those self-proclaimed masters insist on holding onto the chains, the Myouren Temple will sever them with its own hands."

KYO_hijiri_we_are_rule:"Leaving a Place for All Beings"

KYO_hijiri_we_are_rule_desc:"As more and more countries are willing to accept the Myouren Temple's aid and protection, Byakuren must answer an even more difficult question: In this new shared society, where should humanity, youkai, and nature stand?\n\n This so-called place is not about confining humanity to cities, driving youkai back to the mountains, and leaving nature as an unattended empty space between the two. Humans need fields, roads, industry, and jobs to support their families; youkai need to perpetuate their culture, abilities, and ways of life; forests, rivers, and mountains cannot be allowed to exist only when they are undeveloped.\n\n If human development requires the complete disappearance of Youkai, then it is a world solely for human consumption. If the survival of Youkai requires humanity to live in perpetual fear and sacrifice, then it is merely another form of domination. If both treat nature as an inexhaustible resource, then all living beings will ultimately lose their home.\n\n What Byakuren seeks to establish is not a hierarchical hierarchy, but a shared bottom line: humans have the right to build and live, Youkai have the right to exist in their own form, and nature must also have space for restoration and continuation. Neither side can reduce the other two to mere sustenance, tools, or obstacles.\n\n Countries willing to accept this bottom line will be invited into the new order established by the Myouren Temple. They do not need to convert to Buddhism or abandon their names, but they must acknowledge that the world no longer belongs solely to the most powerful life form."

KYO_hijiri_divine_savior:"Let Goodwill Take Root on Earth"

KYO_hijiri_divine_savior_desc:"Mutual understanding alone is not enough to sustain coexistence.\n\n A person who suffers from hunger year-round will find it difficult to let go of hatred because of a few Buddhist teachings; a person who may disappear at any time due to the loss of legends and dwelling places will not believe in tomorrow based solely on human guarantees. If land, wealth, education, and security remain in the hands of a few, then so-called tolerance is merely a virtue that only the wealthy can afford to maintain.\n\n Byakuren re-examines Buddhism and socialism. Buddhism allows her to see that all beings suffer, while socialism points out that much suffering does not stem from individual evil, but from the way wealth, labor, and power are distributed. The two need not be adversaries: compassion must be grounded in food, housing, schools, healthcare, and the dignity of labor, and equality must remember that behind every number lies an irreplaceable life.\n\n Myouren Temple will gradually connect the production, relief, and administrative systems of various countries, allowing resources to cross old borders and reach those who truly need them. Common life cannot rely solely on the self-awareness of good people; it must possess a foundation that continues to protect the vulnerable even when saints are no longer present.\n\n Byakuren will borrow from socialism's insights into reality, but will not treat any theory as unquestionable truth. For a pure land to be built on earth, it must be able to accommodate the questions of all beings."

KYO_hijiri_love_is_everything:"We Can Live Together Without Being the Same"

KYO_hijiri_love_is_everything_desc:"As regions prepared to join their shared world, a draft integration plan reached Byakuren. Following clauses on protecting life, aid, and basic rights came a requirement to impose a single doctrine. Asked why, its drafters said that different beliefs would inevitably bring further conflict.\n\nByakuren turned to the list of communities and found that several existing names were to be changed as well. She removed those pages and asked the representatives to explain their local beliefs and ways of life. Some feared the temple would take over their festivals. Others asked whether non-Buddhists would still receive assistance.\n\nShe confirmed at once that aid would be distributed by need and that the law would protect nonbelievers equally. Communities could retain their languages, customs, and old names. Disputes would be settled under common law; differences of faith could not justify stripping anyone of their rights.\n\nIchirin read the revised clauses aloud. Some representatives still wanted to take them home for discussion. Byakuren agreed and left those matters open for further negotiation, without treating hesitation as a rejection of coexistence.\n\nBefore leaving, the representative who had asked about the festival confirmed its date once more. Byakuren told him to proceed as usual and asked whether he needed supplies transported. He took out the list he had put away and sat back down at the table."

KYO_hijiri_all_bow_to_her:"Reclaiming Equality Under the Red Flag"

KYO_hijiri_all_bow_to_her_desc:"Socialism once promised that workers would no longer be cogs in a machine, and that the oppressed would reclaim the right to determine their own lives. Byakuren understands this aspiration and sees in it the practical tools that Buddhism lacks.\n\n However, news from Russia is making this ideal seem unfamiliar. The party-state claims to represent all workers, yet forbids them from opposing it; bureaucrats, in the name of the people, decide what the people should say and believe, while regarding hesitation, criticism, and differing opinions as errors that must be eliminated.\n\n The old era divided masters and servants by bloodline; the new despotism divides the correct and the enemy by ideology. It doesn't necessarily require all people to have the same face, but it demands that everyone understand the world in the same way.\n\n This is also not equality. If equality doesn't allow for dissent, all that's left is everyone obeying in the same way. If liberation requires first transforming living people into the form required by theory, then ultimately only theory itself will gain freedom.\n\n Byakuren will not abandon socialism's pursuit of labor, wealth, and dignity. She wants to reclaim these ideals occupied by bureaucrats and the secret police and return the right to choose one's path to all people."

KYO_hijiri_do_my_best:"Rejecting a World That Only Tolerates One Bloodline"

KYO_hijiri_do_my_best_desc:"The answer given by fascism is simple and cruel: the world doesn't need to learn how to coexist, it only needs to decide who is qualified to stay.\n\n It molds nations into a pure whole, expelling people of different bloodlines, cultures, and ideologies from the community, and then using obedience to prove loyalty. For such a regime, youkai are naturally foreign beings that must be eliminated or enslaved; and within humanity, there will always be those who, because of birth, beliefs, or physical conformity, are deprived of their status as human beings.\n\n Byakuren has already seen where this ideology will lead the world. It first demands that people hate strangers, then continuously narrows the scope of those who can be called compatriots, until everyone must step on another to prove they are pure enough.\n\n Faced with such an enemy, preaching cannot replace resistance. Peace is not about granting the executioner's knife uninterrupted freedom, nor can compassion demand that those about to be killed first understand their executioner.\n\n The Myouren Temple will fight alongside all who are willing to resist. Not to prove that Youkai are superior to humans, but to ensure that race, bloodline, and birth no longer determine who lives in this world."

KYO_hijiri_everything_be_as_intented:"Reject a world that only tolerates one ideology"

KYO_hijiri_everything_be_as_intented_desc:"Red dictatorship doesn't always appear as hatred of other races. It prefers to claim that all differences will eventually disappear with the victory of the right ideology.\n\n It can accept humans and Youkai, as long as they surrender their judgment and become part of the state apparatus that can understand and use. It praises equality, yet expels those who refuse to submit from the people; it promises the future, yet treats the present masses as raw materials for that future.\n\n This is precisely what Byakuren finds most unacceptable. Coexistence is not about allowing different lives to exist temporarily until they are educated into the same kind of people. Youkai don't have to relinquish their origins, nor do humans have to submit their emotions, beliefs, and questions to state scrutiny to qualify for shared life.\n\n Byakuren doesn't oppose the workers' desire for equality, nor the people's right to change the old society. What she wants to end is the state that monopolizes equality, decides the only path for everyone, and uses ideals to excuse oppression.\n\n If it still insists on reducing millions of voices to only one, Myouren Temple will stand beside those forced into silence."

KYO_hijiri_the_world_of_peace:"A New World of Coexistence"

KYO_hijiri_the_world_of_peace_desc:"Black dictatorship will fall, and red dictatorship will lose its power to rule over all. One determines who can exist based on bloodline, the other on ideology; they use different banners to give the same answer—only those who are alike can live together. Byakuren ultimately rejected this answer.\n\n The new world does not require humans to become youkai, nor does it require youkai to first learn to play the role of humans. Cities will still expand, but space must be left for rivers, forests, and the lives that depend on them; youkai can preserve their appearance, abilities, and culture, but can no longer harm the weak under the pretext of nature; humans can continue to build, invent, and change the environment, but no longer have the privilege of determining the value of all life.\n\n There will still be lies and betrayals between people, and youkai will not necessarily love each other. Humans can sometimes be more terrifying than youkai, and youkai can sometimes be more compassionate than humans. Living together didn't eliminate these conflicts; it merely prevented race from becoming a license to harm, and power from automatically granting the right to dominate others.\n\n Children began to appear in schools, learning alongside humans and Youkai. Human doctors treated Youkai, and Youkai craftsmen built houses for humans; mountain newspapers still criticized the system left by Byakuren, and local areas continued to argue over resources, beliefs, and old grudges. It was precisely because these voices weren't silenced that the world didn't become another outwardly gentle cage.\n\n Byakuren didn't make all beings similar. What she did was ensure that those who differed no longer had to rely on expelling, enslaving, and destroying others to gain their place.\n\n This wasn't a pure land where all problems had disappeared.\n\n But finally, all beings could live in the same world, bearing their own names."





KYO_Seija_start:0 "The Victory of the Underworld"
KYO_Seija_start_desc:0 "Seija Kijin didn't overthrow the old order to sit on the throne. She abhorred oppression, hierarchy, and all rules that trampled the weak, and was always wary of new masters emerging after the revolution's victory.\n\n Now, the underworld has won the battlefield. Next, she must prove that she can not only destroy the old world, but also truly empower the underclass and lead the revolution towards a future where the weak will not be betrayed again."




 KYO_rebuild_the_broken_land:0 "Repairing the Broken Land"
 KYO_rebuild_the_broken_land_desc:0 "The revolution has won, but not a complete nation; it has created a land torn apart by gunfire, hatred, and hunger. Seija must prove that the underworld can not only overthrow the old order, but also rebuild the collapsed Gensokyo."




 KYO_nue_question_of_society:0 "The Encounter with Nue"
 KYO_nue_question_of_society_desc:0 "The night after the war was quieter than before, so quiet that it seemed the entire Gensokyo hadn't yet decided whether it had survived or was just temporarily alive. Seija stood under the dilapidated eaves and saw a familiar yet unsettling shadow emerge from the darkness.\n\n “You actually dare to stand outside alone.” Nue Houjuu tilted her head, her tone both amused and provocative, “Right now, aren't you the easiest target in all of Gensokyo?”\n\n Seija didn't back down, only coldly replying, “You didn't come here to kill me.”\n\n Nue blinked, her smile deepening. “Yes. I just came to see if you knew what to pick up after you overturned the table.”\n\n She didn't offer a convincing answer for anyone, but instead threw the most jarring question at Seija: If Youkai were to leave fear behind, could she survive in society? And if society only sees Youkai as a threat, will it forever rely on suppression to maintain order?\n\n Seija didn't immediately refute this. Because she knew that Nue wasn't deliberately picking a fight. Nue was asking: Does your revolution aim to let Youkai live, or simply let Youkai die along with the old world?"

 KYO_monsters_not_social_waste:0 "Youkai is not social scum"
 KYO_monsters_not_social_waste_desc:0 "Nue led Seija through the margins of society, abandoned shrines, burned-out old warehouses, and wetlands no one wanted to approach. Those places were once corners where youkai, half-youkai, monsters, and all sorts of otherworldly beings barely clung to. The war ravaged them, but it didn't make them any less real.\n\n “Look,” Nue said, standing on the broken wall, looking down at the human and youkai figures below. “The old order's specialty wasn't killing everyone, but stuffing people into corners and pretending there was nothing there.”\n\n Seija silently watched the abandoned humans and youkai. She suddenly understood that so-called “outcasts” were often simply those deemed too troublesome, unstable, and difficult to manage by mainstream society, and thus simply swept away.\n\n “Youkai aren't the dregs of society,” Seija finally spoke, her voice soft but firm. “Society decided to reject us first, and then said we didn't deserve to stay.”\n\n Nue glanced at her, offering no praise, only a curt “Very good. At least you're not stupid enough to take people's words lying on the ground as a matter of course.”\n\n This still wasn't acceptance, much less intimacy; but Seija was beginning to understand that Nue approached not because of her gentleness, but because she hated any order that swept outcasts into darkness and then pretended the world was clean and pure."

 KYO_live_by_fear:0 "How long can one survive on fear alone?"
 KYO_live_by_fear_desc:0 "“Don't rush to say nice things.” Nue leaned against the wall, her eyes shining coldly in the night. “If you strip away all the embellishments, didn't Youkai survive on human fear before?” Seija didn't deny it.\n\n She knew how harsh those words were, and how close they were to the truth. As long as humans trembled in the night, pasted talismans on doors, and wandered through the wilderness, Youkai would still be remembered, acknowledged, and preserved. Fear is not noble, but it is always effective.\n\n “I know,” Seija said softly, “in this world still full of prejudice, hostility, and the remnants of the old order, if even the last shred of awe is gone, Youkai will be pushed back into the shadows first.”\n\n Nue chuckled softly. “So? Do you want to admit that some things are meant to be feared?” Seija didn't answer immediately.\n\n Because she also knew very well that if she chose to preserve fear, Youkai might still survive; but the relationship between Youkai and humanity would continue to be one of mutual distrust and oppression. This path was viable, but it wouldn't be clean. They had their first real argument.\n\n Nue refused to accept that Youkai could be easily and gently accepted by society; Seija also refused to admit that the revolution had ultimately only left people with continued fear. Neither of them convinced the other, yet both were forced by the other to see the half of themselves they were unwilling to confront."

 KYO_claim_a_place_in_society:0 "Give Youkai a Place in Society"
 KYO_claim_a_place_in_society_desc:0 "“But if you're always living on fear,” Seija looked up at Nue, “then Youkai will always be relegated to the sidelines, always be that thing that frightens people but isn't acknowledged.”\n\n Nue was silent for a moment, not interrupting her.\n\n Seija continued. She began to realize that if Youkai could only survive through fear, avoidance, and taboo, then Youkai would forever live on the margins of society, a being feared, rejected, and never truly acknowledged. Such a way of life might last for a while, but not in the future. “I don't want a position bestowed upon me by humans,” Seija's tone gradually hardened.\n\n “And I don't want Youkai tamed into a harmless decoration. I want this new society to acknowledge—that Youkai also has its own place, responsibilities, and right to live.” Nue looked at her, and after a long while, chuckled softly.\n\n “This path is harder than making humans afraid. Because you're not forcing people to shut up, you're forcing the entire society to grow a new set of bones.” Seija didn't back down.\n\n She knew this path wouldn't be easier than fear, but it might allow Youkai, for the first time, to exist beyond being merely a “thing to be feared.”\n\n This time, Nue didn't deliberately contradict her as she had in the past few days. She remained skeptical and critical, but began to acknowledge that Seija wasn't just someone who would ruin the world. Seija also realized for the first time that Nue's sharp tongue wasn't just a wicked joke; it was more like a mirror, reflecting the most vulnerable and self-deceptive parts of her words."

 KYO_acknowledged_not_tamed:0 "Different doesn't mean inferior."
 KYO_acknowledged_not_tamed_desc:0 "That night, Seija and Nue argued for a long time. Each was more stubborn than the last, each unwilling to give in. But in the end, one thing became clearer and clearer—what the Youkai truly feared was never just being eliminated, but being defined as “abnormal” and then conveniently driven out of the world.\n\n “Of course, the Youkai are different from humans,” Nue spoke first, unusually without a mocking tone. “If you insist on saying they're the same, then it's just another form of equalization.”\n\n Seija was silent for a moment before slowly saying, “But being different doesn't mean being inferior; nor does it mean having fewer rights to live.”\n\n The Youkai possess human emotions, and also power beyond human limits. They are not flawed versions of humans, nor are they errors that must be corrected. Youkai may be different from humans, but they shouldn't be deprived of their right to exist, live, and speak simply because of that difference.\n\n Nue looked at Seija, as if reaffirming something. Finally, she only said one sentence: “Okay. At least you don't want to wash us clean and put us in a cupboard.”\n\n This sentence made Seija unusually quiet for a long time. Because she knew that for a large youkai like Nue, whose true nature was unclear, to say such a sentence was almost an admission. They were still different, and they would still argue, but they no longer saw their differences as hostility."

 KYO_charter_of_the_odd:0 "Drafting of the Youkai Equality Declaration"
 KYO_charter_of_the_odd_desc:0 "Ideas that never become law have a way of dwindling into a handful of stirring words. Seija therefore began summoning grassroots youkai, half-youkai, strange beings, exiles, and delegates from across the land to draft a charter whose guarantees could actually be enforced.\n\nNue leafed through the early drafts with a faint sneer. ‘Declarations? Statutes? I thought you hated this sort of thing more than anyone.’\n\n‘I still do,’ Seija replied without looking up. ‘But if we do not put it in writing, the next person in this chair will soon claim that none of it ever counted.’\n\nStrange beings should not possess names only in rumors and wanted notices. Seija's government would lay down its first legal protections for youkai, strange beings, half-youkai, and all whom society had cast aside, so that exclusion, retreat, and concealment would no longer be their only means of survival.\n\nNue's smile vanished. She returned the draft to the table, speaking with unusual calm. ‘You had better mean to enforce it. Things like us are always the easiest to write onto a page—and the first to be crossed off it.’\n\nSeija studied her for a moment. ‘That is why I want you to stay.’\n\nNue raised an eyebrow. ‘And do what?’\n\n‘Watch me,’ Seija said bluntly. ‘If I ever start writing people onto a page only to erase them again, you will be the first to overturn this table onto my head.’\n\nFor once, Nue had no immediate answer. She merely looked at Seija, as though realizing for the first time that she was not there simply to make trouble. She was becoming the indispensable mirror in which this new order would be forced to see its own true face."

 KYO_commonwealth_of_outcasts:0 "The Rules of Youkai Survival"
 KYO_commonwealth_of_outcasts_desc:0 "As the first draft circulated, youkai who had previously lived scattered lives began reporting what they could offer. Some knew hidden routes; others could repair machines. Some asked only not to be driven away again as things of unknown origin. Public order, rationing, and the workshops began to have people responsible for them, while disputes went to a common place for resolution.\n\nNue watched from above for a while, then asked Seija whether assigning everyone a place meant they were settled. She pointed to a youkai who had been waiting below for a long time. He could not answer the usual questions about his identity. When his turn came, the clerk told him to stand aside again.\n\nSeija went down, asked what had happened, and ordered the request to be accepted first. Whatever did not fit the old form could be dealt with afterward. Nue followed, laughing that Seija had barely started governing and had already learned to leave inconvenient people outside the door.\n\n“If you see it so clearly, tell me who else will get stuck.” Seija pushed the paper toward her.\n\nNue did not take it, but pointed out several more problems. Seija questioned her on each: which questions should be removed, and which merely needed rewording? They grew steadily less polite. The clerk stood beside them and did not dare resume writing until they reached a conclusion.\n\nOnce his business was finished, the youkai did not thank them. He first asked whether he would have to explain everything from the beginning next time. Seija told him to keep the written record and bring it back to her if the same problem arose. Nue gave her own name and had the clerk record it as well.\n\nBefore leaving, she warned Seija that if the paper ceased to mean anything, she would be the first to produce it. Seija capped her pen and told her she had better remember."

 KYO_koishi_open_the_unconscious:0 "Koishi, Take Me In"
 KYO_koishi_open_the_unconscious_desc:0 "The third time Seija found Koishi in her room, she finally asked what she wanted. Koishi sat in a chair that had been empty a moment before and said it was noisy here. There was no one outside the window. Seija put down what she was holding and waited for an explanation.\n\n“One of you keeps shouting at people,” Koishi said. “And when that one stops, another starts shouting at herself.”\n\nSeija told her to stop talking nonsense. Koishi went on to ask whether she had accepted that assignment because she thought it should be done, or because she refused to let anyone think she could not do it. Seija opened her mouth to answer, remembered she had not yet read what the assignment involved, and picked up the sheet she had covered.\n\nKoishi reached for it. Seija blocked her hand. They remained like that for a moment before Seija asked whether she could uncover the thoughts Seija herself refused to examine. Koishi said she could take her to see them. What she said about them afterward would still be her own decision.\n\n“What about you?” Seija asked. “Have you looked at your own?”\n\nKoishi's smile faltered. Her fingers touched the closed eye against her chest, but she did not answer. For once, Seija did not seize the chance to mock her. She only asked whether, once inside, they could keep someone beside them the whole time.\n\nKoishi slipped off the chair and offered her hand. Seija studied it for a long while before taking it, warning her not to lead her in and then vanish on her own. In that case, Koishi replied, Seija would have to remember to look back for her too.\n\n“All right. Koishi, take me in.”\n\nThe paper still lay open on the desk. Seija weighed it down and followed Koishi toward the thoughts she usually drowned out with a curse."

 KYO_trial_in_the_unconscious:0 "Judgment in the Unconscious"
 KYO_trial_in_the_unconscious_desc:0 "Koishi led Seija into the unconscious by the hand. The path soon broke away behind them. Faces crowded ahead, praise mingling with abuse. Seija tried to answer one, only to hear another saying that the dead were still waiting for her explanation.\n\nThe most urgent voice came from beneath her feet. It told her to act, to smash everything in front of her. Another immediately took up its argument: only then could the revolution continue. Farther away, someone laughed at her. An amanojaku was meant to bring calamity. Why pretend to be anyone's savior?\n\nSeija recognized words she had spoken herself. The more she argued, the more voices arose, as though every explanation could prepare an excuse for the next act of destruction.\n\nShe turned to find Koishi, but there was no one behind her. Only when a hand caught hers from the shadows did she see that Koishi was trembling too. Had Seija even noticed she was gone, Koishi asked. Seija was about to scold her for wandering off. Then she saw her expression and stopped.\n\n“You're scared too?” she asked.\n\nKoishi asked whether she was. Seija did not answer. She held her hand. The faces kept changing: some waited for her orders; others wanted only to get away from her. Several times Koishi tried to retreat into the shadows, but she did not let go.\n\nAt last, Seija stopped rebutting every accusation. She let one finish and tried to identify what she had left out of her account. Koishi stayed beside her. When her own silence was called into question, she looked down at their joined hands and did not turn away."

 KYO_only_wanted_to_flip_the_table:0 "I just want to destroy"
 KYO_only_wanted_to_flip_the_table_desc:0 "Seija, deep in her unconscious mind, finally uttered the words she had always wanted to use to defend herself.\n\n “I just want to flip the table,” she whispered, her tone for the first time not defiant, but more like a weary confession. “I can't stand those guys taking everything for granted, I can't stand the weak always having to bow their heads, I can't stand those in high positions making order seem like a given. I just want to destroy that table, so it can never be the same again.”\n\n This wasn't a lie. Koishi knew that Seija's anger never arose out of thin air. She had indeed seen too much injustice, too many powerful people using high-sounding reasons to crush others. She wanted to destroy, not simply to enjoy the ruins, but because she realized earlier than many others—some orders were so broken they weren't worth repairing, only smashing.\n\n Koishi didn't follow up with her.\n\n “Is that all?” she asked softly, her tone light, yet piercing like a needle.\n\n Seija didn't answer.\n\n Because she knew that while the statement was true, it wasn't necessarily the whole truth. But at least in this moment, she finally admitted: her initial impulse wasn't to rule, not to build, and not to become anyone's leader. She initially just wanted to completely deprive the world, a world that had never given a place to the weak, of its right to stand firm."

 KYO_also_wanted_the_high_seat:0 "I also want to sit in a high position"
 KYO_also_wanted_the_high_seat_desc:0 "Seija originally wanted to continue hiding her thoughts. But deep within her unconscious, many excuses that could usually be used to deceive would fail. Koishi simply stood there quietly, not pressuring her, but that very silence seemed to await an answer that could no longer be avoided.\n\n So Seija finally admitted to something even more embarrassing.\n\n “Yes,” she said through gritted teeth, “I want to sit on it too.”\n\n It wasn't about wanting to be a noblewoman, nor about enjoying being groveled upon. It was closer to a deeper, more dangerous desire—she wanted that position, the power to determine direction, to determine order, to determine who could never trample her back. She didn't just want to smash the throne; she wanted to sit on it herself, to prove she finally had the right to rewrite the rules.\n\n Koishi didn't laugh at her, nor did she show disgust. She simply turned her head slightly, as if looking at someone who had finally spoken the truth.\n\n “That's not surprising,” she said. “How could someone who's always been left down there never think about standing on top?”\n\n Seija remained silent for a long time. Because for the first time, she realized that the most terrifying thing wasn't having such thoughts, but that she had always hidden them behind the “revolution,” pretending they never existed.\n\n At that moment, Koishi also thought of herself. She closed her third eye, not necessarily just to escape others; perhaps more so because she was afraid to see the impure, innocent, and not as light and airy as she usually appeared—the desires within her. Neither of them was more noble than the other; they were both adept at ignoring it."

 KYO_face_the_self_that_loves_chaos:0 "Face the Self That Loves Chaos"
 KYO_face_the_self_that_loves_chaos_desc:0 "Seija thought she had already explained that uprising. The granary should have been opened, the lord should have been driven out, and her followers had indeed stormed through the gates. But when the fire in the unconscious died down, she saw those same people sifting through the ashes for sacks of grain that had escaped the flames.\n\nShe tried to skip past that part. Her feet would not move.\n\n“I was happy then,” she finally said. “Watching them run. Watching the houses fall. I wanted the fire to burn even higher.”\n\nShe stared at Koishi, waiting to be laughed at. Koishi did not laugh either. Her outline began to fade. Seija caught her sleeve and demanded to know where she was going this time. Nowhere, Koishi said. She simply did not want to keep watching.\n\nSeija almost asked what there was to be afraid of, then swallowed the words. A moment ago, she too had been searching for a way to excuse that surge of delight. There had been real oppression for the revolution to break. But as she chased the fleeing lord, she had never asked what the people behind her still needed.\n\nLooking down at her captured sleeve, Koishi asked whether Seija would remember she was there if she let go. The question caught Seija off guard. She had always complained that Koishi came and went as she pleased. Only now did she realize that Koishi, too, was waiting for an answer that could not be brushed aside.\n\n“Don't go yet,” she said. “I'm not finished.”\n\nThey kept watching. Seija admitted that she liked having people wait for her orders, and liked being able to set them in motion with a word. Koishi said that sometimes she disappeared first because she did not want to wait until people grew tired of her. Her words came haltingly. Seija did not finish them for her.\n\nThe scenes did not vanish. When Seija saw the burned granary again, she still wanted to curse the lord. She still remembered the exhilaration when the fire began. She lowered the hand she had raised in her own defense and crouched beside the people searching through the grain sacks. Koishi stayed beside her. This time, she did not fade."

 KYO_leader_must_be_watched:0 "Blind to One's Own Danger"
 KYO_leader_must_be_watched_desc:0 "After returning from the unconscious, Seija heard a subordinate say that no one understood the revolution's direction better than she did. At first, she enjoyed the praise. A few steps later, she called the subordinate back and asked what they would do if they thought one of her orders was wrong.\n\nAsk for clarification first, came the answer. Seija asked what would happen if she forbade further questions. The subordinate fell silent.\n\nKoishi sat nearby, watching her pace. Seija said that as long as she remembered what she had seen, surely she would not become the sort of person she despised. Koishi asked whether she had not felt just as certain of her memory when she made decisions before.\n\nSeija stopped. She had indeed counted revenge among the necessary costs, and treated other people's cheers as consent to every consequence. No one had been able to make her pause. She herself had been even less willing to listen.\n\n“Then someone has to be able to stop me,” she said.\n\nShe began drawing up procedures for questioning officials, filing appeals, and removing those in charge. In particular, she stipulated that no one could lose their rations, work, or right to speak for raising an objection. The clauses governing the supreme leader remained blank. She stared at them for a long time, refusing to fill the space with a promise to “willingly accept oversight.”\n\nKoishi rose to leave. Passing the desk, she pointed once more at the blank section. Seija asked whether she would come back. She would, Koishi said—if only to see what that clause eventually became.\n\nPeople were still waiting outside for orders. Seija called them in, read out several provisions that were not yet final, and asked each person where implementation would run into trouble. The first answer came very quietly. She resisted the urge to interrupt and let the speaker finish."

 KYO_bind_the_revolution_to_itself:0 "Revise the Gekokujou Program"
 KYO_bind_the_revolution_to_itself_desc:0 "Seija spread the old program across her desk. When she reached the passage on leadership, her pen stopped. She had once liked calling her own decisions the will of the people. Reading it now, she remembered the faces that had challenged her in the unconscious. Who spoke for whom could not be decided solely by whoever stood above the rest.\n\nThe new draft began to include public accounts, local appeals, regular questioning, and removal from office. When she reached the supreme leader, she stopped writing, tempted to leave the scope open to later interpretation. Sitting by the window, Koishi read out the words “all officeholders” and asked whether that included Seija herself.\n\nOf course it did, Seija snapped. Koishi looked at the paper and pointed out that its readers might not be there to hear that answer. Seija swore, added her own name to the clause, and stipulated that victory, seniority, and popular support offered no exemption from accountability.\n\n“Will that do?”\n\nKoishi did not nod. Where should someone file an appeal, she asked, if they had no registration—or if other people could barely remember them? Seija looked up. Koishi was still sitting there, her third eye closed, but her voice had grown quieter.\n\nTogether they rewrote the clause, extending the right of appeal to the anonymous, the unregistered, and those whom others could not consistently identify. Seija prescribed harsh penalties for retaliation against petitioners, then reread what she had written to make certain she had left herself no exception.\n\nKoishi pressed an inked fingertip onto the corner of the page. Seija complained that she had dirtied the paper, and Koishi asked if she should wipe it away. After studying the little mark, Seija shifted the words beside it and let it stay.\n\nThe draft still needed work, but Koishi did not disappear halfway through as she usually did. Seija fetched another sheet and asked her to keep finding faults. By dusk, the papers had been divided into two piles: ready for publication, and still under dispute. The signed page lay on top. Seija turned it toward Koishi for one last look before sending it off to be copied."


 KYO_flandre_and_broken_blood:0 "Flandre and Bad Blood"
 KYO_flandre_and_broken_blood_desc:0 "Flandre came to Seija with an urn of ashes.\n\n She stood at the edge of the ruins, her expression much calmer than before, almost unlike the calamity-ridden sister who had once made the entire Scarlet Devil Mansion tense. She held a small urn filled with Remilia's ashes. It wasn't just a relic; it was more like the last thread connecting her to the old world. She had originally come seeking revenge.\n\n Because in her eyes, her sister had indeed died because of this war, because of the chaos Seija had stirred up. But when it came to actually fighting, she couldn't use her powers no matter what. That power that once easily crushed everything seemed to be gently held down at the last moment. Perhaps it was fate, perhaps it was trauma, perhaps it was Remilia, with her final manipulation of fate before death, forcefully pushing her sister off the old path that only brought destruction. Flandre was stunned for the first time.\n\n She suddenly didn't know who she hated. Did she hate Seija? Did she hate the war? Did she hate the world that took her sister away and left her alone here?\n\n Just as she turned to leave, Seija called out to her. “Who are you?”\n\n It wasn't a provocation, nor an interrogation, but like a knife, cutting directly into a place deeper than hatred.\n\n Flandre didn't answer immediately. Because she suddenly realized that she also wanted to know. If her sister was dead, if Scarlet's city collapsed along with the past, then who was the one left behind? So she didn't leave.\n\n Not because of forgiveness, nor because of seeking refuge, but because for the first time she wanted to know: when blood and name could no longer answer everything, how could a person continue to live?"

 KYO_bloodline_is_not_absolution:0 "The Shackles of Blood"
KYO_bloodline_is_not_absolution_desc:0 "Holding the urn, Flandre asked Seija whether she always opposed people because it was in an amanojaku's nature. Seija said Flandre was rather good at blaming a name herself. Did every person she had hurt and every object she had broken belong on the Scarlet family's account?\n\nFlandre immediately clutched the urn tighter and told her not to speak of her sister that way. Seija did not apologize. “I asked who did it.”\n\nThe room fell quiet. Flandre looked at her hands and said that the power had always been there. Sometimes she truly could not control it. Seija replied that they could identify the danger and work out precautions together. But changing what she called it could not make what had already happened someone else's affair.\n\n“What about the Lunar Capital?” Flandre looked up. “Do you accept everything they put on you?”\n\nSeija's expression darkened. Her fingers rested on the edge of the table for a long time. She had lived in that capital and had always been treated as a child who did not belong. How those people saw her could not decide her reasons for every action she took afterward. The words came stiffly, but Flandre listened to the end.\n\nFlandre asked no more about the Lunar Capital. She merely set the urn back on the table, opened her hands again, and asked what she should do if she lost control once more. Seija first asked how she had recognized it before. Halfway through the answer, she told her not to skip over the details with “that's just how I am.”"

KYO_inherit_that_name:0 "The Name from the Moon"
KYO_inherit_that_name_desc:0 "Some names aren't chosen, yet they follow like shadows for a lifetime.\n\n With Flandre by her side, Seija finally begins to confront her own bloodline. Lunar Capital, nobility, purity, selection, order, Sagume Kishin—these things were originally just blurry, cold, fragmented remnants in her mind, but now, with post-war reconstruction and self-questioning, they are gradually pressing back before her.\n\n She wasn't entirely without belonging there. She had lived in Lunar Capital, been cared for by her mother, and vaguely felt out of place in that pristine, almost cruel land. But those memories were shrouded in mist, leaving only a blurry yet sharp feeling: she came from there, and she had been rejected there.\n\n Seija began to realize that her deep loathing for those high-ranking systems might not just be because she had witnessed oppression, but because she herself carried a part of that system within her. It was a name from the moon, a source decided for her by others, proof she had always wanted to deny but could never truly sever. Flandre listened quietly.\n\n She understood this feeling better than anyone. For her, the name Scarlet was both home and prison; both protection and a fate always decided for her by others. So instead of mocking Seija, she asked her seriously for the first time, “If you really had that kind of blood in you, what would you do?” This question left Seija silent for a long time.\n\n Inheriting a name isn't necessarily about submission.\n\n Sometimes, seeing that name clearly, acknowledging its presence within oneself, and then deciding how to use it is itself another way of reclaiming control. She didn't necessarily have to continue living for Lunar Capital, but she had to first acknowledge that the shadow had indeed once been a part of her."

KYO_betray_that_name:0 "The Name I Made on Earth"
KYO_betray_that_name_desc:0 "Flandre asked Seija why she did not return to the Lunar Capital if she had once lived there. Seija said it had already assigned her a place: impure, unruly, liable to be sent away at any moment. She had not yet untangled every part of the past, but she would not wait for that city to approve of her again before deciding where she belonged.\n\nSomeone outside urged her to come and see to an argument at the workshop. Seija called back, then finished what she was saying. “I've gone hungry here. I've run with these people, and they've cursed me too. If the Lunar Capital cares only about blood, let it.”\n\nFlandre asked whether that meant betraying where she came from. Seija looked at the urn in her arms and asked whether her sister, if she were still alive, would have allowed Flandre to come here. Flandre did not answer, but her grip loosened a little.\n\n“And you came anyway,” Seija said.\n\nShe put on her coat and prepared to leave. Flandre followed her to the door and asked whether she could do the same. Seija did not choose for her. She only told her to think about what she would do if she stayed, and where she intended to go if she left.\n\nFlandre stood there for a moment, then put the urn back in her room and went with her to the dispute. People called Seija's name along the way. She answered loudly, never pretending not to hear even the least courteous call."

KYO_child_of_moon_enemy_of_earth:0 "Children of the Moon, Inhabitants of Earth"
KYO_child_of_moon_enemy_of_earth_desc:0 "Bloodline and belonging, finally placed on the same table at this moment.\n\n Seija had to admit that a part of her came from the moon. It was her indelible source, a fact written into her at birth. Even more cruelly, she hadn't just heard of Lunar Capital; she had actually lived there, been cared for by her mother, and been quietly judged as someone who shouldn't have stayed under that order called purity.\n\n H ... Flandre also began to re-understand the concepts of “species” and “origin.”\n\n Vampire, human, youkai, Lunarian, amanojaku—these words should have separated people like boundaries, but now she saw something else in Seija: a person could simultaneously belong to a certain bloodline, yet refuse to submit to the direction that bloodline had written for them. So Seija finally gave her clearest answer: she could be a child of the moon, but only wished to be a child of Earth.\n\n She wouldn't deny her origins, but she would never accept letting her origins decide her loyalty, stance, and future. This was the first time Flandre was truly moved.\n\n Because she suddenly wanted to ask herself: if I were born a vampire, a Scarlet, could I also choose to become a new self that wasn't defined solely by blood?"

KYO_drag_the_family_name_from_the_throne:0 "My Own Person"
KYO_drag_the_family_name_from_the_throne_desc:0 "When Seija asked Flandre what she wanted to do, she began by saying that her sister had once said—and was interrupted.\n\n“I asked you.”\n\nFlandre held the urn and said nothing for a long while. She remembered what her sister wanted. She remembered what other people expected of the younger Scarlet sister. When it was her turn to speak, those were still the only answers she could think of.\n\nSeija did not hurry her. She waited until Flandre had set the urn down securely. At last, Flandre said she wanted to see places she had never been, and try a few things without being sent back to her room the moment she broke something. She spoke hesitantly, then asked whether that would mean forgetting her sister.\n\n“Don't you even remember how she used to scold you?” Seija replied.\n\nFlandre was a little angry, but she smiled too. She still used the same surname and still missed her sister at night. She did not have to discard either of those things first. She simply wanted to answer for herself the next time someone asked where she was going.\n\nShe took out a sheet of paper and wrote down a few of the things she had mentioned. Seija noticed that the first line began “My sister would like” again, and tapped it with a finger. Flandre shielded the paper. She did not cross it out at once. Beside it, she added: I want to try it too."

KYO_belonging_beyond_blood:0 "Old Gods, New Blood"
KYO_belonging_beyond_blood_desc:0 "Flandre moved the urn to the window, cleared the table, and spread out the sheet she had half filled with writing. In the past, she had always picked up the urn whenever someone came to see her. This time, when she saw Seija in the doorway, she only asked whether she had a spare pen.\n\nSeija handed one over and casually asked what she was writing. Things she wanted to do for herself from now on, Flandre said. She had not put them in order yet. After finishing a sentence, she glanced back at the urn and asked whether her sister would think her plans too small.\n\n“Let her,” Seija replied. “She's not the one who has to do them.”\n\nFlandre glared at her, but did not put the paper away. She still missed her sister, and still turned at the name Scarlet. Yet having those ashes by the window had not stopped her from writing down the choices she was making today.\n\nWatching her, Seija remembered her own days in the Lunar Capital. She remembered being sent away, and the place where she had never quite belonged. As for what had happened before that, her memories always broke off at the crucial points. She no longer wanted to fill those gaps with guesses. Nor could she yet believe there might be another explanation.\n\nFlandre asked whom she was thinking of. Her mother, Seija replied, and said no more. Flandre did not press her. She simply returned the borrowed pen, left the paper on the table, and prepared to go out.\n\n“What about the urn?” Seija asked.\n\n“I'll sit with her when I get back.”\n\nFlandre took a few steps, then returned to check that the window was latched. Seija waited, and they left together. The old affairs of the Lunar Capital remained unresolved. Her sister would not return to make Flandre's choices for her. At the fork in the road, they argued briefly about which way to go, then followed the plans Flandre had just written down."

 KYO_three_lessons_before_rule:0 "Three Scars Before Taking Power"
 KYO_three_lessons_before_rule_desc:0 "Before the next round of discussions, Seija laid three unfinished matters before her. People whose identities could not be registered were still waiting. Oversight of the leader needed to be put into practice. Flandre had also asked whether future housing allocations would depend on surnames. Seija had thought all those arguments had made her position clear enough. Yet each problem still had to be dealt with.\n\nNue picked up the first document as soon as she entered and pointed out that the revised procedure had not reached every locality. Sitting nearby, Koishi asked who would hold the person responsible for passing it on to account if they simply said they had forgotten. Flandre took back her own request, crossed out the words “accept the assigned placement” that someone had added, and insisted on knowing where she would be sent first.\n\nGrowing impatient, Seija rapped the table. All three looked at her. She remembered how much she had enjoyed that sort of silence in the unconscious, withdrew her hand, and told Nue to continue.\n\nThe meeting ran into mealtime. When someone asked whether the old procedures should remain in temporary use, Seija decided each case in turn: change what could be changed now; assign a responsible person and a deadline to anything they could not resolve on the spot. She took an assignment herself—an appeal no one had been willing to handle.\n\nAs they adjourned, Nue took the revised draft, Koishi reminded Seija not to forget her own task, and Flandre put her request away. Another group was already waiting outside. Seija moved the empty cups aside and invited them in to sit."

 KYO_grassroots_worksite:0 "Spread the blueprints on the muddy ground"
KYO_grassroots_worksite_desc:0 "Seija didn't call the three grassroots members, Youkai and her companion, into a proper office. She summoned Sekibanki, Kagerou Imaizumi, and Wakasagihime to an old warehouse with scorch marks, unrepaired planks, and a floor covered in mud and rubble. She stood there, spreading out the blueprints, laying out the future.\n\n Sekibanki was the first to frown. She didn't believe in such a grandiose plan, especially not in a regime that had just fought a war suddenly talking about order, construction sites, supplies, and production. Kagerou Imaizumi was even more direct, asking only one question: Could this really prevent people from starving and freezing to death? Wakasagihime didn't immediately object, but quietly looked at Seija, as if waiting for her to say the most crucial question—was this plan truly meant to improve people's lives, or was it simply a way to weave the lower classes into another set of orders?\n\n Seija didn't shy away. She spoke bluntly: this wasn't for show, nor was it to paint a pretty picture of the new regime. What she wanted was to forcibly pull Youkai out of a life where they could only survive by instinct, luck, and bowing their heads. First, she wanted to ensure a stable food supply, the delivery of resources, the production of tools, and the stability of order, so that everyone wouldn't have to beg for charity just to survive.\n\n These words didn't immediately garner agreement. But as the misunderstandings were gradually cleared up, all three began to understand that Seija wasn't inciting anyone to overturn the table, but genuinely wanted to rebuild it—and rebuild it for those who had never been worthy of sitting at the table."

KYO_raise_the_broken_umbrella:0 "Let the discarded things start anew"
KYO_raise_the_broken_umbrella_desc:0 "The first step is to bring back those things that were once considered worthless. When Kogasa Tatara was personally approached by Seija, she was initially taken aback, then her expression shifted to one of mixed joy and disbelief. After all, most people associated her with frights, pranks, or an unwanted old umbrella; few would seriously ask if she was willing to contribute to this new society.\n\n Seija's answer was simple: since so many objects in Gensokyo could awaken into tsukumogami, they shouldn't be allowed to continue rotting in warehouses, corners, and garbage dumps. Old umbrellas, old harps, old drums, old knives, old cars, old pots—all could rise again, re-entering workshops, logistics, streets, and production. Thrown things don't necessarily rot; forgotten existences don't mean they're worthless.\n\n After hearing this, Kogasa Tatara didn't immediately agree; she simply looked down at her umbrella, as if looking at herself. Finally, she raised her head, smiling broadly: if the world was finally willing to give a place to what had been discarded, then of course she was willing to be the first to hold up an umbrella for it.\n\n From that day on, tsukumogami were no longer just ghost stories and peripheral characters. They would be reintegrated into the skeleton of society, making those abandoned things the earliest gears to start turning again in rebuilding Gensokyo."

KYO_seize_old_order_storehouses:0 "Take back the keys to the granaries to the public."
KYO_seize_old_order_storehouses_desc:0 "The food problem cannot be solved by slogans. Seija and the grassroots youkai quickly realized that the real danger after the war was not that there was no grain in the fields, but that many old forces, local tyrants, and wartime merchants had locked up what could sustain them in their granaries, waiting for the situation to become more chaotic and prices to rise before selling them off.\n\n Thus, a ruthless path was laid out: take over the old granaries, inventory the stockpiles, unify transportation, set uniform prices, and distribute them uniformly. Sekibanki was not surprised by this approach; she knew all too well that in chaotic times, some people would always profit from others' hunger. Kagerou Imaizumi also agreed, because those who were starving wouldn't survive until tomorrow, so any procedures were meaningless. Wakasagihime put it even more strongly: if these things were to be brought under public control, everyone must see the ledgers, see the flow of funds, see who received their share first and who received it later; otherwise, it was just continuing the old plunder under a different name.\n\n Seija ultimately made the decision: the granaries were not private property, but the dividing line between whether everyone could survive the winter. Since the old order had locked up the things that sustained life, the new order would break the lock, snatch the key from the powerful, and hand it over to the state and the rationing system.\n\n This isn't mercy, it's stopping the bleeding. At least from this moment on, food will no longer lie dormant in ledgers and warehouse receipts, but will flow into pots, military supplies, and every night we can still survive."

KYO_build_local_mutual_aid_workshops:0 "Return the land to those who cultivate it"
KYO_build_local_mutual_aid_workshops_desc:0 "Someone proposed another, slower, and more stubborn path: instead of centralizing everything and distributing it downwards, return the land, workshops, seeds, tools, and old granaries directly to the local areas, to those who actually cultivate, transport, repair, and produce, allowing each region to thrive on its own.\n\n This approach isn't as quick as centralized control, and it's harder to maintain order. Sekibanki, however, is more inclined to support it because she instinctively doubts any overly centralized distribution system; if all lifelines are held at the top, the lower classes will sooner or later have their survival decided by others. Wakasagihime agreed, believing that true reassurance wasn't just receiving a bowl of grain today, but knowing that tomorrow they would still have their own fields to cultivate, their own workshops to operate, and their own hands to gradually rebuild their lives. Kagerou Imaizumi was most concerned with practical matters: as long as the fields were truly cultivated, the workshops could actually produce goods, and people wouldn't go hungry again, she didn't care whether the banner was raised at the central or local level.\n\n Thus, a new policy began to take shape: confiscating abandoned manors and lands of former powerful families, redistributing them to farmers and local communities; keeping workshops in the streets and alleys, leaving repair, processing, rationing, and basic production at the grassroots level; allowing villages, neighborhoods, and mutual aid organizations to decide for themselves what to repair, what to plant, and what to rescue first. It wasn't about waiting for others to deliver a path to survival, but about letting that path grow from within.\n\n The meaning of this path was equally clear: for the new society to truly stand firm, it couldn't rely solely on the central government's strength. The land must return to the farmers, the workshops must remain in the streets and alleys, and the local communities must learn to breathe, produce, and decide their own future."

KYO_tsukumogami_production_committees:0 "The Trade Union and the Production Committee"
KYO_tsukumogami_production_committees_desc:0 "Whether the choice is to reclaim the keys to the granaries for public ownership or to return the land and workshops to the local communities and farmers, the same question must ultimately be faced: Who will implement this, who will supervise it, and who will ensure that this is not just a passing fad, or that the next group will simply change their names and continue to seize everything?\n\n Therefore, Seija decided to truly institutionalize the previously scattered forces. Grassroots representatives (youkai) were responsible for bringing in grassroots voices, tsukumogami was responsible for production, maintenance, and scheduling, and local representatives, artisans, transporters, farmers, and ration workers were uniformly incorporated into the new Trade Union and Production Committee system. If the state takes over storage and grain transport first, this system will be responsible for inventorying, transporting, distributing, and auditing, ensuring that the return to public ownership doesn't become a blank slate. If local governments take back land and workshops first, this system will be responsible for coordinating production, sharing surpluses and shortages, stabilizing prices, and ensuring the operation of workshops, ensuring that grassroots autonomy doesn't fragment into independent actions.\n\n Sekibanki is most concerned with oversight. She demands that the committees not just be another set of lofty lists; otherwise, the door smashed today will simply have a new lock tomorrow. Kagerou Imaizumi is concerned with efficiency; she doesn't want to hear any fancy rhetoric, she just wants these institutions to actually deliver grain, tools, materials, and manpower to where they're needed. Wakasagihime, however, always focuses on another thing—giving the grassroots a voice, rather than just being registered, assigned, and ordered around; regardless of whether the system is state-rationed or a local mutual aid system, it's the same.\n\n Seija accepted these conditions. She knew very well that if this reconstruction ultimately only involved replacing one group of people with another in the office, it would quickly become what she hated most. The significance of unions and committees was not just to increase productivity, but also to retain the power of execution, debate, and correction within society, preventing centralized control from sliding into a new monopoly and local autonomy from disintegrating into powerless fragments.\n\n From this moment on, granaries were no longer just warehouses, workshops were no longer just workshops, and tsukumogami were no longer just forgotten relics. All tools, all hands, streets, fields, and transport lines were finally woven into the same framework. The revolution began to take shape, and for the first time, the reconstruction of Gensokyo resembled a machine that could truly turn."

KYO_rebuild_from_the_bottom_up:0 "Rebuilding a Place to Call Home"
KYO_rebuild_from_the_bottom_up_desc:0 "When the reconstruction plans were spread out, Sekibanki's first question was why the new housing lay so far from the distribution points. Kagerou pointed out a road that turned muddy whenever it rained. Wakasagihime traced the riverbank and demanded that the waterside settlements be included in the transport arrangements too.\n\nSeija crossed out the corner drawn to match the old street plan and asked the drafter to calculate it again. Granaries, local workshops, and committees were already operating. Now they had to be connected. Where homes would stand, where materials would come from, and who would face the longest daily journey could not be decided merely by the amount of vacant land.\n\nThe three spoke more precisely than before. Sekibanki knew which distribution points had opened. Kagerou had visited the building sites. Wakasagihime had seen the shipments arriving by water. They still argued, but no longer confined their questions to whether the plan would ever be carried out.\n\nThe old neighborhoods needed clearing, the workshop districts restoring, and the roads and distribution points relocating. One supervisor wanted to repair the broad main street first, so the town would look presentable sooner. Seija sent him to walk through the shacks behind it, then come back and explain how their residents were supposed to carry supplies home.\n\nThe final construction schedule began with the areas hardest to reach and most short of housing. After the plans were distributed, Seija told the three to keep checking them. Anything that looked attractive on paper but could not be used was to come straight back for revision. Kagerou rolled up the sheet, muddy fingerprints and all, and said she would take people out to inspect the sites tomorrow."

KYO_books_stolen_from_humans:0 "From Human Books"
KYO_books_stolen_from_humans_desc:0 "The revolution won the battlefield, but it did not win tomorrow. Seija quickly realized that anger, intuition, and momentary courage alone could not sustain a new nation, much less a revolutionary regime that wanted to outlive the old world. So she ordered her men to retrieve books from old government offices, private residences, school ruins, and confiscated warehouses: books about nations, organizations, trade unions, parliaments, how revolutions grew and how they corrupted. Nue was the first to show disdain for these books.\n\n She said that humanity's greatest skill was writing living people down on paper and then using that paper to oppress them. Koishi, however, simply squatted beside the pile of books, turning the yellowed pages, as if listening to something unseen. She gently reminded Seija: Don't fall in love with these words too quickly, because words can also deceive. Flandre, holding an urn of ashes, stood to the side, looking at the names, party constitutions, systems, and titles on the pages, and suddenly asked: “Do humans also like to lock themselves away with their names?” Seija didn't refute.\n\n She simply opened the book and read it page by page. She disliked many things in it, disliked the self-righteous tone of those who thought they understood everything, disliked those who spoke of the masses, organizations, and history like formulas. But she disliked something even more: if she didn't even understand these things, then she would only repeat the fate most familiar to the old world—letting a rebellion slowly degenerate into a pile of slogans."

KYO_rosa_and_trotsky_on_the_table:0 "Rosa and Trotsky"
KYO_rosa_and_trotsky_on_the_table_desc:0 "Finally, what Seija left lying on the table for a long time were two intertwined and mutually painful voices. Rosa Luxemburg reminded her that if the revolution were separated from the masses, if the party began to stifle the vitality of the workers, the countryside, and the lower classes themselves, then so-called liberation would soon become another form of captivity. Trotsky, however, relentlessly pressed on to another matter: if the revolution remained confined to the borders, to the satisfaction of postwar reorganization, to temporary victories, it would be gradually surrounded, ground down, and counterattacked by the old world.\n\n These two voices quickly clashed in the room. Nue was the first to sneer at the pages; she hated any organization that would grow new high walls, and she hated those who spoke highly of the masses only to then imprison them in discipline. Koishi, on the other hand, seemed to be listening to the echoes in Seija's heart; she saw it clearly: Seija both trusted the masses and feared their disarray; she abhorred centralized power yet knew that a revolution without a backbone would crumble into a pile of embers. Flandre sat quietly, her fingers lightly tapping the urn. She was more sensitive than anyone to questions of “who represents me” and “who protects me,” because she knew all too well that these were often where control began.\n\n It was in these disputes that Seija began to understand for the first time: a political party doesn't simply spring up by a group of people raising a flag. It is born from disagreement, from mutual sabotage, mutual suspicion, and mutual questioning. The real difficulty lies not in finding the most elegant theory, but in acknowledging that revolution inherently involves a constant tug-of-war between the masses and organization, freedom and discipline, the immediate and the distant."

KYO_masses_before_party:0 "The masses come before the party"
KYO_masses_before_party_desc:0 "When the debate reached its sharpest point, Seija chose to return the revolution's centre of gravity to those below. She would not let victory turn it at once into a world of offices, seals, and directives. Without mutual aid in the streets, workers in the workshops, and the independent strength of villages, grassroots youkai, and the human underclass, any so-called party would be an old skeleton in a new shell.\n\n The first structures of the new organisation were therefore made to grow deliberately from the bottom up. Local branches, workers' groups, village assemblies, and mutual-aid networks among grassroots youkai were joined layer by layer into the same web. Delegates could be elected and recalled. Those above could propose a direction, but could not reduce the people to shadows fit only to applaud and obey. For once, Nue did not pour scorn upon the plan: at the very least, the new order would learn to listen before it learned to command. Wakasagihime and the grassroots youkai gave it their firm support, because they could finally see that their voices were more than decoration.\n\n Koishi nevertheless warned Seija not to make another idol of “the masses.” The people were not correct by nature; they too could be blind, angry, and carried wherever the wind blew. Seija heard her, but still chose to return the revolution's legitimacy to those below. She knew that if this step were omitted, the party that followed would resemble a machine more with every passing day—and a living community less."

KYO_party_must_command:0 "The Party Must Be Able to Command"
KYO_party_must_command_desc:0 "The same convoy received conflicting instructions from two offices and spent half a day waiting at a junction. Grain deliveries, military supplies, and building sites all had urgent claims. None would yield. When the news reached Seija, she spread out the orders and asked who had the final say. All she received were the departments' respective justifications.\n\nShe decided to retain a single chain of command capable of carrying decisions through. The Central Committee would coordinate allocations, disciplinary bodies would investigate failures to comply, officials would receive training, and local organizations would report through clearly defined levels. Disputes could be raised, but settled orders could not be rewritten by everyone who handled them.\n\nNue asked whether those below would still dare to speak if the wrong order came from the center. Koishi added that Seija had plainly enjoyed silencing the entire argument with one sentence. Seija did not deny it. She merely told them to write in the procedures for questioning decisions and correcting mistakes that had to remain.\n\nLooking at the documents, Flandre asked whether people being reassigned could first be told what they would have to do. Seija ordered that every directive specify its task, deadline, and responsible official. A demand for obedience alone could not justify passing obligations down through every level.\n\nThe approved plan still concentrated command authority. Nue remained particularly wary of the disciplinary bodies and demanded the right to keep examining their conduct. Seija agreed to answer further questions, then settled the transport priorities and sent someone to the junction with orders. She knew the decision would not satisfy everyone. But the vehicles had to move."

KYO_debate_is_not_treachery:0 "Debate is not betrayal"
KYO_debate_is_not_treachery_desc:0 "Whether the focus is shifted back to the masses or the chain of command is established first, the same danger remains: once an organization fears debate, it will increasingly only know how to punish; once a leader sees dissenting opinions as hostile, the revolution will begin to devour its own people.\n\n This was precisely the ending Seija least wanted to see. She knew all too well that she too could deceive herself, and could be slowly persuaded by victory, anger, and necessity. Koishi kept bringing this up—she wouldn't allow Seija to say “for the revolution” too smoothly, because once it was said smoothly, it would become the most deceptive anesthetic. Nue pressed her from another angle: if even internal members couldn't speak the truth, what difference was there between the new party and the old system? Flandre quietly watched these disputes, as if watching a group of people finally stop treating disagreements as stains that had to be erased immediately.\n\n So, Seija made a very modern, and also dangerous, decision. She left the debates. For the first time, party criticism, minority opinions, line disputes, and grassroots questioning of superiors were explicitly written into the organizational principles. Dissent no longer automatically equated to treason, and disobedience could no longer be easily dismissed with a simple “disrupting the overall situation.” It wasn't to condone chaos, but because she finally acknowledged that a revolution that forbids others from speaking will ultimately only leave the echo of the leader."

KYO_provisional_program_of_reversal:0 "The Provisional Gekokujou Program"
KYO_provisional_program_of_reversal_desc:0 "Before the Provisional Gekokujou Program went to press, Seija called another meeting. Local delegates brought proposals on rations and land. The unions wanted their role in workshop affairs spelled out, while party officials pressed for a decision on which resources the central leadership could requisition directly. The draft made one circuit of the table and came back covered in notes.\n\nThe provisions for oversight of the leadership had to remain. Now the day-to-day workings needed to be added: how party offices would communicate with local organizations, where central and local responsibilities began and ended, which areas would receive industrial investment first, and where disputes could be appealed. Someone had to take responsibility for each. Seija refused to let “at the authorities' discretion” dispose of the most contentious questions again.\n\nNue pointed out that if the subject of a complaint chose every investigator, the clause was worthless. Koishi turned to the leader's responsibilities and checked that the restrictions witnessed by her fingerprint were still there. Flandre asked whether anyone could be pushed to the back of the queue for housing or work because of their surname, species, or origins. Those questions kept the meeting going for another night.\n\nThe draft sent for printing the next day included a revision procedure and a means of handling unresolved matters. Seija ordered it published in every locality, with objections arising from its implementation collected for further discussion. No one could interpret “provisional” as permission to abandon their commitments whenever they pleased. Nor could anyone treat this version as an order that must never be changed.\n\nAfter the meeting, several delegates were still arguing over a transport route on the map. Seija handed over the signed program and stayed where she was. The document had to reach the party branches. The route in front of her needed someone to make the arrangements, too."


KYO_reconstruction_and_revolutionary_order:0 "A New Order Amid the Ruins"
KYO_reconstruction_and_revolutionary_order_desc:0 "The granaries finally opened under the new rationing system, and local workshops began receiving a steady flow of orders. Ordinary youkai once driven out of meeting halls now returned with figures for their communities' grain shortages and argued their case. Tsukumogami working on the Hundred Implements production lines demanded that their pay be accounted for separately from the materials they used.\n\nSeija passed a repaired intersection and saw rubble still piled beside the road. When she asked why work had stopped, the foreman said the cart was delivering grain. Once, she would have started by berating him for the delay. This time she went to check the handover, and discovered that two distribution points were waiting for the same cart.\n\nLocal delegates brought the problem before the meeting. The unions added the workshops' transport needs, and the argument ran into the night before they worked out a feasible schedule. Seija approved the changes and demanded that shortages be reported sooner next time. Someone complained to her face that her previous order had left them too little time. She heard them out, then asked them to specify exactly where the work had been held up.\n\nDisputes over redistributed land remained unsettled, and the new housing was unfinished. But people had already moved into repaired homes and begun reporting regularly to building sites and workshops for work. Requests sent through the committees were gradually receiving answers. When something could not be done, the reply had to identify the missing personnel or supplies. Telling people to keep waiting was no longer enough.\n\nThat night, a newly connected production line began its trial run. The noise brought neighboring residents out to complain. The workshop staff were about to ask them to be understanding when Seija stopped them. After hearing both sides, she left the working hours for their representatives to negotiate and ordered whatever machinery could be stopped that night to be shut down first.\n\nIt took a long time for the argument to subside. As Seija left, she saw the grain cart finally returning, its driver checking the next morning's route with the building crew. She waved it through and waited by the roadside before continuing on her way."

 KYO_count_ruins_and_empty_homes:0 "A Warning from Lunar Capital"

 KYO_count_ruins_and_empty_homes_desc:0 "Gensokyo has just restored basic order, but reports from all over the world are beginning to show the same signs: unidentified Moon ships are landing near military bases, some governments are suddenly accepting unfamiliar advisors, and military and resource deployments are gradually shifting to a command system not native to Earth.\n\n Sagume Kishin arrived in Gensokyo at this moment. She carried no insignia of a Lunar Capital envoy, nor did she request any welcoming ceremony. This was because she was not an envoy sent on a mission, but a defector who had left Lunar Capital with classified information.\n\n Sagume handed over documents including Lunar Army deployments, administrative plans for occupied territories, a list of Earth's cooperating governments, and Lunar Capital's conditions for submission to various countries. The Lunarians' operation had already begun; Gensokyo was simply the next target not yet formally written into the plan.\n\n Seija's memory was still blank when she saw Sagume, but her body recognized her first. That familiarity did not elicit an embrace, only a question laced with suppressed anger: “Who are you?”\n\n Sagume did not answer immediately. The more pressing matter is to make Seija understand that Lunar Capital has already extended its reach to Earth, and the time left for life on Earth to prepare for resistance is rapidly diminishing."


 KYO_food_shelter_and_routes:0 "Earth will become Lunar Capital's territory"

 KYO_food_shelter_and_routes_desc:0 "Lunar Capital does not intend to destroy Earth. Cities, factories, farmland, roads, and population are all usable assets; a planet that is still producing, obeying, and paying for resources is far more valuable than a desolate wasteland.\n\n According to the occupation plan brought by Sagume, governments willing to submit can continue to exist, and existing rulers can retain their titles. In exchange, diplomacy, military, industry, and key resources must be subject to the supervision of Moon officials, and local armies will be reorganized into auxiliary forces to assist the Moon Army in maintaining its rule.\n\n Lunarians will become the ruling class above Earth, Moon Rabbits will continue to serve as soldiers, laborers, and executors, and humans and Youkai on Earth will be relegated to the lowest rank of subjects. They can live, produce, and even retain parts of their culture, as long as they forever acknowledge Lunar Capital's ultimate right of judgment.\n\n The most dangerous aspect of this system is that it doesn't require daily massacres. It will utilize the old government, existing bureaucrats, and local elites to gradually deprive Earth of its ability to determine its own future, while the planet appears to function normally.\n\n Seija laughed after reading the plan. Lunar Capital merely extended the existing hierarchical order on Earth to the planetary system. Since the Lunarians are determined to trample the entire Earth under their control, all lower-level life forms on Earth have reason to launch the largest uprising in history."


 KYO_human_village_is_not_a_colony:0 "Only the Forgotten Survive"

 KYO_human_village_is_not_a_colony_desc:0 "The Lunar Capital files brought by Sagume also forced her to reveal another long-hidden fact. Seija doesn't simply possess Lunarian blood; she once lived in Lunar Capital and was once Sagume's personally cared-for daughter.\n\n Lunar Capital is willing to utilize lower-ranking life forms on Earth, but it will never allow so-called impurity to mix into its own bloodline. Seija was born without meeting Lunar Capital's requirements for purity, stability, and lineage. What awaited her was not demotion or exile, but an execution that would not be recorded in public.\n\n To stop this decision, Sagume used her abilities. She made those involved forget Seija's existence and erased Seija's memories of Lunar Capital and her mother. Then, before the plan could be reconstructed, she secretly sent her to Earth.\n\n Seija always believed she had been abandoned. Now she knows that the reason she forgot her mother was because her mother wanted her to live. That void was not a wound left by indifference, but a price that had to be paid for a rescue.\n\n The truth did not immediately bring the two to a reconciliation. Sagume did save her, but she also decided for her what she had to forget and where she had to grow up. Seija acknowledged that she had been given a way out, but also retained the right to question and be angry.\n\n At least from that day on, she finally understood that what truly abandoned her was not a particular mother, but the Moon's order—a system that even judged a child's right to live based on bloodline and purity."


 KYO_youkai_are_not_new_nobility:0 "Passing Through the Blockade in a Dream"

 KYO_youkai_are_not_new_nobility_desc:0 "The Lunar Army can block roads, monitor radio broadcasts, and inspect mail. They can also order cooperating governments to arrest anyone attempting to contact the Outside World. But no matter how tight the occupation regime, they cannot stop every life on Earth and in Lunar Capital from dreaming.\n\n Doremy Sweet showed Seija a road that didn't exist on any real-world map. It was a secret network formed by countless interconnected dreams, bypassing checkpoints on Earth to deliver passwords, warnings, and simple intelligence into occupied territories.\n\n This network not only connected Gensokyo with the Earth resistance but also reached the moon rabbits dissatisfied with Lunar Capital's hierarchy. They had long fought, worked, and carried out orders for the Lunarians, but had never truly become the masters of that noble capital. The first crack might appear within Lunar Capital the moment someone showed them that obedience wasn't the only option.\n\n Doremy was responsible for opening the dream paths, Sagume provided intelligence on lunar army surveillance and rotation, and Seija required that each line be equipped with a real-world contact, alternative passwords, and backup methods of communication. Dreams can bypass blockades, but they cannot become miracles that rely on only one person.\n\n The first message was quickly sent out along the dream: Earth is still resisting, Gensokyo has not yet surrendered, and the Moon Rabbit does not have to forever hold the gun for those in power.\n\n Unseen by Lunar Capital, an underground communication network belonging to lower-level life forms began to take shape."


 KYO_provisional_council_of_gensokyo:0 "The Last Underdog"
 KYO_provisional_council_of_gensokyo_desc:0 "The Lunarian army has invaded Earth. They seize strategic locations, force defeated nations to sign subjugation agreements, and then allow officials sent by Lunar Capital to take over the local armies and governments. Rulers willing to cooperate can retain their positions, provided they acknowledge that Earth henceforth belongs to Lunar Capital's dominion.\n\n In the eyes of the Lunarians, terrestrial life can labor, pay tribute, and serve, but has no right to determine its own future. As long as this conquest continues, humans and Youkai will eventually become low-ranking subjects under Lunar Capital's rule, and Gensokyo will be trapped in a world completely controlled by the Lunarians.\n\n Sagume Kishin confirmed that the invasion would not stop at a few occupied territories. Lunar Capital has prepared a new administrative system, waiting for all nations on Earth to submit one by one. After hearing this, Seija immediately ordered the mobilization of the army, expansion of production, and the contact of resistance forces in various regions, and formally declared war on the Lunarians who had invaded Earth.\n\n She had no intention of serving the throne of the old world, but she would not allow a group of nobles from the moon to sit on the top of the entire Earth. Since the Lunarians refer to all living beings on Earth as lower beings, Seija intends to lead these lower beings in a trans-lunar uprising.\n\n Even if she becomes the last person in the world to dare rebel against Lunar Capital, this war will not end."


 KYO_names_in_lunar_archives:0 "Gensokyo Emergency Council"
 KYO_names_in_lunar_archives_desc:0 "Following the declaration of war against the Moon, the Gensokyo Emergency Council convened. Sagume Kishin marked the Lunar army's landing zones, transport hubs, and supply depots on a map. The enemy's territory continues to expand, and a protracted war of unprecedented scale is unavoidable. Seija demands that Gensokyo immediately enter a state of emergency.\n\n Military industry, energy, railways, warehousing, and large workshops were under the unified management of the Emergency Council; food and essential raw materials were centrally requisitioned, and necessities were rationed; local inventories, production figures, and transportation capacity were to be compiled daily and redistributed according to battlefield needs.\n\n The labor force was also reorganized according to barracks-style communism. Workers formed production teams, peasants formed supply teams, kappa and tsukumogami were incorporated into engineering and maintenance units, and all transport personnel were subject to military orders. Public canteens, dormitories, and a unified rationing system began to expand, with everyone from frontline soldiers to council officials receiving basic supplies according to the same standards.\n\n Total war linked the entire Gensokyo region into a single front. Farmland supplied military rations, workshops manufactured weapons, schools trained communications and medical personnel, and hospitals were responsible for getting the wounded back to work as quickly as possible.\n\n These measures were harsh and arduous, but they met the most immediate requirements of war. Extraordinary times call for extraordinary measures, and all forces capable of sustaining the fight must be concentrated. From the night the Emergency Council concluded, Gensokyo entered a state of total war, and the entire nation began operating like a giant military camp."

 KYO_sagume_does_not_deny_it:0 "Signing the “World-Turning Decision”"
 KYO_sagume_does_not_deny_it_desc:0 "The Emergency Council ultimately drafted the “World-Turning Decision.” Earth does not belong to Lunar Capital, and the beings on Earth are not subjects awaiting the arrangements of a higher civilization. Gensokyo will recognize and assist resistance organizations in various regions, and fight alongside all forces that refuse Lunarian rule.\n\n The Decision also stipulates that this war will not end with the preservation of Gensokyo. As long as Lunar Capital can still appoint the rulers of Earth, as long as Lunarian armies remain stationed on Earth, and as long as so-called higher life forms still have the right to decide the fate of lower life forms, the war is not over.\n\n Sagume Kishin was the first to sign her name. As a god from Lunar Capital, she knew better than anyone what this stroke meant. From that moment on, she was no longer a bystander secretly leaking information, but a traitor openly denying Lunar Capital's rule.\n\n Seija then wrote it down and immediately ordered the Decision to be sent to all war zones. She didn't need people celebrating around a piece of paper; armies had to set out, supplies had to be delivered, and those occupied had to know that someone on Earth was ready to receive them.\n\n The order once written by Lunar Capital began to reverse with these two strokes."


 KYO_not_your_discarded_failure:0 "The Determination to Be Born an Amanojaku"
 KYO_not_your_discarded_failure_desc:0 "After the council dispersed, Sagume finally returned the erased past to Seija in its entirety. Seija was not abandoned by her mother, nor was she a failed product carelessly thrown to Earth. Lunar Capital had planned to dispose of this unsuitable child, and Sagume, in order to save her, had to make everyone involved forget Seija's existence before personally sending her away from the Moon.\n\n The truth didn't immediately bridge the gap between them. Seija had grown up in unanswered days and blamed her mother for everything she endured. Even now, knowing that Sagume had saved her, the loneliness, anger, and feelings of abandonment wouldn't simply disappear.\n\n Seija didn't rush into Sagume's arms, nor did she offer forgiveness. She simply told her mother: “You saved me, but I'm not the mistake you hid. I didn't come here to go back to Lunar Capital to prove myself.”\n\n Her decision to fight Lunar Capital wasn't to reclaim her rightful identity. What she wanted to destroy was the system that could judge whether a child deserved to live, that could determine superiority based on birth.\n\n Sagume gave her the chance to live, while Seija wanted to ensure that more people wouldn't have to rely on being forgotten to survive. She no longer evaded her past from Lunar Capital, nor allowed that past to control her.\n\n She was born an Amanojaku. The fate written for her by others was meant to be overthrown."


 KYO_revolution_beyond_gensokyo:0 "Establish the Ministry of Truth"
 KYO_revolution_beyond_gensokyo_desc:0 "Lunarians' advantage wasn't just in weapons and technology. They possessed faster communication methods, a more sophisticated intelligence system, and knew how to make the occupied believe that resistance was futile.\n\n Lunar Capital-controlled radio stations constantly broadcast news of the collapse of the front lines, while cooperating regimes repeatedly claimed that the arrival of the Lunarians had ended the war and chaos. Surrender was packaged as rationality, obedience was interpreted as progress, and any act of resistance was blamed on hindering Earth's acceptance of advanced civilization.\n\n Sagume Kishin is familiar with Lunar Capital's methods of handling intelligence and shaping public opinion. She is responsible for identifying the enemy's communication patterns, covert codes, and propaganda sources, while Seija, on the other hand, integrates radio stations, journalists, underground organizations, and counter-espionage personnel scattered across the globe, establishing the Ministry of Truth specifically to counter the Lunarians' information superiority.\n\n This agency will expose the true situation in occupied territories, verify battlefield information, cut off Lunarian infiltration channels, and transmit the voices of resistance to the entire world. Seija doesn't need the people to believe everything the government says; she needs them to understand that the Lunarians are not invincible, and the world has not willingly accepted domination.\n\n As long as the oppressed can still hear each other, Lunar Capital cannot declare the war over for the entire world."


 KYO_export_the_spark_not_the_throne:0 "Inversionism"
 KYO_export_the_spark_not_the_throne_desc:0 "After the establishment of the Ministry of Truth, Seija quickly put forward an even more dangerous idea: since Lunarian ideas could infiltrate Earth, revolutionary ideas on Earth could also enter Lunar Capital.\n\n Sagume knew that Lunar Capital was not without flaws. Moon Rabbits had long been burdened with forced labor and warfare, ordinary soldiers had to obey those in higher positions, and many who did not meet the expectations of the upper echelons were excluded from power. Lunar Capital explained this difference as an innate order, but it had to rely on countless oppressed people to maintain its own operation.\n\n Seija wrote down her ideas in what would later be called “Inversionism”: no life is born to rule, and no group is destined to obey; those in lower positions have the right to question orders, organize themselves, and overthrow oppressors; if a revolution stops in one place, it will sooner or later be surrounded by a larger old order.\n\n Sagume was responsible for identifying those within Lunar Capital who could be contacted, while Seija continuously sent articles, recordings, and news of Earth's successful resistance to the Moon. She didn't intend to conquer Lunar Capital and ascend the new throne; her goal was to make the Moon Rabbits, soldiers, and all the oppressed question: By what right do those high and mighty Lunarians command them forever?\n\n Seija sent to Lunar Capital not a crown, but an ideology that would make the crown untenable."


 KYO_no_safe_place_for_oppression:0 "Turning the Fate of Lunar Capital"
 KYO_no_safe_place_for_oppression_desc:0 "Lunar Capital noticed the spreading rebellious sentiment within its ranks. Large numbers of Moon Rabbits were arrested, secret communication points were lost one after another, and the resistance on Earth was suffering repeated defeats under the Lunarians' all-out offensive. All signs pointed to the imminent suppression of this revolution spanning Earth and the Moon.\n\n Sagume Kishin, watching the deteriorating battle situation, finally uttered the words she had long prepared: “This resistance will inevitably fail.”\n\n As her words fell, the seemingly certain situation began to reverse. A breach appeared in the Lunarian encirclement, undiscovered communication lines became active again, and several units that had initially been prepared to obey orders suddenly raised the banner of rebellion. Sagume used her abilities to change the course of defeat, but could only buy the revolution a fleeting opportunity.\n\n Seija had already completed the remaining preparations. Backup commanders, hidden weapons, replanned supply lines, and organizations lurking in the occupied territories began to move simultaneously. She personally went to the most dangerous battlefield, reorganizing the scattered troops into units, and causing the resistance forces, which should have been surrounded, to cut off the Lunarians' retreat.\n\n Sagume was responsible for turning the tide, while Seija was responsible for making the reversal an irreversible reality. They didn't wait for a miracle; instead, they pooled their abilities, intelligence, and long-term preparations in a single moment, finally turning the tide of defeat back onto Lunar Capital itself."


 KYO_turn_over_past_and_future:0 "My name is Seija, born an Amanojaku"
 KYO_turn_over_past_and_future_desc:0 "Lunarian's rule on Earth has crumbled. Occupying governments have collapsed one after another, and the ground troops forced into service have turned to resistance. The Moon Rabbit's rebellion has also spread from the military camps to within Lunar Capital. For the first time, the advanced civilization that once claimed the right to rule Earth must face judgment from below.\n\n When Seija finally stepped onto Lunar Capital, she didn't ask anyone to prepare a throne for her. She ordered the Moon Rabbit's forced service to be lifted, those imprisoned for opposing the war released, and the institutions responsible for maintaining bloodline hierarchy and colonial rule dismantled.\n\n Earth no longer obeys Lunar Capital, and its ordinary inhabitants are no longer obligated to serve a select few. Sagume Kishin stands beside her, watching the child she once hid on Earth, nearly erased from history by Lunar Capital, who has now single-handedly altered the relationship between Earth and the Moon.\n\n She asks Seija if she is finally willing to return to her homeland.\n\n Seija replies, “I'm not coming back. I'm coming to overthrow Lunar Capital.” She refuses to become Lunar Capital's new master, nor will she allow the revolution to breed another group of unchallenged rulers after its victory. Revenge can only change those in power; overthrowing the powerful requires all those trampled beneath to rise again.\n\n She was forgotten, exiled, and considered a failure who shouldn't exist; later, she overthrew the old order of Gensokyo and led what Lunarians considered lowly beings to defeat the conquerors from the Moon. The world had told her countless times to accept her place, but she repeatedly reversed it.\n\n'My name is Seija, born an Amanojaku. '\n\n This is not the end of the story. As long as anyone uses birth, power, and authority to suppress others, Seija Kijin's revolution will not end."










 KYO_Yukari_start:0 "Standing under the moonlight again"
 KYO_Yukari_start_desc:0 "After the death of the 44th Hakurei shrine maiden, Yukari Yakumo once again walked alone into the moonlight. Lunar Capital's meticulously planned assassination attempt failed to take her life, but it claimed the lives of those guarding the barrier and shattered Gensokyo's last shred of hope. The Watatsuki sisters may have temporarily withdrawn their attention, but the Lunarian's ambition never waned; as long as the moon remained high in the sky, the next war was only a matter of time.\n\n Yukari was tired of passively waiting. She would investigate the death of the shrine maiden, repair the shattered barrier, and gather all humans and youkai still willing to protect Gensokyo. Thousands of years ago, she returned from the Moon Sea with her defeated army; this time, she would make Lunar Capital understand—this millennia-long struggle must be ended by the people on Earth."


  KYO_my_shikigami_Ran:0 "The Nine-Tailed Fox from the Animal Realm"
 KYO_my_shikigami_Ran_desc:0 "Ran, born in the Animal Realm, was once one of the most brilliant strategists in that cruel world. There, hesitation invites devouring, mistakes must be paid for in blood, and only by making judgments faster and more accurate than the enemy can one ensure their subordinates survive to the next day.\n\n Yukari Yakumo valued not only the power of the nine-tailed fox, but also her ability to organize chaos into order. Ran accepted the Shikigami contract not because she was being tamed, but because, after calculation, she believed that the world Yukari wanted to create was more worthwhile to maintain than the endless struggle for Animal Realm. From that day on, she poured her nine tails, countless calculations, and all her wisdom into the long project called Gensokyo."

 KYO_Ran_idea:0 "The fox remembers every calculation"
 KYO_Ran_idea_desc:0 "Ran remembers every command, every supply route, and the costs omitted in victory reports. Her nine tails simultaneously deduce nine possibilities, allowing her to find the least damaging and most efficient answer from chaos.\n\n Animal Realm's violence taught her that any omission would ultimately lead to death. Therefore, she not only remembers the equations but also questions who they might have missed."

 KYO_Ran_political_reform:0 "Let the calculations see the living"
 KYO_Ran_political_reform_desc:0 "Ran once believed that as long as the system was efficient enough, individual suffering was merely a negligible error. Now she understands that fear, hunger, grief, and dignity are also objective facts; if they are excluded from calculation, they will ultimately reappear in the form of turmoil, hatred, and collapse.\n\n Writing human emotions into the equation is not bowing to irrationality, but making the conclusion complete. A truly efficient system not only executes orders but also knows who it is protecting."

 KYO_Ran_calculator:0 "Nine-Tailed Fox Algorithm"
 KYO_Ran_calculator_desc:0 "Ran created an algorithm that only she could fully execute, allowing nine lines of thought to simultaneously handle government affairs, supplies, intelligence, barriers, and personnel deployment. Each command is broken down into time, resources, risks, and alternatives, then recombined at the lowest cost.\n\n Her value lies not only in calculating faster, but also in transforming Yukari Yakumo's near-impossible ideas into an executable schedule."

 KYO_Ran_contact_old_friend:0 "Old Acquaintances on the Other Side"
 KYO_Ran_contact_old_friend_desc:0 "Animal Realm rarely remembers favors, but never forgets those who are truly capable. Former colleagues may not agree with the Yakumo family, nor understand Gensokyo's ideals, but they still trust Ran's judgment and are willing to reopen the closed path for her.\n\n Intelligence, supplies, and refugees will once again cross the two worlds. That door wasn't opened to reminisce about the past, but because Animal Realm knew: with this veteran in charge, no resource would be wasted."

 KYO_Ran_will_die_for_you:0 "Staying wasn't because of orders"
 KYO_Ran_will_die_for_you_desc:0 "Ran had calculated countless times, and the answer remained the same—she would stay. Loyalty wasn't about obeying orders to die, nor was it an excuse to abandon thought; it was about weighing the risks, costs, and all possibilities, and still believing that the world Yukari Yakumo protected was worth her responsibility.\n\n She was willing to accept the most dangerous missions, but she wouldn't use death as proof of loyalty. Ran wanted to live to complete every order, correct every mistake, and ensure that those who followed Yukari returned along the path she had calculated."

  KYO_my_shikigami_shikigami_Chen:0 "Stray Cat in the Rain"
 KYO_my_shikigami_shikigami_Chen_desc:0 "Chen was once a kitten abandoned in the rain. She huddled under the eaves of an abandoned house, clinging to the scent left by her owner before they left, repeatedly looking up at the road. The rain stopped and started again, seasons came and went, but that person never returned.\n\n People thought she was too foolish to understand that she had been abandoned. In truth, Chen knew everything, but she refused to believe that the warmth she had received was meaningless. Later, Ran found her in the rain. Ran didn't promise that the lost would eventually return; she simply reached out her hand and told her she could come home with her first."

 KYO_meow_meow_firepower:0 "Innocent Cat"
 KYO_meow_meow_firepower_desc:0 "According to the simplest logic, Chen should have hated the humans who abandoned her, turned her loneliness into a weapon, and repaid her waiting with the suffering of others. But she didn't do that. She would still return to that abandoned house, leave food for the stray cats that passed by, and look expectantly towards the door when she heard footsteps.\n\n Her innocence wasn't because she didn't understand betrayal, but because even after understanding everything, she still chose to believe in kindness. Chen couldn't change the person who didn't return, but she could decide that she wouldn't become another person who abandoned others."

 KYO_meow_meow_firepower_air:0 "Bring the lost person back"
 KYO_meow_meow_firepower_air_desc:0 "Chen knew better than anyone what it felt like to wait in the same place for someone who would never return.\n\n When roads were cut off by war and orders were only given to the main force, Chen led ordinary Youkai through those neglected gaps. The lost children, the wounded Youkai, and the villagers who couldn't evacuate in time would all return along the roads she knew. This time, no one would be left alone in the rain."

 KYO_Chen_the_best_cat:0 "Even the weak have their own homes"
 KYO_Chen_the_best_cat_desc:0 "The Lost Home was originally just an abandoned village. Leaky roofs, dusty rooms, and unresponsive roads sheltered all things forgotten by the world, and once sheltered a cat waiting in the rain for its owner to return.\n\n Chen didn't let it remain forever as it was abandoned. She repaired the broken doors and windows, rekindled the fire in the cold stove, made a bed for the stray little Youkai, and always left an extra hot meal on the table. The Lost Home may still lead those with malicious intent astray, but it will actively open a path for those with nowhere else to go.\n\n Home isn't a place where no one has ever left; it's a place where, no matter how long you've been lost, someone is still willing to leave a light on for you. Chen had never received such a light, so she decided to light it herself."

 KYO_Chen_is_the_cutest:0 "Goodwill doesn't necessarily require proof of its purpose."
 KYO_Chen_is_the_cutest_desc:0 "People often ask how much reward reciprocation reaps in war by helping the weak, or whether an ordinary cat is worth sacrificing precious resources for. Chen cannot answer with complex theories, only knowing that no life must first prove its usefulness to deserve a meal, a bed, and a welcome back.\n\n Goodwill is not an investment waiting for returns. If Gensokyo only wishes to preserve the powerful, useful, or combat-capable, then this paradise and the pure world pursued by Lunar Capital are merely different in name."

 KYO_Chen_will_die_for_you:0 "Even if we're gone, we must live well."
 KYO_Chen_will_die_for_you_desc:0 "Yukari and Ran both knew they couldn't stand behind Chen forever. What they left Chen wasn't an order to die, but the ability to find her way, friends she could trust, and a home that truly belonged to her.\n\n One day, Yukari's gap will close, and Ran will no longer be able to calculate her future. At that time, Chen won't have to go back to waiting in the rain. She should eat well, live well, light the lamp in front of her door at night, and open the door for the next lost soul.\n\n Because love isn't about demanding someone stay forever, but about ensuring that those who have been loved still know how to live after parting."


 KYO_two_shikigami_work:0 "Yakumo House"
 KYO_two_shikigami_work_desc:0 "Yukari, Ran, and Chen share the surname Yakumo, yet their names happen to be based on three colors. Curious onlookers often inquire about the whereabouts of Indigo, Emerald Green, and Bright Yellow, even speculating whether there's another, never-seen Yakumo. Whenever this happens, Yukari simply closes her fan, leaving behind a smile that's hard to discern as genuine.\n\n However, for Ran and Chen, Yakumo has never been just a strange naming convention. Yukari gave Ran a home where she could utilize her talents, and Ran, in turn, led Chen away from that long, rainy period. They don't share the same blood, yet through countless waits, returns, and working side-by-side, they became family.\n\n Now, the shadow of Lunar Capital once again looms over the land. Yukari is responsible for deciding the future, Ran transforms her ideas into order, and Chen helps everyone who might be forgotten. The Yakumo family may only have three colors, but together they are enough to depict the future of Gensokyo."

 KYO_Yukari_rule_all:0 "The Sage's Responsibility"
 KYO_Yukari_rule_all_desc:0 "Gensokyo needs someone who can see the big picture, and someone to make the final decision when disputes become irreconcilable. Yukari Yakumo will once again assume the power of the sage, but she understands that responsibility is not about thinking for everyone, nor is it about turning dissenting voices into her own echo.\n\n She will listen to the fears of humanity, the resentment of the youkai, the anxieties of the god, and the silence of the dead, and then draw a line between answers that cannot coexist. The decision will still be made by Yukari, and she will personally bear the mistakes, the costs, and the hatred that follow.\n\n This is the responsibility of the sage—not to be always right, but to dare to decide where Gensokyo should go when no one else is willing to choose."

 KYO_gensokyo_rebuild_plan:0 "Gensokyo's New Shrine Maiden"
 KYO_gensokyo_rebuild_plan_desc:0 "Yukari Yakumo did not choose a new shrine maiden from among the noble and powerful. She chose Reimi Hakurei—a girl who lost her parents in the war and was raised by the weak Youkai. Reimi is familiar with human sorrow, and she remembers the food Youkai offered her, the sleeves that sheltered her from the rain, and the gentle faces that accompanied her as she grew up.\n\n She will protect humanity, but she will not see Youkai as enemies to be eliminated; she will vanquish those who disrupt order, and she is willing to speak up for the misunderstood monsters. The Hakurei shrine maiden will no longer be just gatekeepers waving gohei before the barrier, but will also become an unbreakable bond between humanity and Youkai.\n\n Yukari entrusts the name of Hakurei, the power to control the barrier, and the mission to protect Gensokyo to Reimi. She chose not the next weapon against Lunar Capital, but someone who could continue to watch over Gensokyo after the war ended."

 KYO_yukari_allies:0 "Two Answers from This World and Higan"
 KYO_yukari_allies_desc:0 "Yukari Yakumo first enters the Bamboo Forest of the Lost, hoping to decipher the Lunarians' behavioral logic from Eirin Yagokoro. Eirin led the gods away from Earth, establishing a city on the Moon far removed from filth and death. She understands better than anyone that Lunar Capital's madness is not without reason: initially, it was a fear of death, which then transformed into a rejection of change, ultimately turning “purity” from a means to perpetuate civilization into a precept for judging whether any life deserves to exist.\n\n Subsequently, Yukari goes to Hakugyokurou and poses another question to Yuyuko Saigyouji: Why are the Lunarians so afraid of death? Yuyuko's answer is simple—because they have never truly understood life. Life is not a permanent escape from death, but a journey that will eventually lead to Higan; it is precisely because flowers wither, feasts end, and those who meet must part that every bloom and reunion has meaning. Lunar Capital, which rejects death, thus begins to hate birth, growth, and change.\n\n Eirin sees Lunar Capital as a system that can be dismantled, while Yuyuko sees the fear hidden deep within it. These two conflicting answers, however, together reveal the truth about Lunarian. Yukari must defeat not just an army, but a world determined to cease all growth in order to escape its end."

  KYO_eirin_and_kaguya:0 "The Sage of the Moon and the Tale of the Bamboo Cutter"
 KYO_eirin_and_kaguya_desc:0 "The tale of the Bamboo Cutter, passed down through generations, ends on the night the Moon Goddess welcomes Kaguya back. However, for Eirin Yagokoro and Kaguya Houraisan, the truly bitter story has only just begun.\n\n Long ago, Eirin led the gods away from the war-torn and death-ridden Earth, establishing the first refuge on the Moon. She witnessed firsthand how a humble settlement transformed into the magnificent Lunar Capital, and how its wariness of filth gradually turned into hatred of life on Earth. When Kaguya, born on Earth, arrived at Lunar Capital, one faction saw her as evidence of the Moon's corruption, demanding her eternal imprisonment or even complete annihilation; the other saw her as the hope that Lunar Capital could still accept change.\n\n Kaguya drank Hourai Elixir, making death no longer a chain binding her. Ultimately, Eirin abandoned the city she had helped build, fleeing to Earth with Kaguya and Reisen. The Tale of the Bamboo Cutter left behind a princess who disappeared in the moonlight, while Eientei preserves a long testimony of how a sanctuary forgot its original purpose."

 KYO_resien_and_tewi:0 "Moon Rabbit Veteran and Earthbound Youkai Rabbits"
 KYO_resien_and_tewi_desc:0 "Reisen still wakes up on nights when the moonlight is too bright. The sound of doors closing reminds her of a rallying bell, and the white light reflected from medicine bottles is like the artillery fire on the battlefield of the Moon. Lunar Capital brainwashes moon rabbits with obedience and honor, then sends them to the front lines in droves as readily available supplies. All the sisters who trained with Reisen died in the First Lunar War; she was able to return not because she was braver than anyone else, but simply because she learned to run away earlier.\n\n Tewi Inaba is a rabbit spirit who has lived on Earth for a long time. She has survived hunters, famines, and countless eras through incredible luck, eventually becoming a respected elder among all the rabbit spirits in the bamboo forest. No one knows why this luck has always favored her; perhaps long ago, she made an unfulfilled promise, so fate still does not allow her to leave."

 KYO_eternal_clinic:0 "Eientei's lights are still on"
 KYO_eternal_clinic_desc:0 "As night fell, Eientei's lamp remained lit for all the wounded. The medical register didn't record the race or faction of those who came, nor did it consider their usefulness in the war; here, the severity of the wounds was the sole criterion for determining the order of treatment.\n\n Eirin had once helped establish a city where the value of life was determined by purity; now she would prove in this bamboo forest that another order could still exist. Kaguya tidied the wards, Reisen tended to the wounded, and Tewi searched along the bamboo paths for those unnoticed by others. As long as someone could reach the light, Eientei wouldn't ask if they were worthy of being saved."

 KYO_night_council:0 "Lunar Capital was originally just a refuge"
 KYO_night_council_desc:0 "Initially, Lunar Capital had no distinction between the pure and the corrupt. It was merely a hastily built refuge, sheltering gods fleeing war, calamity, and death on Earth. Purification was simply a means of isolating disease and maintaining the settlement's survival, never a law determining whether others deserved to live.\n\n In the ancient records preserved by Eirin, the first generation of Lunar people still longed for the oceans, flowers, and seasons on Earth. They feared death, but did not yet hate life. What truly changed Lunar Capital was not a single command, but the fear that accumulated generation after generation: refuge became isolation, isolation became superiority, and ultimately even the reason for building the city was forgotten."

 KYO_state_laboratory:0 "Hourai Elixir's Exit"
 KYO_state_laboratory_desc:0 "Lunar Capital's laws used death as the final threat: the unclean could be executed, dissidents could be eliminated, and those erased could no longer defend themselves. However, after Kaguya drank Hourai Elixir, this order encountered an unenforceable judgment for the first time.\n\n Immortality did not grant Kaguya freedom, but it made Lunar Capital unable to end her resistance with death. That indestructible body became a crack in the system, and also bought Eirin time to plan her escape. In the end, they led Reisen through the roads that Lunar Capital could not completely block, back to the Earth that Lunarians called filth, yet still allowed life to change.\n\n Hourai Elixir blocked death, but also unexpectedly opened an exit to freedom."

 KYO_rational_unify:0 "How can purity become law?"
 KYO_rational_unify_desc:0 "Purity was initially a set of rules for maintaining the Moon's environment. Subsequently, it was incorporated into residency qualifications, lineage records, education systems, and military discipline; Moon dwellers began to be ranked according to birth, and terrestrial life was seen as contamination to be isolated. When a method can determine who is qualified to live, it ceases to be technology and becomes a form of rule.\n\n Eirin can pinpoint the era in which each rule was created, Kaguya remembers how these provisions were applied to specific individuals, and Reisen testifies through her own wounds who the system ultimately sends to the battlefield. These three testimonies will help Yukari Yakumo see the true weakness of Lunar Capital: the so-called eternal purity was never an unshakeable truth, but rather a law forged by a group of people who feared change, forging their own fears."

 KYO_risk_model:0 "The Sin of the Princess on Earth"
 KYO_risk_model_desc:0 "——Excerpt from “The Trial of Kaguya Houraisan by the Lunar Capital Purification Court”\n\n “I acknowledge that I was born on the surface of the earth, and I also acknowledge that I once lived among humans as a Lunarian. The old man cutting bamboo lifted me from the bamboo, and he and his wife gave me not pollution, but the warmth of family. Those suitors who came because of my appearance, some were greedy, some were hypocritical, and some were truly willing to give everything for an unattainable love. They showed me the ugliness of the human heart, and also made me understand why life is still worth cherishing.”\n\n “Later, I returned to the moon. What awaited me was not the embrace of my homeland, but interrogation, imprisonment, and endless hostility. You say that the wind and rain on earth have tainted me, that the name, kinship, and memories given by humans are filth that must be washed away. But I have seen both the warmth and coldness of the earth, and I have tasted the hatred of Lunar Capital; both have become a part of me.”\n\n “My name is Kaguya.” Houraisan, a Lunarian born on Earth, is also the daughter of the Bamboo Cutter. My existence proves that Earth and the Moon are never incompatible. If this is what you call sin, then the guilty party is not me, but this court that forbids life from having two homelands."

 KYO_love_puppetry:0 "Another ending to The Tale of the Bamboo Cutter"
 KYO_love_puppetry_desc:0 "“The Tale of the Bamboo Cutter told on Earth records my birth in a bamboo grove, the impossible tasks I set five suitors, and the night the Moon's emissaries came to take me home. The story ends when the robe of feathers descends, as though the princess's return to the Lunar Capital brought everything to a perfect conclusion.”\n\n “For me, however, that was merely the end of the prologue. I returned not to a homeland awaiting its wandering child, but to a court debating what should be done with me. Some called a princess born on Earth a disgrace to the order of purity. Some wished to imprison me forever. Others hoped my existence might prove that the Lunar Capital could still make room for a different kind of life.”\n\n “I drank the Hourai Elixir not in pursuit of eternal life, but because I refused to let them decide my ending. Eirin abandoned the Lunar Capital she had helped to found. Reisen turned against the army that had trained her to die. Together, we fled to the Earth they called impure.”\n\n “My name is Kaguya Houraisan. Earth's Tale of the Bamboo Cutter tells how others pursued me, and how they lost me. The story that is truly mine began on the day I refused to let the Lunar Capital define who I was.”"

 KYO_statistical_sovereign:0 "After the wise man left Lunar Capital"
 KYO_statistical_sovereign_desc:0 "When Lunar Capital was first established, Eirin's concept of “purity” was never about lineage or status. It was simply a way to isolate disease, avoid war, and allow fleeing gods to continue to survive. She wanted to build a pure city because she believed that those with long lives should understand the importance of respecting every short life.\n\n Later generations only quoted half of her teachings. They retained isolation and purification but deleted tolerance and protection; they distorted the avoidance of filth into the elimination of outsiders, and turned the continuation of civilization into the maintenance of privilege. Moon rabbits were registered as military consumables from birth, life from the surface was imprisoned, and those who opposed them disappeared from society for being “not pure enough.”\n\n Eirin had hoped that Lunar Capital would be a refuge from oppression. But after she left, that city that claimed to be pure and noble ultimately became another world maintained by oppression and enslavement."

 KYO_rabbit_leader_tewi:0 "Under the Bamboo Forest: The Ground Network"
 KYO_rabbit_leader_tewi_desc:0 "The establishment of Eientei was not solely due to Eirin Yagokoro's efforts. When they first fled to Earth, Eirin, Kaguya, and Reisen were unfamiliar with the terrain. They were able to evade pursuers and traverse the ever-changing Bamboo Forest of the Lost because Tewi Inaba actively guided them.\n\n This “Tewi of the Earth” knew where to find water, which paths would leave no trace, and what kind of visitors the nearby settlements were willing to accept. She sent rabbits to deliver bamboo and food, and brought the sick to Eirin. The first pillar of Eientei, the first route for transporting medicine, and the first patient on Earth all bear the traces of Tewi.\n\n Without her guidance, the exiles from the moon would never have found refuge in this beautiful bamboo forest. Eientei became their home on Earth, rather than an exile agency waiting to return to Lunar Capital, precisely because Tewi allowed them to truly experience life on Earth."

 KYO_lucky_star_for_all:0 "Partial peace is not forgetting"
 KYO_lucky_star_for_all_desc:0 "Eirin couldn't easily hate Lunar Capital. That city was like a child she had raised: she had helped lay its initial foundations, set its rules, and once believed it would one day become the ideal abode of the gods. Now, this child wantonly distorted her teachings and used the knowledge she left behind to oppress life on earth.\n\n For a long time, Eirin chose to live in seclusion in the bamboo forest. She thought that by hiding Lunar Capital's technology and avoiding further contact, she could prevent a greater catastrophe. However, her silence did not bring peace, but only allowed the Pure Ones to push Lunar Capital to a more dangerous extreme. If left unchecked, the Lunarians' next war would not only destroy Gensokyo, but also make Lunar Capital completely lose any chance of turning back.\n\n A healer cannot refuse to remove a spreading disease simply because they care for the patient. Eirin must make a decision: she must help Yukari Yakumo stop Lunar Capital, even if it means personally correcting her most cherished, yet most failed, creation."

 KYO_reisen_the_Tormented_one:0 "Veteran of First Lunar War"
 KYO_reisen_the_Tormented_one_desc:0 "“During the First Lunar War, Lunar Capital's system demonstrated unprecedented efficiency. Orders could spread throughout the army in an instant; gaps appeared on the front lines, and new moon rabbits were immediately brought in from the rear. Our formations were never disrupted, ammunition was never interrupted, and battle reports always proclaimed victory was imminent.”\n\n “But they never wrote down the costs in their battle reports. Sisters on the front lines died constantly, while children in the rear were sent to fill the gaps as soon as they finished training. The so-called impregnable defenses were nothing more than high walls built of layer upon layer of flesh and blood; the so-called great victories of Lunar Capital were only because they could send lives to the battlefield faster than the enemy.”\n\n Reisen looked at Eirin, her voice gradually lowering. “Lady Eirin, if you hadn't transferred me from the battlefield back then, I would never be alive today. I wasn't the bravest one, nor the strongest one. I was just the only one among those sisters who was allowed to live.”"

 KYO_reisen_the_one_without_love:0 "Moon rabbit chooses the ground"
 KYO_reisen_the_one_without_love_desc:0 "“Why do I live? In Lunar Capital, they had already prepared the answer for me. To obey orders, to protect purity, to prevent filth from invading the Moon; and if necessary, to die on a front no one remembers.”\n\n “After coming to Earth, I gradually understood the beauty that Lady Eirin spoke of. Here it rains, mud stains clothes, life ages, and we meet because of trivial things. No one distributes medicine according to purity, and the rabbits in the bamboo forest don't need to prove their worth before they deserve a meal.”\n\n “I still miss the Moon, because my childhood is there, and my sisters are buried there. But missing it no longer means obedience. Lunar Capital once decided for me why I was born and why I should die; now, for the first time, I must decide for myself where I belong.”\n\n “I am the moon rabbit Reisen, and I choose to stay on Earth.”"

 KYO_infinite_spiral:0 "Still remaining at Lunar Capital's rebellious stance"
 KYO_infinite_spiral_desc:0 "Eirin retrieved an ancient file taken by Lunar Capital during their escape from the secret chamber. It was a register of refugees arriving on the Moon: after the initial founders, the second and third waves of divine spirits migrated from Earth to Lunar Capital. One name, repeatedly modified but never deleted, caught her attention—Sagume Kishin.\n\n The ancient records referred to Sagume as Ame-no-Sagume, closely associated with the origins of the amanojaku. By today's Lunar Capital standards, this god, capable of reversing words and fate, should be filled with intolerable earthly filth; yet, instead of being expelled, she remained deep within Lunar Capital's power structure. Her existence proved that purity is never a consistent truth, but merely a set of political rules that create exceptions for the useful.\n\n If Sagume still remembered her origins, she might not have accepted the Lunar Capital shaped by the Purification faction. Such a god, hidden within the system yet capable of reversing predetermined fates, could very well be the key to breaking through Lunar Capital. Eirin must discuss this matter with Yukari Yakumo immediately."

 KYO_the_end_of_the_humankind:0 "Lunar Capital, which lost Eirin"
 KYO_the_end_of_the_humankind_desc:0 "Yukari Yakumo hid the gap between the lines of that ancient register, allowing Eirin's information to bypass Lunar Capital's surveillance. Days later, a line of text in the file reversed itself, and a reply from Sagume Kishin finally arrived on the surface.\n\n Sagume recounted Lunar Capital after Eirin's departure. The Purifiers took over the council, erased the early history of the city, and portrayed the departed sage as a corrupted traitor. The opposition did not completely disappear, but could only hide within the administrative organs, the army, and the god families, preserving their power in silence, waiting for an opportunity to break the status quo.\n\n “As long as there are still people in this world who claim their order is absolutely correct, the amanojaku will be its eternal opponent,” Sagume wrote. “When everyone is ordered to say yes, someone must retain the ability to say no.”\n\n Lunar Capital, without Eirin, was not indestructible. Cracks still exist within it, and the amanojaku clan, considered heretical by the system, guards behind those cracks."



 KYO_fat_princess:0 "Nonexistent Summoning Command"

 KYO_fat_princess_desc:0 "A summoning order bearing Hakugyokurou's mark was sent to Eientei. The document claimed that Yuyuko was detaining the fallen soldiers of the Moon War and refused to allow Eientei access to the dead moon rabbit.\n\n Youmu quickly discovered that the seal was upside down, while Yuyuko found Reisen, who was still alive, in the list of the dead. The back of the paper again bore an old advertisement for the “Bunbunmaru Newspaper.”\n\n Aya Shameimaru argued that since the previous document questioned Eientei, this one should question Hakugyokurou to be impartial. Yukari only corrected her on one common sense point: fabricating crimes on both sides simultaneously does not make a lie into justice.\n\n In the end, Hakugyokurou and Eientei did not go to war over this forged order. Aya was left behind to check the records of the twelve boxes of the deceased, and to learn the difference between investigative journalism and fiction."

  KYO_yuyuko_and_youmu:0 "The Undead Princess and the Half-Human Court Master"
 KYO_yuyuko_and_youmu_desc:0 "Yuyuko Saigyouji was the last descendant of the Saigyouji family. She ended her life under Saigyou Ayakashi, but did not disappear. When she opened her eyes again, her breath and body temperature were gone, and her memories were blurred; the dead human girl had become the spirit princess who now rules Hakugyokurou.\n\n Yuyuko knows how to comfort the dead, release their obsessions, and send their souls on their next journey, but rarely mentions why she remains here. She has seen countless people go, yet she herself seems forgotten on the page between life and death, unable to leave.\n\n Accompanying her is the half-human, half-phantom gardener Youmu Konpaku. Youmu trims cherry trees, prepares meals, and banishes unruly ghosts, and when Yuyuko forgets time and the past, she remembers for her that Hakugyokurou still exists today. The mission of the Konpaku clan is to protect the Lord of Netherworld, but what Youmu protects is far more than just a mission."

 KYO_grandpa_still_fight:0 "The Konpaku clan's Original Oath"
 KYO_grandpa_still_fight_desc:0 "When the Konpaku clan first received the sword of Hakugyokurou, Gensokyo's Yama Eiki Shiki repeatedly instructed them: Yuyuko Saigyouji must not be harmed. She is not merely a princess in name only, but the key to the flow of souls in the Netherworld. If Yuyuko were to lose control, countless dead would be trapped between life and death, and even the boundary between Higan and Gensokyo might be shaken.\n\n Therefore, the Konpaku clan's oath contains two inseparable responsibilities: to serve the lord of Hakugyokurou and to guard the boundary between the living and the dead. Most of the time, these two missions are in harmony; but if Yuyuko's will conflicts with the order of the Netherworld, the Konpaku clan's sword must choose between loyalty and duty.\n\n Youki Konpaku entrusted Youmu with swordswomanship, the position of Gardener, and this heavy oath. The old man may have left Hakugyokurou, but the mission he left behind remains in the hands of the young gardener—to protect Yuyuko, and, if necessary, prevent her from crossing the line she should not cross."

 KYO_Hakugyokurou_order:0 "Netherworld is not the end"
 KYO_Hakugyokurou_order_desc:0 "Netherworld is not a warehouse for the dead, much less an end where souls linger forever. After life ends, the deceased arrive here with their name, memories, and lingering attachments; these things do not immediately disappear when the heart stops beating, nor should they be abruptly erased.\n\n Through Yama's judgment, the soul will be received by Yuyuko into Hakugyokurou. She listens to the deceased's final regrets, allowing them to look back on their ended lives under the cherry blossoms, gradually letting go of attachments that cannot be carried to the next life. When the name no longer causes pain, and the memories finally find peace, the soul will leave Netherworld and enter the next cycle of reincarnation.\n\n Death is not the nothingness of life, but a transit point between two journeys. Yuyuko's duty is not to detain the dead, but to ensure that every soul arriving at Higan can continue its journey once it is ready."

 KYO_beauty_court:0 "Yuyuko, do you know who you are?"
 KYO_beauty_court_desc:0 "“Yuyuko, why are you here? There are countless dead in Netherworld, and Hakugyokurou has welcomed many noble souls, but why are you the one sitting in this position?”\n\n The simplest answer is: You are the last descendant of the Saigyouji family, the one who sealed Saigyou Ayakashi, and the Netherworld administrator chosen by Yama. Your remains cannot leave the tree, and your soul cannot enter reincarnation, so bidding farewell to other dead becomes your endless duty.\n\n But identity cannot fully answer who she is. Shedding the titles of princess, deceased, and administrator, she still smiles at delicious food, remembers the sound of spring snow falling in the courtyard, and on certain familiar nights, inexplicably gazes at Saigyou Ayakashi that should never bloom.\n\n She is neither a tool sealed by Saigyou Ayakashi, nor merely an official appointed by Yama. Even having forgotten everything from her life, she is still Yuyuko Saigyouji—a person who has passed through death but has not lost herself in the process."

 KYO_flower_blossom_again:0 "Saigyou Ayakashi's Sealed Object"
 KYO_flower_blossom_again_desc:0 "Saigyou Ayakashi's roots are not just a single skeleton. Generations of the Saigyouji clan lie buried here; their bones, names, and power together form part of the seal. The closer to the surface, the later the burial; and above all ancestors, the final seal, lies the last descendant of the Saigyouji family—Yuyuko.\n\n In her previous life, she prevented Saigyou Ayakashi from fully blooming with her own death. To ensure the seal would not be shaken again, she lost her memories of the cause of her death and the location of her body. Afterwards, the dead girl awoke as a spirit, unaware that beneath her feet lay her entire family and her former self.\n\n The last Saigyouji did not inherit any mansions or family businesses in the human world. What she inherited was the heavy responsibility of guarding the ancestral resting place, maintaining the seal of Saigyou Ayakashi, and managing all the souls that come to the Netherworld."

 KYO_pale_spycraft:0 "Yama's Verdict"
 KYO_pale_spycraft_desc:0 "Eiki Shiki, representing Higan, guaranteed for Hakugyokurou: All worlds must recognize Yuyuko Saigyouji's management of the souls of the Netherworld, and must not arbitrarily seize souls, interfere with judgments, or force the dead to return to the human world under the pretext of war or politics.\n\n Accompanying this power are the responsibilities that Hakugyokurou must bear. All souls sent by Higan must be settled, and once their obsessions are resolved, they must enter the cycle of reincarnation; Hakugyokurou must not detain the dead, form a private army of the dead, or allow anyone to approach the seal of Saigyou Ayakashi. The sword of the Konpaku clan is responsible for ensuring that these rules are enforced.\n\n Yama protecting Hakugyokurou does not mean giving Netherworld to Yuyuko. All the power here exists only for the safe departure of the dead. If the administrator treats a soul as their own possession, the power granted by the judgment will also become the basis for judging her on the same day."

 KYO_may_the_flower_fly_high:0 "Blooming invites death"
 KYO_may_the_flower_fly_high_desc:0 "Saigyou Ayakashi can never fully bloom under any circumstances. Its petals are no ordinary spring scene; each bloom calls forth death within the living, causing souls to detach from their bodies and merge into the roots of Saigyou Ayakashi. If all branches bloom simultaneously, the boundary between life and death will crumble.\n\n Just as Baldr's death did not merely signify the fall of a god, but heralded the beginning of Ragnarok, the blooming of Saigyou Ayakashi is also a harbinger. It foreshadows not the destruction of a courtyard or a family, but the beginning of death transcending Higan, dragging the entire mortal realm into a hopeless end.\n\n Yuyuko's remains are the final lock sealing this catastrophe, her lost memories the second door locked. To allow the living to continue welcoming spring, Saigyou Ayakashi can never bloom; and Yuyuko is destined never to fully understand why she sleeps beneath the flowering tree."

 KYO_throne_of_the_dead:0 "The Duties of the Undead Princess"
 KYO_throne_of_the_dead_desc:0 "Yuyuko's philosophy of life didn't come from scriptures or pronouncements, but was gradually forged through countless farewells. She had seen the deeply attached dead finally let go of their hatred, and she had seen the souls reluctant to part with their loved ones linger under the cherry blossoms for years before peacefully walking towards reincarnation. Death, in her eyes, was neither punishment nor failure, but simply a door that all lives must eventually pass through.\n\n She wouldn't belittle any departure just because she had seen countless souls off. Every name belonged to an unrepeatable life, and every farewell deserved to be taken seriously. Therefore, Yuyuko's smile appeared exceptionally peaceful—she knew that sorrow wouldn't last forever, and that the departed would eventually begin anew on another journey.\n\n Only Yuyuko herself could not move forward. She watched countless souls arrive, linger, find peace, and enter a new cycle of reincarnation, while she herself remained seated in Hakugyokurou, for her own end had long been sealed beneath Saigyou Ayakashi.\n\n The seat of the Princess of the Dead was never a throne ruling over the dead, but a watchful seat that arranged the final journeys for everyone except herself."

 KYO_accept_death_to_all:0 "Between Life and Death"
 KYO_accept_death_to_all_desc:0 "Faced with souls newly arrived in Netherworld, still fearful of death, Yuyuko rarely uttered cold pronouncements. She would ask Youmu to bring tea and refreshments, inquire about their names, and patiently listen to their final words as if receiving a guest from afar.\n\n Only when it was time to depart would she gracefully rise, personally calling out the name of the deceased, opening the path to reincarnation for them. After the farewell, Yuyuko would casually ask Youmu what she wanted for dinner, as if the parting had been just an ordinary feast.\n\n Her seemingly nonchalant attitude wasn't due to a lack of understanding of the weight of death. It was precisely because Yuyuko understood better than anyone that parting was inevitable that she didn't want to add to the burden of the deceased with solemnity and fear. Acknowledging death is not praising it; gently sending someone off is to ensure the departed retain their name and that those left behind can continue living."

 KYO_youmu_the_Domination_one:0 "The Commands of the Konpaku clan"
 KYO_youmu_the_Domination_one_desc:0 "Yuyuko's requests were always vague. She would gaze at the empty courtyard and remark on how lonely the wind seemed that day; she would ask Youmu to prepare two teas, without specifying who the other guest was. Youmu could only try to decipher her mistress's thoughts while tending to the lost spirits, tending the garden, and managing to get dinner on time.\n\n The first command left by Youki was to serve Yuyuko; the second command was to stop Yuyuko when necessary. Young Youmu initially thought these two commands contradicted each other, until she gradually came to understand her master through countless trivial demands.\n\n Her grandfather placed “serve” first not because she believed her master was always right. Only by first accompanying Yuyuko and understanding her silences and jokes could Youmu distinguish between mere childish whims and forgotten pain, and when she must draw her sword and say no."

 KYO_youmu_the_one_without_love:0 "Between Master and Duty"
 KYO_youmu_the_one_without_love_desc:0 "One spring day, Yuyuko stood before Saigyou Ayakashi and said in an almost weather-sounding tone, “It would be so beautiful if it could bloom in full.”\n\n The Konpaku clan's secret decree required Youmu to stop anyone attempting to break the seal, even if that person was Hakugyokurou's master. Her hand unconsciously moved to the hilt of her sword, but in Yuyuko's eyes, she saw a kind of longing that even she herself couldn't understand. Was it a dangerous order, or the instinctive pursuit of one's past by someone who had lost their memory?\n\n Youmu didn't blindly obey, nor did she immediately treat Yuyuko as a sinner to be subdued. For the first time, she set aside the standard answer of “successor of the Konpaku clan” and earnestly asked her master why she wanted to see that tree bloom.\n\n One day, she would have to choose between her mission and Yuyuko. But before that day arrives, Youmu must at least be certain that she has chosen the person before her, not the answer imagined for her by ancestral teachings."

 KYO_spirit_is_all:0 "Reborn After Death"
 KYO_spirit_is_all_desc:0 "Yuyuko has no heartbeat, nor does she possess a truly living body. Yet she still shows anticipation for new dishes, serves guests elegantly, and deliberately makes impossible requests to tease the overly earnest Youmu. Death took away her past, but it didn't turn her into an empty shell merely performing duties.\n\n Youmu once didn't understand why the dead needed to eat, admire flowers, and celebrate festivals. Later, she realized that these things weren't to sustain Yuyuko's life, but to prove that death hadn't erased her as a human being.\n\n Waking up after death isn't a simple continuation of her previous life, nor is it being completely erased by the world. Memories may be fragmented, and the way she exists may have changed, but Yuyuko can still rebuild relationships, take on responsibilities, and decide how to spend each day. She died once, and then continued to live on as another version of herself."

 KYO_spirit_has_no_limit:0 "The Eternal Netherworld"
 KYO_spirit_has_no_limit_desc:0 "As long as life exists, death will not cease; as long as the dead continue to arrive, the work of the Netherworld will never end. Every day, Youmu sweeps away fallen cherry blossoms, organizes the register, and guides ghosts, while Yuyuko receives wave after wave of souls who have completed their lives. This order has been running for far too long, and it is destined to continue.\n\n However, Hakugyokurou's eternity is not without change. Seasons change, the trees in the garden sprout new branches, and Youmu, from a child trembling with a sword, gradually grows into a gardener capable of shouldering responsibilities alone. Yuyuko has witnessed many generations of spirits come to her side, and ultimately, she herself sees them off.\n\n She knows that Youmu will not stay with her forever, but she never reveals this. So Yuyuko would still make childish requests, and Youmu would still earnestly try to fulfill them. For those without end, these short and ordinary days were more precious than eternity."

 KYO_the_one_without_love:0 "Manager, or Prisoner?"
 KYO_the_one_without_love_desc:0 "Yuyuko confessed to Youmu that the duties of the Lord of Hakugyokurou both provided her with a place to stay and trapped her in a time without end. Every soul that came before her had a next destination, but the manager responsible for arranging their return never had a place for herself on the register of reincarnation.\n\n She didn't hate this duty. Seeing obsessions resolved and the dead embark on their journeys again did give meaning to her long existence. But when the last guest left and Hakugyokurou returned to silence, Yuyuko sometimes couldn't tell whether she had chosen to stay here or had already become part of maintaining Netherworld's operation.\n\n “Perhaps I always ask what I'll eat next,” she said to Youmu with a smile, “it's just because that's the closest future I can still look forward to.”\n\n At that moment, Youmu finally saw the cage behind the throne and understood that Yuyuko's composure wasn't the absence of sorrow, but rather that she had learned over the long years how to gracefully coexist with sorrow."

 KYO_the_end_of_the_every_soul:0 "Youmu's Own Choice"
 KYO_the_end_of_the_every_soul_desc:0 "Youmu reread the secret order left by the Konpaku clan, then put it back in its sword case. She wouldn't doubt Yuyuko because of Higan's orders, nor would she close her eyes to actions that might jeopardize the order of life and death simply because she cherished her master.\n\n “Lord Yuyuko, I choose to stay by your side not just because of the oath of the Konpaku clan. If one day you truly attempt to make Saigyou Ayakashi bloom, or harm the souls entrusted to Hakugyokurou, I will stop you with my own hands.”\n\n Youmu paused, gripping her sword tightly.\n\n “But even after that, I will not leave you. I will share the consequences with you, and together we will find a path to continue.”\n\n Yuyuko looked at her quietly for a long time, finally smiling as she replied, “Then until that day comes, I still entrust the garden and dinner to you.”\n\n Only now did Youmu truly understand why her grandfather had written “serving the master” before “stopping the master.” Loyalty is not eternal obedience, but refusing to abandon the other when one must say no. The orders of the Konpaku clan end here; from now on, this will be Youmu's own choice."


 KYO_quack_doctor:0 "The Forged Prescription Under the Moonlight"

 KYO_quack_doctor_desc:0 "A so-called Eientei trial list is plastered all over the streets. The paper contains no complete medical records, only dosages, trial order, and estimated time of death, as if wounded soldiers sent back from the battlefield were merely samples awaiting recording.\n\n Yuyuko takes the prescription to Eientei, intending to ask Eirin if she has crossed the line expected of a healer. Eirin immediately points out that the document uses Lunar Capital military units from two hundred years ago, the patient signatures are from old prisoner-of-war records, and the stamp's position is completely wrong.\n\n Yukari turns the paper over and finally discovers its true source—a batch of unsold old copies of the *Bunbunmaru Newspaper* newspaper.\n\n Aya Shameimaru insisted this was a news exercise to test Eientei's credibility, but was ultimately required to publish corrections for seven consecutive days. The dispute between Eirin and Yuyuko didn't disappear, but at least this time, they found someone more worthy of questioning than each other."




 KYO_human_must_obey:0 "Restarting the Battle with the Moon"
 KYO_human_must_obey_desc:0 "The ancient saying “knowing it's impossible yet doing it anyway” doesn't mean being blind to the impenetrable cliff ahead, but rather understanding that some things, even if impossible, should never be surrendered to.\n\n The crushing defeat of the First Lunar War had already proven the immense power of Lunar Capital. Toyohime could fold distances, Yorihime could summon the gods, and the Pure Barrier prevented the earthly army from even reaching the actual city gates. For a thousand years, Lunarians have always regarded that victory as proof that the earth could never resist.\n\n Yukari Yakumo sees defeat as a battle yet to be fought. Her former followers were a distrustful army of Youkai; now, standing behind her are the Gensokyo, who have learned to live together and are willing to fight for the same homeland.\n\n We will once again challenge the impossible and seize a victory from Lunar Capital that even fate could not foresee."

 KYO_east_asia_is_mine:0 "Awaken the power within the Sanctuary"
 KYO_east_asia_is_mine_desc:0 "Deep within the Lunar Capital Sanctuary, two individuals remain, manipulated. The Purification Faction molded them into guardians of the Sanctuary, calling their manipulated memories their mission, and making them believe that obedience to Lunar Capital is their only value. They possess the power to change the course of the war, yet they have never been allowed to decide how to use that power.\n\n The files left by Eirin and the secret letter from Sagume finally reveal the lies behind the orders. The two are not true advocates of the purified order; they are merely isolated from the truth, trapped within the identities written for them by Lunar Capital.\n\n Yukari will not transform them from one weapon into another. She will guide them to see their concealed past and give them their first chance to choose for themselves. The power within the Sanctuary should no longer guard its cage; its direction should be determined by those who wield it."

 KYO_how_to_deal_philippines:0 "Seeking the help of the Goddess Hell"
 KYO_how_to_deal_philippines_desc:0 "Lunar Capital abhors death, regarding Hell, reincarnation, and the dead as filth to be avoided. However, precisely because of this, the expansion of the Purification faction also threatens the order of the afterlife. If the Lunarians can truly erase all changes from the world, Hell will sooner or later become their next target for purification.\n\n Yuyuko will use the connections of Hakugyokurou and Higan to deliver an invitation to the Hell goddess Hecatia Lapislazuli. She has long loathed the aloof purity of Lunar Capital and will not miss the opportunity to make the Lunarians pay the price.\n\n This is not a demand for Hell to submit to Gensokyo, but an invitation to another god with a common enemy to join the war. When the paths of Netherworld, the authority of Hell, and the gap of Yukari connect, Lunar Capital will find that those worlds they have condemned as filth have begun to surround the Moon from all sides."

 KYO_how_to_deal_USSR:0 "Breaking the Shield of Lunar Capital"
 KYO_how_to_deal_USSR_desc:0 "The shield of Lunar Capital is not simply an energy barrier. It repels impurity with purity, rejects change with stillness, and isolates all enemies with the vast distance between the moon and earth. In First Lunar War, the Youkai army lost its way before these laws, ultimately failing to even reach the real Lunar Capital.\n\n Eirin will point out the laws governing the shield's operation, Sagume will provide the weakest point from within, and Ran will calculate the potential consequences of each change. Ultimately, Yukari will personally modify the boundaries between the moon and the earth, and between the inside and outside.\n\n We don't need to brute force the entire barrier; we only need to make it unable to determine the enemy's origin. When the definitions of “external enemy” and “those within the city” overlap, the supposedly absolutely pure shield will automatically open its first crack."

 KYO_secure_south_east_asia:0 "Establishing Supply Lines Between the Earth and the Moon"
 KYO_secure_south_east_asia_desc:0 "Opening the gap only allows the army to reach the Moon, but it cannot guarantee their continued fighting there. Weapons, ammunition, medicine, and food must reliably cross the Earth-Moon boundary, and the wounded must be returned to Earth before the gap closes. Otherwise, the Moon forces will ultimately remain just another isolated expeditionary force.\n\n Ran programmed each gap with precise transport schedules, Kappa manufactured cargo crates capable of withstanding boundary distortion, Eientei established wounded evacuation systems at both ends, and Tewi and Chen connected the secret roads throughout Gensokyo to the distribution network. Every city liberated and factory recaptured on the surface battlefield would translate into the Moon forces' continued advance.\n\n From then on, the war on Earth and the Moon were no longer separate. Behind the Moon army was not a fragile gap, but an entire world willing to supply them with weapons, food, and hope."

 KYO_creat_big_gensokyo:0 "Opening the Gap to the Moon"
 KYO_creat_big_gensokyo_desc:0 "A thousand years ago, Yukari Yakumo also opened a path to the Moon Sea in the night sky. Back then, the Youkai, driven by fame, ambition, and a war no one truly understood, embarked on the Moon, ultimately crumbling before the Watatsuki Sisters. Yukari returned to Earth with her remnants, leaving her defeat in the long dreams that followed.\n\n Now, she stands once more under the same moonlight. Behind her are the healers of Eientei, the dead of Hakugyokurou, the sentinels of Youkai Mountain, the monks of Myouren Temple, the vampires of Scarlet Devil Mansion, the subterranean Youkai, and countless lives who could never have stood shoulder to shoulder with her in the past. They are not weapons preserved, but people who voluntarily protect the same homeland.\n\n Yukari unfolds her folding fan, dividing the boundary between “distant” and “immediate.” The night sky splits open, and the white horizon of the lunar maria appears directly before the Gensokyo group for the first time.\n\n This time, they will not come to conquer the moon. The war on Earth will reclaim the countries controlled by Lunar Capital, while the war on the Moon will reach the core of the purifying order. Both fronts must be won together for the fate of the world to be truly rewritten."

 KYO_the_yukari_order:0 "The World Yukari Desires"
 KYO_the_yukari_order_desc:0 "On the edge of an almost faded ancient star map, two different handwritings remain. Yukari Yakumo can no longer recognize one of the names, but she always remembers that she and someone traveled through countless years to this era to stop Lunar Capital from destroying Earth. That was Maribel Hearn's original mission, and also the obsession that Yukari Yakumo has long forgotten her origins for but has never truly let go of.\n\n Initially, she only wanted to preserve the illusion sufficient to defeat Lunar Capital. After the First Lunar War, she realized that youkai, gods, and ghosts were not weapons to be used passively. They could fear, quarrel, love, and call a temporary refuge their home. Thus, Gensokyo, originally built for the war, gradually became a reason to end it.\n\n What Yukari wanted was not a world ruled by youkai, not a massive barrier that shut out all dissent, and certainly not to completely erase Lunar Capital from the sky. She wanted science to no longer need to prove itself by denying illusion, and illusion to no longer need to consume humans to survive; she wanted the living to no longer fear the dead, and life on the moon and on earth to no longer be judged as impure because of birth, change, and memory.\n\n The Purifiers must be eliminated, but Lunar Capital will still have a future. Eirin and Kaguya will return to their former sanctuary and rebuild it with the Lunarians who are still willing to change. Gensokyo will not conquer the Moon, but will only end an era that disguises fear as purity.\n\n The journey across millennia is finally nearing its end. Merry initially wanted to change a future destined for destruction; Yukari Yakumo wants to prove that there are more ways to live in the world. Even if she has forgotten who first stood with her gazing at the stars, that promise will still be fulfilled in this world where they no longer have to reject each other."

 KYO_love_forever:0 "Sunset Vow"
 KYO_love_forever_desc:0 "After a mission to Eientei and Hakugyokurou, Reisen and Youmu did not immediately return to their respective masters. They sat side by side on the stone steps at the boundary of life and death, watching the sunset gradually sink into the clouds. One had fled the battlefield of the Moon, the other had been taught from childhood never to leave her post; they rarely had moments where they could simply stop.\n\n Reisen asked if they could meet again like this after the war ended. Youmu didn't promise eternity, nor did she give any grand answer, only earnestly promising that she would try her best to keep the promise as soon as the next sunset came.\n\n This promise wouldn't end Eirin and Yuyuko's argument, nor would it be written into any covenant. It was simply two girls who had long lived under the weight of their missions, allowing themselves for the first time to look forward to a tomorrow unrelated to their duties. As for what name this feeling would ultimately have, that should be decided by themselves."

