l_english:

KYO_miko_death:0 "The Death of the Shrine Maiden"
KYO_miko_death_desc:0 "The Hakurei Shrine at dawn should have been filled with the sound of brooms and the ashes of burnt talismans, but today there was only wind. The gohei lay fallen beside the stone steps, the aura of the barrier flickering, as if someone had pulled the most important “safety bolt” from the entire Gensokyo.\n\n The death of the 44th Hakurei shrine maiden came too suddenly, without warning, without ceremony, without any signs that could be called normal. Why did she die? Who killed her? Every question pierced the heart like a needle.\n\n The balance that Gensokyo had long maintained always relied on shrine maidens standing on the front lines to suppress incidents. Now that Shrine Maiden is gone, everyone has reached a silent consensus on the same thing: if even she can be so cleanly erased, who will be next? No one can guarantee."

KYO_resure_the_order:0 "Maintaining Order in Gensokyo"
KYO_resure_the_order_desc:0 "After the shrine maiden's death, panic spread not through screams, but through paralysis.\n\n Tengu newspapers stopped reaching the Human Village, leaving rumour as the only news. Kappa halted their projects on the pretext of recalculating materials, though in truth no one wished to risk their resources while the situation remained unclear. Even the fairies stopped making trouble by the road and went into hiding, as though they too could smell danger.\n\n Shops in the Human Village pulled down their shutters, the village school suspended its lessons, and the Night Sparrow Diner hung out a closed sign. People stopped discussing what to buy tomorrow and began calculating what they had to hoard today.\n\n If that paralysis is allowed to spread, everyday life will collapse before open conflict begins. We must restore the basic machinery of society at once: reopen channels for news, organize patrols and escorts, keep food and supplies moving through the Human Village, and publish clear emergency measures.\n\n Not everyone needs to trust us. Everyone must at least know that someone is still holding Gensokyo together."

KYO_investigate_miko_death:0 "Investigate the death of shrine maiden"
KYO_investigate_miko_death_desc:0 "Hakurei Shrine Maiden died before the barrier pillar, without wounds, without struggle, and without anyone witnessing her fall. Within seven steps, dust, moss, and tiny creatures vanished, yet the Great Hakurei Barrier reported nothing amiss.\n\n The emergency response committee will investigate from all possible directions. Eirin Yagokoro is responsible for examining the body, systematically checking for drugs, poisons, instruments, diseases, and contamination from rituals; Satori Komeiji will re-examine the shrine, searching for lingering thoughts, fears, and deliberately concealed motives; Aya Shameimaru will utilize tengu's intelligence network to trace patrol routes, witnesses, and every unverified rumor.\n\n However, the investigation has faced the same problem from the outset: the scene wasn't lacking in clues, but rather unnaturally clean. There were no witnesses, no murder weapon, no reliable cause of death, and no trace to prove that an enemy had entered the shrine.\n\n Yukari didn't care that yet another shrine maiden had reached the end of her life. What she cared about was that some being could take a life near the core of the Great Hakurei Barrier, yet make the barrier, the shikigami, and all the observers believe that nothing had happened.\n\n This investigation might not find the culprit. But as long as we can confirm what is missing, we might know what kind of enemy we are facing."


 KYO_jiejiechuxianliekou:0 "A Rift in the Barrier We Cannot Ignore"
 KYO_jiejiechuxianliekou_desc:0 "An unnatural blank had appeared at the edge of Youkai Mountain. The patrol returned twice. Its markers were still there, but the barrier's response nearby was weaker than yesterday. Hakurei Shrine soon sent the same warning: several previously stable nodes had begun to stop responding.\n\nThe investigation into the shrine maiden's mysterious death remained unresolved, yet its investigators were summoned at short notice to examine the rift. Concepts, technologies, and records from the Outside World were entering through the damaged sections. People nearby began explaining the mountain's strange phenomena in different terms. Youkai bound to those stories began losing their strength and struggling to maintain their forms.\n\nThe sages decided to divert personnel to sealing the breaches first. Access around the rift was restricted. Tengu continuously monitored its expansion, while kappa brought equipment and construction materials to reinforce key nodes. Every repair had to be measured again. A surface that appeared closed was no reason to withdraw the crews.\n\nThe papers concerning the shrine maiden's death were sealed and stored, along with the evidence already gathered, so the investigation could resume when personnel became available. Some objected to the suspension, fearing that the murderer would use the reprieve to escape. Before the meeting could settle the argument, another report arrived: one more point of disturbance.\n\nThe coordinators marked its location on the map and sent for reinforcements. The investigators left behind the records needed to sustain the inquiry. Everyone else packed their equipment and went to hold the thinning boundary."

 KYO_suoyourendubixuhuoxiaqu:0 "Everyone Must Survive"
 KYO_suoyourendubixuhuoxiaqu_desc:0 "Appeals from near the rifts were becoming harder to verify. Someone on a mountain road would see a small youkai's outline come apart. When searchers arrived, they would hear only intermittent answers. A companion remembered where the youkai had lived, yet was beginning to struggle to describe its appearance. At first, such reports were dismissed as mistakes born of panic. Then similar accounts began arriving from different places.\n\nThe fear, faith, and stories that sustained many weak youkai were losing their force. The Outside World's rules entered through the rifts, unsettling the old conditions of their existence. Food and shelter remained necessary, but could not stop their bodies from fading. Some could still converse when they reached a shelter. After one night, even giving their names became difficult.\n\nHakugyokurou also reported disturbances. Spirits lost their way in transit and lingered where they should not remain. Familiar figures appeared repeatedly at village entrances after dark, neither answering calls nor allowing themselves to be guided away. Humans barred their doors, afraid the dead had returned to claim their lives. The youkai responsible for guiding them discovered instead that the old routes had gone wrong.\n\nCommunities began competing for help from the powerful. Some sent people to press their appeals. Others could not even find an envoy strong enough to complete the journey. The sages had to investigate the changing boundary. Factions with strength to spare had to bring people back first, give them somewhere to stay, and preserve identifying clues for those who had become separated. Waiting for every faction to agree on who should send personnel first and who owed more supplies might leave no one to find.\n\nOld grievances had not vanished. Some refused to admit youkai who had once attacked them. Others feared that relief lists would later become lists of people to arrest. These disputes needed attention, but could not be allowed to obstruct rescue. Human villages also needed escorts and shelter. The fate of the dead could not be left until last either.\n\nBeing able to hold one's form now was no guarantee of enduring later. Every faction had to commit some of its strength to the places where the first losses were occurring. Many response fields on the appeals register were still blank. Until their fate was confirmed, someone had to be sent to search each place once more."

 KYO_yinqinaidexiangfa:0 "Afterwards, the household will bypass the crack."
 KYO_yinqinaidexiangfa_desc:0 "Okina did not attempt to directly mend the gap.\n\n In her view, since the original roads, orientations, and internal/external relationships were failing, there was no need to continue relying on those already disordered connections. She connected the damaged nodes through the back door, creating temporary passages on both sides of the gap, allowing surveyors, rescue teams, and supplies to bypass the collapsed area.\n\n This method quickly proved effective. Several severed settlements reconnected, and residents previously trapped in the disordered roads were able to evacuate. Even if a section of the barrier completely lost its direction, the back door could still send people out from other locations.\n\n However, the back door could only replace roads, not repair them.\n\n With each additional temporary entrance, another connection, no longer constrained by the original structure, was created within the large barrier. Some of the back doors have begun to shift. An entrance that led to Youkai Mountain yesterday might be located deep within the Bamboo Forest of the Lost today. Okina can repeatedly close the wrong doors and reopen new ones, but she cannot guarantee where the next shift will occur.\n\n She successfully maintained communication between different parts of Gensokyo, but this also complicated the entire barrier.\n\n This is not a repair, but simply leaving everyone a way out before the roads disappear."


 KYO_bayunzidefangfa:0 "Redefining the Boundary with Gaps"
 KYO_bayunzidefangfa_desc:0 "Yukari Yakumo chose to directly address the out-of-control boundary.\n\n She isolated the shifted areas one by one, severing the connections between the gaps and the surrounding barrier with gaps, and then transferring the accumulated pressure to nodes that could still withstand it. As long as the anomaly does not continue to spread, the large barrier will have time to stabilize again.\n\n The initial attempts were quite successful. The gap stopped expanding, the chaotic paths regained their direction, and some nodes even returned to their original positions in measurements. To onlookers, Yukari seemed to have once again proven that she still controlled the boundaries of Gensokyo.\n\n However, Ran soon discovered that the transferred pressure hadn't disappeared. When one gap was sealed, another node would show a new deviation; when a boundary was re-fixed, the nearby land might experience even stronger distortion. Each time Yukari used her abilities, she was merely redistributing the locations of the collapses within the entire the Great Hakurei Barrier.\n\n Even more seriously, some gap began to refuse to be defined. They neither fully belonged to Gensokyo nor led to the Outside World; Yukari couldn't even separate them into “inside” and “outside”.\n\n She could still delay the crisis and still preserve the most important nodes.\n\n But everything she did was more like repeatedly retying a knot on a rope about to break. The knots remained in place, but the fibers grew thinner with each pull."


 KYO_cimuhuashandeyijian:0 "Using all living beings to bind the land"
 KYO_cimuhuashandeyijian_desc:0 "Kasen Ibaraki believes that the Great Hakurei Barrier is not merely a wall constructed of magic.\n\n The mountains, roads, and settlements of Gensokyo maintain their original positions because the long-time inhabitants and youkai still recognize them. As long as a river is still called upon by its inhabitants, a forest is still patrolled by youkai, and a shrine is still maintained and worshipped, that land is unlikely to detach from the barrier.\n\n She summoned local land gods, wild beasts, hermits, and inhabitants to remark the boundaries of roads, rivers, and settlements. Guardians must patrol fixed routes daily, while inhabitants repeatedly confirm place names, directions, and connections between each other. Those places that had shifted were re-fixed with stone tablets, knots, and local rituals.\n\n This method did indeed restore stability to several nodes.\n\n But it was too slow and required too many people. Each node must be manned long-term; once patrols are interrupted, the previously suppressed deviations will reappear. Some residents are also growing weary; no one can stay by the same road forever, constantly proving that it still exists.\n\n Worse still, some lands have lost their response. No matter how many people Kasen leads, calling out place names and retracing old paths, the measurements continue to deviate, as if those places no longer acknowledge anyone's memory.\n\n Kasen's method can restore places that haven't completely collapsed, but it cannot bring back what has already been lost.\n\n She has preserved the connection between the land and its inhabitants, but the places that can be preserved are dwindling day by day."


 KYO_sanxianzheda_Chenggongshi:0 "The Final Consensus of the Three Sages"
KYO_sanxianzheda_Chenggongshi_desc:0 "All three repair plans have been implemented.\n\n Yukari Yakumo redefined the boundaries using gaps, Okina bypassed the malfunctioning path at the back door, and Kasen Ibaraki summoned the residents and local guardians, attempting to re-fix the land based on their long-accumulated knowledge.\n\n They did indeed slow down the collapse.\n\n But no method truly cured the Great Hakurei Barrier.\n\n The pressure sealed by Yukari would reappear at other nodes; the passages established by Okina also began to be affected by coordinate shifts; the land that Kasen had barely fixed would lose its position again if patrols and checks were interrupted even slightly. The spiritual power of the barrier remained, and the spell was not completely destroyed, but the relationships supporting the overall structure had begun to disintegrate.\n\n The three sages finally reached the same conclusion.\n\n This the Great Hakurei Barrier could not be restored to its original state. Gensokyo needs a new barrier. It must redefine its inner and outer worlds, reconnect the land and its inhabitants, and avoid once again placing the survival of the entire world on a single shrine maiden and a single spell.\n\n However, a new barrier cannot be completed in a short time. Design, measurement, materials, and re-stabilizing the nodes will take months, or even longer.\n\n Gensokyo may not be able to hold out until then. The power of the Youkai is waning. Not because they have been defeated, but because the denial from the Outside World is seeping in through the cracks. As more people regard the Youkai as non-existent superstition, the Youkai in Gensokyo will gradually lose their foundation.\n\n To keep them going, they must gain new respect from the Outside World.\n\n More people must know that the Youkai truly exist. Let the city remember the red mist, let the army remember the figures in the night, let every road, every newspaper, and every inexplicable failure prove that fantasy has not died.\n\n Kasen disliked using fear as a tool for survival. Okina also understood that temporary intimidation could not replace a truly stable new structure. Yukari, however, did not defend this path.\n\n She only asked one question.\n\n “How much Youkai will be left before the new barrier is completed?”\n\n No one answered.\n\n Thus, the three sages reached a consensus: first, let the Outside World fear Youkai again; first, let Gensokyo have time to continue existing.\n\n Japan would become the first nation forced to acknowledge fantasy.\n\n This was not the best answer.\n\n They simply didn't have time to wait for a better answer."

 KYO_xianzhezhengqiujumindeyijianyubangzhu:0 "§RHundred Youkai Accord§!"
 KYO_xianzhezhengqiujumindeyijianyubangzhu_desc:0 "As the breach widened, the sages were finally forced to admit one truth: a barrier may be designed by a handful of people, but it cannot be kept alive by a handful alone.\n\n Yukari Yakumo's plan requires access to the Outside World, sustained mobilization, intelligence, medicine, engineering, public order, and popular support. This is not a crisis that sheer youkai power can solve. It requires a system capable of continuing to function. Without troops from the Scarlet Devil Mansion, there can be no deterrent; without Eientei's medicine and logistics, collapse will begin within; without tengu surveillance and communications, every operation will be blind; without kappa and yamawaro fortifications, equipment, and supply lines, the war will burn out in a single burst. If Hakugyokurou cannot steady the Netherworld, restless spirits will drag at the boundary of the entire world. If the Palace of the Earth Spirits cannot contain both the underground and the spread of panic, fear will tear Gensokyo apart first. If the Ministry of Right and Wrong sets no rules and renders no judgments, mobilization will soon become mutual predation. If the Human Village cannot sustain ordinary life and education, fear and faith will evaporate all the faster. And if the nameless grassroots youkai are abandoned, Gensokyo will be hollow at its roots.\n\n More importantly, the sages can no longer make every decision on everyone else's behalf simply by calling themselves guardians. This disaster threatens the existence of every community; every sacrifice and every choice must be seen, borne, and shared. They therefore launch the §RHundred Youkai Accord§!, establish the Gensokyo Emergency Council, openly seek commitments from every faction, and redistribute responsibility through concrete assignments.\n\n From the Scarlet Devil Mansion's high walls to Eientei's bamboo forest, from the Human Village school to Hakugyokurou's Netherworld Gate, and from Youkai Mountain's aerial patrols to the Palace of the Earth Spirits below, the sages will go in person—negotiating with every power and drawing Gensokyo's scattered strength towards a single purpose.\n\n This is no proclamation of unity. It is the minimum condition for survival. Only after Gensokyo can fight as one whole will it be ready to reach into the Outside World and halt the logic of reality that is erasing it."



 KYO_zhunbeijiuxu:0 "War Preparations Complete"
 KYO_zhunbeijiuxu_desc:0 "The moment the Hundred Youkai Accord was signed, Gensokyo ceased to be a victim waiting passively to be consumed. Tengu surveillance and communications now span the land; kappa and yamawaro equipment and underground networks are operational; Eientei's medicine and supplies have entered distribution; Hakugyokurou has steadied the Netherworld's unnatural tides; the Palace of the Earth Spirits has driven panic back below the surface; the Ministry of Right and Wrong has laid down rules of conduct; and the Human Village has restored both order and mobilization.\n\n Now comes the plan's first step.\n\n The sages agree that Gensokyo's opening move against the Outside World must not be total war. It must be a probe capable of measuring human response times, military–police coordination, communications, and the spread of public information. Tokyo is chosen not because it will be easy, but because the answer it gives will determine the shape of the war to come. Control of the capital's key junctions will give later operations a foothold, a supply route, and a source of intelligence.\n\n Remilia Scarlet, mistress of the Scarlet Devil Mansion, volunteers to lead the attempt. To her, the operation is both a declaration and a test. The mansion's special operations unit will form the spearhead, infiltrating Tokyo before the Outside World understands what is happening, securing vital nodes, and establishing a base that can endure.\n\n Sakuya reduces the operation to a minute-by-minute timetable so that entry, withdrawal, resupply, and concealment remain under control. Patchouli prepares magical support and countermeasures against modern firepower and surveillance. The mansion's strike teams will secure ports and railway junctions, disrupt security deployments, seize crucial communications and administrative intelligence, and build a lasting network of covert routes and safe houses.\n\n The aim is not to ignite total war at once, but to put the key to the battlefield in our own hands. Once Gensokyo drives its first stake into Tokyo, it will no longer be a world forced into a corner by the breach. It will be a power capable of choosing its next move."



 KYO_yaoguaideshengcunzhizhan:0 "The Youkai's War for Survival"
 KYO_yaoguaideshengcunzhizhan_desc:0 "The rift was still widening, and the lists of missing people brought back by the patrols now ran to several pages. Some could still answer when spoken to, yet their bodies grew fainter by the day. Reports from the Netherworld told of spirits stranded in transit, their usual passage no longer possible. The sages placed rescue efforts and military operations on the same agenda. Advance operations toward Tokyo were already underway.\n\nThe Scarlet Devil Mansion's assault teams would breach defenses and strike at enemy command. Sakuya coordinated their timing; Patchouli calculated the reach of their firepower. Every team had to make its rendezvous as agreed, never letting an early success carry it beyond support. The tengu of Youkai Mountain continued their reconnaissance, identifying exposed positions and directions that remained unscouted for the troops following behind.\n\nThe kappa and yamawaro linked workshops, tunnels, and stockpiles into supply routes. Every additional shipment of ammunition consumed at the front meant finding the materials and transport to replace it. Some borrowed technologies remained unfamiliar, so repair crews had to accompany the troops. Previously scattered tribes began taking their places in a common deployment, sharing means of contact and responding to requests from neighboring units.\n\nThe Palace of the Earth Spirits dealt with panic at the assembly areas. Satori identified the sources of unrest, while Koishi helped intervene when unconscious impulses ran out of control. Hakugyokurou and its phantom units guarded the disturbed edges of the spirit realm, clearing usable passages so that fighting would not compound the disorder among the dead.\n\nOnce word of the attack toward Tokyo spread, Japan would accelerate its mobilization. We would face armies with a continuing flow of replacements, backed by factories and transport networks. Preparations therefore included places for the wounded, evacuation routes, and reserve convoys. Any gap left on the list could cost lives once the war began.\n\nGunfire would force the Outside World to confront youkai again. It would also bring fear and hatred into many more lives. Both sides would pay the price of this war for continued existence.\n\nEvery faction joined with its own intentions. For now, the task they had accepted together was to secure a future for Gensokyo before more youkai faded away. The first units had already departed. Those who remained locked the warehouses again and waited for the front's next request."

 

 KYO_shenglizhihoudeyaoguaihuiyi:0 "The Youkai after victory"
 KYO_shenglizhihoudeyaoguaihuiyi_desc:0 "The fire in Tokyo hadn't completely died down. Collapsed buildings resembled broken skeletons; the streets were piled with rubble, scrap metal, and abandoned documents; intermittent radio broadcasts could still be heard in the distance. The war was indeed over, and Outside World was indeed forced to admit: the Youkai were not just a legend.\n\n But victory brought not “stability,” but an even more difficult test. Troops at the front needed to be withdrawn and reorganized; supply lines needed to be re-laid; factories needed to resume operations; ports and railways needed to be repaired; security needed to be taken over; food needed to be allocated; the wounded and sick needed to be cared for; prisoners and refugees needed to be dealt with; and more troublesome was the fact that the underworld had also fallen into chaos. The lingering resentment from the battlefield clung to the city's edge like fog, and some of the dead refused to leave, even beginning to become “vengeful spirits.”\n\n Therefore, the Sage convened the first general meeting after the war. The meeting was held in a government building that had been temporarily taken over, the walls still bearing the emblems of the old era, now obscured by newly hung flags. People sat on both sides of the long table; no one truly trusted anyone else, but everyone knew that if this table fell, the next conflict would immediately ignite in the post-war ruins."



 KYO_zhanzhengdongyuan:0 "The Creator of Gensokyo"
 KYO_zhanzhengdongyuan_desc:0 "Yakumo §0Yukari§!\n\n Creator of Gensokyo\n\n Will wield the power of gaps\n\n So all shall know:\n\n Gensokyo\n\n Is eternal."

 KYO_souguadijuncangku:0 "Best Laborer: Yakumo §BRan§!"
 KYO_souguadijuncangku_desc:0 "Yakumo §BRan§!\n\n Shikigami of Yakumo §0Yukari§!\n\n Will bring her unmatched intellect to bear\n\n So all Gensokyo shall know:\n\n Order\n\n Shall endure forever."

