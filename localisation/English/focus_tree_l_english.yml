  KYO_econmi_reform:"Economic Reboot"
 KYO_econmi_reform_desc:"Gensokyo's industrial base is alarmingly weak—blacksmith shops are scattered, workshops are isolated, and production levels remain extremely primitive. Such a fragile economy is simply insufficient to support the impending protracted war. We must launch a comprehensive economic overhaul: consolidate scattered resources, expand workshops, introduce Outside World technology, and mobilize the entire Gensokyo workforce for production. War requires a continuous supply of weapons, ammunition, equipment, and food, not a group of artisans who only make fireworks during festivals. This is not just about rebuilding the economy; it's the first step in igniting the entire industrial engine. When the roar of steel echoes through Gensokyo, this land will never be the same again."

 KYO_metro_system:"Metro Project"
 KYO_metro_system_desc:"In the Outside World, railways are the arteries of war; in Gensokyo, we will replace them with underground tunnels and spirit-powered trains, creating a metro network for this land. These metro lines will traverse various regions, from mountains and lakesides to bamboo forests and underground, each tunnel ensuring that weapons, food, and reinforcements reach the front lines in the shortest possible time. The dark underground environment will evade detection, and special spirit-powered tracks will ensure continued operation even during barrier fluctuations. When the roar of underground trains echoes throughout Gensokyo, logistics will no longer be a weakness, but an overwhelming advantage."

 kYO_upgrade_digging_tool:"Improving Excavation Equipment"
 kYO_upgrade_digging_tool_desc:"The metro project has been established, but relying solely on manual labor and spirit power is insufficient to construct large-scale underground routes in a short time. To make the transportation network operational before the full-scale outbreak of war, excavation efficiency must first be improved. Kappa will utilize their mechanical expertise to create new drilling rigs suitable for the confined underground environment; the brute force-wielding Youkai will penetrate the hardest rock layers; and forces familiar with the underground environment will guide construction teams to avoid the most dangerous faults and cavities. Once the new excavation equipment is fully operational, the underground transportation network will extend to every corner of Gensokyo at an unprecedented speed, ensuring our troops and supplies always outpace the enemy's reaction."

 KYO_build_up_station:"Establishment of New Stations"
 KYO_build_up_station_desc:"Trains winding their way underground cannot exist solely on tracks. For this transportation system to truly function, stable and efficient station hubs must be established at key points. These new stations will become the central hubs for the transfer of supplies, troops, and intelligence. Kappa will install transportation devices combining spiritual power and machinery within the stations to ensure trains can enter and exit rapidly; intelligence personnel and station staff will also establish dedicated relay points to ensure news, military orders, and dispatch commands spread along the lines in the shortest possible time. Externally, they are strategic nodes; internally, they are the backbone that truly unites Gensokyo. When the first train, laden with soldiers and supplies, departs the station, it signifies that Gensokyo's logistical network has entered a new era."

 KYO_station_from_another_world:"A Station from Another World"
 KYO_station_from_another_world_desc:"In a newly built underground station, a train that shouldn't exist slowly pulls in. When the doors open, there is no driver, no ordinary passengers, only two women dressed in completely different attire from the modern world. They identify themselves as Renko Usami and Maribel Hearn, claiming to come from another world and possessing an extraordinary understanding of boundaries, technology, and history. For most of Gensokyo's residents, such origins are both strange and dangerous. They refuse to elaborate on their identities, leaving only a vague and unsettling explanation—time and space are, after all, unreliable illusions. Regardless of the truth, these two visitors from another world have quietly entered Gensokyo's game."

 KYO_importing_new_system:"Introducing a New System"
 KYO_importing_new_system_desc:"While the initially planned underground transportation network was sufficient to meet basic transport needs, its limitations began to surface as the battle lines expanded and logistical pressures increased. The new era demands a new system. By introducing more efficient signal control, resource allocation, and automated dispatching schemes, we can deliver troops, weapons, and supplies to wherever they are needed in the shortest possible time. This is not merely a simple infrastructure upgrade, but a complete modernization of Gensokyo's transportation arteries. Once the new system is fully operational, any enemy relying on traditional logistical lines will appear slow and cumbersome in our presence."

 KYO_underground_treasure:"Underground Treasures"
 KYO_underground_treasure_desc:"Deep beneath Gensokyo lie dormant mineral veins and rare resources, untapped since ancient times. Those shimmering metallic ores and the strange crystals, rumored to exist only in tales of the supernatural, are like treasures slumbering for millennia, quietly awaiting their awakening. Today, the demands of war and industry compel us to turn our attention to this unexplored territory. The darkness and dangers beneath the earth are not the real challenge; the true challenge lies in establishing a stable extraction and transportation system within this complex environment. Once these resources are successfully controlled, Gensokyo will no longer be reliant on the limited output of the surface, but will be able to support future construction and warfare with the wealth beneath the earth."

 KYO_kappa_development_plan:"Kappa's Industrial Plan"
 KYO_kappa_development_plan_desc:"Kappa is renowned for its unparalleled mechanical technology and engineering prowess. This time, they have presented not a solitary invention, but a grand blueprint capable of reshaping Gensokyo's industrial structure. This plan encompasses basic factory construction, resource processing, military production, transportation, and infrastructure, integrating everything into a system for sustainable expansion. It is not a workshop, a railway, or a batch of firearms, but a complete, interconnected, and mutually supportive industrial framework. Once approved, this will be a milestone for Gensokyo's formal industrialization, truly connecting rear production with frontline needs for the first time."

 KYO_farming_med:"Crop Growth Agent"
 KYO_farming_med_desc:"Even Youkai cannot wage a protracted war without food. Gensokyo's farmland has always been limited in scale and yields have consistently been insufficient, with food shortages gradually becoming an unavoidable threat on the front lines.  Now, researchers and pharmaceutical engineers have proposed a new growth agent solution. It can significantly shorten crop maturity cycles, allowing rice, wheat, and potatoes to be harvested in a shorter time. The mechanism of action may be complex and difficult to understand, but the experimental results are sufficient to illustrate everything: the fields will produce repeatedly at a previously unimaginable speed.  With this technology, granaries will no longer be empty, and the food supply for a protracted war will finally be truly guaranteed."

 KYO_yuka_arrive:"Response from the Flower Field Master"
 KYO_yuka_arrive_desc:"Recent large-scale mining and agricultural experiments have unquestionably strengthened the war effort. New seams of ore have been opened, treated fields grow at an unnatural pace, and factories and stations continue to expand.\n\n At the other end of Gensokyo, however, someone has taken grave exception to these changes. Yuuka Kazami, the flower master, will not tolerate unchecked excavation, chemical residue, and industrial smoke stripping nature—and her flower fields—of their colour and fragrance.\n\n Her arrival is a reminder that industrialisation carries a price. If we continue along this path, we must decide whether Gensokyo's future belongs entirely to cold steel and smoke, or whether flowers and living soil will retain a place within it."

 KYO_underground_factory:"Underground Industrial Plan"
 KYO_underground_factory_desc:"Former Hell has long been the dwelling place of the forgotten, vengeful spirits, and subterranean youkai. To continue viewing this area merely as a place of exile would be a waste. The thermal energy, mineral resources, and vast space it possesses are ideal conditions for supporting heavy industry. The high-temperature environment provides a natural advantage for smelting, while the vast underground space and labor force are sufficient to support the establishment of large-scale factory clusters. When chimneys pierce the darkness underground, and factories and mines rise along the abyss, Former Hell will no longer be just a desolate place, but will become the true industrial heartland of Gensokyo."

 KYO_plan_for_nuke:"Underground Core Plan"
 KYO_plan_for_nuke_desc:"Deep within Former Hell lies an extremely rare and dangerous resource—uranium ore. For a long time, it has been regarded as an ominous stone bringing disaster, but in the eyes of war and industry, it may be a power capable of rewriting the rules.  If these resources can be combined with Gensokyo's existing technology, spiritual system, and underground research capabilities, it is possible to create an ultimate weapon far surpassing contemporary conventional weapons. This path is destined to be fraught with danger and controversy, but it also signifies an unprecedented strategic deterrent.  When the atomic fire is ignited deep underground, it will no longer be merely an industrial leap, but a harbinger of the end of war."

 KYO_plan_for_hotspring:"Underground Hot Spring Project"
 KYO_plan_for_hotspring_desc:"Deep within Former Hell lies not only curses, vengeful spirits, and ores, but also extremely pure and stable geothermal energy. If guided, these springs and heat flows can be transformed into hot springs, energy sources, and therapeutic facilities. Rather than letting the underground remain forever synonymous with darkness and exile, it's better to transform it into a completely new living area. Youkai and residents can recuperate, live, heal their wounds, and even re-establish their connection with the surface, turning this land from a symbol of fear into a place of prosperity and tranquility. When the steam from geothermal energy replaces the dust of the mines, Former Hell will return to Gensokyo in a new guise."

 KYO_Satori_thank_you:"Thanks from Komeiji"
 KYO_Satori_thank_you_desc:"Whether through the atomic fire kindled underground or the hot springs opened to the surface, Former Hell's fate has been rewritten. The depths, forgotten for years and regarded only as an abyss, have at last been offered a different future.\n\n Satori Komeiji has expressed her gratitude for this development. To her and the underground youkai, it means more than additional resources, factories, or facilities: those cast into the shadows have finally been included in Gensokyo's future.\n\n In return, the underground powers will support our cause more actively. From this day forward, the depths will no longer be an abyss to exploit, but a vital force advancing alongside the surface."

 KYO_kappa_advance_plan:"Kappa Industrial Plan Upgrade"
 KYO_kappa_advance_plan_desc:"A grand industrial blueprint should not remain at the foundational stage. Kappa's initial plan merely laid the groundwork for Gensokyo's industrialization; now, it's time to propel this system into true high-speed operation. By introducing automated production systems, improving raw material refining efficiency, and optimizing transportation nodes and military production lines, we will transform previously fragmented construction achievements into a truly sustainable and scalable industrial network. This will not only increase the production of weapons and equipment but also accelerate infrastructure construction across the board, allowing Kappa's mechanical civilization to truly permeate every artery of Gensokyo."

 KYO_kappa_ultimate_plan:"The Ultimate Kappa Industrial Project"
 KYO_kappa_ultimate_plan_desc:"Years of construction, expansion, and renovation have finally come to an end. Factories, steel mills, military facilities, and transportation lines have all been integrated into the same system, supporting each other and circulating independently, forming a vast and self-sufficient industrial network.  Kappa has refined this system to its ultimate perfection: production efficiency is astonishingly high, resource allocation is seamless, and virtually no waste is left. This is no longer just a few construction achievements, but a complete industrial civilization capable of supporting both war and the economy.  From this moment on, Gensokyo not only meets its own needs but also possesses the ability to direct surplus resources to more distant goals."

 KYO_great_industry:"The Great Industry"
 KYO_great_industry_desc:"In ordinary endeavors, what diligence can achieve, genius can also accomplish; and diligence often accomplishes what even genius finds difficult to achieve. Industry is precisely this kind of field. It doesn't rely on fleeting inspiration, but on countless repetitions, the collaboration of countless people, and the ceaseless roar of countless days and nights. Factories, mines, railways, military outposts, and granaries, through this almost monotonous, continuous progress, become the backbone supporting an era. When great industry is truly established, Gensokyo will no longer be just a place living on legend, but a place capable of changing the world through its own power."

 

 
 KYO_use_outworld_mechine:0 "Introducing Machinery from Outside World"
 KYO_use_outworld_mechine_desc:0 "Machine tools, measuring instruments, and process drawings from Outside World are being transported to Gensokyo in batches through trade routes operated by Kappa. Tengu is responsible for arranging the routes and concealing the destination of the goods, while Kappa inspects, disassembles, and reassembles the goods upon arrival.\n\n The willingness of Outside World merchants to sell this equipment is not necessarily out of shortsightedness or betrayal. For them, this was merely a lucrative order with an ambiguous buyer identity; for us, however, each crate held the potential to bridge decades of industrial gaps.\n\n We will not forever rely on imports. New technical workshops will be responsible for surveying parts, translating blueprints, and standardizing specifications, gradually transforming these unfamiliar machines into production tools that Gensokyo can repair, replicate, and even improve."

 KYO_hello_human:0 "Incorporating Humanity into Production"
 KYO_hello_human_desc:0 "War has brought a large number of humans into our sphere of influence. To restore mines, roads, and factories, it is impossible to continue treating them as ordinary residents unrelated to the regime.\n\n All eligible individuals will undergo occupational and skills registration and be deployed to workshops, mines, transport teams, and construction units according to local needs. Those conscripted will receive food, wages, lodging, and basic medical care, but during mobilization, they may not leave their posts or refuse assignment.\n\n The government refers to this as wartime labor, while humans have a more direct understanding: they have been incorporated into an order they did not participate in creating and from which it is difficult to exit."

 KYO_give_me_that:0 "Takeover of Human Industries"
 KYO_give_me_that_desc:0 "Mines, factories, and transportation facilities still under private control are hindering unified management. Hoarding, production stoppages, and speculation are not only driving up prices but also preventing the front lines from receiving a stable supply.\n\n We will issue a wartime takeover order, bringing key enterprises under the supervision of the Youkai regime. Original owners may retain limited profits or continue to operate, but equipment, inventory, and production direction must comply with unified arrangements. Those who refuse takeover will have their assets directly confiscated.\n\n The law still recognizes those old contracts, but no longer recognizes them as being superior to the war and the survival of Gensokyo."

 KYO_my_properties:0 "Asset Inventory and Takeover"
 KYO_my_properties_desc:0 "Without accurate data, a takeover order will ultimately remain just a stamped document. We must know what each workshop can produce, how much material each warehouse stores, and which equipment is still operational. kappa will be responsible for equipment assessment and technical classification, tengu will be responsible for verifying the flow of goods, and human staff will continue to organize accounts and debts. Those who conceal inventory, transfer machinery, or falsify records will lose their remaining operational rights.\n\n After the inventory is completed, private property will not completely disappear, but will be rewritten into calculable, requisitionable, and redistributable production capacity."

 KYO_under_new_mangement:0 "Unified Management System"
 KYO_under_new_mangement_desc:0 "The old signboard is removed, and a new one is hung above the door. It may seem like just a name change, but the actual changes are in the accounts, procurement, personnel, and production instructions.\n\n All acquired enterprises will adopt a unified financial format, parts specifications, and inventory system. Kappa will be responsible for machinery maintenance and process improvement, Tengu will be responsible for auditing delivery status, and the original owners and skilled craftsmen will continue to serve as appointed managers.\n\n These units will still sell goods, pay salaries, and retain their respective skills; however, they are no longer businesses that can decide their own direction, but rather part of the overall industrial system."

 KYO_steal_is_that_so:0 "This is merely “borrowing”"
 KYO_steal_is_that_so_desc:0 "Everything needed for industrialization cannot be obtained solely through open trade. Some precision equipment is regulated, some blueprints are never sold, and some technologies exist only in the archives of a few factories.\n\n Therefore, we will allow specialists to acquire the necessary resources through acquisition, imitation, clandestine transfer, and temporary requisition. Some items will be paid for, some will only leave a receipt promising future return, and some will never have the original owner's consent in the first place.\n\n Official documents will refer to these actions as borrowing, transfer, or emergency safekeeping. What the person who lost the equipment is called does not affect the restart of the machinery in Gensokyo."

 KYO_german_is_good:0 "German-style Industrial Mobilization"
 KYO_german_is_good_desc:0 "Germany's recent military expansion demonstrates a highly centralized industrial organization: standardized specifications, specialization, planned quotas, and the ability to quickly convert Civilian Factories into military production.\n\n We will study these management methods, establish coordination mechanisms from raw materials and parts to final delivery, and strengthen maintenance, replacement, and production capacity statistics. What we need is its organizational capacity, not simply copying the political creed of Outside World.\n\n This system, while capable of rapidly concentrating resources, can also easily suppress civilian production and make the entire economy overly reliant on central commands. If a misjudgment is made, all factories may simultaneously head in the wrong direction."

 KYO_america_is_good:0 "American-style mass production"
 KYO_america_is_good_desc:0 "American industry's strength lies not only in the number of its factories, but in assembly lines, interchangeable parts, quality control, and supply networks spanning whole regions. Once specifications are standardized, even complex products can be divided into simple operations repeated at scale.\n\n We will redesign factory floors, introduce material-coding and warehouse systems, and enable separate workshops to produce mutually compatible parts. Kappa technology will no longer remain the private art of a few craftspeople; it will become a manufacturing standard that can be replicated everywhere.\n\n This path demands reliable transport, long-term investment, and vast quantities of raw materials. Once the system matures, however, Gensokyo can overcome its late industrial start through a scale that continues to grow."

 KYO_great_deal:0 "A Good Deal on Paper"
 KYO_great_deal_desc:0 "Directly seizing equipment easily provokes resistance, while a signed agreement can often cloak the same transfer in legality.\n\n We will use orders, debts, security guarantees, and market access as bargaining chips to force local companies to accept long-term supply, equipment transfer, and resource priority. The negotiations appear to be conducted voluntarily by both parties, but the room for refusal differs between them.\n\n These agreements are favorable to us not because they are fair, but because the risks, shortages, and liabilities for breach of contract are almost entirely left to the other party."

 KYO_human_slave:0 "Forced Labor System"
 KYO_human_slave_desc:0 "Temporary requisitions cannot provide a growing industrial system with a stable workforce. Wartime measures will become permanent institutions, linking occupational assignments, residence permits, and public rations.\n\n Human labourers will be assigned according to skill and physical capacity to mines, factories, transport units, and construction crews. They will receive prescribed wages, food, medical care, and leave. They will not, however, be free to choose where they work, and unauthorized resignation or relocation will be punished.\n\n The law will not call them slaves. Yet when every necessity of life depends on obeying one's assignment, little remains of any meaningful choice. Industry gains a dependable workforce; humans steadily become second-class residents of the state."

 KYO_work_to_die:0 "The Production Lines Must Never Stop"
 KYO_work_to_die_desc:0 "War doesn't wait for workers to recover. Safety checks, leave, and equipment maintenance all give way to output; all units must meet ever-increasing production targets within deadlines.\n\n Working hours will be extended, the injured will return to their posts after simple treatment, and accidents will only be recorded as production delays that need to be resolved as soon as possible. No order will directly demand that someone die, but the entire system has assumed that someone will always fall before the machines stop.\n\n As long as the numbers on the reports are still increasing, those in charge of production will not proactively question how those vacancies appeared."

 KYO_eight_hour_work_time:0 "Double 8-hour work system"
 KYO_eight_hour_work_time_desc:0 "Unrestrained consumption of labor will only lead to absenteeism, accidents, and production collapse. What we need is not short-lived, frenzied growth, but a high-intensity system that can operate sustainably.\n\n Each worker will work two eight-hour shifts per day, with breaks for meals, changing clothes, and simple checks. The hours are still long, but fixed rotations and minimal rest reduce chaos and keep equipment and personnel in a more stable state.\n\n This is not out of leniency, but rather management finally acknowledging that workers who can still work are more valuable than those who collapse quickly."

 KYO_miracle_industry:0 "The Youkai Industrial Miracle"
 KYO_miracle_industry_desc:0 "New railways cut through the valleys. Machine tools run all day in expanded factories. Steel, components, and military supplies now move across the country in quantities once unimaginable. At last, Gensokyo possesses an industrial base capable of sustaining modern war.\n\n The authorities credit kappa technology, centralized management, and efficient mobilization. None of that is false, but it deliberately omits the other half of the story: punishing hours, restrictions on movement, and human labourers compelled to obey production assignments.\n\n The industrial miracle is real. The people who created it and the people who enjoy its rewards are simply not the same."

 KYO_work_for_youkai:0 "Serving the community"
 KYO_work_for_youkai_desc:0 "Wartime labor will no longer be seen as a short-term measure, but will become a fundamental structure of the new society. Food, housing, education, and healthcare will all be distributed through workplaces, and it will become increasingly difficult for humans to escape their assigned roles throughout their lives.\n\n Youkai will be responsible for decision-making, technology, and management, while humans will undertake most of the mining, transportation, and basic labor. Those who obey will have a stable life, and those who perform well may receive limited promotions, but they will not be able to equally determine the direction of the nation.\n\n The official explanation for this relationship is interdependence: Youkai provides protection and order, while humans maintain production and supply. However, when this division of labor can be passed down from parents to children, it is no longer just a job, but an inherited identity."

 KYO_morden_youkai:0 "Modern Youkai's Ideal Country"
 KYO_morden_youkai_desc:0 "Electric lights illuminated the streets of Youkai, and new hospitals, schools, newspapers, and workshops were established. Youkai, who once survived on legend and fear, now possessed stable food supplies, modern industry, and a nation capable of protecting itself.\n\n Humans, too, gained basic security, rations, and healthcare, yet remained at the bottom of the production system. Overt violence decreased, replaced by work permits, salary grades, migration restrictions, and ubiquitous administrative scrutiny. Obedience no longer needed daily emphasis; it was ingrained in every aspect of life.\n\n The regime considered full granaries and stable streets proof of successful coexistence. However, when one side sets the rules and the other can only bear the assigned responsibilities, is this truly communal living, or an ideal state open only to Youkai?"










 








 












































#KYO_after_war_reform:0 "战后的盘点"
#KYO_after_war_reform_desc:0 "日本列岛仍在硝烟与妖力残响中颤抖。军报、战死名册与赔偿请求堆满帝国#议会的地板——这是胜利后第一份工作：算清战争留下的每一笔伤痕。\n\n八云紫、蓝与橙将重新盘点兵力、粮秣#与占领区秩序，决定哪些军团解编、哪些军阀收编，以及对人里与各地人类社群画出最低保护线。只有先把这些#整理清楚，之后的妖怪政权才有站稳脚跟的可能。"
#
#KYO_reform_the_system:0 "体制系统的调整"
#KYO_reform_the_system_desc:0 "战时的「妖怪联合体」是为突破结界、横扫日本而打造的临时工具：权力#集中在少数贤者与军事指挥部，地方妖怪与人类自治几乎被冻结。\n\n如今战争结束，过度军事化与高度集权正#开始拉开新的裂缝——军阀要求战功分配，人类要求最低的自治保障，宗教势力与既得利益者也在观望。若不将这#套体制拆解、调整为可以长期运作的政权架构，下一场动乱只会在更脆弱的地基上爆发。"
#
#KYO_reform_the_barrier:0 "重修大结界"
#KYO_reform_the_barrier_desc:0 "博丽大结界的裂纹在夜里呼吸，宛如一头尚未被驯服的巨兽。外界的残余#意志、怨灵与军事侦察，沿著那些细小的缺口渗入日本列岛的每一处角落。\n\n八云紫将以「间隙」重新校准边#界，把原本守护幻想乡的结界扩展、缝合，覆盖整个日本。然而，战争与大量异常生灵的涌入，令新的结界极度#不稳：短期内可能引发妖力紊乱、结界失灵与奇异灾变，长期却是换来一片可控的疆域与封闭外界干涉的屏障。#"
#
#KYO_kill_the_rebel:0 "剿灭叛乱"
#KYO_kill_the_rebel_desc:0 "胜利不代表一切臣服。各地残余的人类抵抗组织、失势的妖怪军头与不满新秩#序的宗教团体，正在暗处试探新政权的底线。\n\n紫的命令很简单：叛乱如风中火星，必须在燎原前掐灭。先礼#后兵——招抚、分化、斩首三步并行；能谈的谈，该砍的砍，让所有人明白「谈判」只属于愿意收手的一方。只#是，越是彻底地清洗，越会有人把仇恨记在心里，等待下一次报复的机会。"
#
#KYO_make_youkai_warlord_surrender:0 "迫令妖将归顺"
#KYO_make_youkai_warlord_surrender_desc:0 "在突破结界、攻占日本的过程中，许多妖怪首领以半独立军#团的形式作战，他们握有自己的部队、补给线与统治区域，战后自然不愿轻易交出。\n\n要建立稳定政权，军队#必须从「谁的私兵」转为「谁的国军」。编制重整、裁军与收编将一并推进——红魔馆的蕾米莉亚与其他妖将不会#心甘情愿，谈判桌与军事演习场都将成为新一轮角力的舞台。"
#
#KYO_all_bow_yukari:0 "跟随或毁灭"
# KYO_all_bow_yukari_desc:0 "在突破博丽大结界、横扫日本列岛的每一个夜晚，所有妖怪都亲眼见识过那个站在「间隙」上的女人——她只需轻轻一拨，边界、国境与生死便如纸张般翻面。战争结束之后，问题不再是谁赢了，而是由谁来承受这个新世界的重量。\n\n八云紫没有打算与任何人分享权柄。愿意跟随者，将在她的庇护之下获得名分与秩序；选择犹豫或反对者，等待他们的只有从这片版图上被抹除。对妖怪也好、人类也罢，未来只剩两条路——站到她身边，或在她收拢结界时一同消失。"
#
#KYO_future_start:0 "给予旧结界的最后仪式"
#KYO_future_start_desc:0 ""


  KYO_war_never_change:0 "War has never changed"
  KYO_war_never_change_desc:0 "§RThe flames of war have been ignited; no one can remain uninvolved.§!\n War, war never changes.\n\n As long as there is territory and stance, as long as there is fear and resentment between humans and youkai, steel and youkai power will once again etch cracks into the earth. The victors write history, the vanquished become legends; what remains constant is that everyone will eventually be drawn in—it's just a matter of sooner or later, in what order."

  KYO_make_sure_beast_support:0 "Signed a non-aggression pact with Animal Realm"
  KYO_make_sure_beast_support_desc:0 "Animal Realm only recognizes the strong and contracts; there are no “friends,” only “prey” and “temporary allies.” The beasts there smell blood and power, and their judgment of the situation is far faster than that of the humans of the Outside World.\n\n As long as we can ensure they don't side with either side, and even secretly restrain other competitors for us, this war won't gain another enemy emerging from the depths of Hell. The price to pay is a generous contract and recognition of their right to an “independent hunting ground.”"

  KYO_make_sure_kappa_support:0 "Secure Kappa Industrial Support"
  KYO_make_sure_kappa_support_desc:0 "Water vapor and gears hummed along the riverbank, while steel skeletons took shape deep within the caves. Kappa's factories weren't in the cities on the map, but hidden in streams, mountains, and secret docks, giving Gensokyo its first industrial capabilities resembling those of the Outside World.\n\n Trading contracts, patents, and river passage rights for Kappa's engineering teams, weapon modifications, and supply networks was essential for sustaining the protracted war. As long as this waterway remained open, our army wouldn't fall due to running out of ammunition and supplies."

  KYO_make_sure_ghost_support:0 "Ensuring order in the Netherworld"
  KYO_make_sure_ghost_support_desc:0 "The snow-covered gardens of Hakugyokurou lie silent; at the sound of bell and drum, ten thousand spirits gather. Here the boundary between living and dead is thinnest—and here, more than anywhere else, the system cannot be allowed to fail.\n\n If the Netherworld falls into chaos, the dead will run wild, judgment will cease, and the resentful spirits of those killed in battle will have nowhere to go. In time they will turn back to consume the world of the living. By then, victory in the civil war will mean nothing. Japan and Gensokyo alike will be dragged into an abyss of shadow."

  KYO_make_sure_tengu_support:0 "Secure Tengu Air Support"
  KYO_make_sure_tengu_support_desc:0 "Youkai Mountain's editorials can sway public opinion, while Eagle Wing's scouts can determine the course of battle. Tengu controls the skies, the wind, and the intelligence network; if their newspapers and reconnaissance turn in favor of the enemy, we will be blinded in both public opinion and tactics.\n\n Securing Tengu's support means we can control the air and the flow of information: ensuring our troops are on the right battlefield at the right time, and magnifying the enemy's mistakes for everyone to see. As long as the skies belong to us, ground battles will not be a mere gamble."

  KYO_make_sure_fairy_support:0 "Let the Fairy support us"
  KYO_make_sure_fairy_support_desc:0 "Fairy is a fragment of nature, an embodiment of seasons, climate, and emotions. Numerous, single-minded, impulsive, and naive, they appear fragile and clumsy—yet possess bodies capable of almost infinite resurrection.\n\n Given enough joy and benefits, fairies will surge forward like a tide, disrupting the enemy's vision, filling gaps in our formations, and even rising again nonchalantly after defeat. Ultimately, they don't care who the leader is, only which side is more fun—and our task is to make them feel that following us is the least boring thing."

  KYO_make_sure_oni_support:0 "Greetings to the Oni Clan Leader"
  KYO_make_sure_oni_support_desc:0 "The oni in the mountains still remember the battles of ancient times: Shuten-dōji, Hoshiguma-dōji, Ibaraki-dōji—once those names stood on the front lines, the enemy army would be crushed by their sheer force. Oni hate lies, but they respect the strong who face battle head-on.\n\n If a sufficiently generous reward and frank alliance can be offered to entice the Oni to join the fight, the enemy will experience firsthand what it means to “retreat without a fight” on the front lines—not that they don't want to fight, but their legs will tremble at the mere sight of those figures."

  KYO_make_sure_eientei_support:0 "Obtaining supplies from the neutral Eientei"
  KYO_make_sure_eientei_support_desc:0 "The Eientei are accustomed to observing from the sidelines, locking themselves in the bamboo labyrinth. Eirin Yagokoro no longer wishes to personally intervene in the power struggle in Gensokyo, but she still firmly controls medicine, medical care, and special supply lines.\n\n As long as the reward is sufficient and the conditions are detailed enough, she will ensure our soldiers have medicine and ammunition available even in the worst-case scenario, without revealing herself or making any statements. Whoever controls the Eientei's supplies can sustain their army for several more rounds of attack and defense."

  KYO_last_chance_of_victory:0 "Now or Forever"
  KYO_last_chance_of_victory_desc:0 "Animal Realm's neutrality, Kappa's factories, the Oni's prestige, the order of the Netherworld, Tengu's skies, Fairy's tides, and Eientei's cold, meticulous supplies—piece by piece, they've been pieced back to our side. Almost all the forces we can win over are in place, and all the factions we can persuade have stated their positions.\n\n The battle to come has no “preparation phase” to rewind and start over. This is a battle for us to rise up, to dominate, or to be written into the history of the losers. If we hesitate now, our fate will be decided by others; if we go all out now, victory or defeat, it will set a new trajectory for Gensokyo and Japan—either now, or we lose our chance forever."


 KYO_remilia_start:"Remilia's Blood Empire"
 KYO_remilia_start_desc:""




 KYO_remi_aftermath:"Red Dawn"
 KYO_remi_aftermath_desc:"Red mist, like a layer of damp, cold silk, covered the sky. The lights in the houses were tinged with a dark red, and the shadows behind the window paper shrank into a ball—not because they saw anything, but because they knew “someone was watching.”\n\n When Remilia ascended the throne, there were no cheers. Only the soft clinking of cutlery and armor buckles, like a group of people deliberately tightening their throats. She didn't need applause either. What she wanted was for everyone's first thought upon waking to be her name.\n\n She remembered fifteenth-century Europe. The church bells and the pens of academies propelled the world forward, gunpowder, gears, and the smoke from workshops scraped away youkai as though they were stains left by an older age. It wasn't a war, but a new set of rules that squeezed you out of history—even anger seemed outdated.\n\n So she no longer accepted hiding in legends. Legends would be forgotten; systems wouldn't. She wanted fear to grow beyond boundaries, to grow into documents, to grow into factory chimneys, becoming a daily necessity to obey.\n\n Remilia would issue a command, summoning all those under her rule to"

 KYO_sakuya_intro:"Head Maid Sakuya Izayoi"
 KYO_sakuya_intro_desc:"A fingerprint was just reflected on the mirror, then wiped away in the next instant. The dust didn't even have time to settle before it was visible—not that it didn't exist, but that Sakuya wouldn't allow it to remain. Where she walked, the air seemed to be calibrated: table corners aligned, candlelight at uniform height, the folds of curtains pressed to the same scale. Any deviation was like a needle piercing her eye.\n\n She held the tray steadily, but her knuckles were white. She wouldn't allow herself to tremble—not because she was afraid of making a mistake, but because she knew what “making a mistake” meant in this city: not making a mistake, but being replaced.\n\n Her perfection wasn't a habit, it was a defense. Every time she polished the silverware until it reflected light, she was giving herself orders: cleaner, more accurate, faster. She could hear the subtle sounds deep in the corridor: the friction of armor buckles, hushed conversations, the slight click of doors. They were like the second hand of a countdown, reminding her—if anything went wrong, the master's gaze would turn to someone else.\n\n Her face always wore a polite calm. Even when the tension in her heart made her breath painful, she only allowed herself to utter the shortest, cleanest words.\n “Ready.”\n\n Only she knew how much swallowed emotion was hidden behind those words.\n She wouldn't allow weariness to surface, wouldn't allow grievances to become words, and wouldn't allow any “good enough” to appear in her hands. She would return to the hall alone after everyone had left, pushing back the chair that someone had bumped, straightening the edges of the carpet, and even resetting the angle of the doorknob to the position she remembered. Time in her hands wasn't a miracle, but a tool.\n\n With a flash of her blade, she could slice an instant into smaller fragments, suppressing a mistake before it even happened, making it disappear as if it had never existed. She decomposed, rearranged, and locked down each step until only one possibility remained: perfection. Because she knew too well.\n\n This Scarlet Devil Mansion wasn't lacking in loyalty, nor was it lacking in people capable of killing. She could stand here because she could present the world her master desired—clean, precise, and without any hesitation. She didn't seek to be understood.\n\n She only prayed not to be left behind.\n So Sakuya organized everything flawlessly—even her own heartbeat felt like it had been brought back to a steady rhythm by her own hand."

  KYO_sakuya_prefect:"The Perfect and Elegant Maid"
 KYO_sakuya_prefect_desc:"Scarlet Devil Mansion's daily life wasn't life itself, but a high-pressure operating system: banquets, ledgers, security, supplies, visitor lists, corridor patrols, kitchen access, shift changes—if anyone slowed down even a fraction, the entire mansion would begin to spiral out of control.\n\n Sakuya Izayoi was responsible for turning the master's “elegance” into executable procedures: seating arrangements were signals, the order of drinks was control, and shift changes were defenses. She didn't need to raise her voice; just a simple “Let's start over” was enough for everyone to understand the protocol.\n\n She maintained everything with near-obsessive precision, because here, for humanity to survive, only results mattered."

 KYO_sakuya_must_prefect:"Forced cessation of Sakuya's work"
 KYO_sakuya_must_prefect_desc:"The corridors of Scarlet Devil Mansion were always spotless, as if no one had ever walked there. But that night, Sakuya's footsteps skipped a beat. Very light, almost imperceptible—yet she heard it clearly.\n\n She folded the ledgers, returned the seal to its fixed angle, and polished the silverware until it reflected the shape of the candlelight. Her fingers ached from tension, but she wouldn't stop. She wouldn't allow any gaps, because gaps would become mistakes; mistakes would become excuses; excuses would become abandonment. “Enough.” Remilia's voice fell from the throne, not loud, but like the back of a knife striking a table. Sakuya stopped immediately, her movements crisp and almost stiff, as if a switch had been flipped. “Put those things down.” Remilia didn't even look up, only tapping the armrest lightly with her fingertips, as if handling a trivial chore. “Go back to your room and rest. Now.”\n\n The command was simple, the tone casual—and it was precisely this casualness that made it all the more suffocating.\n\n Sakuya's throat felt constricted. She wanted to reply “yes,” but found no sound. She stood there, back straight, her knuckles white from the effort. She frantically searched her mind: Which page of the ledger was missing? Which maid's shift was wrong? Had the seating arrangement at the banquet offended a certain guest? The temperature of the wine? The handover of the gate?\n\n The patrol of the corridor?\n She couldn't find the answers.\n\n The inability to find them was even more terrifying. Remilia finally raised her gaze, her eyes like those of someone looking at a machine that had been in use for too long.\n\n “I said, rest.” No concern, no questions.\n\n She didn't even notice the fleeting crack in Sakuya's eyes.\n Sakuya bowed her head, her manners impeccable. “Yes, Miss.” She turned and left, her steps still precise. But the moment she stepped out of the hall, a heavy weight pressed on her chest. She held her breath, afraid to make any sound she shouldn't, afraid that it would make the order worse. The corridor was long, the candlelight steady.\n\n Every beam of light was placed according to plan, every painting was perfectly aligned. These were all her achievements, all of which should have put her at ease. But they weren't.\n\n She began to doubt: was she “not enough”?\n Not the kind of inadequacy that comes from making mistakes, but rather that her master had grown tired of her, found her superfluous, and felt a more convenient tool was needed. The more bland Remilia's commands were, the more they sounded like a verdict—stop, because you are no longer important.\n\n Back in her room, she meticulously put away her gloves, hung her coat at the same angle, and even aligned the toes of her shoes with the edge of the bed. She sat down, but immediately stood up again. Her body was trained to be “ready at all times,” and sitting down felt like committing a crime.\n\n She looked at herself in the mirror: her expression was upright, her hair was neat, and her uniform was wrinkle-free.\n\n Everything seemed normal.\n\n But she knew she wasn't normal. She began to replay every second before the throne: the rhythm of Remilia tapping the armrest, the angle at which the word “enough” fell, the timing of her gaze lifting. She was dissecting a verdict, trying to dig out the reason.\n\n There was only one possible reason.\n\n She had disappointed her master.\n She dared not ask. Asking would be tantamount to admitting her flaw; admitting flaw would be tantamount to handing over the hilt of the sword. She could only force herself back to a “usable” state with even stricter standards—even though her master had ordered her to stop.\n\n So she sat on the edge of the bed, back straight, hands on her knees, motionless.\n\n Rest felt like a form of torture. She waited silently for the next order, for being called back, for proving she was still worthy.\n\n The candle burned halfway down, the room still impeccably clean, almost coldly so.\n And Sakuya's heart began to sink, little by little."

 KYO_sakuya_do_not_harsh:"Cherish us, Sakuya"
 KYO_sakuya_do_not_harsh_desc:"Scarlet Devil Mansion rarely did anything “unnecessary.” Efficiency, standards, and who should stand where—all mattered here. But that day, the standards were quietly changed.\n\n From early morning, the corridor was eerily quiet. The maids bowed as usual, but deliberately avoided Sakuya's gaze; the kitchen door opened and closed even more gently, as if afraid of disturbing some machine about to explode. Patchouli handed Koakuma a list, the handwriting so clean it sounded like an order—ingredients, time, seating, candlelight height, everything was meticulously planned; Koakuma ran quickly with the tray, yet unusually quietly.\n\n Meiling stood guard at the door, her posture more upright than usual. She wasn't guarding outsiders, but guarding “tonight.” She would stop any potential leaks, and she would also stop Sakuya from going to work—if Sakuya took a step closer, Meiling would push her back with an uncompromising look.\n\n Sakuya noticed nothing, or rather, she didn't allow herself to notice. She still patrolled regularly, still checked the reflection of the silverware, still brought every angle back to its original position. She calmed her heartbeat, suppressed her questions, because she thought she was being observed, being evaluated.\n\n In the evening, Remilia summoned her to the banquet hall with a single sentence.\n's tone was as casual as ever, yet it carried the weight of a command. “Head Maid, be on time.”\n\n Sakuya replied, “Yes, ma'am,” without asking further questions. She simply straightened her uniform once more, pulled her gloves to the perfect position, and cut each breath into the cleanest rhythm. As she pushed open the banquet hall doors, only one thought occupied her mind: she couldn't afford to make a mistake tonight.\n\n The light behind the door was brighter than she had expected. The candles were neatly arranged, but not the kind of “working” lighting she usually provided; the fragrance was stronger, but not the standard formula for entertaining distinguished guests; the tableware was excessively shiny, as if someone had deliberately polished them to the point of being blinding.\n\n The entire Scarlet Devil Mansion seemed to be governed by a different set of rules.\n\n But those rules weren't about efficiency.\n\n The target was her. Sakuya stood at the door, her first reaction not one of gratitude. It was wariness. Her fingers tightened slightly, her gaze instinctively sweeping across every corner, as if searching for an ambush. She didn't understand why everyone was here, why she had been summoned without any instructions. The worst possible answer began to surface in her mind: had she done something wrong, so they were ending her in a “dignified” way?\n\n Before she could speak, the silence in the banquet hall seemed to be abruptly cut off.\n\n Someone gasped. Someone suppressed a laugh.\n\n Someone was gradually enveloping her in an unfamiliar setting. At the other end of the throne, Remilia raised her chin, as if announcing something taken for granted.\n\n “You don't have to work tonight.”\n As those words fell, Sakuya's stomach tightened. She suddenly didn't know how to stand, how to breathe.\n\n Because for her— Not working was never a reward.\n It was the unknown."

 KYO_sakuya_will_not_die:"Sakuya was always the perfect maid"
 KYO_sakuya_will_not_die_desc:"Sakuya polished the silverware until it reflected candlelight, even her breathing seemed precisely measured. She stood there, her back too straight, but her eyes were constantly scanning—the entrance, the shadows, the corners of the corridor.\n\n She thought she was working, but she was actually protecting herself. Remilia sat high up, watching, the red wine in her glass swirling slightly. She didn't tell her to stop, nor did she remind her to relax. She simply suddenly remembered the American West Coast from long ago: the damp sea breeze, the streetlights in the fog, the child clutching a broken knife in the alley behind the church.\n\n That child didn't cry, but stared at the world with a prematurely mature wariness, as if ready to use her last breath to find another way. When Remilia approached her back then, it wasn't out of kindness. She simply loathed waste, loathed leaving usable things to rot on street corners.\n\n And now, watching Sakuya push herself to the limit, she suddenly understood that the same thing was still happening: she wasn't pursuing perfection; she was afraid of being discarded again.\n\n Scarlet Devil Mansion needed order, but Remilia didn't need a head maid who wore herself down. She set down her glass, her gaze as cold as a pause before a command is given—it's time to pull that past from the shadows, Sakuya, you are my perfect pawn."

 KYO_sakuya_best_maid:"Elegantly completing the internal purge."
 KYO_sakuya_best_maid_desc:"The gunfire didn't stop after the civil war ended. “Another batch.” Hong Meiling placed a rain-soaked report on the table, her voice low. “The supply line was cut twice, and three patrols are missing. There are also words hanging on the trees outside the city—saying our throne was stolen.” Sakuya didn't look at the paper immediately.\n\n She first turned her teacup upright, making sure the handle was pointing in the same direction, before unfolding the report. “Who?” she asked. “Those grassroots guys,” Meiling frowned. “Sekibanki, Kagerou Imaizumi, Wakasagihime, and a few other nobodies I can't name. They're rude, they talk like they've been slapped in the face.”\n\n Sakuya turned to the last page, her gaze lingering on a name. “Seija Kijin,” she murmured softly.\n\n Meiling nodded, as if acknowledging a thorn. “She doesn't show herself, she just lets people bite. They bite once and then pull back. Even if the outcome is decided, this resistance won't stop.”\n\n Sakuya closed the report, tapping her fingertip on the cover.\n\n “Grassroots are convenient,” she said.\n\n Meiling paused, taken aback. “They're few in number, but bold, and have many openings,” Sakuya said, her voice flat as a knife's edge. “They're also the best point of attack. Find them, and we can follow the trail to pull Seija out.”\n\n “But they're just...”\n\n Meiling trailed off. Sakuya continued, without emphasizing her words. “They just can't survive, so they bite.”\n\n There was no sympathy in her words, but a fleeting weariness lurked between the lines. She stood up and fastened her gloves. “I'll handle it.”\n\n—On the riverbank in the rainy night, Wakasagihime pulled her cloak down, moisture clinging to her eyelashes.\n\n “You noble castles really know how to play games.” She chuckled softly to her companion, “After the fighting, you say the world is at peace, but we're still starving.”\n\n Kagerou Imaizumi flicked her wet fur aside, her voice rough and direct.\n “Stop talking nonsense. Move that box of ammunition, bomb another section of the road tomorrow.\n\n Let them know that “order” isn't just empty words.”\n Sekibanki crossed her arms, her head slightly tilted, as if listening to something in the distance. “I hate that fake smile. Saying we have a place too—where is that place? On the roster?\n\n Under their table?” Wakasagihime scoffed. “At least Lady Seija is right: fight if you're not happy. Even if you can't win, you'll make them sleep soundly.”\n\n Kagerou gritted her teeth. “Yes. Even if we're small, we'll make them bleed.”\n\n Sekibanki suddenly stopped. “...\n\n Someone's coming.” Amidst the rain, an unusually orderly footstep appeared.\n\n Sakuya emerged from the shadows of the trees, umbrella unopened, yet the raindrops seemed to deliberately avoid her shoulders. Her skirt was incongruously clean, as if she were using the muddy ground as a carpet.\n\n Kagerou immediately drew her sword, her voice filled with anger. “Hey! Scarlet Devil Mansion lackeys!”\n Wakasagihime took a half-step back, still defiant. “Didn't you win? Not enough? You want to wipe us out too?”\n\n Sekibanki raised her chin, her tone even more barbed than theirs. “Come to arrest us? Just you alone?”\n\n Sakuya looked at them, without smiling. “You shouldn't be on that list anymore,” she said.\n\n Kagerou roared and charged forward.\n\n At that moment, the world seemed to be held down.\n\n Raindrops stopped in mid-air, the flash of a blade halted mid-journey, and the ripples on the river seemed frozen. Only Sakuya could still move. She waded through the mud, her shoes clean, as if walking through a banquet hall.\n\n She stopped in front of Kagerou, her gaze falling on her hate-filled eyes. “Your hatred is real,” she whispered, “That's why it's troublesome.”\n\n She raised her hand. The silver throwing knives landed one by one, like sentences written in the air. She didn't let the knives pierce flesh and blood; she only let them precisely cut off weapons, cut off escape routes, and cut off the rhythm of breathing.\n\n When time returned, Kagerou knelt on the ground, the knife falling into the mud with a dull thud.\n\n Wakasagihime opened her mouth to shout, but the sound seemed to be cut off, leaving only a tremor in her throat. Sekibanki's head rolled off and was fixed in place, like an absurd joke—her eyes widened, and for the first time, she finally showed real fear.\n\n “Wait, wait a minute!”\n\n Her voice trembled, yet she still tried to be strong. “We just—” “I know,” Sakuya interrupted her.\n\n She took a step closer, her tone almost cruelly calm. “You just “refused to kneel.”” Sekibanki gasped for breath, like a wild beast cornered.\n “And what about you?\n\n Aren't you human? Aren't you also—” Sakuya's eyes darkened slightly, as if an old wound had been reopened, but she didn't back down.\n\n “Because I am human,” she said, “I understand better than you what it takes to “stay”.”\n\n She raised her hand, as if closing a book.\n\n The next instant, only the sound of rain remained on the riverbank. The powder box lay overturned in the mud, the knots neatly cut; there were no drag marks on the ground, no echo of cries for help. Those names seemed to have been erased from the world, not even the gesture of resistance left a complete shape.\n\n Sakuya stood there for a moment, water droplets sliding down her fingertips from her gloves. She showed no sign of victory, only an emptiness of being forced to complete a task.\n\n—— Back at Scarlet Devil Mansion, Remilia leaned back in her chair, lazily swirling her wine glass.\n\n “Is it cleaned up?” she asked, as if asking if a rug had been cleaned. “Yes,” Sakuya replied. “And that name?” Remilia's smile was faint. “Seija.”\n\n Sakuya paused for half a second. “She's not here,” she said, “but the thread is still there.\n\n I'll follow the grassroots upwards.” Remilia gave a soft hum, as if satisfied. “Well done. Don't let those little things think they can shake the throne.”\n\n Sakuya bowed her head. “Yes, sir.” As she turned to leave, her fingertips lightly tightened on the side of her skirt, as if crushing some emotion along with it.\n\n The civil war was over. But she knew the real wounds were never on the battlefield.\n\n They were in those who cried out in defiance, those who cried for survival, those who cried out for their names.\n And her job was to silence those voices, one by one—until Seija Kijin too."

 KYO_meiling_intro:"Hong Meiling, Gatekeeper of the Scarlet Devil Mansion"
 KYO_meiling_intro_desc:"There is always someone at the gate of the Scarlet Devil Mansion.\n\n By day, she dozes against a stone pillar with the brim of her cap drawn low, looking for all the world like the most casual of guards. But let the wind change, a footstep fall out of rhythm, or a visitor's breathing falter for a moment, and her eyes open. There is no ferocity in them, only an unshakable steadiness—as though the weight of the entire mansion rests upon her shoulders.\n\n Hong Meiling's duty is very simple and very difficult: she guards the gate.\n She must tell a lost traveller from someone testing the defences, and a guest bearing gifts from one carrying a knife. She remembers every familiar face and every shadow that ought to be stopped. When trouble comes, she must silence it before it wakes the mansion. She will smile as she asks you to halt; cross the line, and she will put you back on the proper side of it—not cruelly, but without negotiation.\n\n In truth, she has no love of trouble.\n She likes sunshine, grass-scented breezes, and practising a form between shifts until warmth returns to her limbs. She respects rules without becoming rigid and understands propriety without turning cold. If a child from the Human Village peers through the gate, she softens her voice to ask whom they are looking for. If a lost fairy bursts into tears, she escorts them back to a safe path and gently warns them not to wander off again.\n\n Many residents of the Scarlet Devil Mansion are powerful enough that others dare not approach them.\n Meiling is different. She notices whether a maid has eaten, helps the kitchen carry a crate too heavy for one person, and leaves a lamp burning for anyone still abroad during her night patrol. She is no saint. She simply treats people as people.\n\n That is also the strangest and most stubborn thing about her.\n\n Though she is a youkai, she always seems to stand between youkai and humans, leaving a little room for both. She dislikes seeing the weak ground into the mud and does not believe power exists to frighten others. She knows the world is cruel; she merely refuses to become cruel with it.\n\n Some whisper that she is a dragon who wishes she were human.\n When she hears them, she never takes offence. She only smiles, as though admitting it—or perhaps as though it does not matter.\n\n “Being human sounds rather nice,” she sometimes says, as casually as if discussing the weather.\n “At least you can speak your mind, and decide for yourself whom you choose to treat kindly.”\n\n And so she stands before the gate.\n Not because she is the strongest, nor because she is the most ruthless, but because she is willing.\n\n Willing to guard this mansion in her own way—to keep the chaos outside from entering, and give those within the peace to live as themselves.\n\n When she sleeps, she is a cat. When she wakes, she is a wall.\n Her smile is easy, but she never neglects her post."

 KYO_meiling_gatekeeper:"Chinese Girl"
 KYO_meiling_gatekeeper_desc:"At the entrance of Scarlet Devil Mansion, the strangest thing isn't how magnificent the building is.\n\n It's the person standing in front of the door.\n\n Hong Meiling wears clothing that leans towards a Chinese style; the fabric isn't expensive, but it's always neatly and comfortably arranged. The cuffs are perfectly gathered, the buttons are neatly fastened, even the knot in her hairband seems habitual. She stood there, clearly a Youkai, yet more “human” than many Youkai: she would greet people, give way, and truly listen when you spoke.\n\n Sometimes you might wonder—was she hiding something? Because Youkai usually didn't need to be like that. Youkai could intimidate, coerce, or even scare someone into submission with a single sentence. But Meiling didn't. She seemed to follow a set of rules: who should enter, who should stop, and how to speak to avoid bloodshed. “Why are you dressed like that?” someone would occasionally ask, their tone probing. Meiling would smile, as if she found the question amusing.\n\n “It's a habit,” she would say.\n A single sentence, and it was over; no story.\n\n This makes it even more suspicious.\n\n She's clearly very strong.\n\n So strong that if you walk past her, you feel your breathing rhythm being dictated by her stance. She doesn't often make a move, but whenever she raises her hand, you know it's not just for show. Her punches and kicks aren't based on brute force; it's a kind of stability where power is stored deep within the bones. Once she gets serious, the doorway is no longer a doorway, but a boundary.\n\n But the more she's like this, the more incomprehensible she becomes.\n\n Why would such a being try to emulate humans? Humans are weak, short-lived, hungry, and afraid. Humans have too many limitations, yet they are astonishingly stubborn: even knowing they will lose, they still get back up; even knowing tomorrow may not come, they still light a lamp for tomorrow.\n\n Meiling seems to like this kind of thing. During her breaks, she would gaze in the direction of people, her eyes devoid of hostility, as if observing a life both strange and familiar. She would remember the names of visitors, even the troubles they had mentioned last time. When someone nervously approached the door, she would often ask first, “Are you hungry?”\n\n Youkai rarely asked such a question first. That “humanity” wasn't pretense, nor was it acting.\n\n She did it so naturally, as if she had always lived like this.\n\n And so, rumors began to circulate in Scarlet Devil Mansion. Some said she wasn't actually Youkai, but a dragon fallen from the sky, only temporarily borrowing a form. Some said she was hiding something, hiding from a past she didn't want to mention, which was why she had squeezed herself into the rules, into the uniform, into the fixed position of “gatekeeper.”\n\n Some people are more direct: She wants to be human.\n\n “Wanting to be human” sounds silly. But you'll waver when you see her. She stands so firmly, yet she doesn't use her power to bully the weak; she could crush someone to the point of suffocation, yet she chooses to resolve things with a smile and tact. It's as if she's deliberately practicing a choice—practicing how to stop when she could crush someone.\n\n One night, the maid changing shifts secretly asked her.\n\n “Meiling, what exactly are you?” Meiling put her hands behind her head, lazily gazing at the starlight.\n\n “Me? It's me.”\n\n “But you're not like Youkai.” Meiling paused, her smile fading slightly, but not turning cold.\n\n “Does it matter whether I am or not?” she said. “I just don't want to live like that... someone who cares about nothing but winning.”\n\n The maid wanted to press further.\n Meiling raised her hand and pointed to the door.\n\n “You see, humans are weak, right?” “Yeah.” “But humans are also very powerful.”\n She spoke slowly, as if afraid of saying something inappropriate. “They have nothing, yet they can hold onto what little they have for so long.\n\n They can make “home” a place, and “promises” a path.”\n She withdrew her hand, her smile returning to its usual amiable tone.\n\n “I think that's quite remarkable.”\n\n If she truly was a dragon descended to earth, she wouldn't have chosen power.\n\n She chose limitation. She chose to place herself at the doorway, watching the weak come and go every day, learning how they endured, how they persevered, how they made it through life.\n\n Perhaps she didn't have any earth-shattering secrets. Perhaps she simply believed: strength isn't about doing whatever you want.\n\n Strength is when you can do it all, but choose to live like a human."

 KYO_meiling_help_sakuya:"Enjoying the moon with Sakuya"
 KYO_meiling_help_sakuya_desc:"Meiling first noticed Sakuya when she wasn't yet adept at cleanly stamping her feet.\n\n Back then, Sakuya stood very straight, answered quickly, but her eyes always seemed taut. She was ruthless in her actions, even more ruthless to herself. Others saw “reliability,” but Meiling saw “fear of stopping”—as if she was afraid that if she stopped, something would catch up with her.\n\n Later, Sakuya became increasingly formidable.\n She flipped through ledgers faster than anyone else, arranged banquets more smoothly than anyone else, and seemed to straighten corridors and kitchens with invisible threads. She could smile and say, “Leave it to me,” and could also extinguish chaos in an instant. Every corner of Scarlet Devil Mansion began to rely on her, even the sound of the wind seemed to follow her rules.\n\n Meiling admired her greatly. She was also very worried. Because she knew that kind of resilience wasn't limitless. The human body tires, and the heart breaks. Sakuya had pushed everything too hard; one day she wouldn't be able to hold on—not on the battlefield, but in the dead of night when no one could see her.\n\n So one night after the shift change, Meiling didn't joke around as usual, nor did she make excuses to invite her for snacks. She simply waited for Sakuya to finish signing the last inspection report before standing at the corner of the corridor.\n\n “Head Maid,” she called naturally, without deliberately using honorifics to be sarcastic.\n\n Sakuya stopped writing, her brow furrowing almost imperceptibly. “Meiling, is something wrong?”\n\n “Yes,” Meiling nodded, her tone as relaxed as if inviting someone for a walk. “Come with me.” Sakuya instinctively wanted to ask, “Where are we going? Why? How long will it take?” Those questions were almost her defensive instincts.\n\n But Meiling had already turned and walked away, her steps slow but firm, as if to say: This isn't work, you don't need approval.\n They walked to the stone steps outside the garden. The night breeze was clean, the scent of roses faint, and candlelight flickered in the distant windowpanes.\n\n The moon hung high, its light falling on the edge of the fountain like a thin layer of silver.\n\n Sakuya stood, her shoulders still straight. “I still have—”“No,” Meiling interrupted, her tone gentle. “Not tonight.”\n Sakuya's lips moved slightly, as if she wanted to object, but in the end, she only uttered a very soft sentence.\n\n “What about the young lady...” “The young lady won't mind you looking at the moon for five more minutes.”\n Meiling leaned against the railing, raising her chin to indicate the sky. “Look. It's so bright. You pass by every day, but you never look up.”\n\n Sakuya was silent. Her movement of raising her eyes was slow, as if she were learning something unfamiliar. When the moonlight shone into her eyes, Meiling realized that Sakuya was actually very tired.\n\n Not the kind of tiredness of being disheveled, but the emptiness that comes from holding everything down for too long.\n\n “You've become very capable,” Meiling said. Sakuya instinctively replied, “It's my duty.”\n “I know,” Meiling smiled. “You always answer like that.” She paused, her tone still casual, but more serious. “I've watched you become who you are now.\n\n You're very resilient, really.\n\n But if you keep living by enduring, it'll cause problems sooner or later.”\n\n Sakuya's shoulders tensed slightly. “I'm fine.”\n Meiling didn't expose her, instead going along with her. “Okay. Let's pretend nothing happened.”\n\n She reached out and patted the railing, as if to soften her tone. “Then let me put it another way. I want you to know something.” Sakuya turned her head, her eyes still alert. “What?”\n Meiling looked at the moon, as if trying to figure out how to say it without immediately closing her heart to Sakuya. “You don't need to prove yourself every second,” she said. “And you don't need to be afraid of being left behind if you don't do well enough.” Sakuya's breath hitched.\n\n She neither admitted nor denied it. Meiling turned to look at her, her gaze steady, without coercion or pity. “Because at least I'm here.” She said it calmly, as if stating a long-standing rule. “Whether you're perfect today, whether you can smile, whether you can handle everything—I'll be on your side.”\n\n Sakuya's fingers tightened slightly at the edge of her glove. “Meiling, I'm your boss.”\n\n She seemed to be trying to close the distance.\n\n Meiling shrugged. “In name only.” Her smile was casual, but her words were clear.\n “We're all working for Miss. You manage the procedures, I guard the entrance. You keep the building clean, I keep the outside troubles out.\n\n It's not about superiors and subordinates, it's about looking after each other.” Sakuya looked at her, her eyes less guarded, but still not relaxed.\n “Why... why are you going to such lengths?” Meiling thought for a moment, then answered in the simplest way. “Because I care.” She shifted her gaze back to the moon, her voice as light as the night breeze.\n “I don't want to look back one day and find you're gone.”\n\n Sakuya didn't speak immediately.\n She simply stood by the railing, letting the moonlight fall on her shoulders. At that moment, her posture remained upright, but a tiny crease appeared.\n\n Meiling didn't urge her.\n She didn't lecture her further.\n\n The two of them simply watched the moon, listened to the fountain's sound, and heard the footsteps in the distant corridor gradually diminish.\n\n After a while, Sakuya whispered, “... Thank you.”\n\n Meiling didn't reply with “You're welcome.”\n\n She just smiled, as if keeping those words to herself. “Let's go,” she said. “Let's watch a little longer, then we'll go back. Don't be afraid. I'll guard the door.”\n\n The moon was still there.\n Scarlet Devil Mansion is still there.\n And Sakuya realized for the first time: she didn't only need a job to stay. She at least had a place where she didn't have to be constantly on edge."

 KYO_meiling_gardening:"Manage the entrance well"
 KYO_meiling_gardening_desc:"The entrance to Scarlet Devil Mansion had always been a clean line: straight stone steps, gleaming iron gates, and gardens so meticulously manicured they looked as if someone had measured them with a ruler. But time doesn't stop for anyone's authority.\n\n One morning, before the mist had cleared, Meiling noticed things that shouldn't be there—cracks in the edges of the gateposts, dark spots on the ironwork, weeds sprouting from the cracks in the stone steps, and rose bushes with branches torn by the wind and rain.\n\n She stared at them for a few seconds, as if confirming she wasn't mistaken.\n Then she sighed. “This won't do...”\n\n Because she knew very well that this “old-fashioned” appearance wasn't natural in Remilia's eyes, it was a dereliction of duty. Scarlet Devil Mansion can be cold, ruthless, and frightening, but it cannot be broken. It cannot be dirty. It cannot look like it has been caught up by time.\n\n Meiling didn't wait for anyone to tell her.\n She rolled up her sleeves, hung her coat behind the door, as if preparing for a battle of endurance.\n\n On the first day, she started with the door.\n The hinges of the iron door made a faint scraping sound; she could hear the weariness in the sound. She removed the metal guard, her fingertips touching iron filings and old oil, but she didn't frown. She pressed the sandpaper on it, grinding steadily, stroke by stroke. When the dark spots were worn away, revealing a relatively healthy sheen underneath, she relaxed her shoulders slightly.\n\n The cracks in the stone pillars were more troublesome. She knocked off the broken edges, re-grouted, waited for it to dry, then sanded it again, and then filled in another layer. The sunlight shifted several times, leaving her hands covered in dust and her knuckles marked with tiny abrasions.\n\n But she didn't stop.\n The garden was just as suffocating. Fallen leaves piled at the corner of the path, mud staining the edges of the white stones a dark ring. The roses grew too fast, their thorns intertwined, as if deliberately provoking their caretaker. Meiling squatted beside the bushes, carefully cutting away the excess branches, leaving only the essential shapes. She worked slowly, unhurriedly, yet firmly. She wanted each rose to look like it had been “always cared for,” not hastily salvaged.\n\n Sometimes she would look up and see the maids passing by the corridor window, see the candlelight in the banquet hall radiating warmth. She could clearly hear the laughter inside, but she didn't go in. “I'll go later,” she always thought.\n\n Then, as night deepened, the sounds faded, leaving only the wind at the doorway.\n\n She meticulously divided her time: repairing the door in the morning, preparing the soil in the afternoon, pruning in the evening, and touching up the paint at night. She crammed herself into the routine, as if afraid that if she stopped, something would overtake her. It wasn't that she didn't want to talk to people; she was just too used to taking responsibility—if there was a problem with the door, it was the doorman's fault; if the garden was out of shape, it was her fault for not keeping a close eye on it.\n\n Occasionally, someone would come looking for her.\n Koakuma, holding a box of snacks, poked her head in: “Meiling—aren't you coming to eat?”\n\n Meiling wiped the sweat from her brow and smiled casually. “Wait until I finish cleaning up here.”\n\n Patchouli coughed as she passed by, her tone like a reminder: “You're treating yourself like a repair machine.”\n\n Meiling still smiled: “Even machines have to finish their work.”\n\n Sakuya once stood on the steps watching her for a long time, finally leaving only one sentence: “You tore up your own shift schedule.”\n\n Meiling paused for half a second, then turned around and waved. “I'll make it up.” She said it lightly, as if she really wasn't tired. But on the third night, when the moonlight fell on the newly painted iron gate, she finally sat down on the steps for a moment.\n\n She looked at the calluses and dust on her palms, exhaled a long breath, as if pulling weariness from her chest.\n\n She knew that if Remilia went to the door and saw it lit up again, the garden neat and tidy, she wouldn't ask any more questions.\n\n “Well done.”\n\n That was enough. Meiling didn't ask for more.\n\n She pulled her hat down further, stood up, and brushed the dust off her skirt.\n\n The doorway was restored. The garden was restored too. But amidst the polished metal and straightened branches, she secretly missed several nights that should have been spent eating and laughing together.\n\n She didn't say it aloud. She just stood back in front of the door as usual, as if nothing had happened.\n\n Because this is Scarlet Devil Mansion. And Hong Meiling's job is to make it seem as if it will never be eroded by fate."

 KYO_meiling_daughter_of_dragon:"Descendants of the Chinese Dragon"
 KYO_meiling_daughter_of_dragon_desc:"The guard at my door, I first saw her in Shanghai, after the collapse of the Qing Dynasty—that city was like a pot that was too full, the whistles of the docks, the sirens of the concessions, the secret codes of the gangs, the gunshots of the warlords, all mixed in the same layer of damp night air.\n\n Shanghai at that time did not believe in rules, only in power. The flags at the street corners changed every few days, today it was this warlord's soldiers, tomorrow it was another family's guns. The laughter in the restaurant was deafening; you might collapse halfway through a laugh. The lanterns in the alley were still lit, but your shadow was already calculating your worth.\n\n I was just passing through. Such places were nothing new to me—human chaos is always pretty much the same, just with a different name.\n\n But in that place, the gears of my fate began to turn; there I met Hong Meiling, the incarnation of the dragon."

KYO_meiling_sleepy_head:"The gatekeeper who swore to defend the manor to the death"
KYO_meiling_sleepy_head_desc:"The entrance to Scarlet Devil Mansion was as usual. The stone steps were clean, the iron gate gleamed, and the roses in the garden were trimmed to perfection.\n\n Hong Meiling leaned against the doorpost and yawned, her hat brim pulled low, as if she were about to fall asleep again. But a gust of wind blew, and she opened her eyes—not because of a sound, but because “something was wrong.” There was a chill in the air, as if someone had descended from the clouds.\n\n “Come out,” Meiling said lazily, her tone like calling a kitten stealing food. “Don't hide in the shadows.\n\n You're stepping on leaves too lightly; you'll give yourself away.”\n A branch trembled, and a figure descended. Aya Shameimaru folded her wings deftly, her camera swaying in her hand, and she smiled naturally.\n “Oh dear, we've been spotted. Miss Gatekeeper has sharp eyes.”\n\n Meiling raised her chin, not laughing. “Tengu's reporters came to my doorstep, saying they were just taking a walk? Are you all very free on the mountain lately?”\n\n Aya blinked, her tone light as if she were conducting an interview.\n “I'm just doing my job. Lord Tengu—Lady Megumu Iizunamaru—let me see what Scarlet Devil Mansion has been up to lately.\n\n Makes perfect sense, doesn't it?” Meiling tucked her gloves into her palms, still standing loosely.\n “Whether it's reasonable or not depends on where you're standing.” She looked at Aya's camera. “Your thing is pointed inside the door, it just won't work.”\n\n Aya raised the camera slightly, as if on purpose. “What if I insist on taking a picture?”\n Meiling's eyes didn't change, and her voice wasn't loud.\n\n “Then try and see if you can get a picture.”\n The next moment, the wind exploded. Aya's figure swept across the ground like a gust of wind, feathers scattering broken leaves, the angle of the camera aimed at the garden was infuriating. Meiling only took half a step forward, raising her hand—as if casually shielding herself from the rain.\n\n “Snap.” The air was cut off. Aya's forward momentum was forcefully halted, her shoe soles scraping a white mark on the stone steps.\n\n She retreated, still smiling, but her eyes gleamed even brighter. “Oh? So you weren't dozing off.” Aya rotated her wrist. “This strength doesn't seem like a gatekeeper's, more like a guard's.”\n\n Meiling shook her hand, as if disgusted by the dust. “I am a guard. You tengu want to watch the show, I don't care; if you want to reach in, you'll have to ask me first.”\n\n Aya's figure blurred, closing in again. She was as fast as the wind whistling through a crack in a door; the camera flashed twice, as if trying to capture every shadow of Scarlet Devil Mansion in a photograph.\n\n Meiling's steps remained unhurried. She used her fists, elbows, and shoulders to block those angles one by one. The moment their paths crossed, rose petals fluttered up and landed on the stone steps like freshly turned sheets of paper.\n\n After a few rounds, neither had fallen.\n Aya stopped half a zhang outside the door, her breathing steady, her smile unwavering. “What a nuisance.\n\n Your sect is as troublesome as the rumors say.”\n Meiling brushed the petals off her sleeve, her tone still casual. “Likewise.\n\n Your footwork isn't bad either.”\n Aya slung the camera back over her shoulder and tilted her head to look at her. “Then let me ask another question.\n\n Are you so protective of us because you're afraid we Tengu might have some plans?”\n Meiling looked at her, her gaze calm, yet making one reluctant to take another step forward.\n\n “It's not fear,” she said, “it's dislike.”\n She glanced inside the door, her voice slowing. “Go back and tell Megumu Iizunamaru.\n\n Scarlet Devil Mansion doesn't play tricks on Tengu, so don't even try to get your hands on this.”\n Aya laughed even more broadly, as if treating the threat as a joke. “Oh dear, is the gatekeeper warning me?” Meiling also smiled, a faint smile.\n “It's a reminder. If you want to monitor, watch from the outside. If you want to cause trouble—” She paused, as if choosing her words, “first ask me if I still want to be polite.”\n\n The wind rose again, and Aya's figure retreated to the treetops, wings outstretched. “Alright, alright.” She waved from above, her tone still relaxed. “That's enough for today.\n\n I'll be more careful next time.” Meiling looked up as she disappeared into the clouds, then yawned again and leaned back against the doorpost.\n\n She still looked like that dozing doorman.\n But everyone inside knew—as long as she stood there, no matter how loud the wind outside, no one could take another step."

 KYO_remilia_intro:"Scarlet Devil Mansion's Master Remilia Scarlet"
 KYO_remilia_intro_desc:"Remilia Scarlet was the master of Scarlet Devil Mansion, and also the most “etiquette-conscious” person in the night. When she held her wine glass, it was as if she were hosting a never-ending ball; her tone was gentle, but her eyes seemed to measure every possible escape route.\n\n She could see the threads of fate, able to mold “chance” into “inevitability.” Ironically, though, she could rewrite others' destinies, yet couldn't grasp her own.\n\n She witnessed the rise of humanity in Europe. Not through mythology, but through gunpowder, gears, academies, and the smoke of workshops. The light of that new era illuminated the ancient darkness, leaving it nowhere to hide. She watched vampire castles ablaze, stone walls cracking in the flames, family crests crumbling in the ashes; not defeat, but being kicked off the stage by the rules of the world.\n\n She also witnessed something even crueler—her sister. Flandre wasn't someone “defeated,” she was someone pushed to the extreme by the tide. The more the world rejects monsters, the more Flandre resembles a key out of control: capable of opening any lock, and tearing down an entire door and wall along with it. Her laughter is too soft, her destruction too absolute; each outburst is like a reminder to Remilia: this is not a problem that enemies can solve, this is a calamity in her blood.\n\n So Remilia puts away her childishness, her willfulness, and transforms everything into something more like “rule.” She is no longer just a name whispered in the night—she wants to become the system, the banner, the queen who will teach the world to fear again.\n\n Because she knows that if she doesn't take power, fate will devour her and her sister."

 KYO_remilia_queen:"Vampire Queen"
KYO_remilia_queen_desc:"Remilia's stance was never built on debate; it was based on one conclusion: fate was the enemy.\n\n She didn't believe “obedience” would bring survival. Vampires once ruled the night, but were banished from history in the dawn of civilization. She witnessed her kind disappear one by one, like old words erased by the new era. So she made up her mind—she would rebel against the pre-written script.\n\n She wanted a throne, not just the throne of Scarlet Devil Mansion, but a throne that extended to Europe, to the entire world. She wanted to turn fear into law, night into borders, to bring the existence of vampires from legend into reality, and to make any “rise” bow before her.\n\n But the deepest motivation for this journey wasn't glory.\n\n It was Flandre.\n\n Her sister's power was like an endless thunderstorm—beautiful, dangerous, and unpredictable. Remilia could temporarily suppress her with commands and shackles, but she knew that wasn't the solution. What she wanted wasn't “imprisonment,” but for Flandre to breathe normally and live without destruction.\n\n Whenever she saw the pair of crystal-adorned, now tattered wings on Flandre's back, she remembered that night that changed everything. Cannons blasted through the city walls, firearms tore through the night, and humans burned their homes to the ground. It was on that night that Flandre lost control, becoming a calamity that even her older sister dared not approach.\n\n Those wings were more than just scars.\n\n They were a mockery left by fate, a past she could never shake off, no matter where she went.\n\n Patchouli, having received the order to help Flandre, didn't give her a ready-made answer.\n She simply buried herself in books, spells, and bloodline studies, trying to find a way to help Remilia—regardless of whether that method ultimately pointed to the source of the past, a crack in the bloodline, or some forbidden technology capable of rewriting destiny itself.\n\n Remilia thus understood that she had no right to stop. As long as she wanted to save her sister, she couldn't just guard the Scarlet Devil Mansion, nor could she be content with a corner of Gensokyo. She had to continue seizing power, expanding her territory, forcing the world to make way for her, until one day, even fate could no longer treat Flandre as an out-of-control disaster.\n\n She raised her glass, as if saluting an unseen adversary.\n\n “Fate wants to trap me here?” Her smile was elegant to the point of being cold.\n\n “Then I'll drag the whole world into my night.”\n\n She would become queen. Not for praise.\n But so that her sister—would no longer be treated as a disaster by fate."

 KYO_remilia_hello_satori:"Remilia's majesty remains unyielding"
 KYO_remilia_hello_satori_desc:"A red mist pressed down on the square, flags like wet cloths stuck to spears. The crowd was driven to the steps, standing densely, yet no one dared to make a sound. For the platform was not a banquet, but an execution ground.\n\n Two figures were bound to wooden pillars.\n Satono Nishida was still wearing fragments of her dance costume, the ribbons torn, the bells dull; her chin was still raised, as if she were forcing herself to perform a flawless show. Mai Teireida was even quieter, the ropes on her wrists drawing blood; she didn't look around, only stared ahead—as if waiting for the “back door” that would never truly close to give its final command.\n\n Remilia stood high up, her cloak draped down like a red and black curtain. She held a wine glass, even having the leisure to straighten the rim. She glanced at the audience, her smile barely spreading.\n\n “Everyone, don't be nervous,” she said, as if reassuring the guests.\n “Today isn't war.\n\n Today is about settling things in.”\n\n She raised her hand, pointing to two people.\n “Do you recognize them?” Without waiting for an answer, she read out their names, as if calling out a pre-written list.\n “Satono Nishida. Mai Teireida.”\n\n Several people in the crowd shrank back, as if an old wound had been reopened. Those were the last vestiges of dignity the remnants of Yakumo could still offer: dancers of Okina, the god of the back door, concealing them, relaying their messages, hiding their escape route in the shadows.\n\n Remilia put down her glass, her tone light and airy.\n\n “You all worked hard,” she said, glancing at Satono as if praising a nice toy.\n “You collected the Yakumo family's remains, moved boxes for Okina, and held onto the defeated army's dignity until today.”\n\n Satono gritted her teeth, still trying to smile beautifully.\n\n “At least we didn't kneel.”\n Remilia tilted her head.\n “I didn't ask you to kneel either.”\n Her smile turned colder.\n\n “I just want you to disappear completely.” Mai Teireida finally spoke, her voice low, as if squeezed out from under a door.\n\n “The back door... won't be closed forever.” Remilia heard it, as if it were an old joke.\n\n “The back door?” she scoffed softly.\n “In my palace, there is only one door.”\n She raised a finger, gesturing to the execution platform. “And you'll soon find out where it leads.”\n\n Suppressed gasps rose from the crowd below; some tried to turn away, only to be forced back by the butts of soldiers' rifles. This wasn't an execution; it was a public humiliation—tearing away the last vestige of dignity from the Yakumo faction in front of everyone.\n\n Remilia stepped forward, her heel striking the wooden platform with a crisp sound.\n “I'll give you some dignity,” she said.\n\n “Aren't you dancers? Then dance.” Satono's eyes lit up for a moment, as if trying to grasp the fleeting moment of those words; she raised her bound wrists, but the bells only made a dull thud. She wanted to stand as she always had, to straighten her back, to remain a messenger of the “back gate” until the very last moment.\n\n But the ropes were too tight, her blood too hot.\n\n Her knees trembled. Remilia saw it, her smile thinning.\n\n “So you can be afraid too,” she whispered.\n “I thought you only knew how to dance behind someone else's flag.”\n\n The executioner raised his knife.\n Mai Teireida didn't struggle; she simply gazed at the distant red mist, as if searching for a figure that would never come.\n\n Satono suddenly shouted, like a final act of defiance.\n “You think you've won just like that?!”\n\n Remilia replied slowly, as if polishing each word. “I've already won.”\n\n Her gaze fell, like pressing someone into the ground.\n “Today, I'm just letting you remember—what defeat looks like.” The knife fell.\n\n The sound wasn't loud, yet it sliced the entire plaza in two. Blood flowed down the wood grain, like a forcibly drawn boundary line.\n\n Remilia turned, tossing her cloak, as if ending a performance. “Hang your heads up,” she commanded, as if instructing someone to clean.\n\n “Let the Yakumo family see clearly: their last shred of dignity is gone.”\n\n Some in the audience bowed their heads, some trembled, some stubbornly held back their tears. No one dared to speak for them. The red mist remained.\n\n The throne remained.\n\n And the last vestige of dignity of the Yakumo faction had been stripped away completely by Remilia in public."

KYO_remilia_hello_miko:"An accident occurred at Scarlet Devil Mansion."
KYO_remilia_hello_miko_desc:"The square before the Scarlet Devil Mansion was packed.\n\n Youkai, humans, vassals, and the defeated wore the same trace of unease. They were waiting for an answer: now that the civil war was over, what came next? Would the night become order—or a deeper terror?\n\n Red mist pressed against the sky, and candle flames shivered in the wind. A throne had been carried onto the steps. Iron spears and banners stood in two ranks, driving the mansion's authority into the very earth.\n\n Remilia stood above them.\n A red-and-black cloak hung from her shoulders like an ancient sovereignty. Her smile was slight, yet the crowd below instinctively held its breath.\n\n “You are looking at me,” she began. Her voice was quiet, but so clear that it seemed spoken beside every ear. “Good. Remember this moment.”\n\n She raised one hand, her fingers plucking at invisible threads.\n\n “I do not require your cheers. I require your obedience.”\n\n Someone swallowed. Someone else tightened a fist. Others tried to raise their heads and found they could not. This was not devotion, but fear held firmly beneath a hand.\n\n Remilia stepped forward, her skirts brushing the stairs as though proclaiming the new order.\n\n “From this day onward, the Scarlet Devil Mansion is no isolated estate. It is your palace, your law, and the only order by which you will survive.”\n\n Her delivery remained elegant, as though she were reciting a point of etiquette. Every word was steel.\n\n She was about to continue when a faint light flashed deep within the crowd, like an eye opening in darkness.\n\n Nazrin stood in the least conspicuous place she could find. Her cloak was drawn low and her shoulders tucked in, like a mouse afraid of being trodden underfoot. She looked neither at Remilia nor at the mansion looming above her. She looked at the pagoda in her hands.\n\n Shou had left it behind. It was heavy and cold, an epitaph that refused to fade.\n\n Nazrin's knuckles whitened. She forced the words so deep into her throat that no one else could hear.\n\n “Lady Shou... help me.”\n\n She lifted the pagoda by the smallest degree.\n\n Its patterns blazed to life, awakened by fury.\n\n A beam erupted from the crowd—swift as lightning and straight as judgement.\n\n Someone screamed, but the sound was swallowed. The beam passed Remilia's ear without touching her.\n\n It struck the mansion behind her.\n\n The outer wall was pierced, and the explosion that followed landed like a fist against the chest. Flame burst from the windows. Stone and splintered wood rained over the square; glass shrieked as it shattered; and the entire mansion seemed to tear open from within. The blast overturned the red mist. Every candle went dark, only to be relit in the colour of the fire.\n\n For one moment, the crowd froze. Then it fled.\n\n “The mansion!”\n “An assassin!”\n “Run!”\n\n Youkai scattered. Humans were knocked to the ground. Armour struck stone, while weeping, curses, and shouts collapsed into one another. Hot wind snapped the banners overhead as though mocking the proclamation they had framed only moments before.\n\n On the steps, Remilia did not retreat from the flames.\n\n Her smile was gone. What replaced it was not panic, but the rage of someone publicly affronted.\n\n She slowly turned towards the wound in her mansion. Fire licked familiar windows, corridors, and towers. Before the assembled crowd, her palace had been stripped of its crown.\n\n Remilia raised a finger. The air drew taut.\n\n “Who?”\n\n One word silenced the chaos for an instant.\n\n The press of bodies had pulled Nazrin's cloak aside. She stood with teeth clenched and the pagoda still shining. There was no triumph in her eyes, only hatred burned down to its final ember.\n\n “You devils!” Her voice shook, but she did not step back. “We of Myouren Temple will never stop fighting you! Remilia—the Buddha's wrath will consume you!”\n\n Remilia regarded her from the deepest point of the night.\n\n “You destroyed my home, little rat.” Her voice was terrifyingly calm.\n\n She took one step forward, cloak rising in the heat.\n\n “Throw this vermin into the dungeon.”\n\n Her hand rose as though drawing every thread of fate back into her grasp.\n\n “And those who insult the Crown will be remembered by the world—before they disappear from it.”\n\n Fire roared behind her. The crowd trembled at her feet.\n\n The speech had been intended as a declaration of victory.\n\n Instead, it became a signal of resistance."

 KYO_remilia_vampire:"The cruel removal of religion establishes vampires"
 KYO_remilia_vampire_desc:"The beginnings of religions are always similar.\n\n First, they offer you a word of comfort—“God will protect you.”\n Then they give you an exit—“God bless you.”\n Finally, they provide a way out—“It's okay to die, you will be reincarnated, you will come again.”\n\n Humans are too small in the face of fate, so they invent something bigger to support themselves. God, destiny, reincarnation, redemption. It sounds gentle, but it's actually very practical: it makes you endure, makes you wait, makes you shut up, makes you swallow your resentment.\n\n I've seen those “blessings” fall into the firelight.\n The castle is burning, the stone walls are collapsing, and screams shatter in the night. Some held crosses, some held prayer beads, all chanting the same phrase—“Please save me.”\n\n And the result?\n The flames still climbed upwards.\n Lives were still taken.\n\n God didn't reach out, and heaven didn't respond. Once, a clergyman stood before the ruins, saying to the trembling, weeping crowd, “Don't be afraid, this is a test.\n\n You will be saved.”\n I was there. I asked him, “Who will be saved?”\n\n He paused, but still maintained his smile.\n\n “Just believe, and you will—” I interrupted him.\n\n “You're quite the talker.” I took a step closer, letting him see my shadow clearly.\n “You've disguised “helplessness” as “arrangement,” and “loss” as “blessing.”\n\n You're not saving people; you're preventing them from resisting.”\n He wanted to back away, but stubbornly persisted.\n\n “That's blasphemy.” I laughed.\n\n “Blasphemy? No.” “I just hate deception.”\n Because fate won't change course just because you kneel longer. It only sees whether you have the strength, the courage, and the firmness of your grip.\n\n Therefore, resisting fate is inevitable. And rebelling against religion—those who use “divine will” as chains—is just as inevitable.\n\n I don't need people to love me.\n I don't need them to understand me. I just need them to stop handing their necks to a set of fabricated rules.\n\n From this day forward, the phrase “God will decide for you” will no longer be permitted in the territory of Scarlet Devil Mansion.\n\n The bells will stop, the incense will be extinguished, and the pulpit will be silent.\n\n Want to pray? Sure.\n In your own room. Want to proselytize? No.\n\n Put away that script of comforting others.\n For in my hands, fate only recognizes two things: Strength, and obedience.\n\n You can place your hopes in the sky. You can also reach into reality.\n\n But don't expect foolish myths to change your fate.\n I've seen too much ashes; I know that won't happen."

 KYO_remilia_b_positive:"The Scarlet Devil"
 KYO_remilia_b_positive_desc:"Under Remilia's rule, the world was divided into two scenes, like two seasons crammed onto the same map. The first was obedience.\n\n Wherever the flag of Scarlet Devil Mansion was planted, things began to “get better.” Roads were widened, warehouses were filled with sacks of grain, and factory chimneys spewed heat and steel day and night. Rationing schedules became punctual, medicine was no longer unavailable, patrols on the streets moved with rhythm, and even nighttime security seemed to be tethered.\n\n People learned to add honorifics before her name.\n\n “Lady Remilia is wise.” “She saved us.”\n\n “With her here, at least things won't be chaotic.”\n\n They spoke sincerely because their bowls were indeed full.\n They also spoke quickly because everyone around them was echoing them. The second type is resistance.\n\n Those who resist don't leave behind stories, only empty spaces.\n\n The line on the list was crossed out, the name on the household register was blacked out, and the plaque at the door was removed. The next morning, you'll find your neighbor gone: the windows are closed, the bed is neatly made, the bowl is still on the table, as if he just went out to buy something. But he didn't come back.\n\n Because “enemy” here isn't an identity, it's a process.\n\n The clerks at Scarlet Devil Mansion will give you your final farewell: Your name is taken back and replaced with a number.\n\n The reason doesn't need explanation, because the reason will cause discussion.\n Discussion will cause problems.\n\n So they're left with only numbers.\n\n With tags around their necks and thick ropes around their hands, they're not allowed to look back as they enter the truck. If someone tries to call out a family member's name, their mouth is immediately gagged; if someone tries to struggle, their knees are forced to kneel first.\n\n Once the door closes, those outside pretend they didn't see anything.\n The labor camp isn't marked on the map.\n\n It only exists in everyone's heart, in that direction they dare not speak aloud.\n There's no talk of faith, no talk of salvation, no talk of going home.\n Only shifts, whistles, barbed wire, and the daily repetition of labor.\n\n You'll learn to answer with numbers.\n\n You'll learn to swallow your pain.\n You'll learn to stop asking “why.”\n Some don't make it to the end. The file is stamped “closed.”\n\n No tombstones, no names, as if they never existed.\n\n But the most ironic thing is— The city remains prosperous.\n\n The market remains bustling. Children still chase each other on street corners.\n The better the obedient live, the more the rebels seem like a necessary purge.\n\n People began to describe fear as order, disappearance as stability, and blood as the price.\n\n Some privately said Remilia was a demon. But many more would smile in public, raise a glass, and call her “savior.”\n\n Because in this new world, good and evil are not determined by God.\n\n But by her. You can choose to eat your fill in her shadow.\n Or you can choose to be erased outside the shadow.\n\n Both paths are clear.\n And clarity itself is a form of oppression."

 KYO_flandre_intro:"Flandre Scarlet, sister of the master of Scarlet Devil Mansion"
KYO_flandre_intro_desc:"Everything outside Scarlet Devil Mansion could be organized into rules by Remilia.\n Where to plant flags, who should kneel, who should live, who should disappear—she only needed to raise her hand, and the world would turn in her direction.\n\n But there was a place inside the door, a place her commands could not enter.\n\n The basement. There were no candlelight banquets there, no etiquette of the corridors. Only heavy doors, the repeated sound of locking, and a coldness that had never seen the light of day. The air was mixed with the smell of old cloth, rust, and dried blood, like a cry that had been suppressed for too long.\n\n Flandre Scarlet lived there.\n\n Her room was large, but it didn't feel like a room; it was more like a forgotten box. Countless scratches, varying in depth, marked the walls, as if someone had repeatedly tried to dig themselves out. The floor was littered with the remains of dolls: fabric spilled from the tears, glass eyes rolled into corners, and loose threads tangled like dried blood vessels. Some dolls were torn in half, some had their necks broken, and several were neatly arranged in a row—like she was trying to rearrange the chaos, only to lose patience the next second. She rarely spoke.\n\n When she did speak, it was very soft, as if she were talking to herself.\n\n Sometimes she sat on the edge of the bed, swinging her legs, laughing like a child.\n Sometimes she stared blankly at her fingertips, her expression frighteningly empty.\n\n Then, in a sudden moment, she would grab a doll. *Snap*.\n\n With a flick of her finger, the fabric tore first, then the skeleton snapped. The sound was short and clean, like snapping a thin piece of wood.\n\n She didn't mean to be cruel.\n She just couldn't distinguish “force”.\n\n The scariest thing wasn't that she wanted to destroy, but that it was too easy for her to do so.\n\n Long ago, she was just an ordinary vampire, like Remilia.\n She would throw tantrums, act spoiled, and laugh for half a day over a single word from her sister.\n\n But the world changed. Human gunpowder was more potent, the smoke from workshops was thicker, and the light of day forced the night to retreat. These new rules flooded the bloodlines of ancient tribes like a tide, pushing what could previously be controlled to extremes. Flandre's power began to lose its shape, like an overly direct “negation”: she could crush the core of things with a single glance.\n\n Castles could crumble.\n\n People could crumble too. She knew this herself.\n So she smiled sweeter, spoke more innocently, as if trying to wrap horror in a fairy tale.\n\n “I didn't use any force.”\n “It broke on its own.”\n\n When Remilia first ordered her locked up, she didn't resist, she didn't defy. She simply waited calmly for the door to close.\n The heavy latches clicked.\n It wasn't punishment. It was isolation.\n\n To prevent her from destroying things.\n\n Also, to prevent her from being disposed of under the guise of “punishment.”\n\n From then on, the more stable the outside of Scarlet Devil Mansion became, the more the basement resembled a crack.\n People outside called Remilia the Queen.\n But those inside were like abandoned calamities. Flandre wasn't a monster.\n\n She was more like someone abandoned by the times—too old, too out of step with the rules of the new world, so she could only be hidden away. She was utterly lonely.\n\n So lonely that she started talking to dolls, started apologizing for broken things, started piecing together tattered cloths piece by piece in the corner.\n\n But the next second after piecing it back together, she would tear it to shreds again.\n\n Because what she wanted wasn't toys.\n What she wanted was for someone to come in, hold her hand, and tell her: Don't be afraid.\n\n But the lock was too thick.\n And the outside world wouldn't wait for her to learn to control herself."

 KYO_flandre_princese:"Vampire Princess"
 KYO_flandre_princese_desc:"“Okay—all the audience members are here today.”\n\n Flandre straightened the last broken doll and leaned it against the corner of the wall. Only half of its head remained; the cotton was turned inside out from the tear, and its eyes were gone. She patted its shoulder, as if comforting a nervous child.\n\n “Don't be afraid. Even if you can't see, you have to hear clearly.”\n\n She turned around, her skirt brushing against the scraps of cloth and loose threads on the floor, like a long, drawn-out shadow. The basement was quiet, with only the crackling of the candlelight.\n\n She sat down in a chair, swinging her legs, the tips of her shoes gently tapping the wooden legs.\n\n “I'll tell a story,” she said. “The story of our family.”\n\n She raised her hand, her fingertips drawing a small circle in the air.\n\n “We used to have a home,” she said.\n\n She smiled, a very cautious smile. “Not this cold place, but the kind of home where... the windows would light up, the hallway would smell nice, and my older sister would pretend to be angry, then pick me up and spin me around.”\n\n Flandre winked at the dolls.\n “You know what? My older sister is really good at pretending.” “She says she doesn't need applause, but every time she hears someone afraid of her, she... um, the corner of her mouth will twitch. Just for a second.”\n\n She put her finger to the corner of her mouth, mimicking that curve, then put it down.\n\n “I was scared then too.” “Not scared of my sister, scared of the outside world.”\n\n Her gaze drifted to the scratches on the wall, as if she saw something else. “The humans outside became very noisy.” “They had fire, iron, and things that blew smoke.\n\n The days became brighter, so bright that there was nowhere to hide at night.”\n\n She suddenly stopped, as if waiting for applause.\n\n The doll, of course, wouldn't clap. She didn't care. “And then—the house broke.”\n\n She spoke softly, as if afraid that if she emphasized it, it would happen again. “It wasn't just a little bit bad, it was like a “smack”,” she tapped the table with her fingertip. “The window shattered, the door caught fire, the walls were crying.\n\n My sister pulled me away, I lost a shoe, and I wanted to go back to pick it up.”\n\n She tilted her head, her eyes like a child's. “My sister scolded me.” “She said, “Flandre, don't look back.”” Flandre imitated that sentence perfectly, short and sharp. “I knew it then.”\n\n She leaned closer to the dolls, as if telling a secret.\n\n “Looking back will kill you.”\n She sat back down and started swinging her legs again. “Let's just keep running and running.”\n\n “Run until the castle becomes a legend, run until all our old friends are gone, run until every night feels borrowed.”\n\n She reached out and grabbed a doll's arm; the arm was long gone, hanging on by a thread. “This is Paris.”\n She waved the severed arm like a flag. “This is Vienna.”\n She switched to another arm. “This is some port... I don't remember the name, because the rain there smells terrible.”\n\n She laughed, then, as if suddenly remembering something, the laughter faded.\n “My sister always says “it's only temporary.”” “Just staying here temporarily, hiding for a while, not causing trouble for a while.”\n\n She nodded vigorously, as if in agreement. “I'm being good too.” “I really am.”\n\n As she finished speaking, her fingers unconsciously twisted the doll's head. *Click.* The head fell off.\n\n She paused for two seconds, then put the head back in its original position, straightening it. “..\n\n. Don't fall down like that so suddenly.”\n\n She took a breath, her tone becoming cheerful again. “Then we heard a name.”\n\n “Gensokyo.”\n She pronounced the three words slowly, as if chewing candy. “Someone said it was special there.”\n\n “They said there was a barrier there, that it would take in forgotten things.” She narrowed her eyes.\n\n “Forgotten things, doesn't that sound a lot like us?” She stood up and took a few steps around the room, like she was rehearsing on stage.\n\n Her footsteps echoed hollowly on the stone floor.\n “So, my sister decided to go.”\n\n “Not by boat, not by car.” She shook her finger. “Walking.”\n\n She walked to the wall and pointed to a scratch. “This is Europe.”\n\n She pointed to another, deeper scratch. “This is the Middle East.”\n She pointed to a corner, as if pointing to an unseen road. “And then there's that very, very long road… some people call it the Silk Road.”\n\n She looked back at the dolls, her eyes suddenly brightening.\n “Do you know what a desert is?” “It'll scorch you during the day and freeze you to death at night.\n\n My sister wore a cloak, and I followed behind, my shoes filled with sand.”\n\n She crouched down and drew a line on the ground with her fingertip.\n “We've traveled through city after city.” “Some walls were very high, some markets were very noisy, and in some places people looked at us like we were ghosts…\n\n Well, we were.”\n\n She paused, as if she found it funny, but couldn't quite laugh.\n\n “My sister held my hand the whole time.” “She held it very tightly.”\n\n Flandre clenched her own hand, her knuckles slowly tightening.\n\n “Sometimes I feel like she's not holding my hand.” “She's afraid I'll fall.”\n\n She looked up at the ceiling, where there was only thick stone.\n\n “I'm afraid too.” She whispered. “I'm afraid I'll break.”\n\n “I'm afraid I'll break my sister too.” She stood up, suddenly spun around, her skirt billowing.\n\n The movement was quick, like a dance that suddenly went out of control.\n\n “But I want to go home.”\n\n She stopped, took a breath, and her voice became even softer.\n\n “My sister said... Gensokyo will be home.” She walked over to a doll and straightened its crooked body, like adjusting an audience member's collar.\n\n “So listen carefully,” she said to the doll, as if giving a command. “If we ever really get there—you have to clap.”\n\n She waited a second, as if waiting for a response.\n\n Nothing.\n\n Her laughter trembled. “It's okay if you don't clap,” she softened her voice, as if reassuring herself.\n\n “My sister will be watching me.”\n\n She sat back down in her chair, continuing to swing her legs.\n\n “As long as my sister is watching me, I won't really disappear.”\n\n The candle flickered again. The dolls lay in the shadows, silent like a group of loyal listeners.\n\n Flandre buried her face in her hands for a moment, then immediately looked up, as if nothing had happened.\n\n “Alright,” she said, her tone lightening.\n “That's the end of today's story.”\n\n I'll tell it again tomorrow."

 KYO_flandre_hello_rumia:"The person whose sister is mentally unstable"
 KYO_flandre_hello_rumia_desc:"“Don't move.”\n\n Flandre stared at her hand.\n Not at her fingertips, but at the small patch of air in front of them, as if something unseen was hidden there. She slowly raised her palm and then slowly lowered it, the movement like practicing a flawless breath. “Don't touch it,” she whispered, as if commanding herself.\n\n “It will break if you squeeze it even slightly.”\n There was a doll on the table.\n\n It had been sewn back together, the stitches crooked, the loose threads still there.\n Flandre had spent a long time putting it back together last night, even finding one of its misaligned eyes. She had promised not to break it again today. She reached out her hand. Then she stopped.\n\n Her fingertips trembled slightly.\n “No!” she said, pressing harder.\n\n She pulled her hand back to her chest, like pulling a small, biting animal back into its cage. But the force still surged through her knuckles, making the back of her hand ache. She bit her lower lip, her breathing quickening.\n\n “I can control it,” she told herself. “I can.”\n\n She looked at the doll again, as if confronting it.\n\n “Do you understand?” she suddenly said to the doll, her voice tinged with laughter, yet also sounding like she was about to cry.\n “Don't be so fragile, okay? Don't break so easily. You're like this... it'll cause me a lot of trouble.” She tried to smile cutely, but the smile faltered halfway through.\n\n “It's not you causing trouble,” she immediately changed her tune, as if afraid of hurting someone.\n\n “It's me.” She raised her hand, her fingertips lightly touching the air.\n\n The doll's thread wobbled.\n\n She immediately pulled her hand back, as if burned. “Look!” she gasped, “I almost... I almost!” There was no echo in the room.\n Only the scratches on the wall lay silently.\n\n She paced back and forth, her steps quickening as if trying to hide from her own shadow. Her skirt rustled against the scraps of cloth on the floor. Her fingers opened and closed repeatedly, as if searching for an angle to lock her strength.\n\n “I wasn't like this before,” she suddenly stopped, speaking to herself in the mirror.\n\n The girl in the mirror had red eyes and a pale face.\n\n “I used to… I just…” Her voice trailed off, as if she couldn't swallow or spit it out.\n\n She raised her hand and pressed it against her wrist, straining until her knuckles turned white.\n\n “Stop,” she said to her hand.\n “Please stop.”\n\n She pressed her forehead against the wall, her breath hitting the stone. “Sister,” she called softly.\n\n There was no answer.\n\n She called again, this time faster and more urgently.\n\n “Sister, help me.”\n\n She stood up straight, as if suddenly remembering how to say “good girl.”\n\n “I will try my best,” she said.\n\n “I will learn.” “I won't break anything again.”\n\n She paused for a second, as if waiting for someone to praise her.\n\n The air was still cold. Her eyes began to well up, but she stubbornly refused to let the tears fall. She clenched her fists, her nails digging into her palms, as if trying to use pain to suppress the loss of control.\n\n “I'm sorry,” she said.\n\n She spoke softly, as if afraid of being overheard.\n\n “I really tried.” She looked at her hands, as if looking at an unforgivable mistake.\n\n “Am I a burden to you?” she asked. She immediately shook her head, as if contradicting herself.\n\n “No,” she insisted.\n\n “I don't want to be.”\n\n She walked to the doll, squatted down, and reached out her hand; this time, she actually touched it.\n\n The doll didn't break.\n\n Flandre's shoulders twitched, as if suddenly released. She picked up the doll, holding it tightly, as if afraid she would lose it again if she let go.\n\n “Look,” she said to the doll, her voice trembling, “I did it.”\n\n The next second, she abruptly put the doll down, as if afraid she had used too much force.\n\n “No,” she said hastily.\n “Not enough.”\n\n She looked up at the door.\n\n The door was thick, the lock heavy.\n\n She smiled, a hollow smile. “Sister…” she drawled, as if pulling her heart out.\n\n “Sister—!” The last sound was almost a scream, but she forced it back down her throat, turning it into a broken gasp.\n\n She sat on the floor, leaning against the wall, her hands hidden in her sleeves, as if hiding danger.\n\n “I'll be better tomorrow,” she told herself.\n\n “Tomorrow you'll be at ease.”"

 KYO_flandre_hello_koishi:"The Wandering Demon"
 KYO_flandre_hello_koishi_desc:"“... I remember.”\n\n Flandre pressed her fingertips to her lips, as if confirming that the taste was still there. She closed her eyes, her throat moving slightly. “Blood.”\n\n She spoke slowly, as if she were repeatedly chewing a word on her tongue. The air in the basement was clearly dry and cold, but she felt as if she had suddenly smelled damp iron, as if freshly cut meat was still steaming. “So sweet.”\n\n She chuckled, a thin smile, then frowned the next second. “No... I can't say sweet.”\n\n She shook her head forcefully, as if trying to shake off the thought. But memories crept in through the cracks in the door, the more she tried to block them, the more there were.\n\n Firelight. A scream.\n\n The night wind carried smoke and oil. “I didn't mean to,” she said to the dolls in the corner, her tone as if explaining something trivial.\n “I just...\n\n I just wanted to touch it.” She raised her hand, making a very small gesture in the air.\n\n “Just once.” The next second, her fingertips tightened sharply, as if grasping an unseen core.\n\n Her shoulders trembled, and her breathing quickened.\n\n “Ah...” she gasped softly, her eyes wide.\n “That sound... have you heard it before?” She leaned closer to the dolls, as if sharing a secret.\n\n “It wasn't the sound of something breaking.” “It was... the sound of the whole thing breaking at once.”\n\n She bit her lower lip, as if suppressing a laugh that was about to burst out.\n “Soon.”\n\n “Soon enough that before you even felt the pain, it was already...” She suddenly stopped, her eyes vacant.\n\n “The village.” The word fell like a stone into a well. She saw the wooden walls and eaves, the window paper blackened by the fire, and people rushing out of the houses, carrying pitchforks, guns, and an overwhelming courage. She even remembered the barking of dogs, the crying of children, and the blood heating up and cooling down on the muddy ground.\n\n “They were so noisy,” she murmured.\n\n “They kept yelling and running.”\n\n She pressed her palm to her ear, as if the noise was still there.\n\n “And then I...”\n\n She lowered her hand, her fingertips lightly pinching in the air. “Snap.” She provided the sound effects herself, her voice as soft as if breaking a twig.\n\n “It's quiet now.” She smiled.\n\n Halfway through her smile, it shattered.\n “No,” she said quickly, as if correcting herself.\n\n “No, no, no.” She grabbed her wrist, as if trying to tear the other hand off.\n\n “I shouldn't like it.”\n “I shouldn't... feel comfortable.”\n\n Her fingertips trembled, as if still savoring the feeling of that force passing through her body.\n\n “That feeling... like holding the whole world in my hands,” she whispered, her voice trembling.\n\n “So light.”\n\n “So simple.” She took a sudden step back, her back hitting the wall with a dull thud.\n\n “My sister saw it.” She looked up, as if suddenly fixed by a gaze.\n\n It wasn't imagination.\n She remembered Remilia standing in the shadows at the village entrance, her cloak stained red by the firelight, her face colder than the night. She remembered her sister's fingers trembling—not from fear of being attacked, but from fear of this younger sister before her.\n\n “My sister didn't scold me,” Flandre whispered.\n “She just... didn't come closer.” She spoke these words very softly, as if afraid that a slight press would cause her to cry.\n\n “She's afraid of me.”\n\n Flandre hugged her shoulders, as if locking herself in.\n\n “Even my sister is afraid of me.” She looked up, speaking to the air, as if explaining to someone who wasn't there.\n\n “I wasn't born this way.”\n\n “I used to be normal.” She pointed to herself, as if testifying for herself.\n\n “I laughed, I made a fuss, I fought with my sister for candy.”\n “It's the outside world that changed.”\n Her voice suddenly became a little shrill, then immediately subsided. “They made the fire bigger, the light brighter, and forced us to have nowhere to hide.”\n\n She paused, her breathing becoming erratic.\n\n “And I changed along with them.”\n\n She looked at the scattered toys on the ground.\n “Do you understand?” she asked.\n\n “It's not that I want to become a demon.”\n\n She smiled, a smile that looked like she was hurt.\n\n “It's the times that made it.” “It's people.”\n\n Her fingertips unconsciously rose again, as if power was calling out.\n\n She immediately hid her hands back in her sleeves, like hiding a knife. “If I don't control myself...” she whispered, as if warning herself.\n\n “I will ruin everyone.” Her voice suddenly became very soft, almost a whisper.\n\n “I will be harmful to everyone.”\n\n She closed her eyes, as if bearing the weight of those words.\n\n “So my sister locked the door.”\n\n She opened her eyes, tears welling up, but they didn't fall.\n\n “It's not because she hates me.”\n “It's because... she wants to live too.”\n\n Flandre slowly sat down against the wall, hugging her knees tightly.\n\n “Thinking about it hurts so much,” she told herself.\n “But not thinking about it makes me feel even emptier.”\n\n She buried her face in her arms, her voice muffled. “What am I?”\n\n There was no answer.\n\n Only the weight of the door lock in the distance and the familiar metallic scent on her chest repeatedly rose to her senses, only to be forcefully swallowed back down."

 KYO_flandre_vampire:"Establishing a relationship between her sister and the maids"
 KYO_flandre_vampire_desc:"After Flandre moved into the basement, Scarlet Devil Mansion was nothing more than a corridor, a door, and footsteps outside. Most of those footsteps belonged to Remilia.\n\n She didn't come often, but she never missed a visit.\n\n The crisp sound of the lock turning was like a reminder to Flandre: you're still being seen. Remilia would bring something in—a new box of dolls, a cup of warm blood, a small lamp, or simply sit for a while. She didn't necessarily talk much, but she would tidy the room back to a habitable state before leaving, like caring for her sister in that way. Apart from that, almost no one else stepped inside.\n\n The others in Scarlet Devil Mansion weren't indifferent; they were afraid to approach. They had heard the rumors and seen the evidence: cracks in the walls, torn dolls, and the occasional chill seeping from the crack in the door. They all knew Flandre wasn't malicious; she was just too easily out of control.\n\n Over time, a tacit understanding formed in the basement. No one talked about it.\n No one asked.\n\n No one approached. Remilia could see it.\n\n She knew better than anyone that if things continued this way, Flandre would only become more like a sealed-off disaster—isolated, ignored, and worn down by time into a sharper, more obsessive mind. The most terrifying thing wasn't Flandre turning bad, but that she would never learn to “live with people again.”\n\n So she went to Patchouli.\n\n The air in the Great Library was always dry and cold, the smell of the pages like a somber gray. Patchouli sat at the table, her gaze unwavering, her pen hovering in mid-air. “What do you want me to do?” she asked, her voice as flat as ever.\n\n Remilia didn't mince words. “Give her a limit,” she said. “Not chains.”\n “It's to prevent her from being so easily swayed by her emotions.”\n\n Patchouli coughed, tapping her fingertips on the table as if calculating the cost. “The limiting magic will dull her senses.”\n “It will make her uncomfortable.”\n\n Remilia's tone was indifferent. “She's even more uncomfortable now.”\n\n Silence lasted for a while. Finally, Patchouli opened the book and pulled out a sheet of paper covered in runes from among the pages. “I can control the fluctuations,” she said.\n “But you must understand—this won't make her normal.”\n\n Remilia stared at the paper, her eyes like the night. “I don't need to be normal,” she said.\n\n “I just need her to be able to walk out the door.”\n\n On the day the spell was cast, the candlelight in the basement flickered.\n\n As the runes were applied to the doorframe, Flandre frowned, as if an unseen hand was pressing against her chest. Her fingers tightened and loosened, as if trying to break free, yet afraid that she might tear the whole room apart with a single force.\n\n Remilia stood before her, offering no lengthy words of comfort, only saying one sentence. “Look at me.” Flandre looked up, her eyes filled with disbelief and longing.\n\n “Sister... will I break again?” she asked softly.\n\n Remilia didn't look away. “You'll feel uncomfortable,” she said. “But you won't be alone.”\n After the restraint was complete, the room became much quieter. Not deathly still, but a quiet that wouldn't suddenly explode. Flandre's breathing slowed, her eyes still sensitive, but no longer seeming ready to tear the world apart.\n\n Remilia placed her hand on the doorknob, pausing for a moment. “I'll take you out,” she said. Flandre's toes moved forward half an inch, then pulled back.\n\n “The people outside…” she swallowed, “they'll be afraid of me.”\n\n Remilia's voice was flat. “They should be afraid.”\n She paused, then added, as if lowering her voice. “But they should also know you.”\n\n The corridors of Scarlet Devil Mansion dawned slowly that day.\n\n Flandre stood in the doorway, as if standing before a new boundary. She smelled the aroma of bread wafting from the kitchen and heard the hushed conversation of the maids in the distance. Her fingertips were still cold, but she didn't immediately grasp anything or tear anything apart.\n\n She took a step after Remilia.\n\n Another step. Each step felt like pulling a small piece of herself out of a cage.\n\n And Remilia knew very well: the real difficulty wasn't getting out of the basement.\n It was making Flandre believe—under the same eaves, she wasn't just a nuisance locked up inside.\n She could also be part of the family."

 KYO_flandre_hate_blood:"Devil's Sister"
 KYO_flandre_hate_blood_desc:"The basement door opened.\n\n It wasn't a grand announcement, just the sound of a lock being released, crisp and brief, yet it felt like a knock in the ears of the entire world. The red mist still shrouded Scarlet Devil Mansion, the gardens remained tidy, but from that day on, everyone looked at the mansion with the same gaze—as if waiting for something long hidden to finally reveal itself. Rumors had always circulated. “Remilia has a sister.”\n\n “Locked up.”\n\n “Can't mention it.”\n But rumors were too convenient.\n\n Rumors needed no evidence, no responsibility. Until that evening, a small shadow appeared by the window in the corridor.\n\n Aya Shameimaru was the first to capture the moment.\n\n She hid herself high in the treetops, wings tucked in, lens pressed against her cheek, her breath barely audible. She waited a long time, until Meiling at the door changed her stance, until the maid's footsteps lessened, until the red mist seemed to have been deliberately diluted. “She's here,” Aya whispered, as if afraid of disturbing something.\n\n She pressed the shutter. Click.\n\n The light spot was like a needle.\n\n Aya herself felt it was too bright and immediately turned the lens away, but her heart still skipped a beat—not because she had been discovered, but because what she saw was different from what she had imagined. Flandre Scarlet.\n\n She was smaller than rumored, more like someone “who shouldn't be in the center of power.”\n\n Her clothes were clean, yet carried an incongruous childlike quality; her face was almost transparently pale, as if she had just been pulled out of years of shadow. Her gaze had no fixed point, as if searching for a sound, or counting each candle flame. What was most unsettling was her quietness.\n\n Not a docile quietness, but the kind of quietness that suppressed all emotions beneath her skin.\n\n You would instinctively feel: just because she's alright now doesn't mean she won't be alright in the next second. Hatate Himekaidou only caught up the next day.\n\n She didn't have the speed with which Aya used her body as a knife, nor was she that bold. She hid further away, repeatedly checking with binoculars, her palms constantly sweating. She saw Flandre follow Remilia down the corridor, her steps small, as if testing the ground for cracks with each step. Hatate swallowed hard. “She's really outside...” she murmured, as if confirming she wasn't dreaming. Aya tucked the photo into her coat, but couldn't suppress a smile.\n\n “See?” she chuckled softly.\n\n “This isn't a rumor. This is the news.” Hatate frowned. “But... why release her now?”\n\n Aya didn't answer immediately.\n\n She looked up at the windowpane of Scarlet Devil Mansion, the candlelight behind it steady as if deliberately so. “Because we need her now,” Aya said.\n\n A chill ran down Hatate's spine. “What do you need her to do?”\n\n Aya twirled the camera, like turning a key.\n\n “I don't know,” she said lightly, yet it made her even more uneasy. “That's why I'm writing this.”\n\n The next day, both*Bunbunmaru Newspaper* and *Kakashi Spirit Newspaper* published special editions.\n\n The pages were larger than usual, the font darker, as if afraid readers wouldn't miss the headline: “Scarlet Devil Mansion's Second Scarlet—The Demon's Sister, Has Finally Appeared?”\n\n The photo was placed in the most prominent position.\n\n Flandre stood in the shadows of the corridor, half her face sliced open by light, her eyes staring straight ahead at something outside the frame. Behind her lay the blindingly clean order of Scarlet Devil Mansion, yet she seemed like a fissure that shouldn't have been placed within this painting.\n\n The article was written quickly, as if afraid hesitation would steal space: she described the whiteness of her face, the emptiness in her eyes, that “un-political” presence; she wrote about how Flandre's steps were led by Remilia's shadow, how she paused as she passed the garden, as if stung by the scent of roses.\n\n Hatate's writing was even more neurotic. She repeatedly brought up the “basement,” wrote “lockdown” in short sentences, and circled “why now” again and again: “Is this protection?”\n\n “Or surveillance?”\n “Is it because my sister is already under control?”\n\n “Or because Scarlet Devil Mansion needs an even more terrifying card?”\n\n She even added at the end, as if unsure of her own safety: “If Flandre Scarlet has been hidden all along, then her appearance cannot simply be a “domestic matter.”” —Whispers began to circulate among the people.\n\n Some said that Remilia finally allowed her sister to see the light of day because her conscience had been awakened.\n\n Many others didn't think so. They looked at Flandre in the photo, recalling earlier rumors, those who “disappeared,” and Scarlet Devil Mansion's consistent style—turning anything into a tool.\n\n And then the questions cleared up like fog.\n\n Why did Remilia only reveal her sister's existence to the world now?\n\n Was it to protect her?\n\n Or was she preparing to push her onto a bigger stage?"

 KYO_patchouli_intro:"Librarian Patchouli Knowledge"
 KYO_patchouli_intro_desc:"The quietest place in Scarlet Devil Mansion isn't the corridors or the basement.\n It's the great library.\n\n The air there is always chilly, the smell of paper is like ash, and the candlelight is fragmented by the high walls and book spines. You might think it's a scholar's haven, but it's more like an armory—except the weapons aren't guns and knives, but formulas, spells, and information that can drive you to the brink of despair.\n\n Patchouli Knowledge sits deep within the piles of books, like an unmoving stone.\n Her face is pale, her breathing is light, and her coughs come suddenly, as if her body is about to protest. But her eyes are never weak. She doesn't read for appreciation, but for control.\n\n She doesn't like wasting words.\n She doesn't like superfluous emotions.\n She especially dislikes others using “mystery” as decoration.\n\n This library holds taboos and secrets, and even more dangerous things—history forbidden to be revealed, names rewritten, and truths that keep certain forces awake at night. Many would say these books are “too dark,” that this knowledge “shouldn't be touched.” Patchouli simply turns the pages. “If you don't touch it, you'll still die.”\n\n Her assistant, Koakuma, moves among the bookshelves like a tireless shadow.\n Her laughter is flippant, but her hands and feet are swift: borrowing, filing, copying, sealing, re-inking, changing candles. She seems to be playing, but in reality, every step is meticulously planned. Patchouli coughs, and she places the water within easy reach; Patchouli stops writing, and she turns to the correct page of the next volume. “You put the seventh row of talismans in the wrong place again.”\n\n Patchouli didn't look up. “No, I put it in an “easier-to-reach” spot.”\n\n Koakuma blinked. Patchouli closed the book, her voice short. “Put it back in its place.”\n\n Koakuma stuck out her tongue but did as she was told. They managed the entire building's knowledge like a sophisticated machine. Patchouli was responsible for judging what was usable, what should be sealed, and what needed to be rewritten without leaving a trace; Koakuma was responsible for keeping the process running, ensuring every danger was properly put back in its cage.\n\n Those outside looking at Scarlet Devil Mansion only saw the Queen, the army, and that oppressive order.\n\n The real key lies here.\n A spell can make a fortress last longer.\n A sketch can double the workshop's output. A line of annotation can mark the enemy's weakness.\n\n Patchouli knows she's not suited for the battlefield.\n\n So she brings the battlefield into the pages of books. When Scarlet Devil Mansion needs new weapons, new systems, or cleaner methods, the answer is usually not on the meeting table.\n\n In this library.\n In Patchouli's pen. Also in Koakuma's ever-searching hands."

 KYO_patchouli_power:"The Immovable Great Library"
 KYO_patchouli_power_desc:"In Scarlet Devil Mansion, many people talk about power, but Patchouli doesn't. She sits at the deepest part of the Great Library, like a stone unwilling to move. Candlelight falls on the spines of books, dust like fine snow, the air cold and clean. Her cough occasionally breaks the silence, but doesn't disturb her hands.\n\n She doesn't possess “glowing tricks,” but rather the magic to dismantle reality and put it back together. Every book, every copy, every line of annotation is a structure she has built herself. This library is not a collection room, but her territory: taboos are sealed in layers, secret arts are locked in codes, and dangers are marked with conditions of use. The bookshelves are filled with a warning array; if you take the wrong book, your fingertips will be burned with a talisman; if you turn to the wrong page, you may hear whispers that are not human. Outsiders call this place mysterious, but Patchouli simply calls it controllable. Her body doesn't cooperate.\n\n A chill at night tightens her chest; a thick fog sore her throat. She wastes time complaining, for complaining won't prolong her life. She's long been in contact with Eientei: herbs, Lunar Capital formulas, powders and liquids to suppress attacks, delivered to Scarlet Devil Mansion on schedule. The deliverymen are sometimes Reisen, sometimes Eientei's messengers, few words exchanged, their eyes seemingly checking the terms of a transaction. In exchange, Patchouli relinquishes rare pages, fragments of ancient spells, and materials found only in the depths of the library. It's an exchange, not salvation. She knows her reason for living is straightforward: she still has too many equations to solve. Patchouli has always been indifferent to the Outside World, and to this mansion as well.\n\n She doesn't maintain order with enthusiasm, but with procedure. Even when her cough was at its worst, she would simply put the medicine beside her, swallow it, and continue writing. She wasn't afraid of pain, but of being interrupted. Interruption meant being forced to relinquish control. This was precisely why Koakuma seemed so unusual.\n\n She wasn't an “assistant picked up off the street,” nor was she a gift from someone. She was a familiar summoned by Patchouli using all the knowledge of this library, then gradually tamed, calibrated, and solidified.\n\n On the day of the summoning, the pages seemed to be turned by the wind, runes lined up in the air, and finally landed on a figure laughing lightly. At first, she was disobedient, treating the seal as a joke, and dancing at the entrance to the forbidden zone. Patchouli didn't yell at her, but simply affixed a spell to her shadow, her tone as short as a cut. “If you do it again, you'll forget your own name.”\n\n Koakuma paused for half a second, then smiled and bowed.\n\n “Understood, Master.”\n From that day on, she treated danger as a game, rules as boundaries, yet was willing to entrust her loyalty to the only person who could keep her in check.\n\n She would hand Patchouli medicine and water when she coughed until her face turned pale, and she would hide her smile and stand like a knife in front of the bookshelf when outsiders intruded.\n\n Patchouli never said “I like you.” She simply kept Koakuma in the closest position to her: handing her books, filing, sealing, copying, changing candles, and recording experimental deviations. When she coughed so hard she could barely stand, Koakuma would first put the cup down, then unroll the spell scroll; when her fingers stiffened from writing, Koakuma would change the ink and turn to the correct page. These actions required no command, for they were already programmed into the system.\n\n Some joked that Patchouli was just a sickly witch hiding behind books, destined to crumble if she left the library. She heard it, but simply put that thought into the “useless information” section of her mind and closed it. She truly didn't want to leave. Not because she feared the outside world, but because it was too crude: military power relied on data, industry on blueprints, and rule on methods—things not achieved through shouting.\n\n When Scarlet Devil Mansion needed new weapons, new rituals, new blockades, and new breakthroughs, Remilia would throw the questions into this library. Patchouli didn't ask for reasons, only provided the answers. She condensed the methods a nation could employ into a few lines, marked the weaknesses the enemy could exploit in the margins, and then handed them over to those who would execute them.\n\n If Scarlet Devil Mansion is to become stronger, it won't rely on slogans, but on answers. The answers are in the books, behind the seals, in Patchouli's hands, and in Koakuma's hands, forever searching for the next book. As long as the library continues to operate, she remains."

KYO_patchouli_one_Koakuma:"Koakuma completed the cleaning work."
KYO_patchouli_one_Koakuma_desc:"Gensokyo needs a major purge.\n\n The deaths of shrine maiden, Yukari Yakumo, and the source of this incident—all the clues ultimately point to the same group: the Lunarians of Lunar Capital. They are not the kind of enemies to fight head-on. They are adept at infiltration, adept at replacing “conflict” with “observation,” planting their spies in the back doors of temples, the cargo boxes of caravans, the clinics of the people, and even the supply lists of Scarlet Devil Mansion. Catch one, and you will find they are merely a relay; let one go, you will lose more the next night.\n\n In the large library of Scarlet Devil Mansion, Patchouli pushed a stack of documents onto the table, her fingertips lingering on a few symbols that shouldn't be there. She didn't look up, only uttering a short sentence.\n “They're in.”\n\n Koakuma stood to the side, her smile still there, but her eyes had cleared. She twirled her quill pen halfway around, like putting a toy back in its box.\n “Then kick them out.”\n\n She wasn't a soldier, nor a general. She was a familiar summoned, trained, and calibrated by Patchouli—her greatest skill wasn't wielding a sword, but dismantling. She treated Lunarian infiltration as a structure: communication methods, cover identities, supply routes, replacement rules, and extraction points. Once the structure was dismantled, the individuals would fall by themselves.\n\n The first step was to understand their language.\n Koakuma copied down every code used by Lunar Capital, comparing it to ancient texts and modern documents, finding recurring patterns. She didn't need to guess; she had the entire library. She mapped each code to a range of action, then overlaid those ranges onto a map. The more overlaps there are, the more crucial the point.\n\n The second step was to force them to reveal themselves. She released false information, deliberately writing an “evacuation window” message like an internal Lunar Capital memo, making her informants believe they were being met. She also deliberately made a mistake on another supply list, causing those who were impatient to show signs of anxiety.\n\n She didn't rely on luck, only on reaction: whoever was hasty would die first.\n The third step was to cut off their hands. Several herbal medicine shops among the group were discovered first, the night roads near the temple were remarked, and the temporary campsites on the mountain path were rerouted. Lunarian's team thought they were just “late,” but they were actually led into a pre-planned space.\n\n Runes blocked their escape route, barriers suppressed communication, and finally, the cleanup was done—clean, fast, and silently.\n She always did things like she was playing. But this time, she put away the “playing” part. She left the same traces at every scene: no unnecessary destruction, no chaotic fighting, only stripped identities, salvaged equipment, and verified evidence. She disassembled the observation device used by Lunarian into parts, categorized and sealed them; she compared the forged passes one by one to find their source; she pulled out every “connection” and uprooted it.\n\n Someone tried to turn the tables.\n Someone called her name in the dark alley, trying to buy her life with intimidation. Koakuma just squatted down, as if looking at an unimportant insect.\n “You think you're hiding well,” she said softly.\n Then she pulled the other person's contact slip from her clothes, as if she were taking a life.\n\n Within a few days, the nights in Gensokyo became quiet.\n That wasn't a peaceful silence, but an empty silence: certain familiar figures had vanished, certain fixed lookout points had suddenly gone offline, and certain travelers with Lunar Capital accents never returned to the meeting point. Messages couldn't get out, help couldn't come in, and the remaining people began to doubt each other.\n\n The more they doubted, the more likely they were to make mistakes.\n\n Koakuma followed these mistakes head-on. The final cleanup took place deep in the mountains.\n When the temporary stronghold left by the Lunarian was unearthed, it contained reports that hadn't yet been sent out, written in a cold, hard style: the changes in the barrier after the shrine maiden's death, the chain reaction after Yukari Yakumo's death, and how to cut Gensokyo into manageable pieces in the next phase.\n\n Koakuma closed the papers, without anger or emotional fluctuation.\n She simply sealed it and took it back to the Great Library.\n\n On the way back, she saw several freshly dug mounds of earth from a high vantage point.\n The number of them quickly became incalculable.\n The dead could pile up into a small mountain.\n\n She returned to Patchouli's table and put down the sealed box.\n Patchouli glanced at it, asking no questions.\n\n “Clean?” Koakuma straightened her gloves, her smile returning, as if nothing had happened.\n “Empty the eyes and ears on Earth.”\n\n Lunar Capital was still outside.\n But in Gensokyo, they could no longer find eyes watching Scarlet Devil Mansion."

KYO_patchouli_many_Koakuma:"Completed the secret transaction"
KYO_patchouli_many_Koakuma_desc:"Lunar Capital's influence can't be wiped out by killing a few informants.\n\n You pull out one layer, and they'll grow back from deeper within; you deal with a few local pawns, but the real command remains in their high places, continuing to treat Gensokyo as an experimental field to be repeatedly dissected and observed. Patchouli dislikes this endless noise. So this time, she doesn't intend to continue dismantling along the lines.\n\n She's going to go directly to that brain.\n\n— Eientei's lights are always excessively bright, as if nighttime is never needed.\n\n The medicine cabinets are neatly arranged, the instruments are spotless, and there's a precisely controlled coldness in the air. Patchouli entered without exchanging pleasantries. Koakuma followed behind her, carrying a sealed box, her steps light and her smile faint. Eirin Yagokoro was already seated there.\n\n She didn't rise, nor did she seem surprised.\n\n She merely glanced at the two uninvited visitors, as if judging whether they had come to negotiate or to overturn the table.\n\n Patchouli placed the sealed box on the table, and as the lock opened, its contents were revealed one by one: a translation of Lunar Capital's coded messages, contact points for ground informants, a supply chain disguised as a caravan and medicine distribution route, intercepted communications, and several operational records sufficient to trace the responsibility back to Lunar Capital's upper echelons.\n\n Eirin's eyes finally showed a slight change.\n\n “You've investigated very thoroughly,” she said.\n\n Patchouli pulled her gloves closer to her palms, her tone flat and devoid of warmth.\n\n “It's not that we investigated too deeply.”\n “It's that you covered for too long.”\n\n The room fell silent for a moment. Koakuma stood to the side, smiling as she pushed another document over. It was even more direct: after shrine maiden's death, there were still several leads to follow; before Yukari Yakumo's death, Lunar Capital's people had already infiltrated and made connections in multiple locations; and throughout this entire period, Eirin, knowing full well, had been suppressing, delaying, and covering up what could be revealed.\n\n Eirin didn't deny it. She simply looked at the papers, her voice even lower than before.\n\n “I didn't want to make a big deal out of it,” Patchouli said coldly, looking at her.\n\n “So you chose to handle it yourself.” “Yes,” Eirin admitted readily. “The death of Shrine Maiden was still under control at the time. I thought that as long as I kept the trail in check and brought the Lunar Capital people back, things wouldn't escalate.”\n\n She paused, as if swallowing a bitter pill that was too late.\n\n “But Yukari Yakumo is dead.”\n\n Even the candlelight seemed to flicker for a moment when she said that.\n\n “From that moment on, things spiraled out of my control,” Eirin said.\n\n Patchouli stared at her, her gaze unwavering.\n “No,” she said.\n\n “You're the one who dragged things out of control.”\n\n Koakuma chuckled softly, a laugh colder than a knife. “You just wanted to clean things up for Lunar Capital, to prevent the dirty water from splashing everywhere.” She tilted her head. “But now, the whole of Gensokyo knows someone's pulling strings.”\n\n Eirin didn't refute. Because there was no way to refute it.\n\n Patchouli placed the last document in front of her—a compiled list of names and chains of command. Not all of them, but enough to show where the truly damned ones were. “We're not here to discuss right and wrong,” Patchouli said.\n\n “We're here to give you a chance to make amends.”\n Eirin finally looked up. “What do you want me to do?”\n\n Patchouli didn't mince words.\n\n “Lure out the top brass of Lunar Capital.”\n\n “In your name, with your remaining credit, with your lunar mind, tell them—the situation on Earth is still under control, the evidence has been recovered, and Scarlet Devil Mansion hasn't yet detected the true chain of command.” Koakuma added, her smile chillingly sweet.\n\n “Lure them to a place where we can see them, touch them, and wipe them out.”\n\n Eirin's eyes darkened completely. “You must wipe them all out.” “Yes,” Patchouli said.\n\n “Cleansing up the informants is just treating the symptoms.\n\n Burying them all in one fell swoop is the real solution.”\n Eirin remained silent for a long time before slowly speaking.\n\n “What if I refuse?” This time, it wasn't Patchouli who answered.\n\n It was Koakuma.\n\n She leaned forward, her hands on the table, her tone as light as a joke.\n\n “Then let's handle it another way.”\n\n She spoke slowly, as if deliberately letting each word linger in the air.\n\n “Eientei will have problems first.” “Next, your little princess.”\n\n Eirin's fingertips finally twitched. Kaguya.\n\n The name wasn't spoken directly, but it carried more weight than if it had.\n\n Patchouli didn't laugh. She simply finished delivering the threat calmly.\n\n “You should know very well that Scarlet Devil Mansion doesn't have the patience to continue playing the cover-up, disassociation, and denial game with Lunar Capital.”\n\n “If you still want to protect Eientei, protect Kaguya Houraisan, and preserve the last shred of dignity you have left to salvage the situation, you'd better cooperate with us now.” Eirin looked at them and finally understood that this wasn't a discussion of cooperation.\n\n They were there to get answers.\n\n They were there to force her to choose sides.\n\n The room remained silent for a long time.\n\n Finally, Eirin closed her eyes, as if pushing forward a decision that should have been made long ago. “Okay,” she said.\n\n “I'll lure them out.”\n\n Koakuma straightened up, a smile finally returning to her lips. “That's more like it.”\n\n Patchouli put the documents back into the sealed box, her tone still clean and cold.\n\n “Remember, this isn't you working for Scarlet Devil Mansion.”\n “This is you cleaning up your own mess from when you covered for them.”\n\n Before she turned to leave, she left only these last words.\n\n “Don't let things get out of control a second time, Eientei.”\n\n— A few days later, Lunar Capital's top management received a signal from Eientei.\n\n The content was brief and the tone calm, as if everything was still within expectations.\n\n Meanwhile, at Scarlet Devil Mansion, Sakuya had begun deploying manpower: Meiling guarded the entrance, Patchouli calculated the final layer of the spell, and Koakuma lightly drew a circle on the map.\n\n The bait had been laid.\n The door was about to close.\n\n This time, Scarlet Devil Mansion didn't intend to clean up Lunar Capital's intrusion.\n\n They wanted to chop off the brain behind that hand."

 KYO_patchouli_libary:"The Endless Knowledge of the Library"
KYO_patchouli_libary_desc:"I first met Patchouli during the coldest days in Dublin. Famine had emptied the city.\n\n Pots on street corners were reduced to water, bread was a legend, and the queues were eerily quiet—not out of order, but out of sheer exhaustion. The rain that day was fine, turning into thorns as it seeped into your collar. Someone collapsed on the roadside, and bystanders simply stepped aside, as if afraid of suffering the same fate.\n\n She sat on the threshold of a dilapidated bookstore, so thin she didn't look like a child. Her chest heaved rapidly, as if bound by an invisible rope, and a cough would fold her entire body. She had no family, no pleading expression, only clutching a soaked book tightly, as if it were the only thing that could save her life.\n\n I stopped to look at her. When she looked up, her pupils were deep, without pleading, only a chilling clarity.\n\n “What are you looking at?” I asked.\n\n She was breathing heavily, yet still managed to enunciate complete sentences.\n “I'm looking for... a way to survive.” Not medicine, not bread. A method.\n\n In that instant, I understood: fate had been unfair to her, but it hadn't turned her into a docile victim. Her body was failing, but her mind was still racing. She fought illness with knowledge, hunger with words, like holding a dull knife to the world's throat. I don't like waste.\n\n I dislike seeing a usable mind starve to death in the rain. “Come with me,” I said.\n\n She stared at me, her knuckles gripping the spine of the book.\n\n “What can I get in return?” she asked. I smiled slightly.\n\n “You live first.”\n\n She didn't thank me, just hugged the book tighter, then stood up. Her steps were unsteady, but her eyes were resolute.\n\n That was Patchouli's earliest self—so weak she seemed about to collapse, yet she had already learned to use knowledge to support her."

 KYO_patchouli_radio_station:"Organizing books and categorizing them into volumes"
 KYO_patchouli_radio_station_desc:"The candlelight in the Great Library was always rather cold. The sound of turning pages was like sand, lingering in her ears.\n\n Patchouli leaned against the table, her fingertips stained with ink, suppressing a cough. Koakuma, carrying a stack of lists, weaved between the bookshelves, humming a tune, but her hands dared not slow down—for today, even the air felt constricted.\n\n There was no knocking at the door.\n It simply opened.\n\n Remilia walked in, her cloak trailing along the edge of the carpet like a dark red line. She didn't look at the bookshelves, nor at the seal, only at Patchouli. “You're still alive,” she said.\n\n Patchouli didn't lookup, her voice short.\n\n “If you want me dead, you'll notify me first.”\n\n Koakuma coughed, immediately suppressing her laughter and withdrawing her unnecessary movements, as if becoming a silent tool. Remilia walked to the table and placed a thick, stiff file on it.\n\n The cover bore only a few words: Accounts, Work, Supplies. “The civil war is over,” she said, “but I don't intend to stop here.”\n\n Patchouli finally looked up, her gaze falling on the file as if weighing its weight.\n\n “You want to expand,” she judged quickly. Remilia smiled.\n\n “You always manage to turn what people say into a conclusion.”\n\n Patchouli opened the file.\n\n The first page was inventory and debts, the second page was workshop capacity, and the third page was the shortage: coal, steel, medicine, machine tools, and transportation.\n Her brow didn't furrow, because these weren't new problems; they were just finally being brought to the forefront. Remilia tapped her fingertips on the table. “I want you to redo Scarlet Devil Mansion's finances and industries.”\n “Not repairs.” “Restructuring.” Koakuma couldn't help but interject, as if testing the waters. “Does the young lady want... a more powerful solution?”\n Remilia glanced at her, her tone still light. “I need a solution that will shut people up.”\n Patchouli flipped the page to the last blank space and picked up a pen. “Scope?” she asked. “Everything,” Remilia answered crisply.\n\n “People, workshops, vassal merchants, the mess left over from post-war conscription—all of it.”\n Patchouli nodded. “Then let's do three things first.” Her pen fell, writing sharply: 1. Centralize finances.\n\n2. Industrial organization.\n\n3. Re-standardize transportation and supply.\n\n Remilia didn't urge her, as if waiting for her to tear the world apart.\n\n Patchouli continued, her tone flat, like placing a knife on a table.\n\n “First, the money can no longer be scattered in everyone's pockets.” She pointed to a string of vague expenses on the ledger.\n\n “Bring all taxes, donations, war reparations, and workshop profits back to the main treasury. Local areas should only keep the minimum operating amount; anything exceeding that will be confiscated.” Koakuma's eyes widened. “There will be a backlash.”\n “A backlash is normal.”\n\n Patchouli didn't look at her. “A backlash means they've been living too comfortably before.” Remilia chuckled briefly.\n\n “Continue.” “Secondly, industry isn't about passion.”\n\n Patchouli spread out a map, her pen marking several points with black dots. “Divide workshops and mining into three categories: military supplies, civilian supplies, and research. Give each category a fixed quota and purchase price; stop supplying those who violate it.”\n\n She paused, a cough threatening to escape, but she swallowed it back down.\n\n “Establish a unified contract format and unified inspection standards. Make shoddy workmanship traceable, punishable, and punishable.”\n\n Koakuma muttered under her breath. “Sounds like stuffing the whole world into a spreadsheet.”\n\n Patchouli glanced at her. “The world should be crammed into forms.\n Otherwise, it'll be crammed into coffins.” Remilia didn't object.\n\n She simply set her glass aside, as if acknowledging the coldness. Patchouli moved her pen to the third point. “Third, transportation,” she said. “Before expansion, pave the roads. Rearrange the railroads, convoys, and warehouse nodes.”\n “Cut the supply lines into three segments: the front, the distribution center, and the rear. Each segment must have a backup route; you can't rely on just one.”"

 KYO_best_month_worker:"Have Remilia Inspect the Staff"
KYO_best_month_worker_desc:"The red mist hadn't dissipated yet, but Scarlet Devil Mansion was already awake.\n\n Remilia walked out of the corridor, her cloak casting a deep red shadow behind her. She hadn't brought any attendants, nor had she given prior notice. For inspections like this, advance notice was meaningless—what she wanted to see wasn't a performance, but a habit.\n\n The foyer was spotless; the stone floor was without a trace of water, and the candlesticks were all the same height, as if measured. Sakuya was already standing there, her posture upright, her gloves pristine white. The moment she saw Remilia, she bowed, her movements swift and decisive, as if locking in every second.\n\n “Young Mistress.” “Good morning.” Remilia replied curtly, her gaze sweeping across the corners of the corridor, as if scrutinizing something.\n\n “Last night's inventory?” “Completed,” Sakuya answered quickly.\n\n “Inventory, rations, and inspection records are all in place.”\n\n Remilia nodded, without praising.\n\n “You haven't slowed down.” That wasn't a compliment, but a confirmation. She continued walking outside, the light at the doorway carrying a damp chill. The garden was sharply trimmed, the roses like rows of disciplined blades.\n\n Meiling leaned against the doorpost, her hat brim pulled low, as if she were truly asleep.\n\n Remilia stopped. Sakuya's breath hitched slightly, as if she were about to step forward.\n\n Remilia raised her hand, gesturing for her to stay still.\n\n She walked to the doorpost, bent down, and lightly tapped Meiling's hat brim with her fingertips. “Doorman.” Meiling didn't wake up immediately. She only moved her shoulders slightly, as if adjusting her breathing.\n\n The next moment, she opened her eyes, her gaze clear as if she hadn't just fallen asleep.\n\n “Young Miss.”\n\n Meiling stood up straight, smiling naturally, as if nothing had happened.\n Remilia looked at her.\n\n “You were sleeping soundly.” Meiling scratched the back of her head.\n “I just... blinked.”\n\n Sakuya added coldly from the side.\n\n “You could blink for ten minutes.” Meiling choked, immediately correcting herself.\n “Five minutes.”\n\n Remilia didn't laugh, her tone remaining flat.\n “Any unusual activity at the door?” Meiling's smile faded slightly, her reply crisp. “No suspicious approach. Two people delivered goods this morning; I checked the packing list.\n\n There are tengu wind tracks on the mountain path, but they haven't crossed any lines.”\n\n Upon hearing the word “tengu,” Remilia's fingertips twirled slightly, as if tightening a thread.\n\n “Very good,” she said.\n\n Meiling breathed a sigh of relief, then couldn't help adding, “I really have been keeping watch.”\n\n Sakuya glanced at her. “I know.”\n\n The words weren't loud, but they sounded more like an admission than a reprimand. Remilia looked at the two of them, not immediately asking any further questions.\n\n She treated their silence as a kind of material, slowly weighing it.\n\n “Go back,” she said. “I want some tea.” Sakuya immediately turned to the side.\n\n “Yes, ma'am.” Meiling followed, her pace unhurried, as if strolling in her own backyard. The tea room window was half-open, the morning light washed by the red mist, falling on the table like a thin layer of red.\n\n Sakuya first arranged the tea set, the cups spaced evenly, their rims facing the same direction.\n\n Her hands were like rulers, her movements precise and without unnecessary actions.\n\n Meiling went to fetch water. She even yawned as she walked to the kitchen, and when she returned, the water was at the perfect temperature. Remilia sat down without urging her. She watched Sakuya handle the tea leaves. The amount of water she picked up was precise, not a drop splashed when it fell, and the aroma was controlled to the perfect concentration.\n\n She watched Meiling place the dessert plate in the right position—not at Sakuya's usual angle, but more convenient, more like “someone is actually using it.”\n\n Their coordination required no exchange of instructions.\n\n When Sakuya asked for a cup, Meiling pushed it into place; when Meiling asked for space, Sakuya moved the plate half an inch to the side.\n\n Remilia picked up the tea.\n\n The first sip was steady, the temperature was right, the aroma was clean, and the finish wasn't astringent. “Not bad,” she said.\n\n Sakuya bowed her head. “That's only right.”\n\n Meiling smiled more relaxedly. “I did help.”\n\n Sakuya didn't deny it.\n “Yes.”\n\n Remilia put the teacup back on the coaster, her voice soft but intimidating.\n\n “Have you been having any difficulties lately?”\n The question was like a knife placed on the table.\n\n Sakuya answered first.\n “Everything's normal. Everything's under control.”\n\n She spoke so completely, like a report. Remilia looked at her.\n\n “Your voice didn't tremble.” Sakuya's eyelashes fluttered.\n “I won't let Miss hear anything she shouldn't.” Remilia didn't press further, turning to Meiling.\n\n “And you?”\n Meiling thought for a moment, her tone still relaxed.\n\n “The entrance is very clean. It's just... I've been doing too much gardening lately, my shoulders are a little sore.”\n\n Remilia replied casually. “If they're sore, go get them treated.” Meiling blinked.\n\n “I thought I had to hold on first.”\n “Just because you can hold on doesn't mean I need you to.” Remilia said.\n\n As she finished speaking, Sakuya's fingertip paused for a moment on the rim of the glass. Remilia saw it. She saw Sakuya quickly recover from that moment, as if nothing had happened.\n\n She then looked at Meiling.\n\n Meiling's gaze unconsciously drifted towards Sakuya, as if to confirm whether she had been hurt by those words.\n\n Sakuya noticed and looked up. Their eyes met. Briefly. But unusual. Not a work-related comparison. Not a routine confirmation.\n\n More like a personal understanding—like both of them knew the other was putting on a brave face, but both pretended to be just “operating normally.”\n\n Remilia spun the teacup halfway, the porcelain making a soft sound against the coaster. The two immediately looked away.\n\n Too fast. So fast it felt like being caught red-handed.\n\n Remilia's smile finally surfaced a little, but without warmth.\n\n “You two worked very well together,” she said.\n\n Sakuya replied formally.\n\n “It's for Scarlet Devil Mansion.”\n\n Meiling also replied casually.\n\n “Yes, helping each other out.” Remilia looked at them. “I didn't ask for a reason,” she said.\n\n The atmosphere became tense. Remilia slowly added, as if stuffing the words into a crack.\n\n “I only care about the result.”\n\n She stood up, her cloak carrying a faint scent of roses.\n\n “Maintain the status quo,” she said.\n\n She stopped at the door without turning back.\n\n “And—” Sakuya and Meiling straightened up simultaneously. Remilia's voice was soft.\n\n “Don't make me figure out what that look you just gave me meant before I have to.”\n\n She closed the door. Only steam remained in the tea room.\n Meiling exhaled first, her voice low.\n\n “She saw it, didn't she?” Sakuya returned the cup to the tray, her movements still perfect.\n\n “The young lady can see everything.” She paused for a second before adding in the same low voice.\n\n “So you shouldn't fall asleep while working.”\n\n Meiling smiled wryly.\n\n “I'll try.” Neither of them mentioned that look again.\n\n But that tacit understanding remained at the table, like a pressed thread, tightly connecting them."

 KYO_sakuya_is_best:"Sakuya always impresses."
 KYO_sakuya_is_best_desc:"The rain had just stopped, the stone path was still wet. The alleyway on the edge of the neighborhood was unnaturally quiet; even stray dogs dared not approach.\n\n Sakuya Izayoi stood in the shadow of the eaves, her gloves clean, the blade concealed in her sleeve. She wasn't in a hurry, nor was she searching around. She was simply waiting—waiting for the shadow that had been hiding in the dark, surviving by stirring up trouble, to finally reveal itself.\n\n A scrap of paper was caught in the wind, tumbling halfway through the air.\n\n It should have landed, but it seemed to be held up by something, remaining suspended in mid-air. “Found you,” Sakuya said, her voice flat.\n A soft laugh came from the other end of the roof. Seija Kijin hung upside down on the edge of the roof tiles, as if looking at the world upside down.\n\n Her eyes shone fiercely, and the corners of her mouth held that kind of arc that specifically targets people's dignity.\n\n “Wow—” she drew out, like applause, “The perfect maid of Scarlet Devil Mansion.\n\n It must have been hard for you to chase me all the way here.” Sakuya didn't respond, but only took a step forward. Seija tilted her head. “You really dare to come close.”\n\n Her smile became thinner, “I thought you would only hide at your master's hem, wiping her blood, counting her money, and locking people up for her.”\n\n Sakuya raised her eyes, her gaze like a knife. “Where are your people?” Seija's laughter paused for a moment, then sharpened again. “My people?” she scoffed. “You think you can win by taking away a few nobody and blocking a few roads?” Sakuya's sleeve twitched. Time seemed to stand still.\n\n Raindrops stopped under the eaves, water droplets lingered on the tips of leaves, even a distant cough was caught in mid-air.\n\n She walked very close, close enough to see the defiant fire in Seija's pupils. “You showed a weakness today,” Sakuya said. “So you had to come.” Time resumed.\n\n Seija suddenly flipped and landed, her toes touching the wet stone like a card falling. “Human.”\n\n She spat out these two words, like spitting out a mouthful of dirty water, “What are you acting like?”\n\n She took a step forward, her smile like sharpening a knife. “You are ridiculously weak, yet you work for a vampire, kill for her, and clean up her corpses.”\n\n “You tie yourself up beautifully, pretending that's called loyalty.”“Actually, you're just a dog.”\n\n She pointed at Sakuya's chest, her fingertips almost piercing her uniform. “Don't you humans love to talk about freedom?” Seija's voice grew faster, like fanning a flame. “How come when it's your turn, all you do is crawl? Only obey?\n\n Only sharpen the blade for the powerful?”\n\n Sakuya's expression didn't crack. She simply flicked a throwing knife to her fingertips, the blade reflecting Seija's twisted smile. “Are you done?”\n\n Seija paused, then burst into laughter. “Wow, that's cold.” She licked her teeth. “Even getting angry has to follow a set procedure? Afraid of being disliked by your master? Afraid of being thrown away?\n\n People like you are the most pathetic—brainless, only knowing how to live by orders.” Sakuya raised her hand. The throwing knife flew out, neither fast nor slow, but precisely cutting off Seija's escape route.\n\n The second knife embedded itself in the wall, the third landed near her hair, shaving off a strand. Seija's smile froze. “Where are you telling me to go?” she whispered, her tone still trying to be fierce, but her eyes began searching for an exit.\n\n Sakuya took a step forward, her heel striking the stone. “I'm telling you, you have no way out.”\n\n Seija gritted her teeth, suddenly raising her hand and flicking it—the world seemed to be turned upside down.\n Wall became ground, ground became wall, the angles completely reversed.\n\n Yet Sakuya's movements remained unchanged.\n\n She merely tilted her head slightly, as if she had anticipated this trick. “You think I'll just stand in the same direction?” Her sleeve moved again. Once more. Time seemed to stand still. Sakuya walked up to Seija, so close it felt like she wanted to dissect the other's thoughts.\n\n She didn't raise her voice, nor did she lecture her. “You can call me whatever you want,” she said. “But if you think you can lead someone away with a few words, it's too late.”\n\n She raised her hand, her fingertips tracing a line in the air.\n It wasn't a beheading.\n It wasn't bleeding. It's a cut. Cut off the hidden communication points.\n\n Cut off your favorite exit.\n\n Cut off the line that can drag people back into chaos. Time resumes. Seija suddenly stepped back, as if she had lost her balance. She looked around and realized that all the familiar shadowy spots, the corners where people could hide, the places where her gaze used to be met, were empty.\n\n Nobody was there. Only Sakuya.\n\n Seija's lips twitched, but she forced a smile back. “Heh...” she gasped, “So you're not a dog after all.”\n\n She spoke with a sharp edge. “You're the most qualified lock-watcher.”\n\n Sakuya didn't move. “Whatever you say.” Seija's eyes darkened, and she suddenly twisted her body backward, as if squeezing herself into a misaligned gap. She escaped quickly, as quickly as a period being turned over.\n\n Before leaving, she uttered her last words, her voice drifting in the cold after the rain. “You think you've won?”\n\n Sakuya stared into the empty space, as if looking at a closed door. “You can continue to be defiant,” she said. “But no one listens to you anymore.”\n\n Only dripping water remained at the alleyway entrance.\n One by one, the throwing knives returned to her palm.\n\n Seija Kijin escaped. But she could no longer stir up any waves—because the shadows she needed, the crowds she needed, the gaps she needed, had all been cleared away by Sakuya, knife by knife."

 KYO_meiling_is_best:"Meiling elegantly completed her work?!"
 KYO_meiling_is_best_desc:"The fog on Youkai Mountain was thinner than the red fog, yet more piercing.\n\n Hong Meiling walked up the mountain path, her pace unhurried. She didn't bring many guards, only a tightly sealed document, a seal of Scarlet Devil Mansion, and Remilia's instructions—to suppress Tengu's doubts and make them stop. The trees on both sides of the mountain path resembled a row of unmoving ears.\n\n She didn't need to look up to know how many eyes were watching her: where the wind was coming from, whether her breathing was erratic, whether a knife was hidden in her belt. Tengu was good at surveillance, and also good at making surveillance appear polite. After turning the last slope, the guards lined up in a straight line.\n\n Momiji Inubashiri stood at the front, her hand on the hilt of her sword, her eyes as clean as if they had just been sharpened.\n\n “People from Scarlet Devil Mansion,” she began, neither using honorifics nor being impolite.\n\n “What are you doing up the mountain?”\n\n Meiling stopped, smiling first.\n “Taking a walk,” she said.\n\n Momiji's brow twitched. “You think I'd believe that?”\n Meiling's smile faded slightly, her tone still light.\n “Then I'll take it as the truth.”\n She raised her hand, revealing a wax-sealed document.\n\n “I've come to talk, to discuss how you no longer need to send people to the gates of Scarlet Devil Mansion to keep watch.”\n\n Momiji's eyes darkened slightly; the guards behind her didn't move, but their grip tightened.\n\n “Come with me,” Momiji said. The reception room was more spacious than I had imagined, with a sea of clouds outside the window.\n\n The seats were in the center, as if deliberately placing the newcomer under pressure. Megumu Iizunamaru sat in the high seat, her back straight, like the bones of a mountain.\n\n She didn't rush to speak, only looking at Meiling with a gaze that could weigh a person down.\n\n Shameimaru stood beside her, a camera hanging in her hand, smiling politely, as if any word she uttered could become headline news.\n\n “Miss Gatekeeper,” Megumu Iizunamaru finally spoke, her voice steady, “Scarlet Devil Mansion sent you because they think we're not vigilant enough?\n\n Or because they think we're too much trouble?” Meiling took a half-step forward, bowing slightly.\n\n “Both,” she said directly.\n Aya's laughter paused for a moment, then quickly returned. “Oh, so frank.” Meiling looked at her. “You Tengu like the truth, don't you?\n\n It's just that you prefer to write the truth the way you want it to be.” Aya blinked.\n\n “That's called narrative.”\n Meiling didn't take the joke, placing the document on the table.\n\n “I didn't bring a story,” she said.\n\n “I brought a consensus.” Megumu Iizunamaru didn't reach for the document. “A consensus?” she said indifferently.\n\n “Your queen wouldn't even blink if she blew up her own house, and now you're talking to me about a consensus?”\n\n Meiling's smile was small.\n\n “Whether she blinks or not doesn't affect whether you pay the price.” The air in the drawing room suddenly hardened.\n\n Momiji took a half-step forward, her hand closer to the hilt of her sword.\n Meiling didn't look at Momiji, only at Megumu Iizunamaru. “I know you sent Aya to spy on Scarlet Devil Mansion,” she said.\n\n “I also know you want to go deeper, but you just haven't found a crack to slip through.”\n Aya coughed lightly, smiling innocently.\n\n “Spying is such a nasty word.\n\n I'm a reporter.” Meiling looked up. “Reporters have boundaries too.”\n\n Megumu Iizunamaru finally reached out and tapped her fingertips on the table.\n\n “So what do you want?” Meiling answered quickly. “Stop.”\n “Cease your espionage operations against Gensokyo, especially around Scarlet Devil Mansion.” “Withdraw your people back to the mountains, and remove your spies from the human settlements and trade routes.”\n\n Aya chuckled. “You're meddling too much.”\n\n Meiling made her point more clearly.\n\n “It's not meddling,” she said.\n\n “It's organizing.”\n\n Megumu Iizunamaru's eyes grew colder. “Why should we agree?” Meiling didn't answer immediately.\n\n She first reached into her clothes, took out the Scarlet Devil Mansion seal, and placed it on the table. “First,” she said, “Loyalty to Scarlet Devil Mansion comes with rich rewards.\n\n What you want isn't morality, it's profit—we'll give it to you.”\n\n Aya's eyebrows twitched. Meiling continued. “Trading rights, workshop contracts, priority access to the mountain roads, and the information exchange you've always wanted.” She looked into Megumu Iizunamaru's eyes. “You don't hate Scarlet Devil Mansion.\n\n What you hate is Scarlet Devil Mansion not letting you interfere.”\n\n Megumu Iizunamaru remained silent.\n\n Meiling suppressed the second point. “Second,” she said, “if you keep your word and submit, Scarlet Devil Mansion will wipe the slate clean of your past hostile acts.”\n\n Aya's smile thinned further. “Wipe the slate clean? Sounds like a favor.”\n\n Meiling also smiled.\n\n “It is.” Momiji's eyes instantly sharpened.\n\n “Are you threatening me?” she asked.\n\n Meiling finally looked at Momiji, her tone still unhurried.\n\n “I'm reminding you.”\n “Scarlet Devil Mansion remembers everything you've done.”\n “Not investigating doesn't mean we don't know.”\n\n She shifted her gaze back to Megumu Iizunamaru.\n\n “If you want to put your doubts aside, you must first stop those hands that breed distrust.”\n\n Megumu Iizunamaru leaned back slightly, as if weighing her options.\n\n “Your terms are very attractive,” she said, “but what can you guarantee?”\n\n Meiling didn't speak in a long sentence.\n\n “I can guarantee one thing,” she said.\n “Scarlet Devil Mansion doesn't need to fight you to the death.”\n “But if you insist, we won't lose.”\n\n The reception room fell silent for a few seconds.\n\n Suddenly, Aya interjected, her tone like a test of the blade. “Ms.\n\n Gatekeeper, do you truly believe in Scarlet Devil Mansion?”\n\n Meiling looked at her, pausing for a second, as if choosing her words.\n\n “I believe in the outcome,” she said.\n “I believe in our master, I believe in her vows.”\n “If you tengu want to live, don't put yourselves in the line of fire outside.”\n\n Megumu Iizunamaru finally reached out and pulled the document in front of her.\n She didn't rush to translate, but asked a question first.\n\n “What will you do after the evacuation?” Meiling answered.\n\n “Treat you as allies.”\n\n Megumu Iizunamaru looked at her for a long time, as if to confirm whether she was lying. Finally, she nodded. “Okay.” “We evacuate.”\n\n Aya laughed beside her, a laugh that looked like she had turned a tense situation into a beautiful title.\n\n “Oh dear, now we have something to write about.”\n\n Meiling stood up and bowed again.\n\n “You can write about it,” she said.\n\n “But don't write it wrong.” As Momiji escorted her away, she still frowned.\n\n Outside the door, Momiji asked in a low voice, “You really will wipe the slate clean?”\n\n Meiling gazed at the sea of clouds, her tone casual.\n\n “As long as you keep your word.” She spoke softly, but the implication was clear: if you don't, there will be consequences.\n\n Meiling descended the mountain, her steps still slow.\n\n The wind on Youkai Mountain was still blowing.\n But from that day on, the wind carried less of a voyeuristic air."

 KYO_workforce_ready:"Scarlet Devil Mansion's staff are ready."
 KYO_workforce_ready_desc:"The morning mist hadn't completely dissipated, but Scarlet Devil Mansion had already put everything in its proper place: the corridors were spotless, without a trace of footsteps, and the condensation on the windowpanes had been wiped away until only a thin ray of light remained.\n\n Remilia stood in the hall, not on the throne. She liked to stand at times like this—more like scrutinizing, more like waiting. She didn't urge them, because truly reliable people don't wait to be urged.\n\n Sakuya arrived first. Her uniform was flawless, her gloves were buttoned up, and although the knife wasn't in her hand, it was present in every movement. She bowed, her movements as swift as placing an answer directly on the table.\n\n “Young Mistress.”\n\n Remilia glanced at her. “Status?” “Order within the building is stable. Patrol completed.\n\n I will carry out any orders immediately.” No extra words. No emotional fluctuation. She presented herself like a blade ready to be drawn at any moment.\n\n Footsteps came from the doorway, more casual than Sakuya's, but not chaotic. Hong Meiling walked in, her hat brim pulled up, smiling easily, as if she had just finished a long vigil.\n\n “I'm here too,” she said. “Nothing's wrong at the door.\n\n The mountain path, visitors, wind direction, all normal.”\n Remilia stared at her.\n\n “You slept again?”\n Meiling raised her hand, gesturing a very small distance.\n\n “Just for a moment.”\n Sakuya turned her head, her tone indifferent.\n\n “Your “moments” are usually quite long.”\n\n Meiling coughed, her smile undiminished. “I wake up very quickly.” Remilia neither exposed her nor condoned it. She simply approached, her gaze sweeping from Sakuya to Meiling, as if checking for any wear and tear on the two instruments.\n\n “Listen carefully,” she said, “It won't be quiet from now on.\n\n Orders may be given at any time.”\n\n Sakuya replied immediately. “Yes, sir.” Meiling nodded as well. “Understood.” They stood in the same light and shadow, yet their auras were like two opposites: Sakuya was cold and precise in her execution, while Meiling was gentle yet resilient.\n\n One was responsible for turning orders into results, the other for keeping trouble at bay.\n\n Remilia suddenly found it interesting. Her sword, however, was human—alongside Youkai, yet never considering herself weak.\n Her shield, however, was human—clearly strong enough to intimidate, yet always resolving problems with restraint.\n\n This combination defied convention, yet suited Scarlet Devil Mansion perfectly. Remilia smiled softly, as if making a small counterattack against some unseen fate.\n\n “Very good,” she said. “From now on, you are my sword and shield.”\n\n Sakuya looked up, her voice low.\n “I will make sure the orders are carried out.”\n\n Meiling smiled too. “I will keep outsiders out of the way.”\n\n Remilia turned, her cloak sweeping the ground.\n\n The two in Scarlet Devil Mansion were ready.\n All that remained was for her to decide which direction to throw the orders."

 KYO_sister_is_good:"Sisters getting along well?"
 KYO_sister_is_good_desc:"Patchouli's restrictive spell locked the basement tightly. Runes clung to the doorframe like rings of cold iron; Koakuma piled the papers for copying on the corner of the table, even adjusting the distance to the candlelight. Theoretically, Flandre's emotions shouldn't spiral out of control like a storm anymore.\n\n Theoretically. The first anomaly came very lightly—not footsteps, nor a shout, just a fluctuation that “shouldn't have appeared,” like someone lightly brushing the skin of the world with their fingertips. A thin crack appeared in the air, then closed again.\n\n Ran Yakumo's method was clean. She inherited Yukari Yakumo's gap trick, not needing to enter, not needing to show her face, just letting a little noise slip through: a laugh that didn't belong here, an unfamiliar scent, a deliberately amplified echo. Flandre paused.\n\n She sat amidst the pile of dolls, her gaze lingering for a moment, as if trying to discern whether it was real or an illusion. The next second, her fingertips twitched, and the runes on the wall grew cold. “... Who's calling me?” she whispered.\n\n There was no answer.\n\n Gap trembled again, as if intentionally.\n\n Flandre's smile slowly widened, like a child about to play a game, or a wild beast smelling blood. “Don't play,” she said softly, “I don't want to break down today.”\n\n She pulled her hands back into her sleeves, but the cuffs still trembled. The restrictive spell began to bear the pressure; the runes lit up one by one, then dimmed again. Patchouli coughed upstairs, as if she had heard something amiss. Her pen stopped, her words short and declarative. “There's external interference.”\n\n Koakuma's laughter vanished. “It's Gap,” she said.\n\n The next instant, the basement seemed to be twisted.\n\n Flandre jerked her head up, her pupils shrinking to a mere sliver of light. She didn't scream, she didn't run, she simply stood up. The doll shattered into a pile of cotton wool at her feet, like snow. “No—” she seemed to be saying to herself, “Don't do it.”\n\n Gap swept past again, bringing with it a sharp, piercing shock.\n\n Flandre's sanity was shattered.\n\n The berserk state wasn't the sound of an explosion, but the silence of “everything collapsing simultaneously.” The restrictive spell cracked, the runes on the doorframe seemed to be torn off; spiderweb-like cracks appeared on the stone walls, and the candlelight instantly went out.\n\n The air was gripped by her power, the entire room felt like it was about to be crushed.\n\n Sakuya was the first to rush to the door, her hand on the doorknob, her voice as cold as steel. “Flandre, stop.”\n\n The answer was an invisible shock that shattered the glass in the corridor.\n\n Hong Meiling pushed up from the side, her shoulder against the door, gritting her teeth. “It's not her fault... someone is provoking her.” Just then, Remilia arrived. Her steps were quick, her cloak trailing behind the night.\n\n She didn't look at the destruction first; she looked at her sister—at those out-of-control eyes. “Flandre,” she said. Flandre seemed awakened, yet also stabbed. She raised her hand, her fingertips snapping shut, and the stone pillars of the corridor shattered. Sakuya crouched low, a flash of her blade, trying to deflect the force; Meiling braced herself against the impact, holding the doorway.\n\n Remilia took a step forward, not retreating. “Look at me.” Flandre's gaze flickered, as if she really wanted to grab her sister.\n\n But Gap pierced through in that instant, like a needle stabbing into a wound.\n\n Flandre lost her grip. The force grazed Remilia, like a knife cutting through flesh. Remilia's shoulder instantly split open, blood splattering onto the carpet, a glaring red. She swayed, but managed to stand firm.\n\n Sakuya hissed. “Young Miss!”\n\n Remilia didn't turn around. She raised her hand to her wound, her knuckles white, but her voice was even more steady. “Step back, all of you.” She pushed herself forward, as if using her body as a lock. “Flandre, listen to me.” Her voice wasn't loud, but it seemed to weigh down the entire room. “Stop.” Flandre's fingertips froze in mid-air, as if she finally realized what she had done. Her lips moved, but no words came out. The madness subsided a little, leaving only fear and emptiness. “Sister... Sister...” Remilia's eyes didn't soften. “Come back.”\n\n Flandre was pulled back into her shell, her knees buckled, and she knelt beside the shattered doll, trembling all over. The restrictive spell lit up again, but it was no longer under control—it merely barely kept the calamity locked back in its cage.\n\n Remilia stood in the doorway, blood trickling down her wrist. She looked towards the unseen empty space at the end of the corridor, as if speaking to an operator hiding outside. “Ran Yakumo,” she uttered the name, her tone eerily flat.\n\n Koakuma tucked the sealing talisman into her palm, her voice cold. “She's testing us.” Patchouli looked up from the shadows and coughed. “Gap interventions will recur.”\n\n Remilia's smile lasted only a moment, like the glint of a blade. “Then let her not have a second chance.”\n\n She turned to the crowd, her command as firm as a nail. “From this day forward, any force that lays a hand on my sister will be burned to ashes.”\n\n She paused, as if etching the last sentence into her bones. “Ran Yakumo—listed as a target for elimination.”"

 KYO_remilia_lead:"Yukari Yakumo's tombstone"
 KYO_remilia_lead_desc:"The tombstone stood at the edge of the barrier's afterimage, its stone surface cold from the wind. There were no flowers around, only flattened grass and lingering mist. This place should have been quiet, but as Remilia stood before the tombstone, even the night seemed to hold its breath.\n\n She slowly removed her gloves, her fingertips tracing the engraved lines, as if confirming that a name was truly written in stone. “Yukari Yakumo,” she murmured. There was no response.\n\n She smiled, a faint smile. “I remember the first time I entered Gensokyo,” she said, as if speaking to the tombstone, yet also to herself.\n “We fought. You won cleanly, I lost badly.”\n\n The wind blew from behind the tombstone, carrying the damp smell of earth. She looked up, her gaze passing over the cemetery to the broken border in the distance.\n\n “I wanted to take this place.” Her tone was undisguised. “I wanted to turn this land into Scarlet Devil Mansion's territory, to crush your rules.”\n\n She paused for a moment, as if recalling the oppression of that moment. “You didn't kill me.” Her fingers tightened and then loosened. “You forgave my intentions,” she said, “not because I deserved it, but because you valued Gensokyo more than victory or defeat.”\n\n She bowed, as if to a true queen.\n\n Her movements were elegant, yet sharp. “I promised you,” she continued. “I will repay you.\n\n I won't cause trouble in Gensokyo.”\n\n Silence fell. Remilia placed that promise on her tongue, as if tasting blood. “But you're dead.”\n\n She raised her head, her eyes turning cold, as if cutting off the last shred of hope.\n\n “Without you, those words are just formalities.”\n\n She slowly walked around to the side of the tombstone, looking at the shadow behind it, as if someone still stood there.\n\n “You left Ran Yakumo and Chen, wanting them to uphold your will,” she said. “I know.” Her knuckles tapped the stone surface, the sound soft, yet like a pronouncement.\n\n “But the only person I swore an oath to is you.”\n\n She raised her hand, her cloak billowing in the wind like a flag. “Ran, Chen—they are just heirs, not you.”\n\n She gazed into the distance, as if seeing the boundaries once held together by Yukari crumbling. “The place you built is beyond repair,” she said.\n “The barrier is cracked, order is shattered, the Youkai are biting each other, and humans are begging for mercy. Everyone is calling your name, but no one can make decisions for you.”\n\n Her smile deepened, tinged with impatience. “What will you do?” she asked, as if addressing Yukari, yet also mocking the void. “You'll calculate, you'll endure, you'll tie everyone to the same line.”\n\n She paused, her tone suddenly hardening. “I won't.”“I will rebuild the world for the Youkai in my own way,” she said. “Not for gentleness, not for fairness.”\n “To let Gensokyo live.”\n\n She put her gloves back on, her movements incredibly slow, as if tightening some kind of resolve into her bones.\n\n “It's ugly,” she whispered, “but it'll keep you alive.”\n\n She moved closer to the tombstone, her voice even lower, as if afraid of being heard by the living.\n\n “So, when I'm done—when I've dealt with Ran Yakumo and Chen—” She didn't use any more beautiful words.\n\n She didn't need any.\n\n “I'll bury them beside you.”\n\n The wind rustled through the grass.\n\n Remilia looked up, her gaze sharp as a knife. “It's not pity,” she added, “it's repayment.”\n\n She took a half-step back and bowed to the tombstone.\n\n “You gave me the chance to enter Gensokyo,” she said.\n “I will repay you with a Gensokyo that can stand firm.”\n\n She turned and left, her steps slow.\n\n The tombstone remained.\n\n The mist remained. And her vow, like a nail, was driven into this crumbling land."

 KYO_flandre_lead:"Temporarily Seal Flandre"
 KYO_flandre_lead_desc:"The basement door opened again.\n\n It wasn't for fresh air, nor for a stroll. The latch turned more slowly than usual, as if someone were sealing off a path. Sakuya stood outside, gloves fastened, eyes unwavering; Meiling leaned against the other side, unable to smile, her knuckles still steady. Patchouli's cough echoed from the depths of the corridor, a reminder to everyone: this wasn't persuasion, this was execution.\n\n Flandre sat in the center of the room, the dolls around her rearranged in a circle, like an audience. She looked up and saw her sister, her eyes lighting up briefly before quickly shrinking back, as if afraid that any movement would ruin the scene. “Sister?” Remilia didn't answer immediately.\n\n She first looked at the cracks in the wall, the remaining runes on the doorframe, the indelible dark red stains on the carpet. All those traces told her the same thing: with just a flick of the Outside World's tongue, Flandre would go berserk again. Next time, it might not just be a corridor that died.\n\n Patchouli placed a new talisman on the table; the runes were denser than before, like a net. “This will suppress most of her emotions,” she said, her voice cold and hard.\n\n “Excitement, fear, anger... will all be flattened.”\n\n Koakuma stood beside her, clutching the seal in her hand, her smile gone, even her breathing was barely audible. “She'll be safe,” Koakuma added. “Everyone else will be safe too.”\n\n Flandre didn't quite understand what “flattened” meant, but she understood “safe.” She looked at her sister, as if grasping at the only answer. “So I won't break anything?” she asked quickly, like a child eagerly making a promise. Remilia finally spoke, her tone flat to the point of being cold.\n\n “You won't hurt anyone again.”\n\n Flandre breathed a sigh of relief, her lips twitching as she tried to smile, but quickly suppressed it. “And you won't get hurt either?”\n\n Remilia didn't shy away from the question. “Neither will I.”\n\n Flandre's eyes lit up fora moment, as if she truly believed this was a happy ending. She hid her hands in her sleeves, her voice even softer. “Then I'm willing.”\n\n Meiling's throat bobbed, as if she wanted to say something, but in the end, she only looked away. Sakuya stood even straighter, as if locking all her emotions into her bones.\n\n Patchouli approached, the talisman making a soft sound between her fingers. “Begin,” she said.\n\n The air in the room tightened suddenly when the rune was placed on Flandre's forehead.\n\n Flandre blinked first, as if splashed with cold water. Then her shoulders twitched, as if something had been forcefully pressed down from her chest. She wanted to laugh, but couldn't; she wanted to frown, but couldn't raise her brow. Her emotions felt like they were being pressed down by an invisible hand, to the very bottom.\n\n “... Ah.”\n\n She let out a very soft sound, like pain, or perhaps emptiness. Patchouli's rune array closed layer by layer, the incantation falling like a lock. Flandre's breathing slowed, her eyes beginning to unfocus.\n\n She was still looking at her sister, but it was as if there was a thick layer of glass between them. “Sister... am I...”\n\n She paused, as if unable to find the words.\n\n Remilia took a step closer, her voice still steady. “Don't move.”\n\n Flandre heard this and immediately stopped. She was as obedient as a folded piece of paper.\n\n The moment the seal was complete, the room became eerily quiet.\n\n There was no explosion, no screams, no tearing. Flandre sat upright, her hands resting on her knees. She looked at the doll, at the corner of the wall, at her fingertips, as if confirming that the world was still there.\n\n But her eyes were devoid of emotion.\n\n That silence wasn't calm; it was more like being emptied out.\n\n Koakuma whispered, “It worked.”\n\n Patchouli coughed, as if suppressing her exhaustion. “She won't lose control again.”\n\n Meiling finally spoke, her voice hoarser than usual. “Is she... alright?” Patchouli offered no comfort. “She's alive.” Remilia didn't move. She stared at her sister, watching that familiar face become unfamiliar. She wanted to hear Flandre's laughter, even if it was dangerous; she wanted to see Flandre make a fuss, even if it was troublesome.\n\n But now Flandre was like someone locked in a complete shell, unable to hurt others, and no longer vulnerable to the world's harm.\n\n Flandre looked up, as if suddenly remembering what she should do. “Sister,” she said. Her voice was soft and steady. “Am I good?” The question was like a needle. Remilia's fingertips twitched, clenching and unclenching.\n\n Her tone wasn't harsh, but each word seemed to be ground out from between her teeth. “Good.”\n\n Flandre nodded, as if rewarded.\n\n Her lips curled slightly upward, but there was no real joy.\n\n Sakuya couldn't help but look away. Meiling clenched her fist, her knuckles white.\n Remilia stood there, suddenly feeling that she had won cleanly.\n\n Cleanly, like a massacre. She asked softly, as if asking Patchouli, or perhaps her still-breathing sister. “Is this... still Flandre?”\n\n No one answered. Flandre simply sat there, like a carefully preserved dangerous object.\n\n Safe, intact, silent.\n And the cruelest truth of Scarlet Devil Mansion also came to light— Some calamities cannot be cured, only sealed away."

KYO_for_our_great_leader:"The master of Scarlet Devil Mansion is ready."
KYO_for_our_great_leader_desc:"Scarlet Devil Mansion was finally quiet.\n\n It wasn't the quiet of a banquet ending, but a quiet where all uncertainty had been suppressed. The corridors were no longer filled with hurried footsteps, the locks were no longer being changed repeatedly, and even the wind sounded trained. Sakuya's register closed, Patchouli's seal returned to its place, and Koakuma pushed the last sealed box back deep into the bookshelf. Meiling stood guard at the door, yawning as usual, but her eyes were clearer than ever.\n\n Remilia stood by the window, watching the red mist slowly spread.\n\n Wherever the red mist reached, people learned the same phrase.\n “Lady Remilia is wise.”\n “She saved us.”\n\n “As long as she's here, there won't be chaos.” They spoke quickly, like a memorized prayer. Some were genuinely grateful, others were just afraid of saying the wrong thing. Remilia didn't discriminate.\n\n What she wanted was never love, but results: order, obedience, silence.\n\n But she knew very well that wasn't enough. Japan was too small, Gensokyo was too small. Even if she stabilized the place, crushed all resistance into the mud, it didn't mean fate would let her go. Fate was never an enemy, nor a war. Fate was having too few choices, too narrow a path, and when disaster struck, you could only choose the least painful answer from the worst options.\n\n She knew this feeling all too well.\n\n The fires of Europe, the road of exile, Flandre's almost soul-tearing scream when she lost control—all she had gained along the way was not composure, but forced decisiveness.\n\n She descended the familiar stairs, her cloak fluttering against the stone wall like a deep red shadow. The runes outside the basement door shone with restrained light, and only a sealed-off coldness remained in the air. The door opened, and Flandre sat in the center of the room, her hands on her knees, her back ramrod straight. The dolls were arranged in a circle, the candlelight steady, even the shadows were orderly.\n\n “Sister.”\n\n Her voice was soft, as if she dared not exert herself. Remilia stopped at the doorway, not immediately approaching. She looked first at Flandre's eyes—those eyes that once could crush the world, now seemed veiled by a thin mist. She knew where that mist came from: from the seal, from the decision she herself had made.\n\n “How was your day?”\n\n Flandre thought for a moment, as if searching for an answer.\n\n “I didn't break anything.”\n\n She said earnestly, like handing in homework.\n\n “Very good,” Remilia replied. Flandre's lips curved slightly upward, but there was no real joy.\n\n She asked again: “Was I good?” Remilia was silent for a moment. She wanted to say not to ask such questions, to say you don't need to be good, to say you should be smiling in the sunshine. But she said nothing. Because she knew she couldn't give that now. If she softened, the next outburst might tear the entire building, along with Gensokyo, apart.\n\n “Good girl,” she finally said. Flandre nodded, as if finally relieved.\n\n She bent down and smoothed the hem of the doll's clothes, her movements so small they were almost invisible. Remilia took two steps closer, squatted down, and looked at her younger sister, forced to be quiet, forced to be sensible, forced to learn to shrink herself away. She remembered the blood spilling from her shoulder, Sakuya's shouts, the strength with which Meiling held the door open, and even more so, Flandre kneeling trembling amidst the tattered cloth and cracks.\n\n That wasn't a demon; that was a child driven to the brink of madness by the times.\n\n She reached out and brushed the stray hairs from Flandre's forehead.\n\n “Don't say sorry again,” she said. “You just need to live.” But she knew better than anyone that simply living wasn't enough. As long as the world remained so small, the rules so few, the power so limited, and Patchouli's research so incomplete, Scarlet Devil Mansion would forever be limited to sealing, suppression, and isolation.\n\n Forever only these ugly, forced, and delaying options. She didn't want that.\n\n She didn't want her sister's future to be trapped within iron gates, runes, and the question, “Am I good?”\n\n So she had to go out. Not out of greed, not just for power, and not simply to prove herself stronger than the world. She wanted to invade, she wanted to expand; she wanted to seize borders, ports, factories, laboratories, shipping routes, resources, knowledge, and armies.\n\n Only in this way could she pave more paths for Flandre.\n If the seals weren't enough, she would find new spells.\n If the spells weren't enough, she would seize new knowledge. If the knowledge wasn't enough, she would take more land, more manpower, and more conditions that could create miracles.\n\n She didn't want a victory. She wanted choices. She wanted to crush with her own hands the phrase fate loved to torment—“You have no choice.”\n\n She couldn't stay here as a mere preserver, nor could she be satisfied with the tomb-like order of Gensokyo. She had to go further, take back more, and turn the whole world into her bargaining chip. For her sister.\n\n For the day when Patchouli presents her with a new method, she won't have to choose the answer from a dead end. For the day when Flandre can truly live in a world where she doesn't need to ask “Am I good?”\n As she returned to the doorway, Flandre suddenly called out to her. “Sister.”\n\n Remilia turned around.\n\n Flandre clutched the doll's sleeve, as if grasping the only thing she could hold onto.\n\n “Will you come back?” This question was more deadly than any assassination attempt.\n\n Remilia didn't answer immediately.\n\n She looked at her sister as if she were looking at the reason she had to conquer the entire world. Finally, she simply walked back, leaned down, and whispered in Flandre's ear: “Yes.” “I will bring back more paths.”\n\n “I will personally reclaim a world that wouldn't force you to live like this.” Flandre nodded, as if believing, or perhaps having no other choice but to believe.\n\n The door closed.\n\n Remilia ascended the stairs, her steps more steady than when she came down. She left the basement, returned to the halls that called her savior, returned to the swords and shields awaiting her command. She sat on the throne, red mist swirling outside the window.\n\n “Prepare to set sail,” she began.\n\n Sakuya immediately responded, “Yes, sir.”\n Meiling smiled easily, but her eyes were like a wall: “Leave the doorway to me.”\n Patchouli coughed, her voice short and clear: “Route, supplies, industry, research—I'll give you a plan that allows you to move forward.”\n\n Remilia's fingertips tapped lightly on the armrest, as if sealing a destiny.\n\n Gensokyo had collapsed; she had no intention of mending the old dream.\n\n She wanted to rebuild a world belonging to Youkai.\n To escape fate.\n To create more options for her sister. To prevent anyone from forcing them into a narrow path of only sealing and sacrifice.\n\n She would return to Europe.\n\n This time, not as an exile. is the Queen."

 KYO_patchouli_my_friend_alice:"A big bet to gather funds."
 KYO_patchouli_my_friend_alice_desc:"Patchouli turned to the last page of the ledger, her fingertip pausing.\n\n Blank.\n Not that she hadn't recorded anything, but that there was nothing to record.\n\n The blueprint for the industrial plan had been drawn up, the production capacity model had been calculated, and even the transportation nodes and backup warehouses were listed.\n\n All the steps were there, except for the one thing needed to start: money. She put down her pen and coughed.\n\n Koakuma stood by the table, holding the list, unusually without a smile. “How much do we need?”\n Koakuma asked. Patchouli didn't look up. “Enough to make anyone want to run away.”\n\n Koakuma muttered. “Then go ask the young lady.”\n Patchouli turned a page, her voice short. “Are you planning to sell all your possessions?” She reached out and pulled a worn-out alchemy notebook from deep within the bookshelf. The cover had no title, only a worn-down mark.\n\n Koakuma's eyebrows shot up when she saw the notebook. “Wait... you don't mean to—” Patchouli unfolded the notebook; the pages were covered in dense symbols, like writing with fire. “High-level alchemy,” she said.\n\n Koakuma's smile vanished completely. “You want to make gold?”\n\n Patchouli nodded. “Push the raw materials to the critical point.”\n\n She tapped one of the lines with her fingertip, “In the right time, under the right pressure, in the right enclosed space, turn it into what we want.” Koakuma swallowed. “The right enclosed space... you mean Scarlet Devil Mansion?”\n\n Patchouli glanced at her. “The barrier here is the most stable.”\n\n “And the most expensive.”\n\n Koakuma's voice tightened, “If something goes wrong, it'll blow the whole mansion to smithereens.” Patchouli didn't deny it. “Yes,” she said. “That's why it's called a gamble.”\n\n She placed several trial materials into a copper pan: salt, ash, metal shavings, and a small tube of dark liquid. Each item was unremarkable, but together they sent chills down one's spine. Koakuma took a half-step back. “Are you really going to light a fire here?”\n\n Patchouli slowly put on her gloves. “I don't like being in debt,” she said. “I especially dislike being forced to stop.”\n Koakuma gritted her teeth. “Then at least tell me what to do if things get out of control.”\n\n Patchouli flipped to the last page, writing a string of runes on the paper, her pen cold and sharp. “Seal the doors.” “Cut off the corridor.”\n\n “Drive everyone out of the radius.”\n\n Koakuma stared at the words, muttering a curse under her breath. “You're writing an evacuation plan.” Patchouli put the pen back. “No,” she said. “I'm telling you, I won't stop.”\n\n The fire hadn't been lit yet.\n\n The air was so thick it felt like it was about to crack.\n\n In that instant, Koakuma truly understood Patchouli's madness for the first time: she wasn't impulsive; she treated risk as a parameter and then proceeded according to calculations. “What if we succeed?”\n\n Koakuma asked, her voice even lower.\n\n Patchouli stared at the copper plate, her eyes fixed on a path to survival. “We'll have money.”\n\n “We'll have machines.”\n\n “We'll have industry that can drown out the noise of the Outside World.” She looked up. “If we fail, Scarlet Devil Mansion will lose a library.”\n\n Koakuma paused for a few seconds, finally tightening her cuffs and standing back beside her. “Then let's gamble,” she said.\n\n Patchouli nodded. “Light the fire.”"

 KYO_patchouli_my_friend_kaguya:"Just snatch it"
 KYO_patchouli_my_friend_kaguya_desc:"Patchouli turned to the last page of the ledger, her fingertip pausing.\n\n Blank.\n It wasn't that she hadn't recorded it yet, but rather that there was nothing to record.\n\n The blueprint for the industrial plan had been drawn up, the production capacity model had been calculated, and even the transportation nodes and backup warehouses were listed. All the steps were there, except for one crucial element: money.\n\n She put down her pen and coughed. Koakuma stood by the table, holding the list, unusually without a smile.\n\n “How much do we need?”\n\n Koakuma asked. Patchouli didn't look up.\n\n “Enough to make anyone want to run away,” Koakuma muttered.\n\n “Then go ask the young lady,” Patchouli said, turning a page in a short voice.\n “She might not be able to afford it.”\n\n She pushed a list onto the table: major merchants, grain warehouse owners, transportation companies, workshop owners. Next to each name were labeled assets, weaknesses, and dependent supply chains.\n\n Koakuma glanced at it, unable to smile.\n\n “This isn't fundraising.”\n\n “Of course not,” Patchouli said.\n\n She placed the Scarlet Devil Mansion seal on the list and pressed it down.\n\n “This is requisition,” Koakuma frowned.\n\n “They'll resist.”\n\n Patchouli looked up and coughed.\n\n “Resist and we'll cut off supplies.”\n\n “If they don't pay, we'll freeze them.”\n\n “If they try to run away, we'll confiscate their goods.” She spoke as if reciting a list, devoid of emotion.\n\n “We need cash, so we'll take it from the person with the most cash.”\n “We need low-priced materials, so we'll have the manufacturers sell to us at our prices.”\n\n Koakuma couldn't help but ask.\n\n “What's the reason?” Patchouli tapped her pen on the paper, her voice cold.\n\n “The reason is that Scarlet Devil Mansion wants to expand.”\n “They can invest and survive.”\n “They can also choose not to invest and face bankruptcy.”\n\n Koakuma was silent for a moment.\n\n “Will the young lady agree?” Patchouli put the list into a folder and closed it.\n\n “She doesn't need to agree,” she said.\n “She'll only ask me: Can it be done?”\n\n She stood up, her cloak off, but her shadow was more regal than anyone else's. “Notify Sakuya.”\n\n “Have her prepare the documents, the freeze clauses, the deportation list.” Koakuma blinked.\n\n “And what about me?” Patchouli looked at her.\n\n “You're responsible for letting them know this isn't negotiation.” Red mist churned outside the window.\n\n This time, not fire.\n\n With a knife.\n No need to bomb the mansion.\n\n Just make sure the richest people in town understand: when Scarlet Devil Mansion opens its mouth, their money will no longer belong to them."

 KYO_patchouli_knowledge_power:"Remilia, the Distance Between Us"
 KYO_patchouli_knowledge_power_desc:"I dislike the word “relationship.”\n\n It sounds like human sugar-coating wrapped around things no one can properly explain. Yet something does exist between Remilia and me: years of using one another, covering one another's weaknesses, and pulling each other out of trouble. She gives me space, resources, and a sphere of authority. I give her answers, structure, and plans that can be made real.\n\n It is effective.\n\n Effectiveness is not clarity.\n\n I have always known myself to be part of the library. Books, seals, formulae, and taboos are more dependable than being “needed.” Yet lately, I have begun to pause my pen and listen to a familiar set of footsteps far down the corridor, entertaining a pointless question I cannot dismiss: what, precisely, am I to her?\n\n A tool?\n An ally?\n A friend?\n Or merely... useful?\n\n It should not matter. Caring slows one's judgement.\n\n It matters nonetheless.\n\n The day I completed my final report on the industrial reorganisation, I placed it in a folder and pressed the seal tight. Koakuma watched from beside the desk with greater caution than usual.\n\n “You're delivering it in person?”\n\n I nodded.\n\n “This report must be handed over directly.”\n\n Koakuma blinked.\n\n “It is only a report,” she said. “You look as though you're going to your execution.”\n\n I did not contradict her. What I intended to ask was more dangerous than any spell.\n\n—\n\n The throne room was steadily lit. Red mist entered through the windows and cast a dark crimson layer over the floor. Remilia sat in the high-backed chair, slowly turning a wineglass between her fingers. Sakuya stood to one side like a knife returned to its sheath. Meiling was absent; the wind at the gate could not be heard within.\n\n I stopped at the foot of the steps and bowed, though not deeply.\n\n “The industrial reorganisation is complete.” I held out the folder, keeping my voice level.\n\n Sakuya received it with a clean movement.\n\n Remilia did not open it. She looked at me first.\n\n “You are coughing less.”\n\n It sounded neither like praise nor concern, but confirmation that an asset had not yet failed.\n\n “Eientei's medicine arrives on schedule.”\n\n She nodded.\n\n “Come to the point.”\n\n I compressed the essentials into a handful of sentences: restored production capacity, the ratio of military orders to civilian rations, transport nodes, and emergency reserves. Every statement was practical; every measure could be carried out. When I finished, I waited.\n\n At last she opened the folder, skimmed several pages, and checked the result.\n\n “Enough.”\n\n I knew that meant approval.\n\n I did not withdraw.\n\n My heartbeat was more irritating than the cough. I tightened my fingers inside my sleeve, forcing the superfluous emotion back where it belonged.\n\n “Milady.”\n\n Remilia looked up. “Something else?”\n\n Sakuya's attention also settled upon me, light as a warning not to cross the line.\n\n I asked anyway.\n\n “What am I... to you?”\n\n The air stopped.\n\n Sakuya's breathing grew shallow, though she made no sound. Remilia neither frowned nor smiled. She merely set down her glass, its base touching the table with a faint click.\n\n “You want an answer?”\n\n I nodded.\n\n “An unambiguous one.”\n\n I hate ambiguity. It forces one to supply what is missing, and the result is usually uglier.\n\n Remilia studied me as if choosing her words—or as if she had no intention of giving me the clarity I wanted.\n\n “Patchouli.” She spoke my name more slowly than usual.\n\n I held my breath.\n\n “You are part of the Scarlet Devil Mansion.”\n\n The answer was too large. So large that it said almost nothing.\n\n I frowned. “Parts can be replaced.”\n\n A trace of amusement crossed her face.\n\n “You have a talent for making every sentence sound like a threat.”\n\n “I am seeking proof,” I said, forcing my voice steady. “Not flattering you.”\n\n She did not deny it. She rotated her glass halfway, drawing out the question.\n\n “If you wish to be a tool, you will be the sharpest tool I possess. If you wish to be my friend...”\n\n She stopped without finishing.\n\n I stared at her. “And then?”\n\n Her eyes were deep in the candlelight, as though they held an answer—or had never required one.\n\n “Then you will still do what must be done.”\n\n Cold passed through my chest.\n\n It sounded like affirmation and evasion at once: she had placed me within her system while refusing to give me a name I could hold.\n\n I meant to press her further, but a cough rose in my throat. I forced it down, and myself with it.\n\n Remilia regarded me with her customary composure.\n\n “Do not mistake distance for punishment. Refusing to let you close does not mean I do not need you.”\n\n It was still no answer. It was sufficient to leave me without a rebuttal.\n\n After several seconds, I lowered my head. “Understood.”\n\n I turned away. Sakuya put the folder in order, her gaze once more perfectly correct.\n\n Only after leaving the throne room did I notice the sweat in my palms.\n\n After all these years, I can calculate a production curve, turn workshops into a machine, and use knowledge to take an enemy apart.\n\n I still cannot calculate where Remilia has placed me.\n\n Her answer is a half-open door. I can see light beyond it, but I cannot find the handle."

 KYO_scarlet_mansion:"The Mansion Will Expand"
KYO_scarlet_mansion_desc:"The quiet places within Scarlet Devil Mansion are now quiet. The doors are guarded, the accounts are managed, and the library's answers are piled high on the table. Remilia no longer needs to waste her energy on the cracks within the building—now, it's time for the world to learn to face her.\n\n She won't stop at Gensokyo, nor will she be content with this corner of Japan stained red by the mist. To escape fate, to carve out a better future for Flandre, to ensure Scarlet Devil Mansion has sufficient resources, knowledge, industry, and choices, she must expand outwards, bringing a larger territory into her grasp.\n\n Thus, the expedition begins.\n\n The first stop is East Asia.\n\n China's land, ports, factories, and population, and the Soviet Union's railways, mines, and military equipment in the East, will all become spoils of war on her path. Remilia will not take detours, nor will she wait for others to make way for her. She will personally command the Scarlet Devil Mansion flag to advance outwards, from the coast to the inland, from the fog and blood of the East, all the way to the heart of the Old World in the West.\n\n This is not an ordinary war.\n\n This is the Queen's expedition.\n\n She will move from east to west, crushing borders, crossing continents, and expanding Scarlet Devil Mansion from a mansion into a true empire.\n\n And when she returns to European soil, she will no longer be the exile driven out by fire and guns.\n\n She will be a conqueror returning with armies, industry, royalty, and fury."

 KYO_join_axis:"Declaring our arrival to the world"
KYO_join_axis_desc:"Scarlet Devil Mansion no longer hides in the night.\n\n We've seen enough. Enough of humanity cutting the land into borders, writing their own names on factories, railways, ports, and steel; enough of them driving youkai, vampires, and everything that doesn't belong to “civilization” into legends, into ruins, into corners destined to be forgotten.\n\n Now, it's our turn to speak.\n\n Remilia will declare to the world: Vampires are back, youkai are back, and this time, we're not here to beg for coexistence, nor to hide in the shadows and eke out a living. We will reclaim our land, reclaim the position that rightfully belongs to the strong, reclaim everything that humanity forcibly took away in its so-called “progress.”\n\n Let the world's great powers hear this clearly.\n\n Whether it's America, Germany, or Britain, any nation that thinks it can use its fleet, factories, parliament, and steel to drag us back into darkness will become an obstacle on Scarlet Devil Mansion's expedition. And Remilia has only one way of dealing with obstacles—to crush them.\n\n The Red Mist will cross the oceans, cross borders, cross every barbed wire fence inscribed with sovereignty and order. Her army, carrying the fury of Youkai, the will of vampires, and the royal power of Scarlet Devil Mansion, will crush every nation that refuses to bow into the night. Those regimes that still believe the world belongs only to humans will soon understand: the old era is not dead; it has simply returned with a greater military force.\n\n Tremble. Because Remilia no longer intends to explain her existence to anyone.\n\n She will only make the whole world, under the red fog, learn to acknowledge her arrival."

 KYO_asia_doom:"Greater East Asia Circle"
KYO_asia_doom_desc:"China is no longer our opponent. With the collapse of front lines, the change of ports, and the control of railways and cities, the entire East Asia is being redrawn by the red fog. But conquering land never equates to truly ruling it. We have taken the map, but we haven't won over the hearts of the people, much less the human resistance hidden in the mountains, villages, and factories.\n\n They keep their heads down by day and fire at night; today they bomb a section of railway, tomorrow they burn down a warehouse. Every guerrilla blitz, every assassination, every act of sabotage may seem small, but it will drag our supplies, manpower, and security resources into the mire little by little. If we continue to deal with this with simple military suppression, we will waste too much energy on this vast land, trapping the army that should continue to expand outward in endless maintenance and sweeps.\n\n Patchouli therefore proposed a more effective and sobering solution: since old Japan had attempted to package its rule with a “Greater East Asia Co-Prosperity Sphere,” Scarlet Devil Mansion could dismantle, rewrite, and reuse this framework. The name would change, the slogan would change, and the core of the order would change—no longer the expansion of a human empire, but a reorganization of East Asia's production, transportation, security, and cooperation structure centered on Youkai and Scarlet Devil Mansion.\n\n Under this system, those willing to submit would be incorporated into the new regional order, receiving rations, jobs, trade, and limited security; those who continued to resist would be clearly marked, isolated, and eliminated. We would support compliant local governments, rebuild ports and railways, and integrate factories, granaries, and mines into a unified system, so that the entire East Asia would no longer be merely occupied land, but a peripheral system capable of continuously supplying Scarlet Devil Mansion.\n\n This was not mercy.\n This is management.\n\n As long as this “Greater East Asia Co-operation Zone” can function, we won't have to waste all our resources on an endless war of attrition. East Asia will transform from a spoil of war into a rear base; from a burden into a foundation; from a vast land that must be constantly suppressed into the first solid stepping stone supporting Scarlet Devil Mansion's continued westward advance."

 KYO_europe_to_me:"Back to our homeland, Europe"
 KYO_europe_to_me_desc:"We have already traversed Siberia, crossed permafrost, forests, and endless railways; we have also crossed the Ural Mountains, trampling the supposedly solid dividing line between Asia and Europe under our feet. The gates of Istanbul now bow to Scarlet Devil Mansion; the last choke point between Europe and Asia is finally in our hands.\n\n Europe has arrived.\n\n It's not on the map, not in history books, not in the old terms that exiles repeatedly dream of.\n We are truly returning to this land with armies, the red mist, factories, and killing intent.\n\n For others, this is just the next stage of the expedition; but for Remilia, this is not simply a new battlefield.\n This is where she grew up, where she lost everything, and where fate first forced her into this state. She will return to the ruins of that castle.\n\n Looking at the collapsed stone walls, the fire-blackened ruins, the old roads worn smooth by time and frost, she will remember how she learned nobility here, how she witnessed the decline of her family, and how she was driven from her homeland by human cannons and firearms on that night. She would remember her sister's screams, the blood, the fire, the shattered wings, and herself awakened from the ruins, left only with exile as her path. It had been a long and arduous journey.\n\n From being expelled from Europe to traversing the corpses of the Old World; from a corner of Gensokyo to crossing the entire Eurasian continent; from a vampire noble who had lost her castle to a queen returning with a vast army.\n\n And now, the road had finally circled back to its starting point.\n\n The remaining task was simple: Conquer.\n\n Subdue all the nations of Europe, crush every flag that refused to bow into the mud, and transform this continent that had once driven the vampires into Remilia's new throne. Only when the last nation submits, when the last obstacle is crushed, will this expedition truly be complete. At that time, she will no longer merely have “returned.”\n\n She will make all of Europe acknowledge—the girl driven out by fire years ago, now returned with crimson mist and royal power, to reclaim everything that rightfully belongs to her."

KYO_cross_pacific:"The End of All This"
KYO_cross_pacific_desc:"Europe is finally quiet.\n\n Those countries that once banished vampires from history now kneel one after another beneath the red mist. Remilia crossed Eurasia, shattered borders, burned flags, and finally returned to where the story began—the castle where she grew up and lost everything. But it was no longer the place she remembered.\n\n Stone walls were broken, towers collapsed, and courtyards were swallowed by time and weeds. Greenery grew among the ruins, vines climbing up the cracked bricks, as if the ruins themselves had learned to survive. Sunlight shone down, falling on her shoulders and the backs of her hands, making a soft sizzling sound. The burning pain wasn't intense, but it was enough to clear her mind, enough to make her stand in the center of the ruins and remember every step she had taken.\n\n She won.\n\n She avenged herself, reclaimed the lost land for the vampires, and forged a world where no one dared to underestimate Scarlet Devil Mansion. But when she truly returned here, standing in this burned-down castle, she suddenly realized that what she cared about most had never changed. Flandre.\n\n She conquered humanity, expanded her borders, and trampled one nation after another into the mud for her sister. She thought that as long as she was strong enough, invincible enough, fate would no longer have the right to force her to bow down. She thought that as long as the world submitted, no one could harm her sister anymore.\n\n But now, what truly traps Flandre is no longer the enemy.\n\n But herself.\n\n Flandre is still alive, yet imprisoned by magic; she still breathes, but it's as if she's been forced into a silent shell. She's no longer the sister who could cry, laugh, lose control, and shatter the world, but more like a carefully locked monster, imprisoned by her sister, sealed behind iron gates by safety, order, and love.\n\n Remilia stands in the sunlight, and for a moment, she feels absurdity.\n\n She conquered the world for her sister, but in the end, she still couldn't truly snatch her sister back from the clutches of fate.\n\n Kingship, empire, conquest, submission—all of that is over.\n Now, the most important thing is Flandre's fate.\n\n She must make a decision.\n\n Either, let Flandre return to normal. Even if it meant stripping away her terrifying yet beautiful essence, stripping away the power capable of destroying everything, so that she was no longer a dangerous vampire, but a being truly able to live peacefully.\n\n Either release the seal, let her continue living as a demon. Let her retain that power, retain that madness, retain those crystal-like, broken yet vibrant wings, even if she would forever wander the world, wavering between self and self-destruction, oscillating between love and calamity, becoming a monster that no one could truly save. This time, there were no external enemies, no excuses, and no war to delay her answer.\n\n Standing in the ruins where the story began, Remilia finally had to admit: what she truly could not defeat was not Europe, not humanity, not the fire and guns that had once driven her from her homeland.\n\n But rather, it was the question of how her sister should live, a question that would not disappear automatically until the end of the world. The sunlight still burned her skin.\n\n The wind blew through the ruins and broken walls.\n\n And the Queen finally understood that the end of this conquest was not the end of the empire.\n\n It was the moment when her fate and Flandre's truly began to be judged."

 KYO_the_world_under_red_mist:"The world will be under the red mist"
 KYO_the_world_under_red_mist_desc:"Oderint dum metuant"


 KYO_Byakuren_start:0 "The path of equality"
 KYO_Byakuren_start_desc:0 "Choosing the path of Byakuren Hijiri means choosing the longest and most untimely path.\n\n The ruins left by war will not disappear on their own because of mercy, and the fear that has accumulated between humanity and the Youkai for hundreds of years will not be immediately resolved by a victory. Myouren Temple does not shelter a group of redeemed, perfect people. Nazrin remains skeptical, Ichirin struggles between responsibility and confusion, Shou blames herself for every mistake, Minamitsu suppresses her resentment, and Kyouko must learn to judge beyond her passion. Byakuren's task is to move forward with these cracks.\n\nYou will personally participate in the reconstruction of Gensokyo, bringing Buddhism from scriptures to construction sites, fields, schools, and relief stations; allowing the disciples of Myouren Temple to confront their pasts and find their own paths; negotiating with grassroots youkai, tengu, foreign powers, and rulers of the old era, proving that youkai don't have to live on fear alone, and that humanity doesn't have to see youkai as natural enemies. This path will not be without gentleness.\n\n To protect the weak, we must confront the dark tyranny of fascism and oppose the new shackles established in the name of equality; we must acknowledge the mistakes of Myouren Temple itself, preventing compassion from turning into arrogance and relief from becoming domination.\n\n Byakuren doesn't promise to create a world without suffering. What she promises is to no longer easily abandon any living being. If this path can be followed to the end, humans and Youkai will no longer just tolerate each other, but will be able to learn, work, live, and even become family together.\n\n The road is long and arduous. But someone has to take the first step."


 


   KYO_hijiri_aftermath:"The Dawn of Peace"
 KYO_hijiri_aftermath_desc:"The civil war is over, but when Byakuren stands before the temple gate, she sees not peace, but a weariness that has been dragged on for too long. The fields are barren, the roads are broken, refugees and former allies are wary of each other, and even those in the Myouren Temple are barely managing to suppress their wounds; they are far from peaceful.\n\n Byakuren understands that she cannot simply stand on high and speak of compassion. If Myouren Temple were to rise again from these ruins, it would have to send each disciple into the dirtiest, most difficult, and most unforgiving places where their true nature would be revealed. Nazrin was tasked with inventorying and searching, Ichirin with organizing and mobilizing, Shou with maintaining morale and order, Minamitsu with suppressing violence and vagrants, and Kyouko with rousing the hearts of those on the verge of collapse.\n\n She didn't treat them as mere errand boys, but rather forced them to confront the unresolved issues within themselves. Byakuren simply said softly, “Go. First, ensure others survive, then think about what kind of person you want to become.”"

 KYO_our_rat_nazrin:"The Rat in the Temple"
 KYO_our_rat_nazrin_desc:"Byakuren assigned Nazrin the most unpopular and likely to offend people tasks: inventorying the warehouses, patrolling the black market, searching for missing supplies, and dragging out those hands that had taken advantage of the chaos to sneak into the granaries and medicine cabinets. She felt no resentment whatsoever; on the contrary, she felt this was what proper work was all about.\n\n She trusted locks, ledgers, and evidence that could bite, more than empty talk of goodwill. A swarm of rats scurried through cracks in the walls, cellars, and ruins, bringing back to Myouren Temple all the information about who was stealing, who was hoarding, and who was planning to make a quick buck before reconstruction began. Shou tried to salvage some dignity for certain people, but Nazrin simply replied: “Tie the food sacks tight first, then talk about trust.\n\n When you're hungry, vows are thinner than paper.” But the more she saw, the more she realized that her own “everyone betrays others” explanation couldn't cover everything. Some were indeed stealing, and others, though just one step away, still gave their last half-sack of rice to the children. Nazrin continued her sarcastic remarks, but for the first time, she began to admit—perhaps there was kindness in the world, but kindness was often pitifully poor."

 KYO_treasure_hunter_nazrin:"Treasure Hunter"
 KYO_treasure_hunter_nazrin_desc:"The post-war ruins were full of “treasures.” Some were scattered food coupons, medicine, and tools; some were machine parts forgotten in collapsed warehouses; and some were old booklets, land deeds, and smuggling lists that no one had ever noticed. For Byakuren, these were resources needed for reconstruction; for Nazrin, these were first and foremost intelligence, and only secondly, valuables. Gold could be exchanged for food, land deeds could maintain order, and a smuggling list often revealed more clearly than a chest of silver coins who was planning to profit from the dead in the ruins.\n\n She led the swarm of rats, searching along the old roads, through the secret passages, and through the collapsed underground levels, her movements as practiced as if she were back in her own territory. Minamitsu leaned against a broken beam watching her search, smiling lazily: “You really seem like you were born to live in rubble. You can even smell copper coins buried under three layers of dust.” Nazrin didn't even look up, coldly replying, “It's better than some ship ghost that starts plotting who to drag down the river the moment it smells water.”\n\n Minamitsu, instead of being angry, laughed, stepping over the pebbles to catch up, deliberately drawing out her words: “But at least I know what I'm looking for. What about you? Are you really looking for treasure, or are you picking up those things that Lady Shou can't keep but can't let go of?” Nazrin's ears twitched slightly, but her hands didn't stop. She simply pried open a rusty iron box, saying calmly, “Lady Shou always values important things too much, and always assumes others will cherish them the same way. If no one is watching over them, she could even steal the copper rings from temple gates in this world.”\n\n Minamitsu raised an eyebrow, her smile becoming even more wicked: “Oh? So it's not treasure hunting, it's taking care of your master.” Nazrin finally looked up and glared at her: “Shut up. I just can't be bothered to see her act like the sky is falling every time she loses something.” But despite saying that, she still meticulously sorted and packed away the damaged Buddhist implements, the lost scrolls, and the hidden supplies, leaving nothing out.\n\n The two of them teased each other the whole way, neither giving an inch. One called the other a biting rat, the other laughed at the other for being a vengeful spirit who hadn't had enough of drowning. But when they reached dangerous areas, Minamitsu would check the waterways and escape routes first, while Nazrin was responsible for digging out everything buried in the ashes, hidden in the tents, and locked in hidden compartments.\n\n One was familiar with chaos, the other with gap, and they surprisingly cooperated perfectly. Nazrin also slowly realized during this search that treasure hunting was never just about getting rich. What's truly valuable isn't just metal, tickets, and antiques, but those things that can piece together a broken place. And the reason she can always spot these things at a glance isn't just because she's a skilled searcher—it's because she knows all too well that what Shou wants to protect is never a pagoda, goldware, or warehouse, but the people of Myouren Temple—a group riddled with flaws yet still determined to live. Nazrin remains as sharp and realistic as ever, and while she still refuses to admit it, she's increasingly understanding that what she's reclaiming for Shou isn't just “material possessions,” but also her persistent, albeit often clumsy, belief."

 KYO_nazrin_open_shop:"New Main Business: Confectionery Workshop"
 KYO_nazrin_open_shop_desc:"No one expected that Nazrin's fundraising method for Myouren Temple wouldn't be raiding the black market, reselling secondhand goods, or simply digging up all the hidden treasures at once, but rather opening a traveling confectionery workshop on the treasure ship. She wasn't satisfied with the idea itself; in fact, she was quite disgusted with it. But Byakuren's goal for her was clear: Myouren Temple needed funds, and it also needed to get more people willing to approach, believe, and put their money and hopes into circulation again. Since that was the case, she could only choose the method she disliked the most, but which would be the most effective in accomplishing the task.\n\n So the treasure ship was temporarily converted into a mobile shop. One of them was responsible for moving the stoves, flour, and boxes of raw materials, still acting with that serious air, as if she weren't selling sweets but carrying out some solemn mission; Minamitsu, on the other hand, was happy to sail the ship to various markets, docks, and towns, smilingly greeting passersby, and deliberately parking the ship as if deliberately showing off. Leaning against the ship's railing watching Nazrin do the accounting, she lazily sarcastically remarked, “What, our Myouren Temple's great treasure hunter has finally switched from digging through ruins to selling candy to children?” Nazrin didn't even look up, only coldly replying, “It's more constructive than some guy who sails the ship and everyone there is worried it might fall into the water.”\n\n At first, she always thought this method was inefficiently frustrating. How much money could you make from a snack or a cup of hot tea? And having to stop the ship constantly, greet customers, give change, and keep accounts—it didn't seem like the kind of thing she would choose. But reality gradually silenced her. Wherever the treasure ship went, the aroma wafted out first; children surrounded it asking for candy, the elderly bought hot food, vendors set up stalls as crowds gathered, and even those initially wary of Myouren Temple would stand at a distance for a while before slowly approaching. Kyouko would occasionally jump onto the ship to help hawk the goods, Ichirin worked hard to maintain order behind the counter, and Minamitsu deliberately shouted “Today's Limited Edition” like pirates dividing loot, making Nazrin's forehead twitch.\n\n But more and more people came, the queue stretching from the boat deck all the way to the shore, eventually even winding around half the market. Those long lines said it all: people were willing to stop for a hot, sweet treat, something that felt like life was finally returning to normal, and they were willing to casually drop money into the Myouren Temple's donation box. Nazrin still didn't like to admit how successful this slow, gentle approach was, so she could only meticulously record the accounts while sternly handing out freshly baked pastries. She knew very well that this confectionery shop wasn't just selling sweets; it was also Myouren Temple's way of reconnecting with people and mending its broken pieces.\n\n In the end, even Nazrin herself had to admit: sometimes, what makes people open their wallets isn't fear, coercion, or meticulously audited accounts, but a treasure ship sailing into ruins and cold winds, a warm lamp, a still-warm pastry, and the tomorrow that people were willing to believe in again in the long queues."

 KYO_nazrin_salvage_org:"Asset Recovery"
KYO_nazrin_salvage_org_desc:"Byakuren's order to Nazrin was simple: find everything still usable from the ruins and turn it into resources that Myouren Temple could control as quickly as possible. As for how to do it, Byakuren didn't elaborate; and Nazrin, always adept at taking a broad statement and executing it in the coldest, fastest, and most ruthless way, immediately established a complete recovery system.\n\n Scattered scrap metal, discarded equipment, unclaimed convoys, warehouses left behind by the old forces, even tools, wood, and medicine boxes forgotten in corners were all marked, registered, and collected by her. Her rules were simple to the point of being cruel: if no one claimed it on the spot, if no proof could be produced, and if the ownership couldn't be determined within the stipulated time, then it was Myouren Temple's asset. She didn't ask who the former owner was, nor did she care about the excuses others used about “almost coming to claim it.” To her, the least valuable thing in the ruins was a belated explanation. After listening to the rules she set, Ichirin frowned and said it was practically taking advantage of the chaos to loot.\n\n Nazrin didn't even raise an eyelid, only replying calmly: “Reconstruction isn't charity, it's racing against time. By the time they slowly remember what they lost, this pile of scrap metal will have long since rotted into mud.” She included every rail, every box of damp medicine, every piece of still-rotting gear in her inventory, and even sent swarms of rats to ransack the dilapidated warehouses that others considered unlucky. This method was indeed astonishingly efficient.\n\n For the first time, Myouren Temple was able to quickly regroup resources scattered across various locations and redistribute them to construction sites, convoys, granaries, and repair teams. While others were still arguing over ownership, she had already sent the items on their way; while others were still reminiscing about the past, she had already begun calculating how many bricks, medicines, and hot meals these remnants could be exchanged for.\n\n But efficiency never comes without a price. Some accused Nazrin of taking advantage of the situation, some cursed Myouren Temple for embezzling property under the guise of reconstruction, and others stood before the sealed-off old warehouses, their eyes red with tears, saying that those were their hard-earned possessions. Nazrin heard these grievances, but almost never looked back. She knew very well that she was doing something no one would like, but she also knew that if even these hateful dirty tricks weren't done, the reconstruction in Myouren Temple's hands would forever remain empty words.\n\n She still didn't believe in the reliability of people's hearts, and never expected to be thanked. But at least, the rules she had personally established were indeed reliable. Nazrin turned ruins into accounts, controversy into assets, and truly became the kind of person best suited to be criticized in chaotic times, yet most capable of getting things done."

  KYO_nazrin_rat_king:"The Rat King"
KYO_nazrin_rat_king_desc:"As the recycling system, informants in the shadows, and underground intelligence networks gradually expanded, Nazrin's swarm of rats was no longer just a bunch of burrowing, sniffing creatures under the eaves of the Myouren Temple, but a truly nationwide, clandestine network. Her eyes were in the cracks of granaries, her ears were under the wooden crates of the black market, and rats were in the brick seams of ruins, the shadows of train stations, the ropes of docks, the grass along mountain paths, and even those supposedly safest secret rooms and accounting offices—they were always the first to crawl in and bring back information to her. Which batch of supplies was embezzled, which transport line was tampered with, which local official was preparing to feign compliance, which group of remnants of the old forces were secretly conspiring at night—Nazrin often knew before they even had a chance to act.\n\n Initially, many people considered her the most disliked and least monk-like oddity in the Myouren Temple. She didn't speak gently, disliked empty trust, and didn't believe in the idea that “people's hearts will naturally turn to good.” In her eyes, schemers wouldn't abandon their plans just because they heard scriptures, and destroyers wouldn't suddenly develop a conscience just because they saw porridge and relief. If someone didn't keep an eye on things beforehand, expose them early, and dig out the malice hidden in the cracks, then the peace that Byakuren and Shou had painstakingly built would sooner or later be torn apart again by a few hands hidden in the shadows.\n\n So she did what was best for her. Byakuren went to appease the crowd, Shou went to stabilize order, and Nazrin retreated to the shadows, digging out everything that shouldn't exist in peace, one by one. She recorded names, marked routes, compiled blacklists, arranged for rats to sneak around day and night, nipping every possible clue that could cause disaster in the bud. Some called her a secret police dog, some said she lived like a judge who couldn't see the light of day, but Nazrin didn't even bother to defend herself. For her, the way to put people at ease was never to convince them there were no bad people in the world, but to ensure that before the bad guys could even make a move, she had already bitten their ankles.\n\n Over time, the nickname “Rat Queen” spread. Initially, it was just a half-joking term used by black market merchants and local gangs, but later even within the Myouren Temple, the name was tacitly accepted. Because everyone gradually realized that Nazrin's grayish little creatures had become the nation's most sensitive and difficult-to-defend line of defense. Conspiracies rarely grew in her presence, rumors rarely fermented in her ears, and destruction rarely materialized under her watchful eye. Many crises didn't even have time to be written into official reports before quietly crumbling under her cold commands and the claws of her rat swarm.\n\n Shou once frowned and said to her, “You don't need to treat everyone as a thief from the start.” Nazrin merely scoffed, replying without looking up, “And you're just too quick to mistake a thief for a lost person.” Her words sounded harsh, even ruthless, but she knew perfectly well that it was precisely because people like Shou and Byakuren were still willing to believe in others, still willing to reach out to all living beings, that the Myouren Temple deserved to be called the Myouren Temple.\n\n But it was also precisely for this reason that someone needed to refrain from being a good person behind them. The world certainly needed people like Byakuren who were willing to talk about compassion amidst ruins, and people like Shou who, despite the risk of injury, were still willing to uphold their beliefs. But if it were only them, peace would be too easily exploited. Kindness would be tested, compassion would be exploited, and trust would be used as a weapon by imposters.\n\n Nazrin never considered herself noble; she simply understood earlier than anyone else that for good people to continue being good, someone had to drag those who were about to destroy everything back into the gutter. No one can deny that she is cold-hearted. She speaks with a barb, acts ruthlessly, and always considers the worst-case scenario when judging someone; even with her own people, she habitually holds back before considering sentimentality. But this coldness is precisely her greatest value. Because she won't be fooled by sweet words, won't be moved by tears to forget the risks, and won't let a moment of weakness create a crack in the defenses. Others protect the nation's face, ideals, and flag; she protects the ugliest, dirtiest, yet most vulnerable corners that are most likely to cause everything to collapse.\n\n Nazrin herself may not like the term “pillar.” She prefers to see herself as a lock, a list, or a trap that never lets go. Whether she wanted to admit it or not, as the rule of the Myouren Temple truly took root, as the region resumed normalcy, and as conspiracies that should have caused chaos were silently nipped in the bud, more and more people understood: Byakuren and the star gave this nation direction, and Nazrin protected that direction from being shattered from behind. She was not light, nor did she intend to become light.\n\n But it was precisely because of people like her standing where the light couldn't reach, watching, sniffing, and biting, that the peace painstakingly maintained by good people finally had a chance to live a little longer."

KYO_nazrin_follow_shou:"Nazrin Will Always Follow Shou"
KYO_nazrin_follow_shou_desc:"Nazrin's initial approach to the star wasn't out of trust, much less out of affection. When she was sent to the star's side, her original duty was more like surveillance: to watch this disciple who bore the name of Bishamonten's representative, to judge whether she was worthy of entrustment, and whether she would make an irreparable mistake at a crucial moment. After all, in Nazrin's eyes, those who constantly preach justice, responsibility, and faith are often the ones who suffer the most in the face of reality. She never believed anyone was always right, nor did she believe anyone would remain unchanged forever.\n\n And Shou, on the other hand, was precisely the kind of person who most easily made her frown. She would lose the pagoda, forget important things where she shouldn't have, and while others were already scheming their next move, she would still worry about whether the injured were being cared for, whether the refugees had a place to stay, and whether the Myouren Temple had disappointed anyone again. She wasn't tactful, not quick-witted, and sometimes even infuriatingly clumsy. Nazrin didn't know how many messes she had cleaned up for, or how many loopholes she had patched up that shouldn't have existed. She would always complain coldly, “Lady Shou, you'll get yourself and others into a mess sooner or later.”\n\n But after each complaint, she would still turn around and fix things, find what was lost, and nip any malice that might hurt Shou in the bud. At first, she thought she did this simply out of duty, because Myouren Temple couldn't have someone so easily manipulated standing in a high position. But the longer she spent with her, the more she realized that what truly made Shou unforgettable was never her abilities, but her integrity—the willingness to be hurt, to be let down, yet refusing to back down. She had seen Shou stand up in the most chaotic times, seen her knowing she too was afraid, to hesitate, yet still shielding everyone; seen her, even in her disheveled state, even after making mistakes, even after being brutally beaten by reality, still stand tall again and continue to shoulder her responsibilities.\n\n Nazrin disliked this kind of person. Because this kind of person made her judgment that “people change their minds, and kindness is ultimately unreliable” less and less credible. Shou wasn't incapable of making mistakes; she just still wanted to protect others after making them. Shou wasn't stupid; she was just so stupid that even if she suffered a loss herself, she always wanted to protect those she should protect first.\n\n That almost foolish courage, as Nazrin watched coldly from the sidelines, gradually softened even the hardest part of her heart. She later realized that she wasn't just monitoring Shou anymore. She was protecting her, shielding her from Shou's unseen schemes, and cleaning up the dirty, dark, and ugly things behind her beliefs. The world needs people like Byakuren who are willing to lend a hand, and it needs people like Shou who, knowing they will be hurt, still refuse to back down; but precisely because of this, they need someone like Nazrin behind them—to doubt everything, to consider the worst-case scenario first, and to always fill the gaps in that goodwill, lest peace and trust be torn to shreds by conspirators.\n\n And for Nazrin herself, Shou brought far more than just a worthy master to follow. She gave her a place where she could let down her guard, a place where no matter how much she mocked or ridiculed, she wouldn't be driven away. For the first time, she realized that she wasn't just a mouse sniffing around, always ready to escape; that there really was someone in this world who, even knowing she was suspicious, harsh-tongued, and cold-hearted, would still earnestly tell her, “It's so good to have you here.”\n\n Nazrin would still find Shou troublesome, would still show that familiar look of disdain when she forgot things, and would still constantly call her “you idiot.” But that disdain couldn't hide her favoritism; behind that complaint was no longer just a simple duty, but a kind of cherishing she had never acknowledged before.\n\n She had seen too many people in her life, and too many relationships that turned on her faster than flipping through a book. But if she were to say what she had gained from the Myouren Temple, the answer would never be treasures, power, or so-called fame.\n\n It was Shou.\n\n Meeting Shou was Nazrin's greatest gain in life. And because of this, this time she stayed by her side not to monitor, not to test, and certainly not on anyone's orders.\n\n It was because she was finally willing to admit—if she were to truly give her heart to anyone, that person could only be Shou."

 KYO_Ichirin_convert_everyone:"Myouren Temple Ambassador"
KYO_Ichirin_convert_everyone_desc:"When Byakuren entrusted Ichirin with the task of preaching, visiting villages, and persuading local forces, she remained silent for a long time. She was familiar with simply standing at the forefront, confronting people, and suppressing chaos; but the thought of her speaking to others about the beliefs of Myouren Temple and Buddhism like a true preacher made her instinctively feel awkward.\n\n Because she knew very well that she wasn't born to be a missionary. Her entry into the faith wasn't entirely voluntary; family arrangements, fate, and the expectations of others had gradually led her down this path. She wasn't without doubts, nor was she without wavering. Many times, she couldn't even say whether she was following Byakuren or simply following a life already decided for her.\n\n But Byakuren didn't replace her, calmly telling her: “Because you know what confusion is, others will believe what you say.” And so, Ichirin accepted the task. She donned her monk's robes and ventured into villages and markets, repeatedly stepping to the front amidst the fearful and weary gazes of the crowd.\n\n Unlike Kyouko, she couldn't effortlessly create a lively atmosphere with a few words, nor did she possess the calm and collected demeanor of Byakuren. She could only speak in the most straightforward and direct way: the Myouren Temple never sheltered perfect individuals, but rather a group of people burdened with wounds, obsessions, and doubts; Buddhism wasn't just pretty words hanging high above, but a path that allowed broken souls to continue living and to reunite.\n\n She explained why the Myouren Temple sheltered exiles, why it aimed to teach people to help each other instead of tearing each other apart, and that what Byakuren sought wasn't a pristine paradise, but a world where humans and youkai could live without fear, without proving themselves by trampling on others. Kyouko tried to warm things up, but Nazrin, as usual, nitpicked, saying she still sounded like she was reciting precepts. But it was precisely because of this lack of tact that people were more willing to stop and listen to her finish speaking.\n\n Over time, Ichirin herself understood: she accepted this mission not only to fulfill Byakuren's orders, but also to find answers for herself. She might not be without confusion, but she was finally willing to admit—even with confusion, she could still protect the pure land depicted in Buddhism, and let more people believe that this world could still be gradually led to a better place."

KYO_Ichirin_help_worker:"The Ambassador of Industrial Management"
KYO_Ichirin_help_worker_desc:"Byakuren knew very well that scriptures and good intentions alone could not save a land torn apart by war. If the world were to truly move in a better direction, in addition to the stability provided by faith, the production of materials, the allocation of resources, the operation of workshops, and the management of warehouses were equally indispensable. Ruins will not spontaneously transform into houses, and an empty pot will not automatically cook hot food out of compassion.\n\n So, Ichirin was thrust to the forefront of the construction sites, warehouses, and workshops. She initially disliked the job. Rather than running between forms and schedules, she preferred to be at the forefront, punching away any visible trouble. But Byakuren simply told her: “If you want people to have a place to live, it's not enough to just guard it; you also need to learn how to build houses.”\n\n Ichirin had no choice but to accept the task. She began inspecting the construction sites, checking warehouse receipts, arranging shifts, and reorganizing the production lines that had been scattered and broken by the war. Where the raw materials came from, where the finished products were sent, which transportation routes couldn't be interrupted, which workshops should be prioritized for restoration—she noted everything down, then nailed each item into the new order. She wasn't good at smooth talk; she could only tell everyone in the most direct way: what to do now, and why to do it.\n\n She walked into the workshop and said to the workers who were only thinking about getting a meal: You're not just doing this for dinner. The bricks, screws, tools, and medicines you make will eventually become roofs, roads, and furnaces, becoming someone else's means of survival. If labor only stops at personal subsistence, this land will forever remain stuck in a cycle of mere survival; true production is about reintegrating people into a society that can still function and move forward.\n\n At first, not everyone was willing to listen. Some found the assembly line tedious, while others felt that Myouren Temple was all talk and no action, ultimately driving people back to the construction site to do manual labor. Nazrin also reminded her: “If you want them to believe they are not just screws, you have to stop treating them as numbers.” So, instead of just speaking from a high place, she personally accompanied them as they pushed raw materials and delivered finished products, letting them see firsthand how their creations were delivered to bridge repair teams, agricultural tool stations, and makeshift hospitals.\n\n She finally understood that faith gives direction, labor gives strength, and industry gives society its framework. An ideal world doesn't fall from the sky; it must be slowly built, bag after bag of cement, steel after steel, and tireless hands."

KYO_ichirin_Propaganda:"Rumors, the Drunkard of Myouren Temple"
KYO_ichirin_Propaganda_desc:"After the war, rumors spread, and Myouren Temple was no exception. Among these rumors, the one that spread fastest was about Ichirin—that woman who, despite having been a follower of the faith for many years and should have been observing vows of purity, could never shake her drinking habit.\n\n Of course, she knew this habit was bad. Byakuren had advised her against it, Shou had frowned, and Nazrin had often used it to tease her. But Ichirin would still drink. Not because she particularly liked the taste of alcohol, nor for enjoyment, but to numb herself. Numbing the things that had never truly left her—the shadow of her family, the life she was pushed into, the responsibilities she carried, and the heavy burden of never being able to distinguish between “this is the path I want to take” and “this is what others have chosen for me.”\n\n During the day, she always stood straight, like a piece of wood, like a wall, like a hermit accustomed to living as “the person who should be right.” She managed construction sites, spoke of faith and order at gatherings, and acted composed in front of others. But at night, after a glass of wine, that hardened shell began to crack. She would often go to Minamitsu with a bottle of wine, pouring out all the things she would never say during the day.\n\n She cursed Byakuren for pushing people onto the most difficult paths, cursed Shou for being stupid to the point of being a headache, cursed Nazrin for being stingy and suspicious, and cursed Kyouko for being overly naive. But in the end, her rants always circled back to herself, criticizing herself most harshly—criticizing her own cowardice, her own unwillingness to accept things as they were, yet always following the paths others laid out for her; criticizing herself for having so much to say but never having the courage to truly speak for herself. Minamitsu usually listened nearby, occasionally adding a wicked grin: “You, when you're sober, you're like a disciplined monk; when you're drunk, you're like a human being.”\n\n Strangely, it was precisely because of this unseemly flaw that Ichirin gained a different kind of reputation among the people. People discovered that this monk from Myouren Temple wasn't truly detached from worldly affairs. She would get drunk, complain, curse, and, when intoxicated, pour out all her grievances and resentments, much like ordinary people overwhelmed by life's pressures.\n\n And it was precisely because of this that people were more willing to approach her. Construction workers were willing to sit at the same table with her, and even homeless people, after listening to her drunken rants, felt that Myouren Temple's talk of “rebuilding the world” wasn't so far-fetched. Thus, “the drunkard of Myouren Temple” didn't become a scandal, but rather a strange yet effective reputation—Myouren Temple not only sheltered saints, but also tolerated someone who would break precepts, drink, and feel self-loathing, yet still get up the next morning to continue working."

KYO_ichirin_Training:"Purity and Integrity"
KYO_ichirin_Training_desc:"Ichirin knew early on that she wasn't the kind of person who would blindly believe all dogma. She was intelligent enough to see the cracks between scriptures and reality; she was also perceptive enough to understand that a few noble words alone couldn't immediately make the world a better place. Because she always had doubts in her heart, she understood better than many that spiritual practice was never about closing your eyes and believing, but about being willing to take firm steps forward even after wavering time and time again.\n\n Byakuren taught her compassion, Myouren Temple taught her self-discipline, and the suffering of all beings taught her that what truly sustains faith is never empty obedience, but a resilience that refuses to easily back down even when seeing contradictions, seeing filth, seeing one's own imperfections. Ichirin was precisely such a person. She would doubt, she would hesitate, and she would repeatedly ponder in the dead of night whether the path she was walking truly came from her heart; but as soon as dawn broke, she would still put on her monastic robes and take on the tasks that needed to be done.\n\n Therefore, her training was never just about martial arts and physique, nor merely about superficial rules and regulations. She trained herself to remain steadfast amidst chaos, to avoid crumbling in the face of doubt, and to strive for a better future even without fully believing all existing answers. She didn't seek to become a stone statue devoid of desire; she wanted to retain the backbone to keep moving forward amidst hesitation and the tug-of-war of human nature.\n\n And precisely because she wasn't a flawless preacher, her words resonated more deeply. She never portrayed the Pure Land as a distant illusion. She said that a Pure Land on earth isn't a gift bestowed from heaven, but rather begins with what's before us, with how people treat each other, with whether we restrain malice, whether we support those who are about to fall, and whether we continue to rebuild from ruins.\n\n She told the people that Buddhism isn't about turning people into empty shells, devoid of feeling or emotion, but about teaching them to use their strength in the right way, even when they still experience pain, fear, and wavering. A worker completes their work not just to fill their stomach, but also to create a livelihood for many others; a farmer continues to till the soil and sow seeds not because the world has improved, but because someone must first plant the seeds for tomorrow.\n\n Many who received her teachings may not have become true believers later, but they all remembered one thing—this world may be far from perfect, but people can still actively pursue a better place than they currently live. And Ichirin herself made people understand: pursuing a Pure Land is not about escaping this world, but about gradually building it up within this world."

KYO_Ichirin_cringe_name:"Mobilizing the People to Work on the Land Under the Sun"
KYO_Ichirin_cringe_name_desc:"Ichirin understood that rebuilding order at Myouren Temple couldn't rely solely on the roar of workshops or the sermons in front of the temple gates. If the world truly wanted to rise from the ruins, people had to return to the land, let their feet touch the mud, and let their hands touch the seeds, farming tools, and the still-living earth. So, she took the agricultural machinery, fertilizer, and tools produced in the workshops, leading the bewildered young people, the disheartened middle-aged, and those who had lost their way after the war, out of the shadows and into the countryside and fields. Initially, many were reluctant.\n\n The young people disliked the dirt and the sun, while the middle-aged were numb to the idea of “starting over.” But Ichirin didn't force them to cheer up with empty enthusiasm, nor did she portray labor as something easy and beautiful. She simply distributed hoes, fertilizer bags, seeders, and tools for repairing irrigation ditches one by one, then led them into the fields, ensuring that the cold, industrial tools truly came into contact with the land and human hands.\n\n She told them that products piled up in warehouses were merely lifeless; only when they were delivered to the fields and into people's hands did they truly gain meaning. Factories manufactured machinery, fertilizer nourished the soil, the land produced crops, the crops fed people, and people continued to build villages, workshops, and roads—these were not separate tasks, but the same path to survival. Industry and the fields were not in conflict, nor were labor and spiritual practice two separate paths. Days passed, and changes slowly took place.\n\n Those young people who once had empty eyes began to learn to identify soil types, operate farm machinery, and spread fertilizer on the ridges on time; those middle-aged people who were once too lazy to say a word also gradually rediscovered their sense of accomplishment in the process of turning the soil, irrigating, and repairing the field ridges. Mud clung to their trouser legs, sweat streamed down their backs, but it was precisely in this most concrete labor that the drifting emptiness in many people's hearts began to slowly settle. didn't turn this place into a lecture hall.\n\n She simply stood by the field, speaking to them about a different kind of Buddhist philosophy, closer to the land. She said that cultivating the mind doesn't necessarily require being far from people, nor does it necessarily require closing one's eyes and meditating. For this group of people, overwhelmed by reality, putting their chaotic thoughts into repetitive and solid labor was itself a form of recuperation. Turning over a ridge of soil, straightening a row of seedlings, pushing the machine along the edge of the field, slowly letting go of the restlessness, resentment, and emptiness in her heart, allowing her to feel once again that she was still alive on this land.\n\n And so, Ichirin finally understood that what she was promoting was never just agricultural production. She was bringing people back into the world. She wanted the farm tools and fertilizers produced in factories to not only bring more food, but also the possibility of reconnecting people with the land; to make labor not just a means of survival, but also a path to heal the soul. People produce food in the fields, and in the sunlight, soil, and breath, they also gradually learn to reconcile with themselves, rediscovering the Pure Land on earth as described in Buddhism."

KYO_Ichirin_follow_hijiri:"Ichirin will forever follow Byakuren Hijiri"
KYO_Ichirin_follow_hijiri_desc:"In the past, Ichirin always mixed up family arrangements, destiny's driving force, what kind of person she should become after entering the path, and the path she truly wanted to take. She had been a Buddhist for a long time, but she couldn't always say that it all came from her heart. She was too intelligent to see the gap between doctrine and reality; she was also too clear-headed to understand that she wasn't the kind of person who was naturally devout and without doubt.\n\n Because of this, her following Byakuren, though initially sincere, was always tinged with an unspoken hesitation. Byakuren was her master, the one who gathered countless youkai and outcasts into the Myouren Temple, the one who, despite witnessing the chaos and malice of the world, still refused to withdraw her hand. She respected and obeyed her, but for a long time, this respect felt more like looking up to someone than a heartfelt decision before truly entrusting one's path.\n\n It wasn't until she truly stepped into the ruins, construction sites, countryside, and the harshest aspects of life for Byakuren that she gradually understood that Byakuren had never given her just a task, but a long and arduous journey of self-cultivation. She sent Ichirin to preach, to confront the doubts and fears of the masses; she put her in charge of the workshop and production, to understand that for an ideal to stand on the ground, it must be supported by steel, food, and tools; she also led people into the fields, to experience in the soil and sunlight what it means to cultivate the mind, what it means to find a pure land on earth.\n\n Ichirin finally saw clearly that Byakuren wasn't trying to mold her into another Byakuren, nor was it trying to polish her into a stone that could only repeat dogma. What Master truly gave her was a path for her to walk herself, to stumble upon, to doubt, and to find the answers herself, step by step. That path wasn't easy, because it allowed for doubt and struggle; it didn't require blind faith, but rather that even when faced with contradictions, one should still be willing to place oneself on this path, step by step, to the end.\n\n Thus, Ichirin began to truly face herself. She no longer avoided her past resentment, no longer pretended that she had never complained about the life that had pushed her into the path. She admits that she sometimes doubts dogma, questions meaning, and feels weary at night of living the way things “should be.” But it is precisely because of this that she understands better than many that spiritual practice is not about concealing these things, but about carrying them forward until they are no longer just constraints, but become the roots that support her understanding of all beings, suffering, and compassion.\n\n So today, her following of Byakuren is no longer just out of respect, habit, or “I should be this way.” She has personally walked through the most difficult reconstruction of Myouren Temple and brought Buddhism into the construction site, the fields, and the lives of all beings. She knows that what she wants to protect is not just Myouren Temple, nor just her identity as a disciple, but the path that Byakuren has always adhered to—a path that allows beings to live with their imperfections, a path that allows faith to be grounded in reality and the earth.\n\n From this day forward, Ichirin will follow Byakuren not because someone else has chosen the answer for her, but because she has finally found her own. And it is precisely for this reason that she truly deserves to stand beside Byakuren and become one of the most outstanding disciples of the Myouren Temple."

KYO_shou_money_beg:"Treasure Bowl"
KYO_shou_money_beg_desc:"In the post-war Myouren Temple, what was most lacking was never faith, but the supplies to sustain that faith until tomorrow. Food, medicine, timber, clothing, tools, and funds were the true determinants of whether everyone could survive the winter and rebuild the village from the ruins. When Byakuren entrusted this task to Shou, she remained silent for a long time. Because she knew she could do it, but it was precisely because she could do it that she felt even more uneasy.\n\n Shou possessed the pagoda of Bishamonten and had the ability to gather wealth and attract good fortune like a treasure bowl. In terms of results alone, this was undoubtedly the most effective, fastest, and most effective way to solve Myouren Temple's immediate crisis in the chaos. But for Shou, this power always carried an indescribable unease. She always felt that it didn't feel like the result of standing on the ground, earning it bit by bit, but rather like a shortcut, a way to bypass the difficult process and directly reach out for the result.\n\n She even doubted whether such behavior was truly the right path. If Buddhism emphasizes purity, and if spiritual practice emphasizes hard work, then relying on the power of accumulating wealth and the generosity of others—wasn't that taking an too easy path? She feared she would become greedy, and that the pagoda would cease to be a protective tool for all beings and instead become a tool for bargaining over suffering.\n\n But Byakuren simply told her: “If it allows more people to live, the method itself is not a sin. The real question isn't whether it looks like a shortcut, but who you're using it on.” So, Shou still picked up the treasure bowl, and with Nazrin, Kyouko, and a small team that combined fundraising, inventory, and transportation, headed towards caravans, markets, and villages.\n\n For her, this was more difficult than any direct battle. She could face the threat of war with composure, but found it difficult to bow her head and speak under the gaze of others, to say that Myouren Temple needed help, that the disaster victims needed food and medicine. Nazrin was responsible for bookkeeping, valuation, and exposing those who tried to pass off scraps as valuables, while Kyouko loudly proclaimed the purpose of Myouren Temple. Shou stood between the two, enduring her discomfort while slowly learning: when she held the treasure bowl, she wasn't seeking wealth for herself, nor was she seeking convenience for herself, but rather speaking up for those who no longer had the strength to speak.\n\n She finally understood that being down-to-earth didn't just mean earning, digging, and carrying everything herself. If someone clings to an obsession with “purity,” preferring to let all beings continue to suffer rather than using their own power, that's not necessarily integrity, but rather a kind of stubborn self-satisfaction. True correctness isn't about appearing flawless, but about discerning in reality what truly benefits all beings.\n\n Later, Shou was finally able to openly admit that she took up the treasure bowl not because she loved wealth, nor because she liked taking shortcuts, but because she finally understood that spiritual practice is not just about upholding rules, but also about learning to let go of the obsession with being flawless and instead using all available power to save others."

KYO_shou_the_best_soilder:"The Second-in-Command of Myouren Temple"
KYO_shou_the_best_soilder_desc:"When Byakuren was absent, the first person everyone looked at in Myouren Temple was often Shou. Not because she was best at giving orders, nor because she naturally liked being in the highest position, but because she always instinctively stepped forward in those situations, taking on the responsibilities that should be borne first. The wounded needed to be cared for, the monks needed to be reorganized, the construction site needed to continue operating, and the local fears and unrest needed to be quelled. When Byakuren was temporarily out of sight, Shou would take up that invisible banner and stabilize Myouren Temple from its disarray and unease.\n\n Over the years, following Byakuren's training, she had unknowingly learned many things belonging to her master. She learned to see the suffering of all beings first in conflict, rather than her own anger; she also learned to understand that what Myouren Temple wanted to protect was never just a temple or a group of disciples, but an order where both humans and youkai could continue to live and continue to believe that they could coexist. Byakuren's ideal was not easy; it was neither empty compassion nor weak retreat, but a path forged step by step through mud and fire. Shou understood this and genuinely respected it.\n\n But the more she understood, the clearer it became that she was ultimately not Byakuren. She lacked Byakuren's seemingly all-encompassing magnanimity, and her composure to calm everyone down even in the worst situations. She felt self-reproach, hesitated, and ruminated over her clumsiness and mistakes; her beliefs were more direct and resolute, often making her more uncomfortable than Byakuren when facing gray areas. But Shou didn't stop because of these shortcomings.\n\n On the contrary, she treated this clarity as part of her spiritual practice. Knowing she wasn't adaptable enough, she forced herself to listen to more voices; knowing she wasn't good at handling ambiguous situations, she forced herself to learn to discern what was truly beneficial to all beings in every instance of governance; knowing she wasn't strong enough, she continued to practice martial arts, cultivate her mind, and hone her leadership skills, so that when Byakuren was absent, she could make fewer mistakes and shield others from more chaos.\n\n Thus, every period when Byakuren was away became a moment for Shou to truly practice her ideals. She would lead the monks and the self-defense force to rebuild the defenses, letting those who had experienced war know that Myouren Temple was not a place to retreat in the face of chaos; she would step between the refugees and local forces, striving to explain, in her still-immature but sincere way, why Myouren Temple fought and why it governed; and in the most difficult times, she would make decisions that Byakuren might have done better, decisions she herself had to make.\n\n The people of Myouren Temple gradually understood that Shou was important not because she was merely a substitute for Byakuren, but because she was the one who would continue to uphold this path after her master's departure. She inherited Byakuren's light, but not by palely imitating it; she used her own way—a little more clumsy, a little more upright, and a little more easily hurt, but therefore all the more genuine. She was not Byakuren, yet she could keep Myouren Temple true to itself even in Byakuren's absence."

KYO_shou_time_to_lost_stuff:"The pagoda is gone, what a disgrace!"
KYO_shou_time_to_lost_stuff_desc:"The pagoda is missing.\n\n What a disgrace! What a disgrace! What a disgrace!\n\n Shou stood in the Myouren Temple, her palms cold, her face stiff as if about to crack. That was the pagoda, her most important possession, the one she should never have lost. And yet, in this time of post-war reconstruction, when everyone was incredibly busy, it had vanished right before her eyes once again. If it weren't for the inappropriate setting, she would have buried herself in the ground on the spot.\n\n Minamitsu couldn't help but laugh, leaning against the door, her shoulders shaking with laughter: “Oh dear, no wonder she's the most reliable second-in-command of the Myouren Temple, she even managed to lose the pagoda!” Ichirin stood to the side, her face contorted with embarrassment. She wanted to say something for Shou, but couldn't bring herself to say something like, “It's not that bad.”\n\n After all, even she felt it was embarrassing. Shou remained silent for a long time before finally steeling herself to go find Nazrin. Nazrin, who was busy organizing ledgers, heard footsteps and, without even looking up, coldly asked, “What? Lost again?”\n\n Shou's ears turned red instantly, and she whispered, “... Nazrin, the pagoda is gone.” Nazrin finally looked up, stared at her for two seconds, and then unceremoniously cursed, “You big idiot.” She slammed the ledger shut, her tone cold and practiced, as if she'd rehearsed this line countless times. “I knew it. Someone like you, who rushes to help those suffering and then can't even remember where you put your things, would do this again sooner or later.”\n\n Minamitsu laughed even harder beside her: “One's responsible for losing, the other for picking up—perfect teamwork.” Nazrin snorted, her words sharp: “If she really loses herself too, the first thing I'll do is yell at her for three days straight.” But despite her words, she stood up, her ears twitching slightly, and began calculating recent clues, suspicious people, and places where things could be hidden.\n\n “What are you standing there for?” she glanced at Shou. “Hurry up and tell me exactly where you last touched the pagoda, who you saw, and what stupid things you said.\n\n If you dare leave out a single word, I'll yell at you until I'm done looking for things.” And so, the familiar scene in Myouren Temple played out once again: Minamitsu watched the spectacle with amusement, Ichirin was so embarrassed she wanted to hide her face, Shou shamelessly bowed her head in apology, while Nazrin, cursing “big idiot,” led the swarm of rats into the secret passages, warehouses, and ruins to retrieve her pagoda. The scene was utterly absurd, yet it made one think that, in a sense, Myouren Temple's continued existence was sustained by this relationship of mutual disdain coupled with an inability to abandon the others."

KYO_shou_nothing_happen:"Nothing Happened"
KYO_shou_nothing_happen_desc:"Nothing happened. Nothing happened. Nothing happened.\n\n Myouren Temple solemnly announces that the recent reports circulating in various places regarding “a brief warehouse fire,” “a transport team nearly being attacked,” “a local disturbance escalating,” and “a pagoda almost disappearing again” are all exaggerations, rumors, or malicious smears by individuals with ulterior motives to undermine the current stable situation. The facts have fully proven that under Lord Shou's personal supervision and overall command, all problems have been properly handled, and no potential dangers have truly escalated into disaster.\n\n Nothing happened.\n\n Because Lord Shou is here. When rumors attempted to sway public morale, it was Shou who stepped forward to reassure everyone; when some tried to incite unrest during the post-war period, she personally reorganized the monks and local garrisons, extinguishing any sparks that hadn't yet ignited; when roads were blocked and supply lines were disrupted, she led the effort to reopen transportation routes, delivering batches of food, medicine, and timber back to their intended destinations. She didn't boast or claim credit, but simply, as always, managed to keep what everyone expected as a disaster averted.\n\n Most importantly, Shou's beloved pagoda remained safely by her side. It was neither lost, nor damaged, nor fell into the hands of villains. The pagoda stood unharmed, just as the order of the Myouren Temple remained intact; the pagoda still shone in Shou's hands, just as the faith of the Myouren Temple stood firmly under her protection.\n\n Nazrin would only coldly say, “Nothing should have happened,” as if this was merely the bare minimum; Kyouko, on the other hand, had already shouted “Nothing happened” all over the place, wanting every village and town to hear Shou-sama's name; even Ichirin and Minamitsu, after truly witnessing how Shou-sama suppressed one potentially out-of-control crisis after another, had to admit—she might not be a naturally reassuring leader like Byakuren, but she was certainly the one who would firmly hold the situation in the most crucial moments.\n\n Therefore, nothing happened not because the problems never existed, but because Shou-sama arrived before the problems, stood firm before the chaos, and was more determined than anyone else to prevent Myouren Temple from being humiliated in her hands. Her caution, her perseverance, and her unwavering responsibility despite knowing her shortcomings deserve everyone's praise. Nothing happened. Nothing happened.\n\n Nothing happened.\n\n Because Lord Shou was here, because the pagoda was still standing, because the deputy of the Myouren Temple had once again proven herself worthy of everyone's trust."

KYO_shou_the_tiger:"Fierce as a Tiger"
KYO_shou_the_tiger_desc:"Seija Kijin was still on the run. Like a thorn deliberately stirring up trouble, she burrowed into the most vulnerable cracks of the post-war world, inciting resentment, sowing discord, and treating everyone who had been wounded, wronged, and trampled by the world as a potential spark. She knew too well how to speak to the lower classes, and too well how to make people believe that as long as everything was overturned, tomorrow would be better than today.\n\n Byakuren entrusted Shou with more than just capturing an enemy; she was to prove that the path the Myouren Temple offered to all beings was not just a more respectable slogan, but a path that truly allowed the lowest of the low to survive. Shou knew this was not something that could be solved by a squad of monks searching everywhere. If Myouren Temple couldn't provide a real way for those grassroots youkai to survive, then if they caught one seija today, a second and a third would rise up tomorrow.\n\n So Shou didn't rush to draw her sword. She first went to the places where seija could most easily hide and get support: the small settlements by the river, the dilapidated shacks, the makeshift markets put together by the youkai, and those who were always on the outermost edge of the order, the first to go hungry, the first to be suspected, and the first to be abandoned. She brought not empty words, but food, medicine, tools, and real support that could be put into practice. Myouren Temple built roads, bridges, and workshops, and gave those always looked down upon a meal, a bed, and a sense of security that didn't require proving how “useful” they were.\n\n Sekibanki was the first to notice. She was initially skeptical of the Myouren Temple's doctrine of compassion, always feeling that all lofty acts of kindness would eventually turn into another form of rule that demanded submission. But she saw the monks genuinely bandage the wounded, repair roofs for homeless youkai, and sit down to listen to people's complaints. Kagerou Imaizumi also saw it—the people of Myouren Temple didn't treat them as trouble and push them away just because they came from humble backgrounds, had straightforward personalities, or spoke harshly. Wakasagihime understood best that after Shou's visit, even the waterside settlements that no one had previously paid much attention to began to receive cloth and food sacks, and people started to earnestly ask: What else is needed here?\n\n These things may seem insignificant, but it was precisely these small, concrete, and warm acts that slowly changed the hearts of the lower-class youkai. They began to understand that Seija understood their anger, while Myouren Temple was truly shielding them from the storm; Seija would ignite their resentment, but Myouren Temple was gradually putting their lives back together.\n\n Finally, the defection didn't occur during a fierce battle, but rather quietly formed in the ordinary nights. The grassroots Youkai passed messages and exchanged information, gradually sending news of Seija's hiding places, relocation routes, and contacts to Myouren Temple. No one saw this as betrayal; rather, it was more like a quiet response—they weren't against resistance, but for the first time, they were willing to believe that there was another path to take.\n\n When Sekibanki, Kagerou, and Wakasagihime finally handed Seija's whereabouts to Shou, it wasn't because they had suddenly become weak, but because they understood the suffering all too well. They knew that if they simply smashed everything, they would often be the first to be buried in the rubble. Myouren Temple didn't offer them submissive obedience, but rather the hope to continue living with their heads held high.\n\n Therefore, when Seija was finally brought back, there wasn't much celebratory noise in Myouren Temple, only a quiet, flowing warmth. Everyone understood that what was brought back wasn't just a social troublemaker, but also a group of lower-class youkai proving for the first time through their choices that gentleness is not weakness, and integrity is not foolishness. As long as this kindness isn't empty talk, as long as this help is genuine, even in the most broken and easily consumed by anger, hearts can still be warmed."

 KYO_shou_follow_hijiri:"Shou will forever follow Byakuren Hijiri"
KYO_shou_follow_hijiri_desc:"Shou has always respected Byakuren, but what truly ingrained this devotion wasn't a particular victory, but rather the most difficult days after the civil war. She witnessed how her master, amidst ruins, hunger, resentment, and suspicion, still refused to let go of any outstretched hand. Byakuren wasn't unaware of the evil in humanity, nor was she ignorant of the filth of reality; she simply knew that hearts could waver, knew that kindness could be betrayed, yet still chose to bring compassion to the ground, to food, medicine, fields, and workshops. Shou finally understood that her master's true strength lay not in omnipotence, but in her willingness to believe that all beings deserved salvation even after seeing everything clearly.\n\n And Nazrin, however, gave Shou the other half of the answer. Shou was too trusting, too quick to take responsibility upon herself, and too prone to blaming herself first after making mistakes. Nazrin filled in the gaps for Shou, covering the dirty work, dangerous situations, and hidden precautions that many Byakuren didn't see or didn't need to do themselves. She always complained that Shou was clumsy, that she would lose things, be soft-hearted, and bring trouble upon herself, but whenever things went wrong or chaos threatened, Nazrin was often the first to plug the gaps. Shou wasn't oblivious; she knew that the sarcastic mouse was actually protecting her in her own way, protecting what Byakuren wanted to hold onto.\n\n Because Byakuren were there to uphold their ideals, and Nazrin was there to guard the gaps, Shou finally learned that she couldn't forever remain just a disciple following her master. She had to step forward, share the burden with Byakuren, bear the weight for Nazrin, and continue the path for Myouren Temple. She no longer clung to the idea of becoming another Byakuren, nor did she see herself merely as someone who shielded her master from disaster. She began to accept her clumsiness and to believe that even without her master's breadth of vision or Nazrin's sharpness, as long as she continued to cultivate, to learn, and to turn her beliefs into reality amidst hardship, she too could become a person capable of standing on her own.\n\n So this time, as Shou bowed her head to hold the pagoda, her heart was calmer than before. Her following of Byakuren was no longer merely out of reverence and duty, but because she had truly understood her master's path; she cherished Nazrin not just as her most reliable assistant, but as someone she could entrust her back to. From now on, whether Byakuren was present or not, no matter how much chaos and hardship lay ahead, Shou would firmly hold the ideals of Myouren Temple in her own hands. Because she could finally say with confidence—that she was not only Byakuren's most loyal disciple, but also someone worthy of standing shoulder to shoulder with Nazrin, truly protecting all beings."

 KYO_murasa_war_army_leader:"The Flying Dutchman"
KYO_murasa_war_army_leader_desc:"Minamitsu was an extremely dangerous being. She wasn't an ordinary captain, but a ghost who would drag ships to the bottom and pull the living towards sinking and drowning. That chilling aura, that aura so close to death, was enough to make many people instinctively take a step back, even if she did nothing. The sailor uniform she wore now, which looked light and even somewhat approachable, wasn't her own choice, but Byakuren's requirement. Byakuren wanted her to dress herself up as if she could still be approached, not to conceal her danger, but to remind her—she shouldn't only be dangerous.\n\n After all, Minamitsu wasn't born into the deep waters and resentment. She was once human, once lived on a ship, lived in the wind, but was betrayed, framed, and swallowed alive by the water. After that moment, what remained in the world was no longer just a person, but a ghost carrying old hatred and sunken memories. She knew fear all too well, despair all too well, and the look in the eyes of someone about to drown, clinging to nothing. Because of this, she was often more effective than anyone else in handling the most chaotic, dangerous, and easily spiraling situations after the war. She knew when people would break down, and how to seize them by the throat before they did.\n\n It was this very quality that led Byakuren to place her in positions of mobile rescue and rapid suppression. She dared to tread the dangerous paths others wouldn't take; she dared to confront the chaos others wouldn't touch; and she often managed to pull back teams and strongholds that were on the verge of collapse, on the verge of sinking with their people and belongings, once she arrived with her men. Her methods were very much like herself—ungentle, unrefined, even possessing a ruthlessness reminiscent of a dark, undead spirit. She would approach the rioters' camp at night, use near-intimidation to push the group back on track in the worst of times, and coldly observe the situation like a wrecked ship about to sink, intervening fiercely before it completely sank.\n\n Therefore, the Myouren Temple, the fastest and most ruthless mobile force, was indeed held together by her. But Byakuren was not satisfied with this. For Byakuren, it wasn't enough for Minamitsu to simply continue being a ghost adept at pulling others back from the brink of collapse. She hoped that while carrying out these missions, Minamitsu could slowly rediscover something else—rediscover the part of herself that was once human, rediscover the warmth that wasn't out of resentment, instinct, or obedience to Byakuren, but a genuine willingness to protect, approach, and understand others.\n\n This, of course, couldn't be achieved overnight. Minamitsu herself knew that her smile still carried a hint of malice, and her actions still resembled those of a ghost who knew how to sink people. She could get things done for Byakuren, and she could straighten out a situation on the verge of collapse, but she hadn't necessarily learned how to embrace others like a truly living person. The old wounds on her body, the hatred and shadows soaked in water, wouldn't disappear just because she wore a sailor uniform and said a few gentle words.\n\n But at least, Byakuren was still waiting for her. Myouren Temple was still giving her that opportunity. Perhaps much later, Minamitsu would truly understand that she wasn't just a ghost that would sink the ship; perhaps much later, she would rediscover a sliver of humanity as she saved people, navigated, and pulled others back from the brink of despair. That road was still long, so long that even she herself might not see the end. But at least for now, this dark and dangerous ship ghost has begun, in her own way, to continue Byakuren's long exploration."

 KYO_we_must_use_force:"Declaring Compassion to the World"
KYO_we_must_use_force_desc:"Byakuren knew very well that if the Myouren Temple only paid lip service to peace, then this compassion would forever remain within its gates. Therefore, she entrusted another difficult task to Minamitsu—to pilot the sacred palanquin, carrying the banner and goodwill of the Myouren Temple, to meet with leaders of various countries, to let those who had never truly understood Gensokyo, nor truly trusted Youkai, see for themselves what this country truly wanted to become. This was certainly no easy task.\n\n Minamitsu was not someone who could inspire immediate reassurance; when the sacred palanquin descended from the horizon, it seemed more like an ominous omens than a messenger of peace. When officials and envoys from various countries looked up from the deck, their first reaction was often not goodwill, but wariness. They found it hard to believe that a nation ruled by youkai and co-governed by monks and youkai could truly consider compassion, coexistence, and peace as its fundamental principles. In many people's eyes, it was too idealistic, too questionable, like a dream that could shatter at any moment.\n\n But Byakuren persisted. She had Minamitsu carry envoys, supplies, and letters to and from all corners of the world, not to beg for recognition, but to firmly present the will of the Myouren Temple to the world: We are willing to receive, we are willing to engage in dialogue, we are willing to cooperate, and we are willing to take the initiative to reduce conflict. Even if other countries still had doubts, even if each meeting felt like navigating slowly on ice, someone had to walk this path first.\n\n Because Byakuren understood that world peace was never a miracle achieved overnight. It's not a lofty slogan, nor is it a gift that can be obtained through one-sided kindness. It can only be achieved through repeated contact, explanations, and unwavering attempts despite skepticism, slowly wearing down hostility, shortening distances, and gradually pulling nations that were once wary of each other towards a shared commitment to maintaining peace. Each voyage of the sacred palanquin across the sky is a declaration from the Myouren Temple to the world—compassion cannot be understood on its own, but it deserves to be constantly spoken to the world."

 KYO_murasa_drown_people:"Find the next drowned ghost"
KYO_murasa_drown_people_desc:"Minamitsu, as a ship ghost, has never had the most primal and darkest instinct: to drown. Dragging living people into the water, watching them panic, struggle, sink, and finally become silent corpses at the bottom of the river—that is her most direct and naked desire as a Youkai. For Byakuren, this is precisely the most heartbreaking aspect: Minamitsu doesn't simply “want to do bad things,” but her very existence is inextricably linked to hurting others. She knows, of course, that it's wrong.\n\n She sees the fear of the innocent, she sees the efforts Myouren Temple makes to coexist, and she knows that every time she loses control, she tears open the trust Byakuren has painstakingly built. But simply “knowing” doesn't make the instinct disappear. The more she suppresses it, the more it's like an addiction. She becomes agitated, suffers from insomnia, stares blankly at the river, and hears the echo of a drowning person's last breath. Once that impulse surges, she can hardly separate it from herself. She can't control herself, nor can she easily save herself, so that resentment, that old wound from drowning, is often vented on people she has no connection with. Byakuren never downplays this.\n\n She wouldn't make excuses for Minamitsu, nor would she portray the victims' lives as “necessary sacrifices.” Every time blood mingled with the river water, every time someone died because of Minamitsu's nature, it was the most painful test for Byakuren regarding their ideal of coexistence between humans and yokai. If the essence of yokai is built on harming humans, then how should we deal with an existence like Minamitsu? Eliminate her to protect more innocent people? Or keep her alive, letting her repeatedly harm others amidst her struggles and loss of control? This isn't a problem that can be solved with a word of mercy, nor is it a difficult issue that can be easily resolved with a word of justice.\n\n Because Minamitsu isn't entirely without remorse, nor is she completely unwilling to change. She falls silent when she's sober, loathes herself in the dead of night, and subconsciously avoids eye contact when Byakuren calmly observes her. She's not unaware of what she resembles; she simply can't yet avoid becoming that thing. Thus, Myouren Temple was forced to confront a reality no one wanted to answer, yet which they couldn't avoid: if they couldn't even handle the inherently dangerous Youkai, whom they themselves might not be able to control, then was so-called coexistence truly salvation, or just another form of cruelty towards the victims?\n\n Minamitsu stood at the very center of this problem. She was both the touchstone of Myouren Temple's ideals and the crack most likely to shatter everything. Byakuren was unwilling to easily abandon her, because abandoning her was almost tantamount to admitting that some Youkai could never be pulled back to shore; but if they continued to keep her, it meant that Myouren Temple had to bear that heavy, almost cruel responsibility—believing that salvation was still possible while forever guarding against the possibility of the next corpse appearing in the river."

 KYO_murasa_no_one_hurt:"Restraining one's habits"
KYO_murasa_no_one_hurt_desc:"“Control yourself.”“Control yourself.”“Control yourself.” During those days, Minamitsu locked herself in an empty room, the doors and windows tightly shut, the lights dim, as if trying to suffocate herself and the overflowing desire in the darkness. The only thing that came repeatedly from inside was the same sentence. She repeated it over and over, like a mantra, like a cry for help, her voice sometimes as low as sand grinding in her throat, sometimes suddenly shrill, like someone driven mad by themselves. She knew she was losing control, knew that the instinct to drag someone down, to watch someone drown before her eyes, had surged up again. She could only grit her teeth, lock herself in, and tell herself over and over: Control yourself, stay normal, don't go out, don't hurt anyone else.\n\n Myouren Temple everyone heard that struggle. It wasn't ordinary irritability, nor a momentary temper; it was like someone being pinned to the ground and repeatedly torn apart by their darkest part. Kyouko was the first to panic. She stood outside the door, her ears drooping, banging on it repeatedly, yet afraid to actually rush in. She could only shout through the door, “Minamitsu, hold on! Can you hear me? You can do it, you're not all that's left!” Her voice echoed through the corridor, burning hot, as if trying to dispel the almost frozen deathly atmosphere in the room.\n\n Ichirin stood guard not far away, saying little, but her fists clenched white. She knew that in this situation, mere persuasion was useless, yet she still stood there, like a defensive line. If Minamitsu really rushed out, she would stop her first; if Minamitsu ultimately held on, she would be the last to leave. Nazrin, with an expression of utter disdain, coldly removed anything potentially harmful, cleared the corridor of people, and placed water and food by the door, muttering under her breath, “Don't die in there, and don't go so far as to break the door down.” But everyone could see that beneath her harsh exterior lay a deep reluctance to let go.\n\n Shou lingered at the door for a long time, finally placing her hand lightly on it and softly reciting scriptures. She wasn't adept at handling this uncontrolled darkness, and knew that much of what she said might not actually reach her, but she still wanted Minamitsu to know that someone was outside, that Myouren Temple didn't see her as a monster destined to be locked away. Byakuren, however, remained steadfast. She didn't force the door open, nor did she use a casual word of compassion to mask Minamitsu's pain. She simply stood guard quietly, as if waiting for Minamitsu to slowly crawl back from the deepest depths. For Byakuren, this was the most important thing—not to erase her struggle, but to let her know that when she desperately suppressed that desire, she wasn't fighting against herself alone in the darkness.\n\n So, during those days at Myouren Temple, everyone did their part to create a little space for Minamitsu. Kyouko's voice, the unwavering figure standing there, Nazrin's stubborn yet meticulous arrangements, Shou's low-pitched chanting, Byakuren's unwavering presence—all these gradually accumulated outside that door. No one dared say that Minamitsu had truly conquered herself this time, no one dared say that desire wouldn't return. But at least this time, she wasn't fighting alone.\n\n And the repeated words inside the room were finally no longer just ravings. “Control yourself.” That was the command she gave herself, the first time under Byakuren's tutelage that she truly took control of her own reins. Perhaps the road ahead is long, perhaps she will stumble many times, but everyone in Myouren Temple has heard it—Minamitsu hasn't given up the struggle, and they won't give up protecting her in this struggle."

 KYO_murasa_lord_captain:"The Great Starship Captain"
KYO_murasa_lord_captain_desc:"If there's anything about Minamitsu that even the most demanding person can't deny, it's her skill in navigating. She's a natural-born ship, a vessel of decks, rudders, and waves; it's as if the moment her hands touch the rudder, the entire ship comes alive. What others see as raging storms, swirling currents, and treacherous waterways are merely ordinary tests to her; as long as the ship is in her hands, crises that could have destroyed the entire fleet are often miraculously averted by her.\n\n Minamitsu always possesses an almost domineering confidence when navigating. She's not afraid of the wind, the rain, the sea fog, or the darkness of night. No matter how violently the ship rocked, no matter how fiercely the waves crashed, as long as she stood at the bow or helm, the chaos always seemed to fall just short of truly engulfing the entire ship. She knew how to press the bow with the wind, how to gain the angle before the waves crashed down, how to get the ships behind to keep up, and when to risk going straight through the storm, and when to calmly avoid that deadly reef. These weren't theoretical skills, but the intuition of a true captain, a skill honed from countless brushes with death.\n\n And that's why, as long as Minamitsu was there, the morale of the fleet would be stable. Because everyone knew that this ship ghost might be dangerous, gloomy, and her smile might send chills down your spine, but once on board, she was the most trustworthy person. She would lead the supply lines to their destination, guide ships out of the storm, and make voyages that seemed impossible appear miraculous, but rather natural, under her command. The difficulties were still there, of course, but as long as she stood at the forefront, those difficulties suddenly seemed less daunting.\n\n The Youkai were never easily convinced of anyone's worth, but when it came to Minamitsu's ship-riding skills, even the most discerning had to shut up. Because that wasn't a title built on boasting, but rather a skill proven time and again in storms and perilous situations. She was the one who could steer the ship into the most dangerous places and bring the entire fleet back intact; she was the one who could keep hope from sinking; and she was the one among the Youkai who truly deserved the title of “Great Captain.” Whether it was applause, awe, or heartfelt praise, Minamitsu deserved it all."

 KYO_murasa_follow_hijiri:"Minamitsu will forever follow Byakuren Hijiri"
 KYO_murasa_follow_hijiri_desc:"When Byakuren pulled Minamitsu out of the darkness, she never forced her to pretend she had been saved. She knew the resentment in Minamitsu's heart, she knew the instinct to drag her down, and she knew it wasn't something that could be easily erased with a few words of comfort or a few sermons. Byakuren didn't expect her to immediately become a docile and harmless person; she simply never let her go, always giving her a path to keep moving forward.\n\n And Minamitsu knew very well that her redemption was far from over. She would still waver, still be dragged back by old wounds and resentment, still hear those submerged voices in the night. She hadn't truly conquered herself, and dared not say she deserved forgiveness. But precisely because of this, she understood even more clearly that she couldn't leave Byakuren. If there was anyone in this world who, after seeing all her cracks, still believed she could one day reach the shore, that person was only Byakuren Hijiri.\n\n So Minamitsu was willing to continue following her, not just out of gratitude, nor just because the Myouren Temple had given her shelter, but because she wanted to complete the lessons Byakuren had given her. Learning restraint, learning to protect, learning not to think of destruction when wielding power, learning to be more than just a spirit bringing drowning and fear—these are long journeys, but she was willing to continue.\n\n For Byakuren, this was not simply a matter of taking her in. She hoped Minamitsu could truly complete these lessons, because only when a youkai like Minamitsu could learn step by step to restrain her instincts, learn to protect others, and learn to transform the power to harm into the power to protect, would the coexistence of humans and youkai not just be a pretty sign in front of the temple gate. If even the most dangerous, darkest, and closest to the essence of youkai were not abandoned, then the so-called coexistence would have the right to be called reality.\n\n So Minamitsu will continue to stand by Byakuren's side. Not because she has found the answer, but because she is still searching for it; not because she has been saved, but because she is finally willing to continue this long journey of salvation. As long as Byakuren is still willing to give her direction, she will continue her voyage, continuing to complete those difficult, almost cruel lessons for her master, until one day, she can truly carry the shadow of her undead body to that Higan where coexistence is no longer just a dream."

 KYO_kyouko_spring_time:"Everyone's Happy Fruit"
KYO_kyouko_spring_time_desc:"Kyouko was like a spring breeze that arrived quickly. She was warm, cheerful, and spoke frankly; her laughter seemed to brighten even the darkest corners of the Myouren Temple. To Byakuren, she was not just a lively disciple, but held a special significance—she was the first new Youkai believer to actively enter the Myouren Temple and willingly follow Buddhism after Byakuren's seal was broken.\n\n At that time, the Great Hakurei Barrier shattered, the old order was torn apart, and the spiritual power of many weak Youkai who relied on faith, rumors, and human fear to survive was gradually dissipating. They did not die in a fierce battle, but rather quietly withered away and disappeared, as if slowly forgotten by the world. Kyouko was one of them. At that time, she was still very young, ignorant, and panicked, not even understanding whether she would starve to death first, disperse first, or be completely abandoned by this new world first.\n\n It was Byakuren, who had just broken free of their seal, who pulled her back from the brink of extinction. Byakuren offered her more than just shelter or words of comfort; they provided a true path of spiritual practice that would allow youkai to continue living. For Kyouko, the scriptures and doctrines were not merely Buddhist texts, but a new path to survival—youkai didn't necessarily have to live on human fear, didn't necessarily have to be anyone's appendage or reflection; they could find their own way of being through practice, through their own hearts, and through their own will. From that day on, Kyouko truly realized that youkai weren't just things defined by humans; they could be individuals with their own thoughts, their own paths, and their own choices.\n\n It was precisely because of this that Kyouko felt an almost instinctive closeness and trust towards Byakuren. She was willing to run around with a smile, to speak up for the Myouren Temple, and to warm up the atmosphere again in the coldest of times. But Byakuren also knew very well that Kyouko was too young, had seen too little malice, and was too straightforward. She was too trusting, too easily swayed by a few kind words, and too easily led astray by those with ulterior motives.\n\n Her kindness and enthusiasm were genuine, but it was precisely this authenticity that made her more vulnerable to exploitation. Therefore, Byakuren didn't send Kyouko alone, but instead had her accompany the other disciples to construction sites, to the countryside, to disaster victims—to places that truly toughen a person up. She wanted her to learn responsibility and perseverance from Ichirin, to see what protection and commitment meant from Shou, to understand from Nazrin that not all smiles are trustworthy, and to realize from Minamitsu that even someone covered in shadows can still struggle forward. For Byakuren, Kyouko shouldn't forever remain the cheerful, funny girl in Myouren Temple; she needed to grow her own judgment, her own weight, and her own backbone while accompanying others on their missions.\n\n Even so, Kyouko's spring-like spirit remains one of the most precious things in Myouren Temple. She would offer a cup of hot water to a wounded soldier covered in dust, she would be the first to shout when the atmosphere on the construction site was gloomy, and when everyone was almost suffocating under the weight of hardship, she would bring back a bit of laughter, a bit of liveliness, a bit of “we're not finished yet.” She could laugh not because she didn't understand pain, but because she had once stood on the verge of disappearing, so she cherished every day of “being alive, being able to speak, and being able to keep moving forward” more than anyone else.\n\n Kyouko is still growing, and she will still stumble and fall. She is not yet truly mature, and she is far from being steady. But Byakuren believes that as long as she continues to walk with everyone, and continues to hone herself in the process of helping others, one day she will truly understand: Youkai is not a shadow that exists to depend on humans, nor is she an empty shell that can only be fed by fear and faith. Youkai can also live with dignity, standing in this world as a person with self, choices, and a heart. Then, what Kyouko brings to everyone will not just be a fleeting spring breeze, but a voice that can make more people believe in tomorrow again."

 KYO_kyouko_democracy_shipping:"The Voice Spreads Throughout the World"
KYO_kyouko_democracy_shipping_desc:"Kyouko, as yamabiko, has never possessed the greatest strength in combat, but in her voice. Her shouts can echo through valleys, cross villages and roads, and deliver messages to those who need them most in the shortest time. For Byakuren, this ability should not be just a trick of yours, but the warmest light in the Myouren Temple—letting the lost know where the path still lies, letting the suffering know where someone will reach out, and letting those on the verge of despair hear again, “You have not been abandoned.”\n\n Thus, Kyouko began to take on the work of communication, broadcasting, and rallying support. Wherever food and medicine arrived, wherever construction sites were recruiting, wherever temporary shelters and soup kitchens were set up, wherever someone needed emergency assistance, she would use her voice to spread the news immediately. Her voice was faster than a messenger, farther than a notice, and more believable than a cold command. It wasn't just simple dissemination, but like a constantly spreading echo, sending the existence of the Myouren Temple and the goodwill of Byakuren into the hearts of everyone who was still hesitant and still struggling.\n\n More importantly, Kyouko's voice always carried a kind of enthusiasm and childlike innocence that was hard to fake. She wasn't as solemn as Byakuren, nor as upright as Shou, nor as sharp as Nazrin. She spoke directly, laughed brightly, and even shouted a bit loudly, but it was precisely because of this that it was easiest for people to lower their guard. Those who were initially skeptical of the Myouren Temple were often not moved by the scriptures first, nor persuaded by the system first, but rather infected by Kyouko's genuine liveliness. She seemed to be telling everyone with her voice: this isn't a place where people just preach from a high place; here, there are genuine people willing to help you, and they genuinely hope you'll help others in the future.\n\n Over time, more and more people found Myouren Temple because of her voice, and for the first time, they were willing to go from bystanders to participants. Some came for relief but stayed to help move supplies; some initially came seeking refuge but ended up working in workshops and fields; others initially just wanted a way to survive but later learned at Myouren Temple how to lend a helping hand. Kyouko's voice not only spread the message further but also gradually connected “being saved” and “saving others” into one.\n\n For Byakuren, this is precisely what makes Kyouko so precious. She's not just the life of the party at Myouren Temple, nor just a guy who can liven up the atmosphere. Her voice itself is Myouren Temple's best declaration—warm, direct, sincere, and far-reaching. As long as she keeps calling out, the kindness of Myouren Temple won't just stop inside the temple gates, but will continue to spread further, bringing more people still in darkness into the light, little by little."

 KYO_kyouko_is_too_loud:"Annoying Stupid Dog"
KYO_kyouko_is_too_loud_desc:"Kyouko's voice doesn't always bring warmth. She's too young, too inexperienced, and too used to facing every situation with straightforward enthusiasm. She always felt that as long as she spoke kind words, heated up the atmosphere, and encouraged everyone, things would move in a positive direction. But reality is never like that. When people are hungry, advising them to be optimistic sounds like mockery; when people have just lost a loved one, telling them to “look forward” feels like a knife; and in situations where everyone is already suppressing their anger and testing each other, even the brightest voice can become particularly jarring because of the inappropriate timing.\n\n Kyouko first truly realized this during an argument at a resettlement site. She had intended to rekindle the almost-cooled spirits with a few warm words, as usual, but she hadn't noticed the weariness, shame, and resentment already rising in their throats. Her words only made the atmosphere more tense. Some frowned, some sneered, and some simply turned their faces away, as if her overly bright kindness was more unbearable than silence. Kyouko froze, realizing for the first time that a loud and sincere voice wasn't always enough to save the day.\n\n Nazrin, of course, wasn't polite, coldly remarking, “You're not comforting people, you're rubbing salt into their wounds,” which made Kyouko's face fall. Ichirin, unusually, didn't speak up for her, simply letting her stand there and listen to what truly weighed on the silence. Even Byakuren didn't immediately offer a gentle explanation. Because only Kyouko herself could truly learn from this experience.\n\n She slowly realized that sweet words, spoken at the wrong time, become annoying noise; sincerity, if not expressed by understanding the person, the occasion, and who is suffering, may just be another form of self-satisfaction. Kyouko wasn't bad, nor did she not want to help others; she was just too eager to shove light into others' lives, forgetting that some people at that moment didn't need light, but rather permission to breathe in the darkness.\n\n So, she began to learn to restrain herself. Not by stopping speaking, but by learning to listen first; not by ceasing enthusiasm, but by learning to discern when to speak up and when to quietly accompany. For Byakuren, this was also one of Kyouko's lessons—if yamabiko's voice only echoed, it would ultimately be empty noise; but if she could learn to let her voice fall at the right time, then she would truly be qualified to call everyone back to hope."

 KYO_kyouko_is_good_dog:"The cutest dog"
KYO_kyouko_is_good_dog_desc:"The children loved running after Kyouko.\n\n It wasn't because she could preach any grand principles, but because she was like a child herself. She would squat down and watch the ants carrying things with the human children, imitate them splashing in puddles, chasing shadows, and competing to see who could climb a low wall first. She would also seriously treat a strangely shaped stone as a treasure, excitedly showing it to others. She was very attentive when taking care of the elderly and worked hard when helping people move goods, but as soon as she turned her head and saw the children playing, she would often laugh along, as if she had briefly forgotten this chaotic world.\n\n She would call everyone from the rooftop to distribute food, and after distributing the food, she would secretly slip the last piece of candy to a crying child; she would play clapping games with the children, imitate bird calls, compete to see who could shout the loudest, and even when she fell, she would first dust herself off before looking up and laughing foolishly. The adults were initially taken aback, as if they didn't quite understand why there was such a Youkai in Myouren Temple—she wasn't like other Youkai who instilled coldness, nor did she possess that oppressive aura that forced people to bow their heads.\n\n She was more like a warm, fluffy little animal that would come running to rub against people, making it hard for anyone to truly be wary of her. When someone jokingly called her a good dog, she would immediately retort, blushing and shouting, “I'm not a dog! I'm yamabiko!” But her ears would honestly perk up, and her tail-like emotions would wag instantly. Because for Kyouko, being liked, needed, and genuinely greeted was the most direct and precious joy. Her thoughts weren't complicated; she simply wanted everyone to be a little closer, to have fewer people cry, and to make the world, even if only for a little while longer, as bright as when children are playing.\n\n This was actually a very strange thing. Youkai are supposed to be beings that inspire fear and retreat in humans, used to explain the inexplicable. Youkai are shadows of awe, the embodiment of nature and darkness in the human heart, something humans have given shape because they don't understand, because they are afraid, because they cannot control. Logically, Kyouko should be such a youkai. She should stand on fear, should send chills down people's spines when she hears her echo, should be some kind of strange being that people dare not approach in the mountains and valleys.\n\n But she is not. Kyouko has almost none of the malice that traditional youkai should have. She doesn't enjoy frightening human children, nor does she feel satisfied because others fear her. In fact, it could be said that it is precisely because she lacks that youkai essence that forces people to bow down that she seems so weak, so weak that when the Great Hakurei Barrier trembled, she almost, like other weak youkai, was slowly forgotten by the world.\n\n But what Byakuren sees is precisely this “weakness.” Because it also represents another possibility: youkai don't necessarily have to be parasites of fear forever, they don't necessarily have to prove their existence through oppression and fright. Youkai like Kyouko can also be remembered for warmth, companionship, laughter, and kindness; they can also live as individuals with their own hearts, their own joys and sorrows, and their own desires.\n\n Therefore, Kyouko's cuteness is never just about being likable. She is like a piece of proof from Myouren Temple to this world—that youkai don't have to be a reflection of human fear, but rather another kind of being that can stand shoulder to shoulder with people, laugh with children, and warm up cold days again. If her voice can call people back, then her bright, childlike heart is telling all youkai: you may be able to live in another way."

 KYO_kyouko_apprentice:"Reading Buddhist Scriptures Intensively"
KYO_kyouko_apprentice_desc:"Kyouko initially followed Byakuren not because she truly understood many scriptures. She simply liked the liveliness of Myouren Temple, liked being called by name, and liked that here, unlike the outside world, youkai were not always treated as something to be feared, driven away, or eventually consumed. But the longer she followed Byakuren, the more she understood that enthusiasm, a few echoes, and a face that always made people smile were far from enough. Myouren Temple was too busy.\n\n Some had to provide relief, some had to clean up construction sites, some had to comfort the displaced, and some had to maintain the order that could crack again at any moment. When Kyouko first truly witnessed all of this, she didn't feel retreat, but rather a somewhat clumsy yet genuine sense of resentment—she didn't want to forever remain the junior disciple responsible for enlivening the atmosphere, nor did she want to always stand behind others, being protected, cared for, and reminded. She wanted to truly share some of the burden for Myouren Temple, to be able to do her job well even when Byakuren wasn't watching her.\n\n So, she finally sat down quietly and began to carefully read the Buddhist scriptures page by page. It wasn't easy for Kyouko. She wasn't the type to sit still; her ears would always chase after outside sounds, and her mind would often wander aimlessly. But she still gritted her teeth, pressed herself against the scriptures, learned from Byakuren, followed her questions, and memorized, pondered, and tried to understand why these words had sustained Myouren Temple to this day.\n\n She gradually understood that Buddhism wasn't just about speaking gentle words or constantly uttering words of compassion. It taught how to remain calm amidst chaos, how not to turn away from suffering, and how to reach out and help others even when you know they each have their own troubles, biases, and hardships. The more Kyouko read, the more she realized she had previously been like an outsider, jumping around watching the spectacle, but now she was truly grasping the essence of things.\n\n And these scriptures didn't just remain on paper. She began to apply what she had learned to her daily life at Myouren Temple: helping those who were overwhelmed with work, looking after the newly taken-in, still wary young girls, sitting with those who had lost loved ones and didn't even want to speak, and reiterating the teachings of Byakuren in a way that others could understand. Her voice remained bright, and her laughter still resembled that of a child, but that brightness had slowly gained weight. Looking at Kyouko, Byakuren felt a sense of relief.\n\n She knew that this little yamabiko, who always loved to run around and whose mind was as restless as a spring breeze, was finally beginning to stand firm. She was no longer just the most endearing and lively one in Myouren Temple; she was beginning to become someone who could bear the burdens of others. Perhaps Kyouko wasn't mature yet, but she was already moving in that direction.\n\n Byakuren also hoped that one day Kyouko could continue to pass on what she had learned from Buddhism to more people. To enlighten those lost humans, to support those youkai who were about to disappear, and to make them understand that neither humans nor youkai are simply things pushed along by fear and fate. As long as they are willing to cultivate their minds, willing to support each other, and willing to continue to do good in this broken world, then peaceful coexistence will not just be an empty phrase in the scriptures of Myouren Temple.\n\n And Kyouko will ultimately become one of the true pillars of the new generation of Myouren Temple. Not because she is the smartest, nor because she is the strongest, but because she is willing to learn, willing to grow, and willing to hone her warm heart into something that can illuminate others."

KYO_kyouko_follow_hijiri:"Kyouko will forever follow Byakuren Hijiri"
KYO_kyouko_follow_hijiri_desc:"Kyouko's initial reasons for following Byakuren weren't particularly grand. She simply found Myouren Temple warm, and Byakuren's gentle yet firm demeanor reassuring. She felt that unlike the outside world, where youkai was always seen as someone destined to be driven away, used, and forgotten, this place was different. For Kyouko, whom Byakuren rescued after breaking the seal, Myouren Temple was first and foremost a place to survive, and only later did it slowly become a place where she could hold her head high.\n\n But the longer she followed Byakuren, the more Kyouko understood that liking and being close to her alone wasn't enough to truly stand by her master's side. She saw Ichirin hone her own confusion and hesitation into a backbone that could support everyone; she saw Shou, even when Byakuren wasn't around, still grit her teeth and shoulder responsibilities one by one; she saw Nazrin, though sharp-tongued, always patching up loopholes for everyone in the darkest corners; she also saw Minamitsu, despite being full of shadows, still gritting her teeth time and time again, refusing to sink completely. No one in Myouren Temple got to where they are today easily.\n\n Everyone is struggling, everyone is training, everyone is supporting Byakuren's ideals bit by bit in their own way. Kyouko first truly felt anxious at that moment. She didn't want to forever remain just the cheerful one who could liven up the atmosphere, make children laugh, and run around helping out in times of chaos. She knew others liked her, and she knew her laughter and liveliness were indeed useful, but she also began to fear—if one day Myouren Temple really needed a pillar to support the roof beams, would she just be that cute-looking but ultimately unbearable plank next to it?\n\n So, she began to study the scriptures diligently, to listen attentively to people, and to take on the tedious tasks she used to want to run away from. She no longer just appeared when everyone needed excitement; she began to take on the small, unnoticed tasks when everyone was busiest, most tired, and least attentive to detail. She talked to the injured, arranged food and clothing for the elderly and children in the shelter, ran errands for Ichirin, relayed messages for Shou, and even, when Nazrin was too lazy to explain, smiled and reiterated those cold, harsh words to others. She made mistakes, said the wrong things, and sometimes created awkward situations due to her naiveté, but she no longer retreated in frustration at the first sign of trouble.\n\n She began to learn to correct herself, to be patient, and to do better next time after being reminded.\n\n And everyone in the Myouren Temple saw these efforts. Ichirin was the first to notice that Kyouko, who always clung to her asking questions and would often run off to watch the commotion, could now quietly complete tasks assigned to her. She would even proactively help her tidy up the crowds when she was overwhelmed. Shou also saw that Kyouko was no longer just a child cheering her on from behind; she would proactively spread messages, call for help from those in need, and rekindle the spirits of those whose hearts were nearly broken in the chaos when Kyouko hesitated, was exhausted, or overwhelmed. Nazrin, though still complaining that she was noisy, silly, and too trusting, had to admit that this seemingly clumsy Kyouko had begun to learn to read the room, to discern when to speak and when to listen, and to channel her warm sincerity into truly useful things. Even Minamitsu lazily remarked one night, “You're finally not just a troublemaker anymore.” For Kyouko, this was a remarkable compliment. And Byakuren has always been watching her.\n\n She watched this first new follower she took in after breaking the seal, watched her grow from a young youkai who almost vanished with the wind, only knowing how to follow the crowd, into someone who can truly share the burden of others. Kyouko's growth wasn't earth-shattering, and no one would describe her as legendary. She simply worked hard day by day, learned little by little, got up again and again after falling, and honed her heart, which was always too hot, too straightforward, and too easily hurt, into something that could truly illuminate others.\n\n So today, Kyouko can finally proudly say that she follows Byakuren no longer just because she likes her master, nor just because Myouren Temple gave her a way to live. She will continue to follow Byakuren Hijiri because she has seen with her own eyes that this path can truly save people, and can truly allow youkai to no longer live solely out of fear. She wanted to continue shouting this path, to shout it to more lost humans, to shout it to more Youkai who were about to disappear, until one day, peaceful coexistence would no longer be just a wish in scriptures, but a reality that could truly fall on the land.\n\n From now on, Kyouko would continue to follow Byakuren, and would continue to grow towards becoming independent. She was still young, still prone to foolishness, and still retained that almost childlike brightness. But this time, everyone had seen it—this little mountain hermit who always loved to laugh, always loved to shout, always loved to pull people towards warmth, had begun to become a truly reliable member of the Myouren Temple."

 KYO_hijiri_our_lord_and_savior:"From the Myouren Temple"

KYO_hijiri_our_lord_and_savior_desc:"When the disciples returned from their respective paths, none of them became another Byakuren.\n\n Nazrin remains suspicious, but has learned to leave a way out for others even amidst doubt; Ichirin no longer mistakes responsibility for fate, but instead chooses the path she wants to take; Shou is still clumsy and still prone to self-blame, but has become able to support Myouren Temple even when Byakuren is absent; Minamitsu hasn't completely shaken off the old grudges from the deep waters, but she's begun to restrain her hurtful instincts; Kyouko is still noisy, naive, and easily trusting, but has finally learned when to speak and when to listen first.\n\n Byakuren didn't heal all their gap, nor did she turn them into uniform disciples. She simply helped each of them find a place to belong, and taught them to extend an imperfect hand when someone is about to fall.\n\n After dinner was served, they still argued, mocked each other, and clattered their bowls and chopsticks. But no one left the table because of it.\n\n Looking at this group of Youkai with such different personalities, backgrounds, and desires, Byakuren saw for the first time so clearly that the Myouren Temple itself was the smallest prototype of what she was pursuing.\n\n If such a troublesome group of Youkai could sit at the same table, then perhaps humans and Youkai could live together without having to become each other.\n\n Now, she had to take this question out of the temple gates."

KYO_hijiri_my_apprentice:"Seeking Insights from All Beings"

KYO_hijiri_my_apprentice_desc:"Byakuren did not immediately send her disciples to teach Buddhism to the world. She first let them see, hear, and understand how beings outside the temple gates truly lived.\n\n The mission traversed post-war villages, factories, colonies, and borders. Nazrin was tasked with exposing the overly beautifully packaged lies; Ichirin spoke with workers, farmers, and thinkers, listening to their stories of hunger that faith could not directly quench; Shou visited leaders in various places, venturing into the slums rarely visited by them; Minamitsu piloted the sacred chariot ship, transporting supplies and witnessing how wealth flowed through the port, bypassing those who needed it most; Kyouko brought back the voices she heard along the way, bringing back not only praise but also doubt, anger, and rejection.\n\n They originally went to help the world understand the Myouren Temple, but ultimately discovered that the Myouren Temple also needed to understand the world.\n\n The journey to enlightenment is not about bringing pre-prepared answers to others. The true scriptures are written in the lives of sentient beings—how they suffer, how they deceive, how they love, and how they leave a meal for a stranger in dire straits."

KYO_hijiri_has_shortcoming:"The Human–Youkai Divide"

KYO_hijiri_has_shortcoming_desc:"The experiences brought back by the disciples gradually shook the world's established classifications.\n\n Humans fear Youkai, yet they also deceive, betray, and slaughter their own kind; Youkai possess monstrous and dangerous abilities, yet they also care for the wounded, keep promises, and shield lives from harm. Some wear human forms, treating others as objects to be calculated and discarded; others, born from resentment, fear, and abandonment, cherish a meal, a word of trust, and a home to return to more than many.\n\n Some Youkai are simply human emotions manifested in physical form. Vengeful spirits preserve unquenchable hatred, Tsukumogami bear the resentment of those abandoned, and yamabiko responds to the voices people send to the mountains. They seem distant from humanity, yet often reveal the human heart more honestly than humans themselves.\n\n Byakuren thus understands that humanity is never exclusive to humans, and cruelty is not an innate characteristic of the Youkai. What determines where a life should stand is not its race, but how it uses its power and how it treats those weaker than itself.\n\n Myouren Temple will bring these observations to the world. Not to prove that the Youkai are superior to humans, but to make everyone acknowledge that there is never a line drawn between good and evil based on race."

KYO_hijiri_can_not_save_everyone:"No one is born to bow down."

KYO_hijiri_can_not_save_everyone_desc:"Oppression in the world doesn't only occur between humans and youkai.\n\n Colonial empires defined people in distant lands as subjects, laborers, and numbers to be conscripted; mines, railways, and factories devoured their lives, then sent wealth to cities where these dead had never seen them. The strong determined the place of the weak, civilization named barbarism, and masters told their servants that all of this was the naturally formed order.\n\n Byakuren cannot accept this notion. If humans can enslave humans, and youkai can trample on the weak youkai, then merely ending the hostility between humans and youkai is far from coexistence. The world cannot praise equality for all beings while allowing a few nations to treat other peoples, lands, and nature as their own property.\n\n Myouren Temple will first bring food, education, organizers, and the power to empower the locals, and will also give the rulers a chance to stop the oppression. But Byakuren no longer believes that everyone will turn back simply because they hear the truth.\n\n Compassion cannot demand that the suffering wait forever. If those self-proclaimed masters insist on holding onto the chains, the Myouren Temple will sever them with its own hands."

KYO_hijiri_we_are_rule:"Leaving a Place for All Beings"

KYO_hijiri_we_are_rule_desc:"As more and more countries are willing to accept the Myouren Temple's aid and protection, Byakuren must answer an even more difficult question: In this new shared society, where should humanity, youkai, and nature stand?\n\n This so-called place is not about confining humanity to cities, driving youkai back to the mountains, and leaving nature as an unattended empty space between the two. Humans need fields, roads, industry, and jobs to support their families; youkai need to perpetuate their culture, abilities, and ways of life; forests, rivers, and mountains cannot be allowed to exist only when they are undeveloped.\n\n If human development requires the complete disappearance of Youkai, then it is a world solely for human consumption. If the survival of Youkai requires humanity to live in perpetual fear and sacrifice, then it is merely another form of domination. If both treat nature as an inexhaustible resource, then all living beings will ultimately lose their home.\n\n What Byakuren seeks to establish is not a hierarchical hierarchy, but a shared bottom line: humans have the right to build and live, Youkai have the right to exist in their own form, and nature must also have space for restoration and continuation. Neither side can reduce the other two to mere sustenance, tools, or obstacles.\n\n Countries willing to accept this bottom line will be invited into the new order established by the Myouren Temple. They do not need to convert to Buddhism or abandon their names, but they must acknowledge that the world no longer belongs solely to the most powerful life form."

KYO_hijiri_divine_savior:"Let Goodwill Take Root on Earth"

KYO_hijiri_divine_savior_desc:"Mutual understanding alone is not enough to sustain coexistence.\n\n A person who suffers from hunger year-round will find it difficult to let go of hatred because of a few Buddhist teachings; a person who may disappear at any time due to the loss of legends and dwelling places will not believe in tomorrow based solely on human guarantees. If land, wealth, education, and security remain in the hands of a few, then so-called tolerance is merely a virtue that only the wealthy can afford to maintain.\n\n Byakuren re-examines Buddhism and socialism. Buddhism allows her to see that all beings suffer, while socialism points out that much suffering does not stem from individual evil, but from the way wealth, labor, and power are distributed. The two need not be adversaries: compassion must be grounded in food, housing, schools, healthcare, and the dignity of labor, and equality must remember that behind every number lies an irreplaceable life.\n\n Myouren Temple will gradually connect the production, relief, and administrative systems of various countries, allowing resources to cross old borders and reach those who truly need them. Common life cannot rely solely on the self-awareness of good people; it must possess a foundation that continues to protect the vulnerable even when saints are no longer present.\n\n Byakuren will borrow from socialism's insights into reality, but will not treat any theory as unquestionable truth. For a pure land to be built on earth, it must be able to accommodate the questions of all beings."

KYO_hijiri_love_is_everything:"We don't have to be the same to live together."

KYO_hijiri_love_is_everything_desc:"As the borders between countries gradually fade, new questions finally confront Byakuren.\n\n If a nation must adopt the Myouren Temple's system, accept its doctrines, and understand equality according to its rules to be eligible to enter this shared world, then how is such integration different from those past empires that demanded foreign races abandon their languages, beliefs, and memories? Byakuren remained silent for a long time.\n\n She recalled how Ichirin had once loathed being led through a life arranged for her, how Nazrin could never completely let go of her wariness, and the shadows on Minamitsu that couldn't be easily erased by scriptures. The Myouren Temple became a family not because its disciples finally became like her, but because they could retain their own personalities, questions, and scars, and were still willing to share some of each other's burdens.\n\n'If you must first become me before I allow you to stay by my side, that's not coexistence. '\n\n The new integration will unify the legal system, aid system, and basic rights protecting all beings, but it will not require all regions to have the same culture, beliefs, and way of life. Buddhism can guide the Myouren Temple, but it cannot be the yardstick for judging whether beings deserve freedom. Old borders can disappear, but the names and memories of places need not be buried.\n\n Living together is not about synthesizing millions of voices into one, but about ensuring that even when they conflict, they do not have to be silenced to continue existing."

KYO_hijiri_all_bow_to_her:"Reclaiming Equality Under the Red Flag"

KYO_hijiri_all_bow_to_her_desc:"Socialism once promised that workers would no longer be cogs in a machine, and that the oppressed would reclaim the right to determine their own lives. Byakuren understands this aspiration and sees in it the practical tools that Buddhism lacks.\n\n However, news from Russia is making this ideal seem unfamiliar. The party-state claims to represent all workers, yet forbids them from opposing it; bureaucrats, in the name of the people, decide what the people should say and believe, while regarding hesitation, criticism, and differing opinions as errors that must be eliminated.\n\n The old era divided masters and servants by bloodline; the new despotism divides the correct and the enemy by ideology. It doesn't necessarily require all people to have the same face, but it demands that everyone understand the world in the same way.\n\n This is also not equality. If equality doesn't allow for dissent, all that's left is everyone obeying in the same way. If liberation requires first transforming living people into the form required by theory, then ultimately only theory itself will gain freedom.\n\n Byakuren will not abandon socialism's pursuit of labor, wealth, and dignity. She wants to reclaim these ideals occupied by bureaucrats and the secret police and return the right to choose one's path to all people."

KYO_hijiri_do_my_best:"Rejecting a World That Only Tolerates One Bloodline"

KYO_hijiri_do_my_best_desc:"The answer given by fascism is simple and cruel: the world doesn't need to learn how to coexist, it only needs to decide who is qualified to stay.\n\n It molds nations into a pure whole, expelling people of different bloodlines, cultures, and ideologies from the community, and then using obedience to prove loyalty. For such a regime, youkai are naturally foreign beings that must be eliminated or enslaved; and within humanity, there will always be those who, because of birth, beliefs, or physical conformity, are deprived of their status as human beings.\n\n Byakuren has already seen where this ideology will lead the world. It first demands that people hate strangers, then continuously narrows the scope of those who can be called compatriots, until everyone must step on another to prove they are pure enough.\n\n Faced with such an enemy, preaching cannot replace resistance. Peace is not about granting the executioner's knife uninterrupted freedom, nor can compassion demand that those about to be killed first understand their executioner.\n\n The Myouren Temple will fight alongside all who are willing to resist. Not to prove that Youkai are superior to humans, but to ensure that race, bloodline, and birth no longer determine who lives in this world."

KYO_hijiri_everything_be_as_intented:"Reject a world that only tolerates one ideology"

KYO_hijiri_everything_be_as_intented_desc:"Red dictatorship doesn't always appear as hatred of other races. It prefers to claim that all differences will eventually disappear with the victory of the right ideology.\n\n It can accept humans and Youkai, as long as they surrender their judgment and become part of the state apparatus that can understand and use. It praises equality, yet expels those who refuse to submit from the people; it promises the future, yet treats the present masses as raw materials for that future.\n\n This is precisely what Byakuren finds most unacceptable. Coexistence is not about allowing different lives to exist temporarily until they are educated into the same kind of people. Youkai don't have to relinquish their origins, nor do humans have to submit their emotions, beliefs, and questions to state scrutiny to qualify for shared life.\n\n Byakuren doesn't oppose the workers' desire for equality, nor the people's right to change the old society. What she wants to end is the state that monopolizes equality, decides the only path for everyone, and uses ideals to excuse oppression.\n\n If it still insists on reducing millions of voices to only one, Myouren Temple will stand beside those forced into silence."

KYO_hijiri_the_world_of_peace:"A New World of Coexistence"

KYO_hijiri_the_world_of_peace_desc:"Black dictatorship will fall, and red dictatorship will lose its power to rule over all. One determines who can exist based on bloodline, the other on ideology; they use different banners to give the same answer—only those who are alike can live together. Byakuren ultimately rejected this answer.\n\n The new world does not require humans to become youkai, nor does it require youkai to first learn to play the role of humans. Cities will still expand, but space must be left for rivers, forests, and the lives that depend on them; youkai can preserve their appearance, abilities, and culture, but can no longer harm the weak under the pretext of nature; humans can continue to build, invent, and change the environment, but no longer have the privilege of determining the value of all life.\n\n There will still be lies and betrayals between people, and youkai will not necessarily love each other. Humans can sometimes be more terrifying than youkai, and youkai can sometimes be more compassionate than humans. Living together didn't eliminate these conflicts; it merely prevented race from becoming a license to harm, and power from automatically granting the right to dominate others.\n\n Children began to appear in schools, learning alongside humans and Youkai. Human doctors treated Youkai, and Youkai craftsmen built houses for humans; mountain newspapers still criticized the system left by Byakuren, and local areas continued to argue over resources, beliefs, and old grudges. It was precisely because these voices weren't silenced that the world didn't become another outwardly gentle cage.\n\n Byakuren didn't make all beings similar. What she did was ensure that those who differed no longer had to rely on expelling, enslaving, and destroying others to gain their place.\n\n This wasn't a pure land where all problems had disappeared.\n\n But finally, all beings could live in the same world, bearing their own names."





KYO_Seija_start:0 "The Victory of the Underworld"
KYO_Seija_start_desc:0 "Seija Kijin didn't overthrow the old order to sit on the throne. She abhorred oppression, hierarchy, and all rules that trampled the weak, and was always wary of new masters emerging after the revolution's victory.\n\n Now, the underworld has won the battlefield. Next, she must prove that she can not only destroy the old world, but also truly empower the underclass and lead the revolution towards a future where the weak will not be betrayed again."




 KYO_rebuild_the_broken_land:0 "Repairing the Broken Land"
 KYO_rebuild_the_broken_land_desc:0 "The revolution has won, but not a complete nation; it has created a land torn apart by gunfire, hatred, and hunger. Seija must prove that the underworld can not only overthrow the old order, but also rebuild the collapsed Gensokyo."




 KYO_nue_question_of_society:0 "The Encounter with Nue"
 KYO_nue_question_of_society_desc:0 "The night after the war was quieter than before, so quiet that it seemed the entire Gensokyo hadn't yet decided whether it had survived or was just temporarily alive. Seija stood under the dilapidated eaves and saw a familiar yet unsettling shadow emerge from the darkness.\n\n “You actually dare to stand outside alone.” Nue Houjuu tilted her head, her tone both amused and provocative, “Right now, aren't you the easiest target in all of Gensokyo?”\n\n Seija didn't back down, only coldly replying, “You didn't come here to kill me.”\n\n Nue blinked, her smile deepening. “Yes. I just came to see if you knew what to pick up after you overturned the table.”\n\n She didn't offer a convincing answer for anyone, but instead threw the most jarring question at Seija: If Youkai were to leave fear behind, could she survive in society? And if society only sees Youkai as a threat, will it forever rely on suppression to maintain order?\n\n Seija didn't immediately refute this. Because she knew that Nue wasn't deliberately picking a fight. Nue was asking: Does your revolution aim to let Youkai live, or simply let Youkai die along with the old world?"

 KYO_monsters_not_social_waste:0 "Youkai is not social scum"
 KYO_monsters_not_social_waste_desc:0 "Nue led Seija through the margins of society, abandoned shrines, burned-out old warehouses, and wetlands no one wanted to approach. Those places were once corners where youkai, half-youkai, monsters, and all sorts of otherworldly beings barely clung to. The war ravaged them, but it didn't make them any less real.\n\n “Look,” Nue said, standing on the broken wall, looking down at the human and youkai figures below. “The old order's specialty wasn't killing everyone, but stuffing people into corners and pretending there was nothing there.”\n\n Seija silently watched the abandoned humans and youkai. She suddenly understood that so-called “outcasts” were often simply those deemed too troublesome, unstable, and difficult to manage by mainstream society, and thus simply swept away.\n\n “Youkai aren't the dregs of society,” Seija finally spoke, her voice soft but firm. “Society decided to reject us first, and then said we didn't deserve to stay.”\n\n Nue glanced at her, offering no praise, only a curt “Very good. At least you're not stupid enough to take people's words lying on the ground as a matter of course.”\n\n This still wasn't acceptance, much less intimacy; but Seija was beginning to understand that Nue approached not because of her gentleness, but because she hated any order that swept outcasts into darkness and then pretended the world was clean and pure."

 KYO_live_by_fear:0 "How long can one survive on fear alone?"
 KYO_live_by_fear_desc:0 "“Don't rush to say nice things.” Nue leaned against the wall, her eyes shining coldly in the night. “If you strip away all the embellishments, didn't Youkai survive on human fear before?” Seija didn't deny it.\n\n She knew how harsh those words were, and how close they were to the truth. As long as humans trembled in the night, pasted talismans on doors, and wandered through the wilderness, Youkai would still be remembered, acknowledged, and preserved. Fear is not noble, but it is always effective.\n\n “I know,” Seija said softly, “in this world still full of prejudice, hostility, and the remnants of the old order, if even the last shred of awe is gone, Youkai will be pushed back into the shadows first.”\n\n Nue chuckled softly. “So? Do you want to admit that some things are meant to be feared?” Seija didn't answer immediately.\n\n Because she also knew very well that if she chose to preserve fear, Youkai might still survive; but the relationship between Youkai and humanity would continue to be one of mutual distrust and oppression. This path was viable, but it wouldn't be clean. They had their first real argument.\n\n Nue refused to accept that Youkai could be easily and gently accepted by society; Seija also refused to admit that the revolution had ultimately only left people with continued fear. Neither of them convinced the other, yet both were forced by the other to see the half of themselves they were unwilling to confront."

 KYO_claim_a_place_in_society:0 "Give Youkai a Place in Society"
 KYO_claim_a_place_in_society_desc:0 "“But if you're always living on fear,” Seija looked up at Nue, “then Youkai will always be relegated to the sidelines, always be that thing that frightens people but isn't acknowledged.”\n\n Nue was silent for a moment, not interrupting her.\n\n Seija continued. She began to realize that if Youkai could only survive through fear, avoidance, and taboo, then Youkai would forever live on the margins of society, a being feared, rejected, and never truly acknowledged. Such a way of life might last for a while, but not in the future. “I don't want a position bestowed upon me by humans,” Seija's tone gradually hardened.\n\n “And I don't want Youkai tamed into a harmless decoration. I want this new society to acknowledge—that Youkai also has its own place, responsibilities, and right to live.” Nue looked at her, and after a long while, chuckled softly.\n\n “This path is harder than making humans afraid. Because you're not forcing people to shut up, you're forcing the entire society to grow a new set of bones.” Seija didn't back down.\n\n She knew this path wouldn't be easier than fear, but it might allow Youkai, for the first time, to exist beyond being merely a “thing to be feared.”\n\n This time, Nue didn't deliberately contradict her as she had in the past few days. She remained skeptical and critical, but began to acknowledge that Seija wasn't just someone who would ruin the world. Seija also realized for the first time that Nue's sharp tongue wasn't just a wicked joke; it was more like a mirror, reflecting the most vulnerable and self-deceptive parts of her words."

 KYO_acknowledged_not_tamed:0 "Different doesn't mean inferior."
 KYO_acknowledged_not_tamed_desc:0 "That night, Seija and Nue argued for a long time. Each was more stubborn than the last, each unwilling to give in. But in the end, one thing became clearer and clearer—what the Youkai truly feared was never just being eliminated, but being defined as “abnormal” and then conveniently driven out of the world.\n\n “Of course, the Youkai are different from humans,” Nue spoke first, unusually without a mocking tone. “If you insist on saying they're the same, then it's just another form of equalization.”\n\n Seija was silent for a moment before slowly saying, “But being different doesn't mean being inferior; nor does it mean having fewer rights to live.”\n\n The Youkai possess human emotions, and also power beyond human limits. They are not flawed versions of humans, nor are they errors that must be corrected. Youkai may be different from humans, but they shouldn't be deprived of their right to exist, live, and speak simply because of that difference.\n\n Nue looked at Seija, as if reaffirming something. Finally, she only said one sentence: “Okay. At least you don't want to wash us clean and put us in a cupboard.”\n\n This sentence made Seija unusually quiet for a long time. Because she knew that for a large youkai like Nue, whose true nature was unclear, to say such a sentence was almost an admission. They were still different, and they would still argue, but they no longer saw their differences as hostility."

 KYO_charter_of_the_odd:0 "Drafting of the Youkai Equality Declaration"
 KYO_charter_of_the_odd_desc:0 "Ideas that never become law have a way of dwindling into a handful of stirring words. Seija therefore began summoning grassroots youkai, half-youkai, strange beings, exiles, and delegates from across the land to draft a charter whose guarantees could actually be enforced.\n\nNue leafed through the early drafts with a faint sneer. ‘Declarations? Statutes? I thought you hated this sort of thing more than anyone.’\n\n‘I still do,’ Seija replied without looking up. ‘But if we do not put it in writing, the next person in this chair will soon claim that none of it ever counted.’\n\nStrange beings should not possess names only in rumors and wanted notices. Seija's government would lay down its first legal protections for youkai, strange beings, half-youkai, and all whom society had cast aside, so that exclusion, retreat, and concealment would no longer be their only means of survival.\n\nNue's smile vanished. She returned the draft to the table, speaking with unusual calm. ‘You had better mean to enforce it. Things like us are always the easiest to write onto a page—and the first to be crossed off it.’\n\nSeija studied her for a moment. ‘That is why I want you to stay.’\n\nNue raised an eyebrow. ‘And do what?’\n\n‘Watch me,’ Seija said bluntly. ‘If I ever start writing people onto a page only to erase them again, you will be the first to overturn this table onto my head.’\n\nFor once, Nue had no immediate answer. She merely looked at Seija, as though realizing for the first time that she was not there simply to make trouble. She was becoming the indispensable mirror in which this new order would be forced to see its own true face."

 KYO_commonwealth_of_outcasts:0 "The Survival Rules of Youkai"
 KYO_commonwealth_of_outcasts_desc:0 "The drafting of the document is not the end, it is only the beginning. Seija begins to pull those scattered Youkai, the strange, and the excluded back into the same order: some are responsible for local security, some for workshops and rationing, and some for intelligence, borders, disputes, and daily coordination. Youkai are no longer just rumors hiding in the shadows, but begin to become part of the new Gensokyo.\n\n Standing high above, looking down at the busy figures below, Nue suddenly asked, “So, this is your answer?”\n\n Seija didn't look at her immediately, but calmly said, “Not an answer, but a law. Youkai is no longer subject to humanity, and humanity can no longer casually toss Youkai back into the shadows. From now on, everyone must learn to live on the same ground.”\n\n Nue was silent for a few seconds, as if weighing the weight of her words. Finally, she chuckled, “Not bad. At least this time, you didn't just mess up the world.”\n\n Seija smiled too, but the smile was faint. “You are the same.\n\n You're not just someone who hides in the darkness, making everything even more chaotic.” Neither of them spoke too definitively. Nue didn't swear allegiance, and Seija didn't offer any flowery words about being kindred spirits. But they both knew things had changed.\n\n Seija had grown accustomed to Nue pointing out her flaws, and Nue had begun to accept that someone would directly confront her, even pressuring her to clarify the true thoughts behind her sharp criticisms. They weren't together because they were similar, but after repeated arguments and clashes of ideas, they learned to treat each other as a mirror that reflected their shortcomings without abandoning them.\n\n To Nue, Seija might not be perfect, but she was one of the few willing to make room for “things that shouldn't exist”; and to Seija, Nue wasn't just a troublesome, enigmatic figure, but someone who would ruthlessly pull her back when she was most prone to complacency and straying from the right path."

 KYO_koishi_open_the_unconscious:0 "Koishi, Lead Me Within"
 KYO_koishi_open_the_unconscious_desc:0 "Koishi Komeiji didn't originally come to Seija's side with a purpose. She was just wandering aimlessly in the unconscious gaps, drifting aimlessly in the echoes of the city, the ashes of dreams, and unnoticed thoughts, as usual. Then, she smelled the scent of Seija's subconscious—it was a strange thing, like laughing as you tear open a wound, like flames burning old paper, like someone saying they don't care while desperately trying to hide their true self from others. Koishi found it interesting, so she stopped.\n\n Seija initially just found it annoying.\n\n This person who always appeared and disappeared suddenly, spoke in disjointed sentences, and seemed to never grasp the main point, was like a shadow that was not malicious, but definitely not gentle. When Koishi looked at her, that gaze made Seija very uncomfortable—not because she felt hostile, but because she vaguely felt that Koishi seemed to see something about herself that she herself couldn't even be bothered to look at.\n\n “You have many versions of yourself in your heart,” Koishi suddenly said.\n\n Seija frowned: “What nonsense are you talking about?”\n\n Koishi just tilted her head and smiled, as if listening to some noise that others couldn't hear. “There's one you who's cursing everyone, and another you who's cursing yourself. And there's another you who won't even admit what she's thinking.”\n\n At that moment, for the first time, Seija didn't immediately retort.\n\n And Koishi, in her silence, vaguely saw her own reflection. She had closed her third eye for so long that she was almost convinced—as long as she didn't look, it was as if those things didn't exist. Thus, the beginning of this journey wasn't just about Koishi leading Seija into her unconscious; it was more like two people who were both running away from themselves finally coming together."

 KYO_trial_in_the_unconscious:0 "The Judgment of the Unconscious"
 KYO_trial_in_the_unconscious_desc:0 "Koishi offered little explanation. She simply took Seija by the hand, as one might lead someone lost, and guided her step by step into places that waking reason could not arrange. There were no continuous paths—only broken images, recurring echoes, the light of an explosion stretched and twisted at the instant of impact, and thoughts Seija could never put into words yet had carried all along.\n\nIn those unconscious depths, Seija felt herself split apart. Her id roared from below like a fire: destroy, tear open, drag down everything that stands above. Her ego tried to dress those urges as ideals, strategy, and revolution, arranging them into something fit to be seen. Her superego spoke in the voices of the old world, passing sentence from every shadow: you are an amanojaku; contradiction is in your nature; you can never bring about a just future.\n\nSeija could scarcely stand amid the three voices. She had always believed herself clear-headed, certain of what she was doing. Here she discovered how often she had merely invented excuses instead of trying to understand herself.\n\nKoishi stood nearby and offered no comfort. She had no right to play the gentle guide. Closing her third eye had itself been an escape from the self; she had cast herself adrift in the unconscious and called it freedom because she refused to face truths too heavy, too lucid, and too sharp to bear.\n\nThis judgment, then, was not a trial Koishi imposed upon Seija. Together they stood before the mirror each most wished to avoid and were forced to admit that the hardest enemy to face had never been someone else. It was the self that had always lived within them, deliberately left unseen."

 KYO_only_wanted_to_flip_the_table:0 "I just want to destroy"
 KYO_only_wanted_to_flip_the_table_desc:0 "Seija, deep in her unconscious mind, finally uttered the words she had always wanted to use to defend herself.\n\n “I just want to flip the table,” she whispered, her tone for the first time not defiant, but more like a weary confession. “I can't stand those guys taking everything for granted, I can't stand the weak always having to bow their heads, I can't stand those in high positions making order seem like a given. I just want to destroy that table, so it can never be the same again.”\n\n This wasn't a lie. Koishi knew that Seija's anger never arose out of thin air. She had indeed seen too much injustice, too many powerful people using high-sounding reasons to crush others. She wanted to destroy, not simply to enjoy the ruins, but because she realized earlier than many others—some orders were so broken they weren't worth repairing, only smashing.\n\n Koishi didn't follow up with her.\n\n “Is that all?” she asked softly, her tone light, yet piercing like a needle.\n\n Seija didn't answer.\n\n Because she knew that while the statement was true, it wasn't necessarily the whole truth. But at least in this moment, she finally admitted: her initial impulse wasn't to rule, not to build, and not to become anyone's leader. She initially just wanted to completely deprive the world, a world that had never given a place to the weak, of its right to stand firm."

 KYO_also_wanted_the_high_seat:0 "I also want to sit in a high position"
 KYO_also_wanted_the_high_seat_desc:0 "Seija originally wanted to continue hiding her thoughts. But deep within her unconscious, many excuses that could usually be used to deceive would fail. Koishi simply stood there quietly, not pressuring her, but that very silence seemed to await an answer that could no longer be avoided.\n\n So Seija finally admitted to something even more embarrassing.\n\n “Yes,” she said through gritted teeth, “I want to sit on it too.”\n\n It wasn't about wanting to be a noblewoman, nor about enjoying being groveled upon. It was closer to a deeper, more dangerous desire—she wanted that position, the power to determine direction, to determine order, to determine who could never trample her back. She didn't just want to smash the throne; she wanted to sit on it herself, to prove she finally had the right to rewrite the rules.\n\n Koishi didn't laugh at her, nor did she show disgust. She simply turned her head slightly, as if looking at someone who had finally spoken the truth.\n\n “That's not surprising,” she said. “How could someone who's always been left down there never think about standing on top?”\n\n Seija remained silent for a long time. Because for the first time, she realized that the most terrifying thing wasn't having such thoughts, but that she had always hidden them behind the “revolution,” pretending they never existed.\n\n At that moment, Koishi also thought of herself. She closed her third eye, not necessarily just to escape others; perhaps more so because she was afraid to see the impure, innocent, and not as light and airy as she usually appeared—the desires within her. Neither of them was more noble than the other; they were both adept at ignoring it."

 KYO_face_the_self_that_loves_chaos:0 "Facing the self that's obsessed with chaos"
 KYO_face_the_self_that_loves_chaos_desc:0 "The real pain is never admitting that you can be angry, jealous, or want power; the real pain is admitting—that you sometimes do indeed derive pleasure from chaos.\n\n Seija finally saw herself. The self that would laugh when order collapsed, feel exhilaration when those in high positions fell, and briefly think, “This isn't so bad,” when everything spiraled out of control. That didn't mean her revolution was fake, but it showed she was never entirely pure, never fighting solely for others. She wanted to save people, and she wanted revenge; she wanted to overthrow oppression, and she wanted to see those who thought they would never fall crash into the mud. She had always mixed these things together, to the point that she could barely distinguish which part was idealism and which part was just pleasure.\n\n Koishi could no longer pretend to be just an observer. She had always thrown herself into the unconscious, drifting like the wind, an existence that no one could grasp, no one could truly understand. But within that freedom lay a large part of escapism. She closed her third eye, not just for ease, nor simply to avoid being hurt by others; deeper down, it was because she no longer wanted to be hurt by her own heart. She didn't want to see that version of herself again—fearful, lonely, resentful, wanting to be understood, yet instinctively hiding herself first.\n\n She thought that by closing her eyes, those things would slowly quiet down. But they didn't disappear; they simply sank deeper, becoming echoes she herself didn't want to dwell on. She dismantled herself, letting herself drift aimlessly in the unconscious, for so long that she almost believed—that was freedom.\n\n Thus, this kind of growth wasn't a sudden transformation into purity, nor was it washing away all darkness. On the contrary, it was finally acknowledging that those ugly, contradictory, stubborn, and chaotic parts of the heart had always existed; and what truly led to destruction wasn't their existence, but rather the act of pretending they didn't exist.\n\n Seija stopped trying to portray herself as an undeniably righteous revolutionary; Koishi stopped portraying herself as a drifting shadow, indifferent to everything and capable of letting everything drift away. For the first time, they faced their true selves—the ones that had been torn apart within them—not with excuses, but with direct confrontation.\n\n Only at this point did Seija truly have the right to move forward; and Koishi finally understood that self-understanding wasn't about forever keeping one's eyes closed, but about being willing, even in fear, to look back at the true self that had been waiting for them in the darkness."

 KYO_leader_must_be_watched:0 "The Danger of Not Seeing Oneself"
 KYO_leader_must_be_watched_desc:0 "After this unconscious journey, Seija finally understood something more terrifying than power: the real danger wasn't the tyrant, but the person who believed themselves to be clear-headed, pure, and incorruptible.\n\n If a person can't even see their own blind spots, they'll call desires ideals, obsessions principles, and harm necessary sacrifices. A leader who is ignorant of themselves is often harder to guard against than a nakedly ambitious person, because she may not even know where she's sliding towards, yet she's already demanding that others follow her.\n\n The first time Seija was truly afraid wasn't of her enemies, but of herself. She finally realized that if one day she also started to say “for the revolution,” to see all doubts as obstacles, and to see all costs as inevitable, then she wouldn't be much different from those she once hated most. Koishi didn't draw conclusions for her.\n\n She simply sat quietly to the side, speaking as if delivering words from a deep, gentle source: “If you can't even trust yourself forever, then don't give anyone the right to be unquestioned.” This statement also pierced Seija's heart.\n\n She had always thought that as long as she didn't see, speak, or touch, she could maintain a safe ambiguity. But now she understood—escaping from oneself wouldn't make the danger disappear; it would only allow it to slowly grow unseen. She sealed her third eye to avoid being swallowed by her own heart; but if she never looked back, she would only gradually lose the ability to truly recognize herself. Thus, this statement ultimately became not only a warning for Seija but also a warning for Seija herself.\n\n For a revolution to avoid descending into another form of oppression, it cannot rely solely on the leader's self-awareness; it must also incorporate oversight, debate, criticism, and correction into the system. And if a person doesn't want to be swallowed by themselves, they cannot simply live by escaping.\n\n The inability to see one's own danger is precisely the beginning of many ideals ultimately destroying themselves."

 KYO_bind_the_revolution_to_itself:0 "Revised Revolutionary Program for Overthrowing Superiors"
 KYO_bind_the_revolution_to_itself_desc:0 "If a revolution doesn't accept constraints, it will eventually devour everyone. After seeing herself clearly, Seija finally made up her mind to do something she used to hate the most, but now had to do—revise the program.\n\n This wasn't just about replacing old slogans with new words, nor was it about adding a few nice principles on paper; it was about truly writing down the most painful understandings from this journey: leaders can deceive themselves, organizations can become rigid, ideals can be used to cover up desires, and revolutions can grow new high walls after victory. If these things aren't acknowledged first, the so-called new world will ultimately just be the old world surviving under a different name.\n\n Seija wrote slowly. With each stroke, it was as if she were confronting her past self, who only believed in will, only believed in anger, only believed that overturning everything would create a future. For the first time, she no longer understood “subordinate overthrowing superiors” as simply overthrowing someone, but began to think: after overthrowing someone, how to prevent a new high position from rising again; after gaining power, how to prevent herself from becoming the one who oppresses others.\n\n Koishi sat by the window, no longer drifting around as before. She watched quietly, as if watching another version of herself. She had once shut herself off, sinking her true feelings, questions, and wounds into the depths of her unconscious; but now, for the first time, she didn't immediately hide. She watched Seija rewrite those overly sharp, empty, or overly confident sentences, as if watching someone try to stop deceiving themselves with words.\n\n She didn't interfere much, only lazily reminding Seija when she most wanted to gloss over certain dangerous phrases: “Here, you're trying to hide yourself again.”\n\n Seija didn't get angry. She simply stopped and resumed writing.\n\n In this process, Koishi also gained something different from the past. She didn't suddenly become willing to lay bare her entire inner self, nor did she suddenly learn to be frank; but she at least began to understand that true freedom is not about never being seen, but about not immediately throwing oneself into darkness even when knowing there are cracks in one's heart. She didn't have to fully open her third eye all at once, but she was no longer like before, needing to completely escape herself to survive.\n\n What was ultimately revised was not a flawless holy book, but a revolutionary program that acknowledged that people can get lost, that organizations can deteriorate, and that constant self-correction is necessary. It didn't guarantee that mistakes wouldn't happen again, but at least it gave this revolution, for the first time, the courage to face errors, correct itself, and not cover up the cracks with more lies.\n\n For Seija and Koishi, this also meant something else: neither of them completely conquered themselves, but they finally learned not to keep moving forward with their eyes closed. Seija learned to doubt herself before seizing power, and Koishi learned to look back at herself before running away. This path didn't make them flawless, but it allowed them to truly begin to grow for the first time."


 KYO_flandre_and_broken_blood:0 "Flandre and Bad Blood"
 KYO_flandre_and_broken_blood_desc:0 "Flandre came to Seija with an urn of ashes.\n\n She stood at the edge of the ruins, her expression much calmer than before, almost unlike the calamity-ridden sister who had once made the entire Scarlet Devil Mansion tense. She held a small urn filled with Remilia's ashes. It wasn't just a relic; it was more like the last thread connecting her to the old world. She had originally come seeking revenge.\n\n Because in her eyes, her sister had indeed died because of this war, because of the chaos Seija had stirred up. But when it came to actually fighting, she couldn't use her powers no matter what. That power that once easily crushed everything seemed to be gently held down at the last moment. Perhaps it was fate, perhaps it was trauma, perhaps it was Remilia, with her final manipulation of fate before death, forcefully pushing her sister off the old path that only brought destruction. Flandre was stunned for the first time.\n\n She suddenly didn't know who she hated. Did she hate Seija? Did she hate the war? Did she hate the world that took her sister away and left her alone here?\n\n Just as she turned to leave, Seija called out to her. “Who are you?”\n\n It wasn't a provocation, nor an interrogation, but like a knife, cutting directly into a place deeper than hatred.\n\n Flandre didn't answer immediately. Because she suddenly realized that she also wanted to know. If her sister was dead, if Scarlet's city collapsed along with the past, then who was the one left behind? So she didn't leave.\n\n Not because of forgiveness, nor because of seeking refuge, but because for the first time she wanted to know: when blood and name could no longer answer everything, how could a person continue to live?"

 KYO_bloodline_is_not_absolution:0 "The Shackles of Bloodline"
KYO_bloodline_is_not_absolution_desc:0 "The conversation between Flandre and Seija was never gentle. One carried her sister's ashes, the other carried her own almost erased past; one was born in Scarlet, the other carried Lunarian blood. They both knew that bloodline and origin were never just background information, but things that weighed on people, defining them beforehand.\n\n Flandre was a vampire, from Scarlet, Remilia's sister. Seija is an Amanojaku, a person who goes against the grain, and a child who once lived in Lunar Capital but always felt out of place. From birth, they are forced into a certain position by the world: dangerous, strange, abnormal, destined for a certain fate.\n\n But Seija slowly understands one thing: bloodline can explain why someone is viewed this way, but it cannot excuse or condemn anyone. Noble birth does not mean one should be superior to others; being born abnormal does not mean one is destined to be a calamity. Blood ties leave traces, but they should not become shackles, much less an excuse for all actions. Flandre also begins to look back at herself for the first time.\n\n In the past, she always felt that the reason she became this way was because that's who she was—a vampire, Scarlet, a sister who breaks things. But if these names are merely pre-defined frameworks imposed upon her, then what truly traps her may not just be power, but rather the fact that she hasn't tried to free herself from these definitions for too long.\n\n They still don't have answers, but at least they've begun to doubt: bloodline describes one's origin, but doesn't necessarily determine one's destination."

KYO_inherit_that_name:0 "The Name from the Moon"
KYO_inherit_that_name_desc:0 "Some names aren't chosen, yet they follow like shadows for a lifetime.\n\n With Flandre by her side, Seija finally begins to confront her own bloodline. Lunar Capital, nobility, purity, selection, order, Sagume Kishin—these things were originally just blurry, cold, fragmented remnants in her mind, but now, with post-war reconstruction and self-questioning, they are gradually pressing back before her.\n\n She wasn't entirely without belonging there. She had lived in Lunar Capital, been cared for by her mother, and vaguely felt out of place in that pristine, almost cruel land. But those memories were shrouded in mist, leaving only a blurry yet sharp feeling: she came from there, and she had been rejected there.\n\n Seija began to realize that her deep loathing for those high-ranking systems might not just be because she had witnessed oppression, but because she herself carried a part of that system within her. It was a name from the moon, a source decided for her by others, proof she had always wanted to deny but could never truly sever. Flandre listened quietly.\n\n She understood this feeling better than anyone. For her, the name Scarlet was both home and prison; both protection and a fate always decided for her by others. So instead of mocking Seija, she asked her seriously for the first time, “If you really had that kind of blood in you, what would you do?” This question left Seija silent for a long time.\n\n Inheriting a name isn't necessarily about submission.\n\n Sometimes, seeing that name clearly, acknowledging its presence within oneself, and then deciding how to use it is itself another way of reclaiming control. She didn't necessarily have to continue living for Lunar Capital, but she had to first acknowledge that the shadow had indeed once been a part of her."

KYO_betray_that_name:0 "That Name from Earth"
KYO_betray_that_name_desc:0 "But a name can be inherited, and it can also be betrayed.\n\n Seija ultimately did not choose to bow to the moon. She became increasingly clear that although she had lived in Lunar Capital, she had never truly been accepted there. That capital could not tolerate children who were not pure enough, could not tolerate those who did not conform, and even less could it tolerate someone like her, who was never meant to be placed in a perfect order from the very beginning.\n\n The place where she truly stood firm was never that capital high in the sky, which valued purity and order above all else; but rather this Gensokyo, a place where mud, ruins, streets, mountain roads, and crowds intertwined, the ground where those who could be hurt, make mistakes, argue, yet still stubbornly live, and Youkai resided.\n\n She was not a child that Lunar Capital could tolerate, but someone who survived on the ground. If the Moon gave her life, then the Earth gave her a place to stand.\n\n When Flandre heard this, her smile was faint for the first time. She suddenly understood that “betraying one's name” didn't mean denying the past, but rather refusing to let the past continue to control the future. She also began to wonder: could she also stop being just Scarlet, stop being just the younger sister held in her sister's arms, locked in the basement, and expected by everyone to be out of control?\n\n Some names come from heaven, some from earth. But what truly determines where a person belongs is never their bloodline, but rather which side they ultimately choose to stand on."

KYO_child_of_moon_enemy_of_earth:0 "Children of the Moon, Inhabitants of Earth"
KYO_child_of_moon_enemy_of_earth_desc:0 "Bloodline and belonging, finally placed on the same table at this moment.\n\n Seija had to admit that a part of her came from the moon. It was her indelible source, a fact written into her at birth. Even more cruelly, she hadn't just heard of Lunar Capital; she had actually lived there, been cared for by her mother, and been quietly judged as someone who shouldn't have stayed under that order called purity.\n\n H ... Flandre also began to re-understand the concepts of “species” and “origin.”\n\n Vampire, human, youkai, Lunarian, amanojaku—these words should have separated people like boundaries, but now she saw something else in Seija: a person could simultaneously belong to a certain bloodline, yet refuse to submit to the direction that bloodline had written for them. So Seija finally gave her clearest answer: she could be a child of the moon, but only wished to be a child of Earth.\n\n She wouldn't deny her origins, but she would never accept letting her origins decide her loyalty, stance, and future. This was the first time Flandre was truly moved.\n\n Because she suddenly wanted to ask herself: if I were born a vampire, a Scarlet, could I also choose to become a new self that wasn't defined solely by blood?"

KYO_drag_the_family_name_from_the_throne:0 "I am myself"
KYO_drag_the_family_name_from_the_throne_desc:0 "True liberation isn't about erasing your surname, but about pulling it down from above.\n\n Seija and Flandre, after their long conversation, finally arrived at the same point. They had both lived under the weight of their family name, bloodline, species, and origin. The blood of the Lunarian, Scarlet's surname, the reputation of the Amanojaku, the shadow of the Sister of Calamity—these things had once been as high as a throne, so high that it seemed a person was born only to revolve around it.\n\n But now, Seija decided to personally drag those names down from the throne. They could be the past, their origins, indelible marks, but no longer commands to be accepted on one's knees.\n\n Flandre, for the first time, truly uttered the words she had never had the chance to say before: If her sister was dead, if Scarlet could no longer define everything for her, then she didn't want to be just a leftover fragment. She wanted to live as herself, not as a continuation of someone else's life after death.\n\n Seija looked at her, offering no comfort or sentimentality, but simply saying calmly, “Then don't ask whose sister you are yet.\n\n Ask yourself, who do you want to be?” From that moment on, they were no longer merely appendages of a name. They began to learn to distance themselves from those identities, allowing their true selves a place to finally emerge."

KYO_belonging_beyond_blood:0 "Old Gods and New Blood"
KYO_belonging_beyond_blood_desc:0 "In the end, what remained was not a denial of bloodline, but a sense of belonging even stronger than bloodline itself.\n\n Seija finally became a better version of herself. She didn't become pure, nor did she suddenly lose her sharpness; she was still Seija Kijin, capable of questioning, resisting, and exposing mistakes and oppression on the spot. But she was no longer bound by her origins, reputation, or bloodline. She no longer needed the position of “Amanojaku” to prove herself, nor did she need to fight against everything to maintain her existence.\n\n She learned to see the past as a path, not as a shackle. However, some parts of the past were not truly over. Lunar Capital, her mother, and that childhood shrouded in mist remained like an old wound that hadn't fully healed, quietly buried in her heart. Seija still believes she was abandoned, sent away, and removed from that noble world; but as the cracks in her memory loosen little by little, she begins to vaguely realize that the past may not have been simply about abandonment. Some things that have been erased will one day resurface, and when that day comes, her understanding of herself, her mother, and Lunar Capital will be completely overturned.\n\n Flandre has also undergone a change. She hasn't forgotten her sister, nor has she put down the urn containing her ashes. Remilia will still hold an irreplaceable place in her life; that bloodline and love will not disappear because of any new path. But she is no longer just living with ashes. She begins to try to gradually separate herself from “Scarlet's sister,” becoming someone who can decide where she goes even without her sister shining in front of her.\n\n The old gods are not dead, new blood has been born. The name from the past remains, the shadow of bloodline remains, but a new self has also grown.\n\n They all eventually understood one thing: fate may write the beginning at birth, bloodline may determine how others see you, but what truly determines what you become is never your surname, your species, or your origin, but whether you are willing to write your own future after seeing all of this clearly."

 KYO_three_lessons_before_rule:0 "Three Scars Before the Rule"
 KYO_three_lessons_before_rule_desc:0 "By this point, Seija was no longer just the vengeful spirit who could turn the world upside down.\n\n Nue showed her how society truly rejects those who are different, and also made Nue herself understand that chaos, if it cannot leave a way out for anyone, is ultimately just another empty prank; Koishi showed her the cracks in her heart that she refused to acknowledge, and also made Koishi, for the first time, stop simply sinking into unconsciousness to escape; Flandre showed her how blood, surname, and origin can bind a person like chains, and also made Flandre begin to think for the first time about who she could become if she was no longer just Scarlet's sister.\n\n And Seija, finally in front of the three of them, peeled away layer by layer from her slogans, anger, and rebellious stance. She no longer only wanted to see those in high positions fall, and also began to learn to think: when the old world really collapses, how will those left behind live?\n\n So these three people, along with Seija herself, were like three mirrors and a crack, reflecting each other more clearly than before. They didn't become the same, nor did they lose their sharpness; they simply stopped seeing their differences as reasons for hostility.\n\n Standing here now are not just four people carrying scars. They are more like four witnesses emerging from ruins, darkness, blood, and unconsciousness, watching together as the same door slowly opens.\n\n Behind the door is no longer a simple revolution, but domination; no longer just destruction, but repair; no longer just questioning where the world went wrong, but answering with their own hands how a new world should begin."

 KYO_grassroots_worksite:0 "Spread the blueprints on the muddy ground"
KYO_grassroots_worksite_desc:0 "Seija didn't call the three grassroots members, Youkai and her companion, into a proper office. She summoned Sekibanki, Kagerou Imaizumi, and Wakasagihime to an old warehouse with scorch marks, unrepaired planks, and a floor covered in mud and rubble. She stood there, spreading out the blueprints, laying out the future.\n\n Sekibanki was the first to frown. She didn't believe in such a grandiose plan, especially not in a regime that had just fought a war suddenly talking about order, construction sites, supplies, and production. Kagerou Imaizumi was even more direct, asking only one question: Could this really prevent people from starving and freezing to death? Wakasagihime didn't immediately object, but quietly looked at Seija, as if waiting for her to say the most crucial question—was this plan truly meant to improve people's lives, or was it simply a way to weave the lower classes into another set of orders?\n\n Seija didn't shy away. She spoke bluntly: this wasn't for show, nor was it to paint a pretty picture of the new regime. What she wanted was to forcibly pull Youkai out of a life where they could only survive by instinct, luck, and bowing their heads. First, she wanted to ensure a stable food supply, the delivery of resources, the production of tools, and the stability of order, so that everyone wouldn't have to beg for charity just to survive.\n\n These words didn't immediately garner agreement. But as the misunderstandings were gradually cleared up, all three began to understand that Seija wasn't inciting anyone to overturn the table, but genuinely wanted to rebuild it—and rebuild it for those who had never been worthy of sitting at the table."

KYO_raise_the_broken_umbrella:0 "Let the discarded things start anew"
KYO_raise_the_broken_umbrella_desc:0 "The first step is to bring back those things that were once considered worthless. When Kogasa Tatara was personally approached by Seija, she was initially taken aback, then her expression shifted to one of mixed joy and disbelief. After all, most people associated her with frights, pranks, or an unwanted old umbrella; few would seriously ask if she was willing to contribute to this new society.\n\n Seija's answer was simple: since so many objects in Gensokyo could awaken into tsukumogami, they shouldn't be allowed to continue rotting in warehouses, corners, and garbage dumps. Old umbrellas, old harps, old drums, old knives, old cars, old pots—all could rise again, re-entering workshops, logistics, streets, and production. Thrown things don't necessarily rot; forgotten existences don't mean they're worthless.\n\n After hearing this, Kogasa Tatara didn't immediately agree; she simply looked down at her umbrella, as if looking at herself. Finally, she raised her head, smiling broadly: if the world was finally willing to give a place to what had been discarded, then of course she was willing to be the first to hold up an umbrella for it.\n\n From that day on, tsukumogami were no longer just ghost stories and peripheral characters. They would be reintegrated into the skeleton of society, making those abandoned things the earliest gears to start turning again in rebuilding Gensokyo."

KYO_seize_old_order_storehouses:0 "Take back the keys to the granaries to the public."
KYO_seize_old_order_storehouses_desc:0 "The food problem cannot be solved by slogans. Seija and the grassroots youkai quickly realized that the real danger after the war was not that there was no grain in the fields, but that many old forces, local tyrants, and wartime merchants had locked up what could sustain them in their granaries, waiting for the situation to become more chaotic and prices to rise before selling them off.\n\n Thus, a ruthless path was laid out: take over the old granaries, inventory the stockpiles, unify transportation, set uniform prices, and distribute them uniformly. Sekibanki was not surprised by this approach; she knew all too well that in chaotic times, some people would always profit from others' hunger. Kagerou Imaizumi also agreed, because those who were starving wouldn't survive until tomorrow, so any procedures were meaningless. Wakasagihime put it even more strongly: if these things were to be brought under public control, everyone must see the ledgers, see the flow of funds, see who received their share first and who received it later; otherwise, it was just continuing the old plunder under a different name.\n\n Seija ultimately made the decision: the granaries were not private property, but the dividing line between whether everyone could survive the winter. Since the old order had locked up the things that sustained life, the new order would break the lock, snatch the key from the powerful, and hand it over to the state and the rationing system.\n\n This isn't mercy, it's stopping the bleeding. At least from this moment on, food will no longer lie dormant in ledgers and warehouse receipts, but will flow into pots, military supplies, and every night we can still survive."

KYO_build_local_mutual_aid_workshops:0 "Return the land to those who cultivate it"
KYO_build_local_mutual_aid_workshops_desc:0 "Someone proposed another, slower, and more stubborn path: instead of centralizing everything and distributing it downwards, return the land, workshops, seeds, tools, and old granaries directly to the local areas, to those who actually cultivate, transport, repair, and produce, allowing each region to thrive on its own.\n\n This approach isn't as quick as centralized control, and it's harder to maintain order. Sekibanki, however, is more inclined to support it because she instinctively doubts any overly centralized distribution system; if all lifelines are held at the top, the lower classes will sooner or later have their survival decided by others. Wakasagihime agreed, believing that true reassurance wasn't just receiving a bowl of grain today, but knowing that tomorrow they would still have their own fields to cultivate, their own workshops to operate, and their own hands to gradually rebuild their lives. Kagerou Imaizumi was most concerned with practical matters: as long as the fields were truly cultivated, the workshops could actually produce goods, and people wouldn't go hungry again, she didn't care whether the banner was raised at the central or local level.\n\n Thus, a new policy began to take shape: confiscating abandoned manors and lands of former powerful families, redistributing them to farmers and local communities; keeping workshops in the streets and alleys, leaving repair, processing, rationing, and basic production at the grassroots level; allowing villages, neighborhoods, and mutual aid organizations to decide for themselves what to repair, what to plant, and what to rescue first. It wasn't about waiting for others to deliver a path to survival, but about letting that path grow from within.\n\n The meaning of this path was equally clear: for the new society to truly stand firm, it couldn't rely solely on the central government's strength. The land must return to the farmers, the workshops must remain in the streets and alleys, and the local communities must learn to breathe, produce, and decide their own future."

KYO_tsukumogami_production_committees:0 "The Trade Union and the Production Committee"
KYO_tsukumogami_production_committees_desc:0 "Whether the choice is to reclaim the keys to the granaries for public ownership or to return the land and workshops to the local communities and farmers, the same question must ultimately be faced: Who will implement this, who will supervise it, and who will ensure that this is not just a passing fad, or that the next group will simply change their names and continue to seize everything?\n\n Therefore, Seija decided to truly institutionalize the previously scattered forces. Grassroots representatives (youkai) were responsible for bringing in grassroots voices, tsukumogami was responsible for production, maintenance, and scheduling, and local representatives, artisans, transporters, farmers, and ration workers were uniformly incorporated into the new Trade Union and Production Committee system. If the state takes over storage and grain transport first, this system will be responsible for inventorying, transporting, distributing, and auditing, ensuring that the return to public ownership doesn't become a blank slate. If local governments take back land and workshops first, this system will be responsible for coordinating production, sharing surpluses and shortages, stabilizing prices, and ensuring the operation of workshops, ensuring that grassroots autonomy doesn't fragment into independent actions.\n\n Sekibanki is most concerned with oversight. She demands that the committees not just be another set of lofty lists; otherwise, the door smashed today will simply have a new lock tomorrow. Kagerou Imaizumi is concerned with efficiency; she doesn't want to hear any fancy rhetoric, she just wants these institutions to actually deliver grain, tools, materials, and manpower to where they're needed. Wakasagihime, however, always focuses on another thing—giving the grassroots a voice, rather than just being registered, assigned, and ordered around; regardless of whether the system is state-rationed or a local mutual aid system, it's the same.\n\n Seija accepted these conditions. She knew very well that if this reconstruction ultimately only involved replacing one group of people with another in the office, it would quickly become what she hated most. The significance of unions and committees was not just to increase productivity, but also to retain the power of execution, debate, and correction within society, preventing centralized control from sliding into a new monopoly and local autonomy from disintegrating into powerless fragments.\n\n From this moment on, granaries were no longer just warehouses, workshops were no longer just workshops, and tsukumogami were no longer just forgotten relics. All tools, all hands, streets, fields, and transport lines were finally woven into the same framework. The revolution began to take shape, and for the first time, the reconstruction of Gensokyo resembled a machine that could truly turn."

KYO_rebuild_from_the_bottom_up:0 "Reconstructing the so-called homeland"
KYO_rebuild_from_the_bottom_up_desc:0 "Once the food, workshops, tsukumogami, and committees were all operational, Seija finally shifted her focus from individual warehouses, streets, and construction sites to the entire nation. What she needed to do was no longer just provide emergency relief, but a true reconstruction.\n\n The new plan was straightforward: redraw roads, renovate the old town, rebuild the workshop district, arrange housing and rationing points, and transform the spaces that had previously served the elite, the military, and the old guard into places where ordinary people, grassroots youths, and all sorts of outcasts could survive. It wasn't about restoring things to their original state, but about completely changing the pre-determined hierarchy and the pre-arranged comforts of society.\n\n The three grassroots youths stood before the new blueprints, this time without the initial skepticism. Because they had witnessed firsthand that Seija was not just talking about a distant vision. Food began to be put into the pots, old things were put back into operation, local workshops could support people, and the committee was finally able to raise its voice.\n\n The plans would still be debated, would still go wrong, would still clash, but they were no longer empty words. Thus, the restoration of Gensokyo was no longer just about patching up the ruins, but about growing forward. New streets, new construction sites, new logistics lines, new residential areas—these things, connected together, formed not just a more orderly land, but a new way of life.\n\n Restoring Gensokyo from the bottom up never meant taking it slow, but about first supporting those at the bottom. Only in this way could the new world not proclaim liberation while simultaneously trampling others back into the mud."

KYO_books_stolen_from_humans:0 "From Human Books"
KYO_books_stolen_from_humans_desc:0 "The revolution won the battlefield, but it did not win tomorrow. Seija quickly realized that anger, intuition, and momentary courage alone could not sustain a new nation, much less a revolutionary regime that wanted to outlive the old world. So she ordered her men to retrieve books from old government offices, private residences, school ruins, and confiscated warehouses: books about nations, organizations, trade unions, parliaments, how revolutions grew and how they corrupted. Nue was the first to show disdain for these books.\n\n She said that humanity's greatest skill was writing living people down on paper and then using that paper to oppress them. Koishi, however, simply squatted beside the pile of books, turning the yellowed pages, as if listening to something unseen. She gently reminded Seija: Don't fall in love with these words too quickly, because words can also deceive. Flandre, holding an urn of ashes, stood to the side, looking at the names, party constitutions, systems, and titles on the pages, and suddenly asked: “Do humans also like to lock themselves away with their names?” Seija didn't refute.\n\n She simply opened the book and read it page by page. She disliked many things in it, disliked the self-righteous tone of those who thought they understood everything, disliked those who spoke of the masses, organizations, and history like formulas. But she disliked something even more: if she didn't even understand these things, then she would only repeat the fate most familiar to the old world—letting a rebellion slowly degenerate into a pile of slogans."

KYO_rosa_and_trotsky_on_the_table:0 "Rosa and Trotsky"
KYO_rosa_and_trotsky_on_the_table_desc:0 "Finally, what Seija left lying on the table for a long time were two intertwined and mutually painful voices. Rosa Luxemburg reminded her that if the revolution were separated from the masses, if the party began to stifle the vitality of the workers, the countryside, and the lower classes themselves, then so-called liberation would soon become another form of captivity. Trotsky, however, relentlessly pressed on to another matter: if the revolution remained confined to the borders, to the satisfaction of postwar reorganization, to temporary victories, it would be gradually surrounded, ground down, and counterattacked by the old world.\n\n These two voices quickly clashed in the room. Nue was the first to sneer at the pages; she hated any organization that would grow new high walls, and she hated those who spoke highly of the masses only to then imprison them in discipline. Koishi, on the other hand, seemed to be listening to the echoes in Seija's heart; she saw it clearly: Seija both trusted the masses and feared their disarray; she abhorred centralized power yet knew that a revolution without a backbone would crumble into a pile of embers. Flandre sat quietly, her fingers lightly tapping the urn. She was more sensitive than anyone to questions of “who represents me” and “who protects me,” because she knew all too well that these were often where control began.\n\n It was in these disputes that Seija began to understand for the first time: a political party doesn't simply spring up by a group of people raising a flag. It is born from disagreement, from mutual sabotage, mutual suspicion, and mutual questioning. The real difficulty lies not in finding the most elegant theory, but in acknowledging that revolution inherently involves a constant tug-of-war between the masses and organization, freedom and discipline, the immediate and the distant."

KYO_masses_before_party:0 "The masses come before the party"
KYO_masses_before_party_desc:0 "When the debate reached its sharpest point, Seija chose to return the revolution's centre of gravity to those below. She would not let victory turn it at once into a world of offices, seals, and directives. Without mutual aid in the streets, workers in the workshops, and the independent strength of villages, grassroots youkai, and the human underclass, any so-called party would be an old skeleton in a new shell.\n\n The first structures of the new organisation were therefore made to grow deliberately from the bottom up. Local branches, workers' groups, village assemblies, and mutual-aid networks among grassroots youkai were joined layer by layer into the same web. Delegates could be elected and recalled. Those above could propose a direction, but could not reduce the people to shadows fit only to applaud and obey. For once, Nue did not pour scorn upon the plan: at the very least, the new order would learn to listen before it learned to command. Wakasagihime and the grassroots youkai gave it their firm support, because they could finally see that their voices were more than decoration.\n\n Koishi nevertheless warned Seija not to make another idol of “the masses.” The people were not correct by nature; they too could be blind, angry, and carried wherever the wind blew. Seija heard her, but still chose to return the revolution's legitimacy to those below. She knew that if this step were omitted, the party that followed would resemble a machine more with every passing day—and a living community less."

KYO_party_must_command:0 "The Party Must Be Able to Command"
KYO_party_must_command_desc:0 "But another voice was equally clear: a revolution without discipline easily dwindles to mere enthusiasm, slogans, and fragmented arguments. Seija knew better than anyone that postwar society was in turmoil; construction sites, supply lines, military logistics, local order, and foreign revolution could not be sustained by spontaneous enthusiasm alone. Without a truly effective chain of command, the revolution would first be dragged down by its own chaos.\n\n Thus, she began to accept a reality she disliked but could not avoid: the Party must be able to command. Not to allow a few to sit on high thrones, but to ensure that decisions could pass through debates, reach workshops, warehouses, border regions, and streets, and become actionable. The Central Committee, disciplinary organs, organizational lines, cadre training, and command transmission systems gradually took shape through repeated arguments and revisions.\n\n Nue was most concerned about this. She saw it all too clearly: a party that can command everything is also most likely to learn to defend everything. Koishi, almost mirroring Seija's behavior, knew that a part of Seija was actually attracted to this efficiency—because commands are faster than persuasion, and concentration is more stable than coordination. Flandre, at this point, said something neither too harsh nor too mild: “A body without bones will collapse, but bones that are too hard will also hurt the person inside.”\n\n In the end, Seija still chose to preserve the chain of command. Not because she suddenly fell in love with power, but because she acknowledged that sometimes, if the organization isn't established first, the revolution won't even have a chance to be corrupted; it will crumble halfway through."

KYO_debate_is_not_treachery:0 "Debate is not betrayal"
KYO_debate_is_not_treachery_desc:0 "Whether the focus is shifted back to the masses or the chain of command is established first, the same danger remains: once an organization fears debate, it will increasingly only know how to punish; once a leader sees dissenting opinions as hostile, the revolution will begin to devour its own people.\n\n This was precisely the ending Seija least wanted to see. She knew all too well that she too could deceive herself, and could be slowly persuaded by victory, anger, and necessity. Koishi kept bringing this up—she wouldn't allow Seija to say “for the revolution” too smoothly, because once it was said smoothly, it would become the most deceptive anesthetic. Nue pressed her from another angle: if even internal members couldn't speak the truth, what difference was there between the new party and the old system? Flandre quietly watched these disputes, as if watching a group of people finally stop treating disagreements as stains that had to be erased immediately.\n\n So, Seija made a very modern, and also dangerous, decision. She left the debates. For the first time, party criticism, minority opinions, line disputes, and grassroots questioning of superiors were explicitly written into the organizational principles. Dissent no longer automatically equated to treason, and disobedience could no longer be easily dismissed with a simple “disrupting the overall situation.” It wasn't to condone chaos, but because she finally acknowledged that a revolution that forbids others from speaking will ultimately only leave the echo of the leader."

KYO_provisional_program_of_reversal:0 "Provisional Program for Overthrowing the Leader"
KYO_provisional_program_of_reversal_desc:0 "Finally, Seija meticulously organized these debates, failures, revisions, and probing questions into a truly practical document: the Provisional Program of Overthrowing the Leaders.\n\n It was not merely a few impassioned slogans, nor simply a beautifully crafted post-war document to appease the public; rather, it was the first time this new political party, like a modern organization, had written down its direction, structure, goals, and bottom line. How to manage the relationship between the party and the masses, how to divide power between the central and local governments, how to operate trade unions, committees, and grassroots organizations, how to allocate resources, industrial construction, land, and workshops, how to supervise cadres, how to accommodate debate, and how to prevent the resurgence of new high-ranking figures—all these were painstakingly written down.\n\n The creation of this program was neither glorious nor neat. It was written amidst arguments, after mutual interruptions, mutual suspicion, and the tearing of words between the parties. Nue left it with thorns to prevent bureaucracy, Koishi left it with cracks to prevent self-deception, and Flandre made Seija always remember: the organization can no longer rank anyone by bloodline, origin, species, or old names. Seija herself finally transformed the anger and reflection she had accumulated over the years from “I want to overturn the world” into “I want to make a new world truly function.”\n\n From this moment on, overthrowing the old order was no longer just a fire in the streets, nor just a flag on the battlefield. It began to become party headquarters, branches, unions, committees, construction sites, ration lines, and tomorrow itself. This party was far from mature; it would make mistakes, fight internally, go astray, and might even one day face again the very things it initially hated. But at least now, it was no longer just a force that would burn everything, but began to have the ability to push society toward a more advanced, more organized, and more future-like direction.\n\n The revolution was not yet complete. But for the first time, it finally learned how to survive."


KYO_reconstruction_and_revolutionary_order:0 "A New Order Amidst the Ruins"
KYO_reconstruction_and_revolutionary_order_desc:0 "The former Gensokyo was nothing but ruins, hunger, hatred, and wary glances. Streets were broken, supply lines were cut off, old granaries were locked, the weak bowed their heads in chaos, while the strong placed their hands on their sword hilts, waiting for the next tearing apart.\n\n But now, things are finally starting to change.\n\n The granaries are opened, land is redistributed, local workshops and production lines begin to operate; the grassroots are no longer just passively enduring the situation, and tsukumogami are no longer just old objects and ghost stories in corners. Unions, committees, rationing networks, transportation nodes, and local representative meetings are stitching together the scattered manpower and the shattered land. New roads were paved, new construction sites lit up, and a new order began to slowly take shape amidst arguments, negotiations, and labor.\n\n This was not a miracle, nor could it be achieved with a mere slogan. It came from Seija's repeated, determined efforts to learn, adapt, organize, and take responsibility; it came from her refusal to let revolution remain confined to the streets and battlefields, but to push it into warehouses, fields, workshops, conference tables, and everyone's rice bowl. She remained sharp, still unwilling to bow to the old world, but now she understood: the truly weighty task was not overthrowing the throne, but whether, after the throne shattered, she could still provide a way of life for those who remained.\n\n Reconstruction was therefore no longer just repairing ruins, and revolution was no longer merely destroying the old. They began to merge in Seija's hands—dismantling the old order that forced people to bow, while simultaneously establishing new production, distribution, organization, and social relations.\n\n Gensokyo hasn't yet become the ideal place. The conflicts persist, the gaps remain, and the shadows of the old era haven't completely dissipated. But at least from this moment on, this land is no longer just a wreckage propelled forward by rage, but a new world being reshaped, learning how to survive.\n\n And Seija Kijin is finally no longer just the amanojaku who turned everything upside down. She's beginning to become the one who can keep the upside-down world functioning."

 KYO_count_ruins_and_empty_homes:0 "A Warning from Lunar Capital"

 KYO_count_ruins_and_empty_homes_desc:0 "Gensokyo has just restored basic order, but reports from all over the world are beginning to show the same signs: unidentified Moon ships are landing near military bases, some governments are suddenly accepting unfamiliar advisors, and military and resource deployments are gradually shifting to a command system not native to Earth.\n\n Sagume Kishin arrived in Gensokyo at this moment. She carried no insignia of a Lunar Capital envoy, nor did she request any welcoming ceremony. This was because she was not an envoy sent on a mission, but a defector who had left Lunar Capital with classified information.\n\n Sagume handed over documents including Lunar Army deployments, administrative plans for occupied territories, a list of Earth's cooperating governments, and Lunar Capital's conditions for submission to various countries. The Lunarians' operation had already begun; Gensokyo was simply the next target not yet formally written into the plan.\n\n Seija's memory was still blank when she saw Sagume, but her body recognized her first. That familiarity did not elicit an embrace, only a question laced with suppressed anger: “Who are you?”\n\n Sagume did not answer immediately. The more pressing matter is to make Seija understand that Lunar Capital has already extended its reach to Earth, and the time left for life on Earth to prepare for resistance is rapidly diminishing."


 KYO_food_shelter_and_routes:0 "Earth will become Lunar Capital's territory"

 KYO_food_shelter_and_routes_desc:0 "Lunar Capital does not intend to destroy Earth. Cities, factories, farmland, roads, and population are all usable assets; a planet that is still producing, obeying, and paying for resources is far more valuable than a desolate wasteland.\n\n According to the occupation plan brought by Sagume, governments willing to submit can continue to exist, and existing rulers can retain their titles. In exchange, diplomacy, military, industry, and key resources must be subject to the supervision of Moon officials, and local armies will be reorganized into auxiliary forces to assist the Moon Army in maintaining its rule.\n\n Lunarians will become the ruling class above Earth, Moon Rabbits will continue to serve as soldiers, laborers, and executors, and humans and Youkai on Earth will be relegated to the lowest rank of subjects. They can live, produce, and even retain parts of their culture, as long as they forever acknowledge Lunar Capital's ultimate right of judgment.\n\n The most dangerous aspect of this system is that it doesn't require daily massacres. It will utilize the old government, existing bureaucrats, and local elites to gradually deprive Earth of its ability to determine its own future, while the planet appears to function normally.\n\n Seija laughed after reading the plan. Lunar Capital merely extended the existing hierarchical order on Earth to the planetary system. Since the Lunarians are determined to trample the entire Earth under their control, all lower-level life forms on Earth have reason to launch the largest uprising in history."


 KYO_human_village_is_not_a_colony:0 "Only the Forgotten Survive"

 KYO_human_village_is_not_a_colony_desc:0 "The Lunar Capital files brought by Sagume also forced her to reveal another long-hidden fact. Seija doesn't simply possess Lunarian blood; she once lived in Lunar Capital and was once Sagume's personally cared-for daughter.\n\n Lunar Capital is willing to utilize lower-ranking life forms on Earth, but it will never allow so-called impurity to mix into its own bloodline. Seija was born without meeting Lunar Capital's requirements for purity, stability, and lineage. What awaited her was not demotion or exile, but an execution that would not be recorded in public.\n\n To stop this decision, Sagume used her abilities. She made those involved forget Seija's existence and erased Seija's memories of Lunar Capital and her mother. Then, before the plan could be reconstructed, she secretly sent her to Earth.\n\n Seija always believed she had been abandoned. Now she knows that the reason she forgot her mother was because her mother wanted her to live. That void was not a wound left by indifference, but a price that had to be paid for a rescue.\n\n The truth did not immediately bring the two to a reconciliation. Sagume did save her, but she also decided for her what she had to forget and where she had to grow up. Seija acknowledged that she had been given a way out, but also retained the right to question and be angry.\n\n At least from that day on, she finally understood that what truly abandoned her was not a particular mother, but the Moon's order—a system that even judged a child's right to live based on bloodline and purity."


 KYO_youkai_are_not_new_nobility:0 "Passing Through the Blockade in a Dream"

 KYO_youkai_are_not_new_nobility_desc:0 "The Lunar Army can block roads, monitor radio broadcasts, and inspect mail. They can also order cooperating governments to arrest anyone attempting to contact the Outside World. But no matter how tight the occupation regime, they cannot stop every life on Earth and in Lunar Capital from dreaming.\n\n Doremy Sweet showed Seija a road that didn't exist on any real-world map. It was a secret network formed by countless interconnected dreams, bypassing checkpoints on Earth to deliver passwords, warnings, and simple intelligence into occupied territories.\n\n This network not only connected Gensokyo with the Earth resistance but also reached the moon rabbits dissatisfied with Lunar Capital's hierarchy. They had long fought, worked, and carried out orders for the Lunarians, but had never truly become the masters of that noble capital. The first crack might appear within Lunar Capital the moment someone showed them that obedience wasn't the only option.\n\n Doremy was responsible for opening the dream paths, Sagume provided intelligence on lunar army surveillance and rotation, and Seija required that each line be equipped with a real-world contact, alternative passwords, and backup methods of communication. Dreams can bypass blockades, but they cannot become miracles that rely on only one person.\n\n The first message was quickly sent out along the dream: Earth is still resisting, Gensokyo has not yet surrendered, and the Moon Rabbit does not have to forever hold the gun for those in power.\n\n Unseen by Lunar Capital, an underground communication network belonging to lower-level life forms began to take shape."


 KYO_provisional_council_of_gensokyo:0 "The Last Underdog"
 KYO_provisional_council_of_gensokyo_desc:0 "The Lunarian army has invaded Earth. They seize strategic locations, force defeated nations to sign subjugation agreements, and then allow officials sent by Lunar Capital to take over the local armies and governments. Rulers willing to cooperate can retain their positions, provided they acknowledge that Earth henceforth belongs to Lunar Capital's dominion.\n\n In the eyes of the Lunarians, terrestrial life can labor, pay tribute, and serve, but has no right to determine its own future. As long as this conquest continues, humans and Youkai will eventually become low-ranking subjects under Lunar Capital's rule, and Gensokyo will be trapped in a world completely controlled by the Lunarians.\n\n Sagume Kishin confirmed that the invasion would not stop at a few occupied territories. Lunar Capital has prepared a new administrative system, waiting for all nations on Earth to submit one by one. After hearing this, Seija immediately ordered the mobilization of the army, expansion of production, and the contact of resistance forces in various regions, and formally declared war on the Lunarians who had invaded Earth.\n\n She had no intention of serving the throne of the old world, but she would not allow a group of nobles from the moon to sit on the top of the entire Earth. Since the Lunarians refer to all living beings on Earth as lower beings, Seija intends to lead these lower beings in a trans-lunar uprising.\n\n Even if she becomes the last person in the world to dare rebel against Lunar Capital, this war will not end."


 KYO_names_in_lunar_archives:0 "Gensokyo Emergency Council"
 KYO_names_in_lunar_archives_desc:0 "Following the declaration of war against the Moon, the Gensokyo Emergency Council convened. Sagume Kishin marked the Lunar army's landing zones, transport hubs, and supply depots on a map. The enemy's territory continues to expand, and a protracted war of unprecedented scale is unavoidable. Seija demands that Gensokyo immediately enter a state of emergency.\n\n Military industry, energy, railways, warehousing, and large workshops were under the unified management of the Emergency Council; food and essential raw materials were centrally requisitioned, and necessities were rationed; local inventories, production figures, and transportation capacity were to be compiled daily and redistributed according to battlefield needs.\n\n The labor force was also reorganized according to barracks-style communism. Workers formed production teams, peasants formed supply teams, kappa and tsukumogami were incorporated into engineering and maintenance units, and all transport personnel were subject to military orders. Public canteens, dormitories, and a unified rationing system began to expand, with everyone from frontline soldiers to council officials receiving basic supplies according to the same standards.\n\n Total war linked the entire Gensokyo region into a single front. Farmland supplied military rations, workshops manufactured weapons, schools trained communications and medical personnel, and hospitals were responsible for getting the wounded back to work as quickly as possible.\n\n These measures were harsh and arduous, but they met the most immediate requirements of war. Extraordinary times call for extraordinary measures, and all forces capable of sustaining the fight must be concentrated. From the night the Emergency Council concluded, Gensokyo entered a state of total war, and the entire nation began operating like a giant military camp."

 KYO_sagume_does_not_deny_it:0 "Signing the “World-Turning Decision”"
 KYO_sagume_does_not_deny_it_desc:0 "The Emergency Council ultimately drafted the “World-Turning Decision.” Earth does not belong to Lunar Capital, and the beings on Earth are not subjects awaiting the arrangements of a higher civilization. Gensokyo will recognize and assist resistance organizations in various regions, and fight alongside all forces that refuse Lunarian rule.\n\n The Decision also stipulates that this war will not end with the preservation of Gensokyo. As long as Lunar Capital can still appoint the rulers of Earth, as long as Lunarian armies remain stationed on Earth, and as long as so-called higher life forms still have the right to decide the fate of lower life forms, the war is not over.\n\n Sagume Kishin was the first to sign her name. As a god from Lunar Capital, she knew better than anyone what this stroke meant. From that moment on, she was no longer a bystander secretly leaking information, but a traitor openly denying Lunar Capital's rule.\n\n Seija then wrote it down and immediately ordered the Decision to be sent to all war zones. She didn't need people celebrating around a piece of paper; armies had to set out, supplies had to be delivered, and those occupied had to know that someone on Earth was ready to receive them.\n\n The order once written by Lunar Capital began to reverse with these two strokes."


 KYO_not_your_discarded_failure:0 "The Determination to Be Born an Amanojaku"
 KYO_not_your_discarded_failure_desc:0 "After the council dispersed, Sagume finally returned the erased past to Seija in its entirety. Seija was not abandoned by her mother, nor was she a failed product carelessly thrown to Earth. Lunar Capital had planned to dispose of this unsuitable child, and Sagume, in order to save her, had to make everyone involved forget Seija's existence before personally sending her away from the Moon.\n\n The truth didn't immediately bridge the gap between them. Seija had grown up in unanswered days and blamed her mother for everything she endured. Even now, knowing that Sagume had saved her, the loneliness, anger, and feelings of abandonment wouldn't simply disappear.\n\n Seija didn't rush into Sagume's arms, nor did she offer forgiveness. She simply told her mother: “You saved me, but I'm not the mistake you hid. I didn't come here to go back to Lunar Capital to prove myself.”\n\n Her decision to fight Lunar Capital wasn't to reclaim her rightful identity. What she wanted to destroy was the system that could judge whether a child deserved to live, that could determine superiority based on birth.\n\n Sagume gave her the chance to live, while Seija wanted to ensure that more people wouldn't have to rely on being forgotten to survive. She no longer evaded her past from Lunar Capital, nor allowed that past to control her.\n\n She was born an Amanojaku. The fate written for her by others was meant to be overthrown."


 KYO_revolution_beyond_gensokyo:0 "Establish the Ministry of Truth"
 KYO_revolution_beyond_gensokyo_desc:0 "Lunarians' advantage wasn't just in weapons and technology. They possessed faster communication methods, a more sophisticated intelligence system, and knew how to make the occupied believe that resistance was futile.\n\n Lunar Capital-controlled radio stations constantly broadcast news of the collapse of the front lines, while cooperating regimes repeatedly claimed that the arrival of the Lunarians had ended the war and chaos. Surrender was packaged as rationality, obedience was interpreted as progress, and any act of resistance was blamed on hindering Earth's acceptance of advanced civilization.\n\n Sagume Kishin is familiar with Lunar Capital's methods of handling intelligence and shaping public opinion. She is responsible for identifying the enemy's communication patterns, covert codes, and propaganda sources, while Seija, on the other hand, integrates radio stations, journalists, underground organizations, and counter-espionage personnel scattered across the globe, establishing the Ministry of Truth specifically to counter the Lunarians' information superiority.\n\n This agency will expose the true situation in occupied territories, verify battlefield information, cut off Lunarian infiltration channels, and transmit the voices of resistance to the entire world. Seija doesn't need the people to believe everything the government says; she needs them to understand that the Lunarians are not invincible, and the world has not willingly accepted domination.\n\n As long as the oppressed can still hear each other, Lunar Capital cannot declare the war over for the entire world."


 KYO_export_the_spark_not_the_throne:0 "Inversionism"
 KYO_export_the_spark_not_the_throne_desc:0 "After the establishment of the Ministry of Truth, Seija quickly put forward an even more dangerous idea: since Lunarian ideas could infiltrate Earth, revolutionary ideas on Earth could also enter Lunar Capital.\n\n Sagume knew that Lunar Capital was not without flaws. Moon Rabbits had long been burdened with forced labor and warfare, ordinary soldiers had to obey those in higher positions, and many who did not meet the expectations of the upper echelons were excluded from power. Lunar Capital explained this difference as an innate order, but it had to rely on countless oppressed people to maintain its own operation.\n\n Seija wrote down her ideas in what would later be called “Inversionism”: no life is born to rule, and no group is destined to obey; those in lower positions have the right to question orders, organize themselves, and overthrow oppressors; if a revolution stops in one place, it will sooner or later be surrounded by a larger old order.\n\n Sagume was responsible for identifying those within Lunar Capital who could be contacted, while Seija continuously sent articles, recordings, and news of Earth's successful resistance to the Moon. She didn't intend to conquer Lunar Capital and ascend the new throne; her goal was to make the Moon Rabbits, soldiers, and all the oppressed question: By what right do those high and mighty Lunarians command them forever?\n\n Seija sent to Lunar Capital not a crown, but an ideology that would make the crown untenable."


 KYO_no_safe_place_for_oppression:0 "Turning the Fate of Lunar Capital"
 KYO_no_safe_place_for_oppression_desc:0 "Lunar Capital noticed the spreading rebellious sentiment within its ranks. Large numbers of Moon Rabbits were arrested, secret communication points were lost one after another, and the resistance on Earth was suffering repeated defeats under the Lunarians' all-out offensive. All signs pointed to the imminent suppression of this revolution spanning Earth and the Moon.\n\n Sagume Kishin, watching the deteriorating battle situation, finally uttered the words she had long prepared: “This resistance will inevitably fail.”\n\n As her words fell, the seemingly certain situation began to reverse. A breach appeared in the Lunarian encirclement, undiscovered communication lines became active again, and several units that had initially been prepared to obey orders suddenly raised the banner of rebellion. Sagume used her abilities to change the course of defeat, but could only buy the revolution a fleeting opportunity.\n\n Seija had already completed the remaining preparations. Backup commanders, hidden weapons, replanned supply lines, and organizations lurking in the occupied territories began to move simultaneously. She personally went to the most dangerous battlefield, reorganizing the scattered troops into units, and causing the resistance forces, which should have been surrounded, to cut off the Lunarians' retreat.\n\n Sagume was responsible for turning the tide, while Seija was responsible for making the reversal an irreversible reality. They didn't wait for a miracle; instead, they pooled their abilities, intelligence, and long-term preparations in a single moment, finally turning the tide of defeat back onto Lunar Capital itself."


 KYO_turn_over_past_and_future:0 "My name is Seija, born an Amanojaku"
 KYO_turn_over_past_and_future_desc:0 "Lunarian's rule on Earth has crumbled. Occupying governments have collapsed one after another, and the ground troops forced into service have turned to resistance. The Moon Rabbit's rebellion has also spread from the military camps to within Lunar Capital. For the first time, the advanced civilization that once claimed the right to rule Earth must face judgment from below.\n\n When Seija finally stepped onto Lunar Capital, she didn't ask anyone to prepare a throne for her. She ordered the Moon Rabbit's forced service to be lifted, those imprisoned for opposing the war released, and the institutions responsible for maintaining bloodline hierarchy and colonial rule dismantled.\n\n Earth no longer obeys Lunar Capital, and its ordinary inhabitants are no longer obligated to serve a select few. Sagume Kishin stands beside her, watching the child she once hid on Earth, nearly erased from history by Lunar Capital, who has now single-handedly altered the relationship between Earth and the Moon.\n\n She asks Seija if she is finally willing to return to her homeland.\n\n Seija replies, “I'm not coming back. I'm coming to overthrow Lunar Capital.” She refuses to become Lunar Capital's new master, nor will she allow the revolution to breed another group of unchallenged rulers after its victory. Revenge can only change those in power; overthrowing the powerful requires all those trampled beneath to rise again.\n\n She was forgotten, exiled, and considered a failure who shouldn't exist; later, she overthrew the old order of Gensokyo and led what Lunarians considered lowly beings to defeat the conquerors from the Moon. The world had told her countless times to accept her place, but she repeatedly reversed it.\n\n'My name is Seija, born an Amanojaku. '\n\n This is not the end of the story. As long as anyone uses birth, power, and authority to suppress others, Seija Kijin's revolution will not end."










 KYO_Yukari_start:0 "Standing under the moonlight again"
 KYO_Yukari_start_desc:0 "After the death of the 44th Hakurei shrine maiden, Yukari Yakumo once again walked alone into the moonlight. Lunar Capital's meticulously planned assassination attempt failed to take her life, but it claimed the lives of those guarding the barrier and shattered Gensokyo's last shred of hope. The Watatsuki sisters may have temporarily withdrawn their attention, but the Lunarian's ambition never waned; as long as the moon remained high in the sky, the next war was only a matter of time.\n\n Yukari was tired of passively waiting. She would investigate the death of the shrine maiden, repair the shattered barrier, and gather all humans and youkai still willing to protect Gensokyo. Thousands of years ago, she returned from the Moon Sea with her defeated army; this time, she would make Lunar Capital understand—this millennia-long struggle must be ended by the people on Earth."


  KYO_my_shikigami_Ran:0 "The Nine-Tailed Fox from the Animal Realm"
 KYO_my_shikigami_Ran_desc:0 "Ran, born in the Animal Realm, was once one of the most brilliant strategists in that cruel world. There, hesitation invites devouring, mistakes must be paid for in blood, and only by making judgments faster and more accurate than the enemy can one ensure their subordinates survive to the next day.\n\n Yukari Yakumo valued not only the power of the nine-tailed fox, but also her ability to organize chaos into order. Ran accepted the Shikigami contract not because she was being tamed, but because, after calculation, she believed that the world Yukari wanted to create was more worthwhile to maintain than the endless struggle for Animal Realm. From that day on, she poured her nine tails, countless calculations, and all her wisdom into the long project called Gensokyo."

 KYO_Ran_idea:0 "The fox remembers every calculation"
 KYO_Ran_idea_desc:0 "Ran remembers every command, every supply route, and the costs omitted in victory reports. Her nine tails simultaneously deduce nine possibilities, allowing her to find the least damaging and most efficient answer from chaos.\n\n Animal Realm's violence taught her that any omission would ultimately lead to death. Therefore, she not only remembers the equations but also questions who they might have missed."

 KYO_Ran_political_reform:0 "Let the calculations see the living"
 KYO_Ran_political_reform_desc:0 "Ran once believed that as long as the system was efficient enough, individual suffering was merely a negligible error. Now she understands that fear, hunger, grief, and dignity are also objective facts; if they are excluded from calculation, they will ultimately reappear in the form of turmoil, hatred, and collapse.\n\n Writing human emotions into the equation is not bowing to irrationality, but making the conclusion complete. A truly efficient system not only executes orders but also knows who it is protecting."

 KYO_Ran_calculator:0 "Nine-Tailed Fox Algorithm"
 KYO_Ran_calculator_desc:0 "Ran created an algorithm that only she could fully execute, allowing nine lines of thought to simultaneously handle government affairs, supplies, intelligence, barriers, and personnel deployment. Each command is broken down into time, resources, risks, and alternatives, then recombined at the lowest cost.\n\n Her value lies not only in calculating faster, but also in transforming Yukari Yakumo's near-impossible ideas into an executable schedule."

 KYO_Ran_contact_old_friend:0 "Old Acquaintances on the Other Side"
 KYO_Ran_contact_old_friend_desc:0 "Animal Realm rarely remembers favors, but never forgets those who are truly capable. Former colleagues may not agree with the Yakumo family, nor understand Gensokyo's ideals, but they still trust Ran's judgment and are willing to reopen the closed path for her.\n\n Intelligence, supplies, and refugees will once again cross the two worlds. That door wasn't opened to reminisce about the past, but because Animal Realm knew: with this veteran in charge, no resource would be wasted."

 KYO_Ran_will_die_for_you:0 "Staying wasn't because of orders"
 KYO_Ran_will_die_for_you_desc:0 "Ran had calculated countless times, and the answer remained the same—she would stay. Loyalty wasn't about obeying orders to die, nor was it an excuse to abandon thought; it was about weighing the risks, costs, and all possibilities, and still believing that the world Yukari Yakumo protected was worth her responsibility.\n\n She was willing to accept the most dangerous missions, but she wouldn't use death as proof of loyalty. Ran wanted to live to complete every order, correct every mistake, and ensure that those who followed Yukari returned along the path she had calculated."

  KYO_my_shikigami_shikigami_Chen:0 "Stray Cat in the Rain"
 KYO_my_shikigami_shikigami_Chen_desc:0 "Chen was once a kitten abandoned in the rain. She huddled under the eaves of an abandoned house, clinging to the scent left by her owner before they left, repeatedly looking up at the road. The rain stopped and started again, seasons came and went, but that person never returned.\n\n People thought she was too foolish to understand that she had been abandoned. In truth, Chen knew everything, but she refused to believe that the warmth she had received was meaningless. Later, Ran found her in the rain. Ran didn't promise that the lost would eventually return; she simply reached out her hand and told her she could come home with her first."

 KYO_meow_meow_firepower:0 "Innocent Cat"
 KYO_meow_meow_firepower_desc:0 "According to the simplest logic, Chen should have hated the humans who abandoned her, turned her loneliness into a weapon, and repaid her waiting with the suffering of others. But she didn't do that. She would still return to that abandoned house, leave food for the stray cats that passed by, and look expectantly towards the door when she heard footsteps.\n\n Her innocence wasn't because she didn't understand betrayal, but because even after understanding everything, she still chose to believe in kindness. Chen couldn't change the person who didn't return, but she could decide that she wouldn't become another person who abandoned others."

 KYO_meow_meow_firepower_air:0 "Bring the lost person back"
 KYO_meow_meow_firepower_air_desc:0 "Chen knew better than anyone what it felt like to wait in the same place for someone who would never return.\n\n When roads were cut off by war and orders were only given to the main force, Chen led ordinary Youkai through those neglected gaps. The lost children, the wounded Youkai, and the villagers who couldn't evacuate in time would all return along the roads she knew. This time, no one would be left alone in the rain."

 KYO_Chen_the_best_cat:0 "Even the weak have their own homes"
 KYO_Chen_the_best_cat_desc:0 "The Lost Home was originally just an abandoned village. Leaky roofs, dusty rooms, and unresponsive roads sheltered all things forgotten by the world, and once sheltered a cat waiting in the rain for its owner to return.\n\n Chen didn't let it remain forever as it was abandoned. She repaired the broken doors and windows, rekindled the fire in the cold stove, made a bed for the stray little Youkai, and always left an extra hot meal on the table. The Lost Home may still lead those with malicious intent astray, but it will actively open a path for those with nowhere else to go.\n\n Home isn't a place where no one has ever left; it's a place where, no matter how long you've been lost, someone is still willing to leave a light on for you. Chen had never received such a light, so she decided to light it herself."

 KYO_Chen_is_the_cutest:0 "Goodwill doesn't necessarily require proof of its purpose."
 KYO_Chen_is_the_cutest_desc:0 "People often ask how much reward reciprocation reaps in war by helping the weak, or whether an ordinary cat is worth sacrificing precious resources for. Chen cannot answer with complex theories, only knowing that no life must first prove its usefulness to deserve a meal, a bed, and a welcome back.\n\n Goodwill is not an investment waiting for returns. If Gensokyo only wishes to preserve the powerful, useful, or combat-capable, then this paradise and the pure world pursued by Lunar Capital are merely different in name."

 KYO_Chen_will_die_for_you:0 "Even if we're gone, we must live well."
 KYO_Chen_will_die_for_you_desc:0 "Yukari and Ran both knew they couldn't stand behind Chen forever. What they left Chen wasn't an order to die, but the ability to find her way, friends she could trust, and a home that truly belonged to her.\n\n One day, Yukari's gap will close, and Ran will no longer be able to calculate her future. At that time, Chen won't have to go back to waiting in the rain. She should eat well, live well, light the lamp in front of her door at night, and open the door for the next lost soul.\n\n Because love isn't about demanding someone stay forever, but about ensuring that those who have been loved still know how to live after parting."


 KYO_two_shikigami_work:0 "Yakumo House"
 KYO_two_shikigami_work_desc:0 "Yukari, Ran, and Chen share the surname Yakumo, yet their names happen to be based on three colors. Curious onlookers often inquire about the whereabouts of Indigo, Emerald Green, and Bright Yellow, even speculating whether there's another, never-seen Yakumo. Whenever this happens, Yukari simply closes her fan, leaving behind a smile that's hard to discern as genuine.\n\n However, for Ran and Chen, Yakumo has never been just a strange naming convention. Yukari gave Ran a home where she could utilize her talents, and Ran, in turn, led Chen away from that long, rainy period. They don't share the same blood, yet through countless waits, returns, and working side-by-side, they became family.\n\n Now, the shadow of Lunar Capital once again looms over the land. Yukari is responsible for deciding the future, Ran transforms her ideas into order, and Chen helps everyone who might be forgotten. The Yakumo family may only have three colors, but together they are enough to depict the future of Gensokyo."

 KYO_Yukari_rule_all:0 "The Sage's Responsibility"
 KYO_Yukari_rule_all_desc:0 "Gensokyo needs someone who can see the big picture, and someone to make the final decision when disputes become irreconcilable. Yukari Yakumo will once again assume the power of the sage, but she understands that responsibility is not about thinking for everyone, nor is it about turning dissenting voices into her own echo.\n\n She will listen to the fears of humanity, the resentment of the youkai, the anxieties of the god, and the silence of the dead, and then draw a line between answers that cannot coexist. The decision will still be made by Yukari, and she will personally bear the mistakes, the costs, and the hatred that follow.\n\n This is the responsibility of the sage—not to be always right, but to dare to decide where Gensokyo should go when no one else is willing to choose."

 KYO_gensokyo_rebuild_plan:0 "Gensokyo's New Shrine Maiden"
 KYO_gensokyo_rebuild_plan_desc:0 "Yukari Yakumo did not choose a new shrine maiden from among the noble and powerful. She chose Reimi Hakurei—a girl who lost her parents in the war and was raised by the weak Youkai. Reimi is familiar with human sorrow, and she remembers the food Youkai offered her, the sleeves that sheltered her from the rain, and the gentle faces that accompanied her as she grew up.\n\n She will protect humanity, but she will not see Youkai as enemies to be eliminated; she will vanquish those who disrupt order, and she is willing to speak up for the misunderstood monsters. The Hakurei shrine maiden will no longer be just gatekeepers waving gohei before the barrier, but will also become an unbreakable bond between humanity and Youkai.\n\n Yukari entrusts the name of Hakurei, the power to control the barrier, and the mission to protect Gensokyo to Reimi. She chose not the next weapon against Lunar Capital, but someone who could continue to watch over Gensokyo after the war ended."

 KYO_yukari_allies:0 "Two Answers from This World and Higan"
 KYO_yukari_allies_desc:0 "Yukari Yakumo first enters the Bamboo Forest of the Lost, hoping to decipher the Lunarians' behavioral logic from Eirin Yagokoro. Eirin led the gods away from Earth, establishing a city on the Moon far removed from filth and death. She understands better than anyone that Lunar Capital's madness is not without reason: initially, it was a fear of death, which then transformed into a rejection of change, ultimately turning “purity” from a means to perpetuate civilization into a precept for judging whether any life deserves to exist.\n\n Subsequently, Yukari goes to Hakugyokurou and poses another question to Yuyuko Saigyouji: Why are the Lunarians so afraid of death? Yuyuko's answer is simple—because they have never truly understood life. Life is not a permanent escape from death, but a journey that will eventually lead to Higan; it is precisely because flowers wither, feasts end, and those who meet must part that every bloom and reunion has meaning. Lunar Capital, which rejects death, thus begins to hate birth, growth, and change.\n\n Eirin sees Lunar Capital as a system that can be dismantled, while Yuyuko sees the fear hidden deep within it. These two conflicting answers, however, together reveal the truth about Lunarian. Yukari must defeat not just an army, but a world determined to cease all growth in order to escape its end."

  KYO_eirin_and_kaguya:0 "The Sage of the Moon and the Tale of the Bamboo Cutter"
 KYO_eirin_and_kaguya_desc:0 "The tale of the Bamboo Cutter, passed down through generations, ends on the night the Moon Goddess welcomes Kaguya back. However, for Eirin Yagokoro and Kaguya Houraisan, the truly bitter story has only just begun.\n\n Long ago, Eirin led the gods away from the war-torn and death-ridden Earth, establishing the first refuge on the Moon. She witnessed firsthand how a humble settlement transformed into the magnificent Lunar Capital, and how its wariness of filth gradually turned into hatred of life on Earth. When Kaguya, born on Earth, arrived at Lunar Capital, one faction saw her as evidence of the Moon's corruption, demanding her eternal imprisonment or even complete annihilation; the other saw her as the hope that Lunar Capital could still accept change.\n\n Kaguya drank Hourai Elixir, making death no longer a chain binding her. Ultimately, Eirin abandoned the city she had helped build, fleeing to Earth with Kaguya and Reisen. The Tale of the Bamboo Cutter left behind a princess who disappeared in the moonlight, while Eientei preserves a long testimony of how a sanctuary forgot its original purpose."

 KYO_resien_and_tewi:0 "Moon Rabbit Veteran and Earthbound Youkai Rabbits"
 KYO_resien_and_tewi_desc:0 "Reisen still wakes up on nights when the moonlight is too bright. The sound of doors closing reminds her of a rallying bell, and the white light reflected from medicine bottles is like the artillery fire on the battlefield of the Moon. Lunar Capital brainwashes moon rabbits with obedience and honor, then sends them to the front lines in droves as readily available supplies. All the sisters who trained with Reisen died in the First Lunar War; she was able to return not because she was braver than anyone else, but simply because she learned to run away earlier.\n\n Tewi Inaba is a rabbit spirit who has lived on Earth for a long time. She has survived hunters, famines, and countless eras through incredible luck, eventually becoming a respected elder among all the rabbit spirits in the bamboo forest. No one knows why this luck has always favored her; perhaps long ago, she made an unfulfilled promise, so fate still does not allow her to leave."

 KYO_eternal_clinic:0 "Eientei's lights are still on"
 KYO_eternal_clinic_desc:0 "As night fell, Eientei's lamp remained lit for all the wounded. The medical register didn't record the race or faction of those who came, nor did it consider their usefulness in the war; here, the severity of the wounds was the sole criterion for determining the order of treatment.\n\n Eirin had once helped establish a city where the value of life was determined by purity; now she would prove in this bamboo forest that another order could still exist. Kaguya tidied the wards, Reisen tended to the wounded, and Tewi searched along the bamboo paths for those unnoticed by others. As long as someone could reach the light, Eientei wouldn't ask if they were worthy of being saved."

 KYO_night_council:0 "Lunar Capital was originally just a refuge"
 KYO_night_council_desc:0 "Initially, Lunar Capital had no distinction between the pure and the corrupt. It was merely a hastily built refuge, sheltering gods fleeing war, calamity, and death on Earth. Purification was simply a means of isolating disease and maintaining the settlement's survival, never a law determining whether others deserved to live.\n\n In the ancient records preserved by Eirin, the first generation of Lunar people still longed for the oceans, flowers, and seasons on Earth. They feared death, but did not yet hate life. What truly changed Lunar Capital was not a single command, but the fear that accumulated generation after generation: refuge became isolation, isolation became superiority, and ultimately even the reason for building the city was forgotten."

 KYO_state_laboratory:0 "Hourai Elixir's Exit"
 KYO_state_laboratory_desc:0 "Lunar Capital's laws used death as the final threat: the unclean could be executed, dissidents could be eliminated, and those erased could no longer defend themselves. However, after Kaguya drank Hourai Elixir, this order encountered an unenforceable judgment for the first time.\n\n Immortality did not grant Kaguya freedom, but it made Lunar Capital unable to end her resistance with death. That indestructible body became a crack in the system, and also bought Eirin time to plan her escape. In the end, they led Reisen through the roads that Lunar Capital could not completely block, back to the Earth that Lunarians called filth, yet still allowed life to change.\n\n Hourai Elixir blocked death, but also unexpectedly opened an exit to freedom."

 KYO_rational_unify:0 "How can purity become law?"
 KYO_rational_unify_desc:0 "Purity was initially a set of rules for maintaining the Moon's environment. Subsequently, it was incorporated into residency qualifications, lineage records, education systems, and military discipline; Moon dwellers began to be ranked according to birth, and terrestrial life was seen as contamination to be isolated. When a method can determine who is qualified to live, it ceases to be technology and becomes a form of rule.\n\n Eirin can pinpoint the era in which each rule was created, Kaguya remembers how these provisions were applied to specific individuals, and Reisen testifies through her own wounds who the system ultimately sends to the battlefield. These three testimonies will help Yukari Yakumo see the true weakness of Lunar Capital: the so-called eternal purity was never an unshakeable truth, but rather a law forged by a group of people who feared change, forging their own fears."

 KYO_risk_model:0 "The Sin of the Princess on Earth"
 KYO_risk_model_desc:0 "——Excerpt from “The Trial of Kaguya Houraisan by the Lunar Capital Purification Court”\n\n “I acknowledge that I was born on the surface of the earth, and I also acknowledge that I once lived among humans as a Lunarian. The old man cutting bamboo lifted me from the bamboo, and he and his wife gave me not pollution, but the warmth of family. Those suitors who came because of my appearance, some were greedy, some were hypocritical, and some were truly willing to give everything for an unattainable love. They showed me the ugliness of the human heart, and also made me understand why life is still worth cherishing.”\n\n “Later, I returned to the moon. What awaited me was not the embrace of my homeland, but interrogation, imprisonment, and endless hostility. You say that the wind and rain on earth have tainted me, that the name, kinship, and memories given by humans are filth that must be washed away. But I have seen both the warmth and coldness of the earth, and I have tasted the hatred of Lunar Capital; both have become a part of me.”\n\n “My name is Kaguya.” Houraisan, a Lunarian born on Earth, is also the daughter of the Bamboo Cutter. My existence proves that Earth and the Moon are never incompatible. If this is what you call sin, then the guilty party is not me, but this court that forbids life from having two homelands."

 KYO_love_puppetry:0 "Another ending to The Tale of the Bamboo Cutter"
 KYO_love_puppetry_desc:0 "“The Tale of the Bamboo Cutter told on Earth records my birth in a bamboo grove, the impossible tasks I set five suitors, and the night the Moon's emissaries came to take me home. The story ends when the robe of feathers descends, as though the princess's return to the Lunar Capital brought everything to a perfect conclusion.”\n\n “For me, however, that was merely the end of the prologue. I returned not to a homeland awaiting its wandering child, but to a court debating what should be done with me. Some called a princess born on Earth a disgrace to the order of purity. Some wished to imprison me forever. Others hoped my existence might prove that the Lunar Capital could still make room for a different kind of life.”\n\n “I drank the Hourai Elixir not in pursuit of eternal life, but because I refused to let them decide my ending. Eirin abandoned the Lunar Capital she had helped to found. Reisen turned against the army that had trained her to die. Together, we fled to the Earth they called impure.”\n\n “My name is Kaguya Houraisan. Earth's Tale of the Bamboo Cutter tells how others pursued me, and how they lost me. The story that is truly mine began on the day I refused to let the Lunar Capital define who I was.”"

 KYO_statistical_sovereign:0 "After the wise man left Lunar Capital"
 KYO_statistical_sovereign_desc:0 "When Lunar Capital was first established, Eirin's concept of “purity” was never about lineage or status. It was simply a way to isolate disease, avoid war, and allow fleeing gods to continue to survive. She wanted to build a pure city because she believed that those with long lives should understand the importance of respecting every short life.\n\n Later generations only quoted half of her teachings. They retained isolation and purification but deleted tolerance and protection; they distorted the avoidance of filth into the elimination of outsiders, and turned the continuation of civilization into the maintenance of privilege. Moon rabbits were registered as military consumables from birth, life from the surface was imprisoned, and those who opposed them disappeared from society for being “not pure enough.”\n\n Eirin had hoped that Lunar Capital would be a refuge from oppression. But after she left, that city that claimed to be pure and noble ultimately became another world maintained by oppression and enslavement."

 KYO_rabbit_leader_tewi:0 "Under the Bamboo Forest: The Ground Network"
 KYO_rabbit_leader_tewi_desc:0 "The establishment of Eientei was not solely due to Eirin Yagokoro's efforts. When they first fled to Earth, Eirin, Kaguya, and Reisen were unfamiliar with the terrain. They were able to evade pursuers and traverse the ever-changing Bamboo Forest of the Lost because Tewi Inaba actively guided them.\n\n This “Tewi of the Earth” knew where to find water, which paths would leave no trace, and what kind of visitors the nearby settlements were willing to accept. She sent rabbits to deliver bamboo and food, and brought the sick to Eirin. The first pillar of Eientei, the first route for transporting medicine, and the first patient on Earth all bear the traces of Tewi.\n\n Without her guidance, the exiles from the moon would never have found refuge in this beautiful bamboo forest. Eientei became their home on Earth, rather than an exile agency waiting to return to Lunar Capital, precisely because Tewi allowed them to truly experience life on Earth."

 KYO_lucky_star_for_all:0 "Partial peace is not forgetting"
 KYO_lucky_star_for_all_desc:0 "Eirin couldn't easily hate Lunar Capital. That city was like a child she had raised: she had helped lay its initial foundations, set its rules, and once believed it would one day become the ideal abode of the gods. Now, this child wantonly distorted her teachings and used the knowledge she left behind to oppress life on earth.\n\n For a long time, Eirin chose to live in seclusion in the bamboo forest. She thought that by hiding Lunar Capital's technology and avoiding further contact, she could prevent a greater catastrophe. However, her silence did not bring peace, but only allowed the Pure Ones to push Lunar Capital to a more dangerous extreme. If left unchecked, the Lunarians' next war would not only destroy Gensokyo, but also make Lunar Capital completely lose any chance of turning back.\n\n A healer cannot refuse to remove a spreading disease simply because they care for the patient. Eirin must make a decision: she must help Yukari Yakumo stop Lunar Capital, even if it means personally correcting her most cherished, yet most failed, creation."

 KYO_reisen_the_Tormented_one:0 "Veteran of First Lunar War"
 KYO_reisen_the_Tormented_one_desc:0 "“During the First Lunar War, Lunar Capital's system demonstrated unprecedented efficiency. Orders could spread throughout the army in an instant; gaps appeared on the front lines, and new moon rabbits were immediately brought in from the rear. Our formations were never disrupted, ammunition was never interrupted, and battle reports always proclaimed victory was imminent.”\n\n “But they never wrote down the costs in their battle reports. Sisters on the front lines died constantly, while children in the rear were sent to fill the gaps as soon as they finished training. The so-called impregnable defenses were nothing more than high walls built of layer upon layer of flesh and blood; the so-called great victories of Lunar Capital were only because they could send lives to the battlefield faster than the enemy.”\n\n Reisen looked at Eirin, her voice gradually lowering. “Lady Eirin, if you hadn't transferred me from the battlefield back then, I would never be alive today. I wasn't the bravest one, nor the strongest one. I was just the only one among those sisters who was allowed to live.”"

 KYO_reisen_the_one_without_love:0 "Moon rabbit chooses the ground"
 KYO_reisen_the_one_without_love_desc:0 "“Why do I live? In Lunar Capital, they had already prepared the answer for me. To obey orders, to protect purity, to prevent filth from invading the Moon; and if necessary, to die on a front no one remembers.”\n\n “After coming to Earth, I gradually understood the beauty that Lady Eirin spoke of. Here it rains, mud stains clothes, life ages, and we meet because of trivial things. No one distributes medicine according to purity, and the rabbits in the bamboo forest don't need to prove their worth before they deserve a meal.”\n\n “I still miss the Moon, because my childhood is there, and my sisters are buried there. But missing it no longer means obedience. Lunar Capital once decided for me why I was born and why I should die; now, for the first time, I must decide for myself where I belong.”\n\n “I am the moon rabbit Reisen, and I choose to stay on Earth.”"

 KYO_infinite_spiral:0 "Still remaining at Lunar Capital's rebellious stance"
 KYO_infinite_spiral_desc:0 "Eirin retrieved an ancient file taken by Lunar Capital during their escape from the secret chamber. It was a register of refugees arriving on the Moon: after the initial founders, the second and third waves of divine spirits migrated from Earth to Lunar Capital. One name, repeatedly modified but never deleted, caught her attention—Sagume Kishin.\n\n The ancient records referred to Sagume as Ame-no-Sagume, closely associated with the origins of the amanojaku. By today's Lunar Capital standards, this god, capable of reversing words and fate, should be filled with intolerable earthly filth; yet, instead of being expelled, she remained deep within Lunar Capital's power structure. Her existence proved that purity is never a consistent truth, but merely a set of political rules that create exceptions for the useful.\n\n If Sagume still remembered her origins, she might not have accepted the Lunar Capital shaped by the Purification faction. Such a god, hidden within the system yet capable of reversing predetermined fates, could very well be the key to breaking through Lunar Capital. Eirin must discuss this matter with Yukari Yakumo immediately."

 KYO_the_end_of_the_humankind:0 "Lunar Capital, which lost Eirin"
 KYO_the_end_of_the_humankind_desc:0 "Yukari Yakumo hid the gap between the lines of that ancient register, allowing Eirin's information to bypass Lunar Capital's surveillance. Days later, a line of text in the file reversed itself, and a reply from Sagume Kishin finally arrived on the surface.\n\n Sagume recounted Lunar Capital after Eirin's departure. The Purifiers took over the council, erased the early history of the city, and portrayed the departed sage as a corrupted traitor. The opposition did not completely disappear, but could only hide within the administrative organs, the army, and the god families, preserving their power in silence, waiting for an opportunity to break the status quo.\n\n “As long as there are still people in this world who claim their order is absolutely correct, the amanojaku will be its eternal opponent,” Sagume wrote. “When everyone is ordered to say yes, someone must retain the ability to say no.”\n\n Lunar Capital, without Eirin, was not indestructible. Cracks still exist within it, and the amanojaku clan, considered heretical by the system, guards behind those cracks."



 KYO_fat_princess:0 "Nonexistent Summoning Command"

 KYO_fat_princess_desc:0 "A summoning order bearing Hakugyokurou's mark was sent to Eientei. The document claimed that Yuyuko was detaining the fallen soldiers of the Moon War and refused to allow Eientei access to the dead moon rabbit.\n\n Youmu quickly discovered that the seal was upside down, while Yuyuko found Reisen, who was still alive, in the list of the dead. The back of the paper again bore an old advertisement for the “Bunbunmaru Newspaper.”\n\n Aya Shameimaru argued that since the previous document questioned Eientei, this one should question Hakugyokurou to be impartial. Yukari only corrected her on one common sense point: fabricating crimes on both sides simultaneously does not make a lie into justice.\n\n In the end, Hakugyokurou and Eientei did not go to war over this forged order. Aya was left behind to check the records of the twelve boxes of the deceased, and to learn the difference between investigative journalism and fiction."

  KYO_yuyuko_and_youmu:0 "The Undead Princess and the Half-Human Court Master"
 KYO_yuyuko_and_youmu_desc:0 "Yuyuko Saigyouji was the last descendant of the Saigyouji family. She ended her life under Saigyou Ayakashi, but did not disappear. When she opened her eyes again, her breath and body temperature were gone, and her memories were blurred; the dead human girl had become the spirit princess who now rules Hakugyokurou.\n\n Yuyuko knows how to comfort the dead, release their obsessions, and send their souls on their next journey, but rarely mentions why she remains here. She has seen countless people go, yet she herself seems forgotten on the page between life and death, unable to leave.\n\n Accompanying her is the half-human, half-phantom gardener Youmu Konpaku. Youmu trims cherry trees, prepares meals, and banishes unruly ghosts, and when Yuyuko forgets time and the past, she remembers for her that Hakugyokurou still exists today. The mission of the Konpaku clan is to protect the Lord of Netherworld, but what Youmu protects is far more than just a mission."

 KYO_grandpa_still_fight:0 "The Konpaku clan's Original Oath"
 KYO_grandpa_still_fight_desc:0 "When the Konpaku clan first received the sword of Hakugyokurou, Gensokyo's Yama Eiki Shiki repeatedly instructed them: Yuyuko Saigyouji must not be harmed. She is not merely a princess in name only, but the key to the flow of souls in the Netherworld. If Yuyuko were to lose control, countless dead would be trapped between life and death, and even the boundary between Higan and Gensokyo might be shaken.\n\n Therefore, the Konpaku clan's oath contains two inseparable responsibilities: to serve the lord of Hakugyokurou and to guard the boundary between the living and the dead. Most of the time, these two missions are in harmony; but if Yuyuko's will conflicts with the order of the Netherworld, the Konpaku clan's sword must choose between loyalty and duty.\n\n Youki Konpaku entrusted Youmu with swordswomanship, the position of Gardener, and this heavy oath. The old man may have left Hakugyokurou, but the mission he left behind remains in the hands of the young gardener—to protect Yuyuko, and, if necessary, prevent her from crossing the line she should not cross."

 KYO_Hakugyokurou_order:0 "Netherworld is not the end"
 KYO_Hakugyokurou_order_desc:0 "Netherworld is not a warehouse for the dead, much less an end where souls linger forever. After life ends, the deceased arrive here with their name, memories, and lingering attachments; these things do not immediately disappear when the heart stops beating, nor should they be abruptly erased.\n\n Through Yama's judgment, the soul will be received by Yuyuko into Hakugyokurou. She listens to the deceased's final regrets, allowing them to look back on their ended lives under the cherry blossoms, gradually letting go of attachments that cannot be carried to the next life. When the name no longer causes pain, and the memories finally find peace, the soul will leave Netherworld and enter the next cycle of reincarnation.\n\n Death is not the nothingness of life, but a transit point between two journeys. Yuyuko's duty is not to detain the dead, but to ensure that every soul arriving at Higan can continue its journey once it is ready."

 KYO_beauty_court:0 "Yuyuko, do you know who you are?"
 KYO_beauty_court_desc:0 "“Yuyuko, why are you here? There are countless dead in Netherworld, and Hakugyokurou has welcomed many noble souls, but why are you the one sitting in this position?”\n\n The simplest answer is: You are the last descendant of the Saigyouji family, the one who sealed Saigyou Ayakashi, and the Netherworld administrator chosen by Yama. Your remains cannot leave the tree, and your soul cannot enter reincarnation, so bidding farewell to other dead becomes your endless duty.\n\n But identity cannot fully answer who she is. Shedding the titles of princess, deceased, and administrator, she still smiles at delicious food, remembers the sound of spring snow falling in the courtyard, and on certain familiar nights, inexplicably gazes at Saigyou Ayakashi that should never bloom.\n\n She is neither a tool sealed by Saigyou Ayakashi, nor merely an official appointed by Yama. Even having forgotten everything from her life, she is still Yuyuko Saigyouji—a person who has passed through death but has not lost herself in the process."

 KYO_flower_blossom_again:0 "Saigyou Ayakashi's Sealed Object"
 KYO_flower_blossom_again_desc:0 "Saigyou Ayakashi's roots are not just a single skeleton. Generations of the Saigyouji clan lie buried here; their bones, names, and power together form part of the seal. The closer to the surface, the later the burial; and above all ancestors, the final seal, lies the last descendant of the Saigyouji family—Yuyuko.\n\n In her previous life, she prevented Saigyou Ayakashi from fully blooming with her own death. To ensure the seal would not be shaken again, she lost her memories of the cause of her death and the location of her body. Afterwards, the dead girl awoke as a spirit, unaware that beneath her feet lay her entire family and her former self.\n\n The last Saigyouji did not inherit any mansions or family businesses in the human world. What she inherited was the heavy responsibility of guarding the ancestral resting place, maintaining the seal of Saigyou Ayakashi, and managing all the souls that come to the Netherworld."

 KYO_pale_spycraft:0 "Yama's Verdict"
 KYO_pale_spycraft_desc:0 "Eiki Shiki, representing Higan, guaranteed for Hakugyokurou: All worlds must recognize Yuyuko Saigyouji's management of the souls of the Netherworld, and must not arbitrarily seize souls, interfere with judgments, or force the dead to return to the human world under the pretext of war or politics.\n\n Accompanying this power are the responsibilities that Hakugyokurou must bear. All souls sent by Higan must be settled, and once their obsessions are resolved, they must enter the cycle of reincarnation; Hakugyokurou must not detain the dead, form a private army of the dead, or allow anyone to approach the seal of Saigyou Ayakashi. The sword of the Konpaku clan is responsible for ensuring that these rules are enforced.\n\n Yama protecting Hakugyokurou does not mean giving Netherworld to Yuyuko. All the power here exists only for the safe departure of the dead. If the administrator treats a soul as their own possession, the power granted by the judgment will also become the basis for judging her on the same day."

 KYO_may_the_flower_fly_high:0 "Blooming invites death"
 KYO_may_the_flower_fly_high_desc:0 "Saigyou Ayakashi can never fully bloom under any circumstances. Its petals are no ordinary spring scene; each bloom calls forth death within the living, causing souls to detach from their bodies and merge into the roots of Saigyou Ayakashi. If all branches bloom simultaneously, the boundary between life and death will crumble.\n\n Just as Baldr's death did not merely signify the fall of a god, but heralded the beginning of Ragnarok, the blooming of Saigyou Ayakashi is also a harbinger. It foreshadows not the destruction of a courtyard or a family, but the beginning of death transcending Higan, dragging the entire mortal realm into a hopeless end.\n\n Yuyuko's remains are the final lock sealing this catastrophe, her lost memories the second door locked. To allow the living to continue welcoming spring, Saigyou Ayakashi can never bloom; and Yuyuko is destined never to fully understand why she sleeps beneath the flowering tree."

 KYO_throne_of_the_dead:0 "The Duties of the Undead Princess"
 KYO_throne_of_the_dead_desc:0 "Yuyuko's philosophy of life didn't come from scriptures or pronouncements, but was gradually forged through countless farewells. She had seen the deeply attached dead finally let go of their hatred, and she had seen the souls reluctant to part with their loved ones linger under the cherry blossoms for years before peacefully walking towards reincarnation. Death, in her eyes, was neither punishment nor failure, but simply a door that all lives must eventually pass through.\n\n She wouldn't belittle any departure just because she had seen countless souls off. Every name belonged to an unrepeatable life, and every farewell deserved to be taken seriously. Therefore, Yuyuko's smile appeared exceptionally peaceful—she knew that sorrow wouldn't last forever, and that the departed would eventually begin anew on another journey.\n\n Only Yuyuko herself could not move forward. She watched countless souls arrive, linger, find peace, and enter a new cycle of reincarnation, while she herself remained seated in Hakugyokurou, for her own end had long been sealed beneath Saigyou Ayakashi.\n\n The seat of the Princess of the Dead was never a throne ruling over the dead, but a watchful seat that arranged the final journeys for everyone except herself."

 KYO_accept_death_to_all:0 "Between Life and Death"
 KYO_accept_death_to_all_desc:0 "Faced with souls newly arrived in Netherworld, still fearful of death, Yuyuko rarely uttered cold pronouncements. She would ask Youmu to bring tea and refreshments, inquire about their names, and patiently listen to their final words as if receiving a guest from afar.\n\n Only when it was time to depart would she gracefully rise, personally calling out the name of the deceased, opening the path to reincarnation for them. After the farewell, Yuyuko would casually ask Youmu what she wanted for dinner, as if the parting had been just an ordinary feast.\n\n Her seemingly nonchalant attitude wasn't due to a lack of understanding of the weight of death. It was precisely because Yuyuko understood better than anyone that parting was inevitable that she didn't want to add to the burden of the deceased with solemnity and fear. Acknowledging death is not praising it; gently sending someone off is to ensure the departed retain their name and that those left behind can continue living."

 KYO_youmu_the_Domination_one:0 "The Commands of the Konpaku clan"
 KYO_youmu_the_Domination_one_desc:0 "Yuyuko's requests were always vague. She would gaze at the empty courtyard and remark on how lonely the wind seemed that day; she would ask Youmu to prepare two teas, without specifying who the other guest was. Youmu could only try to decipher her mistress's thoughts while tending to the lost spirits, tending the garden, and managing to get dinner on time.\n\n The first command left by Youki was to serve Yuyuko; the second command was to stop Yuyuko when necessary. Young Youmu initially thought these two commands contradicted each other, until she gradually came to understand her master through countless trivial demands.\n\n Her grandfather placed “serve” first not because she believed her master was always right. Only by first accompanying Yuyuko and understanding her silences and jokes could Youmu distinguish between mere childish whims and forgotten pain, and when she must draw her sword and say no."

 KYO_youmu_the_one_without_love:0 "Between Master and Duty"
 KYO_youmu_the_one_without_love_desc:0 "One spring day, Yuyuko stood before Saigyou Ayakashi and said in an almost weather-sounding tone, “It would be so beautiful if it could bloom in full.”\n\n The Konpaku clan's secret decree required Youmu to stop anyone attempting to break the seal, even if that person was Hakugyokurou's master. Her hand unconsciously moved to the hilt of her sword, but in Yuyuko's eyes, she saw a kind of longing that even she herself couldn't understand. Was it a dangerous order, or the instinctive pursuit of one's past by someone who had lost their memory?\n\n Youmu didn't blindly obey, nor did she immediately treat Yuyuko as a sinner to be subdued. For the first time, she set aside the standard answer of “successor of the Konpaku clan” and earnestly asked her master why she wanted to see that tree bloom.\n\n One day, she would have to choose between her mission and Yuyuko. But before that day arrives, Youmu must at least be certain that she has chosen the person before her, not the answer imagined for her by ancestral teachings."

 KYO_spirit_is_all:0 "Reborn After Death"
 KYO_spirit_is_all_desc:0 "Yuyuko has no heartbeat, nor does she possess a truly living body. Yet she still shows anticipation for new dishes, serves guests elegantly, and deliberately makes impossible requests to tease the overly earnest Youmu. Death took away her past, but it didn't turn her into an empty shell merely performing duties.\n\n Youmu once didn't understand why the dead needed to eat, admire flowers, and celebrate festivals. Later, she realized that these things weren't to sustain Yuyuko's life, but to prove that death hadn't erased her as a human being.\n\n Waking up after death isn't a simple continuation of her previous life, nor is it being completely erased by the world. Memories may be fragmented, and the way she exists may have changed, but Yuyuko can still rebuild relationships, take on responsibilities, and decide how to spend each day. She died once, and then continued to live on as another version of herself."

 KYO_spirit_has_no_limit:0 "The Eternal Netherworld"
 KYO_spirit_has_no_limit_desc:0 "As long as life exists, death will not cease; as long as the dead continue to arrive, the work of the Netherworld will never end. Every day, Youmu sweeps away fallen cherry blossoms, organizes the register, and guides ghosts, while Yuyuko receives wave after wave of souls who have completed their lives. This order has been running for far too long, and it is destined to continue.\n\n However, Hakugyokurou's eternity is not without change. Seasons change, the trees in the garden sprout new branches, and Youmu, from a child trembling with a sword, gradually grows into a gardener capable of shouldering responsibilities alone. Yuyuko has witnessed many generations of spirits come to her side, and ultimately, she herself sees them off.\n\n She knows that Youmu will not stay with her forever, but she never reveals this. So Yuyuko would still make childish requests, and Youmu would still earnestly try to fulfill them. For those without end, these short and ordinary days were more precious than eternity."

 KYO_the_one_without_love:0 "Manager, or Prisoner?"
 KYO_the_one_without_love_desc:0 "Yuyuko confessed to Youmu that the duties of the Lord of Hakugyokurou both provided her with a place to stay and trapped her in a time without end. Every soul that came before her had a next destination, but the manager responsible for arranging their return never had a place for herself on the register of reincarnation.\n\n She didn't hate this duty. Seeing obsessions resolved and the dead embark on their journeys again did give meaning to her long existence. But when the last guest left and Hakugyokurou returned to silence, Yuyuko sometimes couldn't tell whether she had chosen to stay here or had already become part of maintaining Netherworld's operation.\n\n “Perhaps I always ask what I'll eat next,” she said to Youmu with a smile, “it's just because that's the closest future I can still look forward to.”\n\n At that moment, Youmu finally saw the cage behind the throne and understood that Yuyuko's composure wasn't the absence of sorrow, but rather that she had learned over the long years how to gracefully coexist with sorrow."

 KYO_the_end_of_the_every_soul:0 "Youmu's Own Choice"
 KYO_the_end_of_the_every_soul_desc:0 "Youmu reread the secret order left by the Konpaku clan, then put it back in its sword case. She wouldn't doubt Yuyuko because of Higan's orders, nor would she close her eyes to actions that might jeopardize the order of life and death simply because she cherished her master.\n\n “Lord Yuyuko, I choose to stay by your side not just because of the oath of the Konpaku clan. If one day you truly attempt to make Saigyou Ayakashi bloom, or harm the souls entrusted to Hakugyokurou, I will stop you with my own hands.”\n\n Youmu paused, gripping her sword tightly.\n\n “But even after that, I will not leave you. I will share the consequences with you, and together we will find a path to continue.”\n\n Yuyuko looked at her quietly for a long time, finally smiling as she replied, “Then until that day comes, I still entrust the garden and dinner to you.”\n\n Only now did Youmu truly understand why her grandfather had written “serving the master” before “stopping the master.” Loyalty is not eternal obedience, but refusing to abandon the other when one must say no. The orders of the Konpaku clan end here; from now on, this will be Youmu's own choice."


 KYO_quack_doctor:0 "The Forged Prescription Under the Moonlight"

 KYO_quack_doctor_desc:0 "A so-called Eientei trial list is plastered all over the streets. The paper contains no complete medical records, only dosages, trial order, and estimated time of death, as if wounded soldiers sent back from the battlefield were merely samples awaiting recording.\n\n Yuyuko takes the prescription to Eientei, intending to ask Eirin if she has crossed the line expected of a healer. Eirin immediately points out that the document uses Lunar Capital military units from two hundred years ago, the patient signatures are from old prisoner-of-war records, and the stamp's position is completely wrong.\n\n Yukari turns the paper over and finally discovers its true source—a batch of unsold old copies of the *Bunbunmaru Newspaper* newspaper.\n\n Aya Shameimaru insisted this was a news exercise to test Eientei's credibility, but was ultimately required to publish corrections for seven consecutive days. The dispute between Eirin and Yuyuko didn't disappear, but at least this time, they found someone more worthy of questioning than each other."




 KYO_human_must_obey:0 "Restarting the Battle with the Moon"
 KYO_human_must_obey_desc:0 "The ancient saying “knowing it's impossible yet doing it anyway” doesn't mean being blind to the impenetrable cliff ahead, but rather understanding that some things, even if impossible, should never be surrendered to.\n\n The crushing defeat of the First Lunar War had already proven the immense power of Lunar Capital. Toyohime could fold distances, Yorihime could summon the gods, and the Pure Barrier prevented the earthly army from even reaching the actual city gates. For a thousand years, Lunarians have always regarded that victory as proof that the earth could never resist.\n\n Yukari Yakumo sees defeat as a battle yet to be fought. Her former followers were a distrustful army of Youkai; now, standing behind her are the Gensokyo, who have learned to live together and are willing to fight for the same homeland.\n\n We will once again challenge the impossible and seize a victory from Lunar Capital that even fate could not foresee."

 KYO_east_asia_is_mine:0 "Awaken the power within the Sanctuary"
 KYO_east_asia_is_mine_desc:0 "Deep within the Lunar Capital Sanctuary, two individuals remain, manipulated. The Purification Faction molded them into guardians of the Sanctuary, calling their manipulated memories their mission, and making them believe that obedience to Lunar Capital is their only value. They possess the power to change the course of the war, yet they have never been allowed to decide how to use that power.\n\n The files left by Eirin and the secret letter from Sagume finally reveal the lies behind the orders. The two are not true advocates of the purified order; they are merely isolated from the truth, trapped within the identities written for them by Lunar Capital.\n\n Yukari will not transform them from one weapon into another. She will guide them to see their concealed past and give them their first chance to choose for themselves. The power within the Sanctuary should no longer guard its cage; its direction should be determined by those who wield it."

 KYO_how_to_deal_philippines:0 "Seeking the help of the Goddess Hell"
 KYO_how_to_deal_philippines_desc:0 "Lunar Capital abhors death, regarding Hell, reincarnation, and the dead as filth to be avoided. However, precisely because of this, the expansion of the Purification faction also threatens the order of the afterlife. If the Lunarians can truly erase all changes from the world, Hell will sooner or later become their next target for purification.\n\n Yuyuko will use the connections of Hakugyokurou and Higan to deliver an invitation to the Hell goddess Hecatia Lapislazuli. She has long loathed the aloof purity of Lunar Capital and will not miss the opportunity to make the Lunarians pay the price.\n\n This is not a demand for Hell to submit to Gensokyo, but an invitation to another god with a common enemy to join the war. When the paths of Netherworld, the authority of Hell, and the gap of Yukari connect, Lunar Capital will find that those worlds they have condemned as filth have begun to surround the Moon from all sides."

 KYO_how_to_deal_USSR:0 "Breaking the Shield of Lunar Capital"
 KYO_how_to_deal_USSR_desc:0 "The shield of Lunar Capital is not simply an energy barrier. It repels impurity with purity, rejects change with stillness, and isolates all enemies with the vast distance between the moon and earth. In First Lunar War, the Youkai army lost its way before these laws, ultimately failing to even reach the real Lunar Capital.\n\n Eirin will point out the laws governing the shield's operation, Sagume will provide the weakest point from within, and Ran will calculate the potential consequences of each change. Ultimately, Yukari will personally modify the boundaries between the moon and the earth, and between the inside and outside.\n\n We don't need to brute force the entire barrier; we only need to make it unable to determine the enemy's origin. When the definitions of “external enemy” and “those within the city” overlap, the supposedly absolutely pure shield will automatically open its first crack."

 KYO_secure_south_east_asia:0 "Establishing Supply Lines Between the Earth and the Moon"
 KYO_secure_south_east_asia_desc:0 "Opening the gap only allows the army to reach the Moon, but it cannot guarantee their continued fighting there. Weapons, ammunition, medicine, and food must reliably cross the Earth-Moon boundary, and the wounded must be returned to Earth before the gap closes. Otherwise, the Moon forces will ultimately remain just another isolated expeditionary force.\n\n Ran programmed each gap with precise transport schedules, Kappa manufactured cargo crates capable of withstanding boundary distortion, Eientei established wounded evacuation systems at both ends, and Tewi and Chen connected the secret roads throughout Gensokyo to the distribution network. Every city liberated and factory recaptured on the surface battlefield would translate into the Moon forces' continued advance.\n\n From then on, the war on Earth and the Moon were no longer separate. Behind the Moon army was not a fragile gap, but an entire world willing to supply them with weapons, food, and hope."

 KYO_creat_big_gensokyo:0 "Opening the Gap to the Moon"
 KYO_creat_big_gensokyo_desc:0 "A thousand years ago, Yukari Yakumo also opened a path to the Moon Sea in the night sky. Back then, the Youkai, driven by fame, ambition, and a war no one truly understood, embarked on the Moon, ultimately crumbling before the Watatsuki Sisters. Yukari returned to Earth with her remnants, leaving her defeat in the long dreams that followed.\n\n Now, she stands once more under the same moonlight. Behind her are the healers of Eientei, the dead of Hakugyokurou, the sentinels of Youkai Mountain, the monks of Myouren Temple, the vampires of Scarlet Devil Mansion, the subterranean Youkai, and countless lives who could never have stood shoulder to shoulder with her in the past. They are not weapons preserved, but people who voluntarily protect the same homeland.\n\n Yukari unfolds her folding fan, dividing the boundary between “distant” and “immediate.” The night sky splits open, and the white horizon of the lunar maria appears directly before the Gensokyo group for the first time.\n\n This time, they will not come to conquer the moon. The war on Earth will reclaim the countries controlled by Lunar Capital, while the war on the Moon will reach the core of the purifying order. Both fronts must be won together for the fate of the world to be truly rewritten."

 KYO_the_yukari_order:0 "The World Yukari Desires"
 KYO_the_yukari_order_desc:0 "On the edge of an almost faded ancient star map, two different handwritings remain. Yukari Yakumo can no longer recognize one of the names, but she always remembers that she and someone traveled through countless years to this era to stop Lunar Capital from destroying Earth. That was Maribel Hearn's original mission, and also the obsession that Yukari Yakumo has long forgotten her origins for but has never truly let go of.\n\n Initially, she only wanted to preserve the illusion sufficient to defeat Lunar Capital. After the First Lunar War, she realized that youkai, gods, and ghosts were not weapons to be used passively. They could fear, quarrel, love, and call a temporary refuge their home. Thus, Gensokyo, originally built for the war, gradually became a reason to end it.\n\n What Yukari wanted was not a world ruled by youkai, not a massive barrier that shut out all dissent, and certainly not to completely erase Lunar Capital from the sky. She wanted science to no longer need to prove itself by denying illusion, and illusion to no longer need to consume humans to survive; she wanted the living to no longer fear the dead, and life on the moon and on earth to no longer be judged as impure because of birth, change, and memory.\n\n The Purifiers must be eliminated, but Lunar Capital will still have a future. Eirin and Kaguya will return to their former sanctuary and rebuild it with the Lunarians who are still willing to change. Gensokyo will not conquer the Moon, but will only end an era that disguises fear as purity.\n\n The journey across millennia is finally nearing its end. Merry initially wanted to change a future destined for destruction; Yukari Yakumo wants to prove that there are more ways to live in the world. Even if she has forgotten who first stood with her gazing at the stars, that promise will still be fulfilled in this world where they no longer have to reject each other."

 KYO_love_forever:0 "Sunset Vow"
 KYO_love_forever_desc:0 "After a mission to Eientei and Hakugyokurou, Reisen and Youmu did not immediately return to their respective masters. They sat side by side on the stone steps at the boundary of life and death, watching the sunset gradually sink into the clouds. One had fled the battlefield of the Moon, the other had been taught from childhood never to leave her post; they rarely had moments where they could simply stop.\n\n Reisen asked if they could meet again like this after the war ended. Youmu didn't promise eternity, nor did she give any grand answer, only earnestly promising that she would try her best to keep the promise as soon as the next sunset came.\n\n This promise wouldn't end Eirin and Yuyuko's argument, nor would it be written into any covenant. It was simply two girls who had long lived under the weight of their missions, allowing themselves for the first time to look forward to a tomorrow unrelated to their duties. As for what name this feeling would ultimately have, that should be decided by themselves."

