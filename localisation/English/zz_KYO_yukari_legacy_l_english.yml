l_english:

KYO_after_war_reform:0 "After the victory, no one left their seats."
KYO_after_war_reform_desc:0 "The Japanese government had surrendered, and the sounds of gunfire on the front lines had gradually subsided, but the problems facing the Hundred Youkai Accord were more chaotic than during the war.\n\n Hundreds of thousands of soldiers awaited demobilization, residents of occupied territories needed food and new identities, and wartime requisitioned railways, workshops, and lands were each claimed by different owners. The old Great Hakurei Barrier continued to deteriorate, and the Japanese archipelago had already been incorporated into Gensokyo's fate by supernatural forces, the undead, and anomalies left by the war.\n\n With the common enemy gone, former allies no longer needed to suppress their differences. The army demanded rewards for their war achievements, temples and shrines demanded relief for the residents first, local organizations refused to relinquish all power to the central government, and each side believed that only their own solution could define victory.\n\n Yukari Yakumo could not allow the Hundred Youkai Accord to disband at this moment. At least until Japan completes its takeover and a new boundary is established, this union, barely maintained by suspicion and shared crisis, must remain at the same table."

KYO_reform_the_system:0 "Hundred Youkai Accord has no peace treaty."
KYO_reform_the_system_desc:0 "Hundred Youkai Accord was born for war.\n\n It can decide where the legions attack, where supplies are sent to, and can demand temporary obedience from various factions under the pretext of survival. However, the agreement never stipulated what status Japanese residents should receive after the war, who should own the occupied industries and ports, whether local armed forces must surrender their weapons, or who should investigate the crimes committed by the victors during the war.\n\n Remilia demanded recognition of military merit and the right of conquest, Byakuren refused to allow protection to become permanent control, local representatives demanded personal involvement in the management of workshops and land, and Eiki insisted that victory should not exempt anyone from accountability. Every question has multiple answers, and each answer will create a different postwar order.\n\n Yukari must make rulings on each issue. These decisions may not satisfy all parties, but they will gradually transform the previously ambiguous disputes into four conflicting futures."

KYO_reform_the_barrier:0 "Re-determine the location of Gensokyo"
KYO_reform_the_barrier_desc:0 "The old Great Hakurei Barrier, which originally only distinguished Gensokyo from the Outside World, must now encompass the entire Japanese archipelago, rewritten by war.\n\n Youkai energy seeps into cities, the undead linger on old battlefields, and Outside World technology and fantastical phenomena intertwine in railways, ports, and ley lines. Simply extending the old barrier outwards will concentrate all the pressure on the existing nodes, and the weakest point will inevitably tear apart again.\n\n Yukari, Ran, and Chen must remeasure the relationships between mountains, cities, life and death, and inside and outside, establish new anchor points in various locations, and decide whether the barrier should be centrally unified and locally shared, or use constantly changing real coordinates to evade external observation.\n\n However, each calibration leaves subtle records. The missing measuring equipment, the unidentifiable source of the signal, and the distant white light without any trace of youkai power all suggest that another pair of eyes is searching for Yukari Yakumo's location along the errors."

KYO_kill_the_rebel:0 "Unreturned Weapons"
KYO_kill_the_rebel_desc:0 "Demobilization orders have been sent to the various legions, but the numbers in the armories still don't match.\n\n Crates of rifles and ammunition went missing en route, local self-defense forces refused to hand over their last weapons, and some workshops hid wartime-made equipment. For the central government, these uncontrolled weapons could become the starting point for riots and private armies; for the villages, they were the only thing that could protect the roads and supply wagons until patrols arrived.\n\n Sekibanki, Kagerou, and Wakasagihime didn't believe that an order could immediately bring equal protection. They demanded that the central government first prove that the most remote settlements would not again be relegated to behind railways, warehouses, and barrier construction sites.\n\n Even more disturbingly, it wasn't just the weapons that went missing. Communication components and spatial measurement equipment were also taken in batches from different warehouses. While the local authorities may only be concerned with self-preservation, others hidden in the chaos are assembling instruments capable of tracking gaps and boundary shifts."

KYO_make_youkai_warlord_surrender:0 "Whose army, whose victory?"
KYO_make_youkai_warlord_surrender_desc:0 "The Hundred Youkai Alliance won the war together, but never truly became a unified army.\n\n The Scarlet Devil Mansion Guards first obeyed Remilia, tengu guarded their own skies, kappa handed over their equipment to familiar units, the Oni tribe rallied based on old friendships, and temple and shrine militias trusted their respective leaders and settlements more. During the war, Yukari Yakumo's authority and a common enemy were enough to keep these legions moving in the same direction; after the war, central orders began to stop before the original banners.\n\n Unifying the designations, supplies, and command procedures could establish a truly centrally controlled barrier army, but it would force each faction to surrender its most important weaponry. Acknowledging the legions' independence could temporarily maintain cooperation, but it also meant that Gensokyo was still just an agreement between several armies.\n\n The real issue isn't whether the flag should be kept, but rather, when Yukari Yakumo can't personally intervene, who can turn all guns to the same command?"

KYO_all_bow_yukari:0 "The final general arbitration"
KYO_all_bow_yukari_desc:0 "Post-war controversies have been provisionally resolved, but new conflicts continue to arise once the orders are implemented.\n\n When will local rights take effect? Who will oversee the mobilization order? When will the armory be handed over? Which batch of food should be prioritized for delivery to the barrier construction site? And which section of road will each legion be responsible for guarding during the ceremony? Every detail is enough to keep the approved plans on paper.\n\n Remilia will not allow the military's authority to be reduced during implementation; Byakuren demands that all emergency measures have deadlines; Sekibanki points out that vague wording in central documents is being used by local officials to expand mobilization. No one intends to directly challenge Yukari Yakumo, but all hope her rulings will be closer to their own positions.\n\n This is not a demand for submission from all parties, but rather Yukari's final attempt to unify conflicting orders into a single arrangement. The direction has been decided; the remaining work must be completed before the ceremony begins."

KYO_future_start:0 "The Last Night of the Old Barrier"
KYO_future_start_desc:0 "All controversies that could be postponed have been temporarily suppressed, and all available resources and personnel have arrived at their respective positions.\n\n The runes of the old Great Hakurei Barrier will be extinguished one by one above Gensokyo, and the newly built torii gates and anchor points throughout Japan will be activated in the predetermined order. Yukari must remain fixed in the center of the altar, using the gap to connect the nodes of Hokkaido, Kyushu, Youkai Mountain, Netherworld, the Underworld, and the Human Village to the same boundary.\n\n Once the ritual begins, she cannot leave, nor can she stop midway. Any failure in the connection could cause the city, mountains, and the path between life and death to become misaligned simultaneously. Ran can complete all the calculations, Eirin can judge how long she can hold out, and other forces can also guard the paths around the altar; but in the end, only Yukari Yakumo can make the entire barrier take shape.\n\n On the Moon, the weapon that once killed Shrine Maiden has been recalibrated. All it lacks is a sufficiently precise and consistent landing point."









 



 KYO_lunar_interference_penalty:0 "Incorrect Coordinates in the Moonlight"
 KYO_lunar_interference_penalty_desc:0 "Lunar Capital's countermeasures have temporarily contaminated the intelligence and planning system; it will not block any legacy chapters."
 KYO_ownerless_barrier:0 "A Barrier Without a Master"
 KYO_ownerless_barrier_desc:0 "When a node is damaged, the surrounding area will be isolated, the route will be recalculated, and permissions and knowledge will not be lost with the guardian. No single attack can trigger a chain reaction that causes the entire barrier to collapse."



KYO_afterwar.1.t:0 "The victors did not disperse."
KYO_afterwar.1.d:0 "On the third day after Japan's surrender, the lights were still on at the Hundred Youkai Accord meeting.\n\n The battle maps on the walls were still up, but the arrows marking the front lines were now covered with markers for demobilized troops, refugee camps, lost warehouses, and breaches in the barrier. Issues that could be resolved with a military order yesterday had become conflicting petitions.\n\n Ran divided casualties, debts, provisions, and missing supplies into dozens of reports. Chen brought back a different message from the front lines: food shortages in the occupied territories, villages unwilling to surrender, and Japanese residents questioning whether they would be considered prisoners, subjects, or still able to defend their homes.\n\n Remilia demanded priority recognition of military merit and occupation rights. Byakuren countered that if victory only meant new conscripts entering the villages, who had the war truly saved? Before their voices could even rise, the surrounding delegates had already split into several groups.\n\n Yukari sat in the main seat, her tea long since cold.\n\n She didn't ask anyone for reconciliation, only closed her fan.\n\n “Until the takeover of Japan and the new barrier are completed, Hundred Youkai Accord will continue to operate.”\n\n No one was satisfied.\n\n No one left their seat either."
KYO_afterwar.1.a:0 "The common enemy has disappeared, but the common problems have only just begun."


KYO_afterwar.2.t:0 "What should the conquered be called?"
KYO_afterwar.2.d:0 "The first debate began with a blank space on an administrative document.\n\n Should Japanese people be registered as defeated subjects, protected residents, or new citizens with local rights? This designation would determine whether they could retain their land, organize self-government, receive rations, and even refuse conscription by the victors.\n\n Byakuren refused to let “protection” become a euphemism for permanent domination. She demanded recognition of the most basic rights and that local residents retain a voice in their own lives.\n\n Remilia raised her glass and calmly reminded her: “The land was taken by the army. If victory cannot bring rule, all that remains for the dead is a tombstone.” Seija still did not enter the meeting room.\n\n Sekibanki sat in the People's Committee seat, placed her opinions on the table, and added her own questions. “Subjects, residents, citizens.\n\n No matter how beautifully they're written, in the end, it all comes down to whether they can refuse you.”\n\n Eiki demanded that the titles correspond to clear rights, not merely be word games for convenient governance. Ran had prepared several sets of household registration and rationing plans, but couldn't decide for the people which order was legitimate.\n\n The debate continued from dawn till late at night, until Yukari finished writing on the last page of the document. Others could object, but no one was prepared to overturn her decision at this moment."
KYO_afterwar.2.a:0 "First, acknowledge the minimum rights of protected residents."
KYO_afterwar.2.b:0 "First establish the order of conquest, then discuss future rights."
KYO_afterwar.2.c:0 "Let local councils decide their own status."


KYO_afterwar.3.t:0 "The spoils weren't enough for everyone."
KYO_afterwar.3.d:0 "A list of ports, mines, railroads, and arsenals covered the long table.\n\n Remilia demanded distribution according to merit. Scarlet Devil Mansion, having endured frontal combat and urban sieges, deserved long-term supply and partial port management.\n\n Eirin opposed dismantling industrial facilities as legion rewards. Medical care, transportation, and mechanical maintenance must be planned by those capable of maintaining overall operation, not claimed by the victors individually.\n\n Raiko pushed several workers' petitions to the table. She asked bluntly: “They repaired the machines, they reconnected the railroads. Why should the flag decide who gets the factories?”\n\n Yuuka leaned against the window, a disturbing smile on her face. She didn't care what the system was called, only reminding everyone that food, land, and local production wouldn't automatically obey a meeting's vote. If anyone intends to treat farmland as a number to be moved at will, they'd better go to the flower field and explain it to them first.\n\n Ran proposed establishing a unified procurement and distribution system at the central level. This would prevent the various legions from occupying facilities first, but it was immediately questioned as consolidating the assets of the entire archipelago for the Yakumo family.\n\n Everyone finally looked at Yukari.\n\n Her decision wouldn't end the conflict; it would only determine whether the next conflict would occur at the meeting place, the factory, or in front of the armed police line."
KYO_afterwar.3.a:0 "The central government will establish unified allocation rules."
KYO_afterwar.3.b:0 "Military merits must be clearly rewarded."
KYO_afterwar.3.c:0 "Let actual producers participate in management."


KYO_afterwar.4.t:0 "Who will judge the victor?"
KYO_afterwar.4.d:0 "After the war, retaliation did not cease with the ceasefire order.\n\n The corridors were piled high with files of lynching, looting, disappearances, and wartime executions, including cases left behind by the Japanese army and names the Youkai Allied Forces were unwilling to mention.\n\n Eiki demanded that each case be tried individually. She would not accept that victory or defeat altered right and wrong, nor would she allow any military flag to obscure the dead.\n\n Byakuren supported an open investigation. She knew that trials would not heal the wounds, but she also knew that silence would allow hatred to continue to fester in the region.\n\n Remilia refused to allow the army to become the most convenient sacrifice after the arrival of peace. She acknowledged the cruelty done on the front lines, yet coldly retorted, “What right do those sitting in the rear have to judge bloodstained hands with a clean sheet of paper?”\n\n Yuyuko, reviewing the records of the dead, remained gentle. She offered no defense for either side, only pointing out the growing number of untreated souls. The living could delay, but the dead might not be willing to wait.\n\n Yukari, after listening to all opinions, prevented the debate from escalating into mutual recrimination. She only asked Ran to outline the potential consequences of a public trial, limited amnesty, and delayed processing.\n\n The final decision rested with her.\n\n No one believed it was a perfect verdict, yet no one dared to outright deny it."
KYO_afterwar.4.a:0 "Public trial, regardless of identity."
KYO_afterwar.4.b:0 "Limited amnesty, to prevent a cycle of retaliation."
KYO_afterwar.4.c:0 "Postponing the controversy until the barrier is completed."


KYO_afterwar.5.t:0 "Where is Gensokyo located now?"
KYO_afterwar.5.d:0 "Integrating Japan into the Youkai world is not as simple as stretching the old Great Hakurei Barrier outwards.\n\n The war has spread youkai power, vengeful spirits, Outside World technology, and damaged ley lines throughout the archipelago. If the old structure continues, the new barrier will eventually crack again from its weakest point.\n\n Ran proposed three solutions: a central node, distributed nodes, and wandering anchor points. The central node is easiest for Yukari to maintain, but it also makes the entire barrier dependent on the Yakumo family's core; distributed nodes allow different regions to share the pressure, but more forces will also come into contact with the barrier's structure.\n\n Kanako favors distributed construction. She believed that a barrier covering the archipelago couldn't just be a massive spell; it had to be like roads, water systems, and electricity, allowing for maintenance and repair in each region.\n\n Megumu Iizunamaru, however, demanded confirmation of data access. Whoever controlled the node data could see changes in the military, population, and local resources. She wouldn't allow Youkai Mountain to hand over all observations without any guarantees.\n\n Satori, after listening for a short while, pointed out that neither side was truly worried about the technology, but rather who could close off the other's roads in the future.\n\n Yukari didn't deny it.\n\n What she needed wasn't a barrier without political controversy. Such a thing never existed. What she needed was a barrier that wouldn't immediately collapse even when the parties distrusted each other."
KYO_afterwar.5.a:0 "Unifying all boundaries with a central node."
KYO_afterwar.5.b:0 "Let the scattered nodes share the responsibility of the barrier."
KYO_afterwar.5.c:0 "Set up wandering anchor points."


KYO_afterwar.6.t:0 "How many hands will the new barrier require?"
KYO_afterwar.6.d:0 "The initial engineering estimates only considered the manpower and resources that Gensokyo could provide. Now that the border has suddenly expanded to the entirety of Japan, the original figures seem almost laughable.\n\n Quarrying, logging, road paving, transporting talisman materials, and digging anchor point foundations—each of these requires tens of thousands of laborers.\n\n Kanako advocates requisitioning the still-functioning Japanese administrative system. Local government offices, demobilized troops, and the unemployed can be quickly organized into engineering teams; otherwise, the new barrier will forever remain on paper.\n\n Byakuren immediately objected. She wasn't denying the urgency of the project, but rather refusing to allow the defeated to be treated as manpower to be used at will.\n\n Suika had no patience for complicated regulations. She believed that those who could work should be put to work, and those lacking food should be given food first. The real problem wasn't voluntariness or orders, but that those above always wanted those below to bear the heaviest burdens.\n\n Sekibanki raised a more direct question on behalf of the local representatives: “You say there's a deadline for conscription. Who guarantees that the tools will really be put down when the deadline arrives?”\n\n Eirin then presented a series of figures on desertion rate, accident rate, completion time, and food consumption. She didn't comment on which solution was more noble, only pointing out that paid recruitment would slow down the project, while forced conscription would lead to a continuous increase in sabotage and resistance.\n\n Yukari reviewed all the estimates.\n\n She doesn't have enough time to wait for everyone to volunteer, nor enough resources to properly accommodate all goodwill. Now, the only decision is who will bear the heaviest burden."
KYO_afterwar.6.a:0 "Issued a time-limited labor recruitment notice."
KYO_afterwar.6.b:0 "Reduce other reconstruction quotas and adopt paid recruitment instead."


KYO_afterwar.7.t:0 "Rival Bids on Youkai Mountain"
KYO_afterwar.7.d:0 "Before the barrier project even officially started, the kappa and yamawaro were already fiercely competing for the first batch of bids.\n\n Nitori Kawashiro proposed precision instruments, standardized parts, and a unified maintenance system. Takane Yamashiro argued that the yamawaro were more familiar with the mountains, strata, and local transportation, and could complete the project using local materials even if the factory was shut down.\n\n The dispute quickly moved beyond technical issues. Both sides accused each other of stealing designs, bribing surveyors, monopolizing materials, and one even erected their own survey flag overnight at the competitor's reserved construction site.\n\n Kanako supported unified specifications. She needed a system that could be maintained jointly by Moriya Shrine, kappa workshops, and local shrines, not hundreds of structures that only the construction workers themselves could understand.\n\n Megumu Iizunamaru, however, favored Yamawaro. If the local construction network relied entirely on kappa factories, areas outside Youkai Mountain would forever be dependent on a few equipment suppliers.\n\n Ran reviewed hundreds of quotations and found that both proposals deliberately underestimated their own shortcomings.\n\n Yukari had no interest in judging who was more honest. She only needed to choose a plan that would allow construction to continue while the argument was still ongoing."
KYO_afterwar.7.a:0 "Adopt the kappa's standardized plan."
KYO_afterwar.7.b:0 "Award the project to the yamawaro."


KYO_afterwar.8.t:0 "New Torii Gates Stand Across the Land"
KYO_afterwar.8.d:0 "From Hokkaido to Kyushu, brand new torii gates stand amidst ruins, mountain passes, railway crossings, and along coastlines.\n\n They are not decorations, but the exposed skeletons of the new barrier in reality. Runes are embedded in the bases, and the ley lines have been rerouted, each leading to coordinates that Ran has repeatedly calibrated.\n\n Chen travels around with local survey teams. Her reports include food brought by residents, children's drawings of youkai, as well as damaged bases and the names of missing workers.\n\n Kanako demands that the project start on schedule. The project cannot wait until all nodes are perfect; the longer it is delayed, the more the locals will doubt whether the new government is truly capable of completing it.\n\n Eirin pointed out that the deviation of a few anchor points had exceeded the original estimate. Synchronous startup could shorten the time before the old and new barriers simultaneously failed, but it might also introduce undiscovered errors into the overall system at once.\n\n Eirin demanded a complete record of responsibility. Whether starting immediately or retesting later, the accident should not be solely blamed on the construction workers who had no say.\n\n Yuyuko noticed that the flow of spirits near some of the torii gates was changing. She didn't demand a stop, only reminding Yukari that some errors wouldn't immediately appear on the instruments.\n\n Yukari couldn't remember when she had her last complete rest.\n\n The group was still arguing, but only she could decide the startup time."
KYO_afterwar.8.a:0 "Start all nodes synchronously at the originally scheduled time."
KYO_afterwar.8.b:0 "The ceremony was postponed, and each anchor point was re-inspected in each district."


KYO_afterwar.9.t:0 "The demobilization figures didn't match."
KYO_afterwar.9.d:0 "The inventory numbers in the armory never matched.\n\n Crates of rifles and ammunition disappeared on the way back; communication parts were dismantled and sent to different villages and towns; several sets of equipment used for wartime spatial measurement were also missing.\n\n Sekibanki didn't believe that the central government would equally protect the lower classes after taking away their weapons. She coldly pointed out that during the war, no one guarded the gates for the grassroots, but now the higher-ups suddenly remembered that every gun had a serial number.\n\n Raiko admitted that some local mutual aid networks had hidden weapons. Those villages didn't intend to attack anyone; they just didn't want to wait empty-handed before the patrols arrived.\n\n Megumu Iizunamaru demanded a news blackout to prevent more areas from taking advantage of the chaos to move equipment. She also pointed out that the proportion of missing supplies was too uniform, unlike simple local hoarding.\n\n Ran placed another list on the table. Someone had deliberately collected a complete set of communication and spatial measurement equipment from different warehouses.\n\n Local armed forces might have hidden guns.\n\n The things others were assembling were clearly not for guarding the village entrance."
KYO_afterwar.9.a:0 "A complete confiscation of local armed forces."
KYO_afterwar.9.b:0 "Acknowledge local self-defense under supervision."
KYO_afterwar.9.c:0 "Postpone arrests; investigate surveying equipment first."


KYO_afterwar.10.t:0 "Who will keep watch over the village?"
KYO_afterwar.10.d:0 "When the disarmament order arrived in the village, the patrol promised by the central government was still dozens of miles away.\n\n Kagerou placed the village's only rifle on the table, asking only who would guard the road to the village that night after it was handed over.\n\n Wakasagihime wasn't concerned with who held military power, but rather whether the supply wagons would arrive safely, and whether the children would have to hide in the cellar amidst gunfire. She was willing to register, but unwilling to let the village lose its ability to protect itself before the central government fulfilled its promise.\n\n Sekibanki read the orders line by line, then asked the question no one wanted to answer: “If the patrols protect the railway, warehouses, and fortification sites first, where do we rank in the order?”\n\n Raiko proposed that the local mutual aid network supervise the self-defense forces to prevent weapons from falling into the hands of a single leader. Chen demanded that the central government immediately send personnel, even if it meant temporarily withdrawing some of the fortification site guards, to prevent the local areas from receiving only written guarantees.\n\n The meeting discussed unified organization, weapons distribution, and long-term risks.\n\n The village just wanted to know who would stand guard at the crossroads after dark."
KYO_afterwar.10.a:0 "Withdraw the fortification site guards to fulfill the central government's protection obligations first."
KYO_afterwar.10.b:0 "Register the weapons and acknowledge the village self-defense forces."


KYO_afterwar.11.t:0 "The Whereabouts of the Missing Equipment"
KYO_afterwar.11.d:0 "The investigation team eventually found the missing parts near several barrier anchor points.\n\n The communication equipment and space measurement devices were reassembled into a batch of unregistered instruments, buried underground or hidden in abandoned buildings, continuously recording the spatial disturbances left after each gap was opened.\n\n Ran overlaid the observation data and discovered that the instruments were not trying to understand the new barrier, but were searching for a recurring person—Yukari Yakumo.\n\n Eirin recognized the measurement method after only reading a few pages of records. It was not Japanese technology, but a simplified version of the Moon observation method. Ground instruments were only responsible for collecting deviations; the actual calculations were done further away.\n\n Satori interrogated several people responsible for moving the parts. She found no complete plan, only the same deliberately left gaps: the collaborators knew they were working for a certain force, but were never allowed to know the full picture of that force.\n\n Megumu Iizunamaru demanded immediate control of all communication stations. If transmission continued, the enemy might have already obtained enough data.\n\n Ran marked the transmission direction on the map.\n\n That wasn't Japan, nor Gensokyo.\n\n It was the Moon."
KYO_afterwar.11.a:0 "The outline of Lunar Capital finally appeared in the report."


KYO_afterwar.12.t:0 "Whose army, whose commander?"
KYO_afterwar.12.d:0 "All legions claimed to be willing to protect the new barrier, but not one was willing to permanently abandon its flag, armory, and supply lines.\n\n Remilia first refused to hand over the Scarlet Devil Mansion Guard to a central command that had not yet proven its functionality. She tapped her fingertips on the table, her tone calmly almost rude: “Without the power of the Scarlet Devil Mansion, what right does the New Order have to demand its obedience?”\n\n Suika disliked standardized numbering and layers of approval. The Oni were willing to fight, and willing to fight side-by-side when a real enemy appeared, but they wouldn't forget who they had drunk and bled with just because of a form.\n\n Yuyuko didn't directly oppose a unified army. She only pointed out that Hakugyokurou could accept joint command, but the undead and the Netherworld garrison couldn't be completely integrated into the ranks of the living.\n\n Ran proposed standardized supply protocols, mobilization procedures, and minimum joint command authority, allowing each legion to retain its symbolism and some internal structures.\n\n Yukari, after hearing all the conditions, asked only one question: “When I'm not present, who can make all the guns point in the same direction?”\n\n The room fell silent.\n\n Because everyone knew that the real answer was still her."
KYO_afterwar.12.a:0 "Establish a unified barrier army."
KYO_afterwar.12.b:0 "Recognizes the independent command of each legion."
KYO_afterwar.12.c:0 "Jointly managed by the Military Affairs Committee."


KYO_afterwar.13.t:0 "An unsigned order"
KYO_afterwar.13.d:0 "After a riot at a barrier construction site, the Central Government issued an emergency order requiring neighboring legions to block roads and protect technicians.\n\n The order bore the genuine seals of the Yakumo Central Government, the Military Affairs Committee, and the local command, yet no unit acted immediately upon delivery.\n\n Local officers awaited confirmation from their leaders; the Military Affairs Committee requested additional signatures, while the Central Government insisted that emergency orders should not require further approval. By the time the first unit arrived, the equipment had been burned, and the crowd had long since dispersed.\n\n Remilia believed the problem was quite simple: an order is not an order if it cannot punish those who refuse.\n\n Megumu Iizunamaru opposes handing over all temporary troop deployment authority to the central government. By the time intelligence reaches the Yakumo family, is verified, and sent back to the local authorities, the best opportunity for action may have already passed.\n\n Raiko points out that what truly halts the troops is not procedure, but the fear that if each side obeys first, others will seize the advantage.\n\n Ran meticulously checks the orders and finds no errors. She can only propose two solutions: establish the central government's emergency deployment orders as having supreme authority, or authorize local garrisons to protect their own territories.\n\n When Yukari arrives, there are no enemies left to arrest, only a charred construction site.\n\n She can no longer allow every order to require her personal verification."
KYO_afterwar.13.a:0 "Let the central government's emergency deployment orders supersede the banners of all sides."
KYO_afterwar.13.b:0 "Authorize local garrisons to protect their own jurisdictions."


KYO_afterwar.14.t:0 "The keys to the armory"
KYO_afterwar.14.d:0 "True military power doesn't reside solely in meeting seats, but in the keys to the armory, railway schedules, and the handover documents for fuel rations and supply depots.\n\n Yakumo Central requires centralized storage to prevent local legions from expanding their arsenals unauthorized. The Military Affairs Committee advocates for joint signatures from multiple parties to prevent central monopoly. Local commanders refuse to hand over warehouses they built during the war.\n\n Remilia openly states that anyone wanting the keys to Scarlet Devil Mansion can come to the door and ask for them. Her silence makes the statement sound more like a real threat.\n\n Yuuka glances at the storage plan and asks if the army also plans to requisition local granaries. If weapons and food are centralized, the local forces will only have the right to obey.\n\n Byakuren worries that unified confiscation could be a prelude to future purges. She doesn't oppose oversight, but demands that no single party unilaterally decide who gets weapons.\n\n Eiki points out that joint custody without clear responsibility will only lead to everyone shifting blame after each theft.\n\n Yukari has three storage boxes in front of her.\n\n Each arrangement claims to prevent civil war, but could also be the first preparation for it."
KYO_afterwar.14.a:0 "Entrusted to the Central General Affairs Department for unified custody."
KYO_afterwar.14.b:0 "Entrusted jointly by the Military Affairs Committee."
KYO_afterwar.14.c:0 "Preserve the existing warehouses of local legions."


KYO_afterwar.15.t:0 "Yukari Yakumo's General Arbitration"
KYO_afterwar.15.d:0 "The date for the new barrier ceremony has been set, and the Hundred Youkai Accord has made choices regarding the most important postwar issues.\n\n Provisional regulations have been established for the status of Japanese residents, the allocation of industry and armaments has been written into orders, and solutions have been developed for local armed forces, engineering requisitions, corps deployment, and anchorage authority.\n\n What truly remains are the details that arise after these plans are implemented.\n\n Ran lists the matters still pending confirmation: from what date will local rights take effect, who will oversee the requisition order, when should the armory be handed over, will the barrier construction sites have priority access to food and railways, and which section of defense each corps will be responsible for during the ceremony.\n\n Remilia demands that the authority already promised to the military not be reduced during implementation. Byakuren demanded that all temporary measures have clear deadlines, not just statements like “to be discussed again after the situation stabilizes.”\n\n Sekibanki raised questions from local organizations regarding existing decisions. She didn't demand the overturning of any results, only pointing out several gaps in the central orders that allowed local officials to interpret limited requisition as unlimited obedience.\n\n Eiki demanded that each order clearly specify the attribution of responsibility. If projects were delayed, food went missing, or residents were abused, the person who actually made the decision must be identified, not the weakest party ultimately bearing the consequences.\n\n Yukari sat at the head of the table, reviewing the revised documents from each side. She didn't reopen the already concluded votes, nor did she allow anyone to overturn previous decisions based on details. She simply defined the scope, added deadlines, and rearranged conflicting orders into an executable arrangement. “The direction has been decided.” Yukari closed her fan. “Now, finish it.”\n\n The crowd still harbored dissatisfaction and continued to argue even after leaving the meeting, but no one denied her decision.\n\n Until the new barrier was completed, Yukari Yakumo remained the only one who could ensure all established plans operated simultaneously."
KYO_afterwar.15.a:0 "Yukari directly defined the authority and deadlines."
KYO_afterwar.15.b:0 "A written guarantee was added before being handed over to all parties for execution."
KYO_afterwar.15.c:0 "The existing decision was maintained; no new conditions were added."



KYO_afterwar.16.t:0 "Everything had to be in place before the ceremony."
KYO_afterwar.16.d:0 "After the final arbitration, all orders finally had clear authority, deadlines, and responsible parties. However, between the ruling at the meeting and its actual implementation, a large number of unfinished handovers still exist.\n\n Some armories have been inventoried, but the keys cannot be transferred due to discrepancies in the records of the old and new managers; local construction teams are waiting for talisman materials, but the train carrying them is stopped at a platform that hasn't been reassigned; several legions responsible for the ceremony's security are even assigned to the same road, none willing to give way first.\n\n These problems are not open acts of insubordination. Each side claims to be complying with the ruling, but everyone prioritizes completing what is most advantageous to themselves, leaving the trouble for the next stage.\n\n Suika, along with the Oni clan, moves a large quantity of military supplies blocking the railway and warehouse. She has no patience for new transport documents, demanding that the person in charge clarify on the spot where the goods should be delivered.\n\n Yuuka then redefines the transport routes around the flower field. Engineering teams could pass, and the military could be stationed there, but no one was allowed to trample on farmland or turn temporary requisition into permanent occupation. Her regulations were not written into the central order, but no one intended to test them a second time.\n\n Satori reclassified the urgent reports sent from various places. Issues that truly jeopardized the ceremony were placed at the forefront, while requests for more budget, equipment, and jurisdiction were returned to their original departments. Many seemingly urgent reports only now revealed their true purpose.\n\n Yukari had not left the meeting place for two days. After reviewing the last batch of progress schedules, she pushed the documents in front of Ran.\n\n “Don't discuss it again for them.”\n\n Ran nodded and arranged all the work in reverse order according to the ceremony time: confirm the handover of the armory, redistribute the trains, stagger the marching time of the legions, replenish the anchor point supplies, and require each person in charge to leave a traceable record after completion.\n\n She can't get everyone to trust each other, nor does she need to.\n\n Before the new barrier begins, as long as every key, every batch of supplies, and every unit arrives at its proper place on time."
KYO_afterwar.16.a:0 "Ran, bringing all preparations to a single moment."


KYO_afterwar.17.t:0 "The Last Night of the Old Barrier"
KYO_afterwar.17.d:0 "The runes of the old Great Hakurei Barrier are extinguishing one by one in the night sky of Gensokyo.\n\n It once kept youkai, god, the dead, and everything no longer believed in the Outside World outside of common sense. Now, the border that has protected Gensokyo for hundreds of years can no longer bear the weight left by war, nor can it cover the entire Japanese archipelago, reshaped by youkai power, artillery fire, and the dead.\n\n From the snowfields of Hokkaido to the coast of Kyushu, newly built torii gates and anchorages light up in sequence. Between mountain peaks, cities, railways, temples, and ruins, a huge, yet-to-be-connected silhouette stretches across the night. Countless residents stop what they are doing and look up at the light that has never appeared in the old world.\n\n Ran submitted the final calibration results. Over 3, 700 nodes had responded, twelve deviations were still within acceptable limits, and all guards, engineering teams, and emergency forces had arrived at their designated positions. Her voice was steady, but the report in her hand was gripped so tightly that it showed fine wrinkles.\n\n This was the last step she could take for Yukari.\n\n Eirin personally checked Yukari's condition. Maintaining the gap, dealing with barrier deviations, and presiding over post-war arbitration had brought her youkai power to its limit. Eirin listed seven conditions that required the ritual to be stopped, and then fell silent after reading them. She knew better than anyone that as long as Yukari could stand, she would not acknowledge that any of the conditions had been met.\n\n Yuyuko stood beside the Netherworld node, watching the spirits that gathered during the transition between the old and new barriers. That night, even she couldn't mask the heaviness with jokes, only instructing Youmu to grip her twin swords tightly, guarding the last remaining path between the living and the dead.\n\n Remilia's guards blocked the skies, Tengu controlled all high-altitude routes, Moriya's god maintained the ley lines, and Myouren Temple deployed rescue teams to every evacuation route. Sekibanki and local liaisons guarded the outermost settlements, confirming that those unable to enter the venue were not excluded from the New World.\n\n Chen repeatedly checked the evacuation routes around the altar until Yukari called her.\n\n “Chen.”\n\n She immediately turned around.\n\n “Don't go near the altar.”\n\n Chen opened her mouth, as if trying to refuse with a simple reason. Finally, she clutched the map tighter and whispered, “... I'll wait for you here.”\n\n All the forces of Hundred Youkai Accord stood guard around the ritual site.\n\n They still distrusted each other, still remembered the arguments at the meeting, and were still prepared to continue arguing for land, armies, and power the next day.\n\n But as Yukari Yakumo walked alone toward the altar, no one spoke again.\n\n For the first time in months, she no longer dealt with petitions, military orders, provisions, and disputes. At this moment, the survival of everyone, the ambitions of everyone, and all the unfinished futures rested on her shoulders alone.\n\n Standing in the center of the darkness left after the old barrier had extinguished, Yukari slowly opened her fan.\n\n Layers of gaps unfolded behind her, spanning mountains, oceans, life and death, and reality. The entire archipelago's boundaries converged on her at the same moment, like a world yet to be formed, awaiting its first command.\n\n “Begin.”"
KYO_afterwar.17.a:0 "Gensokyo will be reborn tonight."


KYO_afterwar.18.t:0 "Light Falling from the Moon"
KYO_afterwar.18.d:0 "At first, there was no alarm.\n\n No aircraft crossed the coast, no spell touched the outer barrier, and no enemy appeared within sight of a single watchtower.\n\n Only a white line appeared in the night sky.\n\n It was finer than starlight and straighter than a blade, stretching from the Moon to the air above the altar—as though some distant, indifferent will were fixing an inviolable coordinate between heaven and Earth.\n\n In the next instant, the line burst open.\n\n Moonlight crossed cloud, sky, barrier, and every ground defence without traversing any distance that could be intercepted. It simply appeared above the ritual ground. Night itself was compressed into pure white along its path. Hundreds of anchors shrieked at once, and the newly joined boundaries began to bend towards the same point.\n\n At last, Yukari understood.\n\n When the Hakurei shrine maiden was murdered, no enemy had crossed the barrier and no weapon had left a trace, yet the ground around the shrine had seemed to be erased from within. The attack had not crossed a boundary. For one instant, the Lunar Capital had treated a point on the Moon and a coordinate on Earth as the same place.\n\n The enemy had never entered Gensokyo.\n\n It had merely caused death to occur directly where its target stood.\n\n Yukari could not move.\n\n Her youkai power was already connected to the entire new barrier. If she left the altar, its unfinished nodes would come apart simultaneously from Hokkaido to Kyushu, casting tens of millions of humans, youkai, and spirits into boundaries that contradicted one another.\n\n Ran saw the white light and, in an instant, connected the missing instruments, abnormal transmission, and wandering coordinates. For the first time, her composure failed before the calculation was complete.\n\n “Lady Yukari, get away from there!”\n\n At the same moment, Eirin recognised the principle behind the Princess Light Cannon. She issued no order to intercept it. No force launched from the ground could stop an attack already taking place inside the target coordinate.\n\n Satori heard the fear of everyone around the altar rise at once. Soldiers of the Scarlet Devil Mansion tightened their grip on their weapons; the monks of Myouren Temple began to pray; and the tengu searched the sky for an enemy force that was not there.\n\n Remilia spread her wings and ordered her guard to assemble at the altar. Byakuren rushed into the rescue line, commanding everyone to prepare for the barrier's collapse. Kanako drove an onbashira into the earth to relieve the trembling nodes. Yuyuko gazed at the spirits, who had suddenly fallen silent, and every trace of her smile disappeared.\n\n Chen tore free of the guards and ran towards the altar.\n\n Yukari did not turn.\n\n She watched the white light that could erase her from the world and drew the last set of nodes into the gap.\n\n The Lunar Capital had chosen the coordinate it believed to be true.\n\n Before the light arrived, all Gensokyo was left with one question.\n\n Was that coordinate real?"
KYO_afterwar.18.a:0 "The moon struck only one lie."
KYO_afterwar.18.b:0 "The white light landed precisely in the center of the altar."


KYO_afterwar.19.t:0 "The Moon hit a non-existent location"
 KYO_afterwar.19.d:0 "As the new barrier entered its final engagement, Yukari Yakumo stood at the center of the altar, using gaps to connect anchor points across Japan to the same structure. She could not leave, nor could she interrupt; any hesitation could cause the still-unstable boundary to collapse from within.\n\n Almost simultaneously, the Moon's central observation hub went unresponsive. Renko had destroyed the satellite control and positioning system, but it was too late to cancel the authorized launch of the Princess Light Cannon. After losing the hub, the independent backup unit automatically adopted the last set of coordinates triple-verified by the surface, orbit, and the Moon.\n\n That wasn't the altar. The three controlled relay stations replayed Yukari Yakumo's past gap-opening records, and erroneous star maps performed orbital calibration for false signals. Lunar Capital finally concluded that Yukari was standing on a long-abandoned mountain anchor point outside the ritual site. There was no Yukari Yakumo there, only Renko piecing together the final answer for Lunar Capital.\n\n Lunar Capital believed it. A white light veered off the altar, piercing the non-existent target. The mountain was bathed in a ghastly white light, the rock strata cracked, and a belated roar swept across the archipelago. The impact still caused the torii gates to tilt, the nodes to extinguish, and the coastline and the Netherworld passage to tremble.\n\n Kanako, Suwako, and Hakugyokurou each managed to control the out-of-control areas, while Eirin mobilized the medical team. Yukari still didn't loosen her grip. Blood dripped from her wrist into the runes. Ran recalculated the broken nodes outside the altar.\n\n Chen tried several times to approach, but was repelled by the surging youkai power. The snow of Hokkaido, the lights of Tokyo, the forests of Gensokyo, the cherry blossoms of Hakugyokurou, and the flames of Former Hell were all incorporated into the same boundary.\n\n The final gap closed, and anew barrier rose from the entire archipelago, re-fixing the fantasy within the world. Yukari Yakumo survived. The attack by Lunar Capital was exposed to all forces.\n\n Remilia looked up at the moon and said coldly, “They fired on my territory.”\n\n Byakuren did not correct her, only replying, “They fired on everyone.” Megumu Iizunamaru immediately investigated the surface observers, and Eirin took over the remaining records of the Moon.\n\n No one called the attack accidental anymore. As Yukari stepped down from the altar, Ran reached out to support her. Chen only broke down in tears after confirming that Yukari still had a body temperature.\n\n Yukari did not accept the cheers, but only looked up at the still-white moon.\n\n “Sealing off Japan is not enough.” In the unseen distance, Hecatia closed the last path. Renko left no name, only a star map proving that Yukari Yakumo was still alive."
 KYO_afterwar.19.a:0 "Lunar Capital missed its shot, exposing itself in the process."


KYO_afterwar.20.t:0 "The world has lost its center."
KYO_afterwar.20.d:0 "The white light did not deviate.\n\n The Princess Light Cannon appeared directly within the ritual coordinates. The altar, talismans, and the unfolding gaps were simultaneously swallowed by pure white; all color, sound, and distance vanished in an instant. Moments later, a roar erupted from the ground, toppling the torii gate and the observation tower, causing all the newly formed nodes of the entire archipelago to tremble.\n\n Ran was still calculating. She rearranged the conflicting values, trying to find the possibility that Yukari still existed; but every result pointed to the same blank space.\n\n Chen rushed into the dust after the white light dissipated, digging through the broken stone slabs and talisman materials with her bare hands, calling out Yukari's name again and again.\n\n There was no response.\n\n Before the light arrived, Yukari already knew she couldn't leave. She didn't sever the ritual, nor did she use her last strength to protect herself. Instead, she dismantled her control over the boundary, sending it along the unlinked nodes throughout the archipelago.\n\n The snowfields of Hokkaido, the coast of Kyushu, Youkai Mountain, Netherworld, the underground, the villages, and the Misty Lake lit up in sequence. She infused her power into every torii gate, every anchor point, and every formed boundary.\n\n As her figure was swallowed by the white light, the new barrier completed its final joining.\n\n It did not collapse.\n\n A vast and silent boundary rose from the Japanese coast, crossing cities, mountains, and Gensokyo. It still blocks the Outside World, maintains Youkai's existence, and allows the living and the dead to remain in their respective places.\n\n But no one can now make the entire barrier obey a single will.\n\n Ran stands in the center of the altar ruins. The power left by Yukari still flows between the nodes, and the barrier still responds to her Shikigami incantation. She can maintain it, correct it, and continue to carry out Yukari's last orders.\n\n But she cannot become Yukari Yakumo.\n\n Chen kneels in the dust, her hands tightly gripping a fan rib that has lost its warmth.\n\n The new barrier survives.\n\n Its creator is not.\n\n And that very spot, where all orders, disputes, and ambitions had finally come to an end, was now completely empty that same night."
KYO_afterwar.20.a:0 "The barrier was still in operation, but Gensokyo had lost its center."

KYO_afterwar.21.t:0 "There was no next meeting."
KYO_afterwar.21.d:0 "The dust on the altar hadn't yet settled when the first orders were already being issued.\n\n Remilia demanded that the Military Affairs Committee take over roads, communication stations, and armories. Lunar Capital had already opened fire on Gensokyo; she believed that only those who controlled the army were qualified to maintain the entire country after Yukari's death.\n\n “The central government cannot be left empty.” Standing before the guards of Scarlet Devil Mansion, her tone was calm and decisive. “Since no one can succeed her, then someone capable of ruling will take over.”\n\n Byakuren ordered all legions to remain in place, to treat the wounded and maintain rations, and for the Hundred Youkai Accord to elect temporary administrators. She refused to let an attack become a reason for permanent centralization.\n\n “What she left behind with her life was a barrier that allowed everyone to live,” Byakuren said. “It's not a throne that anyone can sit on just because they seize it first.”\n\n The third order was issued without going through any committee.\n\n Seija Kijin sent messages to workshops, villages, local militias, and the liaison points of the People's Committee, demanding that all regions seize supplies, control roads, and refuse to recognize any force claiming to inherit Yukari Yakumo's power.\n\n “The Grand Arbiter is dead,” she said, planting the upside-down flag in the ground. “This is not about choosing the next master for the old order. This is the opportunity for the grassroots to seize Gensokyo.”\n\n Before the Scarlet Devil Mansion was taken over and the Myouren Temple's council was restored, Seija aimed to unite grassroots organizations and local militias into a force strong enough to seize control of the central government.\n\n She didn't intend to let the revolution stop again at the hands of those in power. Kanako demanded control over the maintenance of the new barrier, while Megumu Iizunamaru cut off unauthorized communications. Eiki tried to maintain her existing authority but could no longer find anyone to force all parties to accept arbitration.\n\n The Hundred Youkai Accord was not officially dissolved. The meeting place remained sealed, and the seats and documents were left in their original locations, but no one could decide when the next meeting would be held.\n\n The flag of Scarlet Devil Mansion moved towards the armory, the bells of Myouren Temple summoned rescue teams, and Seija's messengers rushed to workshops and villages.\n\n Each side claimed to be protecting the world left behind by Yukari. Each side also demanded that world submit to their direction.\n\n Lunar Capital fired only one shot.\n\n It didn't destroy the barrier, but it meant that all those vying for dominance no longer had to pass through Yukari Yakumo's seat."
KYO_afterwar.21.a:0 "All the achievements await a new master."


