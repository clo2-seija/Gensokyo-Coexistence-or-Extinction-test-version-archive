KYO_afterwar.23.t:0 "Four Nations with No Shared Future"
KYO_afterwar.23.d:0 "On the last night before the outbreak of civil war, the entire archipelago was eerily quiet.\n\n The Yakumo Emergency Government, Scarlet Devil Mansion, Myouren Temple, and the Gekokujou Front had completed the takeover of their respective territories. Roads were blocked by barricades, bridges were buried with explosives, and only trains bearing their own markings were allowed to pass through the railways. Warehouses, workshops, temples, and military camps that once belonged to the Hundred Youkai Accord now flew different flags.\n\n Ran still sent a final ceasefire proposal to the other three parties. The document did not discuss who should rule Gensokyo, but only required each legion to retreat for one day to allow the barrier maintenance team to complete the node handover. Scarlet Devil Mansion remained unopened. Myouren Temple responded that it could not accept the Yakumo family continuing to act as the central authority.\n\n The Gekokujou Front posted the documents on the wall as evidence that the old order still wanted to command everyone. Remilia had donned her wartime uniform. The troops of Scarlet Devil Mansion lined up in the darkness; she no longer concealed her demand for dominance.\n\n For her, Gensokyo needed not another round of debate, but a master who could make all opponents bow down. Byakuren stood before the gates of Myouren Temple, listening to the distant military vehicles passing by. She still believed in coexistence, but no longer believed that the other three parties would allow her to achieve it peacefully.\n\n The temple bells did not summon believers, but announced to every garrison: from this night onward, protecting the weak also meant repelling the invaders. Seija's flags were everywhere—in workshops, villages, and old war zones. She refused to call this war a succession struggle. To her, the central authority left by Yukari Yakumo was dead, and anyone attempting to rebuild it was an enemy the revolution had to overcome.\n\n She ordered her supporters to seize food supplies and remove road signs, preparing to overthrow the last foothold of the powerful at dawn. The Yakumo Emergency Government closed the central meeting hall. Ran did not declare herself Yukari's successor, nor did she acknowledge anyone else's rule. She only ordered troops to guard the boundary nodes, the central archives, and the roads still under the Yakumo family's control.\n\n As long as the new boundary was operational, she could not allow either side to tear it apart with war.\n\n Radio stations from all four sides broadcast peace, order, redemption, and revolution repeatedly throughout the night.\n\n No one believed the words of others anymore. The soldiers on the border saw it more clearly than those in the meeting hall. The flags on the other side were no longer those of allies who had fought side-by-side, but enemies to be aimed at tomorrow.\n\n Everyone knew what the first shot would bring, and everyone believed that retreat would only lead to the destruction of their own world. On the more distant Moon, observers recorded the ever-increasing military movements across the archipelago.\n\n Lunar Capital needed not fire its beam cannons again, nor send a single soldier.\n\n Gensokyo was doing the rest for them. Sages, nobles, saints, and revolutionaries would tear each other apart; Youkai would burn down Youkai's cities, God would destroy God's faith, and everything preserved by the new barrier yesterday might be reduced to nothingness in tomorrow's gunfire.\n\n Lunarians were happy to wait.\n\n It would be best if all four sides killed each other. It would be best if there were no victors. It would be best if, when the war ended, no force in the world could prove that Gensokyo had ever existed.\n\n The night remained calm. The last group of envoys left the border, and the last light in the conference room went out.\n\n The four nations no longer shared a common future.\n\n At dawn, they could only choose their own survival through the death of each other."
KYO_afterwar.23.a:0 "Four battle orders were simultaneously sent to the front lines."





kyo_postwar.11.t:0 "Four voices, four futures"
kyo_postwar.11.d:0 "On the same night, four voices echoed across the archipelago via different radio stations, temple bells, and local communication networks.\n\n Ran Yakumo's voice rang out first, calm as if she were still reporting beside Yukari.\n\n “The barrier's completion status is maintained. Administration, supplies, and node adjustments are all according to established procedures. The world left behind by Lady Yukari Yakumo doesn't need a new master; it needs someone to ensure it still exists tomorrow. Grief aside, arguments aside.\n\n Everyone return to your positions and complete the work she entrusted to you.” The broadcast from Scarlet Devil Mansion then swept through the night.\n\n Remilia made no attempt to hide her smile. “You've seen enough of endless meetings, and you've seen what a country without a ruler becomes. Gensokyo needs no more cowardly compromises. Kneel, obey, and watch me trample the moon, traitors, and chaos under my feet. I don't promise equality—I only promise victory.”\n\n M The bells of the Myouren Temple echoed through the internment camps and post-war ruins. Byakuren stood before the temple gates, facing those who had yet to be buried and returned to their home.\n\n “We cannot commemorate Yukari Yakumo's sacrifice with another oppression. Humans, youkai, gods, and the dead have all shed blood for this world; no one is born to obey. Peace will not come on its own, nor can we avoid battle through prayer. If mercy must be armored, then today, I will lead the way.” Finally, Seija's voice came through.\n\n There was no solemn meeting place, only the clanging of metal in the workshops, the flickering firelight in the village, and the gradually gathering crowd. “Did you hear that?\n\n One demands your obedience to the old order, one demands your kneeling before the throne, and the third demands you believe once more in the goodwill of those in high positions.”\n\n “Yukari is dead. The vacancy she left behind should not be given to someone who claims to understand you better. This time, don't wait, don't petition, and don't place the future on someone else's table. Turn the flags upside down, kick open the doors—Gensokyo should be reclaimed by those who have always been trampled beneath it.”\n\n Four voices spoke of the world left behind by Yukari Yakumo.\n\n But that world could only move in one direction."

kyo_postwar.11.a:0 "§W“Turn the flag upside down—follow Seija Kijin.”§!"
kyo_postwar.11.b:0 "§3“Complete the final work—follow Ran Yakumo.”§!"
kyo_postwar.11.c:0 "§0“Let compassion armor you as you go—following Byakuren Hijiri.”§!"
kyo_postwar.11.e:0 "§R“Kneel down, and witness victory—follow Remilia.”§!"

kyo_postwar.12.t:0 "The upside-down flag rises"
kyo_postwar.12.d:0 "Hundred Youkai Accord's local liaison network no longer reports to the central government.\n\n Workshops clang metal, villages close roads, and local self-defense forces remove their old insignia. Those lower-class Youkai who once transported food, repaired weapons, and guided troops for the Allied Forces now raise their upside-down flags on their own settlements.\n\n Seija Kijin announces the formation of the Gekokujou Front. She refuses to recognize anyone's right to inherit Yukari Yakumo's position, nor does she accept the Scarlet Devil Mansion, Myouren Temple, or Yakumo Emergency Government's re-ordering of local areas.\n\n This is not a cohesive nation. It is composed of diverse villages, workshops, weak Youkai, and local armed forces; some come for revolution, some only want to protect their homes, and some await revenge against their former oppressors.\n\n But at this moment, they share a common enemy: all those who are prepared to reclaim power from their vantage points.\n\n The Gekokujou Front has become an independent warring regime. The path of the former Hundred Youkai Accord has henceforth become its battlefront with other forces."
kyo_postwar.12.a:0 "§WPower will not be returned; it will be taken from the lower classes.§!"

kyo_postwar.13.t:0 "Myouren Temple Rings the Gathering Bell"
kyo_postwar.13.d:0 "The bells of Myouren Temple tolled across the asylums, temples, and post-war ruins.\n\n The rescue teams ceased transferring supplies to other factions, local temples closed roads requisitioned by the army, and humans and youkai who had previously been sheltered by Myouren Temple began gathering outside its gates.\n\n Byakuren Hijiri declared the establishment of a new provisional government. She refused to recognize that any army, bloodline, or central archive automatically granted her the right to rule, nor would she allow the post-war relief system to become a warehouse for other factions to replenish their forces and supplies.\n\n She still spoke of peace, but no longer understood peace as concession. If Scarlet Devil Mansion demanded obedience under the guise of order, if the Yakumo Emergency Government demanded the continuation of its old power under the guise of survival, and if the Gekokujou Front incited retaliation in the name of revolution,\n\n Myouren Temple would resist. Temples, shrines, aid stations, shelters, and local trust have joined together to form a new territory. Former allies of the Hundred Youkai Accord must now halt before the defenses of the Myouren Temple.\n\n The Myouren Temple regime has become an independent belligerent regime. Byakuren will prove by force that mercy does not equate to submission."
kyo_postwar.13.a:0 "§0If peace requires wearing armor, then we will guard that path.§!"

kyo_postwar.14.t:0 "Scarlet Devil Mansion announces a new order"
kyo_postwar.14.d:0 "The crimson mist once again crossed the lake, but no longer confined only to the territory of Scarlet Devil Mansion.\n\n The Imperial Guard took over the fortresses along the way, and officers in various regions received orders to renew their allegiance. Legions that had served under common command during the war against Japan now had to choose whether to accept the Scarlet family's banner.\n\n Remilia declared the establishment of the Scarlet Devil Mansion regime. She refused to allow the temple, local council, or a single shikigami to decide the future of Gensokyo. In her view, the vacancy left by Yukari Yakumo was not a difficult problem to be debated repeatedly, but a throne awaiting a true ruler.\n\n Scarlet Devil Mansion defined its order through military merit, obedience, and a clear hierarchy. Those willing to pledge allegiance would receive protection and status; those who refused to acknowledge the new master would be seen as rebels hindering the unification of Gensokyo.\n\n The flags of the former Allied forces have been lowered from the Scarlet Devil Mansion defense zone, and the roads to the other three parties have been officially blocked.\n\n The Scarlet Devil Mansion regime has become an independent belligerent regime. Remilia has no intention of sharing the post-victory world with anyone else."
kyo_postwar.14.a:0 "§RThe night can only have one master.§!"

kyo_postwar.15.t:0 "Yakumo Emergency Government Takeover of Central Government"
kyo_postwar.15.d:0 "After Yukari Yakumo's death, the central meeting place did not immediately close.\n\n Ran sealed the orders left by Yukari, took over the barrier records and the administrative personnel who were still willing to obey the central authority. Nodes in various locations continued to operate, supply lists were still being updated, and orders were still being sent to distant places with the Yakumo family's seal.\n\n She did not claim to be Yukari Yakumo's successor, nor did she demand anyone's allegiance to her.\n\n She only declared that until the new barrier could be freed from emergency maintenance, no force was allowed to seize the central authority, split up nodes, or take over the system left by Yukari. The takeover of Scarlet Devil Mansion, the establishment of a separate government by Myouren Temple, and the local mobilization in Seija were all listed as actions that endangered the survival of the barrier.\n\n However, what the other three parties saw was not an institution that was merely temporarily maintaining order. What they saw was the Yakumo family still issuing orders, still occupying the central government, and still trying to demand obedience from everyone in the name left by Yukari.\n\n The areas controlled by the central government had been severed from the other three parties. Lands that once belonged to the same administrative system were now divided by orders, blockades, and mutually unrecognized authorities.\n\n The Yakumo Emergency Government had become an independent, warring regime. Ran only wanted to preserve the world Yukari had left behind, but she had to first defeat everyone trying to reshape it."
kyo_postwar.15.a:0 "§3The center cannot collapse before the barrier stabilizes.§!"




 kyo_postwar.17.t:0 "The Hundred Youkai Alliance Disintegrates"
 kyo_postwar.17.d:0 "In the seven days following Yukari Yakumo's death, no large-scale fighting broke out on the archipelago.\n\n This was not because the four parties were still willing to negotiate, but because the new barrier had not yet stabilized. No one knew which bridge held anchor points, which military camps were built on fragile borders, and no one dared to destroy the parts that maintained the world's operation with artillery fire before confirming the situation.\n\n During the brief silence, the Hundred Youkai Alliance began to disappear from within.\n\n The legion's common designation was removed, and the central command lost its effect. Officers from Scarlet Devil Mansion returned to their original lords with their troops; followers of the Myouren Temple left their camps to guard temples and internment camps; soldiers from local backgrounds returned to villages and workshops with their weapons; and troops still willing to obey the Yakumo family were reorganized into the barrier defense and emergency administration system.\n\n Some camps were deserted overnight, and some units split into several groups during their marches. Weapons in warehouses were seized by nearby forces, and supply trains on the railway were rerouted to new controlled areas. Soldiers who fought side by side yesterday were now re-registering under different flags.\n\n Ran was powerless to stop this disintegration. The orders she held still belonged to a non-existent central authority, and maintaining the shell of the Hundred Youkai Alliance would only allow any side to seize weapons and land under the guise of the old designation.\n\n Thus, the final joint disbandment order was sent to various locations.\n\n The Hundred Youkai Alliance ceased to exist. The remaining soldiers, equipment, and officers would be reassembled by the four newly formed regimes. When the next order arrives, they will no longer assemble as allies, but will regroup on opposing fronts.\n\n§RAll existing forces will be disbanded. Each civil war faction will rebuild its army according to its controlled territories and support base.§!"
kyo_postwar.17.a:0 "The common army is a thing of the past."


 kyo_postwar.23.t:0 "The failure report from the Moon"
 kyo_postwar.23.d:0 "Lunar Capital's leadership received the final report from the ground: the victors of the four-way civil war have seen through the second attack and traced it back to the Watatsuki family's command chain. One assassination is no longer enough to end Gensokyo. The Lunar Capital Expeditionary Headquarters was thus established."
 kyo_postwar.23.a:0 "The next time won't just be a flash of light."

    
    kyo_postwar.24.t:0 "Strive for Gensokyo's Support"
    kyo_postwar.24.d:0 "The civil war will be decided not only on the front lines, but also by which side wins the trust of Gensokyo's local powers.\n\n Use the §R“Allegiances Amid the Flames”§! decisions to raise their favour through aid and promises. When favour reaches §G5§!, a neutral faction will openly support us and provide the corresponding bonus.\n\n If the target already supports an enemy, reaching 5 favour will only return it to neutrality; it must then be won over again. The other contenders will also make an overture every §R15 days§!.\n\n Concentrate on factions already close to 5 favour, and prevent the enemy from concluding negotiations of its own. The more support we secure, the more strength we can mobilise for the final battle."
    kyo_postwar.24.a:0 "Victory also requires allies."











 KYO_yukari_legacy.1.t:0 "She came back too late."
 KYO_yukari_legacy.1.yakumo:0 "On the night of the explosion, Renko Usami emerged alone from the abandoned underground train station. Her appearance was unchanged from before the war, but Merry was not by her side. The letter sent to the Yakumo family read only: “You are inheriting the files she left behind, but the moon is not destroying her government. If you want to know what she truly left behind, go find a station with no end.”"
 KYO_yukari_legacy.1.remilia:0 "On the night of the explosion, Renko Usami emerged alone from the abandoned underground train station. A letter to Scarlet Devil Mansion read: “You can take her territory, but you can't just use that power as a weapon. The moon wants to kill things older than nations. Go find a station without an end.”"
 KYO_yukari_legacy.1.hijiri:0 "On the night of the explosion, Renko Usami emerged alone from the abandoned underground train station. A letter to Myouren Temple read: “She didn't build this place just to protect those who are alive now. If you want to know who that protection was originally intended for, go find a station without an end.”"
 KYO_yukari_legacy.1.seija:0 "On the night of the explosion, Renko Usami emerged alone from an abandoned underground station. The letter she sent Seija read: “You hate nothing more than everyone surrendering the world to a single master. Then go and see why she made it into a world only she could maintain. The answer lies in a station with no terminus.”"
 KYO_yukari_legacy.1.a:0 "Only this letter will be included in this bureau's investigation."




 KYO_yukari_legacy.history_unseen:0 "§8This forgotten history.§!"



 KYO_yukari_legacy.10.t:0 "Chapter One: A Poem Without an Author"
 KYO_yukari_legacy.10.d:0 "After Yukari Yakumo's death, the folding fan she always hid behind her smile was left on the altar.\n\n No one could open it. A strong boundary youkai power lingered between the fan ribs; whenever someone tried to touch it, the near and the far, the waking and the dream would briefly blur. Only when Yukari's aura completely dissipated did the power, without its master, begin to crumble on its own.\n\n The distance between the past and the future suddenly shortened, and forgotten events crossed the boundaries of memory, returning to the fan's surface. Ink slowly emerged along the blank pages, sometimes as fragmented verses, sometimes as star maps never seen before; ancient shrines, silent moonlit seas, and cities of the distant future overlapped between the words.\n\n These poems were not written by Yukari herself. They were names she had abandoned over the long years, forgotten promises, and memories severed to continue being Yukari Yakumo. Death lifted the final barrier, allowing those memories from different eras to reunite.\n\n When the first line of the poem appeared in full, the fan-wielder saw not the birth of the sage Yukari Yakumo, but a human girl long forgotten by herself."

  KYO_yukari_legacy.20.t:0 "Chapter Two: Only the First Part of Reality Remains"
 KYO_yukari_legacy.20.d:0 "The first part of the fan-shaped poem reads: “The moon still holds gods, but dreams are no more on earth.”\n\n In the distant scientific century, fantasy had long since vanished from Earth. God died without sacrifice, Youkai became a ghost story on the pages of books, and souls, dreams, and miracles were all relegated to unverifiable superstition. Humanity possessed the technology to reshape mountains and seas, yet believed only in measurable reality.\n\n When Lunar Capital waged war against Earth, this reality became humanity's greatest weakness. Princess Yorihime summoned those gods still remembered by the Moon, but long forgotten on Earth; Princess Toyohime folded the ocean and space, allowing artillery fire to bypass distances and directly strike cities. Humanity could calculate the energy of attacks, but could not understand why God responded, nor could it aim at a constantly changing boundary. Earth's defenses collapsed one by one, and only scientific civilization was ultimately defeated by what it had long forgotten.\n\n Towards the end of the war, Renko Usami and Maribel Hearn of the Hifuu Club entered the ruins of the Hakurei Shrine. Behind the collapsed torii gate, only half a plaque bearing the inscription “Hakurei” remained, yet beneath lay a space undetectable by instruments. Renko looked up and saw celestial phenomena from several eras overlapping in the starry sky; Merry touched the broken offering box and heard the chirping of cicadas from the other side of the boundary.\n\n Renko used the stars to determine time and latitude and longitude to pinpoint locations; Merry, following the shrine's remaining power, tore apart the boundary between “this moment” and “that moment.” When the white light of the Moon illuminated the ruins once more, the two crossed that gap together.\n\n There were no roads, no trains to take. City lights stretched out behind them, constellations reversed direction, and the moon waxed and waned a thousand times in a single breath. Coastlines, mountains, and languages receded beneath their feet, and countless histories yet to unfold swept past them like thin sheets of paper. Renko kept her eyes glued to the stars, maintaining her direction towards the target era; Merry, on the other hand, used her body to support the ever-closing boundary.\n\n This journey took Merry's life as a human. Upon arriving in ancient times, she could still walk, think, and breathe, but her body no longer aged, and her shadow began to drift away from the sunlight. She was left between life and death, between humanity and Youkai, only able to continue existing through the gradually awakening power of the boundary.\n\n Renko erected the “Hakurei” plaque where they arrived, as the first anchor point for confirming their era and location. The first torii gate was erected there, and Merry spent years beside it that were far longer than a human's lifespan.\n\n Her power grew stronger, but the boundaries of her self became increasingly blurred. The streets of the scientific century, the Hifuu Club, and her own name faded from her memory. When she finally stopped responding to “Merry,” the remaining thoughts converged into another name deep within the boundary.\n\n Renko was the first to pronounce it—Yukari Yakumo."

  KYO_yukari_legacy.30.t:0 "Chapter 3: The Second Part Named after Hakurei"
 KYO_yukari_legacy.30.d:0 "The second half of the poem doesn't continue to mourn the destroyed future, but instead describes a homeland that doesn't yet exist.\n\n Renko takes the word “Hakurei” from a broken plaque she brought back from the shrine ruins, using it as her name in this era. She conceals her identity as Renko Usami, becoming the legendary first Hakurei shrine maiden, re-erecting the torii gate at the place where the two arrived, establishing a calendar with the stars, and fixing the torn spacetime by the time travel with rituals.\n\n Merry, however, can no longer return to her original era. The time travel has taken away her life as a human, leaving her trapped in the gap between life and death, past and future. Villagers begin to say that the road at dusk will suddenly split open, and travelers claim to have seen golden eyes on the other side of the door and shadow. Humanity's fear and imagination of what lies beyond the boundary gradually converges on her, turning the girl who is forgetting her name into a youkai named Yukari Yakumo.\n\n Yukari drew the initial boundary centered on the shrine, bringing within it the exiled youkai, the gods who had lost their followers, and all the strange beings on the verge of disappearing from reality. Gensokyo thus began. It was not initially a paradise, but a project spanning an era: to preserve on Earth a fantasy strong enough to fight against Lunar Capital before science and reality engulfed everything.\n\n C Centuries later, Yukari gathered these preserved forces and launched the First Lunar War. Watatsuki no Toyohime distorted distance, preventing the youkai army from ever reaching the true Lunar Capital; Watatsuki no Yorihime summoned the gods, who systematically defeated the invaders who thought they could overcome them with sheer numbers.\n\n Yukari returned to Earth with her defeated army, but not empty-handed. For the first time, Lunar Capital saw Earth, which should have been heading towards an atheistic age, regain youkai, gods, and the boundary. She failed to change the future, but she instilled fear in Lunarian: this being named Yukari Yakumo might truly be able to derail the predetermined ending."


 KYO_yukari_legacy.40.t:0 "Chapter 4: A Ghost Story Named Yukari Yakumo"
 KYO_yukari_legacy.40.d:0 "After the Moon's defeat, Yukari realized for the first time that what she brought to Lunar Capital wasn't the preserved weaponry. The Youkai would grieve for their fallen comrades, yearn for the spring in the mountains, and be thankful upon returning to Gensokyo that their homes hadn't yet been consumed by war.\n\n So, she began to change the project. She divided the land according to God's faith, preserved a place for the Youkai, and left villages where humans could live safely. The boundaries initially used to store imaginary power gradually acquired seasons, roads, feasts, and legends. Gensokyo no longer existed merely for a war yet to come, but became a homeland its inhabitants were willing to live for.\n\n Renko would occasionally reappear in this era, guided by the stars. Each time they met, she saw Merry's traces growing fainter. Yukari first forgot the city of the Scientific Century, then the Hifuu Club, and finally, even Renko's face could only evoke an inexplicable familiarity. Renko did not force her to regain her memories.\n\n She rewrote their agreement as a responsibility between the Hakurei shrine maiden and the boundary youkai: the shrine maiden would guard the entrance to Gensokyo and the Outside World, and Yukari would guarantee that no shrine maiden would have to bear the entire world alone. After completing the final ritual, Renko disappeared from public history, leaving only the name Hakurei to continue.\n\n Merry's original memories were eventually worn away by the long years, but she did not completely disappear. Humanity's fear of what lies behind the door, the night, the distance, and the unknown world maintained her youkai form; and her obsession with protecting something remained in every boundary of Yukari Yakumo.\n\n She had forgotten that Gensokyo was originally built for war, but she no longer called the people living there reserves."


  KYO_yukari_legacy.50.t:0 "Chapter 5: The Forgotten Homeland"
 KYO_yukari_legacy.50.d:0 "Gensokyo wasn't built suddenly in a single day. After the Moon's defeat, Yukari spent centuries bringing the strange creatures scattered throughout the world to their own designated boundaries.\n\n The oni once established settlements on Youkai Mountain, maintaining a rough order through power and feasts. Later, the pact between humans and oni completely broke down, and the Oni chose to leave the surface, migrating underground along the abandoned Hell's passages. Yukari didn't stop them, only blocking their pursuers and ensuring that the conflicts on the surface wouldn't cross the Former Capital entrance.\n\n After the Oni left, the tengu moved into the vacated mountains. They established outposts, roads, and communication networks, while the kappa set up workshops along the streams. Youkai Mountain, once only occupied by the strong, gradually became a community with its own laws, industries, and territorial consciousness.\n\n Meanwhile, more and more weaker Youkai fled into Gensokyo. Unable to sustain themselves in a world of human expansion, nor able to contend for territory with the powerful youkai, Yukari provided them with shelter and gathered the scattered humans to establish the Human Village. Hunting was forbidden within the village, and hunting youkai was prohibited both inside and outside; this unfair yet sufficient boundary for survival became the earliest order of Gensokyo.\n\n After the boundary for the living was established, Yukari went to Higan to negotiate with the Netherworld. The dead were sent to Hakugyokurou, their sins were judged by the Ministry of Right and Wrong, and vengeful spirits were not allowed to return to the surface at will. The feared Komeiji sisters were placed deep within the Former Hell: Satori was responsible for monitoring vengeful spirits and underground incidents, while Koishi traveled along unnoticed paths, preserving a possible connection between the enclosed underground and the Outside World.\n\n Vampires from the West also crossed the border with their retinues. They fled hunters and war, exchanging an unbreakable blood pact for refuge on the shores of the Misty Lake. Afterwards, youkai who had lost their homelands, gods without sacrifices, and legends rejected by the modern world arrived from all corners of the land, regaining their names here.\n\n Yukari finally admitted that she alone could not manage such a world. She invited others with the ability to see the big picture to share the responsibility of a sage, allowing different wills to maintain the balance between boundaries, back doors, humans, and youkai.\n\n When the Great Hakurei Barrier finally closed, Gensokyo no longer belonged to Yukari Yakumo alone. It became a refuge built by the forgotten ones of the world—the Outside World could forget them, but within this boundary, no existence had to disappear simply because no one believed in it."
 
 






 KYO_yukari_legacy_poem_title:0 "“Elegy Beyond the Boundary”"

 KYO_yukari_legacy_poem_1:0 "§YPart One: The Ownerless Fan§!\n\n Moon-pale silence bathes the weathered dais;\nfrom the fan's lingering fragrance, an old boundary opens.\n Yesterday and tomorrow meet in ink;\nhuman names and phantom titles fade alike to dust.\n One body has crossed a thousand severed worlds;\none death calls ten thousand memories home.\n Ask where this poem begins—\nlisten to an old, ownerless fan grieve."

 KYO_yukari_legacy_poem_2:0 "§YPart Two: A World Without Gods§!\n\n The gods leave the human world, yet moonlight remains;\nyoukai retreat into yellowed pages, their dreams unnamed.\n Steel cities measure every law of heaven and earth,\nknowing no divine awe and transgressing every bound.\n Toyohime folds the sea and descends upon the nations;\n Yorihime calls down gods to shatter walled cities.\n Two maidens at the world's end seek an ancient shrine;\nupon its broken plaque, Hakurei's name survives.\n\n Renko follows the stars and draws a bygone year near;\n Merry opens a gap and tears the present life apart.\n A thousand phases of the Moon pass in a breath;\nmountains and rivers reverse their ageless course.\n City lights hang inverted, drowning in yesterday;\nthey turn—and no city remains behind them."

 KYO_yukari_legacy_poem_3:0 "§YPart Three: Hakurei and Yakumo§!\n\n A broken plaque lends them the name Hakurei;\na lonely shrine anchors the road through past and present.\n Renko raises a banner and calls herself shrine maiden;\n Merry has no grave, yet no mortal life remains.\n At the road's end, people sense a hidden realm;\nwhen the door opens, children fear a youkai's gaze.\n Whispered fear from a thousand villages gathers into a soul;\n Yukari Yakumo rises from a dream.\n\n Gods and youkai are gathered into mountain and field;\nfrom that day, one land bears the name Gensokyo.\n No paradise raised merely to flee a world in turmoil—\nbut a refuge prepared to resist Heaven's armies yet to come."

 KYO_yukari_legacy_poem_4:0 "§YPart Four: The Defeated Army of the Lunar Sea§!\n\n Once she led a hundred youkai across the Lunar Sea;\n Toyohime bent the roads and sealed away the heavenly capital.\n Yorihime called down gods and broke the gathered ranks;\ntattered banners rolled homeward toward Japan.\n From that day, the Lunarians recorded every fissure,\nafraid that earthly dust might alter ordained fate.\n\n Only on returning did she learn this was no arsenal;\nthe wounded still asked after their homeland's cherry trees.\n If every spirit lived only to await a war,\nthey would fall before tomorrow ever came.\n So she rooted the boundary in mortal soil—\nnot merely to hide an army, but to shelter life."

 KYO_yukari_legacy_poem_5:0 "§YPart Five: The Land of the Forgotten§!\n\n The oni once made their home on Youkai Mountain;\nwhen the human–oni pact frayed, they left the ridge's moon.\n Following fire, they descended through the earth's gate;\nthe tengu came after to inhabit the ancient peak.\n Kappa cut the waters and set the millwheels turning;\nmountain roads bore news by day and night.\n\n Frail youkai carried their names inside the boundary;\nlonely gods bore offerings through the village gate.\n Gathered human lamplight became the Human Village;\na compact gave human and youkai each a place.\n The strong could not prey upon the smallest lives;\nnot even the shrine maiden could cut down every strange thing.\n\n At Higan, judgment fixed the bounds of life and death;\n Netherworld cherry trees received the bones and ferried souls.\n Satori heard resentful voices and watched the phantom flames;\n Koishi passed without thought and left one door unlocked.\n Those denied a place above made homes below;\nthe Former Capital, too, became a village.\n\n Blood heirs from the West fled soldiers and hunters;\nby covenant, the Scarlet Mansion rested beside the lake.\n Gods abandoned by every nation withdrew from the world;\nold youkai from a hundred lands became neighbours.\n Though their mother tongues lay oceans apart,\nall who crossed the boundary could regain a name.\n\n No single sage could tend a thousand boundaries;\nthe hermit Kasen set precepts between human and youkai.\n The secret god opened doors and welcomed strangers;\nthree sages each kept watch upon a different way.\n Hakurei raised the lasting curtain between the worlds;\n Yakumo quietly guided every road across.\n\n At last the Great Barrier made a land for the forgotten,\na place the wider world no longer knew remained.\n If ever a legend should find itself without a home,\nthese mountains still preserve a place for old dreams."

 KYO_yukari_legacy_poem_6:0 "§YPart Six: One Life, Two Names§!\n\n Merry first sought voices beyond the boundary;\n Yakumo later drew the lines of life and death.\n Merry feared to see a world bereft of gods;\n Yakumo dared to march upon the palace of the Moon.\n\n Merry knew only a promise shared by two;\n Yakumo learned to hold a myriad clashing lives.\n Merry slowly lost the road that brought her here;\n Yakumo kept the lamps of ten thousand homes alight.\n\n Merry once laughed among the stars;\n Yakumo crossed unnumbered realms.\n No new soul had devoured the old—\nthe old self had simply lived too long.\n\n Merry once dreamed of saving a dying world;\n Yakumo chose at last to guard its light.\n One name remained with yesterday;\none endured a thousand springs.\n\n Upon the fan, the two names overlap—\nwho now can say which belongs to the woman of the past?\n Merry did not vanish into nothing;\nnor is Yakumo some stranger's soul.\n\n Renko read the words of a thousand years and learned the two names shared a single life.\n She would not erase the Yukari of this age;\nshe wished only that Merry might turn back once.\n\n Her fingers brush the fan's ribs as she whispers:\n “Old friend, can you return to our court of stars?”\n The fan closes without answer. Even the long wind stills—\n the final lines left blank, awaiting her return."

 KYO_yukari_legacy_poem_stop:"Close the folding fan and stop reading."


 KYO_yukari_legacy_poem_full:0 "§Y“Elegy Beyond the Boundary”§!\n\n$KYO_yukari_legacy_poem_1$\n\n$KYO_yukari_legacy_poem_2$\n\n$KYO_yukari_legacy_poem_3$\n\n$KYO_yukari_legacy_poem_4$\n\n$KYO_yukari_legacy_poem_5$\n\n$KYO_yukari_legacy_poem_6$"

 




 KYO_cws_legacy_story_final_option:0 "What she left behind was not a throne, but a set of responsibilities that must continue to function."
 KYO_cws_legacy_story_lost_event.t:0 "The clue has fallen into the hands of others."
 KYO_cws_legacy_story_lost_event.d:0 "As we traced the gap coordinates along the travel logs, another civil war faction had already pieced together the pass and taken over emergency dispatch authority. The remaining files became useless, and Yukari Yakumo's legacy temporarily found a new owner."
 KYO_cws_legacy_story_lost_event.a:0 "In this war, even the answers left behind by the dead are being contested."

 KYO_yukari_legacy.60.t:0 "An Anonymous Star Chart"
 KYO_yukari_legacy.60.d:0 "After the meeting, only an unsigned star map remained beside the empty chair. The coordinates on it connected the scientific century with Gensokyo, but made no demand that anyone repeat the past. Yukari archived it: the methods left behind by the absent can still help those who come after understand the world."
 KYO_yukari_legacy.60.a:0 "Save the star chart, and also save the blank space."
