 eirin_side_3:0 "The Stretcher Crosses the Animal Trail"
 eirin_side_4:0 "Let the Living Go Home First"
 eirin_side_5:0 "Tear Up the Written Obituary"
 eirin_side_6:0 "Never Resist Stagnation"


 # ===== 幽幽子：送别 =====
 side_with_yuyuko:0 "Yuyuko: Don't Let Death Erase a Life"
 yuyuko_side_1:0 "The Gates of Netherworld Remain Open All Night"
 yuyuko_side_2:0 "Higan Accepts the Belongings"
 yuyuko_side_3:0 "Saigyou Ayakashi remembers names"
 yuyuko_side_4:0 "Let the deceased go home first"
 yuyuko_side_5:0 "The empty chair has found a new owner"
 yuyuko_side_6:0 "Departure still has meaning"


 # ===== 紫的最终回答 =====
 yukari_control_everything:0 "The living return, the dead are remembered"
 yukari_control_everything_desc:0 "From then on, each returning team would split into two lines before the barrier: those still warm would be sent to Eientei, while their belongings and the soul fire following them would be sent to Hakugyokurou. Yukari stood at the fork in the road, and only after the last stretcher and the last soul-guiding butterfly had passed through the gap did she finally close her folding fan."
