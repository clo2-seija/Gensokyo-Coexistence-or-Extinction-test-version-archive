 yuyuko_side_modifier:0 "Hakugyokurou Refuses to Forget"
 yuyuko_side_modifier_1:0 "Hakugyokurou: Butterflies and Medicine Carts Ride Side by Side"
 yuyuko_side_modifier_2:0 "Hakugyokurou: The Dead Regain Their Names"
 yuyuko_side_modifier_3:0 "Hakugyokurou: Souls Have a Place to Return To"
 yuyuko_side_modifier_4:0 "Hakugyokurou: Empty Chairs Are No Longer Nameless"


