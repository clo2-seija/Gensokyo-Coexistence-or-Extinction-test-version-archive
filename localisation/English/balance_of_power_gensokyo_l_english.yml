 eirin_side_modifier:0 "Eientei Refuses to Accept Obituary"
 eirin_side_modifier_1:0 "Eientei: Medicine cart and butterfly go hand in hand"
 eirin_side_modifier_2:0 "Eientei: Medicine chest arrives at the wounded camp first"
 eirin_side_modifier_3:0 "Eientei: The abandoned wounded return to the world"
 eirin_side_modifier_4:0 "Eientei: Obituaries must not be written first"


 # ===== 天平界面 =====
 KYO_balance:0 "Medicine cup and soul-guiding butterfly"
 KYO_balance_desc:0 "Before the same ruins, Eientei carries away those still warm, while Hakugyokurou leads away unseen souls. Each time the medicine cart saves a life, the pointer shifts towards Eirin; each time the soul-guiding butterfly takes away a deceased person, the pointer shifts towards Yuyuko. Yukari keeps both paths open, because Gensokyo cannot abandon the living, nor can she pretend the dead never existed."

 yukari_control_well_center:0 "The medicine cart and the soul-guiding butterfly travel side by side."
 yukari_control_well_left:0 "The medicine cart is driving at the very front."
 yukari_control_well_right:0 "The Soul-Guiding Butterfly Remains Until the End"


