 KYO_country_intro_header:0"Gensokyo, Favored by the Gods"
 KYO_country_intro_content:0"Mist clings to the foot of the mountain year-round, and the path behind the torii gate seems half forgotten by the world. Walking in, you'll see a place that shouldn't exist in modern times: shrines, villages, Youkai castles, temples, underground molten light, and moonlight reflecting on the bamboo forest. This place is called “Gensokyo”—the stage of the Touhou Project, an otherworld isolated by a barrier.\n\n The core rule of Gensokyo is simple: as long as you are “believed in and remembered,” you can survive. Youkai, God, legends, and ghost stories all rely on human fear and imagination to continue their existence; but as civilization progresses in the Outside World and superstition recedes, more and more “ancient mysteries” lose their foothold in reality. Thus, Gensokyo was born—it's like a refuge, and also like a cage, concentrating the mysteries discarded by time on the same land. What sustains all of this is the “Great Hakurei Barrier.”\n\n This barrier separates Gensokyo from the Outside World, preventing the two sets of rules from devouring each other. Within the barrier, humans primarily reside in the “Human Villages,” living through farming, trade, and rituals. Within the barrier also exist countless Youkai and factions: the vampire nobles of Scarlet Devil Mansion, the tengu and kappa of Youkai Mountain, the lunar technology of Bamboo Forest of the Lost and Eientei, the Buddhist order of Myouren Temple, the Court of the Dead of Hakugyokurou, the Palace of the Earth Spirits, and subterranean supernatural forces… They check and balance each other, yet also need each other.\n\n Standing at the forefront of order is the “Hakurei Shrine Maiden.” The shrine maiden is responsible for mediating incidents, maintaining the barrier, and bringing transgressing conflicts back within the rules. She is not a dictator, but more like the mast that binds humans and Youkai to the same boat: everyone can hate each other, but they cannot dismantle the ship.\n\n As for Yukari Yakumo, she is one of the founders of Gensokyo, and also its most dangerous guardian. She manipulates the “boundary,” using the “gap” to reverse distances, boundaries, and insides and outsides, turning the impossible into a path. Her goal is never to let any one faction win, but to ensure the survival of “the Gensokyo system”—even if it means using ruthless methods, even if it means bearing infamy.\n\n During the fifty years that Gensokyo was closed off, its communication with the Outside World gradually ceased, which ironically became the soil in which the Youkai were able to survive. Legends do not have to yield to modernity, and strange tales do not have to be eradicated by science—thus, deep in the forest, the Youkai and humans breathe the same land, are wary of each other, and depend on each other. It is a delicate balance that is almost fragile: if everyone is willing to be content with their lot, this place may even become an ideal land that can accommodate all existence.\n\n But now, Gensokyo has entered an era of “loosening.” When you hear “coexistence” and “extinction,” it's not just a slogan, but a truth it has never dared to openly admit: Gensokyo exists because everyone is willing to abide by the same rules; and when those rules disappear, become distorted, or are forced to be rewritten—what follows will be either disaster or rebirth."

