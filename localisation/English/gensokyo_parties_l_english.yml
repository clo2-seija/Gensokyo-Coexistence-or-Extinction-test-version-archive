l_english:
 communism: "Communism"
 communism_noun: "Communism"
 democratic: "Democracy"
 democratic_noun: "Democracy"
 fascism: "Fascism"
 fascism_noun: "Fascism"
 fascism_desc: "Totalitarianism"
 communism_desc: "Totalitarianism"
 democratic_desc: "Democracy"
 conservatism: "Conservatism"
 conservatism_desc: "Conservatism believes that drastic changes pose potential harms to society, therefore it tends to maintain tradition or carry out more moderate reforms, sometimes even advocating a return to traditional moral values."
 liberalism: "Liberalism"
 liberalism_desc: "Liberalism has long upheld a philosophical tradition of respecting individual freedom, and considers defending these rights as the primary function of the state."
 socialism: "Socialism"
 socialism_desc: "Democratic socialism strives to establish an equal socialist state through reform, with the goal of abolishing or weakening the power that capitalism has seized from the people."
 marxism: "Marxism"
 marxism_desc: "Marxist political science encompasses a broad range of fields, from economics to historical perspectives, striving to put Karl Marx's theories into political practice. Its main characteristics are advocacy of class struggle and the transition to a society based on public ownership of the means of production."
 leninism: "Leninism"
 leninism_desc: "Leninism is an ideological school based on Marxism that aims to establish a socialist state by having a party-led revolution overthrow capitalist society. After seizing power, parties under this ideology govern through internal discussions and decision-making."
 stalinism: "Stalinism"
 stalinism_desc: "Stalinism is a political inheritance and development of Marxism-Leninism. It emphasizes rapid industrialization and collectivization and believes that only a strong and powerful socialist government can thoroughly eliminate counter-revolutionaries."
 anti_revisionism: "Anti-Revisionism"
 anti_revisionism_desc: "Anti-Revisionism is a school of thought that arose to counter numerous ideologies that claim to be heirs to Marxism. It advocates maintaining the core elements of original revolutionary theory. Its main opposition is to the introduction of capitalist economic elements into socialist countries. This ideology is largely defined by “what is not what” rather than “what is what.”"
 anarchist_communism: "Anarchist Communism"
 anarchist_communism_desc: "Anarchist Communism is an ideology that views the ideal of communism as a stateless society. It advocates skipping the transitional socialist state and favoring the direct establishment of a mutually supportive society."
 nazism: "Nazism"
 nazism_desc: "National Socialism is rooted in extreme nationalism and driven by the ideology of Germanic racial supremacy. It actively pursues aggressive expansionist policies and advocates the establishment of a totalitarian state on which the people will be united under the leadership of a leader with absolute power—the Führer."
 gen_nazism: "Nazism"
 gen_nazism_desc: "National Socialism is rooted in extreme nationalism and driven by racial supremacy. It actively pursues aggressive expansionist policies and advocates for a totalitarian state, on which the people are united under a leader with absolute power."
 fascism_ideology: "Fascism"
 fascism_ideology_desc: "Fascism encompasses many elements of extreme nationalism. Generally, its core tenets emphasize dedication to the state and uniting the people under a strong leader."
 falangism: "Phalangistism"
 falangism_desc: "Phalangistism is an authoritarian ideology that combines fascist and conservative characteristics, placing great emphasis on national and Catholic identity."
 rexism: "Rexism"
 rexism_desc: "Rexism is a staunchly conservative nationalist ideology that strongly opposes liberalism and communism while advocating corporatist economics. Given its increasing use of populist and authoritarian rhetoric, its ideology is converging with other fascist movements."
 neutrality: "Neutrality"
 neutrality_noun: "Neutrality"
 neutrality_desc: "Authoritarian Regime"
 despotism: "Despotism"
 despotism_desc: "Despotism is a form of government in which one person holds absolute power."
 oligarchism: "Oligarchy"
 oligarchism_desc: "Oligarchy is a form of government where a small group of people wields absolute power."
 moderatism: "Moderation"
 moderatism_desc: "Moderation is a form of government that adopts a moderate approach or means in governance to avoid extreme left or right-wing tendencies."
 centrism: "Centrism"
 centrism_desc: "Centrism seeks practical solutions grounded in common sense. By weighing risk and capacity against both present and future needs, it aims to earn public trust and safeguard the common good."
 anarchism: "Anarchism"
 anarchism_desc: "Anarchism (i. e., anarchism) is extremely averse to authoritarianism itself. It advocates breaking down society into self-governing autonomous collectives, rather than forming a unified, centralized state."

buddhist_liberal: "Buddhist Liberalism"
buddhist_liberal_desc: "Buddhist Liberalism, in this ideology, precepts and human rights are written side by side, and compassion and freedom are seen as two sides of the same banner. The Buddhist principle of “equality of all beings” is reinterpreted as a fundamental principle of modern civil society, advocating that individuals have the right to choose their beliefs, speech, and lifestyles, while simultaneously being responsible for their karma and actions. Temples are no longer merely places for chanting scriptures, but public spaces on par with parliaments and labor unions; the sound of Dharma drums and bells, along with ballots and debates, constitute the political rhythm. This approach attempts to make the system bear compassion in an era where steel and magic coexist, and to ensure that freedom is not merely the afterglow of the strong."

reverse_ideology: "Subordinate Socialism"
reverse_ideology_desc: "Subordinate Socialism, it proclaims that all domination and obedience are merely temporary illusions; the only truly unshakable thing is the oppressed's yearning for justice. Through alliances formed by labor unions, grassroots self-governing organizations, and exiled Youkai groups, this ideology advocated seizing power from the bottom up, uprooting the old aristocracy and corrupt bureaucracy from their high positions. Factories, manors, and territories within encirclements were seen as redistributable public property, and red flags and inverted badges fluttered side by side in the streets. For its followers, revolution was not a one-time event, but a constantly evolving trial—each class overthrow brought them closer to a world where “no one is trampled upon anymore.”"

vampire_empire: "Vampire Hegemony"
vampire_empire_desc: "Vampire Hegemony: In the past, vampires were the undisputed rulers of the Western night, their castle towers higher than palaces, and the toasts at blood banquets drowning out church bells. The sunlight and gunfire of industrialization, however, pushed the vampire clan to the brink of extinction; many ancient families were reduced to ashes under chimneys and searchlights, and the remaining nobles were forced to hide in the shadows. Thus, the surviving vampires formed a new blood alliance, proposing a hegemonic theory centered on the “right to survival of noble bloodlines”: humans were seen as an out-of-control herd, to be reduced and expelled to create an eternal night realm belonging only to vampires. The red moon would be the empire's banner, blood its currency, and anyone who dared question its rule would vanish silently from the register before dawn. For its followers, cruelty was not a sin, but a necessary means to maintain the continuation of their noble race."

gensokyo_balance: "Gensokyo Balance Theory"
gensokyo_balance_desc: "Gensokyo Balance Theory, from the moment Gensokyo was woven, Yukari Yakumo weighed everything on an invisible scale—fear and faith, prosperity and decline, the distance between humans and vampires, all had to be confined within a narrow and safe range. This balance theory did not pursue complete victory, nor did it allow absolute destruction; as long as the scales did not tip, the vampires could continue to survive in an era of decline. To preserve this fragile balance, any overly extreme dreams, whether from humankind or the youkai, will be quietly pushed back beyond the boundaries."

#buddhist_liberal: "佛教自由主义"
#buddhist_liberal_desc: "融合佛教与自由主义的意识形态，将佛教的理念完全的融合进现代的思想中"
#reverse_idology : "下克上社会主义"
#reverse_idology_desc : "翻转阶级打破旧秩序的牢笼，追寻新世纪该有的新理念"
#vampire_empire : "吸血鬼霸权主义"
#vampire_empire_desc: "吸血鬼原西方世界的霸主，自从工业化后吸血鬼死的死逃的逃，在现今的世界中濒临灭绝，但那高贵的贵族尊严决不会遭卑劣的人类所践踏，他们将会消灭人类获得应属于吸血鬼的生存空间"
#gensokyo_centrism: "幻想乡平衡主义"
#gensokyo_centrism_desc: "自幻想乡建立起来后，八云紫一直奉行著她那套的平衡理论，世界如何的变化，只要平衡维持在，一定的区间中，妖怪们将可在日渐式微的时代中生存，只要没破坏这维持不易的平衡"
