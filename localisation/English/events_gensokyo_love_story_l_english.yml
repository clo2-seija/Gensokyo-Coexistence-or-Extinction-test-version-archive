 love_story.1.t:0 "Youmu's encounter with Reisen (Part 1)"
 love_story.1.d:0 "Dusk pressed down on the eaves of the houses. The pharmacy was crowded with people waiting to collect their medicine, coughs echoing incessantly. At the counter, an old man clutched an empty medicine bag, his knuckles white from the strain.\n\n The traveling medicine seller, wearing a straw hat, checked the old man's eyes and pulse, then pushed the medicine bag back.\n\n “The painkillers remain the same.\n\n The previous medication is discontinued starting today.” The old man was stunned. “Why?\n\n I've been taking it for three months, and at least I can still get out of bed...” The medicine seller opened the wooden medicine box.\n\n Inside were only seven sealed bottles, each labeled with a different name. “Your lung disease is irreversible. These seven doses of medicine will only prolong your life by a few days; sending them to East Village can save three poisoned children.” She spoke calmly.\n\n “These are all the medicines I have. I choose three people.”\n\n The old man opened his mouth, but only managed to squeeze out, “And what about me?”\n\n “I will give you pain-relieving medicine.”\n\n “And then wait to die?” “Death doesn't need my permission.” The room fell silent. Some lowered their heads, some quietly retreated, as if by not looking, the decision wouldn't fall on them.\n\n The sound of a scabbard lightly touching the doorframe came from outside. A girl carrying two swords stopped in front of the counter, her white phantom half following her across the threshold. She looked first at the old man, then at the medicine box, and finally at the unwavering red eyes beneath the straw hat.\n\n “He's still alive,” Youmu Konpaku said.\n\n The medicine seller answered quickly, “The three people outside are alive too.”\n\n “So you decide how many days he has left?” “I decide where the medicine is delivered.\n\n As for how long he can live, that's not up to me.” Youmu's hand rested on the scabbard, but she didn't draw her sword.\n\n “You treat people like numbers.” “At least I've included them all.” The medicine seller looked up at her. “Focusing on this one person and pretending not to see the other three is more merciful, isn't it?”\n\n Their gazes met across the medicine box. Youmu didn't back away. She saw a dozen or so undelivered wooden crates piled up behind the medicine seller, and two maps of the routes looted by bandits pasted on the wall. “Why are those medicines still here?” she asked. “We're short-handed,” the medicine seller replied.\n\n “Both routes were attacked, and Eientei can't spare any more guards.”\n\n “What if someone transported them for you?” she asked. The medicine seller narrowed her eyes slightly.\n\n Youmu pointed at the old man: “Continue to give him the medicine. I'll deliver these wooden boxes for you and also guard the road for the herb gatherers. The freed-up manpower will find new herbs, and those three children won't be shortchanged.”\n\n “You think moving a few boxes will make herbs grow from the ground?”\n\n “No.” Youmu looked directly at her, “But I can save you manpower and ensure that the herbs already gathered arrive here alive.\n\n Whether it's enough or not is up to you to decide.” The medicine seller didn't answer immediately for the first time. She looked at the twin swords, then at the girl's straight legs, as if judging how much weight a new tool could bear.\n\n After a moment, she closed the medicine box.\n\n “Forty days.”"


 love_story.3.t:0 "Youmu's Encounter with Reisen (After)"
 love_story.3.d:0 "“Forty days, from dawn to dusk.” The medicine seller placed a blank contract on the counter. “Moving, escorting, night travel, transferring wounded after attacks—I decide what to do. One late arrival, one less day's medicine; one unauthorized departure, that person's medicine will be reassigned to someone else.”\n\n The old man's face turned pale. Youmu only asked, “What if the herbs aren't found?” “Then stop the medicine.”\n\n “Even if I finish forty days?”\n\n “Labor can't cure illness. I only guarantee that the people you get in exchange will be sent to gather herbs, not that what we need will necessarily grow in the mountains.”\n\n These words were cold and uncompromising. Youmu's hand tightened on the scabbard for a moment, then relaxed. “Fine.”\n\n The medicine seller looked at her.\n\n “Think carefully. You might do everything, and he'll still die.” “I know.”\n\n “Then why are you still doing it?”\n\n Youmu looked at the old man sitting at the counter. His back was already hunched low, his hand still clutching the empty medicine bag tightly. “Because he can't do it, but I can.”\n\n “A terrible calculation.”\n\n “I didn't draw my sword to gain anything.”\n\n The medicine seller was silent for a moment, then took three vials of medicine from her chest and placed them in front of the old man.\n\n “Three days,” she said. “Not a gift, but an advance. Whether there's medicine on the fourth day depends on whether she appears in Eientei on time.”\n\n The old man reached for the medicine with trembling hands. The medicine seller didn't comfort him, nor did she say his condition would improve; she only explained the timing of the medication and the possible side effects one by one.\n\n Cruel to the point of being heartless, yet without a single lie. Then, she unfolded the contract again and wrote down forty days of work, the amount of medicine that needed to be replenished, and the conditions for termination.\n\n She left a blank space at the end. “Name.”\n\n Youmu took the pen and wrote four characters: “Youmu Konpaku.” The medicine seller's gaze lingered on those four characters for a moment. Hakugyokurou's gardener, a half-human, half-phantom swordswoman—she clearly recognized the name, but didn't loosen any conditions because of it.\n\n Youmu handed the pen back. “Your name.” “No need.” “You know who I am, and I should know who I work for.”\n\n The rabbit ears under the straw hat twitched slightly. The medicine seller finally took the pen and wrote her name on the other end of the contract.\n\n “Reisen Udongein Inaba.”\n\n The red seal fell, and the two names were pressed onto the same piece of paper.\n\n Reisen put away the contract, her tone still cold: “Tomorrow at dawn, Eientei's backyard. If you're late, those three doses of medicine will be the last three.”\n\n “I'll be there early.” Youmu picked up the medicine, turned, and handed it to the old man.\n\n As she left, she glanced back. “If I do it, you must do it too.”\n\n Reisen closed the medicine box.\n\n “I never promise patients miracles,” she said. “But as long as there are still methods available, I won't stop.”"
 love_story.3.a:0 "A contract, two kinds of stubbornness"


 love_story.2.t:0 "Bamboo Shadows Lost in the Path (Part 1)"
 love_story.2.d:0 "The next morning, Youmu Konpaku entered the Bamboo Forest of the Lost.\n\n She marked the ground with her scabbard, checking her direction every thirty steps. It wasn't yet dawn, and she had allowed ample time for any possible forks in the road. But as she stepped over a patch of soft, moss-covered soil, her foot suddenly slipped, and she and her phantom half fell into a pit. The pit wasn't deep, but it was dug extremely neatly.\n\n When Youmu looked up, she first saw a pair of drooping rabbit ears, then a face clearly trying to suppress a laugh. “You're the swordswoman who spends forty days exchanging medicine for strangers?”\n\n The rabbit-eared girl lay at the entrance of the pit, half a carrot dangling from her mouth.\n\n “More punctual than I expected. Too bad I took the wrong third fork.” Youmu brushed the mud off her shoulder. “Did you dig this?”\n\n “Of course. How could an ordinary hole possibly catch a Hakugyokurou's gardener?”\n\n The girl tossed down a bamboo rope. “Tewi Inaba. One of the owners of the Bamboo Forest of the Lost, occasionally also responsible for testing whether Eientei's new laborers have brains.” Youmu climbed out of the hole, ignoring her joke.\n\n “Did Reisen send you?”\n\n “She only said that today someone carrying two swords, with a sour face, and absolutely unwilling to be late would enter the bamboo forest.”\n\n Tewi smiled, sizing her up. “I added the hole myself.” The two continued along the bamboo path.\n\n Tewi walked erratically, sometimes to the left, sometimes to the right, occasionally deliberately stepping on a sinking stone slab, then nimbly jumping away before the mechanism closed.\n\n Youmu followed for a while, then suddenly asked, “Does she do this often?”\n\n “Digging holes?\n\n She doesn't have that sense of humor.”\n\n “Stop giving other people their medicine.”\n\n Tewi paused mid-bite. “Often,” she answered unexpectedly readily. “Ten doses of medicine on the table, eleven people outside, and one of them always has to go back empty-handed. Others will hide behind the screen and have the rabbit relay the message;\n\n Reisen will stand in front of that person and tell him herself.”\n\n “So she thinks she's not wrong?” “She rarely spends time thinking about whether she's right or wrong.” Tewi shrugged. “She only cares how many die the next day. If a different distribution method would save one life, she'll do it; if not, she'll do the same thing again.”\n\n Youmu's expression turned cold. “This isn't treating people like human beings.”\n\n “Yes.” Tewi's smile faded slightly. “Sometimes she sees everyone as a wounded expression.\n\n Including herself.” Two identical bamboo paths appeared ahead. Tewi walked to the left without hesitation, then turned back and waved.\n\n “But there's something quite annoying. If there's only one dose of medicine left, and she's among those eleven people—she's usually the one who ends up empty-handed.”"


 love_story.4.t:0 "Bamboo Shadows Lost in the Path (Part 2)"
 love_story.4.d:0 "The bamboo forest grew deeper and deeper. Sunlight was broken into fine, bright spots by the bamboo leaves, constantly flickering between Tewi's rabbit ears.\n\n “Reisen used to serve in Lunar Capital,” Tewi casually remarked. “The officers there loved to write orders beautifully, but by the time they finally arrived, most of the men on the front lines were already dead. She learned two things there: late orders kill people, and too much hesitation kills people.”\n\n Youmu asked, “So she preferred to decide for herself who to abandon?”\n\n “Yes.”\n\n “That's arrogant.”\n\n “And convenient.” Tewi's smile returned. “Everyone can hate her, without having to hate those drugs that don't even exist.”\n\n A thin bamboo rope suddenly sprang up from under the mud. Tewi reached out and grabbed Youmu's sleeve, pulling her away from the spot. The next moment, a bamboo bucket filled with mud and water fell from the tree, pouring right onto the spot they had just passed.\n\n “Did you dig this up too?”\n\n “This is a surprise I left behind yesterday. I'm not responsible for this today.”\n\n Tewi led her around the traps and continued, “Eientei isn't some kind of charitable temple. If someone is carried in with only half a breath left, Eirin will cut open their clothes on the spot to save them; if someone can't be saved, she'll directly tell the family to prepare for the worst. Kaguya will give up empty rooms, and the rabbits will sleep on the floor in the corridor, but no one will make a wish while looking at a sickbed.”\n\n She tossed a carrot forward.\n\n “The people there believe in something very simple: as long as you're alive, you can change your medicine, change your path, change your way of life. When there's really no other way, they won't keep lying with nice words.”\n\n Youmu was silent for a moment.\n\n “Is Reisen like that too?” “She's worse,” Tewi laughed.\n\n “She's too lazy to even prepare nice words.”\n\n “I can tell.” “But she won't forget who she abandoned.” Tewi's tone suddenly softened. “Those names line up to come back to her at night. That's why she's so cold during the day; being cold keeps her hands from shaking.” Youmu didn't answer.\n\n She recalled Reisen's expression last night when she placed the three pills in front of the old man—no pity, no contempt, as if she had already seen many others receive their final days with the same hands.\n\n Tewi stopped before a small stone tablet carved with a rabbit's head, pointing to the almost invisible narrow path on the right. “Go straight from here, and you'll reach Eientei.\n\n A quarter of an hour.” Youmu looked at her.\n\n “Aren't you coming with me?”\n\n “I belong to the bamboo forest, not to those medicine bottles.” The Empress took two steps back, her rabbit ears swaying gently in the morning light. “But after you finish your work, I can teach you how to bypass Reisen's blind spots. The price is negotiable.”\n\n She then disappeared into the bamboo shadows, leaving only a sentence drifting back from afar:\n\n “Be careful, Master. What Reisen gave you yesterday wasn't an opportunity, but an arithmetic problem. Those who get it wrong will truly die.”"


 love_story.5.t:0 "Bamboo Shadows Lost (Part 2)"
 love_story.5.d:0 "Eientei's backyard was piled high with wooden crates.\n\n Medicine bottles, bandages, and dried herbs were packed in separate crates. Several transport vehicles were parked outside the shed, one of their wheels still bearing traces of dried blood. Reisen stood among the crates, now back in Eientei's uniform. Without her straw hat to conceal her eyes, her red eyes were even sharper than the night before.\n\n She glanced at the sky. “Arrived twelve minutes early.”\n\n “Someone led the way.”\n\n Reisen's gaze fell on the mud on Youmu's hem.\n\n “Tewi dug this pit?” “She said it was an inspection.”\n\n “She just thought it was interesting.”\n\n Reisen turned and pointed to the area under the shed. “Clean the mud off. The medicine box can't get dirty.”\n\n Youmu didn't move immediately. She first noticed a small wooden box in the corner with the old man's name written on it, and neatly arranged medicine for the next three days inside. “You're ready.”\n\n “I calculated that you would come.”\n\n “What if I don't come?”\n\n “The medicine will be redistributed at noon.”\n\n Youmu looked up.\n\n “You wouldn’t even wait half a day longer.”\n\n “Half a day is enough for another wounded person to worsen.” Reisen said, “Don’t call waiting kindness.”\n\n She pushed over the first wooden crate. It was quite heavy, and the lid was drawn with the route to Youkai Mountain.\n\n “We're delivering to three places today. The first is the Human Village, the second is at the foot of the mountain, and the third was attacked last night. You're in charge of carrying and protecting them. You can stop if you encounter wounded people; you can't stop if someone tries to cut in line.\n\n One medicine box is missing, and the old man's medicine will be one day short.”\n\n “What if someone collapses on the road?”\n\n “First, determine if they can be moved.”\n\n “If they can?”\n\n “Bring them back.”\n\n “That will delay the medicine delivery.”\n\n “So you must decide whether the person in the box is more likely to survive, or the person on the roadside.” Youmu stared at her.\n\n “You're pushing your choice onto me.” “No.” Reisen slung another wooden crate over her shoulder.\n\n “I'll make you understand why last night you couldn't just say “He's still alive.”” Silence fell between them again. Youmu bent down and lifted the crate, her movements clean, yet heavier than necessary.\n\n “I won't become your tool.” “Good.”\n\n Reisen checked the knot on her shoulder. “A tool won't change its mind on the roadside. You will. After you change, remember to see who didn't get the medicine because of it.” Youmu tightened the rope around the crate.\n\n “I'll bring both the person and the medicine.”\n\n Reisen didn't praise her, but simply pushed open the courtyard gate.\n\n “Everyone who comes here for the first time says that.”\n\n Morning light streamed through the bamboo grove, falling between the medicine chests piled high in the courtyard and the two swords carried on their backs.\n\n They hadn't yet understood each other, nor forgiven one another. The only certainty was that three places awaited them today, and whether the old man could continue taking his medicine on the fourth day would be determined by this path."
 love_story.5.a:0 "Work begins"

  love_story.6.t:0 "First Journey of Medicine (Part 1)"
 love_story.6.d:0 "After the courtyard gate opened, Reisen didn't give Youmu time to adjust.\n\n She took six bottles from the medicine chests and placed them into three wooden boxes. One bottle, for treating fever, was deliberately placed among the hemostatic medicines; the labels were almost identical in color. “Seal the boxes.” Youmu didn't comply.\n\n She picked up the medicine bottle and put it back in its correct place. “This one's in the wrong place.”\n\n “I put it there.” “I did.”\n\n “That's wrong too.”\n\n Reisen glanced at her and pressed the bottle down firmly. “Very good. From now on, if I'm wrong, I'll stop. People who only obey shouldn't touch medicine.” Next came the weight.\n\n Youmu hoisted the two wooden boxes onto her shoulders and carried them up the narrow staircase to the second floor. At the corner, a young apprentice carrying freshly brewed medicine hurried downstairs, their sleeve caught on a door hook, causing the tray to tilt. Youmu put down the wooden box, supporting the medicine bowls with one hand and steadying the young apprentice with the other. A few drops of soup splashed onto the back of her hand, but neither bowl broke.\n\n Reisen stood at the bottom of the stairs, offering no praise.\n\n “Why take the medicine first?” “If it breaks, the patient won't have a second bowl.”\n\n “Why not help the person first?”\n\n “He can stand.” Reisen nodded. “Continue.”\n\n Before noon, the three medicine boxes were finally loaded onto the truck. The first location was the East Village mentioned last night, where three poisoned children were waiting for the antidote; the second was the wounded soldiers' camp in Human Village; the third was at the foot of Youkai Mountain, which had been attacked the previous night.\n\n Youmu gripped the cart shaft. “You're going too?”\n\n “I don't give medicine to someone on their first day.”\n\n “Don't you trust me?”\n\n “I don't trust anyone who hasn't finished this journey.” The two left the bamboo forest one after the other.\n\n There was no conversation on the road, only the sound of wheels rolling over gravel. Not long after leaving the north side of the village, Youmu suddenly stopped. Ahead, in the grass, lay a man covered in blood, a gray cloth tied around his waist—the mark of the bandits who attacked Eientei's medicine cart.\n\n Reisen only glanced at him. “Don't stop.\n\n The medicine for East Village must be delivered before sunset.”"
 love_story.6.a:0 "The road requires them to choose for the first time."


 love_story.7.t:0 "The first medicine route (Part 2)"
 love_story.7.d:0 "Youmu had reached the injured man.\n\n The man had been stabbed in the abdomen, blood soaking his clothes, and a nicked dagger lay beside him. He recognized Eientei's first-aid kit and instinctively reached for it, but he didn't even have the strength to lift his arm.\n\n “He was involved in last night's attack,” Reisen said. “So?”\n\n “So he knew there were medicines in the car, that's why he lay down by the roadside.”\n\n Youmu pressed on the wound, and blood immediately gushed from between his fingers.\n\n “He can still be saved.” “There are three children in East Village who can also be saved. If we waste time here, the antidote will arrive late.”\n\n “Give me your box. You take two boxes and go first. I'll take him to the nearby clinic and then catch up.”\n\n Reisen's voice turned cold. “The two boxes are heavier than you think. If I lose them on the way, I won't be able to get the medicine from either place.”\n\n “Then do you have a better way?”\n\n Reisen didn't answer. Youmu had already torn off a sleeve to press against the man's wound and then tightened her wooden box again.\n\n “You said that after changing your decision, you should make sure who didn't get the medicine because of it,” Youmu looked up at her. “I won't let anyone else bear the consequences of this choice.”\n\n After a moment of silence, Reisen took the medicine box off Youmu's shoulder and tied it to her own.\n\n “Half an hour,” she said. “If it's past half an hour, don't chase after me, just go back to Eientei.”\n\n “That's enough.” The two parted ways. Reisen headed to East Village alone with the two boxes of medicine, while Youmu carried the injured child and ran along the side road to the nearest clinic.\n\n As the sun set, all three children had taken the antidote. Youmu also returned to Eientei before the last rays of sunlight disappeared, her shoulders stained with the injured child's blood.\n\n The bandit lay in the side courtyard, Reisen stitching up his abdominal wound. He recognized her when he awoke and shrank back to the corner of the bed in terror.\n\n “Don't move,” Reisen said, pressing him down. “The stitches will break.”\n\n Youmu stood in the doorway.\n\n “You still saved him.”\n\n “Because you brought him back.” “He stole your medicine.”\n\n “This won't let his blood flow back into his body on its own.” Reisen cut the stitches, washed her hands, and took a medicine bottle from the cabinet, handing it to Youmu.\n\n The bottle had the old man's name written on it. “Day four.”\n\n Youmu took the medicine but didn't leave immediately.\n\n “No one died today because I stopped.” “Not this time.” Reisen looked at her. “Don't assume you can always have both sides.”\n\n “I'll try.” “Trying isn't a guarantee.”\n\n “But it's better than giving up in the first place.”\n\n Reisen didn't argue. She turned to look at the person who had taken her medicine, while Youmu put the fourth day's medicine into her pocket. They still disagreed with each other, but they already knew that the other would truly bear the consequences of their choices."
 love_story.7.a:0 "On the first day, no one was abandoned."


 love_story.8.t:0 "The Stolen Night Dew (Part 1)"
 love_story.8.d:0 "On the eleventh night, two bottles of night dew were missing from the medicine storehouse.\n\n Reisen re-inspected the wooden shelves, confirming the seals were intact, and then extinguished the outer courtyard lights, leaving only one lamp in front of the medicine storehouse door. Youmu guarded the side door. Less than a quarter of an hour later, a young youkai rabbit emerged from behind the woodshed, tightly clutching the two medicine bottles in his arms.\n\n Reisen reached out. “Give it to me.” The medicine boy did not move. “Grandma can’t see well lately. She fell down the steps last night, her forehead was covered in blood…\n\n I just want her to use it once, and I’ll put the bottle back tomorrow.”\n\n “Used medicine can’t be put back.” “She just wants to see things!” “There are two other people waiting for these two bottles of medicine tomorrow.” Reisen’s voice was flat. “When you took it, did you think about whether they would have an attack tonight?”\n\n The pharmacist’s tears fell on the bottle cap, but he still wouldn’t let go. Youmu took a step closer.\n\n “Go see his grandma first.”\n\n “Put the medicine back first.”\n\n “What if she falls again tonight?” Reisen looked at Youmu. “If we give her the medicine, what about the person waiting to take it tomorrow?”\n\n “Let's see her first before deciding.”\n\n “Is it your “try to protect both sides” strategy again?”\n\n “Yes.” Reisen paused for a moment, then took one bottle from the boy's arms, leaving the other in his hand.\n\n “Lead the way.”\n\n The boy was stunned. “I haven't agreed to give it to her yet.” Reisen picked up the medicine box. “Until the cause of the illness is determined, you won't even know what you've stolen.”\n\n The three walked along the animal path into the night. The boy walked quickly, nearly tripping over tree roots several times. Youmu helped him up once, while Reisen never urged him on, only offering directions when they passed a fork in the road.\n\n At the end of the bamboo grove, a low wooden house glowed with a dim yellow light. Dried bloodstains remained beside the threshold. An old woman sat on the edge of the bed, reaching for a bowl of water nearby.\n\n Reisen put down her medicine box and walked to her.\n\n “Look up. Look at the lamp.”"
 love_story.8.a:0 "First, see the patient clearly, then decide who the medicine belongs to."


 love_story.9.t:0 "The Stolen Night Dew (Part 2)"
 love_story.9.d:0 "Reisen examined the old woman's eyes and then had Youmu move the oil lamp from the left to the right.\n\n The old woman could see the light, but couldn't discern the difference in height between the threshold and the ground. Reisen took a small, clear lens from her medicine box and adjusted it in front of the old woman's eyes.\n\n “Night Dew only provides temporary relief, it won't cure the problem,” she said. “Continued use will make her eyes even more sensitive to light. Stealing two bottles will only make her fall harder in a few days.”\n\n The apprentice lowered his head.\n\n “I don't know...”\n\n “So you can't decide on the medicine.” Reisen ultimately only took a small amount of the medicine from the bottle and treated the old woman's eye inflammation. Afterward, she had Youmu lower the threshold and move the oil lamp to a position where the old woman could easily see it. The apprentice was then ordered to nail a handrail to the wall.\n\n After finishing, the old woman walked twice, leaning against the wall for support. She still couldn't see Youmu and Reisen's faces clearly, but she was already able to cross the threshold on her own.\n\n Reisen retrieved the remaining medication. “Work for Eientei for ten days starting tomorrow.\n\n You'll have to make up for the time you stole from the pharmacy.”\n\n The apprentice nodded vigorously.\n\n “Won't there be a public punishment?” Youmu asked on the way back.\n\n “I need him to learn to judge, not for everyone to watch him be humiliated.”\n\n “You didn't take both bottles of medicine back either.”\n\n “The little bit used wasn't for him.” “I know.” Youmu looked ahead, “It was for the patient.”\n\n Reisen turned her head.\n\n “This isn't something to be praised for.”\n\n “I didn't praise you either.” The two continued forward. After walking a short distance, Youmu said again, “But you didn't calculate who should be abandoned today.”\n\n “I did,” Reisen replied.\n\n “And the result?” “The risk of one bottle of medicine being misused, the risk of two patients running out of medication tomorrow, the risk of an old woman falling again tonight.” Reisen paused. “In the end, we found that what really needed to be changed wasn't the dosage, but her threshold.”\n\n Youmu nodded gently. She finally began to understand that Reisen's coldness wasn't always about rejecting anyone. Sometimes, it was simply that she refused to cover up the real problem with a comforting word.\n\n And Reisen also realized for the first time that Youmu's insistence on reaching out to patients wasn't just out of soft-heartedness. Seeing things firsthand often revealed answers that weren't on paper."
 love_story.9.a:0 "They still argue, but they've started to go see the three medicine routes together."


 love_story.10.t:0 "Three Medicine Routes (Part 1)"
 love_story.10.d:0 "On the twenty-third day, Eientei finally received the two materials needed for the new medicine.\n\n The Palace of the Earth Spirits agreed to provide red sand from Former Hell, and Youkai Mountain collected evening primrose growing on high cliffs. If both items could be returned today, Eirin could prepare the next batch of medicine, including the amount needed by the old man.\n\n Reisen and Youmu set off with three wooden boxes. Their first stop was Keine's school. The fever from the previous days hadn't completely subsided, and a dozen children were lying in the classroom. Fujiwara no Mokou was boiling water outside in the courtyard.\n\n A mother saw the medicine boxes and immediately rushed up, grabbing Youmu's sleeve.\n\n “Save my child first!\n\n She had a fever all night!” The others immediately gathered around. Reisen didn't raise her voice, only opening the first box.\n\n “The seriously ill are on the left, those who have already taken medication are on the right.\n\n Those without a diagnosis, line up outside.” No one listened to her. Youmu drew her sword half an inch, then sheathed it.\n\n The cold glint of the blade was enough to silence the crowd.\n\n “Stand as she says.” The line quickly parted. Reisen checked each child's condition, while Youmu memorized each child's symptoms. The mother who rushed forward first ended up third in line; Reisen didn't change the order because she cried louder, nor did she delay her because of her rudeness.\n\n After all the medicine was distributed, Keine saw them to the door.\n\n “You handled it faster than last time,” Reisen said.\n\n “She quieted the crowd.”\n\n Youmu added, “She didn't retaliate because that mother tried to take the medicine.”\n\n Keine glanced at the two of them, her smile faint. “It sounds like you already know where to look at each other.”\n\n The next section of the path led to Former Hell. A gust of hot air rushed up from the abandoned well, and Youmu, carrying an empty box, went down first. Reisen didn't remind her which step to take, but simply handed her the other end of the rope."
 love_story.10.a:0 "On the twenty-third day, they no longer needed to explain every movement."


 love_story.11.t:0 "Three Medicinal Paths (Middle)"
 love_story.11.d:0 "The stone corridor of the Palace of the Earth Spirits was much hotter than the ground. Rin Kaenbyou had already filled the red sand into an iron box and was squatting in front of the door waiting for them.\n\n “You've come at the right time,” Rin said, pushing the iron box over. “A section of the mountain wall collapsed just now.\n\n If you had been any later, you would have had to take a detour around the furnace.”\n\n Reisen checked the seal, while Youmu looked up at the corridor ceiling where rubble was constantly falling. Satori Komeiji walked out of the hall.\n\n Her third eye first looked at Youmu, then moved to Reisen. “It's strange,” Satori said. “You still think the other's actions are problematic, yet you both assume that she won't abandon you when danger arises.”\n\n Youmu didn't answer. Reisen secured the iron box tightly.\n\n “Mind reading won't restore the path.” “Of course not,” Satori smiled.\n\n “So I'm just reminding you, the exit is about to collapse.” Just then, a muffled crash echoed from afar. One side of the stone corridor began to crumble, the exit cut off in half by the rubble. Rin immediately summoned several fire cats to carry the iron box, while Youmu drew her Roukanken and severed the collapsing stone pillar. Reisen didn't retreat; she rushed to Youkai, who was trapped under the rubble, and knelt to check her injuries.\n\n “Right leg fracture, no major bleeding. Youmu, hold on above.”\n\n Youmu used the back of her sword to brace against the tilting stone beam.\n\n “How long?”\n\n “Give me three minutes.”\n\n “Only two minutes.”\n\n “Two minutes it is then.” Reisen stabilized the injured leg and dragged the wounded man away. Only when the last iron box was sent through the gap did Youmu sheathe her sword and leap out.\n\n The stone beam behind her immediately collapsed, and dust filled the entire passage. After returning to safety, Reisen found that Youmu had a cut on her arm from the rubble.\n\n She immediately tore open her sleeve to clean it for her.\n\n “It's just a small wound,” Youmu said.\n\n “It's not like that after infection.”\n\n “The medicine wasn't lost.”\n\n “You shouldn't have lost it either.” After saying this, Reisen paused for a moment. Youmu looked at her, not arguing as usual, but quietly handing her arm to her for bandaging.\n\n Satori stood at a distance, taking in this scene, but said nothing more."
 love_story.11.a:0 "Some trust doesn't need to be spoken."


 love_story.12.t:0 "Three Medicinal Paths (Part 2)"
 love_story.12.d:0 "After leaving Former Hell, they headed towards Youkai Mountain.\n\n The bridge at the foot of the mountain had been partially destroyed by the storm the previous night. Momiji Inubashiri stood guard on the opposite bank, evening primrose in a bamboo basket beside her.\n\n The current under the bridge was too strong for ordinary transport vehicles.\n\n Reisen looked at the sky. “The detour will take two hours.”\n\n “The herbs can't wait.” Youmu untied the rope from her waist. She secured one end to a tree and handed the other to Reisen. Youmu first crossed the broken section of the bridge, then received the rope from Momiji.\n\n Reisen tied the red sand iron box to her front and slowly made her way forward on the remaining bridge. As Reisen reached the center, a plank suddenly broke. She lost her footing and plummeted towards the water. Youmu pulled the rope taut, her hands bleeding from the rough fabric. Reisen steadied herself in mid-air, not crying out, but simply lifting the iron box she was carrying upwards.\n\n “Get the herbs first!” “Grab my hand first!” Youmu bent down and grasped her wrist, while Momiji pulled the rope taut from the other side. Together, the three of them dragged Reisen onto the bridge, the iron box still firmly clutched to her.\n\n Reisen's first action after sitting up was to check the seal.\n\n Youmu held her hand.\n\n “You're not injured?”\n\n “No.” “Then let's look at the medicine.”\n\n Reisen glanced at her but didn't refute. Evening primrose and red sand were returned to Eientei before nightfall. Eirin took out a small amount of materials to test and quickly concluded: “It can make twenty-seven doses.”\n\n Youmu looked at Reisen. “What about the old man?”\n\n “Enough for another month.”\n\n “So I did it.” “We did it.” Reisen corrected her, “The herb-gathering rabbit, the Palace of the Earth Spirits, the white wolf tengu, and you.\n\n Not one less.” Youmu didn't argue. This time, she understood how many other hands were beyond the medicine box.\n\n The forty-day contract wasn't over, but the old man, initially judged to have only three days' worth of medicine, could now walk outside, supporting himself on the doorframe.\n\n As she left Eientei, a warm yellow light shone from the bamboo grove. The aroma of grilled fish and rice wine wafted from the Night Sparrow Dining Hall. Youmu stopped, and Reisen, unusually, didn't urge her to continue.\n\n “Sit for a bit?”\n\n Youmu asked. Reisen glanced at the medicine box behind her.\n\n “I can today.”"
 love_story.12.a:0 "No need to race against time tonight"


 love_story.13.t:0 "Bamboo Lantern and Small Mat (Part 1)"
 love_story.13.d:0 "The Night Sparrow Diner only had a few low tables. Mystia was grilling eel by the stove, while Wriggle hung a glass bottle filled with fireflies on the eaves.\n\n “Eientei's cold-faced rabbit actually comes to drink?” Mystia saw Reisen and immediately laughed, “And with Hakugyokurou's swordswoman by her side. Did the moon rise from underground tonight?” “A pot of rice wine, two bowls of hot soup.”\n\n Reisen put down her medicine box, “The wine shouldn't be too strong.”\n\n Youmu looked at her. “You're deciding for me?”\n\n “You still have to move medicine tomorrow.”\n\n “The contract is mine.”\n\n “The hangover is yours too.” Mystia suppressed a laugh as she brought over the wine. Wriggle placed a firefly lamp at their feet and glanced at Youmu's bandaged arm.\n\n “Got into trouble again today?”\n\n “The bridge broke,” Youmu said.\n\n “She almost fell into the river.”\n\n “The herbs didn't fall,” Reisen added.\n\n Youmu frowned. “I grabbed you first.”\n\n “I know.” This answer was too direct, leaving Youmu momentarily speechless. She lowered her head to drink her soup, while Mystia already wore an amused expression.\n\n After drinking about half a glass of wine, Youmu brought up the initial argument.\n\n “I still think you're cold.” “I know.”\n\n “You'll tell the patient in front of him that the medicine should be given to someone else.”\n\n “I'll also tell him why.”\n\n “That won't make things any better.”\n\n “But at least it won't make him wait for a non-existent miracle.”\n\n Youmu gently swirled her glass. “I used to think you were just good at giving up.”\n\n Reisen's rabbit ears lowered slightly.\n\n “And now?”\n\n “Now I know that every time you give up on someone, you remember what you did.” Youmu looked up. “That's why you put yourself last.”\n\n Reisen remained silent for a long time before picking up her glass.\n\n “I used to think you would only rush towards the person in front of you.”\n\n “And now?”\n\n “You'll fill the void yourself, without asking others to bear it for you.”\n\n The two glasses gently clinked together. They didn't apologize, nor did they say who changed whom. The argument that started with the seven pills still existed, only it no longer separated them."
 love_story.13.a:0 "They finally started talking about their initial argument."


 love_story.14.t:0 "Bamboo Lantern and Small Mat (Part 2)"
 love_story.14.d:0 "After the second cup of wine, Youmu became noticeably more talkative.\n\n She talked about winter in Hakugyokurou, about the endless snow, and about how Yuyuko would always casually ask for an extra bowl of rice when she was busiest.\n\n “Why have you stayed there all this time?”\n\n Reisen asked. “Because the dead don't always find their own place,” Youmu replied. “Some die too quickly, without even knowing what they wanted to say in their last moments; some are held back by the living, unwilling to leave. I protect Lady Yuyuko, and I also prevent anyone from using them as tools.”\n\n Reisen looked at the liquid in her glass.\n\n “Even if the dead can bring someone back to life?”\n\n Youmu didn't answer immediately.\n\n “Even so, we should ask if he's willing first.”\n\n “The dead don't answer every question.” “That doesn't mean the living can answer for them.”\n\n The brief disagreement silenced the table. Mystia didn't approach, and Wriggle walked to the other side with her lantern.\n\n Youmu countered, “Why do you follow Eirin?”\n\n “Because she saved me.”\n\n Reisen spoke calmly, but her fingers didn't touch her glass again.\n\n “When I escaped from Lunar Capital, I was injured and had no right to ask anyone to take me in. She didn't ask if it was worth it, just told me to lie down and then treated my wounds.”\n\n “So you also want to save others.”\n\n “I just don't want to see anyone die in front of me because of orders, hesitation, or a nice word.” Youmu looked at her.\n\n At that moment, for the first time, she saw that Reisen's indifference wasn't empty, but rather a facade concealing many things she didn't want to remember.\n\n “I like that about you,” Youmu said. Reisen looked up.\n\n “What?” “You don't comfort people with lies.”\n\n “That's usually not well-received.”\n\n “I didn't ask anyone else.”\n\n Reisen's ears twitched. She picked up the pitcher and replaced the drink in front of Youmu.\n\n “You're drunk.”\n\n “No.”\n\n “You just said you liked me.”\n\n Youmu paused, then looked directly at her.\n\n “I remember.”"
 love_story.14.a:0 "This sentence won't disappear with the effects of alcohol."


 love_story.15.t:0 "Bamboo Lamp and Small Seat (Part 2)"
 love_story.15.d:0 "When leaving the dining hall, Wriggle lent them a firefly lamp. The path in the bamboo forest was illuminated by a pale green light, and Mystia's singing gradually faded behind them.\n\n Youmu walked a little slower than usual. When she crossed a slippery stone step, she stumbled half a step, and Reisen reached out to support her arm.\n\n “I'm not drunk,” Youmu said. “I didn't ask.”\n\n Reisen didn't let go immediately. After walking a section of the stone steps, she removed her hand and handed her shawl to Youmu. “It's cold at night.”\n\n “And you?”\n\n “I'm used to it.”\n\n Youmu took the shawl without saying she would return it later. She simply draped one side over Reisen's shoulder, and the two continued on, sharing the same cloth.\n\n When they reached the fork in the bamboo forest, Youmu suddenly asked, “And after forty days?”\n\n “The contract ends. The old man has new medicine, and you don't need to come anymore.”\n\n “I wasn't asking about the contract.”\n\n Reisen stopped. Fireflies floated slowly in the glass bottle, casting their shadows among the bamboo leaves. Youmu didn't repeat the words, nor did she, emboldened by alcohol, declare her love again.\n\n Reisen remained silent for a long time, finally pointing to the road leading to Eientei.\n\n “Forty days from now, this road won't disappear.” This wasn't a promise, nor did it answer what they would become.\n\n But Youmu understood.\n\n “Neither will the road to Hakugyokurou.” The two continued forward. This time, neither walked behind the other. They walked shoulder to shoulder, sharing a shawl, occasionally brushing arms because the road was too narrow, yet neither made a conscious effort to avoid it.\n\n The original contract still lies in Eientei's cabinet, detailing the lateness, the dosage, and forty days' work. Not a single line mentions today's sake, the lent shawl, or where the two seemingly unrelated paths will meet.\n\n These things don't need to be written into the contract."
 love_story.15.a:0 "Forty days later, the path will still exist."


 love_story.16.t:0 "Snow Garden Asks Flowers (Part 1)"
 love_story.16.d:0 "As the forty days drew to a close, Eirin handed Reisen an empty medicine bottle.\n\n The bottle contained not ordinary medicine, but the “Soul-Returning Flower” from the depths of Hakugyokurou. After the war, some survivors had recovered physically, but their souls were gradually dissipating; they would return to the battlefield at night, waking up unable to recognize their loved ones, and eventually even forgetting their own names.\n\n Eirin discovered that the morning dew on the Soul-Returning Flower could temporarily stabilize this symptom.\n\n Youmu personally led Reisen into Hakugyokurou. Snow covered the courtyard, and in the distance grew a patch of almost transparent flowers. Yuyuko sat under the veranda, still wearing a faint smile after hearing the purpose of their visit.\n\n “How much do you want to take from here?”\n\n “Two bottles of morning dew, without uprooting the flowers or damaging the roots,” Reisen replied.\n\n “Enough to confirm the medicine's effectiveness.” “These flowers grew from the unfinished words of those who died in battle.” Yuyuko looked at the flower field. “With each part taken, those words may disappear forever.\n\n Whose regrets are you prepared to use to heal the living?”\n\n “If two bottles of morning dew can save lives, I will take them.” Youmu immediately looked at her. Reisen did not avoid that gaze. “I will first look for flowers without souls attached.\n\n If there's no time, and the patient's condition is worsening, I will still choose the living.”\n\n Yuyuko gently put down her teacup. “Even if the dead don't answer?”\n\n “The dead won't come back to life just because I keep my hands clean.” Youmu's hand rested on the White Tower Sword.\n\n “And we can't take what they left behind just because they're dead.” “What about those still waiting for medicine in Eientei?” Reisen turned to her, “Tell them that because the dead here can't answer, they must continue to lose themselves?”\n\n Neither of them raised their voices, yet for the first time, they truly stood opposite each other.\n\n Yuyuko didn't stop them. She simply raised her fan and pointed to the flower field.\n\n “Go and see. After you've seen it, tell me what you each want to take with you.”"
 love_story.16.a:0 "This time, they had to face each other's answers."


 love_story.17.t:0 "Snow Pavilion Asks Flowers (Part 2)"
 love_story.17.d:0 "There was no wind in the flower field, yet the petals trembled gently.\n\n Youmu told Reisen that each fallen flower, a symbol of resurrection, was associated with an unfinished story. Some hadn't returned to their hometowns, some hadn't had time to apologize, and some, even on their deathbeds, were still repeatedly calling out the names of their loved ones.\n\n Reisen squatted before a flower. A drop of morning dew clung to the stamen, transparent as an ordinary water droplet.\n\n She had just taken out the medicine bottle when Youmu grasped her wrist.\n\n “There's someone here.”\n\n “I can't see them.” “Not seeing them doesn't mean they don't exist.”\n\n “The patients in Eientei aren't here either.” Reisen looked up at her, “They exist just the same.”\n\n Youmu didn't let go. “The dead are not spare medicine.”\n\n “The living should not be left in sickbeds just because we are afraid to touch death.” “Is this fear?” “For me, yes.” Reisen answered quickly, “Fear of resentment from those left behind after making a choice. Fear of admitting that we can't save everyone.\n\n So we call doing nothing respect.”\n\n Youmu's fingers tightened for a moment. “I am half-human, half-phantom,” she said, “I have seen the living divide up belongings and change last words in front of the dead, describing a still conscious being as already finished. You are afraid of not having enough time to save people, I am afraid that someone has died once and then been erased from the world a second time.”\n\n Reisen looked at the entire flower field.\n\n For the first time, she didn't see the flowers as mere vases. “When Lunar Capital retreated, I left some people behind too,” she whispered. “I don't know what they said in the end. Even now, I still wonder if I had the right to take what they left behind if it could save lives.”\n\n “I can't answer for them.” “I know.” “But I can't ask you to forget those still waiting for medicine.”\n\n Reisen looked at Youmu. They still hadn't reached the same conclusion, but the sharpness of their argument had shifted. Youmu finally saw that every time Reisen chose a survivor, those she had left behind were behind; Reisen finally understood that Youmu's protection of the dead wasn't about dwelling on the past, but about not allowing any life to lose its dignity after losing its voice.\n\n At that moment, a very soft voice came from the flower. “Please... tell him... go home.”"
 love_story.17.a:0 "They didn't agree, but they finally understood."


 love_story.18.t:0 "Snow Garden Asks the Flower (Part 2)"
 love_story.18.d:0 "The spirit attached to the flower was a young soldier.\n\n He died on a mountain path in the last few days of the war, while his younger brother was sent to Eientei. The living man's body had recovered, but his soul remained stuck on the night the two were separated.\n\n “He is one of those waiting for the broken flower to return to life.” Reisen recognized the description in the medical record.\n\n Youmu knelt before the flower, letting the spirit repeat the words it hadn't finished saying. The sentence was short: The war is over, there's no need to look back for him, go home.\n\n Reisen didn't take out the medicine bottle. She memorized the entire sentence first, then asked, “Your brother needs this drop of morning dew. Would you like to leave it for him?”\n\n The petals gently closed. The soul fire clinging to it rose from the flower's stamen, lingered briefly in Youmu's palm, and finally flew into the depths of Hakugyokurou.\n\n After the soul fire left, the drop of morning dew slid down on its own. Youmu caught it with a white cloth and handed it to Reisen.\n\n “Now you can.” Reisen didn't immediately accept it.\n\n “Because he agreed?” “Because it was left behind by him, not taken by us.”\n\n The two returned to the corridor with the morning dew. After hearing what had happened, Yuyuko allowed Eientei to continue into the flower field, but with three conditions: not to pick the flowers, not to disturb the spirits that did not wish to appear, and only to take the morning dew that fell on its own after its last wish was answered.\n\n Reisen accepted. Before leaving, Youmu asked her, “If the patient can't wait any longer, and the deceased still hasn't answered, will you still take it?”\n\n “Yes.” Reisen didn't lie, “I will save the person first, and then remember what I took.”\n\n Youmu lowered her eyes.\n\n “I'll still stop you.”\n\n “I know.”\n\n “Aren't you angry?” “Yes. But I know now, you're not trying to stop the living.”\n\n Youmu looked at her. “I also know, you're not doing it out of contempt for the dead.”\n\n They still stood in different places. Youmu believed death couldn't take away the right to choose; Reisen believed that a life that could still be saved shouldn't be lost because of hesitation. Neither was convinced, and neither answer became superior to the other.\n\n But when they walked out of Hakugyokurou together, Reisen handed Youmu a bottle of medicine containing morning dew for safekeeping, and Youmu took the medicine box from Reisen's shoulder.\n\n One person upheld the wishes left by the deceased, while the other rushed back to save those still waiting. For the first time, they understood why their paths diverged, and for the first time, they were willing to walk together."
 love_story.18.a:0 "They didn't stand on the same side, but finally saw each other clearly."

 love_story.19.t:"A rare, uneventful day"

 love_story.19.d:"Several days after returning from Hakugyokurou, Youmu arrived at the village as promised. Reisen was already sitting at the noodle stall at the street corner, with two bowls of freshly served soup noodles on the table.\n\n “I'm not late, am I?” “No.\n\n Sit down and eat while it's hot.” Just as Youmu picked up her chopsticks, she saw someone walking towards her from across the street. Yuuka Kazami, carrying a flowerpot covered with a black cloth, stopped beside Eientei's medicine delivery cart. Several rabbit spirits were unloading the goods, and one of them was about to go back to report when Yuuka stopped her with a gesture.\n\n “No need to go.\n\n The person I'm looking for has already arrived.” Yuuka walked to the table and lifted a corner of the black cloth. The flower in the pot hadn't withered, but its petals were now almost transparent white, and the edges of the leaves were still covered with a layer of fine silver dust.\n\n “It can bloom again every day, but it loses its color at sunrise, and even the fragrance left from the previous day disappears.” Yuuka covered the pot with the black cloth again. “I can make the flower continue to grow, but I can't find what's hidden inside.\n\n That scent comes from the moon, so I must see Eirin Yagokoro.” Reisen didn't reach out to touch the flowerpot; she only turned and called to the youkai rabbit who was still carrying the medicine box.\n\n “Put down the boxes you're carrying first, and lead Yuuka Kazami along the bamboo path on the east side.\n\n When you reach Eientei, inform the master immediately, and don't give the flowers to anyone else.”\n\n The rabbit glanced at the unloaded cargo: “What do we do here?”\n\n “The next team will handle it. Lead the way.” Yuuka nodded slightly, tightening the black cloth a little: “Eirin only needs to find the cause of the illness for me.\n\n How to make it bloom again is my responsibility.” She followed the rabbit away. Youmu looked towards the bamboo forest, then looked at Reisen.\n\n “Are you sure you don't need to go back together?” “If Master needs me, she'll naturally have them call me.” Reisen pushed the slightly cooled noodle soup back to Youmu. “Eat now. If you leave it in any longer, the noodles will get soggy.”\n\n Youmu took a bite, then quickly finished. Reisen finally picked up her chopsticks. The afternoon streets were still bustling.\n\n The medicine delivery truck continued unloading, and the stall owners continued serving customers; the earlier little incident was quickly drowned out by the noise."

 love_story.19.a:"Finish this bowl of noodles first."


  love_story.20.t:"It's a bit too noisy here."

 love_story.20.d:"Just as the two bowls of noodle soup were almost empty, a shout suddenly came from the street corner.\n\n Cirno held up an ice rabbit, declaring it the only ice sculpture in the Human Village that would never melt. Clownpiece, clutching a tightly wrapped torch, immediately declared that if she were allowed to light it just once, she would prove it was nothing special.\n\n “Wait until you leave the Human Village to light it,” Hecatia said, pressing down on Clownpiece's hat. “If you drive the whole street crazy, I'll be the one who gets the bill.”\n\n Cirno, hearing that she wasn't allowed to light the torch, immediately took it as a victory and chased after her, ice sculpture in hand. The two fairies ran around the noodle stall, nearly bumping into the waiter carrying soup. Youmu reached out to steady the tray, while Reisen quickly tucked the medicine packet on the table into her sleeve.\n\n On the opposite signboard, Seija Kijin watched the commotion with her hands behind her back.\n\n The words “Climbing Prohibited” were flipped upside down by her. “Even Hell's goddess has to babysit?” she laughed. “Looks like you're not doing so well.” Hecatia hadn't paid any attention, but suddenly stopped as she passed the sign. She looked up, her gaze lingering between Seija's face and forehead for a moment.\n\n Seija, annoyed by her gaze, said, “What, Lunar Capital has sent wanted posters to Hell now?”\n\n “Not wanted posters,” Hecatia said. “I've seen you before.”\n\n Seija was still smiling, but slowly sat up straight.\n\n Hecatia continued, “In Lunar Capital. You were very young then.”"

 love_story.20.a:"Seija didn't immediately refute."


 love_story.21.t:"She didn't remember."

 love_story.21.d:"“You've mistaken me for someone else.”\n\n Seija jumped down from the signboard, answering crisply. She brushed the dust off her shawl, as if the movement were casual enough, the previous question wouldn't be worth pursuing.\n\n Hecatia didn't change her tune: “My body is in three places, but my memories are only one. The one who saw you is me on the Moon, and the one who remembers you is still me.”\n\n She thought for a moment: “The white corridor, outside the Purification Institute. Sagume was leading a child with long horns.\n\n The guard told the child to walk forward, but she insisted on walking backward, almost crashing into the wall behind her.”\n\n Seija chuckled: “Sounds like Lunar Capital has quite a few annoying brats.” “But only that one time, the entire row of moon rabbits suddenly forgot why they were guarding there.\n\n Sagume just led you past them.” Hearing the words “Purification Institute,” Reisen's ears twitched slightly.\n\n Seija immediately looked at her. “What is that place?” Reisen paused for a moment before answering, “It's for screening people who don't meet the purification standards.\n\n Some will be kept, some won't.” “Have you seen me there?” “No.\n\n I never heard of a horned child there before I left Lunar Capital.”\n\n Youmu asked, “What's the first thing you can remember?”\n\n Seija's smile faded slightly. “A ditch on the ground. I woke up covered in mud, with nothing around me.” She tugged at her shawl. “Further ahead, just emptiness.\n\n I always thought I'd forgotten, never considering that someone might have forgotten for me.”\n\n She looked at Hecatia again: “Why are you only saying this now?” “Because I only recognized you today.”\n\n Hecatia answered casually, “I thought you'd always remembered.” Clownpiece was already calling her from afar. Hecatia didn't press further, only saying before leaving, “Sagume rarely holds anyone's hand. I remember this because it's not like her.”\n\n Seija stood there until Hecatia was far away before turning to Reisen.\n\n “Is there any information left by Lunar Capital in Eientei?”\n\n “Some.”\n\n “Good.” She turned and left. Youmu watched her retreating figure and whispered, “Her “good” just now didn't sound good.”\n\n Reisen sighed, “Because it's definitely not.”"

 love_story.21.a:"She finally had a direction to follow."


 love_story.22.t:"The first page torn out"

 love_story.22.d:"Seija didn't immediately barge into Eientei. The next morning, she went to the old newspaper archive at Youkai Mountain and slammed a piece of paper with her name on it in front of Hatate Himekaidou.\n\n “Find out when this name first appeared on the ground.” Hatate glanced at the paper:\n\n “When asking for help, at least write your name correctly.”\n\n Despite her complaints, she opened the dusty old cabinet. The two flipped through old newspapers, wanted posters, and neighborhood security records. There were many records about Seija Kijin, but they all started after she was able to walk on her own. She had no birth, no relatives, and no one had ever seen her as a younger child.\n\n It wasn't until the afternoon that Hatate found a photograph in a roll of unorganized old negatives. The photo was taken on the east side of the village.\n\n A child with long horns huddled under a dilapidated shrine, her clothes covered in mud, clutching an empty cloth bag. Her face was obscured by rain and shadow, but the position of her horns was almost identical to Seija's. “Is this you?” Hatate asked.\n\n “With horns like that, it's hard to pass it off to someone else.”\n\n The photo was originally attached to an inquiry record, but that page had been neatly cut out.\n\n Next to the binding, only a line of handover instructions remained: Personal belongings and related records, to be handed over to Eientei for safekeeping.\n\n Hatate re-developed the photo, enlarging the pattern on the cloth bag. Hidden among the silver weave was a tiny circular mark, which didn't look like writing on the ground.\n\n That evening, Seija stopped Reisen, who was about to see Youmu off from the bamboo forest, with a photo.\n\n Reisen glanced at it and her expression turned serious: “This is Lunar...” The Capital used a closed transfer stamp.\n\n It has since been abolished. “Does Eientei have a corresponding record?”\n\n “The Master kept a part of the old index. I can't guarantee whether this copy exists.”\n\n Seija took back the photo:\n\n “Take me in.” Youmu looked at her:\n\n “From the front door?” “Why are you all so concerned about that door?”\n\n “Because if you ask first, they must at least answer you verbally.” Youmu said, “If you just barge in, you'll only get the guards' answers.”\n\n Seija stared at her for a moment, then finally stuffed the photo back into her sleeve.\n\n “Okay. Let's see what's behind the main gate first.”"

 love_story.22.a:"The three of them walked into the bamboo forest together."


  love_story.23.t:"Behind the main gate"

 love_story.23.d:"Seija did indeed enter Eientei through the front gate. She touched no medicine cabinet and opened no room without permission. She merely placed the photograph before Eirin Yagokoro.\n\n “I want this record.”\n\n Eirin moved the photograph beneath the lamp. She first examined the circular mark on the outside of the cloth wrapping, then studied the broken-moon pattern concealed at the centre of its silver design. She fetched two old indexes and checked their numbers page by page.\n\n After a while, Eirin closed the books.\n\n “There is no corresponding record.”\n\n The smile on Seija's face instantly cooled. “You cannot even be bothered to make the lie convincing?”\n\n “This numbering system was introduced after I left the Lunar Capital.” Eirin turned the photograph towards her. “If the child was born after my departure, she could not appear in the old files I brought to Earth.”\n\n “So Eientei knows nothing.”\n\n “About this child? Nothing.”\n\n Eirin placed a finger upon the centre of the silver pattern. “But the inner seal belongs to Sagume Kishin. The outer transfer format is recent; the personal seal at its centre is identical to the one she used in her early years.”\n\n Seija stared at the nearly invisible broken moon. “You have records about her.”\n\n “Only files from before I left the Lunar Capital. They record her office, her ability, and several exceptional cases. Your name will not appear.”\n\n “Give them to me.”\n\n “The original documents also concern the Lunar Capital's former defences and several people who have since left it,” Eirin said. “I will extract the portions concerning her personal seal and ability. You may examine them yourself before midnight.”\n\n Youmu nodded. “I'll stay and wait with you.”\n\n Seija did not sit down.\n\n “First you tell me there is no record of me. Then you decide which records about Sagume I am permitted to see.” She took back the photograph. “The Lunar Capital decides what I should forget, and you decide what I should learn. Remarkable coordination.”\n\n Reisen blocked the entrance to the inner courtyard. “Those are not your files.”\n\n “But they are the only lead I have found.”\n\n Neither yielded. After a moment, Seija turned towards the door.\n\n Youmu called after her. “You're not going to wait?”\n\n “Waiting is what I do worst.” Seija glanced back with a smile. “Don't worry. I certainly won't use the front gate again tonight.”"

 love_story.23.a:"Eientei had no record of her."


 love_story.24.t:"Flip Eientei over"

 love_story.24.d:"Before midnight, Eientei's eaves suddenly fell below the courtyard.\n\n Seija didn't pick the lock. She flipped upside down, stepping on the beams to cross the courtyard wall, and then reversed the direction of the two corridors, causing all the arriving youkai rabbits to pounce on the wrong courtyard.\n\n Reisen was already waiting outside the hideout. Several danmaku grazed the base of the pillars, leaving bright bullet marks on the real ground. Youmu ignored the leaning wall and only followed the phantom half to confirm the distance.\n\n Seija flipped the corridor to the left, and Youmu used her scabbard to block the oncoming door frame; she then made the flying danmaku reverse their path, and Reisen immediately shattered the point where the two bullet lines intersected.\n\n The three fought their way to the entrance of the storage room, neither willing to kill the other, nor to yield first. Seija gripped the brass ring on a drawer.\n\n Reisen's gun immediately stopped in front of her wrist.\n\n “Let go.”\n\n “Is Sagume Kishin's file in there?”\n\n “Yes. But that record ends before you were born.” “Then let me see what she did before I came along.”\n\n Reisen didn't move aside: “Inside are the old Lunar Capital defenses, the list of deserters, and Eientei's location record.\n\n Those are none of your business.” Seija gripped the brass ring tightly: “I didn't say I was taking it.\n\n I just don't accept you deciding what's related to me.”\n\n Youmu stepped between the two, the Roukanken still sheathed.\n\n “Eirin agreed to let you check it yourself.” “After she covers up all the parts she doesn't want me to see?”\n\n “At least let her bring the original scroll out first.”\n\n The sound of a cabinet door closing came from the storage room. Eirin came out carrying an old file, with several sheets of paper that had just been copied placed on top of it.\n\n “You're half an hour earlier than agreed.”\n\n She placed the old file on the table in the corridor. Pages involving unrelated individuals were sealed, while the rest remained untouched.\n\n “There's no record of you here,” Eirin said to Seija. “But everything that identifies the mark is here. You can look through it yourself; don't trust the copy I chose for you.”\n\n Seija glanced at the old file on the table and finally released the brass ring.\n\n Youmu first removed her hand from the hilt of her sword. Reisen then lowered her gun, still standing in front of the storage room door.\n\n Seija walked to the table and opened Sagume Kishin's file.\n\n Her name wasn't there."

 love_story.24.a:"It was an old file predating her birth."


 love_story.25.t:"Only Sagume's Name"

 love_story.25.d:"The first page of the old dossier bore Sagume Kishin's name and title. It had last been revised long before Eirin left the Lunar Capital.\n\n The dossier recorded that words spoken by Sagume could cause events to unfold in the opposite direction. To avoid interference from her ability, high-risk orders were normally conveyed not by speech, but by handwritten instructions bearing her personal seal.\n\n The appended pages catalogued several seals she had used. Seija placed the photograph beside them and quickly found the same broken-crescent design. The transfer number on the photograph's outer wrapper did not appear in the old dossier, but the central seal was identical.\n\n There was also an older incident report.\n\n Sagume had once ordered a squad of guards to remember a particular fugitive. The moment the order was spoken, everyone present forgot the fugitive's face. The name and wanted notice remained, but the guards could no longer connect that information to someone they had seen.\n\n Seija studied the page for a long time.\n\n “So she really could make people forget someone.”\n\n “The dossier proves only that her ability once produced that result,” Eirin replied. “It does not prove that she later did the same thing to you.”\n\n “But her name is on my transfer seal.”\n\n “Her personal mark is.”\n\n “Close enough.”\n\n Seija read to the end. The entire dossier contained no mention of a horned child, no secret transfer, and nothing that explained any connection between the two of them.\n\n “You truly have no other records?”\n\n “None,” Eirin said. “The photograph was transferred after I left. That part of history never reached Eientei.”\n\n “Then who can answer me?”\n\n “Sagume Kishin—or the postwar archives that may still survive in the Lunar Capital.”\n\n Seija closed the dossier and tucked the photograph back inside her clothes.\n\n “Are you going to the Lunar Capital?” Reisen asked.\n\n “Don't misunderstand. I'm not going there for a family reunion.” Seija walked past her. “I am going to ask that taciturn woman why her mark is on my transfer papers—and who made everyone who saw me forget me completely.”\n\n She stepped out into the courtyard, then glanced back at the eaves she had knocked askew.\n\n “You had better reinforce the door before I return.”\n\n After Seija left, Youmu and Reisen remained outside the storeroom, setting the scattered boards back in place one by one.\n\n Youmu spoke first. “She came through the front door in broad daylight, and all she received was ‘there is no record.’”\n\n “Because there truly is none.”\n\n “The truth can still sound like someone being shown the door.”\n\n Reisen was silent for a moment. “Next time, I will give her the rest of the clues first.”\n\n Youmu pressed a board back against the step. “But if she had opened that drawer, I would still have stopped her.”\n\n “You already did.”\n\n “If you had fired, I might have stopped you as well.”\n\n “I know.”\n\n “Is that why you did not fire?”\n\n “That is why I waited for you to finish speaking.”\n\n Youmu lowered her head to inspect the step, as though the plank had suddenly become fascinating. Reisen did not expose her; she merely took hold of the other end.\n\n “Do not bring her to Eientei again.”\n\n “If she is willing to use the front door, I will.”\n\n “She won't be.”\n\n “Then I will keep helping you repair the roof.”\n\n They looked at one another, and at last both began to laugh."

 love_story.25.a:"The answer is not in Eientei."


 love_story.26.t:"Next vacation"

 love_story.26.d:"Another two weeks passed before Youmu and Reisen once again sat down at the noodle stall on the corner of the Human Village. The owner recognized them and brought over the same two bowls of noodle soup without waiting for an order.\n\n This time, no one was hurrying to deliver medicine, and no noticeboard prompted anyone to recount old stories of the Lunar Capital. Youmu set down her chopsticks only after finishing her meal; Reisen, for once, did not remind her that the soup was getting cold.\n\n Passing the old pharmacy, they saw the flower Yuuka Kazami had left by the window. Its petals had returned to a deep violet, though a rim of silver-white remained. Two short notes lay beneath the pot. One, from Eirin, said that the moon dust had been removed. The other held only a single line from Yuuka:\n\n “I'll take care of the rest myself.”\n\n Youmu studied the flower. “She left the silver part untouched.”\n\n “Perhaps it has already become part of the flower.”\n\n “If Yuuka heard that, she'd say a flower's affairs are none of ours to guess at.”\n\n “Which is why we say it while she isn't here.”\n\n They continued on. Near the newspaper stand, Hatate Himekaidou dropped a folded envelope from the eaves.\n\n “The pest who turned my old archive upside down left this behind.”\n\n The letter bore no signature and contained only two lines:\n\n “I'm going to the Lunar Capital to find the taciturn one.\n Anyone who follows me gets flipped over first.”\n\n After reading it, Youmu asked, “Did she say when she'd return?”\n\n “She didn't even say when she left,” Hatate replied, camera in hand. “That's more like her.”\n\n Reisen folded the letter again. “At least this time, she knows why she's leaving.”\n\n They did not pursue her or take on another task at the last minute. Instead, they spent the afternoon wandering streets they had never visited, buying two helpings of sweets, and watching the fish from the bridge for a long while.\n\n Near dusk, the road finally divided toward Hakugyokurou and the Bamboo Forest of the Lost. They stopped at the fork, and neither said goodbye.\n\n Youmu spoke first. “Outside the hideout that day, I thought you were really going to fire.”\n\n “And I thought you were going to cut through my danmaku.”\n\n “I might have.”\n\n “I know. That's why I didn't fire.”\n\n Youmu looked down at the two roads. “What if we find ourselves on opposite sides again?”\n\n “Explain your reasons first,” Reisen answered. “If there isn't time, I'll drag you out of the way and listen afterward.”\n\n “That isn't reasonable.”\n\n “It is less likely to get someone killed.”\n\n Youmu smiled and held out her hand. “Then I'll leave it to you.”\n\n Reisen took her hand but did not immediately let go. After watching Youmu for a moment, she stepped forward and placed the lightest kiss upon her lips. Youmu froze, her cheeks swiftly turning red.\n\n “That was rather sudden.”\n\n “You just told me not to hesitate.”\n\n “I meant the next time we were in danger.”\n\n “Would you like an apology?”\n\n Youmu tightened her grip and pulled Reisen back from the half-step she had taken away.\n\n “No.”\n\n The roads to Hakugyokurou and the Bamboo Forest of the Lost still ran in opposite directions. The two of them turned back toward the village instead, deciding to make one last circuit before nightfall.\n\n This time, neither of them left early."

 love_story.26.a:"This time, Reisen didn't hesitate."

 love_story.26.b:"This time, Youmu didn't let go."


