 Renko_LUN_land_air_supply_cycle_mission:0 "Regular Army and Air Supply"
 Renko_LUN_land_air_supply_cycle_mission_desc:0 "The lunar forces receive one army and air reinforcement package every 180 days, subject to existing template and equipment design requirements. Each cycle also grants 2000 trucks, 200 trains, and 500 convoys."
 Renko_LUN_naval_supply_cycle_mission:0 "Regular Lunar Sea Fleet Supply"
 Renko_LUN_naval_supply_cycle_mission_desc:0 "The Lunar Sea Fleet receives one naval reinforcement package every 365 days, subject to existing ship design and naval base control requirements. Each cycle also grants 1000 trucks, 100 trains, and 1000 convoys."
