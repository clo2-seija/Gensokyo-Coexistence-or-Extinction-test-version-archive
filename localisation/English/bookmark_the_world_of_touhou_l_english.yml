l_english:
 the_world_of_touhou_name:0 "Gensokyo of the Crowd"
 the_world_of_touhou_desc:0 "Gensokyo is dead, people can only bravely move forward"

 the_world_of_touhou_KYO:0 "The Great Hakurei Barrier lost its footing after the death of the shrine maiden, and spiritual power surged back like uncontrolled blood—the barrier was torn into a wound that stretched across the sky, the other end of which was the cold light of the real world. Youkai did not die in battle, but was “forgotten”: first the name disappeared, then the legend fell silent, and finally even witnessing it was no longer possible. Every moment, someone was erased from memory, without even a cry left behind.\n Yukari Yakumo stood on the edge of the crack, the gap unable to contain the noise of the Outside World. She understood that this was not an invasion, but a devouring; not swords, but civilization itself. To let Gensokyo live, she could only choose—to lock the world back in place, or to drag reality into the same darkness."
