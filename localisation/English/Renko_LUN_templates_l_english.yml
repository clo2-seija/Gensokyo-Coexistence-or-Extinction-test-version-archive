 Renko_LUN_mobilize_lunar_army:0 "Organize the Lunar Host"
 Renko_LUN_mobilize_lunar_army_desc:0 "Standardize the invasion infantry, armored assault forces and cavalry garrisons, complete their technical preparations, and assemble the first formations in the capital."
 Renko_LUN_mobilize_lunar_army_tt:0 "Receive templates: Renko Lunar Infantry Division, Renko Lunar Armored Division and Renko Lunar Cavalry Garrison.\nUnlock their supporting technologies and basic medium and heavy tank chassis, and complete the helicopter, military engineering vehicle and flamethrower tank special projects.\nCreate 100 infantry divisions and 20 armored divisions in the capital with an initial equipment factor of 100%."
