l_english:
 Renko_LUN_mobilize_lunar_army:0 "Organize the Lunar Host"
 Renko_LUN_mobilize_lunar_army_desc:0 "Standardize the invasion infantry, armored assault forces and cavalry garrisons, complete their technical preparations, and assemble the first formations in the capital."
 Renko_LUN_mobilize_lunar_army_tt:0 "Receive the Renko Lunar Infantry Division, Renko Lunar Armored Division, and Renko Lunar Cavalry Garrison templates and their prerequisite technologies and projects.\nCreate 80 infantry divisions and 20 armored divisions in the capital, then receive 3 land and air reinforcement packages, each containing 4 infantry divisions, 4 armored divisions, and equipment stockpiles. Total: 92 infantry divisions and 32 armored divisions, with initial equipment set to 100%. Aircraft are granted only for commissioned types."
