 Renko_LUN_annual_technology_category:0 "Lunar Annual Technology Program"
 Renko_LUN_annual_technology_category_desc:0 "At the start of each year, receive the previous year's technology batch for free, once per batch. The industrial paths use Dispersed Industry and Streamlined Line. Hidden technologies granted directly by special projects are excluded. The list assumes all DLC: pre-1936 technologies belong to the 1936 batch, and post-1945 technologies belong to the 1945 batch."
 Renko_LUN_free_tech_1936:0 "Receive the 1936 Technology Batch"
 Renko_LUN_free_tech_1936_desc:0 "From January 1, 1937, receive the 91 technologies in the 1936 batch for free. Each batch can be claimed once. Technologies already known remain unchanged. The scope follows the rules of this program."
 Renko_LUN_free_tech_1937:0 "Receive the 1937 Technology Batch"
