 path_of_all_salvation:0 "The Way to Save All Beings"
 path_of_all_salvation_desc:0 "Myouren Temple is no longer merely a refuge for the lost, but a road opening onto the world. Byakuren steers by compassion; Shou upholds order; Ichirin carries the teachings abroad; Nazrin exposes deceit in the shadows; Minamitsu links nations with her ship; and Kyouko sends the voice of peace to distant lands.\n\nWe will not force the world to bow through fear. Through relief, aid, negotiation, and practical action, we will prove that humans and youkai are not destined to be enemies. So long as someone is still willing to offer a hand, suffering need not be the world's only language."

 revise_socialism_and_marx_1:0 "Revised Socialism and Marxist Thought"
 revise_socialism_and_marx_1_desc:0 "Byakuren saw another kind of suffering in the modern world: workers swallowed up by machines, farmers locked up by debt, and the weak oppressed by the state and capital. She did not deny the ideals of equality and the liberation of labor; on the contrary, she believed these ideas should resonate with the compassion in Buddhism.\n\n But once ideals are monopolized by bureaucracy, party-states, and violence, they transform from a path to liberating all beings into new shackles. Myouren Temple will reorganize these ideas, returning them to the original question: How can the suffering no longer be treated as tools?"

 revise_socialism_and_marx_2:0 "The Formation of Buddhist Socialism"
 revise_socialism_and_marx_2_desc:0 "Through the practice of Byakuren and her disciples, Myouren Temple gradually formed a new path. It acknowledges the dignity of laborers, opposes exploitation and oppression, yet refuses to allow class hatred to become a new faith; it pursues equality and shared happiness, yet refuses to use secret police, purges, and fear to create so-called progress.\n\n One round views labor as a form of self-cultivation, Shou allows order to serve the weak, Nazrin ensures resources are not stolen by the nouveau riche, and Kyouko ensures the voices of the underprivileged are heard. Buddhism and socialism are no longer mutually exclusive here, but rather point to a simpler wish: that all beings can survive without devouring each other."

 we_are_all_equal_1:0 "All beings are equal"
 we_are_all_equal_1_desc:0 "Myouren Temple's equality is not a lighthearted slogan. Byakuren sheltered the prickly, dark, out-of-control, clumsy, and fractured Youkai, and witnessed the vulnerability of humanity exposed under fear, poverty, and oppression.\n\n It is precisely because she has witnessed these imperfections that she understands even more clearly: no one is born only to be ruled, nor is anyone born only to become a monster. Humans, Youkai, workers, refugees, the weak, and those who are different should all have the right to be recognized, protected, and reintegrated into society."

 we_are_all_equal_2:0 "An Equal Nation Where Humans and Youkai Coexist"
 we_are_all_equal_2_desc:0 "Equality is no longer just the doctrine of the Myouren Temple, but has become the foundation of the nation's operation. Humans are no longer merely the source of fear upon which Youkai depend for survival, and Youkai are no longer just shadows in human legends. They work together, guard together, receive education and relief together, and share the responsibilities of this new world.\n\n Shou guards the fairness of the system, Ichirin brings faith into the workshops and fields, Nazrin oversees resource allocation, Minamitsu connects distant communities, and Kyouko ensures that every faint voice can resonate. The world Byakuren seeks is not one without suffering, but one where suffering is no longer borne alone by any single group."

 KYO_seija_redeeming_rebellion:0 "Shoji's Reverse Blade"
 KYO_seija_redeeming_rebellion_desc:0 "Seija Kijin did not become a docile believer, nor did she abandon her aversion to power and hypocrisy. She simply acknowledged for the first time that mere inversion cannot save the oppressed.\n\n Now, she remains within the Myouren Temple, scrutinizing our systems, aid, and commands with the sharpest eye. She may make many uncomfortable, but she can also prevent compassion from turning into new arrogance, and prevent the order from growing the teeth of oppression again when no one questions it."

 KYO_seija_grassroots_restitution:0 "Grassroots Repairman"
 KYO_seija_grassroots_restitution_desc:0 "Seija returned to where she knew best: the grassroots youkai, the underprivileged communities, the fringes of ruins, and the people forgotten by power.\n\n This time, she no longer merely incited anger, but used the very language she had once used to hurt others to rebuild communication. She remained sharp, still rebellious, but began to channel that resistance into protecting the weak, exposing local oppression, and mending the gap between Myouren Temple and the underprivileged youkai."

 KYO_aya_supportive_reporting:0 "Aya Shameimaru's support report"
 KYO_aya_supportive_reporting_desc:0 "The *Bunbunmaru Newspaper* no longer treats Myouren Temple merely as a subject for dissection. Aya Shameimaru personally investigated, probed, and questioned, ultimately choosing to bear witness to Myouren Temple through her own writing.\n\n She did not portray Myouren Temple as a flawless holy site. Instead, she wrote about its cracks, troubles, and dangers, as well as how Byakuren and her disciples acknowledged and repaired them. Because this report did not blindly praise it, it made more tengu, youkai, and humanity willing to believe that the compassion of Myouren Temple is not a pretense, but a struggling reality."

 KYO_choujuu_gigaku_wave:0 "The Popular Wave of Choujuu Gigaku" 
 KYO_choujuu_gigaku_wave_desc:0 "Kyouko and Mystia, forming the Choujuu Gigaku ensemble, with Wriggle's help, incorporated the sounds of nature's insects into their music, creating a unique style.\n\n Their songs are wondrous, avant-garde, passionate, and sincere. While they cannot replace food and medicine, they can pull people's hearts back towards the future when they are most weary. More and more humans and Youkai are beginning to believe that the Myouren Temple brings not only order and relief, but also a new life worth looking forward to."

 KYO_ichirin_determination:"A Round of Determination"

  KYO_unidentified_watcher_of_myouren:0 "Unidentified Bystander"
 KYO_unidentified_watcher_of_myouren_desc:0 "Nue Houjuu hasn't truly submitted to Myouren Temple, but she's no longer just a lurking destroyer. Her long debate with Minamitsu has led her to rethink the essence of Youkai: nature, fear, fantasy, the physical body, the name, and choice.\n\n She remains lurking within the temple, observing Byakuren's path with her unknowable eyes. Her presence prevents Myouren Temple from deceiving itself with simple answers, and further convinces Minamitsu that the essence of Youkai is not an unchangeable judgment."






