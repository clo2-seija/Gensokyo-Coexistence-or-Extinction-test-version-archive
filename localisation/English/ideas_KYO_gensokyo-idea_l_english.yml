 KYO_Fade_away_1:"Vanishing"
 KYO_Fade_away_1_desc:"As the gap widens, many Youkai initially forget their identities, then forget how to live independently, and finally lose their bodies."

 KYO_Fade_away_2:"Vanishing"
 KYO_Fade_away_2_desc:"As the gap widens, many Youkai initially forget their identities, then forget how to live independently, and finally lose their bodies."

 KYO_Hakurai_death:"The Death of the Hakurei Shrine Maiden"
 KYO_Hakurai_death_desc:"With the death of the Shrine Maiden, the balance between Youkai and humans is broken. No one, or Youkai, can replace the Shrine. Maiden's Balanced Rudder"

 KYO_I_am_hungry:"We Need to Eat People"
 KYO_I_am_hungry_desc:"Recent events are reawakening an old youkai hunger: the urge to devour humans."

 KYO_Eiki_help:"Eiki's Organization Manual"
 KYO_Eiki_help_desc:"Eiki, to prevent the Youkai from falling into the ancient habit of cannibalism, establishes a training plan for Yukari Yakumo's troops, making them more organized."

 KYO_Nitori_help:"Kappa's industrial support"
 KYO_Nitori_help_desc:"Kappa's industrial support greatly aids in the production of troop equipment, benefiting troop development."

 KYO_Satori_help:"Satori's Psychological Support"
 KYO_Satori_help_desc:"Satori may be among the most mistrusted youkai, but they understand the fears haunting the populace. Their help greatly alleviates Gensokyo's panic."

 KYO_three_youkai:"Grassroots Youkai Community"
 KYO_three_youkai_desc:"With the support of the grassroots Youkai, we have more support."

 KYO_youkai_tech_is_best:"Youkai's technology is number one in the world"

