  KYO_kogasa_idea:0 "Kogasa Tatara's Inspiration from Startles"
  KYO_kogasa_idea_desc:0 "The forgotten paper umbrella transforms into tsukumogami; the little umbrella excels at creating a hole in “common sense.” Startles bring inspiration, and inspiration drives prototyping and improvement, thus accelerating the research pace."

  KYO_reiko_idea:0 "Raiko Horikawa's Rhythmic Engineering"
  KYO_reiko_idea_desc:0 "Thunderous rhythms divide the process into orderly segments—from experimental design to measurement feedback, everything proceeds on beat, aligning the R&D team and doubling efficiency."

  KYO_benben_idea:0 "Benben Tsukumo's Biwa Acoustics"
  KYO_benben_idea_desc:0 "Benben guides resonance with the sound of the ancient biwa, combining intuition and mathematics; inspiration from acoustics to materials science collide, paving the way for new equipment and technologies."

  KYO_yatsuhashi_idea:0 "Yatsuhashi Tsukumo's Koto Structure"
  KYO_yatsuhashi_idea_desc:0 "The tension, resonance, and structural design of the koto inspired modal analysis and framework optimization; under her tuning, prototype iterations became more precise and rapid."

  KYO_kokoro_idea:0 "Hata no Kokoro's Menreiki"
  KYO_kokoro_idea_desc:0 "Emotions are energy, and also the driving force of an organization. Using Menreiki, she mobilized morale and focus, guiding the team's emotions towards the same goal of “solving problems.”"

  KYO_shinmyoumaru_idea:0 "Shinmyoumaru Sukuna's Machining Hammer"
  KYO_shinmyoumaru_idea_desc:0 "Small miracles can also leverage big projects. The Machining Hammer brings ingenious and economical thinking: miniaturized processes, achieving big results with small resources, making research and prototyping more efficient."

  KYO_Tsukumogami_idea:0 "Tsukumogami's Armaments"
  KYO_Tsukumogami_idea_desc:0 "Old Things Awaken, New Ideas Reborn. Weapons become more intuitive and robust through ingenuity and dedication: infantry equipment becomes cheaper, more effective in offense and defense, and with continued research and development, the entire army benefits."

