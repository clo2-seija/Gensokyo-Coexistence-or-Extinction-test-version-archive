  KYO_death_of_yukari:0 "The death of Yukari Yakumo"
  KYO_death_of_yukari_desc:0 "During the final boundary adjustment ceremony, Yukari Yakumo was engulfed by an explosion, leaving behind only fragmented reports and vague eyewitness accounts. Her body was never found, and even whether she still exists on this shore remains an unsolved mystery.\n\n However, all those who craved power eagerly chose to believe—that the founder of Gensokyo was no longer alive. As long as those golden eyes no longer gazed upon the archipelago, any hidden ambition no longer needed to disguise itself as obedience.\n\n With the disappearance of the one truly in control, the precarious balance began to crumble. Local leaders declared their own banners, old alliances were torn apart, and private armies and various wars sprang up like mushrooms after rain. The country continued to function on the surface, but internally it was like a building without its main beam, waiting for the first gust of wind to collapse completely.\n\n As long as the death of Yukari Yakumo remained in everyone's minds, government orders were nothing but scraps of paper, and authority vanished."



 KYO_civil_war_isolation:0 "Isolated War Under the Moon"
 KYO_civil_war_isolation_desc:0 "No external aid will cross the barrier, and no foreign power can decide the outcome for either side. Gensokyo has closed its doors; the victor can only emerge from this civil war."

 KYO_civil_war_npc_pressure:0 "They are also sharpening their blades."
 KYO_civil_war_npc_pressure_desc:0 "The opposing forces are not standing still awaiting annihilation. New defensive lines are being built, scattered troops are regrouping, and every hesitation buys them more time to prepare."

 KYO_committee_central_archives:0 "Every key left behind by Yukari"
 KYO_committee_central_archives_desc:0 "The Yakumo government did not take all the secrets. Border maps, supply routes, and emergency deployment plans still lie dormant in the central archives, awaiting their new owners to piece them together."

 KYO_committee_military_assets:0 "The sealed armory reopens."
 KYO_committee_military_assets_desc:0 "The weapons, instructors, and combat records left behind by the Military Affairs Committee have been transferred to our side. The forces that once belonged to the Allied Forces will now open the enemy's lines for us."

 KYO_committee_faith_assets:0 "Prayers unite the army's heart"
 KYO_committee_faith_assets_desc:0 "Temples, shrines, and local believers have chosen to maintain order on our side. The tolling of bells cannot stop the shells, but it can make the wavering take up their weapons again."

 KYO_committee_mobilization_assets:0 "No idle hands in the countryside"
 KYO_committee_mobilization_assets_desc:0 "Village rosters, local workshops, and grassroots transport lines have been mobilized. Every path, every warehouse, is beginning to operate for the front lines."

 KYO_committee_military_chair:0 "An iron fist on the military council"
 KYO_committee_military_chair_desc:0 "The Chairman of the Military Affairs Committee has taken command of the front lines. The dispersed troops will operate according to the same plan, breaking through the enemy's lines before they can react."

 KYO_committee_faith_chair:0 "The bells tolled over the gunfire"
 KYO_committee_faith_chair_desc:0 "The Chairman of the Faith Committee transformed the network of temples and shrines into a wartime order. The wounded were cared for, panic was calmed, and soldiers believed the war still held meaning."

 KYO_committee_network_chair:0 "The mobilization station was at the alleyway."
 KYO_committee_network_chair_desc:0 "The Chairman of the People's Committee did not rely on a grand headquarters. Craftsmen, messengers, and local representatives connected with each other, ensuring orders and supplies reached the front lines along countless inconspicuous roads."

 KYO_legacy_doctrine_yakumo:0 "The old network still remembers its master."
 KYO_legacy_doctrine_yakumo_desc:0 "The system of governance left by Yukari Yakumo was built on intelligence, foresight, and meticulous planning. Even in her absence, the old network that permeated Gensokyo still guided the war."

 KYO_legacy_doctrine_remilia:0 "The scarlet first strike"
 KYO_legacy_doctrine_remilia_desc:0 "Remilia believed that destiny belonged to those who first reached out to seize it. Scarlet Devil Mansion's army will crush hesitation with speed and impact, giving the enemy no chance to reconsider."

 KYO_legacy_doctrine_hijiri:0 "No one will be abandoned."
 KYO_legacy_doctrine_hijiri_desc:0 "Byakuren Hijiri refused to treat soldiers as mere numbers to be filled. Mutual aid, discipline, and a well-developed evacuation system enabled the army to withstand hardship without collapsing."

 KYO_legacy_doctrine_seija:0 "Let the weak get their weapons first."
 KYO_legacy_doctrine_seija_desc:0 "Seija was not prepared to fight according to the rules of the old rulers. The masses were swiftly armed, the enemy's equipment was seized, and resistance fighters scattered throughout the land would attack from every weak point."


  KYO_everyone_will_survive:"Everyone will pull through"

  KYO_kappa_orgnization_help:"Kappa's industrial assistance"
  
  KYO_oni_orgnization_help:"The power of the ghosts"

   KYO_beastrealm_orgnization_help:0 "Fangs shatter the battle lines"
 KYO_beastrealm_orgnization_help_desc:0 "Animal Realm's beast spirits join the offensive. They pursue the enemy's weaknesses, tearing open the battle lines with fierce and swift attacks."

 KYO_ghost_orgnization_help:0 "The dead watch over the living"
 KYO_ghost_orgnization_help_desc:0 "Hakugyokurou takes over casualty registration and rear transport. The ghosts maintain a silent order, allowing the front lines to hold out longer."

 KYO_tengu_orgnization_help:0 "The wind arrives before the flags"
 KYO_tengu_orgnization_help_desc:0 "Tengu's scouts, reporters, and air force crisscross the battlefield. Before the enemy even moves, the news has already reached our command."

 KYO_eientei_orgnization_help:0 "No Death Allowed Today"
 KYO_eientei_orgnization_help_desc:0 "Eientei's physicians and youkai rabbits establish a battlefield medical network. As long as a wounded soldier still draws breath, there is a chance to return them to the ranks."

 KYO_last_chance_alliance_buff:0 "Gensokyo's Last Card"
 KYO_last_chance_alliance_buff_desc:0 "The workshop operates day and night, healers rush to the front lines, scouts bring back intelligence, and reinforcements from all sides arrive one after another. All the strength accumulated so far will be staked in this final battle."

  KYO_fairy_of_freeze:0 "Ice Fairy"
  KYO_fairy_of_freeze_desc:0 "Winter is no longer just weather, but a battlefield condition that can be manipulated at will. Rivers freeze into natural bridges, mountain paths freeze into barricades, and enemy supply lines can turn into impassable ice tracks overnight.\n\n To her, the blizzard was merely a prank that went too far; to us, however, it was a strategic weapon capable of burying an entire army in snow. Whenever she was in a slightly better mood, frontline soldiers could move freely across the frozen land, while the enemy could only shiver in the cold wind, regretting ever stepping onto this battlefield."

  KYO_hijiri_army_buff:0 "Myouren Temple Monk Soldiers"
  KYO_hijiri_army_buff_desc:0 "Under the banner of the Myouren Temple, the chanting of sutras and the sound of military boots echoed across the plains. These monk soldiers, originally as ascetics who took up arms to protect the temple and the weak, were now drawn into a war that would determine the fate of the entire archipelago.\n\n They did not find pleasure in killing, nor did they boast of victory; instead, they viewed each expedition as a practice of the precept to “prevent further suffering.” Even during the march, they maintained their morning and evening prayers, and before battle, they performed rituals for the deceased on both sides, preserving a sense of solemnity even amidst iron and fire.\n\n Supported by this belief, the monks of Myouren Temple displayed extraordinary discipline and endurance. They could maintain formation despite dwindling supplies and hold their lines even on the verge of collapse. To their allies, they were an unshakeable fortress; to their enemies, they were a force clad in robes, more unyielding than any iron legion."

  KYO_judge_of_all_life:0 "The Judge of All Things"
  KYO_judge_of_all_life_desc:0 "Eiki Shiki, the arbiter of life and death. She swore oaths to no flag, nor cheered for any victory. When war turned the land to dust and names to numbers, she simply stood between judgment and silence, calmly recording each fall.\n\n For her, the battlefield was not a stage for glory, but a long, drawn-out record. Every life forced into battle, every unnecessary massacre, every lie concealed by power, would be written into that unseen book. No one could be sure when she would speak, but everyone knew she would eventually.\n\n Therefore, the “judgment of all things” hung like a shadow over the shoulders of armies and politicians: you could win a city, but not necessarily a trial; you could erase crimes with propaganda, but not cause and effect. As more and more souls were sent to Higan, the cost of war was no longer just resources and territory, but the moral debt of the entire regime."

  KYO_remilia_army_buff:0 "The Iron Hoof of the Crimson Empire"
  KYO_remilia_army_buff_desc:0 "Under the scarlet banner, Remilia was no longer just a noblewoman, but the very will of the empire. She stood on the high platform, her words short and absolute, forging fear, glory, and order into a single command. Cities learned to breathe in unison, workshops learned to rumble on schedule, and armies learned to crush hesitation with a single step.\n\n She didn't talk of compromise, only of “unity.” Every class had its place, every voice had to be aligned, and every march had to be as precise as a ceremony. Where iron hooves trampled, roads were rewritten as parade lines, people were rewritten as ranks, and the expansion of the crimson empire would be proclaimed as the self-evident law of survival."

  KYO_seija_army_buff:0 "Subversive Tactics"
  KYO_seija_army_buff_desc:0 "She read the rules backwards, and then reversed the battlefield as well. Direct conflict was merely a trap; retreat could be advance, and feigned weakness could be a clarion call. While the enemy was still measuring the front lines with a ruler, she had already woven the entire front into a reversed net using rumors, night raids, disguise, and division.\n\n In Seija Kijin's eyes, “rules” are never a neutral tool, but rather shackles used by the strong to solidify class. Since we are born to be placed at the bottom of the chessboard, let's overturn it. She breaks up squads, turns supplies into traps, and makes every battle a mockery of order itself.\n\n When subversion becomes the method, chaos is no longer out of control, but a weapon. The more the enemy relies on established procedures, the easier it is for them to bleed from her rule-breaking, until they realize: what they lost was not a battle, but the naivety of “believing the rules would protect them.”"

  KYO_yakumo_army_buff:0 "Yukari Yakumo's Legacy"
  KYO_yakumo_army_buff_desc:0 "Yukari Yakumo's death did not take her will with her.\n\n What she left behind wasn't just a slogan, but a whole set of things that could be “executed”: the use of barriers, the coordinates of boundaries, and the institutional design that forcibly bound the Youkai society to a single blueprint. The explosion erased her figure, but it also scattered her plans like ashes across the land, landing on the combat tables of military camps, the filing cabinets of government offices, and the sealed boxes in secret rooms.\n\n Ran Yakumo broke down the legacy into operable items: the hierarchy of garrison areas, the coding of passes, and the opening and closing procedures of gap passages. She didn't believe in miracles; she believed in processes and calculations. Chen, on the other hand, stuffed the same legacy into the cracks of people's hearts: an extra lamp during patrols, an extra road during evacuations, an extra handwritten distribution sheet outside the granary. Thus, the “barrier” was no longer just a line in the sky, but an order on the ground.\n\n§YThe Core of the Legacy§!\n- §WBoundary Combat§!: Rewrite terrain, distance, and line of sight into our rules.\n- §WGap Mobility§!: Not seeking the myth of teleportation, but only ensuring that supplies and reinforcements arrive before the enemy.\n- §WSystem Lock§!: Gradually binding private armies and local forces back to the same chain of command and legal system.\n\n As long as the Legacy continues to operate, the name Yakumo will continue to breathe on the battlefield. The enemy thought they had cut down a person, but they didn't see: she had already written herself into an invisible city."


