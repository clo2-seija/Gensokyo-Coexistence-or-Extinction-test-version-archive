 KYO_foreign_machinery_1_desc:0 ""

 KYO_foreign_machinery_2:0 "Disassembly and Reconstruction"
 KYO_foreign_machinery_2_desc:0 ""

 KYO_foreign_machinery_3:0 "Reverse Engineering System"
 KYO_foreign_machinery_3_desc:0 ""

 KYO_foreign_machinery_4:0 "Standardized Mass Production"
 KYO_foreign_machinery_4_desc:0 ""

 KYO_foreign_machinery_5:0 "Youkai's Industrial Dominance"
 KYO_foreign_machinery_5_desc:0 "From equipment import to independent mass production, Youkai has mastered a complete modern industrial system. It can expand at an unprecedented speed, but it also constantly consumes resources, administrative capacity, and new technical talent; it is a powerful machine that cannot be easily stopped."

 KYO_forced_labor_1:0 "Temporary Labor Recruitment"
 KYO_forced_labor_1_desc:0 ""

 KYO_forced_labor_2:0 "Labor Control Zones"
 KYO_forced_labor_2_desc:0 ""

 KYO_forced_labor_3:0 "Long-Term Labor Service System"
 KYO_forced_labor_3_desc:0 ""

 KYO_forced_labor_4:0 "Identity-Bound Labor Service System"
 KYO_forced_labor_4_desc:0 "Occupation, residence, and public rations are fixed within the same identity system. Industry gained a near-inexhaustible labor force, but the autonomy, demographic base, and political identity of human society continued to decline."

 KYO_twenty_four_hours_work_time:0 "24-Hour Work Shift"
 KYO_twenty_four_hours_work_time_desc:0 "Factories and mines implemented 24-hour work shifts, and equipment no longer stopped due to the day-night cycle. While different shifts remained on paper, overtime and temporary replacements constantly encroached on rest time; machines got a full day, but workers did not."

 KYO_sixteen_hours_work_time:0 "Sixteen-Hour Work Shift"
 KYO_sixteen_hours_work_time_desc:0 "Daily work was fixed in two eight-hour shifts, with minimal time reserved for eating, inspection, and sleep. It was more stable than unplanned continuous labor, but still far exceeded the body's long-term endurance."

 KYO_gensokyo_utopia:0 "Youkai Utopia"
 KYO_gensokyo_utopia_desc:0 "Youkai's city boasted bright streetlights, stable electricity, modern medical care, and never-empty shelves. The Industrial Revolution is complete. Gensokyo no longer needs to rely on the pity of the Outside World, nor does it need to worry about being abandoned by the new era.\n\n Supporting all this is tightly managed human labor. Humans have basic necessities, but cannot freely choose their occupation, residence, or future; they no longer frequently face open violence, as orders have been transformed into credentials, rations, and regulations.\n\n This is not a nation entirely built on fear, nor a truly egalitarian community. It is stable, prosperous, and capable of long-term existence—only the boundary of this so-called utopia lies precisely between humanity and Youkai."



 KYO_tengu_untrust_debuff_1:0 "Tengu's Fear"
 KYO_tengu_untrust_debuff_1_desc:0 "Youkai Mountain is tengu's territory. Tengu still watches the government with wary and scrutinizing eyes, making the implementation of policies, maintaining public morale, and wartime mobilization even more difficult."

 KYO_tengu_untrust_debuff_2:0 "Tengu's Observation"
 KYO_tengu_untrust_debuff_2_desc:0 "Tengu has stopped openly resisting, but they still choose to keep their distance."

 KYO_grassroot_rebal_1:0 "Grassroots Youkai's Counterattack"
 KYO_grassroot_rebal_1_desc:0 "Sekibanki, Kagerou Imaizumi, Wakasagihime, and other grassroots youkai do not acknowledge the enemy's victory. They will make things difficult."

 KYO_grassroot_rebal_2:0 "Grassroots Aftermath"
 KYO_grassroot_rebal_2_desc:0 "Although the unrest has been suppressed, the discontent of grassroots youkai still echoes in the shadows. As long as life doesn't truly improve, this sentiment will inevitably resurface sooner or later."

 KYO_yet_another_industry_debuff_1:0 "Industrial System in Disorder"
 KYO_yet_another_industry_debuff_1_desc:0 "Civil war, destruction, and hasty conscription tore apart the original production chains. Resource allocation was chaotic, infrastructure construction stagnated, and both the military and civilian systems struggled to operate inefficiently and in short supply."

 KYO_yet_another_industry_debuff_2:0 "Industrial Recovery Period"
 KYO_yet_another_industry_debuff_2_desc:0 "The worst of the chaos has passed, but factories, resources, and construction networks have not yet fully recovered. The regime needs more time to readjust this broken industrial machine."

 KYO_lunar_capital_plot_1:0 "Lunar Capital Conspiracy"
 KYO_lunar_capital_plot_1_desc:0 "Lunar Capital's hand has not truly left Gensokyo. Infiltrators, surveillance networks, and covert operations continue to erode the existing order, causing intelligence leaks, shaking public morale, and even weakening the most basic counter-espionage capabilities."

 KYO_lunar_capital_plot_2:0 "Lunar Capital Remnants of Infiltration"
 KYO_lunar_capital_plot_2_desc:0 "Lunar Capital's influence has been weakened, but its remaining informants and infiltration network remain active. Any lapse in vigilance will allow these shadows from the Moon to once again reach into Gensokyo."

 KYO_myouren_resistance_1:0 "Myouren Temple Resistance"
 KYO_myouren_resistance_1_desc:0 "Myouren Temple continues to mobilize people with compassion, faith, and a different order. As long as Byakuren faction's appeal remains, the submission of the occupied territories is merely superficial; underground resistance will never cease."

 KYO_myouren_resistance_2:0 "Myouren Temple Embers"
 KYO_myouren_resistance_2_desc:0 "Myouren Temple's open resistance has been suppressed, but its remaining connections, prestige, and underground networks persist, continuing to slow the integration and control of the region."

 KYO_yakumo_wrath_1:0 "Yakumo's Wrath"
 KYO_yakumo_wrath_1_desc:0 "The Yakumo Clan's defeat doesn't mean the Yakumo power has fallen silent. Remnants, former retainers, and allies still secretly control everything, making mobilization, legislation, and power consolidation all costly."

 KYO_yakumo_wrath_2:0 "The Yakumo Clan's Lingering Wrath"
 KYO_yakumo_wrath_2_desc:0 "The fiercest counterattack has passed, but the shadow cast by the Yakumo power hasn't completely dissipated. Fear, hesitation, and old networks continue to hinder Scarlet Devil Mansion's progress."

 KYO_uncontrol_flan_1:0 "The Out-of-Control Flandre"
 KYO_uncontrol_flan_1_desc:0 "Flandre's power is still not truly under control. Whenever her emotions spiral out of balance again, Scarlet Devil Mansion must constantly divert its energy to deal with the impending calamity."

 KYO_uncontrol_flan_2:0 "Flandre's Instability"
 KYO_uncontrol_flan_2_desc:0 "Flandre has quieted down temporarily, but the danger has never truly left. Everyone knows she remains a potential disaster that could explode at any moment."



 

 KYO_Scarlet_Sakuya_1:0 "The Head Maid's Inventory"
 KYO_Scarlet_Sakuya_1_desc:0 "Sakuya's first task wasn't to restore order to the battlefield, but to clean up the chaos. Food, weapons, ledgers, and manpower were all put back in their proper places."

 KYO_Scarlet_Sakuya_2:0 "Silver Table Process"
 KYO_Scarlet_Sakuya_2_desc:0 "Sakuya Izayoi broke down the operations into manageable steps, ensuring that logistics didn't slow down Scarlet Devil Mansion."

 KYO_Scarlet_Sakuya_3:0 "Izayoi's Scheduling"
 KYO_Scarlet_Sakuya_3_desc:0 "From warehousing to rationing, from patrolling to shifts, everything operates according to her schedule."

 KYO_Scarlet_Sakuya_4:0 "Absolute order in the institution."
 KYO_Scarlet_Sakuya_4_desc:0 "Sakuya keeps chaos at bay. As long as she stands, the machines of Scarlet Devil Mansion will not stop."

 KYO_Scarlet_Sakuya_5:0 "The perfect and elegant steward."
 KYO_Scarlet_Sakuya_5_desc:0 "She is not merely a head maid, but the central hub that keeps the entire regime running efficiently."

 KYO_Scarlet_Meiling_1:0 "Morning sentry at the gate."
 KYO_Scarlet_Meiling_1_desc:0 "Meiling stands at the first gate, stopping all initial laxity and wishful thinking."

 KYO_Scarlet_Meiling_2:0 "The gatekeeper's fist technique."
 KYO_Scarlet_Meiling_2_desc:0 "She brings martial arts, discipline, and patience into the barracks, teaching new recruits to stand firm before throwing a punch."

 KYO_Scarlet_Meiling_3:0 "Red Gate Defense Line"
 KYO_Scarlet_Meiling_3_desc:0 "From checkpoints to garrisons, from high walls to mountain paths, the outer defenses of Scarlet Devil Mansion began to take shape."

 KYO_Scarlet_Meiling_4:0 "The Sleepless Gatekeepers"
 KYO_Scarlet_Meiling_4_desc:0 "Meiling taught the defending troops rotation, perseverance, and responsiveness, ensuring that defense was no longer merely a passive defense."

 KYO_Scarlet_Meiling_5:0 "The Smiling Iron Wall"
 KYO_Scarlet_Meiling_5_desc:0 "She still smiled, but everyone knew that behind that smile was an unyielding wall."

 KYO_Scarlet_Remilia_1:0 "Red Moon Order"
 KYO_Scarlet_Remilia_1_desc:0 "Remilia offered neither reassurance nor explanation. She simply wanted everyone to remember that new orders had been issued."

 KYO_Scarlet_Remilia_2:0 "Scarlet's Wartime Will"
 KYO_Scarlet_Remilia_2_desc:0 "She infused fear and pride into her army, making the act of attack itself the style of Scarlet Devil Mansion."

 KYO_Scarlet_Remilia_3:0 "The Queen's March"
 KYO_Scarlet_Remilia_3_desc:0 "The front lines pushed forward, and so did her rule. Remilia wanted not defeat, but subjugation."

 KYO_Scarlet_Remilia_4:0 "Bloody Reign"
 KYO_Scarlet_Remilia_4_desc:0 "She began to incorporate the occupied territories into her own order, making obedience a habit."

 KYO_Scarlet_Remilia_5:0 "Imperial Power Under the Red Mist"
 KYO_Scarlet_Remilia_5_desc:0 "Under the red mist and commands, war, occupation, and intimidation were finally molded into a single monarchy."

 KYO_Scarlet_Flandre_1:0 "The Crack in the Basement"
 KYO_Scarlet_Flandre_1_desc:0 "As long as Flandre's power leaks out even slightly, the front lines will be hit with even fiercer force, but the rear will also begin to feel uneasy."

 KYO_Scarlet_Flandre_2:0 "The Restlessness of the Glass Wings"
 KYO_Scarlet_Flandre_2_desc:0 "She is not a weapon, but a calamity that is barely held back. The closer she gets to the front lines, the harder it is for the rear to remain stable."

 KYO_Scarlet_Flandre_3:0 "The Sister of Nightmare"
 KYO_Scarlet_Flandre_3_desc:0 ""

 KYO_Scarlet_Flandre_4:0 "The Devil's Sister Laughs"
 KYO_Scarlet_Flandre_4_desc:0 "The enemy army will be torn apart first, but the workshops, the rear, and the hearts of the people will also crack because of her presence."

 KYO_Scarlet_Flandre_5:0 "An Uncontrollable Catastrophe"
 KYO_Scarlet_Flandre_5_desc:0 "She is capable of smashing through the strongest lines, but the entire nation must bear the tremors she brings."

 KYO_Scarlet_Patchouli_1:0 "Disassembly on the Pages"
 KYO_Scarlet_Patchouli_1_desc:0 "Patchouli begins disassembling the equipment of the Outside World, gradually incorporating unfamiliar technologies into the knowledge system of Scarlet Devil Mansion."

 KYO_Scarlet_Patchouli_2:0 "Prototypes in the Great Library"
 KYO_Scarlet_Patchouli_2_desc:0 "Research no longer stops on the pages; the library's deductions begin to translate into truly usable processes."

 KYO_Scarlet_Patchouli_3:0 "Magical Engineering"
 KYO_Scarlet_Patchouli_3_desc:0 "Magic and industry are connected by Patchouli, allowing production and research to advance simultaneously."

 KYO_Scarlet_Patchouli_4:0 "The Sage's Mass Production Technique"
 KYO_Scarlet_Patchouli_4_desc:0 "She makes theory serve the factory, allowing construction and mass production to be driven with equal calm and precision."

 KYO_Scarlet_Patchouli_5:0 "The Immovable Great Library"
 KYO_Scarlet_Patchouli_5_desc:0 "When Patchouli truly gets into the zone, the entire Scarlet Devil Mansion becomes an extension of her research."

  








