  KYO_drug_backlash:0 "Expensive medical bills"
  KYO_drug_backlash_desc:0 "Eientei could save many wounded soldiers who would otherwise have died, but it couldn't conjure medicine, equipment, or medical personnel out of thin air. As the battle lines stretched, rare medicinal herbs were prioritized for military hospitals, workshops shifted to producing injections and medical equipment, and remote villages had to wait even longer for ordinary medicines.\n\n The front lines relied on Eirin's medical skills to sustain themselves, but the rear was gradually slowed down by the heavy medical expenses. No one wanted to abandon the wounded, but every bed placed in Eientei's care reminded us: bringing people back from the brink of death is never a cheap thing."

  KYO_ritual_fatigue:0 "Soul Weakness"
  KYO_ritual_fatigue_desc:0 "The repeated rituals of summoning and comforting souls are blurring the line between the living and the dead. Those conducting the rituals are beginning to hear calls that don't exist, and returning ghosts are suddenly forgetting where they are. Some lose their way on marches, while others awaken to find only a long-abandoned homeland.\n\n Hakugyokurou has shortened the rituals and mandated rest, but the damage to the soul cannot be bandaged like a normal wound. Until fully recovered, recruitment, production, and military operations must all accommodate these increasingly weary souls."

  KYO_gap_leak:0 "Pressure from Imperishable Night and Perfect Cherry Blossom"
  KYO_gap_leak_desc:0 "The shadow of “Imperishable Night” and the chill of “Youmu” pressed down simultaneously, tightening the barrier like a thin veil. A faint hum emanated from the gap: intelligence leaked out, strange tales returned inward, and the boundary seemed to be cracked by invisible fingertips. Rumors spread in towns and cities, attracting the attention of the Outside World; allies hesitated, adversaries probed, and the hand in the shadows stretched ever longer. Yukari Yakumo gave a cold order: Mend it. Mend it again. Bear the cost yourselves. Thus, internal stability crumbled, resistance in occupied territories increased, and the balance of power in government affairs became unbalanced—the chessboard remained, but every move was more difficult than yesterday."





  KYO_Bamboo_Forest_Guerrillas_1:0 "Bamboo Forest Guerrilla Team"
KYO_Bamboo_Forest_Guerrillas_1_desc:0 "Reisen didn't treat the Bamboo Forest of the Lost as a natural trap. She first taught each squad to recognize wind direction, broken bamboo, and signals left by rabbits on the ground, then broke up patrols into two-person teams that could provide cover for each other.\n\n After engaging the enemy, they would only fire briefly before immediately changing course; upon discovering wounded soldiers, they would abandon the pursuit and prioritize bringing their comrades back to Eientei. When the enemy first entered the bamboo forest, they only saw constantly moving shadows, while our troops already knew where to appear and where to leave."

KYO_Bamboo_Forest_Guerrillas_2:0 "Bamboo Forest Guerrilla Network"
KYO_Bamboo_Forest_Guerrillas_2_desc:0 "The initial guerrilla squads had spread out along the bamboo forest. Ground Rabbits were responsible for relaying intelligence, concealing ammunition, and maintaining the trails, while Reisen used wavelength perturbation to create false footsteps, gunshots, and lights, drawing pursuers to uncharted territories.\n\n Each attack route was accompanied by an escape route, and each concealed stronghold guided troops to the next bamboo grove. The guerrillas were no longer just scattered soldiers familiar with their homeland, but a defensive network capable of self-contained contraction, relocation, and regrouping."

KYO_Bamboo_Forest_Guerrillas_3:0 "Bamboo Forest of the Lost Defense Network"
KYO_Bamboo_Forest_Guerrillas_3_desc:0 "The paths, warehouses, observation posts, and aid stations within the bamboo forest have formed a complete system. Command can temporarily convert any section of bamboo path into an ambush zone, supply line, or evacuation route, and nearby troops can automatically proceed to their designated positions after losing contact.\n\n The enemy still faces what appears to be the same sea of bamboo; for Reisen's troops, every bamboo shadow marks the next move. The Bamboo Forest of the Lost no longer relies on chance to lead astray—it has learned to change its course according to our will."

KYO_Prototype_Hourai_Regimen_1:0 "Eirin drug trial"
KYO_Prototype_Hourai_Regimen_1_desc:0 "Eirin isolated several controllable formulations from the principles of Hourai Elixir. These wouldn't grant immortality, but were used to enhance recovery, alleviate fatigue, and help subjects adapt to prolonged night battles.\n\n All participants had to undergo screening, understand the risks, and could withdraw at any time. Even so, the concentration of the drug in the military caused unease, and occasional insomnia, sensory hallucinations, and high fevers fueled the rapid spread of rumors. Eirin didn't conceal the reports—she knew better than anyone that being able to use a drug didn't mean it should be used without restraint."

KYO_Prototype_Hourai_Regimen_2:0 "Battlefield Medicine Program"
KYO_Prototype_Hourai_Regimen_2_desc:0 "After initial testing of the experimental formula, Eientei began establishing independent medication protocols for night combat units and special forces. Mobile medical teams adjusted dosages based on individual patient conditions, immediately discontinuing medication if any adverse reactions occurred, ensuring that the same prescription was no longer applicable to everyone.\n\n Training and resupply were thus significantly accelerated, but increased use also consumed more medical resources. Ordinary patients faced increasingly longer wait times, while military families worried whether their loved ones would have the freedom to choose between orders and voluntariness. Eirin refused to conceal these concerns, because if medicine were reduced to mere obedience, it would have strayed from its original purpose of healing."

KYO_Lunarian_Fragments_1:0 "Eight-style underlying standard"
KYO_Lunarian_Fragments_1_desc:0 "Eirin retrieved the old blueprints she had kept before leaving Lunar Capital, first demanding that the workshops standardize dimensions, measurement methods, and interface specifications. Equipment that could previously only be repaired by the maker could now have parts replaced by those from another workshop; medicines and electronic devices also had to undergo repeatable verification checks.\n\n She didn't directly hand over a weapon of the Moon that could change the war, but instead taught Gensokyo how to reliably manufacture the next one. The truly valuable thing wasn't the finished product on the blueprints, but the method that allowed knowledge to be understood, replicated, and continuously improved."

KYO_Lunarian_Fragments_2:0 "Eight Italian General Standards"
KYO_Lunarian_Fragments_2_desc:0 "The Eight-Style Standard has expanded from Eientei to the kappa workshop, supply depots, and research institutions. Parts manufactured in different regions are interchangeable, experimental results can be cross-verified, and damaged equipment at the front no longer needs to be sent back to its original manufacturer.\n\n Eirin insists on writing every modification into the public specifications. She doesn't intend for Gensokyo to rely on her memories forever, but rather to establish a system that can continue research, production, and error correction even without Eirin Yagokoro's personal supervision."

KYO_Tewi_Lucky_Logistics_1:0 "Tewi's Silver Circulation Network"
KYO_Tewi_Lucky_Logistics_1_desc:0 "Tewi Inaba knew which villages had stockpiled grain, which shops were willing to extend credit, and which inconspicuous paths could bypass the blockade. She sent rabbits on the ground to carry money, IOUs, and invoices to various places, delivering unsold inventory to areas in need, and then repaying the favors owed along the way with the next batch of goods.\n\n There were no grand banks, nor halls filled with rules and regulations. What supported this network was the credit of the merchants, the eyes and ears of the rabbits, and Tewi's ability to find an alternative route before the main road closed."

KYO_Tewi_Lucky_Logistics_2:0 "Rabbit Print Circulation Network"
KYO_Tewi_Lucky_Logistics_2_desc:0 "Tewi's temporary business has expanded into a distribution system covering various regions. Rabbit-marked tickets can be used for settlement between villages and towns, caravans share warehouses and escort routes, and scattered recycled metals and weapon parts are sent to workshops that need them most.\n\n Her so-called luck rarely comes from chance. It's the advance notice of countless rabbits on the ground, the trust built up over years of interactions, and the next truck she arranged while everyone else was still debating. As long as rabbit-marked tickets appear on the roads, supplies will always find a way to reach the front lines."

KYO_Frost_Mist_Snow_1:0 "Frozen Sunset and Thin Snow"
KYO_Frost_Mist_Snow_1_desc:0 "Hakugyokurou did not require the living to endure the bitter cold like the undead. The ghost scouts traversed the snowstorm first, searching for thin ice, sheltered spots, and abandoned buildings where supplies could be stored, then used spirit fire to mark safe routes for the following troops.\n\n The undead undertook tasks that wouldn't be slowed down by the low temperatures, while the living conserved their strength and equipment. At the end of the first exercise, everyone arrived at the finish line on time, and no one was left behind in the snow."

KYO_Frost_Mist_Snow_2:0 "Frozen Clouds Marching Method"
KYO_Frost_Mist_Snow_2_desc:0 "The living and the dead began to form fixed winter action teams. Ghosts were responsible for reconnaissance, communication, and night watch, while the living carried firepower and construction equipment; shelters and small stockpiles set up along the way meant that troops didn't have to carry all their supplies.\n\n Snowstorms were no longer just obstacles to overcome. Spirit fires could guide them in dense fog, falling snow could conceal their movements, and frozen roads could become unpredictable attack routes for the enemy."

KYO_Frost_Mist_Snow_3:0 "Hakugyokurou Winter Tactics"
KYO_Frost_Mist_Snow_3_desc:0 "Hakugyokurou had refined winter warfare into a complete tactic. From ghost reconnaissance and snow transport to the evacuation of the wounded, each unit knew when to continue advancing and when to retreat to the nearest shelter.\n\n When blizzards struck, supplies wouldn't be immediately interrupted, and scattered troops could regroup by following spirit fires. Winter, which in the past would have brought an entire army to a standstill, now ironically served to conceal our movements."

KYO_Konpaku_Hundred_Day_1:0 "The Hundred-Day Training of the Instructor"
KYO_Konpaku_Hundred_Day_1_desc:0 "Youmu didn't require ordinary soldiers to imitate her swordswomanship that could slice through buildings. The hundred-day training began with standing firm, maintaining formation, and properly sheathing the sword, gradually incorporating close-quarters assaults, alternating cover, and orderly retreats.\n\n “Don't think about cutting anything down yet,” she said, sheathing her sword and looking at the recruit who had fallen again. “Learn to find your comrades in the chaos, and bring them all back together.”\n\n After a hundred days, the soldiers still couldn't become Youmu Konpaku, but they were already able to stabilize the lines when their charge was stalled."

KYO_Konpaku_Hundred_Day_2:0 "The Hundred-Day Training Corps"
KYO_Konpaku_Hundred_Day_2_desc:0 "The first batch of soldiers to complete the hundred-day training were assigned to various units as instructors. The movements personally demonstrated by Youmu were broken down into standardized courses, allowing troops far from Hakugyokurou to learn the same formations, assault methods, and retreat rules.\n\n The most important outcome of this training wasn't simply achieving perfect uniformity in swordswomanship, but rather enabling troops to support each other even in prolonged battles and when the situation turned against them. As long as the ranks didn't break apart, a failed charge wouldn't immediately turn into a rout."

KYO_Ghost_Analgesia_1:0 "The Doctrine of the Dead"
KYO_Ghost_Analgesia_1_desc:0 "Yuyuko crossed out a sentence from the initial draft—“The dead have already died once, so there is no need to fear loss.”\n\n Ghosts still feel pain and may lose their memories or even completely dissipate after being injured. Hakugyokurou therefore established a special system of guidance and recuperation, allowing weakened dead to withdraw from the front lines and return to their original ranks after regaining their physical form. The dead are not an inexhaustible source of manpower; that is why every piece of experience preserved is all the more precious."

KYO_Ghost_Analgesia_2:0 "Hakugyokurou Return System"
KYO_Ghost_Analgesia_2_desc:0 "Guiding lamps and support personnel have been deployed to each unit. When a spirit begins to dissipate, nearby personnel will send it back to Hakugyokurou; if the front line loses contact, undead officers familiar with their former units will be responsible for gathering the remnants and restoring command.\n\n The living are handed over to medics, and the dead are sent to Higan; neither will be abandoned simply because they are temporarily unable to fight. When veterans return to their units after recuperation, they bring back not only combat power, but also experience that might have been lost in the chaos."

KYO_Saigyou_Whisper_1:0 "Saigyou Ayakashi's Whispers"
KYO_Saigyou_Whisper_1_desc:0 "Occasionally, faint whispers emanate from the depths of the seal of Saigyou Ayakashi. Yuyuko did not break the seal, allowing only a select few to access the outermost echoes under Youmu's supervision. These words could not directly predict the future, but they changed with hostility, fear, and lies, allowing eavesdroppers to detect infiltrators and impending attacks.\n\n However, the sounds heard beneath the tree sometimes followed people back to their dreams. Insomnia and unease began to appear in the military camp, forcing Youmu to be prepared to sever the out-of-control connections at any time."

KYO_Saigyou_Whisper_2:0 "The Language of Flowers Across the Battlefront"
KYO_Saigyou_Whisper_2_desc:0 "As the monitoring range expanded, Saigyou Ayakashi's whispers could now travel along spiritual energy lines to various positions. Commanders could discern enemy instability from the changes in the flower language, and ambushers could avoid detection before the enemy discovered them.\n\n Yuyuko still refused to let Saigyou Ayakashi bloom, but simply amplifying its sound was enough to influence more and more people. Outside the military camps, some began dreaming of unfamiliar cherry trees, fueling doubt and growing war-weariness. We gained eyes that could see into enemy territory, but we could no longer guarantee those eyes would only be focused on the battlefield."

 KYO_Eirina_eternal_1:0 "Collaborative Rescue Network"
 KYO_Eirina_eternal_1_desc:0 "Eientei opens battlefield medicine to all youkai."
 KYO_Eirina_eternal_2:0 "Verifiable Existence Plan"
 KYO_Eirina_eternal_2_desc:0 "Recording, verification, and medical processes give lives the opportunity to continue to change."
 KYO_Eirina_eternal_3:0 "Sharing the Hourai Experience"
 KYO_Eirina_eternal_3_desc:0 "Eirin no longer uses lunar knowledge as a secret tool to control others."
 KYO_Eirina_eternal_4:0 "Never Stagnant"
 KYO_Eirina_eternal_4_desc:0 "The meaning of extending life is to preserve choices, not to freeze the world."
 KYO_Yuyuko_death_1:0 "Common Name Register"
 KYO_Yuyuko_death_1_desc:0 "Hakugyokurou Let every deceased person have a name, a witness, and a final resting place."
 KYO_Yuyuko_death_2:0 "Higan's Testimony"
 KYO_Yuyuko_death_2_desc:0 "Farewell acknowledges loss, but refuses to turn the deceased into tools of command."
 KYO_Yuyuko_death_3:0 "Saigyou Ayakashi's Memories"
 KYO_Yuyuko_death_3_desc:0 "Yuyuko regains her history as a person, not just a position."
 KYO_Yuyuko_death_4:0 "Departure Still Has Meaning"
 KYO_Yuyuko_death_4_desc:0 "Remembering allows the world to move forward, without requiring anyone to prove their stance through death."


 LUN_lunar_scientific_supremacy:0 "Legacy of the Brain of the Moon"
LUN_lunar_scientific_supremacy_desc:0 "Lunar science has never been a blind search into the unknown. It dissects the universe, classifies its workings, and reassembles them according to need. Vast observation arrays continuously sweep the Earth and the stars, while research institutes complete their simulations, trials, and preparations for mass production long before war begins."

LUN_watatsuki_integrated_discipline:0 "Watatsuki Integrated Discipline"
LUN_watatsuki_integrated_discipline_desc:0 "Yorihime devises the doctrine; Toyohime directs the greater campaign. Their orders travel through a rigorously tested chain of command to every lunar rabbit unit. The soldiers need never guess at their commanders' intentions, nor may panic break their formation. They know when to advance, where to direct their fire, and at what level of losses to regroup and reform the line. Individuals may hesitate—the organization never does."

LUN_lunar_integrated_command_network:0 "Lunar Command Network"
LUN_lunar_integrated_command_network_desc:0 "Detection, analysis, command, and fire coordination are linked through a single lunar network. Every target sighted by a lunar rabbit at the front is immediately converted into coordinates shared with command centers and support units behind the lines. While terrestrial armies are still trying to identify the threat, the Lunar Capital has already ranked its priority and deployed its forces to precisely where they are needed."

LUN_celestial_war_industry:0 "Celestial War-Industry Complex"
LUN_celestial_war_industry_desc:0 "No industry in the Lunar Capital is ever entirely divorced from war. Precision workshops, research facilities, and transport hubs all possess the means to convert to military use; once a new weapon passes its trials, its specifications are transmitted to every production line at once. To the Lunar Capital, mobilization is not the improvised transformation of society, but the full activation of a war machine that was there all along."

LUN_pure_logistics_standard:0 "Contamination-Free Logistics"
LUN_pure_logistics_standard_desc:0 "Every piece of lunar equipment must remain operational in vacuum, extreme cold, radiation, and supernatural interference. Supplies are sealed in exact quantities, transport routes are continuously recalculated, and faulty components are replaced before they can disrupt operations. Mud, blizzards, and immense distances will not halt the lunar army—they will only leave the armies of Earth further behind."

LUN_purification_weapon_system:0 "Purification Weapons System"
LUN_purification_weapon_system_desc:0 "In lunar military doctrine, soldiers, firearms, aircraft, radar, and rear-echelon computation centers are not separate assets, but components of a single weapon system. Once a target is designated as impure, the entire apparatus turns upon it at once: observation arrays fix its position, aerial forces seal off every avenue of escape, and ground troops carry out its elimination according to predetermined procedure."
