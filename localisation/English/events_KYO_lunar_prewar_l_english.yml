l_english:

 KYO_lunar_prewar.1.t:0 "Under What Name Will Gensokyo Fight?"

 KYO_lunar_prewar.1.d:0 "Lunar Capital is amassing its army; war between Gensokyo and the Moon is imminent.\n\n At Yukari's summons, representatives from Eientei, Hakugyokurou, Scarlet Devil Mansion, Myouren Temple, Youkai Mountain, the subterranean forces, and the grassroots Youkai gather. Past conflicts haven't disappeared, but everyone understands: if Lunar Capital wins, neither humanity, the Youkai, nor the Gods will have a future they can escape to alone.\n\n For the first time, all parties agree to joint command, sharing intelligence, supplies, and battlefield responsibility. The flags that were once opposed to each other are raised side-by-side, leaving a nameless spot in the center.\n\n Yukari stood before the crowd and announced:\n\n “From this day forward, Lunar Capital will no longer face fragmented forces, but the entirety of Gensokyo.”\n\n Before the great war begins, this united front must have its own name. It will represent the unity of Gensokyo and will become the common banner we raise against Lunar Capital."

 KYO_lunar_prewar.1.a:0 "§RGround Axis§!—Let all resistance gather around the Earth."

 KYO_lunar_prewar.1.b:0 "§YLunar Capital Liberation Front§!—Bring freedom to the depths of the Moon Palace."

 KYO_lunar_prewar.1.c:0 "§0Fantasy Alliance§!—Let those forgotten by reality hold onto reality."

 KYO_lunar_prewar.1.e:0 "§GCoexistence Agreement§!—No world must disappear."
 
 KYO_lunar_prewar.2.t:0 "Replaced Heads of State"

 KYO_lunar_prewar.2.d:0 "Ran compared recent government records from various countries and discovered that several heads of state had disappeared for several days after secret meetings, short-term medical treatment, or military inspections. When they reappeared in public, their appearance, voices, and memories remained unchanged, but their speech and actions began to show the same pauses and wording.\n\n They no longer questioned orders from the Moon and gave almost identical explanations for the sudden increase in military budgets, missing persons, and secret facilities. Diplomats, military commanders, and intelligence agency heads also changed.\n\n Eirin confirmed that these people were not simply manipulated. The original humans had been taken away, and those sitting in their positions were disguised Lunarians who had inherited some of their memories.\n\n Lunar Capital did not wait for the war to begin before conquering the earth. It had already sent its people to the deepest recesses of world power."

 KYO_lunar_prewar.2.a:0 "These hypocrites are already sitting at the highest point in the world."


 KYO_lunar_prewar.3.t:0 "The frequency hidden in the radio"

 KYO_lunar_prewar.3.d:0 "Reisen heard the same anomalous wavelength in broadcasts from various countries. Hidden beneath news, military announcements, and public broadcasts, it was imperceptible to ordinary people, but with prolonged exposure, it gradually interfered with their judgment.\n\n This frequency didn't directly rob consciousness. It only weakened skepticism, making recurring statements seem more plausible. Initially, some questioned the government, then dissent gradually diminished; eventually, people began using the same words to explain the war, the disappearances, and all the contradictions left behind by Lunar Capital.\n\n They still believed their thoughts were their own, yet they were increasingly unable to generate answers different from Lunar Capital's.\n\n Replacing a leader only controls the government, but this frequency could make the entire society willingly submit to it."

 KYO_lunar_prewar.3.a:0 "They are making the whole world believe the same lie."


 KYO_lunar_prewar.4.t:0 "Panic has found an outlet."

 KYO_lunar_prewar.4.d:0 "Countries began simultaneously revising recent events. Missing officials were said to have been assassinated by Youkai, anomalies in military facilities were attributed to Gap infiltration, and economic chaos and communication disruptions were all presented as evidence of Gensokyo's impending invasion of Earth.\n\n Falsified images, testimonies, and military reports continued to appear on the radio. The population affected by the Moon's frequency was oblivious to the contradictions, only knowing that life was spiraling out of control, and that the government had already identified the enemy they should fear.\n\n Anger began to surge towards Gensokyo. Nations expanded their armies and blocked information under the guise of protecting human civilization, viewing opponents as collaborators with Youkai.\n\n Lunar Capital created the disaster and then directed all the panic towards us."

 KYO_lunar_prewar.4.a:0 "Fear has been directed at Gensokyo."


 KYO_lunar_prewar.5.t:0 "Weapons from the Moon"

 KYO_lunar_prewar.5.d:0 "Tengu reconnaissance team photographed equipment not belonging to Earth at several military bases.\n\n Rifles without magazines could continuously fire white beams; armored vehicles were covered with purifying materials that resisted youkai energy; and command equipment directly used the Moon Rabbit army's wavelength communication. Some bases even contained temporary passages connecting to the Moon, through which weapons and troops in white uniforms were continuously arriving on the surface.\n\n This equipment did not pass through any Earth factories, nor did it appear in any country's publicly available military records. Lunarians were in command, Moon Rabbits formed elite forces, and the armies of controlled nations would provide them with numbers and supplies.\n\n We are not facing a manipulated human army. Lunar Capital has already fully deployed its weapons, soldiers, and command system on Earth.\n\n The invaders are not imminent—they are already on the ground."

 KYO_lunar_prewar.5.a:0 "Lunar Capital has been preparing for this war for a long time."


 KYO_lunar_prewar.6.t:0 "The Moon's Final Warning"

 KYO_lunar_prewar.6.d:0 "Late at night, Eientei received a forcibly accessed communication from the Moon. Sagume Kishin in the video didn't speak, only holding up a pre-written warning to prevent her abilities from altering the impending outcome.\n\n§ROnly seven days remain until the full-scale invasion.§!\n\n Replacing national leaders, unifying social perception, creating panic about Gensokyo, and deploying the Moon's army to the surface—all preparations are complete. Seven days later, the controlled nations will simultaneously launch an attack on Gensokyo, and the Lunarian forces hidden on Earth will take over strategic facilities.\n\n Meanwhile, Lunar Capital will block the road to the Moon, forcing Gensokyo to endure endless sieges on the ground.\n\n After reading the warning, Yukari immediately ordered Hundred Youkai Accord to enter maximum combat readiness. There is no time to continue concealing the truth, and no force can remain uninvolved.\n\n Seven days later, the war between Lunar Capital and Gensokyo will officially begin."

 KYO_lunar_prewar.6.a:0 "In the final week, all workshops will switch to wartime production."
