l_english:

  shining_needle.1.t:0 "No one sat on that chair."
  shining_needle.1.d:0 "Shellfire had left gaping cracks in the old government's great hall. At its centre stood a high-backed chair, polished spotless—as though someone had long ago decided that every victor naturally belonged upon it, receiving the bowed heads of everyone below.\n\n Seija approached the chair and placed one hand upon its back. The officers following her stopped to watch, expecting their new leader to complete the most ordinary transfer of power. Instead, she heaved the entire chair down the steps. It struck the floor, and one armrest snapped clean away.\n\n “Bring in a table,” Seija said without sparing the wreckage a glance. “We begin the inventory tomorrow. If anyone is in such a hurry to build me a throne, burn them with it.”\n\n For the first time, the revolutionary army understood that her talk of overthrowing those above did not merely mean replacing the person in the highest seat."
  shining_needle.1.a:0 "Let's see what we've actually won."

  # 事件概况：正邪胜利后的第一个私人场景，拒绝直接继承旧政权的统治姿态。
  # 角色方向：强调正邪反王座、重行动的性格，同时把故事引向战后清点与重建。

  shining_needle.2.t:0 "The last few boxes of grain in the warehouse"
  shining_needle.2.d:0 "The inventory continued through the night. By morning, all that remained upon the table was an embarrassingly brief report: too little food, too little medicine, too few houses fit to shelter anyone from the rain, and hardly a vehicle still capable of delivering any of it.\n\n A long queue had already formed outside the storehouse. The wounded needed medicine; the Human Village needed grain; homeless youkai needed timber; and the workshops demanded the last of the fuel, without which even farm tools would be beyond repair within days. Every request was reasonable. The stores could not meet them all at once.\n\n Wakasagihime laid the figures before Seija. Sekibanki insisted that the inventory be made public, while Kagerou guarded the door against anyone tempted to seize supplies in the confusion. As Seija studied the ever-diminishing numbers, she discovered for the first time that government was not always a matter of deciding who should fall. More often, it meant deciding who must wait one more day.\n\n She ordered the creation of an emergency rationing office and the registration of every movable supply.\n\n The first allocation would begin at once."
  shining_needle.2.a:0 "Spread the accounts out, let everyone see how much we have left."

  # 事件概况：资源分配小游戏的正式剧情入口，解释玩家分配的资源来自战后库存与调度能力。
  # 角色方向：让正邪第一次承担无法满足所有人的现实责任，并确立公开账目原则。

  shining_needle.3.t:0 "People who aren't on the list"
  shining_needle.3.d:0 "Nue threw a stack of crumpled papers onto Seija's desk. The top few looked somewhat like applications, but the further down the list, the more chaotic it became: some people only drew crooked trees near their residences, some registered using three different aliases, and one simply said, “There are three mouths under the bridge.”\n\n Seija flipped through a few pages, her brows furrowing deeper and deeper.\n\n'No names, no fixed addresses, not even the numbers match up. How am I supposed to distribute them? “Nue, who had been leaning against the doorframe laughing, suddenly lost her smile upon hearing this.\n\n'That's fast,” she said. “You've only been sitting in that chair for a few days, and you've already learned to speak in the same tone as those guys before.”\n\n Seija abruptly looked up. She wanted to argue that supplies needed to be calculated, transportation needed to be located, and rationing couldn't be based solely on a simple “trust me.” But when she looked again at those applications that didn't resemble applications, she suddenly understood the real problem Nue had brought: these people weren't without identities, but their identities had never been recognized by any institution; they weren't without homes, but the places they lived were never worthy of appearing on a map.\n\n “If they don't register, their belongings might be fraudulently claimed. If they're forced to register, they might be found through the roster,” Seija whispered. “You deliberately dumped the most difficult ones on me.”\n\n “Of course,” Nue smiled again, but not with the same ease as before. “The easy ones never need me to knock on their doors.”\n\n The two finally devised a temporary solution: using delivery locations, actual numbers, and collection codes instead of official household registrations, allowing aliases, and not questioning race or origin. Nue was responsible for confirming the existence of those settlements, while the distribution office was responsible for keeping records that could be verified but not used for tracking down the perpetrators.\n\n Seija finished reviewing the last sheet of paper and realized that the last page was completely blank.\n\n “Who is this again?”\n\n “For those who don’t dare to come yet.” Nue replied."
  shining_needle.3.a:0 "A name can be temporarily absent, but rations cannot disappear because of it."

  # 事件概况：正邪起初因申请资料混乱而无法配给，差点重现旧制度排除无名者的逻辑，最后与鵺设计匿名核验方式。
  # 角色方向：鵺并非反对一切记录，正邪也并非迷信管理；两人开始理解“看见”与“定义”之间必须保持界线。

  shining_needle.4.t:0 "A name can be left blank, but a place cannot."
  shining_needle.4.d:0 "After reviewing the “Youkai Equality Draft,” the clerk pushed the document in front of Nue, asking her to sign it as a representative. Nue picked up the pen and looked at it for a long time, but finally put it back on the table.\n\n “I won’t sign.”\n\n The meeting room suddenly became noisy. Some thought she was just looking for trouble from the start, while others questioned why Youkai, who refused to leave her real name, could demand institutional protection. Seija, suppressing her anger, asked her, “No one is willing to take responsibility for the terms of the law.\n\n How can this piece of paper be effective?”\n\n Nue looked at her, her voice colder than usual. “You say you want to protect things whose identities are unclear, but the first step is to ask us to hand over our identities. What's the difference between that and calling a bird into a cage and promising that the cage door won't be locked?”\n\n This question left Seija speechless. She had once thought that as long as the new system was willing to write down the names of those who were different, it was acknowledging them; Nue, however, reminded her that names could also become the first clue for classification, surveillance, and pursuit.\n\n After a long silence, Seija retrieved the document and rewrote the eligibility clauses herself: Guarantees could not be based on a formal name, fixed appearance, registered address, lineage, or recognized residence; appeals could be filed anonymously, but the investigating and executing agency must keep a public record.\n\n “You don't have to believe this piece of paper will automatically protect anyone,” Seija pushed the revised draft back. “It just gives you something to use to accuse me.”\n\n Nue stared at her: “What if one day you say war, crisis, or some “bigger picture” is more important than these clauses?”\n\n “Then you'll take it and publicly prove I broke the law.”\n\n Nue finally picked up her pen again. She didn't write her name, only drew a black shadow whose features were indistinguishable. The clerk tried to stop her, but Seija added, “The signatory refuses to be fixed in their definition, but agrees to be responsible for oversight.”\n\n After reading it, Nue muttered to herself that the sentence was terribly written. But she didn't put her pen down."
  shining_needle.4.a:0 "The system doesn't need to know who she is, but it must acknowledge that she stands here."
  # 事件概况：鵺拒绝用固定姓名签署平等起草书，引发关于身份保障与身份控制的争论。
  # 角色方向：正邪理解记录也能成为压迫工具；鵺则接受制度不只是牢笼，也可以成为追究统治者责任的凭据。

  shining_needle.5.t:0 "Which eye did you close?"
  shining_needle.5.d:0 "Seija had not slept for several nights. Whenever she closed her eyes, she heard all the questions left unspoken during the day: the silence of bereaved families, the hesitation of officers confronted by gaps in the ration rolls, and the satisfaction she refused to acknowledge when the crowds chanted her name.\n\n That was when Koishi appeared upon the windowsill, swinging her legs as though she had grown directly out of those tangled thoughts.\n\n “Your mind is very noisy,” Koishi said.\n\n “At least I still have something to make a noise about,” Seija snapped. “Unlike you. Close your eye, and nothing matters any more.”\n\n Koishi's smile stopped for an instant.\n\n “Do you think I closed it because I felt nothing?”\n\n For the first time, Seija saw something like hurt upon her face. Koishi told her how the Third Eye had once let the loathing, fear, and rejection of others pour into her heart without the slightest barrier. She had not closed it because she could not feel, but because she felt too much—and had locked away the self that could feel it all.\n\n “What about you?” Koishi asked. “Always cursing, always fighting, always saying you are not afraid—is that what it means to keep your eyes open?”\n\n Seija tried to answer, but remembered how every question about the responsibilities of victory made her reach first for a louder slogan. One of them had shut her eye. The other held her anger so high that no one could see what lay beneath it.\n\n Koishi jumped down from the sill and offered her hand.\n\n “I can take you inside. But I don't know the way back.”\n\n “Then why would you dare offer to guide me?”\n\n “Because you look lost too.”\n\n Seija stared at the outstretched hand for a long while before finally taking it. Neither of them was a healer, and neither was more lucid than the other. That was precisely why this road could only be travelled together."
  shining_needle.5.a:0 "Then let's get lost together, and find the exit together."
  # 事件概况：正邪误以为恋关闭第三只眼代表什么都不在乎，恋则指出正邪的愤怒同样是一种遮掩。
  # 角色方向：两人不是引导者与被治疗者，而是使用不同方法逃避痛苦、因此能够互相照见的同行者。

  shining_needle.6.t:0 "Who forgot whom here?"
  shining_needle.6.d:0 "After entering unconsciousness, the first thing Seija saw were countless faces looking up at her. Some called her a liberator, some cursed her as a jinx, and others repeatedly asked who should be held responsible for the dead. Every time she tried to answer, the crowd changed their expressions, making all explanations seem false.\n\n She turned to look for Koishi, but found no one behind her.\n\n “You ran away again?” Seija called out into the darkness, “Drag me in here, and then act like nothing happened to you?” There was no response.\n\n Just as Seija began to doubt whether Koishi had really been there, a hand reached out from the shadows at her feet and grabbed her ankle tightly.\n\n Koishi lifted her face from the darkness, her eyes devoid of any smile for the first time.\n\n “It's not that I left,” she said, “It's just that when you're scared, you only see yourself.”\n\n Seija was stunned. Koishi was trembling too. Her deepest fear wasn't being disliked, but that after she disappeared, no one would even notice that someone was missing. She always pretended to find forgetting easy, because admitting to wanting to be remembered was far more unbearable than being forgotten itself.\n\n “Don't you say you don't need anyone at all?” Seija asked.\n\n “Don't you say you're not afraid of what others think?” Koishi countered. They both fell silent. It turned out they each saw the other as someone they could never be: Seija envied Koishi's apparent freedom from all gazes, while Koishi envied Seija's courage to let the whole world see her. One feared rejection after being seen, the other feared being ignored forever after stopping her shouting.\n\n The surrounding voices drew closer again. Seija didn't draw her weapon, and Koishi didn't retreat into the shadows. They grasped each other's hands, letting the praise, the condemnation, and the fear pass by.\n\n The trial wasn't over; it was just that for the first time, no one remained alone."
  shining_needle.6.a:0 "This time, I will remember you were here too."
  # 事件概况：正邪在无意识中失去恋的踪影并误以为她逃跑，实际却是两人都被自身恐惧遮蔽了对方。
  # 角色方向：揭露恋害怕被遗忘、正邪害怕不被看见的共同伤口，让审判成为互相理解而非单方面剖析。

  shining_needle.7.t:0 "After the cheers subsided"
  shining_needle.7.d:0 "Unconsciously, Seija was transported back to the very beginning of the revolution, to the riots. She saw the lord's granary burning, the guards fleeing, and the starving crowd bursting through the gates. The firelight illuminated countless smiling faces—her favorite memory.\n\n “Look,” Seija pointed to the crowd, as if finally finding evidence to defend herself, “they wanted me to destroy everything too.”\n\n Koishi didn't refute, only pushed the timeline back one day.\n\n The flames disappeared. Only charred beams remained of the granary, and the crowd searched through the rubble for unburnt grain sacks. A woman Seija remembered as the loudest cheerer knelt in the ashes, holding her child, asking if there was anything left to eat.\n\n “She wasn't cheering for the fire,” Koishi said.\n\n “She just saw the barn door finally open.” Seija remembered how she'd been too busy chasing the fleeing lord to check what had happened to those people. She remembered the sound of the wall collapsing, but not what those behind it needed; she remembered the moment everyone rushed in with her, but mistook their cheers for a willingness to live in ruins forever.\n\n “That barn should have been opened,” Koishi said softly. “But are opening it and burning it the same thing?”\n\n Seija crouched down, picking up a handful of charred wheat grains from the ashes. She didn't deny the resistance, nor did she pretend her anger was worthless. Some doors, if not smashed, will never open for those below. Her real mistake was misinterpreting the moment of successful destruction as the fulfillment of everyone's wishes.\n\n “I wasn't wrong because I flipped the table,” Seija said. “I was so focused on how the table fell after I flipped it that I forgot there were people waiting to eat.”"
  shining_needle.7.a:0 "I can't just remember what the fire looked like."
  # 事件概况：正邪重新看见早期暴动的第二天，发现民众欢呼的是粮仓开放，而不是废墟本身。
  # 角色方向：不否定破坏旧秩序的必要性，而是让正邪理解推翻只完成了开门，不能代替门后的建设。

  shining_needle.8.t:0 "The child at the highest point"
  shining_needle.8.d:0 "Deep within my unconscious mind lies a tattered wooden box. Young Seija stands on it, draped in a stolen cloth as a cloak, commanding several weak youkai to line up. She speaks with great conviction, simply because when she stands there, all eyes are drawn to her.\n\n The adult Seija immediately averts her gaze. “It's nothing.\n\n Even little kids play these games.” “But you still want to stand there now,” Koishi said.\n\n The wooden crate then transformed into a high platform in the conference hall, a command post for the army, and the throne that had been pushed down the stairs. Seija wanted to rewrite the rules, to prevent anyone from trampling her back into the mud, and to enjoy the feeling of having her orders executed immediately and everyone waiting for her to speak.\n\n “Yes, I want that.” She finally admitted, “I'm fed up with only being able to curse from below. I want my words to carry weight, to make those who never even looked at me before hear them.”\n\n She had thought that saying these things would make her revolution seem hypocritical.\n\n Koishi, however, simply sat on the edge of the crate, at the same height as her. “What's so strange about someone who has never had power wanting power?” Koishi asked, “Is wanting to no longer be powerless the same thing as wanting everyone else to be powerless?”\n\n Seija stood there stunned for a long time. Her real mistake wasn't her desire for power, but her fear of acknowledging it, letting it hide behind her ideals, unchecked, unnamed, and without boundaries.\n\n “If I continue to pretend I don't want to sit on it,” she looked at the wooden box, “it will eventually become a throne where I can't see it.”\n\n This time, she didn't kick it over, nor did she sit on it. She carved a line on the side of the box, marking a height that no power could surpass."
  shining_needle.8.a:0 "Only by acknowledging my desire for power can I decide where power must stop."
  # 事件概况：正邪看见童年时因被仰望而快乐的自己，承认革命之外也存在不愿再度无力的权力欲。
  # 角色方向：区分“希望自己拥有力量”与“希望别人失去力量”，将诚实面对欲望变成设置权力边界的前提。

  shining_needle.9.t:0 "Leave a key for those who overthrow me."
  shining_needle.9.d:0 "On the third day after returning to reality, Seija began revising the platform. She wrote down public accounts, grassroots appeals, regular inquiries, and impeachment procedures, but stopped when it came to the supreme leader. “Any person in charge should be subject to supervision,” Koishi read aloud, leaning on the table. “Who are the “persons in charge”?”\n\n “All those in power.” “Including whom?” Seija impatiently pointed to herself.\n\n Koishi shook her head: “I don't know who you're pointing to.” At that moment, Seija finally realized she was still hiding. It's easy to write constraints as abstract principles, because someone can always explain in the future that the supreme leader is an exception; the real difficulty is to make the provisions explicitly state that launching a revolution, winning a war, and gaining support cannot be reasons for exemption from accountability.\n\n She crossed out the original sentence and rewrote it: “Any leader, including Seija Kijin, is subject to public questioning and can be removed from office through due process.\n\n Obstructing or retaliating against those who file complaints is considered a betrayal of the “subordinates overthrowing superiors” principle.” When she wrote her own name, her pen lingered on the paper for too long, the ink slowly spreading.\n\n Koishi didn't urge her, but simply dipped her finger into the ink and pressed a small fingerprint below the provision. “What if you later say this wasn't your intention?”\n\n Koishi asked. “Then take this paper out.” “What if you forget me?” Seija looked up at her. She remembered the hand that had unconsciously reached out from the shadows, and added a line next to the fingerprint: Anonymous, unregistered, or unidentifiable persons also have the right to appeal.\n\n Koishi briefly opened her third eye, watching Seija sign. That eye quickly closed again, but this time not to escape. “Okay,” she said, “Then I'll remember where the key is for those who want to overthrow you in the future.”"
  shining_needle.9.a:0 "A revolution that cannot overthrow its own leader is not worthy of being called an overthrow of its superiors."
  # 事件概况：正邪在恋的追问下，明确把自己的名字写进罢免与监督条款，并保障无固定身份者的申诉权。
  # 角色方向：让正邪的自省承担真实政治风险，也让恋从害怕被遗忘转向主动成为制度记忆的一部分。

  shining_needle.10.t:0 "A Key That Opens from the Inside"
  shining_needle.10.d:0 "After Flandre decided to stay temporarily, the placement staff immediately encountered a problem. Some suggested clearing out a heavily guarded separate residence, while others advocated for rotating guards outside the door. All the proposals sounded reasonable, but they were merely preparations to move her from the basement of Scarlet Devil Mansion into another, smaller cell.\n\n After listening to the debate, Seija took an old key from a drawer and threw it directly into Flandre's arms.\n\n “A small room next to the south warehouse.\n\n The door hinge is a bit crooked, figure it out yourself.”\n\n Franc looked down at the key, not moving it. “Is this an experiment?” she asked, “to see how long it will take for me to break the room?” “No.” “I didn't believe you wouldn't lose control, nor did I think that adding two more locks would stop you,” Seija replied.\n\n This statement surprised Flandre even more than unconditional trust. Seija hadn't portrayed her as a harmless, healed child, nor had she prejudged her because of potential danger.\n\n “If you really want to leave, which lock can stop you?” Seija continued. “If you want to stay, open the door yourself.”\n\n The room contained only a bed, a table, and a window that wouldn't close completely. Flandre inserted the key into the lock, opened it from the outside, then went inside and opened it from the inside again. She tried several times until she was sure no one in the hallway was waiting to relock the door.\n\n That night, she placed the urn on the table and fell asleep holding the key. The next morning, Seija found a disassembled door hinge and a note with hesitant handwriting at the door.\n\n “I want to fix the door. After it's fixed, will it still be mine?”\n\n Seija wrote below: “The door is yours. You're responsible if it's damaged.”"
  shining_needle.10.a:0 "Freedom is not about having no door, but about holding the key in your own hand."
  # 事件概况：芙兰误以为新房间是另一场监禁或服从试验，最终确认门能够由自己打开，也由自己负责。
  # 角色方向：正邪既不假装芙兰毫无危险，也拒绝用尚未发生的错误惩罚她，让信任建立在选择与责任之上。

  shining_needle.11.t:0 "The Broken Water Pump"
  shining_needle.11.d:0 "While helping move supplies in the resettlement area, Flandre discovered the handle of the public water pump was stuck halfway. She gripped the handle and applied slight force, and the cast iron casing shattered into several pieces before everyone's eyes.\n\n Silence immediately fell. Those who had been standing nearby instinctively took a few steps back. Someone whispered, “It really was Scarlet,” as if a water pump had proven all the fears about her were real.\n\n Flandre watched the retreating feet, her expression turning cold.\n\n “So this is the answer,” she said. “Once I break something, you'll know I can only ever break things.”\n\n When Seija arrived, she didn't comfort her, nor did she reprimand those around her for not being more forgiving. She only asked: “Did you break the water pump?”\n\n Flandre nodded. “Then fix it.\n\n What's the point of having a surname if you can't make it work again.”\n\n Nitori Kawashiro was called in to guide the repair. She didn't lower her standards because of Flandre's status, nor did she take the tools from her hands. Flandre wore out two sealing rings and broke a screw once, repeatedly thinking that Nitori would let her leave; Nitori only pushed new parts over and told her where she went wrong.\n\n In the evening, the pump finally spat out a stream of muddy water, which gradually became clear. The person who had previously retreated approached again with a bucket, still cautious, but not refusing to use the pump she had repaired.\n\n “Does this prove I'm not a calamity?” Flandre asked softly.\n\n “No,” Seija replied. “It only proves that you broke a water pump and then fixed it. One mistake isn't a verdict, and fixing it isn't an absolution. You just did something that any ordinary person would make a mistake about and could do right again.”\n\n Flandre looked at her oil-covered hands. For the first time, she realized that being treated like an ordinary person didn't mean others would never be afraid of her again, but rather that every mistake she made no longer had to be evidence that she was inherently flawed."
  shining_needle.11.a:0 "If we get it wrong, we fix it. No bloodline will answer for anyone."
  # 事件概况：芙兰失手破坏公共水泵，把众人的恐惧理解成最终判决，随后在荷取指导下亲手修复设备。
  # 角色方向：普通责任既不是无条件原谅，也不是永久定罪；芙兰开始理解行为可以被纠正，而身份不必替行为承担全部意义。

  shining_needle.12.t:0 "See you tomorrow"
  shining_needle.12.d:0 "Flandre began helping install window frames in the new settlement. She wasn't very skilled, occasionally crushing nails along with planks, but she could leap to the eaves and lift beams that others couldn't move. The construction team didn't treat her as a symbol or a VIP, only assigning her the most difficult tasks and bluntly telling her to start over when she made a mistake.\n\n As they finished, a child responsible for painting the eaves called her over.\n\n “Are you coming again tomorrow? The red side isn't finished yet.”\n\n Flandre paused, “Why do you insist I come?”\n\n “Because you don't need a ladder.” The child answered matter-of-factly, then ran off with their paint bucket, “See you tomorrow!”\n\n Flandre stood there for a long time. She had heard oaths, commands, seals, and promises of eternity, but few had so casually placed her into tomorrow. The statement didn't demand she inherit anyone's legacy, nor did it worry about her losing control; it simply assumed that those she worked with today would return tomorrow.\n\n Back at her lodgings, Flandre moved the urn to the shelf beside her bed, clearing a space on the table. She wrote on a scrap of paper: “Tomorrow, red roof.”\n\n Seija saw the words as she passed the door. Flandre looked up and asked, “What if I don't want to go tomorrow?”\n\n “Then tell them yourself,” Seija replied. “No one can promise for you. But if you want to go, don't be late.”\n\n “If I go, will they always need me?” “I don't know.\n\n The house will eventually be built, and the roof will eventually be painted.” “Seija paused. “But after this is over, you can decide what you want to do next.”” Flandre looked back at the words on the paper. In the past, she always thought belonging meant being needed by someone forever. Now, for the first time, she thought that perhaps belonging could simply be about having more choices.\n\n She added a small stroke to the paper.\n\n'See you tomorrow. '"
  shining_needle.12.a:0 "Someone is waiting for her tomorrow—and after that, there will always be another tomorrow."
  # 事件概况：芙兰在工地获得一份普通的明日约定，并追问自己是否必须永远被需要才拥有位置。
  # 角色方向：将归属从对某个人的依附转化为持续选择生活的权利，避免用新的集体取代旧家族成为另一副枷锁。

  shining_needle.13.t:0 "The first blueprint that was torn up"
  shining_needle.13.d:0 "Nue, Koishi, and Flandre sat together at Seija's conference table for the first time, reviewing the standard blueprint for the new settlement. The plan seemed impeccably efficient: unified dormitories, a centralized canteen, a fixed roster, external door locks, and administrators appointed by headquarters.\n\n “Build it this way, and it can accommodate the most people in three months,” Seija said.\n\n Nue flipped to the last page of the roster: “Where will people without official names, who frequently change their appearance, or who simply don't want to explain their origins live?”\n\n “They can register temporary status first.” “And how long is it temporary?\n\n Who decides when she finally becomes a “normal resident”?”\n\n Before Seija could answer, Koishi had already traced a row of closely spaced beds with her finger.\n\n “There's nowhere here for anyone to be alone.”\n\n “This is a shelter, not a hotel.” “Aren't we allowed to hide when we're scared?” Koishi asked. “Or can we pretend no one is crying as long as everyone can see?”\n\n Flandre remained silent, staring at the lock on the dormitory door. After a while, she asked, “Why is the lock on the outside?”\n\n The designers explained that it was for fire prevention, riot control, and protecting dangerous residents. Flandre placed her room key on the blueprints and said softly, “The people who locked me up always say it's for safety.”\n\n Seija felt a surge of annoyance. The road wasn't finished yet, and the timber was dwindling every day; this plan was the fastest way to implement it. She almost wanted to end the argument with the phrase “extraordinary times,” but suddenly realized that she was preparing to simultaneously build the very things that the three people feared into the new house in the name of efficiency.\n\n She didn't argue; instead, she grabbed the blueprints and tore them in half.\n\n The second plan wasn't completed until dawn. Fixed household registrations were changed to replaceable resident numbers; doors had to be able to open from the inside; a small number of private spaces were added in addition to the large dormitories; administrators' orders and resource accounts were made public, and residents could appeal without revealing their identities.\n\n The new plan was more expensive, slower, and still couldn't cater to everyone. Nue felt the oversight clauses weren't sharp enough, and Koishi drew a non-existent window next to the private space, while Flandre insisted on personally checking every lock.\n\n No one declared the disagreement resolved. Seija pressed the revised blueprints onto the table. She finally understood that domination wasn't about cramming everyone with the answers you'd learned, but about letting those answers be refuted by every wound in reality.\n\n A few days later, the first foundation was laid according to the second blueprint. It wasn't the beginning of a perfect new world, just a house that didn't repeat the mistakes they had already understood."
  shining_needle.13.a:0 "Only blueprints that can be pointed out for errors are qualified to be used to build a house."
  # 事件概况：正邪提出高效率的统一安置方案，却被鵺、恋与芙兰分别指出身份登记、心理空间和外部门锁的问题。
  # 角色方向：三条角色线不以和谐会议合流，而是让各自的伤口真正改变国家建设；正邪也学习统治不是拥有答案，而是允许答案遭到修正。

  shining_needle.14.t:0 "The allocation table next to the drawing"
  shining_needle.14.d:0 "When Seija spread the plans across the mud, Sekibanki checked the figures first, Kagerou looked for the best warehouse sites, and Wakasagihime crouched beside the local residents to ask what they needed most. It did not take them long to realize that reconstruction and rationing could not be planned separately.\n\n Roads required building materials. Farmland required tools. Resettling refugees consumed housing, while reopening workshops first meant setting aside fuel. Every project would squeeze some other need in the short term—yet might also restore far more production a few months later.\n\n Seija turned emergency relief into a reconstruction-allocation system. The resources at her disposal were no longer a mere stockpile, but the sum of food, tools, transport capacity, labour, and administrative reach. Every allotment was a choice about which part of the country would be helped back onto its feet first.\n\n Sekibanki gave her one warning: “Don't just record how much we send. Record whether it ever gets there.”"
  shining_needle.14.a:0 "From today onwards, rations must also be produced for tomorrow."

  # 事件概况：资源小游戏进入第二阶段，从战后救济转为生产与重建投资。
  # 角色方向：草根三人分别代表监督、行动与道德底线，使机制与角色自然结合。

  shining_needle.15.t:0 "The discarded stuff is here to report."
  shining_needle.15.d:0 "When Kogasa Tatara arrived at the construction site, she was followed by a strange group: chipped pots, broken-stringed harps, rusted knives, old cars that wouldn't turn, and a group of tsukumogami who were equally unsure of what else they could do. “I heard they take things people don't want here!” Kogasa exclaimed excitedly, then suddenly realized that this included herself, and her smile froze briefly.\n\n Seija didn't comfort her, but simply shoved the repair list into her arms: “First, prove these things still work. Then go tell everyone that being thrown away and being useless are two different things.”\n\n A few days later, the first repaired transport vehicle started up again. Kogasa stood on the roof, laughing louder than the engine. Those objects that had once been thrown into a corner began to become the first machines to turn in the new society."
  shining_needle.15.a:0 "Old things are not waste, and neither are tsukumogami."

  # 事件概况：小伞与付丧神加入重建的招募事件。
  # 角色方向：让小伞获得被需要的喜悦，同时保留她对再次被工具化的敏感。

  shining_needle.16.t:0 "Winter Behind the Grain Depot"
  shining_needle.16.d:0 "When the old magnates' granaries were opened, the stores inside far exceeded anything they had declared. The owners insisted it was next year's seed grain, family reserves, and property held in trust. Outside the doors, people were already collapsing from hunger.\n\n Kagerou's people secured the entrances. Sekibanki audited the ledgers line by line. Wakasagihime insisted that enough seed be retained to prevent today's meal from becoming next year's famine. Seija took the keys in public and placed the entire stock under the rationing authority.\n\n The cheering did not last. Transport, storage, and distribution immediately became the next crisis, while some officials tried to claim early allocations for their own districts. Seija ordered each day's movements published for all to see: anyone taking over a granary would answer to public scrutiny as well.\n\n Breaking a lock could save people today. Keeping grain flowing into their cooking pots would be the true test of the new order."
  shining_needle.16.a:0 "The keys belong to the public, and the accounts must be accessible to everyone."

  # 事件概况：集中接管粮仓路线的落地事件，呈现查封、征收与公开监督。
  # 角色方向：正邪采取强硬措施，草根三人则确保征收不会变成新一轮掠夺。

  shining_needle.17.t:0 "After receiving the land"
  shining_needle.17.d:0 "After the abandoned manor was redivided, many people had land to cultivate for the first time. The registration day was filled with disputes, yet also with a rare post-war anticipation.\n\n A few days later, Wakasagihime returned with another report: some lacked seeds, some lacked farming tools, and some fields' irrigation ditches were already damaged. Even if a single household received land, it wouldn't be able to undertake all the repair work.\n\n Therefore, local mutual aid workshops were established simultaneously with the land distribution. Kagerou was responsible for organizing labor, Sekibanki checked whether local representatives were secretly favoring their cronies, and Wakasagihime had villages with surplus food and tools support their neighbors who were temporarily unable to work.\n\n Returning land to the cultivators was only the first step. True autonomy required empowering people to make their own decisions."
  shining_needle.17.a:0 "Hand over the land, and also the tools and decision-making power."

  # 事件概况：地方互助路线的后果事件，补足土地改革之后的生产困难。
  # 角色方向：避免把分田写成自动成功，突出草根网络与地方能力的重要性。

  shining_needle.18.t:0 "The first meeting of the Production Committee of All Instruments"
  shining_needle.18.d:0 "The first committee meeting was chaotic. Craftsmen demanded standardized parts, tsukumogami worried about being treated like a silent machine, transporters complained the plan completely ignored road conditions, and local representatives insisted on prioritizing infrastructure.\n\n Benben asked if her harp would also be dismantled for materials, while Yatsuhashi countered by asking if an object possessed consciousness—was it a worker, a tool, or both? Kogasa raised her hand, earnestly demanding that even frightening work be considered special labor. Seija didn't answer all the disputes.\n\n She only established three rules: production plans must be public, committee members could be replaced, and tsukumogami had the right to refuse dismantling and modification.\n\n From then on, resource allocation was no longer just about taking old stock from the warehouse. The union and the Hundred Instruments Committee began continuously manufacturing, repairing, and transporting new materials."
  shining_needle.18.a:0 "Let the producers decide how the machines should operate."
  # 事件概况：建立工会与百器生产委员会，并将资源小游戏转入稳定生产阶段。
  # 角色方向：处理付丧神既是器物又是劳动者的独特问题，避免把她们再次工具化。

  shining_needle.19.t:0 "A book stolen from the ruins"
  shining_needle.19.d:0 "The books brought into the meeting room came from old government offices, school ruins, aristocratic studies, and unclaimed warehouses. Seija piled books about revolution, the state, trade unions, and political parties on the floor, as if facing another weapon that needed to be dismantled.\n\n Nue flipped through a few pages and began to sneer, Koishi drew meaningless circles next to the theories, and Flandre stared at the recurring names of leaders, asking why humanity always liked to lock itself into history with its names.\n\n Seija did not idolize these authors. She simply acknowledged that predecessors had made many mistakes she had not yet had time to make. If she was unwilling to even study those failures, her revolution would sooner or later repeat the old path with new slogans.\n\n Thus, night schools, cadre reading groups, and simplified textbooks began to appear. For the first time, the revolution seriously studied how it might decay."
  shining_needle.19.a:0 "Break down their answers and keep the usable parts."
  # 事件概况：人类政治书籍进入正邪政权，为后续政党路线提供理论来源。
  # 角色方向：正邪不成为教条崇拜者，而是把理论当作可批判、可拆解的工具。

  shining_needle.20.t:0 "Rosa and Trotsky Remain on the Table"
  shining_needle.20.d:0 "Two books were left on Seija's desk the longest. One warned that once a political party becomes detached from the masses, liberation will become a new form of administration; the other reminded her that an isolated revolution will eventually be besieged by a larger, old world.\n\n Nue worried that centralized organizations would grow new high walls, Sekibanki questioned how the grassroots could replace their superiors, and Kagerou only asked if orders could be delivered to the front lines and construction sites in time. Koishi pointed out that Seija was simultaneously obsessed with two things: the legitimacy given by the masses and the efficiency brought by central orders.\n\n Seija ultimately did not find a formula in the books that could avert contradictions. She was only certain that revolution needed the masses to constantly provide life, and also needed the organization to deliver decisions to those who actually carried them out.\n\n The choices that followed would determine which of the two would gain a greater position first."
  shining_needle.20.a:0 "Theory cannot choose for us, but it can show us what we are choosing."
  # 事件概况：群众路线与政党指挥路线分叉前的政治讨论。
  # 角色方向：让不同角色从自身经验发言，保留正邪对自由与效率的双重需求。

  shining_needle.21.t:0 "The last vote for the provisional program"
  shining_needle.21.d:0 "The meeting had lasted two days before the vote on the provisional program. Representative replacement, central authority, local autonomy, public criticism, resource allocation, and cadre vetting—each clause bore the marks of revisions in different handwriting.\n\n Seija sat at the end, not demanding anyone accept the original draft simply because she was the revolutionary leader. Nue preserved the right to open questioning, Koishi forced the program to acknowledge that the leader could deceive herself, and Flandre deleted all clauses that might arrange positions based on bloodline and species.\n\n When the final vote passed, the applause was not uniform. Some still felt the central government was too powerful, some worried that the mass meeting would slow down action, and others believed that the oversight clauses would prevent the government from acting decisively.\n\n Seija sealed these objections along with the program. She wanted to build not a party without controversy, but a party where controversy wouldn't automatically become a crime."
  shining_needle.21.a:0 "Passed. Then I will accept its constraints starting tomorrow."
  # 事件概况：下克上临时纲领的正式表决与通过。
  # 角色方向：把三条角色线与两种组织路线汇入一份仍保留矛盾的制度文本。

  shining_needle.22.t:0 "The First Winter's Final Account"
  shining_needle.22.d:0 "When the first snow fell, the Reconstruction Committee delivered the final accounts. Some people finally moved into houses that wouldn't leak, some workshops were revitalized, and new roads delivered food to previously inaccessible areas; meanwhile, some settlements still lacked sufficient supplies, some wounded were still waiting for medicine, and some felt their sacrifices had never been seen.\n\n Seija didn't rewrite the report as a victory story. She demanded that resource allocation records, unfinished projects, and appeals from various regions be made public. Groups that had previously received support began to reciprocate with transportation, manpower, and production, while long-neglected areas were left with deeper gap.\n\n This winter didn't make things easy for everyone, but it proved that Gensokyo had been able to transform limited resources into a sustainably functioning society.\n\n Seija closed the final accounts. She had finally helped the upside-down world survive its first season."
  shining_needle.22.a:0 "Leave the results here. Remember these people for the next allocation."
  # 事件概况：战后资源分配阶段的总结事件，适合依各群体投入值追加条件描述或不同选项。
  # 角色方向：不把重建写成完美成功，让玩家过去的分配选择成为后续国家能力与社会缺口。

  shining_needle.23.t:0 "The Envoy Returned from the Moon"
  shining_needle.23.d:0 "Sagume Kishin arrived without any entourage. She stood alone in front of the new government building, her clothes spotless, yet her expression suggested she had traveled a long way.\n\n Seija's body reacted to her at first sight, before her memory could process it. Familiarity, anger, and a name almost escaping her lips surged simultaneously, only to be cut off by silence.\n\n Sagume didn't explain their relationship. She took out the Lunar army's deployment, the administrative plans for the occupied territories, and the war situation of various Earth nations, telling Seija that Lunar Capital had begun to incorporate Earth into its ruling system. Those governments willing to cooperate would be preserved, while Earthly life would become low-ranking subjects in the Moon's order.\n\n'Why are you telling me this? 'Seija asked.\n\n Sagume remained silent for a long time, only writing on the paper: Because I have already lost you once."
  shining_needle.23.a:0 "Let's talk about the war first. We'll deal with the past later."
  # 事件概况：探女正式登场，同时带来月都殖民地球的情报。
  # 角色方向：以身体记忆暗示母女关系；探女克制少言，正邪则把私人情绪暂时压在行动之后。

  shining_needle.24.t:0 "The Moon: Earth in Order"
  shining_needle.24.d:0 "The document Sagume presented said nothing about destroying Earth. The Lunar Capital intended to preserve its cities, factories, roads, and most of its old governments, because a living Earth could still supply materials, labour, and obedience.\n\n The rulers of each nation needed only acknowledge the Lunar Capital's final authority, and they could continue governing their own subjects. Lunar troops would garrison the planet and suppress resistance; officials from the Moon would control foreign affairs, armaments, and strategic resources; all life on Earth would be assigned a political rank permanently beneath the Lunarians.\n\n Seija laughed when she finished reading. She knew this arrangement all too well: those above kept cooperative middlemen in place, then taught everyone below that the world could function no other way. The Lunar Capital had brought no alien system. It had merely raised the old world's hierarchy until Earth itself stood beneath the Moon.\n\n “Good.” She turned the document face down on the table. “If they mean to put the whole Earth below them, then this will be the greatest overthrow of the mighty in history.”"
  shining_needle.24.a:0 "Lunar Capital demands obedience, so we'll let obedience itself rebel."
  # 事件概况：明确正邪线的月人目标是殖民、统治与阶级支配，而非紫线的灭绝计划。
  # 角色方向：正邪迅速把外来征服放进自己的革命逻辑，准备联合地上底层反击。

  shining_needle.25.t:0 "The Truth a Mother Must Tell"
  shining_needle.25.d:0 "Sagume slid a long, narrow wooden box across the table to Seija. Inside lay only a faded hair ribbon, a wooden cup carved with a crooked name, and several old sheets of paper with their dates torn away.\n\n The moment Seija picked up the cup, memory came flooding back without warning.\n\n She saw the suffocating courtyards of the Lunar Capital. She saw her younger self hiding behind Sagume's sleeve; Sagume tying her hair and teaching her to stay quiet in front of others. And she saw a circle of Lunarians who never once lowered their eyes to look at her, deciding on paper that this insufficiently pure child was to be put to death.\n\n Last came a moonless night. Sagume held her tight as she hurried through deserted corridors, carrying her to a hidden passage that led down to Earth. The young Seija wept and clung to her mother's sleeve, refusing to let go.\n\n Then even that hand vanished from her memory.\n\n The cup fell from Seija's fingers and struck the tabletop. She lurched to her feet; the chair legs scraped across the floor with a shriek.\n\n “It was you.” She stared at Sagume, breathing so hard that the words scarcely came out whole. “You took all of this out of my head.”\n\n Sagume did not deny it. She wrote that as long as anyone in the Lunar Capital remembered the child, the execution order might be revived. To make Seija truly disappear beyond the Capital's notice, everyone involved had to forget—and Seija herself had to forget where she came from.\n\n “Then you didn't abandon me.”\n\n As the words left Seija's mouth, a laugh suddenly escaped her. It sounded worse than weeping.\n\n “I hated you for years. Every time I was driven away, every time I was treated like something that had no right to exist, I told myself it was because even my own mother didn't want me.” Her fingers tightened around the edge of the table until her knuckles whitened. “And now you tell me all those years were built on a lie you chose for me?”\n\n Sagume wrote: I am sorry.\n\n Seija snatched the paper away and crushed it in her fist.\n\n “Don't apologize yet.” Her voice began to shake. “Tell me why you never came back for me.”\n\n Sagume remained still for a long time before setting brush to paper again. If she ever openly confirmed that Seija was alive, the Lunar Capital might follow her actions and rediscover the child it had forgotten. She could only remain on the Moon and continue pretending that she had never had a daughter.\n\n Now the lunar army had set foot on Earth. Forgetting could no longer protect anyone, and Sagume had no reason left to remain silent.\n\n Seija did not embrace her. She did not offer forgiveness. She righted the chair she had knocked aside, sat down opposite Sagume once more, and closed both hands around the cup engraved with that childish name.\n\n “Start from the beginning.”\n\n Sagume raised her eyes.\n\n “My childhood. The execution order. The night you sent me away—not one word left out,” Seija said. “However much you took from me, you will give all of it back now.”"
  shining_needle.25.a:0 "Give me back all of my past."
  # 事件概况：探女借由旧物唤回正邪的具体记忆，并承认自己为阻止处决而让所有人遗忘正邪。
  # 角色方向：正邪同时感到被拯救的宽慰与被夺走人生的愤怒；她没有立即原谅探女，而是首先夺回知晓自身过去的权利。

  shining_needle.26.t:0 "There are no checkpoints in my dreams"
  shining_needle.26.d:0 "Doremy Sweet unfolds a map that no one can understand at the war council. It's not terrain, but the paths left by countless dreams interacting with each other.\n\n The Lunar Army can block roads, check radios, and search mail, but they can't stop every soldier and resident of the occupied territories from dreaming. Doremy proposes using dreams to transport passwords, verify identities, and establish initial contact between the Earth resistance and discontented individuals within Lunar Capital.\n\n Sagume is responsible for pointing out the weakest points in the Lunar Army's defenses, while Seija requires that each dream line have a substitute liaison. She doesn't want to gamble the revolution on the goodwill of a dream ruler, which Doremy is quite pleased with.\n\n The first message breaks through the blockade that night: Earth is still resisting. The Moon Rabbit is not simply obedient."
  shining_needle.26.a:0 "Start making contact from where they can't block it."
  # 事件概况：哆来咪加入，建立梦境地下通信网，并连接后续翻转主义传播。
  # 角色方向：哆来咪提供独特能力，正邪仍坚持组织备援，避免援军变成万能工具。

  shining_needle.27.t:0 "The Last Overthrow"
  shining_needle.27.d:0 "The Lunar Army's occupation zone on Earth continued to expand. New collaborationist governments had sworn obedience to Lunar command, while the countries not yet conquered received their final ultimatums. If Gensokyo continued to wait, it would soon be surrounded by a world entirely subject to the Lunar Capital.\n\n Seija signed the order for war against the Moon. She was not defending territory for an old throne, nor did she promise to restore the former international order. She acknowledged only one fundamental truth: those who lived upon the Earth must possess the right to decide its future.\n\n The army began to assemble. Underground networks sent the signal into occupied territory, and the workshops and rationing committees established during reconstruction received orders to prepare for a wartime footing.\n\n “If I become the last person on Earth who still dares resist the Lunar Capital,” Seija told them, “then I will be that last person—and pull everyone else back, one by one.”"
  shining_needle.27.a:0 "Declare war on the Lunarians invading Earth."
  # 事件概况：后半段战争正式开场，正邪决定阻止月都完成对地球的统治。
  # 角色方向：她不替旧秩序而战，而是保卫地上生命决定自身未来的权利。

  shining_needle.28.t:0 "Emergency period"
  shining_needle.28.d:0 "When the emergency council convened, Sagume had already marked the lunar transport nodes and the expected advance speed on the map. The conclusion was clear: Gensokyo must integrate production, rationing, transportation, and manpower into a unified overall plan in the shortest possible time.\n\n War Communism was then implemented. Important workshops, energy, railways, and warehouses were centrally managed; food and raw materials were centrally requisitioned; and necessities were rationed. Workers formed production teams, farmers formed supply teams, and kappa and tsukumogami entered engineering and maintenance units.\n\n The trade unions, local committees, and ration offices previously responsible for postwar reconstruction were not abolished. They were directly transformed into the execution network of total war, continuing to publicly disclose inventory, monitor flow, and send grassroots needs back to the emergency council.\n\n From that night on, Gensokyo operated like a giant military camp. Extraordinary policies concentrated all available fighting forces, pushing the supervisory system previously established by Seija to its most severe test."
  shining_needle.28.a:0 "Flip the rationing table to the wartime side."
  # 事件概况：战时共产主义、兵营式共产主义与总体战的制度化事件，同时转换资源小游戏阶段。
  # 角色方向：非常政策继承既有委员会网络，使集中动员与前半段的群众监督保持连续。

  shining_needle.29.t:0 "Sagume remained silent."
  shining_needle.29.d:0 "The “World-Flipping Decision” was passed clause by clause in the emergency council. Earth rejected Lunar Capital's final decision-making power; Gensokyo would aid resistance organizations across the land and advance the war's objective to dismantle the Moon's colonial system.\n\n When it was Sagume's turn to speak, the hall suddenly fell silent. Everyone knew she came from Lunar Capital, and everyone knew that with just one sentence, she could reverse the situation in an unpredictable direction.\n\n Sagume did not speak. She picked up a pen and signed her name at the end of the Decision.\n\n Seija then signed the document and ordered it to be immediately sent to all war zones. Only she noticed that Sagume's hand trembled slightly as she withdrew it. That silence wasn't hesitation, but rather a preservation of strength for a future defeat that she would have to speak out about."
  shining_needle.29.a:0 "Some words must be saved for the most dangerous moment."
  # 事件概况：签署《翻转世界决议》，并用探女拒绝发言预示后续能力逆转。
  # 角色方向：探女以公开签名承担政治立场，同时保持其少言与谨慎使用能力的特点。

  shining_needle.30.t:0 "The Resolve of an Amanojaku"
  shining_needle.30.d:0 "After the resolution was signed, the others filed out of the meeting room. The ink upon the table was not yet dry. Sagume remained where she stood, as though something still had to be said—and as though speaking might reverse events beyond all recovery.\n\n She approached Seija and instinctively reached out to straighten the collar the wind had disordered. The gesture came from long ago, so practised that it required no memory.\n\n Seija caught her wrist.\n\n “Don't look at me that way again.”\n\n Sagume stopped.\n\n “As if I were still the child who might be discovered and executed at any moment, who could survive only because you hid her.” Seija's fingers trembled, but did not let go. “You saved me once. But your fear of losing me again does not give you the right to decide where I go from here.”\n\n Sagume lowered her head and wrote three words on the back of the resolution.\n\n “I am sorry.”\n\n Seija stared at them for a long time.\n\n “The day I learned that you had not abandoned me, I almost called you Mother.” Her voice had fallen lower still. “Then I became even angrier. So long as I hated you, I could pretend I had never thought of you. Now I have lost even that excuse.”\n\n Sagume's shoulders trembled faintly. She raised her hand once more, only to stop before touching Seija. The lost years still lay between them. No single truth or apology could make them disappear.\n\n Seija released Sagume's wrist but did not step away. Instead, she took the hand suspended in the air and drew it level with her own.\n\n “I am not going to war with the Lunar Capital so they will recognise me as worthy to be your daughter, nor to atone for your sins. I am going to make certain those creatures above us can never again decide who may be born, who must disappear, and who is condemned to live forever beneath them.”\n\n Sagume looked at her. At last, she ceased trying to draw Seija back towards safety and slowly nodded.\n\n Seija turned for the door. Behind her, Sagume set brush to paper again and handed her one final sentence.\n\n “I will wait for you to return.”\n\n Seija read it, turned the paper over, and added her reply.\n\n “Don't stand behind me and wait. Keep up.”"
  shining_needle.30.a:0 "Don't block my way anymore—stand beside me."
  # 事件概况：决议签署后，正邪第一次向探女承认自己曾经思念母亲，也坦白这份思念为何让她更加愤怒。
  # 角色方向：两人没有凭借一次谈话完全和解；探女放下替女儿选择命运的习惯，正邪则允许母亲从保护者变成并肩作战的人。

  shining_needle.31.t:0 "The Ministry of Truth and the reporter"
  shining_needle.31.d:0 "The first notice issued after the establishment of the Ministry of Truth was returned verbatim by Aya Shameimaru. The paper contained only one annotation: “If you've already decided what the truth is, what's the point of having reporters?”\n\n Seija personally summoned Aya. The two argued for a long time in the radio control room. Lunar Capital was fabricating war reports, packaging surrender, and convincing the occupied territories that Earth had voluntarily accepted its rule; but an agency capable of controlling all information could also conceal its own errors within the needs of war.\n\n The final rules, though not mild, were very clear: the Ministry of Truth was responsible for verifying sources, exposing Lunarian propaganda, protecting underground networks, and not automatically classifying policy criticism as enemy infiltration. Aya retained independent authorship and the right to pursue inquiries, while the committee would periodically review withheld reports.\n\n Aya put away the revised document, her smile still somewhat unconvincing. “Very good. Then I'll be responsible for reminding everyone that you can lie too.”\n\n “Just what I wanted,” Seija replied."
  shining_needle.31.a:0 "We are fighting against the Lunarian monopoly, not the people's right to speak."
  # 事件概况：处理「争论不是背叛」与「设立真理部」之间的制度张力。
  # 角色方向：文捍卫诠释权，正邪建立战时反情报机关，同时接受机关本身必须受监督。

  shining_needle.32.t:0 "The second leaflet did not come from the ground."
  shining_needle.32.d:0 "When the first anti-lunarism leaflet appeared at the Moon Rabbit barracks, Lunar Capital immediately labeled it as earthling ideological pollution. The rough paper contained only three questions: Who dies on the front lines? Who gives orders from above? Why must this difference be maintained forever?\n\n A few days later, investigators discovered a second leaflet. This time, the paper came from the Lunar Army's warehouse, and the text was neatly typed using a standard printing press. Below the original questions was an additional sentence: “Why is sacrifice always called the glory of Lunar Capital, while we are never the ones who receive the glory?” The reverse side listed the actual casualties of various Moon Rabbit units, the supplies they had withheld, and the noble officers who had never left the Moon yet had earned merit. This information was only accessible to medical, transport, and archival personnel.\n\n The crackdown escalated, but the leaflets began to spread independently of ground forces. The transport soldiers hid it in supply crates, the medics wrote the casualty figures into the medicine list, and the lower-ranking civilian officials deliberately sent the search order to the wrong department. Doremy then received a request from within Lunar Capital in a dream: “Don't decide for us who will rule in the future. Tell us how to continue the organization without knowing each other's real names.”\n\n Seija didn't send a new slogan, only providing secret groups, coded messages, distributed printing, and contingency plans in case of loss of contact. Sagume pointed out that during patrol gaps, Doremy maintained contact, but the ones actually selecting targets, writing content, and taking the risks were already people within Lunar Capital.\n\n Soon, secret organizations appeared in the barracks, hospitals, transport teams, and lower-level agencies. They may not share the same ideals, but they gradually realized the same thing: Lunar Capital's integrity was always built on the fact that some people had to bear the death and filth for it. The expanding loyalty checks also forced those who were previously silent to confirm each other's positions; what began as small actions to protect comrades gradually turned into suspicion of the entire hierarchy.\n\n The first leaflet came from the ground, the second from Lunar Capital itself. From that moment on, it was no longer about being implanted with the Moon's ideology, but a rebellion that began to speak in its own language."
  shining_needle.32.a:0 "The revolution truly began in Lunar Capital when they started writing about their problems."
  # 事件概况：月兔与月都下层人员自行改写第二份传单，逐步建立不受地上直接指挥的地下组织。
  # 角色方向：正邪只提供组织方法与联络支援，不替月都内部决定诉求、领袖或未来制度。


  shining_needle.33.t:0 "This Rebellion Is Bound to Fail"
  shining_needle.33.d:0 "Lunar Capital's crackdown was faster than expected. Barracks were sealed off, Moon Rabbit units were disarmed in batches, and dream communication points fell silent one after another. Several units preparing to revolt didn't even have time to open their armories before their members were taken away by the loyalty censorship agency. Judging from the map, the rebellion was on the verge of failure.\n\n However, in order to find the infiltrators, Lunar Capital also began to tear apart its own system of governance. Frontline officers no longer trusted the supply convoys, the council accused each other of condoning the rebellion, and the forces responsible for the suppression had to be monitored by another force. Orders stopped at the censorship agency, warehouses were filled with supplies that could not obtain the correct stamps, and commanders in various regions received conflicting mobilization requests. Lunar Capital still possessed fleets and fortifications, but it was becoming increasingly difficult to make these forces obey a single voice.\n\n Sagume walked to the map, saw the cracks that had been stretched to their limit, and finally spoke: “This rebellion will inevitably fail.”\n\n As the words fell, the first thing to change wasn't the battle lines, but the orders. A Moon Rabbit unit ordered to disarm arrested officers and opened armories; transport convoys changed routes, delivering ammunition to the rebellion zone; lower-ranking officials removed arrest lists, and medical personnel refused to hand over the wounded to the authorities. The reconnected dream lines also sent the same action time to various locations.\n\n The Lunarian ruling class immediately fell into mutual suspicion. Some nobles believed the military had staged a coup, while others closed their offices and redeployed elite troops to protect their mansions. The forces that were supposed to suppress the Moon Rabbits instead found themselves locked in a standoff between the council and the noble territories.\n\n Seija immediately activated the backup plan but did not order the ground army to take over Lunar Capital. The resistance was only responsible for cutting off reinforcements, transporting weapons, and guarding the Earth-Moon passage, giving the internal insurgents the opportunity to complete their revolution. Sagume's power didn't create resistance out of thin air; it merely widened the existing cracks simultaneously. Seija's preparations only prevented Lunar Capital from closing them back together.\n\n Soon, Lunar Capital's defensive lights were still on, and central orders continued to be issued, but there were no longer enough people willing to carry them out. It wasn't breached from the outside by ground troops, but rather, layer by layer, from barracks, warehouses, hospitals, archives, and the tightly closed doors of the nobility, it lost the ability to command obedience from its subordinates."
  shining_needle.33.a:0 "We did not breach the Lunar Capital. The Lunar Capital simply lost its power to command those below."
  # 事件概况：忠诚审查加速月都内部瓦解，月兔兵变、运输倒戈、官僚破坏与贵族内斗同时爆发。
  # 角色方向：探女让既有裂缝同步张开，正邪负责阻断镇压；完成革命的主体仍是月都内部的反抗者。

  shining_needle.34.t:0 "I Am Seija, Born an Amanojaku"
  shining_needle.34.d:0 "The high platform in the Lunar Capital's central square had once been reserved for nobles and commanders. Now moon rabbits tore down the veil of hereditary rank, junior officials piled lists of executions and forced service before its steps, and resistance fighters from Earth stood outside the palace that had once issued orders for their subjugation.\n\n Everyone waited for the victor to ascend.\n\n Instead, Seija kicked through the platform's supports. The ornate dais tilted, crashed down, and came to rest level with the square. She stepped over the shattered crest of the Lunar Capital and took her place among moon rabbits, artisans, soldiers, and freed prisoners.\n\n Sagume approached her and asked quietly, “Have you finally come home?”\n\n “I did not come back to inherit this place.” Seija looked upon the city that had declared her unworthy of life, then tried to grind Earth beneath its heel. “I came back with everyone it cast out, held down, and ordered into silence. We came to end it.”\n\n The square fell still. Seija proclaimed the abolition of forced service and hereditary rank, the release of political prisoners, and the recognition of Earth's independence—but she did not proclaim herself the Lunar Capital's new ruler.\n\n “Listen well, Lunarians, moon rabbits, earthlings, and everyone whose name was written at the bottom. They said blood determined who stood above, and purity who deserved to live. They called plunder order and obedience peace, then wrote the blood of those below into the glory of those above. Today, those claims fell with that platform.\n\n “Moon rabbits are not tools to die for the nobility. Earth is not the Lunar Capital's dominion. The Moon is not a throne suspended above all life. No family, people, or world is born with the right to pass judgment on another.\n\n “I will not become your new master. If you overthrow the Lunar Capital only to wait for another name to give orders, then the Lunar Capital never truly fell. Organize. Argue. Decide what this place should become—and keep in your own hands the power to overthrow the next ruler, even if one day that ruler is me.”\n\n Seija raised her chin and looked toward Earth.\n\n “I am Seija, born an amanojaku. If Heaven sets itself above us, I will turn Heaven beneath our feet. If the Moon tramples all life in the name of purity, I will bring before it everyone branded impure, lowborn, or unfit to exist.\n\n “What fell today was not merely a ruling class, but the doctrine that some lives are born to kneel. So long as anyone tries to force others back beneath them—so long as the powerful still write fate for the weak—gekokujou will not end.\n\n “And neither will I.”"
  shining_needle.34.a:0 "No one is born above, and no one is destined to remain below."
  # 事件概况：正邪在月都中央广场摧毁贵族高台，宣布废除强制服役、血统等级与地球殖民体系。
  # 角色方向：正邪拒绝成为月都的新主人，并把反抗未来统治者——包括她自己——的权利留给所有人。

 # ===========================================================================
  # 鬼人正邪路线——战后生活风味事件
  # shining_needle.35～shining_needle.54
  # ===========================================================================

  shining_needle.35.t:0 "The Teacup That Will Not Spill Upside Down"
  shining_needle.35.d:0 "The Tsukumogami Production Committee unveiled a suspicious-looking new teacup. Its rim resembled a base, and its base a rim; first-time users invariably turned it over several times before deciding where to drink.\n\n Kogasa Tatara insisted that it had not been made backwards. A concealed counterweight made the cup wobble upright whenever it was knocked over. She delivered the first finished cup to Seija's desk in wrapping paper labelled: “Defies gravity, just like an amanojaku.”\n\n Seija called the slogan idiotic. Three days later, a queue stretched outside the shop. Within a week, even her own conference table had been furnished with the cups."
  shining_needle.35.a:0 "At least overturning the table will not waste the tea."
  # 事件概况：付丧神工坊把正邪的反转形象做成日常商品，展现战后消费品与幽默感恢复。
  # 叙事方向：用一只实用又荒唐的茶杯表现新政权的文化影响，并让小伞保留爱吓人与夸耀作品的性格。

  shining_needle.36.t:0 "Chaos Stew Becomes a Signature Dish"
  shining_needle.36.d:0 "During the most difficult times of rationing, Mystia could only throw leftover handfuls of rice, a few mushrooms, scraps of river fish, and unidentified wild vegetables from various kitchens into the same pot. It was originally just to provide hot food for more people, and no one named it.\n\n As food supplies gradually recovered, customers began to ask for “that kind of soup with a little bit of everything.” Mystia tried to recreate it with better ingredients, but complaints arose that it lacked the original flavor. Finally, she had to officially write “Mixed Chaos” on the menu and stipulated that the recipe be changed daily based on leftover ingredients from the market.\n\n A food born of scarcity thus became the most popular dinner in the reconstruction area."
  shining_needle.36.a:0 "What's in the pot today?"
  # 事件概况：紧急配给时期的混合料理在生活恢复后变成地方商品与共同记忆。
  # 叙事方向：强调浩劫并未被浪漫化，但幸存者能够把窘迫经验转化成新的饮食文化。

  shining_needle.37.t:0 "Sew the patches in the most conspicuous place."
  shining_needle.37.d:0 "Fabric was still in short supply, and many clothes had to be patched again and again. Initially, people tried to cover the tears with old fabric of similar color, as if as long as the stitches were fine enough, they could pretend the war hadn't left any marks.\n\n Later, a young tailor did the opposite: she covered the charred corners of her clothes with brightly colored fabric and embroidered the repair date and the reconstruction team's name on the outside. Before long, young people, ordinary folks, and workshop apprentices began showing off their patches, some even deliberately adding fake patches to their new clothes.\n\n Seija looked at the clothes on the street that refused to hide their scars and simply commented, “At least they have some taste.” This comment was immediately printed on the tailor's label for the next batch of fabric."
  shining_needle.37.a:0 "Scars don't need to be hidden inside."
  # 事件概况：物资匮乏形成外露补丁的服装潮流，后来演变成重建世代的身份象征。
  # 叙事方向：让战争伤痕进入日常审美，表现民众不是遗忘灾难，而是重新定义它留下的痕迹。

  shining_needle.38.t:0 "Young people with their hats turned backwards"
  shining_needle.38.d:0 "One day, it became fashionable for young people in the community to wear their hats backwards. Vendors in Youkai Mountain quickly followed suit, offering inverted headscarves, asymmetrical headbands, and even a top hat that looked completely wrong.\n\n Aya Shameimaru photographed the entire street's bizarre attire, calling it the “amanojaku craze.” Seija, after seeing the newspaper, immediately declared that these people didn't understand the concept of overthrowing superiors and were simply collectively being foolish.\n\n The next day, merchants printed this phrase on flyers. “Truly rebellious fashion that even Seija herself can't understand” doubled sales again. Aya specially delivered the largest size backwards hat, and then took the photo in front of Seija throwing it out the window."
  shining_needle.38.a:0 "Who dares to publish that photo?"
  # 事件概况：年轻人把正邪形象转化成反戴帽与不对称服饰的流行风潮。
  # 叙事方向：不把文化影响写成官方宣传，而是表现民间如何误读、玩弄并重新包装政治符号。

  shining_needle.39.t:0 "A Revolution a Meter Tall"
  shining_needle.39.d:0 "A woodworking workshop used scraps to make a batch of small mallets, needle swords, and paper thrones that could be knocked over, originally intending to sell them as celebratory souvenirs. However, the first to buy them weren't the officials, but a group of children.\n\n New rules of the game quickly took shape in the streets: whoever drew the crown had to defend the paper throne, while the others used mallets to launch an attack from all sides. Each time, the throne would fall within half a minute, and then everyone would vie to play Seija, no one willing to be the one overthrown.\n\n Seija was forcibly dragged into the game as she passed by. The children unanimously decided to let her play the “big bad guy sitting the tallest,” and then chased her all over the street."
  shining_needle.39.a:0 "This rule is absolutely flawed!"
  # 事件概况：战后纪念品成为儿童游戏，正邪本人反而被分配成遭到推翻的一方。
  # 叙事方向：以轻松方式表现革命语言进入下一代生活，同时避免把儿童写成严肃的政治宣传工具。

  shining_needle.40.t:0 "Losers should also leave their names"
  shining_needle.40.d:0 "Keine Kamishirasawa compiled a war record without heroes. The book includes villagers who lost their families, messengers who went astray, enemy soldiers who surrendered at the last minute, and people who only remember trembling under their tables.\n\n Some questioned whether these experiences were glorious enough, while others believed that the voices of the defeated would weaken the revolutionary narrative. Seija flipped through a few pages and asked only one question: “Did they all survive that war?”\n\n After receiving an affirmative answer, she approved its publication. The first edition quickly sold out. Many readers bought the book not to find the right answers, but to confirm that their own chaotic, cowardly, and not-so-great memories also deserved to be seen by history."
  shining_needle.40.a:0 "History cannot only remember those who stood on the stage."
  # 事件概况：慧音出版普通幸存者和失败者的口述史，形成新的战后文学。
  # 叙事方向：延续正邪关注下位者的主题，同时保留战争记忆的矛盾、怯懦与不完整。

  shining_needle.41.t:0 "Author Unknown"
  shining_needle.41.d:0 "Bunbunmaru Newspaper begins serializing a novel with a confusing identity. The first chapter's protagonist is human, the second hints she might be Youkai, and the third reveals the first two chapters were fabricated testimonies by an unknown entity.\n\n Readers debate endlessly about the protagonist's true identity, even organizing public deduction sessions. Aya Shameimaru claims the author insists on anonymity and uses each debate as a new report. Only Seija notices that Nue Houjuu disappears for half a day before each week's issue.\n\n When a new issue is placed in front of Nue, she first mocks the plot for being pretentious, then points out that the seventh code uses a pseudonym known only to the author. A few seconds of silence fills the room. Nue puts down the newspaper, insisting it's just common sense."
  shining_needle.41.a:0 "Of course, anyone could know this common sense."
  # 事件概况：鵺匿名创作身份谜团小说，引发读者长期猜测，自己却因批评细节而露出破绽。
  # 叙事方向：把鵺对不确定身份的能力转化为大众文学，并通过小失误营造人物喜剧。

  shining_needle.42.t:0 "An Unfinished Collection of Poems"
  shining_needle.42.d:0 "Koishi Komeiji would occasionally leave behind a few lines of poetry without beginning or end on the street. People would copy down fragments they overheard and give them to bookstores to be bound. Since no one knew how much was missing, large blank spaces remained after each poem.\n\n Unexpectedly, readers began to fill in their own sentences in the blank spaces. The same page became love poems, eulogies, jokes, or shopping lists in different hands; secondhand bookstores even repriced their books specifically based on the brilliance of the annotations.\n\n Koishi found a version filled with writing, read it carefully for a long time, and then asked Seija, “Did I write this?” Seija replied that only the first three lines were. Koishi seemed very satisfied and continued walking with the book."
  shining_needle.42.a:0 "Anyone can write the rest."
  # 事件概况：恋遗落的诗句被整理成留有空白的诗集，读者参与补写后形成独特出版潮流。
  # 叙事方向：利用恋记忆与存在感模糊的特点，创造开放、温柔且带一点荒诞的群众文学。

  shining_needle.43.t:0 "Basements Should Have Windows Too"
  shining_needle.43.d:0 "Flandre drew a story. The protagonist is a monster living in a basement, strong enough to crush anything, but afraid of ruining the outside world, she never dares to open the door. The story has no prince, nor any sage to guide her; the monster eventually just opens a window in the wall herself.\n\n Adults mostly remained silent after reading it, but children loved it. They kept asking where the monster went, what was outside the window, and why she didn't just tear down the whole wall.\n\n Someone asked Flandre to write a moral lesson for the story. She thought for a long time and only added one line on the last page: “Basement doors should at least be able to be opened from the inside.”"
  shining_needle.43.a:0 "That's enough as an ending."
  # 事件概况：芙兰以自身经验创作儿童绘本，意外成为战后广受欢迎的作品。
  # 叙事方向：不让芙兰直接讲述创伤，而是透过简单故事表现她对自由、力量与自我选择的理解。

  shining_needle.44.t:0 "Seeds Sleeping Beneath the Rubble"
  shining_needle.44.d:0 "While clearing the foundation of an old warehouse, the reconstruction team discovered an underground storage room sealed off by collapsed walls. Inside were no weapons or gold or silver, only hundreds of seed jars with faded labels.\n\n Yuuka Kazami personally examined them and determined that most of the seeds were dead, but a few might still germinate. Refusing to place all her hopes on a single sowing, she divided the seeds into small portions and distributed them to settlements with different soils and climates for trial planting.\n\n Weeks later, the first unrecognized sprout emerged from the experimental field. It might have just been a long-forgotten wildflower, but it silenced the onlookers for a long time—what the ruins preserved was not all of war."
  shining_needle.44.a:0 "Give it a piece of land where it can grow."
  # 事件概况：重建队发现旧种子库，幽香以谨慎试种让少数种子重新发芽。
  # 叙事方向：用微小的植物发现象征灾后复苏，同时避免把希望写成毫无代价的奇迹。

  shining_needle.45.t:0 "A Machine That Sings Old-Time Songs"
  shining_needle.45.d:0 "Nitori Kawashiro unearthed an Outside World phonograph from the ruins. She replaced the springs, pieced together the stylus, and used several parts whose origins no one dared question to get the turntable spinning again. The first sound from the machine was full of static, but then it produced an old song whose name no one could recall.\n\n Onlookers initially found the melody strange. However, an old woman in the back of the crowd softly hummed along, saying it was a tune she had heard from an Outside World merchant when she was a child. A young musician immediately wrote down the melody and that night rearranged it into a new version combining flute, drums, and the sound of a youkai (a type of Japanese shout).\n\n The next day, both versions were played simultaneously in the market, and more people argued about which was better than bought anything."
  shining_needle.45.a:0 "Old Sounds Can Also Give Birth to New Melodies."
  # 事件概况：荷取修复留声机，使一首遗失歌曲重新出现并被年轻乐师改编。
  # 叙事方向：表现技术回收不仅服务工业，也能连接世代并催生新的大众音乐。

  shining_needle.46.t:0 "The first map without a lord"
  shining_needle.46.d:0 "Wakasagihime remeasured the waterways along the river, while Chen was responsible for confirming the mountain paths and settlements. They quickly discovered that the old map was no longer usable: the river had changed course due to war, new houses were built on the former territorial boundaries, and survivors were calling roads by completely different names.\n\n The new map didn't mark any lord's forest or a family's fields, but instead listed “The Leaky Bridge,” “The Crossroads with Hot Soup,” “The Roof That's Been Repaired Three Times,” and other unceremonious but easily recognizable place names.\n\n Seija wanted to request a more formal change, but ended up seeing “Seija's Lost Place” in the corner of the map. Kagerou insisted it was an important landmark, and Wakasagihime silently nodded."
  shining_needle.46.a:0 "This must be deleted. The rest remain."
  # 事件概况：若鹭姬与橙绘制战后新地图，地名不再来自领主，而来自幸存者的共同生活。
  # 叙事方向：通过地理变化表现旧权力消退与新社会形成，并用正邪迷路的地点收束笑点。

  shining_needle.47.t:0 "Sagume's Order Menu"
  shining_needle.47.d:0 "Sagume Kishin walked alone into a food stall in the redevelopment area for the first time. To avoid any unpredictable consequences from a casual remark, she remained silent, only circling three seemingly safe items on a wooden sign.\n\n The stall owner, misunderstanding her request, assumed she wanted the three items stacked together and brought out a plate of rice cakes with grilled fish and sweet sauce. Sagume stared at it for a long time, then quietly finished it.\n\n Seija happened to pass by and asked her how it tasted. Sagume wrote, “I don't deny it's edible.” The stall owner took this as high praise and the next day introduced a more expensive “Silent Set Meal.”"
  shining_needle.47.a:0 "At least she didn't say it was bad."
  # 事件概况：探女因能力限制使用木牌点餐，误会意外创造出市场新品。
  # 叙事方向：把探女的少言与能力写进轻松生活场景，让她在母女主线之外也能接触普通人的日常。

  shining_needle.48.t:0 "Kogasa just wants to fix an umbrella"
  shining_needle.48.d:0 "Kogasa Tatara walked into Seija's office carrying an old, malfunctioning umbrella. Seeing her serious expression and the long written application, Seija immediately assumed there had been an accident at the workshop, or that the tsukumogami committee was preparing to propose new rights clauses.\n\n The application contained only one item: asking Seija to help hold down the umbrella handle so Kogasa could replace the stuck hinge. The two struggled for half an afternoon, eventually installing the parts backwards, but unexpectedly making the umbrella ribs more sturdy than before.\n\n Kogasa tried to jump out from behind the door to celebrate this bizarre improvement. Seija wasn't startled. She only actually stood up from her chair when Kogasa handed her the repair bill."
  shining_needle.48.a:0 "Why do people have to pay for helping?"
  # 事件概况：小伞带着正式申请找正邪修伞，两人误装零件却得到更耐用的结果。
  # 叙事方向：用微不足道的委托拉近领袖与基层角色的距离，并让惊吓笑点落在账单而非能力上。

  shining_needle.49.t:0 "Flandre and Cirno's Construction Methods"
  shining_needle.49.d:0 "Flandre and Cirno were assigned to assist in demolishing an irreparable dilapidated building. The reconstruction team initially only wanted them to move materials, but Flandre precisely crushed every rotten section of the structure, while Cirno temporarily stabilized the beams that needed to be preserved with ice.\n\n The entire house split in two under the anxious gaze of everyone: the dangerous section collapsed neatly, and the other half didn't even break a window. The craftsmen later wrote this method into their demolition manual, but specifically noted that ordinary construction workers should not imitate it.\n\n The two requested official architect titles. Seija approved them as “special engineering consultants for use only under supervision.” Cirno only saw the word “special” and was very satisfied."
  shining_needle.49.a:0 "At least the house fell to the right side."
  # 事件概况：芙兰与琪露诺把破坏和冻结能力用于危楼拆除，意外发展出特殊施工方法。
  # 叙事方向：展现危险能力在和平生活中的新用途，并保留两人孩子气的自豪与误解。

  shining_needle.50.t:0 "The First Night Without the Hammer"
  shining_needle.50.d:0 "Seija woke up suddenly in the middle of the night. It was too quiet outside; there was no sound of sawing wood, hammering nails, moving rubble, or wheels stuck in the mud. She immediately threw on a coat and went outside, thinking the reconstruction crew had gone on strike, or that some rationing line had broken again.\n\n The night watchman told her that the housing in this area was finished, and the construction crew was officially moving to the next area today. Seija stood at the street corner and, for the first time, clearly saw clothes hanging out to dry by the window, vendors haggling over prices before closing their doors, and neighbors arguing about who should take out the trash.\n\n There was no celebration, no one shouting a victory. It was simply that they no longer had to work all night. Seija returned to her room and took a long time to adjust to the ordinary quiet."
  shining_needle.50.a:0 "It turns out that quiet can be good news."
  # 事件概况：正邪因夜间没有施工声而惊醒，最后发现只是一个街区完成了重建。
  # 叙事方向：以普通生活取代宏大庆典，表现正邪逐渐理解建设成果也可以是不再发生任何事情。

  shining_needle.51.t:0 "Try it in your dream first"
  shining_needle.51.d:0 "Fabric merchants and tailors asked Doremy for help, allowing customers to try on unfinished clothes in their dreams. Dreams don't consume real materials, and anyone can try out exaggerated colors, flowing skirts, or sleeves long enough to trail down the street.\n\n The problem was that many customers insisted on having their dream designs made into real clothes after waking up. The tailor had to explain that real clothes can't ignore weight, nor can their colors be changed based on mood. Doremy meticulously recorded every complaint, claiming they were evidence that “real materials still need improvement.”\n\n In the end, the workshop actually made several simplified versions. They were far less glamorous than the dream versions, but quickly became the new trend for the next season."
  shining_needle.51.a:0 "Dreams can take the lead, and the needle and thread will catch up."
  # 事件概况：哆来咪提供梦中试衣服务，无法实现的设计反而刺激裁缝开发新款服装。
  # 叙事方向：让梦境能力进入消费与创作领域，表现奇异能力如何成为和平时代的创新工具。

  shining_needle.52.t:0 "Fairy Postman's First Day"
  shining_needle.52.d:0 "The rebuilt settlement is more scattered than before, and there are still not enough official postmen. Daiyousei then organized fairies to help deliver mail, and Cirno proclaimed herself the fastest postman in all of Gensokyo.\n\n By the end of the first day, six out of ten letters were delivered to the wrong address, one was frozen in the mailbox, and another was mistaken for a paper airplane and flew into the river. However, two recipients who were originally strangers decided to exchange letters in person after receiving each other's letters; a remote workshop also found a new partner willing to supply timber.\n\n Daiyousei added pictorial markings to the letters overnight. Cirno announced that the first day's route had successfully discovered a large number of “hidden recipients.”"
  shining_needle.52.a:0 "Learn to recognize addresses first, then talk about being the fastest in the country."
  # 事件概况：妖精参与战后邮政，虽然错误百出，却意外连接原本没有往来的居民与工坊。
  # 叙事方向：以失败中产生联系的方式表现基层网络成长，不把妖精单纯写成制造麻烦的角色。

  shining_needle.53.t:0 "Sister is looking for you."
  shining_needle.53.d:0 "When Satori Komeiji came to the Human Village as it was being rebuilt, she carried a missing-person notice that had been folded and unfolded countless times. It showed short green hair, a closed third eye, and one thoroughly unhelpful description: ‘Could be anywhere.’\n\nSatori could find traces of Koishi in the hearts around her. The ration clerk remembered her filling the blank spaces on a roster with flowers. A workshop apprentice remembered her hiding parts in her hat, then quietly returning them while everyone else searched in a panic. A biscuit seller insisted that she had bought three on credit and paid with a glass bead of unknown provenance.\n\nYet Satori could never hear Koishi herself. Whenever a crowd dispersed, the silence where her sister's mind should have been became painfully conspicuous. Satori had once thought herself accustomed to it. Only when Koishi began a life entirely beyond her sight did she understand that having no way to know was not the same as having no reason to worry.\n\nAt last, she found Koishi on the roof of a new building. Crouched beside the chimney, Koishi was tying a row of crooked paper pinwheels to a cord. The children below kept calling for her to hang them higher or lower; she deliberately mounted every one of them backwards.\n\n‘Have you come to take me home, Sis?’ Koishi asked without turning.\n\nSatori had prepared a dozen arguments: the Palace of the Earth Spirits still had empty rooms, Rin and Utsuho missed her, and the world outside was not nearly as safe as Koishi imagined. But the minds around her held no fear of a dangerous youkai. One person worried that Koishi might fall from the roof; another wondered whether she would return tomorrow; a third earnestly wanted to see how those backwards pinwheels would turn.\n\n‘No.’ Satori folded away the notice. ‘I only wanted to see the place where you chose to stay.’\n\nKoishi finally turned. ‘Are you finished looking?’\n\n‘Not yet. Will you show me around?’\n\nThat afternoon, Koishi led her sister through the building sites, the market, and the temporary schoolroom. She introduced everyone whose name she had forgotten but whose stories she still remembered. Satori did not ask when she would come home. Only as they parted did Koishi press one backwards paper pinwheel into her hand.\n\n‘Do not put up a missing-person notice next time,’ Koishi said. ‘Write and ask whether I want to come home for dinner. Then I will not have been found and brought back. I will have come home on my own.’"
  shining_needle.53.a:0 "Finding her doesn't mean we have to take her away."

  # 事件概况：觉循着旁人对恋的记忆来到新聚落，发现妹妹已经在正邪统治下的幻想乡建立了自己的生活。
  # 角色方向：觉学习以探望代替监视，以邀请代替带回；恋则第一次主动告诉姐姐，该如何在不束缚自己的情况下继续爱她。

  shining_needle.54.t:0 "Seija also has to queue"
  shining_needle.54.d:0 "Seija, during her rounds, smelled the aroma of the public canteen and casually lifted the curtain to grab a bowl of freshly cooked stew. The elderly woman in charge of cooking immediately tapped the rim of the pot with her ladle, pointing to the long queue stretching out the door.\n\n The accompanying staff tried to explain that she had a meeting, but Seija had already reached the end of the line. The people in front of her quickly recognized her but didn't move aside, continuing their discussion about whether today's soup had more salt than yesterday's. When it was Seija's turn, only a small spoonful remained at the bottom of the pot, with pitifully little fish, but surprisingly, the taste was quite good.\n\n The elderly woman asked her if she had any comments. After finishing her soup, Seija said, “Next time, put less salt.” Someone in the queue immediately retorted that there was just the right amount today, and an unnecessary argument ensued."
  shining_needle.54.a:0 "At least no one reserved the best bowl for me."
  # 事件概况：正邪在公共食堂被要求排队，最后与普通居民争论汤的咸淡。
  # 叙事方向：自然表现领袖也受新日常规则约束，不刻意宣讲平等，而让制度落在一顿饭的小事上。
