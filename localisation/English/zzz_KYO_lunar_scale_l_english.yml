 KYO_postwar_interference_category:0 "Before finding Yukari Yakumo on the moon"

 KYO_postwar_interference_category_desc:0 "Lunar Capital has designated Yukari Yakumo as a target to be eliminated. Surface informants are recording the fluctuations left by her opening a gap, relay stations are verifying this, and orbital satellites are gradually narrowing down the coordinates. Once all three arrive at the same conclusion, the “Princess Light Cannon” will fire from the Moon, annihilating Yukari and the space she inhabits.\n\n Yukari is completely unaware of this. She continues to maintain the post-war Gensokyo and completes final preparations for the new barrier. The only one who witnesses this execution is Renko Usami from the distant future. She cannot publicly warn Yukari, otherwise Lunar Capital will immediately realize the plan has been leaked; she can only dismantle Lunar Capital's observation network layer by layer through star charts, secret letters, and covert operations.\n\n The next Decision represents Renko's countermeasure plan: obtain observational intelligence, find trustworthy accomplices, eliminate surface informants, create false coordinates, and ultimately destroy the Moon's positioning system. With each step completed, Lunar Capital loses a portion of its ability to confirm true coordinates, and Yukari Yakumo moves further away from death.\n\n§YIf Renko severs the complete observation chain in time, the Princess Light Cannon will hit a non-existent location, and Yukari Yakumo will survive to complete the new barrier.§!\n§RIf Lunar Capital completes calibration first, the true coordinates will be sent to the Moon, and Yukari Yakumo will be erased from the world without realizing it.§!\n\n This unknown battle will determine whether Yukari Yakumo will see the next sunrise."


 postwar_interference_time_limit:"Conspiracy Deadline"

KYO_reconstruct_anonymous_coordinates:0 "Princess Kaguya's Sixth Impossible Request"
 KYO_reconstruct_anonymous_coordinates_desc:0 "Renko has intercepted the verification records of Lunar Capital's ground relay station and calculated the transit times of the three satellites using future ephemeris. However, only Eirin, who participated in the establishment of Lunar Capital, can explain what this data truly points to.\n\n Directly requesting secrets from the Moon Sage will only result in refusal. Renko decides to hand the evidence over to Kaguya, letting the Moon Princess judge for herself whether the gaze from her homeland has crossed a line that Eientei cannot yield to."

 KYO_prepare_distributed_anchors:0 "A Storm Prophecy for a Few"
 KYO_prepare_distributed_anchors_desc:0 "Eirin only handed over the observation structure sufficient to prevent the execution; Renko still needs to confirm which spies Lunar Capital has planted on the surface. A large-scale alert would alarm Yukari Yakumo and cause Lunar Capital to replace its entire network ahead of schedule.\n\n She plans to send several anomalies that have not yet occurred to Satori, Mamizou, and Seija respectively. As long as the predictions come true one by one, the three of them will keep an eye on the traces that Lunar Capital will leave behind without knowing the full plan."

 KYO_prepare_false_coordinates:0 "Seeking help from those who have never forgotten Lunar Capital"
 KYO_prepare_false_coordinates_desc:0 "Three seemingly unrelated clues point to the same Lunar Capital observation network. The ground-based allies can find informants, but lack the power to cross the celestial sphere and destroy the control facilities behind the Hime-beam cannon.\n\n The Sanctuary can conceal a meeting that shouldn't exist. Renko will travel there with the structural diagrams left by Eirin, inviting Junko and Hecatia Lapislazuli to join this yet-to-be-publicized counterattack."

 KYO_prepare_reverse_refraction:0 "Blind the Lunar Capital's Eyes on Earth"
 KYO_prepare_reverse_refraction_desc:0 "Hecatia refuses to open the path to the Moon while the surface observation network remains intact. Renko must first have Satori find the observers, have Mamizou track the messengers, and then have Seija crack the verification rules used by the relay stations.\n\n All nodes must be under control on the same night, and several of them must continue to transmit normal reports. Lunar Capital not only has to lose its eyes on Earth, but it also cannot immediately realize that it has gone blind."

 KYO_renko_model_controllable_future:0 "Make Yukari Yakumo ubiquitous"
 KYO_renko_model_controllable_future_desc:0 "The captured observers retained features left by Yukari Yakumo when she opened a gap in the past. Rather than hiding the real Yukari, Renko planned to have controlled relay stations replay these recordings as the satellite passed by.\n\n Whenever the same target appeared simultaneously in various locations in Gensokyo, Lunar Capital would be forced to repeatedly calibrate its orbital observations. Renko didn't need to deceive the moon forever, but rather force it to reveal its next move amidst the chaos."

 KYO_sagume_supply_lunar_cipher:0 "The first road left by the egret"
 KYO_sagume_supply_lunar_cipher_desc:0 "Lunar Capital, chasing a decoy target, issues an emergency maintenance order to the surface. Seija discovers a deliberately reversed verification sequence within it. If her judgment is correct, Sagume Kishin has left behind a one-time identification code and orbital maintenance time.\n\n Hecatia can use this brief gap to open the first path, while Junko will tie down the Moon's defenders. Renko must enter the orbital facility before the path closes, allowing the satellite to begin gazing at a non-existent starry sky."

 KYO_sagume_open_path_for_seija:0 "Junko and the Goddess of Hell Storm the Lunar Capital"
 KYO_sagume_open_path_for_seija_desc:0 "The initial raid destroyed several satellites, forcing Lunar Capital to centralize its remaining observation permissions at the central hub. The true positioning core of the Hime Light Cannon was finally exposed, but the identification code left by Sagume Kishin was about to expire, and Lunar Capital reinforcements were approaching.\n\n Further delays would only allow the execution process to resume. Hecatia would open the path to the Moon, Junko would be responsible for breaching the frontal defenses, and Renko would enter the central hub to completely sever the Hime Light Cannon's connection to the surface."


 KYO_remilia_bend_fate_toward_civil_war:0 "Reopening a Line Between Mountains and Sea"
 KYO_remilia_bend_fate_toward_civil_war_desc:0 "The surface relay stations fall silent one by one. Orbital satellites chase stars that do not exist, and the central observation complex itself comes under attack. The execution system the Lunar Capital spent years constructing now lies in fragments; further calibration produces nothing but mutually contradictory coordinates.\n\n Watatsuki no Toyohime refuses to surrender the attempt. She places the lunar sea and Earth's mountains at opposite ends of a road, then forcibly shortens the distance between them. A temporary route bypassing the satellites and relay stations opens, allowing the princess's light cannon to receive the surviving traces of gap activity directly from the surface.\n\n The road will last only moments, however, and cannot distinguish a genuine signal from a false one. The Lunar Capital has only the final set of coordinates judged credible before the observation complex went dark.\n\n Toyohime has won her sister one more chance to fire. If these coordinates are wrong as well, the Lunar Capital will have no time for a second recalibration."


 KYO_gods_consecrate_yukari_sacrifice:0 "Let the Gods Ignite the Final Shot"
 KYO_gods_consecrate_yukari_sacrifice_desc:0 "The path opened by Toyohime is crumbling, and malfunctions are constantly emerging within the Princess Light Cannon. Satellite control has failed, the positioning core has been destroyed, and even the launch permit cannot be verified due to a central disconnection.\n\n Watatsuki no Yorihime, sword in hand, enters the control room and summons divine spirits one after another. Divine fire reignites the dormant energy, lightning reconnects the broken circuits, and the divine power descending upon the Moon temporarily replaces the paralyzed calibration mechanism. She is not asking the gods to judge whether Yukari Yakumo deserves to die, but merely using their power to force this blind weapon to complete its final launch.\n\n The muzzle slowly turns toward the final coordinates left by the observation network. There is no new verification, nor any room for correction. If the coordinates are correct, Yukari Yakumo will disappear along with the unfinished barrier; if Renko's deception has penetrated to the very last layer, Lunar Capital will fire its final shot at the empty ground.\n\n The Watatsuki sisters have staked Lunar Capital's last chance. Now, it remains to be seen where the white light will land."


  KYO_yukari_legacy.2.t:0 "The Answer to the Sixth Difficult Question"
 KYO_yukari_legacy.2.d:0 "When the lacquer box was delivered to Eientei, Kaguya was by the window flipping through several old novels that had flown in from the Outside World. She broke the seal, read only a few lines, and then her smile faded. The calibration records inside the box still used the Lunar Capital format, and the times of the three satellite transits were so precise that they seemed like guesswork. At the bottom was a riddle that had never appeared in legends: make the moon miss a target that had already been seen.\n\n Kaguya did not immediately summon Eirin. She first ordered Reisen to shut down Eientei's external communications, and then had Tewi lead everyone who entered or left the bamboo forest that night astray. It wasn't until the first scheduled moment was approaching that she took the lacquer box into the medicine room and pushed one of the pages in front of Eirin.\n\n Eirin did not answer at first, but only took out several Lunar Capital instruments that had not been used for many years. When the first wave swept across the bamboo forest, the record perfectly matched the numbers in the box; the second wave changed direction after Yukari Yakumo opened the gap. The ground relay station was responsible for capturing the target, the orbital satellites eliminated errors, and the Hime Light Cannon would execute the execution after several verifications.\n\n The sender hadn't guessed wrong at any step. What silenced Eirin even more was that those verification principles were her own creation. They were originally used to protect Lunar Capital, preventing enemies from deceiving the defenses with illusions; now, descendants had reversed this technology, searching for Gensokyo, where she had lived for many years, from a distant high place.\n\n “Once these methods leak out, they won't just kill the Lunarians,” Eirin finally spoke, “Someone will follow them to Lunar Capital, and they will find us.”\n\n Kaguya pushed the lacquer box back in front of her. “I didn't ask you to hand over Lunar Capital,” she said. “But we don't live there anymore. If our homeland is going to fire at our home from the sky, at least let it miss this shot.”\n\n Eirin spent a long time writing, filling an entire page with calculations, then personally deleted the Moon's route, defense configuration, and the structure of the Princess Light Cannon itself. She only left the order of observation procedures, the verification relationships between relay stations, and the methods to cause coordinate conflicts. It wasn't surrender, nor was it assisting in a counterattack; it was a strictly limited defense plan.\n\n Before dawn, Kaguya returned the answers according to the retrieval method indicated on the bottom of the box. When Renko opened the lacquer box again, she saw an additional unsigned warning at the end: You can break weapons extended towards Gensokyo, but don't let the fighting cross this line.\n\n She put away the paper and did not agree."
 KYO_yukari_legacy.2.a:0 "At least let this shot miss."

 KYO_yukari_legacy.3.t:0 "Before the Moonlight Turned Cold"
 KYO_yukari_legacy.3.d:0 "Renko wrote three letters, each on different paper, in a different hand, and sent by a different route. The letter bound for the Palace of the Earth Spirits foretold that a stranger would pass through the Former Capital at midnight, his mind repeating the same weather report without end. The letter given to Mamizou Futatsuiwa listed three unrelated names and claimed that all three would use the same pass within the next three days.\n\n The final letter reached Seija Kijin. It contained a deliberately inverted Lunar verification code and ended with a single line: There is an Amanojaku on the Moon. If she speaks, the outcome will reverse; if she remains silent, she is waiting for someone else to step into the wrong ending first.\n\n Satori was the first to encounter the foretold traveller. He wore ordinary clothes and did not even know why he had come to the Former Capital. Beneath his placid thoughts, however, the same weather report repeated in exactly the same order. Whenever Satori probed deeper, his memories ended against a blank space deliberately left behind. She did not alert him; she merely asked Orin to record where he went.\n\n Mamizou, meanwhile, watched three different faces present the same pass in succession: first a medicine seller, then a wounded soldier, and finally someone wearing the likeness of a shrine official. They never spoke to one another, yet after dusk all three entered the same abandoned weather station. Mamizou left their disguises intact and sent two tanuki after them—one to watch the door, the other to follow the packages leaving the station.\n\n Seija read the verification code backwards, broke it apart, and inverted every portion that appeared to make sense. On the third attempt, she realised the errors were deliberate: directions written in a form only another Amanojaku would use. They concealed no order, but rather an approaching observation window. She scoffed, folded the letter into her sleeve, and chose not to burn it.\n\n The three recipients never met and knew nothing of the other letters. Satori left a mental mark no one else could perceive, Mamizou quietly replaced the seal on the package, and Seija wrote an answer even more incorrect than the original code beside it.\n\n No notice appeared in the Human Village, and no alarm sounded on Youkai Mountain. Yukari remained occupied with postwar disputes, while the Lunar Capital's agents still believed themselves hidden. Yet beyond every official report, three unconnected trails had begun to climb toward the same moonlight."
 KYO_yukari_legacy.3.a:0 "The storm has not yet arrived, but the witnesses are already in place."

 KYO_yukari_legacy.4.t:0 "Two visitors in the Sanctuary"
 KYO_yukari_legacy.4.d:0 "Deep within the Sanctuary, there are no windows, nor any shadows pointing to the Outside World. Yuiman Asama and Ariya Iwanaga sealed the entrance one after the other, causing the road to the meeting place to deviate from its original location. Only when the lamplight on the table no longer cast shadows did Renko unfold the observation structure left by Eirin.\n\n Junko finished reading first. She didn't ask where the data came from, nor did she investigate why Yukari Yakumo was willing to take the risk. Her finger slowly moved along the line connecting the surface relay, the orbiting satellites, and the Hime-beam cannon, finally stopping at the Moon's defense line.\n\n “When to make our move?” The question lacked anger; instead, it was unsettlingly calm. To Junko, it didn't matter who Lunar Capital intended to kill; as long as that city remained hidden in its unreachable heights, believing it could decide the fate of all living beings on Earth, she had ample reason to return there.\n\n Hecatia Lapislazuli did not respond. The Goddess Hell meticulously checked the star map, the evacuation route, and the calibration procedures for the Hime Light Cannon, then circled several still-operational surface relay stations with her fingertip.\n\n “Open the path now. You'll be seen before you even reach the Moon,” she told Renko. “Lunar Capital doesn't need to defeat Junko, nor does it need to find the Sanctuary.\n\n Just confirm Yukari Yakumo's coordinates and fire prematurely, and everything you've done will be meaningless.” Renko took out copies of three letters, placing the clues discovered by Satori, Mamizou, and Seija on their corresponding nodes. She had no army, nor could she command anyone at the table; all she could offer was the future ephemeris, the observational structures Eirin hadn't deleted, and an untested deception scheme.\n\n Junko looked up at Hecatia. It wasn't obedience, but waiting for a path sufficient to truly allow hatred to reach the Moon.\n\n Hecatia rotated the star map halfway.\n\n “First, make the moon invisible, then make it misunderstand. They'll handle the eyes on Earth; the coordinates in the sky are yours. Once the garrison begins chasing the nonexistent Yukari Yakumo, I'll open the first path.”\n\n “And then?”\n\n Renko asked. “Then,” Junko answered for her, “Lunar Capital will remember us.”\n\n There was no oath, no promise to save Yukari Yakumo. Junko wanted to instill fear in their old enemy again; Hecatia refused to let the Lunarian remain forever safe. Different reasons ultimately converged into the same plan, and for the first time, Renko possessed the power to reach the Moon."
 KYO_yukari_legacy.4.a:0 "First, make the moon invisible."

 KYO_yukari_legacy.5.t:0 "Lunar Capital lost its eyes on the ground."
 KYO_yukari_legacy.5.d:0 "When the second letter arrived, the paper no longer contained prophecies, only the location, time, and target. The contents of the three letters remained different, but they all ended with the same time: the last night before the Moon completed its next round of verification.\n\n Following the repeatedly memorized weather records, Satori found the observer hidden in Former Capital. The observer was not the Moon Rabbit, but an ordinary person whose memories had been partially erased, who believed he was compiling weather data for the Outside World. Satori did not reveal the whole truth, but instead left another memory deep within his consciousness sufficient to sustain his daily activities, before having Rin secretly remove the real communication device. As long as Lunar Capital continued to question him, he would still answer as usual, but he could no longer provide any valid coordinates.\n\n Mamizou, following the constantly changing faces of the messengers, figured out the communication routes between the relay stations. On the night of the operation, the tanuki first stole the credentials, then transformed into the original messengers, delivering the replaced packages station by station. The station personnel, seeing familiar faces, correct codes, and intact seals, didn't realize anything was amiss until the equipment was opened.\n\n Seija was responsible for the most dangerous step. She reversed the intercepted verification rules layer by layer, making loss of contact, delays, and erroneous readings appear normal to Lunar Capital. Whenever a relay station fell under control, it would first send back a report without any anomalies before falling completely silent on the surface.\n\n The operation unfolded on the same night. Observers hidden in temples, military camps, abandoned weather stations, and caravan cargo were removed one by one; those responsible for the rendezvous were isolated; and several nodes that couldn't be safely taken over were disguised as long-term malfunctions. There were no alarms, no battles, and not a single distress message was sent to the Moon.\n\n Renko deliberately left three relay stations. They continued operating as scheduled, reporting to Lunar Capital that the surface was quiet, the coordinates stable, and Yukari Yakumo was still within its designated range. The removed observers were transferred via the Sanctuary and sealed away after Hecatia personally confirmed there were no tracking signals.\n\n At dawn, the reports Lunar Capital received were no different from before. It hadn't yet realized it had lost its eyes and ears for cross-validation, nor did it know that the eyes that had been searching for Yukari Yakumo were now preserving gap fluctuations for Renko, waiting for the next satellite to pass by."
 KYO_yukari_legacy.5.a:0 "Let them continue to believe everything is normal."

 KYO_yukari_legacy.6.t:0 "The Ubiquitous Yukari Yakumo"
 KYO_yukari_legacy.6.d:0 "The observer sent to the Sanctuary preserved the gap features captured over the past few months. Direction, duration, fluctuation amplitude, and every set of verification results used by Lunar Capital to confirm Yukari Yakumo's identity were all completely stored inside the device. Those cold numbers, pieced together, constituted Yukari Yakumo in Lunar Capital's eyes.\n\n Renko marked the order in which satellites passed over Gensokyo on the entire wall according to the future ephemeris. Each moment could only be used once; replaying too early would be detected by the relay on the ground, while replaying too late would allow the satellites to capture the real Yukari. Seija was responsible for rewriting the verification results, the tanuki (raccoon dog) of the Mamizou traveled back and forth between the three nodes, and Satori confirmed from the consciousness of the isolated observer that Lunar Capital had not yet detected the anomaly.\n\n When the first relay station was activated, a record belonging to Yukari Yakumo appeared in the Hakurei Shrine. Seven minutes later, the same fluctuations rose from Youkai Mountain; followed by Former Hell, Bamboo Forest of the Lost, and a remote lakeside. The equipment was only replaying past data, but the Moon's observation map showed the same target opening gaps continuously over hundreds of miles, even appearing simultaneously in opposite directions twice.\n\n The real Yukari Yakumo was still dealing with post-war affairs. She had not received orders, nor was she led to the wrong location by anyone. At one point, she simply felt that the moonlight in the night sky lingered longer than usual, then she closed her report and continued listening to Ran recount the recovery figures from various locations.\n\n She was unaware that her shadow was moving around on Lunar Capital's observation map. Orbiting satellites were forced to repeatedly turn, while the Moon's garrison constantly confirmed between conflicting coordinates. The first calibration failure was attributed to the aging of the relay station, the fourth sparked internal debate, and after the ninth, all observation results had to be submitted to higher authorities for review. Renko did not stop. Each time a target was eliminated, another complete record rose from the distance, forcing Lunar Capital to continue exposing its verification methods.\n\n After the thirteenth failure, an emergency maintenance order finally entered the controlled node. The order ostensibly instructed surface equipment to cease operation, but Seija noticed at a glance that one set of verification sequences had been deliberately reversed. It wasn't Renko's forgery, nor a system malfunction; reading it correctly would yield the command, but reversing it revealed another layer of structure.\n\n Seija handed the result to Renko. Renko, comparing it to the incomplete Lunar Capital files preserved in the future, wrote a name on the edge of the paper:\n\n Sagume Kishin. The egret on the Moon remained silent, neither speaking nor openly choosing sides. She simply allowed an error that should have been immediately corrected to persist while everyone else was busy chasing false targets. That error was small, yet enough to become the first door to the Moon."
 KYO_yukari_legacy.6.a:0 "The egret didn't speak, yet it left an answer."

 KYO_yukari_legacy.7.t:0 "The first path left by the egret"
 KYO_yukari_legacy.7.d:0 "After Seija completely reversed the maintenance instructions, the error check revealed a Lunar Capital identification code that could only be used once, a period of time for the satellite to stop self-checking, and a route to the orbital maintenance facility. The identification code was unsigned and couldn't prove who left it; but it precisely avoided all the text that would make Sagume publicly express her opinion, leaving the choice only to the person who received it.\n\n Sagume Kishin neither betrayed Lunar Capital nor guaranteed that this path would lead to victory. As long as no one used it, it was just an error that hadn't been corrected yet; if the operation failed, she wouldn't leave any evidence to defend earthling.\n\n Hecatia checked the identification code and only gave one chance. The path must be connected to the orbital maintenance facilities the instant the satellite stops its self-check, and the maintenance time cannot exceed Lunar Capital's next routine inspection. If the entrant does not return on time, she will directly close the passage to prevent the Sanctuary's location from being tracked back along the interdimensional connection.\n\n The appointed time arrived, and the walls of the Sanctuary silently cracked open. Behind the door, there was no moonlight, only the cold and narrow space outside the orbital facilities. Almost simultaneously, Junko attacked the Moon's outer defensive positions. It was not a feint to create a show of force; she tore through the first line of defense head-on with purified hostility, causing all threat detection devices to read the same result. Lunar Capital immediately mobilized patrol ships and orbital surveillance, turning all attention to this most familiar enemy.\n\n Renko led a very small team through the passage. The identification code opened the first door for them, Seija's rewritten verification rules fooled the second check, and the future ephemeris told Renko which control console would gain maintenance access to all the satellites in the next moment. She sent a fake star map into the system and offset the real celestial phenomena from the maintenance clock by a tiny value. For the first few minutes, everything appeared normal.\n\n Then the camera began chasing non-existent stars, the positioning coordinates contradicted each other, and orbital corrections failed one after another. Several key satellites refused to accept the erroneous results and burned out their observation cores during forced recalibration; more satellites turned according to the fake star map, and from then on, they could only see a sky that would never match.\n\n When the alarm sounded, the road to Hecatia had begun to narrow. Renko was the last to leave, and before crossing the threshold, she looked back and saw Lunar Capital connecting all the remaining satellites to the central hub. Junko also withdrew from the battle before the reinforcements completed their encirclement, leaving behind an inexplicable destruction on the outskirts of the Moon.\n\n The first attack by has ended. The Hime Light Cannon is undamaged, and the execution has not yet been cancelled; however, in order to regain control of the sky, Lunarian personally centralized the scattered observation permissions into one point. Renko finally saw the true eyes of that system."
 KYO_yukari_legacy.7.a:0 "The Central Hub has been exposed."

 KYO_yukari_legacy.8.t:0 "Lunar Capital loses the night sky."
 KYO_yukari_legacy.8.d:0 "On the last night before the final assault, the Sanctuary is completely sealed off. Yuiman Asama and Ariya Iwanaga cut off the path to the Outside World. On the surface, Satori monitors Lunar Capital's informants, Mamizou allows the fake messengers to continue delivering reports, and Seija guards the three relay stations, ensuring that the Moon continues to receive incorrect coordinates until the start of the war.\n\n The Central Hub has been exposed, but the identification code is about to expire. Hecatia simultaneously opened three routes: one behind the Moon's defenses, one leading to the central observation hub, and the last for evacuation. Lunar Capital, unable to determine the true source of the attack, could only disperse its troops to each breach.\n\n Junko attacked Lunar Capital from the front. The purified hostility swept across the defenses, forcing all alert devices and troops to turn towards this most familiar enemy. The strongest forces were then deployed outside the city, finally exposing the route to the observation hub.\n\n Renko entered the Moon via the second route. Satellite control, coordinate archives, and the Princess Light Cannon positioning core mutually reinforced each other; if any one was destroyed, authority would transfer to the other two. Therefore, she had to wait for the false coordinates to fill all the verification channels before simultaneously disabling all three objectives.\n\n Seija sent out the final set of erroneous records from the surface. Renko immediately severed satellite control, burned all previous observation files, and erased the verification relationships pointed out by Eirin from the positioning core.\n\n Conflicting coordinates quickly overwhelmed the central hub, and Lunar Capital completely lost the ability to identify Yukari Yakumo in the sky. Hecatia began closing roads. Junko still wanted to continue pushing deeper into the city until the goddess Hell personally led her away from the battlefield. Renko finally reached the evacuation entrance and looked back to see the target names on the control panel fading one by one.\n\n She thought the execution was over. However, outside the central hub, a backup unit that had never been connected to the observation network quietly awoke. Toyohime had already sealed the last set of triple-verified coordinates within it; when all automatic permissions failed, Yorihime requested a god to manually authorize the bypassing of the paralyzed system.\n\n Yorihime's beam cannon completed its charge. As Renko lunged at the console, the Moon was engulfed by a sudden burst of white light. She only had time to see the cannons turn towards Earth before the path to Hecatia closed completely behind her.\n\n Meanwhile, Yukari Yakumo remained standing in the center of the altar of the new barrier. She looked up and saw the night sky turn deathly white in an instant. Whether the light was aimed at her or at the last false coordinate left by Renko, no one could answer at that moment."
 KYO_yukari_legacy.8.a:0 "The light had left the Moon."







