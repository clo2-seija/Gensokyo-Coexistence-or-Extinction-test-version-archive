l_english:
 Renko_LUN_armaments_bureau:0 "Lunar Capital Armaments Bureau"
 Renko_LUN_armaments_bureau_desc:0 "The Lunar Capital Armaments Bureau oversees equipment development for all services, with Lunarian Manufacturing as the designated manufacturer. Basic designs are immediately available. Later designs become available when their technical requirements are met, or at the start of the stated year at the latest. Commissioning unlocks the required chassis, airframe or hull and completes any necessary special projects. Complete designs can be received even when some module technologies are not yet known."
 Renko_LUN_medium_tank_1936_commission:0 "Commission Moonwarden Mk.36"
 Renko_LUN_medium_tank_1936_commission_desc:0 "Available immediately. Receive the complete design for §YMoonwarden Mk.36§! from Lunarian Manufacturing and unlock its required chassis, airframe or hull. Each design can be commissioned once."
 Renko_LUN_medium_tank_1940_commission:0 "Commission Moonwarden Mk.40"
 Renko_LUN_medium_tank_1940_commission_desc:0 "Available by January 1, 1940, or earlier if the technical requirements are met. Receive the complete design for §YMoonwarden Mk.40§! from Lunarian Manufacturing and unlock its required chassis, airframe or hull. Each design can be commissioned once."
