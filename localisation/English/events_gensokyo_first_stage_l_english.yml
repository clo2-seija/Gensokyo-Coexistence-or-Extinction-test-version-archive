 gensokyo_first_stage.38.t:"Game Difficulty"
 gensokyo_first_stage.38.d:"Game difficulty will affect the game's progress; it is strongly recommended to choose Normal."
 gensokyo_first_stage.38.a:"Lunatic (youkai is fragmented)"
 gensokyo_first_stage.38.b:"Hard (youkai's body is abnormal)"
 gensokyo_first_stage.38.c:"Normal (youkai is disappearing)"
 gensokyo_first_stage.38.e:"Easy (youkai will definitely survive)"
 

 gensokyo_first_stage.39.t:0 "The Death of Shrine Maiden"
 gensokyo_first_stage.39.d:0 "In the darkness, a pale flash streaked across the sky above the shrine. There was no thunder, no explosion, yet the entire Gensokyo fell silent in that instant.\n\n Hakurei Shrine Maiden was found lying before the barrier pillar. She had no wounds, her clothes were undamaged, and there were no signs of battle, struggle, or spellcasting around her. However, within seven steps of her body, moss, dust, insects, and even the tiny spiritual energy clinging to the cracks in the rocks had all vanished completely.\n\n Ran was the first to notice another anomaly. Moonlight fell from the east, but Shrine Maiden's shadow stretched in the opposite direction, its edges so straight they seemed unnatural.\n\n “the Great Hakurei Barrier readings are normal,” Ran reported in a low voice.\n\n Yukari stood beside the shrine maiden, glancing at her only once.\n\n The Hakurei shrine maiden would age, be injured, and die. This wasn't the first time she had sent a shrine maiden away, nor would it be the last.\n\n Death itself was not surprising. But this time, something had bypassed the shrine's vigilance, evaded Shikigami's perception, taken a life at the most sensitive point of the Great Hakurei Barrier, and then kept all the readings normal.\n\n Yukari's gaze lingered on the inverted shadow.\n\n “Continue measuring,” she said, her tone flat, “Every six hours. Recheck everything inside and outside the shrine.”\n\n Ran didn't press further.\n\n She knew what Yukari truly wanted to confirm wasn't why shrine maiden died, but rather who could make it seem like nothing had happened."
 gensokyo_first_stage.39.a:0 "Only shrine maiden died, but a question remained."


 gensokyo_first_stage.40.t:0 "Investigation Report: The Death of Shrine Maiden"
 gensokyo_first_stage.40.d:0 "In the investigation team's meeting room, three investigation reports lay side by side on the table.\n\n None provided an answer.\n\n Eirin Yagokoro had completed multiple examinations of the body. A small amount of the medication prescribed by Eientei was indeed found in shrine maiden's body, but the dosage was normal, the ingredients were non-toxic, and there were no symptoms sufficient to cause sudden death. There was no obvious damage to the organs, no abnormalities in the blood, and the time of death could only be compressed into a vague range.\n\n The body seemed to have stopped living abruptly at a certain moment, without leaving any trace of the process that caused the cessation. Satori Komeiji repeatedly surveyed the area around the shrine. She could not detect any lingering fear, hostility, or struggle before death, and there were no traceable thoughts at the scene. The area was unnaturally clean, as if nothing had happened, but rather as if what had happened had been completely removed.\n\n The shadows that stretched backward disappeared after dawn, and the spiritual energy reaction on the barrier pillar remained normal. Aya Shameimaru then used tengu's intelligence network. Patrolmen, nearby residents, night merchants, fairies and wild beasts around the shrine were all questioned. No one saw a strange figure, no one heard any strange noises, and no one could say where the flash of light came from. Even the most absurd rumors couldn't find a clear source, as if everyone had simultaneously learned of the shrine maiden's death on the same morning.\n\n No witnesses.\n\n No murder weapon. No traces of magical incantation. No confirmed cause of death.\n\n The only consistent conclusion of the three reports was that the investigation was making no progress. Yukari sat at the end of the meeting, showing no grief and blaming anyone.\n\n She simply turned the last page and reread the repeatedly marked blanks. Yet another Hakurei shrine maiden had died.\n\n This event itself wouldn't cause her to lose her composure. What she truly couldn't ignore was this: within or outside Gensokyo, some force existed capable of carrying out a murder right before the Great Hakurei Barrier, leaving nothing to prove it had occurred.\n\n If it was an enemy, they had proven they could evade all surveillance.\n\n If it wasn't an enemy, then it was even more dangerous.\n\n The committee ultimately received no answer, only a consensus that couldn't be publicly written into the report—the death of shrine maiden was not the end of the investigation, but rather an unsigned notification. A being, still unseen, had already reached into the very heart of Gensokyo."
 gensokyo_first_stage.40.a:0 "The Unexplained Death"
 gensokyo_first_stage.40.b:0 "Sealing All Gaps and Doubts"


gensokyo_first_stage.43.t:0 "The First Deviation in Measurement"

gensokyo_first_stage.43.d:0 "On the fourteenth day after shrine maiden's death, Ran marked that coordinate again during a routine measurement.\n\n At the Hakurei Shrine barrier pillar, at the location where shrine maiden collapsed, the large barrier reading still showed normal. There were no cracks, no spiritual energy leakage, and no anomalies that could trigger an alarm.\n\n But after Ran stacked all the records from the past fourteen days together, she discovered a pattern that shouldn't exist.\n\n Every six hours, that coordinate would show an extremely slight shift. The deviation was too small to be detected by a single measurement, yet it always accumulated in the same direction. Even after changing the ritual implements, recalibrating the reference points, and ruling out lunar phases and ley line variations, the result remained unchanged.\n\n “It's not a crack,” Ran said, pushing the calculation results towards Yukari. “At least not yet.\n\n It's more like something is rewriting the relationship between this point and the Great Hakurei Barrier.”\n\n Yukari silently stared at the line formed by countless tiny values. When shrine maiden died, the Great Hakurei Barrier didn't react. The investigation failed to find the culprit. Now, the only remaining trace is hidden in a series of readings deemed normal.\n\n The other party didn't shatter the barrier.\n\n They merely made the barrier forget where it was supposed to be.\n\n Yukari closed the report.\n\n'From now on, all nodes shall be measured in the same way. '\n\n If this is only the starting point, then the next offset may not remain on paper."
gensokyo_first_stage.43.a:0 "Change all barrier nodes to be measured once every six hours."





 gensokyo_first_stage.41.t:0 "After surviving"
 gensokyo_first_stage.41.d:0 "The last remaining Japanese troops laid down their arms. Air raid sirens no longer sounded over Tokyo, and the flags of the Youkai Allied Forces were raised at fortresses and stations along the way. Gensokyo won the war, and finally won the chance to avoid being driven out, hunted, and erased from this world.\n\n However, victory did not restore the ruins to their original state. Beneath the collapsed houses lie humans, and youkai; in the burned villages, some lost their parents, some never saw their children return from the front. Many Japanese subjects never decided to wage this war, never even seen Gensokyo, yet still lost their homes in the flames of war. Now, they will awaken under the army, laws, and flags of youkai.\n\n We once said that we took up arms simply to survive. This was not a lie. But when we crossed the barrier, occupied cities, and began to decide the food, shelter, and future of others, that statement could no longer excuse all our actions.\n\n Will those who are defeated become protected residents, or subjects awaiting subjugation? Will they be allowed to retain their language, families, and dignity, or will they simply pay the price for the sins of a nation they have no right to decide, simply because they were born human? If Youkai's survival depends on the submission, hunger, and silence of another group, then the war is not truly over—it has merely changed the side wielding the gun.\n\n Guns can determine who stands atop the ruins, but they cannot prove that those who stand are on the right side.\n\n Gensokyo has proven its ability to defeat the enemy. Next, it must prove it will not become what it once most hated."
 gensokyo_first_stage.41.a:0 "Surviving does not give you the right to make others kneel."


gensokyo_first_stage.1.t:0 "The starting point of the barrier gap"
gensokyo_first_stage.1.d:0 "On the night the Hakurei shrine maiden died, Gensokyo did not immediately collapse.\n\n The Great Hakurei Barrier did not tremble. No warning spell activated, and every spiritual-energy reading reported from across the land remained normal. If the instruments alone were to be believed, all that happened that night was that a shrine maiden fell before a barrier pillar. Everything else continued as usual.\n\n Only fourteen days later did Ran discover the first discrepancy in the accumulated records.\n\n The site of the shrine maiden's death was losing its proper coordinates.\n\n Neither the barrier pillar nor the Hakurei Shrine had moved. Yet after every measurement, the site's distance, direction, and relation to what lay inside and outside shifted by an almost imperceptible amount. Each discrepancy was negligible on its own; together, they traced a path of steady drift.\n\n Within days, the same phenomenon began appearing throughout Gensokyo. A road on Youkai Mountain was shorter than it had been the day before. Paths through the Bamboo Forest of the Lost no longer led to their former exits. At the edge of the Forest of Magic, the wind stopped against an invisible line.\n\n The first observable void appeared on that line.\n\n It gave off neither light nor sound, and it was nothing like a gate to the Outside World. Anything inserted into it failed to emerge on the other side. Sound could not cross it, and no wind returned from beyond. Nothing had been torn open; a connection that ought to exist was simply missing.\n\n The Great Hakurei Barrier had always distinguished Gensokyo from the Outside World, keeping the two adjacent without allowing either to swallow the other. Its spiritual power and structure remained intact, yet it was beginning to lose the ability to judge what belonged to Gensokyo and what should lead outside.\n\n That was more dangerous than any ordinary fracture.\n\n A crack could be sealed and a breach repaired. But if the barrier itself could no longer tell inside from outside, any repair might merely fasten the error more firmly in place.\n\n Yukari could not prove that the shrine maiden's death had caused this, nor could she rule out the possibility that both were separate consequences of the same attack. Only one fact was certain: every discrepancy led back to the Hakurei Shrine, and to the night the shrine maiden fell.\n\n Gensokyo had not yet been destroyed.\n\n But the boundary that protected it was forgetting how to do so."
gensokyo_first_stage.1.a:0 "The Great Hakurei Barrier still exists, but it's no longer reliable."


gensokyo_first_stage.2.t:0 "Don't forget who you are"
gensokyo_first_stage.2.d:0 "Sekibanki initially thought she was just too tired.\n\n She stood in the forest, trying as usual to lift her head off her body, but only felt a stiffness in the back of her neck. There was no flow of youkai energy, no familiar feeling of weightlessness.\n\n She tried again, still without any reaction. “I guess I just haven't been sleeping well lately,” she said coldly, pulling her scarf up a little, as if as long as no one saw it, it wasn't worth caring about.\n\n But in the following days, she lost more and more.\n\n She couldn't lift her head, nor could she sense distant movements in the dark as before. The night no longer embraced her, and her youkai power gradually sank into an unreachable place. The face in the mirror still belonged to Sekibanki, but it appeared more and more ordinary each day.\n\n Worse still, she began to forget why she was afraid of being seen through.\n\n She remembered the people, the house she had lived in, the arguments she had had with the Kagerou, and how Wakasagihime would always clean up the mess for them. But when Kogasa asked her what kind of youkai she was, Sekibanki remained silent for a long time.\n\n “Youkai?” she frowned.\n\n “Why would I be a youkai?”\n\n Those words made Kogasa's smile vanish. Sekibanki was neither injured nor disappeared. She simply sat there, her expression increasingly resembling that of a lost ordinary person. Those parts that once made her withdrawn, wary, and proud, and that also made her protect her companions at night, are slowly fading from her self-awareness.\n\n Kogasa grasped her hand and began recounting their shared experiences over and over. Their first meeting in the rain, Sekibanki complaining about her noise but still fixing her umbrella; how they evaded patrols, how they divided unsold food after closing at the night market, and how Sekibanki, despite saying it was troublesome, always waited for her at the most dangerous intersections.\n\n Sekibanki just stared at her blankly. Finally, Kogasa trembled as she took a hairpin from her bosom. It was a gift from Sekibanki, not finely crafted, with unpolished edges.\n\n “You said it.” Kogasa clutched the hairpin tightly in her hand, tears streaming down her face. “You said we'd stay together. You said that no matter how much trouble I caused, I couldn't run off alone.”\n\n “So you can't pretend you don't know me now.”\n\n “You're Sekibanki. The one with the sharp tongue, who doubts everything, yet always secretly makes way for others. You're not an ordinary person, and no one can replace you.”\n\n Kogasa put the hairpin back in her hair, crying and calling her name over and over again.\n\n A long time later, Sekibanki's fingers twitched. “... So noisy.”\n\n Her voice was weak, yet still carried that familiar sharpness.\n\n Kogasa froze on the spot, then rushed forward and hugged her. Sekibanki didn't push her away, but simply raised her hand with difficulty, as if to confirm that the person in front of her was indeed there.\n\n Her youkai power hadn't fully recovered, and her head still couldn't leave her body. But those eyes had recognized Kogasa again, and remembered why she so hated being treated like an ordinary person.\n\n This disaster wasn't entirely hopeless.\n\n As long as those memories, relationships, and names that still exist are grasped before everything is completely erased, the forgotten may be able to return."
gensokyo_first_stage.2.a:0 "As long as someone remembers, forgetting is not the end."

    gensokyo_first_stage.3.t:0 "Three Answers Above the Barrier"
    gensokyo_first_stage.3.d:0 "There were no observers in the meeting room.\n\n Ten records of the barrier nodes were spread out in the center of the table. Red lines marked offset areas, black dots represented areas where cracks had appeared, and several others maintained normal readings, but it was impossible to confirm whether the next measurement could be trusted.\n\n Yukari Yakumo sat in the main seat, her fan remaining closed.\n\n “Sever it first,” she said. Her solution was the most direct. Temporarily separate the anomalous nodes from the boundary of the surrounding area, close all access routes, and then use gaps to transfer residents who could still evacuate. As long as the collapse was confined to a limited area, the rest of the Great Hakurei Barrier would have time to recalibrate.\n\n Kasen immediately pointed out the problem.\n\n “The severance you mentioned still has people living inside.”\n\n “So evacuate first.”\n\n “What if we can't evacuate completely?” Yukari didn't answer. Kasen Ibaraki proposed another path. She advocated summoning the land gods, wild beasts, hermits, and local inhabitants to reconfirm where each mountain, river, and road originally belonged. The barrier isn't just maintained by magic, but also by the Gensokyo beings' long-standing understanding of the land. As long as a place is still inhabited, named, and remembered, the collapse won't easily erase it completely.\n\n This method is the safest, but also the slowest. All ten nodes require long-term garrisoning; if personnel are withdrawn from any one location, previous repairs could be disrupted again.\n\n Okina leaned back in her chair, listening to their argument before gently tapping her fan on the ground.\n\n “One wants to cut away the damaged parts, the other wants everyone to cling to the land. Typical of you.”\n\n She proposed rebuilding alternative passageways at the back. Since the existing internal and external connections were failing, they would bypass the damaged sections and establish new entrances and exits between the nodes. Supplies, rescue teams, and surveyors could reach directly from the back, avoiding being trapped by the chaotic paths; if a location was completely lost, communication could be maintained from other directions.\n\n Yukari's gaze turned cold.\n\n “The more doors are opened, the more uncontrollable entrances there will be.”\n\n “It's better than standing outside and watching it disappear,” Okina replied.\n\n All three solutions could temporarily suppress part of the crisis, but they could also create new problems.\n\n Yukari could stop the spread of the collapse, but might leave those who hadn't evacuated within the sealed-off area; Okina could reconnect the paths, but couldn't guarantee that every back door would still lead to its original location; the Kasen could restore the land's foundation, but the required manpower far exceeded what the three sages and their Servants could provide.\n\n The silence lasted a long time. Finally, Yukari divided the ten node records into three stacks.\n\n She drew the lines to blockade high-risk areas; Okina established temporary passages for nodes where roads had been lost; and Kasen organized local guardians and residents to reinforce areas that were still manageable.\n\n “Let's stop the situation first,” Yukari said. “As for whose method is correct, we'll argue about that while Gensokyo is still around.”\n\n The meeting did not resolve the issue of the Great Hakurei Barrier. It only confirmed one thing: this crisis was beyond the scope of any single sage's ability to handle alone."
    gensokyo_first_stage.3.a:0 "Blockade, rerouting, and holding firm—three options are being implemented simultaneously."


 gensokyo_first_stage.4.t:0 "Youkai Spotted in Tokyo!"
 gensokyo_first_stage.4.d:0 "According to multiple mainstream Japanese media reports, numerous unidentified entities appeared in the Shinjuku and Asakusa areas of Tokyo this morning. Witnesses claimed to have seen flying women, “strange people” manipulating fire and ice, and even a “vampire girl” in Gothic attire directing soldiers on a march through the streets.\n\n Initially, the government suspected it was a new type of drug or psychological warfare technology, but when reports of unidentified flying objects strafing the Hibiya Army Headquarters were received, the Prime Minister urgently declared martial law nationwide, and Tokyo entered a state of de facto wartime.\n\n This is the first public collision between fantasy and reality, and for the first time, humanity has genuinely begun to “believe” that Youkai truly exists."
 gensokyo_first_stage.4.a:0 "This is a disaster, but also a revelation."

 
 gensokyo_first_stage.5.t:0 "Fantasy Breakthrough! Youkai Enters the Real World!"
 gensokyo_first_stage.5.d:0 "Reports of “abnormal phenomena” have emerged from multiple locations in Japan: unidentified flying objects and non-human entities have appeared in Tokyo, Nagano, and Yokohama, and the military has completely lost contact in some areas.\n\n As images and recordings are gradually released, the word “youkai” is no longer a children's story, but a real threat.\n According to unnamed officials, the government currently refers to this as the “Gensokyo force,” an abnormal civilization from a closed space, whose purpose is to prevent “being forgotten and disappearing.”\n\n Scholars call this conflict the “First Human-Youkai War.”\n Tokyo's stock price has plummeted, a large-scale wave of religious conversion has occurred among the public, and society is on the verge of madness and awakening.\n And this war seems to have only just begun."
 gensokyo_first_stage.5.a:0 "When “non-existent things” begin to demand space and recognition, can humanity still retain its so-called reality?"

 gensokyo_first_stage.6.t:0 "The first war between humans and youkai has officially broken out!"
 gensokyo_first_stage.6.d:0 "When things that humanity no longer believes in begin to attack human society, the historic moment known as the “First Human–Youkai War” begins.\n\n Gensokyo's various forces join forces to invade the real world, using incomprehensible powers such as Youkai, ghosts, Kappa, vampires, and Tengu to fight against modern armies.\n The Japanese army suffers defeats in many places, and public opinion, religion, and social order collapse completely.\n\n The Three Sages declare this a “just war for survival,” while the Japanese government issues a defense warning of a “mythical disaster.”"
 gensokyo_first_stage.6.a:0 "Fantasy and reality, war has begun."



 
 gensokyo_first_stage.7.t:0 "Scarlet Devil Mansion raids the palace and parliament!"
 gensokyo_first_stage.7.d:0 "At 4: 00 AM, the Imperial Palace and the Diet Building in Tokyo were simultaneously attacked by unidentified armed forces from the air.\n\n Witnesses claimed to have seen “a Gothic maiden floating in the air, roaring in the night,” and controlling black bats and blood-red mist to enter the Imperial Palace grounds.\n With tactical support from Sakuya and Patchouli, the Scarlet Devil Mansion Legion accurately cut off all military communications in the capital, and then, led by Scarlet herself, stormed into the Imperial Palace.\n The entire security force was wiped out.\n\n According to incomplete statistics, members of the Imperial Family and several cabinet members are missing, and the Diet Building was sealed off.\n Scarlet Devil Mansion raises a dark red banner that reads: “The Age of Human Domination is Over.”\n\n This raid quickly caused a huge stir in the global media, not only because of its scale, but also because of its symbolism—Gensokyo is no longer just another world.\n It now occupies the core of power."
 gensokyo_first_stage.7.a:0 "The heart of Japan has been torn apart"
 gensokyo_first_stage.7.b:0 "We must take back our country!"

#  gensokyo_first_stage.8.t:0 "永远亭出动！妖兔接管战场后勤"
#  gensokyo_first_stage.8.d:0 "随著战争进入第二阶段，前线伤亡逐渐攀升。\n尽管妖怪大多具有一定的自我恢复能力，但在长时间接触现实世界后，灵力不稳、情绪崩溃、精神异常等症状越来越明显。\n\n在八意永琳与辉夜的指挥下，永远亭正式开启「后方灵体稳定作战系统」。\n无数训练有素的妖兔医疗队穿梭于裂口与前线之间，运送药剂、稳定剂与急救设备，并建立临时术式野战诊疗所。\n\n铃仙·优昙华院·因幡则率领一批擅长精神波导的妖兔精英，直奔战线最前端，利用精神共振术为士兵解除「存在共鸣崩溃」症状。\n许多士兵声称在她的注视下「想起了自己是谁」，并重燃战意。\n虽非武力，却是此战不可或缺的一环。"
#  gensokyo_first_stage.8.a:0 "永远亭的稳定，是战争中唯一的理性。"
#  gensokyo_first_stage.8.b:0 "她们的后勤比我们的主力还有效率……"

#  gensokyo_first_stage.9.t:0 "天狗之眼：制空与情报同步作战"
#  gensokyo_first_stage.9.d:0 "天空是天狗的领域，而战争，是她们眼中的真实。\n在八云紫命令全面开战后，天狗情报部迅速出动。\n\n射命丸文以高速飞行与摄影术为核心，开展「连线实时监控」行动，针对日本主要军事路线与城市防线进行持续侦查。\n空中的天狗哨站与地面协作单位透过魔力转换系统将即时影像传回前线指挥部。\n\n犬走椛则带领地面情报部队搭配空中网络，进行地形快速标定、伪装点排查与部队编组模式分析。\n两人密切合作，让幻想乡的部队得以「在敌人转念之前」行动。\n\n更令人惊讶的是，她们还破解了数个外界无线电系统，导致日本军方多次误发命令或部署错位。\n有人说，天狗不只是记者与侦查兵——她们就是这场战争的「指导者」。"
#  gensokyo_first_stage.9.a:0 "他们看见我们之前，我们早已记录下他们的心跳声。"
#  gensokyo_first_stage.9.b:0 "敌人的眼睛比我们的部队还要多"

#  gensokyo_first_stage.10.t:0 "妖精奇袭：我们是最强的！"
#  gensokyo_first_stage.10.d:0 "在名古屋附近的一处林地，一支妖怪侦察队意外拦截到日本军的补给车队。\n按照常理，这种行动应该交由河童或天狗处理——但那天，是妖精们先发现了。\n\n琪露诺带领一队由她自封为「最强战力」的妖精，外加三月精的隐身与声音干扰能力，展开了出其不意的攻击。\n他们在夜色中制造雾凇、冰面滑坡与幻听，让补给队困于森林内部并误判敌军数量，最终自行弃车逃离。\n\n当红魔馆接收到战报时，琪露诺已经在补给车上立起一面冰雕标语：「这是最强的胜利。」\n这场伏击几乎没什么死伤，但却极大震撼了人类军方：连最不被看重的妖精都能夺走他们的后勤命脉。"
#  gensokyo_first_stage.10.a:0 "我们是最强的！"
#  gensokyo_first_stage.10.b:0 "这些小东西太麻烦了……"

#  gensokyo_first_stage.11.t:0 "夜色中的无声者：草根妖怪的反击！"
#  gensokyo_first_stage.11.d:0 "在一片人类遗忘的废弃村庄中，草根妖怪们开始组织自己的反击计划。\n她们没有力量、没有指挥官，甚至很多连名字都没人记得。\n\n但这次，站在最前方的，是那位从没被世界完整接受的存在——赤蛮奇。\n作为带著头颅与身体分离移动的特性的妖怪，她在夜色下如鬼魅般穿行于补给路线与临时军营之间，带领数百名无名妖怪、地缚灵与小精灵，发起了一场无声的突袭。\n\n她们没有高级武器，但她们知道地形、会利用阴影与废墟、懂得人类的习惯。\n那晚，三个补给点被破坏；十几名士兵精神失控；谣言四起，甚至传出「首级飘浮」的都市传说。\n最终赤蛮奇只是轻声说了一句：「你们看见我们，是因为你们终于再次相信『我们存在』。」"
#  gensokyo_first_stage.11.a:0 "弱小者，也会写下胜利的一页。"
#  gensokyo_first_stage.11.b:0 "这群东西……根本不是战争对象，是恶梦！"

#  gensokyo_first_stage.12.t:0 "无声侵袭：地灵殿攻入潜意识"
#  gensokyo_first_stage.12.d:0 "当战争进入中段，传统武力与补给压力已让日本军队疲惫不堪。\n\n而就在这样的时机，古明地觉亲自登上前线，携妹妹古明地恋执行一场前所未有的战术行动。\n恋的能力是「操纵无意识」，这不只是操纵思想，而是直击人类恐惧与怀疑的根源。\n透过她的干涉，被标记的敌军指挥官开始梦见妖怪、听见不存在的命令，甚至不自觉自相残杀。\n\n日本军中的谣言爆发：有人声称看到自己小时候最怕的妖怪；有人不断梦见亲人说「你们输了」；还有单位凌晨自焚。\n军医无法解释，指挥部束手无策。\n觉静静说道：「我们不需要攻击，只要让他们想起那些被压下去的恐惧。」"
#  gensokyo_first_stage.12.a:0 "胜利的方式，从来不止一种。"
#  gensokyo_first_stage.12.b:0 "我们的军心……正在裂开。"

#  gensokyo_first_stage.13.t:0 "河童工坊总动员：战术兵器部署！"
#  gensokyo_first_stage.13.d:0 "河童从来不喜欢上战场，但她们喜欢发明，特别是在材料充足与压力剧烈的状况下。\n在幻想乡与日本交战进入消耗阶段后，河城荷取宣布：开启「总动员机械制造计划」。\n\n地底工坊日夜运作，通过妖气转压反应炉，成功将地下水压与灵气结合，试制出第一批**「高压震爆弹」与「灵导能量喷射枪」**。\n这些武器不依赖火药，而是通过妖力导管与高频灵震，造成对象失衡、武装瘫痪、甚至记忆断裂。\n\n虽然未经过完整测试，但荷取一贯风格是：「先用，后修。」\n在第一次部署中，这些武器成功压制一支日本侦察兵小队，并让周边电子设备完全瘫痪 36 小时。"
#  gensokyo_first_stage.13.a:0 "我们是工程师，不是军人——但我们会让军人变得更有效。"
#  gensokyo_first_stage.13.b:0 "这些东西到底是从哪来的？！"

#  gensokyo_first_stage.14.t:0 "境界操纵：八云紫亲自出手！"
#  gensokyo_first_stage.14.d:0 "当战争进入关键阶段，幻想乡的核心贤者八云紫，终于不再观望。\n\n紫展开境界操纵术，在多处战场边界打开瞬间裂缝，让她的式神蓝与橙潜入日本后方指挥体系。\n这并非正面冲突，而是一场纯粹的猎捕与瓦解。\n\n蓝，作为计算与策略的式神，透过资讯操纵让敌方多支部队错误部署、补给中断、命令无效。\n\n橙则像猎豹一般，突袭小型指挥部、绑架军官、操纵野兽伏击军车。\n\n最震撼的，是某位日本高层将领在记者会即将发言前，当众「被空间吞噬」，留下满地裂缝与一张纸条：「被记住的，才不会消失。」\n整个日本军方陷入疯狂重编体系的混乱。\n\n紫则在裂缝深处静静道：「记忆、恐惧、误判——这三者足以摧毁任何军队。」"
#  gensokyo_first_stage.14.a:0 "这不是战术，这是猎杀。"
#  gensokyo_first_stage.14.b:0 "一个将军消失，整个战局崩溃……"

#  gensokyo_first_stage.15.t:0 "幻想的现实化：日本已全数落入妖怪之手"
#  gensokyo_first_stage.15.d:0 "人类的防线终于溃败。\n最后一个日本军指挥所遭到河童奇术炸药摧毁，原本作为象征的天皇，传出被幽幽子的冥界使者接引「进入另一个境界」。\n城市的灯光黯淡，政府解体，民间组织停止抵抗。\n恐惧与混乱退场，留下的是一片寂静与陌生。\n\n这不再是日本，而是幻想乡的延伸。\n八云紫透过电波对全国播报：「此刻起，人类与妖怪将共享这片土地——不论你是否准备好。」\n\n红魔馆掌控首都管理区，永远亭接管卫生与医疗秩序，天狗建立高空通讯网，妖精在校园与废墟中播放自己的「胜利曲」。\n在街角与森林之间，妖怪们慢慢取代了人类的记忆、信仰与权力。"
#  gensokyo_first_stage.15.a:0 "幻想乡，不再需要结界。"


    gensokyo_first_stage.17.t:"Gateway to the Sea—The Philippine Issue"
gensokyo_first_stage.17.d:"Gensokyo's flag has been planted on Chinese soil, and the rudiments of a new East Asian order are gradually taking shape. However, there is one island on the map that cannot be ignored: the Philippines.\n\n This is not only a vital maritime stronghold in East Asia, but also an important base for the powers of the Outside World in the Pacific. If it can be captured, it will be equivalent to completely controlling the sea power in East Asia and pushing “Greater Gensokyo” onto the world stage.\n\n However, the Philippines is still within the sphere of influence of the United States. Any military action against the Philippines will ignite international anger and cause Gensokyo to completely break with the United States.\n\n Yukari Yakumo silently gazed at the nautical chart. Ran calmly pointed out the strategic value of the advance, while Chen whispered a reminder from the side: “Won't this make us enemies of the whole world...?”\n\n Ultimately, the decision remained in Yukari's hands."
 gensokyo_first_stage.17.a:"We will not advance and will avoid conflict with the United States."
 gensokyo_first_stage.17.b:"The Philippines is the gateway to the sea, we must take it!"

 gensokyo_first_stage.18.t:"The Snowy Wasteland—The Siberian Problem"
 gensokyo_first_stage.18.d:"Gensokyo has firmly established itself on Chinese soil, and the southern front is advancing. However, in the north, an endless snowfield still stretches out—Siberia.\n\n This land is barren and hopeless for humanity, home only to exiles and scattered settlements. But in Yukari Yakumo's eyes, it is priceless: iron ore, coal, and oil, enough to support a war against the entire world. More importantly, this permafrost will become the “Northern Great Wall” of Greater Gensokyo, resisting threats from Russia and Europe.\n\n “We didn't choose to seize it; we had no choice. If we want to build Greater Gensokyo, this permafrost must belong to us.”"
 gensokyo_first_stage.18.a:"Seize Siberia and establish a northern barrier."






 gensokyo_first_stage.19.t:0 "The Last Meeting of the Hundred Youkai Accord"
 gensokyo_first_stage.19.d:0 "When the meeting began, many delegates had already put away their documents. The marching routes on the walls had not yet been erased, and occupation markers still marked Tokyo, Yokohama, and various ports; however, the war against Japan was over, and the common goals initially written by the Hundred Youkai Accord had been achieved. There were no enemy forces to join forces to stop them, and this wartime agreement that forcibly bound the Youkai, God, and the undead together seemed to be coming to an end.\n\n Remilia was the first to bring this up. She swirled her wine glass, demanding that the troops, occupied territories, and captured supplies be returned to their original commanders: “Scarlet Devil Mansion has fulfilled its part. Now that the banquet is over, there is no reason to keep the guests at the table.”\n\n Byakuren Hijiri also opposed the continuation of wartime power, but for completely different reasons. Myouren Temple was willing to continue sheltering refugees and treating the wounded, but she couldn't accept that all relief had to be subject to military occupation first. “The rights surrendered to survive the war shouldn't become the norm after peace arrives.”\n\n The Military Affairs Committee wanted to reclaim the army, the Faith Committee wanted to restore the autonomy of each temple and shrine, and the People's Committee didn't believe that post-war distribution would take care of the lower classes. Sekibanki pushed her chair back: “During the war, you knew where to find us. Now the warehouses, factories, and railways have owners, and you want us to hand over all the roads and communication networks. If the agreement only leaves the spoils to be divided, we'll go back and take care of our own people.”\n\n Yuyuko also prepared to leave. The spirits of the battlefield were crossing the damaged boundary between life and death; she had no interest in arguing with the living about factories and land. Eirin didn't try to persuade either side to stay, only pointing out that the agreement lacked post-war procedures: continuing as before would lead to chaos, while immediate dissolution would simultaneously disrupt medical care, rationing, and demobilization.\n\n This was the only moment in the entire meeting that came close to consensus—each party taking their personnel and spoils might be the easiest outcome. Yukari Yakumo didn't interrupt them until Ran Yakumo placed the final report on the table."
 gensokyo_first_stage.19.a:0 "After the common enemy disappeared, everyone wanted to leave."

 gensokyo_first_stage.20.t:0 "Hundred Youkai Accord did not adjourn."
 gensokyo_first_stage.20.d:0 "“Troops not yet disarmed, unattended supply depots, overlapping occupation orders, disrupted food transport, lingering spirits, and shifting barriers appearing throughout Japan.” Ran Yakumo finished reading, her voice calm to the point of being cold.\n\n “If all parties withdraw today, at least seven sets of mutually unrecognized orders will take effect simultaneously tomorrow. Double requisitioning will occur within three days, and medical and food supplies will be disrupted on a large scale within seven days. The exact location of the first armed conflict cannot be accurately calculated at this time.” The meeting hall gradually quieted down. Yukari finally raised her eyes. “The war is over.\n\n But the meeting hasn't started yet.” She unfolded a reorganization plan she had prepared beforehand, without asking for the parties' consent.\n\n The Hundred Youkai Accord would not be dissolved with the end of the war, but would become a permanent institution of Gensokyo. The Military Affairs Committee would be responsible for demobilization, garrisoning, security, and joint mobilization; those remaining in it would retain some of their wartime personnel and participate in officer appointments and the distribution of supplies. The Faith Committee would take over medical care, shelter, local reconstruction, and the resettlement of the people; its members would be able to obtain food, medicine, building materials, and transportation routes, and decide the order of relief efforts. The People's Committee would manage workshops, rationing, local liaison, and appeals; grassroots youkai, tsukumogami, and artisans would be given official seats and would also be able to track whether wartime requisitioned items had been returned.\n\n The chairpersons of the committees would still rotate among the members, and the leaders could promote their own plans and obtain corresponding resources. As long as they remain within the Hundred Youkai Accord, each party can obtain a portion of what they desire from the reconstruction.\n\n However, no empty space was left at the top of the agreement. Yukari Yakumo retained final arbitration power; Ran Yakumo was responsible for budget, personnel, order transmission, and execution monitoring; Chen visited settlements, workshops, and refugees, contacting those who couldn't access the meeting place. The committees could debate, veto each other, and expand their influence, but they couldn't bypass the central command of Yakumo to mobilize shared resources.\n\n Remilia, after reading the plan, smiled slightly: “You cut the benefits into several pieces, placed them in front of each chair, and then told us that only those sitting can receive them.”\n\n'Correct, ' Yukari replied."
 gensokyo_first_stage.20.a:0 "Nobody likes this reorganization"


 gensokyo_first_stage.21.t:0 "Those who stayed at the long table"
 gensokyo_first_stage.21.d:0 "“And then you decide how much each of us is allowed to take.” Remilia raised her glass. “A bribe with all pretence stripped away.”\n\n “Better than shooting one another with all pretence stripped away,” Yukari replied.\n\n Byakuren did not smile. What would happen, she asked, if a committee concluded that Yukari's ruling was harming innocent people?\n\n “Present the evidence. Have Eiki review it, Ran recalculate it, and let everyone see what is in dispute,” Yukari answered. “Until a new ruling is issued, however, the existing order remains in force.”\n\n Sekibanki immediately pressed her further. “And what if these so-called seats merely let us finish speaking before you do whatever you intended in the first place?”\n\n Yukari turned to face her. “Then you have all the more reason to stay—and make certain I cannot pretend I never heard you.”\n\n This was not equality, and no one mistook it for trust. Yukari Yakumo had simply placed the armies, food, medicine, roads, intelligence, and political recognition every faction needed within a single institution. No one was forbidden to leave, but departure meant surrendering any voice in their distribution while a rival occupied the vacant seat.\n\n And so the delegates sat down again. Remilia remained because she would never yield military power to another. Byakuren remained because refugees and the defeated could not be entrusted to those indifferent to their fate. Eirin needed a unified medical network; Yuyuko, a stable boundary between life and death; the tengu, access to intelligence; Moriya, public works and faith; and the grassroots youkai, the chairs they had fought so hard to claim.\n\n Not one of them stayed because they trusted the Hundred Youkai Accord. They stayed because they trusted the people across the table even less.\n\n Yukari did not resolve their contradictions. She drew a boundary around every ambition and used her own authority to hold them at the same table. So long as she occupied the head seat, anyone who sought to overturn that table would first have to face everyone else around it.\n\n The Hundred Youkai Accord survived. From that day forward, however, it began to assume a dangerous new shape. The Military Affairs Committee controlled the armed forces; the Faith Committee, relief and public sentiment; the People's Committee, production and local networks. Every rotation of office, every allocation, and every unresolved dispute made the three more independent.\n\n Yukari believed she could always stand between those powers. At her side, Chen did not dare ask the question aloud: if the head seat were suddenly empty one day, would those forced to remain at the table continue their meeting—or redraw its boundaries as battle lines?"
 gensokyo_first_stage.21.a:0 "They stayed, but not because of mutual trust."

  #gensokyo_first_stage.21.t:"紫之霸业"
 #gensokyo_first_stage.21.d:"会议大厅内，声音此起彼落。这是幻想乡胜利后最盛大的会议，却不是庆功，而是一场即将撕裂的争论。\n\n古明地觉静静坐在阴影中，她的眼睛闭合，用第三只眼的力量将在场所有人的思想收入口中。她冷冷地说：「你们口中喊的是正义和秩序，可心底想的只有利益与恐惧。别以为我听不见。」这一句话让大厅陷入片刻沉默，但很快被更大的声音淹没。\n\n四季映姬重重敲击桌案，站起来斥责：\n\n「八云紫，你的计划已经超越了贤者的本分！你不是守护者，而是专制的暴君！」\n\n妖怪山的大天狗饭纲丸龙，挥动羽扇冷冷回应：\n「天狗的新闻与情报网早已传遍全境。若你的结界计划启动，将把整个幻想乡拖入外界的视线。这会带来我们无法承受的灾祸。」\n\n贤者们同样不依不饶。隐岐奈与华扇联手发难，指责紫以权谋压迫群体，妄图将幻想乡据为己有。大厅里的声浪逐渐失控，争吵与指责让气氛如烈火般燃烧。就在混乱即将爆发之时，八云紫缓缓起身。她没有多言，只是将纸扇轻轻一阖。空气开始颤抖，整个大厅像是被无形的巨手扭曲，发出低沉的「咔嚓」声。众人心头一震，压迫感如山岳般笼罩，令呼吸都变得困难。\n\n「安静。」紫的声音低沉，却如铁锤般重击在每个人的心头。\n隐岐奈试图反抗，却瞬间被境界的裂缝束缚，强行压制。华扇脸色苍白，身体被无形的墙壁逼回座位。连四季映姬的喝斥也在半途断裂，喉咙被无形的枷锁锁住。在这一刻，紫控制了议会。\N\n红魔馆的女仆长咲夜低下头，未再言语。雷米莉亚只是轻笑一声，双眼闪烁著兴奋，却没有任何阻止的举动。红魔馆，选择了沉默。\N\n古明地觉虽然被强烈的威压压迫，但她心中读到的却是众妖怪的惊恐与臣服。她睁开眼睛，无声地叹息，终究没有再反抗。\N\n妖怪山的大天狗饭纲丸龙，扇子在手中颤抖，却在凝视紫的目光后无奈低头。他知道天狗的情报网再广，也敌不过这种绝对的力量。\n\n就在众人被压制的同时，紫的两位式神走上前来。八云蓝冷静地打开卷轴，宣读军队与后勤的安排；橙则急切地提醒，妖怪军队已经就位，随时听候差遣。两人仿佛在这场戏剧中，为紫的计划补上最后的拼图。\n\n八云紫微微抬手，境界的力量再次翻涌，化作看不见的风暴。那些仍心怀反抗的声音，被彻底清洗。反对者的意志，在无形的力量中粉碎，留下的只是死一般的寂静。\n\n紫缓缓坐回高座，唇角扬起一抹冷冽的笑容。\n「从今日起，议会的声音，便是我的声音。」\n\n那一刻，幻想乡的所有势力都明白：\n这已不再是三贤者共同治理的幻想乡，而是八云紫一人的霸业。"
 #gensokyo_first_stage.21.a:"诸界皆伏首，唯有紫立于顶点。"

 #gensokyo_first_stage.22.t:"式神的奏报"
 #gensokyo_first_stage.22.d:"在紫的命令下，八云蓝与橙走入会议厅。两人分别跪伏在紫的座前，带来了她们整理好的计划书。\n\N八云蓝神情冷峻，语调严谨而不容置疑。「主上，军事与后勤已经全部布局完毕。兵力调度、补给运输、结界加固，我已为每一个环节计算出最优路径。若有谁胆敢违抗，将在第一时间被清除。」她的语气如同冰冷的刀刃，让人丝毫不敢怀疑计划的可行性。\n\n相比之下，橙则显得雀跃许多。「紫大人！大家都准备好了！天狗已经听话地跑去侦查，红魔馆的人也答应给我们武器！啊，还有……草根妖怪们说要帮忙守住边界！」她的语速飞快，带著天真却又迫不及待的兴奋，仿佛将这场巨大的计划看成一场游戏般有趣。\n\n紫安静地听著，眼神冷冽却带著几分愉悦。严密如八云蓝的计算，单纯如橙的热情，与那些臣服于她的势力全都交织在一起。这份报告，已不仅是计划，而是她的棋盘上所有棋子对她的效忠。"
 #gensokyo_first_stage.22.a:"很好，一切都如我所料。"

 #gensokyo_first_stage.23.t:"紫之独白"
 #gensokyo_first_stage.23.d:"夜幕低垂，议会大厅中的烛火逐渐熄灭。嘈杂的声音早已散去，只有八云紫仍独自一人坐在高座之上。白日里压倒众生的气势，在这静谧的夜里不见踪影，只剩下一抹孤独的身影。\n\n她的指尖在桌案上微微颤抖，心底的声音压过了白日里的冷酷。\n她想起过去的光景：博丽巫女手持御币，在神社前与妖怪对峙，却又能在日落时分与她们共享清茶与闲谈。那份微妙的平衡人与妖的对立与依存才是她真正向往的幻想乡。\n\n「我所渴望的，不过是延续她的理想。」紫低声呢喃。\n博丽巫女守护的是结界，而她守护的则是整个幻想乡的存在。两者殊途同归：守护一个人与妖共存的世界。\n然而现实，却一次次逼迫她背离初心。\n人类的世界在进步，他们的枪炮与钢铁正在将妖怪的传说抹去。内部的贤者与大妖怪们争夺权力，只将胜利视作分赃。她最爱的幻想乡，被包围、被撕裂、被威胁。\n她闭上眼，呼吸沉重。\n\n「若要守护这片乐土，就必须有人背负黑暗。若这个角色没有人愿意做，那便由我来做。」\n她睁开双眼，目光比白日更加锐利。\n\n「哪怕我必须成为最冷酷的统治者，哪怕我的双手沾满鲜血，哪怕最后被所有人唾骂……我也要守护幻想乡。」\n烛火在她的身影下摇曳，将她的孤独勾勒得格外清晰。这一刻，八云紫不只是冷酷的领袖，而是一位愿意用自己全部的理想与生命，换取幻想乡延续的守护者。"
 #gensokyo_first_stage.23.a:"这就是我的使命，为了幻想乡。"

 #gensokyo_first_stage.24.t:"紫之败局"
 #gensokyo_first_stage.24.d:"胜利后的议会，原本该是紫加冕的舞台，却成了她梦魇的深渊。\n\n八云紫缓缓起身，举起手中的纸扇，境界的波动震颤大厅。\n「安静。」\n她的声音低沉，带著压倒性的力量，试图如往常一样镇压争吵。\n但这一次，没有任何人屈服。\n\n四季映姬昂首站起，声音铿锵而严厉：\n「八云紫，你的专制不再是守护，而是傲慢！幻想乡不需要这样的暴君！」她的话得到大厅内大半数代表的附和，掌声与喝声第一次压过了紫的威压。\n\n古明地觉闭上眼，平静地吐出一句话：「她心底所想的，不是共存，而是统治。」这句话如同利刃，刺穿了紫最后的掩饰。\n\n饭纲丸龙展开羽扇，冷冷宣布：「妖怪山拒绝再听命于你。天狗不会为一个失去节制的领袖卖命。」\n\n红魔馆沉默不语，却冷眼旁观。雷米莉亚轻轻一笑，带著戏谑，没有伸出援手。\n永远亭选择退席，冥界代表转身离去，草根妖怪与妖精的声音在后方沸腾。\n\n紫的两位式神走上前来，试图为她镇场。八云蓝冷声提醒众人：「若没有紫，这场战争根本不会有胜利。」\n橙则急切呼喊：「大家不要忘了紫大人的付出！」\n\n然而，这些声音显得苍白无力。当她们抬起头时，看到的是一双双漠然的目光。\n紫的威压再次涌动，然而境界之力这一次却无法粉碎众人的意志。空气中传来的是冷漠的寂静。她曾经能让世界屈服的力量，如今成了徒劳的挣扎。\n\n隐岐奈冷冷开口：「紫，你已经失去了幻想乡的信任。」\n华扇更是直言不讳：「你不再是贤者，而是被抛弃者。」\n\n最终，会议厅的所有势力一致表决八云紫被逐出议会，剥夺一切权力。\n\n她缓缓放下手中的纸扇，眼神空洞，嘴角却仍挂著一抹冷笑。\n没有一个人愿意再追随她。\n在所有势力背叛的注视下，紫孤身转身，消失于权力的中心。\n\n那一刻，她不再是幻想乡的贤者，不再是守护者，只是一个被历史抛弃的女人。"
 #gensokyo_first_stage.24.a:"紫的棋局，最终崩溃了。"

 #gensokyo_first_stage.25.t:"幻想乡权力真空"
 #gensokyo_first_stage.25.d:"八云紫离席的那一日，议会大厅没有钟声，只有烛火在风里颤抖。墙上的壁绘记录过往的异变与妥协，如今都像一张张被撕裂的脸。议席的缝隙里灌进山风，带来远处鼓噪与人心浮动的气味潮湿、焦躁、钢铁未冷的声音在暗处回响，像一条看不见的蛇，顺著地铁新线一路钻进每座城市。\n\n隐岐奈与茨木华扇仍坐在高位，但她们说出口的每一个字都不再有重量。隐岐奈的表情像她后户的阴影，话语一字一句：「若无大家不合作，这里会比地底更快坍塌。」她的嗓音低沉，落地却是空音。华扇握拳站起，脊背挺直：「各位，停止斗争，我们可以合作解决难题。议会会推选出承担责任的人至少在下个月来临之前。」\n\n没有人回她。因为在会议内外，各势力正以不同的方式宣布：她们才是主导者。\n\n红魔馆的夜宴提早开始。烛台如星，玻璃高脚杯映出血色的月。蕾米莉亚·斯卡雷特以一贯的优雅坐在红绸椅上，敲了三下杯壁。她的嗓音很轻，但穿过厅堂像穿过一口深井：「想像一下，一个没有犹疑的明日。规则清楚、顺从有赏、反抗受罚。妖怪在高处，人类在下方秩序不再靠运气，而是靠血统与力量。」\n女仆长咲夜在她身侧不近不远，白手套按住怀表，指针停下又走，像是一种无声的示威。摆在角落的魔导书翻动，帕秋莉的指节敲在封皮上，「骤冷的风」与「可燃的空气」这两页彼此相望。门外，门番的拳套在灯下泛著钝光。一切语言之外的姿态，都在替大小姐的宣言点头。\n\n妖怪山这一晚没有大风，天狗的报社却比风更快。饭纲丸龙站在露台，朝山谷吼出每一个字：「纪律，由山上而下。秩序，从讯息开始。若议会无法维持秩序，就让山来维持。」她的羽扇掀动纸张，纸张掀动人心。文与椛在印刷间奔走，油墨的味道刺鼻，一版又一版的号外挤出机器，标题从「议会收摊？」涨到「谁来执政？」再到「红雾将临？山的回答是铁律」。河童把印刷机的齿轮换成更紧的齿轮，边换边对伙伴嘀咕：「我们只卖服务，不卖立场。」可他们知道，报纸落在谁的手里，就是谁的枪。\n\n永远亭关上扇门。八意永琳让药罐在火上翻滚，汤药散出的香草味混著酒精，洁白、克制、冷静。「若秩序崩溃，永远亭将退出公共供给体系。」她把这句话写进通告，一笔一画像写在他人的脉搏上。辉夜在帘后隔著竹影看人间，兔子们搬药，耳朵垂得很低。她们听见门外传来人类与小妖怪的争吵谁先拿伤药、谁更该活命争吵像针尖在竹帘上缝缝补补，补不住寒意。\n\n冥界的庭院翻过一层淡雪，西行寺幽幽子用扇面拨开落梅，笑得温婉：「死人，倒是很守秩序。」她笑里带霜，却转头看向一旁的审判者。四季映姬把小槌摆得端正，声音不像人类那样高低起伏：「若死亡开始多过生者，那就是阎魔介入的时刻。此为预告，不是威胁。」冥界的风很安静，安静到让人以为那里的秩序比人间更好。\n\n地底那头，古明地觉坐在办公室中，听见一层又一层的声音像潮水淹过她：「我该不该逃？」、「我们又要被卖了吗？」、「如果红魔馆真能保命，跪也许不是坏事」、「天狗的秩序会不会只对天狗好」、「永远亭会不会只救有钱的」。她睁眼，灯火里看不见脸，只看见意念密密麻麻的纹路，像一张太紧的网。她不说话，因为说了也会被淹没；她不能哭，因为哭会变成立场；她只能记住这些声音，等有人愿意听\n\n人间之里的夜，变得更薄、更尖。酒馆的帘子被撩起又放下，热汤喝到一半就被推翻，吵架声在木柱间绕圈子。有一个做鞋匠的人抓住稗田家的人说：「你写书，写呀，写我们今天活得像狗。」稗田小姐把笔插回笔筒里，声音很低：「我会写，只是不知道谁会看。」\n\n草根妖怪的群聊不在纸上，在街角的暗壁上：用煤块写下的「到底谁替我们说话」、用指甲刻下的「上面开会，下面开刀」、用血抹出的「不要再死小的」。赤蛮奇举起一块破木牌当麦克风：「我们是多数！」回声环绕所有村庄的街角，砸在每个人的耳骨上，砸出一个共同的形状【不耐】。\n\n议会再一次开会。这一次，椅子的摆放更靠近，像在挤最后一口暖气。隐岐奈把掌心按在桌面，桌面很冷，冷到让人不由自主地想起地底。她说：「我们需要暂时的共主。」\n饭纲丸龙冷笑：「暂时的权力，最容易变永久。」\n咲夜看了看指针，对蕾米莉亚低语：「大小姐，时间站在您这边。」\n永琳用指尖敲杯，恰好三下：「治标可以，治本要命。」\n幽幽子用扇面挡住笑：「我不说话。」\n华扇站起来，手臂紧绷：「那谁愿意背负？」\n房间忽然安静，静得像谁欠了谁的命。\n\n没有人回应。因为每个人都在等等谁先露出破绽，等谁先流血，等谁先替所有人的怯懦付帐。就在这种等待里，议会崩溃了。不是轰然倒塌，而是一处一处松开：一个报社不再送稿、一列火车停在半途、一批药车不见了、一张通告被倒贴，一夜之间所有螺丝都松了半圈秩序从看不见的地方先散掉。"
 #gensokyo_first_stage.25.a:"幻想乡分崩离析"

 #gensokyo_first_stage.26.t:"封印下的声音"
 #gensokyo_first_stage.26.d:"隐岐奈与华扇在议会连续失败后，私下议论著唯一还能倚靠的名字。\n「若是她在……」华扇的声音压得很低，像怕这个名字被风带走。\n隐岐奈冷冷接上：「她已经被封印百年。要叫醒一个死人，还不如培养一个新人。」\n「可惜我们没时间了。」\n\n于是她们前往魔界的古寺。那里的结界依旧矗立，符文完整无缺。厚重的石门看起来还和几百年前一模一样，像是时间从未流动过。两人凝神观察，走进魔界古寺的破碎庭院，却惊愕地发现，门早已被打开。她们怔立在门前，风声带来一阵低缓的梵唱。\n下一瞬，一道清澈却带著慈悲的声音响起：\n「妳们终于来了。」\n\n转身望去，身披紫金袈裟的圣白莲正静静站立于暮色中。她的眼神明亮，既如长者，又如母亲。并非被解放的囚徒，而是一位主动归来的圣者。\n\n华扇几乎不敢相信：「妳……不是还在封印里吗？」\n白莲只是微微一笑，双手合十：「当恐惧与怨念蔓延到整片土地时，封印早已无法再束缚我。只是我不愿惊扰，选择先行走访世间。」\n\n她伸手一指，天空忽然传来轰鸣。一艘巨大的船影破开云雾，从夜幕中浮现§2星莲船§!。\n船身上刻满佛文符咒，灯火照亮黑暗，像一座漂浮的寺院。随之而来的，是她的弟子们：\N§2云居一轮§!，肩挑铁环，笑声爽朗，却带著守护师父的坚定。§2村纱水蜜§!，船长衣袖猎猎，目光如水般坚毅。§2寅丸星§!，高举佛枪，威严中带著柔和。§2娜兹玲§!，聪慧的小鼠，手中握著探测棒，目光在黑暗中寻找东西。§2幽谷响子§!开朗的山彦，摇著尾巴表示开心\n她们踏下船舷，恭敬立于白莲两侧。那一刻，两位贤者忽然明白，这并不是孤身归来的圣僧，而是一位带领著信仰与力量回到人间的「引路人」。白莲张开双臂，轻声说：「我去过荒废的村落，见过饥饿的妖兽与孤独的付丧神；我走过幽暗的河川，看见漂泊的幽灵与无家可归的妖怪；我甚至听到草根妖怪们的哭喊，她们不再相信任何人。」她微笑，眼中却有泪光：「但她们依旧愿意来见我。」说话间，一群看似渺小的身影缓缓走近。§2付丧神§!，有的只是破伞，有的却化为巨鼓与利刃。她们沉默，却在白莲的光芒下挺直腰杆。§2妖兽§!，从野林里走出的狼与狐，眼神野性，却在白莲面前低头，表示忠诚。§2幽灵§!，无声地漂浮，既有战场的亡将，也有无名的孩童，她们在白莲的慈悲里找到短暂的安息。\N这一幕，让贤者们屏息。\N\N「妳……」隐岐奈难得失语，「妳已经……召集了她们？」\N「不是我召集她们。」白莲摇头，眼神温柔，「是她们的痛苦，把我唤醒。」\N\N暮色里，白莲的声音如同钟声回荡：\N「妖怪也好，人类也好，强大者也好，弱小者也好生命都该被尊重。这片土地需要的不是新的锁链，而是新的理解。」\N两位贤者对望。她们本以为自己寻来一根救命稻草，却发现眼前的，是一根能支撑整片大地的梁柱。\N星莲船的灯火照亮夜空，草根妖怪们远远望著，眼神中第一次闪烁出希望的火花。"
 #gensokyo_first_stage.26.a:"圣白莲慈爱将传遍整个世界"

 #gensokyo_first_stage.27.t:"黑暗中的火种"
 #gensokyo_first_stage.27.d:"夜色压在幻想乡的街头，昏暗的灯火下，最先躁动的是妖精。\N「我们为什么不能做大事？」琪露诺踢翻一桶空木桶，冰霜蔓延到地面，「战争时，我们也上过前线！可现在，他们只把我们当闹事的孩子！」\N身边的妖精们嘻嘻哈哈地附和，却没人笑得开心。她们渴望证明，却总被贬低。\N在另一个街角，多多良小伞撑著她那把孤单的伞，苦笑著对人群说：「我们付丧神被丢弃一次，还要被抛弃第二次吗？强者开会决定未来，可从来没有人问过我们。」\N她的声音有些颤抖，像雨打在破布上。周围的付丧神沉默，从破鼓到锈刀，每一个眼神里都藏著委屈与羞辱。\N随著小伞的话落下，一声低沉的鼓响震动了人群。\N堀川雷鼓抬起手，掌心的节奏带著愤怒：「我们不是废弃的器物，我们能震碎墙壁、能撕裂沉默！但议会里的座位，永远不会留给我们。凭什么？」鼓声如雷，敲在每个弱小妖怪的胸口。怨声、叹息、哭喊，渐渐汇聚成低沉的咆哮。\N\N草根妖怪们挤在狭小的巷弄里：\N赤蛮奇握著断掉的旗杆，影狼的目光在黑暗里闪烁，若鹭姬把湿漉漉的头发甩到肩上。\N「我们的声音，总是被压低。」赤蛮奇咬著牙，声音低沉，「可要是再忍下去，我们会彻底消失。」\N「被讨厌就算了，」影狼低吼，「可我们连生存都要被剥夺！」\N若鹭姬的语调轻柔，却藏著无助：「我们什么时候，才能像别人一样，安心活著？」\N\N这些声音盘旋在空气里，像燃料般越积越多。就在此刻，一个被嫌恶却无法忽视的身影走上前来。\N\N鬼人正邪。他的身躯在火把的阴影下拉长，眼神狡黠，嘴角带著近乎疯狂的笑意。人群本能地后退，带著排斥与警惕。因为他是天邪鬼。\N\N「吾名正邪，生来即是天邪鬼。」他的声音清晰，带著一种不可理喻的骄傲，「我讨厌你们，因为你们服从太久！你们讨厌我，因为我不服从！」\N群众愣住，气氛凝固。正邪却继续，语调越来越激昂：\N「强者说要守护，结果谁最先死？是你们！贤者说要共存，结果谁被牺牲？还是你们！他们讨厌我，因为我是反叛的存在。可你们呢？你们要继续被践踏，还是要学会反叛！」\N正邪扬起手，喊声如烈火燃烧夜空：\N「拿起武器！哪怕只是破伞、锈刀、石头、拳头！\N你们说自己弱小？弱小才该反抗！\N因为当你举起武器时，你就和强者一样，拥有了选择的勇气！」\N鼓声轰鸣，小伞的伞面张开，雷鼓击打出震耳欲聋的声浪。\N赤蛮奇高举破旗，影狼咆哮，若鹭姬的歌声在夜里颤抖却清晰。妖精们尖叫著在空中飞舞，点燃火焰的火把照亮黑暗。\N\N正邪的笑声响彻街道：「弱小者的时代，从今晚开始！顺者亡，逆者生！」火光在夜里熊熊燃烧。\N弱小妖怪们第一次不是在逃避，而是昂首向前。\N她们或许仍然渺小，或许仍然微弱，但在那一刻，她们拥有了与强者对抗的勇气。\N\N幻想乡的黑暗，被火种点亮了。"
 #gensokyo_first_stage.27.a:"鬼人正邪将带来平等与未来"

 #gensokyo_first_stage.28.t:"红雾的庄园"
 #gensokyo_first_stage.28.d:"红魔馆的夜宴总是准时开始。这一晚，烛台的火焰比平常更亮，血红的地毯在长廊里铺展，仿佛一条预示命运的河。每一个踏入此地的妖怪，都会被这座城馆的气场压下肩膀——这里不是平等的集会所，而是权力被雕刻成石像的圣殿。\n馆的中心，是那张古老的椅子。蕾米莉亚·斯卡雷特端坐其上，姿态优雅，眼神却锋利得像镶满宝石的短剑。她只是轻轻抬起手，整个大厅便静了下来。\n「诸位。」她的声音低沉，带著贵族独有的自信与悠然，「幻想乡正在瓦解，因为那些所谓的贤者丧失了掌控。混乱在街上蔓延，恐惧在屋里滋生。而谁能为这片土地重新立规矩？」\n她停顿一瞬，红瞳轻轻一扫，嘴角带笑，「除了生而为王者的我，还有谁？」\n话音一落，背后的帕秋莉·诺蕾姬翻过一页魔导书，语气平静却不容置疑：「大小姐的话并非夸张。混乱之中，情报与知识才是统治的基石。若我们掌控知识，就能掌控未来。」她的话如同战略图，冷静而严谨，却在火光下带著不容动摇的力量。\n在她的身旁，小恶魔忙著搬运书卷与羊皮纸，她并不说话，只是点头、记录、收拾，将帕秋莉的思考化作一张张可以传达给下属的命令。她是那双隐形的手，默默补全每一个空隙。\n而在另一侧，十六夜咲夜优雅地整理著怀表，将时间轻轻拨慢，让每一个字句都稳稳落下。她的眼神冰冷，如同一把隐藏在绒布里的刀。若帕秋莉是智囊，那么咲夜便是行动者，她会将大小姐的意志化为血与铁，不留半点空隙。她在静静等待——等待大小姐的手指轻轻一挥，便能让敌人的血洒满地毯。\n门外，红美铃直立在夜风里，身形巍峨。她没有参与谈话，但她的存在就是一堵高墙。夜风吹过她的长发，她微微一笑，却没有放松分毫。她是守护者，不仅守著红魔馆的大门，也守著大小姐的威严。任何胆敢闯入的挑衅者，都会先撞上她这堵「微笑的铁壁」。\n至于楼上的黑暗角落里，芙兰朵露的身影若隐若现。她的双眼在火光中闪烁，如孩童般的天真，却夹杂著令人不安的狂气。她没有走下来，只是轻声哼著古怪的曲子。馆里所有人都知道，她是一张不该随意翻开的底牌。她的沉默，比千军万马更具压迫力。\n在这样一个舞台上，红魔馆的角色逐一显露。帕秋莉的智慧，小恶魔的辅佐，咲夜的行动，美铃的守护，芙兰的神秘——所有的一切，都环绕在那张椅子上的少女周围。\n她是中心，她是红魔馆的太阳，也是最锋利的利刃。\n蕾米莉亚缓缓站起，展开双臂，声音清晰而响亮：「弱者寻求庇护，强者争夺王座，而真正的贵族——是为所有人定下规矩的人。幻想乡的混乱，不是我的灾难，而是我的舞台。只要我一声令下，红雾将覆盖整片天空，所有人都将不得不仰望红魔馆的旗帜。」\n在场的妖怪们屏息凝神。这不仅仅是一场夜宴，而是一场宣告——红魔馆不只是观察者，而是参战者，是即将角逐幻想乡未来的第一支力量。\n烛火映照下，蕾米莉亚的笑容如同血红的月亮。她不是在乞求追随，而是在告诉所有人：\n\n「若幻想乡需要一位统治者，那位统治者，早已在此。」"
 #gensokyo_first_stage.28.a:"雷米莉亚将会是统治者"

 #gensokyo_first_stage.29.t:"白莲的归来"
 #gensokyo_first_stage.29.d:"古老的寺院里，钟声悠悠回荡。与混乱的街头形成鲜明对比，这里静谧而庄严。可是，这份宁静并非冷漠，而是一种能让人屏息的庄重。\n在寺院的正堂，圣白莲盘膝而坐。她的面容既慈悲又坚毅，双眼仿佛能看穿人心深处的恐惧。这不是一位软弱的圣者，而是一位在经历封印与长久孤寂后，依旧选择伸出双手拥抱众生的人。\n她并不孤身而来。随她一同出现的，是四位各具特色的弟子。\n云居一轮高举铁环，气势如山，却在师父面前低下头，像一名坚定的守护者。她笑声爽朗，却在笑声背后蕴藏著钢铁般的决心——一旦有人威胁到白莲，她会第一个冲出去，为师父挡下所有风雨。\n村纱水蜜身披船长外衣，眼神中流露著水的柔和与深邃。她带来的不是刀剑，而是指引方向的罗盘。对信仰的坚定，使她能在迷雾中找到正确的道路。她是团队的引航者，总能在迷惘时给众人以稳定。\n寅丸星，身材高挑，手握佛枪。她是白莲的「武」之象征，强大、可靠、无惧。她的信仰化为锋芒，既能斩断恐惧，也能护卫慈悲。她的眼神带著军人的严谨，却又不失对弱小者的同情。\n娜兹玲，小小的身影却背负著沉重的责任。她的聪慧与敏锐让她成为搜寻与侦察的专家。她能找到隐藏的宝藏，也能看见人心深处的渴望。她虽然常被忽视，但却是师父最信任的「眼睛」。\n她们一同登上星莲船，灯火点亮夜空。这艘巨船并非战舰，而是漂浮于黑暗中的信仰象征。从远处望去，它宛如一盏孤灯，带领迷惘的群体找到方向。\n在船下，弱小的群体聚集起来。\n付丧神捧著破旧的器具，却在白莲的话语中找到尊严。\n妖兽低吼著，眼神中闪烁著久违的希望。\n幽灵漂浮在船身周围，寂静却安定，仿佛在守护著这位僧侣的身影。\n白莲缓缓开口，声音如钟声回荡：「人类与妖怪，强大与弱小，本应彼此看见，而不是彼此践踏。若你愿意走向平等，那么，无论你来自何处，这艘船都会接纳你。」\n帕秋莉的知识冷峻，咲夜的刀锋冷酷，蕾米莉亚的眼神如利刃；与此不同，白莲的力量不是压制，而是凝聚。她的慈悲没有软弱，反而是一种能将无数弱小汇聚成海的坚定。\n寺院的灯火越来越亮，船上的符文闪烁著光芒。这不是一个人的归来，而是一整个信仰的复苏。\n「白莲不仅仅是一名僧侣，她是弱小者的希望，也是动荡中唯一的圣人。」"
 #gensokyo_first_stage.29.a:"圣白莲将会带来光明"

 #gensokyo_first_stage.30.t:"天邪鬼的号角"
 #gensokyo_first_stage.30.d:"夜色阴沉，街头充斥著饥饿与恐惧。当红魔馆的夜宴吸引强者、白莲的慈悲召唤信众时，另一股力量正在黑暗中滋长。\n在地铁的阴影里，在荒废的粮仓旁，在破败的巷口，一个名字逐渐响起。\n鬼人正邪。\n她的身影瘦小，却让人不敢靠近。她是天邪鬼，人人厌恶，人人讨厌，却无法忽视的存在。当人们背弃她时，她反而笑得更张狂。\n\n「吾名正邪，生来即是天邪鬼。」\n这是她的开场，也是她的旗帜。\n她没有城馆，没有船队。她的「舞台」是最肮脏的街道，最寒冷的夜风。\n她的「军队」是草根妖怪、付丧神、妖精、妖兽——那些最常被忽视的存在。\n赤蛮奇站在她身侧，举著破旧的旗帜，声嘶力竭地喊著不平。\n影狼咆哮，银色的毛发在月光下闪烁。\n若鹭姬从河里爬出，眼神悲伤却倔强。\n她们本就是弱小者的象征，如今在正邪的鼓动下，第一次敢直视天空。\n\n付丧神中，有人挥舞著破伞，有人敲打著老鼓。她们的声音原本微弱，却在正邪的笑声中化作战鼓。妖精们在空中乱飞，尖叫著\n要证明自己不是玩物。妖兽群体咆哮，他们要的不是施舍，而是属于自己的生存空间。\n正邪的演说如火焰燃烧夜空：\n「强者说要守护，结果死的总是我们！\n贤者说要共存，结果被牺牲的总是我们！\n他们用秩序锁住我们的手脚，用慈悲麻醉我们的意志！那么——我们为什么不颠倒一切？！」\n\n人群的呼喊一浪高过一浪。\n「推翻！」\n「颠倒！」\n「我们才是真正的幻想乡！」\n\n正邪举起双手，眼神疯狂而明亮：「哪怕只是石头、破伞、锈刀！哪怕我们再弱小！只要我们敢反抗，就不输任何强者！」\n鼓声轰鸣，火光点燃。\n这不是秩序，不是慈悲，而是一场彻底的颠覆。\n「顺者亡，逆者生！」\n这句话在夜空回荡，成为弱小者的号角，也成为幻想乡最不安的火种。"
 #gensokyo_first_stage.30.a:"鬼人正邪将带来革命"

 #gensokyo_first_stage.31.t:"谁能统御幻想乡？"
 #gensokyo_first_stage.31.d:"议会大厅已经化为废墟，曾经象征妥协的座椅被尘土掩埋，墙壁上的壁画也被火焰熏黑。幻想乡失去了「共识」，如今只剩下「选择」。\n四个旗帜在黑夜里同时高举。\n\n在红雾的映照下，蕾米莉亚‧斯卡雷特举杯而立。她的语调从容而冷冽：「弱者渴望秩序，强者制定秩序。幻想乡的未来，不需要妥协，只需要统治者。」在她的背后，红魔馆的灯火比月光更亮，咲夜的怀表、帕秋莉的魔导书、美铃的守卫与芙兰的沉默，构成了一张不可撕裂的网。\n\n另一方，圣白莲率领著她的弟子立于星莲船上。灯火温暖，却照得人不敢直视。白莲双手合十，声音清晰而坚定：「妖怪与人类，强大与弱小，皆有生存的权利。若未来要由谁来引领，那么必须是能让所有生命都被看见的道路。」她身旁的云居一轮、村纱水蜜、寅丸星、娜兹玲如同四座柱石，诉说著这份信仰并非空谈。\n\n第三处，在街角的火光与嘶吼中，鬼人正邪站上高台，举起双手大喊：「吾名正邪，生来即是天邪鬼！顺者亡，逆者生！」她的笑声疯狂却真切，草根妖怪、付丧神、妖精与妖兽们在她的话语下燃烧起来。这股力量粗糙、不安、危险，却比任何军队更炙热。\n\n最后，在一处阴影的尽头，八云紫再度现身。她的容颜依旧端丽，但眼神却多了疲惫。被放逐后的紫，没有了议会的荣光，没有了贤者的威严，只有她的式神仍忠实地伴随在侧。她的声音幽冷却坚决：「幻想乡的未来，仍需要守护。若无我，结界将破碎，这片土地终将化为灰烬。哪怕背负仇恨，我也要重夺它的主导权。」\n红雾的血色、慈悲的光明、反叛的火焰、以及紫色的阴影，四面同时压来。\n幻想乡的未来，就在此刻落入玩家的选择。"
 #gensokyo_first_stage.31.a:"红魔馆的红雾将统御一切！"
 #gensokyo_first_stage.31.b:"星莲船将引领慈悲的未来！"
 #gensokyo_first_stage.31.c:"顺者亡，逆者生！跟随天邪鬼！"
 #gensokyo_first_stage.31.e:"八云紫虽败，仍是幻想乡最后的守护者！"
  
gensokyo_first_stage.42.t:"Exiles from Japan"
gensokyo_first_stage.42.d:"Youkai's army swept through Honshu, Shikoku, Kyushu, and Hokkaido. The Japanese Empire, once touted as a pillar of East Asian order, ultimately lost its homeland in flames, defeat, and chaos. When Tokyo's government offices fell silent, and ports and airports were overflowing with hastily evacuated people, the remaining government institutions, military and political personnel, imperial supporters, and large numbers of refugees placed their last hopes on Higan—Taiwan.\n\n Now, this island became the last refuge for the remnants of the empire. The provisional government rebuilt order amidst martial law, chaos, and famine. Officers vowed to return to the homeland one day, while bureaucrats struggled to maintain the continuation of government orders and rule. Despite losing its capital, most of its territory, and even its once unshakeable prestige, for many, Japan was not dead—as long as the flag remained flying, as long as people still shouted “Banzai,” the empire still had a chance to continue."
gensokyo_first_stage.42.a:"The sun will rise again"
gensokyo_first_stage.42.b:"They were just a bunch of losers"

