KYO_yuuka_convert_remilia_influence_to_fulfillment:0 "Yuuka: Divert Scarlet Supply Lines"

KYO_byakuren_convert_kanako_influence_to_fulfillment:0 "Byakuren: Guides the Moriya followers into the world"
KYO_kanako_convert_satori_influence_to_fulfillment:0 "Kanako: Incorporates underground information into divine affairs"
KYO_satori_convert_megumu_influence_to_fulfillment:0 "Satori: Changes public opinion in Tengu"
KYO_megumu_convert_byakuren_influence_to_fulfillment:0 "Megumu Iizunamaru: Reinterprets Myouren Temple's Goodwill"

KYO_sekibanki_convert_eirin_influence_to_fulfillment:0 "Sekibanki: Send Eientei rations into the back alleys"
KYO_eirin_convert_raiko_influence_to_fulfillment:0 "Eirin: Incorporate the tsukumogami road network into medical rotations"
