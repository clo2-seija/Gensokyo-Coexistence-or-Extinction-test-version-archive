KYO_remilia_influence_political_campaign:0 "The Feast of Loyalty Under the Crimson Moon"
KYO_remilia_influence_political_campaign_tt:0 "Scarlet Devil Mansion extends invitations to leaders from all sides. Wine glasses, seating arrangements, and Remilia's gaze will prompt each guest to reconsider their allegiance.\n\n Remilia's Influence §G+5§!."

KYO_remilia_influence_industrial_campaign:0 "Sakuya Takes Over the Supply Ledgers"
KYO_remilia_influence_industrial_campaign_tt:0 "Sakuya Reorganizes the workshops, warehouses, and transport routes. Scarlet Devil Mansion's order begins to permeate every material allocation by the Military Affairs Committee.\n\n Remilia's Influence §G+8§!."

KYO_remilia_influence_manpower_campaign:0 "Summon Scarlet's Retinue"
KYO_remilia_influence_manpower_campaign_tt:0 "Meiling opens the gate and Sakuya approves the new formations. Those willing to obey the Scarlet Devil Mansion's rules regroup beneath the crimson banner.\n\n Remilia's influence §G+10§!."

KYO_remilia_spend_influence_for_fulfillment:0 "Reorganizing military orders in the name of Scarlet Devil Mansion"
KYO_remilia_spend_influence_for_fulfillment_tt:0 "Remilia mobilized the checkpoints, supplies, and retinues controlled by Scarlet Devil Mansion, pushing the contentious orders directly to the front lines. consumed Remilia's §Y15§! influence, increasing the Military Affairs Committee's compliance by §G+20§!."

KYO_remilia_spend_influence_for_national_buff:0 "The entire army under the red moon"
KYO_remilia_spend_influence_for_national_buff_tt:0 "Remilia turns the entire military system into her own stage. Orders are no longer discussed, only executed. is only available when Remilia chairs the current season's military agenda and she is the chairperson of the Military Affairs Committee. Consumes §Y20§! military performance points to gain a 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_remilia:0 "This season's military agenda: Remilia"
KYO_quarterly_candidate_mandate_remilia_desc:0 "Hundred Youkai Accord This season's military achievements are handed over to Remilia for review. If she also controls the Military Affairs Committee, Scarlet Devil Mansion's orders can be quickly translated into action; if the chairperson is someone else, this arrangement will remain on paper."

KYO_yuyuko_influence_political_campaign:0 "Hakugyokurou's Spring Banquet Invitation"
KYO_yuyuko_influence_political_campaign_tt:0 "Hakugyokurou's invitation is not threatening, only filled with the fragrance of flowers, delicious food, and Yuyuko's composed smile. However, those who attend the banquet often leave having promised more than expected.\n\n Yuyuko Saigyouji Influence §G+5§!."

KYO_yuyuko_influence_industrial_campaign:0 "Netherworld Ghosts Prepare Supplies"
KYO_yuyuko_influence_industrial_campaign_tt:0 "Youmu is responsible for inventory, and the ghosts are responsible for transporting. The undead, needing no rest, travel along the roads of Netherworld, delivering weapons and supplies to where they are most needed.\n\n Yuyuko Saigyouji Influence §G+8§!."

KYO_yuyuko_influence_manpower_campaign:0 "Recalling the Wandering Undead"
KYO_yuyuko_influence_manpower_campaign_tt:0 "Yuyuko allows some of the undead to postpone their departure, joining transport, defense, and battlefield support. This is not resurrection, but rather allowing those who have not yet let go of their obsessions to find their final resting place.\n\n Yuyuko Saigyouji's Influence §G+10§!."

KYO_yuyuko_spend_influence_for_fulfillment:0 "Let the Dead Find Their Place"
KYO_yuyuko_spend_influence_for_fulfillment_tt:0 "Hakugyokurou rearranges the passage between the dead, ghosts, and Netherworld, allowing the Military Affairs Committee's backlog of work to be completed in silence.\n\n Consumes Yuyuko Saigyouji's §Y15§! Influence, increasing the Military Affairs Committee's Compliance §G+20§!."

KYO_yuyuko_spend_influence_for_national_buff:0 "Silent March Under Saigyou Ayakashi"
KYO_yuyuko_spend_influence_for_national_buff_tt:0 "Where petals fall, the dead make way, and ghosts advance. Hakugyokurou takes over the rear order of the entire battlefield almost silently.\n\n Available only when Yuyuko Saigyouji chairs the current season's military agenda and she is the chairperson of the military affairs committee. Consumes §Y20§! military affairs performance to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_yuyuko:0 "This season's military agenda: Yuyuko Saigyouji"
KYO_quarterly_candidate_mandate_yuyuko_desc:0 "The results of this season's military affairs will be brought to a close by Hakugyokurou. If Yuyuko controls the military affairs committee, the power of the dead and the living can be placed in appropriate positions; if she fails to chair the committee, Netherworld will only remain a bystander."

KYO_suika_influence_political_campaign:0 "Night Parade of a Hundred Youkai's banquet"
KYO_suika_influence_political_campaign_tt:0 "Suika neither issues official documents nor holds dull meetings. She simply filled the bottles with wine and had the scattered Youkai sit back down at the same table. (\n\n Suika Ibuki influence §G+5§!)"

KYO_suika_influence_industrial_campaign:0 "The Oni Clan Moves Air Force Supplies"
KYO_suika_influence_industrial_campaign_tt:0 "Heavy weapons, wooden crates, and machinery are no problem for the Oni Clan. What would normally take days is quickly completed amidst laughter, banter, and the smell of alcohol.\n\n Suika Ibuki's Influence §G+8§!."

KYO_suika_influence_manpower_campaign:0 "Gathering Old Friends with a Wine Cup"
KYO_suika_influence_manpower_campaign_tt:0 "A wine cup is passed along mountain paths, through Former Capital, and across the wilderness. Those who receive it understand that Suika Ibuki is looking for someone, and true friends won't pretend not to see it.\n\n Suika Ibuki's Influence §G+10§!."

KYO_suika_spend_influence_for_fulfillment:0 "Regroup the scattered troops into a single unit"
KYO_suika_spend_influence_for_fulfillment_tt:0 "Suika gathers the scattered troops, transport teams, and local armed forces together. They may not follow the rules, but at least they are willing to move forward together.\n\n Consumes Suika Ibuki's §Y15§! Influence, increasing the Military Affairs Committee's compliance by §G+20§!."

KYO_suika_spend_influence_for_national_buff:0 "Night Parade of a Hundred Youkai Returns"
KYO_suika_spend_influence_for_national_buff_tt:0 "Countless scattered youkai converge into a torrent. There are no orderly ranks, only a group of youkai who believe in Suika and in each other, moving forward together.\n\n Available only when the current season's military agenda is chaired by Suika Ibuki and she is the chairperson of the Military Affairs Committee. Consumes §Y20§! military service performance to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_suika:0 "This season's military affairs agenda: Suika Ibuki"
KYO_quarterly_candidate_mandate_suika_desc:0 "This season's military affairs require someone to reunite the scattered Youkai. If Suika becomes the chairperson of the military affairs committee, the unity of the former Night Parade of a Hundred Youkai will once again play a role; if she fails to obtain a seat, the various Youkai will continue to go their separate ways."

KYO_yuuka_influence_political_campaign:0 "The Silent Warning at the Boundary of the Flower Field"
KYO_yuuka_influence_political_campaign_tt:0 "Yuuka doesn't need to invite people everywhere. She only needs to walk through a few strongholds with her parasol to make onlookers understand the weight of the Garden of the Sun.\n\n Yuuka Kazami Influence §G+5§!."

KYO_yuuka_influence_industrial_campaign:0 "Garden of the Sun Conscription Order"
KYO_yuuka_influence_industrial_campaign_tt:0 "The roads, barns, and laborers around the flower field were rearranged. Yuuka does not accept delays, nor does she accept anyone using chaos as an excuse.\n\n Yuuka Kazami Influence §G+8§!."

KYO_yuuka_influence_manpower_campaign:0 "Summoning Flower Fairies and Wilderness Guardians"
KYO_yuuka_influence_manpower_campaign_tt:0 "Flower fairies, plant spirits, and Youkai, who lives in the wilderness, appear one after another. They may not necessarily like war, but they all know that the flames of war must not be allowed to enter Yuuka's flower field.\n\n Yuuka Kazami Influence §G+10§!."

KYO_yuuka_spend_influence_for_fulfillment:0 "Let the Slackers Remember the Season"
KYO_yuuka_spend_influence_for_fulfillment_tt:0 "Yuuka personally oversees the delayed work of the Military Affairs Committee. No one wants to be the one who has to explain the reasons for the failure to her.\n\n Consumes Yuuka Kazami's §Y15§! Influence, increasing the Military Affairs Committee's performance by §G+20§!."

KYO_yuuka_spend_influence_for_national_buff:0 "The Overwhelming Power of a Blooming Spectacle"
KYO_yuuka_spend_influence_for_national_buff_tt:0 "A sea of flowers blooms behind the battle lines, while Yuuka walks at the forefront. This beauty brings no comfort, but rather serves as a reminder to all enemies: nature will also choose to attack.\n\n Available only when Yuuka Kazami is in charge of the military agenda this season and she is the chairperson of the Military Affairs Committee. Consumes §Y20§! military service performance to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_yuuka:0 "This season's military affairs agenda: Yuuka Kazami"
KYO_quarterly_candidate_mandate_yuuka_desc:0 "This season's military affairs results will be reviewed by Yuuka. If she takes the position of Military Affairs Committee Chairperson, all delays will disappear under pressure; if the committee is chaired by someone else, the Garden of the Sun will not clean up someone else's mess."

KYO_byakuren_influence_political_campaign:0 "Myouren Temple's sermons along the way"
KYO_byakuren_influence_political_campaign_tt:0 "Byakuren leads her disciples into villages, shelters, and frontline camps. She does not promise easy peace, only asking everyone to believe that coexistence is still worth trying.\n\n Byakuren Hijiri's influence §G+5§!."

KYO_byakuren_influence_industrial_campaign:0 "The temple community collects food, medicine, and equipment."
KYO_byakuren_influence_industrial_campaign_tt:0 "Myouren Temple is collecting food, medicine, tools, and repairable old items from its followers. Every small donation is sent to the places most in need.\n\n Byakuren Hijiri Influence §G+8§!."

KYO_byakuren_influence_manpower_campaign:0 "Ringing the Morning Bell of Myouren Temple"
KYO_byakuren_influence_manpower_campaign_tt:0 "The bell tolls over villages and ruins. Monks, devotees, those who have received protection from Myouren Temple, and those who still believe in Byakuren come to help.\n\n Byakuren Hijiri Influence §G+10§!."

KYO_byakuren_spend_influence_for_fulfillment:0 "Sending Compassion to the Front Lines"
KYO_byakuren_spend_influence_for_fulfillment_tt:0 "Byakuren demands that the Faith Committee stop empty talk and truly connect temples, believers, and relief outposts, turning promises into visible aid.\n\n Consumes Byakuren Hijiri's §Y15§! Influence, increasing the Faith Committee's performance by §G+20§!."

KYO_byakuren_spend_influence_for_national_buff:0 "Lotus Protects the Entire Territory"
KYO_byakuren_spend_influence_for_national_buff_tt:0 "Myouren Temple extends relief, shelter, and exhortation throughout the entire territory. Byakuren does not shield anyone from suffering, but she will ensure that no one is left alone in suffering.\n\n Available only when Byakuren Hijiri chairs the current season's Faith Agenda and she is the Faith Committee Chairperson. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_byakuren:0 "This Season's Faith Agenda: Byakuren Hijiri"
KYO_quarterly_candidate_mandate_byakuren_desc:0 "This season's faith work will center on the Myouren Temple's philosophy of salvation and coexistence. If Byakuren chairs the Faith Committee, these commitments will reach far and wide; if the chairperson is someone else, her goodwill will remain confined to a limited network of temples."

KYO_kanako_influence_political_campaign:0 "Moriya Shintoku's Pilgrimage"
KYO_kanako_influence_political_campaign_tt:0 "Kanako demonstrates the power of the Moriya Shrine through festivals, miracles, and public processions. She understands that faith comes not only from reverence but also from tangible results.\n\n Kanako Yasaka Influence §G+5§!"

KYO_kanako_influence_industrial_campaign:0 "Mountain God Oversees Industrial Offerings"
KYO_kanako_influence_industrial_campaign_tt:0 "Kappa's technology, the mountain people's labor, and the believers' offerings were incorporated into the same project. Kanako didn't want symbolic offerings, but rather functional facilities.\n\n Kanako Yasaka's Influence §G+8§!."

KYO_kanako_influence_manpower_campaign:0 "Summoning Believers with the Sacred Pillar"
KYO_kanako_influence_manpower_campaign_tt:0 "The sacred pillar is erected, and the sacrificial flag is raised up the mountain path. The believers of Moriya Shrine and the mountain dwellers, at Kanako's call, devoted themselves to transportation, construction, and defense.\n\n Kanako Yasaka's Influence §G+10§!."

KYO_kanako_spend_influence_for_fulfillment:0 "Turning Faith into Engineering"
KYO_kanako_spend_influence_for_fulfillment_tt:0 "Kanako takes over the stalled project, using Moriya Shrine's organizational skills and kappa technology to transform the vague vision into roads, workshops, and supply lines.\n\n Consumes Kanako Yasaka's §Y15§! Influence, increasing the Faith Committee's compliance §G+20§!."

KYO_kanako_spend_influence_for_national_buff:0 "The Divine Power of Wind, Rain, and the Pillars"
KYO_kanako_spend_influence_for_national_buff_tt:0 "Moriya Shrine fully mobilizes the faithful, technology, and mountain order. Kanako wants everyone to see that God's power can build and control.\n\n Available only when Kanako Yasaka is chairing the current season's Faith agenda and she is the Faith Committee Chairperson. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_kanako:0 "This Season's Faith Agenda: Kanako Yasaka"
KYO_quarterly_candidate_mandate_kanako_desc:0 "This season's agenda will test whether Moriya Shrine can expand the faith with tangible results. If Kanako serves as the Faith Committee Chairperson, rituals, engineering, and administration will be integrated; if she fails to chair the committee, the plan will lack the authority to drive it across the entire territory."

KYO_satori_influence_political_campaign:0 "Listen to the unspoken prayers"
KYO_satori_influence_political_campaign_tt:0 "Satori Komeiji visits those who are unwilling to speak to temples and shrines. Fear, doubt, and hidden resentment cannot escape the third eye, and she is at least willing to acknowledge that those emotions do exist.\n\n Satori Komeiji Influence §G+5§!"

KYO_satori_influence_industrial_campaign:0 "Palace of the Earth Spirits Unifies Underground Supply"
KYO_satori_influence_industrial_campaign_tt:0 "Former Hell's minerals, transport beasts, and underground workshops are reintegrated into the supply system. With precise planning, every instance of concealment and waste is reduced.\n\n Satori Komeiji Influence §G+8§!."

KYO_satori_influence_manpower_campaign:0 "Gathering the Excluded Underground Residents"
KYO_satori_influence_manpower_campaign_tt:0 "Too many Youkai, unwelcome on the surface, gather underground. Satori doesn't assure them they'll be understood, only promising their work and existence will no longer be deliberately ignored.\n\n Satori Komeiji's Influence §G+10§!."

KYO_satori_spend_influence_for_fulfillment:0 "Unveiling the Committee's Hidden Thoughts"
KYO_satori_spend_influence_for_fulfillment_tt:0 "Satori leaves no room for shirking responsibility, selfishness, and false piety. When everyone's true intentions are laid bare, the Faith Committee is finally able to continue its work.\n\n Consumes Satori Komeiji's §Y15§! Influence, increasing the Faith Committee's Compliance §G+20§!."

KYO_satori_spend_influence_for_national_buff:0 "The Common Will Under the Third Eye"
KYO_satori_spend_influence_for_national_buff_tt:0 "Fear remains, and disagreements have not disappeared; but unable to deceive each other, all parties can only acknowledge the real problems and share the consequences.\n\n Available only when this season's Faith Agenda is chaired by Satori Komeiji and she serves as the Faith Committee Chairperson. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_satori:0 "This Season's Faith Agenda: Satori Komeiji"
KYO_quarterly_candidate_mandate_satori_desc:0 "This season's Faith work will address the fears and suspicions masked by the words of temples and shrines. If she controls the Faith Committee, the Third Eye can force all parties to face the truth; if she fails to gain a seat, these voices will remain buried in silence."

KYO_megumu_influence_political_campaign:0 "Tengu Newspaper Network Shapes Public Opinion"
KYO_megumu_influence_political_campaign_tt:0 "Megumu Iizunamaru Adjusts the Direction of News, Orders, and Mountain Rumors. When the same statement appears repeatedly in every newspaper, it gradually becomes accepted as consensus.\n\n Megumu Iizunamaru's Influence §G+5§!."

KYO_megumu_influence_industrial_campaign:0 "Youkai Mountain Workshop Integration"
KYO_megumu_influence_industrial_campaign_tt:0 "Tengu's administrative network and Kappa's workshops are integrated into a joint operation. Megumu Iizunamaru doesn't personally handle supplies; she only decides who must deliver them on time.\n\n Megumu Iizunamaru's Influence §G+8§!."

KYO_megumu_influence_manpower_campaign:0 "Issued the Great Tengu Summoning Order"
KYO_megumu_influence_manpower_campaign_tt:0 "The order was rapidly relayed along the hierarchy of Youkai Mountain. Crow Tengu, White Wolf Tengu, and the Youkai who resided in the mountain were summoned level by level; no one could pretend they hadn't received the message.\n\n Megumu Iizunamaru's Influence §G+10§!."

KYO_megumu_spend_influence_for_fulfillment:0 "Unifying the Mountain Tribes"
KYO_megumu_spend_influence_for_fulfillment_tt:0 "Megumu Iizunamaru used the hierarchy, intelligence, and communication system of Tengu society to force all parties in the Faith Committee to work according to the same set of arrangements.\n\n Depleted Megumu Iizunamaru's §Y15§! Influence, increasing the Faith Committee's Compliance §G+20§!."

KYO_megumu_spend_influence_for_national_buff:0 "The Great Tengu's Command of the Entire Mountain"
KYO_megumu_spend_influence_for_national_buff_tt:0 "From the mountaintop to the foot, news, orders, and supplies flow along the same network. Megumu Iizunamaru extends the hierarchy of Youkai Mountain to the entire protocol system.\n\n Available only when Megumu Iizunamaru chairs this season's Faith Agenda and she serves as the Faith Committee Chairperson. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_megumu:0 "This Season's Faith Agenda: Megumu Iizunamaru"
KYO_quarterly_candidate_mandate_megumu_desc:0 "This season's faith work will rely on the tengu's dissemination and organizational capabilities. If Megumu Iizunamaru chairs the Faith Committee, she can decide which voices resonate throughout the land; if she loses her seat, the tengu network will only serve the interests of Youkai Mountain itself."

KYO_sekibanki_influence_political_campaign:0 "The Discontent Spreading Through the Alleyways"
KYO_sekibanki_influence_political_campaign_tt:0 "Sekibanki ventured into workshops, dilapidated houses, and night markets, bringing to the People's Committee the things people dared not say to their faces. She neither whitewashed those in power nor easily believed any promises.\n\n No one noticed that a streak-haired amanojaku would always collect the complaints, IOUs, and testimonies of the injured after the meetings, then organize them into even sharper words.\n\n Sekibanki's Influence §G+5§!."

KYO_sekibanki_influence_industrial_campaign:0 "The Mutual Aid Network Among the Dilapidated Workshops"
KYO_sekibanki_influence_industrial_campaign_tt:0 "Sekibanki connected scattered workshops, repair shops, and secondhand markets. Kagerou was responsible for escorting tools and supplies that were easily stolen, while Wakasagihime went door-to-door to confirm whether food and medicine had truly reached those in need.\n\n As for the streak-haired amanojaku, she merely added a few inconspicuous marks to the map. The road that transports parts today can also transport leaflets, weapons, and those who refuse to bow their heads again.\n\n Sekibanki's Influence §G+8§!"

KYO_sekibanki_influence_manpower_campaign:0 "Four Figures on the Night Road"
KYO_sekibanki_influence_manpower_campaign_tt:0 "The news spread through acquaintances, back doors, and secluded mountain paths. Kagerou walked the outer edge of the group, sniffing out the scents of patrols and ambushers; Wakasagihime guarded the lone survivors, the wounded, and those who dared not proceed; Sekibanki verified the credibility of each newcomer.\n\n At the rear of the group, a figure with dyed hair always whispered: “Do you just want to survive today, or are you tired of having your tomorrow decided by others?”\n\n Sekibanki's influence §G+10§!."

KYO_sekibanki_spend_influence_for_fulfillment:0 "Putting the accounts of the lower classes on the table"
KYO_sekibanki_spend_influence_for_fulfillment_tt:0 "Records of unpaid wages, workplace injuries, forced conscription, and missing persons were slammed onto the People's Committee's table by Sekibanki. Wakasagihime testified for the victims, while Kagerou stood guard outside, ensuring no one could threaten to erase the testimony.\n\n Outside the meeting hall, the streak-haired amanojaku was spreading every excuse, every arrogant remark, and every name left unpunished far and wide. The committee addressed the immediate problems, but she was preparing for the next reckoning.\n\n Decreased Sekibanki's §Y15§! Influence, increasing the People's Committee's compliance by §G+20§!."

KYO_sekibanki_spend_influence_for_national_buff:0 "The dark paths are now connected."
KYO_sekibanki_spend_influence_for_national_buff_tt:0 "Sekibanki stands on the stage, forcing the People's Committee to acknowledge that the lower-class youkai have the right to decide their own lives. Kagerou prevents mutual aid teams from being easily dispersed, while Wakasagihime ensures this force doesn't trample the weak into the mud.\n\n Behind them, the dyed-hair Amanojaku has already connected workshops, night streets, hideouts, and the discontented into an invisible net. No one openly talks about revolution, but the old order has begun to find that orders are no longer obeyed as before.\n\n Available only when Sekibanki is hosting this season's People's Agenda and she is the chairperson of the People's Committee. Consumes §Y20§! People's Compliance Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_sekibanki:0 "This Season's People's Agenda: Sekibanki"
KYO_quarterly_candidate_mandate_sekibanki_desc:0 "Sekibanki is the representative pushed to the forefront by the grassroots youkai. Her skepticism punctures empty promises, the Kagerou's claws protect the scattered mutual aid networks, and Wakasagihime ensures the operation doesn't lose those initially intended to be protected.\n\n However, behind these three lies an unnamed, strikingly dyed Amanojaku. She doesn't vie for the chairmanship, but quietly records every conflict and gap. If Sekibanki takes control of the People's Committee, the grassroots youkai will gain real organizational space; those paths originally built solely for survival might, unnoticed, lead to more radical change."

KYO_eirin_influence_political_campaign:0 "Eientei's Medical Visits and Risk Notices"
KYO_eirin_influence_political_campaign_tt:0 "Eirin dispatches pharmacists and youkai rabbits to examine the injuries and illnesses of residents across the land and issue clear risk guidelines. People may not like her aloofness, but they can hardly deny the effectiveness of her judgments.\n\n Eirin Yagokoro's influence §G+5§!."

KYO_eirin_influence_industrial_campaign:0 "Pharmacist takes over supply chain"
KYO_eirin_influence_industrial_campaign_tt:0 "Medicines, food, equipment, and transportation schedules are recalculated. Eirin treats waste as a diagnosable ailment and doesn't hesitate to eliminate inefficient links.\n\n Eirin Yagokoro's influence §G+8§!."

KYO_eirin_influence_manpower_campaign:0 "Place manpower according to health status"
KYO_eirin_influence_manpower_campaign_tt:0 "Eientei re-examines the wounded, laborers, and available population, assigning everyone to positions their bodies can handle. Efficiency increases, but so does the room for choice.\n\n Eirin Yagokoro influence §G+10§!."

KYO_eirin_spend_influence_for_fulfillment:0 "Diagnosing and Correcting Disorder in People's Livelihood"
KYO_eirin_spend_influence_for_fulfillment_tt:0 "Eirin views the People's Committee as a patient with a complex condition. She neither offers comfort nor delays, but addresses the most potentially fatal problems one by one.\n\n Consumes Eirin Yagokoro's §Y15§! Influence, increasing the People's Committee's compliance §G+20§!."

KYO_eirin_spend_influence_for_national_buff:0 "The Sage of the Moon's Global Prescription"
KYO_eirin_spend_influence_for_national_buff_tt:0 "Healthcare, rationing, and labor allocation across the entire territory are incorporated into a single calculation. This prescription is precise and effective, but no one can be certain whether they are being treated or managed.\n\n Available only when Eirin Yagokoro chairs the current season's People's Agenda and she is the chairperson of the People's Committee. Consumes §Y20§! People's Compliance Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_eirin:0 "This Season's People's Agenda: Eirin Yagokoro"
KYO_quarterly_candidate_mandate_eirin_desc:0 "This season's livelihood work will be assessed by Eirin. If she chairs the People's Committee, medical care, rations, and labor can be precisely arranged; if the committee chair is someone else, her plans can only serve as suggestions and cannot become the standard across the entire territory."

KYO_raiko_influence_political_campaign:0 "Raiko's Drum Tour Connects the Streets and Alleys"
KYO_raiko_influence_political_campaign_tt:0 "Raiko's Drum, accompanied by tsukumogami, performs in sheds, squares, and temporary settlements. The sound transcends class and origin, allowing strangers to begin to believe they are not alone.\n\n Raiko Horikawa's Influence §G+5§!."

KYO_raiko_influence_industrial_campaign:0 "Tsukumogami Restores Old Objects"
KYO_raiko_influence_industrial_campaign_tt:0 "Discarded tools, broken machinery, and decommissioned weapons are reawakened. The thunder drum proves that being discarded does not mean losing value.\n\n Raiko Horikawa's Influence §G+8§!."

KYO_raiko_influence_manpower_campaign:0 "The Drumbeats Summon the Forgotten"
KYO_raiko_influence_manpower_campaign_tt:0 "The drumbeats travel from one settlement to the next. tsukumogami, refugees, and the homeless youkai follow the sound, joining this movement of the Forgotten.\n\n Raiko Horikawa's Influence §G+10§!."

KYO_raiko_spend_influence_for_fulfillment:0 "Let the scattered footsteps fall at the same time"
KYO_raiko_spend_influence_for_fulfillment_tt:0 "Raiko Horikawa doesn't force everyone to become identical. She only allows different voices to find a place where they can move forward side by side, enabling the Committee of the People to function again.\n\n Consumes Raiko Horikawa's §Y15§! Influence, increasing the Committee of the People's compliance by §G+20§!."

KYO_raiko_spend_influence_for_national_buff:0 "A thunderous response from the masses"
KYO_raiko_spend_influence_for_national_buff_tt:0 "The sound of drums echoed through roads, workshops, and settlements. Those long considered relics and marginalized now proved their existence with their voices.\n\n Available only when Raiko Horikawa is hosting this season's People's Agenda and she is the Chairperson of the People's Committee. Consumes §Y20§! People's Compliance Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_raiko:0 "This Season's Agenda for All: Raiko Horikawa"
KYO_quarterly_candidate_mandate_raiko_desc:0 "This season, the All-People's Committee will build its work around mutual-aid networks for tsukumogami and the unaffiliated. If Raiko chairs the committee, scattered voices can become a common force; without her seat, that response will remain confined to streets and stages."

KYO_eiki_influence_political_campaign:0 "Circulating preaching and judgment of right and wrong"
KYO_eiki_influence_political_campaign_tt:0 "Eiki travels to various places, listening to disputes and pointing out the faults that each side is unwilling to admit. Her words are not pleasing, but they give many people who have nowhere else to turn a response for the first time.\n\n Eiki Shiki's influence §G+5§!."

KYO_eiki_influence_industrial_campaign:0 "Investigate and prosecute embezzlement and unjust levies"
KYO_eiki_influence_industrial_campaign_tt:0 "The embezzled resources, seized workshops, and shifted burdens will be investigated one by one. Eiki demands that every resource be returned to those who should bear the responsibility.\n\n Eiki Shiki's influence §G+8§!."

KYO_eiki_influence_manpower_campaign:0 "Calling for witnesses to justice"
KYO_eiki_influence_manpower_campaign_tt:0 "Local mediators, recorders, and those willing to expose injustice were gathered. They may not be powerful, but they were willing to stand up and prove that right and wrong are not determined solely by the strong.\n\n Eiki Shiki's influence §G+10§!."

KYO_eiki_spend_influence_for_fulfillment:0 "Correct the All-People's Committee's Bias"
KYO_eiki_spend_influence_for_fulfillment_tt:0 "Eiki meticulously reviewed each of the committee's failed promises, forcing vested interests to relinquish their shares that were not yet theirs, and assigning responsibility to specific individuals.\n\n Consumes Eiki Shiki's §Y15§! Influence, increasing the People's Committee's fulfillment rate by §G+20§!."

KYO_eiki_spend_influence_for_national_buff:0 "Clear glass reflects the entire area"
KYO_eiki_spend_influence_for_national_buff_tt:0 "All excuses, merits, demerits, and concealments are laid bare before the same mirror. Eiki cannot guarantee every judgment will be satisfactory, but she will require everyone to accept the same standard of right and wrong.\n\n Available only when Eiki Shiki is hosting this season's People's Agenda and she is the chairperson of the People's Committee. Consumes §Y20§! People's Compliance Points to gain a powerful 60-day exclusive bonus."

KYO_quarterly_candidate_mandate_eiki:0 "This Season's Agenda for All: Eiki Shiki"
KYO_quarterly_candidate_mandate_eiki_desc:0 "This season, the All-People's Committee will focus on injustice, encroachment, and accountability. If Eiki chairs the committee, her judgments can truly bind every faction; without her, even the soundest ruling may remain a sermon no one enforces."

KYO_quarterly_candidate_mandate_success_idea:0 "Actual outcomes of this quarter's agenda"

KYO_quarterly_candidate_mandate_success_tt:0 "At the end of the quarter, if the person presiding over the quarter's agenda is still the chairperson of their respective committee, they can use the committee's authority to fully implement the proposals.\n\n Committee implementation rate §G+10§!, and receive a 45-day bonus."

KYO_quarterly_candidate_mandate_failure_tt:0 "At the end of the quarter, if the chairperson of the quarter's agenda fails to grasp the relevant committee, the proposals will be shelved amidst disputes, and no results will be achieved in the quarter.\n\n Hundred Youkai Accord will renegotiate and establish the agenda for the next quarter."

