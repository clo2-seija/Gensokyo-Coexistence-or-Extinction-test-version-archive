KYO_eiki_convert_sekibanki_influence_to_fulfillment:0 "Eiki: Bring grassroots testimonies into public discourse"

KYO_remilia_convert_yuyuko_influence_to_fulfillment_tt:0 "Remilia uses Hakugyokurou's authority in the passage between the dead and Netherworld to force the ghost transport team, which had previously kept its distance, to join the military operations led by Scarlet Devil Mansion.\n\n Yuyuko's Influence §R-10§!, Military Affairs Committee Compliance §G+10§!."

KYO_yuyuko_convert_suika_influence_to_fulfillment_tt:0 "Yuyuko used a banquet and old friendships to win over the oni around Suika. She didn't give any orders, only asking the guests to promise to do a few things for Hakugyokurou before leaving.\n\n Suika's influence §R-10§!, Military Affairs Committee compliance §G+10§!."

KYO_suika_convert_yuuka_influence_to_fulfillment_tt:0 "Suika brought the resources, roads, and settlements surrounding the Garden of the Sun into her network. Yuuka may not approve, but her influence has already been redistributed among the youkai.\n\n Yuuka's influence: §R-10§!; Military Affairs Committee fulfilment: §G+10§!."

KYO_yuuka_convert_remilia_influence_to_fulfillment_tt:0 "Yuuka forced Scarlet Devil Mansion to temporarily divert warehouses and transport routes. This wasn't negotiation, but rather a way to make Remilia understand that Yuuka's demands couldn't be ignored either.\n\n Remilia's influence §R-10§!, Military Affairs Committee's performance §G+10§!."

KYO_byakuren_convert_kanako_influence_to_fulfillment_tt:0 "Byakuren persuaded some of Moriya's followers to redirect their offerings, projects, and manpower to the rescue efforts. Kanako's divine virtue was thus reinterpreted by the Myouren Temple as a responsibility to care for all living beings.\n\n Kanako's influence §R-10§!, Faith Committee's performance §G+10§!."

KYO_kanako_convert_satori_influence_to_fulfillment_tt:0 "Kanako incorporates the fears, rumors, and local sentiments collected by the Palace of the Earth Spirits into the governance of Moriya Shrine, turning information originally belonging to Satori into a tool for the shrine to expand its influence.\n\n Satori's influence §R-10§!, Faith Committee's compliance §G+10§!."

KYO_satori_convert_megumu_influence_to_fulfillment_tt:0 "Satori identifies the true figures in the tengu newspaper network who influence public opinion, making it impossible for them to ignore the readers' suspicions. Megumu Iizunamaru still holds the newspaper, but can no longer completely decide what it should say.\n\n Megumu Iizunamaru's influence §R-10§!, Faith Committee's compliance §G+10§!."

KYO_megumu_convert_byakuren_influence_to_fulfillment_tt:0 "Megumu Iizunamaru repackages the rescue, explanations, and goodwill of the Myouren Temple as a collective achievement of the Hundred Youkai Accord. Byakuren continue to help the weak, but credit begins to appear in another narrative.\n\n Byakuren influence §R-10§!, Faith Committee compliance §G+10§!."

KYO_sekibanki_convert_eirin_influence_to_fulfillment_tt:0 "Sekibanki directs Eientei's meticulously planned rationing routes to shacks, alleyways, and settlements not officially recorded. Kagerou escort supplies, Wakasagihime confirms the distribution, while the dyed-hair Amanojaku secretly leaves behind another set of route maps.\n\n Eirin's influence §R-10§!, the People's Committee's implementation §G+10§!."

KYO_eirin_convert_raiko_influence_to_fulfillment_tt:0 "Eirin reorganized the tsukumogami, old workshops, and local strongholds linked by Raiko's drumming into medical and supply rotations. The originally freely growing mutual aid network gradually transformed into a precise and obedient system.\n\n Raiko's influence §R-10§!, the People's Committee's implementation §G+10§!."

KYO_raiko_convert_eiki_influence_to_fulfillment_tt:0 "Raiko transformed the Higan's records of the dead, missing persons clues, and local disputes into pathways for finding people, making connections, and providing mutual aid. The cold, hard records began to reconnect with the living amidst the drumbeats. (\n\n Eiki's Influence §R-10§!, People's Committee Compliance §G+10§!)"

KYO_eiki_convert_sekibanki_influence_to_fulfillment_tt:0 "Eiki incorporates the grassroots network established by Sekibanki into the public complaint and investigation process. Testimonies that were previously circulating in the alleyways gain official weight, but are thus exposed to the scrutiny of the system.\n\n Sekibanki's influence §R-10§!, the People's Committee's compliance §G+10§!."



    KYO_barrier_postwar_deterioration_cycle:0 "Post-war the Great Hakurei Barrier Patrol"
    KYO_barrier_postwar_deterioration_cycle_desc:0 "The war is over, but victory did not heal the wounds borne by the Great Hakurei Barrier. Fractured spiritual energy, misaligned boundaries, and the laws of the Outside World still seeping inward may yet destabilize any of its ten nodes.\n\n The postwar patrol system has extended the deterioration interval to once every §Y150 days§!. This has bought Gensokyo time, but not enough to carry it safely into the next age.\n\n Once §Y$KYO_gensokyo_rebuild_plan$§! is complete and all ten barrier nodes have been repaired, the Great Hakurei Barrier will gain a new foundation capable of sustaining it for the long term. This §YDecision§! system will then be permanently §Rdisabled§!."

 KYO_restored_great_barrier:0 "Rebuilding the Great Hakurei Barrier"
 KYO_restored_great_barrier_desc:0 "All ten barrier nodes have been restored. The cracks that once stretched along the mountains, forests, Netherworld, and people have now closed again; the chaos left by war has finally been contained by a complete boundary outside Gensokyo. A new Hakurei shrine maiden stands before the shrine, while Yukari Yakumo completes the final calibration at the other end of the boundary.\n\n This time, the Great Hakurei Barrier is no longer barely maintained by ancient agreements and individual power. Local nodes, guardians, and the rebuilt order together support it, giving the expanded Great Gensokyo, for the first time, a foundation capable of lasting for generations. Gensokyo once teetered on the brink of extinction, and even crossed its original boundaries in the flames of war. Now, it is no longer merely a refuge surviving from the oblivion of the Outside World, but a world that has proven itself worthy of continued existence.\n\n Gensokyo was once on the verge of disappearing, and it once crossed its original boundaries amidst the flames of war. Now, it is no longer just a refuge remaining from the oblivion of the Outside World, but a world that has proven itself worthy of continuing to exist."

KYO_tokyo_bridgehead_mission:0 "Gain a foothold in Tokyo"
KYO_tokyo_bridgehead_mission_desc:0 "Tokyo is the heart of Japan's political, railway, and military operations. If we can control Tokyo within §Y45 days§!, the initial breach will no longer be just a surprise attack, but will become a forward base for the Youkai army to penetrate deeper into Japan."

KYO_tokyo_opening_deadline_mission:0 "Victory in Tokyo in 45 Days"
KYO_tokyo_opening_deadline_mission_desc:0 "The enemy's initial shock will not last forever. The Japanese army is recovering from the chaos, and reinforcements are converging on the capital by rail.\n\n Our opening strategy grants only a temporary advantage. If Tokyo is not brought under our control within §Y45 days§!, the momentum of this surprise offensive will be lost."

KYO_tokyo_division_count_mission:0 "Integrate the Hundred Youkai into an Army"
KYO_tokyo_division_count_mission_desc:0 "Gensokyo has never lacked powerful youkai. What it lacks is an army able to advance and retreat as one. Oni, fairies, tengu, underground residents, and grassroots youkai must be organised into formations capable of sustained combat.\n\n Field at least §Y35 divisions§! within §Y150 days§!. Completing this mission will trigger the Tokyo Operation event and grant wartime bonuses."

KYO_tokyo_active_manpower_mission:0 "Awaken the Army of Gensokyo"
KYO_tokyo_active_manpower_mission_desc:0 "Tokyo will not fall because of the victory of a few strong individuals. Roads need to be guarded, supplies need to be transported, occupied territories need to be garrisoned, and the long battlefront needs countless people willing to step onto the front lines.\n\n Within §Y90 days§!, bring the active-duty army manpower to §Y250, 000§!."

KYO_tokyo_rifle_stockpile_mission:0 "Make every hand armed"
KYO_tokyo_rifle_stockpile_mission_desc:0 "Youkai power can tear through defenses, but it cannot hold the line for every soldier. Kappa workshops, spoil depots, and temporary arsenals must operate day and night until newly formed units are no longer waiting empty-handed.\n\n Within §Y75 days§!, increase infantry equipment inventory to §Y5, 000§!."

KYO_tokyo_honshu_corridor_mission:0 "Connect the strategic corridor of Honshu"
KYO_tokyo_honshu_corridor_mission_desc:0 "Taking Tokyo only opens the door. Only by advancing westward along the Tokaido, controlling Kansai, and cutting off the Chugoku region can Japan lose its ability to reorganize nationwide resistance.\n\n Within §Y120 days§!, control designated areas in Tokyo, Tokai, Kansai, and Chugoku, ensuring that the Youkai army's control line runs through the entire island."


 KYO_first_war.1.t:0 "Tokyo Campaign First General Order"
 KYO_first_war.1.d:0 "Tokyo is the heart of Japan. Capturing it will have a decisive impact on the entire war. The Military Affairs Committee must immediately decide how to strike the capital.\n\n Scarlet Devil Mansion advocates using the red mist to obscure the sky and seize the central stronghold before the enemy can assess the situation; the barrier maintainers demand that the supply corridors crossing the border be secured first to prevent the vanguard from being isolated in the Outside World; the other Youkai forces warn that this war cannot be ended by a few strong individuals alone, and Gensokyo must prepare for a long-term mobilization."
 KYO_first_war.1.a:0 "Let the red mist return to Tokyo first"
 KYO_first_war.1.b:0 "Tear Japan's nerves apart first"
 KYO_first_war.1.c:0 "Secure the civilians and the barrier passage first"


 KYO_first_war.2.t:0 "Japan's ultimatum" 
 KYO_first_war.2.d:0 "The Japanese government's ultimatum has been delivered.\n\n The Gensokyo army must immediately withdraw from Tokyo, hand over all Youkai involved in the attacks, occupation, and sabotage, and permanently close the entrance to the Outside World under the supervision of Japanese officials. If they refuse to comply, Japan will consider Gensokyo a hostile regime, use all its power to retake the capital, and completely eliminate the threat from beyond the barrier.\n\n The messenger placed the documents on the long table of Hundred Youkai Accord; the wording on the paper was polite yet cold. Scarlet Devil Mansion refused to hand over any of its retainers; Youkai Mountain warned that Japanese troops had begun to assemble along the railway; Myouren Temple demanded that the safety of civilians be prioritized; Eientei pointed out that even if Gensokyo retreated now, Japan would not tolerate Gensokyo's existence.\n\n The debate continued throughout the night. Some still believed the war could be stopped, while others understood that the moment Tokyo fell, the path of retreat had vanished.\n\n As the votes were recorded, a brief silence fell over the room. Gensokyo refused to retreat, refused to hand over its members, and refused to leave its fate to the Outside World.\n\n The ultimatum was returned untouched. From this moment on, Tokyo was no longer the end of a transgression, but the beginning of the first war between humans and youkai." 
 KYO_first_war.2.a:0 "Let Japan hear Gensokyo's answer." 
 

 KYO_first_war.3.t:0 "Light from Amaterasu"
 KYO_first_war.3.d:0 "Before dawn, a light fell from the sky.\n\n It was without thunder, without flames, and without the roar of aircraft flying through the clouds. The Japanese supply depot north of Tokyo was swallowed by the white light for a moment, then returned to darkness. When the reconnaissance team arrived, the warehouse, railway tracks, vehicles, and bunkers had been severed along the same straight line, the cuts as smooth as if they had never truly been connected.\n\n Residents of nearby villages knelt by the roadside, insisting that they had seen Amaterasu open her eyes. The surviving soldiers said that the light was not like sunlight, but like some kind of gaze from a very distant place—brief, indifferent, and not even regarding the people on the ground as hateful enemies.\n\n A monk accompanying the army claimed it was a divine warning of war; Christian rumors from the Outside World described it as God's judgment. Kappa technicians rejected any mythological explanation but couldn't explain what weapon could achieve such precise cutting without explosions, impacts, and high temperatures. Metal fragments recovered by Eientei further indicated that the damage wasn't caused by known surface technology.\n\n Only one record made all explanations more unsettling: before the light descended, observers saw several faint, parallel bright spots high in the sky. They didn't move with the stars or get obscured by clouds, as if something remained outside the sky, awaiting a predetermined moment.\n\n The Japanese called the attack Amaterasu's divine punishment. Those on the front lines began whispering about the moon, extraterrestrial objects, and a god who had never appeared.\n\n However, if God truly watches this war, on whose side is He?"
 KYO_first_war.3.a:0 "Sealed Fragments—Do Not Name That Light"



KYO_first_war.10.t:0 "Twenty-Eight Days Beyond the Barrier"
KYO_first_war.10.d:0 "The official declaration of war has not yet arrived, but the first batch of Youkai has already crossed the barrier.\n\n They have no flags, nor neat military uniforms. Tengu records Tokyo's air defense positions and military locations from high altitudes; Kappa infiltrates factories, stations, and docks, measuring every bridge and communication device that can be cut; Scarlet Devil Mansion's familiars hide in rooftops, water towers, and underground pipelines; the followers of Myouren Temple, under the guise of relief, pilgrimage, and visits, search for evacuation routes for those about to be swallowed by the war.\n\n More unseen hands are active deep within the city. Forged documents were sent to government offices, and erroneous dispatch schedules were mixed into military files. Japan dismissed these anomalies as theft, malfunctions, and inexplicable rumors, unaware that its railways, telephone lines, ports, and command systems were being dissected piece by piece.\n\n Gensokyo only §R28 days§!. Of the six advance plans, only §R3§! can be completed. The remaining unconquered roads will be seized by frontline troops in a more direct manner after the war begins.\n\n Twenty-eight days later, the infiltrators will simultaneously receive the final signal. Telephones will fall silent, military trains will stop at the wrong platforms, red mist will rise from within the city, and the Hundred Youkai Army, already assembled on the other side of the barrier, will step into the Outside World along the paths they left behind.\n\n Japan has yet to hear the sounds of war.\n\n But the war has already entered Tokyo."
KYO_first_war.10.a:0 "Twenty-eight days later, let the Hundred Youkai Army cross the barrier."




 KYO_advance_planning_deadline:0 "The Twenty-Eight Days of the Lurkers"
 KYO_advance_planning_deadline_desc:0 "The war has not yet formally begun, but the first wave of youkai has already crossed the barrier.\n\n They have changed into Outside World clothing and slipped into railway stations, docks, factories, and government offices. Tengu record patrol schedules; kappa survey the railways and telegraph network; fairies hide in warehouses and on rooftops; and shikigami leave markers in corners no one thinks to watch. Tokyo still believes it is dealing with nothing more than a handful of inexplicable disappearances, malfunctions, and rumours, unaware that every weakness in the city is being catalogued.\n\n The Hundred Youkai Accord has only §Y28 days§! to complete §Ythree advance preparations§!. When the deadline expires, every infiltrator must withdraw, go underground, or remain behind enemy lines to await the signal for war. Any unfinished preparations will have to be forced through by frontline troops after hostilities begin."


 KYO_plan_seize_government:0 "Reaching into the Tokyo Government Offices"
 KYO_plan_seize_government_desc:0 "The government offices do not need to be breached directly; only that the wrong people hold the seals and keys before orders are issued.\n\n The infiltrators will forge passes, switch duty rosters, and confirm the entrances to government offices, police headquarters, and military archives. When the red fog returns to Tokyo, the inside agent will block the stairwells and cut off telephone lines, opening the way to the central command for the infiltrating forces."


 KYO_plan_cut_communications:0 "Let Japan's nerves snap first"
 KYO_plan_cut_communications_desc:0 "Railways transmit troops, telegrams transmit orders, and radio maintains obedience amidst panic. As long as these three systems remain operational, Japan can recover from the initial shock. tengu and Kusaka Youkai will scout the exchange, signal stations, and military telephone lines; Kappa will prepare sabotage devices that can be disguised as ordinary malfunctions. At the start of the war, Tokyo will still be lit, but the answer from Outside World will no longer be heard."


 KYO_plan_open_barrier_corridor:0 "Embedding barrier coordinates behind enemy lines"
 KYO_plan_open_barrier_corridor_desc:0 "Crossing the breach is not difficult; the real problem is ensuring the stable movement of large numbers of troops, supplies, and wounded. shikigami will embed coordinates in sparsely populated shrines, abandoned tunnels, and underground facilities, allowing previously short and dangerous passages to be rapidly deployed after the start of the war. These markings, normally inconspicuous talismans, stones, and knots, will, when the order is given, connect Gensokyo's roads directly to the enemy's rear."


 KYO_plan_control_port_rail:0 "Infiltrating the Port Railway Dispatch Center"
 KYO_plan_control_port_rail_desc:0 "The Tokyo army can lose a few warehouses, but it cannot lose the port and the railway. As long as trains can still transport troops and ships can still unload supplies, the capital will not be truly isolated.\n\n Advance personnel will infiltrate stations, locomotive depots, and dockworkers' teams, noting the locations of switches, signal rooms, fuel depots, and dispatch lists. On the day of the war, they will not need to destroy the entire railway; they will only need to direct a few trains to the wrong platforms and keep a few key signals permanently red."


 KYO_plan_evacuate_civilians:0 "Opening Roads for the Evacuation of Civilians"
 KYO_plan_evacuate_civilians_desc:0 "The civilians of Tokyo will not know when the red fog will descend, nor will they know which street will soon become a battlefield. If the Japanese military is allowed to organize the evacuation, they can use the crowds to block roads and even leave residents between positions. Followers of the\n\n Myouren Temple, the Youkai rabbit, and collaborators familiar with Tokyo will secretly mark shelters, medical points, and routes out of the city, and prepare convincing evacuation notices. When the battle begins, the truly safe routes will spread among the crowds before government orders."


 KYO_plan_great_red_mist:0 "Hidden Red Mist in Tokyo's Night"
 KYO_plan_great_red_mist_desc:0 "If the red mist sweeps in from afar, Japan will still have time to sound the alarm; if it rises simultaneously from within the city, the military will be unable to determine the source of the attack.\n\n Scarlet Devil Mansion's familiars will infiltrate rooftops, water towers, underground pipes, and areas near military camps, pre-positioning magical nodes capable of spreading the mist. As the final signal is given, Tokyo's streetlights, searchlights, and scopes will simultaneously become useless, while Scarlet Devil Mansion's forces will already know where to advance through the fog."

  KYO_incomplete_advance_plan:0 "Incomplete Deployment Behind Enemy Lines"
 KYO_incomplete_advance_plan_desc:0 "Some infiltrators failed to reach their designated positions in time, and communication lines that had not yet been established were severed with the outbreak of war. Frontline troops were forced to complete tasks that should have been handled by advance personnel amidst unfamiliar streets, flawed intelligence, and enemy vigilance."

KYO_seize_tokyo_arsenal:"Weapons Acquired from Enemy Depots"




 KYO_first_war.20.t:0 "First General Order for the Tokyo Campaign"
 KYO_first_war.20.d:0 "The war against Japan is irreversible. The army on the other side of the barrier is assembling, and Japan's railways, telegraphs, and government offices are recovering from the initial shock. Tokyo is not just a city; it is the heart of the entire Japanese military and political system. If the capital can continue to issue orders, all the advantages we have gained on the border could be regained.\n\n Scarlet Devil Mansion advocates using the red mist to obscure the sky and seize the central stronghold before the enemy can assess the situation; the barrier maintainers demand that the supply corridors crossing the border be secured first to prevent the vanguard from being isolated in the Outside World; the other Youkai forces warn that this war cannot be ended by a few strong individuals alone, and Gensokyo must prepare for a long-term mobilization.\n\n Regardless of the strategy adopted, the initial chaos will not last forever. If we fail to capture Tokyo within the deadline, we will lose this opportunity for a preemptive strike."
 KYO_first_war.20.a:0 "Piercing Tokyo with Red Mist and Speed"
 KYO_first_war.20.b:0 "First Secure the Cross-Border Supply Corridor"
 KYO_first_war.20.c:0 "Summon a Hundred Youkai, Prepare for a Protracted War"


 KYO_first_war.21.t:0 "Tokyo is Now in the Hands of the Youkai Army"
 KYO_first_war.21.d:0 "Red mist sweeps over the Imperial Palace and government offices; unfamiliar youkai energy spreads along streets, stations, and telegraph lines. Tokyo's administrative center has ceased operation, and major railway hubs and military supply depots have fallen into our hands.\n\n However, capturing the capital does not mean the battle is over. The scattered Japanese troops are still regrouping in the suburbs, and some headquarters are attempting to evacuate with files and communication equipment; millions of civilians are trapped in power outages, fires, and chaos. The Military Affairs Committee must immediately decide whether Tokyo should become a bridgehead for westward advance, a hunting ground for pursuing the enemy, or a city where order must first be restored."
 KYO_first_war.21.a:0 "Control ports, stations, and supply depots"
 KYO_first_war.21.b:0 "Prevent any Japanese command post from escaping"
 KYO_first_war.21.c:0 "Establish evacuation zones and temporary control zones"


 KYO_first_war.22.t:0 "The battle order of the Hundred Youkai Army"
 KYO_first_war.22.d:0 "The initially independent Youkai groups have now expanded into an army capable of sustaining the entire front. The Tengu control the skies and reconnaissance, the Kappa maintain weapons and transport, the Oni serve as the main force for breakthroughs, and the fairies, beast youkai, and underground inhabitants fill the ever-expanding defensive lines.\n\n The problem is that this army still retains the original Gensokyo character. Scarlet Devil Mansion is unwilling to accept outside interference in its forces, the Tengu obey the mountain hierarchy, the Oni value leadership and camaraderie, and the grassroots Youkai are more accustomed to relying on acquaintances and local connections. Establishing a unified command allows for swift implementation of orders, but may arouse suspicion from various factions regarding central control; retaining factional columns maintains flexibility and autonomy, but may also turn the entire front into a battlefield where everyone fights their own battles."
 KYO_first_war.22.a:0 "All troops are incorporated into a unified combat order."
 KYO_first_war.22.b:0 "Let each faction find its own breakthrough."


 KYO_first_war.23.t:0 "Two hundred and fifty thousand men have taken to the front lines."
 KYO_first_war.23.d:0 "From Youkai Mountain to Former Hell, from the margins of humanity to the Bamboo Forest of the Lost, conscripted and voluntary troops have spread across the roads. Some have truly taken up arms, some have built fortifications, transported supplies, and cared for the wounded, while others have simply been pushed to the front lines because their homes have nowhere else to retreat.\n\n The People's Committee demanded that this force be deployed to the battlefield all at once, overwhelming the Japanese defenses with sheer numbers; Eientei, however, warned that an army without rotation, medical care, and wounded replenishment would only be worn down by disease and exhaustion within months. This wasn't just a question of how to use 350, 000 soldiers, but whether Gensokyo intended to treat its citizens as a disposable force or a sustainable army."
 KYO_first_war.23.a:0 "Mobilizing the entire population"
 KYO_first_war.23.b:0 "Establishing an Eientei rotation and reserve system"


 KYO_first_war.24.t:0 "Five thousand rifles"
 KYO_first_war.24.d:0 "Weapons captured from kappa workshops, Tokyo munitions depot, and the front lines finally brought the infantry equipment inventory past its initial shortfall. Thousands of rifles were neatly arranged in the warehouse, but their calibers, parts, and maintenance methods varied; some came from the regular Japanese army, while others were hastily copied in kappa workshops.\n\n Kappa technicians demanded standardized specifications to prevent production lines and ammunition supplies from being hampered by a jumble of models; grassroots Youkai pointed out that there were still many abandoned, damaged, or hidden weapons on the battlefield, and that as long as a reliable recycling and repair network was established, it would not be necessary to entrust every piece of equipment to large workshops for production."
 KYO_first_war.24.a:0 "Standardized ordnance specifications to be established by Kappa"
 KYO_first_war.24.b:0 "Let the grassroots network recycle every usable weapon"


 KYO_first_war.25.t:0 "Youkai's army traverses Honshu"
 KYO_first_war.25.d:0 "The line of control starting from Tokyo has crossed the Tokai and Kansai regions and extended into the Chugoku region. The most important railways, roads, and urban corridors between eastern and western Japan have now been cut and reconnected by Youkai's army. The Japanese army is still resisting in various places, but it is no longer easy to mobilize national forces from the central area of Honshu.\n\n The next problem is no longer just how to advance, but how to maintain this long line of control. The military prioritized the repair of railways, bridges, and stations to facilitate the rapid movement of troops and supplies across the state; representatives from various factions advocated for the establishment of formal occupation agencies to take control of local government offices, security, and food distribution. The former allowed the war to continue, while the latter determined how we would govern the land now in our hands."
 KYO_first_war.25.a:0 "Let military trains traverse the entire state"
 KYO_first_war.25.b:0 "Establish occupation agencies in various locations"


  KYO_barrier_crisis.1.t:0 "Fissures Invisible to the Naked Eye"
 KYO_barrier_crisis.1.d:0 "On the eighteenth day after the shrine maiden's death, the anomaly at Hakurei Shrine ceased to be confined to a single coordinate.\n\n Ran sounded the first warning. Rearranging measurements returned from across Gensokyo, she found the same minute displacement at Youkai Mountain, the Bamboo Forest of the Lost, the Forest of Magic, and the outskirts of the Human Village. Each set of readings remained within tolerance when viewed alone. Superimposed, however, they revealed ten paths drifting slowly in different directions.\n\n Yukari inspected three sites herself. No fissure was visible to the eye, and no opening could be felt by hand; yet when she tried to distinguish inside from outside, near from far, and front from back, those normally certain boundaries went blank for an instant.\n\n When Okina emerged through a back door, she found it half a pace from its intended position. The animals Kasen released refused to return after crossing the treeline, as though they no longer recognized the way they had come.\n\n The three sages used different methods and reached the same conclusion.\n\n The Great Hakurei Barrier had not cracked.\n\n The land it divided was slowly forgetting which side it belonged to.\n\n On the morning of the twenty-first day, Ran listed all ten anomalous coordinates separately. The sheet later became the first record of the barrier nodes. At the time, it looked more like an unfinished map of where deaths would occur."
 KYO_barrier_crisis.1.a:0 "Place all ten coordinates under maximum surveillance."


KYO_barrier_crisis.2.t:0 "Beyond the Fissure, Oblivion Began"
KYO_barrier_crisis.2.d:0 "The first fissure claimed no lives when it appeared.\n\n It merely caused some youkai to cease being remembered.\n\n At first there were only small omissions. Neighbours of many years forgot one another's names. Merchants could no longer remember to whom they had extended credit. A patrol member would finish speaking with a companion, turn away, and forget whether that person had ever belonged to the group.\n\n Within days, the symptoms spread. Some returned home to families who treated them as strangers. Others had worked in the same workshop for decades, yet found no trace of their names on the duty rosters. Still others stood in the middle of crowds and cried out, plainly audible, while every gaze slid past them.\n\n They had not vanished.\n\n They still felt the cold. They still needed food. They remembered whom they had loved and hated, and the riverbanks where they had grown up. The world had simply begun refusing to acknowledge that any of those connections had ever existed.\n\n As their numbers grew, the forgotten carved their names into doors, covered walls with their histories, and repeatedly confirmed one another's existence. Some tied themselves to companions with rope, afraid that the next time they let go, the person beside them would become someone they had never known.\n\n The Great Hakurei Barrier gave no warning.\n\n There were no deaths, no bodies, and nothing that could formally be entered on a casualty list.\n\n Yet Gensokyo was losing people who were still alive."
KYO_barrier_crisis.2.a:0 "They are alive, yet Gensokyo is forgetting them."


 KYO_barrier_crisis.3.t:0 "There was no wind behind the crack"
 KYO_barrier_crisis.3.d:0 "Yukari found the first directly observable anomaly on the north side of Youkai Mountain.\n\n It wasn't a crack. There was no broken light, nor any spiritual energy leaking from it. It was just an excessively straight blank space, as thin as if someone had drawn a line across the landscape with the tip of a knife.\n\n Yukari extended the tip of her fan into the blank space.\n\n The tip of her fan didn't pass through, nor was it blocked. It simply lost a small section at the moment of contact, as if that part had never belonged to the fan.\n\n There was no wind behind the crack, no smell of the Outside World, and no spiritual energy returning from the other side. The measuring runes set up by Ran also received no response, because there was no measurable “other place” there.\n\n'It's not natural collapse. ' “Natural cracks still leave their marks on both sides,” Ran said.\n\n “There aren’t any here.”\n\n Yukari stared at the blank space, remaining silent for a long time. the Great Hakurei Barrier’s function was to determine where Gensokyo belonged and where the Outside World belonged.\n\n But the anomaly before them didn’t cross that boundary, nor did it attempt to tear it apart.\n\n It simply erased the original relationship between “here” and “there.” If this phenomenon continued to expand, Gensokyo wouldn’t collapse like a city.\n\n It would lose its connection to the world until it could no longer prove its existence."
 KYO_barrier_crisis.3.a:0 "This isn't a crack, it's being deleted from the world."


 KYO_barrier_crisis.4.t:0 "Yukari returned before dawn."
 KYO_barrier_crisis.4.d:0 "Before dawn, Chen heard extremely light footsteps in the courtyard.\n\n When Yukari emerged from the gap, her sleeves were stained with mud, water, and dried blood. A corner of her fan was missing, and several small, unhealed wounds marred her right fingertips. The wounds weren't deep, yet even her youkai powers seemed unable to define their boundaries. “Lady Yukari, you're bleeding.” Chen immediately went to greet her.\n\n “It's not my blood,” Yukari replied.\n\n She didn't explain whose blood it was, nor did she stop.\n\n Inside the room, Ran remained seated at the table piled high with abacus papers.\n\n Ten nodes, forty-two measurements, seven sources of error, and three sets of boundary models were arranged almost cruelly. Each sheet of paper pointed to a different outcome, yet they all overlapped at the worst possible point.\n\n “The next most likely location is in the Human Village or the Bamboo Forest of the Lost,” Ran said. “The error is one-twelfth. The timeframe is between thirty-six and forty-eight hours. If Youkai Mountain shifts again, the entire calculation is invalid.”\n\n Yukari glanced at it. “Recalculate.”\n\n “This is the ninth time.”\n\n “Then let's call it the tenth.”\n\n When Chen brought the hot water, Yukari was already standing in front of the gap again.\n\n She neither tended to her wounds nor sat down.\n\n Before dawn, she still had to complete the remaining steps.\n\n And Ran had to calculate where it would begin before forgetting itself on the next piece of land."
 KYO_barrier_crisis.4.a:0 "They have no time to rest"


 KYO_barrier_crisis.5.t:0 "The Three Sages' Shared Failure"
 KYO_barrier_crisis.5.d:0 "When the three sages met at Hakurei Shrine, six of the ten barrier nodes had already shifted.\n\n Yukari advocated severing the anomalous area from the surrounding boundary, temporarily sealing the collapse within a limited area. However, this meant that several settlements might be isolated together, and the transferred pressure would reappear elsewhere.\n\n Okina proposed replacing the damaged passages with back doors to re-establish connections between different locations. However, the ten nodes were interconnected, and each additional replacement door would create another entrance that could not be fully controlled. She could open a path, but she could not guarantee that the path would ultimately lead to the original location.\n\n Kasen requested that each node be re-fixed using ley lines, residents, and local guardians. This was the safest method, but it required a large number of people to be stationed there long-term. The three sages and their Servants alone could not even complete the first round of patrols.\n\n The debate lasted for several hours.\n\n No one convinced the other two, and no single solution could save all ten nodes on its own.\n\n Finally, Yukari pushed the ten records to the center of the table.\n\n “We don't have time to argue about who's right,” she said.\n\n Okina didn't refute this. Kasen simply watched the ever-increasing discrepancies.\n\n Repairing the barrier required an army to guard the danger zone, temples and shrines to calm the panic, kappa to repair equipment, tengu to relay messages, and countless small villages living near the nodes, the first to suffer the collapse, to provide roads and manpower.\n\n This was no longer an incident that the sage could handle from behind the scenes.\n\n If Gensokyo is to continue to exist, it must get all the people who originally distrusted each other to work together."
 KYO_barrier_crisis.5.a:0 "Summoning a Hundred Youkai—This time, no one can remain uninvolved."


 KYO_barrier_crisis.6.t:0 "Excessively White Gray"
 KYO_barrier_crisis.6.d:0 "Ash appeared near the gap in the barrier.\n\n It covered the grass, stone steps, and fallen trees, its whiteness almost blinding. There was no fire, and nothing had been burned; the ash felt cold and dry to the touch, yet it wouldn't be carried away by the wind or stick to one's fingers.\n\n Even stranger, there was no youkai aura, resentment, or the lingering scent of death. Usually, even the weakest youkai would leave a brief trace nearby after its disappearance. But there was nothing around this white ash, as if everything that had ever existed there had been disposed of too thoroughly. Upon Eirin's arrival, she took only a small sample.\n\n She placed the ash into several medicinal liquids and then shone moonlight through the container.\n\n The white particles that had settled at the bottom suddenly arranged themselves into extremely fine concentric circles, before dispersing on their own before everyone's eyes.\n\n Eirin's hand paused for a moment. “Have you seen it before?”\n\n Yukari asked. “I've seen similar results,” she said. “Where?” Eirin didn't answer. She simply sealed the container, demanding that everyone who had come into contact with the lime undergo immediate examination and forbidding anyone from taking the sample out of Eientei.\n\n Ran wrote in the record: Unknown substance, non-combustion product, no known Gensokyo technique residue.\n\n Yukari added a sentence next to that line.\n\n Eirin knew what it was.\n\n She simply refused to give that answer."
 KYO_barrier_crisis.6.a:0 "Sealed away the white ash, and recorded Eirin's silence."


 KYO_barrier_crisis.7.t:0 "The Great Hakurei Barrier readings are normal."
 KYO_barrier_crisis.7.d:0 "Ten nodes are shifting, Youkai is beginning to lose its name, and the gap is erasing the relationships between spaces.\n\n However, the central measurement of the Great Hakurei Barrier remains normal.\n\n The total spiritual energy has not decreased, the internal and external pressures remain balanced, and all warning spells have not been activated. According to the numbers, Gensokyo has never been so stable.\n\n Ran recalibrated the magical artifacts, changed the reference coordinates, and even cross-verified them using measurement methods from different eras.\n\n The results did not change.\n\n If not everyone had witnessed the disappearing things firsthand, this report would be enough to prove that the crisis didn't exist.\n\n After reviewing the data, Yukari simply flipped the report to the blank back.\n\n'From now on, even normalcy must be recorded. '\n\n Because when reality contradicts measurement, the most dangerous thing might not be that the measurement is wrong.\n\n It's that the Great Hakurei Barrier no longer considers the current collapse as abnormal."
 KYO_barrier_crisis.7.a:0 "Normal is the most abnormal result"


 KYO_barrier_crisis.8.t:0 "Deviations in measurement"
 KYO_barrier_crisis.8.d:0 "After the third round of global measurement, Ran locked all the results into the same coordinate graph.\n\n Deviations reappeared.\n\n It wasn't large enough to be considered an anomaly on its own; but between each measurement, those nodes would shift a very short distance in the same direction. The ritual implements didn't move, the ley lines didn't change, and the people responsible for recording were isolated from each other.\n\n What truly changed the position wasn't the measurement point.\n\n It was the place represented by the measurement point.\n\n Before the Hakurei Shrine, the coordinates of the shrine maiden's death were still the starting point of all the shifts. From there outwards, ten nodes seemed to be slowly dragged away from their original positions by some unseen force.\n\n Ran wrote the conclusion on the last page: the Great Hakurei Barrier has not yet failed, but the world it protects is deviating from the Great Hakurei Barrier.\n\n This time, no one considered the difference after the decimal point as error."
 KYO_barrier_crisis.8.a:0 "Record every deviation"


  KYO_hyakki_council.1.t:0 "The first meeting of the Hundred Youkai Accord"
 KYO_hyakki_council.1.d:0 "The makeshift meeting place of the Hakurei Shrine had never held so many people who hated each other.\n\n Scarlet Devil Mansion brought its guards and rules; Hakugyokurou's messenger sat quietly at the other end; Youkai Mountain refused to hand over complete information; Myouren Temple and Moriya Shrine couldn't even reach a consensus on the scope of the rescue. The underground inhabitants didn't believe the promises made above ground, and the grassroots Youkai didn't believe that any big shot would remember them afterward.\n\n Yukari Yakumo didn't ask them to reconcile.\n\n She simply laid out ten continuously shifting boundary nodes on the table and then divided everyone into three mutually restraining structures.\n\n The Military Affairs Committee was responsible for the front lines, defense, and joint operations; the Faith Committee was responsible for relief, resettlement, communication, and popular support; the People's Committee was responsible for food, labor, local roads, and those needs that could never be addressed in formal meetings. Each party could vie for the chairmanship, reject others' proposals, and negotiate every order, but could not withdraw from the overall structure.\n\n As for conflicts that the three committees could not resolve, they were all left to Yukari's judgment.\n\n “You don't have to trust each other.” Yukari's voice was not loud, but the room fell silent. “Just learn to work together before Gensokyo disappears.”\n\n No one applauded this statement.\n\n But no one got up to leave either.\n\n The Hundred Youkai Accord was thus established. It wasn't an agreement between allies, but a lock personally fastened by Yukari Yakumo."
 KYO_hyakki_council.1.a:0 "Sit down first—other grudges can wait until we survive this crisis."


KYO_hyakki_council.2.t:0 "Divine Spirit Mausoleum refuses to draw its sword against its homeland."
KYO_hyakki_council.2.d:0 "Toyosatomimi no Miko refuses to sign the Hundred Youkai Accord.\n\n For her, Japan wasn't a foreign country, but the homeland she had governed and reformed. Even if present-day Japan had deviated from her ideals, she couldn't draw her sword against it.\n\n'I can criticize present-day Japan, but I cannot attack the land I once governed because of disappointment. '\n\n Divine Spirit Mausoleum therefore refused to send troops and also refused to accept military orders from the Hundred Youkai Accord. However, the temple gates will remain open, sheltering civilians fleeing the war and providing refuge for those unwilling to fight.\n\n The goddess will not support the Japanese government, nor will she conquer her homeland for Hundred Youkai Accord."
KYO_hyakki_council.2.a:0 "She will not sign, nor draw her sword against her homeland."


KYO_hyakki_council.10.t:0 "The joint military order is losing its binding force."
KYO_hyakki_council.10.d:0 "The operational orders issued by the Military Affairs Committee are gradually losing their binding force.\n\n Each army corps will still send representatives to meetings and mark predetermined locations on maps; however, when the orders are actually sent to the camps, the troops often cite insufficient manpower, supply delays, unclear roads, or changes in the frontline situation as reasons to modify their assembly times and marching routes.\n\n No one has publicly refused to fight together.\n\n However, troops that were supposed to arrive simultaneously were often several hours apart, and forces scheduled to relieve the lines frequently changed direction at the last minute. Reconnaissance intelligence couldn't be converted into an offensive in time, and supplies delivered to positions couldn't reach the defenders, forcing frontline commanders to rely on their own manpower for makeshift solutions.\n\n The Military Affairs Committee still existed, but it could no longer ensure that decisions made at the table were fully implemented on the battlefield.\n\n§RThe Military Affairs Committee's compliance rate had fallen to a dangerous level, limiting cross-corps support.§!"
KYO_hyakki_council.10.a:0 "Orders were still being transmitted, but obedience was halted halfway."

KYO_hyakki_council.11.t:0 "The relief system began to stagnate."
KYO_hyakki_council.11.d:0 "The medical care, resettlement, and relief promised by the Faith Committee were being gradually eroded by delays and excuses.\n\n The shelters are waiting for food, the supply trucks are waiting for road confirmation, the medical teams are waiting for the number of wounded, and those responsible for relaying messages are waiting for new instructions. Each link has a reasonable explanation, and each report explains why no action has been taken.\n\n No one has explicitly refused to provide aid.\n\n Yet the wounded remain in makeshift shelters, residents who have left the danger zone cannot find shelter, and prepared supplies are sitting unclaimed in warehouses.\n\n When each unit is only willing to fulfill its narrowest responsibility, the entire aid system ceases to function properly. Hundred Youkai Accord can still announce new arrangements, but it is increasingly difficult to guarantee that those arrangements will reach those in need.\n\n§RThe Faith Committee's compliance has fallen to a dangerous level, impacting medical care, supplies, and resident resettlement.§!"
KYO_hyakki_council.11.a:0 "The promise hasn't disappeared, it just can no longer arrive on time."

KYO_hyakki_council.12.t:0 "Local communication is being severed."
KYO_hyakki_council.12.d:0 "What the People's Committee lost first wasn't the official roads, but the small paths maintained by acquaintances, codes, and local trust.\n\n Local liaisons who were originally willing to relay messages, transport supplies, and guide the teams began to respond less. Some stopped attending appointments, some erased roadside markings, and some were only willing to help settlements they knew, no longer willing to take risks for the distant legions.\n\n They did not openly rebel against the Hundred Youkai Accord.\n\n It's just that too many demands were shelved, too many casualties went unreported, and too many supplies were redistributed before reaching their destinations. When the lower-class residents are repeatedly asked to contribute, yet see the Committee fulfilling its promises, trust breaks down before the roads even begin.\n\n The ration sheets are still neat, and the contact map is still drawn with complete lines. However, some of these lines no longer lead to anyone willing to respond.\n\n§RThe implementation rate of the People's Committee has fallen to a dangerous level, and local liaison and grassroots support will gradually come to a standstill.§!"
KYO_hyakki_council.12.a:0 "The road is still there, but those willing to lead the way are leaving."


KYO_hyakki_council.20.t:0 "One Hundred Days After the Hundred Youkai Accord"
KYO_hyakki_council.20.d:0 "One hundred days have passed since the establishment of the Hundred Youkai Accord.\n\n One hundred days ago, almost no one believed that this structure could be maintained. Scarlet Devil Mansion did not trust Myouren Temple, Youkai Mountain was unwilling to hand over complete intelligence, the underground was wary of promises made above ground, and the grassroots Youkai were already tired of taking risks for those renowned forces.\n\n But a hundred days have passed. The three committees are still operating, the army is still assembling according to the common schedule, supplies are still flowing along the roads established by the agreement, and representatives from various regions are still returning to their positions after arguments. They haven't forgotten old grudges, nor have they suddenly become friends; they've simply temporarily set aside their prejudices and prioritized war preparations.\n\n This is not an achievement to be taken for granted. For Gensokyo, which has long relied on isolation, suspicion, and independent governance to maintain order, to have so many distrustful Youkai preparing for the same war together is almost a miracle in itself.\n\n The Hundred Youkai Accord has not gone bankrupt. It remains fragile, still noisy, and still capable of cracking again after any defeat. But at least by the hundredth day, everyone was still moving in the same direction.\n\n This was something Gensokyo should celebrate."
KYO_hyakki_council.20.a:0 "The hundred days haven't ended, it's already a great cause for celebration."


 KYO_hyakki_council.19.t:0 "Those at the table"
 KYO_hyakki_council.19.d:0 "Yukari Yakumo's invitations arrived in Gensokyo in various ways.\n\n Some letters slipped under the door, some landed on the heavily guarded meeting table, and some even crossed the gap and stopped beside the recipient's teacup. The letters were short: the Great Hakurei Barrier is deteriorating, and Gensokyo can no longer be maintained by a few wise men alone. Anyone who still hopes this land will exist should come.\n\n And so, the most difficult group of people in Gensokyo sat together. Vampires and monks faced each other across the table, God scrutinized Youkai underground, Tengu recorded every potentially newsworthy argument, while the ordinary Youkai stood at the edge of the room, wondering if this was yet another meeting where powerful figures would decide everything.\n\n Yukari Yakumo lightly tapped the ground with the tip of her umbrella. The instant the sound faded, dozens of gaps simultaneously opened around the venue. The spires of Scarlet Devil Mansion, the pillars of Youkai Mountain, the cherry trees of Netherworld, and the houses of Human Village appeared on the other side of the dark gap; each scene was covered with spreading cracks in the barrier. The previous commotion ceased abruptly. “You can hate each other, fight for power, and even prepare for another betrayal under this table.” Yukari surveyed the crowd, her tone chillingly calm. “But from this moment on, whoever hinders Gensokyo's survival, I will make disappear first.”\n The eyes in her gap slowly opened, gazing at every face at the table.\n “This is not a request, nor a negotiation. I gathered you all here simply because you still have value. Prove my judgment was correct.”\n Remilia chuckled softly, her fingertips lingering on the rim of her glass. Kanako pressed for the final decision-maker. Eiki demanded that all mobilization be subject to restraint. Sekibanki bluntly questioned why those in power only remembered those who had been trampled underfoot when disaster loomed.\n Yukari neither stopped them nor answered.\n She simply closed her gap, returned to her seat at the head of the table, as if all opposition had already been factored in.\n No one was prepared to obey every order from Yukari Yakumo.\n But until the meeting began, no one dared to rise and leave."
 KYO_hyakki_council.19.a:0 "At least, they were willing to stay in the same room."


  KYO_hyakki_council.21.t:0 "Hundred Youkai Accord"

  KYO_hyakki_council.21.d:0 "Less than an hour after the meeting began, a line of people seeking aid had already formed outside the doors.\n\nYoukai Mountain reported that three roads near the barrier had shifted from their original locations overnight, while two patrols had yet to return. Myouren Temple brought news from the Human Village: some claimed that the incident was divine punishment, and followers of the temple and Moriya Shrine were already quarreling over it. The last to enter the hall was a small youkai clutching an empty rice sack. She knew neither whom to ask for help nor who had ordered the grain removed from the storehouse.\n\nThe problem was not that no one was taking action. It was that everyone saw only the crisis directly before them. The Scarlet Devil Mansion had requisitioned equipment the kappa had prepared to repair the barrier. Medicine compounded at Eientei sat undelivered in the Bamboo Forest. When the tengu closed the roads, no one warned the nearby settlements. Every faction was trying to save Gensokyo, yet their efforts only plunged one another into deeper disorder.\n\nYukari instructed Ran to divide the reports on the table into three stacks.\n\nThe Military Affairs Committee would oversee patrols, armed forces, and preparations for the battles ahead. The Faith Committee would handle religious disputes, rumors, and public information. The People's Committee would take charge of food, medicine, shelters, and the allocation of labor. Every faction would be required to declare the personnel and supplies it could provide. Each committee would elect its own chair, and every transfer would be entered into a shared ledger. If the three committees failed to reach an agreement, the matter would be submitted to Yukari for arbitration.\n\nRemilia was the first to demand that military affairs take priority. Byakuren reminded her that holding the roads meant nothing if those living beside them had nothing left to eat. Sekibanki rapped her knuckles against the table and demanded that the ledger be posted regularly in the Human Village, so everyone could see where the supplies had gone—and who was always made to wait until last.\n\nYukari made no attempt to silence the argument.\n\n“I do not ask you to trust one another.” She waited until everyone had finished before pushing the accord into the center of the long table. “I ask only that every task have someone answerable for it. If you cannot do that, yield your seat to someone who can.”\n\nSignatures gradually appeared across the page. Some were written without hesitation, others reluctantly, and a few pressed hard enough to nearly tear through the paper. Whatever their misgivings, from that day onward, Gensokyo's patrols, food, medicine, and information finally had a common system of coordination.\n\nThe Hundred Youkai Accord formally entered into effect."

  KYO_hyakki_council.21.a:0 "The committees shall begin their work immediately."


 KYO_hyakki_council.22.t:0 "Military Affairs Committee"
 KYO_hyakki_council.22.d:0 "Before the first meeting of the Military Affairs Committee even began, the sound of hurried wings came from outside.\n\n A tengu scout fell in the middle of the courtyard. She brought back half a blood-stained flag and news worse than her injury: two local armed groups were retreating towards the mountain pass at the same time, neither willing to give way. Before the enemy could catch up, they had already drawn their swords against each other.\n\n§TRemilia Scarlet§! picked up the flag, glanced at it, and threw it on the table.\n\n “There are no two armies,” she said. “From today onwards, there can only be one order.”\n\n She demanded that all armed groups obey unified command, replacing individual fighting with clear ranks, organization, and punishments. Those who refused to accept this were no different from deserters in her eyes.\n\n§TSuika Ibuki§! laughed after hearing this. She grabbed her wine cup and asked Remilia exactly how many overseers she planned to send to force a bunch of strangers to take bullets for each other. Suika wanted to go to the mountain pass herself and call the leaders of both sides together; if a drink wasn't enough to get them to tell the truth, she would use her fists.\n\n§TYuyuko Saigyouji§! didn't participate in the argument between the two. She looked at the bloodstains on the flag that hadn't yet dried and quietly asked how many bodies had been left behind during the retreat. The living fought for the road, and the dead piled up more and more on the battlefield; if the entrance to Netherworld got out of control, it wouldn't just be the enemy army returning to the mountain pass next time.\n\n§TYuuka Kazami§! spoke last. She plucked a crushed petal from the banner, her smile almost terrifyingly gentle.\n\n “You can slowly discuss who will lead the way.” She placed the petal back on the table. “I'll go bury the pursuers first.”\n\n The four immediately fell into argument. Remilia wanted obedience, Suika wanted voluntary following; Yuyuko calculated how war would cross the boundary between life and death, while Yuuka intended to end the problem with overwhelming power.\n\n Yukari hadn't brought them together expecting the four wills to compromise. She wanted to direct Gensokyo's four most dangerous forces toward the same enemy—at least until they decided to attack each other first.\n\n In the courtyard, the wounded Tengu still awaits answers.\n\n And the first order has yet to be signed."
 KYO_hyakki_council.22.a:0 "Whoever can get them forward has the right to give the order."


 KYO_hyakki_council.23.t:0 "The Faith Committee"
 KYO_hyakki_council.23.d:0 "No one knows where that piece of paper originally came from.\n\n Before dawn, it had been pasted on the well, the doorposts, and the outer wall of the temple. The paper claimed that the barrier was about to completely break and accused Youkai of secretly selecting humans to be sacrificed. By noon, another version of events began to circulate: all of this was a calamity created by God to seize faith.\n\n Fear doesn't need evidence. It only needs to arrive one step ahead of clarification.\n\n§TByakuren Hijiri§! She tore off one of the sheets, not to throw it into the fire, but to bring it into the crowd. She refused to cover it up with another, more palatable lie, only acknowledging that the barrier was indeed deteriorating and that the agreement had not yet found all the answers.\n\n “If we dare not even face our fears, how can we expect others to believe us?”\n\n§TKanako Yasaka§! She did not oppose honesty, but refused to simply rely on consolation and wait for the panic to subside on its own. She ordered the sacred pillars to be raised as markers of the safe zone, allowing the followers of Moriya to guide the wounded, distribute water, and transform endless prayers into visible actions. For her, a faith that could not protect anyone would soon become nothing more than empty words.\n\n Standing at the edge of the crowd, §TSatori Komeiji§! heard a cacophony more chaotic than the rumors themselves. Some were afraid of Youkai, some were afraid of humans, some simply didn't believe Hundred Youkai Accord could survive another week; many more appeared calm on the surface, but were already plotting their escape.\n\n She suddenly uttered a few names. The face of the person instigating panic in the crowd changed drastically, and the surroundings fell silent. She didn't force anyone to confess, only reminding the other committee members: she could identify the liars, but she couldn't decide for everyone who was trustworthy.\n\n§TMegumu Iizunamaru§! looked up at the crow tengu circling in the sky. Several orders were quickly sent to Youkai Mountain: investigate the source of the paper, publish safe routes, allow reporters to see the disaster area firsthand, and prepare to rewrite the headlines before the news harmed tengu interests.\n\n Byakuren saw the manipulation, Kanako saw the necessary efficiency, and Satori heard the unspoken calculations of both sides.\n\n Megumu Iizunamaru simply unfolded the newspaper sample. “Whether you like it or not,” she said, “those who wake up tomorrow morning will only remember what they read.”\n\n The Faith Committee didn't find a reassuring answer for everyone. They simply decided that from now on, every panic, every prayer, and every piece of news would become a battleground for each other."
 KYO_hyakki_council.23.a:0 "Fear always speaks; the question is, who names it?"


 KYO_hyakki_council.24.t:0 "The Mass Committee"
 KYO_hyakki_council.24.d:0 "When the grain truck overturned, all four members of the mass committee were present.\n\n The sack rolled off the cart, scattering white rice across the muddy ground. The crowd, who had been waiting all day, surged forward; the guards raised their weapons, and cries, curses, and hunger mingled at the narrow gate. The driver shouted that the grain was going somewhere else, but no one would listen anymore.\n\n§TSekibanki§! 's head peered over the chaotic crowd and saw another vehicle parked behind the courtyard wall. It was filled with intact sacks of rice, and several powerful henchmen were quietly unloading them.\n\n She landed back in front of the car and stepped on the steward who was about to escape.\n\n “The people in front trampled each other to death over a few handfuls of rice, while those behind didn't lose a single bag,” Sekibanki sneered. “Is this what you call fair distribution?”\n\n§TEirin Yagokoro§! ignored the arguments. She knelt down beside the injured, and after only a few glances, she made her judgment: who needed immediate blood flow control, who could wait, and who was beyond saving. Her voice was unwavering, and her commands were so precise it was almost unbearable to watch.\n\n Someone questioned her about why she abandoned the person who was still breathing.\n\n “Because this is all the medicine we have.” Eirin didn't look up. “If you can bring more, I'll save one more.”\n\n A drumbeat suddenly broke through the chaos.\n\n§TRaiko Horikawa§! Standing on the overturned cart frame, the drumbeat shifted from rapid to steady. Tsukumogami, following the rhythm, lifted away the broken planks, and the fairies formed a short human chain, gathering the scattered rice again; those who had initially been only concerned with grabbing gradually found something they could do. The thunder drum didn't read out commands, but simply shouted to the crowd: “If you don't want to go hungry tonight, don't stand there waiting to be rescued!”\n\n§TEiki Shiki, Yamaxanadu§! stopped Sekibanki, who was about to assault the supervisor, and ordered the guards to lay down their weapons. The unauthorized transfer of grain required trial, and the looting by the starving could not be taken for granted. She publicly announced the whereabouts of all the rice bags, the priority order for the injured, and the punishment that those responsible would receive.\n\n Sekibanki complained that her rulings were too slow; Eirin believed that making every arrangement public would only hinder efficiency; Raiko questioned how many people would survive if every rescue required waiting for the rules to be written down. Eiki did not back down.\n\n “Today an exception can be made because of the critical situation, but tomorrow someone will make the crisis last forever.”\n\n When the gates of the hospital reopened, there was still not enough rice, and not all the wounded had been rescued. No miracle occurred, and no one could make hunger disappear out of thin air.\n\n However, the weapons had been laid down, the first bowl of rice was delivered to the weakest person, and the grain cart hidden behind the wall was pushed back in front of everyone.\n\n Yukari watched all of this from the other end of the gap, but did not show up.\n\n The outcome on the front lines can be rewritten in a single day. But the mass committee faces the question of whether every ordinary person can survive that day."
 KYO_hyakki_council.24.a:0 "Before victory, don't let the living fall."


 KYO_hyakki_council.25.t:0 "A Family in the Scarlet Mist"
 KYO_hyakki_council.25.d:0 "When Sakuya brought the deployment arrangements to the table, Remilia first crossed out an entry. Yukari Yakumo saw that it concerned the number of personnel remaining at the mansion. She waited for Remilia to finish revising it before asking whether she would take responsibility for another section of the front.\n\n“First tell me where you intend to put my people.” Remilia pushed the paper back.\n\nNeither had forgotten the oath sworn upon entering Gensokyo. Yukari could demand Remilia's obedience when Gensokyo needed her. She also knew that pressure alone would not produce the most effective deployment from the mansion. She unfolded a map and indicated the territory and resources an outward advance could secure, along with the areas that would be endangered if the front collapsed.\n\nRemilia studied it, then asked about the retreat routes. Sakuya had already begun rearranging transport and personnel, accounting point by point for the changes her mistress had made so casually. When the list returned, it included even medicine and relief times. Remilia accepted it as a matter of course. Yukari gave the head maid another look.\n\nPatchouli had not come to the reception room. She sent Koakuma with several spell diagrams instead. When Yukari asked whether the duration could be extended, Koakuma produced the next page, which specified the preparation and intervals required. Smiling, she said Yukari could ask at the library herself if that was not enough. But when Patchouli's health came up, she held the page down and did not promise another deployment on her mistress's behalf.\n\nOutside, someone moving supplies nearly blocked the passage. Meiling pushed the cart aside and directed its handler to another unloading point. Still yawning as she returned to the door, she saw someone trying to follow them into the reception room and held out an arm, telling him to wait for Sakuya's confirmation. He complained. She simply remained where she was.\n\nAs the map spread toward the side of the room above the basement, Remilia's hand stopped. Yukari had not included Flandre on the deployment list. She still remembered the clash before the rift. If the younger sister's power escaped control, it would certainly not destroy only the enemy positions marked in the plan.\n\nBefore the meeting ended, Remilia checked the arrangements for those staying behind once more, then agreed to the military operations they had negotiated. She made no pledge to sacrifice herself for Gensokyo. Folding the map, Yukari understood that the mansion's willingness to fight beyond its walls would always depend in part on the safety of those within them."
 KYO_hyakki_council.25.a:0 "This kind of family is perfect for a dangerous war."


 KYO_hyakki_council.26.t:0 "Scarlet War Investment"
 KYO_hyakki_council.26.d:0 "When Yukari Yakumo arrived, no banquet was being held at Scarlet Devil Mansion.\n\n Hong Meiling personally pushed open the main gate. The courtyard was lined with a fully assembled guard, and the usually carefree fairy maids had changed into more practical attire. They didn't greet her loudly, but simply turned around simultaneously as Yukari passed by; their movements, while not perfect, were enough to show the marks of repeated training.\n\n There were no refreshments in the center of the hall, only an open map of Outside World. Remilia sat at the other end of the long table, her fingertips hovering over Tokyo, as if that city were already territory waiting to be claimed by her.\n\n “You need an army,” she began, “and I need a battlefield worthy of Scarlet Devil Mansion.”\n\n Yukari neither denied nor requested anything. She simply opened a gap, revealing Japanese ports, railways, barracks, and defensive positions one by one before everyone's eyes.\n\n “The battlefield is here,” Yukari said. “How much you gain is up to you.”\n\n Remilia smiled with satisfaction and then tapped the table lightly.\n\n Sakuya stepped forward and placed the completed organizational chart in front of Yukari. The guards, familiars, and trained fairies of Scarlet Devil Mansion would form two independent combat units, with Hong Meiling in charge of daily training and close combat. They would accept the strategic objectives set by the Hundred Youkai Army, but retain Scarlet Devil Mansion's own command methods.\n\n Patchouli then spread out several spell diagrams. The Great Library would provide protective barriers, communication spells, fire support, and analysis of Outside World weapons; she wouldn't promise miracles, only that every weapon yet to be understood would quickly lose its original advantage. Koakuma then opened the long-sealed storeroom, taking out magical mediums, rare minerals, and equipment ready for immediate combat, one by one.\n\n The armory, deeper within, was also opened. Rifles, ammunition, artillery parts, and equipment collected from the Outside World over the years were pushed into the hall. Another batch of boxes contained gold, silver, gems, antiques, and valuable certificates that could still be redeemed in the Outside World. It wasn't all the wealth of Scarlet Devil Mansion, but it was enough to support the Hundred Youkai Army in completing its first round of expansion.\n\n Yukari turned to the last page of the organization chart and saw a name that was not included in any unit.\n\n§RFlandre·Scarlet.§!\n\n Next to it is only a note left by Sakuya: It can only be moved by the museum owner herself.\n\n A soft laugh drifted from above the stairs. Flandre leaned against the railing, gazing curiously at the weapons and unfamiliar place names; the iridescent wing crystals cast an ominous glow in the dim hall. Meiling didn't look away, and Sakuya's hand remained close to the throwing knife.\n\n Yukari closed the compilation table.\n\n “Alright,” she said. “The Hundred Youkai Army will pave the way for you. As for what remains at the end of the road, that depends on the power of Scarlet Devil Mansion.”\n\n “You misspoke, Yukari.” Remilia stood up, her crimson eyes fixed on the map. “This is neither aid nor loyalty.”\n\n She planted the flag where Tokyo was.\n\n “This is my investment in victory.”\n\n Scarlet Devil Mansion thus entered the war. Yukari acquired enough equipment to arm the new army, assets that could be converted into military funds, and two combat units that were loyal to the same will.\n\n She also steered Gensokyo's sharpest and most capricious spear outside the barrier."
 KYO_hyakki_council.26.a:0 "Let Crimson become the spearhead of the Hundred Youkai Army."

 KYO_hyakki_council.27.t:0 "Eientei's Lunar Exiles"
 KYO_hyakki_council.27.d:0 "When Yukari Yakumo arrived at Eientei, the medicine stove was still burning. §TReisen Udongein Inaba§! accepted the Hundred Youkai Army's list of medical requirements. On reaching the unit organization and delivery times, she responded with particular speed. Yukari asked one further question about lunar military practice. Reisen's hand stopped at the edge of the paper, and she looked toward the room beyond.\n\n“We admit patients according to their injuries.” §TEirin Yagokoro§! emerged and took the list. “If you want to discuss numbers, give me the numbers.”\n\nYukari was not surprised. The woman before her had helped establish the Lunar Capital's order. She knew its medicine, weapons, and institutions, and had instructed its rulers. A physician like her might learn what an army used and what it lacked merely by examining its wounds. The few questions needed for a diagnosis could uncover the losses a military operation most wished to conceal.\n\nYukari proposed having military personnel accompany the patients. Eirin first asked whether they were there to escort the wounded or supervise their treatment. Before the two could agree, §TKaguya Houraisan§! spoke, telling them to draw that boundary before the patients arrived.\n\n“Once they're here, their wounds come first. Whatever you're arguing about, keep it out of the patients' doorway.”\n\nYukari looked toward her. Kaguya had asked Eirin to make the Hourai Elixir and chosen to drink it. Later, offered the chance to return to the Lunar Capital, she had chosen to remain on Earth. Yukari also knew the old story of Eirin killing the other emissaries and going into hiding with her. Their concealment deep in the bamboo forest was sustained by Kaguya's power over eternity. Finding the right path would scarcely reveal all its secrets.\n\nAs for getting the wounded inside, §TTewi Inaba§! simply took away the route Yukari had drawn. Follow that, she said, and the stretchers would still be going in circles at dawn. The rabbits would have to meet them. This longtime resident of Earth knew the bamboo forest and was older than Eientei itself. Even the lunar exiles who had settled here had to listen to her on its paths and local relationships.\n\nIn the end, they agreed to admit the wounded according to transport capacity first, then assess medicine shortages. Old lunar technologies were not listed as supplies to be requisitioned at will, nor could military personnel freely inspect treatment records. Yukari left the means of contact. Eirin had Reisen make a fresh copy of the admission arrangements.\n\nWatching the youkai rabbits pass outside, Kaguya asked whether the front would approach the bamboo forest. Yukari promised timely warning. Neither mistook that answer for a guarantee that this place could be kept safe."
 KYO_hyakki_council.27.a:0 "They have abandoned the moon, and now they must choose whether to defend this place."


 KYO_hyakki_council.28.t:0 "The conditions offered by the Sage of the Moon"
KYO_hyakki_council.28.d:0 "When Yukari Yakumo arrived in Eientei, Eirin Yagokoro was removing shrapnel from a tengu's body.\n\n The wounded woman was pressed against a blood-stained cloth, her wings twitching in pain. Reisen kept her conscious, and Eirin's hand remained steady. Metal fell into the dish with a soft sound. Eirin washed her hands before turning to look at Yukari.\n\n “An hour later, she wouldn't have needed saving.”\n\n “That's why I came.” The two sages exchanged no pleasantries.\n\n Eirin knew Yukari needed medicine, doctors, wounded evacuations, and a medical system that wouldn't collapse with the first retreat.\n\n “In other words, you want the entire Eientei.”\n\n “I want you all to join the war.” Eirin was silent for a moment.\n\n The door opened.\n\n Kaguya Houraisan entered the room, followed by a rabbit carrying several wooden crates.\n\n “Whether Eientei participates in the war doesn't have to be decided solely by the two of you.”\n\n The wooden crate was opened, containing hemostatic materials, surgical instruments, stretchers, field medicine kits, and medical equipment improved by Lunar technology.\n\n Kaguya will also unseal the medicine room, using her own strength to slow down the deterioration of the medicine, making it able to withstand the long transport.\n\n Five hundred sets of support equipment will be immediately delivered to the Hundred Youkai Army. Eientei will establish a frontline rescue, wounded evacuation, and epidemic prevention system. The order of treatment will be determined by Eirin, and no officer may use their status to cut in line for their subordinates.\n\n Reisen will train the accompanying medical personnel to maintain order among the wounded and protect the medical teams. She had served in the Lunar Capital army and knew how panic spreads under gunfire, and how to bring those on the verge of collapse back to life.\n\n Tewi Inaba will open the bamboo forest paths controlled by the youkai rabbits, allowing the wounded, medicine, and news to bypass the main roads. In exchange, the Hundred Youkai Army cannot forcibly conscript the youkai rabbits, nor can it treat the bamboo forest residents as readily available labor.\n\n Eirin finally proposes three conditions.\n\n Medical decisions will be made by Eientei; no one may demand the mass production of Hourai Elixir; if Lunar Capital enters Gensokyo under the pretext of pursuing Kaguya, Reisen, or herself, the Hundred Youkai Accord must not hand over any of them.\n\n Yukari closes her folding fan.\n\n “If Lunar Capital crosses the barrier, they are not here to reclaim the fugitive.”\n\n Her voice was soft, yet brooked no argument.\n\n “That's invading Gensokyo.”\n\n Eirin stared at her, finally pushing the medical deployment map to the center of the table.\n\n “Then, starting today, send all casualty reports here.”\n\n Eientei thus entered the war. The Hundred Youkai Army received full medical support, five hundred sets of equipment, and the covert transport of the youkai rabbits.\n\n Only the last medicine box remained unopened.\n\n Yukari knew that Hourai Elixir was contained within, and that it was the only aid Eientei would not provide.\n\n Immortality cannot save a nation; it only allows those who consume it to watch their nation perish forever.\n\n From this day forward, being wounded no longer necessarily meant being left behind.\n\n And the moon, no longer merely hung silently above the battlefield."
KYO_hyakki_council.28.a:0 "Save those who can still live; the moon's problem can be dealt with later."


 KYO_hyakki_council.29.t:0 "Where people still live"
 KYO_hyakki_council.29.d:0 "Through her gaps, Yukari Yakumo has seen every face the Human Village can wear.\n\n At dawn, smoke rises from the rooftops, shopkeepers take down their shutters, and farmers set out for the fields before sunrise. Lessons drift from the village school while guards change watch beside tracks left during the night. No great youkai here can alter the weather, and no high walls can hold back an army; one incident spinning out of control, or one pack of youkai beasts straying into the village, could reduce generations of ordinary life to ash.\n\n Yet Gensokyo cannot exist without the Human Village.\n\n Human memory gives youkai their names, folklore preserves their forms, and fear and reverence keep them from being forgotten. The taboos observed on night roads, the stories told by elders, and the talismans hung at doorways all affirm that this world still recognizes them. If every human left, Gensokyo might endure for a time, but it would ultimately become a graveyard inhabited by youkai whom no one remembered or understood.\n\n The Human Village, however, is not a game preserve for youkai.\n\n Fear must stop at a certain line. It may teach people to bar their windows, avoid the wilderness, and remember that other beings move in the dark; it cannot become so crushing that they can no longer farm, raise children, or leave their homes. If youkai devoured humanity, they would consume their own future as well.\n\n The Human Village exists so humans can continue to live as humans—not as sacrifices or silent appendages of a youkai order, but as people with families, traditions, worries, and choices of their own.\n\n§TKeine Kamishirasawa§! protects precisely that.\n\n She teaches reading, arithmetic, and history at the village school. She also teaches children which roads to avoid at night, which youkai can be reasoned with, and which promises must never be trusted. Such knowledge may seem mundane, but it has allowed fragile humanity to endure in a land ringed by youkai. Keine can hide a chapter of history, but more often she keeps the strong from erasing the living from it.\n\n§TFujiwara no Mokou§! stands in a different place.\n\n She does not live by the village's rules and rarely joins its debates. She dwells in the Bamboo Forest of the Lost, guides travellers who lose their way, drives off youkai that threaten the villagers, and then returns without ceremony to her solitude. For centuries she has watched one generation after another be born, grow old, and die. The children she once rescued have become grave markers, while she remains alive.\n\n That is why Mokou understands better than most how brief an ordinary life can be.\n\n Yukari does not need humans who prostrate themselves before youkai. She needs the Human Village to keep working: fields cultivated, roads maintained, knowledge handed down—and youkai continually reminded that Gensokyo does not belong to the strong alone.\n\n If the Hundred Youkai Army crossed the barrier and defeated Japan, only to turn back and find the Human Village hollowed out by requisitions, conscription, and fear, that victory would not have saved Gensokyo.\n\n Yukari closed the gap and set off towards the village school.\n\n This time, explaining what youkai need will not be enough.\n\n She must also answer what youkai intend to preserve for humanity."
 KYO_hyakki_council.29.a:0 "If the people can no longer live, Gensokyo will be nothing but an empty shell."


 KYO_hyakki_council.30.t:0 "The Human Village's Terms"
 KYO_hyakki_council.30.d:0 "After school had ended, Keine laid records of harvests, carts, horses, and road defenses on her teaching desk. Mokou leaned against the window. Watching Yukari Yakumo enter, she first asked how much grain she intended to take from the Human Village.\n\nYukari said they needed enough supplies to sustain a war. Keine opened the harvest records and told her to look at what each household had left before discussing the Hundred Youkai Army's needs. “Seed grain and food to last until the next harvest must stay. You cannot empty our storehouses today and tell us to find a solution a few months from now.”\n\nThe Human Village was willing to contribute some grain, cloth, and medicinal herbs, and organize drivers to deliver them to distribution centers. Blacksmiths, carpenters, and cartwrights could repair tools, vehicles, and Outside World weapons, but could not be forced to accompany the army to the front. Merchant associations would provide temporary storage, village guards would maintain the roads to the bamboo forest, the shrine, and the outlying settlements, and the school would check each household's burden against every delivery.\n\nKeine then set out her conditions: no compulsory conscription of residents; no troops entering homes to demand food without authorization; and no requisition without consent and a receipt, followed by restitution or compensation after the war. She would participate in coordination as the village's representative, with access to requisition and resettlement records at any time. If the same household was repeatedly charged, someone had to be responsible for correcting it.\n\nYukari signed beneath the terms, explicitly defining seizure without consent as looting. Mokou approached the desk and asked how many starving soldiers words on paper could stop. Yukari asked her to protect the grain routes and evacuation roads, but she did not immediately agree.\n\n“I'm not becoming your general. If your people rob the village, I'll stop them too.”\n\nYukari agreed to put the arrangement in writing. Mokou would escort civilians and convoys and intervene when enemy forces broke through or soldiers harassed them. This would not oblige her to obey every command of the Hundred Youkai Army. She also warned Yukari not to send every dangerous task her way merely because she could not die.\n\nYukari put down her pen and asked which stretches of road their current personnel could protect. Mokou pulled the map closer, crossed out an overlong escort route, and demanded relays along the way. Keine added two villages to the priority evacuation list. The three checked the routes again until their commitments matched the people available, then fixed the quantities for the first shipment.\n\nBefore dusk, the drivers arrived to collect their delivery papers. Grain sacks, tools, and spare wheels were loaded one by one as guards called for the crowd to make way. Keine kept a copy and locked the compensation records in a cabinet. Mokou left ahead to inspect the road. Before going, she turned back to Yukari. “I'll be watching how you keep your word.”"
 KYO_hyakki_council.30.a:0 "This is not obedience; the Human Village has agreed to march with us."

 KYO_hyakki_council.31.t:0 "The dead must have a place to go."
 KYO_hyakki_council.31.d:0 "Yukari Yakumo rarely considers Netherworld to be another world.\n\n There is indeed a boundary between life and death, but that boundary is never an insurmountable wall. The deceased leave the living, memories gradually settle, obsessions are settled, and finally they go to their respective destinations. What Hakugyokurou maintains is precisely this order that cannot be disrupted.\n\n Living people often believe that death means everything is over.\n\n However, war leaves behind uncollected corpses, nameless souls, and soldiers who still obey the last order and refuse to leave the battlefield. If a large number of deaths occur simultaneously near the barrier, those disoriented souls may rush into Gensokyo through the cracks, gradually causing the land of the living to overlap with the underworld.\n\n An army can defeat the enemy, but it cannot command the dead to find their own place.\n\n Hakugyokurou exists not because the dead need a magnificent mansion, but because death must be properly attended to. If all ghosts could return to the living through their obsessions, then every war and every disaster would continue to haunt the world after it ends.\n\n§TYuyuko Saigyouji§! is one of the guardians of this order.\n\n She could manipulate death, yet she rarely boasted of it. That composure wasn't indifference towards the dead. On the contrary, precisely because she was closer to death than anyone else, she understood that the deceased shouldn't be forever bound by the ambitions of the living.\n\n She could admire flowers while discussing the deaths of thousands; she could speak with an almost joking tone about the chaos a battle would wreak in Netherworld. Those who didn't know her would see it as indifference, but Yukari knew that Yuyuko simply refused to let grief dictate her judgment.\n\n§TYoumu Konpaku§! is responsible for turning Yuyuko's judgment into practical action.\n\n She is both human and half-phantom; she understands the living's fear of death and can also walk the path of the dead. She personally handles most of the guarding of Hakugyokurou, the guidance of ghosts, and the management of the Netherworld Gate. She is not good at detours; once the task is clear enough, she will double-check the route, the number of people, and the time until no detail is overlooked.\n\n This almost obsessive sense of responsibility is exactly what the Hundred Youkai Army needs.\n\n Outside World's railways may be bombed, bridges may be destroyed, and mountain roads may be blocked by enemy forces. Netherworld's roads, however, are not entirely limited by the material world. Ghosts do not need rest and can traverse terrain inaccessible to mortals and vehicles. If Hakugyokurou is willing to open the Netherworld passage, the Hundred Youkai Army can maintain a transport and evacuation route that is difficult for the Outside World's forces to cut off if the battle lines collapse.\n\n But Yukari also knew that the dead were not soldiers waiting to be conscripted, and Netherworld was not an armory to be mined at will.\n\n She had to persuade Yuyuko to temporarily open the path for the living to the dead; she also had to ensure that the war would not bind the recently deceased back to the military flag.\n\n Yukari unfolds the gap and sees the long stone steps of Hakugyokurou and the blooming cherry blossoms.\n\n Many years ago, she had discussed life and death there with an old friend. Now, she will once again cross the gates of Netherworld.\n\n This time, we'll discuss how to ensure that more people can return safely before they die."
 KYO_hyakki_council.31.a:0 "If there is no place for death, war will never truly end."


 KYO_hyakki_council.32.t:0 "A Netherworld Passage Open for the Living"
KYO_hyakki_council.32.d:0 "When Yukari Yakumo arrived at Hakugyokurou, Youmu Konpaku was counting the empty stretchers at the bottom of the stone steps.\n\n Ghosts lined up in a long row along the courtyard, some carrying medicine boxes and supplies, others repeatedly passing through the temporarily opened underworld gates, measuring the offset caused by the passage of physical entities.\n\n Youmu bows to Yukari.\n\n “Yuyuko-sama is waiting for you.”\n\n “Do you know why I've come?”\n\n Youmu looked at the empty stretcher.\n\n “The recently delivered spirits have already explained this.”\n\n Yuyuko sat deep in the courtyard, the tip of her fan pressing against a bombed-out railway line on the map.\n\n “After the roads for the living were destroyed, did they finally remember that the dead also have roads?”\n\n “I'll borrow one,” Yukari replied. “To transport supplies, evacuate the wounded, and prevent the fallen from lingering near the breach.”\n\n “Three.” Yuyuko smiled. “You're still greedy.”\n\n Hakugyokurou is willing to open several controlled Netherworld pathways connecting medical stations, supply distribution centers, and evacuation bases. Each activation must be confirmed and guided by Youmu or a trained half-phantom.\n\n Severely wounded individuals unable to evacuate via ordinary roads can briefly cross the edge of the Netherworld. As long as their souls have not completely left their bodies, Youmu will bring them back to the side of the living.\n\n Ghosts were responsible for nighttime transport, resupplying dangerous sections of the road, and searching for lost troops. Even when bridges collapsed and roads were blocked, they were still able to deliver medicine, food, and ammunition to the front lines.\n\n Youmu has reorganized four ghost units. The members are all ghosts who originally resided in Netherworld and voluntarily accepted Hakugyokurou's command, not recent casualties. They will guard passageways, cover evacuations, and support the Hundred Youkai Army in areas difficult for the living to navigate.\n\n Youmu has also compiled a set of rules for combat with spirits, including maintaining formation, resisting exorcism weapons, identifying friend from foe, and preventing spirits from going out of control due to battlefield obsessions.\n\n Musical instruments were being tested on the other side of the courtyard.\n\n§TPrismriver Sisters§! also accepted the arrangement. Lunasa's zither music could soothe restless spirits, Merlin could awaken gradually fading consciousness, and Lilika adapted the melody into directions and warning signals.\n\n Music will become the communication tool for the ghost troops, and it will also lure lost souls away from the battlefield.\n\n Yuyuko finally put forward the conditions.\n\n No new casualties shall be forcibly incorporated into the army; the Hundred Youkai Army shall not restrain the souls of the dead or prevent them from going to their proper places; any identifiable dead shall be recorded and their respective factions notified. If anyone uses the passageways to hide corpses, execute prisoners, or evade investigation, Hakugyokurou shall immediately close all entrances.\n\n “I can get the dead to help you,” Yuyuko said, “but I can't let the living think that they still owe a war after they die.”\n\n Yukari closed the folding fan.\n\n “The person who just died does not belong to any army.”\n\n “Even if the situation worsens?” Youmu asked.\n\n “Especially so.”\n\n Yuyuko gently swept away the cherry blossoms on the map.\n\n “Then, this road is yours.”\n\n The gates of the underworld opened one by one. The first group of ghosts carried supplies into the pale light, while at the other end, wounded soldiers covered in dust awaited their guidance.\n\n Hakugyokurou thus entered the war. The Hundred Youkai Army gained access to the Netherworld Passage, four ghostly armies, combat experience compiled by Youmu, and spirit communication established by the three sisters.\n\n And those who did not return from the battlefield, at least will not be lost forever on their way home."
KYO_hyakki_council.32.a:0 "Let the dead guard the road, so that the living may return."


 KYO_hyakki_council.33.t:0 "If nature still exists"
 KYO_hyakki_council.33.d:0 "When Yukari Yakumo arrived at Misty Lake, a fairy was trying to move the rubble that was burying the flowers. A turbulent current emanating from the barrier swept across the lakeshore, and she and the petals in her hand turned into specks of light. The nearby fairies were quiet for a moment, then quickly gathered around the flowers again, continuing their argument about where to begin their struggle.\n\n For fairies, death usually doesn't warrant prolonged grief. As long as the lake continues to flow and the forest continues to grow, they will eventually reappear from nature. But Yukari waited a long time, and the fairy never returned. The soil beneath the flowers had been abnormally eroded, the leaves were grayish-white, and even the wind couldn't carry away a trace of the scent of grass and trees.\n\n Fairies are not truly immortal. They merely entrust their lives to nature; once the lake dries up, the forest burns, and the seasons cease to change, they lose their place of return. Outside World's army didn't need to deliberately hunt them; simply treating the forest as timber and the lake as obstacles would likely wipe out the entire group of fairies forever.\n\n In the distance, Cirno broke through the thin ice, loudly proclaiming that she had only deliberately dived. Daiyousei, meanwhile, gathered the scattered flowers, leading the other fairies away from the gray land. One yearned to prove herself the strongest, the other always managed to reunite her scattered companions.\n\n Yukari had originally needed eyes covering the forest, messengers capable of traversing ruins, and raiders unbound by the habits of regular armies. Now she understood that the fairies' reasons for joining the war were more direct.\n\n They didn't understand nations, nor strategy. They simply refused to let tomorrow's lakes be devoid of laughter."
 KYO_hyakki_council.33.a:0 "Weakness never equates to being sacrificed."

 KYO_hyakki_council.34.t:0 "The Strongest's Battle Meeting"
 KYO_hyakki_council.34.d:0 "The meeting by Misty Lake was chaotic from the start. Maps lay spread out on wooden crates, weighed down by stones, pine cones, half a block of ice, and a teacup. Some treated the gathering like a picnic, while others fought over seats.\n\n Cirno stood on the crate, hands on her hips.\n\n “Let me, the strongest, lead the way and freeze all the enemies!”\n\n “No,” Yukari replied, “If you lead everyone in a frontal attack on the first day, no one will scout on the second day.”\n\n Cirno was about to protest when Daiyousei grabbed her sleeve. She called back the scattered fairies one by one, arranged for leaders familiar with the routes, and left the frightened children with reliable companions. The chaos didn't disappear, but it gradually converged in one direction.\n\n The three fairies, each with their own methods, offered solutions. Sunny could distort light to create false targets; Luna could eliminate sound to cover the team's passage; and Starr could sense moving creatures to locate patrols and ambushes. These abilities, originally intended for pranks, became tools for reconnaissance, stealth, and luring the enemy.\n\n Yukari assigned them four tasks: monitoring the lakeshore and forest, delivering brief messages, disrupting enemy routes, and guiding residents to evacuate during fires or bombings. She also ordered that no one should use the fairy's ability to regenerate as a pretext to repeatedly send them to their deaths.\n\n “What if I lure the enemy to the lake and then freeze the surface?”\n\n Cirno asked.\n\n “Okay.” “Only the strongest could think of that!”\n\n Daiyousei then divided everyone into twelve action groups. They didn't have uniforms, nor could they march in neat rows; but each group remembered an area, an evacuation route, and who was responsible for bringing everyone back.\n\n Before dusk, countless glimmers of light had scattered into the reeds, treetops, and thick fog. The Gensokyo, the least military-like group of lives, thus entered the war in their own way."
 KYO_hyakki_council.34.a:0 "Let fairy protect her home in her own way."

 KYO_hyakki_council.35.t:0 "The Sky Is Not Neutral"
 KYO_hyakki_council.35.d:0 "When Yukari Yakumo arrived at Youkai Mountain, the council hall was already covered in maps of the Outside World. Crow tengu brought negatives and shorthand notes, while white wolf tengu submitted patrol logs. A clerk added dates beside railways, army camps, and ports. This reconnaissance system had been running for some time. It was merely Yukari's first seat at the briefing table.\n\nMomiji began by crossing out a mountain road. On the map it looked passable for vehicles, but only its first half was wide enough. If the valley entrance were blocked, the vehicles behind could neither reverse out nor turn around. She marked a separate branch passable on foot and warned Yukari not to confuse the two.\n\nAya then spread out her photographs. One unit had changed its designation, artillery brought from the north was still sitting in a freight yard, and antiaircraft defenses had been added around an airfield. She gave the time of each photograph and turned to the next, showing Yukari the sentry posts added in two days. The longer they waited, the harder it would be for scouts to approach these places.\n\nYukari asked about the original negatives. Aya put a hand over the photographs and asked whether she doubted her reporting. Yukari pointed to two neighboring images. They had been framed differently; she needed to know what lay outside each picture. The same number of wagons did not tell her whether a train was empty or fully loaded, let alone its purpose.\n\nAya was willing to explain where she had taken the pictures, but did not immediately hand over all her material. Megumu Iizunamaru intervened. Youkai Mountain could share intelligence, she said, but one draft agreement would not make it surrender command of an organization built over many years.\n\n“Who do you intend to show these to? And who answers for a mistaken assessment?” she asked.\n\nYukari said the Hundred Youkai Army needed a continuing flow of intelligence to decide when to advance or withdraw. Megumu demanded that Youkai Mountain, which bore the risks of reconnaissance, participate in strategic decisions and know how its information would be used. If the army delayed while tengu repeatedly flew over fortified territory, the mountain could not bear all the losses alone.\n\nMomiji returned the dangerous road's record to the center of the table. If the front received only an old map, today's survey would be useless. Aya added that once her material was submitted, a commander's misreading of a photograph could not be blamed on the reporter. Others began speaking. The question shifted from whether to share intelligence to who would control the originals, the assessments, and their transmission.\n\nYukari asked the clerk to record each dispute. She wanted verified changes to reach the troops who needed them even when factions disagreed. Megumu meant to retain authority over her scouts, and Aya would not surrender her editorial decisions. Momiji fetched another road report while they worked toward a practical arrangement. The maps remained on the table. The tea had gone cold. No one rose to leave."
 KYO_hyakki_council.35.a:0 "Seeing the enemy is merely the first step in intelligence work."


 KYO_hyakki_council.36.t:0 "A Map No One May Monopolize"
 KYO_hyakki_council.36.d:0 "The next morning, a large map was laid out in Youkai Mountain's council hall. Aya brought aerial photographs, and Momiji placed ground patrol records beside them. A clerk arranged everything by date. Rail traffic and lights in the army camps had both increased, but whether troops were assembling still depended on confirming the cargo's destination and the size of the camps.\n\nMegumu Iizunamaru stated her terms first: the mountain would retain command of its scouts, flight paths would remain secret, and no one could freely remove the original material. Yukari accepted, while requiring verified military intelligence to be submitted to the Hundred Youkai Accord. Information could not be withheld merely because it was inconvenient for Youkai Mountain.\n\n“Who decides what counts as verified?” Megumu asked.\n\nMomiji pointed to a junction in a photograph. It appeared passable, but ground patrols had found that the bridge could not support heavy vehicles. She proposed comparing aerial observations with evidence on the ground and stating exactly what each source could confirm. Aya agreed to preserve the negatives, times, and locations, with analysis written separately. When it came to reporting, however, she still insisted on writing her own articles.\n\nYukari demanded a delay in publishing operations that had not yet been carried out. Aya asked whether that restriction would also bury reports of defeats. Yukari replied, “Once the operation is over, ask all the questions you like. Just don't print the route before the troops depart.” They recorded the distinction before returning to reconnaissance arrangements.\n\nCrow tengu would take turns observing railways, army camps, ports, airfields, and antiaircraft positions beyond the barrier, with alternative flight paths prepared. White wolf tengu would verify the terrain, separately marking routes suitable for heavily equipped formations, small units, and retreating troops. Single sightings would remain unconfirmed until independently corroborated, then be added to the daily battlefield map. Major changes would be reported immediately, with any uncertainties clearly noted.\n\nMegumu required material to be distributed according to assignment. Scouts would receive only their own routes, couriers would never handle the complete map, and units would receive the local intelligence they needed. Accord headquarters would receive the consolidated findings, preventing factions from seeing only the fragments that suited them. False routes used to trace leaks would be marked separately and kept out of actual operational orders. Intelligence of uncertain origin would be checked independently by both the mountain and the Accord.\n\nWhen the document returned to Megumu, she checked the provisions for losses and replacements once more. Yukari could request reconnaissance, but could not bypass the mountain's command and send tengu into danger at will. Only after confirming that clause remained did Megumu affix her seal.\n\nAya collected her photographs, and Momiji took the list of roads still awaiting inspection. The first crow tengu were already outside, waiting to depart. Large areas of the map remained unmarked. Beside each blank, the clerk wrote who would investigate and when they were to report, then spread out the next map."
 KYO_hyakki_council.36.a:0 "Every movement of the enemy forces will leave a trace."

 KYO_hyakki_council.37.t:0 "The War of Thirteen Types of Screws"
 KYO_hyakki_council.37.d:0 "Yukari Yakumo entered the workshop in Genbu Ravine when a smoking gear flew towards the door. Gap opened in front of her and sent the gear back to the bucket next to the workbench. “Just a minor malfunction.”\n\n Nitori Kawashiro poked her head out from behind the machine, her face covered in machine oil.\n\n Takane Yamashiro leaned against the other side and bluntly exposed her: “The same minor malfunction, the third time today.”\n\n The workshop was filled with rifles, communicators, hydroelectric generators, and barrier anchors. Every prototype worked, but no two used the same screws, connectors, and markings. Different kappa kept to their own designs, and Yamawaro was unwilling to hand over timber, tunnels, and transport nets to competitors. Normally this is just business; on the battlefield, however, it means a weapon is broken and the workshop that manufactured it must send over the replacement parts. Yukari picked up two bolts that were only slightly different in size.\n\n “After the war started, a bridge winch broke down in Outside World.\n\n How long will it take to repair it?” Nitori quickly calculated: “With all the materials, three days.”\n\n “What if the mountain road for transporting materials collapses first?” Takane Yamashiro asked.\n\n Nitori didn't answer.\n\n To establish an engineering team, both sides first needed to abandon their independent efforts. Nitori demanded standardized blueprints, ammunition, and parts specifications, but Kappa was unwilling to disclose its years of accumulated technology; Takane Yamashiro was willing to provide gathering sites, work sheds, and manpower for the mountain roads, but refused to let the yamawaro only do manual labor.\n\n “We provide the timber, the ore, and the people, and you just carve your names on the finished products,” Takane said.\n\n “That's not cooperation.”\n\n “Without our machinery, your materials are just a pile of wood and stone,” Nitori retorted immediately. “You can continue arguing,” Yukari said calmly, “until the Japanese army dismantles all your workshops.”\n\n The argument temporarily ceased. Hina Kagiyama walked over from the drainage ditch, her hands swirling with curses gathered from waste oil and broken spells.\n\n “And these,” she cautioned. “If production increases, accidents and pollution will increase as well.\n\n Without anyone to handle it, the workshop will be dragged down by its own misfortunes.” Yukari laid out the wartime plan on the workbench: weapons repair, bridge components, tunnels, railways, communications, and barrier equipment—each item marked with a deadline.\n\n Nitori and Takane Yamashiro finally stopped looking at each other and instead gazed at the timetable, which was almost completely blank.\n\n They were still at odds, but at least they acknowledged one thing—the next war could not use the thirteen incompatible screws."
 KYO_hyakki_council.37.a:0 "War won't wait for the workshop to finish arguing."


 KYO_hyakki_council.38.t:0 "The same specification sheet"
 KYO_hyakki_council.38.d:0 "The next day, Kappa and Yamawaro placed the first joint specification sheet in front of Yukari Yakumo.\n\n Nitori retained the core technologies of each workshop but standardized weapon calibers, part sizes, communication connectors, and the external interfaces of barrier equipment. This way, parts manufactured by any workshop could be sent to the front lines, and damaged equipment would no longer need to be returned to its original manufacturer. “I will establish a parts catalog and a mobile repair team,” Nitori said, pointing to the blueprints. “The material and labor costs for infantry weapons can be reduced by at least 10%, as long as others arbitrarily change the dimensions during mass production.”\n\n Takane Yamashiro sneered and pressed another drawing aside.\n\n Yamawaro's responsibilities extended from the workshops all the way to the mountains: logging, mining, transportation, bridges, railways, and underground storage areas. She has identified several mineral veins that can be re-exploited and has also drawn up transportation routes that bypass the main settlements. Four new industrial sites will be developed, two of which will produce civilian equipment, and the other two will be converted into military production lines. “We'll build the routes, we'll mine the mines, and we'll build the sheds,” Takane Yamashiro said. “The yamawaro must participate in procurement and scheduling; we can't wait for Kappa to distribute the leftover materials.”\n\n “Okay,” Yukari replied. “Wartime specifications will be used by the Hundred Youkai Army; the workshop name, improved techniques, and reasonable profits will remain with the original creators.”\n\n She Qu looked up: “You mean, we can still do business?” “We can make money,” Yukari closed her folding fan, “but we can't rely on incompatibility to earn the same money twice.”\n\n Hina added drainage ditches, waste areas, and shift restrictions to the edges of the engineering drawings. She didn't interfere with machinery or trade; she only focused on drawing the crowds away from the construction site. Several of the most dangerous testing grounds were relocated to prevent a single mishap from burning down the entire production line.\n\n At noon, the first batch of standard parts began production. Kappa calibrated the machine tools, and Yamawaro delivered wood and metal to the workshop; old parts previously piled in the corner were reclassified, usable parts kept, and unusable parts immediately melted back into raw materials. Nitori and Takane still argued about priorities, but now they were arguing about the numbers on the same list.\n\n At dusk, the first standard bridge was erected over Genbu Ravine. The winch manufactured by Kappa was installed into the framework built by Yamawaro, and the bolts were screwed in smoothly on the first try.\n\n Gensokyo did not yet have a large military industrial city, nor an inexhaustible supply of steel. But from this day forward, each workshop no longer worked only for itself, and every road led to the same war.\n\n Yukari's required construction team has finally begun operating."
 KYO_hyakki_council.38.a:0 "Let all workshops operate under the same war conditions."

 KYO_hyakki_council.39.t:0 "There are no shortcuts on the River Sanzu."
 KYO_hyakki_council.39.d:0 "Yukari Yakumo first put away the gap behind her as she stepped onto the Higan.\n\n This place does not belong to any Gensokyo faction. A sea of red flowers stretches along the banks of the River Sanzu into the distance, the dead silently waiting for the ferry; their titles, power, and fame in life are reduced to nothing more than a life story that must be measured. If Yukari were to cross the river directly, perhaps no one could stop her, but today she has come to request the help of the Ministry of Right and Wrong, not to demonstrate to the Higan how many rules a sage can disregard.\n\n The ferry is moored not far from the shore. Komachi Onozuka was fast asleep, leaning against the oar, her face half-covered by a straw hat. A long line of the dead lay on the bank.\n\n Yukari tapped the gunwale with her folding fan.\n\n “Miss Shinigami, your passengers seem to have been waiting a long time.”\n\n Komachi lifted her hat and yawned without a hint of shame.\n\n “I rushed through my whole life while I was alive, so it's no big deal if I'm a little slower after death. You'd better save your energy, though; Lady Eiki has been working on the wartime plans you sent this morning.”\n\n She rowed the boat away from the bank, her movements seemingly casual, yet the boat steadily avoided every undercurrent in the river. This shinigami was lazy and talkative, always finding excuses to skip work; yet she remembered the last person each deceased person thought of, knew which waters harbored evil spirits, and understood how crowded the Sanzu River would become during wartime. She simply refused to prove her usefulness through diligence.\n\n Across the river, the Ministry of Right and Wrong lacked the clamor of a military camp, only the sound of pages turning and the gentle tapping of the pen on the table. Seated in the hall was Eiki Shiki, the yama who judged the good and evil of the deceased in Gensokyo. Before the mirror of purity, status could not conceal sins, nor could beautiful words rewrite what had been done.\n\n Her rebukes were especially awe-inspiring. Eiki didn't suppress people with shouts, but rather dissected the cause, action, and consequence of a thought, until the other person could find no more excuses to hide. She could talk about everything from a moment of laziness to the very essence of the soul, and could speak for hours without tiring about a single act of self-deception.\n\n Yukari was always the one who left others speechless. However, facing Eiki, she had to admit: if lecturing and reprimanding were a skill, she was indeed inferior.\n\n The palace doors slowly opened. On the desk, every page of Hundred Youkai Accord was densely covered with annotations.\n\n For the first time, Yukari felt that the next few hours might be even more difficult than crossing the Japanese army's lines."
 KYO_hyakki_council.39.a:0 "Some checkpoints cannot be bypassed with gaps."


 KYO_hyakki_council.40.t:0 "The Boundary of Right and Wrong"
 KYO_hyakki_council.40.d:0 "Eiki Shiki did not invite Yukari Yakumo to sit down.\n\n “You asked Higan for help with the Hundred Youkai Accord.” She pressed down on the documents on the table, “Then answer first: Who can order the requisition? What should be done with the residents who refuse to hand over food? Are those who surrender still considered enemies? If Youkai eats prisoners, are you going to use “nature” or “emergency of the battle” to defend them?”\n\n Yukari did not answer immediately.\n\n The negotiations continued from morning until the fog over the Sanzu River darkened. Whenever Yukari used survival as a reason, Eiki pressed her on how far that reason could go; whenever Yukari pointed out that it was impossible to consult on everything on the battlefield, Eiki demanded that the scope of decisions the commander could make on their own be clearly stated.\n\n “Necessary things don't automatically become just because they are necessary,” Eiki said. “If the one who issues the order is also the sole judge, then it's not a rule, it's just power testifying for itself.”\n\n This left Yukari no room for negotiation.\n\n Ultimately, the two jointly established the wartime rules for the Hundred Youkai Army: requisitioned supplies must be registered for their source, and those who can compensate must not be plundered; retaliation against civilians based on race or affiliation is prohibited; those who surrender or lose their fighting ability must be kept under guard and must not be mistreated, eaten, or executed without authorization; any casualties caused by any unit must be recorded and explained by the commander; the names, belongings, and whereabouts of the dead will be compiled by Higan.\n\n Eiki added another rule at the end.\n\n “Yukari Yakumo herself is also bound by this.”\n\n Yukari glanced at the words for a moment, then picked up a pen.\n\n “If rules can only govern the weak, they have no reason to exist.” Once the ink was finished, Eiki's stern expression softened.\n\n She would personally compile military discipline and training manuals, dispatch inspectors to record violations, and retain independent adjudication power within the Hundred Youkai Accord. This was not to grant justice to war, but to prevent the name of survival from becoming a license for all evil.\n\n Komachi was in charge of transportation on the Sanzu River, casualty registration, and the evacuation of the dead. She sighed deeply upon hearing the job description, but still tucked the route map into her pocket. Kutaka Niwatari then took over the gate leading to Higan, distinguishing between the dead, vengeful spirits, and those who slipped through in the chaos, preventing the war from throwing both the living and the dead into disarray.\n\n “So, Higan is willing to help Gensokyo?” Yukari asked.\n\n “I only acknowledge that resisting annihilation is not a sin,” Eiki replied. “As for whether you commit new sins in the process of resistance, I will keep watching.”\n\n Komachi moved closer to Yukari, lowering her voice.\n\n “That's already Eiki-sama's agreement. If we keep asking, she could talk until tomorrow morning.”\n\n “Komachi.”\n\n Eiki's voice came from behind the desk.\n\n “Since you still have the energy for conversation, let's finish all the ferry work that's been piling up today.”\n\n Shinigami's smile froze instantly. Yukari closed her folding fan, a slight smile appearing for the first time since stepping into the Ministry of Right and Wrong.\n\n Higan's assistance has now joined the Hundred Youkai Accord."
 KYO_hyakki_council.40.a:0 "Even war must answer the question of right and wrong."

  KYO_hyakki_council.41.t:0 "The Palace of the Mind Reader and the Heartless"
 KYO_hyakki_council.41.d:0 "The road to the Palace of the Earth Spirits is busier than Yukari Yakumo remembers.\n\n Mineral carts traverse the rock walls along tracks, Former Hell residents exchange goods at forks in the road, and Flame Cats drag carts laden with corpses past smoking tunnels. Several tunnels have been reinforced with new supports, and brightly colored warning lights have been hung in dangerous areas.\n\n On the surface, this place is always imagined as a deep pit filled with vengeful spirits, sinners, and beasts. Only upon entering does one discover that this sunless land has its own roads, workshops, rules, and way of life. It has not been swallowed by vengeful spirits and subterranean fire because the Palace of the Earth Spirits still governs everything.\n\n Satori Komeiji governs all visible order. Merchants can lie to officials, subordinates can conceal things from their superiors, and the weak may be too afraid to point out danger; but no one can hide their true thoughts from Satori. She knows which mines are overstating production, which tunnels are about to erupt in conflict, and she knows whether a respectful remark hides obedience, fear, or resentment waiting for an opportunity.\n\n The underground inhabitants may not like her. Being seen through is never a pleasant experience. However, they at least know that Satori will not be bought off by pretty words, nor will she listen only to the side of the powerful. In a city that shelters countless people rejected by the surface world, this unsettling fairness is more trustworthy than kindness.\n\n As for Koishi Komeiji, she governs the places no one notices.\n\n Koishi neither chairs meetings nor issues orders. She might appear in an abandoned mine shaft, and the next moment sit on the roof of Former Capital; guards can't remember when she passed by, and merchants can't recall who warned them of the warehouse fire. Lost children inexplicably return to their doorsteps, blocked ventilation shafts are opened before accidents happen, and several youkai about to fight suddenly forget why they're angry.\n\n If Satori deals with thoughts that no one dares to voice, then Koishi enters those voids that even the parties involved themselves are unaware of. No one can track her, and no one can truly command her; yet every forgotten alleyway in Former Hell, every corner that won't appear in reports, seems to bear her footprints. One is seen by everyone, yet feared because of it; the other can walk beside anyone, yet is never remembered.\n\n These two sisters maintain the operation of Former Hell in completely opposite ways. Yukari hadn't even reached the main gate of the Palace of the Earth Spirits when the tightly closed doors opened by themselves.\n\n Satori was already seated deep within the hall.\n\n Her third eye looked at the visitor; two cups of freshly brewed tea sat on the table.\n\n “You've already figured out what the Palace of the Earth Spirits can do for you on the way here.”\n\n She didn't exchange pleasantries.\n\n “Now, it's your turn to hear what the underworld wants.”"
 KYO_hyakki_council.41.a:0 "Prepared words are meaningless before a mind reader."


 KYO_hyakki_council.42.t:0 "The Gensokyo the Surface Refuses to See"
 KYO_hyakki_council.42.d:0 "Yukari Yakumo hadn't even spoken when Satori Komeiji revealed her purpose for her. “You need me to uncover the panic, lies, and hostility; you need Rin to handle the dead, the wounded, and underground transport; and you need Utsuho to become a weapon powerful enough to deter the enemy.”\n\n Satori picked up her teacup, her tone calm to the point of being indifferent. “The forces on earth are always like this. In times of peace, they call us ominous; when danger strikes, they remember that even ominous things can be useful.”\n\n Yukari did not deny it.\n\n Any explanation would be rendered useless before Satori could read it.\n\n A voice suddenly came from behind Yukari. “So, what about after the war?” Koishi Komeiji squatted on the back of the chair, her hands supporting her face. No one heard her enter, and even Yukari couldn't be sure when she had arrived. “Once everyone's fear is gone, will the people on the surface hate us again?”\n\n This question was more direct than Satori's interrogation. “Yes,” Yukari replied. Koishi tilted her head. Satori's third eye narrowed slightly.\n\n Yukari continued, “I can't command everyone to like the Underground, nor can I use the word “unity” to mask long-standing rejection. But Hundred Youkai Accord can force them to acknowledge that Former Hell isn't a warehouse to be opened in times of crisis, but part of Gensokyo.”\n\n Yukari pushed the draft agreement in front of Satori. The Palace of the Earth Spirits will gain official seats, access to shared intelligence, participation in resource distribution, and the same rights to refuge and supplies as surface settlements. After the war, no power may exclude them from the common order on the grounds that the underground is dangerous, unclean, or unsettling. “You didn't expect them to treat us kindly from now on,” Satori read Yukari's thoughts. “That's unrealistic.”\n\n “You're just preparing to make it harder to exclude us.”\n\n “Institutions usually only go this far.” Satori was silent for a moment.\n\n What she read was not warmth, nor a belated apology to the underground inhabitants. Yukari was still calculating forces, roads, and risks; but at least in that calculation, the underground was no longer a tool to be used and then discarded. The Palace of the Earth Spirits then proposed its own arrangements.\n\n Satori would assist in identifying panic, infiltrators, and deliberately concealed hostility within the army, but refused to allow mind-reading as an excuse to monitor everyone. Rin Kaenbyou was responsible for tunnel transport, disaster relief, and the containment of the dead; Utsuho Reiuji would guard the geothermal facilities and provide battlefield-altering firepower in the most critical situations.\n\n Koishi did not accept any position.\n\n She simply lay on the table, drawing several winding, thin lines on the map with Yukari's pen. Those paths passed through abandoned mines, vengeful spirit gathering areas, and long-sealed tunnels, some of which weren't even recorded in the Palace of the Earth Spirits' records. “These are places you can go,” Koishi said. “Because everyone has forgotten, no one will be guarding them.”\n\n Looking at the last route her sister added, Satori finally signed the agreement. “The Palace of the Earth Spirits will help you,” she said, looking up at Yukari. “Not because the surface has finally accepted us, but because the Former Hell also has the right to decide Gensokyo's future.”"
 KYO_hyakki_council.42.a:0 "The underground doesn't only exist in times of crisis."

 KYO_hyakki_council.43.t:0 "Those guys who can't sit at the long table"
 KYO_hyakki_council.43.d:0 "You want me to introduce you to grassroots people? Sure. First, throw away those pitiful, weak, and dependent ideas in your head.\n\n The so-called grassroots people aren't those who like mud, nor are they born to live in dilapidated houses and lakeshores. It's just that whenever food, medicine, and safe shelter are allocated, they are always at the bottom of the list; whenever transportation, watchkeeping, scouting, and burying people are needed, they suddenly appear at the front.\n\n Sekibanki is the hardest to fool of the three. When she hears about unity, she first asks who is giving orders; when she hears about common interests, she focuses on whose pocket the benefits end up in. She doesn't believe that those in power will suddenly develop a conscience, nor does she like others deciding for her what is necessary. She knows people everywhere in the dark alleys, abandoned houses, and night streets outside the city.\n\n She often knows who is starving, who is missing, and which guard has taken bribes before the officials do. Kagerou Imaizumi isn't one for many schemes. When danger strikes, she first assesses whether she can fight; if not, she retreats with those around her. She knows the animal trails at the edge of the forest, which paths conceal scents, and which dilapidated shacks offer shelter from the wind and rain.\n\n If you try to appease her with sweet words, she might leave halfway through; but if her companions are truly in danger, she'll be the first to rush to their aid. Wakasagihime seems easy to talk to, so some people assume she's easy to bully. Wrong. She simply prefers to speak gently, not that she has no bottom line. She remembers whose child is sick by the lake, which wounded soldier lacks medicine, and which settlement is short of food. She doesn't oppose fighting, but whenever others start calculating how many people they can abandon, she asks: Why is it always the same group being abandoned?\n\n They argue. Sekibanki complained that Kagerou acted too quickly, while Kagerou complained that Sekibanki suspected everything; Wakasagihime wanted to bring everyone back, while the other two knew that sometimes it was simply impossible. They weren't a perfect trio, but when cornered, they were still willing to pave a path for each other.\n\n Do I like them? Not entirely. Sekibanki complained that I made a big fuss, Kagerou said I sometimes only cared about flipping tables, and Wakasagihime would ask if there were any innocent people nearby before I even lit a fire.\n\n It was incredibly annoying. But those sitting at the long table had better remember: they drew an arrow on the map with just one finger; it was often these people, without even chairs, who truly guided food, news, and the wounded along that arrow."
 KYO_hyakki_council.43.a:0 "Don't leave the ones who hold everything up for last."


 KYO_hyakki_council.44.t:0 "The Fourth Bystander on the Lakeshore"
 KYO_hyakki_council.44.d:0 "Seija Kijin sat on a crooked tree outside the lakeshore, watching Yukari Yakumo negotiate with three grassroots youkai through the branches.\n\n She wasn't there to help. At least, that's what she thought.\n\n Yukari didn't bring any guards, nor did she call them into the carpeted meeting room. The group stood beside a half-collapsed shed, wooden crates serving as tables, on which maps of the settlement, forest paths, and lakeshore waterways were spread out.\n\n “We can carry supplies, keep watch, scout, and even deliver messages to places the Great Youkai can't reach,” Sekibanki spoke first. “But don't mistake “can do” for “can be ordered around.” If you're going to send us to our deaths, just say so now.”\n\n Kagerou pressed her fingertips against several forest settlements.\n\n “Give us any weapons we can use. If the enemy gets close, we'll protect our own people first. We won't abandon our settlements just because some commander is urging us from afar.”\n\n Wakasagihime then pointed to several waterways on the lake.\n\n “The wounded, the young Youkai, and those unable to fight all need boats, medicine, and places to go. We can't just include those who can carry weapons in the arrangements.” They didn't ask for titles, banners, or a proper headquarters.\n\n What they wanted was not to be arbitrarily conscripted, not to have their last sack of food stolen, and not to die in some unknown place. Yukari answered point by point.\n\n Local settlements have priority in self-defense; the Hundred Youkai Army must provide equipment, food, and medical care to those assisting with transport and reconnaissance; the grassroots communication network does not belong to any single power, and messages are sent directly to the Hundred Youkai Accord; if anyone is injured or killed, their families and settlements must be cared for, and the matter cannot be erased with a mere claim of an emergency.\n\n Sekibanki was responsible for organizing local information and contact points, the Kagerou organized night patrols and forest guides, and Wakasagihime coordinated lake transport, wounded evacuation, and shoreline refuge. They were still not an army in uniform, but they allowed Hundred Youkai Accord's reach to corners that never appeared on official maps.\n\n As the negotiations were about to end, Yukari suddenly paused.\n\n Her gaze passed over Sekibanki's shoulder, through the branches and the mist on the lake, and landed precisely on Seija's hiding place.\n\n She didn't open a gap, nor did she issue any warnings. Just one glance, and the meaning was infuriatingly clear. — Behave yourself.\n\n Seija had already prepared several disruptive remarks.\n\n She could remind the three that the sage's promises were never guaranteed; she could also question Yukari on the spot about how many of these written arrangements would remain after the war. However, she ultimately remained silent.\n\n “What an unreasonable old woman,” Seija muttered under her breath.\n\n Under the tree, Yukari wrote the final line on the agreement.\n\n Sekibanki read it repeatedly before nodding, Kagerou put away the map, and Wakasagihime began inquiring about when the first batch of medicine would arrive.\n\n At least this time, the person sitting high up didn't make them wait, nor did they place them last in line.\n\n Seija leaned back against the tree trunk, deciding to let the sage finish her work for the time being."
 KYO_hyakki_council.44.a:0 "Their voices finally reached the long table."


 KYO_hyakki_council.45.t:0 "The Voice Before Being Abandoned"
 KYO_hyakki_council.45.d:0 "Tsukumogami? Don't rush to feel sorry for them.\n\n They don't need anyone squatting by the garbage heap, putting on a pitying face for the weak. What they truly can't forget isn't the day they were abandoned, but something much earlier—when someone was willing to reach out and pick them up.\n\n Benben Tsukumo remembers the force of her fingers plucking the biwa strings. The banquet quieted down, the audience looked at the performer, a single instrument could make the whole room filled only with her own voice. She always loved to say that she was the strongest tsukumogami, at least that pride was much more useful than waiting for others to give her charity.\n\n Yatsuhashi Tsukumo remembers the warmth from under the koto strings. She was more willing to believe in tomorrow than Benben, and more easily roused by a single sentence of needing you. Don't mistake that for naivety. Only those who have truly been abandoned know how rare it is to be expected of again.\n\n Kogasa Tatara remembers the feeling of rain falling on the umbrella and the person gripping the handle beneath it. She now spends her days thinking about how to scare people, but always fails; yet when it comes to streets, houses, repairs, and forging, she knows more than many who only give orders.\n\n After all, an umbrella's original purpose has always been simply to shelter someone from the rain. Hata no Kokoro was born from sixty-six masks. Those masks once performed before people, bearing laughter, sorrow, anger, and hope. Now she can see emotions flowing among people, and she knows how empty a face becomes when it loses its proper emotions.\n\n As for Raiko Horikawa, she has long since learned not to tie her fate to the hands of her former master. Old forces fade, so she seeks new ones; the old stage rejects her, so she builds a new one. Other tsukumogami listen to her not because her drums are the loudest, but because she lets a group of old objects scattered in warehouses, workshops, and roadsides know they still exist.\n\n They cherish the days of being used, yet refuse to become tools for others to use again.\n\n This is not contradictory. Being needed once made them happy. What truly angers them is that the users never considered that what they held in their hands would remember, would feel pain, and even continue to live after being discarded.\n\n I understand this far better than those great figures."
 KYO_hyakki_council.45.a:0 "Things discarded also remember being cherished."


 KYO_hyakki_council.46.t:0 "The unnoticed bystander"
 KYO_hyakki_council.46.d:0 "Seija Kijin hid behind the rafters of an old warehouse and watched Yukari Yakumo enter the tsukumogami gathering place.\n\n Benben and Yatsuhashi sat to either side, while Raiko stood in the middle of a wooden platform heaped with old instruments. Kogasa leaned against a crate full of tools, and Hata no Kokoro had changed into a mask without a smile.\n\n “Let us make this clear at the outset.” Raiko tapped the rim of her drum. “Have you come here today in search of a convenient set of tools, or a group of people entitled to decide for themselves what they will do?”\n\n “Participants,” Yukari replied. “Tools do not set conditions. You do.”\n\n “And after the war? Once the roads are repaired and the equipment replaced, will anyone still remember us?”\n\n “Some will. Some will not.” Yukari offered no hollow promises. “That is why the workshops and communications network you establish will remain under tsukumogami control after the war. The Hundred Youkai Accord may request your assistance; it may not register you as somebody's property again.”\n\n That was where the negotiation began.\n\n Benben and Yatsuhashi would compose distinct musical signals. Evacuation, assembly, enemy attack, and the arrival of supplies could all be embedded in melody, carrying the message to tsukumogami scattered across the land. Kogasa would handle street-level contacts, equipment repair, and forging, while leading youkai familiar with human homes in inspecting shelters. Hata no Kokoro would watch the mood of each settlement, trace panic to its source before it spread, and use performances to help frightened crowds recover their composure.\n\n Raiko would bring together the old-object workshops, warehouses, and transport stations of every district. Abandoned vehicles could be stripped for parts, damaged equipment restored, and news from the villages carried swiftly by drumbeat and song. The network belonged to no government office, yet reached precisely those places that formal orders found hardest to touch.\n\n They added one final condition: every tsukumogami would retain the right to refuse a dangerous requisition. Whether to help was their own choice. Who had made them, or who had once possessed them, would never again be grounds to command their obedience.\n\n Yukari wrote the clause into the agreement.\n\n Seija had not made a sound. She had been ready to grin the moment Yukari looked up, proof that the earlier order to behave herself had not frightened her in the least.\n\n But the agreement was completed without Yukari looking toward the rafters even once.\n\n She was not deliberately ignoring Seija. This time, she truly had not noticed her there.\n\n Seija ought to have felt triumphant. Yet the corners of her mouth refused to rise.\n\n Below, Raiko struck the first communications beat. Benben and Yatsuhashi joined her, and one by one the objects sleeping on shelves and in abandoned homes answered the call. It was no longer the sound of things waiting to be picked up by a master, but of the discarded deciding for themselves what they would do for Gensokyo.\n\n Seija did not leap down to interrupt them.\n\n She merely sat in the unnoticed shadows and committed to memory every promise Yukari had made that day."
 KYO_hyakki_council.46.a:0 "This time, Yukari never saw her."

  KYO_hyakki_council.47.t:0 "Ancient Youkai in a Sea of Flowers"
 KYO_hyakki_council.47.d:0 "Yukari Yakumo entered the Garden of the Sun and saw no watchtowers, fences, or patrolling youkai.\n\n Minoriko Aki was inspecting the newly harvested grain at the edge of the field, while Shizuha Aki marked a path still passable in autumn along the treeline. Small youkai living nearby carried sacks of grain back and forth, their conversations always kept low. They weren't afraid of being discovered by the enemy, but rather didn't want to disturb the owner in the center of the flower field.\n\n Yuuka Kazami didn't need guards.\n\n Yukari hadn't even gotten close when she saw that familiar parasol. Yuuka stood among the sunflowers, patiently trimming a withered leaf. Her movements were light, even gentle, as if the war unfolding in the Outside World had nothing to do with her.\n\n Yukari knew what this tranquility meant.\n\n Yuuka is never in a hurry to prove her strength. She doesn't need an army to create momentum for her, nor does she vie for positions in meetings. Those who once mistook her smile for friendliness and her silence for concession usually don't have a second chance to make the same mistake.\n\n She may not harbor malice towards the weak, but she isn't particularly lenient because of their weakness. She admires those who dare to stand firm and enjoys the moment when those who bluff are forced to the point where they can no longer pretend. For Yuuka, strength is not something to adorn position, but proof that a being can live according to its own will. Now, this will guards the Garden of the Sun.\n\n The surrounding farmland is spared from plunder because of her presence, the weak Yuuka can establish settlements near the flower fields, and the Autumn Sisters can maintain their harvests and the changing of the seasons.\n\n Yuuka never proclaimed herself ruler, but all the youkai living here understood: as long as she stood in the center of the flower sea, no one could arbitrarily take anything away from this place.\n\n Yukari stepped onto the flower-lined path.\n\n Yuuka didn't turn back.\n\n “You bent three sunflowers.”\n\n “I avoided three hundred others,” Yukari replied.\n\n Yuuka then turned around. She wore her usual smile, slightly raising her parasol to remove the shadow that had fallen on Yukari.\n\n “So, Gensokyo's sage,” she asked, “what do you intend to offer me in return?”"
 KYO_hyakki_council.47.a:0 "The flower field needs no defensive line; Yuuka herself is the boundary."


 KYO_hyakki_council.48.t:0 "A long-lost old friend"
 KYO_hyakki_council.48.d:0 "Yukari Yakumo didn't immediately bring up the war.\n\n She and Yuuka Kazami walked slowly along the flower-lined path. Minoriko Aki brought over freshly harvested fruit, while Shizuha Aki placed a map of the surrounding roads and woodlands on the wooden table. Yuuka didn't look at the preparations, but simply poured tea for the two of them.\n\n “You want the Aki sisters to collect food for you, have the nearby Youkai transport supplies, and then have me fight for you.” Yuuka picked up her teacup.\n\n “A very convenient arrangement.”\n\n “I want you to assist Gensokyo.”\n\n “Sounds like just another way of saying it.”\n\n Yukari looked at the fields of sunflowers in the distance.\n\n “I have an old friend named Mima.”\n\n Yuuka slightly raised the edge of her umbrella.\n\n “The spirit who brought trouble all the way to the Mugenkan?” “It was her. If Mima hadn't invaded your territory back then, you might not have followed that commotion to Gensokyo.”\n\n That was a long time ago. Mima brought the chaos of Gensokyo to Yuuka's doorstep, and for the first time, Yuuka, who had previously had no interest in the Outside World, turned her gaze to this land surrounded by a barrier. Yuuka initially only wanted to find that audacious spirit, but later left behind her own flower field here.\n\n “Are you only introducing us now?” Yuuka asked.\n\n “She's been missing for a long time. Even I don't know where she went.” “Missing?” Yuuka chuckled.\n\n “That girl just went somewhere we're not going to cause trouble. She must be doing something right now. We'll probably know when we hear an explosion in the distance.” Yuuka didn't refute this.\n\n Based on what she knew of Mima, this was indeed the most reasonable guess. A moment later, Yuuka put down her teacup.\n\n “Mima led me here, but that doesn't mean I owe Gensokyo anything.”\n\n “Of course,” Yukari said, “but if the enemy steps in, they won't bypass this land just because the Garden of the Sun didn't attend the meeting. They'll burn farmland, seize food, and drive nearby youkai into the battlefield.” Yuuka's smile didn't fade, but the wind in the flower field suddenly stopped.\n\n Yukari explained the arrangements clearly.\n\n Minoriko Aki would be responsible for the harvest, food storage, and farmland management; Shizuha Aki would manage the forest line, seasonal roads, and evacuation routes for the surrounding settlements. The local youkai would maintain transportation and local security, free from arbitrary requisition by any single power.\n\n As for Yuuka, the Hundred Youkai Accord would not order her to obey any general. She only joins the battle based on her own judgment when the enemy threatens the survival of the flower field or Gensokyo.\n\n “You've learned not to order me around,” Yuuka said.\n\n “I've always known which orders are meaningless.”\n\n Yuuka stood up, her parasol twirling halfway over her shoulder.\n\n “Then tell your Hundred Youkai Army not to run too fast.”\n\n She looked beyond the flower field, her tone still gentle.\n\n “When the enemy reaches me, I hope someone will still be alive to see it all.”"
 KYO_hyakki_council.48.a:0 "On the front lines of Gensokyo, untimely flowers will bloom."

  KYO_hyakki_council.49.t:0 "The saint Yuuka had heard of."
 KYO_hyakki_council.49.d:0 "Yukari Yakumo knows most of the people worth knowing in Gensokyo.\n\n She knows which Youkai can be persuaded with benefits, which Gods need to be given sufficient respect, and who will hunt down a visitor for days for a single offense. However, she is not familiar with Byakuren Hijiri.\n\n What Yukari knows is a story that has been circulating among Youkai, humans, and monks for a long time.\n\n Byakuren was not born able to face death calmly. After her younger brother Myouren died, she also feared aging and the inevitable end of her life. She practiced sorcery to regain her youth, and in doing so, discovered that her power depended on the existence of Youkai.\n\n Her initial protection of Youkai was not entirely out of compassion.\n\n This point, ironically, made Yukari willing to believe the later story.\n\n Byakuren had rescued Youkai to protect herself, but after repeatedly encountering those lives that were hunted, banished, and filled with fear, she gradually stopped seeing them as a means to maintain her magic. She began to truly care about Youkai's fate and to believe that humans and Youkai could not coexist only by hunting each other.\n\n Humans eventually discovered her secret.\n\n A monk who openly sheltered Youkai was seen as more dangerous than Youkai in the eyes of humans. She was considered a traitor, sealed in Makai, and disappeared from history and the sight of the public. Years later, those who still remembered her were the Youkai who brought her back from the seal.\n\n Myouren Temple was built upon this experience.\n\n Yukari doesn't believe in flawless saints. Such stories are usually just later omitting parts that were inconvenient to record. Byakuren is different. She was once fearful, once selfish, and once relied on the tribe she later decided to protect. Her compassion wasn't innate purity, but the result of seeing herself clearly and still choosing to change direction.\n\n This makes Byakuren more believable, and also more difficult to control.\n\n She won't accept orders simply because a sage speaks, nor will she abandon her principles because war is imminent. The youkai she gathers each have flaws, and they don't even fully understand each other; yet she still lets these people stay in the same temple, eating, arguing, and practicing together, and then continuing their lives the next day.\n\n Gensokyo perhaps needs this very ability now.\n\n Yukari stopped before the stone steps of Myouren Temple. The sound of bells rang out from within the temple grounds, where a group of Youkai, whose names she had only read in reports, were waiting.\n\n The rumors were over.\n\n Next, she had to meet Byakuren Hijiri in person."
 KYO_hyakki_council.49.a:0 "Rumors cannot replace a meeting."


 KYO_hyakki_council.50.t:0 "Gensokyo Without Its Sage"
 KYO_hyakki_council.50.d:0 "Byakuren set tea before Yukari Yakumo and asked why she had waited until now to come in person. Yukari produced the draft of the Hundred Youkai Accord and replied that every faction needed time to consider it. Byakuren looked at the document. “If we still had that much time, you would have sent a shikigami.”\n\nYukari dispensed with the pleasantries. The threat from Japan was drawing closer. If the factions prepared separately, they would spend their food, roads, and forces competing with one another first. She needed Myouren Temple to assist with rescue and resettlement, and its members to accept common coordination.\n\nByakuren did not take the pen. First, she asked whom this war was meant to protect. Yukari answered Gensokyo, so Byakuren asked who counted as part of it. Setting down the draft, Yukari said that included the humans, youkai, and all other beings living here: those unable to fight, and those unwilling to declare their loyalty through hatred as well.\n\n“And whom do you intend to sacrifice?”\n\nThe teacup remained beside Yukari's hand. She admitted she could not promise there would be no casualties, but would not designate any group as expendable in advance. Byakuren demanded that civilian protection and care for the wounded be written into the common arrangements, lest supply allocation again become a matter of every faction caring only for its own.\n\nMyouren Temple would open its halls and nearby facilities to the injured and families without homes, help transport supplies, and escort evacuations. Aid would not depend on species, and the temple's members would not join reprisals against ordinary humans. If troops harassed the shelters under the pretext of pursuing an enemy, the temple would intervene and require the Accord to address it.\n\nYukari accepted these conditions, then asked whether Byakuren trusted her so much. Byakuren said that, for now, the factions were still willing to listen to Yukari Yakumo. Once even she could no longer bring them together, roads would be closed, grain withheld, and people turned away. The weakest would lose their homes before the enemy even arrived.\n\n“So we will help you keep everyone at the table.” Byakuren pushed the draft back. “And if you break today's promises, I will question you to your face.”\n\nYukari remarked that she seemed ready for an argument already. Byakuren replied that setting out the terms now would make it clear whom she ought to argue for later. They revised the draft clause by clause, leaving notes on matters that still needed agreement from the other factions, and only then ended their meeting.\n\nNazrin fetched the inventory ledger. Shou and Ichirin began checking which rooms could house refugees, while Murasa went out to inspect the transport routes. As Yukari reached the veranda, she heard Byakuren ask for rooms near the entrance to be cleared first for wounded people who struggled to walk. She put away the documents and left to visit the next person who had yet to agree to join."
 KYO_hyakki_council.50.a:0 "Compassion will not stand idly by as chaos engulfs all beings."

  KYO_hyakki_council.51.t:0 "The Conditions of Wind, Rain, and Earth"
 KYO_hyakki_council.51.d:0 "When Yukari Yakumo arrived at Moriya Shrine, Kanako Yasaka had already spread a map of Youkai Mountain across the entire table.\n\n Workshops, mountain roads, settlements, rivers, and ritual sites were all marked. It was less that she was waiting for negotiations, and more that she had already begun planning and mobilization.\n\n “Moriya Shrine can build roads, mobilize labor, and allow Kappa to switch its workshops to wartime production,” Kanako said bluntly. “But I want formal command authority and cannot accept repeated interference from meetings at the foot of the mountain in every project.”\n\n “You can direct the projects,” Yukari replied, “but you can't turn the entire Youkai Mountain into Moriya Shrine's private property.”\n\n Suwako Moriya, sitting on the veranda, swung her legs.\n\n “And the land,” she reminded her. “Kanako sees the roads and dams, but I see who lives beneath the roads. If you place the sacred pillars in the wrong places, the old gods of the mountain will turn against you before the enemy even arrives.”\n\n Kanako frowned but did not refute.\n\n The final arrangements were clear. Kanako oversaw roads, water conservancy, kappa workshops, and faith mobilization; Suwako was responsible for coordinating land, local gods, and mountain settlements. Moriya Shrine obtained a formal seat in the Hundred Youkai Accord, and all large-scale projects required the approval of both gods simultaneously. “Very good.”\n\n Kanako put away the map. “Since war will change Gensokyo, Moriya Shrine won't just stand by and watch.” Suwako jumped down from the corridor.\n\n “Let's make it clear first, whoever damages the mountain is responsible for repairing it.”\n\n Yukari looked down the stone steps. The first batch of kappa had already set off with surveying tools.\n\n The wind direction in the mountains began to change."
 KYO_hyakki_council.51.a:0 "The wind, rain, land, and pillars are all in place."





   KYO_hyakki_leadership.1.t:0 "Remilia chairs the Military Affairs Committee."
 KYO_hyakki_leadership.1.d:0 "A new round of elections concluded, and Remilia secured the position of Chairperson of the Military Affairs Committee. She casually stacked the proposals submitted by various parties, calmly glancing at each representative.\n\n “Military affairs are not a banquet for everyone to show off their power. There can be debate, there can be opposition; but once a decision is made, someone must ensure its implementation.”\n\n She lightly tapped the table, revealing an almost elegant smile.\n\n “Since you've handed the position to me, don't expect a chairperson who only presides over meetings. Scarlet Devil Mansion will obey my orders, and I will make the entire committee do the same.”"
 KYO_hyakki_leadership.1.a:0 "Let Red Moon oversee military affairs"

 KYO_hyakki_leadership.2.t:0 "Yuyuko Saigyouji chairs the Military Affairs Committee"
 KYO_hyakki_leadership.2.d:0 "Yuyuko Saigyouji was elected Chairperson of the Military Affairs Committee. She didn't rush to discuss victory or defeat, but first reviewed the records of supplies, personnel, and defenses in various locations.\n\n “Netherworld has seen too many deaths decided rashly. Courage is admirable, but it cannot excuse inadequate preparation.”\n\n Yuyuko closed the file, her smile gentle, but her tone brooking no dismissal.\n\n “Every order must answer three questions: what needs to be accomplished, who will be responsible, and how to bring back those still alive. If you can answer these, I will approve; if not, rewrite it.”"
 KYO_hyakki_leadership.2.a:0 "Hakugyokurou weighs every step"

 KYO_hyakki_leadership.3.t:0 "Suika Ibuki chairs the Military Affairs Committee"
 KYO_hyakki_leadership.3.d:0 "Suika Ibuki assumed the chair of the Military Affairs Committee, dispensed with the lengthy formalities, and placed a single sake cup before the assembled delegates.\n\n “A Night Parade isn't an army tied together with rope. If you truly want everyone to lend their strength, first let them understand why they came.”\n\n She raised the cup towards the representatives of every faction.\n\n “I will not ask you to forget old grudges, or demand that anyone bow to anyone else. When we must stand shoulder to shoulder, I will take the front. When it is over, if you still want to argue—or fight—I will be there for that too.”"
 KYO_hyakki_leadership.3.a:0 "Let a hundred youkai gather before the wine cups"

 KYO_hyakki_leadership.4.t:0 "Yuuka Kazami presides over the Military Affairs Committee"
 KYO_hyakki_leadership.4.d:0 "After Yuuka Kazami became chair of the Military Affairs Committee, she retained only the most necessary orders and the clearest division of responsibility. Every other empty phrase was swept aside with the tip of her parasol.\n\n “Those with the ability will complete their work. Those without it will say so promptly. Wasting another's time and then using difficulty as an excuse—that is true incompetence.”\n\n She smiled across the chamber.\n\n “I will protect what deserves protection, and personally remove every obstruction. When you make your choices, please do not overestimate the consequences you can bear.”"
 KYO_hyakki_leadership.4.a:0 "Let Yuuka Sweep Every Obstacle Aside"

 KYO_hyakki_leadership.11.t:0 "Byakuren Hijiri chairs the Faith Committee"
 KYO_hyakki_leadership.11.d:0 "Byakuren Hijiri was elected chair of the Faith Committee. She did not promise that every disagreement would vanish, nor did she describe compassion as tolerance without judgement.\n\n “We may follow different paths, and we may never come to love one another. But any faith that cares only for those who obey it is merely domination dressed in benevolence.”\n\n She joined her hands and regarded the chamber calmly.\n\n “Those who err must make amends, and those who harm others must be stopped. But so long as someone remains willing to stand again, this committee will not be the first to cast her aside.”"
 KYO_hyakki_leadership.11.a:0 "Let Compassion Become an Actionable Principle"

 KYO_hyakki_leadership.12.t:0 "Kanako Yasaka Chairs the Faith Committee"
 KYO_hyakki_leadership.12.d:0 "Kanako Yasaka took charge of the Faith Committee and immediately required every promise to be expressed as a definite commitment of labour, supplies, and construction.\n\n “If faith appears solemn only before an altar and becomes useless the moment it leaves the shrine, then it deserves no one's reverence.”\n\n She pressed a hand upon the open plans, making no attempt to conceal her ambition.\n\n “I do not ask the people to believe in gods first. Make the roads passable, let the water flow, and build things together that will endure. The results will answer on our behalf.”"
 KYO_hyakki_leadership.12.a:0 "Let divine virtue be tested by results"

 KYO_hyakki_leadership.13.t:0 "Satori Komeiji chairs the Faith Committee"
 KYO_hyakki_leadership.13.d:0 "Once Satori Komeiji became chair of the Faith Committee, thoughts wrapped in courtesy could no longer hide comfortably behind spoken words.\n\n “Some call prejudice tradition and ambition duty. Others use humility to disguise an unwillingness to accept responsibility.”\n\n Her Third Eye passed slowly across the delegates.\n\n “I do not require purity in your hearts. I ask only that your stated reasons match your true ones. You may hate me, but at this table no one will purchase consensus by deceiving herself.”"
 KYO_hyakki_leadership.13.a:0 "Let all thoughts be laid bare"

 KYO_hyakki_leadership.14.t:0 "Megumu Iizunamaru chairs the Faith Committee"
 KYO_hyakki_leadership.14.d:0 "Megumu Iizunamaru was elected chair of the Faith Committee. Her first act was to reorganise how each faction released information, insisting that fact, inference, and opinion could no longer be blended into a single claim.\n\n “The people need not share one doctrine. They should at least inhabit the same reality.”\n\n Aya Shameimaru asked with a smile whether newspapers must therefore become unbearably dull.\n\n “Make the headlines as earth-shattering as you please,” Megumu replied. “But if you expect others to act upon your words, you must answer for the consequences.”"
 KYO_hyakki_leadership.14.a:0 "Let the whole territory use the same information"

 KYO_hyakki_leadership.21.t:0 "Sekibanki chairs the People's Committee"
 KYO_hyakki_leadership.21.d:0 "Sekibanki assumed the chair of the People's Committee. She brought no government reports, but records of roads, settlements, and local needs completed by the residents themselves.\n\n “We do not ask those above to believe us, and an appointment on paper will not make us believe them.”\n\n She sent Wakasagihime to verify whether aid actually reached each district and Kagerou to deal with extortion and theft, while she investigated every neglected problem herself.\n\n “You wish to make decisions for the people? Very well. First enter their homes and listen to everything that cannot safely be written in a report.”"
 KYO_hyakki_leadership.21.a:0 "Let those who have walked the path preside over the affairs of the people"

 KYO_hyakki_leadership.22.t:0 "Eirin Yagokoro presides over the Committee of the People"
 KYO_hyakki_leadership.22.d:0 "After becoming chair of the People's Committee, Eirin Yagokoro immediately ordered a new accounting of the population, available supplies, and local needs. She would not accept volume, status, or friendship in place of evidence.\n\n “Numbers are not more important than lives. But if we refuse even to establish the numbers, those ignored in the end will still be the people least able to advocate for themselves.”\n\n She permitted every district to object, while requiring each objection to include verifiable facts.\n\n “I will make the judgement, and I will preserve the entire record. If the prescription is wrong, the responsibility is mine—not the form's.”"
 KYO_hyakki_leadership.22.a:0 "Let the numbers return to everyone"

 KYO_hyakki_leadership.23.t:0 "Raiko Horikawa chairs the People's Committee"
 KYO_hyakki_leadership.23.d:0 "Raiko Horikawa was elected chair of the People's Committee. Rather than build another hierarchy of orders from above, she connected tsukumogami, craftspeople, and local residents so they could hear and answer one another.\n\n “We waited far too long, always hoping some owner might remember us. But if everyone waits, the first voice to disappear will never be heard at all.”\n\n She raised a drumstick and struck one clear note.\n\n “This network does not belong to me. Whoever hears a need has the right to answer it; whoever passes along false information must also explain it in person.”"
 KYO_hyakki_leadership.23.a:0 "Let the drumbeats connect us"

 KYO_hyakki_leadership.24.t:0 "Eiki Shiki presides over the Committee of the People"
 KYO_hyakki_leadership.24.d:0 "When Eiki Shiki took charge of the People's Committee, she first required every resolution to record its reasoning, the person responsible, and results that could later be examined.\n\n “Hardship can explain a choice; it cannot make harm righteous by itself. Vulnerability can explain a person's circumstances; it cannot turn a deception into truth.”\n\n Her judgements showed no fixed preference for any side.\n\n “Rules do not exist merely to demand endurance from the powerless. They must first question the powerful: by what right do they take more, order others to bear the risk, and how are they prepared to answer for the consequences?”"
 KYO_hyakki_leadership.24.a:0 "Let power answer what it has done first"


 

 gensokyo_first_stage.44.t:0 "The new barrier that couldn't be completed in time"
gensokyo_first_stage.44.d:0 "After the meeting, Ran remained in the room.\n\n On the table were two completely different sets of drawings. One set belonged to the collapsing Great Hakurei Barrier, with dense lines and repair marks almost covering the original structure; the other set only had the most basic outline, which was the draft of the new barrier proposed by the three sages.\n\n The new barrier will not rely on a single node, nor will it concentrate all the load on the Hakurei Shrine. Mountains, temples, settlements, and Youkai forces in various places will all become fulcrums, and even if one of them is lost, the whole will not collapse immediately.\n\n It is more stable than the old barrier and more suitable for Gensokyo now.\n\n But it still only exists on paper.\n\n Ran calculated three times. Even if all forces stopped fighting and immediately handed over manpower and resources, establishing a new barrier would still take far longer than the current timeframe. The power of some Youkai forces had already begun to decline, and several nodes were shifting daily. No one could guarantee how much land would be incorporated into the new structure after the next measurement.\n\n “It's too late even at the fastest,” Ran said.\n\n Yukari stood by the window, gazing at the still peaceful Gensokyo in the distance.\n\n “I know.”\n\n “Then should we abandon the new barrier?”\n\n “No.” Yukari turned around, “We just need to let Gensokyo hold out until it's completed.”\n\n The solution was already laid out.\n\n Humanity in the Outside World is forgetting Youkai, and Japan is the nation closest to the gap and most capable of spreading this denial. As long as Japan continues to regard fantasy as superstition, the erosion brought by the gap will not stop.\n\n Then let Japan see it with its own eyes.\n\n Let the army see that Youkai can destroy positions, let the cities know that the Red Mist is not a legend, and let the government have to admit that there is a world beyond the barrier that cannot be ignored. Fear will give Youkai renewed power, and chaos will buy time for the construction of the new barrier.\n\n This is not a long-term solution. Fear will eventually become a habit, and force cannot maintain awe forever.\n\n But every extra day gained may preserve one more node; every extra month gained may allow the new barrier to be completed in more detail.\n\n Yukari closed the old barrier's blueprints and left the new draft in the center of the table.\n\n'Prepare to cross the gap. '\n\n The old barrier can no longer be saved.\n\n The current war is only to ensure Gensokyo lives to see the day the new barrier rises."
gensokyo_first_stage.44.a:0 "First, seize time from the Japanese"



 


