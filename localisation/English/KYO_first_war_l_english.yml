KYO_eiki_spend_influence_for_national_buff:0 "The pure glass reflects the entire realm"

KYO_remilia_spend_influence_for_national_buff_tt:0 "Remilia transforms the Military Affairs Committee into an extension of the will of Scarlet Devil Mansion. Sakuya organizes the orders, Meiling stabilizes the defenses, and all those who refuse to obey will be forced to understand the weight of the Crimson Order.\n\n Available only when Remilia is the host of this season's agenda and serves as the head of the Military Affairs Committee. Consumes §Y20§! Military Affairs Performance to gain a powerful 60-day exclusive bonus."

KYO_yuyuko_spend_influence_for_national_buff_tt:0 "Ghosts transport supplies along the roads of Netherworld, the dead fill the gaps at the rear, and Youmu ensures that every order is executed accurately. Hakugyokurou's advance is quiet, yet never stops.\n\n Available only when Yuyuko is the host of this season's agenda and serves as the head of the Military Affairs Committee. Consumes §Y20§! Military Affairs Performance to gain a powerful 60-day exclusive bonus."

KYO_suika_spend_influence_for_national_buff_tt:0 "Sake cups are passed along the mountain path and through Former Capital, and the scattered Oni, Youkai heroes, and local militias reunite. There are no orderly ranks, only a hundred youkai willing to advance side by side.\n\n Available only when Yuuka is the host of this season's agenda and serves as the Military Affairs Committee Chairperson. Consumes §Y20§! Military Affairs Performance Points to gain a powerful 60-day exclusive bonus."

KYO_yuuka_spend_influence_for_national_buff_tt:0 "The surrounding Youkai, workshops, and resources have turned to the front lines under Yuuka's authority. The blooming flower sea does not symbolize peace, but rather serves as a reminder to the enemy, naturally leading to their attack.\n\n Available only when Yuuka is the host of this season's agenda and serves as the Military Affairs Committee Chairperson. Consumes §Y20§! Military Affairs Performance Points to gain a powerful 60-day exclusive bonus."

KYO_byakuren_spend_influence_for_national_buff_tt:0 "Myouren Temple expands its rescue, shelter, and persuasive message throughout the entire territory. Byakuren will not allow compassion to be an excuse for shirking responsibility, nor will they allow any wounded to be easily abandoned. is only available when Byakuren is the host of this season's agenda and serves as the Faith Committee Chairperson. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_kanako_spend_influence_for_national_buff_tt:0 "With the pillars erected, festivals, engineering projects, kappa technology, and mountain devotees are all integrated into the same plan. Kanako will prove with visible results that faith can be a force supporting the entire realm. is only available when Kanako is the host of this season's agenda and serves as the Faith Committee Chairperson. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_satori_spend_influence_for_national_buff_tt:0 "Fear and division haven't disappeared, but under the third eye, no one can conceal their true intentions with feigned piety. All parties must acknowledge the problems and share the consequences.\n\n Available only when Satori is the host of this season's agenda and serves as the Chairman of the Faith Committee. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_megumu_spend_influence_for_national_buff_tt:0 "From the summit to the foot of Youkai Mountain, newspapers, orders, and supplies flow simultaneously along the tengu network. Megumu Iizunamaru not only spreads consensus but also determines which voices qualify for it.\n\n Available only when Megumu Iizunamaru is the host of this season's agenda and serves as the Chairman of the Faith Committee. Consumes §Y20§! Faith Fulfillment Points to gain a powerful 60-day exclusive bonus."

KYO_sekibanki_spend_influence_for_national_buff_tt:0 "Sekibanki stands at the forefront, forcing the committee to acknowledge the demands of the lower-class youkai; Kagerou protect the roads and strongholds, while Wakasagihime guards the wounded and the lone survivors. Meanwhile, a dyed-hair Amanojaku is weaving a deeper dark web of workshops, hideouts, and discontent.\n\n Available only when Sekibanki is the host of this season's agenda and serves as the chairperson of the People's Committee. Consumes §Y20§! People's Compliance Points to gain a powerful 60-day exclusive bonus."

KYO_eirin_spend_influence_for_national_buff_tt:0 "All healthcare, rations, labor, and transportation across the realm are incorporated into Eirin's calculations. This prescription is precise and effective, but few can refuse treatment after she completes her diagnosis.\n\n Available only when Eirin is the host of this season's agenda and serves as the chairperson of the People's Committee. Consume §Y20§! of the people's fulfillment points to gain a 60-day exclusive powerful bonus."

KYO_raiko_spend_influence_for_national_buff_tt:0 "The sound of drums echoed through roads, workshops, and settlements. Tsukumogami, refugees, and Youkai, considered useless, responded to the sound, proving with their existence that they still had the power to change the situation.\n\n Available only when Raiko is the host of this season's agenda and serves as the chairperson of the People's Committee. Consumes §Y20§! People's Compliance Points to gain a powerful 60-day exclusive bonus."

KYO_eiki_spend_influence_for_national_buff_tt:0 "Merits and demerits, responsibilities and concealments are all examined before a clear glass. Eiki cannot guarantee that all rulings will be satisfactory, but she will require each party to accept the same standards of right and wrong.\n\n Available only when Eiki is the host of this season's agenda and serves as the chairperson of the People's Committee. Consumes §Y20§! People's Compliance Points to gain a powerful 60-day exclusive bonus."

