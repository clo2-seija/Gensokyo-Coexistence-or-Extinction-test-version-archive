 # v1.0：十地点结界、每区六决议、十二名新候选人、季度人选与履行度衰退。§Y§!
 
 KYO_barrier_crisis_category:0 "Barrier Crisis"
 KYO_barrier_crisis_category_desc:0 "Yukari, the observation results for the ten key locations have been compiled.\n\n Each boundary node is divided into five stages according to the degree of deterioration, from zero to four. Green indicates that the structure is normal, yellow indicates that the boundary has begun to shift, and red indicates that the node is breaking apart. Checking the markings will confirm the current state of the area and the impact of the continued deterioration.\n\n The problems vary from place to place. Hakurei Shrine, Youkai Mountain, Bamboo Forest of the Lost, and the other nodes require different measures depending on the terrain, residents, and boundary structure. Once the locations are selected, the relevant treatment plans will be submitted together.\n\n Please do not only focus on the areas that have turned red. Yellow means that we still have time, but it also means that the next report may be too late."


KYO_hyakki_coalition_category:0 "Hundred Youkai Accord"
KYO_hyakki_coalition_category_desc:0 "Yukari, the Hundred Youkai Accord is currently chaired by three committees, one for military affairs, one for religious affairs, and one for the affairs of the people. All conflicting orders are ultimately decided by you.\n\n I have placed the three current committee chairs and your arbitration seat above, with twelve potential successors listed below according to their respective committees. Viewing individual portraits will reveal the plans that person can currently implement.\n\n The agreement is not stable. Every thirty days, one of the three committees will lose 10 points of performance due to delays, losses, or mutual obstruction; it is impossible to determine in advance which side will lose.\n\n Every ninety days, I will designate a candidate who has garnered attention this quarter, based on the situation. If this person becomes the chair of their respective committee by the end of the quarter, the manpower, prestige, and preparation previously focused on them will translate into additional results; if they fail to secure a seat, their opportunity for the quarter will be lost.\n\n All twelve of them were willing to maintain the agreement, but they had different understandings of the word “maintain”."


