KYO_hongmoguandexingdongfangan:0 "Scarlet Devil Mansion Operation Plan"
KYO_hongmoguandexingdongfangan_desc:0 "Hundred Youkai Accord can unify opinions from all sides, but it cannot conjure an army capable of breaking through enemy lines out of thin air.\n\n Yukari Yakumo therefore decides to go to Scarlet Devil Mansion. The mansion, shrouded in red mist and night for years, houses Gensokyo's most disciplined organization: Hong Meiling maintains a tight-knit defense, Sakuya Izayoi manages complex operations flawlessly, Patchouli wields powerful magic capable of altering the battlefield, and the familiars within are accustomed to obeying a single will.\n\n Most importantly, however, is Remilia Scarlet herself. Willful and arrogant, she makes no secret of her desire for dominance and victory. If she can be persuaded to look beyond the barrier, Scarlet Devil Mansion could become the sharpest spear of the Hundred Youkai Army.\n\n Yukari will personally enter Scarlet Devil Mansion to hear how the young Night King prepares for a true war."

KYO_yongyuantingdezhongliguancha:0 "Eientei's Medical Support"
KYO_yongyuantingdezhongliguancha_desc:0 "War doesn't just leave corpses on the front lines. Disease, fatigue, medicine shortages, and wounded soldiers unable to be evacuated in time are all enough to bring down an army.\n\n Yukari Yakumo will travel to Eientei, deep within the Bamboo Forest of the Lost. Far from the Outside World, it boasts Gensokyo's most complete medical system. The youkai rabbit is familiar with the hidden passages in the bamboo forest, Reisen can maintain order in medicine distribution and among the wounded amidst chaos, Kaguya Houraisan wields the authority to protect Eientei, and Eirin Yagokoro can organize medical care, medicine, and reserve manpower into a precisely functioning system.\n\n Eirin never saves people out of compassion. She calculates survival rates, recovery times, and resource consumption, and does not allow emotions to interfere with her judgment. This calmness may be unsettling, but it is precisely the ability the Hundred Youkai Army lacks most.\n\n Yukari must confirm how much medicine the Sage of the Moon is willing to provide for this war, and what conditions she is prepared to attach to her assistance."

KYO_renleicunluodezhihui:0 "The Will of Human Village"
KYO_renleicunluodezhihui_desc:0 "Youkai can muster an army at night, but they cannot ignore Gensokyo's largest human settlement.\n\n Yukari Yakumo decides to go to Human Village. There is no magic of Scarlet Devil Mansion there, nor workshops of Youkai Mountain; the residents are mostly farmers, craftsmen, merchants, and guards. They fear Youkai, depend on the order maintained by Youkai, and know better than anyone who will be the first to lose their homes if the barrier collapses.\n\n The temple houses maintain knowledge and local order, the merchant guild controls food, cloth, and transportation, and the village guards are familiar with every road leading to the outer settlements. If the people refuse to cooperate, the rear of Hundred Youkai Accord will be filled with suspicion and resistance; if they are willing to join the preparations, Gensokyo will gain a true hinterland capable of sustaining a long-term war.\n\n Yukari doesn't intend to issue orders only to humans. She must personally venture into the villages and hear what those about to be drawn into the Youkai War truly demand."

KYO_xixingsideyoulingguancha:0 "The Netherworld Passage to Hakugyokurou"
KYO_xixingsideyoulingguancha_desc:0 "The paths of the living may be destroyed, blocked, or severed, but the paths trodden by the dead follow a different set of rules.\n\n Yukari Yakumo will travel to Hakugyokurou in the Netherworld. The ghosts there don't need sleep, can traverse certain terrains and obstacles, and can transport supplies and the wounded at night when mortals cannot move. Youmu Konpaku is in charge of the defense and actual command of Hakugyokurou; given a clear task, she will complete it with an almost obsessive sense of responsibility.\n\n As for Yuyuko Saigyouji, she appeared calm, as if nothing in the world was worth panicking about; but she knew better than most how mass death would disrupt the order of the underworld. If war deprived the dead of their resting place, Hakugyokurou could not remain uninvolved forever.\n\n Yukari will cross the gates of the Netherworld, asking an old friend of many years to decide: this time, will the path of the dead be open for the living?"

KYO_tiangoudezhanluefenxi:0 "Tengu's strategic analysis"
KYO_tiangoudezhanluefenxi_desc:0 "Before the first army crosses the barrier, Hundred Youkai Accord must first know where the Japanese army is, how it is moving, and from which route it will reinforce.\n\n Yukari Yakumo will head to Youkai Mountain. Crow tengu can traverse vast swathes of land in a very short time, recording railways, military camps, ports, and air defense positions; White Wolf tengu excels at patrolling, tracking, and mountain warfare; and the organization controlled by the Great tengu can transform individual observations into a continuously updated battlefield panorama.\n\n But the tengu are never merely faithful recorders of the world. They choose what to report and what to conceal, determining to whom the intelligence will reach. Aya Shameimaru is particularly aware that words and images can alter the situation before the enemy opens fire; Megumu Iizunamaru is more concerned with what position Youkai Mountain can gain from this collaboration.\n\n Yukari needs the tengu's eyes, but she must also prevent those eyes from serving only Youkai Mountain. She will personally climb the mountain, demanding that the tengu draw an actual map of Outside World that can be used in warfare."

KYO_hetongyushantongdegong_Chengduice:0 "Kappa–Yamawaro Engineering Corps"
KYO_hetongyushantongdegong_Chengduice_desc:0 "An army cannot advance on youkai power alone. Roads must be repaired, weapons maintained, ammunition standardized, and supplies carried across the barrier in equipment built to withstand sustained use.\n\n Yukari Yakumo therefore heads for the workshops of Genbu Ravine and Youkai Mountain. The kappa excel in machinery, weaponry, communications, and hydraulic engineering; the yamawaro know timber, tunnels, transport, and mountain construction. They quarrel constantly over materials, patents, and profit, yet few communities in Gensokyo can turn a sketch into working machinery so quickly.\n\n Nitori Kawashiro knows how to dismantle Outside World technology, rebuild it, and adapt it for youkai use. Takane Yamashiro's connections reach deep into gathering grounds, work camps, and local markets. If the two sides can work together, the Hundred Youkai Army will gain practical support in arms, bridges, railways, and barrier equipment.\n\n Yukari will carry the wartime plans into their workshops. The next question is not what Gensokyo can manufacture, but how much it can finish before the war begins."

KYO_yaojingmendejuexin:0 "Fairy's Determination"
KYO_yaojingmendejuexin_desc:0 "Fairy lacks strict military discipline and rarely truly understands the complex calculations of strategic meetings. They are easily distracted, can change course because of a provocation, and may treat missions like games at the most inopportune times.\n\n Yukari Yakumo still decides to go to Misty Lake and the forest where the fairies gather. fairy are closely connected to nature, numerous, and even if defeated, can reappear where nature still exists. They are familiar with every woodland, lakeshore, and ruin, serving as scouts, messengers, disruptors, and local watchdogs. More importantly, they are witnessing firsthand how the barrier crisis is eroding their homeland.\n\n Cirno yearns to prove she's not just a troublemaker, while Daiyousei can guide the scattered fairies back on the right path. The other fairies may not be able to articulate the reason for Gensokyo's existence, but they know they don't want their familiar lakes, flowerbeds, and playgrounds to disappear from the world.\n\n Yukari isn't there to recruit a worthless wall of flesh. She wants to see just how much resolve these seemingly weak lives can muster to resist a world that is rejecting them."

KYO_dilingdiandehuiying:0 "The Response of the Disliked"
KYO_dilingdiandehuiying_desc:0 "The underground shelters many youkai rejected, feared, or forgotten by the surface world. They are accustomed to living in places without sunlight and have long since ceased to expect kindness from the surface world.\n\n Yukari Yakumo will travel to the Palace of the Earth Spirits deep within Former Hell. Satori Komeiji can read minds, discerning lies, panic, and deliberately concealed hostility; Rin Kaenbyou is familiar with the dead, underground tunnels, and disaster sites; and Utsuho Reiuji wields power sufficient to be one of the most dangerous weapons in war. The subterranean inhabitants can also utilize tunnels and the Former Hell network to provide covert transport lines that are difficult for surface powers to establish.\n\n However, the Palace of the Earth Spirits has no obligation to trust the Hundred Youkai Accord. Surface powers only remember them when they need power, and after a crisis, they may once again label them as ominous.\n\n Yukari must personally enter that silent palace and prove to a group of Youkai who have long seen through hypocrisy that this invitation is not a temporary ploy."

KYO_shifeiquzhitingdecaijue:0 "The Judgment of the Ministry of Right and Wrong"
KYO_shifeiquzhitingdecaijue_desc:0 "Wartime orders can demand obedience, but they cannot answer whether everything is just or not.\n\n Yukari Yakumo decides to go to the Ministry of Right and Wrong in Higan. Gensokyo is about to mobilize the army, requisition supplies, cross the barrier, and even bring the war into the Outside World. Every decision may save some people or push others to their deaths. Without recognized boundaries, the Hundred Youkai Accord will soon turn from a tool for survival into an excuse for arbitrarily exercising power.\n\n Eiki Shiki is not under the command of any Youkai faction, nor will she abandon her judgment of right and wrong due to the urgency of the situation. Her sermons are long and harsh, often making those who come for help regret stepping through the hall; but if she is willing to acknowledge that the actions of the Hundred Youkai Accord are still necessary, the troops and the residents can obtain a set of rules to abide by together.\n\n Yukari knew this visit wouldn't be easy. She still had to go to Higan and face Yama's potentially lengthy interrogation about the war."

KYO_caogenyaoguaideshengyin:0 "The Voice of Grassroots Youkai"
KYO_caogenyaoguaideshengyin_desc:0 "History always remembers the names of sages, great youkai, and those who command armies, but rarely the lesser youkai who carried loads, kept watch, led the way, and buried the dead.\n\n Yukari Yakumo decides to leave the main road, heading towards the lakeshore, the edge of the forest, and settlements overlooked on official maps. Sekibanki, Kagerou Imaizumi, and Wakasagihime do not represent a grand palace, nor do they possess the authority to command all of Gensokyo. They represent the most numerous, most vulnerable, and first to suffer crises among the lower youkai.\n\n Sekibanki doubts all promises from those in power; Kagerou only trusts actions that truly protect their companions; Wakasagihime demands that no arrangement should treat the weak as disposable. They quarrel among themselves, yet rely on acquaintances, hidden paths, and local mutual aid to maintain the unseen end of the Hundred Youkai Accord.\n\n If Yukari only seeks war from the strong, she will only receive a war belonging to the strong. She must go into places without meeting rooms and hear what nameless youkai are willing to give for Gensokyo, and what they refuse to endure anymore."

KYO_reiko_music_playing:0 "Tsukumogami's Cry"
KYO_reiko_music_playing_desc:0 "Tsukumogami knows best that the difference between being needed and being discarded is often just one instance of damage.\n\n Yukari Yakumo will travel to the gathering place of the Tsukumo Sisters and Raiko Horikawa. Musical instruments, tools, and old objects gain life from long use, and therefore understand human daily life better than most youkai. They can deliver messages between workshops, warehouses, houses, and roads, and can also repurpose broken equipment into usable items.\n\n Benben Tsukumo and Yatsuhashi Tsukumo can use their music to transmit signals, calm crowds, and allow scattered tsukumogami to respond to each other. Kogasa Tatara is familiar with the streets and daily life, while Hata no Kokoro can detect panic and wavering through emotional changes. Raiko herself can organize these neglected voices into a network independent of official government.\n\n They won't easily trust Hundred Youkai Accord. In the past, it was those in power who repeatedly used them, only to leave them in the shadows after they lost their value.\n\n Yukari must personally confront this resentment and ask the tsukumogami if they are willing to let their voices resonate throughout Gensokyo once again."

KYO_big_sis_yuuka_is_watching:0 "The Intimidating Power of the Flower Field Master"
KYO_big_sis_yuuka_is_watching_desc:0 "The Garden of the Sun has no military camps or formal organization, yet few Youkai dare to set foot there without permission.\n\n Yukari Yakumo will travel to that land covered in sunlight and seas of flowers. Minoriko Aki and Shizuha Aki can assist in adjusting harvests, preserving food, and maintaining seasonal order, while the Youkai living nearby are familiar with farmland, forest lines, and roads leading to the outskirts. As long as the flower fields cooperate, Hundred Youkai Accord can obtain vital food and local support.\n\n But these are not the true core of Yukari's journey.\n\n Yuuka Kazami is the undeniable master of that land. She is not enthusiastic about meetings, nor does she care how other factions allocate positions. She only respects those with sufficiently firm wills and those who will not back down under pressure. If she were to join the war, any frontal defense would have to reassess its capacity to withstand the onslaught.\n\n Yukari will walk among the blooming sunflowers. Yuuka will greet her with a smile, but whether that smile represents interest, a warning, or impending violence will only be known upon meeting her."

KYO_Kanako_god_of_war_and_wind:0 "The God of War of Wind and Rain"
KYO_Kanako_god_of_war_and_wind_desc:0 "Moriya Shrine never confines her faith solely to the altar.\n\n Yukari Yakumo will ascend Youkai Mountain to visit Kanako Yasaka. She understands how to attract followers with miracles and how to transform faith into roads, irrigation systems, workshops, and institutions capable of mobilizing people. Suwako Moriya maintains the old connections between the land and local gods.\n\n Moriya Shrine has close ties with the kappa workshops and possesses a network of faith covering the mountain settlements. If Kanako is willing to invest in preparations, Hundred Youkai Accord can quickly establish new roads, gather labor, and transform scattered sacrificial sites into nodes for resources and personnel.\n\n However, Kanako will not unconditionally obey Yukari Yakumo. She too is a god attempting to shape the future of Gensokyo and understands that crises will reshuffle existing power structures.\n\n Yukari will personally ascend the steps of Moriya Shrine. She needs the power of the God of War, while Kanako likely desires more than just a position to participate in the war."

KYO_hijri_byakuren_mercy_for_all:0 "Byakuren Hijiri's Mercy"
KYO_hijri_byakuren_mercy_for_all_desc:0 "Myouren Temple is not a force born for war.\n\n Yukari Yakumo still decides to personally visit the temple. It doesn't shelter a group of saints without flaws, but rather youkai, each carrying their own prejudices, resentments, loneliness, and old wounds. Nazrin is deeply wary, Minamitsu Murasa constantly teeters between freedom and loss of control, a self-conscious yet willing-to-bear figure, and Shou Toramaru believes in light and righteousness.\n\n This is why Myouren Temple understands better than many other places how to make incompatible people live together. The temple can shelter displaced people, organize rescues, stabilize panic, and allow those pushed to the brink of war to find their place again.\n\n Byakuren Hijiri will not accept any means in the name of victory just because Gensokyo needs it. She is willing to reach out to save people, but she will also demand that the Hundred Youkai Accord explain who this war intends to protect and who it plans to sacrifice.\n\n Yukari will enter Myouren Temple. She wanted to invite a monk who opposed hatred to provide strength for a war that was about to be sustained by fear and illusion."
