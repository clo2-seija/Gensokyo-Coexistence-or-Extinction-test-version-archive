KYO_executive_pair_cycle:0 "Hundred Youkai Accord Quarterly Agenda Negotiations"
KYO_executive_pair_cycle_desc:0 "At the end of every quarter, the twelve delegates of the Hundred Youkai Accord begin a new round of bargaining. After rounds of nomination, dealmaking, and compromise, two delegates step forward to set the agenda for the coming quarter.\n\n If either delegate also chairs their own committee, they may invoke the chair's authority: spend §Y20§! points of that committee's fulfillment to enact an exclusive program for §Y60 days§!."

KYO_remilia_spend_influence_for_fulfillment_tt:0 "Remilia mobilizes Scarlet Devil Mansion's supply ledgers, checkpoints, and retinues to directly push orders that the military affairs committee has been delaying to the front lines. consumes Remilia's influence (§Y15§!), increasing the Military Affairs Committee's performance by 20 (§G+ 20§!)."

KYO_yuyuko_spend_influence_for_fulfillment_tt:0 "Yuyuko rearranges Hakugyokurou's ghosts, the Netherworld passage, and the transport teams controlled by Youmu, allowing the backlog of military tasks to be completed silently. consumes Yuyuko's influence (§Y15§!), increasing the Military Affairs Committee's performance by 20 (§G+ 20§!)."

KYO_suika_spend_influence_for_fulfillment_tt:0 "Suika uses a banquet and old friendships to recall the scattered Oni and Youkai heroes. This group may not obey tedious rules, but they are willing to get things done for her. consumes Yuuka's §Y15§! influence, increasing the Military Affairs Committee's performance by §G+20§!."

KYO_yuuka_spend_influence_for_fulfillment_tt:0 "Yuuka personally intervened in the delayed military affairs. Faced with her calm gaze, the workshops, transport teams, and local armed forces quickly stopped offering excuses for delay. consumes Yuuka's §Y15§! influence, increasing the Military Affairs Committee's performance by §G+20§!."

KYO_byakuren_spend_influence_for_fulfillment_tt:0 "Byakuren demanded that the temple followers stop dwelling on scriptures and persuasion and actually send food, medicine, shelters, and believers to where aid is needed. consumes Byakuren's §Y15§! influence, increasing the Faith Committee's compliance by §G+20§!."

KYO_kanako_spend_influence_for_fulfillment_tt:0 "Kanako integrates Moriya Shrine's followers, kappa technology, and the mountain organization into a single project, transforming a vague faith commitment into a functional facility. consumes Kanako's §Y15§! influence, increasing the Faith Committee's compliance by §G+20§!."

KYO_satori_spend_influence_for_fulfillment_tt:0 "Satori exposes the committee members' hidden concerns, selfishness, and shirking of responsibility. When the true thoughts can no longer be concealed, all parties must confront the unfinished work once again. consumes §Y15§! influence, increasing the Faith Committee's compliance by §G+20§!."

KYO_megumu_spend_influence_for_fulfillment_tt:0 "Megumu Iizunamaru adjusts the tengu news network, the messenger system, and the mountain hierarchy, gradually transforming scattered narratives into a common stance and forcing all parties to act according to the same set of arrangements. consumes Megumu Iizunamaru's §Y15§! influence, increasing the Faith Committee's compliance by §G+20§!."

KYO_sekibanki_spend_influence_for_fulfillment_tt:0 "Sekibanki lays the records of grain arrears, workplace injuries, disappearances, and forced requisitions across the table one by one. Kagerou guards the roads outside the meeting hall, Wakasagihime speaks for victims too frightened to appear, and the streak-haired amanojaku in the shadows records every evasion.\n\n Spend §Y15§! Sekibanki influence to increase the All-People's Committee's fulfillment by §G+20§!."

KYO_eirin_spend_influence_for_fulfillment_tt:0 "Eirin views the Council of Peoples as a patient with a complex condition. She recalculates the allocation of food, medical care, and labor, prioritizing the removal of the links most likely to cause total disorder. consumes Eirin's §Y15§! influence, increasing the Council of Peoples' compliance by §G+20§!."

KYO_raiko_spend_influence_for_fulfillment_tt:0 "The Thunder Drum re-coordinates the actions of tsukumogami, refugees, and the homeless. She doesn't demand that everyone become the same, but only allows different voices to find a place to move forward together. consumes the Thunder Drum's §Y15§! influence, increasing the Council of Peoples' compliance by §G+20§!."

KYO_eiki_spend_influence_for_fulfillment_tt:0 "Eiki reviews each of the committee's unfulfilled promises, confirming who bears the responsibility, and forcing those who embezzled resources and evaded their obligations to return their unfulfilled shares. consumes Eiki's §Y15§! influence, increasing the People's Committee's fulfillment by §G+20§!."

