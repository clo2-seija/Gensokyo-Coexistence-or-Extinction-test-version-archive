 Renko_LUN_long_range_submarines_Renko_deep_water_supremacy_desc:0 "Deep Sea Supremacy"
 Renko_LUN_long_range_submarines:0 "Lunarian Oceanic Submarines"
 Renko_LUN_long_range_submarines_desc:0 "Terrestrial fleets can blockade ports, but struggle to see into the open ocean. Lunar submarines will watch distant routes and find opportunities for the main fleet to approach and strike.\n\nRange, concealment and stowage must support a prolonged expedition. Whenever the enemy puts to sea, it should be uncertain whether lunar weapons are already waiting below."
 Renko_LUN_long_range_submarines_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Oceanic Submarines§! doctrine."
 Renko_LUN_torpedo_primacy_Renko_modern_broadsides:0 "Modern Broadsides"
 Renko_LUN_torpedo_primacy_Renko_modern_broadsides_desc:0 "Modern Broadsides"
