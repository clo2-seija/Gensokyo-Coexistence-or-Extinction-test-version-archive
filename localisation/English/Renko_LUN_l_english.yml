 Renko_LUN_block_moon_rabbit_recruitment_tt:0 "The Lunar Capital will no longer be able to gain manpower through the \"Enlist the Moon Rabbits\" decision."
 Renko_LUN_moon_rabbit_recruitment_available_tt:0 "Moon rabbit recruitment has not been disrupted by $KYO_export_the_spark_not_the_throne$"

# 分节：Renko_LUN_mio_l_english
 Renko_LUN_lunarian_manufacturing_organization:0 "Lunarian Manufacturing"
 Renko_LUN_lunarian_manufacturing_organization_desc:0 "The Lunar Capital brings land, naval and air equipment under a unified manufacturing standard. From the invasion force's small arms to ocean-going warships and long-range aircraft, every product undergoes precision machining and purification inspections to supply reliable, efficient armaments for the forces under Lunarian command."
 Renko_LUN_lunarian_manufacturing_initial_trait:0 "Takamagahara Manufacturer"
 Renko_LUN_lunarian_craftsmanship_policy:0 "Lunarian Craftsmanship"
 Renko_LUN_lunarian_craftsmanship_policy_desc:0 "Lunarian precision engineering and material planning improve equipment reliability while reducing production resource requirements."

# 分节：Renko_LUN_occupation_laws_l_english
 Renko_LUN_lunar_administration_law:0 "Lunar Administration"
 Renko_LUN_lunar_administration_law_desc:0 "Place terrestrial society under lunar administration, rapidly establishing compliance and integrating local industry, resources, and manpower into a unified system."

# 分节：Renko_LUN_offsite_industry_l_english
 Renko_LUN_lunar_industrial_support:0 "Lunar Industrial Support"
 Renko_LUN_lunar_industrial_support_desc:0 "Mobilize lunar industry to provide sustained construction and armaments support for operations on Earth."
 Renko_LUN_lunar_sea_dockyard_support:0 "Lunar Sea Dockyard Support"
 Renko_LUN_lunar_sea_dockyard_support_desc:0 "Use a controlled port as a staging point to bring lunar dockyard capacity into service and support fleet construction."

# 分节：Renko_LUN_production_l_english
