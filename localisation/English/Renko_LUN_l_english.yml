 Renko_LUN_commandos_Renko_field_intel_retrieval_desc:0 "Field Intelligence Gathering"
 Renko_LUN_commandos_Renko_integrated_assaults:0 "Integrated Assaults"
 Renko_LUN_commandos_Renko_integrated_assaults_desc:0 "Integrated Assaults"
 Renko_LUN_commandos:0 "Lunarian Individual Excellence"
 Renko_LUN_commandos_desc:0 "Lunarians command; moon rabbits form the elite. The army sent to Earth must uphold lunar authority through rigorous training as well as superior weapons.\n\nEvery soldier must know her place in squad fire, casualty evacuation and battlefield reporting. Even when separated from the main force in forests or streets, those in white uniforms must continue to follow the same order."
 Renko_LUN_commandos_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Individual Excellence§! doctrine."
