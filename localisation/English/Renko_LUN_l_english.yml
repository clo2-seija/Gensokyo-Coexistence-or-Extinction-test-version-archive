 Renko_LUN_battleship_antiair_screen_Renko_capital_screens:0 "Capital Screens"
 Renko_LUN_battleship_antiair_screen_Renko_capital_screens_desc:0 "Capital Screens"
 Renko_LUN_battleship_antiair_screen:0 "Lunarian Capital Air Defense"
 Renko_LUN_battleship_antiair_screen_desc:0 "Terrestrial pilots will search for weaknesses around carriers and transports. Capital ships must guard the fleet with observation and anti-aircraft fire, preventing a sudden raid from severing the expedition route.\n\nShips cover one another and turn their batteries on command. The center of the fleet must remain ready to receive lunar aircraft when they return."
 Renko_LUN_battleship_antiair_screen_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Capital Air Defense§! doctrine."
 Renko_LUN_new_operational_integrity:0 "Lunarian Air Integration"
 Renko_LUN_new_operational_integrity_desc:0 "Lunar agents, relay stations and observation networks already operate on Earth. Once their reports reach command, aviation must turn coordinates on a map into an advantage in battle.\n\nFighters, escorts and bombers follow a common schedule so that each force entering the surface receives air support. Orders from the Moon must pass through the clouds and reach the enemy positions."
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_decoy_tactic:0 "Combat Air Patrol"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_decoy_tactic_desc:0 "Combat Air Patrol"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_three_plane_formation:0 "Moon-Rabbit Crossing Cover"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_three_plane_formation_desc:0 "Cover one another on crossing flight paths, drawing pursuers into a comrade's line of attack."
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_aggressive_spirit:0 "Naval Aces"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_aggressive_spirit_desc:0 "Naval Aces"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_naval_expertise:0 "Fighter Escort Target Spotting"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_naval_expertise_desc:0 "Fighter Escort Target Spotting"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_all_weather_operations:0 "All-Weather Operations"
 Renko_LUN_air_subdoctrine_fighter_central_field_Renko_all_weather_operations_desc:0 "All-Weather Operations"
 Renko_LUN_air_subdoctrine_fighter_central_field:0 "Lunarian Air Superiority Coordination"
 Renko_LUN_air_subdoctrine_fighter_central_field_desc:0 "The wavelength communications familiar to moon rabbits will connect air formations, helping scattered aircraft answer their comrades and the fleet. Pilots must know both the enemy position and the condition of friendly units.\n\nMaintain formation through crossing cover and gain the first sighting above cloud and sea. A lunar ace should bring the formation home, along with her victories."
 Renko_LUN_air_subdoctrine_fighter_central_field_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Air Superiority Coordination§! doctrine."
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_port_strikes:0 "Shallow-Running Torpedos"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_port_strikes_desc:0 "Shallow-Running Torpedos"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_low_level_attack_runs:0 "Wavetop Attack Runs"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_low_level_attack_runs_desc:0 "Wavetop Attack Runs"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols:0 "Extensive Patrolling"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_extended_sea_patrols_desc:0 "Extensive Patrolling"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training:0 "All-Weather Training"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_all_weather_training_desc:0 "All-Weather Training"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery:0 "Naval Strike Mastery"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_Renko_naval_strike_mastery_desc:0 "Naval Strike Mastery"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics:0 "Lunarian Aerial Torpedo Tactics"
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_desc:0 "Terrestrial fleets trust their harbors and the waves to shelter them. Lunar aviation will refine its approaches and identify openings both near shore and on the open sea.\n\nPatrols report targets, torpedo aircraft descend toward the water, and fighters cover the approach. Before releasing their weapons, every formation must know its course and its way home."
 Renko_LUN_air_subdoctrine_naval_torpedo_tactics_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Aerial Torpedo Tactics§! doctrine."
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes:0 "Widespread Drop Tanks Usage"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_efficient_fly_routes_desc:0 "Widespread Drop Tanks Usage"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover:0 "All-Around Formation Defense"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_mutual_air_cover_desc:0 "All-Around Formation Defense"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors:0 "Comprehensive Pilot Training"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_training_instructors_desc:0 "Comprehensive Pilot Training"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting:0 "Fighter Baiting"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_fighter_baiting_desc:0 "Fighter Baiting"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce:0 "Fuel-Saving Expertise"
 Renko_LUN_air_subdoctrine_long_range_escort_Renko_far_reaching_airforce_desc:0 "Fuel-Saving Expertise"
 Renko_LUN_air_subdoctrine_long_range_escort:0 "Lunarian Long-Range Escort"
 Renko_LUN_air_subdoctrine_long_range_escort_desc:0 "As surface bases expand, aircraft will leave familiar airfields and coasts behind. Escorts must carry protection all the way to the objective and bring their comrades back.\n\nRoutes, fuel and mutual cover belong in the same flight plan. Even far from the white lunar outposts, the expedition must not lose support on its return."
 Renko_LUN_air_subdoctrine_long_range_escort_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Long-Range Escort§! doctrine."
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_high_level_bombing:0 "Combat Box"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_high_level_bombing_desc:0 "Combat Box"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_experienced_gunners:0 "Collective Firepower"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_experienced_gunners_desc:0 "Collective Firepower"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_pilot_rescue_missions:0 "Dead Engine Prop Feathering"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_pilot_rescue_missions_desc:0 "Dead Engine Prop Feathering"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_extensive_training:0 "Veteran Crew Teamwork"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_extensive_training_desc:0 "Veteran Crew Teamwork"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_safety_landing_procedures:0 "Mass Production Reliability Improvements"
 Renko_LUN_air_subdoctrine_flying_fortresses_Renko_safety_landing_procedures_desc:0 "Mass Production Reliability Improvements"
 Renko_LUN_air_subdoctrine_flying_fortresses:0 "Lunarian Flying Fortresses"
 Renko_LUN_air_subdoctrine_flying_fortresses_desc:0 "Resistance on Earth still relies on factories, railways and fortified bases. Heavy aviation will strike these targets, reducing the reinforcements and supplies confronting the expedition.\n\nDistant sorties demand trained crews, disciplined defensive fire and reliable return procedures. For lunar orders to keep reaching their targets, the crews carrying them must be able to fly again."
 Renko_LUN_air_subdoctrine_flying_fortresses_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Flying Fortresses§! doctrine."
 Renko_LUN_lunar_host:0 "Lunar Host"
 Renko_LUN_lunar_host_desc:0 "White-clad advance troops have crossed the passages between Moon and Earth, and moon-rabbit wavelength signals now sound through terrestrial camps. The Watatsuki sisters will organize these scattered forces into an invasion army capable of carrying out the edicts of purification.\n\nInfantry cross forests and riverbanks, armor follows through the openings, and naval guns and aircraft provide support in turn. Lunar weapons and arts must answer one command until the white outposts form a front reaching into enemy territory."
 Renko_LUN_lunar_host_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunar Host§! doctrine."
 Renko_LUN_lunar_host_Renko_highland_armaments:0 "Lunar Armament Standards"
 Renko_LUN_lunar_host_Renko_highland_armaments_desc:0 "Weapons from the Moon must follow common maintenance and replacement procedures. Equip the advance troops familiar with mountain paths, and support each ascent with sufficient firepower."
 Renko_LUN_lunar_host_Renko_pathfinder_breakthrough:0 "White Uniforms through the Forest"
 Renko_LUN_lunar_host_Renko_pathfinder_breakthrough_desc:0 "When trees, streets and uneven ground obscure armored sightlines, invasion infantry lead the reconnaissance. Once their positions arrive by wavelength communication, medium tanks assault through the opening."
 Renko_LUN_lunar_host_Renko_joint_fire_coordination:0 "Encirclement by Edict"
 Renko_LUN_lunar_host_Renko_joint_fire_coordination_desc:0 "Coastal guns, fleets and air formations must answer the same command. Advance troops mark targets, armor holds the breach, and following forces arrive on the timetable set by high command."
 Renko_LUN_lunar_host_Renko_assault_cohesion:0 "Invasion Battle Order"
 Renko_LUN_lunar_host_Renko_assault_cohesion_desc:0 "Moon-rabbit squads tighten their assault formations, maintaining fire and contact along narrow approaches. The next wave follows the first across the shore, with armor close behind to keep the route open."
 Renko_LUN_lunar_host_Renko_special_warfare_integration:0 "The Might of the Lunar Capital"
 Renko_LUN_lunar_host_Renko_special_warfare_integration_desc:0 "They left the Moon as separate formations. They advance on terrestrial positions under the shared command of the Watatsuki sisters. Infantry and armor train together until the whole invasion force can move at the same pace."
 Renko_LUN_adopt_designated_doctrines:0 "Establish Lunar Service Doctrines"
 Renko_LUN_adopt_designated_doctrines_desc:0 "The white outposts on Earth are establishing contact, while scattered advance troops await orders from the Moon. The Lunar War High Command will issue common campaign regulations, coordinating the army, navy, air force and invasion special forces.\n\nUpon receiving the edict, each formation must complete its training and joint exercises. When the banners rise, the forces long prepared on Earth will enter the war together."
 Renko_LUN_adopt_designated_doctrines_tt:0 "Select §YLunarian Meticulous Preparation§!, §YLunarian Naval Air Supremacy§! and §YLunarian Air Integration§!, with all §Y12§! exclusive service subdoctrines.\nSelect §YElite Special Forces§! and place §YLunar Host§! in the first special forces track.\nGrant §G1000§! mastery to each of these §Y13 subdoctrines§!, enough to complete every reward."

