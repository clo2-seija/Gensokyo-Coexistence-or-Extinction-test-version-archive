 Renko_LUN_automated_infrastructure:0 "Lunar Automated Infrastructure"
 Renko_LUN_automated_infrastructure_desc:0 "Deploy lunar automated construction systems to expand roads and transport networks throughout all controlled states."
 Renko_LUN_automated_infrastructure_tt:0 "Immediately raise infrastructure below the maximum to §Ylevel 5§! in all controlled states, including occupied states."

