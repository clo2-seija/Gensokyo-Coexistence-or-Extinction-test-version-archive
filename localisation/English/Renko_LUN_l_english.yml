 Renko_LUN_mobilize_lunar_army_tt:0 "Also receive 10000 trucks, 1000 trains, and 2000 convoys.\nCommission all 9 basic army and air designs before creating templates and units.\nReceive the Renko Lunar Infantry Division, Renko Lunar Armored Division, and Renko Lunar Cavalry Garrison templates and their prerequisite technologies and projects.\nCreate 80 infantry divisions and 20 armored divisions in the capital, then receive 3 land and air reinforcement packages, each containing 4 infantry divisions, 4 armored divisions, and equipment stockpiles. Total: 92 infantry divisions and 32 armored divisions, with initial equipment set to 100%. Aircraft are granted only for commissioned types."
