 Renko_LUN_massed_carrier_fleet:0 "Lunarian Carrier Concentration"
 Renko_LUN_massed_carrier_fleet_desc:0 "One air raid will not open the expedition routes. Carrier squadrons must strike in succession, pursuing enemy ships as they regroup, replenish and retreat.\n\nDeck maintenance, crew rotations and escort movements must prepare the next launch. These floating bases will carry the lunar offensive to more distant shores."
 Renko_LUN_massed_carrier_fleet_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Carrier Concentration§! doctrine."
