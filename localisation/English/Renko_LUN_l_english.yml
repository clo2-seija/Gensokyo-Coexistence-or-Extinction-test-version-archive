 Renko_LUN_invasion_infantry:0 "Lunar Invasion Infantry Battalion"
 Renko_LUN_invasion_infantry_desc:0 "An elite lunar battalion enhanced by technology and magic. Counts toward the special forces cap."
 Renko_LUN_invasion_medium_armor:0 "Lunar Invasion Medium Tank Battalion"
 Renko_LUN_invasion_medium_armor_desc:0 "An elite lunar battalion enhanced by technology and magic. Counts toward the special forces cap."
 Renko_LUN_invasion_medium_tankdestroyer:0 "Lunar Invasion Medium Tank Destroyer Battalion"
 Renko_LUN_invasion_medium_tankdestroyer_desc:0 "An elite lunar battalion enhanced by technology and magic. Counts toward the special forces cap."
 Renko_LUN_invasion_medium_anti_air_support:0 "Lunar Invasion Medium SPAA Regimental Support Company"
 Renko_LUN_invasion_medium_anti_air_support_desc:0 "A regimental support company enhanced by lunar technology and magic. Does not count toward the special forces cap."
 Renko_LUN_invasion_heavy_tankdestroyer_support:0 "Lunar Invasion Heavy Tank Destroyer Regimental Support Company"
 Renko_LUN_invasion_heavy_tankdestroyer_support_desc:0 "A regimental support company enhanced by lunar technology and magic. Does not count toward the special forces cap."
 Renko_LUN_invasion_units_tech:0 "Lunar Invasion Formations"
 Renko_LUN_invasion_units_tech_desc:0 "Unlocks three lunar special forces battalions and two regimental support companies."

# 分节：Renko_LUN_lunar_sea_fleet_l_english
 Renko_LUN_form_lunar_sea_fleet:0 "Form the Lunar Sea Fleet"
 Renko_LUN_form_lunar_sea_fleet_desc:0 "With a naval base under lunar control, the Lunar War High Command will assemble its expeditionary fleet in a single mobilization. Capital ships will cover one another while carrier aircraft secure the skies above the sea."
 Renko_LUN_form_lunar_sea_fleet_tt:0 "Receive §Y3 naval reinforcement packages§! once. With all required designs commissioned, this grants §Y120 ships§!: 12 escort carriers, 18 heavy cruisers, 12 fleet carriers, 48 battleships (including super-heavy battleships), and 30 submarines (including submarine carriers), enough for §Y3 optimal sea-control fleets and 3 optimal submarine task forces§!. Uncommissioned ship types are skipped; aviation ships also require commissioned carrier fighter and naval bomber designs. Ships enter reserve fleets for subsequent organization.\nCarrier fighters and naval bombers are also added to stockpiles, totaling twice the ships' base deck capacity. Air wings are not created or automatically embarked."
 Renko_LUN_lunar_sea_fleet_idea:0 "Lunar Sea Fleet"
 Renko_LUN_lunar_sea_fleet_idea_desc:0 "Capital ships cover one another as carrier aviation secures the skies. Patrols, strikes, and expeditions answer to a single command, carrying the authority of the Lunar Capital to every distant shore.\n\nThis spirit grants 60% screening without screens. When the Carrier Independence reward from Lunar Carrier Concentration is also active, the modifier totals 90%."

# 分节：Renko_LUN_lunar_war_high_command_l_english
 Renko_LUN_lunar_war_high_command_category:0 "Lunar War Supreme Command"
 Renko_LUN_lunar_war_high_command_category_desc:0 "The supreme command of the Lunar Capital's surface expedition, responsible for war preparations, logistics, and future operations."
 Renko_LUN_mount_connects_sea_and_mountain_supply:0 "Connect Sea and Mountain"
 Renko_LUN_mount_connects_sea_and_mountain_supply_desc:0 "Watatsuki no Toyohime can connect the Lunar Sea to the mountains of Earth. The Lunar War Supreme Command will use this power to establish a supply system unbound by earthly distance."
 Renko_LUN_mount_connects_sea_and_mountain_supply_tt:0 "Grants the §YLunar Capital§! §Y+9999% Supply Node Range§! and adds §Y50 Local Supplies§! to §Yevery state in the world§!. State supplies are used by the current controller and can benefit both allies and enemies."
 Renko_LUN_connects_sea_and_mountain_state_modifier:0 "The Ability to Connect Sea and Mountain"
 Renko_LUN_connects_sea_and_mountain_state_modifier_desc:0 "Watatsuki no Toyohime connects the Lunar Sea to the mountains of Earth, ensuring that distance across the world no longer obstructs military supply."

