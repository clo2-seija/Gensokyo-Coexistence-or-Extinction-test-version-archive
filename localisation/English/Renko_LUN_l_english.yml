 Renko_LUN_infiltration_tactics_Renko_terrain_and_situation_assessment_desc:0 "Terrain and Situation Assessment"
 Renko_LUN_infiltration_tactics_Renko_infiltration_in_depth:0 "Infiltration in Depth"
 Renko_LUN_infiltration_tactics_Renko_infiltration_in_depth_desc:0 "Infiltration in Depth"
 Renko_LUN_infiltration_tactics:0 "Lunarian Deep Infiltration"
 Renko_LUN_infiltration_tactics_desc:0 "Lunar agents entered the centers of terrestrial power before their hosts understood the danger. Battlefield infiltration demands the same patience: identify sentries, remain concealed and wait for the coordinated advance.\n\nApproach under darkness, coordinate assaults by wavelength communication and penetrate before the enemy can regroup. When the frontal bombardment begins, invasion troops should already be beyond the line."
 Renko_LUN_infiltration_tactics_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Deep Infiltration§! doctrine."
 Renko_LUN_new_base_strike:0 "Lunarian Naval Air Supremacy"
 Renko_LUN_new_base_strike_desc:0 "The oceans of Earth divide its nations and carry their armies and supplies. To enforce lunar edicts across the surface, the expedition must first command these routes.\n\nCarrier aircraft strike from the sea, submarines watch the oceans, and surface forces escort the following troops. Enemy ports, fleets and coastal positions will face a single, ordered campaign."
 Renko_LUN_long_range_submarines_Renko_ocean_patrols:0 "Marathon Patrols"
 Renko_LUN_long_range_submarines_Renko_ocean_patrols_desc:0 "Marathon Patrols"
 Renko_LUN_long_range_submarines_Renko_improved_dive_protocols:0 "Crash Dive Drills"
 Renko_LUN_long_range_submarines_Renko_improved_dive_protocols_desc:0 "Crash Dive Drills"
 Renko_LUN_long_range_submarines_Renko_support_the_surface:0 "Battlefleet Support Tactics"
 Renko_LUN_long_range_submarines_Renko_support_the_surface_desc:0 "Battlefleet Support Tactics"
