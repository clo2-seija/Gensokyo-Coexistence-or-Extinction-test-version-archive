 Renko_LUN_streamlined_deployment_Renko_economized_forward_deployment_desc:0 "Economized Forward Deployment"
 Renko_LUN_streamlined_deployment:0 "Lunarian Streamlined Armor"
 Renko_LUN_streamlined_deployment_desc:0 "Armored vehicles clad in purification materials have reached Earth, but even advanced weapons need maintenance, ammunition and suitable formations. The Lunar War High Command will standardize armored equipment and replacement procedures.\n\nMedium tanks concentrate on breakthroughs, tank destroyers maintain anti-armor fire, and accompanying support serves its assigned role. The expedition can keep its schedule only while equipment and replacements continue to arrive."
 Renko_LUN_streamlined_deployment_add_mastery_bonus_effect_tooltip:0 "Gain a mastery growth bonus for §YLunarian Streamlined Armor§! doctrine."
