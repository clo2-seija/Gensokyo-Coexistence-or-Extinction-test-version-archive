 Renko_LUN_elite_soldier_training_tt:0 "Permanently gain:\nSpecial Forces Capacity: §G+1000%§!\nSpecial Forces Cap: §G+1000§!"
 Renko_LUN_elite_soldier_training_hidden_idea:0 "Lunar Elite Training System"
 Renko_LUN_elite_soldier_training_hidden_idea_desc:0 "A unified lunar training system supports the continued expansion of elite forces."

