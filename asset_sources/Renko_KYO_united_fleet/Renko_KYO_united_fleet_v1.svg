<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">幻想乡联合舰队</title>
  <desc id="desc">红白阴阳玉置于金色舰锚中央，下方配以深蓝海浪。透明背景的国家精神图标设计稿。</desc>
  <!-- 舰锚：深色轮廓保证在浅色、深色界面中均可辨认。 -->
  <circle cx="128" cy="25" r="12" fill="none" stroke="#172b3a" stroke-width="12"/>
  <circle cx="128" cy="25" r="12" fill="none" stroke="#d8b56b" stroke-width="6"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 40V216 M77 176H179 M58 178C62 207 91 222 128 216C165 222 194 207 198 178" stroke="#172b3a" stroke-width="22"/>
    <path d="M128 40V216 M77 176H179 M58 178C62 207 91 222 128 216C165 222 194 207 198 178" stroke="#d8b56b" stroke-width="12"/>
  </g>
  <path d="M43 184L57 162L75 185L59 179Z M181 185L199 162L213 184L197 179Z" fill="#d8b56b" stroke="#172b3a" stroke-width="5" stroke-linejoin="round"/>
  <!-- 红白阴阳玉：两半等面积，两枚玉眼采用反色。 -->
  <circle cx="128" cy="108" r="66" fill="#d8b56b" stroke="#172b3a" stroke-width="6"/>
  <circle cx="128" cy="108" r="58" fill="#c7393d"/>
  <path d="M128 50A58 58 0 0 1 128 166A29 29 0 0 1 128 108A29 29 0 0 0 128 50Z" fill="#fff6e7"/>
  <circle cx="128" cy="79" r="10" fill="#fff6e7"/>
  <circle cx="128" cy="137" r="10" fill="#c7393d"/>
  <!-- 波纹保持简短，避免缩小后抢占阴阳玉的视觉重心。 -->
  <path d="M49 236Q68 224 88 236T128 236T168 236T207 236" fill="none" stroke="#172b3a" stroke-width="7" stroke-linecap="round"/>
</svg>
