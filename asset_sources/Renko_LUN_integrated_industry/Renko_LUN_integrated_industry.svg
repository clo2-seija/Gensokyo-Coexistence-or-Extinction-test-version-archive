<path d="M314 147 L318 171 L347 191 Q324 194 314 188 Q302 194 280 191 L308 171Z" fill="url(#silver)" stroke="#1a2937" stroke-width="5"/>
<path d="M273 230 L314 203 L355 230 L341 236 L285 236Z" fill="url(#bronze)" stroke="#172330" stroke-width="5"/>
